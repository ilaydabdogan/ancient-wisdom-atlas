canonical_text:
  quote: ''
  summary: Wamanik questions his wife about whether another man wants her and her
    sister. Kekina warns Ndukis, who appears angry and frightens others. Wiskak, the
    mother of the women, rejects Wamanik, turns herself into a bird, tries to make
    her daughters join her, and finally transforms her daughters into snakes and declares
    Wamanik will also remain a snake. Wiskak travels east to low cedar trees, where
    she makes her home and is still said to speak like a person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wamanik asks whether anyone is in love with the elder sister and her sister,
    accuses her of not telling the truth, and says he will not keep her if somebody
    else wants her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Wiskak returns from gathering red bark and finds her younger daughter
    crying after Wamanik's words are reported.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kekina tells Ndukis that Wamanik is saying bad things about him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ndukis listens, goes early before others are awake, and sits on a rock from
    which he can see Wiskak's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ygiak sees Ndukis, becomes frightened, drops his sticks, and runs home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A report reaches Lok's house that Ndukis is angry at Wamanik and that there
    will be a great fight; Lok answers that the two will scare each other but will
    not fight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wiskak tells her daughters she is leaving, says she dislikes their husband,
    and says they should have chosen Ndukis because he is their kind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: While speaking, Wiskak turns into a bird and flies toward the mountains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After becoming a bird, Wiskak returns daily to talk to her daughters and wants
    them to become birds and go with her to the mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Wiskak says Ndukis does not turn into a snake whenever he leaves the house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The elder daughter cries, does not eat, and says she does not want to go to
    the mountains, stay with Wamanik, or marry Ndukis.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Wiskak threatens to turn her daughters into snakes and describes that people
    will throw dirt in their faces and that they will deceive and bite people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Wiskak turns her daughters into snakes, flies east, and calls out that Wamanik
    will never be a man again but will be a snake with a body like his panther-skin
    blanket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Wiskak continues east to a place with low cedar trees, makes her home there,
    is said still to talk like a person, and the place is full of her kin.
  category: setting
  evidence_refs:
  - ev:6
