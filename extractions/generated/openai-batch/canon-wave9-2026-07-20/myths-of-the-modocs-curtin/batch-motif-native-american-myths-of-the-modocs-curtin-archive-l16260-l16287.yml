canonical_text:
  quote: ''
  summary: Gak sits on a rock disguised as Ndukis. Kumal, described as wise and wearing
    a blanket of five kinds of stone, recognizes Gak by his large mouth and identifies
    him as the killer of Pakol. Gak resumes his own form, fights the crowd, kills
    Kumal, dismembers him, throws the pieces into water, declares he will become a
    fisher living in the water, turns other bodies into rocks, and goes to the mountains.
    Wus eats bodies and follows Gak after they turn to stone.
  language: English
  quote_policy: summarized
