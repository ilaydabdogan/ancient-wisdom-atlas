canonical_text:
  quote: ''
  summary: Wewenkee speaks to Keis and Snoutiss after Keis's sicknesses have been
    removed and tied in a bundle. Wewenkee warns Snoutiss that the Gletcowas brothers
    can take many forms and may kill Keis. Keis is told not to open the bundle, but
    later sends Snoutiss for water and is seen untying it by the fire. Snoutiss reports
    this, Wewenkee tries to press the world around Keis, and Keis retreats among rocks.
    Keis sings and smokes tobacco, attracting the Gletcowas brothers. Wewenkee then
    rubs himself in dirt, withdraws the help he had promised Keis, and says that Snoutiss
    will hereafter be a little snake.
  language: English
  quote_policy: summarized
