canonical_text:
  quote: ''
  summary: The passage introduces Kowam, Gahga, and Lok. Kowam lives with his little
    brother Gahga on the south side of Klamath Lake and tells his wife to send Gahga
    if anyone bothers her while he fishes. While Kowam is away and the mother-in-law
    is gathering wood, five Lok brothers arrive after a warning about big-footed people.
    One Lok places his head on Kowam's wife's lap and claims her as his wife. Gahga
    cries, is sent to alert Kowam, and reports the presence of the five big-footed
    people from the north side of the lake.
  language: English
