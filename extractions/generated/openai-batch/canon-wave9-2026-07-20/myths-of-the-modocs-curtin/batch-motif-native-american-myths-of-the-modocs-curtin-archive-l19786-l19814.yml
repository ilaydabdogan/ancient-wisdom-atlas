  quote: ''
  summary: 'The excerpt contains notes on two mythic items: an editorial moral for
    “War Between Beasts and Birds,” in which Bat is left friendless after seeking
    the winning side, and notes on Lok Snewedjas, a cloud, snowstorm, and whirlwind
    whose parents are mountain and earth, who protects her child with destructive
    whirlwind force, owns an inexhaustible seed, and is linked by the note to medicine
    men recalling a dead spirit before it reaches the place where the sun goes down.'
