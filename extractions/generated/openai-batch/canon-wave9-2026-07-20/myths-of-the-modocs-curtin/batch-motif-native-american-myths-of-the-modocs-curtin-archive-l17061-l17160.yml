canonical_text:
  quote: ''
  summary: Pitoiois and the Wulkutska brothers leave the old man and travel over mountains
    to a river. While Pitoiois catches fish, the old man throws his mortar at her,
    but she dodges. A brother later throws the mortar into the river; the old man
    is struck with the pounder and killed. Pitoiois, moved by Tskel's grief, restores
    the old man to life through water, a braided-grass plate, stepping over him, and
    Tskel's medicine stick. The old man's mind becomes good, and Pitoiois later bears
    a son. The group discusses seeking a wife who lives under water, and the brother-in-law
    begins a journey southwest with Pitoiois' brothers.
  language: English
  quote_policy: summarized
