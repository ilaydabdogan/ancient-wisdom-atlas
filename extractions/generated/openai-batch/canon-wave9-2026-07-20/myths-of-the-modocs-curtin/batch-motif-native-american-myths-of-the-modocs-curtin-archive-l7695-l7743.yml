canonical_text:
  quote: ''
  summary: 'The passage opens a Yahyahaas narrative with a character list, then describes
    a southeastern village whose people leave to gather ripe seeds. Four persons remain:
    a sick chief''s wife, her little girl, her baby, and an old woman. The mother
    warns the girl about Yahyahaas, a feared one-legged, tall, naked being from northern
    rocks and mountains. When Yahyahaas approaches, the mother sends the girl to carry
    the baby to the men and ask for rescue. The girl puts the baby in a water basket,
    claims she is going for water, goes to the creek, and runs away slowly because
    the baby is heavy.'
  language: English
  quote_policy: summarized
