canonical_text:
  quote: ''
  summary: During winter starvation at Euks, Tsakiak shelters and feeds people as
    far as he can. Moasam Beps, South Wind's Daughter, brings minnows, then causes
    snow to melt and pine nuts to appear under blankets placed beneath nut pine trees.
    The people recover, give gifts, and depart. Moasam Beps becomes Tsakiak's wife
    and takes him to her father's home, where she gives him moccasins that he must
    not remove. After hunting deer for several days, Tsakiak removes and throws away
    the moccasins on a mountain; storm, cold, and snow overwhelm him, and he dies.
  language: English
  quote_policy: summarized
