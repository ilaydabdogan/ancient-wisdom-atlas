canonical_text:
  quote: ''
  summary: The passage introduces Isis, an extraordinarily successful hunter living
    on Teutgosi, and Yaulilik Snowbird, an impoverished mother who sends her two daughters
    north to seek Isis as a hunter-husband/provider. She warns them that Kumush may
    pretend to be Isis and gives signs by which to recognize Isis. The sisters travel,
    hear flute music at Isis's house, disagree about whether the man inside is Isis,
    and the younger sister judges by the dry meat and inadequate music that he is
    not. Meanwhile Isis, away hunting, receives a sign when his bowstring breaks and
    returns singing toward a mountain place where the sky comes to the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isis built a house on Teutgosi and lived there for many years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On hunting days Isis killed three or four deer, carried them home on his belt,
    cut up the meat, and dried it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Isis had an extremely large supply of deer meat, described as more than enough
    for all the people in the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: While hunting, Isis sang; his song was heard everywhere in the world and was
    described as beautiful enough to make a listener fall asleep.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Old Yaulilik lived on one side of Isis's mountain with her two daughters and
    her son, and she begged meat because she was poor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yaulilik told her daughters that they should find a good hunter as a husband
    and said that such a hunter lived north on the mountain, one night's camp away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Yaulilik said Isis was the son of Kumush and was the greatest hunter, ball
    player, and runner in the world, able to run down deer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Yaulilik warned that Kumush sometimes pretends to be Isis by wearing Isis's
    clothes and trying to sing his song, and she said fresh deer meat on trees near
    the house would show that Isis was home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Yaulilik filled two baskets with roots and seeds and gave one basket to each
    daughter.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The sisters traveled until sunset, camped, started early the next morning,
    and reached a large village where Blaiwas was chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Isis's house the sisters put their baskets outside the door and heard somebody
    inside playing a flute.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The elder sister said Isis was at home, but the younger sister denied this,
