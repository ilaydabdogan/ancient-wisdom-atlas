canonical_text:
  quote: ''
  summary: The passage gives a character list and narrates how Wus, identified as
    Fox, tries to approach women by appearing as a handsome or richly dressed young
    man, but is recognized by the hair between his toes. He wants Blaiwas' sister
    as a wife, ignores warnings from his mother, and travels after learning she has
    gone with the youngest Kulta brother. Old Kulta receives him at the river and
    magically fills a basket with fish to feed him.
  language: English
  quote_policy: summarized
