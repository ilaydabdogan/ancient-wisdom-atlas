canonical_text:
  quote: To this day grasshoppers have a hole in each side.
  summary: Djihens reports that Wies appears on the rocks and comes down the mountain.
    Djahdjai goes toward the mountain to meet him while her husband secretly watches.
    The husband invokes the mountain and Earth, tracks Wies, discovers that Wies'
    life is in his neck, shoots him, cuts up his body, and brings home flesh. He feeds
    the flesh to Djahdjai, reveals what she has eaten, shoots her through the body,
    and declares that she will become a grasshopper; the passage closes by explaining
    grasshoppers' side holes.
  language: English
  quote_policy: quoted
