canonical_text:
  quote: ''
  summary: An unnamed figure has become a small snake, and W6wenkee turns himself
    into a whipsnake. The youngest of the Gletc6was brothers listens for Keis, cries
    because he has no parents, and the brothers say Keis killed their father and mother.
    Gletcowas stumbles at a mole hill and speaks to the earth. Keis emerges from rocks
    as a very tall singer. The brothers hide, prepare arrows, shoot Keis, and the
    eldest brother kills him with a tree stump. They cut Keis into pieces; the pieces
    become rattlesnakes. The brothers then go north, cross the Shasta River, lose
    their minds because of Keis, and become birds.
  language: English
  quote_policy: summarized
