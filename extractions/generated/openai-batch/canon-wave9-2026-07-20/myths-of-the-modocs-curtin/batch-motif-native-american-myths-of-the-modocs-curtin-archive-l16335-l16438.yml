canonical_text:
  quote: ''
  summary: An unnamed girl encounters Heuwus/Heliwis young men whose spirits become
    fish, Nkok people associated with a bow on her path, and Wuspahlikls blocking
    her trail. She asserts that she belongs to the earth and was made when the earth
    was made, transforms Nkok men into birds, tests a Heuwus being, kills Wuspahlikls
    with a bone scratcher, then sees him again the next morning. Frightened, she paints
    herself red, questions rocks, trees, leaves, and a little hill. The hill identifies
    itself as Lul'uphlainik, the earth's eye, and directs her toward a lake where
    two little air boys live.
  language: English
  quote_policy: summarized
