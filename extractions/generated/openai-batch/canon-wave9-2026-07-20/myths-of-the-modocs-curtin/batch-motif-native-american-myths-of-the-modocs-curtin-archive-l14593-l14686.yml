canonical_text:
  quote: ''
  summary: A girl at Kowe's house is sought by men from Wamanik's village. Gak and
    Wisnik attempt to see her; Wisnik enters from under the ground near the fireplace
    and reports her beauty. Kowe warns the girl not to choose the local men and tells
    her of five distant powerful brothers. Many suitors arrive; Kowe's little grass
    hut expands to hold them, and the girl mocks the local suitors. When the five
    Wulkutska brothers arrive, she briefly looks at four but is glad to see the youngest.
    After the visitors leave, Kowe prepares the girl and tells her to follow Wulkutska.
    The young man warns that his brothers travel on tree tops to a distant home. The
    girl follows them for ten days, stumbling and weakening while the brothers travel
    without hunting or eating.
  language: English
  quote_policy: summarized
