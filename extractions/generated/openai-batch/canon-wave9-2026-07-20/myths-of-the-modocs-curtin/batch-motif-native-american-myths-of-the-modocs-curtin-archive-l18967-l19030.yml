  summary: The passage opens a medicine story with a character list. Ktilis' son,
    a very young boy living with his grandmother, is expelled by her and sent away
    with his bow and arrows. He tries to reach his married sister's home near the
    mountains. On the way he meets a frightening woman carrying old ragged mats; she
    is identified as a Skoks, comes in a whirlwind, grows until her head reaches the
    sky, screams, and tries to pass him on one side while he pushes toward the other.
  language: English
