canonical_text:
  quote: ''
  summary: A sister hunts two swans, cooks them for her weakened brothers, and uses
    the fat on their sores. The brothers feign death to ambush raiders who come to
    scalp them and take their belongings. After killing the raiders and finding their
    sister dead, the brothers burn her body, travel west killing people, cross a lake
    in a canoe that sinks and passes under water and a mountain, and encounter Storm,
    who is then a man and tries to kill them by drawing them into the water.
  language: English
  quote_policy: summarized
