canonical_text:
  quote: ''
  summary: An old man, K^oa, calls out that winter will be three months. Wus is angry,
    while others approve. Hedgehog and Porcupine fear future people may not be thankful
    and may eat them, but others say they have obtained fire, killed five Subbas brothers,
    and made winter short. The council ends; the mythic people become common animals
    before real people arrive. The Subbas brothers live in the west and watch the
    world, and the narrator says things have been as they are now since then.
  language: English
