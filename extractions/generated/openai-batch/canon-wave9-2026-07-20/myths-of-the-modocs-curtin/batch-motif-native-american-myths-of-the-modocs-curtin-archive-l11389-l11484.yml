canonical_text:
  quote: ''
  summary: Lok Snewedjas tells a young man that she is a woman by day and a bear by
    night, belonging to the mountain, with Earth as mother and Mountain as father.
    She keeps him in her hidden dwelling, feeds him through the earth and mountain,
    limits his hunting, instructs him not to harm plants or be distracted by animals
    on the mountain, and warns him about forbidden places. Searchers from his village
    cannot find him. After an encounter with a deer whose horn turns back his arrow,
    she explains that the mountain was barring him. The young man remains with her
    for a year, and their son is born and rubbed with red paint to make him grow quickly.
  language: English
  quote_policy: summarized
