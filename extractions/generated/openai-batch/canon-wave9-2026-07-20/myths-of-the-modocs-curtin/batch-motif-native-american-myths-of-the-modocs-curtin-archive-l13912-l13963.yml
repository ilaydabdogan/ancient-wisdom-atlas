canonical_text:
  quote: ''
  summary: The passage introduces characters for “The Sloa Brothers,” then describes
    five Sloa brothers and two sisters living together. The youngest brother, unmarried
    and exceptionally beautiful, is kept by his parents in a basket underground and
    cared for secretly at night. The elder sister, who has not seen him since infancy,
    refuses other marriages and lies near the hole where he is hidden, drawing criticism
    from the eldest brother. Later, during a communal deer hunt and meat-roasting,
    Wtilkutska discusses marrying Sloa’s sister and sends old Yaukul to ask Sloa’s
    mother for her, offering nice things in exchange.
  language: English
  quote_policy: summarized
