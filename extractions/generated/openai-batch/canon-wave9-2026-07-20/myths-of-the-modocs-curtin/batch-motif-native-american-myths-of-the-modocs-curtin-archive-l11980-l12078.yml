canonical_text:
  quote: ''
  summary: A feared chief, Wamanik, wants Djiudjau's daughters. The family fears his
    temper and violence, while the eldest daughter rejects the match, saying he should
    marry among his own people who live in the ground. Wisnik reports the refusal
    to Wamanik. Wamanik and Wisnik hunt and camp near a mountain; Wamanik stays on
    after sending Wisnik home. Djiudjau's son fails to find deer or call them by song.
    His father and mother attempt steaming and odor-based treatments, but Wamanik
    draws away the young man's song. The young man dreams of being crushed on stones,
    and his mother burns an old panther-skin and rubs his face with ashes to hide
    the dream. A small nephew of Old Djiudjau arrives from the East and asks about
    WfiMtska's house.
  language: English
  quote_policy: summarized
