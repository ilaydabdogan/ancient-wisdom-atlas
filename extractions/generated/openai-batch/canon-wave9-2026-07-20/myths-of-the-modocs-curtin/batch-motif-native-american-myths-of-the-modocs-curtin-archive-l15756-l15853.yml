canonical_text:
  quote: ''
  summary: Tskel continues searching for his lost younger brother. After a failed
    inquiry at a house of thread and rope makers, he burns their work and tells them
    how to restore it with water. He persuades old Kaltsik to go up to Subbas in the
    sky. Kaltsik twice blocks Subbas' trail by changing into plants. Subbas, who is
    always hurrying and fears Lok, agrees to reveal information in exchange for a
    ring, green shells, and a white blanket. Tskel makes the gifts, Subbas receives
    them, and reports signs that the brother is held by an old man on the mountains.
    Tskel then changes into an old humped woman and approaches the mountain captor,
    who suspects his identity.
  language: English
  quote_policy: summarized
