canonical_text:
  quote: ''
  summary: At Wus' house, a young woman gives water to her mother and brothers, who
    feel revived. Wus visits his grandmother Wuswel^kgas on a high mountain, warns
    her about Tsmuk, and shows her a field of mice for food. Later Wus' brother-in-law
    goes to the mountain, is found under a tree, and becomes the subject of Wus' mountain
    dream. After conflict over the dream, Wus says he will change to an animal and
    leaves as a fox; his children are thrown out and come to him as little foxes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young woman gives water to her mother and brothers at Wus' house; after
    drinking, they seem to open their eyes and feel good and light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wus tells his wife that his old grandmother Wuswel^kgas lives on a high mountain
    and that he is going to see her; he sings as he starts, and she hears his song.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wus travels quickly, is described as going like a spirit, thinks he will cheat
    his grandmother, and tells her that he has lost his mind because of the world
    and Gak waking him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandmother says she feared Tsmuk would kill Wus; Wus says he has turned
    Tsmuk to a cloud and driven him away, but that Tsmuk may still try to beat him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wus takes his grandmother to a field with many mice so she will have food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Wus returns singing, his wife prepares pounded roots for him; his brother-in-law
    asks him to hunt deer on the mountain, but Wus says he hunts on the flats.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brother-in-law camps on a high mountain at night, while Wus hunts on the
    flat and returns with many mice; Wus' wife has another child, and Wus stays awake
    for five days and five nights while the brother-in-law is absent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wus tracks the brother-in-law and finds him lying under a tree; the young
    man says his toenails have fallen out, and Wus understands that he has been thinking
    about his father.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wus goes to a swimming pond on the mountain hoping for a good dream about
    his brother-in-law and knowledge of what will happen; he sings, piles stones,
    prepares a bed of dry grass, and sleeps.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Wus' dream, he hears his brother-in-law say that he is going away, will
    never come back, and will stay lost.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wus wakes crying, returns home, paints his face red at his wife's instruction,
    and eats after the baby is five days old.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wus tells his brother-in-law about the mountain dream, saying he heard that
    the young man would go away and would be a person no longer; the young man becomes
    angry and scolds Wus for going to the mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Wus says he will go away, change to an animal, and keep a little of his mind;
    he leaves his wife and children and wanders off as a fox.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After Wus leaves, the brother-in-law tells the mother to throw the children
    out; despite her saying Wus told her to keep them, he throws them out, and she
    screams.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wus hears the mother's scream, puts his head to the ground to listen, and
    then hears his children coming; they are little foxes.
  category: action
  evidence_refs:
  - ev:10
