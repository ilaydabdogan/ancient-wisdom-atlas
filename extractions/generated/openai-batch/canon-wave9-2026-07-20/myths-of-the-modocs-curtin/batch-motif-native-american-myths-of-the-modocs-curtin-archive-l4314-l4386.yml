canonical_text:
  quote: ''
  summary: The passage opens a Modoc myth section titled “Wind and Thunder” with a
    character list. In the narrative, Tskel/Mink and Tdiskai or Tcuskai/Weasel live
    on North Wind Mountain. Tskel wants wives and sends Tdiskai to Sycan for two women.
    Tdiskai steals caps from women digging roots, causing many women to follow him;
    the passage explains this as an old-time method of signaling desire for a wife.
    Tskel is angry that many caps were taken, so Tdiskai keeps two caps and discards
    the rest; only two women remain. Each woman later has a boy. The children are
    rubbed with ashes and grow quickly. The boys quarrel, are given arrows and then
    poisoned arrows, and kill each other while Tdiskai knows what has happened from
    inside the house and Tskel is away hunting.
  language: English
  quote_policy: summarized
