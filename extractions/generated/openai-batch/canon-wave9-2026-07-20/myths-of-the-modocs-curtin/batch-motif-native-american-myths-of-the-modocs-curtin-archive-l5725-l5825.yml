canonical_text:
  quote: ''
  summary: A grandmother searches for two escaped boys; an awl reveals that they went
    underground through a hole beneath a coal. The boys travel east toward the sunrise
    to serve Sun, visit their aunt Tohos, alter a swelling on her forehead, and later
    defeat Wamanik, whose body becomes rocks and a mountain and whose spirit becomes
    a snake. Continuing east, they name springs, associate snakes with frightening
    strangers at a spring, create a spring by shooting through a mountain into a lake,
    and establish a place associated with catfish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman searches in wood, a canoe, roots, and fire after hearing voices,
    but she does not find the boys.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Awl says the boys are not to blame, says the old woman's daughter killed her
    brothers and wanted to kill her nephews, and points out a hole under a little
    coal where the boys went down into the ground.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman picks up the coal, finds the hole, and starts to follow her
    grandsons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys travel toward where the sun comes up because they want to be servants
    of Sun and be of use to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first house the boys reach is on the south side of Tula Lake and belongs
    to Tohos, Wamanik's wife and the boys' aunt.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tohos has a great red lump on her forehead, and the little boy presses the
    swelling downward with his fire-drill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that from that time fowls and beasts do not carry their
    young in their foreheads.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Tohos warns her nephew that Wamanik is bad, will be angry, and may kill him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wamanik's bowstring breaks while he is hunting; he knows what has happened
    at home, extends himself, circles the world, and presses in trees, rocks, mountains,
    and everything.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The elder nephew goes onto the house, snaps his bowstring, shoots an arrow
    into Wamanik's head, kills him, and cuts his body into small pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Each piece of Wamanik's body turns to rock, the rocks make a great mountain,
    and Wamanik's spirit comes out as a snake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Tohos' spirit follows the boys briefly and asks where they are going and when
    they will return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boys say they will not return because the world is lonesome, they have
    no father or mother, their aunt killed them, and they are going to where the sun
    comes up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: At a place where water flows from two holes in a rock, the boys drink, and
    the elder brother names the place Gadum, or Stone Springs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A little snake runs into the spring, and the younger boy says that in later
    time snakes there will show themselves and scare strangers who come to drink.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The elder boy shoots arrows toward the east and finally shoots through a mountain
    into a lake, causing water to come through the mountain and make a spring called
    Ktsiskasalkis.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After crossing a high mountain to a lake, the elder brother gets water grass
    for the hungry younger boy, shoots at a catfish, and many fish come up from the
    water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The place where the boys sat eating is called Edelis, and the passage says
    many catfish are still caught in the river near there.
  category: setting
  evidence_refs:
  - ev:8
