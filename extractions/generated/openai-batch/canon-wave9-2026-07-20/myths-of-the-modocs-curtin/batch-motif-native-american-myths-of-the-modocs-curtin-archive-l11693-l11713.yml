canonical_text:
  quote: ''
  summary: A young man says he wants to remain with his wife and not return to a place
    where he would forget her teachings. They leave and are never seen again. His
    friends and others search but cannot find their home. Lok Snewedjas takes back
    all her seeds, so that food is no longer tasted. Voices of Lok Snewedjas and her
    children are still heard on a mountain, though they are not seen. The passage
    ends with the heading for the next story, about Snake trying to marry Squirrel's
    daughters.
  language: English
