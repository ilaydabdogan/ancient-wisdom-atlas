canonical_text:
  quote: ''
  summary: Gaukos flees east from his sister, whom he says will become a man-eater
    and follow him. Two powerful old women transform him into a swaddled baby to hide
    him, put the pursuing sister to sleep, then return him to man form so he can continue.
    The sister pursues again, and the old women throw ashes after her so fire may
    burn her. Gaukos next reaches Loluk and Dunwa; Dunwa hides him in a hole beneath
    her sitting place. Loluk's daughters return from hunting after their bowstrings
    break, and Gaukos' sister arrives demanding to know where her brother is, then
    begins poking the fire.
  language: English
  quote_policy: summarized
