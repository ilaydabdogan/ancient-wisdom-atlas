canonical_text:
  quote: ''
  summary: In one fragment, Tcuskai escapes from inside an old man after hearing advice
    to scratch and kick. After conflict with Tskel, the sons of Tcuskai and Tskel
    kill one another with arrows, and the two brothers exchange curses that transform
    them from powerful persons into common minks and weasels. The narrator connects
    Tcuskai's trickery with later kin-killing. In a later fragment, Wus is found torn
    apart but alive in the head; Gak reassembles him and cures him with medicines
    and a red medicine basket. Gak is later pursued by enemies and evades them through
    transformations, including taking bird form and disguising himself as Ndukis with
    an obsidian blanket and white face paint.
  language: English
  quote_policy: summarized
