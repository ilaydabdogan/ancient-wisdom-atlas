candidate_motifs:
- id: motif:1
  label: escape from belly enclosure by tearing from within
  taxonomy_refs: []
  basis: Tcuskai is enclosed in an old man's body, follows advice to scratch and kick,
    breaks the skin, and escapes.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage begins mid-episode, so the cause of the enclosure is not fully
    present in this excerpt.
- id: motif:2
  label: trickster causes kin-killing and explains later social violence
  taxonomy_refs:
  - trickster_boundary
  basis: Tcuskai directs his son to shoot his cousin; the narrator explicitly says
    Tcuskai was full of tricks and that this is why kin sometimes kill one another
    now.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The extraction is limited to the narrator's etiological statement in this
    passage.
- id: motif:3
  label: mutual curses transform powerful persons into common animals
  taxonomy_refs:
  - shapeshifter
  basis: Tskel and Tcuskai pronounce loss-of-personhood curses, and the passage says
    the two great powers became common little minks and weasels.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The transformation is curse-result rather than voluntary shape-changing.
- id: motif:4
  label: mourning relieved by ritualized swimming
  taxonomy_refs: []
  basis: After the boys die, Tskel says he will swim at Lamsewe, and the narrator
    adds that grieving people swim until they feel better.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives only a brief explanatory aside.
- id: motif:5
  label: reassembly and cure of a dismembered body with a medicine object
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Wus is torn to pieces, Gak rejoins the pieces, steps over the body three
    times, covers it with a medicine basket, and Wus later says he is well.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:14
  confidence: medium
  cautions: Wus's head is described as alive, so the episode is restoration or curing
    rather than unambiguous resurrection from death.
- id: motif:6
  label: shapeshifter evades pursuers and deceives observers
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Gak changes into something when enemies approach, becomes a bird to flee
    hunters, and transforms into a man like Ndukis to fool enemies.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The broader reason for Gak's conflict with enemies is only briefly summarized
