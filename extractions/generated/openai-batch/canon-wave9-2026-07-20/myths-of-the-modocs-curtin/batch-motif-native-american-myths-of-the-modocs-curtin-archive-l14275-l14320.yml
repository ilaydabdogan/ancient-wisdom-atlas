canonical_text:
  quote: '"Coltz came to life, but he didn''t move for a long time: he was watching
    Cap."'
  summary: 'Wus repeatedly destroys Coltz, but Coltz revives. Wus''s talking cap warns
    him until Coltz tears it apart. Coltz then takes Wus''s meat to a high tree, cooks
    it, tricks Wus''s family into standing below with eyes shut, and kills them with
    an elk backbone. Coltz declares that Wus will live by stealing, and Wus''s spirit
    answers with a future condition for Coltz: he will not be a person, will live
    on grass, and will not kill game.'
  language: English
  quote_policy: quoted
