canonical_text:
  quote: ''
  summary: The passage introduces characters for “The Five Brothers of Latkakawas”
    and narrates the beginning of an episode in which Latkakawas’ five brothers travel
    eastward to a mourning village. In a poor house at the village edge live three
    orphan Naulintc children. The boy Gaukos is frightened, is thrown out by his elder
    sister, and decides to go to mountain ponds, speak to earth and mountains, and
    gain power. His younger sister Lisgaga helps tie his blanket. As he travels singing,
    he grows into a full-grown man. Lisgaga waits for him on the housetop for five
    days and hears his song on the sixth morning.
  language: English
  quote_policy: summarized
