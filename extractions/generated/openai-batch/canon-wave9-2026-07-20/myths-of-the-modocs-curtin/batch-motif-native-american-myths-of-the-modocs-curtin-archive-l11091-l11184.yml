canonical_text:
  quote: ''
  summary: An elder prepares Wus for a journey to powerful mountain swimming places,
    warning him to follow instructions, avoid distractions, and speak ritually to
    mountains, earth, trees, and rocks. Wus climbs a snowy mountain over ten nights,
    piles stones, addresses natural powers, dreams of the mountain as a white-headed
    old man who grants him life and tells him to live toward the sunset. On his return,
    a great fire appears on the mountain to show his mother he has been there. The
    elder meets Wus, warns him not to tell a mountain-speaking dream, and notes that
    Wus is changed, stronger, and should avoid meat for ten days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder makes holes in Wus' ears and nose and ties a deerskin blanket around
    him before the journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wus asks where the most powerful swimming places are, and the elder identifies
    places on Mlaiksi and Mlaiksi's brother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder instructs Wus not to stop on the road except at night, not to touch
    anything, to pile stones, and to talk to mountains and the earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder says that in youth he talked to mountains, earth, trees, and rocks,
    and that they gave him power and strength when he followed old people's instructions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The elder tells Wus to lose himself, not think of what is in his heart, and
    sing to the mountain as father, asking to be made its son and given good thoughts.
  category: speech
  evidence_refs:
  - ev:5
