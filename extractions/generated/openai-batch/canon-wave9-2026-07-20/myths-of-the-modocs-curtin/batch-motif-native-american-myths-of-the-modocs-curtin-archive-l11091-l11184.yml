  text: Old Djiudjau walks behind Wus at his departure and calls to the mountains
    to wake, listen to him, take care of him, and give him what is in the world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wus reaches the foot of a snow-covered, high, cold mountain and nearly turns
    back, but continues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wus travels for ten nights while singing the song taught by the elder.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Near the summit Wus becomes weak, falls, rolls back, rises, continues, reaches
    the top by dark, piles stones, and speaks to the mountain, earth, sky, clouds,
    trees, and rocks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wus dreams that the mountain is a white-headed old man who speaks to him,
    says he is the greatest mountain and will never grow old or die, and grants Wus
    his life because Wus called him father.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The dreamed mountain tells Wus that he must live where the sun goes down because
    other people are coming to live where he lives now.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: When Wus is returning, his mother sees a large fire on top of the mountain
