canonical_text:
  quote: ''
  summary: A man discovers that his infant son appears as a little bear at night.
    The child's mother, Lok Snewedjas, warns the man that the boy can turn into a
    bear in sleep and toward evening when playing, and she gives him yelalwek seed
    with precise instructions for feeding his kin. The man forgets her warnings after
    leaving home. In his village the seed multiplies on white skins, Tusasas eats
    too much and swells, and the children later try to play with the boy while the
    mother senses events from afar.
  language: English
  quote_policy: summarized
