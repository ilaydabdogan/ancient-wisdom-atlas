canonical_text:
  quote: ''
  summary: The passage recounts how two sisters appear as toothless old women, become
    young at night and in river water, then become green-headed ducks and return home.
    Old Maidikdak catches them under the water, removes their feathers, and they become
    girls again. The youngest brother brings back their belongings and chooses to
    live with them at Maidikdak's house.
  language: English
  quote_policy: summarized
