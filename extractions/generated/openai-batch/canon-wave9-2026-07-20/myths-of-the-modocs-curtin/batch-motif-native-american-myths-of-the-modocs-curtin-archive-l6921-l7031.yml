canonical_text:
  quote: ''
  summary: In Tsmuk's household, Wus is insulted by his father-in-law while some family
    members show sympathy. Wus changes into a fox, catches mice, confronts old Tsmuk,
    and after repeated rejection makes a west wind melt Tsmuk's body and turn him
    into a black cloud identified with darkness. Wus then instructs his wife and her
    family to come to his country, drink and share the water of life, travel straight
    ahead, not look back, and avoid an east wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man warns that harm will come if bad things are said about Wus, but
    the old man says nobody has been able to harm him and continues abusing Wus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old woman Tsmuk cries, thinks Wus is nice-looking, spreads mats and blankets,
    and Wus and his wife enter and sit down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsmuk becomes angry and tells his wife to put Wus by himself, saying Wus smells
    badly and will spoil their seeds and roots.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wus asks whether he could find game if he went hunting; his wife says her
    brothers hunt but never catch anything.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After leaving the house, Wus turns into a fox; a brother-in-law sees the fox,
    and old Tsmuk says it is not a fox but their brother-in-law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wus catches a sackful of mice, brings them to the house, and sends his mother-in-law
    outside to roast them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youngest son says their mother is roasting mice, and the second brother
    agrees to eat mice rather than stay with his father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wus asks old Tsmuk three times whether he will be mad all the time; Tsmuk
    answers yes and rejects Wus as a son-in-law, saying Wus is bad, dirty, not a person,
    and has no sense.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wus asks in which direction Tsmuk can see farthest and what he sees looking
    east; when Tsmuk looks east, Wus makes a great wind come from the west.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old Tsmuk's body melts like snow, he turns into a black cloud, and the wind
    blows him toward the east.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wus declares that old Tsmuk will no longer be a person, will be darkness,
    will make people sleep when he comes, and will give people bad thoughts that lead
    to theft and killing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A son tells his father that because of quarreling with Wus he is no longer
    a person, says he now likes Wus, and says the father had called Wus what he himself
    was.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Wus tells his brothers-in-law to come live in his country and tells his wife
    that he is taking her from Darkness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Wus instructs his wife to enter the house first, drink the water of life found
    there, give some to her brothers and mother, travel straight ahead, not look back,
    and go around an east wind if it comes.
  category: speech
  evidence_refs:
  - ev:8
