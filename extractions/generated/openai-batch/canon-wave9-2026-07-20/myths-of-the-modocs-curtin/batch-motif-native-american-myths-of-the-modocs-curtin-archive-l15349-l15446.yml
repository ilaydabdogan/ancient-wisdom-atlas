canonical_text:
  quote: ''
  summary: Tskel's cap frightens a young man and five brothers. The five Kaiutois
    brothers recognize Tskel and arrange deer meat for him, while Lemeis and his sons
    cook dead men. Tskel reinforces Gak's arms with sticks before an arm-twisting
    contest in which Gak and then Tskel kill the sons of Lemeis. Tskel declares the
    sons no longer persons and sends them to the sky to make frightening noise; he
    also sends old Lemeis and his wife to the sky and warns the Kaiutois brothers
    to leave the polluted house. Tskel and Tcuskai return home, and the passage ends
    with Tcuskai finding an old white-haired man sitting in a spring.
  language: English
  quote_policy: summarized
