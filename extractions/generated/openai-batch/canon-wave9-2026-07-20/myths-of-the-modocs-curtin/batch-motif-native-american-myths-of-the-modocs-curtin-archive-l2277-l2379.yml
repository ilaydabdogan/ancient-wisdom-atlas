canonical_text:
  quote: ''
  summary: While the sisters go farther up the mountain to gather seeds, porcupines
    dance around the sleeping Isis and sing a challenge. Isis wakes, kills the chief
    porcupine, removes his hands, feet, and quills, and recovers enough to hunt. The
    elder sister and then the younger sister bear children. Isis hunts deer, lightens
    the sisters' seed baskets by speaking, visits Old Yaulilik and Cogatkis, receives
    arrows, kills and carries many deer, pulls up trees for drying meat, and stretches
    skins. At Tsiwisa spring he remembers the place where Kumush made a tree with
    an eagle's nest grow to the sky, feels lonesome, and says he is leaving. The elder
    sister insists on going with him, while the younger sister wants to stay but is
    told to go.
  language: English
  quote_policy: summarized
