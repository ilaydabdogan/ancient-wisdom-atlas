canonical_text:
  quote: ''
  summary: Tskel watches the old father of the Wulkutska brothers so that he will
    not harm or eat Pitoiois. Pitoiois digs roots that become abundant, and dried
    meat becomes light or fills a basket from a small piece. She returns to her brothers,
    who had been grieving after seeing signs of Wus and the Wulkutska brothers. Pitoiois
    says the Wulkutska brothers saved her from Wus and that she is wife of the youngest
    brother. The Wulkutska brothers remain afraid that the old man will kill Tskel
    and follow them.
  language: English
  quote_policy: summarized
