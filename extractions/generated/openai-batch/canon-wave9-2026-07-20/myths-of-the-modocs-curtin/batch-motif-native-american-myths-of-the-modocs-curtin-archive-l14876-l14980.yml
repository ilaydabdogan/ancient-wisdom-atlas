  quote: ''
  summary: Kowam and his younger brother Gahga grieve over the removal of Gahga's
    sister-in-law by big-footed people. Kowam decides to confront them and repeatedly
    orders Gahga to shoot, dismember, pound, scatter, burn, and mutilate him, each
    time returning unharmed. Near home, Kowam enters the house, throws Lok out, is
    killed and thrown on the fire by Lok, then immediately seizes and chokes Lok.
  language: English
