canonical_text:
  quote: ''
  summary: After instructions concerning dream medicines and food restrictions, Djiudjau
    prepares Wus with sweating, red paint, and fine clothes, then sends him to hunt
    and later seek a Walwilegas wife. Wus sees Walwilegas girls washing roots at a
    creek, but the youngest and most attractive girls leave when he sits among them.
    Angered, Wus visits Giuwas and his wife, tells them the girls flew away, and declares
    that they will no longer be people. The Walwilegas daughters become common butterflies.
    Wus spares Giuwas, his wife, and their son, then later moves with his mother to
    Klamath Lake while Djiudjau remains in the mountains.
  language: English
  quote_policy: summarized
