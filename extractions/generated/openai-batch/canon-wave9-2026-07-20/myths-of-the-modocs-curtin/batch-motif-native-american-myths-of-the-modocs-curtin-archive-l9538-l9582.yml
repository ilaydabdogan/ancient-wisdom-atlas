canonical_text:
  quote: ''
  summary: Wus and Kaiutois use reports of Kaiutois's impending death, dancing, and
    concealment to lure antelopes and then deer or mountain-dwelling animals. Kaiutois
    kills prey, eats the meat, repeatedly drives Wus away from food despite Wus's
    help, then turns into a wolf and goes to the mountains without a home.
  language: English
  quote_policy: summarized
