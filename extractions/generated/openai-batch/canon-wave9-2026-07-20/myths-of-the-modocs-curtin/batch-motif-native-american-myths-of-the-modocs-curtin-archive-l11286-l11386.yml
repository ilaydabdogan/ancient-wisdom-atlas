canonical_text:
  quote: ''
  summary: A character list precedes a narrative in which Lok Snewedjas, a woman by
    day and bear by night, lives unseen underground on a high mountain. A chief's
    son, distressed after returning without game and being scolded, travels toward
    the mountain during a snowstorm. Lok Snewedjas makes him see a pole with a deer
    hide, leading him to a smoke-hole-like entrance and a hidden house. She hosts
    him with a magically inexhaustible sweet seed and deer meat, reads his thoughts,
    makes him sleep, and tries to keep him from seeing her bear form. At night he
    wakes by the fire and sees a large black bear where she had slept.
  language: English
  quote_policy: summarized
