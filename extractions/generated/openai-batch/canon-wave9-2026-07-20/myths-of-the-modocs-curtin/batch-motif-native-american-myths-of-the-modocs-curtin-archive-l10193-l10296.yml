canonical_text:
  quote: "“Just then Wamanik stood up in the form of a snake”"
  summary: Two Wiskak sisters travel despite warnings about Ndukis. On a mountain
    Ndukis watches them, frightening them into hiding. Later Moi finds them and offers
    reassurance. After another episode involving people digging roots, Wamanik sees
    the younger sister, desires her as a wife, follows her to a spring, and appears
    to the elder sister in the form of a snake, causing her to flee in terror.
  language: English
  quote_policy: quoted
