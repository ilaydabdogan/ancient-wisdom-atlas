canonical_text:
  quote: ''
  summary: The passage opens with a fragmentary statement about people not forgetting.
    Sapkokis is known as a great fighter and tells his grandmother he will visit Ktilta/Kulta;
    she warns him not to harm this kinsperson. Kulta calls Sapkokis grandson, warns
    him of danger and mourning, and urges him to kill enemies connected with slain
    kin. Kulta says his own harmless sons were killed by men and welcomes Sapkokis
    killing those men. After Sapkokis returns home, Kulta brings fish to the old grandmother.
    Sapkokis tells Kulta not to leave tracks, lest people think Kulta taught him.
    Sapkokis and his grandmother then live in peace, with only women and children
    left nearby.
  language: English
  quote_policy: summarized
