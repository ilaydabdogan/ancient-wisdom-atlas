canonical_text:
  quote: ''
  summary: A preceding fragment says that a little girl sees her sisters become djaudjaus,
    then the whole family becomes djaudjaus and flies to the woods. In the opening
    of "Won and Dunwa," a granddaughter kills her grandmother after being pressed
    to marry, leaves with a basket, hears the dead body say she will not arrive, sees
    crows carrying part of the grandmother, and becomes trapped when the ground turns
    soft. Won, on a high mountain, sees her, identifies a thunder-like noise as his
    angry wife, frees the girl with a leg bone from a pile of bones, and declares
    that she is now his wife.
  language: English
  quote_policy: summarized
