canonical_text:
  quote: ''
  summary: The passage lists the characters for the Witsduk story, then describes
    Witsduk and her family as windblown snow beings who harm people. An old medicine
    woman, Tcutuk, plans to capture them in a bag and hide them under rocks, but fears
    Wus Fox will take and open the bag. She captures all the Witsduks at their mountain
    home by magic words, ties the bag, and carries it away. The people who promised
    to help become afraid and turn back. Tcutuk meets Wus at a log; he teases her,
    boasts that he can eat all beings and elements, pulls her head-strap until it
    cuts her forehead, and she drops the bag with an instruction not to untie it until
    she has crossed a flat.
  language: English
  quote_policy: summarized
