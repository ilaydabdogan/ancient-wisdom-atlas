  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gowwa and Wihutus catch Wus, pull off his skin, and throw him out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gowwa's mother later finds Wus, gets cattails from a swamp, wraps them around
    him, and the cattails become fur; Wus is cured and goes home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lok steals the wife while Gowwa and Wihutus are hunting; five Lok brothers
