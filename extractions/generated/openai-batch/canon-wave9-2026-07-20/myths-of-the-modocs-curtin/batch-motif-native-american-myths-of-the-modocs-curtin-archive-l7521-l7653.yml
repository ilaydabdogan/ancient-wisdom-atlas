canonical_text:
  quote: ''
  summary: The passage opens with a character list, then narrates how Gowwa and Wihutus,
    co-husbands of one woman, encounter Wus, who tries to take the woman and is skinned
    but later restored with cattails. Lok then abducts the woman to a rock/underground
    house with five brothers; Gowwa and Wihutus go to recover her, repeatedly kill
    and revive each other in practice, and defeat the five Lok brothers after Wihutus
    repeatedly reconstitutes from dismemberment. The passage ends with Yahyahaas abducting
    the woman and being described as a habitual wife-stealer living underground among
    five rocks.
  language: English
  quote_policy: summarized
