canonical_text:
  quote: ''
  summary: The passage opens the story of Tsmuk and Goshgoise with a character list,
    then describes five Yaukul brothers who live east of Tula Lake, kill men, capture
    women, and control related Tcpun brothers and their wives. An old Yaukul woman
    watches for victims and supervises women digging roots. The hungry Tcpun brothers
    are ordered to hunt rabbits. A young orphan, Goshgoise, hears the youngest Tcpun
    brother lamenting that he hunts but cannot eat, learns from his grandmother that
    the man is her brother, and later meets him in the woods. The man tells Goshgoise
    that the Yaukuls killed his father and people and that anyone who eats where he
    lives would be killed.
  language: English
  quote_policy: summarized
