canonical_text:
  quote: ''
  summary: Blaiwas and his people gamble against Kletcowas, Kletcowas' sons, and old
    Kumal until the latter side loses its possessions. Blaiwas sends Ndukis to summon
    Kalaslakkas, his neglected nephew, to gamble on his behalf. Kalaslakkas is silent
    or refuses through intermediaries, while his grandmother shields him from a fight.
    After offers and threats from others, Blaiwas visits him directly and asks for
    help; Kalaslakkas reproaches Blaiwas for past neglect.
  language: English
  quote_policy: summarized
