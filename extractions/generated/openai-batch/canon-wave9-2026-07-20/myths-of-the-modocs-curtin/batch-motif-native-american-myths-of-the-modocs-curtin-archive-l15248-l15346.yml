canonical_text:
  quote: ''
  summary: Tskel confronts Gopher by smoking a hole in the ground while Tcuskai repeatedly
    dies from fright and is revived. Old Gopher emerges as a red fiery head; Tskel
    cuts it off, makes a cap from the skin, buries the head under rocks, and declares
    Gopher's diminished future status. Tskel then travels with Tcuskai and Gak toward
    Kaiutcas despite warnings about the man-eating Lemeis family. At the Lemeis house,
    Tskel's gopher-skin cap frightens old Lemeis, his wife, the household, and the
    eldest returning son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A warning says the dangerous being is terrible when angry and that seeing
    him will cause death, so eyes must be kept closed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tskel has two stone knives, gives one to Tcuskai, builds a fire, and blows
    smoke into the big hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Noises from inside the hole frighten Tcuskai so much that he dies; Tskel restores
    him to life and tells him not to be scared by every noise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When old Gopher moves, the earth shakes; a great red fiery head comes out
    of the hole, and Tskel cuts it off, skins it, makes a cap, and buries the head
    under flat rocks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rocks over Gopher's buried head immediately become red like blood, and
    the narration says they remain red.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tskel declares that Gopher will thereafter dig in the ground and be mocked;
    the narration states that without Gopher's death no one would now be alive, and
    that Gopher's stone body remains in a hot hole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After killing Gopher, Tskel leaves home with Tcuskai and Gak; people warn
    them that the Lemeis family kills people and carries men off to eat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near Lemeis' house, Tskel puts on the gopher-skin cap, holds Tcuskai under
    his arm to prevent mischief, and gives Gak a sharp bone for dealing with dead
    men's meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The house contains old Lemeis, his wife, five boys, and five Kaiutois brothers
    with their wives and children; the hunting men are away when Tskel arrives.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old Lemeis and his wife see Tskel's cap, become afraid, leave the house, and
    cook outside; the Kaiutois wives and children are also frightened.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tcuskai wants to put on the cap and scare the old man, but Tskel pinches him
    and orders him to stay still under his arm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The eldest son returns, says he has been killing men and is not afraid, but
    when he sees Tskel's cap he screams, shakes the ground, and says something stronger
    than he is inside.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The second brother returns and asks why the father is outside; the father
    repeats that something stronger than they are is in the house.
  category: sequence
  evidence_refs:
  - ev:10
