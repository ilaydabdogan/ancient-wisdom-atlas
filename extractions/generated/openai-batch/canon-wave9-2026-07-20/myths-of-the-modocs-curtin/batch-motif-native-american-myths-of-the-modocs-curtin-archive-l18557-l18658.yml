canonical_text:
  quote: ''
  summary: Kai survives a sequence of tasks and traps set by his father-in-law Natanatas.
    He retrieves reeds, stones from a river, and eagle feathers with help connected
    to feathers. Natanatas then arranges a deer-hunt trap using his son, who takes
    deer form with his heart in his foot; G6shgoise's heart warns Kai, and Kai kills
    the deer by shooting the foot. The excerpt ends during the beginning of another
    deer encounter.
  language: English
