canonical_text:
  quote: ''
  summary: A kin group of Wus and Kaiutois brothers is introduced. An eldest Wus brother
    loses his fire drill and fears trouble. Old woman Kaiutois hears northern people
    approaching from the mountains. Armed strangers attack, kill the Wus brothers
    except the youngest, kill old woman Kaiutois, remove hearts, burn the house, and
    take the women while sparing Wus' mother. The surviving Wus returns, declares
    his power, restores a house and provisions, obtains ten pairs of moccasins, and
    leaves to find his sister and retaliate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaiutois is identified as Gray Wolf and Wus as Black Fox; ten Wus brothers
    and ten Kaiutois brothers lived together as kin, and each married man had five
    daughters except the youngest Wus brother, who was unmarried.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wus brothers had a sister who was described as nice-looking, with a long
    neck, unable to eat meat, and eating deer neck bones five at a time.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: While hunting, the eldest Wus brother put down his fire drill and it disappeared;
    that night he told his brothers that this meant trouble and that he did not think
    they would live long.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old woman Kaiutois was sick in a small straw house near the big house and
    said she heard people from the north approaching in the mountains to kill them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A crowd of men with bows and arrows came down from the mountain, filled the
    house, and killed the brothers except the youngest Wus brother, who escaped by
    leaping from the top of the house and running away.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The strangers killed old woman Kaiutois but spared Wus' mother because she
    was old; they took all the women except Wus' mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The attackers cut open each man, removed his heart, placed the hearts on the
    end of a long pole, and burned the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Wus returned, his mother told him the bodies had been left but the hearts
    had been carried away; Wus said he had two minds, could do anything, and would
    pay the attackers for killing his brothers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wus' mother had covered her head with pitch and ashes; Wus told her to wash
    in the river, and while she was gone he thought hard and a new house appeared
    where the old one had been, full of baskets and mats.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wus told his mother to cut ten pieces from her rabbit-skin dress, and the
    pieces immediately became ten pairs of beautiful beaded moccasins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wus told his mother he had more power than the attackers, said he was going
    to find his sister, and instructed that new mats be present each day.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wus traveled fast; each pair of moccasins lasted ten days, and after wearing
    out five pairs he was near the house where the strangers lived.
  category: sequence
  evidence_refs:
  - ev:9
