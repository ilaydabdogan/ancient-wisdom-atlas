canonical_text:
  quote: ''
  summary: A severed head is carried toward the sky under a warning that no one should
    look up; when the sisters look, the head falls and kills four Blaiwas brothers.
    The head, described as the husband of two sisters, is carried by the elder sister
    in a basket, kills a deer, and is hidden among meat. The woman brings it to Kumush,
    who places it in a sweat house with heated rocks and sealed stones. The head tries
    to escape, breaks some stones, and dies. When the sweat house is opened, a dead
    beautiful young man is found; Kumush burns the body and declares this the future
    way of treating the dead.
  language: English
  quote_policy: summarized
