  summary: 'A note describes a Modoc version of how sickness spread through the world:
    the Glatc6was brothers are unidentified by informants, the little men have shapeshifting
    power, Keis angrily makes poisonous diseases, Wfiwenkee says sickness belongs
    to Nfibiks and was only loaned to Keis, but Keis does not listen and sickness
    spreads worldwide.'
