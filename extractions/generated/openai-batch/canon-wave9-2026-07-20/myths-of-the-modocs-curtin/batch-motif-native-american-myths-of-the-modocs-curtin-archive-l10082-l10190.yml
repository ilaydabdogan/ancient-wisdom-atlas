canonical_text:
  quote: ''
  summary: A young man named Ndukis is advised to watch two sisters while they dig
    roots and then visit Tcooks. Tcooks hosts him, notes his unusual food habits,
    and proposes the sisters as wives. Ndukis asks Tcooks to negotiate for them. Tcooks
    goes to Wiskak, the girls' mother, and asks on Ndukis' behalf, but both sisters
    resist the marriage, citing Ndukis' different dwelling place and way of life.
    Tcooks warns that Ndukis may watch them and become angry. The next morning the
    sisters plan to go to Mlaiksi, and their mother warns that they may meet Ndukis.
  language: English
  quote_policy: summarized
