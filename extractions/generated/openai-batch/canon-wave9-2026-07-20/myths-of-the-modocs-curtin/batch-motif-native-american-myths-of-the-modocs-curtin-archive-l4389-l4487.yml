canonical_text:
  quote: ''
  summary: Tskel and his brother confront north and south Slewis beings associated
    with dangerous cold, heat, and winds. Tskel kills Mowas Slewis and Tanias Slewis,
    makes caps from their head-skins, and the passage explains present winter, summer,
    and directional winds from their deaths and surviving spirits. Tskel later visits
    the deep house of the cannibal Lemeis family, uses the freezing cap to frighten
    them, protects his sister and her children from the cold, and defeats the daughter’s
    lethal bone-belt challenge by making her try the cap.
  language: English
  quote_policy: summarized
