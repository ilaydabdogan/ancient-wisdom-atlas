canonical_text:
  quote: ''
  summary: The passage opens the story “How Kalaslakkas Won His Wife” with a character
    list, then describes Kletcowas’s daughter being abused by her mother and seeking
    Blaiwas’s care. Blaiwas, chief of the village, places the beautiful girl in a
    basket under the ground. At the village edge, the orphan boy Kalaslakkas lives
    with his grandmother. Tusasis/Tusasas, listed as Joker (Skunk), often visits and
    teases the boy, saying the boy might get the hidden girl if he follows instructions.
    The grandmother and others object, and Ktsitco begins to reassure her.
  language: English
  quote_policy: summarized
