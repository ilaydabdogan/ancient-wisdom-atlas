canonical_text:
  quote: ''
  summary: 'The passage summarizes events in the Modoc War after a defeat: new command,
    proposed peace negotiations, the capture of Kintpuash''s ponies, the murder of
    General Canby and Doctor Thomas, fighting around Wright''s Cave, surrenders, executions,
    imprisonment, and removal of Modocs to the Quapaw Agency. It then describes Modoc
    exile and mourning for the Klamath country, identifies Ko-a-lak''-ak-a and Sconchen
    as narrators of myths to Mr. Curtin, and notes Curtin''s observations about conditions
    on the Klamath reservation.'
  language: English
