canonical_text:
  quote: ''
  summary: Yahyahaas enters a sick woman's house, rejects and mocks her attempts at
    hospitality, follows and mimics her, puts her into a sleep-like state, then tickles
    her until she dies and adds her little finger to a necklace of fingers. A little
    girl warns men, who return and seek Yahyahaas. The narrative then introduces the
    brothers Tcuskai and Tskel on a high mountain; Tcuskai hears village mourning,
    is asked to restore the dead woman, and begins a world-spanning search for Yahyahaas,
    eventually hearing him under a great flat rock on a high mountain.
  language: English
  quote_policy: summarized
