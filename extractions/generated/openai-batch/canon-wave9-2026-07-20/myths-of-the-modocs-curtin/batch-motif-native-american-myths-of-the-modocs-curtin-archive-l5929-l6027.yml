canonical_text:
  quote: ''
  summary: At Yaukiil's house, Gapni detects that something has entered while Yaukiil
    and Gak sleep. Two brothers appear. Yaukiil attempts a wrist-gripping contest
    with them, but the elder brother kills him and assigns new forms or fates to Yaukiil,
    Gak, and Gapni, then burns the dirt house. The brothers continue east after their
    aunt's warning about a one-legged man on the mountains, and they meet Yahyahaas,
    who offers a pipe that breaks when the elder brother smokes it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yaukiil has two servants, Gak and Gapni; Yaukiil and Gak are asleep while
    Gapni is awake and repeatedly announces that something fell in.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gapni is described as hearing even falling dust, and he says he can see and
    count everything in the world.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Gak hates Gapni, denies that anything fell in, and claims he can look through
    the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yaukiil lights a fire and searches; the elder brother changes into a man and
    stands before him, and the younger brother also stands up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yaukiil says Gapni did not lie, says Gapni sees and hears better than Gak,
    and declares that Gapni shall be chief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yaukiil proposes to play with the visiting brothers and grips their wrists;
    he is glad when he hears bones crack because he thinks he can kill the younger
    brother easily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder brother insists on playing before the younger brother, grips Yaukiil's
    wrists, breaks them, kills him, and tears out his arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The elder brother declares that Yaukiil will no longer be a person with arms
    but a bird with legs standing by water to watch the wind for dead fish.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The elder brother declares that Gak will no longer be a man but will fly in
    the air and among rocks, eating what hunters throw away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The elder brother declares that Gapni will no longer be the wisest man in
    the world but will live in people's heads, be cracked, burned, bitten, and wake
    people at night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The elder brother burns the dirt house and says Yaukul will have no home and
    will live everywhere in the world.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tohos, the brothers' aunt, has warned them that after passing Yaukul's house
    they will leave their own country and should travel at the foot of mountains because
    a one-legged man walks on the mountains.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The brothers travel east, cannot go around the mountains, and meet the one-legged
    man Yahyahaas on the first mountain.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Yahyahaas has a bushy head, red-painted face and body, an untanned elk-skin
    blanket that rattles, a straw quiver, and one leg, but he travels very fast.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Yahyahaas asks why the younger boy does not light his pipe, says travelers
    should have a pipe, lights his own pipe, and hands it to the elder brother; the
    pipe breaks on the elder brother's first whiff.
  category: sequence
  evidence_refs:
  - ev:12
