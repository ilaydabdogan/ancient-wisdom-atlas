canonical_text:
  quote: ''
  summary: In this passage, Kumush repeatedly follows and imitates Wanaga. A star
    wakes Kumush, who catches up to Wanaga during a woodchuck hunt. Kumush imitates
    Wanaga's hunting and dies after striking rocks, but after crows eat his body and
    leave only a disk, the morning star calls to him and he rises again. Wanaga creates
    a river between himself and Kumush, but Kumush crosses it. Wanaga uses animated
    sharp sticks to dig ges roots and later plants the sticks so that they become
    useful digging sticks for later people. Kumush attempts the same task with his
    own sticks but fails by checking too soon. Wanaga declares that he will be Wus-Kumush,
    leaves at night, and Kumush later travels east alone.
  language: English
  quote_policy: summarized
