canonical_text:
  quote: This is how old age came into our world.
  summary: Five brothers who kill those they meet challenge an old man and old woman
    identified as Komuchass, Old Age. They fail to harm the old man and flee. The
    old couple follows them; each brother becomes old and weak and dies. The passage
    explains this as the origin of old age in the world, and says Komuchass turned
    the brothers' bodies into five rocks still visible in Klamath country.
  language: English
  quote_policy: quoted
