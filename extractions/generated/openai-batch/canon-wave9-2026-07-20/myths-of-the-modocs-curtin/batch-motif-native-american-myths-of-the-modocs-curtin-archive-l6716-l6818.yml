canonical_text:
  quote: ''
  summary: A character list is followed by the beginning of a story in which Tsmuk's
    daughter sings about Wus. Wus cannot reach her because of darkness around Tsmuk's
    place, so he creates a root-gathering place, approaches her in the form of an
    old woman, causes night and sleep, builds a bright house around her, and appears
    as a young man. She has a child with fox ears; Wus transforms the child's ears
    into human ears and prepares mother and child to go home while Tsmuk's family
    searches for her.
  language: English
  quote_policy: summarized
