canonical_text:
  quote: ''
  summary: Tcuskai drinks water from caps; women fail to remove an arrow and head-fat
    until Maidikdak's daughters succeed. Several households claim him as son-in-law,
    but he enters Maidikdak's house. He wins foot races by running under the ground,
    kills all the deer on a mountain with one arrow, has a rapidly growing son, visits
    his brother Tskel, seeks reeds with tear-drops, and encounters the man-eater Sukas,
    who demands a wrestling match.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tcuskai drinks half the water from one cap and the other half after the younger
    sister offers him a cap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women cannot pull up the arrow until Maidikdak's daughters try; the elder
    pulls it halfway out and the younger pulls it all the way out and puts it in her
    basket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women cannot remove the fat from Tcuskai's head until Maidikdak's daughters
    are called; the elder loosens it and the younger takes it off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kowe tells her mother that Tcuskai drank from her cap, and old Kowe prepares
    a place for him as son-in-law.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other young women make the same claim to their mothers except Maidikdak's
    daughters; Tusasas prepares a place and boasts that Tcuskai is his son-in-law.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the village road, Blaiwas and other chiefs want to lead Tcuskai into their
    houses, but he goes only when old Maidikdak asks him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The village men are angry and race against Tcuskai; he runs under the ground
    and reaches the goal first in both directions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: During the return from the race, Kulta asks Tusasas to pull a sliver from
    his foot with his teeth; Tusasas fails and Kulta is carried home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When deer are driven to the mountain and Tcuskai is left alone there, he sends
    one arrow and kills all the deer on the mountain.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Maidikdak's daughter has a little boy who grows quickly and soon runs around.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tcuskai visits his brother Tskel; Tskel has a larger boy, and the two boys
    are described as like brothers.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Tskel asks Tcuskai to get reeds for arrows, specifically reeds with tear-drops
    on them.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Unable to find reeds with tear-drops, Tcuskai makes his own tears and drops
    them on reeds, swelling his eyelids.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Tcuskai tries to avoid the west side of the lake where Sukas lives, but because
