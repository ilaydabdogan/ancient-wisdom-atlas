canonical_text:
  quote: ''
  summary: Yahyahaas alone can enter Hwalis, where many women have been carried. Wihtitus
    and Govrwk seek to recover their wife and summon people to break the rocks around
    Yahyahaas' house, but the people fail. Tsasgips, Frost, a small overlooked man
    thought possibly to be a kiuks, is painted white and breaks five rocks by making
    a blowing noise with his mouth. The people kill Yahyahaas with arrows, but his
    spirit rises into the air and becomes Thunder; attempts to shoot the rising spirit
    miss.
  language: English
  quote_policy: summarized
