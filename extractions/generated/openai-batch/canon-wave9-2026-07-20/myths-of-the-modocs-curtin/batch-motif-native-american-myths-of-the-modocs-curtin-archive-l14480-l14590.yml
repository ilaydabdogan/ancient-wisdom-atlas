canonical_text:
  quote: ''
  summary: A boy repeatedly sings while asking his sister to watch their mother at
    a pond. The sister reports water and rain rising around the mother until she disappears.
    The boy is glad at the mother's death. The next morning he shoots his sister in
    the leg, tells her she is now a young woman, gives her rattles, and sends her
    to a spring to be taken in by Kowe for a five-night maturity dance. The girl grows
    taller on the way and becomes a young woman. Kowe discovers her by seeing a shadow
    in the water, calls her grandchild, brings her home, and arranges singing and
    dancing. Kowe then conceals the girl from outsiders who try to see her.
  language: English
  quote_policy: summarized
