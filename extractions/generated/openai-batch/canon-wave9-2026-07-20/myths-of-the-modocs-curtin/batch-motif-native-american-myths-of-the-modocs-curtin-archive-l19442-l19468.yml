  quote: ''
  summary: 'The passage closes the account of the five brothers, shifts attention
    to Gdukos, and summarizes episodes involving Giukos the moon: expulsion from his
    sister''s house, sudden growth into adulthood through a ravine, bright appearance,
    pursuit, and enormous strides across valleys and mountains to the house of two
    self-rejuvenating women. Notes identify Giukos'' sisters, compare Daylight figures
    in Wintu and Gaelic myth, and state that Gak''s spoken decree made L61uk become
    common fire.'
