canonical_text:
  quote: '"Hereafter you won''t have a person for a wife. You will be an animal."'
  summary: After an all-night fight, Lok tears off Kowam's head at daylight, but Kowam
    says he is ready to fight after the rising of another sun. Kowam shoots the Loks
    through the smoke hole, burns the house, and refuses to release his wife. Gahga,
    angered by this, pronounces that Kowam will become an animal. A voice from the
    fire, after the wife is dead, pronounces further future traits for Kowam and a
    little boy.
  language: English
