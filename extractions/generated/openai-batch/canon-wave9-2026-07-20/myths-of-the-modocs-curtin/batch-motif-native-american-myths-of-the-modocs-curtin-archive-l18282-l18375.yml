canonical_text:
  quote: ''
  summary: The passage introduces Djahdjai Grasshopper, Djihens Ant, and Wies Deer.
    A man has two wives, Djahdjai and Djihens, who go root-digging separately. Djihens
    gathers many roots, while Djahdjai spends time calling Wies with a love song,
    later stealing Djihens’ best roots and claiming them as her own. Djihens secretly
    follows Djahdjai, sees Wies come to her, and tells the husband, who initially
    suspects jealousy. The passage also notes worn moccasins, gendered mountain trails
    of the Wies people, and the husband’s loss of hunting success after Djahdjai falls
    in love with Wies.
  language: English
  quote_policy: summarized
