canonical_text:
  quote: ''
  summary: Yaulilik goes through a village asking who killed her daughters, receives
    deer meat, and is told by old Ndtikis that the man she sent them to killed them.
    Snow falls while she sings and disappears after she starts home. On returning,
    she finds her daughters have come back but remain tender-bodied; Cogatkis avoids
    speaking to them for fear they will die again. Later the younger daughter insists
    on going to Mlaiksi to gather seeds; the elder sister goes too. Cogatkis cries
    to accompany them, and through the power of his tied hair he can see them from
    Duilas while they gather seeds on the mountain.
  language: English
  quote_policy: summarized
