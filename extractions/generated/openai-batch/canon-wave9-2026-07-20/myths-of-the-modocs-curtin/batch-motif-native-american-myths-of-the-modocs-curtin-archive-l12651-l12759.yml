canonical_text:
  quote: ''
  summary: Wus leaves without farewell, meets and confronts Kfilta/Kiilta and a woman
    associated with Blaiwas, demands or contests possession of a white paint stone
    and the woman, transforms the woman into a common eagle and Kfilta/Kiilta into
    an animal, then departs on a long journey toward Tsmuk's daughter by the great
    water, arriving near a community whose day and night are inverted.
  language: English
  quote_policy: summarized
