- id: motif:3
  label: guarded powerful object refused in exchange dispute
  taxonomy_refs: []
  basis: Kfilta refuses to give half of the soft white paint stone because his father
    told him never to part with it, preferring to give the woman instead.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly say the stone has supernatural power,
    only that it can be painted with and is guarded by paternal instruction.
- id: motif:4
  label: woman treated as exchange object and resisting transfer
  taxonomy_refs:
  - sacred_exchange
  basis: Kfilta says Wus can have the woman, Wus tells her she must go with Kfilta,
    and the woman objects that Kfilta will never pay for her.
  evidence_refs:
