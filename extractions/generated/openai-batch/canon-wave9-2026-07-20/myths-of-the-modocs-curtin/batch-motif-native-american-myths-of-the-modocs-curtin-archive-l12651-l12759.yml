- id: motif:5
  label: deceptive denial of identity by a powerful pursuer
  taxonomy_refs:
  - trickster_boundary
  basis: Wus blocks or follows Kfilta, causes him to fall, is recognized as Wus, and
    denies being Wus while claiming not to know him.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports deception and boundary-crossing behavior, but it
    does not explicitly label Wus as a trickster.
- id: motif:6
  label: long departure to seek a distant singing woman
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: Wus announces he will be gone a long time to find out why Tsmuk's daughter
    sings about him, then journeys many days to the region of her house.
  evidence_refs:
  - ev:9
