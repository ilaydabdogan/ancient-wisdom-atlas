canonical_text:
  quote: ''
  summary: The excerpt lists Old Age and Sickness as characters, then narrates five
    brothers and their sister living alone on a mountain. The sister prepares for
    a maturity dance but lacks singers; her eldest brother prescribes walking, piling
    stones, and remaining awake five nights. She sleeps after four nights, dreams
    her brothers are diseased and starving, and later finds Sickness visiting the
    house. The brothers develop sores and starve while the sister keeps the fire and
    seeks food. At the end of the excerpt, a brother sees two swans on a nearby pond,
    and the sister tests the brothers' bows to try to kill one.
  language: English
  quote_policy: summarized
