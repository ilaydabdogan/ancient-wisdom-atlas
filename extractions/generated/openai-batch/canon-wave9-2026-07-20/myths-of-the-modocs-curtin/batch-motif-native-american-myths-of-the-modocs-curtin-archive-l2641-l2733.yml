canonical_text:
  quote: '"Maklaksum kako!" (Indian bones)'
  summary: In an underground house, spirits gather around Kumush's daughter, dance
    at night, and become bones at daylight. After eating food given by Wus-Kumush,
    the daughter becomes bones, while her spirit goes to Kumush. Kumush plans to leave
    the underground world by the eastern road and take selected bones upward to people
    the upper world. The bones repeatedly attack him and cause failed ascents, but
    on the third attempt he wishes for a strong cane and throws the basket of bones
    onto level ground, naming them Indian bones.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Spirits come from all sides, form a great circle around Kumush's daughter
    by the fire, dance and sing at night for five nights, and disappear at daylight
    to become dry, disjointed bones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wus-Kumush gives Kumush's daughter goose eggs and crawfish; after she eats
    them, she becomes bones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Newcomers become bones, but those tried for five years who do not eat what
    the Skoks give them live in shining settlements outside the big house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kumush's daughter's spirit goes to her father and later moves him to the eastern
    side of the house.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Kumush says he is going to the place where the sun rises, will travel on the
    sun's road to where the sun stops at midday, and will build a house there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wus-Kumush warns Kumush that some spirits are angry because he is not dead
    and want to kill him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kumush says the spirits cannot kill him permanently because they are his children,
    are all from him, and if they killed him he would come to life again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bones in Kumush's corner rise up and try to kill him, but he dodges them;
    each night spirits appear as living people and at daylight become disconnected
    bones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At daybreak Kumush takes his daughter's bones, selects other bones by their
    quality for different tribes, fills a basket with shin-bones and wrist-bones,
    and starts up the steep, slippery eastern road out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the first ascent the bones in the basket elbow Kumush in the back and neck,
    the basket falls near the top, and the bones become spirits who fall back into
    the big house and become bones again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the second ascent Kumush slips, his cane breaks, and he falls; again the
    bones become spirits and return to the big house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the third attempt Kumush wishes for a good strong cane and has it; after
    struggling with the attacking bones, he lifts the basket onto level ground and
    calls them Indian bones.
  category: sequence
  evidence_refs:
  - ev:10
