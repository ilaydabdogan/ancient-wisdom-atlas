canonical_text:
  quote: ''
  summary: Tciiskai goes to the spring for water for Tskel, but an old man blocks
    the spring and demands that Tskel come wrestle him because he is kin of the Lemeis
    people. After Tskel drinks and goes to the spring, the old man defeats him, wraps
    him in a skin blanket, assumes the form of a horned animal, and carries him under
    water and ground to a lake. The old man threatens to cut Tskel into pieces for
    his children to eat, but Tskel uses a hidden stone knife, kills the old man, and
    tricks the children into eating their father’s body. The children send dangerous
    objects to kill Tskel on his path home; he is injured by a stone knife but heals
    himself and returns home to mourners.
  language: English
  quote_policy: summarized
