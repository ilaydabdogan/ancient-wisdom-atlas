canonical_text:
  quote: ''
  summary: An old woman finds bones after seeing crows and speaks to the bones about
    the angry, watchful earth. The bones are carried down a mountain, and fires are
    built as signals of trouble. Kalaslakkas cannot be revived while his child lives;
    the mother wants the child killed, but Blaiwas refuses. The boy says his father
    will not return, declares that he will not die, will transform, live on the mountains,
    and kill many people. He becomes a tiny mountain-dwelling being who appears to
    doctors, kills with an unseen small arrow, and turns men into birds or creeping
    things.
  language: English
  quote_policy: summarized
