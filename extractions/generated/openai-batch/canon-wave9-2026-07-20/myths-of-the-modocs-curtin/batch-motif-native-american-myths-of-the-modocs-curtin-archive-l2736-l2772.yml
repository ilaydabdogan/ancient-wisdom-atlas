canonical_text:
  quote: ''
  summary: Kumush throws bones from a basket in different directions, naming tribes
    and assigning qualities to them. He instructs the people to seek power from mountains
    through swimming and dreaming, gives rules concerning doctors and medicine, names
    foods and other things into existence, assigns gendered work, then takes his daughter
    to the place of sunrise and travels on the sun's road to a house in the middle
    of the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A basket is opened and bones are thrown in different directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As bones are thrown, named tribes or kinds of Indians are addressed and assigned
    qualities.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The bones for the Modoc Indians are thrown last and are told they will eat
    what Kumush eats, keep his place when he is gone, and be bravest of all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each handful of bones is instructed to find power, including by sending men
    to ask the mountains for help, to become wise, brave, or doctors, and to swim
    in the gauwams and dream.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Instructions are given for killing a doctor judged to have tried to kill someone
    or to have failed to turn back a spirit with medicine; if an innocent doctor is
    killed, the killer must be killed or pay for the dead man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kumush names kinds of food, including catfish, salmon, deer, and rabbit, and
    more than two hundred things appear in rivers, forests, and flats as he names
    or thinks them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women are assigned to dig roots, get wood and water, and cook; men are assigned
    to hunt, fish, and fight, with this order stated for later times.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After finishing everything, Kumush takes his daughter to the edge of the world
    at the place where the sun rises, travels on the sun's road to the middle of the
    sky, builds a house there, and lives there.
  category: sequence
  evidence_refs:
  - ev:6
