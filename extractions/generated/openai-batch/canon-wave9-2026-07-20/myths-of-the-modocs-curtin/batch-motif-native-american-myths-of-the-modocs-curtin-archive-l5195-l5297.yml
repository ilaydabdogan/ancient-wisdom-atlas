canonical_text:
  quote: The heart flew north and became Mount Shasta
  summary: Tekewas tries to take Tutats with her and hastens sunset. Tutats escapes
    by leaving a log to keep her asleep. The five brothers attempt to ascend to the
    sky in a basket and web made by Kaltsik, but after the eldest looks down the web
    breaks and they fall. Tekewas and her mother fight as the brothers fall into the
    fire. Tutats is pushed into the fire, but his mother knocks out his heart, which
    becomes Mount Shasta; the other brothers' hearts become mountains.
  language: English
  quote_policy: quoted
