canonical_text:
  quote: '"Don''t kill me. I always bring good news."'
  summary: A woman discovers signs of hidden boys at her mother's house, but the old
    woman conceals and protects them. The elder boy wounds a speaking duck, which
    reveals that the boys' aunt killed their parents and wants to kill them; the aunt
    is said to move in duck form and to have long red hair as a woman. The boy grows
    as a hunter, receives arrows and a canoe, and later the boys encounter a red-haired
    head in the water at the aunt's swimming-place; the passage ends mid-action.
  language: English
  quote_policy: quoted
