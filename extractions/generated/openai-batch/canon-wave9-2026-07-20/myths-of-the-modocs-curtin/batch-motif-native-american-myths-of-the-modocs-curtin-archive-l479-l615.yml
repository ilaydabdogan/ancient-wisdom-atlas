canonical_text:
  quote: ''
  summary: The passage begins a Modoc myth about Latkakawas, her five brothers, and
    people living around Klamath Lake. Latkakawas prepares seeds at home while her
    brothers fish on an island. She appears as an old woman while working but becomes
    young, blue, and beautiful when she shakes herself and leaves the house; when
    people approach, she changes back into an old hunchback woman. Young men from
    the west side of the lake repeatedly try to approach or catch her and ask her
    to choose one as husband, but fail. She tells her eldest brother that the men
    watch, try to catch, and mock her. Her brother proposes that she go with the brothers
    to the island after she finishes gathering seeds. The passage also introduces
    a blue and beautiful young man kept by his father in an underground place, whom
    the western people suggest might approach Latkakawas; the father prepares him
    with clothing made from a wonderful indestructible cap.
  language: English
  quote_policy: summarized
