    so they would no longer be people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The sisters said they had little longer to live, that they did not care to
    remain in this world, and that even Wimanik would eventually die despite his bright
    skin.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The sisters said they would go away to live in the woods with good things
