canonical_text:
  quote: ''
  summary: The passage describes the Djaudjau sisters being frightened by snake dreams
    and waking snakes. Their father and brother leave. People gather in the lava bed
    country for a world council because new people are coming and the present people
    will be changed into other things. At the council, people discuss future forms,
    habitats, beauty, and whether anyone can become something that does not age or
    die. Wamanik, associated with a bright blanket or skin and anger over the sisters'
    refusal to marry him, says he will kill or change the sisters so they will no
    longer be people. The sisters speak of going away, predict Wamanik's degraded
    future, transform into flying squirrels, fly east, and expel snakes from their
    mouths and hearts; the scattered snakes explain why there are now many snakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whenever the sisters fell asleep they dreamed of snakes, and when they woke
    there were snakes around them; they were frightened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man told his father he wanted to visit his cousin Wulkutska and
    did not want to stay with his sisters; the father went with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother told the younger sister that the father and brother had gone far
    away because the sisters screamed, kept them awake, refused instruction, and trouble
    was coming.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: People from different villages moved toward the lava bed country for a great
    council after word spread that a new people was coming and the present people
    would be turned into other things.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The council was called so the present people could decide what they would
    become, where they would live, and which form would be nicest-looking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Old Djaudjau and his son attended the council, along with many named beings;
    the passage says all the people in the world were there.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two Djaudjau girls attended, but their brother would not let the little
    sister be with them, so the two girls wandered alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the council, people discussed whether anyone was powerful enough to become
    something that would never get old and would live after the rest were dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: People said the Djaudjau sisters were good-looking but pale and sick-looking;
    Wulkutska's daughter said the man with the bright blanket caused this because
    they would not marry him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Lok said he would live in the mountains, raise children, and have many kin;
    Wiskak said he and his kin would be birds, move from place to place, and harm
    nobody.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some council participants said they would go east to where the sun comes up
    after changing, while others said they would stay in their own country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Djaudjau daughters felt sick and believed Wamanik was killing them; their
    father sent Kekina to tell Wamanik that they would go to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Wamanik laughed and said he would not let the sisters go a second time, did
    not want them, would kill them, and that they would not be persons much longer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Midikdak's daughter cried for the sisters and said Wamanik had killed people
