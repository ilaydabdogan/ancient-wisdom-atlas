canonical_text:
  quote: ''
  summary: A man and wife leave their little boy at home while hunting. A fog-associated
    Skoks woman calls to him; he screams and dies. Old Koe treats the body with ashes
    and coal, calls her Skoks, explains that the child's spirit has followed the first
    Skoks, and sends her Skoks to bring it back. The child revives and describes the
    Skoks. Koe refuses offered valuables, saying she wants only to bring back as many
    spirits as she can.
  language: English
  quote_policy: summarized
