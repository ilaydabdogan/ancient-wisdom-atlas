canonical_text:
  quote: ''
  summary: The excerpt opens the tale titled “The Star Brothers” with a character
    list and then describes Tekewas, sister of five brothers, remembering and seeking
    her youngest brother Tutats. Her mother has hidden Tutats under the ground in
    a bark basket and evades Tekewas’s questions. Tutats is taken to swim in the river
    and loses a bright hair, which Tekewas later finds. The older brothers fear Tekewas,
    while Skola watches. Tekewas then brings moccasins and asks that one brother accompany
    her to get Kulta’s beads, rejecting the older brothers and insisting on Tutats;
    the passage ends mid-exchange.
  language: English
  quote_policy: summarized
