canonical_text:
  quote: ''
  summary: Wewenkee says sickness will now spread everywhere, is warned about as a
    chief of sickness and bad medicine, gathers some released sickness with a soft
    bark ball, and explains that sickness belonged to N6baks and was only loaned.
    Much sickness has scattered or soaked into the ground. Keis keeps two teeth for
    poison medicine and says he may kill people by throwing sickness, while Wewenkee
    urges him to put sickness away until the earth permits its use. Wewenkee also
    speaks of skin renewal, doctors, mountain swimming ponds, night travel, and future
    dwelling under rocks and in holes.
  language: English
  quote_policy: summarized
