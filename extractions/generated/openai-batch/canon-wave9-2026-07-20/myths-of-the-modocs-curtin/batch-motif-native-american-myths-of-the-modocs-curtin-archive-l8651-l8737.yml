canonical_text:
  quote: ''
  summary: Kulta goes to old Kuja's house and is killed by the sisters there. The
    youngest sister, identified as Kulta's wife, mourns him and arranges for others
    to think he is still alive. She displays power by restoring a broken bow. Later,
    after Galaiwa asks why she does not revive Kulta, the wife has her mother put
    Kulta's body in water. The old woman washes the body and steps over it repeatedly
    until Kulta rises alive. Kulta's wife then declares that her sisters and their
    husbands will become spirits roaming on the mountains.
  language: English
  quote_policy: summarized
