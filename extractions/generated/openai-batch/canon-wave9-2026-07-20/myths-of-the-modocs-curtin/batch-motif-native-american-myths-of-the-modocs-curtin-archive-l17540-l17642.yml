canonical_text:
  quote: ''
  summary: The passage opens with a character list for the tale. In the narrative,
    two small Nanihlas brothers live with their sister, try to kill a trapped deer
    without damaging its skin, are dragged through brush, recover and mend their torn
    clothing, quarrel and reconcile, frighten root-gathering women with a staged fight
    and face-rubbing with burnt fungus, take the abandoned roots, and then set out
    to visit their married sister across Klamath Lake while planning to provoke a
    fight and steal property.
  language: English
  quote_policy: summarized
