canonical_text:
  quote: ''
  summary: Two brothers hunt ducks on a lake while Tekewas, their aunt, repeatedly
    rises to their canoe and nearly overturns it. The elder brother conceals the danger
    from their grandmother, prepares with a sharp knife, decapitates Tekewas, hides
    her body in a deep rocky place in the water, and declares her reduced state. Her
    spirit becomes an ugly bird, and the black water is identified as her blood. The
    boys then conceal the head under ducks, instruct household and natural objects
    not to reveal their departure, descend into the ground near the fire, cover the
    hole with a coal, and head east while voices from the wood, fire, and house misdirect
    the grandmother.
  language: English
  quote_policy: summarized
