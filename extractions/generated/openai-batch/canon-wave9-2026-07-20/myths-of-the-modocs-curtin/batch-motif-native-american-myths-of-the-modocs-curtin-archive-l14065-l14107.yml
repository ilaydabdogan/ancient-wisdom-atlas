canonical_text:
  quote: ''
  summary: A little sister causes her sister to sleep on an island, changes a tula-grass
    spear into a canoe, removes a string of hearts from the sister's neck, and beheads
    her. The sister revives when the head returns to the body. The little sister throws
    ashes toward the island and declares that the sister will no longer burn people
    but will live in water; the sister becomes a large spotted sea bird. The little
    sister then restores houses and revives dead people from bones placed in a basket
    of boiling water; the family and community are alive again.
  language: English
  quote_policy: summarized
