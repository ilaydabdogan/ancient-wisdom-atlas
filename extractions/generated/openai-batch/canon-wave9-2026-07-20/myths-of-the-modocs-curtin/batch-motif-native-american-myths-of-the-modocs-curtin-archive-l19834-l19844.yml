canonical_text:
  quote: ''
  summary: The excerpt introduces Tskel and Tctiskai as recurring brother figures.
    Sk6<iks is Tskel's wife, while Tctiskai is described as small, mischievous, and
    inquisitive. Tskel punishes Tctiskai for giving a blanket to Gopher, identified
    as North Wind, by hiding water. Tctiskai finds the water and begins drinking it;
    the passage says that if he had drunk it all there would be no water in the world.
    Tskel then makes a cap from the skin of Gopher's head, wears it to Thunder's house,
    and kills five brothers. Tctiskai is also said to be small enough to camp in a
    woodpecker's hole.
