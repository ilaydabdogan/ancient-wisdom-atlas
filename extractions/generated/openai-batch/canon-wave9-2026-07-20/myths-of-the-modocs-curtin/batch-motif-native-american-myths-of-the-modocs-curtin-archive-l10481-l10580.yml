canonical_text:
  quote: ''
  summary: The passage introduces Lok Bear and a winter household in which an old
    woman controls stored roots. Before food is eaten, she gives roots and words to
    fire, mountains, trees, the house, posts, and springs. She stores roots and wood
    for winter, covers her face and eyes with cedar gum, lies by the root hole, rations
    food to the hungry children while eating roots at night, interprets weather signs,
    and arouses her daughter's fear that she may want to kill and eat the children.
  language: English
  quote_policy: summarized
