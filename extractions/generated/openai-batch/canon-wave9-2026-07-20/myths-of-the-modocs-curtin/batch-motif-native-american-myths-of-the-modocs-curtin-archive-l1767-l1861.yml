canonical_text:
  quote: ''
  summary: Gaukos enlarges a house by thinking and plans to live away from Loluk and
    Dunwa, who know his thoughts. He returns with Dunwa's daughters, hunts deer, and
    sends loaded baskets of meat and bones back toward their parents. The baskets
    walk in line until old man Gak sees them and declares that baskets will no longer
    walk, turning them to stone. Gak also turns the two sisters into rocks, changes
    Dunwa's status, and makes Loluk common fire. Gaukos learns of his wives' transformation
    when his bowstring breaks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gaukos says he has two wives, wants a house large enough for all, and fears
    living with Loluk and his mother-in-law because they know his thoughts; after
    he thinks hard, the house becomes large and full of nice things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Loluk's house, Loluk and his wife do not know what Gaukos says aloud but
    know what he thinks; the elder sister conveys his spoken words to her mother in
    thought.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dunwa states that married daughters no longer belong to their parents' house
    but to another house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gaukos kills ten deer each day for ten days and kills many more on the eleventh
    day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girls dig roots daily, put them into baskets of different sizes, arrange
    the baskets in a row, and the old woman places a cap on the largest basket.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Gaukos and the two sisters leave, all the baskets follow them, with the
    capped basket going ahead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gaukos gives the second basket, filled with sweet roots, to the woman who
    had turned him into a baby and saved him from his sister.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After returning home, Lisgaga stores the roots and puts up the baskets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gaukos hunts deer for ten days, killing twenty each day, and places bones
    in the largest capped basket while placing livers and meat in the other baskets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gaukos instructs the elder sister to take the baskets to her father and mother,
    making the journey in one day without camping.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The baskets follow the elder sister, walking one behind another; the younger
    sister later catches up and walks behind them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old man Gak sees the walking baskets, is frightened, declares that baskets
    will not walk again and that people will carry loaded baskets on their backs,
    and the baskets turn to stone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gak tells the sisters they will no longer be living women but rocks staying
    on the trail.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Gak tells Dunwa she will no longer be great and that later people will pound
    roots on her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Gak tells Loluk that he will be kin to no man and will burn all alike; as
    Gak speaks, Loluk becomes common fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When Gaukos' wives are turned to stone, his bowstring breaks and he immediately
    knows what has happened.
  category: sequence
  evidence_refs:
  - ev:9
