canonical_text:
  quote: ''
  summary: The passage introduces Wus, a Fox, his mother, Djaudjau the Flying Squirrel,
    and a Butterfly girl. Wus and his mother live at Wusnesee near a spring at the
    foot of a high mountain. Wus, though middle-aged, asks about mountain swimming
    ponds. His mother says such places are for young men seeking to become great gamblers
    or doctors and repeatedly says he is too old. Wus secretly loves a Butterfly girl
    seen near the spring. He insists on going and asks that Djaudjau make holes in
    his ears and nose. His mother says the earth and mountains will not listen to
    him; Djaudjau says it is too late but allows that he may try.
  language: English
