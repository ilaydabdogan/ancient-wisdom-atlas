canonical_text:
  quote: ''
  summary: A girl encounters a speaking voice associated with a mountain. She sinks
    into the earth so that only one eye is visible, addresses the voice as bad, emerges,
    applies black paint, and orders the speaker to go far away on the mountain. Because
    he cannot leave unless he looks at her, she invites him to look at her. When he
    does, he becomes red like her; she declares that she is a spirit and that he will
    hereafter be a spirit. The two spirits will sometimes help each other and will
    live always.
  language: English
