canonical_text:
  quote: ''
  summary: Kalaslakkas agrees to play in a gambling contest for Blaiwas, refuses clothing,
    and asks for a special ground entrance. Tusasas mocks him and is repeatedly expelled
    or driven away. Kalaslakkas wins games, sings an unlearnable song from the swimming
    place, imposes food restrictions during the contest, receives ritual advice from
    his grandmother, and attributes a victory formula to his swimming place. By the
    end, Kumal's people have lost everything, and Old Kletcowas and his sons are ashamed.
  language: English
  quote_policy: summarized
