canonical_text:
  quote: ''
  summary: Kalaslakkas follows his grandmother's instructions to dive, swim, climb
    mountains, pile stones, undergo ear and nose marking, sweat bathing, fasting,
    and dream encounters with water-place beings and petrified gambler brothers. He
    returns transformed into a young man, while Tusasas mocks the effort and is rebuked
    by the grandmother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandmother instructs Kalaslakkas to dive in a pond, swallow water five
    times, avoid other water, and listen to the earth, mountains, and swimming places
    for instruction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first pond, Kalaslakkas feels a water-dwelling bear beneath him, hears
    a bird belonging to the swimming place, dreams of a thunder-like bear roar, and
    runs home afraid.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandmother feeds Kalaslakkas pounded seeds and white roots, sends him
    over a southern mountain toward a lake, tells him to pile stones, pierces his
    ears and nose with black sticks, and talks to the earth as he leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kalaslakkas hears a girl singing and dancing a maturity dance on the mountain
    and changes trails so that she will not see him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a lake, water noise comes from rocks that resemble men in elk-skin coats;
    a mass of long black hair floats toward Kalaslakkas, and five Peltoquas brothers
    are identified as having been turned to stone by Komlichass.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kalaslakkas dreams that a long-haired man says he was once a strong man who
    was never beaten at gambling.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After another return, the grandmother steams and bathes herself, watches for
    Kalaslakkas, and barely recognizes him because he has become a young man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The grandmother uses fire, hot stones, sweating, and red sticks in Kalaslakkas's
    ears and nose, then says his next mountain journey will be the last and offers
    him to the earth as one who wants to learn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kalaslakkas piles stones around a swimming place until they stand like people,
    sees stars reflected deep in the water, and thinks there are people below with
    torches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Five Kai brothers are said to have been turned to rock; Kalaslakkas rubs against
    each rock and dreams of the brothers dressed in buckskin with feathers and gambling
    plates.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the dream, the eldest Kai brother says they will give Kalaslakkas what
    they have if he wants to be their brother, and Kalaslakkas thinks they throw him
    a long feather and a gambling plate.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After Kalaslakkas returns, the grandmother makes a sweat-house, heats rocks,
    bathes and sweats him, dresses him, and tells him not to touch food for five days.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The grandmother says Kalaslakkas must give himself to the earth; she warns
    that eating meat or fish at that time will shorten his life.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tusasas comes to the grandmother's house, mocks the idea of traveling over
    mountains to grow up for a woman, and is rebuked by the grandmother as someone
    who talks and boasts.
  category: speech
  evidence_refs:
  - ev:10
