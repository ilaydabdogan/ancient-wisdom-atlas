canonical_text:
  quote: ''
  summary: A starving young wife is left by the youngest brother and sent to Djaudjau,
    whose mother recognizes and feeds her. Kuja and his mother claim the girl, but
    Djaudjau's mother disputes them and orders Djaudjau to kill Kuja. Djaudjau shoots
    Kuja and declares that he and his kin will cease to be persons and become thieving
    rats who make stick houses. Later the woman bears a baby, tells Djaudjau about
    her jealous brother killing her mother, and travels with him back to her former
    home, where she finds her brother living poorly as a hunter.
  language: English
  quote_policy: summarized
