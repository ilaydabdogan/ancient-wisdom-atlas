- id: obs:4
  text: Kumush tells Isis to go to the top of Liniswi, swim in a blue-water pond,
    pile up stones, speak to the mountain, dive five times, drink the lowest water,
    build a fire, sleep, keep any dream secret, and return without speaking or drinking
    water.
  category: speech
  evidence_refs:
