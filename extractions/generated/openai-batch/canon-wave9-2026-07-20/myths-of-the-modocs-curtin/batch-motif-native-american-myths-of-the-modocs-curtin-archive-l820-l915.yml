canonical_text:
  quote: ''
  summary: The passage recounts the arrival and petrification of Tokwa and the Mowatwas,
    along with Kumush and Isis, whose spirits come out and become men again. Kumush
    then instructs Isis in a series of mountain and water rites involving speaking
    to mountains, diving in ponds, drinking deep water, building fire, sleeping, keeping
    dreams secret, maintaining silence, making a willow-bark rope, entering a whirlpool,
    and seeking mind and power from another mountain.
  language: English
  quote_policy: summarized
