canonical_text:
  quote: ''
  summary: A woman returns to her father's house with Wus's child. Tsmuk rejects the
    connection to Wus and throws out the child after Wus makes it fox-like. Wus then
    makes his wife old, but the child is brought back by her brother, after which
    she grows younger and the child appears human again. The sister describes Wus's
    powers of transformation and his bright house. She and her brother follow Wus's
    reed music to his house, where Wus welcomes the brother-in-law and gives him clothing.
    Wus later wants to go to Tsmuk's house, where Tsmuk remains hostile.
  language: English
  quote_policy: summarized
