canonical_text:
  quote: ''
  summary: The passage opens with a place-name declaration, then follows Pitoiois'
    brothers as they seek a woman or wife. They encounter Kfllta and other water-dwelling
    beings, return to their sister, then depart north after a white eagle feather
    omen is set on a nephew's head. The feather falls after they leave. The brothers
    meet Wus, who identifies them as Pitoiois' brothers, curses them to become birds,
    makes night come quickly, and leaves them separated and wandering alone.
  language: English
  quote_policy: summarized
