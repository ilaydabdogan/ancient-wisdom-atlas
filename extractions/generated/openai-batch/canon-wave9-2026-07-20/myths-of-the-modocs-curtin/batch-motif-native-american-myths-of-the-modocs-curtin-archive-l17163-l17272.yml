- id: obs:2
  text: On the south side of Klamath Lake, the brothers meet old man Kfllta, who says
    his children are on an island, he makes deep holes under water for them to watch
    fish, and his daughter travels on trails under the water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers climb a high mountain, find a lake near the top, and meet another
