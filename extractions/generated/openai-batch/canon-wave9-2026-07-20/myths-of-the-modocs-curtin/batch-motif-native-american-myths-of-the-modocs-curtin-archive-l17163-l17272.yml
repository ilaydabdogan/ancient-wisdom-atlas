  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pitoiois says there are no women nearby except far away in the north; the
    elder brother mourns on a mountain and decides to go north with his brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The elder brother's medicine is the feather of a white eagle, which he puts
