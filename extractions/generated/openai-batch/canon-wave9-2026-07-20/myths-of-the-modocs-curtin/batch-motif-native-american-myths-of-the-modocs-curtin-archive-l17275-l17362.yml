canonical_text:
  quote: ''
  summary: In the tale opening, Kulta's wife warns her grown brother that her husband's
    place is dangerous because people serve snake and frog heads and hostile women
    may kill him if he refuses to eat. She tells him to prepare tula straw balls as
    protection, but when a dish of snake heads is served he freezes. Kulta's sisters
    mock and threaten him. He gives them bone scratchers with a counter-threat. His
    sister then gives him beads, bow, and arrows for the journey home; as he travels
    with his pet wolf, his burdens repeatedly become heavy and he discards valuables,
    some recovered by the wolf and by his following sister.
  language: English
  quote_policy: summarized
