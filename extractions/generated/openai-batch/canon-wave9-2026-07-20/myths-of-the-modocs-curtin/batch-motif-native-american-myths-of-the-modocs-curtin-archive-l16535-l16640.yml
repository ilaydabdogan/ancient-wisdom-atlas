canonical_text:
  quote: ''
  summary: Pitoiois gathers, pounds, and washes roots while her brothers try to guard
    her. Wus watches from or near a mountain, follows her, sings to make the brothers
    forget her, lengthens a square flat, and multiplies roots so her work lasts all
    day. The brothers feel as if they are losing their minds, warn Pitoiois not to
    sleep, later hear a beautiful song, and the younger brother forms a desire for
    a wife because Wus has put the thought in his mind. The brothers depart north
    and reach Kahkaas's house.
  language: English
  quote_policy: summarized
