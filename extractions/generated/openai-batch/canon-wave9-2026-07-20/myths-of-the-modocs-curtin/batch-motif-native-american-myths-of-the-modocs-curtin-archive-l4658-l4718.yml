canonical_text:
  quote: ''
  summary: Tcoitcak, identified as a bird, carries a large pack near the house of
    the brothers Tcfiskai, a weasel, and Tskel, a mink. Tcfiskai pesters Tcoitcak
    to reveal the pack contents, then opens small bundles from it. Darkness spreads
    over the world, stars come out, and the pack is said to contain twilight, daybreak,
    named stars, times of day and night, clouds, rain, and snow. Tcfiskai becomes
    lost in the darkness. Tskel cuts a hole in the darkness with a flint knife pointed
    eastward to let light in. The passage explains long, dark winter nights by Tcfiskai's
    long running in the darkness.
  language: English
  quote_policy: summarized
