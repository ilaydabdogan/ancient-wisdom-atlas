canonical_text:
  quote: ''
  summary: The passage identifies Tsmuk/TsmtJc with darkness and Idnika with Twilight,
    describes Wus as a powerful deceiving trickster who transforms Tsmuk into a black
    cloud/darkness, and includes an editorial comparison of Wus with an unnamed Pacific
    coast warm-light deceiver. A following synopsis of 'Frost and Thunder' recounts
    repeated thefts of Gowwi's wife by Wus, the Lok people, and Yahyahaas, followed
    by an attempted rescue in which strong people fail to break rocks but the small
    Tckumhtls/Tsasgips succeeds by blowing on them.
  language: English
