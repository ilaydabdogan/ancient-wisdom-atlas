canonical_text:
  quote: ''
  summary: The passage introduces Gahga and his brother. The elder brother is blind
    but is a doctor who can see by means of his medicines. A man invites them to help
    at a deer drive using bark ropes tied between trees. The elder brother sends his
    wife with his brother while he stays by the fire with their little boy. Using
    medicine, he watches them remotely, becomes jealous when he sees them fond of
    each other, and later rejects food his wife prepares from a fawn brought home
    from the hunt. She prepares to go again the next day.
  language: English
  quote_policy: summarized
