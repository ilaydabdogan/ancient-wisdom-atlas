canonical_text:
  quote: ''
  summary: A Skoks removes a boy's heart and carries it westward, then releases it;
    the boy revives as a young man and returns to his sister. He begins experiencing
    the Skoks as his medicine, receives ritual support from his sister and old men,
    is associated with multiple medicine spirits and prescribed ritual objects and
    taboos, and then cures a dying man by preventing his life from leaving his body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Skoks pulls out the boy's heart, and the boy falls, bleeds from the mouth,
    and loses consciousness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Skoks carries the heart through the air to the place where the sun goes
    down and holds it in a closed hand while speaking and laughing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy lies as if dead, but his spirit hears the Skoks talking to his heart.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the Skoks releases the heart, the boy perceives a bird coming from the
    west; it lights on his breast, and he rises as a young man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man's sister initially does not recognize him and asks what changed
    him.
  category: speech
  evidence_refs:
  - ev:5
