  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sister hesitates because the first person who sings for a doctor must
    always go with him and sing for him, but she sings after he asks again.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Each evening the young man calls out as the Skoks called, falls senseless,
    and remains that way until the Skoks finishes talking to him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The young man reports seeing a crowd of medicines around him that want someone
    to sing and talk for them.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Old men come, sing, and tell the medicine spirits not to make the young man
