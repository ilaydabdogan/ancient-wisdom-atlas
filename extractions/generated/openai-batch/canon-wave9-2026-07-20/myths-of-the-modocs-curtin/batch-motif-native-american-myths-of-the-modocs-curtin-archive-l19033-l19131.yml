  text: The young man tells his sister that he saw a tall woman with a large pack
    of old ragged mats on her back.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sister identifies the encounter as involving a Skoks and asks why he came
    so far alone.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The young man becomes sleepy because the Skoks is coming again and is going
