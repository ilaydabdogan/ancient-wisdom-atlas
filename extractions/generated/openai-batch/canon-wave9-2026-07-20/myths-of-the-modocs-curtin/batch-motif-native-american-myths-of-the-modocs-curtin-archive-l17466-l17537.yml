  evidence_refs:
  - ev:6
- id: obs:7
  text: A big rattlesnake springs at the woman while she pokes in the ashes; Kulta
    hears its rattle, strikes it with a long pole, and it runs away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The woman vomits pieces of snake skin, fish skin, and snake heads; Kulta comments
