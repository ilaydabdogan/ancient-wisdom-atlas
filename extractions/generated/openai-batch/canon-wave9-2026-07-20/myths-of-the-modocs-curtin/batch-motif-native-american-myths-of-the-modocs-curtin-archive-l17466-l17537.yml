canonical_text:
  quote: ''
  summary: The passage begins with a fragmentary instruction that an unidentified
    addressee will be medicine for doctors. After the Head is drowned, the sister
    or wife returns to Kulta. Kulta reports that his sisters died after scratching
    away their flesh. He burns their bones and sacks of dried snake and frog heads;
    some revived snakes escape, explaining why many snakes exist. A rattlesnake attacks
    the woman near the ashes; after vomiting snake and fish material, she kills it
    and declares that rattlesnakes will reveal themselves and be killed, but their
    heads will not be eaten. Kulta and then his wife try to bring back the crying
    Ilyuyu from the mountains, but Ilyuyu evades them and finally runs away into the
    mountains, where he is associated with killing deer.
  language: English
  quote_policy: summarized
