canonical_text:
  quote: ''
  summary: Two brothers, Kumush and Wanaga, live east of Tula Lake. Wanaga goes northwest
    to hunt woodchucks, kills five, and cooks them. Kumush arrives at the fire, questions
    Wanaga, then goes into bushes, pulls out all his body hair, commands the hairs
    to become people and chase him, and calls for Wanaga to save himself. Wanaga takes
    his bow and arrows, flees, and leaves the woodchucks behind.
