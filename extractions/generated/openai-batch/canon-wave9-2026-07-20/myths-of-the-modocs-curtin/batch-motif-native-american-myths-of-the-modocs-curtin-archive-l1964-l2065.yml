canonical_text:
  quote: ''
  summary: Isis returns with deer while Kumush has been playing a flute and has misled
    Yaulilik's daughters. After Isis sends Kumush outside with the young women, the
    daughters scratch Kumush until only bones and a disk remain. Isis creates a deep
    river by shooting an arrow into a mountain, kills the daughters, and throws their
    bodies into the river. Yaulilik recovers the daughters' heads and bodies from
    a fishing net, places them with Cogatkis in a heated sweat-house under a command
    of silence, and travels singing a snow song to ask Blaiwas who killed them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man plays a flute while people hear a song announcing that Isis is
    coming, creating disagreement between the sisters over the old man's identity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isis comes in with his belt full of deer, finds the younger sister sitting
    in his place, prepares meat, and feeds the girls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isis tells Kumush to remove his clothes and then sends him outside with the
    young women, giving him a mat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sisters hold Kumush down and scratch him with bone head-scratchers until
    only bones and a disk remain; Isis hears him scream but does not help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Isis shoots an arrow through the air; it strikes and splits a mountain, and
    a deep, wide river comes through the opening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The river prevents the sisters from crossing; Isis catches the elder sister
    by the hair, cuts off her head, kills the younger sister, and throws both bodies
    into the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After killing the sisters, Isis goes to Mlaiksi, identified in the passage
    as Mt. Shasta, lies on the mountain top, and cries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yaulilik and Cogatkis find the heads and bodies of both daughters floating
    into a fishing net in the river Isis made.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Yaulilik makes a sweat-house, builds a big fire, places the two heads and
    two bodies in a basket, puts the basket and Cogatkis in the sweat-house, wraps
    Cogatkis so he cannot move, and tells him not to answer or speak to his sisters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yaulilik travels to Blaiwas' village to ask who killed her daughters; while
    traveling she sings a snow song that brings a snowstorm, and the snow stops when
    she stops singing.
  category: action
  evidence_refs:
  - ev:8
