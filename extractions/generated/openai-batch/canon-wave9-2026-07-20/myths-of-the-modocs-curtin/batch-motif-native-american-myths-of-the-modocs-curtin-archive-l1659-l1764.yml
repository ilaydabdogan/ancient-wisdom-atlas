canonical_text:
  quote: ''
  summary: In this Modoc myth passage, Gaukos' sister mistakes or treats the father-fire
    as ordinary fire, attacks one of the daughters, is disabled and swallowed by Old
    Loluk, and is then declared transformed into a bird. Gaukos is accepted as son-in-law,
    hunts deer for the household, learns the special diet of his in-laws, dries extra
    meat on a tree he sets up, stays ten days hunting, and then returns toward home,
    where Lisgaga is engaged in a maturity dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The daughters object when Gaukos' sister scratches their father's face; the
    passage identifies this father as not a common fire.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gaukos' sister attacks the elder daughter, and the younger daughter pulls
    her back by the hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dunwa rolls onto the attacking girl and breaks her legs; the sisters throw
    the girl into Old Loluk's mouth, and he swallows her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder sister says the swallowed girl will no longer be a person, but a
    bird that lays eggs in cedar-tree holes and is edible to people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Loluk calls Gaukos out of hiding, places him between his two daughters,
    and Dunwa brings him seeds because he is now her son-in-law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gaukos asks for a bow and arrows; he rejects the elder sister's bow-string
    and accepts the younger sister's bow-string.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The elder daughter follows Gaukos to show him where deer are, and Gaukos kills
    multiple deer, including two with one arrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The daughter explains that she and her sister kill ten deer each day; their
    mother eats all the bones, their father eats meat and livers, and both parents
    know thoughts directed toward them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gaukos gives livers to Loluk and bones to Dunwa; the sisters cook meat on
    their father's face without injuring him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gaukos pulls up a large tree and sets it in the ground so meat can be hung
    on its branches to dry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gaukos stays ten days hunting, then travels home; during the return he says
    Loluk ate his sister, hears Lisgaga's maturity dance, and later reaches home where
    Lisgaga is glad to see him.
  category: sequence
  evidence_refs:
  - ev:8
