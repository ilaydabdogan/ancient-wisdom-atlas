canonical_text:
  quote: ''
  summary: A young man discards clothing, limbs, and body until he becomes a fast-moving
    Rolling Head. At the river by his home, he calls for his mother, then flies across,
    kills people, and eats his mother. His sister witnesses this and warns the village.
    Two old women prepare a tight basket and waxed hands, deceive the Head into entering
    the basket, drop it in the river, and the people keep it from shore until it sinks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man removes and throws away a moccasin, a belt, a beaded shirt,
    and beaded leggings; Ilyuyu tries to carry some discarded items and cries when
    called onward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man pulls off his arms and legs, becomes only a body and head, then
    loses the body and remains only a head; his sister places one discarded arm in
    her basket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The remaining head is named Ntisdilausniyas, described as Rolling Head, able
    to travel fast, cross a mountain at a bound, roll in the air, and having big eyes
    and long hair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the river near home, the Head calls for his mother to take him across;
    when she does not come, he flies across, enters the house, strikes people, and
    kills them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sister crosses the river by canoe, looks through the smoke hole, sees
    the Head eating her mother’s body, and runs to warn the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ilyuyu sees his master as a great bloody Head, becomes afraid and distressed,
    and runs crying into the mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two oldest women tell the village people to paint their faces with cedar-tree
    pitch and be strong; they make a tight basket and wax their hands so they can
    hold the Head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The old women persuade the Head to enter the basket by saying they will carry
    him across properly and care for him, while the Head worries that they may throw
    him into the river.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The old women drop the basket containing the Head into the river while still
    in midstream; people push it away from shore with long poles until it fills with
    water and sinks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the basket sinks, the old women say that the world was not made for
    such things as the Head.
  category: speech
  evidence_refs:
  - ev:10
