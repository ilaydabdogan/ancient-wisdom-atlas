canonical_text:
  quote: ''
  summary: Skakas and Nada compete to obtain Isis as a husband by fetching water.
    Nada's water is accepted, while Skakas is killed by Kumush and becomes rocks in
    a lake. Kumush and Isis travel, leave fishing implements that turn to stone, and
    Kumush establishes fish abundance in rivers. At Blaielka, Kumush instructs Isis
    to swim, pile stones, and speak to the mountain; Isis sees gambling sticks in
    the water, is seen by Gak, and is turned to stone while his spirit escapes. Kumush
    later leaves Isis, returns with seeds, commands landscape places to preserve them
    and protect his grandson, then falls in love with Isis's wives and begins plotting
    to get rid of Isis by sending him for eagle feathers.
  language: English
  quote_policy: summarized
