canonical_text:
  quote: ''
  summary: Goshgoise reaches his aunt Skola and old Juljulcus's daughter, is warned
    about a deadly brother and bones of earlier suitors, defeats the brother with
    Mole's help, and declares the defeated being will become a cricket. He then receives
    guidance from old Juljulcus for a journey toward a dangerous ocean-side village,
    exchanges lightning spears, reaches a mountain, addresses features of the landscape,
    and approaches a fire-lit village where people are killing one another.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skola recognizes Goshgoise as her nephew, asks how he passed the five Kaudokis
    brothers, and Goshgoise says he killed them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skola warns Goshgoise not to go to old Juljulcus's daughter and points to
    a pile of bones from men who had come for the daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wind begins to blow, and Skola says that the daughter's brother knows
    Goshgoise is there and is coming to kill him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women call Skola Two-Tongued because she can talk two ways.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Goshgoise catches hold of old Juljulcus's daughter, draws her down, and puts
    his head on her knees; she is frightened and says her brother will kill any man
    who falls in love with her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The daughter's brother comes in a whirlwind, wearing a rattling blanket made
    from dried human skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The daughter bends over Goshgoise to save him, and Goshgoise tells Mole to
    dig a large hole near him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Juljulcus's son lifts his spear to strike, he falls into the hole Mole
    made, and Goshgoise kills him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Goshgoise declares that the defeated being will afterward be small and weak,
    a cricket living near roots, seeds, and dried roots stored underground.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Juljulcus's spirit comes out as a cricket and jumps on Goshgoise when the
    girl steps over her brother's body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Old Juljulcus tells Goshgoise that bad people live near the ocean and instructs
    him to reach their village after dark, not in daylight.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Goshgoise tells his father-in-law and the women to go to his grandmother's
    place, described as on the other side of the world in the south.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Old Juljulcus's spear is described as little lightning; Goshgoise gives his
    long lightning spear to his father-in-law and takes the old man's spear.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Goshgoise's wife gives him seed to eat on the road before the group starts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the top of a mountain, Goshgoise finds a spring and speaks to the spring,
    earth, trees, and rocks, asking them not to hurt him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: From the mountain Goshgoise sees an ocean-side village with smoke from many
    houses; after he sees the smoke, the sun goes down.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: In the village, people carry lighted torches, look like lightning bugs throwing
