canonical_text:
  quote: ''
  summary: Goshgoise kills people and burns houses with a lightning spear, then goes
    to Tsmuk's house, where a brilliant ball of light is kept. Tsmuk's family fears
    the stranger and his red lightning. Goshgoise says he has come for Tsmuk's daughter
    and will take her north to his grandmother. He sends lightning through the house
    to the sky as a signal, gives his spear to Tsmuk as payment for the daughter,
    and Tsmuk's wife proposes making an elk-skin canoe so Tsmuk can obtain shells
    from her brother on an island.
  language: English
  quote_policy: summarized
