  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Isis catches Tcok, holds it tightly enough that it burns and blisters his
    hand, and is told by Kumush to kill it so it will not escape.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kumush says Tcok gives strength to a man who has it while gambling.
  category: speech
  evidence_refs:
  - ev:6
