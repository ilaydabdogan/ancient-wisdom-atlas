canonical_text:
  quote: ''
  summary: The passage follows Isis through a series of instructed visits to swimming
    places and ponds. Kumush washes, prepares food, directs Isis, speaks to Mukus
    on his behalf, and later prescribes sweating, red paint, new clothing, and withdrawal
    to a high mountain house. Isis encounters Lok in a pond, receives gambling from
    the rock-being Mukus, captures and kills the bright gambling medicine Tcok, dives
    at Kaimpeos among five Kais, and returns with strength from mountains and swimming
    places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mountain named Giwasyaina is addressed as able to talk all day to other
    mountains without getting tired or hoarse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isis lowers himself with a bark rope at a swimming place, washes at the water,
    draws himself back up, cannot sleep, and starts home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kumush washes, uses fragrant roots, brings food, and prepares a resting place
    for Isis.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kumush tells Isis to go to all the swimming places and specifically to Adawa,
    described as Lok's pond, where Lok stays in the water; he instructs Isis to swim
    on the western side.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Adawa, Isis mistakes Lok for a great rock, stands on him, and then enters
    a whirlpool described as Lok's medicine; Isis becomes dizzy, swims to the western
    side, dives five times, and goes home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kumush says Mukus was the greatest gambler before Gak turned him into a rock,
