  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mukus asks Isis why he came, says he heard Kumush talking, and gives Isis
    gambling, described as Mukus's work.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kumush feeds Isis after his return and sends him the next morning to get Tcok,
    the great gambling medicine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tcok is described as round and bright like the sun, evasive to a lazy man,
