canonical_text:
  quote: ''
  summary: Yahyahaas challenges Ktija's daughters after boasting about their lack
    of power. The sisters require him to make fire by his own power, demonstrate power
    with blazing grass and an opening rock, and wrestle him. The youngest sister breaks
    his leg and throws him into a large fire. Yahyahaas' spirit calls after them,
    but the sisters say he will never be a person again and will roam on high mountains.
    Later, Ktija asks about deer entrails and urges his daughters to marry men from
    Blaiwas' village so they will hunt for him; he assigns prospective husbands, including
    Kiilta's son, who can travel underground and underwater.
  language: English
  quote_policy: summarized
