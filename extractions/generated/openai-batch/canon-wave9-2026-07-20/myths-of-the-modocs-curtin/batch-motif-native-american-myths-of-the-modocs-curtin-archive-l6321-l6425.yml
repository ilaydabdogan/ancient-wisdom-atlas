canonical_text:
  quote: ''
  summary: 'Gahga, angered by reports that his brother has taken his wife, obtains
    a straw plate and has his sister lead him to the deer hunt. At night he sits and
    dances on the plate while calling out, causing heavy rain and deep water while
    he, his sister, and the ground around the plate remain dry. The people blame his
    brother, return the woman to Gahga, and ask him to stop and dry the water. Gahga
    stops the rain and later dries the ground by dancing without calling. The passage
    ends with social separation: his brother flees to the mountains, Gahga drives
    away his wife, his sister takes the boy, and Gahga remains alone.'
  language: English
  quote_policy: summarized
