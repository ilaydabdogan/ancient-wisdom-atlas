canonical_text:
  quote: ''
  summary: Maidikdak sends her two daughters from the south toward northern chiefs
    as prospective husbands, warning them to avoid Wus and the west side of a lake.
    The sisters take the forbidden-looking trail, encounter Wus, and after leaving
    him are transformed into old women with degraded clothing and gifts. They reach
    the northern chief’s house, where the five brothers recognize them and know Wus
    caused the transformation.
