canonical_text:
  quote: ''
  summary: After men eat a yan despite warning, Wekompmas returns, kills them, and
    becomes a man-eater who destroys villages. A one-legged medicine woman escapes
    him by seeing him with an eye on the top of her head and changing into a tiny
    bug. Wus hears villagers crying about the man-eater, prepares to confront him,
    removes and animates his own skin, tricks Wekompmas in a striking game, smashes
    him, and makes him into a stone pestle. Wus then restores his skin with water
    and goes to the one-legged woman's house, where they are the only people left
    in the village.
  language: English
  quote_policy: summarized
