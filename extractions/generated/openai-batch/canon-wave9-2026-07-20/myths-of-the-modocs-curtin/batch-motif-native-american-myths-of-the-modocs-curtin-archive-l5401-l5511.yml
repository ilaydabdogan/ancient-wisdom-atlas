canonical_text:
  quote: ''
  summary: An elder boy secretly feeds and cares for his unusually fast-growing little
    brother, gives him clothing and weapons, and repeatedly explains missing supplies
    to his grandmother. The grandmother eventually learns about the brother, has him
    brought home, rubs him with ashes, appeals to the earth and mountains not to harm
    him, and hides both children in a hole under a straw mat. Tekewas comes seeking
    roots, notices the mat, and is driven away by her mother, who accuses her of killing
    her brothers. Tekewas later goes to look for tracks.
  language: English
  quote_policy: summarized
