canonical_text:
  quote: ''
  summary: A relay of runners carries stolen fire while the Nebaks brothers pursue
    them. Wood dove hides and cries, and the Nebaks decide they cannot recover the
    fire; they scatter through the world, so people have both fire and sickness. Wus-Kumush
    says he did not help because earlier warnings were ignored. Wus then calls a council
    and proposes stealing fire from brothers at the western edge of the world. Others
    warn him of Kahkaas, snow, and the dangers of killing all the brothers. Blaiwas
    describes the route and the brothers' movements. Wus asks a mountain for help,
    watches the brothers leave, and enters the turf-covered dirt house through the
    smoke hole unseen by Kahkaas.
  language: English
  quote_policy: summarized
