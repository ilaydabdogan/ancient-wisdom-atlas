canonical_text:
  quote: The mortar was his medicine, his Ufe.
  summary: Old Wulkutska follows his sons, is prevented from using his mortar against
    Pitolois, loses the mortar or cap on which his life depends, dies when it is hidden,
    is revived by Tskel's medicine, is warned not to harm Pitolois, and later dies
    after eating too many roots.
  language: English
  quote_policy: quoted
