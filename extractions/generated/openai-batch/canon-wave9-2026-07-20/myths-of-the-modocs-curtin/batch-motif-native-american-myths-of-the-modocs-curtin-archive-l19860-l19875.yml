  summary: The passage notes that Ilyuyu became a head that crossed a mountain, moved
    through the air, attacked men, and killed them. It adds a comparison to an Iroquois/Seneca
    cyclone represented as a great head named Dagua Noenyent. A second note identifies
    K6kina as early Spring, whose call hastens Spring, while the Loks are clouds that
    prefer winter. A final title-and-note item concerns Grasshopper in love with Deer
    and describes it as an illustration of unfaithfulness and deceit.
