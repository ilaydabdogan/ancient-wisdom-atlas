canonical_text:
  quote: ''
  summary: Kumush directs Isis to a tree with young eagles, causes the tree to grow
    almost to the sky while Isis is in it, takes Isis' clothes and the eagles, and
    impersonates him. Several wives suspect the deception. At Pitcowa, crooked smoke
    from Kumush's fire makes people doubt his identity. Kols and Walwilegas track
    Isis to the tree; Kols flies up with a basket, food, and bear fat, rescues him,
    and helps restore him. The passage ends with continued dispute at Pitcowa over
    whether the apparent Isis is really Kumush.
