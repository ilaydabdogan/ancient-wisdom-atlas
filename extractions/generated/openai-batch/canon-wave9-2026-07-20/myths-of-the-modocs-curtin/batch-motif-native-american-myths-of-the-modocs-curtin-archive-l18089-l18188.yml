canonical_text:
  quote: ''
  summary: In this passage, Lok steals and swallows Kekina's roots after his calls
    hasten spring. Kekina discovers the theft, while his elder brother prepares poison
    arrows against the big-handed people. Wus later deceives Lok and her brothers,
    helps Kekina mutilate and eat the chief, tricks the brothers about the burial,
    and infiltrates their camp under a false story. Lok eventually dreams that her
    brother's body has been stolen and accuses Wus and the boys.
  language: English
  quote_policy: summarized
