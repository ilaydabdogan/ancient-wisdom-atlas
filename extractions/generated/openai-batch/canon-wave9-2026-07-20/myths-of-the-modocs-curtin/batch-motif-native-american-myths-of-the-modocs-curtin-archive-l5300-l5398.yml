  quote: The grandmother pressed them together with her hands, and they became one.
  summary: The passage describes two babies being pressed into one child named Weahjukewas,
    who is hidden and made to grow quickly through the grandmother's care and appeals
    to landscape powers. Tekewas suspects the child exists and demands him. Later
    Weahjukewas notices that his shadow is double, shoots an arrow toward the sky,
    and is split by the returning arrow, producing another boy like himself whom he
    hides in brush as a baby.
