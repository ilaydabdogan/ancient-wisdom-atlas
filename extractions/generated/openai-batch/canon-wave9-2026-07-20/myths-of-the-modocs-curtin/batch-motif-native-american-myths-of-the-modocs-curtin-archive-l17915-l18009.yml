canonical_text:
  quote: ''
  summary: In this fragment, Wus remains among men who suspect his identity, passes
    their test with water seeds, and draws them into repeated dance and song. He displays
    hearts to the women, sings until the men sleep, directs the women to flee east,
    kills the sleeping men with a red golobis, and removes their hearts. He leads
    the women home with miraculously multiplying and renewed moccasins, promises to
    bring the dead people to life, and returns to an old woman who has dreamed of
    a snake-like string of hearts and prepares a hot-stone water-basket rite for the
    hearts under restrictions.
  language: English
  quote_policy: summarized
