canonical_text:
  quote: ''
  summary: The passage lists animal-associated characters and begins the story of
    Gak Crow and the Kaiutois Wolf brothers. Gak accompanies the brothers on a visit
    to Tskel and Tcuskai. During the journey Gak’s fire-drill medicine enters his
    throat and nearly chokes him after the youngest brother thinks he cannot swallow
    it; the eldest brother speaks so that it comes out. At home Gak’s mother knows
    of the danger when a little fire-drill falls from the smoke hole. At Tskel’s house,
    Tcuskai teases Gak about his moccasins; later Gak finds a deer Tskel had killed.
    Tskel asks whether Gak can stay, but Kaiutois warns that Tcuskai’s teasing could
    make Gak angry and lead to violence.
  language: English
  quote_policy: summarized
