canonical_text:
  quote: ''
  summary: Two brothers travel east, alter or assign future conditions for fish, eels,
    and noisy stones, refuse to settle permanently in several places, discuss serving
    Sun or Moon, name or identify places and resources, and approach the dangerous
    house of Old Yaukul by night after preparing wooden wrist-bones and changing themselves
    into dead coals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother scratches mud away, multiplies fish, and says they will
    be useful for his people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother is afraid of eels, removes them with his fire-drill, throws
    them into the lake, and says later people will roast and eat them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger brother plays with round smooth stones, not knowing they are people;
    after dark the stones fight and make a loud noise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother strikes the fighting stones with his fire-drill and declares
    that they will hereafter be stones in the water making noise in the evening and
    early morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers travel east, kill and roast a squirrel, eat half of it, and take
    half with them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At smooth level rocks where a lake is present at night and muddy water by
    day, they catch one large fish; the elder brother refuses to catch more because
    the fish were made for some purpose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On a grassy hill, the younger brother proposes staying, but the elder brother
    says the world is lonely and that they should go where they can be useful, toward
    where the sun comes up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The brothers discuss whether they would rather serve Sun or Moon; the elder
    brother prefers Sun and the younger brother prefers Moon because people cannot
    see him then.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a mountain, the elder brother says the mountain is brother to Salwahe and
    that later people will come there for rock to make knives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The elder brother warns that Old Yaukul kills people by twisting their wrists,
    cuts them up with a knife near the fire, and burns the pieces.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The elder brother makes strong wooden bones and brittle outer wooden bones
    for his brother's wrists and his own wrists before approaching Old Yaukul's house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At night the brothers climb onto Old Yaukul's house, turn themselves into
    dead coals, and drop through the smoke hole.
  category: action
  evidence_refs:
  - ev:8
