canonical_text:
  quote: ''
  summary: 'Wus finds his children quarreling, divides his children into named tribes
    with different languages, and keeps the five youngest. He and Natcaktcokaskit
    travel north with the youngest children. At a river he brings about salmon and
    states a rule about cooking them. After Natcaktcokaskit asks for deer meat, Wus
    hunts and kills a speaking stag. The spouses quarrel, and each pronounces a transformation
    on the other: Wus is to become a black crow, and Natcaktcokaskit a D6-d6-la whose
    children will be like her.'
  language: English
  quote_policy: summarized
