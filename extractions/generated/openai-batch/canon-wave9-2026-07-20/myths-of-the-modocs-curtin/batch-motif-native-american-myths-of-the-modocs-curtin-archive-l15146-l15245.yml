canonical_text:
  quote: ''
  summary: Tcuskai gives Gopher the brothers' deer meat, roots, and Tskel's clothing
    and blanket while Tskel sleeps. In the cold morning Tskel angrily refuses to shelter
    Tcuskai, then makes a fire and requires him to recover the things from Gopher's
    underground house. Tcuskai tries to smoke Gopher out by stopping holes and fanning
    fire smoke into the main hole. Tskel hides the water to make Tcuskai sorry and
    promises water only after Gopher is killed. Tcuskai finds and drinks nearly all
    the hidden water; Tskel stops him, kills him by throwing him against rocks, scatters
    the remaining water so that it spreads into rivers and lakes, and revives Tcuskai
    by striking him five times with a string of rattles.
  language: English
  quote_policy: summarized
