canonical_text:
  quote: ''
  summary: Wus loosens the string of Tcutik's bag as she crosses a plain, allowing
    the Witsduks to escape. Wus eats many of them until he is full, but the rest rush
    out, cover the world, kill him, and the eaten ones come out of his body openings.
    The people Tcutik tried to save are killed; Tcutik becomes a squirrel and hides.
    The Witsduks scatter everywhere and live forever, and the place where Wus was
    killed remains uninhabitable because old woman Witsduk still lives there.
