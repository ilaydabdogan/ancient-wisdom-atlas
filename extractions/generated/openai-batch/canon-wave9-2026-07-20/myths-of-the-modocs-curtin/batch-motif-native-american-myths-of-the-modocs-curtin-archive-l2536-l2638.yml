- id: obs:4
  text: After death, the daughter knows the spirit world and tells Kumush to keep
    his eyes closed or he will have to return and leave her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The road goes west to where the sun sets and contains three harmful foods:
