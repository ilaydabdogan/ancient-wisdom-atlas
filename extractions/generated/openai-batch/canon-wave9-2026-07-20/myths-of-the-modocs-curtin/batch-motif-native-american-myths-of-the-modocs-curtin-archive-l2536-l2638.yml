    because he is not dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kumush and his daughter reach a steep road with a willow rope; when the daughter
    pulls the rope, music and voices are heard, and they slide down.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: They come out on a beautiful plain with high walls, described as a great house
    and the whole underground world, whose way is known only to spirits.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spirits greet Kumush's daughter and call Kumush "Sonk," meaning raw or not
    ripe, because he is not dead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The underground place has one road down and another road up, with rules about
    which way can be used for entry and exit; it is filled with innumerable spirits.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: When darkness comes in the world above, the house below becomes light, and
