- id: obs:1
  text: Kumush says he will go with his daughter and leave his body behind; the daughter
    says her spirit will go west without touching the ground.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kumush claims to know all things above, below, and in the world of ghosts.
  category: attribute
  evidence_refs:
