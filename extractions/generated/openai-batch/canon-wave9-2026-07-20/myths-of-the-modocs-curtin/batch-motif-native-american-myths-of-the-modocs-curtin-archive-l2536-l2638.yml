canonical_text:
  quote: ''
  summary: Kumush leaves his body and accompanies the spirit of his dead daughter
    westward toward the spirit world. She warns him to keep his eyes closed. Along
    the road are harmful foods offered by a Skoks, roses visible to good spirits,
    a steep descent with a willow rope, and an underground house filled with spirits.
    Kumush, not being dead, is treated as unripe, hidden in a crack, and a keeper
    named Wus-Kumush calls forth a bright central fire.
  language: English
  quote_policy: summarized
