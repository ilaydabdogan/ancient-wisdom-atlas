  summary: The passage lists characters for “Stealing Fire” and narrates how Wus organizes
    beings of the world into a relay, enters the Nebaks’ house, deceives the Moi guardians,
    steals fire, and begins passing it through relay carriers toward home for the
    benefit of future people.
