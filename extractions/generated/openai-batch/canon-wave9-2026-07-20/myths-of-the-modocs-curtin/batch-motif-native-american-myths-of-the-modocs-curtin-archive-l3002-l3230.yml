literal_observations:
- id: obs:1
  text: The character list identifies Wus as Black Fox, Nebaks as Sickness, Stibbas
    as Sun, Moi as Squirrel, Tskel as Mink, Daslats as California Lion, Keis as Rattlesnake,
    and Wamanik as Bull Snake.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ten Nebaks brothers live in the east at the edge of the world, and ten Stibbas
    brothers live in the west where the sky touches the earth; together they are described
    as owners of fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other people have no fire, eat their meat raw, know fire exists, and think
    about how to get it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wus calls a council of all the people in the world and says he wants fire
    for the people who are to come so that they can keep warm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wus tells the assembled people to stand in a long relay line reaching near
    the Nebaks’ house; he says he will steal fire and they must bring it home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wus arranges the relay by running ability, sends the Keis family underground,
    and places air-traveling people in a line above the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The people of the air report that the Nebaks build fires on mountains each
    morning, that large smoke indicates nearness to their house, and that two Moi
    brothers guard the house against theft of fire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wus travels east, reaches the Nebaks’ house unseen, and enters through the
    smoke hole.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wus frightens the Moi brothers, stops one from calling the Nebaks, and persuades
    them to let him paint their faces with dead coals.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the Moi brothers go to the spring to look at themselves, Wus takes the
    largest piece of fire, places it behind his ear, and runs away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When Wus takes the coal, the mountain fires die down and the Nebaks brothers
    conclude that someone has stolen fire.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The stolen fire is relayed from Wus to Tskel, from Tskel to Kaiutois, then
    to Daslats, and then to Wamanik, who is stationed underground.
  category: sequence
  evidence_refs:
  - ev:11
