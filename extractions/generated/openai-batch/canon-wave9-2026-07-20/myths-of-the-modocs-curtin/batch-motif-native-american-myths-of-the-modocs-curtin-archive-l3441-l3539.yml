canonical_text:
  quote: ''
  summary: Wus kills Subbas, then flees with Kahkaas while the remaining brothers
    pursue them through snow and past houses where fires are burning. The brothers
    finally abandon the chase and resolve to guard their country. Wus returns with
    Kahkaas and the bundle of roots; the people rejoice because summer and winter
    now exist where there had only been clouds and storms. Wus then calls a council
    to decide how much cold the Tcanpsaudewas should have, arguing for ten months
    of cold while others propose shorter winters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Subbas stretches partway into the house, and Wus cuts off his head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kahkaas says the other five brothers will come more quickly because it is
    getting late; the brothers hear the scream and run.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wus and Kahkaas flee toward home; Kahkaas carries a bundle on his back, and
    both run through severe wind, snow, and cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fugitives reach houses where fires are still burning, warm themselves
    briefly, and resume running when the brothers approach.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kahkaas repeatedly looks back and reports that the brothers are coming; Wus
    continues running although snow is in his ears and hair and he is nearly frozen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The pursuing brothers become tired, still carrying their baskets, and conclude
    that they cannot overtake Wus and Kahkaas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder brother says they will remain five, go back, and always watch the
    country so that no one comes there again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The brothers are described as having lived by themselves and as knowing no
    people of this world except Kahkaas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people gather to wait for Wus, praise what he has done, and see that Kahkaas
    and the bundle of roots are with him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The people are glad because there is now summer and winter; before that time
    they had only clouds and storms.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'Wus says they must do another thing for the Tcanpsaudewas: there will be
    two kinds of fire, but there is too much cold, so a council must decide the length
    of winter.'
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Wus sends for all the people in the world; they assemble silently until he
    proposes ten months of cold.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The council debates the length of cold, with some opposing ten months as starvation-causing
