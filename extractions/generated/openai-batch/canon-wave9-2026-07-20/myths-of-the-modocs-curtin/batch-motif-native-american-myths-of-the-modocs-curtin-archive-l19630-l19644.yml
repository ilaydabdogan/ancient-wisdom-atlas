canonical_text:
  quote: ''
  summary: The notes cite a Wintu myth in which Olelbis, the creator, warns Sas, the
    Sun, about grizzly bears hidden in thick brush along the eastern road. A note
    on “Djakalips — Red Clouds” says the two sisters are not identified, but that
    in many rope-maker myths such figures become spiders at the great change. The
    note also links Kaltsik spider people with “The Star Brothers,” a Wintu story
    in which Norwanchakus hires spider people to go to Sun’s house to ask about Eeriha,
    and “Ldtkakdwas,” where they made a basket intended to be fastened to the sky
    until misfortune came from looking back.
