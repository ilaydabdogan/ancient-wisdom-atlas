    wrapped blanket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kumush tries the described method; falling limbs and then the tree strike
    him, killing and burning him so that only his skull and disk remain in the ashes.
  category: sequence
  evidence_refs:
  - ev:8
