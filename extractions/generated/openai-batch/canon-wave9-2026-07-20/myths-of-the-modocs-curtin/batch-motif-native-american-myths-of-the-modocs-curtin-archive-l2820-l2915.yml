canonical_text:
  quote: ''
  summary: Kumush repeatedly makes Wanaga flee by staging danger, then eats the cooked
    animals Wanaga leaves behind. Wanaga begins carrying the food away and later tells
    Kumush a dangerous porcupine-hunting method involving a burning tree; Kumush follows
    it and is killed and burned, leaving only a skull and disk in the ashes.
  language: English
  quote_policy: summarized
