  text: Kumush comes to Wanaga's fire, says he is glad Wanaga is alive, claims he
    hid under bushes, and asks about tracks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kumush goes where Wanaga cannot see him, pulls out all his hair, tells it
    to be men, and instructs the men to form a ring around him and act as if they
    are going to kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the men surround Kumush, he screams for Wanaga to save himself; Wanaga
