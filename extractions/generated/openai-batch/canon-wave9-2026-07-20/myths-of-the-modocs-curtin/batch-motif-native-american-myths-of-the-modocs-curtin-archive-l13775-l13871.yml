canonical_text:
  quote: ''
  summary: A mother and Kalaslakkas fall asleep and dream ominous dreams. An elder
    grandmother interprets the dreams as misfortune and warns that Kalaslakkas has
    violated law by going to the mountain after a boy was born. She instructs him
    to build a fire on the mountain and speak to the mountain, fire, earth, and wind
    to delay or burn up the dream. Later, at a spring associated with Old Kowe, further
    warnings are given. Kalaslakkas goes to the mountain to cut new digging sticks
    and is killed by a bear, confirming that the dream has come to pass.
  language: English
  quote_policy: summarized
