canonical_text:
  quote: ''
  summary: Moi orders people to prepare an ambush. W6n enters a ring of people and
    is shot and killed. Keis disputes access to W6n's meat and is punished by Tcuskai,
    whose action explains the flat heads of rattlesnakes. Tcuskai divides W6n's body,
    carries meat home, survives Keis's snowstorm with fire and a heated stone, returns
    to mourners, and produces abundant meat. Tskel instructs him to seek a wife at
    a spring where women offer water, which he refuses.
  language: English
  quote_policy: summarized
