canonical_text:
  quote: ''
  summary: Tskel kills an old male captor with a magically commanded cane, enters
    the captor's house past servants, rescues Tcuskai from being smoked over a fire,
    kills old woman Kahkaas, and her pieces become hills and mountains. Later Tskel
    and Tcuskai go to hunt Won; Tcuskai eats forbidden seeds, causing Tskel's bow
    to break. Tskel gives Tcuskai a deer's head and sends him after Won, who runs
    through ground, air, trees, sky, and around the world toward Blaiwas' village,
    where servants and far-seeing figures respond to the approach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man says he has the captive on an island, says the captive killed
    all of his sons, and says he intends to kill him with help carrying wood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tskel helps load wood, gives the old man a cane, commands the cane to bend,
    break, and enter the old man's heart; the cane kills the old man and is then made
    whole again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man had carried wood to smoke Tcuskai, and Tskel straps on the wood
    and dances with it to the canoe and in the canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Keis guards the landing and Lok sits by the smoke hole; Tskel tells each not
    to touch him and says he is their master, after which Lok lets him descend into
    the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the house, Tcuskai is hanging over a fire while old woman Kahkaas is
    smoking him; Tskel cuts Tcuskai down and carries him under his arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tskel catches old woman Kahkaas, tears her to pieces, throws the pieces in
    different directions, and the pieces become hills and mountains; he takes Tcuskai
    home and cures him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Tskel tells his brother they will hunt Won; Won is described as so large that
    he bends down to cut branches from trees; Skoflks gives the brothers seeds to
    eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: While hunting, Tcuskai sees a deer, but Tskel tells him to keep still and
    warns him not to eat seed because Won will get away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tcuskai eats some seeds just as Tskel is ready to shoot, and Tskel's bow and
    bowstring break.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tcuskai washes his mouth at a spring and denies eating seed; Tskel strikes
    him, removes a deer's head from himself, puts it on Tcuskai, and sends him to
    hunt Won.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tskel says Won runs on the ground, in the air, on trees, in the sky, and around
    the world; Tcuskai follows Won over rocky places, pine-tree tops, high grass,
    mole-hills, the sky, and around the world.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Near Blaiwas' village, Kekina and Gapni are on the house roof; Kekina hears
    an approaching figure and mentions a medicine stick, Gapni tells the people, Oak
    claims world-wide sight, and Blaiwas asks old man Moi to look because Moi can
    see everything under the sky and in the world.
  category: sequence
  evidence_refs:
  - ev:7
