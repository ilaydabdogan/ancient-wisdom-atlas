canonical_text:
  quote: ''
  summary: Yahyahaas challenges men to wrestle and throws them over a cliff or into
    a lake. A little boy defeats Yahyahaas by breaking off his leg and pushing him
    into the lake, calls the people out of the water, and warns them not to look back
    at Yahyahaas' spirit. The boy declares that Yahyahaas will live near mountains
    and water but never be a person again. The people become birds, and the boy becomes
    a medicine bird who helps doctors; Yahyahaas also becomes a powerful medicine
    for curing a dying person.
  language: English
  quote_policy: summarized
