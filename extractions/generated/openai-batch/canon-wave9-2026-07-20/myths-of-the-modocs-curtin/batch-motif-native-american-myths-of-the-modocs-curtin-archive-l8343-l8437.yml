canonical_text:
  quote: ''
  summary: Yahyahaas repeatedly tries to approach the Kuja sisters, who avoid him
    with help from a mountain. Blaiwas sends Galaiwa to old Kuja's house to report
    Yahyahaas' boasting. Old Kuja describes Yahyahaas' appearance and medicine objects.
    The sisters decide not to flee, give Galaiwa night sight by sharing light from
    their eyes, and later wait on a mountain to confront Yahyahaas. As he creeps toward
    them with his cane, the eldest sister places woodpecker feathers underground,
    producing fire in his cane and frightening him.
  language: English
  quote_policy: summarized
