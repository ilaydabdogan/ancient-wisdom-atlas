  quote: ''
  summary: The passage introduces Limalimaas, also called Bone Necklace, a man-eater
    who lives near a swamp and has killed nearly all of an old woman’s kin. Her grandson
    Nul-we digs roots for her, but Limalimaas repeatedly eats the roots, threatens
    the boy, displays the bones of the boy’s relatives on his necklace, and tells
    him where to shoot him. Nul-we asks his grandmother to make a poisoned arrow.
