canonical_text:
  quote: ''
  summary: The passage opens a story titled “The Stone People,” lists named characters
    and places, then describes the Heuwus people living near Tula Lake. A young woman
    regularly passes by on her way to fish, singing that she is a great hunter of
    fish and seeds. The Heuwus men listen, discuss speaking to her, fear she may break
    them, claim they cannot die if broken, and debate whether one of them should take
    her as a wife.
  language: English
