canonical_text:
  quote: ''
  summary: Latkakawas carries a disk to Kumush and asks him to bring it to life. After
    she gives birth to a boy, Kumush uses fire, hot stones, and boiling water in his
    sweat-house, and the disk becomes the young man again. Kumush then desires the
    young man’s death and beauty; the young man dies. Latkakawas enters the cremation
    fire and burns with him, while Kumush rescues the baby. The child is calmed by
    the name Isis. Kumush finds the disk in the ashes, places it on his body until
    it adheres to the small of his back, and becomes young, beautiful, and bright.
    He hides the baby in his knee as a boil; two old women press the boil and the
    baby emerges. Kumush claims the earth gave him the child.
  language: English
  quote_policy: summarized
