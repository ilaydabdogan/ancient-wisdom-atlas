canonical_text:
  quote: ''
  summary: Wus leaves his children with his grandmother, old Wuswelekgas, while he
    goes to the edge of the world after losing his mind. The grandmother cares for
    the boys, petitions the earth for Wus's mind, buries the younger boy after he
    dies from choking, and repeatedly calls Wus back. Wus, reduced to bones, hears
    her, goes to the top of Wewekeni, lies there five days and nights, asks for power,
    mind, and flesh, and thanks the mountain. He later sets out to see his cousin
    Kaiutois despite warnings about Wek6mpmas, a dangerous old man with stone traps
    and forbidden medicine yans.
  language: English
  quote_policy: summarized
