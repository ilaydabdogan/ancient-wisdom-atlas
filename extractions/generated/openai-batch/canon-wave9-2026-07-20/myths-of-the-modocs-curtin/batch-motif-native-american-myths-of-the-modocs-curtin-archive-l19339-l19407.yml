canonical_text:
  quote: ''
  summary: A kiuks doctor lives with his old mother at Dokwa near Klamath Lake and
    keeps dead birds, including an eagle on a pole, which he revives by singing. The
    bird cries make the earth tremble and frighten people. Before traveling, he gives
    his mother a comb as a death sign and a sharp stone for striking the ground and
    fire. Men kill him; when the comb falls, the mother performs the instructed actions
    and the killers die. She burns her son's dismembered body, his spirit enters her,
    and she becomes like him. Afraid to use the birds, she weakens and dies; the birds
    fly away and the people burn the house and body.
  language: English
  quote_policy: summarized
