canonical_text:
  quote: ''
  summary: The five Lemeis brothers attempt to confront Tskel in a house but are checked
    by cold and by Tskel's actions. Tcuskai wears a cap made from South Wind's head
    and the ice disappears. The Lemeis brothers prepare a meal involving human remains,
    while Kaiutois roasts deer. At night Tskel makes the brothers sleep, ties their
    long hair together, has Galalwa seal the house with pitch, and burns it. The brothers
    wake, fight one another with flint knives, and die. Their hearts fly from the
    fire; Tskel and Tcuskai push the hearts back until four are destroyed, but the
    youngest brother's heart escapes, rises to the sky, and becomes Lemeis, who is
    still heard when traveling. A note adds that Klamath Indians regard Thunder as
    a little fellow with very long hair.
  language: English
  quote_policy: summarized
