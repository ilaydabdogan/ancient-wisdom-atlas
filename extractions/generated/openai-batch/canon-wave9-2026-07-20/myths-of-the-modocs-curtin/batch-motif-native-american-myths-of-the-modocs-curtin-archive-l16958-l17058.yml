canonical_text:
  quote: ''
  summary: Pitoiois restores Old Wulkutska to life, but he repeatedly disregards warnings
    and tries to kill her with his mortar. Tskel intervenes and later explains that
    Wulkutska can be killed if his mortar is buried in the ground under water. The
    brothers take Pitoiois hunting, hide her in a cave because of snakes, and Tskel
    warns them that Wulkutska is tracking them; Wulkutska then appears over a mountain
    and throws his mortar at Pitoiois, who dodges it.
  language: English
  quote_policy: summarized
