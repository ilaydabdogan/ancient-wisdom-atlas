- id: obs:1
  text: The sons are glad their father is dead, while Pitoiois feels badly because
    she likes her father-in-law and does not want to kill him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pitoiois strikes the old man twice on the back and twice on the head; roots
    come out of him, some remain to satisfy his appetite, and he is alive again.
  category: action
  evidence_refs:
  - ev:1
