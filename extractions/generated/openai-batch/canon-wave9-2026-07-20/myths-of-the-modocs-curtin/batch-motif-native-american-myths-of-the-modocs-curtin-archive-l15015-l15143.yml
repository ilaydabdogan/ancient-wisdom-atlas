canonical_text:
  quote: ''
  summary: The passage opens the tale titled “Mink and Weasel” with a character list
    and a narrative segment. Two brothers, Tskel and Tctiskai/Tcuskai, live near Klamath
    Lake. Tskel’s wife, Skofiks, cooks deer meat by a fire and becomes angry when
    Tctiskai watches her. Tskel strikes Tctiskai, instructs him to stay inside while
    Skofiks cooks, and announces a mountain deer hunt. At the mountain, Tctiskai kills
    a large deer; the brothers camp near a large hole between rocks. Tskel fears Tctiskai
    may enter the hole and be hurt, while Tctiskai is described as fearless. At camp,
    Gopher runs across the sleeping Tctiskai to tease him, and the passage breaks
    off.
  language: English
  quote_policy: summarized
