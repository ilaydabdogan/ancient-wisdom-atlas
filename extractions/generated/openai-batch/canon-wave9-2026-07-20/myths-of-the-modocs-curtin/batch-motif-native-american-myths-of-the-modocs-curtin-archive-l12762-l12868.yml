canonical_text:
  quote: ''
  summary: Wus arrives among dancers and tells his cousin Pap that he has come for
    Tsmuk's daughter, who is said to be visible only briefly before dark and to possess
    unusual power and knowledge. Wus dances, later eats black spiders seen in the
    air, and goes with Pap toward Tsmuk's house. At the house Wus brightens his eyes,
    turns his body dark blue so Pap cannot see him, enters, touches the daughter,
    and she screams because she knows he is there. Wus flees; Pap leaves his wife
    and goes home with him, which the narrator explains as the origin of Paps in Oregon.
    Back home Wus hears that Blaiwas accuses him of killing Költa and his wife, and
    Wus and Pap wander from place to place.
  language: English
  quote_policy: summarized
