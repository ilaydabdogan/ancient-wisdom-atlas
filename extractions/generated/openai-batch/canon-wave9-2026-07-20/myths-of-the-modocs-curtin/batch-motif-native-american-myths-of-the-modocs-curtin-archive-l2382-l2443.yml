canonical_text:
  quote: ''
  summary: Isis travels with his wives to Blaiaga and warns them that the spring is
    bad and the children must be taken along for water. While Isis hunts, the elder
    wife leaves her child alone; the child follows, falls against a stone, screams,
    and dies. The women signal Isis with fire and smoke; he stumbles at the same moment
    and returns. In grief, Isis takes the breath from the other child, declares the
    breath his and the bodies the wives', names the place Yaulilikumwas, foretells
    the women’s fate and Cogatkis’s future as Kengkong'kongis, and then departs north.
    The wives and their mother become snowbirds, and Cogatkis becomes a medicine/dream
    figure.
  language: English
  quote_policy: summarized
