canonical_text:
  quote: ''
  summary: Kaiutois Wolf is sick and hungry. Wus Fox brings him mice, then follows
    Kaiutois's instructions to summon deer and wuyes/mountain sheep by announcing
    that the hunter called Big-ribs is dying and inviting them to dance. Kaiutois
    is wrapped and hidden while the animals dance. Wus is afraid of the large animals
    and kills smaller ones instead, which Kaiutois eats but finds insufficient. The
    passage ends as Kaiutois gives Wus a heavier club and tells him to call antelopes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaiutois is sick, alone in his house, and asks Wus to find food because he
    is hungry.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wus kills mice, puts them in a basket, and brings them to Kaiutois, who eats
    them at one mouthful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kaiutois tells Wus to call deer by saying to come and dance because Big-ribs
    is going to die, and instructs him to kill a white-faced deer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wus calls to those who live in the mountains and says the man who kills them
    is dying and that he is glad and will have a dance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Big deer hears the call and tells the deer to get ready to dance with Wus
    because Big-ribs is dying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the deer enter the house, Kaiutois lies down and is wrapped so he cannot
    be seen; Wus dances with a club and strikes Kaiutois when he reaches him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The deer dance and raise dust; Big deer later says they have a long way to
    go before dark.
  category: action
  evidence_refs:
  - ev:4
