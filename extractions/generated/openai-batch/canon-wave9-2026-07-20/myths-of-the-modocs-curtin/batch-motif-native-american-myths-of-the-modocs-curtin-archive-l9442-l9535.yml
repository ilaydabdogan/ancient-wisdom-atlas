  text: Wus is scared of the big white-faced deer and lets them go, then holds back
    and kills a fawn after the big deer are out of sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kaiutois eats the fawn but complains that it is too little and says he had
    told Wus to kill a big white-faced deer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kaiutois tells Wus to call wuyes, identified in the passage as mountain sheep
    living among rocks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wus calls the rock-dwelling wuyes to come and dance because the man who runs
    after and kills them is going to die.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kaiutois tells Wus to wrap him tightly and, after the wuyes finish dancing,
    to kill one that has never had young.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The wuyes dance and raise dust; Wus is afraid of the large ones and kills
