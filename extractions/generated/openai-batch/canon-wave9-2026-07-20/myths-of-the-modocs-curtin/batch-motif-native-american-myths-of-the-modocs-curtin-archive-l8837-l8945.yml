canonical_text:
  quote: ''
  summary: A boy later named Goshgoise gives rabbits to his endangered uncle, learns
    that the Yaukul brothers threaten those who eat the rabbits hunted for them, and
    decides to go to the Yaukul place. His grandmother warns him, then makes a bright
    blue quiver from her hair, an unbreakable spear, and a rock covering for his body.
    After testing the spear on a rock, he departs toward the Yaukul place and other
    dangerous places. Old woman Yaukul sees him from her house, and at her sons' command
    twice tries to take his blanket and quiver, but he remains silent and does not
    give them up.
  language: English
  quote_policy: summarized
