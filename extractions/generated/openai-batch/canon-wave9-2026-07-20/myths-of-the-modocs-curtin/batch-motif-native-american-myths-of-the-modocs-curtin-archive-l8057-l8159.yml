canonical_text:
  quote: ''
  summary: Yahyahaas throws Blaiwas and other men over a cliff into a lake, where
    their bones rise and rattle. An old medicine woman dreams of mourning and predicts
    news of the deaths; a crying boy later confirms that the five brothers are dead.
    The community mourns and goes to the lake. Blaiwas' little boy insists on going,
    asks to be painted on the head, leads the people, sees the place and the approaching
    Yahyahaas before others can, and later sees the dead men under the lake surface.
    Yahyahaas appears in yellow clothing and paint, asks for smoke, and speaks of
    wrestling.
  language: English
  quote_policy: summarized
