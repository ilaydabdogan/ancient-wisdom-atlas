- id: obs:3
  text: An old medicine woman in Blaiwas' house dreams of people crying and putting
    ashes on their heads, and says the men have been killed and word will arrive at
    noon the next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tusasas says nobody in the world is strong enough to kill the five brothers,
    but a crying boy later arrives and says the five brothers are killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tusasas throws dirt on his head and rolls in ashes; the people cut off their
    hair, mourn, and decide to go see the place where their men were killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Blaiwas' little boy is woken by his sister while sleeping by the fire and
    is told the group is going to the place where Yahyahaas killed their people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The little boy says he wants to go, wants to die with his uncles, and asks
    to be painted with red paint at the center of his head, where his thoughts come
    in and teach him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tusasas cuts a long cedar tree, ties it on his head, goes along noisily, boasts
    that he can kill Yahyahaas, and tells the little boy he is too small to go to
    the mountains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The little boy tells his mother and the people to stop crying and follow him;
    at the lake he identifies the place of killing and says Yahyahaas is coming although
    the people cannot see him yet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Yahyahaas comes from the east wearing a rattling pale yellow coat, carrying
    a yellow cane, and with a yellow-painted face; he asks whether the people will
    feed him smoke and whether they came to play or wrestle.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:11
  text: The little boy sits on the cliff edge, looks at the water, and sees men swimming
    under the surface, including the five brothers and other people; he feels strong
    and glad when he sees them.
  category: action
