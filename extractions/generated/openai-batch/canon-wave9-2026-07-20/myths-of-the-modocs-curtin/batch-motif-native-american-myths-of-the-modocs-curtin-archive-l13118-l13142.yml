canonical_text:
  quote: ''
  summary: In Ndukis' house, Swaia changes from an old, wretched-looking man into
    a young, bright, beautiful man, and his bundle shines. People come to see him
    and ask him to run a race. Swaia begins the race in old form, is mocked, then
    becomes young and wins repeatedly, defeating notable runners. He likes the Ndukis
    people and stays with them.
  language: English
