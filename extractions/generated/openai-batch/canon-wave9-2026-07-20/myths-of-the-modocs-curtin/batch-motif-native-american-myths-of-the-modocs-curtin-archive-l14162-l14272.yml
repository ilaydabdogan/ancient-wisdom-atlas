canonical_text:
  quote: ''
  summary: Won crosses a river and dies from sharp things in his heart after Coltz
    has crept into his mouth. Coltz emerges and seeks obsidian to cut up the body
    while disguising his speech. Wus overhears, questions him, flatters him, and induces
    him into a jumping game over the body, described as an elk. Wus wins possession,
    refuses Coltz a share, beats and kills him, divides the meat for his family and
    himself, and leaves his speaking cap to warn if Coltz moves. When Coltz moves,
    the cap calls out and Wus returns to smash him.
  language: English
  quote_policy: summarized
