canonical_text:
  quote: The old man-eater became Thunder.
  summary: Nul-we reports a bone-necklaced man-eater to his grandmother, receives
    his father's bow and the secret that the enemy's heart is in his first finger,
    shoots the finger, flees the weakened pursuer, sends the heart into the sky, and
    the old man-eater becomes Thunder.
  language: English
  quote_policy: quoted
