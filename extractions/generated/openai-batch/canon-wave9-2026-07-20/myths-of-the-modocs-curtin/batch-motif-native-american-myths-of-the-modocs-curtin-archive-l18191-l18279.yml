canonical_text:
  quote: ''
  summary: Wus warns her nephews that the Loks are coming. The elder brother, Kekina,
    prepares to fight and repeatedly survives being swallowed by Lok opponents, killing
    them from within by cutting their hearts. Later little Kekina disappears while
    digging roots. His brother searches among the Loks, finds little Kekina's hair
    in a Lok's teeth, kills many Loks, spares one old poor Lok by changing him into
    a common bear, and brings the hair home. Wus directs a medicine-basket ritual
    through which little Kekina comes back to life.
  language: English
  quote_policy: summarized
