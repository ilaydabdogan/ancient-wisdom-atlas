canonical_text:
  quote: ''
  summary: A character list glosses named figures as animals or natural entities.
    The narrative introduces Wamanik/Wimanik, who lives at Wiwensi in a hollow between
    two mountains and fishes from a nearby creek. East of him lives a great hunter
    with three daughters and a son; the hunter and son each have hunting songs. Wamanik
    hunts deer with two companions, hears a man singing on a mountain, and later sees
    a young man carrying a deer while being unable to see his face.
  language: English
  quote_policy: summarized
