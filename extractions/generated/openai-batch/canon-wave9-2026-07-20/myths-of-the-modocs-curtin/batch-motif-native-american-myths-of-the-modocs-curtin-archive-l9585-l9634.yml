canonical_text:
  quote: ''
  summary: The passage lists animal-associated characters and begins an episode in
    which Blaiwas and other head men live in a house on a high mountain and receive
    meat from surrounding people. Blaiwas sends the fast runner Tcuskai for old man
    Ndtikis/Ndukis to divide meat. Ndukis divides and eats some meat but brings none
    to his mother or four brothers. He then joins the head men hunting, catches only
    a mouse, and is mocked as a poor hunter when called again to divide meat. At the
    foot of the mountain, an old woman and her two daughters lack game; the mother
    tells the daughters to go to the great hunters on the mountain and get husbands.
    The excerpt breaks off while she is explaining how to find the house.
  language: English
  quote_policy: summarized
