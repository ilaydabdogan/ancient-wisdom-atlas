canonical_text:
  quote: ''
  summary: The younger Nanihlas brother transforms fish bones into sweet seeds, and
    the Nanihlas brothers later steal village goods and escape pursuers by making
    and melting ice. The younger brother then confines all deer in a pit, causing
    hunters to starve; Mukus spies on the brothers, reports that five rocks seal the
    pit, and Tcuititi breaks the rocks by flying upward and falling on them, releasing
    the deer across the world.
  language: English
  quote_policy: summarized
