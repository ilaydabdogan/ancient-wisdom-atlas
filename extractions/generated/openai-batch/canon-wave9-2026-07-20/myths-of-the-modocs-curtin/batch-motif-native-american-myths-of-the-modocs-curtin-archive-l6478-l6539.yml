  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The son hears a terrible roar and knows that his wife has made his father
    angry.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: People far away hear the roar, recognize what kind of old man he is, remain
    in their houses, and fasten their doors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: As the old man travels, he calls his own name, “Lulus-Dewieas.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The son comes to the former site of his house, finds a wide gap in the earth,
    follows the sound of his father’s traveling, and calls to him, but the old man
    does not hear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The old man travels underground beyond Mount Shasta to a place where there
    is water, stops there, and remains underground while the son stands above and
    speaks to him.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The old man tells his son not to feel badly, says his spirit belongs to the
