canonical_text:
  quote: '"I shall live forever under the earth."'
  summary: After a deer disappears from the son, his wife withholds pounded seeds
    from the old father-in-law to test him. The old man swells, paints himself, turns,
    throws up dirt, sinks into the ground, and in anger causes the house, woman, and
    children to sink into a hole. He travels beneath the earth, breaking and throwing
    out earth and leaving openings. The son follows the sound to a place beyond Mount
    Shasta near water, where the old man says his spirit belongs to the earth and
    that he will live forever underground. The son leaves and wanders sorrowfully.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A deer shot by the son disappears where it stood, and he says this is the
    first time he has lost a deer after shooting it.
