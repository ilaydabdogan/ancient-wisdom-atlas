- id: obs:2
  text: While her husband is away, the young woman pounds seeds and decides to see
    what her father-in-law will do if she puts the seed away without giving him any.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man comes out, sits on the south side of the house, swells up, paints
    himself in black stripes, turns around, throws up dirt, has hair red as fire,
    and sinks into a hole he has made.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The little girl and the woman call for the old man to come back; the woman
    promises to give him many seeds to eat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old man is described as too far gone and too angry, and the house, woman,
    and children sink into the hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The old man continues underground, boring as he goes, breaking and throwing
