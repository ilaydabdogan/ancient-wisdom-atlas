canonical_text:
  quote: ''
  summary: An initial paragraph describes a fast-growing boy, called a great kiuks,
    reporting the appearance of his dream Skoks. The Skoks story then places chiefs
    or first people on the shore of Tula Lake with an old woman and her grandson Big
    Belly, who is mocked by Tusasas. A Skoks travels every evening along the eastern
    side of the lake, cries loudly, wears a straw blanket, vanishes when seen, and
    causes death or temporary senselessness depending on which side he passes. When
    the Skoks approaches, people crowd together in fear; his scream brings intense
    cold, extinguishes fires, and prevents grass from burning. The grandmother makes
    a small fire for the boy, warns him not to meet the Skoks, throws ashes toward
    the voice, and the boy asks to be wrapped in skin so he can go meet it.
  language: English
  quote_policy: summarized
