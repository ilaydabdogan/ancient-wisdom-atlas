canonical_text:
  quote: ''
  summary: In a hunting and mountain-house sequence, Wamanik returns without deer
    while others have meat, Tusasas brings a fawn, and Wamanik sends his kinsman Wisnik
    to the house of old Djaudjau to seek Djaudjau's daughters in marriage. Wisnik
    travels singing and playing a bowstring; the sisters hear him from the spring
    and see him arrive. The passage describes the sisters' work habits and dress,
    Djaudjau's ability to know thoughts, a rule for gathering pine inner bark safely,
    and Djaudjau's statement that his son must decide about the sisters' husbands.
  language: English
  quote_policy: summarized
