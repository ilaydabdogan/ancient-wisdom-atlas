canonical_text:
  quote: My spirit will leave the body and go west.
  summary: Kumush, identified as Creator and father, returns from the edge of the
    world with a daughter whose origin is unknown. He finds Isis and the people he
    had made dead, creates ten dresses for the girl by his word, and oversees her
    maturity rite. After she sleeps in the sweat-house and dreams of a death, Kumush
    says the death is her own. She asks for the burial dress; Kumush resists because
    he believes her spirit will leave her body when she wears it. She tells him not
    to cry, saying the event follows his own will and that her spirit will go west.
  language: English
  quote_policy: quoted
