canonical_text:
  quote: '"You will no longer be a person; you will be darkness"'
  summary: An old woman guides Tsmuk and his son by canoe across water to an island
    for shells and beads. Fearful thoughts and speech endanger the canoe. After the
    return, Tsmuk is cursed into darkness. Goshgoise returns to his grandmother's
    country with his wife, kin, and a ball of light, where he is recognized and accepted.
  language: English
  quote_policy: quoted
