canonical_text:
  quote: ''
  summary: 'The passage gives brief notes on two myth-tales. One note says Tusasis
    is consistently portrayed as a worthless, shiftless mischief-maker and boaster,
    and that dreams are important. The second note summarizes “The Bad Brother”: Rain
    is the hero; he drowns his mother, sends his sister to K6we, whose power over
    springs and water is described; the sister marries Djdudjau; Djdudjau later visits
    his brother-in-law, uses green twigs to remove bad thoughts, gives them to Earth,
    talks to mountains, and forgets his brother-in-law. The passage adds that a similar
    act appears in several Modoc myths.'
  language: English
  quote_policy: summarized
