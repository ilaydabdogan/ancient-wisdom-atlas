canonical_text:
  quote: ''
  summary: Wus hunts mice and gives his mother only small mice or heads. A Pakol girl
    visits to borrow grass; Wus's mother makes the house shrink, lengthens an awl
    over the door, kills the girl, cuts up the body, and sends a dry intestine to
    appear as a distant campfire with voices in order to lure Wus toward the great
    water. Wus discovers hidden meat, is told that his uncles are camped nearby with
    deer meat, and pursues the receding fire and voices until he reaches the great
    water, becomes weak, and cries. His aunt Tciwididik rescues him, tells him his
    mother fooled him and wanted to kill him, and helps him return. His mother is
    mourning, then heals him with deer marrow; they move to a place with many black
    crickets and have plenty to eat.
  language: English
  quote_policy: summarized
