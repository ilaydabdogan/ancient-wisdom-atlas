canonical_text:
  quote: ''
  summary: Wus observes an enemy camp from a mountain, creates a bright far-seeing
    object called golobis, sees his captive sister and the displayed hearts of his
    slain brothers, magically changes his appearance, enters the camp at night, denies
    being Wus, describes Wus as dangerously transformative, and is allowed to stay.
    He then dances and throws captive women across the fire, secretly strengthening
    and communicating with them while outwardly pretending hostility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wus watches from a high mountain and sees people in a valley; his sister is
    nearly dead, captives are thrown across a fire, and men dance and cry out around
    the fire after dark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wus makes a long bright thing called golobis; when raised it blazes like fire,
    and when he holds it and looks far away he can see everything.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wus sees his sister being thrown across the fire and sees a pole near the
    fire holding his brothers' hearts.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wus asks for long hair with beads and bones, a blanket, and porcupine-quill
    leggings, and these appear immediately.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At midnight Wus goes to the people by the fire; he makes music by whipping
    his bowstring with an arrow, and the long-necked girl recognizes him as her brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people question Wus and suspect his identity; Wus denies being Wus and
    claims to be a nearby visitor whose house is among rocks.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The captors say the hearts and young women came from the south near two lakes,
    and say they killed Wus brothers and Kaiutois brothers and took their wives and
    sisters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wus says the youngest Wus brother can do anything, change into different things,
    and turn people into rocks, old stumps, ashes, birds, trees, or other forms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wus says Wus will come to kill the people and take his sister home, asks to
    stay and dance over the hearts, and some of the people agree to watch him for
    a day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wus knows the people's thoughts, dances, throws the women across the fire
    to make them stronger, speaks with them inwardly, and aloud says he wants the
    fire to burn them.
  category: action
  evidence_refs:
  - ev:9
