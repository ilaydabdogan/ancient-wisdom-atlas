canonical_text:
  quote: '"You will see me every month; I shall live always and wiU always travel
    on the sky."'
  summary: The passage introduces Gaukos, Kulta, the Kowe sisters, Weketas, Lok, and
    other beings. Gaukos seeks a wife and chooses the ugly, mistreated Weketas rather
    than the beautiful Kowe sisters because she can restore life. He carries her in
    his bosom, declares that he will be seen every month and travel in the sky, and
    the passage explains that when he is eaten by big-mouthed people, Weketas brings
    him back to life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The character list identifies Gaukos as Moon, Kowe as Frog, an otter figure,
    Lok as Bear, and Weketas as a small green frog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gaukos and Kulta have a house among rocks on the east side of Klamath Lake,
    while the ten Kowe sisters live on the west side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ten Kowe sisters are described as beautiful little women with bead- and
    porcupine-quill-covered clothes, and as powerful women who can do anything they
    want.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weketas lives with the ten sisters, is described as big and ugly, and is said
    to have the single ability to bring people to life.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gaukos becomes lonesome and Kulta goes to tell the ten sisters that a young
    man on the east side of the lake wants a wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ten sisters prepare food and clothing and travel by canoe; Weketas has
    no new clothing or food, rows the canoe, and is verbally abused by the sisters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gaukos rejects each of the ten sisters and selects the one at the end of the
    canoe, Weketas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gaukos says he chooses Weketas because she will be best for him, will live
    in his heart, and will always save him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gaukos says big-mouthed people are watching him and like to eat men like him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gaukos says that if only a little of him remained in Lok's mouth, Weketas
    would bring him to life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ten sisters pinch Weketas as she passes, making her arms and legs bleed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gaukos wipes Weketas' blood away, rubs her with deer tallow, gives her a blanket,
    puts her in his bosom, and starts toward the east.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: As he leaves, Gaukos tells Kulta that he will be seen every month, live always,
    and always travel on the sky.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says that Gaukos still travels, that people can see Weketas and
