canonical_text:
  quote: ''
  summary: Tskel, a powerful chief who has killed the old man of the lake, hears the
    song of the old man's daughter near a cedar tree and avoids her. She later lures
    Tcuskai with crows and beads, comes to Tskel's house, contests Skoiiks by spitting
    beads, induces sleep, fights Skoiiks over the sleeping Tskel, and carries him
    underground in animal form to the lake on her horns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says someone searched the world for the missing person and put coal
    on his head because he thought the person was dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tskel is described as chief in the Ellamath country and the strongest living
    person; he is said to have killed the old man of the lake.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: While hunting, Tskel hears a beautiful song, follows it to a large cedar tree,
    and sees a woman on a bough throwing cedar berries onto a blanket.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman calls Tskel to sit on the blanket; he knows she is the old man's
    daughter and goes home instead of approaching her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tskel later tells Skoiiks that the old man's daughter has come to kill him
    and stops hunting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The woman sits in bushes near Tskel's house and tells crows to fly over her;
    Tcuskai notices the crows and urges his brother to investigate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tskel warns Tcuskai not to go near the bushes, but Tcuskai secretly goes there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tcuskai finds a woman on a low stump; when she spits, beautiful beads come
    out, and the beads become more beautiful each time.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tcuskai tells Tskel there is a beautiful woman in the bushes and urges him
    to take her as a wife and send Skoiiks away.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tskel is sleepy and has been in a half dream since first hearing the woman's
    song.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The woman comes to the house after Tskel will not come to her; Skoiiks prepares
    herself, and the text says Skoiiks has power and can do things.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The woman and Skoiiks both spit beads, with Skoiiks producing more beautiful
    beads during the contest.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At sunset the woman uses power to make Tskel and Tcuskai sleep and makes Skoiiks
    very sleepy.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: In darkness the woman begins wrapping Tskel in a skin blanket to carry him
    off.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Skoiiks wakes, jumps on the woman, and fights her all night over the sleeping
    Tskel.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: At daylight Skoiiks can no longer fight, and the woman snatches Tskel and
    carries him away.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The woman travels underground and leaves a furrow on the surface; Skoiiks
    follows but cannot travel underground and eventually returns home.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Skoiiks strikes Tcuskai with his neck rattles and tells him to follow his
    brother, blaming him for finding Tskel a new wife.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: Tcuskai wakes and searches for Tskel, but the trail has disappeared and he
