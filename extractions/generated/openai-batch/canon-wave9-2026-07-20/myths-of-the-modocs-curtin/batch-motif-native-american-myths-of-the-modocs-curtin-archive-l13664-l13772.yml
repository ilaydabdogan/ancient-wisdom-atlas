canonical_text:
  quote: ''
  summary: Kalaslakkas is asked to gamble for Kletcowas's daughter and wins her after
    ten games, while vowing to stop gambling. Tusasas boasts and is soon sick after
    an elder says the earth punishes bad speech. Kalaslakkas returns goods to Kletcowas's
    family, takes the girl as wife, calls elk by whistling like one, kills many, and
    sends meat to his wife's natal family. Blaiwas' people make elk-skin coats and
    arrows, then fight. After the wife bears a boy, the father goes to the mountain
    Slaptcatcak to keep awake five days and nights; the grandmother says this is wrong
    for a boy and predicts loss. The mother has a vision of men in elk-skin coats
    fighting, but the passage breaks off mid-speech.
  language: English
  quote_policy: summarized
