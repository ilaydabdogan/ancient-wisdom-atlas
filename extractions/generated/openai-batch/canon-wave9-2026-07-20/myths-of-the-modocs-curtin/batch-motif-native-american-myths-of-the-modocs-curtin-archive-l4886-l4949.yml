canonical_text:
  quote: He turned into the red clouds which we see in the fall of the year.
  summary: After the younger sister tricks Djakalips into looking up, his fiery eyes
    and red face frighten the two sisters. They flee by making a reed rope to the
    sky and leave a small animal as a silent guard. Djakalips coerces the animal into
    revealing their path, climbs after them, and is left in the sky while the sisters
    return to earth. The passage explains Djakalips as the red clouds seen in the
    west in fall, associated with freezing water.
  language: English
  quote_policy: quoted
