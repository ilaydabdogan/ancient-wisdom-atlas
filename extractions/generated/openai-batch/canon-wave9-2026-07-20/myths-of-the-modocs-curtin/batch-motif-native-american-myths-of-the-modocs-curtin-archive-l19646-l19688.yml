canonical_text:
  quote: '"You and your brother will be stars."'
  summary: Notes on several Modoc myth-tales identify seasonal characters in Moasam
    Beps, praise West Wind's Wives, and summarize elements of The Star Brothers, including
    Tekewas as a red storm-cloud figure, destructive looking back, newborn children
    pressed into one and divided again by an arrow, a wrestling contest with Yahyihaas,
    and the transformation of two brothers into stars. The notes also report differing
    explanations of Yahyihaas as fog, lightning, clouds, and thunder.
  language: English
  quote_policy: quoted
