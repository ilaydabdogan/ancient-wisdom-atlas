canonical_text:
  quote: I shall never stay old; each year I shall be young again.
  summary: Wamanik releases a young man but says he wants the young man's two older
    sisters. At seed time, when the sisters gather seeds near the lake, Wamanik sends
    Wus to Djaudjau's house to demand the two older daughters. Wus and the family
    warn or urge the girls, but they refuse. Wamanik makes two flutes, changes into
    a nice-looking man by removing two blankets, and claims he will renew his youth
    each year while the girls will age and die. The girls become sleepy and are sent
    to sleep in bushes. Wus uses power by wishing to make many of Wamanik's kin and
    hang them near the sleeping girls; the eldest sister dreams of snakes, sees them
    on waking, and screams.
  language: English
  quote_policy: quoted
