canonical_text:
  quote: "“He had eyes as red as blood and he always looked down”"
  summary: The passage introduces Djakalips, also called Djikalips Red Clouds, living
    on the west side of Klamath Lake. He has blood-red eyes and avoids showing them.
    Two sisters become his wives, and he warns them not to break the fish gall when
    cleaning fish. The wives discuss their inability and desire to see his eyes; the
    elder fears that seeing them might cause death, while the younger insists on trying.
    They attempt to make him look up with false alarms, but he does not. The excerpt
    ends with Djakalips returning from fishing and the elder wife cooking fish for
    him in coals.
