canonical_text:
  quote: ''
  summary: Tskel is questioned by a woman who intends to carry him to the end of a
    trail and throw him into a lake. He kills and dismembers her, throws the pieces
    into the water, avoids dangerous objects placed on the trail by her brothers,
    and returns home to Skouks and Tcuskai, who are mourning. He washes their heads
    and their hair is restored by the next morning. Later Kahkaas visits Tskel. Tcuskai
    traps Kahkaas's five boys, after which Kahkaas grieves and is expected to seek
    revenge. A great elk appears; Tcuskai shoots at it, but it catches him on its
    horns, runs to the mountains, changes into Kahkaas, and flies with him to a tree
    on an island in the ocean. Tskel searches for his brother and encounters a sick
    woman and then a speaking rock house.
  language: English
  quote_policy: summarized
