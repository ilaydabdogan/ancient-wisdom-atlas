canonical_text:
  quote: ''
  summary: In a dialogue, Zarathustra asks how to perform sacrifice for Ahura Mazda's
    creation. Ahura Mazda directs him toward a holy tree and instructs that a faithful
    man cut and handle a baresma twig during sacrifice. Zarathustra then asks about
    defilement and cleansing of Vohu-mano; Ahura Mazda prescribes gomez from a suitable
    bull, a field with furrows, recitations of prayers, and washing with gomez and
    water.
  language: English
  quote_policy: summarized
