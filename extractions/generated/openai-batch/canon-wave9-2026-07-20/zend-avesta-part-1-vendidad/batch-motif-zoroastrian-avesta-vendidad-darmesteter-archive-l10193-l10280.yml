  quote: ''
  summary: A questioner repeatedly asks Ahura Mazda what reward a man receives after
    his soul has parted from his body if he brings different fires to the Daityo-gatu.
    Ahura Mazda answers with graded equivalences in fire-brands. An explanatory note
    identifies the Daityo-gatu as the Bahram fire and as a sacred centre to which
    earthly fire returns, with greater merit attached to freeing more defiled fire
    from worldly use.
