canonical_text:
  quote: ''
  summary: 'The passage discusses principles of Mazdean law inferred from the Vendidad:
    extreme bodily penalties may have been commuted into monetary fines; atonement
    is distinguished as money, Sraosho-X-arana, and cleansing; repentance through
    avowal and the Patet formula has religious effect, saving the soul from other-world
    penalties while not removing earthly punishment; some sins are described as inexpiable,
    punished by death here and torments in the other world. A footnote adds that later
    Parsiism assigns monetary values to sins and good deeds, weighed in the scales
    of Rashnu.'
  language: English
  quote_policy: summarized
