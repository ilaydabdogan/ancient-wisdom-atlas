  summary: 'The passage gives a graded tariff for healing different human and animal
    patients, with payments scaled by social rank and type of patient. It then names
    three kinds of healers: one using the knife, one using herbs, and one using the
    holy word. A note glosses the holy word as spells and compares the classification
    with Greek material about Asclepios.'
