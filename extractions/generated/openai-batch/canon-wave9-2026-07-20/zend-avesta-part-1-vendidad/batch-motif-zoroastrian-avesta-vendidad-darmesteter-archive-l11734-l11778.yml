canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers questions about required periods after the death of
    a child or sibling, distinguishing thirty days for the righteous and sixty days
    for sinners. The passage then prescribes house-cleansing actions: washing bodies
    and clothes three times, chanting the Gathas three times, offering sacrifice to
    Fire, offering baresma, and bringing libations to good waters, after which the
    house is clean and sacred powers may enter. The second cleansing sequence is partly
    repeated and ends within the supplied excerpt.'
  language: English
  quote_policy: summarized
