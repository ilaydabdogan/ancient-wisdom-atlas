canonical_text:
  quote: ''
  summary: The passage gives ritual directions for a woman who remains apart for three
    nights, then asks how much longer she must remain confined and separated from
    the worshippers of Mazda. Ahura Mazda answers that she must remain so for nine
    additional nights, then wash her body and cleanse her clothes with gomez and water.
    The passage then states that those clothes, even after washing, may never be used
    by named priests or by any priest, warrior, or husbandman, but may serve as coverings
    or sheets for a sick woman or an infirm unclean man in a place of infirmity until
    they become clean. Editorial notes connect the procedure with the Barashnum, other
    Vendidad passages, and later/customary practice.
  language: English
  quote_policy: summarized
