canonical_text:
  quote: ''
  summary: The passage commands offerings and sacrifice to holy Sraosha so that he
    may smite fiends. It invokes the Kara fish beneath deep waters, Merezu as a battle-seat
    in the creation of the two spirits, and the seven bright Sravah. Angra Mainyu
    and the Daevas are depicted as wavering, gathering at Arezura, and fleeing because
    the holy Zarathustra has just been born and is a counter-force to fiends. The
    Daevas flee into the dark world of hell.
  language: English
  quote_policy: summarized
