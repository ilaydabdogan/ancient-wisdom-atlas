canonical_text:
  quote: ''
  summary: Zarathustra chants the Ahuna-Vairya and asks Ahura Mazda to teach him truth.
    Sitting by the Dareja on a mountain, he asks how to free the world from the Druj
    and Angra Mainyu, drive away defilement and the Nasu, and cleanse faithful men
    and women. Ahura Mazda answers by instructing him to invoke the good law, the
    Amesha Spentas, cosmic powers, the Wind, Spenta Armaiti, Ahura Mazda's Fravashi,
    and Ahura Mazda's creation. Zarathustra then performs invocations that include
    Mithra, Sraosha, the holy Word, and the fiend-destroying law.
  language: English
  quote_policy: summarized
