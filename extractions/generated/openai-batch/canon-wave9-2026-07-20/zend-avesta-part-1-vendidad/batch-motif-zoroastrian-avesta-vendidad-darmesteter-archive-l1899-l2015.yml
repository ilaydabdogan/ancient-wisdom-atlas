canonical_text:
  quote: ''
  summary: The passage argues that Avesta beliefs and practices, including dualism,
    Ahriman, the killing of noxious animals, and corpse exposure, existed under the
    Achaemenian period chiefly as Magian or sacerdotal customs rather than as general
    Persian practice. It contrasts Herodotus' reports, royal inscriptions, Avesta
    law, Sassanian law, and Magian practice, and concludes that the Avesta was originally
    the sacred book of the Magi, written in their non-Persian dialect.
  language: English
  quote_policy: summarized
