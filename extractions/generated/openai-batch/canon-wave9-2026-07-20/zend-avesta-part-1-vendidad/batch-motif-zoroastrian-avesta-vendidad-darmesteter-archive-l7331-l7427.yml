canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers questions about whether water and fire kill, attributing
    death instead to Asto-vidhotu and Vaya while describing the effects of flood,
    fire, birds, and chance. He then gives instructions for winter treatment of the
    dead: small houses are to be raised for corpses, bodies are to remain there until
    seasonal signs return, and then the dead are to be laid on the Dakhma with eyes
    toward the sun.'
  language: English
  quote_policy: summarized
