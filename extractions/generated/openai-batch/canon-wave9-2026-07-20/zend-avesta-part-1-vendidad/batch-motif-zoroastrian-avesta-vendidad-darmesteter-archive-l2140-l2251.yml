canonical_text:
  quote: "“Zoroaster was born and received the law from Ormazd on a mountain, by the
    river Dare^a”"
  summary: 'The passage surveys late and Avesta-linked traditions about Zoroaster’s
    origin and religious foundation: Shiz and Atropatene, a fire temple and royal
    pilgrimage, Zoroaster’s retirement on Mount Sebilan and return with the Zend-Avesta,
    a founding sacrifice in Airyanem Vaejo, and a mountain-river setting where he
    receives law from Ormazd. It also discusses Magian priestly authority, sacred
    fire associations with Atropatene, and a brief note on Azi Dahaka in Babylon.'
  language: English
