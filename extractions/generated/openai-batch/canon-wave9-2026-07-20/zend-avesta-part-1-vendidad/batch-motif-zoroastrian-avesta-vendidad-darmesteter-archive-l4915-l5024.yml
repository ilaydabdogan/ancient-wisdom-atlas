canonical_text:
  quote: ''
  summary: The passage gives a comparative table of Zend, Old Persian, Greek, and
    modern land names, followed by commentary on uncertain identifications of several
    lands. It discusses Nisaya, Aakhra, Urva, Varena, and Vaekereta; connects Varena
    with a struggle between Az\s Dahaka and Thraetaona, described as a storm serpent
    and a storm god; reports a later tradition of the serpent bound to Demavand; and
    notes a possible localization of Keresaspa's adventures in Kabulistan. It closes
    by commenting on the unordered sequence of Ormazd's created lands, from Airyana
    Vaejo by the Vanguhi Daitya to the land by the Rangha.
  language: English
  quote_policy: summarized
