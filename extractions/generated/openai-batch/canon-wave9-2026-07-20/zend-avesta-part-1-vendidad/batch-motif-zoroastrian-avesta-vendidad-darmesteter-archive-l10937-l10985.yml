canonical_text:
  quote: ''
  summary: The passage gives a graded list of payments or equivalent rewards due to
    one who has performed cleansing for different social ranks and household members.
    It states that worshippers of Mazda should reward the cleanser if able, or otherwise
    give something that makes him leave satisfied and without anger. If the cleanser
    leaves displeased and angry, the Druj Nasu enters the people through bodily openings,
    rushes through them to the nails, and they remain unclean forever. The passage
    ends by saying that this grieves the sun, addressing Spitama Zarathustra.
  language: English
  quote_policy: summarized
