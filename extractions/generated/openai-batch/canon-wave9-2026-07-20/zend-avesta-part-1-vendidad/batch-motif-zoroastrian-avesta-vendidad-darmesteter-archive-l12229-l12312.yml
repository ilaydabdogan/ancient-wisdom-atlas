  summary: Ahura Mazda answers questions about the guilt and penalties for giving
    bad food to different kinds of dogs. The passage assigns analogies between dogs
    and human social or religious figures, gives graded corporal penalties, states
    proper dog food, and includes notes comparing dog-feeding duties with other Zoroastrian
    materials.
  language: English
  quote_policy: summarized
