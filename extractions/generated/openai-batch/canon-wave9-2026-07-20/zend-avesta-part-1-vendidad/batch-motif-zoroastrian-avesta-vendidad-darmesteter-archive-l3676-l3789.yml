canonical_text:
  quote: ''
  summary: The passage first recounts a myth in which Zarathustra’s seed is preserved
    by divine beings, guarded by Fravashis, and will one day cause a bathing maiden
    to conceive Saoshyant, who will free the world from death and decay when the dead
    rise and immortality begins. It then argues against the theory that Zoroastrianism
    arose through a sharp schism from Vedic religion, discussing shared Indo-Iranian
    vocabulary and deities and concluding that later Mazdean dualism developed gradually
    from earlier Indo-Iranian dualism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zarathustra is described as having overwhelmed Angra Mainyu during his lifetime
    by a spell and as destined to overwhelm him at the end of time through an unborn
    son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three times Zarathustra approached his wife Hrogvi, and three times the seed
    fell upon the ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ized Neriosengh took what was bright and strong in the seed and entrusted
    it to the Ized Anahita.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The seed is to be reunited with a maternal womb at an appointed time and is
    watched over by 99,999 Fravashis of the faithful so that fiends do not destroy
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A maid bathing in Lake Kasava will conceive by the preserved seed and bear
    the victorious Saoshyant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Saoshyant is said to come from the region of the dawn and free the world from
    death, decay, corruption, and rottenness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage associates Saoshyant’s coming with the rising of the dead and
    the commencement of immortality.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that Asura is the name of the supreme God in the Avesta
    and that in older Vedic religion it is applied to high deities, especially Varuna.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage argues that the Avesta and Vedic religions are not separated by
    an abyss of schism but remain linked to a common source.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage concludes that Mazdean dualism developed by a long and slow movement
    from vague Indo-Iranian dualism into sharply defined dualism.
  category: sequence
  evidence_refs:
  - ev:10
