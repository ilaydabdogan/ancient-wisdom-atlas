  summary: The passage explains corpse impurity as demonic possession by the Drug
    Nasu, describes death-contagion spread from corpse contact, and summarizes rites
    of expulsion by the Sag-did dog gaze, washings with ox's urine and water, and
    spoken spells. It also presents comparative and mythic explanations involving
    Greek and Vedic funerary rites, dogs associated with death realms, the Kinvat
    bridge, and the mythic origin of gomez as heavenly animal urine or storm flood.
  language: English
