canonical_text:
  quote: ''
  summary: The passage describes a man able to contend with hostile forces, then states
    that a particular deed is punished from its first occurrence with pain in hell
    worse than severe bodily torments. The deed is identified as knowingly lying in
    an oath before brimstoned, golden, truth-knowing water, with appeal to Rashnu
    and a lie to Mithra. Ahura Mazda gives a penalty of seven hundred stripes with
    each of two named implements. The following chapter summary introduces topics
    of death-related uncleanness, purity, fire, earth, water, Dakhmas, Nasu, and sacrificial
    implements.
  language: English
  quote_policy: summarized
