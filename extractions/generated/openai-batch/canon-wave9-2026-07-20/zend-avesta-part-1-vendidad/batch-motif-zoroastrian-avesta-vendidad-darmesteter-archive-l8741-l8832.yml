  quote: '"they shall sprinkle it once over with water, and it shall be clean"'
  summary: The passage gives ritual instructions, in dialogue form between Zarathustra
    and Ahura Mazda, for cleansing wood and beginning instructions for cleansing corn
    or fodder contaminated by dead matter from a dead dog or dead man. It also refers
    to the Druj Nasu as a polluting force and to corpse-eating dogs or birds as agents
    that can smite the Nasu.
