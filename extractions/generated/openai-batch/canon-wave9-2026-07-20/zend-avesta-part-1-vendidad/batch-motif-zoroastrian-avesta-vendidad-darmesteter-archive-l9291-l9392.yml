canonical_text:
  quote: ''
  summary: 'The passage identifies defiled or nighttime libations as acts that lead
    a person away from the ways of God into the ways of the Druj, then introduces
    Fargard VIII as concerned with funerals and purification. It gives rules for a
    house or hut where a dog or man has died: look for a Dakhma, remove either the
    dead or the dwelling depending on which is easier, and perfume the house with
    specified sweet-smelling plants. It then asks what should be done if a dog or
    man dies in a Mazdayasnian house during rain, snow, wind, or approaching darkness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda says that one who offers libation water defiled by the dead, or
    offers libations in the dead of night, goes astray from the ways of God into the
    ways of the Druj.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note cites a rule that good waters may be offered from sunrise to sunset,
    and compares offering them after sunset to shedding them into the jaws of a venomous
    snake.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chapter outline lists topics of funerals and purification, including purification
    of a house where a man has died, funerals, corpse-carrying ways, a man defiled
    by the dead, fire defiled by the dead, the Bahram fire, and purification in the
    wilderness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The opening question of Fargard VIII asks what worshippers of Mazda should
    do if a dog or a man dies under the timber-work of a house or the wattlings of
    a hut.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura Mazda instructs the worshippers to look all around for a Dakhma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If it is easier to remove the dead than the house, the dead is taken out,
    the house remains standing, and the house is perfumed with sweet-smelling plants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If it is easier to remove the house than the dead, the house is taken away,
    the dead is left on the spot, and the house is perfumed with sweet-smelling plants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The named sweet-smelling plants include Urvasni, Vohu-gaona, Vohu-kereti,
    and Hadha-naepata, with any other sweet-smelling plant also allowed.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
- id: obs:9
  text: A note says that when a dog or man dies, the first task is to take the corpse
    out and purify the house, inside and outside, with perfumes burnt on fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Another question asks what to do if a dog or man dies in a worshipper's house
    while it is raining, snowing, blowing, or darkness is coming on, when flocks and
    men lose their way.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A commentary note says no corpse must be taken to the Dakhma when rain is
    falling or threatening; if rain overtakes the bearers on the way, they should
    lay the corpse down if there is a place, but otherwise continue to the Dakhma.
  category: action
  evidence_refs:
  - ev:8
