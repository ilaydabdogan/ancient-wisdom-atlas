  summary: 'The passage gives ritual instructions for an unclean person: recitation
    weakens hostile beings; the officiant sprinkles the person with gomez using a
    spoon attached to a nine-knotted stick; the hands are washed three times; as body
    parts are sprinkled in a fixed order, the Druj Nasu rushes from one body location
    to another.'
