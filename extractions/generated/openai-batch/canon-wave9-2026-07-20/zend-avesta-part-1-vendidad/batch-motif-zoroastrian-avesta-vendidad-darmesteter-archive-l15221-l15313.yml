canonical_text:
  quote: ''
  summary: The passage introduces Fargard XX on Thrita as the First Healer. It says
    Thrita first drove back death and disease and received healing plants from heaven,
    growing around the tree of eternal life, White Horn or Gaokerena. Editorial notes
    connect Thrita with Haoma, Thraetaona, Rig-Vedic Trita/Traitana, and serpent-conquest.
    In the dialogue, Zarathustra asks Ahura Mazda who first drove back sickness and
    death; Ahura Mazda identifies Thrita, who obtained a source of remedies from Khshathra-Vairya.
  language: English
