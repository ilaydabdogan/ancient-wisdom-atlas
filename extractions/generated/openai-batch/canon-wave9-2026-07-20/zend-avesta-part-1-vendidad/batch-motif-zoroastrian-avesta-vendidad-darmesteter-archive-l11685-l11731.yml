canonical_text:
  quote: ''
  summary: The passage treats a house as unclean after the death of a parent or relative.
    Ahura Mazda gives different durations of staying for righteous and sinful dead
    persons, and prescribes a threefold purification involving washing bodies and
    clothes, chanting the Gathas, offerings to Fire, baresma, and libations to the
    waters. Afterward the house becomes clean and waters, fire, and the Amesha-Spentas
    may enter.
