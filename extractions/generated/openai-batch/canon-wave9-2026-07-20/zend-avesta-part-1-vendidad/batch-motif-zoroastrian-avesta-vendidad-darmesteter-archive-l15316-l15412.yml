  quote: I Ahura Mazda brought down the healing plants
  summary: The passage describes illness and infection as creations of Angra Mainyu
    and presents Ahura Mazda as bringing down many healing plants around Gaokerena.
    Health is invoked through blessing-spells, prayers, and praises. The speaker commands
    sickness, death, pain, fever, and disease to depart, drives away diseases and
    hostile beings, and calls the much-desired Airyaman to come for the rejoicing
    of Zarathustra’s men and women and the faithful.
