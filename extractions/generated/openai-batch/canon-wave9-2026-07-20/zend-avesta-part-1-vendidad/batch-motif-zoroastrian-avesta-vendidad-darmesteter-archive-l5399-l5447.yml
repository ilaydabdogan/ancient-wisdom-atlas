canonical_text:
  quote: ''
  summary: 'The passage reports Angra Mainyu counter-creating winter, then gives an
    editorial synopsis of Fargard II: Ahura Mazda offers Yima the law, Yima refuses,
    Yima is instead charged with protecting and prospering creatures, enlarges the
    earth, and later builds a Vara to preserve animal and plant seeds through a destructive
    winter. An editorial note also compares tales of headless people with eyes on
    their shoulders to Classical, Persian, Indian, and Greek materials.'
