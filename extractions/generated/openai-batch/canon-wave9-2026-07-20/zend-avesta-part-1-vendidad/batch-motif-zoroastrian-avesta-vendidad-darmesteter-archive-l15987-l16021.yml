  quote: ''
  summary: A prayer invokes Airyaman to come for the rejoicing of Zarathustra's men
    and women and the faithful, and to smite diseases, deaths, and hostile beings.
    The passage then recites formulaic petitions about the law of holiness, Vohu-mano,
    protection by Mazda's Atar and Vohumano, instruction for this world and the next,
    Sraosha's help, and the banishment of the fiendish Druf/Dru£ and the fiend's brood
    to the north.
