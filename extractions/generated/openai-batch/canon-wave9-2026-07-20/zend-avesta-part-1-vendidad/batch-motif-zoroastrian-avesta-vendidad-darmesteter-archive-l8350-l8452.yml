canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda where the bodies and bones of the dead should
    be placed. Ahura Mazda instructs that corpses be laid on high summits where corpse-eating
    dogs and birds are found, fastened so bones are not carried to water or trees.
    Failure to fasten the corpse incurs a stated penalty. For bones, the Mazda-worshippers
    are to erect a Dakhma-like building out of reach of animals and without standing
    rainwater, or, if unable, place the dead on the ground with carpet and pillow
    under the open light and sun. The following chapter outline introduces the Drug
    Nasu as a defiling power acting on corpses and affected objects.
