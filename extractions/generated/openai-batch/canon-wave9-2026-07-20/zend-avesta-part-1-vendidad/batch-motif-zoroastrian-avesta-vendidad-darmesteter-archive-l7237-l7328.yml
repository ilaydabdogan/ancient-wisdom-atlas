canonical_text:
  quote: ''
  summary: A bird eats a corpse in a vale, returns to a mountain tree, and deposits
    dead matter on it. A man later cuts that tree for firewood, prompting a question
    about penalty. Ahura Mazda answers that no sin falls on a person for dead matter
    brought by dogs, birds, wolves, winds, or flies, because otherwise the world would
    be filled with condemned people. A parallel case concerns an irrigated corn field
    where an animal carries a corpse into a stream; the same no-sin ruling is repeated.
    The next question begins by asking whether water kills.
  language: English
  quote_policy: summarized
