canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers questions about how long household members should
    observe a prescribed stay after the deaths of various relatives, with different
    durations for the righteous and sinners. He then gives a repeated cleansing procedure
    for the house: washing bodies and clothes three times, chanting the Gathas three
    times, offering sacrifice to Fire and baresma, and bringing libations to the good
    waters, after which the house is clean and waters, fire, and the Amesha-Spentas
    may enter.'
  language: English
  quote_policy: summarized
