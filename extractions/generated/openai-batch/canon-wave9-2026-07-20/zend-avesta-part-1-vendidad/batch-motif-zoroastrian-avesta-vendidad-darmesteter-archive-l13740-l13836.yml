canonical_text:
  quote: ''
  summary: The passage introduces Fargard XVIII and records Ahura Mazda instructing
    Zarathustra on who should and should not be called an Athravan. External priestly
    items and claims are insufficient without being girded with the law; neglect of
    nightly ritual, worship, learning, and teaching also invalidates the claim. A
    true Athravan keeps vigil through the night and seeks holy Wisdom, which gives
    confidence at the bridge before reaching the holy world of paradise. Ahura Mazda
    then invites the upright one to ask him questions.
  language: English
  quote_policy: summarized
