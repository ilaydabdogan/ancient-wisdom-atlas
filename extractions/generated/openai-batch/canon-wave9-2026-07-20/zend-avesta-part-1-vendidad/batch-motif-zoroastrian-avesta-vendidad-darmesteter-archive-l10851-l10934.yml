canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for an unclean person: at successive
    holes, formulaic words are recited as he becomes freer from Nasu; he cleanses
    with dust, washes at water-filled holes, perfumes himself, dresses, returns home,
    and then undergoes repeated periods of seclusion and washing before being permitted
    again to approach listed elements and beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the third, fourth, fifth, and sixth holes, the subject becomes freer from
    Nasu, and after each stage the addressed speaker is told to recite the same healing,
    fiend-smiting formula.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the six holes, the unclean one sits near the furrows and cleanses his
    body with thick handfuls of dust.
  category: action
  evidence_refs:
