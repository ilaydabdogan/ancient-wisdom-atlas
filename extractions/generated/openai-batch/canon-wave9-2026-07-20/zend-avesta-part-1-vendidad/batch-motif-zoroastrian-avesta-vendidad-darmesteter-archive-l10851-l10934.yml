- id: obs:3
  text: Dust is taken from the ground fifteen times for him to rub on his body, and
    the participants wait until he is dry to the last hair on his head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When dry, he steps over the holes containing water and washes his body once
    at the first hole, twice at the second, and three times at the third.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: He perfumes his body with named perfumes or any sweet-smelling plant, puts
    on his clothes, and goes back to his house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the house, he sits in the place of infirmity apart from other worshippers
    of Mazda and avoids proximity to fire, water, earth, cow, trees, and the faithful
    for three nights before washing body and clothes with gomez and water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same pattern of sitting apart, avoiding listed contacts, and washing body
    and clothes with gomez and water is repeated after six nights.
  category: sequence
  evidence_refs:
  - ev:7
