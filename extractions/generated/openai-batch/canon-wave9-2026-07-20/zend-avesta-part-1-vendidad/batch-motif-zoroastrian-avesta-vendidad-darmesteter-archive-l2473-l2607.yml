canonical_text:
  quote: ''
  summary: 'The passage gives a scholarly summary of Magism and the Avesta religion:
    a twofold world made by hostile good and evil principles; cosmic conflict, revealed
    law, a future Saoshyant, destruction of evil and hell, resurrection, and everlasting
    happiness. It also argues that Magian religion shares an Indo-Iranian source with
    the religion of the Indian Rishis, organized around natural law and natural conflict,
    and describes a Heaven God as law-establishing, all-knowing, and sky-associated.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Magian observances became law throughout Iran, were
    too severe for a working people, and that Islam's triumph was experienced by many
    as a deliverance while Magism's enforced triumph contributed to its fall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage summarizes Magism as teaching that the present world is twofold
    and is the work of two hostile beings, Ahura Mazda and Angra Mainyu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says good things come from Ahura Mazda, bad things from Angra
    Mainyu, and world history is their conflict, including Angra Mainyu's invasion
    and marring of Ahura Mazda's world and his future expulsion.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage says man is active in the conflict and that his duty is set out
    in a law revealed by Ahura Mazda to Zarathustra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that, at an appointed time, the still-unborn Saoshyant, son
    of the lawgiver, will appear; Angra Mainyu and hell will be destroyed; men will
    rise from the dead; and everlasting happiness will reign.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage claims that the religion of the Magi derives from the same Indo-Iranian
    source as the religion of the Indian Rishis and that Mazdean belief contains both
    inherited and post-separation strata.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies one Indo-Iranian religious idea as law in nature, illustrated
    by orderly days, seasons, years, the sun and moon, dawn, and stars.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage identifies another Indo-Iranian religious idea as war in nature,
    involving powers that benefit or injure humans, gods and fiends, and a storm struggle
    over light and heavenly streams.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Indo-Iranian religion contained latent monotheism and unconscious
    dualism; Indian thought slowly lost both, while Mazdeism retained them and pushed
    them to an extreme.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage describes the God who established natural laws as the Heaven God,
    greatest of gods, maker of everything, wisest of all gods, and seeing with the
    sun, moon, and stars as his eyes.
  category: attribute
  evidence_refs:
  - ev:9
