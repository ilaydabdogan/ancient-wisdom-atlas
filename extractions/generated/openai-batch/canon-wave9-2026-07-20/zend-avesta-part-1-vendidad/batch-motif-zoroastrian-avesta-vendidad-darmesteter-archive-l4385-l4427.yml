  summary: The passage discusses ritual uncleanness after childbirth, especially after
    a still-born child, including gomez, water restrictions, and danger during the
    first three days. It describes fire as protection against fiends, sickness as
    Ahriman-sent possession treated by washings and spells, and footnoted birth-protection
    examples involving fire, a sword, and Roman threshold guardians.
  language: English
