canonical_text:
  quote: ''
  summary: In a legal dialogue, questions are posed about smiting another person so
    that blood comes, a bone is broken, or the victim dies. Ahura Mazda answers with
    graded penalties of stripes using the Aspahe-astra and Sraosho-carana; repeated
    unatoned offenses or refusal to atone result in the offender being called Peshotanu
    and receiving two hundred stripes with each implement. The passage closes with
    a directive that they walk according to the way, word, and ordinance of holiness.
  language: English
  quote_policy: summarized
