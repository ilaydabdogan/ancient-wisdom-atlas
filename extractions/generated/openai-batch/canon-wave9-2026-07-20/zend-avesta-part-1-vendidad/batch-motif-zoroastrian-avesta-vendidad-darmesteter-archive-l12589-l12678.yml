canonical_text:
  quote: ''
  summary: 'The passage closes a preceding rite with fire, baresma, and Haoma, followed
    by the return of abundance to land and fields. It then introduces Fargard XIV
    as an appendix concerning atonement for killing a water dog. Zarathustra asks
    Ahura Mazda what penalty is due for killing such a water dog. Ahura Mazda answers
    with large quantified punishments and ritual obligations: stripes, offerings of
    hard and soft wood to the fire of Ahura Mazda, consecrated baresma, Zaothra libations
    with Haoma and sacred meat to the good waters, and the killing of snakes.'
  language: English
  quote_policy: summarized
