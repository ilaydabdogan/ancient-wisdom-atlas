  quote: ''
  summary: 'The passage includes a note about healing by the holy word and then a
    ritual-legal dialogue in which Ahura Mazda states how long the ground or earth
    remains affected after contact with a corpse: one year when a corpse lies on the
    ground under the light of heaven and sun, and fifty years when a corpse is buried
    in the earth. A note explains that the land is restored to purity and fit to till
    after that period.'
