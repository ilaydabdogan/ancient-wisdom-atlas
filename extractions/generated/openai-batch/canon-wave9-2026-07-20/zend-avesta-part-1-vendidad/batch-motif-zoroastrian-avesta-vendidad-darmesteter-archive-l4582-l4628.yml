canonical_text:
  quote: ''
  summary: The passage explains the term Pesho-tanu/Peshotanu as a severe penalty
    category associated with two hundred horse-whip strokes, lists graduated Vendidad
    stripe penalties, and gives examples of offenses receiving the Peshotanu penalty,
    including repeated manslaughter, mistreatment of a shepherd's dog, corpse-related
    offenses, childbirth and menstrual restrictions, and sacrifice in a house where
    someone has recently died.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pesho-tanu is described as often interpreted in the Pahlavi Commentary as
    'worthy of death,' while also having the technical meaning of one who must receive
    two hundred strokes with the horse-whip.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage lists a graduated Vendidad penalty scale: five, ten, fifteen,
    thirty, fifty, seventy, ninety, and two hundred stripes.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Examples of offenses mapped to the scale include agerepta with five stripes,
    avaoirirta with ten, stroke with fifteen, sore wound with thirty, bloody wound
    with fifty, broken bone with seventy, and manslaughter with ninety.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second manslaughter committed before the first has been atoned for receives
    the Peshotanu penalty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other repeated crimes can move the offender through the penalty series up
    to the Peshotanu penalty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The commentator remarks on an apparent inequality between crime and penalty,
    contrasting ninety stripes for manslaughter with two hundred stripes for serving
    bad food to a shepherd's dog.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tilling land in which a corpse has been buried within the year is listed as
    an offense punished by two hundred stripes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A woman just delivered of child drinking water is listed as an offense punished
    by two hundred stripes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Suppressing a woman's menses and performing a sacrifice in a house where a
    man has just died are listed among offenses punished by two hundred stripes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Neglecting to fasten a corpse so that birds or dogs might carry dead matter
    to trees and rivers is listed as an offense punished by two hundred stripes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Throwing on the ground a bone of a man's corpse or a dog's carcass as big
    as two ribs is listed as an offense punished by two hundred stripes.
  category: action
  evidence_refs:
  - ev:9
