canonical_text:
  quote: ''
  summary: The passage first lists several negative similes for an unnamed subject.
    It then states that the shepherd's dog and the house dog must not be kept away
    from the houses of the faithful because households depend on them. In a dialogue,
    Ahura Mazda says that the ghost of a dead dog passes to the spring of the waters,
    where water dogs are formed from dogs and she-dogs. Killing a water dog causes
    drought and loss of fertility, health, and growth in the land; restoration requires
    the killer's death and a three-day sacrifice to the dog's holy soul.
  language: English
  quote_policy: summarized
