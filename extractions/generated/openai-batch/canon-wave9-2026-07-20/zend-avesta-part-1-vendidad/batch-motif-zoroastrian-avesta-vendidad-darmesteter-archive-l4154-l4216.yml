canonical_text:
  quote: ''
  summary: The passage reports a Zoroastrian guardian-dog tradition, including the
    yellow-eared dog summoned by Ormazd to protect Gayomart's body and drive fiends
    to hell. It then explains corpse defilement through the death-demon, contrasts
    Mazdean corpse disposal with older Indo-European burning or burial, and compares
    Indian/Vedic fire as carrier of the dead with Persian sacred fire as pure, death-excluding,
    and fiend-repelling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cited commentary says that some dogs watch over earthly regions and others
    over fourteen heavenly regions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ormazd wishes to keep the body of the first man, Gayomart, from Ahriman and
    calls the yellow-eared dog to arise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The yellow-eared dog barks and shakes its two ears; Satan and the fiends are
    frightened by its appearance and barking and flee down to hell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corpse is said to defile no longer after a year, and a fresh corpse is
    described as more defiling than a rotten one.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The explanation given is that the death-demon has just arrived in full strength
    at a fresh corpse, while time exhausts his power in an older corpse.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the corpse is the focus of contagion, it must be disposed of so that
    death does not spread; burning and burying the corpse are described as sacrilegious
    in the Avesta.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fire, earth, and water are described as holy elements, and the Vedas are said
    to worship them as godlike beings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Indian view described here, the dead man is a traveler to the other
    world, and fire carries him to a heavenly abode while mediating between earth
    and heaven and between man and god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Persian view described here, fire cannot admit death or uncleanness,
    is the purest offspring of the good spirit, repels fiends with bright blazing,
    and is preserved as the everlasting Bahram fire where Parsis are settled.
  category: attribute
  evidence_refs:
  - ev:7
