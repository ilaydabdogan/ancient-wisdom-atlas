canonical_text:
  quote: ''
  summary: In a dialogue framed as Ahura Mazda answering, the passage praises giving
    to the faithful while tilling the earth and warns that withholding leads to a
    dark, hell-like realm. It then gives escalating penalties for burying the corpse
    of a dog or man in the earth and not disinterring it, culminating in an offense
    with no atonement after the second year for one who knows the law. The passage
    distinguishes knowledgeable offenders from those not taught in the law of Mazda,
    for whom confession and resolve not to repeat the act allow the law to remove
    sin. Notes gloss Spewta Armaiti as earth and comment on corpse burial in relation
    to fire and water.
  language: English
  quote_policy: summarized
