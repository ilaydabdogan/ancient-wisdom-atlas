canonical_text:
  quote: ''
  summary: 'The line range includes a residual penalty statement prescribing seven
    hundred stripes with two named implements, then opens Fargard XVI on the uncleanness
    of women during sickness. Ahura Mazda gives rules for a woman with an issue of
    blood: prepare a separated place, keep her at measured distances from fire, water,
    consecrated baresma, and faithful people, regulate how food is brought in metal
    vessels, restrict her food, and wash a child who touches her.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda prescribes seven hundred stripes with the Aspahe-artra and seven
    hundred stripes with the Sraosho-charana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heading and outline identify the following Fargard as concerning the uncleanness
    of women during sickness, its removal, and related laws.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A question asks what Mazda-worshippers should do if a woman in a Mazda-worshipper's
    house has an issue of blood, either outside the ordinary course or at the usual
    period.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ahura Mazda instructs them to clear the way of growing trees and logs, strew
    dry dust on the ground, and erect a building there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The building is to be higher than the house by a stated fraction so that the
    woman's look does not fall upon the fire.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman is to be kept fifteen paces from the fire, water, and consecrated
    bundles of baresma, and three paces from the faithful.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The person bringing food to the woman must remain three paces away and bring
    food and bread in brass, lead, or other common metal vessels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The specified food is only two danares of long bread and one danare of milk
    pap, so that she does not gather strength.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: An explanatory note says that, because the fiend is in her, any strength she
    gains accrues to Ahriman.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a child has just touched her, the child's hands are washed first and then
    the child's body.
  category: action
  evidence_refs:
  - ev:7
