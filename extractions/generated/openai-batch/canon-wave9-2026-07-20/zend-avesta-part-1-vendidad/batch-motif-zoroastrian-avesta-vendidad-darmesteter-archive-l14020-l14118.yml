  summary: The passage exhorts adherence to good thoughts, good words, and good deeds,
    links rising at the cock’s call and tending the Fire with paradise and blessing,
    promises rewards for giving or feeding Parodar birds, and begins an exchange in
    which Sraosha interrogates the Druj about the males who make her conceive progeny,
    naming first an ungenerous man who refuses the faithful.
