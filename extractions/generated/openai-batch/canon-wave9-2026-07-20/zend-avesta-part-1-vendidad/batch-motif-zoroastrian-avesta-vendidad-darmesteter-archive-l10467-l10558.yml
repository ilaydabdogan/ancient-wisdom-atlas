canonical_text:
  quote: How shall they manage here below, who want to cleanse the body of one defiled
    by the dead?
  summary: The passage closes a prior atonement statement, then introduces Fargard
    IX on the nine nights' Barashnum purification. It presents commentary on the rite
    and begins a dialogue in which Zarathustra asks Ahura Mazda how to cleanse someone
    defiled by the dead. Ahura Mazda gives requirements for the qualified cleanser,
    the cleansing ground, its separation from sacred elements and the faithful, and
    the digging of holes with seasonal depths.
  language: English
  quote_policy: quoted
