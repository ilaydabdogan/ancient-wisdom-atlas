  summary: A liturgical passage invokes the blessed heavenly abode, Garo-nmanem, a
    Mazda-made bridge, sacred beings and personified powers, the Gathas, sacred regions,
    glories associated with Aryan lands and Yima, and then directs worship of Sraosha
    and offerings to Fire.
