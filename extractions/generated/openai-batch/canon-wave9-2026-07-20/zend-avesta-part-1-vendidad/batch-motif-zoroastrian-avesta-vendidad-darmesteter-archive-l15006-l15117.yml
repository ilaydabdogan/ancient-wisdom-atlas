  text: The speaker invokes a bright, glorious, blissful abode of the holy ones and
    identifies Garo-nmanem as the abode of Ahura Mazda, the Amesha-Spentas, and other
    holy beings.
  category: speech
  evidence_refs:
  - ev:1
