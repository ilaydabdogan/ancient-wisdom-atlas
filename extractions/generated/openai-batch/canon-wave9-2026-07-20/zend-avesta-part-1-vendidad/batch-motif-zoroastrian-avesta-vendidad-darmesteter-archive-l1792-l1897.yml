    belief: two opposing principles, Ormazd and Ahriman; antithetical creations; a
    finite world; final defeat of the evil principle; resurrection of the dead; and
    everlasting life. A note compares the shadowlessness of resurrected men with shadowless
    gods or immortality-associated figures in other examples.'
