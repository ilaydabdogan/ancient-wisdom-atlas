canonical_text:
  quote: ''
  summary: 'The passage continues a list of good lands and countries created by Ahura
    Mazda. For each named land, Angra Mainyu, described as all death, comes and counter-creates
    an evil by witchcraft: a stained mosquito, Pairika Knathaiti, pride or tyranny,
    an unatonable unnatural sin, burying the dead, the witchcraft of the Yatus, and
    utter unbelief. A subsection describes Yatu witchcraft as manifesting through
    the look and through howled spells.'
  language: English
  quote_policy: summarized
