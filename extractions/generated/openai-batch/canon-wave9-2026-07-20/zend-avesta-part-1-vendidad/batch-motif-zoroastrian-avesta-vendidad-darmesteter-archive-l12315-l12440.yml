canonical_text:
  quote: ''
  summary: Ahura Mazda gives rules for restraining mad, scentless, or silently biting
    dogs; assigns liability and progressive bodily penalties for repeated attacks;
    commands attempted healing for a scentless or mad dog; describes the dog as a
    divinely made guardian of human goods; and judges wolf-dog hybrids, especially
    offspring of a he-dog and she-wolf, as destructive to folds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage asks what worshippers of Mazda should do if a mad dog or a dog
    that bites without barking is in a worshipper’s house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda answers that the dog should receive a wooden collar and be tied
    to a post by the two sides of the collar, with post thickness varying by hard
    or soft wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the dog is not restrained and it smites a sheep or wounds a man, the dog
    is said to pay for it as for wilful murder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Repeated attacks lead to progressive cutting of the dog’s right ear, left
    ear, right foot, left foot, and tail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a scentless dog or a mad dog, Ahura Mazda says the worshippers should
    attend to heal it as they would one of the faithful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If healing fails, the dog is again to be collared and tied; if this is not
    done and a scentless dog falls into a hole, well, precipice, river, or canal and
    dies, the responsible persons are Peshotanus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ahura Mazda says he made the dog self-clothed, self-shod, watchful, wakeful,
    sharp-toothed, fed by man, and watchful over human goods when sound of mind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person awakened by the dog’s voice is warned so that neither thief nor wolf
    steals from the house, and the wolf is smitten, torn, driven away, and flees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ahura Mazda says that, between two mixed wolf-dog births, the one born of
    a he-dog and a she-wolf deserves more to be killed than the one born of a she-dog
    and a he-wolf.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Offspring of a he-dog and she-wolf are described as attacking shepherd’s dogs,
    house dogs, Vohunazga dogs, and trained dogs, and as destroying folds.
  category: action
  evidence_refs:
  - ev:8
