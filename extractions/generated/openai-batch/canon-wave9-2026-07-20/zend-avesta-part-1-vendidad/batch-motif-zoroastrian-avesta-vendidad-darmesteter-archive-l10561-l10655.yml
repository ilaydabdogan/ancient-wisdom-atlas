canonical_text:
  quote: ''
  summary: 'The passage gives detailed instructions for preparing a purification layout:
    digging measured holes at seasonal depths, spacing them by paces, drawing enclosing
    furrows with a metal knife, placing hard materials as steps, and having the unclean
    person approach while Zarathustra stands outside the furrow and recites. Notes
    identify six holes for gomez, three for water, and explain the furrow as a ritual
    boundary that confines and drives away the Drug or fiend.'
  language: English
  quote_policy: summarized
