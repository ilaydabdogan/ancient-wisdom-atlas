canonical_text:
  quote: ''
  summary: The passage gives legal-religious classifications and penalties for violent
    intent and assault. Ahura Mazda answers questions about named offenses—Agerepta,
    Avaoirista, and Aredus—and prescribes escalating numbers of stripes with the Aspahe-astra
    and Sraosho-charana. Repeated or unatoned offenses can make the offender a Peshotanu,
    punished with two hundred stripes by each instrument.
