canonical_text:
  quote: ''
  summary: 'The passage concludes an atonement formula involving killings of listed
    creatures, bridge-building over canals, ritual stripes, and a conditional afterlife
    outcome. It then introduces Fargard XIX as a revelation narrative: Angra Mainyu
    attacks Zarathustra through the Drug/Buiti; Zarathustra chants the Ahuna-Vairya
    and invokes worship of Mazda and the good waters of Daitya; the demon withdraws.
    Editorial headings summarize the broader chapter as attack, revelation of law,
    and demonic flight to hell.'
  language: English
  quote_policy: summarized
