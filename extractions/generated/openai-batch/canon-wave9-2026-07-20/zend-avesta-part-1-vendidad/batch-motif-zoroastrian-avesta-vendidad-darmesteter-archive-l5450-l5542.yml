canonical_text:
  quote: ''
  summary: The passage introduces the Yima material as combining Yima's association
    with the dead and end-world myths. Zarathustra asks Ahura Mazda who was the first
    mortal instructed by him. Ahura Mazda names Yima, asks him to bear the law, accepts
    Yima's refusal of that role, and instead commissions him to nourish and rule the
    world. Yima accepts, promising a reign without extreme winds, disease, or death.
    Ahura Mazda gives him a golden ring and gold-inlaid poniard, and under Yima's
    sway the earth becomes populated with animals and humans.
  language: English
  quote_policy: summarized
