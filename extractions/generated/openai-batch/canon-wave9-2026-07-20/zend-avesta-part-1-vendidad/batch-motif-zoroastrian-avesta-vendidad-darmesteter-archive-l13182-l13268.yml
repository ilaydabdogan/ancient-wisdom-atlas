canonical_text:
  quote: ''
  summary: 'The passage gives repeated legal answers from Ahura Mazda about a bitch
    near birth lying in different places: a camel-stall, horse-stall, ox-stall, sheep-fold,
    or earth-wall. In each case, the person who built or holds the place must support
    her until the whelps are born. If failure to support her causes the whelps to
    come to mischief, the responsible person incurs the penalty for wilful murder.
    A note adds that if the bitch lies on the high road, the nearest householder must
    care for her, and if unable to continue may entrust her to a richer man.'
  language: English
  quote_policy: summarized
