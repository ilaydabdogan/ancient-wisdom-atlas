canonical_text:
  quote: ''
  summary: In a legal-religious dialogue, Ahura Mazda states penalties for killing
    a named prickly-backed dog and a shepherd's dog; identifies Zairimyangura/Zairimyaka
    as an evil creature active from midnight until sunrise that kills creatures of
    the good spirit and whose killing atones sins; and describes legal and afterlife
    consequences for injuring dogs, including lack of aid from the dogs that keep
    the K'mvad bridge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Killing the dog Vanghapara, described as having a prickly back and a long
    thin muzzle and also called Dusaka by evil-speaking people, incurs a penalty of
    one thousand stripes with each named instrument.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda identifies the daeva Zairimyangura, also called Zairimyaka by
    evil-speaking people, as an evil creature active from midnight until sunrise that
    kills thousands of creatures of the good spirit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Whoever kills Zairimyangura/Zairimyaka has sins in thought, word, and deed
    redeemed and atoned for as by a Patet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Smiting a shepherd's dog, house dog, Vohunazga dog, or trained dog affects
    the smiter's soul when passing to the other world, where it flies amid loud howling
    and fierce pursuit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: No soul will meet and help the departing soul of the dog-smiter, and the dogs
    that keep the K'mvad bridge will not help it through the howls and pursuit in
    the other world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a shepherd's dog is made unfit for work by being smitten, including loss
    of ear or paw, and a thief or wolf then carries away sheep without warning from
    the dog, the man must pay for the sheep and for the dog's wound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a house dog is made unfit for work by being smitten, including loss of
    ear or paw, and a thief or wolf then carries away goods without warning from the
    dog, the man must pay for the goods and for the dog's wound.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Killing a shepherd's dog so that its soul parts from its body incurs a penalty
    of eight hundred stripes with each named instrument.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A translator's note identifies Zairimyangura as the tortoise and explains
    Zairimyaka through associations with freshness of water and verdure and with injury
    to fresh water.
  category: other
  evidence_refs:
  - ev:9
