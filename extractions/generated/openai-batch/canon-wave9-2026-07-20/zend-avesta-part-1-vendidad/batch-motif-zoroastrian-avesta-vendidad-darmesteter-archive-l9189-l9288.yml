canonical_text:
  quote: ''
  summary: Ahura Mazda permits a woman to drink strength-giving water to save her
    life under authorization, while requiring a penalty. He then gives rules for purifying
    eating vessels touched by a dog carcass or human corpse, with cleansing repetitions
    varying by material and some materials remaining permanently unclean. He also
    gives rules for a cow that has eaten corpse matter, restricting ritual use of
    her products for one year before ordinary eating may resume.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda says that the woman may drink strength-giving water when saving
    her life is the first concern and when she has been allowed by a holy knowledgeable
    man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda says the worshippers of Mazda must fix a penalty, and that the
    Ratu and Sraoshavarez prescribe the penalty when applied to.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The specified penalty is described as the deed of a Peshotanu and consists
    of two hundred stripes with the Aspahe-astra and two hundred stripes with the
    Sraosho-charana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eating vessels touched by the carcass of a dog or the corpse of a man are
    said to be capable of being made clean if they are of certain materials.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gold, silver, brass, steel, and stone vessels are cleansed by repeated washing
    with gomez, rubbing with earth, and washing with water, with the number of repetitions
    varying by material.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vessels made of earth, wood, or clay are declared unclean for ever and ever
    after such contact.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A cow that has eaten from a dog carcass or a human corpse can be made clean,
    but for one year the priest must not take her milk, cheese, or meat for the baresma-libation
    context.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After one year has passed, the faithful may eat from the cow as before.
  category: sequence
  evidence_refs:
  - ev:8
