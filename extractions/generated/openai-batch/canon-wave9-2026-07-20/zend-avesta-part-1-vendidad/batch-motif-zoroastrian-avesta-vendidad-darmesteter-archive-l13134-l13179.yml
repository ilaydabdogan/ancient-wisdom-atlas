  quote: ''
  summary: The passage states that a man who causes a woman to conceive must support
    her until the child is born; if lack of support causes harm or death to the child,
    he incurs the penalty for wilful murder. It asks who should support a pregnant
    female lying on the high road, and Ahura Mazda answers with rules of support.
    The obligation is extended to all pregnant females, human and animal, including
    a bitch; for a bitch near her time on the road, the person whose house is nearest
    is identified as responsible, though the provided excerpt ends mid-sentence.
