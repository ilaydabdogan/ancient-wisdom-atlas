canonical_text:
  quote: ''
  summary: The passage gives words to be said aloud for cleansing water, earth, a
    cow, trees, and a faithful man or woman. The formulas worship waters and earth,
    prescribe care for the cow, state that Mazda made plants grow, and invoke beloved
    Airyaman to come for the rejoicing of Zarathustra's men and women and the faithful.
    Translator notes identify Yasna sources and explain the women as heavenly rivers
    or rain waters associated with Ahura, and 'him' in the plant formula as the first-born
    bull whose body after death produced plants.
  language: English
  quote_policy: summarized
