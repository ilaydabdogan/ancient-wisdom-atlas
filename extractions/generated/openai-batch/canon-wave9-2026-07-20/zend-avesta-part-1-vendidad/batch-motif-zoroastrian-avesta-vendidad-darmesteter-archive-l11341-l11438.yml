canonical_text:
  quote: ''
  summary: The passage presents purification and exorcistic formulae. A righteous
    person is told that purity is won through good thoughts, words, and deeds. Fargard
    XI is introduced as spells for driving away Nasu from particular objects. Zarathiutra
    asks Ahura Mazda how to cleanse the house, fire, water, earth, cow, tree, faithful
    people, celestial bodies, boundless light, and all good things made by Mazda.
    Ahura Mazda answers that chanting cleansing, fiend-smiting words, including the
    Ahuna-Vairya five times and object-specific spoken formulae, makes them clean.
  language: English
  quote_policy: summarized
