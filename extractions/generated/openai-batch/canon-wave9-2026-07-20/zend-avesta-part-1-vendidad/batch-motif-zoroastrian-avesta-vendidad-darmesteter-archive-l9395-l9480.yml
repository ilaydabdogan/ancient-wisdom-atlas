canonical_text:
  quote: ''
  summary: Ahura Mazda gives rules for placing a lifeless body in the cleanest and
    driest part of a house at measured distances from fire, water, baresma, and the
    faithful. A shallow or deeper grave is dug and covered; the body remains until
    natural signs appear. The community then opens a breach in the wall, and two corpse-bearers
    carry the body to a constructed place associated with corpse-eating dogs and birds.
    The corpse-bearers are instructed to wash with specified urine under the direction
    of the holy Ratu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The selected place is the part of the house whose ground is described as cleanest,
    driest, and least passed through by flocks, herds, Fire, baresma bundles, and
    the faithful.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The required distance is thirty paces from fire, water, and consecrated baresma
    bundles, and three paces from the faithful.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A grave is to be dug there, with depth depending on whether the earth is hard
    or soft, and its surface is to be covered with dry or purifying materials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lifeless body is to lie there for two or three nights, or for a month,
    until birds fly, plants grow, floods flow, and wind dries waters from the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After those signs, the worshippers of Mazda are to make a breach in the wall
    of the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two strong and skilful men, after stripping their clothes off, are to take
    the body to a building of clay, stones, and mortar where corpse-eating dogs and
    corpse-eating birds are always present.
  category: action
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: The corpse-bearers sit three paces from the dead, and the holy Ratu calls
    for urine with which they will wash their hair and bodies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The prescribed urine is from sheep or oxen, not from man or woman, except
    for the nearest kinsman or nearest kinswoman of the dead.
  category: object
  evidence_refs:
  - ev:5
