  quote: There far from the world the dead were left to lie, beholding the sun.
  summary: The passage describes Zoroastrian rules and explanations for corpse exposure,
    the Dakhma, corpse pollution, demonic associations of bodily emissions, protection
    of fire and other pure elements, and menstrual seclusion.
  language: English
