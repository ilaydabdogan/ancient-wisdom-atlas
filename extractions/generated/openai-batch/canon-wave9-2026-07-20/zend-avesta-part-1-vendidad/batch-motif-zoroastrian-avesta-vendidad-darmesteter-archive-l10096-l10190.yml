canonical_text:
  quote: ''
  summary: The passage asks what Mazda-worshippers should do when they find a fire
    being used to cook or roast a corpse. Ahura Mazda answers that the corpse-burner
    is to be killed, the cauldron and tripod removed, and wood from the contaminated
    fire divided and dispersed through a ninefold measured sequence so that it dies
    out. A later instruction says that when sweet-smelling wood is brought to the
    fire, the perfume carried by the wind enables Fire, called the son of Ahura Mazda,
    to kill many unseen Daevas, fiends, Yatus, and Pairikas.
  language: English
  quote_policy: summarized
