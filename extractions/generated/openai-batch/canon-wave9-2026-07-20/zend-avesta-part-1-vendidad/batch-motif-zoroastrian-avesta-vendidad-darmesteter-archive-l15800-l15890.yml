canonical_text:
  quote: ''
  summary: 'The passage presents repeated promises of livestock offerings to the holy
    Saoka, together with a healing blessing-spell. Mathra Spewta asks how to heal
    the speaker from vast numbers of diseases. Ahura Mazda sends Nairyo-sangha, the
    herald, to Airyaman''s mansion with a message: Angra Mainyu has produced many
    diseases by witchcraft, and Airyaman is asked to heal. The message repeats promised
    offerings and the restorative blessing-spell, and Nairyo-sangha obeys and goes
    to Airyaman.'
  language: English
  quote_policy: summarized
