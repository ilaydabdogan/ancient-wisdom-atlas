  summary: The passage presents Zoroaster/Zarathustra as a mythological and lawgiving
    figure who overthrows demons with word, prayer, glory, and stones given by Ahura;
    describes joy at his birth; recounts Ahura Mazda seeking a boon from Ardvi Sura
    Anahita for his coming; and compares the divine word and storm-weapon imagery
    with several Iranian, Greek, Roman, Indian, and Norse figures or patterns.
  language: English
