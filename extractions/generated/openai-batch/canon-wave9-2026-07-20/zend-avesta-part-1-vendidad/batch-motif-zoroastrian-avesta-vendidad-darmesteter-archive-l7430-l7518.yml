canonical_text:
  quote: ''
  summary: The passage gives a ritual rule involving a corpse, rain, a Dakhma, unclean
    remains, and birds. Zarathustra asks whether Ahura Mazda sends waters from Vouru-kasha
    with wind and clouds down to corpses, Dakhmas, unclean remains, and bones, and
    then back unseen to Puitika. Ahura Mazda confirms this, saying the waters boil
    and are cleansed in Puitika, return to Vouru-kasha toward a well-watered tree
    bearing seeds of every plant, and that he rains plants down on earth for human
    food and cow fodder. Translator notes identify Puitika as a purifying sea, relate
    the water movement to later tide interpretation, and identify the tree as the
    tree of all seeds with the bird Sinamru and the rain-god Tistar.
  language: English
  quote_policy: summarized
