canonical_text:
  quote: ''
  summary: Yima makes and provisions the Vara as an enclosed abode for humans and
    a fold for flocks, with water, birds, food-bearing evergreen banks, and dwellings.
    He brings seeds of humans, cattle, trees, and fruits, two of every kind, to remain
    inexhaustible. The Vara is described as free from defects, poverty, lying, jealousy,
    and the bodily marks of Angra Mainyu. It is organized into streets, sealed with
    a golden ring, and furnished with a door and a self-shining window. Ahura Mazda
    explains that the Vara has uncreated and created lights, with the sun, moon, and
    stars rising and setting only once a year; every fortieth year each couple produces
    a male and female, and its inhabitants live happily.
  language: English
  quote_policy: summarized
