canonical_text:
  quote: ''
  summary: The passage describes moral alignment with Ormazd or Ahriman according
    to deeds; the righteous person’s heavenly reward and final resurrection; Fravashis
    as developed from ancestor-souls; the comparative relation of Vedic Yama and Avestan
    Yima; Yima’s palace or Vara and its blessed inhabitants; and eschatological myths
    of world-ending winter or storm, the serpent Azi Dahaka, awakened heroes, and
    Saoshyant bringing eternal light and life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person belongs to Ormazd or Ahriman according to deeds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man of Asha offers sacrifice to Ormazd and the gods, helps them by good
    thoughts, words, and deeds, spreads life in Ormazd’s world, and narrows Ahriman’s
    realm by destroying Ahriman’s creatures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names priestly, warrior, and husbandman forms of the man of Asha,
    associated respectively with driving away fiends and diseases, crushing the impious,
    and producing plentiful harvests.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The person who does the contrary is called a Drvant, Anashavan, and Ashemaogha,
    described as demon, foe of Asha, and confounder of Asha.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The man of Asha who has lived for Ahura Mazda is said to have a seat near
    him in heaven and later to live again on an earth freed from evil and death when
    the dead rise at the end of time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage compares this heavenly destiny with an Indian faithful person
    going to the palace of Varuna to live with the forefathers, the Pitrs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Fravashis are described as developing from the worship of the Pitrs and
    as becoming an immortal part of the individual that existed before and outlived
    the person.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Veda, Yama, son of Vivasvat, is described as the first man, the first
    of the dead, the king of the dead, and the heavenly gathering center for the departed
    near Varuna.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Avesta, Yima, son of Vivanghat, is described as no longer the first
    man but as the first king and founder of civilisation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The best mortals gather around Yima in a marvellous palace in Airyanem Vaejo
    and live a blessed life there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says that the people in Yima’s Vara came to be understood as a
    supernatural race rather than as the human dead going to a common ancestor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The world is described as lasting a long year of twelve millenniums.
  category: attribute
  evidence_refs:
  - ev:7
