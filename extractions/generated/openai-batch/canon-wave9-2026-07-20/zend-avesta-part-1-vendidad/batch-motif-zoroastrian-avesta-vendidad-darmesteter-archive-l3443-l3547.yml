candidate_motifs:
- id: motif:1
  label: Cosmic moral dualism and allegiance by deeds
  taxonomy_refs:
  - duality
  basis: The passage divides human belonging between Ormazd and Ahriman according
    to deeds and contrasts the man of Asha with enemies of Asha.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an introductory doctrinal summary, not a single narrative episode.
- id: motif:2
  label: Righteous afterlife and resurrection on a purified earth
  taxonomy_refs:
  - afterlife_journey_map
  - resurrection
  basis: The righteous person is seated near Ahura Mazda in heaven, and the dead rise
    at the end of time to live on an earth freed from evil and death.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No detailed itinerary, judge, or ritual procedure is given in this passage.
- id: motif:3
  label: Ancestor-souls as immortal spiritual counterparts
  taxonomy_refs: []
  basis: Fravashis are described as developing from worship of the Pitrs and as immortal
    parts that preexist and outlive individuals.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a doctrinal history rather than a mythic action scene.
- id: motif:4
  label: First king and culture founder hosting the blessed
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  basis: Yima is described as the first king, founder of civilisation, and host of
    the best mortals in a marvellous palace.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The first-man role is said to have shifted away from Yima to Gayo Maratan.
- id: motif:5
  label: Blessed survivors descend from sacred enclosure to repeople the earth
  taxonomy_refs:
  - death_rebirth
  basis: After the world-ending winter, eternal spring comes and the blessed descend
    from Yima’s Vara to repeople the earth.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage names the Vara but does not describe it here as a vessel;
    therefore ark-vessel classification is not assigned.
- id: motif:6
  label: World-ending winter or storm before final renewal
  taxonomy_refs:
  - chaos
  basis: 'The passage preserves two versions of the end: a frightful winter followed
    by eternal spring and a storm version that became definitive.'
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Available taxonomy does not include a specific winter-ending or storm-ending
    family.
- id: motif:7
  label: Eschatological serpent released and slain
  taxonomy_refs:
  - serpent
  - chaos
  basis: Azi Dahaka is let loose and takes hold of the world, while Keresaspa awakens
    to kill the snake finally.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The killing is summarized as a tale rather than narrated in detail.
- id: motif:8
  label: Sleeping, absent, or dead light-hero returns
  taxonomy_refs:
  - return
  - dying_and_returning
  basis: The passage explicitly links temporary disappearance of light to sleep, absence,
    or death and its reappearance to awakening, return, or the arrival of a son.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents this as an explanatory pattern across tales, not
    as one single myth.
- id: motif:9
  label: End-time savior son brings eternal light and life
  taxonomy_refs: []
  basis: Saoshyant is described as a son born to Zarathustra at the end of time, bringing
    eternal light and life to mankind.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not give details of conception or birth, so sacred-birth
    or miraculous-child taxonomy is not assigned.
comparison_claims:
- id: claim:1
  claim: 'The passage treats Avestan Yima and Vedic Yama as closely related counterparts:
    Yama is first man and king of the dead, while Yima retains related heavenly and
    royal attributes after the first-man role is transferred elsewhere.'
  claim_level: same_motif
  target: Vedic Yama/Yamasadanam and Avestan Yima/Airyanem Vaejo-Vara traditions
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  limitations: This is the translator’s comparative introduction, not a direct statement
    from a mythic speaker; it also notes divergence in Yima’s loss of the first-man
    role.
- id: claim:2
  claim: The righteous Zoroastrian afterlife near Ahura Mazda is compared functionally
    with the Indian faithful person living in Varuna’s palace with the Pitrs.
  claim_level: same_function
  target: Zoroastrian heavenly reward and Indian Varuna-Pitrs afterlife comparison
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is brief and does not provide full ritual or doctrinal
    equivalence.
- id: claim:3
  claim: The passage identifies a recurrent mythic pattern in which loss of light
    is expressed as a god or hero sleeping, absent, or dead, and renewed light as
    awakening, return, or the coming of a son.
  claim_level: same_function
  target: Light-disappearance and light-return pattern in end-time hero and savior
    tales
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives an interpretive generalization with examples rather
    than full parallel narratives.
