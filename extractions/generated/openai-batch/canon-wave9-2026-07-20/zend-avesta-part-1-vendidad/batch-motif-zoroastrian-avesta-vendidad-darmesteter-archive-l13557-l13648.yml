canonical_text:
  quote: ''
  summary: The passage includes a legal-religious condemnation of sexual intercourse
    with a woman having an issue of blood, followed by the translator's introduction
    to Fargard XVII on hair and nails. The commentary states that separated body matter
    becomes dead and demonic unless ritually treated. In the opening dialogue of Fargard
    XVII, Zarathustra asks Ahura Mazda which act most increases the Daevas' strength,
    and Ahura Mazda answers that improperly dropping hair or nail cuttings into a
    hole or crack does so.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda prescribes ninety stripes with the Aspahe-astra and ninety stripes
    with the Sraosho-charana for the preceding impurity violation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Intercourse with a woman who has an issue of blood is compared to burning
    the corpse of one's own son and dropping its fat into the fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Such sinners are called embodiments of the Druj, scorners of the law, rebels
    against the Lord, and ungodly men who shall pay with life.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary states that matter separated from the human body is considered
    dead matter and becomes the demon's possession and the abode of death and uncleanness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary says cut hair and nails are withdrawn from demonic power by
    prayers and by burial in earth inside consecrated circles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary compares this concern about hair and nails to beliefs reported
