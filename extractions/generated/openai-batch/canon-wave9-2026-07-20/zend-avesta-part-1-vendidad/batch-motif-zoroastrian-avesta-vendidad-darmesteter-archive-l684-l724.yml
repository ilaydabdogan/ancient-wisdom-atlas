- id: obs:2
  text: Jones's main argument is presented as a claim that books containing silly
    tales, absurd laws and rules, and grotesque descriptions of gods and demons could
    not be the work of Zoroaster or the code of a religion celebrated for simplicity,
    wisdom, and purity.
  category: speech
  evidence_refs:
