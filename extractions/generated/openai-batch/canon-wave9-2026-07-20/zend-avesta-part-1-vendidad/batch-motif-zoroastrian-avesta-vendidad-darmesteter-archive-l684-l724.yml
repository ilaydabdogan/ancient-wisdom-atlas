canonical_text:
  quote: ''
  summary: 'The passage summarizes eighteenth-century European criticism of the Avesta/Vendidad:
    Anquetil''s style is said to have made the material seem stranger; Jones argues
    that the books'' tales, laws, and descriptions of gods and demons are too absurd
    to be from Zoroaster or a pure religion; Richardson adds philological objections;
    and Meiners adds that the books contain unheard-of ideas.'
  language: English
  quote_policy: summarized
