canonical_text:
  quote: ''
  summary: The introduction discusses dating and polemical content in parts of the
    Vendidad. It cites an anathema attributed to Ahura Mazda against teachers of a
    wrong law, compares it with a Parsi passage on good government enforcing true
    religion, then quotes a Vendidad passage ranking marriage, household, children,
    riches, and meat-eating above celibacy, poverty, and abstention. The editor argues
    that this latter passage most likely alludes to Manichean doctrines, while noting
    a weaker resemblance to Christian ascetic teachings.
  language: English
  quote_policy: summarized
