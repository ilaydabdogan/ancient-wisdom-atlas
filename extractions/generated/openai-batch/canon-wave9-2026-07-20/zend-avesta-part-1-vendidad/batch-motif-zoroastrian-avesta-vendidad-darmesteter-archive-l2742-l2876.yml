canonical_text:
  quote: ''
  summary: 'The passage describes Mithra’s relation to Ahura Mazda, Ahura Mazda as
    creator and father of gods, and Ahura’s need for divine aid in conflict with Angra
    Mainyu. It then presents Mazdean dualism as a continual warfare of Good and Evil.
    The passage compares Vedic storm and serpent myths with Avestan forms: Indra against
    Ahi, Atar against Azi Dahaka for the light of xvarenah, and Trita Aptya alongside
    Thraetaona Athwya as slayers of a multi-headed fiend.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mithra is described as literally meaning “a friend,” as light friendly to
    man, and as a lord worthy of sacrifice and glorification; older formulae invoke
    Mithra and Ahura in an indivisible unity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda is described as maker of the world and creator of earth, water,
    trees, mountains, roads, wind, sleep, and light; he is also described as giver
    of life, shape, and food, and as father of named gods and of all gods.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ahura Mazda offers sacrifice to Vayu and asks for favor to smite the world
    of Angra Mainyu; Vayu grants the requested favor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Zoroaster is born, Ahura Mazda entreats Ardvi Sura Anahita that the newborn
    hero may stand by him in the fight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage presents Mazdeism as a system in which Evil becomes a power engaged
    in never-ceasing warfare with Good; Good is centered in Ahura Mazda, and Angra
    Mainyu rises in opposition to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'A Vedic storm battle is described: Indra, armed with lightning and thunder,
