canonical_text:
  quote: ''
  summary: 'The passage describes Spe^ta Armaiti, identified in a note as the earth,
    and a withering touch that diminishes a faithful person''s good thoughts, words,
    deeds, strength, fiend-killing power, and holiness. It says that such creatures
    should be killed even more than snakes, wolves, a fold-attacking she-wolf, or
    a prolific she-frog. Ahura Mazda invites Zarathustra to ask questions. Zarathustra
    asks what atonement is required when a man knowingly has intercourse with a woman
    who has an issue of blood and she knowingly allows it. Ahura Mazda prescribes
    a sequence of expiatory acts: slaughtering a thousand small cattle, offerings
    to fire, offerings to good waters, bringing a thousand loads of soft wood or sweet-scented
    plants to the fire, consecrating a thousand baresma bundles, offering a thousand
    Zaothra-libations with Haoma, meat, and Hadha-naepata roots, and beginning a further
    command to kill a thousand snakes.'
  language: English
  quote_policy: summarized
