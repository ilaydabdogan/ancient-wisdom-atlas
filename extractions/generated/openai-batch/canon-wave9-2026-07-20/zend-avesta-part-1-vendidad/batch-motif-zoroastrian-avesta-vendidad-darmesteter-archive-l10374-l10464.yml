canonical_text:
  quote: ''
  summary: 'Ahura Mazda gives Zarathuitra instructions for a person who has touched
    a corpse in distant fields: wash with gomez in quantities depending on whether
    the Nasu has been smitten by corpse-eating animals; run to seek cleansing while
    publicly declaring the corpse-contact and lack of wilful sin; consequences fall
    on those who refuse to cleanse him; if still uncleansed near an inhabited place,
    he cleanses himself with gomez and water; separate penalties are prescribed when
    water or fire is defiled through his passage or contact with trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a question to Ahura Mazda about someone who has touched
    a corpse in a distant place in the fields, and Ahura Mazda answers while addressing
    holy Zarathuitra.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the Nasu has already been smitten by corpse-eating dogs or corpse-eating
    birds, the corpse-toucher must wash his body with gomez thirty times and rub it
    dry with the hand thirty times, beginning with the head each time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Nasu has not yet been smitten by corpse-eating dogs or corpse-eating
    birds, the corpse-toucher must wash his body with gomez fifteen times and rub
    it dry with the hand fifteen times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corpse-toucher must run a Hathra until he meets a man, then cry out that
    he has touched a corpse without wilful sin of mind, tongue, or hand and wants
    to be made clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the first man refuses to cleanse him, that man takes a third of his trespass;
    refusal after the second Hathra gives half of the trespass; refusal after the
    third Hathra gives the whole trespass.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The corpse-toucher continues until he comes near a house, borough, town, or
    inhabited district; if they refuse to cleanse him, he cleanses his body with gomez
    and water and is clean.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If he found water on his way, the water requires atonement, with a penalty
    of four hundred stripes with the Aspahe-astra and four hundred stripes with the
    Sraosho-karana.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If he found trees on his way, the fire requires atonement, with the same penalty
    of four hundred stripes with each named instrument; the note identifies the trees
    as fit for fire.
  category: action
  evidence_refs:
  - ev:7
