  quote: ''
  summary: The passage gives legal-ritual cases in which throwing bones or a whole
    dead body of a dog or man onto the ground, with grease or marrow flowing onto
    it, brings escalating numbers of stripes. A later case asks what a Mazda-worshipper
    should do when encountering a corpse in running water; Ahura Mazda instructs him
    to remove shoes and clothes, enter the river, and take the dead out of the water.
