  quote: "“Water was looked upon in the same light.”"
  summary: 'The passage describes fire as holy, fiend-destroying, and properly restored
    to its altar after profane use; it condemns wanton degradation of fire, especially
    mouth-blowing and burning the dead. It then presents water and earth as similarly
    holy: dead matter must not be brought to water, and corpses must not defile the
    earth, where the goddess Spenta Armaiti is said to dwell.'
