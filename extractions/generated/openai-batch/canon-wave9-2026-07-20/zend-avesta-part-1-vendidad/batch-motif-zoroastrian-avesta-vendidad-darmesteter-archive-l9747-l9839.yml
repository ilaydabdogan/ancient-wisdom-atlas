canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about corpse contact and ritual cleansing.
    A man who touched a long-dried corpse is declared clean because dry does not mingle
    with dry. A man who touched the corpse of a dog or man can be cleansed. If the
    Nasu has been smitten by corpse-eating dogs or birds, washing with gomez and water
    suffices. If not, the worshippers of Mazda dig repeated sets of three holes, the
    man washes first with gomez, a dog is brought before him, he dries, and then he
    washes with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda says that a man who touched a corpse dried up and dead more than
    a year shall be clean.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason is that dry does not mingle with dry; the answer adds a
    hypothetical warning about the material world being filled with Peshotanus and
    wailing souls if dry mingled with dry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda says that a man who has touched the corpse of a dog or the corpse
    of a man can be made clean.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the Nasu has already been smitten by corpse-eating dogs or corpse-eating
    birds, the man is to cleanse his body with gomez and water and will be clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the Nasu has not yet been smitten by corpse-eating dogs or birds, the worshippers
    of Mazda are to dig three holes in the ground, and the man washes with gomez rather
    than water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the first washing with gomez, a dog is lifted and brought in front of
    the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A second set of three holes is dug; the man again washes with gomez, the dog
    is again brought in front of him, and they wait until he is dry to the last hair
    on his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A third set of three holes is dug, and the man washes with water rather than
    gomez.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The next instruction begins by saying that he shall first wash his hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The translator's notes identify the simpler case with Sag-did having been
    performed and the longer procedure with Barashnum being necessary when Sag-did
    has not been performed.
  category: other
  evidence_refs:
  - ev:8
