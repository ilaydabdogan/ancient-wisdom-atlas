canonical_text:
  quote: ''
  summary: Ahura Mazda gives ritual instructions for removing a corpse from water,
    describes the extent of pollution attributed to the Druj Nasu, and states how
    much water must be drawn off before the remaining pond water is clean for cattle
    and people to drink. A commentary note evaluates removal of the corpse as a pious
    deed and failure to remove it as a sin.
  language: English
