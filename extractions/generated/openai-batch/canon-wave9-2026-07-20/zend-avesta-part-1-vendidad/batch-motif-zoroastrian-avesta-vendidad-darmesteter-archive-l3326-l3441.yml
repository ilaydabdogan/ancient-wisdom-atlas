canonical_text:
  quote: ''
  summary: The passage describes Zoroastrian cosmic dualism in which beneficent beings
    and demonic opponents are paired, the whole world and animal realm are enlisted
    under Ahura/Ormazd or Angra Mainyu/Ahriman, some animals are ritually classified
    as Ahrimanian or Ormazdean, and Tistrya’s battle with Apaosha expands into a celestial
    alignment of stars against planets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khshathra Vairya is associated with molten brass and lightning-fire; Asha
    Vahista is associated with sacrificial fire; Armaiti is described as a goddess
    of earth; and Vohu-mano is linked with living creation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Amesha Spentas are said to have projected opposing Daevas or demons, described
    as inverted images of the gods they oppose.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Haurvatat and Ameretat, associated with health and life and later with waters
    and trees, are opposed by Tauru and Zairi, associated with sickness, decay, thirst,
    and hunger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vohu-mano, good thought, is paired against Akomano, evil thought; Sauru, Indra,
    and Naunhaithya are set against Khshathra Vairya, Asha Vahista, and Spenta Armaiti.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that everything in the world participates in a conflict
    and is attributed to either Ahura or Angra Mainyu according to whether it works
    for good or harm, life or its opposition.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Animals are described as enlisted under one spirit or the other and as belonging
    to Ormazd or Ahriman according to usefulness or harmfulness to humans, or according
    to earlier mythic incarnation as god or fiend.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage explains the serpent image through storm imagery: the storm fiend
    is said to wrap a goddess of light or milch cows of the raining heavens with cloud
    coils like a snake’s folds.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Killing Ahrimanian creatures called Khrafstras is described as killing Ahriman
    himself and as a means of atonement; killing an Ormazdean animal is described
    as an abomination.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tistrya is described as the conqueror of Apaosha and appears in mythic descriptions
    as a boar with golden horns, a horse with yellow ears, and a beautiful youth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Stars are placed on Ahura’s side with Tistrya, while planets are said to pass
    into Ahriman’s army.
  category: relationship
  evidence_refs:
  - ev:6
