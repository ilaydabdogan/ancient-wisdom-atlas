canonical_text:
  quote: "“a fair maid or bride carried off by the fiend”"
  summary: 'The passage surveys demonic figures and mythic patterns in the Vendidad
    introduction: Pairikas as seducing or water-withholding nymphs; Khnathaiti, Bushyasta,
    and Cahi as related demonesses; Keresaspa as a demon-smiting hero associated with
    sleep and end-time combat; storm fiends including Aeshma and Varenya daevas; several
    personifications of death; and sacrifice as human assistance to gods in their
    conflict with fiends.'
  language: English
  quote_policy: quoted
