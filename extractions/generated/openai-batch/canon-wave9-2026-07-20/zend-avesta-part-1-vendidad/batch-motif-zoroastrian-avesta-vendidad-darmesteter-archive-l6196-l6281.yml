canonical_text:
  quote: ''
  summary: 'In a dialogue, Ahura Mazda gives rules for separating an unnamed man from
    fire, water, consecrated baresma, and the faithful; placing him in an enclosure
    with coarse food and worn clothes until old age; and then having him flayed and
    beheaded on a mountain, with his corpse delivered to ravens and repentance declared.
    The passage then names acts that greatly rejoice the Earth: filling burrows of
    creatures of Angra Mainyu and cultivating, watering, or drying land. Unsown land
    is compared to a childless maiden wanting a husband.'
  language: English
  quote_policy: summarized
