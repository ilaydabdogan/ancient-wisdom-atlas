canonical_text:
  quote: ''
  summary: Ahura Mazda praises purity as the greatest good after life and links it
    to the Mazdean law and to cleansing oneself with good thoughts, words, and deeds.
    The law of Zarathustra/Mazda is called fiend-destroying and is exalted above all
    other utterances through comparisons with the sea above floods, a great stream
    above a rivulet, a great tree above small plants, and heaven above earth. The
    passage then turns to ritual procedure involving the Ratu, the Sraosha-varez,
    and draona-services, stating that the Ratu has power to remit the person concerned.
  language: English
  quote_policy: summarized
