  summary: Introductory prose identifies the Zend-Avesta as the sacred book of the
    Parsis, describes the Parsis as a remnant community that migrated to India after
    conquest, presents the Avesta as the fragmentary remains of an older Iranian religion,
    and surveys Greek, late antique, medieval, Renaissance, and early modern European
    engagement with Zoroaster, Mazdeism, and Parsi books.
