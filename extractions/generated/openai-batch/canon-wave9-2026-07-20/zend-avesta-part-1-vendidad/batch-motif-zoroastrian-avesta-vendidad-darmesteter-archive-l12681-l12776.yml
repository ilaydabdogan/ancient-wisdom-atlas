canonical_text:
  quote: ''
  summary: 'The passage gives prescriptions for atonement connected with the soul
    of the water dog: killing large numbers of specified noxious creatures, filling
    holes associated with uncleanness, and donating sets of fire implements and priestly
    instruments to godly men. Notes gloss several animals and implements, including
    the Paitidana mouth-veil and the Khrafstraghna, an instrument for killing snakes
    and similar creatures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A commanded person is to kill ten thousand each of several animal groups,
    including dog-shaped snakes, tortoises, land frogs, water frogs, corn-carrying
    ants, and biting or hole-digging ants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same prescription adds the killing of ten thousand earth worms and ten
    thousand horrid flies, glossed in a note as corpse flies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commanded person is to fill up ten thousand holes associated with the
    unclean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commanded person is to give twice seven sets of implements for fire to
    godly men as an atonement for the soul of the water dog.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fire implements include proper materials for fire, a broom, tongs, bellows
    or a fan, an adze, and a saw, with the sharp tools connected to procuring wood
    for the fire of Ahura Mazda.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The commanded person is also to give godly men a set of priestly instruments
    used by priests as atonement for the soul of the water dog.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The listed priestly instruments include the Astra, a meat- or possibly milk-vessel,
    the Paitidana, and the Khrafstraghna.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note describes the Paitidana as a mouth-veil worn by priests while on duty
    and by laymen while praying or eating, because breath is treated as defiling what
    it touches.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note defines the Khrafstraghna as a Khrafstra-killer, an instrument for
    killing snakes and similar creatures.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note reports that a Parsi Ravaet paraphrase numbers the cat among Khrafstras
    that are to be killed to redeem a sin.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note compares the mouth-veil principle with a Slavonian priest in Arkona
    leaving the temple to draw breath so that mortal breath would not defile the god's
    presence.
  category: other
  evidence_refs:
  - ev:9
