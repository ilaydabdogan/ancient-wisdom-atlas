canonical_text:
  quote: ''
  summary: The passage identifies the bird Karshipta as the one who brought Mazda's
    law into Yima's Vara, and names Urvata-nara and Zarathustra as rulers there. Editorial
    notes describe Karshipta as heavenly and as reciting the Avesta in bird-language,
    and identify Urvata-nara as one of Zarathustra's sons. Fargard III then introduces
    the Earth and asks where the Earth feels most happy; the first such place is where
    a faithful person steps forward carrying holy wood, baresma, and holy meat. Notes
    explain the holy wood and baresma as liturgical implements.
  language: English
