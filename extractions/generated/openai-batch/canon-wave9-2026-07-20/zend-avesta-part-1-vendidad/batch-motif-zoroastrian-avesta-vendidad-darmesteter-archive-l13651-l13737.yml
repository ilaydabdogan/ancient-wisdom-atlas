canonical_text:
  quote: ''
  summary: The passage prescribes ritual disposal of cut hair and nails. Failure to
    observe lawful rites is said to produce Daevas and destructive lice. Hair and
    nails must be kept at set distances from the faithful, fire, water, and baresma,
    then buried with fiend-smiting words, metal-knife furrows, and repeated Ahuna-Vairya
    chants. Nails are addressed to the Asho-zusta bird so that they become weapons
    against Mazainya Daevas; if not dedicated, they are said to fall into demonic
    hands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When lawful rites are not observed, Daevas are said to be produced in the
    earth, along with Khrafstras identified as lice that eat corn in fields and clothes
    in wardrobes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who combs or shaves hair or pares nails must remove the cut material
    specific distances from the faithful, fire, water, and consecrated baresma bundles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hair is to be placed in a dug hole whose depth depends on whether the earth
    is hard or soft, while fiend-smiting words about Mazda making plants grow are
    spoken aloud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Around the hair hole, three, six, or nine furrows are drawn with a metal knife,
    and the Ahuna-Vairya is chanted three, six, or nine times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For nails, a hole is dug outside the house as deep as the top joint of the
    little finger, and fiend-smiting words are spoken over the nails.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: The same pattern of three, six, or nine metal-knife furrows and three, six,
    or nine Ahuna-Vairya chants is prescribed for the nail hole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: The speaker addresses the Asho-zusta bird, presents the nails to it, and wishes
    that the nails become spears, knives, bows, falcon-winged arrows, and sling-stones
    against the Mazainya Daevas.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: If the nails have not been dedicated to the bird, the passage says they will
    be in the hands of the Mazainya Daevas as weapons.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:9
  text: A translator note identifies the Asho-zusta bird with the owl according to
    modern tradition and cites a Bundahishn explanation in which spells prevent fiends
    from taking up the nails.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: A translator note explains the hair formula through a microcosmic theory in
    which human elements return to corresponding natural elements and come back at
    resurrection.
  category: other
  evidence_refs:
  - ev:5
