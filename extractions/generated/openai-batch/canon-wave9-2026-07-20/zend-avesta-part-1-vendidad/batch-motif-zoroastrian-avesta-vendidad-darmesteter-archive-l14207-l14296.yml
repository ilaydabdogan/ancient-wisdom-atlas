canonical_text:
  quote: ''
  summary: 'The passage first preserves a fragment about a wise, clever man who knows
    the Yasna and revealed law, is called the Word incarnate, and is to receive a
    name containing Fire. Sraosha then interrogates the Druj demon about a fourth
    offender: anyone over fifteen who walks without the sacred girdle and sacred shirt.
    The Druj says that at the fourth step the Daevas wither such a person and that
    there is no countermeasure. A new dialogue follows in which Ahura Mazda invites
    Zarathustra to ask; Zarathustra asks who most grieves and pains Ahura Mazda. Ahura
    Mazda names the Cahi, who goes after faithful and unfaithful, Mazda-worshippers
    and Daeva-worshippers, wicked and righteous; her look dries one third of mountain
    floods and withers one third of plants and grass.'
  language: English
  quote_policy: summarized
