- id: obs:4
  text: Dakhmas are described in the note as unclean because they remain in contact
    with the dead, and their sites may be restored to natural purity by being pulled
    down periodically.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Earth rejoices at a person who pulls down many Dakhmas on which corpses
