canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about places where the Earth feels grief
    or joy. The Earth grieves where Angra Mainyu's creatures burrow and where the
    family of a faithful person is driven into captivity. The Earth rejoices when
    corpses are removed from it and when Dakhmas containing corpses are pulled down.
    The passage forbids a man to carry a corpse alone, describes Nasu/Druj defiling
    him from the corpse, and assigns such a man to an isolated, dry, minimally traversed
    place.
  language: English
  quote_policy: summarized
