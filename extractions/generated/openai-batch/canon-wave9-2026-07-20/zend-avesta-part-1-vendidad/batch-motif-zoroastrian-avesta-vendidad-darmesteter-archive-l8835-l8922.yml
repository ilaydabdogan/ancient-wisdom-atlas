  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the healer treats three worshippers of the Daevas with the knife and each
    recovers, he is permanently fit to practice healing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After being qualified, the healer may attend worshippers of Mazda and heal
    them with the knife.
  category: action
  evidence_refs:
  - ev:8
