- id: obs:3
  text: The required treatment of corn around dead matter is specified according to
    conditions such as dry or wet, sown or not sown, reaped or not reaped, ground
    or not ground, and kneaded or not kneaded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A question asks whether a Mazda-worshipping person who wants to practice healing
    should first prove his skill on worshippers of Mazda or on worshippers of the
    Daevas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura Mazda answers that the healer should first prove himself on worshippers
    of the Daevas rather than on worshippers of Mazda.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the healer treats three worshippers of the Daevas with the knife and each
    dies, he is permanently unfit to practice healing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A healer who has become unfit must not attend or wound a worshipper of Mazda
