canonical_text:
  quote: ''
  summary: 'The passage gives rules for handling corn around dead matter and cleansing
    it by sprinkling water. It then states that a would-be healer should first prove
    his skill on worshippers of the Daevas: three fatal knife treatments make him
    permanently unfit, while three successful recoveries make him permanently fit
    to treat and heal worshippers of Mazda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the Nasu has already been struck by corpse-eating dogs or birds, corn
    is to be laid apart on the ground around the dead matter, with the distance depending
    on whether the corn is dry or wet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corn is to be sprinkled once with water, after which it is declared clean.
  category: action
  evidence_refs:
