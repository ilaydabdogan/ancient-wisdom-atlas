canonical_text:
  quote: ''
  summary: Ahura Mazda identifies a dawn-calling bird. The bird tells men to rise,
    recite a prayer against the Daevas, and resist Bushyasta, who lulls the living
    world back to sleep. The passage contrasts good thoughts, words, and deeds with
    bad thoughts, words, and deeds. In the three parts of the night, Fire, called
    the son of Ahura Mazda, asks the master of the house, the husbandman, and Sraosha
    for clean wood and warns that Azi, made by the Daevas, seeks to put out Fire’s
    life. Sraosha then wakes the bird, which repeats the dawn warning.
  language: English
  quote_policy: summarized
