canonical_text:
  quote: He that does not restore (a thing lent), when it is asked for back again,
    steals the thing; he robs the man.
  summary: The passage closes a prior section by saying that the law of Mazda cleanses
    the faithful and effects atonement, then introduces Fargard IV on contracts and
    outrages. It states that failing to return a lent object when asked is theft and
    robbery, and it records Ahura Mazda saying that contracts are six in number, beginning
    with the word-contract. Notes explain bad-faith debt, spoken contracts, and a
    parallel statement about breaking one's word before Hormazd.
  language: English
