  summary: The passage first states that repentance remits or absolves wrongdoing.
    It then presents a question about men resting close together when one dies, and
    Ahura Mazda answers with graded rules for how far the Druj Nasu spreads infection,
    pollution, and uncleanness from different kinds of dead persons or dogs.
