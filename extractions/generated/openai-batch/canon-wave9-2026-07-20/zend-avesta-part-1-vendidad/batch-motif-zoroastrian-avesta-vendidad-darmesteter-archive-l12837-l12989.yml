canonical_text:
  quote: ''
  summary: 'The passage lists prescribed atonements for the soul of the water dog:
    gifts of agricultural tools, precious metals, running water, land, housing, beds,
    a maiden, cattle, care for whelps and dogs, bridges, stable repairs, and feeding
    holy men. It states that completing the atonement leads to the world of the holy
    ones, while failing to complete it leads to a dark world of the wicked. The next
    section begins a list of five unconfessed and unatoned sins that make a person
    a Peshotanu, beginning with knowingly teaching a faithful person a foreign wrong
    creed and law.'
  language: English
  quote_policy: summarized
