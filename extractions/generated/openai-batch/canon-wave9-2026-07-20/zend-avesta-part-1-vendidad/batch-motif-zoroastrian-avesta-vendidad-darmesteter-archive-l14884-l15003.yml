canonical_text:
  quote: ''
  summary: The passage describes the righteous soul after death being met by a beautiful
    maid with dogs, ascending above Hara-berezaiti and the Cinvat bridge into the
    presence of heavenly gods, being addressed by Vohu-mano, and passing to the golden
    seats and heavenly abode of Ahura Mazda and the Amesha-Spentas. It also describes
    Daevas trembling at the perfume of the cleansed godly soul, righteous souls gathered
    with Nairyo-sangha, and Zarathustra invoking the holy world and its cosmic elements.
  language: English
  quote_policy: summarized
