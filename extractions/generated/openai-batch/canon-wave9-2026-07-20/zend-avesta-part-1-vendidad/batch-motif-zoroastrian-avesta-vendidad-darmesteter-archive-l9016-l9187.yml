canonical_text:
  quote: ''
  summary: Ahura Mazda answers Zarathustra on Dakhmas, corpse dust, sin-remission
    from pulling down Dakhmas, the soul's passage to the blissful world, fiends gathering
    and feeding at corpse-sites, disease arising from Dakhmas, and ritual handling
    of a woman who gives birth to a still-born child, including enclosure, measured
    distances from sacred things, prescribed foods and drinks, and washing after three
    nights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ground of a Dakhma is not restored until the dust of the corpse has mingled
    with the dust of the earth, and Ahura Mazda urges people to pull down Dakhmas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who pulls down even a body-sized portion of Dakhmas has sins in thought,
    word, and deed remitted and atoned for.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For such a person's soul, the two spirits will not wage war; when he enters
    the blissful world, the stars, moon, sun, and Ahura Mazda rejoice in him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Zarathustra asks where fiends and their worshippers are and where troops of
    fiends rush together to kill multitudes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:5
  text: Ahura Mazda identifies Dakhmas built on the earth, where corpses of dead men
    are laid, as the place where fiends and their troops gather.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fiends take food and void filth on the Dakhmas, eating corpses, and the
    smell there is described as the smell of their feeding.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: From Dakhmas arise infection and diseases, and death has most power there
    after sundown.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: For people of evil spirit who do not seek better spirit, the Gainis make those
    diseases stronger by a third.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When a woman in a Mazdean house brings forth a still-born child, the place
    selected for her is to be clean, dry, and little passed through by flocks, herds,
    Fire, baresma bundles, and the faithful.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The prescribed place is thirty paces from fire, water, and consecrated baresma
    bundles, and three paces from the faithful.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The worshippers of Mazda erect an enclosure and establish the woman there
    with food and clothes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The woman first drinks gomez mixed with ashes in three, six, or nine cups,
    followed by boiling milk, cooked meat, bread, and wine without water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: She remains under this regimen for three nights, then washes her body and
    clothes with gomez and water by the nine holes and becomes clean.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage ends with a question about whether she may drink water if fever
    or the twofold plague of hunger and thirst befall her unclean body.
  category: speech
  evidence_refs:
  - ev:10
