- id: obs:3
  text: The Dinkar/ is cited as assigning a date to the final edition and promulgation
    of the Avesta as national sacred law, in a period when Mazdeism had been threatened
    by Mani's religion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kissah-i Sanjah is summarized as presenting Zoroaster prophesying that
    the holy religion would be overthrown three times and restored three times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The threefold prophecy names an overthrow by Iskander followed by restoration
    by Ardeshir, another restoration by Shapur II and Adarbad Mahraspand, and a final
    overthrow by the Arabs followed by restoration at the end of time by Soshyos.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Adarbad is described as a holy man under Shapur II who gave a sign of the
    truth of the religion by allowing melted brass to be poured on his breast without
    injury.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says that Adarbad restored Mazdeism, gave a definitive form to
    the religious book of Iran, and closed the Holy Writ.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The Parsi Patet is said to acknowledge three founders of the Avesta: Zoroaster,
