    than the last century of the Sassanian dynasty because it alludes to the death
    of Mazdak, son of Bamdad.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author argues that although some Zend texts could theoretically be late,
    the bulk of the Avesta is pre-Sassanian.
  category: attribute
