canonical_text:
  quote: ''
  summary: A scholarly introduction discusses the date and final redaction of the
    Avesta. It links the definitive form of the Avesta to Shapur II and Adarbad Mahraspand
    after the threat of Manichaeism. It reports a Parsi tradition in which Zoroaster
    prophesies three overthrows and three restorations of the holy religion, and it
    recounts Adarbad's miraculous ordeal with melted brass as a sign of religious
    truth. It also describes a chain of Avesta transmission from Ormazd to Zoroaster,
    then to Gamasp, and finally to Adarbad, who restored it to purity.
  language: English
  quote_policy: summarized
