canonical_text:
  quote: ''
  summary: The passage treats agreements among men of the same faith concerning goods,
    a wife, or knowledge; prescribes disciplined learning of the holy word; warns
    before water and blazing fire against denying receipt of a neighbor's ox or garment;
    asserts the superior standing of men with wives, houses, children, and riches;
    and contrasts a meat-filled man, filled with the good spirit, with one who does
    not eat. Translator notes explain contract categories, oath context, childlessness
    and an afterlife bridge tradition, and the interpretation of the good spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men of the same faith, described as friends or brothers, may enter an agreement
    for goods, a wife, or knowledge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The recipient of goods is to have them delivered; the recipient of a wife
    is to receive and wed her; the recipient of knowledge is to be taught the holy
    word.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The learner is instructed to study in the first and last parts of the day
    and night, to give thanks and pray to the gods, and to rest in the middle parts
    of day and night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The learner continues until he can say all the words said by former Aethrapaitis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before water and blazing fire, no one is to deny having received an ox or
    garment from a neighbor.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A translator note says the water and blazing fire are the elements before
    which an oath is taken and that the clause is directed against false oaths.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that a man with a wife, house, children, and riches is
    far above men lacking those things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that a man filled with meat is filled with the good spirit
