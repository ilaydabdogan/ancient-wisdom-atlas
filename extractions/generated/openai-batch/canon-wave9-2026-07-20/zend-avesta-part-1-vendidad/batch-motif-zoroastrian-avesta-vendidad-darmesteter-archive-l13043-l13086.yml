canonical_text:
  quote: ''
  summary: The passage gives legal-religious rules about conception after a man approaches
    a damsel. It forbids her, from fear of public opinion, to induce menses against
    nature by water and plants, and states that doing so is a sin. A commentary glosses
    the substances as drugs and describes a procedure in which, if the woman was forced,
    the man publicly acknowledges the pregnancy before kin and household members and
    supports her as a husband would. A preceding fragment also links harm causing
    death in pregnancy with grave sin for the man.
  language: English
