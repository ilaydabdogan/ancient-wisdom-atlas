  quote: ''
  summary: The passage discusses the fragmentary preservation of Mazdean sacred literature.
    It attributes losses to the Arab conquest, the exodus of the Parsis, and earlier
    traditions about Alexander burning most of the original Avesta. It also describes
    liturgical recitation as a reason for the preservation of parts of the Avesta,
    names surviving fragments, and reports a Parsi tradition that the primitive Avesta
    was revealed by Ormazd to Zoroaster and transmitted to King Vistasp.
  language: English
  quote_policy: summarized
