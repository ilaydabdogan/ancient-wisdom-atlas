    one who loses it falls.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yima loses the sovereign light and perishes, after which Azi Dahaka reigns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
