canonical_text:
  quote: ''
  summary: 'The passage summarizes several mythological and theological themes: Tistrya
    defeats Apaosha to release the rains; Verethraghna, Vayu, Rama Hvastra, and related
    figures are described in storm, fire, atmospheric, and pastoral terms; Vayu/Vai
    becomes a liminal space of encounter between good and evil powers; Azi Dahaka
    seizes royal glory from Yima, becomes the legendary Zohak, and is bound until
    the end of the world; demons such as Yatus and Pairikas are discussed with Indo-Iranian
    and Vedic parallels.'
  language: English
  quote_policy: summarized
