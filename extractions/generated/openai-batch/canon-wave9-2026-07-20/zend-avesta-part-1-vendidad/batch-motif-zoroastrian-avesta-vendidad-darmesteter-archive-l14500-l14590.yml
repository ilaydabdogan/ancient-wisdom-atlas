canonical_text:
  quote: ''
  summary: In this Vendidad passage, hostile beings discuss Zarathustra's death, and
    Zarathustra perceives their counsel. He advances unshaken against Angra Mainyu,
    carrying house-sized stones obtained from Ahura Mazda. Angra Mainyu questions
    him, asks him not to destroy evil creatures, and offers a boon if he renounces
    the Mazda-worshippers' law. Zarathustra refuses and names sacred ritual objects,
    Haoma, and Mazda-taught Words as his weapons, given by Spenta Mainyu.
  language: English
  quote_policy: summarized
