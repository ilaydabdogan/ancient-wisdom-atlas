  quote: this is a work of the Daevas
  summary: The passage prescribes continued seclusion for a woman who still sees blood
    through successive nights; after nine nights the condition is attributed to the
    Daevas. It then describes clearing a way, digging three holes, washing the woman
    with gomez and water, killing seasonal Khrafstras, and penalties announced by
    Ahura Mazda for suppressing the issue or willfully touching or lying by such a
    woman.
