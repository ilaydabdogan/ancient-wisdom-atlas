  quote: ''
  summary: 'The passage gives part of a cleansing procedure: hands must be washed
    first, then water is sprinkled on the forepart of the skull. A question-and-answer
    sequence asks where the Druj/Drug Nasu rushes when the good waters reach successive
    parts of the head. Ahura Mazda answers with body locations, and a note summarizes
    the Nasu as expelled symmetrically downward through the body.'
