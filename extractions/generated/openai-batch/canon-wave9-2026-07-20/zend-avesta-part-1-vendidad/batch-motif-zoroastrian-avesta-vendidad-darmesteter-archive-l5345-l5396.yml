  quote: ''
  summary: The passage continues a catalogue of lands created by Ahura Mazda and evils
    counter-created by Angra Mainyu. It names Aakhra, Varena, the Seven Rivers, and
    a land by the floods of the Rangha; it also mentions Thraetaona, who smote Az
    Dahaka, and several afflictions including corpse burning, abnormal issues in women,
    oppression by foreign rulers, excessive heat, and headless people.
