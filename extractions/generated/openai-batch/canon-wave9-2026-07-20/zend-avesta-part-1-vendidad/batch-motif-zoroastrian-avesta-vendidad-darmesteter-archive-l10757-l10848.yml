canonical_text:
  quote: ''
  summary: Ritual instructions describe sprinkling the man's lower body in sequence,
    driving the Druj Nasu from knees to legs, ankles, insteps, soles, and toes. The
    Nasu is finally expelled northward in the form of a foul raging fly. The officiant
    recites fiend-smiting and healing words invoking Mazda, Ahura, Atar, Vohu-mano,
    Sraosha, and Armaiti Spenta, and repeats these words at the first and second holes
    as the man becomes freer from the Nasu.
  language: English
  quote_policy: summarized
