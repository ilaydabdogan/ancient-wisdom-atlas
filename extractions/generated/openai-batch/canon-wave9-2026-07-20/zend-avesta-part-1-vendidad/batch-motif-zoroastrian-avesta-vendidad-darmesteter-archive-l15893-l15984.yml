canonical_text:
  quote: ''
  summary: Ahura Mazda speaks of making a shining mansion, of Angra Mainyu creating
    many diseases by witchcraft, and of Airyaman being asked to heal. Gifts and sacrifices
    to Saoka are promised, a holy blessing-spell is described as restoring the sick,
    and Airyaman goes to the mountain and forest of holy questions with ninefold animals,
    twigs, and furrows. An exorcistic formula drives away sickness, death, named diseases,
    and harmful beings.
  language: English
  quote_policy: summarized
