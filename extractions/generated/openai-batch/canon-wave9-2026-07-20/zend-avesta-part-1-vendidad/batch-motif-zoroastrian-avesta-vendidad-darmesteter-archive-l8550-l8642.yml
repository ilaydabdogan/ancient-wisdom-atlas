canonical_text:
  quote: ''
  summary: The passage describes how the Druj Nasu defiles successive ranks of dogs
    and particular bedding or clothing associated with a corpse. Ahura Mazda explains
    when a garment touched by a dog carcass or human corpse can be purified and when
    it must be torn and buried. Different materials require repeated washing with
    gomez, rubbing with earth, washing with water, and exposure to air. A quoted clause
    names Ardvi Sura as a spring that purifies seed, fruit in the womb, and milk in
    the breast. The passage then asks whether cleansed clothes may be used by priests
    or other social groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Druj Nasu is said to rush forth when different kinds of dogs are involved
    and to fall on numbered persons or ranks, defiling the remaining ones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Druj Nasu is said to defile the upper sheet and inner garment with infection,
    uncleanness, and pollution.
  category: action
  evidence_refs:
