- id: obs:3
  text: A garment touched by the carcass of a dog or the corpse of a man can be made
    clean according to Ahura Mazda.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the garment has also been defiled with seed, sweat, dirt, or vomit, the
