canonical_text:
  quote: He who sows corn, sows holiness
  summary: The passage praises tilling and sowing as sacred acts. The Earth is personified
    as speaking to those who till and those who do not. Cultivation brings food, abundance,
    and holiness, while failure to till leads to dependence and begging. Grain growth
    and processing are described as weakening, expelling, or destroying the Daevas.
    A priestly saying teaches that eating sustains material life and enables holy
    work, husbandry, and begetting children.
  language: English
  quote_policy: quoted
