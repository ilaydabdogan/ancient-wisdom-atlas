  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: During that year, worshippers of Mazda must not sow or water the affected
    part of the ground, though they may cultivate the rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
