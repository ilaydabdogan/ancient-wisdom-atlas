canonical_text:
  quote: ''
  summary: Ahura Mazda gives rules about corpse-related defilement. Valuable things,
    including thread or clothing, are not to be wasted on a dead body; the offender
    is excluded from the happy realm and goes to the dark world of fiends through
    his own deeds. Ground on which dogs or people have died must lie fallow for a
    year, must not be watered or sown during that time, and must be inspected for
    remains before reuse. Graded penalties are assigned for defiling ground with bones
    and fluids from the dead.
  language: English
  quote_policy: summarized
