canonical_text:
  quote: ''
  summary: Ahura Mazda answers repeated questions about how to cleanse a house after
    a death. The prescribed procedure includes triple washing of bodies and clothes,
    triple chanting of the Gathas, offerings to Fire, baresma, and good waters, after
    which waters, fire, and the Amesha-Spentas may enter the house. The passage also
    gives different waiting periods after deaths of cousins and more distant cousin-descendants,
    with longer periods for sinners than for the righteous, and begins a case concerning
    a non-adherent stranger.
  language: English
  quote_policy: summarized
