  summary: The passage describes the decipherment of ancient Persian inscriptions
    and its effect on the perceived authenticity of the Zend-Avesta, then introduces
    a scholarly controversy between interpreters who rely on Pahlavi tradition and
    those who rely on comparison with the Vedas. It reports claims that the Veda illuminates
    the Avesta and reveals forgotten origins of gods and heroes, followed by the traditionalist
    reply that relationship is not identity.
