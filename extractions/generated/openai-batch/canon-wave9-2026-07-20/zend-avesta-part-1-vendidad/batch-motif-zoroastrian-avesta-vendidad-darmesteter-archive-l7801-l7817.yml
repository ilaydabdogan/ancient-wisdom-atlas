  quote: ''
  summary: A question asks when fire may be brought back into a house where a man
    has died. Ahura Mazda answers that the prescribed waiting period is nine nights
    in winter and one month in summer. A second question asks the penalty for bringing
    the fire back sooner, and Ahura Mazda states a Peshotanu penalty of two hundred
    stripes with each of two named implements.
