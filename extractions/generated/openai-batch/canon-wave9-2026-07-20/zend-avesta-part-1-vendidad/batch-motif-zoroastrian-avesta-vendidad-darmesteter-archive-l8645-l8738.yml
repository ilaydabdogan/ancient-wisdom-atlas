canonical_text:
  quote: ''
  summary: Ahura Mazda gives rules about previously polluted clothing, forbidding
    its use by priests and ordinary social classes but allowing it as bedding for
    infirm persons, while forbidding waste of useful material. He declares that putting
    clothing on a corpse excludes a person from the happy realm and sends sinners
    to a dark world of fiends. He also states that eating a dog or human carcass,
    or bringing a corpse with filth into water or fire, makes a person incapable of
    becoming clean again; such pollution is linked with Nasu, pests, drought, and
    fiend-produced winter.
  language: English
  quote_policy: summarized
