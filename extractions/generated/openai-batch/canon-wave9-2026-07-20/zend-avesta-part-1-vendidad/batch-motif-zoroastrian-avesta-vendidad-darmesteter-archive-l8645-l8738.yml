  text: Ahura Mazda says the washed and cleansed clothes in question may never be
    used by named ritual functionaries, by any priest, warrior, or husbandman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a Mazdean house, a woman in sickness or a man unfit for work may use those
    clothes as coverings and sheets until they can withdraw and move their hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda says that anything of value should not be wasted, even a very
    small amount of thread.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Someone who throws any clothing on a dead body is described as not pious while
    alive and as lacking a place in the happy realm after death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sinner is said to go to the world of fiends, a dark and dismal realm,
    delivered there by his own doings and soul.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ahura Mazda says that one who has eaten the carcass of a dog or of a man cannot
    become clean again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the carcass-eater, the passage states that his burrow is to be dug out,
