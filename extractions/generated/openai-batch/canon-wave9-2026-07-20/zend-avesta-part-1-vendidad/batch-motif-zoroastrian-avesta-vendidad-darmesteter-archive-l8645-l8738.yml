    to the ends of the nails.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ahura Mazda says that one who brings a corpse with filth into waters or fire
    and makes either unclean cannot become clean again.
  category: speech
  evidence_refs:
