canonical_text:
  quote: ''
  summary: 'A fragment of Fargard XVIII describes counteractions against the Druj.
    A charitable gift to one of the faithful is said to destroy the fruit of the Druj''s
    womb. Sraosha, with uplifted club, questions the Druj about two of her male agents:
    one who urinates in a specified improper manner and one who emits seed in sleep.
    For each case the Druj says the man makes her conceive progeny, and gives ritual
    counteractions involving rising, steps or waking, recitations, chanting, and an
    offering. The passage closes with a formula addressing Spenta Armaiti and mentioning
    return at the day of resurrection.'
  language: English
  quote_policy: summarized
