  summary: Ahura Mazda answers Zarathustra’s questions about death-defilement caused
    by certain dogs and by a wicked Ashemaogha. The passage contrasts the limited
    defilement of the dead wicked man with his harmful actions while alive, then prescribes
    removing ritual objects and the corpse when a dog or man dies in a house prepared
    for sacrifice.
