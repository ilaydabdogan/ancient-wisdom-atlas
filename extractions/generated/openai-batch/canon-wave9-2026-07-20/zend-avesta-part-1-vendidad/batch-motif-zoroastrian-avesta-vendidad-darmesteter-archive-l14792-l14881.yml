canonical_text:
  quote: ''
  summary: The passage gives instructions for cleansing Vohu-mano, identified in the
    supplied notes as clothes, by exposure under the heavens for nine nights and by
    offerings to fire. Zarathustra then asks Ahura Mazda about mortality, leaving
    earthly possessions, and the reward of souls. Ahura Mazda describes the dead man
    being assailed by evil Daevas, dawn on the third night, Vizaresha binding wicked
    souls, and the soul entering the way made by Time toward the holy bridge made
    by Mazda.
  language: English
  quote_policy: summarized
