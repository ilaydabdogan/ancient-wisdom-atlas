- id: obs:1
  text: Vohu-mano is to be taken up with both arms and laid under the bright heavens
    by starlight until nine nights have passed.
  category: action
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: After nine nights, libations, hard wood, and Vohu-gaona incense are brought
    to the fire, and Vohu-mano is perfumed with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vohu-mano and the man are described as becoming clean, and Vohu-mano or the
    faithful one utters praise to Ahura Mazda, the Amesha-Spewtas, and other holy
    beings.
  category: speech
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:4
  text: Zarathustra asks whether godly people and wicked Daeva-worshippers should
    be urged that they must leave behind the earth, running water, growing corn, and
    their wealth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura Mazda answers that Zarathustra should give that instruction.
