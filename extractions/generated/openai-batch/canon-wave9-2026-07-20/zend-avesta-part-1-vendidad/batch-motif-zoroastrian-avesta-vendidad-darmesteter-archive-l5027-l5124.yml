canonical_text:
  quote: ''
  summary: 'The passage comments on the mythic geography of the Vendidad''s first
    Fargard: the Vanguhi and Rangha are described as celestial rivers surrounding
    the earth, Airyana Vaejo as a mythical paradisal first land, and Rangha as a far-horizon
    river compared with Okeanos and Vedic Rasa. It then introduces Ahura Mazda speaking
    to Zarathustra, saying he made each land dear to its dwellers so that all living
    beings would not invade Airyana Vaejo. The commentary frames Angra Mainyu''s counter-creations
    as vices and plagues answering Ahura Mazda''s creations.'
