canonical_text:
  quote: ''
  summary: 'The passage introduces the Vendidad as a fragmentary Avestan text, more
    accurately a code of purification than a general law-book. It summarizes its arrangement:
    mythical material on Ahura Mazda, Angra Mainyu, Yima, medicine, and the revelation
    of law to Zarathustra is mixed with chapters on purification, impurity from the
    dead, dogs, earth, and civil or penal laws. It describes the Vendidad''s legal
    form as Ahura answering detailed questions from Zarathustra, and emphasizes purity
    as a chief human good.'
  language: English
  quote_policy: summarized
literal_observations:
