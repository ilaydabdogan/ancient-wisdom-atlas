canonical_text:
  quote: ''
  summary: In a dialogue, Zarathustra asks Ahura Mazda when the Druj Nasu comes to
    the dead. Ahura Mazda says she comes after the soul leaves the body, from the
    north, in the form of a foul raging fly; for certain violent or unexpected deaths
    she comes at the next watch. The passage also says she remains until a dog or
    flesh-eating birds intervene, and explains how corpse-pollution spreads among
    nearby people according to the dead one's status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zarathustra asks when the Druj Nasu rushes upon a man after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda answers that directly after death, once the soul has left the
    body, the Druj Nasu comes from the regions of the north in the shape of a raging,
    stained fly likened to foul Khrafstras.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Druj Nasu stays on the corpse until a dog has seen or eaten it, or until
    flesh-eating birds have flown toward it; then she rushes away to the north in
    the same fly-shape.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A question lists deaths by dog, wolf, witchcraft, artifices of hatred, falling
    from a precipice, lawful execution, murder, or noose, and asks how long after
    such deaths the Druj Nasu comes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: For the listed violent or exceptional deaths, Ahura Mazda answers that the
    Druj Nasu comes at the next watch after death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When people rest close together on adjoining carpets and pillows and one dies,
    the question asks how many others the Druj Nasu envelops with infection, pollution,
    and uncleanness.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The number defiled depends on the dead one''s category: if a priest dies,
    ten are defiled; if a warrior, nine; if a husbandman, eight; if a shepherd''s
    dog, seven.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A note identifies the dog-rite as Sag-did and says birds of prey may also
    perform it.
  category: other
  evidence_refs:
  - ev:8
