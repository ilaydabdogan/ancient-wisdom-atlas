canonical_text:
  quote: ''
  summary: Yima is repeatedly warned that the earth has become full of flocks, herds,
    people, dogs, birds, and red blazing fires. He goes toward the luminous space
    to meet the sun, presses and bores the earth with a golden ring and poniard, invokes
    Spenta Armaiti to stretch out, and causes the earth to grow larger. The passage
    describes expansions by one-third and two-thirds, separated by long spans of winters,
    and begins a third warning after nine hundred winters. Translator notes connect
    Yima’s sunward movement with royal solar symbolism and identify Spenta Armaiti
    as the genius of the earth.
  language: English
  quote_policy: summarized
