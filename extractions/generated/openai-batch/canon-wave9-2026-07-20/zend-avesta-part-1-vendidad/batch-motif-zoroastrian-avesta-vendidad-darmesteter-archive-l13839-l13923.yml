canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda what makes the unseen power of Death increase.
    Ahura Mazda answers that wrong teaching and prolonged neglect of the sacred girdle,
    the Gathas, and the good waters do so. The passage warns against freeing, blessing,
    or giving consecrated offerings to a wicked Ashemaogha, and then introduces another
    question about the Sraosha-varez of Sraosha.
  language: English
  quote_policy: summarized
