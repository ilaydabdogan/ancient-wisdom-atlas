canonical_text:
  quote: "“All those seeds shalt thou bring, two of every kind”"
  summary: The passage gives instructions for Yima to make a Vara as an abode for
    people and a fold for flocks, to stock it with seeds of humans, animals, trees,
    fruits, birds, water, dwellings, and fires, to exclude deformity, vice, disease,
    and marks of Angra Mainyu, and to seal and furnish it with ordered streets, a
    door, and a self-shining window. Yima asks how to make it; Ahura Mazda instructs
    him to crush and knead the earth like potter’s clay, and Yima does so.
  language: English
  quote_policy: quoted
