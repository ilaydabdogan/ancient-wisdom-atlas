canonical_text:
  quote: ''
  summary: In a dialogue, Ahura Mazda states that an unnamed deed is normally without
    atonement, but distinguishes the case of an uninstructed non-professor of Mazda's
    law, whose sin can be removed if he confesses and resolves not to repeat forbidden
    deeds. The law of Mazda is described as removing many sins and cleansing the faithful
    like a mighty wind over a plain. The passage then asks who is a Daeva; Ahura Mazda
    identifies a specified male same-sex act as making the person a Daeva before death
    and an unseen Daeva after death. Notes discuss the term vispo-daeva and the idea
    of wicked souls becoming demons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda states that for the deed under discussion there is nothing that
    can pay, atone, or cleanse it, and calls it a trespass without atonement forever.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda distinguishes between a sinner who professes or has been taught
    the law of Mazda and one who has not; for the latter, the law of Mazda takes away
    the sin if he confesses and resolves not to repeat the forbidden deeds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The law of Mazda is said to take away sins including breach of trust, murdering
    one of the faithful, burying a corpse, deeds without atonement, heavy penalties,
    and any sin that may be sinned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The law of Mazda is said to cleanse the faithful from every evil thought,
    word, and deed, with a simile comparing it to a swift-rushing mighty wind cleansing
    a plain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zarathustra is instructed to make all deeds henceforth good, with full atonement
    effected by means of the law of Mazda.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A question asks who is a Daeva, a worshipper or paramour of the Daevas, a
    she-Daeva, a Daeva in inner self and whole being, a Daeva before death, and one
    of the unseen Daevas after death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ahura Mazda answers by identifying the man described as lying with mankind
    as man lies with womankind, or as woman lies with mankind, as a Daeva before death
    and one of the unseen Daevas after death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note explains vispo-daeva by reference to older invocations of all gods
    and to Indian visve devas, and states that in Mazdeism this became a class of
    fiends, later interpreted as one entirely a Daeva by wickedness.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note states that demons are often the restless souls of the wicked excluded
    from heaven, and cites a Persian Mahabadian belief about souls without good speech
    and deeds becoming an Ahriman or gin.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that the guilty may be killed by anyone without an order from
    the Dastur, and that such execution may redeem an ordinary capital crime.
  category: other
  evidence_refs:
  - ev:8
