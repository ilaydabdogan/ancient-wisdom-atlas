  quote: ''
  summary: The passage argues that comparative study can recover historical sequence
    behind later logical ordering of ideas. It summarizes the comparative school’s
    claims about Indo-Iranian mythology, including Iranian epic history sharing a
    source with Vedic myths and the proposed primitive identity of Ahura Mazda with
    Varuna. It also describes Windischmann’s work on Mithra and Anahita, criticizes
    Haug’s overextension of the method, and notes Haug’s later contributions as a
    Pahlavi scholar.
