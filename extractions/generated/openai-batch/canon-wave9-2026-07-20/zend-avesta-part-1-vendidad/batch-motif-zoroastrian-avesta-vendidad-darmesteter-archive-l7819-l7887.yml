canonical_text:
  quote: ''
  summary: Ahura Mazda is asked what Mazda worshippers should do when a pregnant woman
    gives birth to a still-born child. He prescribes a clean, dry, little-trafficked
    place in the house at measured distances from fire, water, consecrated baresma,
    and the faithful; an enclosure with food and clothing; gomez mixed with ashes
    as the first drink; and afterward specified milk, meat, bread, and wine without
    water. The supplied excerpt ends as the duration answer begins with “Three nights.”
  language: English
  quote_policy: summarized
