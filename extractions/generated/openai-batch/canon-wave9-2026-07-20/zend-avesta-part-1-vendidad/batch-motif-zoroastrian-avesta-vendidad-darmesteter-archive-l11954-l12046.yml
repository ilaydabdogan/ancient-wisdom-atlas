canonical_text:
  quote: ''
  summary: Ahura Mazda says a dead Ashemaogha no longer defiles, unlike when alive,
    when he harms water, fire, cattle, faithful people, and their possessions. The
    passage then introduces Fargard XIII on dogs, especially Vanghapara, the prickly-backed,
    long-muzzled dog identified with the hedgehog, who kills many evil creatures from
    midnight until sunrise. Killing Vanghapara brings severe spiritual consequence
    and blocks passage over the Cinvat bridge unless atoned by sacrifice to Sraosha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda compares the dead Ashemaogha’s defiling power to that of a frog
    whose venom is dried up and that has been dead more than a year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: While alive, the Ashemaogha directly and indirectly defiles creatures of the
    good spirit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While alive, the Ashemaogha harms water, blows out fire, carries off the cow,
    and kills a faithful man by separating soul from body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: While alive, the Ashemaogha deprives the faithful man of food, clothing, house,
    bed, and vessels; when dead he does not do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The new Fargard is organized around dogs, including the dog of Ormazd, the
    dog of Ahriman, Vanghapara, Zairimyangura, offences against the dog, duties of
    the dog, food due to the dog, the mad dog, the wolf-dog, praise of the dog, and
    the water dog.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A question asks which good creature goes from midnight until sunrise killing
    thousands of creatures of the evil spirit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ahura Mazda identifies this creature as the dog with prickly back and long
    thin muzzle, called Vanghapara and also called Duzaka by evil-speaking people.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Whoever kills Vanghapara is said to kill his own soul for nine generations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The killer of Vanghapara will not find a way over the Cinvat bridge unless
    he has atoned during life by offering a sacrifice to Sraosha.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An editorial note interprets the hedgehog’s midnight-to-dawn struggle as implying
