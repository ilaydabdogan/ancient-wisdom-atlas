canonical_text:
  quote: ''
  summary: 'The passage gives a philological argument that the Avesta''s groundwork
    predates the Sassanian period: Zend is described as an old foreign dialect not
    derived from ancient Persian, while Pahlavi was the language used in Persia under
    the Arsacides and Sassanides. The argument concludes that Sassanian adoption of
    Zend for religious use implies pre-existing Zend sacred writings, while also qualifying
    that some Zend texts may still have been composed by later editors and that priests
    understood Zend well enough to translate it into Pahlavi.'
  language: English
  quote_policy: summarized
