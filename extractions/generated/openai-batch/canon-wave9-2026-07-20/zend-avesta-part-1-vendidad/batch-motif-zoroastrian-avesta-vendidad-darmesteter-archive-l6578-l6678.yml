  summary: The passage lists graded forms of contract by word, hand, sheep, ox, man,
    and field, explains how lower forms are redeemed by higher pledges, and presents
    Ahura Mazda’s answers about the sin and atonement liability caused by breaking
    word- and hand-contracts. Notes identify hand-contract with striking hand in hand,
    describe monetary equivalents, and discuss kin liability and later interpretations
    of punishment in hell.
