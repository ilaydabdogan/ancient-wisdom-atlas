canonical_text:
  quote: ''
  summary: A ritual prayer asks for the rules of the law, aid in this world and the
    next, and protection from the fiendish Druj. The Druj is commanded to perish and
    depart to the northern regions so it will no longer bring death to the living
    holy world. Afterwards, Mazda-worshippers may bring animals, people, Fire, baresma
    bundles, and the faithful, and may prepare meat and wine meals in a house declared
    clean.
  language: English
  quote_policy: summarized
