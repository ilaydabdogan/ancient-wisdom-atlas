canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda what should be done when a man who does not
    know Mazdaean cleansing rites tries to cleanse the unclean. Ahura Mazda says the
    Druj Nasu, sickness, death, and the fiend’s work grow stronger. He prescribes
    binding, stripping, flaying, beheading, and exposing the offender’s corpse to
    corpse-eating birds, with words about repentance. The passage identifies the offender
    as an ungodly Ashemaogha whose improper cleansing removes fullness and increase
    from the land; prosperity returns only after his death and the presence or sacrifice
    of holy Sraosha.
  language: English
  quote_policy: summarized
