canonical_text:
  quote: ''
  summary: The passage gives liturgical directions for driving Angra Mainyu and other
    hostile beings away from Mazda-made good things through repeated healing and fiend-smiting
    words. It invokes Mazda, Airyaman, and Armaiti Spenta for teaching, protection,
    and world-thriving, and commands Druj to perish and go north. A following introduction
    explains that Fargard XII concerns the period of ritual 'staying' for near relatives
    of the dead and describes uncleanness arising both from corpse contact and kinship
    with the dead.
  language: English
  quote_policy: summarized
