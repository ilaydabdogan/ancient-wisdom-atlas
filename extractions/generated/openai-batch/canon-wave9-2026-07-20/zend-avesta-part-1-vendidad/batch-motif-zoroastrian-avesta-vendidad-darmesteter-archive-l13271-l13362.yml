canonical_text:
  quote: ''
  summary: Dialogue in which an unnamed questioner asks Ahura Mazda who must care
    for a pregnant bitch in a moat or pasture. Ahura Mazda assigns responsibility
    to the associated holder or cultivator, gives rules for support until the offspring
    can fend for themselves, equates neglect causing harm with wilful murder, says
    Atar watches over a pregnant bitch as over a woman, and gives a breeding procedure
    involving an earth hole, distance from children and fire, and three dogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a pregnant bitch near her time lies in a moat, the one who dug or holds
    the moat is assigned the duty of supporting her until the whelps are born.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the responsible person fails to support the bitch and the whelps are harmed
    for lack of support, the stated penalty is for wilful murder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a pregnant bitch lies in a pasture-field, the one who sowed or holds
    the field is assigned the duty of support and is to move her kindly to a litter
    of suitable foliage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pasture-field support is to continue until the young dogs are capable
    of self-defence and self-subsistence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young dogs are said to be capable of self-defence and self-subsistence when
    they can run in a circuit of twice seven houses around; young dogs are to be supported
    for six months and children for seven years.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Atar, called the son of Ahura Mazda, is said to watch over a pregnant bitch
    as he watches over a woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For desired strong offspring, worshippers are instructed to dig a hole in
    the earth in the middle of the fold, with depth varying according to whether the
    earth is hard or soft.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bitch is to be tied at the hole, away from children and from the Fire,
    son of Ahura Mazda, while people watch until dogs come to her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three dogs are to be let near the bitch in succession, each kept apart from
    the former dog so that they do not assail one another.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that a bitch covered by three dogs grows pregnant, has
    milk come to her teats, and bears a young one described as born from three dogs;
    the translator notes that this clause and the following one are corrupt and doubtful.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:11
  text: A question is posed about the penalty for smiting such a bitch after she has
    been covered by three dogs and has milk, but the answer is not included in this
    supplied passage.
  category: speech
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:12
  text: A translator note explicitly cites Justinus III, 4 as a comparandum for the
    multiple-male conception passage.
  category: other
  evidence_refs:
  - ev:7
