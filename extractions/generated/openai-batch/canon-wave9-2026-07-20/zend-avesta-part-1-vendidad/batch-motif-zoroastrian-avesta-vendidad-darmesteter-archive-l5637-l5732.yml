canonical_text:
  quote: ''
  summary: Yima steps toward the luminous space and the sun, presses and bores the
    earth with a golden ring and poniard, and asks Spe/zta Armaiti to expand so that
    flocks, herds, and men may be borne. The earth grows larger according to Yima’s
    will. Later, Ahura Mazda and Yima each convene assemblies by the river Daitya
    in Airyana Vae^o. Ahura Mazda warns Yima that fatal winters, frost, and deep snow
    will fall on the material world and that beasts in wilderness, mountains, and
    valleys will perish. Ahura then instructs Yima to make a Vara, glossed in the
    note as an enclosure.
  language: English
  quote_policy: summarized
