canonical_text:
  quote: ''
  summary: The passage gives ritual directions concerning corpse pollution. Corpse-bearers
    are to wash with urine. A way over which dog carcasses or human corpses have been
    carried is not to be used again by humans, herds, Fire, consecrated baresma, or
    the faithful. Ahura Mazda prescribes that a yellow four-eyed dog or a white dog
    with yellow ears be made to pass through the way three, six, or nine times, after
    which the Druj Nasu flees north in the form of a foul raging fly. An Athravan
    then goes along the way and recites fiend-smiting prayers.
  language: English
  quote_policy: summarized
