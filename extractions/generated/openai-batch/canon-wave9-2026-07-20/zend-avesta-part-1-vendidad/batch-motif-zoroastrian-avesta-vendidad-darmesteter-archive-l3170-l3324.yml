canonical_text:
  quote: ''
  summary: The passage describes Zoroastrian sacrificial offerings and spells, the
    two Haomas including Gaokerena as a source of immortality at resurrection, the
    power of prayer, altar- and fire-associated divinities, Sraosha as priest and
    protector, a final sacrifice that defeats Ahriman, the dualistic ordering of Ahura
    Mazda and Angra Mainyu, Angra Mainyu's marring of creation, and the Amesha Spentas'
    care over parts of the world including waters and trees.
