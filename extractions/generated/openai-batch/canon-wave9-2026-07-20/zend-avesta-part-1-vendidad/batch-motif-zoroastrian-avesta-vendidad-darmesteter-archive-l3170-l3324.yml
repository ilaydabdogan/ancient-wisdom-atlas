comparison_claims:
- id: claim:1
  claim: The passage explicitly identifies Haoma with Indian Soma and assigns it a
    comparable ritual role as a sacred plant juice drunk for the benefit of humans
    and gods.
  claim_level: same_function
  target: Indian Soma
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a brief identification and function, not a detailed
    comparison of rites.
- id: claim:2
  claim: The passage presents several altar-hearth divinities as belonging to an Indo-Iranian
    background, with Piety/Aramati linked to both Avesta and Vedic contexts.
  claim_level: common_inheritance
  target: Indo-Iranian altar-hearth divinities and Vedic Aramati
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is from the introduction's comparative exposition; the
    passage does not provide primary Vedic text excerpts.
- id: claim:3
  claim: The passage connects Agni as Vedic messenger between gods and humans with
    the Avesta messenger of Ahura, Nairyo-sangha.
  claim_level: same_function
  target: Vedic Agni / Nara-sansa and Avesta Nairyo-sangha
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states the connection succinctly and does not elaborate
    narrative parallels.
- id: claim:4
  claim: The passage compares Pareñdi, keeper of treasures, with Vedic Puramdhi and
    places Rata, Ashi, and Pareñdi in a gift-offering complex.
  claim_level: same_function
  target: Vedic Puramdhi and Avesta gift or treasure divinities
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: Only Pareñdi is explicitly called a sister to Vedic Puramdhi; the broader
    grouping of Rata and Ashi is local to the passage.
- id: claim:5
  claim: The passage equates the Vedic Rita and Zend Asha as expressions of the order
    of the world, deified as Asha Vahuta.
  claim_level: linguistic_similarity
  target: Vedic Rita and Zend Asha
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage frames the equivalence as terminology and deification,
    without further mythic narrative.
- id: claim:6
  claim: The passage says the single elements of Mazdeism do not essentially differ
    from Vedic and Indo-European mythologies, while also emphasizing Mazdeism's distinctive
