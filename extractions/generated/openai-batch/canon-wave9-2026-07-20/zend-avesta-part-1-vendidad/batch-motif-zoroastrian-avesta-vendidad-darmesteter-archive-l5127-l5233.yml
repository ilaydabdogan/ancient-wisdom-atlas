canonical_text:
  quote: ''
  summary: 'The passage lists several good lands and countries created by Ahura Mazda
    and pairs each with a harmful counter-creation made by Angra Mainyu: a serpent
    in the river and winter in Airyana Vaejo, a cattle-killing fly in Sughdha, sinful
    lusts in Mouru, the Bravara in Bakhdhi, and unbelief in Nisaya. The winter of
    Airyana Vaejo is described as long, cold, and plague-ridden.'
  language: English
  quote_policy: summarized
