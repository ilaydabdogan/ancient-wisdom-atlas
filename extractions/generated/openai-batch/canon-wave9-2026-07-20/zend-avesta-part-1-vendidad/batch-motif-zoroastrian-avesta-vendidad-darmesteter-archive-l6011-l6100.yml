canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about where Earth feels happiest and where
    Earth feels sorest grief. Happy places include a faithful household with priest,
    family, livestock, dog, fire, thriving holiness, cultivated and water-managed
    land, increasing herds, and dung-yielding flocks. Grief-stricken places include
    the neck of Arezura where fiends rush from the Druj, sites with buried corpses
    of dogs and men, and Dakhmas holding human corpses.
  language: English
  quote_policy: summarized
