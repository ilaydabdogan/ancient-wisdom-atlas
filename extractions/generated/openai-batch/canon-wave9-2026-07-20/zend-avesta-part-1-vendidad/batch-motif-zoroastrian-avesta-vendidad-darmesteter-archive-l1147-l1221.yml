  quote: the demons, the Daevas, would ascend from their dwelling in hell up to heaven,
    to meet their philological brothers, the Indian Devas.
  summary: 'The passage contrasts traditional and comparative methods for interpreting
    the Avesta. It criticizes careless comparison by giving hypothetical lexical and
    religious distortions, including an imagined ascent of the Daevas from hell to
    heaven. It argues that tradition and Vedic comparison should assist one another:
    tradition gives later continuity from the Avesta, while the Vedas give indirect
    evidence of a shared earlier source. It also summarizes the contributions and
    risks of the traditional and comparative schools.'
