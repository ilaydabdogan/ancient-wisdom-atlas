canonical_text:
  quote: ''
  summary: Ahura Mazda answers ritual questions about how corpse pollution affects
    water in a well, snow or hail, and a running stream, and prescribes removal of
    the corpse and measured cleansing actions. He also answers that Haoma touched
    by a corpse can be made clean, with different rules depending on whether it has
    been strained for sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Questions ask what part of well water, snow or hail, and running stream water
    the Druj Nasu defiles with infection, pollution, and uncleanness.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
- id: obs:2
  text: Ahura Mazda says water remains unclean and unfit to drink as long as the corpse
    has not been taken out; the corpse is to be taken out and laid on dry ground.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
- id: obs:3
  text: For a well, after the corpse is removed, a half, third, fourth, or fifth part
    of the water is drawn off according to ability; the remaining water is then clean
    and drinkable by cattle and men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For snow or hail, the affected area is stated as three steps on each of the
    four sides; after the corpse is removed and the snow or hail has melted, the water
    is clean and drinkable by cattle and men.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: For a running stream, the affected area is stated as three steps down the
    stream, nine steps up the stream, and six steps across; after the corpse is removed
    and the stream has flowed three times, the water is clean and drinkable by cattle
    and men.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Ahura Mazda says Haoma touched by the corpse of a dead dog or dead man can
    be made clean again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: If Haoma has been strained for the sacrifice, a corpse brought to it does
    not make corruption or death enter it; if it has not been strained, a four-finger
    length of stem is defiled and is to be buried in the middle of the house for a
    year before the faithful may drink its juice again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A note describes Haoma as the plant of life, says that when strained for sacrifice
    it is the king of healing plants, and states that the dead become immortal by
    tasting white Haoma.
  category: attribute
  evidence_refs:
  - ev:8
