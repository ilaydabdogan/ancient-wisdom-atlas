canonical_text:
  quote: ''
  summary: Coyote deceives a buffalo herd about the location of people. The buffalo
    address him as grandson, produce meat for him by rolling or wallowing, and leave.
    Coyote cooks the meat in a cottonwood bottom, sleeps with a bloody heart covering
    on his knee, mistakes it at night for a scalped-man, strikes his own knee with
    an axe, and dies the next morning; a moral comments on not being satisfied with
    a good thing. The passage then gives the tale of Coyote luring a blind buffalo
    over a precipice by song and dance and taking its tongue, followed by the title
    and synopsis of a tale in which Coyote attracts and kills turkeys by pretending
    to show marvels.
  language: English
  quote_policy: summarized
