canonical_text:
  quote: ''
  summary: A least and unattractive daughter asks to join a line of women before a
    young man. Her father prepares her with washing, hair brushing, and paint, then
    teaches her the young man's story and hidden intention. She memorizes and recites
    the story before the young man despite his attempts to distract her, naming his
    plan to kill the animal that carries people away and to place its paw on a forked
    stick. The young man accepts her into his tipi, where his sister gives her ointment
    that cures her sores; she becomes beautiful and the young man's wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl is described as the least of the girls in her family and as ugly-looking;
    her father initially says she is not fit to stand in the line but later allows
    her to go.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father tells the girl to wash her face, brush her hair with a grass brush,
    apply red paint over her body, and put black paint dimly over her eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the girl follows the preparation instructions, her father is pleased
    because she looks clean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father tells the girl the story of the young man so that she can learn
    it and tell it to the boy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The story taught by the father includes a young man and his sister living
    between two villages, the young man's thought about whether an animal could carry
    him away, the making of double balls and a shinny ball, travel, and a tipi brought
    to them at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father also tells of the forked stick, the intended killing of the animal,
    the animal's paw being placed on the forked stick, and people passing the paw
    to request what kind of birds they wanted to be.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The girl repeats the story several times until she can say every word, then
    goes to the place where the line is.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the girl stands before the young man, she says that she knows he wants
    someone to tell what is in his mind and that he wants to save people from the
    animal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: While the girl tells the story, the boy imitates her and tries to make her
    lose the story, but she continues.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the girl's recitation, the young man and his sister travel fast by standing
    on balls, and the sister's breath upon dry grass and dry limbs makes a fireplace
    blaze.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the girl's recitation, a Coyote-Man finds the travelers in fog and calls
    the young man his brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the girl's recitation, the animal carries off a leading warrior and later
    carries off the young man's partner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The girl states that the young man is to find the animal, kill it, cut off
    its paw, and place the paw on the forked stick.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the girl names the plan, the young man stops repeating her and sends
