canonical_text:
  quote: ''
  summary: A young gambler who has cared for a dead war-party is summoned at night
    by their spirits. In their circle he fills and lights a pipe, smokes with them,
    and receives promises of aid in war. After repeated visits they give him power.
    He later consults them at the hill where their bones remain, captures ponies,
    gives many away, stops gambling, and becomes a successful warrior. In a dream
    the dead leader summons him with tobacco and explains that the dead people have
    received wind power from gods in the heavens and want scalps to offer to those
    gods.
  language: English
  quote_policy: summarized
