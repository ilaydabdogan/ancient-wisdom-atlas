canonical_text:
  quote: ''
  summary: A wonderful boy supports his mother and uncle during a hungry return journey,
    produces meat, summons buffalo while wearing a fox-skin and magpie cap, is received
    by Skidi leaders with a pipe from the yellow-calf bundle, announces that the gods
    sent him because the people were hungry, directs the opening of the calf bundle
    with songs, and later becomes a priest who calls buffalo when the people starve.
    The passage then begins a separate tale in which an orphan boy leaves the village
    in despair, wanders hungry in the timber, and encounters a nocturnal voice associated
    in the synopsis with owls and visions.
  language: English
  quote_policy: summarized
