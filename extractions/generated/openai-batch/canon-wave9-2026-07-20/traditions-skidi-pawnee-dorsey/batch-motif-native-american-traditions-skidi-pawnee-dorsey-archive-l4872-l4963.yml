canonical_text:
  quote: ''
  summary: A man tries to capture a strange boy who visits his son from the creek.
    After a disguise fails, he uses inflated buffalo bladders to keep the strange
    boy from diving, breaks the boy's long tooth, and the boy remains with them. As
    the two boys grow, they hunt and then ignore the father's warning against a southern
    place inhabited by a people-eating snake-like monster. Long-Tooth-Boy leads the
    expedition, helps kill many snakes, calls on gods with his brother, kills the
    chief monster with his breath, keeps the skin, and uses it to frighten the father
    before the father praises him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man turns himself into a lodge pole over the fire, but the strange boy
    identifies the pole as the boy's father and jumps into the creek.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man brings two inflated buffalo bladders and instructs his son to tie
    the larger one to the strange boy's head while the man watches from a hill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the strange boy tries to escape into the creek, the bladder keeps him
    from diving, and the man catches him in the river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The captured boy bites the man with a long tooth; the man binds him, breaks
    the tooth with two stones, and the boy submits and remains with them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two boys grow older, make larger bows and arrows, obtain arrow-points
    from fish, and hunt game in the timber.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The father warns the boys not to go to a southern hilly and timbered place
    where people are eaten by a monster that is really a snake but looks like a lizard.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Long-Tooth-Boy proposes going to the forbidden place, breathes on the bows,
    and says they must kill many smaller snakes before reaching their chief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boys stand on small stones and shoot many snakes; some snakes die when
    they try to bite or strike the stones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The boys call on the gods, and a hailstorm with thunder and lightning makes
    the snakes hide.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The chief monster approaches to swallow them; one boy is frightened and charmed,
    while Long-Tooth-Boy kills the monster by throwing his breath at it, separating
    skin from flesh.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The boys keep the monster's skin, inflate it, drag it home as if it is pursuing
    them, frighten the father, then hang the skin up; the father calls Long-Tooth-Boy
    wonderful.
  category: sequence
  evidence_refs:
  - ev:11
