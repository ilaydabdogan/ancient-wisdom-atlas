canonical_text:
  quote: ''
  summary: A boy living with his grandmother shoots arrows from the tipi entrance,
    and the grandmother retrieves increasingly large game, cooks it, and stores meat.
    A crier announces the chief's contest to kill a red bird whose killer may marry
    the chief's daughter. The boy shoots the red bird after others fail, but Coyote
    takes the bird and claims the honor. The bird later hangs in the chief's tipi
    and gives a yellow color rather than a bright red one.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy asks the old woman whether she is hungry and says he will kill game
    for her if she holds up the entrance covering.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy shoots an arrow from inside the entrance, and the old woman finds
    a snowbird by the arrow, then roasts it on hot coals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On later days the same shooting procedure produces rabbits and a fat jack-rabbit,
    which the old woman skins, cooks, and shares with the boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy tells the old woman to dig a cellar in the tipi and store some meat
    before he begins killing larger game.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before shooting a deer, the boy puts the arrow point in the fire so that it
    becomes hard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The arrow pierces a deer, and the old woman kills, skins, boils, and eats
    it with the boy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy later kills a buffalo calf and a large buffalo cow, and the old woman
    stores jerked and dried meat in a parfleche in the cellar.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The repeated buffalo kills leave the household with plenty of meat, and the
    old woman prepares to make a new tipi from the buffalo hides.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A crier announces that the chief orders the men to come out with bows and
    arrows because the red bird will visit again; whoever kills it may marry the chief's
    daughter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy says he will kill the red bird and marry the chief's daughter, while
    the old woman lays her hands on his head and body and cries.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The red bird sits on its usual limb and makes the village red while the assembled
    men and young men shoot at it unsuccessfully.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy shoots at the red bird and later finds a few feathers on his arrow,
    which he hides.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Coyote jumps in, gets the red bird, claims the honor of marrying the chief's
    daughter, and the chief is told that Coyote killed the bird.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the red bird is hung in the chief's tipi, it gives a yellow color instead
    of a bright red color.
  category: attribute
  evidence_refs:
  - ev:9
