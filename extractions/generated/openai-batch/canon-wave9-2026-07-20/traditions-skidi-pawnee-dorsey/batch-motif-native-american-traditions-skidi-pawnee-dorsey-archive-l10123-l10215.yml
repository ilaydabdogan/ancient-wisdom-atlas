canonical_text:
  quote: ''
  summary: A boy collapses under moonlight and is said by a medicine-man to be under
    the moon's influence; he later becomes the warrior Taihipirus, known for womanly
    ways and successful war leadership. Taihipirus leads Pawnee warriors to Pawnee
    Rock, where many enemy tribes surround them. Cheyenne men connected to the Pawnee
    through pipe-sticks warn and protect two descending Pawnee warriors through a
    handshake stratagem. While trapped without food or water, a man with the spirit
    of the buffalo uses roots and medicine to make a pool of urine drinkable. After
    several more days, a young errand man runs down, is captured, paraded on a pony,
    and killed.
  language: English
  quote_policy: summarized
