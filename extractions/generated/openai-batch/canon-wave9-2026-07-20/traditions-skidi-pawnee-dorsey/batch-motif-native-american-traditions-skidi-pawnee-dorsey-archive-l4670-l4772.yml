canonical_text:
  quote: "“I am not a man; I shall soon depart.”"
  summary: Blood-Clot-Boy returns with the man and woman, establishes himself in a
    lodge, declares his buffalo origin, feeds the people by bringing buffalo, defeats
    an old witch-woman through animated animal powers in his regalia, and then prepares
    to return to his own people. At a lake he transfers his clothing and place to
    Burnt-Belly, who dives for the garments and emerges transformed and dressed like
    him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The boy found the man and woman together with his robe, leggings, quiver,
    and a cap made from red-headed woodpecker heads, then set out with them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reaching the village, the group made a dwelling; later Blood-Clot-Boy
    asked his father and mother to build him a lodge so he could try to help the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blood-Clot-Boy told Burnt-Belly that he was a buffalo, that his mother had
    vomited him up, that he had turned into a child, and that his purpose included
    killing the bear so the man and woman could return to their people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Blood-Clot-Boy killed buffalo at the entrance of the lodge and called buffalo
    to the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blood-Clot-Boy dressed in leggings, moccasins, a woodpecker-head cap, and
    other animal-associated items; the chief came and begged him to help the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Blood-Clot-Boy gave the chief a piece of kidney covered with fat and said
    that, as the chief ate it, buffalo would come from far away so the people would
    be fed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men sent to the western hills reported seeing many buffalo and killing many.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people suggested that Blood-Clot-Boy should marry one of the chief’s daughters;
    the chief agreed, but Blood-Clot-Boy did not go where the girls could see him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a stream, a poor woman asked Blood-Clot-Boy to carry her across, stuck
    to his back, and was attacked by the birds, snakes, and mountain lion associated
    with his clothing and weapons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mountain lion formed from the quiver pulled off the old woman’s head and
    breast, and her scattered limbs became weeds covered with burrs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief’s youngest daughter loved Blood-Clot-Boy and repeatedly came to
    his lodge; he told her not to look at him because he was not a man and would soon
    depart.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Blood-Clot-Boy said his brother belonged there and would receive his clothing
    after he was gone; the girl asked to go with him to see whether his words were
    true.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Blood-Clot-Boy told Burnt-Belly that it was time to return to his own people
    after killing the bear, bringing home the man and woman, feeding the people, and
    killing the old witch-woman.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Blood-Clot-Boy led Burnt-Belly and the girl to a large pond and had them sit
    by a high cliff beside the lake.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: Blood-Clot-Boy threw his robe, leggings, cap, and quiver into the lake and
    told Burnt-Belly to dive for them so that Burnt-Belly could take his place.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Burnt-Belly emerged on the far side of the lake dressed in Blood-Clot-Boy’s
