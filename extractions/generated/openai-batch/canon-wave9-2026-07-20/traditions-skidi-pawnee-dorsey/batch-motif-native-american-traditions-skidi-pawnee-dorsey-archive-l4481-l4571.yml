canonical_text:
  quote: I am not human. I am the child of all the animals.
  summary: A fast-growing boy known as Blood-Clot-Boy, aided by animals and birds,
    requests a specially made bow and arrows, prepares to kill a feared bear, and
    uses a planned ambush to shoot the bear’s paws and side. After the bear is killed,
    the human family obtains plenty of meat and returns toward the village while the
    young bear companion eventually returns to the cedar country.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The man hides a cow’s bag after killing a cow, brings it to the woman, and
    the child sucks it; the child grows fast while the man becomes thin and sickly-looking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy grows large enough to play with a little bow and arrows; a young bear
    plays with him, lets him ride, and steals meat for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blood-Clot-Boy asks for a strong blackened bow and red dogwood arrows, says
    he is not human but the child of all animals, says the animals sent him to help,
    and announces that he will kill the bear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the timber, animals and birds instruct the boy about killing the bear,
    breathe upon the weapons, and provide feathers, sweet grass, and flagroot stems
    for him to wear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy instructs his father to hunt with the bear, kill a cow, make the bear
    carry the meat, and remain unafraid when the bear threatens him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the hunt, the man refuses to kill a bull, kills a cow instead, cuts
    it up in his own way, and tells the bear that the bear must carry the meat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the bear rises angrily, the hidden boy shoots one paw, then the other
    paw, and finally shoots the bear in the side, killing him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The killed bear is described as feared throughout the land because he killed
    both people and animals.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the bear is killed, the she-bear and young bears depart; the young bear
    later stays with the human family, then returns to the cedar country as the family
    heads toward the village.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
