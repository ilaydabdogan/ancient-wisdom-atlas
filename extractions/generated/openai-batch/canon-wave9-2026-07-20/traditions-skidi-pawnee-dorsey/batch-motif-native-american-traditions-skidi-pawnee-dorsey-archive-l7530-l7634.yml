candidate_motifs:
- id: motif:1
  label: human transformed into bear during communal danger
  taxonomy_refs:
  - shapeshifter
  basis: The passage states that a young chief was no longer heard of because he had
    turned into a black bear while a prairie fire chased the people.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is only the closing fragment of a preceding tale, so the surrounding
    narrative context is absent.
- id: motif:2
  label: nonhuman helper grants power and a trapping instrument to a poor youth
  taxonomy_refs:
  - initiation
  basis: The poor boy seeks help, and the tarantula says it will help, gives him power,
    and provides webs to catch White Crow.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not describe a formal rite; the initiation label is a
    cautious taxonomy match for receiving power from a nonhuman helper.
- id: motif:3
  label: office and marriage won by completing a difficult capture task
  taxonomy_refs:
  - royal_legitimacy
  basis: The chief promises that whoever takes White Crow alive may marry his daughter
    and become chief; after the crow is caught, the boy becomes chief and marries
    her.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage frames the reward politically and matrimonially; no broader
    dynastic system is described.
- id: motif:4
  label: destructive bird drives away game and is trapped to restore abundance
  taxonomy_refs: []
  basis: White Crow says it will drive away game, does so, is trapped in webs and
    killed, and afterward buffalo return in great numbers.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No available taxonomy reference precisely names this game-restoration
    pattern.
- id: motif:5
  label: temporary shapeshifting used as a failed strategy
  taxonomy_refs:
  - shapeshifter
  basis: The poor boy turns into a weed while trying to catch White Crow, but the
    crow recognizes him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only one explicit transformation attempt is included in detail, although
    the text says he tried many ways.
- id: motif:6
  label: life-link between human beneficiary and animal helper
  taxonomy_refs: []
  basis: The tarantula gives the boy power to be great, and when the tarantula dies
    the boy dies also.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The causal mechanism of the life-link is not explained beyond the statement
    of paired deaths.
- id: motif:7
  label: child lured to a strange land and returned with power from a divine being
  taxonomy_refs:
  - initiation
  - mystical_quest
  - return
  basis: The orphan boy follows a snowbird, falls asleep, wakes in a strange land,
    is taken by the Wind, receives instruction and gifts, and is sent back to his
    people.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage begins the tale and does not yet show the later use of the
