canonical_text:
  quote: ''
  summary: The passage ends one tale with people pursued by a prairie fire and a young
    chief transformed into a black bear. It then tells of a village whose game is
    driven away by White Crow; a poor boy receives tarantula power and webs, captures
    the crow, marries the chief's daughter, becomes chief, and sees buffalo return.
    The next tale begins with an orphan boy led by snowbirds, taken by the northern
    Wind, given animal-skin objects and power connected with buffalo, and returned
    to his mother.
  language: English
  quote_policy: summarized
