canonical_text:
  quote: ''
  summary: Coyote persuades a girl to swing and pushes her high, bringing buffalo
    that carry her away. He flees, hides, covers himself with mud, explains events
    to her brothers, and promises to recover her. On the journey to the buffalo village
    he stations several animal helpers along the route. At the buffalo village he
    sees buffalo playing a stick-and-ring game connected in the passage with the captive
    girl.
  language: English with one Latin sentence
  quote_policy: summarized
