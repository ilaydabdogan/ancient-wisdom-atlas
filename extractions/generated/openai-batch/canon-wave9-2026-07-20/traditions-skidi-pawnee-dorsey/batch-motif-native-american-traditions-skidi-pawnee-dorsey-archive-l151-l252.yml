- id: obs:1
  text: The earth lodge has a covered passageway entrance and a roof structure supported
    by rows of forked uprights, cross-beams, rafters, willow poles, grass, sod, and
    earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A smoke opening is left over the center of the lodge.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The center of the lodge contains a shallow excavated fireplace surrounded
    by a slight embankment.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A west-side space in the lodge is always reserved, considered sacred, and
    called wiharu, glossed as place-for-the-wonderful-things.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The term wiharu is also applied to the garden of the Evening-Star, where corn
    is always ripening and where parfleches of buffalo meat are stored.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A buffalo skull rests in the sacred west-side area, facing the lodge entrance
