canonical_text:
  quote: ''
  summary: The passage describes the construction and internal arrangement of a Skidi
    Pawnee earth lodge, including its covered entrance, roof supports, smoke opening,
    central fireplace, sacred west-side area with buffalo skull and sacred bundle,
    sleeping platforms, family bed order, winter sweat lodge, storage areas, corn
    mill, nearby summer arbor, and the use of skin tipis during hunts.
  language: English
  quote_policy: summarized
