  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sleeping platforms line the north and south sides of the lodge and are furnished
    with mats, buffalo robes, and pillows.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Beds nearest the altar are places of honor and are occupied by older children;
    subsequent beds are assigned to uncles or aunts, parents, and old people nearer
    the entrance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In winter, a sweat lodge is built just inside the lodge north of the entrance,
    while a storage excavation is placed in the corresponding south-side position.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A corn mill is kept north of the sweat-lodge area and consists of a hollowed
    hackberry log and a pestle.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A few paces east of the lodge stands an open-sided structure with a flat roof,
    used as summer shelter and as a platform for drying corn and pumpkins.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Skidi families also possess skin tipis used as summer homes during hunts,
