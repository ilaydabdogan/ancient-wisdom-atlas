canonical_text:
  quote: ''
  summary: Coyote enters a tipi where Man-with-Bloody-Horn has meat over a fire and
    is sent to summon chiefs. The chiefs hear that the young man will feed the whole
    tribe, and the people move to the village, where meat and other foods are distributed.
    The young man rejects his father, accusing him of killing and cooking the young
    man's mother and causing him to eat her. The chiefs turn the father over to Man-with-Bloody-Horn,
    who kills him on a mound with a horn that he raises toward the Sun. The children
    ask that the father be buried, and the narrator explains this burial and execution
    as ending cannibalism and establishing punishment for causeless killing.
  language: English
  quote_policy: summarized
