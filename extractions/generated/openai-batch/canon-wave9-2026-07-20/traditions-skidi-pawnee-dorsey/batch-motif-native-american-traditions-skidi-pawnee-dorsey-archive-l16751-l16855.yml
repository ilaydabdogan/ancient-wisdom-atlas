canonical_text:
  quote: ''
  summary: Editorial and ethnographic notes describe surviving ritual objects and
    keepers, Pahukatiwa and northern gods, flood-era giants turned to stone, the Morning-Star
    bundle and coyote quiver, the Skull-Bundle and its wartime use, skull decoration
    symbolic of Tirawa, warrior bundles and their contents, dedication of corn to
    Evening-Star, a Morning-Star sacrifice-related capture bundle, seasonal dream
    omens, and ceremonies for a new corn god and Four-Direction bundles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes say original leggings and feathers are supposed to still exist and
    are in Lone-Chief's possession or keeping; Lone-Chief is also named as the current
    keeper of one dance, while Cheyenne-Chief possesses knowledge of another dance
    ritual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pahukatiwa is said to still be known by that name and, with Hikusu, to constitute
    one of three gods in the north; a note reports a different Arikara claim about
    Pahukatiwa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the time of the flood, giants were turned into stone; people of those days
    are described as ancestors of earthly peoples and heavenly gods and are called
    grandfathers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Morning-Star bundle is described as owned by Lone-Chief, kept by Bright-Star,
    and bearing what is supposed to be the original coyote hide quiver containing
    medicine arrows captured from the Cheyenne.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Skull-Bundle is said to have been given by Tirawa, who promised to watch
    over it and to aid the people against enemies if the bundle was in the village
    and a specified rite was performed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The specified Skull-Bundle wartime rite places a young girl under the bundle
    in a darkened tipi; the enemy is then expected to be frightened and flee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The keeper relates that, when young, she stood under the bundle twice during
    fighting and that the Pawnee were victorious both times.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The skull decoration consists of a deep blue line around the face, a red-painted
    surface within the line, and an eagle breath feather on the head; the note says
    the whole is symbolic of Tirawa.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Warrior bundles were possessed by leading warriors and made by priests after
    the individual had made a certain number of offerings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The warrior bundle contents listed include an otter-skin bandoleer, an ear
    of corn, a hawk skin, a pipe, paints, and a tobacco bag, usually made from buffalo
    pericardium.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A rite dedicates the corn ear to Evening-Star; the note says the corn ear
    becomes symbolic of Evening-Star and is regarded as an ever-present divinity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ceremonies with warrior bundles include smoke and other offerings; these bundles
    are called empty bundles because they lack songs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: One special warrior bundle is said to have been handed down to earth by Morning-Star
    and kept with the Morning-Star bundle.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The special Morning-Star warrior bundle was used only when attempting to capture
    a maiden from an enemy tribe for sacrifice to Morning-Star; the coyote quiver
    was also used at that time.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A winter dream of passing through green fields of corn, squash, and beans
    is interpreted as indicating the dreamer will live to see those fields again.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: A summer dream of cold weather or snow is interpreted as indicating the dreamer
    will live through the next winter.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: One note refers to a ceremony of making a new corn god and to an annual, more
    important ceremony connected with Four-Direction bundles.
  category: action
  evidence_refs:
  - ev:11
