canonical_text:
  quote: "“These stones were never to be wet, nor sprinkled with water.”"
  summary: 'Priests open a sacred bundle containing flint stones associated with Paruxti,
    Lightning, and the Evening-Star. The head priest sprinkles water on the stones,
    producing clouds, lightning, thunder, and water over the ground. After offerings
    to the western gods, the weather clears, a dry lake bottom reveals a huge turtle
    and scattered bones, and the Pawnee thereafter call sacred bundles rain-bundles.
    A following Turtle war-party tale begins: Turtle rejects swift animal companions,
    accepts a knife, hairbrush, and awl that cannot run, and sends the knife and brush
    into a camp where they harm people.'
  language: English
  quote_policy: quoted
