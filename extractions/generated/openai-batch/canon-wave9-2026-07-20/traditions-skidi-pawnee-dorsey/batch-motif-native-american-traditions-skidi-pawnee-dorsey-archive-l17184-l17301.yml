candidate_motifs:
- id: motif:1
  label: ritual magic displayed in medicine-men's dance
  taxonomy_refs: []
  basis: The note describes magical power, not sickness-curing, as exercised in medicine-men's
    dance ceremonies with sleight-of-hand.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The note refers back to a narrative figure outside this passage, so the
    narrative context is incomplete.
- id: motif:2
  label: offerings to animal powers as usable gifts
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage explicitly interprets animal-lodge sacrifices as gifts usable
    by animals, such as robes, feathers, black handkerchiefs, and tobacco, rather
    than as objects burned by fire.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an editorial explanation of ritual practice rather than a full
    narrative episode.
- id: motif:3
  label: sacred lodge west with buffalo skull and bundles
  taxonomy_refs: []
  basis: The west of the lodge is reserved for a buffalo skull, with sacred bundles
    suspended above it.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No broader cosmological interpretation is stated in the passage.
- id: motif:4
  label: animal spouse and rescued animal-woman's children
  taxonomy_refs: []
  basis: The note links a rat as possible husband of Mouse-Woman and mentions that
    her children had been rescued by a boy.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The narrative action is only summarized in a note and not presented in
    full.
- id: motif:5
  label: pursuit by rolling inanimate object
  taxonomy_refs: []
  basis: The editor states that pursuit by a rolling inanimate object is extremely
    widespread and gives stone and skull pursuits as examples.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage is comparative commentary and does not narrate one full pursuit
    episode.
- id: motif:6
  label: monster-slaying makes power available to humans
  taxonomy_refs:
  - culture_hero
  basis: The note says four monsters are slain and that whatever virtue they possessed
    becomes available to mankind through medicine-men.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The slayer and full plot are outside this passage; the culture-hero taxonomy
    is inferred from human-benefiting monster-slaying.
- id: motif:7
  label: cannibal witch and magical son
  taxonomy_refs: []
  basis: The Curly-Head variant begins with a solitary prairie witch-woman living
    on human flesh procured by her son, who has magic arrows.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No external taxonomy reference is asserted for this motif.
- id: motif:8
  label: animal shapeshifters lure a youth and elicit secrets
  taxonomy_refs:
  - shapeshifter
  - forbidden_knowledge
  basis: Two buffalo calves appear as maidens to attract the boy, induce him to tell
    his secrets, and lead him to the buffalo people.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The shapeshifting is explicit; the forbidden-knowledge classification
    is cautious because the note calls the information “secrets” but does not define
    a prohibition.
- id: motif:9
  label: supernatural helper gives counsel for contests
  taxonomy_refs:
  - wisdom
  basis: The chief of all buffalo from the setting sun secretly appears to the boy,
    advises him, and his counsel enables the boy to win contests.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage gives only a variant summary, not the full dialogue or ritual
    meaning of the advice.
- id: motif:10
  label: contests of skill with animal opponent
  taxonomy_refs: []
  basis: Smoking, pond-draining, and racing contests are arranged between the boy
    and White-Spot-Forehead-Bull.
  evidence_refs:
  - ev:14
