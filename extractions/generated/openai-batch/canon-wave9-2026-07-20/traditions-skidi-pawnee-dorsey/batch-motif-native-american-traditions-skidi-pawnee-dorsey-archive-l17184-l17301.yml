canonical_text:
  quote: ''
  summary: Editorial notes describe medicine-men's magic, animal-lodge offerings,
    the term Nahurac, sacred lodge objects, comparative tale parallels, and a summarized
    Curly-Head variant involving a cannibal witch-woman, her magical son, buffalo
    opponents and helpers, contests, refuge in a tree, agriculture, Sun Land, and
    northern buffalo deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male figure's power is described as magic rather than curing sickness,
    and it is exercised in medicine-men's dances that include sleight-of-hand performances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tale often called the “Deserted Child” is said to be commonly known among
    Plains tribes and is compared with several named traditions and collections.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: "“Nahurac” is explained as a general term for animals and not as referring
    to a special lodge."
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Offerings to the animals' lodge are characterized as gifts usable by the animals
    rather than sacrifices made by fire; examples include robes, feathers, black handkerchiefs,
    and tobacco.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Pawnee hide-scraper is described as an elk-horn handled implement with
    designs that can record the ages of children in a family.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A sacred place in the west of the lodge is reserved for the buffalo skull,
    with sacred bundles suspended above it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Skidi are said to place rats and mice in one family, and the rat in the
    referenced tale is interpreted as the husband of Mouse-Woman, whose children had
    been rescued by a boy.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: One Curly-Head tale is described as suggestive of a Navaho incident involving
    tumble-weeds and bumblebees in the story of the Great Shell of Kintyel.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pursuit by a rolling inanimate object is described as extremely widespread;
    the note specifically mentions pursuit by a stone and by a skull in Skidi and
    other traditions.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The slaying of monsters is described as common in American tales, and in the
    present instance four monsters are interpreted as collectively representing earth
    elements antagonistic to humans.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A figure is said to have become a medicine-man and carried on healing made
    possible by his father's deeds.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: In a Curly-Head variant, a witch-woman lives alone on a prairie with four
    powerful dogs and a wonderful son who possesses magic arrows and kills men for
    human flesh.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Buffalo, angered by cannibalism, hold a council and send two buffalo calves
    in the form of maidens to attract the boy, induce him to reveal secrets, and lead
    him to their people.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The chief of all buffalo, coming from the setting sun, secretly aids the boy
    and gives him advice.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Contests of smoking, draining a pond, and racing are arranged between the
    boy and White-Spot-Forehead-Bull, and the boy wins through the friendly buffalo's
    counsel.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The boy flees into a tree, the buffalo attempt to destroy it, and the dogs
    hear his cry and rescue him.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: After the buffalo are defeated, the witch learns to substitute buffalo flesh
    for human flesh and learns agriculture.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: The boy departs to Sun Land; White-Spot-Forehead and the two buffalo-girls
    become gods placed in the north, from which they send buffalo for the people.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: The descendants of the boy are said to become warriors, while descendants
    of the woman have seeds and are associated with agricultural peoples.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:20
  text: The red eagle is described as the most powerful of all birds according to
    the Skidi.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:21
  text: The notes mention a distinction between an animal with its head lifted and
    one with its head lying down as if sleeping.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:22
  text: A tale told by Yellow-Calf is compared by the editor with a similar Crow tale.
  category: relationship
  evidence_refs:
  - ev:19
