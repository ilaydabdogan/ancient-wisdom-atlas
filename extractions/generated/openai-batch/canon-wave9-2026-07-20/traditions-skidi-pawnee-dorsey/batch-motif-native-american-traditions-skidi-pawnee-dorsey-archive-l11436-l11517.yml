canonical_text:
  quote: They gave him the dust of white clay, and a little feather
  summary: A young gambler recruits young men for a war expedition, prepares to travel
    south against enemies, visits a circle of dead men on a hill, receives white clay
    and a feather that will blind enemies to him, raids a small village, and later
    sets scalps around the dead men’s circle before a victorious return display at
    his home village.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The gambler summons several close young male friends to his lodge and tells
    them he intends to travel far south to fight the enemy, not merely to capture
    ponies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men agree to follow him and do what he asks, and the group decides
    to go on the warpath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Additional young men want to join; their mothers or sisters make moccasins,
    fill them with dried meat, corn, and other supplies, and wrap them as carryable
    bundles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many young men gather in the gambler’s lodge at night before the planned early-morning
    departure, and the gambler does not send the extra volunteers away.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gambler leads the company toward the place where dead men lie, leaves
    the others behind, and enters a circle of dead men on a hill by himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The gambler addresses the dead men as brothers and says he will bring them
    scalps if he finds the enemy’s camp and succeeds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead men give the gambler white clay dust and a little feather for his
    scalp-lock; applying the clay and feather is said to blind enemies so they cannot
    see him.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dead men say they will watch and be near the gambler as he travels.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After traveling many days, the party finds a small village of about seven
    tipis and plans to wait until evening to attack.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The war party surrounds the tipis, gives the war-whoop, kills the men, captures
    women and children, takes the horses, and brings the village to their camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the place of the dead men, the gambler takes prepared scalps on sticks
    up the hill and sets them around the circle; no one speaks to him and he sees
    nobody.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The next day the returning war party performs a sham battle in view of the
    home village; villagers first think enemies are coming, then recognize a victorious
    returning party.
  category: sequence
  evidence_refs:
  - ev:9
