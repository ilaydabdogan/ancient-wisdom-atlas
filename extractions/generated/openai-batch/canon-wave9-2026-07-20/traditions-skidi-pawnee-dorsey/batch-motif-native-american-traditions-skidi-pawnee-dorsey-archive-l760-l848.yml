  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Northwest Star is given power to send buffalo by means of the Winds, control
    the Winds in the north, create people, and give a holy bundle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Southwest Star and Southeast Star are each given power to create people
    and give a bundle.
  category: action
  evidence_refs:
  - ev:6
