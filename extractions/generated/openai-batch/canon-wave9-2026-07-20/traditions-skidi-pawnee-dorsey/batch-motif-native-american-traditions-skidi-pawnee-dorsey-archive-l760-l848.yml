canonical_text:
  quote: ''
  summary: A creation tradition recounts Tirawa presiding in Tirawahut with Atira
    and assigning celestial deities to positions and functions. Stars, Sun, and Moon
    receive powers connected with light, darkness, creation of people, holy bundles,
    chieftainship, animal powers, buffalo, winds, and the placement of celestial children
    on earth. The introductory synopsis also describes the first people, a first man,
    and a skull kept in a sacred bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening synopsis states that in the beginning heaven and earth are unseparated
    and that Tirawa stations gods in the sky as Stars, Sun, and Moon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cloud, Wind, Lightning, and Thunder are placed toward the western paradise
    as ministers of the Evening Star, and through tempest the earth is animated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tirawa is chief in Tirawahut, Atira is his spouse, and gods sit around them
    in council.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tirawa tells the gods that he will station them in the heavens, give them
    powers, and create people who will be under their care.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sun is stationed in the east to give light and warmth, and the Moon is
    stationed in the west to give light when darkness comes over the earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Evening Star is stationed in the west and called Mother of all things;
    the Morning Star is stationed in the east and described as a warrior who drives
    people westward.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The North Star is placed in the north, is not to move, and is made chief of
    the gods placed in the heavens.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Four stars of the northeast, northwest, southwest, and southeast are told
    to uphold the heavens, touch heaven and earth, create people, and give holy bundles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tirawa says the Sun and Moon will have a boy, and the Morning Star and Bright
    Star will have a girl; the gods will assist in placing these children on earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The introductory synopsis says the celestial boy and girl are put on earth,
    receive intelligence from storm spirits, cohabit, and give birth to a first man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:11
  text: The introductory synopsis says the first man dies, his skull is placed in
    the bundle, and after being accidentally broken it is replaced by a successor's
    skull.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:12
  text: The North Star is to communicate with the chief of the people, so that the
    people have a chief resembling the fixed star presiding over his people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Northeast or Black Star is associated with darkness and night and is given
    power to create people and animal gods who communicate animal mysteries and powers
