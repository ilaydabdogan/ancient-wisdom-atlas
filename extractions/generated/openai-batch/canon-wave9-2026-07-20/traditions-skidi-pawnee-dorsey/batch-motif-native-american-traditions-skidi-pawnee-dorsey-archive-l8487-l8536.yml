canonical_text:
  quote: "“the blue-gray horse for warfare, seeing that it represented the heavens”"
  summary: A poor boy repeatedly joins war-parties with a speaking horse that changes
    into a fine lightning-marked horse. The boy first performs war deeds without revealing
    himself, is later recognized after taking a large herd, is instructed about special
    horses, gives ponies to a benefactor, marries the benefactor’s daughter, and becomes
    a chief.
  language: English
  quote_policy: quoted
