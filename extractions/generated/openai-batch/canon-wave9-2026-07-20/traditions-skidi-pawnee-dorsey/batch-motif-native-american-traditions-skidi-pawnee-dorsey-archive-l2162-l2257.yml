canonical_text:
  quote: You shall marry her, and the first-born shall be mine.
  summary: The Bright and Great Star, with an assistant, aids a poor boy in winning
    a young girl by overcoming dangerous waters and a sequence of demands involving
    a baby-board, a tree with singing birds, and hidden spring water. The Star states
    that the first-born child will belong to him, gives the boy a club, and returns
    to the heavens.
  language: English with Latin excerpts
  quote_policy: quoted
