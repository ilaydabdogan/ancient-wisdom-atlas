- id: obs:1
  text: The leader identifies himself as the Bright and Great Star and says Tirawa
    gave him more power than any other star.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bright and Great Star tells the poor boy that he will lead him to the
    young girl's lodge, that the boy shall marry her, and that the first-born child
    shall belong to the Star; a boy child is said to become a great warrior.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After sleeping on the hill, the boy wakes when touched and sees the same two
    men, identified as the Great-Star and his assistant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The creek where the boy is sent to wash is full of black snakes, large fish,
    and beavers and otters carrying fire in their mouths.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Great-Star strikes the water with his club, causing the animals to disappear
    or die, and instructs the boy to dive several times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After diving, the boy comes up wearing a fine robe and fine leggings with
    birds attached and is described as a fine-looking man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the girl's lodge, the girl sings that they must get a baby-board with cat-hide
    and deer-hoof rattles; the men obtain it while the old woman is sleeping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thorns blocking the way disappear when the man waves his club, and the firewood
    does not attack because its spirits have been taken from it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The girl next demands a tall tree and mockingbirds for the child; the men
    bring the tree, and birds sing when the boy gestures toward the birds on his leggings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl then demands spring water to wash the baby; birds sent to find the
    spring fail, and animals do not seem willing to help.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old witchwoman with many children says she knows where the water is and
    asks for two small reeds and a bladder.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old woman has her children dance in a circle, goes into the ground, and
