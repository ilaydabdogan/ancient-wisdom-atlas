canonical_text:
  quote: ''
  summary: The passage contains two narrative units. In the first, a chief representing
    Tirawa and heavenly power quarrels with a medicine-man representing earth powers;
    after mutual threats, the medicine-man is killed by thunder and lightning, and
    the chief later dies from a sharp beaver-gnawed stick in the creek. In the second,
    a young man is commanded by the Sun to fast on a high hill; after a prolonged
    ordeal he is restored in the lodge and later receives, in a dream, medicine power,
    a Sun-painted life robe, a protective Sun shield, a sacred name, and instruction
    in roots.
  language: English
  quote_policy: summarized
