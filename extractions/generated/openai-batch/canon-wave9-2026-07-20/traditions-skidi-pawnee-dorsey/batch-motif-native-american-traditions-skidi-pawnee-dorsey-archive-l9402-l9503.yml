- id: obs:1
  text: A chief and a medicine-man are introduced as quarrelling representatives of
    heavenly and earthly powers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief was given a sacred bundle and was to represent Tirawa; the medicine-man
    was given a bundle and was to represent the gods of the earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief says he can call thunder and lightning against the medicine-man;
    the medicine-man says earth gods could make a stick or another thing harm and
    kill the chief.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cloud comes over the village, with thunder and lightning, and the lightning
    strikes and kills the medicine-man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several days later the chief steps into creek water and dies after being struck
    through the side by a sharp beaver-gnawed stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A young man is made by the Sun to dream that he should stand fasting on a
    high hill for ten days.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The young man tells his mother to set a long pole in the ground on the hill,
    washes in the creek, puts white clay on his face, and goes up the hill to cry.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man remains on the hill crying for fourteen days and is later found
    weak, lying down, and ghost-like.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: His people take him to the lodge, pour buffalo grease into his mouth, and
    anoint him with red ointment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two days later he dreams of a man covered with red ointment and wearing a
    red-painted robe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The red-painted being tells him that he will receive power to make a dead
    bird or animal alive and power to be a medicine-man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The being gives him a robe to be painted with the Sun and says the robe will
    be his life; if killed on dry land and wrapped in the robe he will live, but if
    killed in water he will die.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The being gives instructions for a shield made from the breast of a young
    bull, shrunk over hot fire, marked with the Sun, hung on a pole, and moved to
    face the sun.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The being gives the young man the name Siaracutskitskaraha, translated as
    Proud-Painted-Clay-Face, and later comes often to teach him about roots.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The man later enters the medicine-men’s lodge during yearly medicine-men’s
    sleight-of-hand performances.
  category: action
  evidence_refs:
  - ev:11
