  quote: ''
  summary: 'A boy and his sister develop a self-sufficient camp over successive seasons:
    they harvest and store crops, the boy hunts increasingly large game and many buffalo,
    the girl prepares hides, clothing, tipis, parfleches, and dried foods, and together
    they enlarge their garden and accumulate stored meat and crops.'
