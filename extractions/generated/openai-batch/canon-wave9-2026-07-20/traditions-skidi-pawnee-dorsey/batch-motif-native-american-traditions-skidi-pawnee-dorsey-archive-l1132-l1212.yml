canonical_text:
  quote: ''
  summary: 'People gather at a center village for a ceremony. A man reports Bright-Star''s
    instructions: the Yellow-Calf bundle is excluded and hung on a tree, while other
    bundles are arranged according to the heavenly stations of gods or stars. Four-direction
    groups bring colored poles, water is ritually handled to teach the division of
    land from waters, young men wear animal skins around the circle, and Bright-Star
    selects a priest who directs the ceremony. The passage also lists villages, directions,
    and associated bundles.'
  language: English
  quote_policy: summarized
