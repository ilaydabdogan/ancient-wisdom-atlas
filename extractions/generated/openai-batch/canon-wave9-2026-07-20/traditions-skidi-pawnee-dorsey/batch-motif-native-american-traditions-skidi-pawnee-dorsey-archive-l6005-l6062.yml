canonical_text:
  quote: ''
  summary: A girl leads a boy out through an underground cave to the surface. Finding
    their former village gone, she uses buffalo wool from her bundle to determine
    which people went which way. The boy chooses to remain with her. They reach her
    people's village, where she explains that he killed the underground animal that
    had been taking girls. She says he will become her husband, advises the people
    to move north because buffalo will come, and the two bands are later reunited
    near the Platte River. Buffalo arrive in abundance, the people prosper, and the
    boy teaches them wonderful things and songs, though the final word in the provided
    passage is interrupted.
  language: English
  quote_policy: summarized
