canonical_text:
  quote: ''
  summary: The passage describes Skidi Pawnee sacred bundles, ritual ownership, priestly
    transmission of ritual knowledge, dances taught by supernatural beings, esoteric
    origin tales treated as personal property and life-substance, and winter Coyote
    storytelling practices with a seasonal restriction connected to snakes and Coyote’s
    star.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Morning-Star bundle is associated with the sacrifice of a human maiden;
    the Evening-Star bundle is associated with the heart and tongue of a buffalo and
    tobacco.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bundle ownership is described as hereditary, while knowledge of the ritual
    is held by four village priests and learned through long service as a pupil.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ritual knowledge may be transferred from one priest to another, and payment
    is demanded and received for that transfer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Named dances are said to have been given or taught by Pahokatiwa, the Water-Monster,
    a wonderful Bear, the South-Star, and Paruxti, the Wonderful.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dances are described as beneficial to the people, including instruction
    about animals in the Medicine-Men’s-Dance and calling buffalo in the Buffalo-Dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dances usually last four days and include constructing a lodge or booth, singing
    rituals, and dancing movements kept in time with the songs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each bundle ceremony and dance is accompanied by a ritual and an origin tale
    that is generally the personal property of its keeper or owner.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Origin tales are described as esoteric and usually related after ritual recitation
    or during transmission of the bundle or ceremony to the next owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Traditions and rituals are said to be paid-for personal property and to form
    an intrinsic part of the owner’s life.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that telling these traditions gives out part of the teller’s
    life and is connected with the termination of life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Origin myths may circulate beyond the priesthood, lose original meaning, and
    come to be told as ordinary tales without special religious significance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Many other tales are collectively called Coyote tales, even when an individual
    story does not involve Coyote.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Coyote is described as wonderful, all-knowing, virtually indestructible, tricky,
    full of wild conceits, and rarely finally vanquished.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: A tale in which Coyote or a culture-hero overcomes an enemy is said to indicate
    the teller’s wish for comparable success in a venture.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Coyote tales are told when men assemble in winter, including at home, on the
    hunt, and on the warpath.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: The phrase translated as “Now the gut passes” marks the end of a tale and
    refers to passing dried fat buffalo entrail to the next person.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Coyote tales are not told during months when snakes are visible; the passage
    states that the snakes’ tutelary god or star is in direct communication with Coyote’s
    star during those months.
  category: relationship
  evidence_refs:
  - ev:11
