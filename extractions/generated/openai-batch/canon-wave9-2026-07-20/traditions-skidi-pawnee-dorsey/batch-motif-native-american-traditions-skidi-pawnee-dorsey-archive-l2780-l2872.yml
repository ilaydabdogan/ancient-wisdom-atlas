  cautions: The passage does not define the full ceremonial meaning of each gift.
- id: motif:2
  label: Divine aid mediated by a human ritual specialist
  taxonomy_refs:
  - culture_hero
  basis: The boy explicitly says he is a man, not a god, yet he mediates aid from
    Hutukawahar and performs actions to bring buffalo and feed the people.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:11
  confidence: medium
