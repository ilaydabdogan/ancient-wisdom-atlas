canonical_text:
  quote: ''
  summary: Chiefs seek help from a young man said to call buffalo because the people
    lack meat. They approach him with a pipe and gifts; he accepts and says he is
    human, not a god, but will help if the northern god Hutukawahar is willing. He
    orders a ceremony using otter hides, black handkerchiefs, clam shells, tobacco,
    singing, dancing, raised cedar poles, and offerings. During the ceremony he repeatedly
    leaves and returns with worn moccasins and meat, says he has traveled far, and
    foretells a calf. The calf appears, is killed by selected unmarried young men,
    and its tongue and heart are mixed with tobacco and offered by burial and fire
    to divine powers while the dance continues.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man reports that he was told a certain young man could call buffalo; the
    chief summons chiefs and braves to meet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The head chief describes the people’s lack of food and children crying for
    meat, and asks others to gather presents including robes, wampum, arrows, and
    pipes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiefs paint themselves, turn their robes inside out, and approach the boy
    with a pipe and presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy takes the pipe after a delay; the chief blesses him by passing hands
    over his head and arms, and the pipe is lit and smoked.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy says he is a man and not a god, and says food will be plentiful if
    the god present with him is willing; the god is identified as Hutukawahar, Wind-Ready-to-Send,
    one of the gods in the north.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy requests two otter hides, two black handkerchiefs, two clam shells,
    and much tobacco, and says singing and dancing will make the wind grasp the songs
    and the earth shake so buffalo will come.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A new tipi is set up west of the village; on its north tipi poles are tied
    a silver piece and a magpie-feather headdress for the young man.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Otter skins, black handkerchiefs, shells, and tobacco are tied to two cedar
    poles on a high hill so the gods in the heavens will see the presents and help
    drive the buffalo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy sings in the lodge while the people dance; he leaves the lodge making
    a grunting noise and returns with worn-out moccasins, then changes them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy sometimes picks up meat and hands it to people, who cook it and feed
    those entering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After leaving and returning, the boy says he has been a long way off, says
    buffalo will come, and says a calf followed him and will be seen on the north
    hill; the calf is then seen.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Four unmarried young men who had never known a woman are selected to kill
    the calf and bring it home whole.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The calf is laid south of the fireplace with its head facing north; an old
    man with a flint knife removes the tongue and heart.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The boy cuts the tongue and part of the heart into pieces and mixes them with
    tobacco.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The boy takes the meat outside by the south, offers it to gods in the west
    and north while dropping pieces into a hole, covers the hole, and returns by the
    north.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The tongue and heart are placed in a fire for the god who gave the boy power
    to call buffalo; the fire is made with fire-sticks.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The boy continues singing and tells the people to dance to shake the ground
    and awaken the buffalo; the calf is boiled and everyone in the lodge must eat.
  category: sequence
  evidence_refs:
  - ev:12
