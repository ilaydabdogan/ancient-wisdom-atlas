- id: motif:1
  label: Petitionary pipe-and-gift exchange for ritual aid
  taxonomy_refs:
  - sacred_exchange
  basis: The chiefs bring a pipe and gifts to the boy, wait for his acceptance, bless
    him, smoke, and ask him to help obtain food.
  evidence_refs:
