canonical_text:
  quote: ''
  summary: In a medicine lodge setting, Scabby-Bull displays ritual objects, accepts
    only earnest young men who offer pipes to learn his secrets, teaches selected
    men through sleight-of-hand performances involving a fawn, weapons, apparent wounds,
    and healing, marks plum-stones with moon and star designs after a fire-centered
    action, and becomes admired by the people and envied by other medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After animal lodges inside the big lodge were completed, medicine-men brought
    medicine bags and wonderful things; Scabby-Bull brought a little fawn with an
    oriole’s nest tied on it and wore strings of deer tails and ears on his robe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Scabby-Bull went to his lodge behind the cedar-tree.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young men entered the medicine-men’s lodge with pipes filled with native tobacco
    and presents, asking to learn a particular medicine-man’s mysteries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young man handed a pipe to Scabby-Bull, touched Scabby-Bull’s head, arms,
    and hands, and thanked him for receiving the pipe; the pipe signified that Scabby-Bull
    was to teach his secrets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Scabby-Bull refused some pipes from men he judged not earnest, then selected
    four men for his lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Scabby-Bull made the fawn make a live fawn’s noise and made fawn skin turn
    into a fawn and walk about, then taught this performance to one of his men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Scabby-Bull stabbed a man in the side; the knife appeared broken and the man
    was frightened, but Scabby-Bull placed his hand on the wound, after which the
    wound was healed and the knife was not broken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A gun was fired upward through the lodge air-hole covered by buffalo hide,
    and Scabby-Bull later inverted the gun so that bullet and powder fell out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man was shot with arrows, fell over as if dead, and was healed by Scabby-Bull
    after the arrows were removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man brought a buffalo robe, blanket, dried buffalo meat, and six unmarked
    plum-stones as presents, saying his daughter wanted Scabby-Bull to mark the stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Scabby-Bull carried the plum-stones around the fireplace four times, waved
    his hand over the fire, went outside, and returned the stones with marks on them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The six plum-stones bore moon and star designs, including a new moon with
    a small black star, a half-moon, a full moon, one large star, two stars, and seven
    stars.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The people said the stones were painted black through the power of the moon
    and stars.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: People came nightly to watch Scabby-Bull’s performances, other medicine-men
    became jealous, and Scabby-Bull said their medicines could not hurt him because
    he had too much power within.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Scabby-Bull became especially attached to a man called Warrior, who was a
    great hunter like Scabby-Bull.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:8
