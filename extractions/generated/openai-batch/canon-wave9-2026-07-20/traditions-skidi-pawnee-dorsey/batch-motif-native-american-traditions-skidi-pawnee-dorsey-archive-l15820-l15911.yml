canonical_text:
  quote: ''
  summary: A girl follows a war-party that has captured her lover. She repeatedly
    appeals to Tirawa, the Moon, Mother-Earth, the Sun, birds, and later meteors for
    help. The party reaches a mountain village, where the captive young man sits by
    a fire while groups dance around and mock him, and he is tortured without flinching.
    The girl hides near the village, enters the tipi of an old woman who praises the
    captive's bravery, and explains that the captive is her lover and the son of Mad-Bull.
    The old woman recognizes him as kin and promises that he shall live, gathering
    her descendants and sons to plan his rescue. They decide to dress the girl in
    the oldest son's clothing and use a dance around the fire as cover to tell the
    captive she is present, cut his bonds, and help him escape.
  language: English
  quote_policy: summarized
