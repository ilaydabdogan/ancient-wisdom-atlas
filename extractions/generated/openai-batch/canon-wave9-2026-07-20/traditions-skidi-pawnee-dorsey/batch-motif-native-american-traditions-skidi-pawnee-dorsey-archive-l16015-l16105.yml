canonical_text:
  quote: ''
  summary: Black learns that his brother-friend, the chief's son, died in shame while
    believing Black had been killed. Black, Little-Eyes, and companions return to
    the village with ponies and scalps, and the village recognizes them as a successful
    war-party. Black explains that Little-Eyes saved his life but that he has kept
    away from her. A council hears the account and verifies it by the ponies and scalps;
    Black refuses the chief's pipe. In a later battle, Black charges into the enemy
    line and kills a chosen opponent, confirming his warrior prowess. During subsequent
    scalp dances, Black sees Little-Eyes dancing, remembers her courage and prayers,
    touches and embraces her, covers her with his robe, and says she will take the
    place of his dead friend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter reports to Black that Black's friend, the chief's son, has died after
    being shamed by the people for not staying with Black.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black takes a war-bonnet from the girl's saddle and gives it to the hunter,
    who puts it on.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black, Little-Eyes, and others approach the village with ponies, spears, and
    many scalps; the village first reacts as if enemies are coming and then recognizes
    a successful war-party.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl's father, who had been mourning her death, runs out to meet the returning
    party.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Black tells the girl's father that Little-Eyes saved his life, treated his
    sores with grease, and helped him take scalps and ponies, but that he kept away
    from her while they were together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Black's father, dressed in mourning, cries with joy when Black returns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the girl's lodge, men sit around the fireplace in a circle; Black is seated
    on the west side with two cushions while the people ask about the story.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chiefs judge that the ponies and scalps prove the account, and the chief
    offers Black the chief's pipe, which Black refuses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the village is attacked, Black rides naked except for a spear, breaks
    the enemy line, overtakes a chosen enemy, and spears him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the enemy retreats, the people rejoice and women make several scalp
    dances.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Little-Eyes dances in dresses she had received from the enemy while among
    them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Black recalls that Little-Eyes had followed the enemy for his sake, prayed
    to gods in the heavens, and lifted her hands to meteors to help rescue him.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: Black touches Little-Eyes at the dance; she comes to him, and he embraces
    her and puts his robe over her.
  category: action
  evidence_refs:
  - ev:6
