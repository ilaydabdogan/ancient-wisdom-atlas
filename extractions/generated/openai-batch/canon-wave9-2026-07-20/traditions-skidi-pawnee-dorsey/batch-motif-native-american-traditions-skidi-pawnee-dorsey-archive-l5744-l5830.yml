canonical_text:
  quote: ''
  summary: 'The passage closes a thistle-power episode in which bears pursue a thistle-boy
    after a cedar-tree dies, the boy calls for wind and becomes a dry thistle, and
    an unnamed man kills the bears with thistles. The man keeps a hill vigil and is
    told that herbs and roots have been subdued for medicine and that animals will
    teach people their mysteries; his thistle power then leaves him, and his son succeeds
    him. A new tale begins: a successful buffalo-hunting boy is targeted by angry
    buffalo, who send four calves transformed into girls to lure him. The fourth uses
    maw-stone scent, the boy follows her, the girls later become buffalo, and the
    buffalo carry him across a big water to abandon him on a high hill.'
  language: English, with a brief Latin editorial sentence in the source passage
  quote_policy: summarized
