canonical_text:
  quote: ''
  summary: A man named Hawk is away on the warpath while his wife meets a yellow-haired
    young man. The young man leads her to transform with him into yellow-headed snakes
    and they travel underground to another village. Her son Young-Hawk searches for
    her by singing her name and eventually finds her living with Yellow-Headed-Snake.
    Hawk follows, captures and binds the snake, spares the woman because of the son,
    names the group snake-hawks, and they turn into hawks, carry the snake away, eat
    it, and thereafter pursue snakes.
  language: English
  quote_policy: summarized
