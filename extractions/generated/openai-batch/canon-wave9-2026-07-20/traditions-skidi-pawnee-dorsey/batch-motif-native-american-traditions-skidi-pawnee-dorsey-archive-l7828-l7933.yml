canonical_text:
  quote: ''
  summary: The passage first concludes a story in which owls advise a boy to marry,
    alter his supernatural sight, give him feathers, and promise dream instruction
    so he can become a medicine-man; he later becomes a warrior, medicine-man, prosperous
    elder, blind old man, and dies. The passage then begins the story of a poor/orphan
    boy who makes mud ponies, is left behind when the village goes on a buffalo hunt,
    dreams that Mother-Earth has pitied him, and finds his remaining mud pony transformed
    into a speaking bald-faced sorrel that guides him toward his people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Owls light on a tree and tell the owl-aided boy to obtain a woman and return
    to them; his mother arranges marriage with a poor girl who consents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owls state that the boy’s former power to see in hunting is over, give
    him feathers to wear, grant clear sight for taking enemy ponies, limit one sight-power
    to February nights, and promise to come in dreams so he will learn to be a medicine-man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The owl-aided boy remains in the village, joins a northward camp movement,
    becomes a great warrior and medicine-man, later loses his night-sight, has many
    children and horses, becomes influential, grows blind, dies of old age, and is
    buried on a high hill in Nebraska.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mud-pony story introduces a poor boy whose parents have no ponies; he
    is fond of ponies and watches other boys water theirs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The poor boy builds a corral, gathers sticky mud, carries water in a buffalo
    bladder, moistens the mud, makes two mud ponies, marks one with white clay as
    bald-faced, and regularly waters and feeds the figures with grass and young cottonwood
    shoots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: One mud pony crumbles; the boy cries and resolves to care well for the remaining
    pony.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: While the boy is with his pony, the people break camp for a buffalo hunt;
    his parents cannot find him and leave, and he later discovers only the deserted
    village site.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The abandoned boy eats scraps, cries beside the bald-faced mud pony, falls
    asleep, and dreams of a bald-faced pony that says Mother-Earth has pitied him,
    that it is part of Mother-Earth, that it will belong to him, and that obedience
    will make him a chief.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: On waking, the boy finds a real bald-faced sorrel before the willow corral;
    the pony speaks, identifies itself as one of the mud ponies, tells him not to
    guide it, and directs him to ride toward his people.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The boy rides the pony through deserted village sites, gathers leftover food,
    dreams again of the pony, sleepwalks, and continues traveling.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The printed synopsis says the chief later obtains the pony by barter, the
    pony will not remain with another master, and after the boy becomes a chief the
    pony turns into mud.
  category: other
  evidence_refs:
  - ev:12
