canonical_text:
  quote: ''
  summary: Taihipirus sees a moon woman who identifies herself as Spider-Woman and
    tells him how the stranded warriors can escape from a rock by tying lariat ropes
    to a loose stone. He organizes the escape, the party obtains ponies, returns home
    victorious, and the villagers credit Mother Moon with helping them. The passage
    then describes Taihipirus in a medicine-men's ceremony, where he performs with
    a rawhide lariat, is suspended by the neck over a blaze, enters a fit-like state,
    emits black fluid from his mouth, and recovers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night, Taihipirus sees the moon as a woman who comes down from the moon
    on a black buffalo-hair lariat rope and goes up again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says she controls Taihipirus's spirit, gave him the ways of a woman,
    made him a great warrior, identifies herself as Spider-Woman, and says she can
    travel between sky and earth on her spider web.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spider-Woman instructs Taihipirus to gather the warriors' lariats, tie them
    to a loose rock on the steep bank, throw the rope down, and climb down to test
    the escape route.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Taihipirus wakes, rouses the men, has them fetch lariat ropes, and the men
    move a heavy loose stone to the edge of the steep bank and throw the tied ropes
    down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Taihipirus plans that some men will descend first, go to the village, drive
    away ponies, drink and vomit at a creek, and gather at a selected place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leader descends last, drinks water and vomits, rejoins the warriors, receives
    the herd of ponies, and travels with the group toward home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The returning war-party signals the village from the hills, and villagers
    sing victory songs and go out to meet them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A speaker says the men left on the rock were helped down by Mother Moon; a
    prior scout had reported that the enemy had surrounded the rock and that the men
    would starve there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that although the leading man had the ways of a woman,
    he was a great warrior and later did many wonderful things with ropes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a medicine-men's ceremony, Taihipirus brings a rawhide lariat, lets others
    examine it, places its loop around his neck, and is pulled up by men on top of
    the lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: While Taihipirus hangs in the air, dry limbs are piled on the fire to make
    a blaze; before he touches the fire, medicine-men take him down and place him
    on the west side of the fireplace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the rope-and-fire performance, Taihipirus has two black streaks at the
    corners of his mouth, is in a state compared to a childhood fit, is revived by
    the medicine-men blowing breath upon him, emits black fluid from his mouth, and
    recovers.
  category: sequence
  evidence_refs:
  - ev:8
