canonical_text:
  quote: ''
  summary: The passage recounts an unnamed medicine-powerful man who animates animal
    skins and birds, produces water from dry ground, heals and foretells death through
    information from the Sun. During an island battle he takes a society-held crow-feather
    crook without right, is wounded and killed on ice, and his younger brother is
    also killed. Their mother buries both sons in a robe despite advice to move the
    body to dry land. Later the man's sister encounters a bear in her cornfield; a
    boastful young man is caught by the bear, both are shot, and the bear maims him
    before dying. At night the dead bear tells the young man that it is the killed
    man living as a bear, now named Mud-Bear, and that it can help those who call
    on it; the young man dies. The passage then begins the next section, 'The Sun-Bear
    Medicine,' summarizing a wounded warrior aided by a bear related to the Sun and
    opening with a Skidi war party's journey and battle.
  language: English
  quote_policy: summarized
