canonical_text:
  quote: ''
  summary: Editorial notes identify society names and parallels, explain an appellation
    for foolish childlike behavior, describe flint as a lightning-related source of
    magic power for bows, summarize sky-ascent traditions and variants involving star
    people, explain an arbor ladder setting, identify a star council circle, note
    dance ritual knowledge and mourning posture, and describe burial customs including
    grave goods, grave structures, ponies associated with Spirit Land travel, and
    burial of a poor woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A society is said to resemble certain Plains Indian societies, including the
    Arapaho “Lime-Crazy” society and Cheyenne “Opposites,” and is also called the
    Children-of-the-Haduska Society and Children-of-the-Sun Society.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: "“Saru” is described as an appellation old people apply to children who are
    acting childishly and foolishly."
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Flint is described as formerly believed to have great efficacy and magic power
    because of its relation to lightning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Certain individuals are said to have had the right to attach flint to the
    upper end of a bow, making the bow a powerful weapon of last resort.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A serpent is said to burst open after a bow is thrown into it, explained by
    a belief that lightning power rests in flint and that flint can produce lightning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A story of a woman’s ascent to the sky is described as widespread, and forms
    involving ascent by a tree and descent by a lariat rope are noted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An arbor is described as accessed by a single cottonwood log ladder with steps
    cut into it; girls are inferred to sleep on top while parents sleep beneath after
    the ladder is removed.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a shorter variant, star people rest before night, wash in creeks, brush
    their hair, put on paints, and travel in the heavens as stars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the stars depart, a woman binds a child on her back and descends to
    earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The star-husband misses the woman, finds the opening through which she lowered
    herself, and kills her by dropping a stone on her head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy grows up, kills all bad animals, becomes a great man, and eventually
    disappears.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A council circle is identified with Corona Borealis, called by many Plains
    tribes the camp circle and by the Skidi the Council of the Chiefs, presided over
    by the North-Star.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A narrator is described as knowing the ritual of a dance and performing certain
    songs and movements from it during the Medicine-Man’s dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: "“Mourning” is explained as assuming the attitude of one weeping or crying
    with a humble spirit to show sincerity and gain divine intervention."
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: When a warrior was near death, his earthly worn things were brought and put
    on him; after death, a priest applied holy ointment and a buffalo robe was placed
    over him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A grave was dug, forked poles and other poles were arranged, the deceased
    and valuables were placed in the grave, and grass and dirt were piled so the grave
    resembled a house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: If relatives knew the deceased liked a pony, they killed the pony on his grave,
    believing he would ride it to the Spirit Land; if instructed not to kill ponies,
    they roached the pony, cut tail hair, spread the hair on the grave, and kept the
    pony.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: A poor woman could be rolled in a buffalo robe, placed in a shallow hole cut
    into a hillside, and covered with dirt.
  category: sequence
  evidence_refs:
  - ev:12
