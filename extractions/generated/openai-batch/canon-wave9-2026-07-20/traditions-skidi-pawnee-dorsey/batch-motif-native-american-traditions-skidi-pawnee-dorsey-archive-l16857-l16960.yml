candidate_motifs:
- id: motif:1
  label: Ritual society defined through inversion or altered conduct
  taxonomy_refs: []
  basis: The society is compared to the Arapaho “Lime-Crazy” society and Cheyenne
    “Opposites,” suggesting a pattern of societies marked by unusual or contrary behavior,
    though the note does not describe the society’s actions in this passage.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The passage gives only names and external comparisons, not internal ritual
    behavior.
- id: motif:2
  label: Lightning power embodied in flint weapon
  taxonomy_refs: []
  basis: Flint is said to possess magic power through its relation to lightning, and
    a bow with flint becomes a powerful last-resort weapon.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage explains belief about the object but does not give the full
    tale episode.
