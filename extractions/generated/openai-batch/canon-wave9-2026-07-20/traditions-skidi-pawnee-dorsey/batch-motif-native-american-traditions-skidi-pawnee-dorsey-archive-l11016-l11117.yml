- id: obs:3
  text: 'Four visitors enter the chief’s lodge: Owl-Man, a woodpecker medicine-man,
    a male learner from the recently killed man, and a woman learner of medicines.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief tells the visitors the meat is from a young deer he killed while
