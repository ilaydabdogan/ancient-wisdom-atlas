  quote: ''
  summary: The passage closes one narrative in which a chief ambushes and kills several
    medicine-witches after feeding them meat, exposes their grave-related medicine
    objects, burns their bundles, and the people later choose a new chief. It then
    begins “The Duck Medicine Shield,” where a hunter protects a duck from a hawk,
    hears competing offers of power, follows the duck to a lake, and is led by a woman
    across and down into the pond.
  language: English
  quote_policy: summarized
