canonical_text:
  quote: instead of a blood-clot, the blood had turned into a baby.
  summary: The passage opens with a synopsis of a boy hero born from a clot of buffalo
    blood who later kills a bear, gains animal-aided arrows, attracts buffalo, survives
    a witch, and vanishes in buffalo form. The detailed narrative describes a poor
    married couple leaving a village, prospering by hunting buffalo, being dominated
    and starved by a bear and its children, receiving secret food from the youngest
    bear, and hiding a clot of blood from a slain buffalo that becomes a baby.
  language: English
  quote_policy: quoted
