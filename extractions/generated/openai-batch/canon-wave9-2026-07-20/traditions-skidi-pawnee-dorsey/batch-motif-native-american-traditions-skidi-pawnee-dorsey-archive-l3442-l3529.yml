canonical_text:
  quote: ''
  summary: Two girls sleep on a specially built arbor; one says she wishes a bright
    southeast star were her husband. The next morning she is missing and awakens in
    the star's country. The star appears in human form, says he heard her wish while
    the stars journeyed west, and says he took her up. She lives with him and learns
    the residents are stars who go out each evening to show themselves. After being
    warned not to dig turnips too deeply in valleys, she digs through the heavens
    and sees the earth below. She gathers buffalo sinews and makes a rope while pregnant;
    after her son is born and begins crawling, she continues preparing rope for a
    descent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two girls in a village slept on an arbor built especially for them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One girl pointed to a big bright star in the southeast and said she wished
    that star were her husband.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The next morning the girl who made the wish was missing, and nobody knew where
    she had gone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl awoke in another country, where people told her it was the home of
    the star she had liked.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The star came to her in human form, was described as middle-aged, and said
    he had heard her wish while the stars were journeying west and had taken her up.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl cried and asked to be taken home, but the star said he could not
    do so; after many days she yielded and lived with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each evening the people in the star country washed with water, put buffalo
    ointment on their heads and bodies, and disappeared or returned by morning because
    they were stars going out to show themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband allowed the woman to dig wild turnips but warned her not to dig
    them in a valley, or at least not too deeply there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman deliberately dug deep in a valley until her buffalo shoulder-bone
    hoe went through the ground; she enlarged the opening and found she had dug through
    the heavens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Through the hole she saw the earth far below, with wooded streams looking
    like black strings and animals looking like ants, and she recognized her home.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: She closed the hole, asked the star's servants or men to bring buffalo sinews,
    and began making a sinew rope at a timbered stream.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: She was pregnant during the rope-making; after a boy was born and grew strong
    enough to crawl, she returned to the work.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: She tied the sinew rope to a stick across the hole, lowered it, judged that
    it would not reach the ground, and made more rope and shorter ropes to wear around
    her neck when going down.
  category: action
  evidence_refs:
  - ev:8
