canonical_text:
  quote: ''
  summary: The supplied passage includes a war-party story in which a leader's sacred
    ear of corn is stolen from a warrior bundle, recovered from a gopher hill, ritually
    addressed, and later renewed through planting; a Milky Way account in which the
    dead travel from a northern star along differentiated Milky Way roads to a southern
    star; a second Milky Way account involving a race between horse and buffalo; an
    isolated speech attributed to Paruxti about pursuit and arrows; and the opening
    of the Children-of-the-Sun Society account, describing homeless youths, contrary
    speech, and a synopsis of two chiefs assisting an eagle against a serpent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A company of warriors goes on the warpath to capture ponies, and the leader
    is identified as carrying the warrior bundle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A warrior who wants to lead decides to take the ear of corn from the bundle
    and hide it so that the leader will turn back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The leader dreams that someone is damaging or opening his bundle, wakes, and
    finds that the corn is missing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leader calls the missing corn holy and their protector, and says that
    without it the party will have to return home.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The leader finds the mother corn in a gopher hill marked by fingers, gives
    pipe whiffs to the corn and then to the heavens and Tirawa, and has the corn tied
    on the otter skin he wears.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the corn is recovered, the party reaches a Comanche camp, selected scouts
    capture ponies, and the party drives the ponies home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The warrior suspected of stealing and hiding the corn strays away and never
    returns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After returning home, old priests change the ear of corn, and the old ear
    is given to a priest's wife to plant so that more corn can be obtained for the
    warriors' bundle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dead are said to go to a star at the northern end of the Milky Way and
    then southward to another star at the southern end.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The northern star receives the dead upon the earth, takes them on a long journey
    north, and places them upon the Milky Way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Warriors are placed on the dim Milky Way, while those who died of old age
    and women are placed on the wide travelled road.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the southern end of the Milky Way, another star receives the spirits of
    the departed, and there they make their home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Another account says that a horse and a buffalo ran a race, made dust in different
