candidate_motifs:
- id: motif:1
  label: Sacred theft of a ritual protector
  taxonomy_refs:
  - sacred_theft
  basis: A warrior removes and hides the ear of corn from the warrior bundle; the
    leader identifies the corn as holy and protective, and the party cannot continue
    until it is recovered.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The motive is to displace the leader or force return, not explicitly to
    gain sacred power.
- id: motif:2
  label: Ritual bundle object protects and leads a war party
  taxonomy_refs: []
  basis: The leader says the missing corn protected and led the warriors; after its
    recovery the party proceeds and successfully captures ponies.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly names ritual bundles or protective
    war medicine.
- id: motif:3
  label: Renewal of sacred corn through planting
  taxonomy_refs:
  - seasonal_cycle
  basis: The old ear of corn is given to a priest's wife to plant so that more corn
    can be obtained for the warriors' bundle.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes practical ritual renewal of bundle corn; broader
    seasonal-cycle interpretation should be reviewed.
- id: motif:4
  label: Afterlife journey mapped onto the Milky Way
  taxonomy_refs:
  - afterlife_journey_map
  basis: The dead travel from a northern star onto the Milky Way, move south on differentiated
    roads, and are received by a southern star where they make their home.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives a concise account and does not elaborate on judgment,
    obstacles, or ritual requirements.
- id: motif:5
  label: Different celestial roads for categories of the dead
  taxonomy_refs: []
  basis: Dead warriors are placed on the dim Milky Way, while women and those who
    die of old age are placed on the wide travelled road.
  evidence_refs:
