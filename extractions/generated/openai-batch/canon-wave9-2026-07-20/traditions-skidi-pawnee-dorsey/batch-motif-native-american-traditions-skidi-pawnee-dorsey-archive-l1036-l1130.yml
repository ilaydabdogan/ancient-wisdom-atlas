canonical_text:
  quote: ''
  summary: A young man kills buffalo, makes a hoe from a buffalo shoulder-blade through
    dream instruction from the Moon, and receives visions from Bright-Star about a
    holy bundle, a yellow calf sacrifice, corn, and ritual objects. Bright-Star and
    four western gods teach ceremonies in visions. As the people increase, Closed-Man
    learns of other peoples with their own bundles and directional corn. He establishes
    a gathering place and sends an errand man to invite neighboring peoples; some
    accept, while medicine-men and the Skirirara, who have their own powers or ceremonies,
    do not.
  language: English
  quote_policy: summarized
