candidate_motifs:
- id: motif:1
  label: Visionary transmission of practical and ritual knowledge
  taxonomy_refs:
  - wisdom
  - initiation
  basis: The Moon instructs the hoe-making in a dream, and Bright-Star with the four
    western gods transmits bundle instructions and ceremonial songs through visions.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage clearly describes visionary instruction; the taxonomy label
    'initiation' is interpretive because no formal initiation term is used.
- id: motif:2
  label: Founding sacrifice of a sacred animal offering
  taxonomy_refs:
  - sacrifice
  basis: The female yellow calf is killed and made holy, and its tongue and heart
    are offered to Tirawa; the passage calls this the first offering of those parts
    to Tirawa.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The extraction does not infer meanings beyond the described offering.
- id: motif:3
  label: Sacred bundle as divine-given ritual charter
  taxonomy_refs:
  - sacred_exchange
  - culture_hero
  basis: Bright-Star says the gods will provide a bundle and its contents, and the
    man assembles and receives ceremonies for it, making him a transmitter of ritual
    knowledge to the people.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage supports divine gift and ritual transmission; 'culture_hero'
    is a broad comparative category and should be reviewed.
- id: motif:4
  label: Directional distribution of colored corn among peoples
  taxonomy_refs: []
  basis: Bright-Star assigns different corn colors to peoples of the Southwest, Northwest,
    Northeast, and Southeast, each within their bundles.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No broader cosmological taxonomy is assigned because the passage does
    not explicitly explain the directional scheme.
- id: motif:5
  label: Ritual gathering and legitimation of a future chief
  taxonomy_refs:
  - royal_legitimacy
  basis: Closed-Man is told to gather peoples for ceremonies, and western villagers
    say their god foretold that the gatherer would become chief of the tribes.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage states a forecast of chieftainship, but does not describe
    an enthronement or formal political rite.
- id: motif:6
  label: People-name origin from wolves standing in frozen water
  taxonomy_refs: []
  basis: The passage explains the name Skirirara, Wolves-Standing-in-Water, through
    the event of wolves and coyotes freezing while standing in water after eating
    buffalo carcasses.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No available motif-family taxonomy directly corresponds to this etiological
    naming pattern.
comparison_claims:
- id: claim:1
  claim: Within the passage, Closed-Man's holy bundle and the bundles of other directional
    peoples are comparable as parallel divine-given ritual bundles associated with
    corn, though the passage distinguishes whether their ceremonies are known.
  claim_level: same_function
  target: directional sacred bundles of neighboring peoples in this passage
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage functional comparison only; it does not assert
    historical contact beyond what the passage states.
- id: claim:2
  claim: The Skirirara wolf-skull bundle is comparable to the other bundles as a local
    ritual bundle, but its holders are presented as already knowing their ceremony
    and therefore not joining the gathering.
  claim_level: same_function
  target: Paxskawahar / Head-Ready-to-Give wolf-skull bundle and other sacred bundles
    in the passage
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The passage gives few details about the Skirirara ceremony, so the
    comparison is limited to bundle possession and ritual function.
