  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: The eastern people have a bundle with a wolf skull on it, called Paxskawahar,
    and they know their ceremony, so they do not go.
  category: object
  evidence_refs:
  - ev:9
