- id: obs:5
  text: Bright-Star instructs the man to kill a female yellow calf, make it holy,
    skin it, and offer its heart and tongue to Tirawa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In snowy, cloudy weather the gods drive buffalo; the man finds the yellow
    calf, kills it, skins it, and offers its tongue and heart to Tirawa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage identifies this as the first offering of the tongue and heart
    to Tirawa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Corn, owl and hawk skins, sweet grass, flint-stones, and paints are placed
    in the bundle, which is hung in the lodge.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Bright-Star brings four gods from the west in a vision, and the four gods
    sing songs for ceremonies that the man learns over successive nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A hunter meets another man while hunting, and they find that they can understand
    one another's language.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bright-Star tells Closed-Man that other gods created other numerous peoples
    and gave them bundles, but that those peoples do not know the ceremonies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bright-Star says the Southwest, Northwest, Northeast, and Southeast peoples
    have white, yellow, black, and red corn respectively in their bundles.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Closed-Man travels north, establishes a village on Beaver Creek, and selects
    a place where peoples are to gather to receive ceremonies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The errand man invites a western village with four lodges arranged in the
    northwest, northeast, southwest, and southeast parts of the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: People in the western village say they will come because their god foretold
    that a man would gather the people and become chief of the tribes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Medicine-men at the Elk Horn River refuse to take part, saying their god gave
    them powers to hold their own ceremonies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Eastern people live in earth lodges with entrances facing west and have a
    man who can call buffalo.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:18
  text: The eastern people are named Skirirara, Wolves-Standing-in-Water, after coyotes
