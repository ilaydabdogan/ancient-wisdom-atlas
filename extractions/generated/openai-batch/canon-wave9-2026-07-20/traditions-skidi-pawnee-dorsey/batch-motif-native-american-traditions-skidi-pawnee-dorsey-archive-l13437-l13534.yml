canonical_text:
  quote: ''
  summary: The passage contains animal-tale material involving Coyote. In one episode,
    hungry Coyote receives help from Beaver, who uses a sharp white stick and bodily
    grease to turn rotten sticks into pemmican; Coyote repeats the act for his family,
    but after a child substitutes another stick he bleeds and dies. In another episode,
    Coyote deceives Bear with a rope and rock, later hides in mud as if he were a
    log, is detected, and is killed. The passage ends with a title and headnote for
    a Coyote and Raccoon tale stating that Coyote fails in trying to trick Raccoon.
  language: English
  quote_policy: summarized
