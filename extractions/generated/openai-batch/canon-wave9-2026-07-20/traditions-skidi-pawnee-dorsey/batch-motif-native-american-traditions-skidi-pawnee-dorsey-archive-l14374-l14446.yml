canonical_text:
  quote: ''
  summary: 'During a rapid journey, a boy aids his father with inexhaustible pemmican
    and tells him how to drink water made by his buffalo mother’s hoof in a dry creek
    bed. The father uses a feather and the power of Standing-Wind to keep pace. At
    a buffalo herd, bulls resent the man because he has a buffalo-woman and because
    of earlier offenses. They threaten to kill him and impose two recognition tests:
    finding his son among ten similar calves and finding his wife among ten similar
    cows. The boy secretly provides signs that allow his father to identify both.'
  language: English
  quote_policy: summarized
