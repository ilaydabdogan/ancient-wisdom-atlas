  text: After the tipi disappears, the man places a feather on his head and says he
    has the power of Standing-Wind at his command, enabling him to catch up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman and boy run into a buffalo herd while the man remains at a distance,
