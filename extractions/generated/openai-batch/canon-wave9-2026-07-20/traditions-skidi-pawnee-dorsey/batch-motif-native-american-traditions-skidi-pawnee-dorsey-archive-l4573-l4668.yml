canonical_text:
  quote: ''
  summary: A poor strange boy, later identified as Blood-Clot-Boy, is allowed to stay
    with Burnt-Belly and his grandmother outside the village. Blood-Clot-Boy constructs
    a web-like rawhide-and-ash ring, prepares a better bow, and shoots through the
    rolled ring to obtain buffalo. The grandmother skins the animals, greases the
    ring with tallow, and accumulates meat and hides while the village starves. A
    man discovers the meat, is identified by Blood-Clot-Boy as kin, and tells the
    chief, who asks Blood-Clot-Boy to help the people. Blood-Clot-Boy says he can
    help after retrieving his distant kindred.
  language: English
  quote_policy: summarized
