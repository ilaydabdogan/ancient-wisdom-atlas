canonical_text:
  quote: ''
  summary: A young man departs south with a forked stick to kill a destructive animal,
    gives his sister dawn-color signs by which to know whether he is dead or returning,
    rejects misleading paths, kills a flint-covered monster, takes its paw, and returns.
    The paw is displayed while families choose forms and are transformed into people,
    animals, or birds. The young man, his sister, and his wife then become red birds
    after he names the Sun as his father. The passage then begins a new section about
    a contest between heavenly and earthly gods, in which animal gods plan a dangerous
    girl, and a hunter is led underground to an animal lodge where the beaver explains
    the plan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man says he is going far away with his forked stick and instructs
    that his wife must remain in the tipi while he is gone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man tells his sister to look toward the dawn each morning; red streaks
    will mean he is dead, while blue streaks will mean he has killed the animal and
    is returning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy travels south, encounters several animal paths running east and west,
    and crosses them rather than following them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the animal’s route, rocks are cut, grass is burned, the ground is red
    and baked-looking, smoke is visible, and the boy climbs a hill where he sees the
    animal coming.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The animal tells the boy to leave because the place belongs to it, and it
    recounts the same story previously told by the girl, including the marriage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy pulls the forked stick from his back; the animal falls, and the boy
    shoots it under the arm and through the body, killing it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dead animal is covered all over with flints resembling fish scales; the
    boy cuts off its paw and ties the paw to the forked stick.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sister sees blue streaks before sunrise and knows that her brother has
    killed the animal and is coming back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote-Man tells the chief that the boy is returning, and the sister tells
    the boy’s wife that she may now leave the tipi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy returns to the village carrying the forked stick with the animal’s
    paw and has Coyote-Man tell the people to come by families the next day to see
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Families pass before the paw and state what they want to be; they become people,
    birds, animals, or other forms according to the wishes or declarations described.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chief and his family remain people; Coyote-Man and his family become coyotes;
    the wife’s people are assigned to become owls, while the wife remains with the
    boy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the transformations, the monster is said to be totally destroyed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boy tells his sister and wife to go with him to the timber, says his father
    is the Sun, and says they will be red.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'After the boy says “Sun,” he and the two girls become birds: the boy bird
    is very red with two black streaks from the eyes, and the girl birds are brown
    with the same black streaks; they fly to the timber.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The next section’s summary states that animal gods make a beautiful but dangerous
    woman to destroy mankind, that her suitors perish in required tasks, and that
    a poor boy aided by Morning-Star and a helpful animal saves the human race by
    removing her evil qualities.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: At the beginning of the new narrative, a childless married hunter meets a
    mysterious being while hunting, is led underground, and sees that he is in a lodge
    of the animals.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: In the underground animal lodge, the beaver says the animals will give the
    man a girl with power so that people will get into trouble and die, and that men
    killed by the woman will be given to the animals to devour.
  category: speech
  evidence_refs:
  - ev:10
