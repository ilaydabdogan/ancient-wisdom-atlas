canonical_text:
  quote: ''
  summary: The passage first describes an unnamed man meeting a scalped mysterious
    being associated with buffalo power. The man serves him, learns secrets about
    herbs and roots, receives a bundle, returns home, and sponsors a Buffalo Medicine-Men’s-Lodge
    dance centered on a buffalo skull, smoke offerings, and later successful war parties.
    The passage then transitions to the beginning of a separate account, summarizing
    a turkey medicine-man in turkey shape and describing animal-taught witchcraft
    involving feathers, owl claws, and mescal beans found in victims’ bodies, followed
    by the setup of a chief’s family and a son who postpones marriage until he can
    kill buffalo and support a wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mysterious being is described as scalped, with loosened skin that falls
    over his eyes unless he holds up his eyebrows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mysterious being says he was scalped in battle but not killed and did
    not return home because people would fear him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mysterious being says a buffalo recognized his spirit, that he belongs
    to the buffalo family, and that he stayed with the buffalo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The buffalo is said to have given the scalped-man powers before dying and
    to have instructed him to bring its skull to the place where its spirit would
    remain present.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The scalped-man invites the man to sit, make the place his home, and become
    his son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The man gives buckskin to the scalped-man so that he can tie up his head and
    keep his eyebrows from hanging over his eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The man becomes a servant for the scalped-man, who teaches him secrets about
    herbs and roots and then makes a bundle for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: After returning home, the man gives the Buffalo Medicine-Men’s-Lodge dance,
    where great power is said to be manifested.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the dance, presents are given to medicine-men, and new cloth is placed
    under the buffalo skull at the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the dancing, smoke offerings are made with pipes filled with native
    tobacco to the skull and to the scalped-man in the southern land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: War leaders who had given presents to the skull and scalped-man organize parties
    and travel in several directions toward named enemy regions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The war parties return with many ponies, and one party takes all the ponies
    from a Ponca camp between morning and noon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The victorious leader offers hair from a horse’s mane to Tirawa, and his name
    is changed to Sakruikarikat, Half-Day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: After the raiders return with many ponies, people think the buffalo skull
    has great powers.
  category: other
  evidence_refs:
  - ev:4
- id: obs:15
  text: A transitional summary says a turkey medicine-man in turkey shape obtains
    organs from a grave, reveals accomplices, and that their bundles contain objects
    from graves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The passage says that when people learned animal mysteries, they also learned
    witchcraft from animals.
  category: other
  evidence_refs:
  - ev:6
- id: obs:17
  text: Woodpecker and yellowhammer feathers are described as objects blown toward
    victims so that they enter the body and may be found in the heart.
  category: object
  evidence_refs:
  - ev:6
- id: obs:18
  text: Turkey wing feathers are described as used in bewitching, while horned owl
    claws are said to be found in victims’ kidneys.
  category: object
  evidence_refs:
  - ev:6
- id: obs:19
  text: Mescal beans are described as lodged in the duct from the bladder, preventing
    urination and causing death by witchcraft.
  category: object
  evidence_refs:
  - ev:6
- id: obs:20
  text: The passage says these witchcraft methods were secret among magicians and
    that many people were killed by those possessing such powers.
  category: other
  evidence_refs:
  - ev:6
- id: obs:21
  text: People suspect certain persons of witchcraft but do not speak openly because
    they are not sure.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:22
  text: A brave and distinguished young man becomes chief, has one son and two daughters,
