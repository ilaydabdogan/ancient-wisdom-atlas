candidate_motifs:
- id: motif:1
  label: Initiation through service to a medicine-teacher
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The man serves the scalped-man, receives secret knowledge about herbs and
    roots, obtains a bundle, and returns home to sponsor a ritual dance.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not use a formal term equivalent to initiation; the motif
    label is inferred from the described sequence of service, teaching, bundle receipt,
    and return.
- id: motif:2
  label: Animal-granted medicine power mediated by skull and bundle
  taxonomy_refs:
  - wisdom
  basis: The scalped-man’s power comes from a buffalo, the buffalo skull is kept as
    the locus of the buffalo spirit, and the man receives a bundle after learning
    secrets.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The relation between buffalo power, the skull, and the later bundle is
    narrated but not systematized in the passage.
- id: motif:3
  label: Ritual offering to a powerful skull and absent spirit
  taxonomy_refs:
  - sacred_exchange
  basis: Presents, new cloth, pipes, tobacco, and smoke offerings are directed to
    the buffalo skull and to the scalped-man; later war leaders who had given presents
    return with ponies, and people attribute great power to the skull.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage reports the sequence and the people’s conclusion about the
    skull’s power; it does not state a precise contractual exchange.
- id: motif:4
  label: Victory offering and new name after a successful raid
  taxonomy_refs:
  - sacred_exchange
  basis: A leader returns from a successful raid, offers horse mane hair to Tirawa,
    and receives the name Sakruikarikat, Half-Day.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is broad; the passage gives the rite and naming
    outcome but little explanation of its wider ritual logic.
- id: motif:5
  label: Medicine-man in animal shape obtaining grave materials
  taxonomy_refs:
  - shapeshifter
  basis: The section summary states that a turkey medicine-man, in turkey shape, obtains
    organs from a victim’s grave and is later forced to reveal accomplices.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This information appears in a transitional section summary rather than
    in the fully narrated portion included here.
- id: motif:6
  label: Intrusive-object witchcraft lodged in organs
  taxonomy_refs: []
  basis: Feathers, owl claws, and mescal beans are described as entering or lodging
    in victims’ hearts, kidneys, or urinary duct and causing death by witchcraft.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy reference directly matches this specific witchcraft-by-intrusive-object
    pattern.
- id: motif:7
  label: Secret animal-taught dangerous knowledge
  taxonomy_refs:
  - wisdom
  - forbidden_knowledge
  basis: The passage says people learned witchcraft from animals and that the most
    powerful methods were kept secret among magicians.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage calls the knowledge secret and lethal, but not explicitly
    forbidden; the taxonomy reference to forbidden knowledge is therefore tentative.
