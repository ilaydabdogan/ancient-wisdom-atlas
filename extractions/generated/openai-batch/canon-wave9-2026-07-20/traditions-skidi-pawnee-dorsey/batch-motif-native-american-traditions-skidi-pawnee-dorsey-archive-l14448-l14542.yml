canonical_text:
  quote: ''
  summary: 'Buffalo bulls impose deadly ordeals on a man who is father to a calf-boy:
    first a race against young bulls, then a trampling attack. The man uses an eagle
    feather and survives. The herd then transforms him into a buffalo through breathing,
    rubbing, wallowing, and buffalo-wallow water. As a buffalo he defeats a rival
    bull, rejoins the buffalo cow and calf, and is sent by the old bull leader with
    his wife and child to the human village to request presents. Near the village
    they roll in a wallow and become human again; the man seats the woman and child
    at the lodge altar and obtains jerked meat from the woman for his hungry human
    relatives.'
  language: English
  quote_policy: summarized
