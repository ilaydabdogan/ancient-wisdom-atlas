canonical_text:
  quote: ''
  summary: A girl and boy flee from the animated head of their mother, which threatens
    to kill them. Apparent supernatural aid places obstacles between the children
    and the pursuing head. At a pond, two long-legged cranes form a bridge with their
    bodies and then drown the head. The birds promise continuing spiritual aid, and
    the children return to the village and enter a lodge.
