canonical_text:
  quote: ''
  summary: A young chief, angered that the people broke camp against his command,
    recounts that Tirawa gave him a mysterious horse that made him chief and protected
    him. He says he and the horse will disappear, the horse will return to rock, and
    he himself will become stone yet help the people if addressed. A ray of light
    covers him and he turns to stone. The stone-man is later petitioned with gifts,
    smoke, and war requests, assists warriors, helps a captured Pawnee woman escape
    from a Comanche camp, is moved and hidden, and is repeatedly stolen among tribes
    until it is said to be in the southwest. The passage then begins the next tale,
    'The Boy and the Horse,' summarizing a poor boy who pities eaglets and receives
    a celestial horse from an eagle, and describing the poor boy and his grandmother
    before he sees people shooting at an eagle nest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people broke camp on the same day although the young man had decided they
    should break camp the next day, and his wife reported this to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man sat in the lodge north of the fireplace and recounted that he
    had been born poor, that Tirawa had given him a horse, and that through the horse
    he had become chief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He said that because the people had broken his command, he and his horse would
    disappear, and that the horse would return to its place of origin and be turned
    again into rock.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: He said that the horse had spoken to him and breathed on him so that arrows
    could not go through him when he attacked enemies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He said he was turning into stone and asked to be placed in a hidden place
    where people could tell him their concerns and receive help if he could give it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A ray of light moved over his feet, body, neck, face, and head, and he was
    turned into stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The woman reported the transformation; the people came back, mourned, and
    set the stone out on the prairie.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Warriors later came to the stone, gave presents, stated their desired scalps
    and ponies, and received what they asked for.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In sacred bundle ceremonies, while smoking, people gave whiffs to heavenly
    deities and added a whiff to this god in the southwest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A captured Pawnee woman prayed to the stone-man for help in escaping from
    a Comanche war-party.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At midnight the stone-man made the warriors sleep soundly and woke the woman,
    who escaped on the chief's swiftest horse and returned to her people.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The captured woman's brothers later found the stone-man, asked it to make
    itself light, moved and hid it, gave presents and smoke, captured many ponies,
    and one leader left a pony as a gift for the stone-man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Different tribes or Indians repeatedly found, hid, stole, and relocated the
    stone, and it was finally said to be somewhere in the southwest.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:14
  text: The next tale's synopsis says that a boy pities eaglets and receives a celestial
    horse from an eagle in return; the horse first appears infirm but becomes a fine
    steed, helps the boy perform feats, and the boy is eventually recognized and becomes
    a chief.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The beginning of the next tale describes a poor old woman and her grandson
    living in a little tipi on the east side of the village and eating discarded moccasin-soles
    and sinews.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: The boy stayed behind after camp moved, ate discarded soles and sinews, then
    saw people shooting arrows at a nest containing young eagles; the arrows did not
    harm the eagles because the nest was strongly built.
  category: sequence
  evidence_refs:
  - ev:12
