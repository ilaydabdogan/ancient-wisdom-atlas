canonical_text:
  quote: ''
  summary: The passage begins with a brief ritual-bundle fragment in which priests
    place a buffalo scalp on a bundle representing the Great-Black-Meteoric-Star.
    It then introduces and begins the story of a hunter who, after moving away from
    the village with his wife and two children, murders his wife, roasts her flesh,
    deceives the children into eating it as deer meat, and abandons them. The supplied
    synopsis states that the children are later pursued by the murdered woman's head,
    rescued by gods and birds, adopted and deserted, live by agriculture, teach the
    returning people to till the soil, and that the cannibalistic father is put to
    death.
  language: English
  quote_policy: summarized
