  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the boy has grown, the men give him an old black bow made from hedge
    wood and arrows; he hunts birds and hangs their skins in the cave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men explain that they brought the boy to save his people from the bull,
    which lives underground and draws people down with its breath.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The men instruct the boy to shoot the bull in the white spot on its forehead;
    if he misses, the bull will capture them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bull emerges from the ground, and the boy shoots the white spot on its
    forehead, killing it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The boy is tied with a lariat rope and lowered into the bull's place, where
    he finds a heavy old war-club with a sharp edge.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The boy uses the war-club to kill the two men as they descend through the
    hole after him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy finds a young girl in another cave and tells her he has killed Young-Bull-with-White-Spot-on-Forehead.
