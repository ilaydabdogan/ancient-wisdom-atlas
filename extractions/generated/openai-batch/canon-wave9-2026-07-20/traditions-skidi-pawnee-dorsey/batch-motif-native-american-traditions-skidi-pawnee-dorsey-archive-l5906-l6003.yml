  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The second chief's son loses arrows while shooting at a bird, sees a hand
    holding the arrows in a hollow, jumps at the hand, and falls into an underground
    world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wonderful men in the under-world say they brought the boy there and give his
    arrows back to him.
  category: speech
  evidence_refs:
  - ev:5
