  quote: ''
  summary: The passage tells of a chief's son who falls into an under-world, lives
    among wonderful beings, receives powerful weapons, kills a subterranean buffalo
    bull marked by a white spot, enters the bull's cave, finds a missing young woman,
    and obtains objects connected with the bull's power and with future needs.
