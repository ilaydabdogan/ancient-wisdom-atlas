canonical_text:
  quote: ''
  summary: A chief's son who avoids women is drawn by the flute of a deer-girl who
    has taken human form. He brings her home, she bears a son, and later leads him
    toward her deer people, where she and the child appear as a deer and fawn. The
    deer people receive them, and gathered animals decide to give the man their powers,
    including a cedar whistle or flute. The passage synopsis also states that the
    wider tale includes a buffalo-wife, rivalry between animal wives and peoples,
    and animal-affiliated children.
  language: English
  quote_policy: summarized
