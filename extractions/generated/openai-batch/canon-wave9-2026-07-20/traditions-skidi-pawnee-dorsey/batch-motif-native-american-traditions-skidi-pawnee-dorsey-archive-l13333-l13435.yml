canonical_text:
  quote: So it is that people must plan some way to make their living.
  summary: 'The passage includes a Coyote episode in which he uses a planted buffalo
    horn and song to make turkeys dance before killing some of them. It then gives
    the tale of Coyote, Cougar, and Fox: Coyote sees Cougar''s meat, dresses as a
    woman, straps Fox to a baby-board, and presents Fox as Cougar''s hungry son. Cougar
    feeds them and later gives Coyote a meat-filled parfleche. Fox threatens to reveal
    Coyote''s identity and later, after Coyote tries to drown him to keep him silent,
    escapes and tells the old woman, who drives both away. A final heading-summary
    begins the next tale, saying Coyote learns food-making from Beaver, misapplies
    it, and dies.'
  language: English, with one Latin sentence
  quote_policy: quoted
