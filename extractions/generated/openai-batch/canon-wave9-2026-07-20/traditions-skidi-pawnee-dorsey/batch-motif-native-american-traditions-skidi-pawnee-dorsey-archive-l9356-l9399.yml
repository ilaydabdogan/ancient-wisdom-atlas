canonical_text:
  quote: ''
  summary: A young man has an old man announce a buffalo attack after a period of
    scarcity. He leads the people to a ravine, calls buffalo there for them to kill,
    and the village gains abundant meat. The people choose him as chief, but he delays
    acceptance until the chief’s pregnant daughter gives birth and Crow-Feathers’
    animal nature is revealed through seven coyote offspring. After the coyotes are
    killed, the young man becomes chief and sometimes calls buffalo when the people
    are starving. The passage ends by stating that the story explains why the people
    were to have wonderful men able to call buffalo for food.
  language: English
  quote_policy: summarized
