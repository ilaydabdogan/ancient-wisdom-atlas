canonical_text:
  quote: ''
  summary: Scabby-Bull follows a deer on an island into a cave-like place and is taken
    into a lodge near the one where his boy friend had been taken. Deer and eagle
    families teach him animal mysteries, roots, herbs, and songs; the deer sometimes
    becomes a woman. The two boys return home but repeatedly go back to the island
    and later practice sleight-of-hand powers. When grown, Scabby-Bull’s friend is
    wounded in battle, demonstrates a cob-to-mouse transformation, transfers his medicine
    bags and secrets to Scabby-Bull, and dies. Scabby-Bull then enters the medicine
    lodge and is recognized as a powerful medicine-man, making his lodge with cottonwood
    and willow from the cedar-tree to the big lodge, with downy feathers at the cedar
    base.
  language: English
  quote_policy: summarized
