canonical_text:
  quote: ''
  summary: Buffalo play with sticks and a ring while Coyote sits near the playing
    ground. Coyote addresses the ring as his granddaughter, takes it in his mouth,
    and flees. The ring is passed among badger, fox, crow, hawk, and rusty-blackbird
    while buffalo pursue. Near the boys' lodge, the boys prepare arrows and shoot
    many buffalo. The ring disappears, the buffalo leave, and the boys find their
    sister in the lodge, now a girl again. The blackbird then seeks Coyote, who remains
    in the first badger hole.
  language: English
  quote_policy: summarized
