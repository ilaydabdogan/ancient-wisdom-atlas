canonical_text:
  quote: ''
  summary: The passage describes a ritual with roads made to different directions,
    war trophies and implements displayed, and warriors dancing as if attacking enemies.
    Four young people meet repeatedly at ceremonies and dances. Two young men court
    two young women by inviting them to their tipis and speaking of their food. One
    young man rejects a piece of meat that is not the dried tongue he claimed to eat,
    and the young woman retrieves it. A war-party later departs under four leaders.
    The girls prepare food, follow the boys to the war-party to see which is braver,
    and are placed under the leaders' protection. The boys, named White and Black
    as a pair, scout ahead for many days until provisions run out; Black then asks
    that the girls be summoned because women are said to save food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man again made roads to different directions for the sake of the warriors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Scalps, shields, and lances were brought out and put on while the man danced;
    warriors followed, raised their hands as if striking an enemy, and made noise
    to frighten enemies.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Four young people met and talked during the ceremony over several days; the
    boys invited the girls to their homes, but the girls refused.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before separating, the young men told the girls that their uncles were about
    to lead a war-party and that they had decided to join.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young people met again at a bear dance and later at a medicine-men's dance;
    the passage states that the chief's boy and the chief's daughter loved each other.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the medicine-men's dance, the chief's son invited the chief's daughter
    to his tipi, and the brave's son invited the brave's daughter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chief's son said his mother always had the best dried buffalo meat; the
    other young man said he ate only dried buffalo tongue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the second young man's tipi, his mother handed him something shaped like
    a tongue; he identified it as a piece from the flank, rejected it, and threw it
    out, where the girl picked it up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Warriors prepared to go out; wives were told to make moccasins and fill them
    with pounded corn and meat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The war-party started about four o'clock in the morning with four leaders,
    including uncles of the two young men and of the girls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Each girl made a rawhide bag filled with choice pemmican, and the brave's
    daughter put the discarded piece of meat into her bag.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The girls decided to follow the war-party to see which of the boys was braver.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The main body stopped at a timbered stream, made fires, and cooked meals.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The two boys, named White and Black in the passage, arrived after the main
    party and were seated next to the leaders on the south side, though they had never
    before been on the warpath.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Scouts reported two incoming figures, found they were girls, and brought them
    to the leaders; the girls said they had followed the young men.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The leaders tried to send the girls home, but when they refused, the girls
    were seated in front of the leaders under their protection.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Each morning the boys rose before anyone else and scouted the country; this
    continued for many days and moons without sighting enemies.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: During the scouting period the young men did not talk with the girls, and
    the girls slept between the leaders.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: When food in the moccasins gave out, the young men and others showed hunger;
    the leaders stopped in thickly timbered grass country and sent out hunters.
  category: sequence
  evidence_refs:
  - ev:12
