canonical_text:
  quote: ''
  summary: A girl and boy arrive hungry and sore at an old couple's tipi and recount
    their father's murder of their mother, the pursuing head of their mother, and
    their rescue by cranes at a pond. Man-with-Bloody-Horn shelters them, accepts
    adoptive kinship terms, helps make them a grass lodge, and gives tools, corn,
    and seeds from his sacred bundle. The tribe moves on to hunt; the children remain
    behind, plant a garden, gather leftover corn, and the boy begins hunting small
    game while the girl prepares food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl and boy arrive at the man's tipi, are invited in, and are treated
    as hungry, sore, pitiable children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children report that their father murdered their mother, took part of
    her flesh home, and gave it to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children report finding their mother's head in a tree crotch and being
    pursued by it through mysterious places where it met obstacles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The children report that two long-legged cranes crossed themselves over a
    pond so the children could pass, then separated so the pursuing head drowned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old man identifies himself as Man-with-Bloody-Horn, a soldier for the
    tribe, and says he will help the children make a small tipi in the timber until
    the people return from hunting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The children ask that their father be killed after they see him once more,
    and they ask to call the old man grandfather, his wife grandmother, and his girls
    mother; the old man agrees.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: People make a warm grass lodge for the children in thick timber, and Man-with-Bloody-Horn
    gives them tools, corn, and seeds taken from his sacred bundle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The old man and his family leave for the new village and explain to the people
    why they had stayed behind with the children.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people go on a hunt and the buffalo seem to have disappeared; the children
    had said that their father's luck in killing animals would be stopped.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The girl, with help from the boy, works every day making a garden and plants
    the corn and other seeds in springtime.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When corn is nearly gone, the boy asks the girl to make him a bow and arrows;
    he hunts while she gathers leftover corn from the village, pounds it, and makes
    mush.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The boy kills rabbits, the girl thanks him and says he is learning to kill
    game, and the siblings continue living by his hunting and her gathering corn.
  category: sequence
  evidence_refs:
  - ev:12
