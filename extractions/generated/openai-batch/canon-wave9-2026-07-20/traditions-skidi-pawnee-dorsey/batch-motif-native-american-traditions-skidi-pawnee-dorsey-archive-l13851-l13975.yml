canonical_text:
  quote: ''
  summary: The passage contains adjacent animal tales. In one, Awl wounds an old woman
    and Turtle tricks people into throwing him into water, where he reveals water
    is his home. In another, Buffalo and Deer dispute their usefulness and holiness
    to people, ending with an explanation for buffalo abundance and hunting. In a
    third, Rabbit boasts to a girl that he rides Fox, then tricks Fox into carrying
    him, after which both are refused by the girl and Fox becomes afraid of people.
  language: English
  quote_policy: summarized
