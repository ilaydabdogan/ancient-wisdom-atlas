canonical_text:
  quote: ''
  summary: The passage describes burial goods for a chief's son, mourning practices
    and a communal rite ending mourning, explanatory notes on Skidi Spirit Land, afterlife
    villages and buffalo hunting, the skunk's relation to Spirit Land, rainbows, and
    restoring life, comments on Tirawa, lightning, burial with tipi belongings, scalped-men
    revived through a warrior bundle, sacred ointment, and an editorial note citing
    related tales in other traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's son, when dead, was buried in a sort of house, with the chief's
    war ornaments at the head of the grave and calumet pipe sticks placed on the grave
    if the chief had them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mourners for relations wandered for many months and increased their pain by
    gashing legs, arms, and hands with a knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mourner wore old clothes, did not wash, and looked unkempt.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sympathizing man had his wife boil dried buffalo meat and invited the mourner
    and other friends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sympathizer gave the mourner water in a wooden bowl and asked him to wash
    his face when entering the lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After speeches and a communal meal, the mourner put aside mourning clothes,
    put on clean clothes, and ceased mourning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The note gives Dekatgaru as an old term for Spirit Land and relates it to
    terms for spirit and for a dead person in skeleton form.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people are said to believe that the dead take all their belongings to
    Spirit Land and enjoy life there as the living do.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Spirit Land, people ride ponies, hunt buffalo, and arrange the buffalo
    hide and fat so that the buffalo becomes alive again and returns to the land of
    buffalo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dead are described as happy and without sickness, and each family has
    its own village in Spirit Land.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that, besides buffalo, the skunk is the only animal said
    to be able to go to Spirit Land, and that the skunk helped one man get his wife
    back from Spirit Land.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The skunk is said to make rainbows by its sprays in the night, as imitations
    of the rainbows of Spirit Land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The note says not all Skidi agree that Tirawa is the golden eagle, and explains
    that a fire mentioned in the tale refers to lightning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: A burial form for a girl involved abandoning a tipi and its belongings for
    her, with the supposition that she would take their spirits to Spirit Land.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The narrator says the skunk is the only animal with power to restore life
    after death, calls it a waruxti animal, and connects it with rainbow production.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: Scalped-men were believed to have been scalped and slain and to have returned
    to life through a warrior bundle in their possession.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Scalped-men are described as having a filmy existence in remote and inaccessible
    places, communicating directly with animals, and sometimes exerting harmful influence.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: The sacred ointment was made from the fat of a buffalo dedicated to Tirawa,
    mixed with red clay.
  category: object
  evidence_refs:
  - ev:13
- id: obs:19
  text: An editorial note says one extended tale is a favorite among Plains tribes
    and cites versions or parallels in several named traditions or collections.
  category: other
  evidence_refs:
  - ev:14
