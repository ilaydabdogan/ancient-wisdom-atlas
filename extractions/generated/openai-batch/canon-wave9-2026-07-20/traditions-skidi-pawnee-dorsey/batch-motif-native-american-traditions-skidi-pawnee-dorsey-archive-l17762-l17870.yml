canonical_text:
  quote: ''
  summary: Editorial notes explain ceremonial booths representing animal underground
    lodges, a request to become a medicine-man’s pupil, comparative tale references,
    and a long statement of current Skidi beliefs about Coyote/Coyote-Man as lucky,
    cunning, sometimes man-shaped in story, favored by gods, associated with buffalo,
    prayer, warfare concealment, and widespread trick tales. Additional notes mention
    magical animal killing, emblems of chief and priest, origins of the ring-and-javelin
    game, badger rescue parallels, rolling-stone and knife variants, bull-bat sound
    explanation, and variant endings.
  language: English
  quote_policy: summarized
