  claim: The editor states that the tale connected with note 249 contains elements
    also told as individual tales and directs comparison to Nos. 67, 68, 45, and Kroeber’s
    Cheyenne material.
  claim_level: same_motif
  target: Traditions of the Skidi Pawnee Nos. 67, 68, 45; Kroeber, Cheyenne, pp. 166-167
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not specify which elements correspond, so the comparison
    must remain general.
- id: claim:2
  claim: The editor points to a similar killing of animals through magic elsewhere
    in the notes.
  claim_level: same_motif
  target: Note 145 in the same work
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The present passage gives no details of either killing episode beyond
    the motif label.
