canonical_text:
  quote: ''
  summary: A young man is ritually prepared by priests for a buffalo hunt, kills a
    buffalo with a sacred black arrow, marks other buffalo as holy, brings meat to
    the priests, and participates in offerings involving the skull bundle, songs,
    heart, tongue, fire, tobacco, and the four directions. He then proposes a larger
    ceremony in which all sacred bundles are to be gathered, with the skull bundle
    leading.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bands come together at the time of a hunt, go south, and find many buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man goes to the priests’ lodge, where his pony and body are anointed
    with red ointment, feathers are added, and he receives a bow and four black-painted
    arrows from a bundle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hunting party understands that the young man intends to make a buffalo
    holy; success with one arrow is described as a sign that he is favored by Tirawa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man rides ahead, shoots a young buffalo cow under the shoulder,
    and the buffalo dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man lays black arrows on the fattest dead buffalo he finds, thereby
    marking those buffalo as holy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He skins and cuts up his own buffalo with a flint knife from the priests,
    loads the meat on his pony in a displayed arrangement, and brings it to the priests’
    lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priests take down the skull bundle, place the skull on the bow and arrows
    west of the fireplace, seat the young man by the entrance because this is his
    first killing and offering, and sing bundle songs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During songs, the young man removes his feathers and lays them before the
    skull; later he cuts out the buffalo tongue and heart and gives them to the high
    priest, who joins them with a sharp stick.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Four large cottonwood logs are laid in the fireplace in the north, south,
    east, and west, and dry willows are kindled at the center.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young man carries the heart and tongue around the fireplace by way of
    the north, east, south, and west, faces east, lifts the organs toward the heavens,
    lowers them, and lays them on the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man receives a pipe filled with native tobacco, does not light it,
    and pours the tobacco on the offering before returning to the tipi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young man says he intends to hold a ceremony bringing all sacred bundles
    together with the skull bundle leading; meat is dried, the hunt continues, and
    preparations are made for the ceremony.
  category: speech
  evidence_refs:
  - ev:9
