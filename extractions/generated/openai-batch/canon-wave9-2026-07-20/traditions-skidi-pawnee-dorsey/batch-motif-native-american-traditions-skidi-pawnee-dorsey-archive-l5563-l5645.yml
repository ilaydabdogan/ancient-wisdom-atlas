canonical_text:
  quote: ''
  summary: 'A poor youth is taught by thorn-weed beings and given a dry thistle. He
    returns to his sister, then leads war parties whose enemies die with thistles
    in their swollen throats. After gaining renown and marrying, he is summoned by
    a girl to supernatural challengers: first a round stone that pursues him until
    he turns into a thistle and the stone breaks in water, and then a large snake
    emerging from a dark hillside hole that compels him into its den and begins swallowing
    him while the thistles prepare to help.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several white-covered beings with bluish hair address the boy as son, identify
    themselves as thorn-weeds rather than people, teach him how to kill disliked people,
    and give him a dry thistle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy returns to his sister's tipi, touches her bed, is recognized by touch
    after initial doubt, and his sister makes a fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy tells his sister he cannot stay because he must go on the warpath
    and wants to become somebody through bravery, battle deeds, and capturing ponies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth tells a friendly man he intends to go on the warpath to kill people,
    gathers young men who agree to follow him, and tells his sister he is going to
    take ponies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The war party finds two tipis, surrounds one, and after the youth makes hand
    motions and gives a war-whoop, the occupants stagger out and several women are
    captured.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The next morning the dead men are found not to have been shot; their throats
    are swollen, and thistles are found inside a cut-open throat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Scalps are taken, ponies are divided, women are taken, but the youth does
    not take a woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the youth returns, the people give dances and make songs about him;
    he repeatedly leads war parties and returns with scalps and ponies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The youth stops going on the warpath, refuses marriage for a time because
    he cares for his sister more than anyone else, and finally marries a poor girl
    after his sister begs him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young girl summons the youth to her grandfather; at the destination a large
    round stone speaks to him, says it has heard of his powers, and says it will kill
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: As the stone pursues the youth, the thistles know what is happening, make
    a hard wind blow, and the youth runs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The youth jumps from a hill, turns into a thistle, is blown across a creek,
    and the pursuing stone breaks in the water; the passage explains this as why broken
    stone is found in stream beds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The same girl later summons the youth again, saying her grandfather dwells
    on the side of a hill; a dark hole in the hillside emits dust that is revealed
    to be a large snake.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The snake asks for the youth, invites him into its lodge, and the youth feels
    an irresistible sensation causing him to enter the den.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The snake tells the youth to lie face and belly to the ground with his legs
    together; the thistles prepare to help, and the snake begins swallowing him from
    feet to body and head.
  category: sequence
  evidence_refs:
  - ev:10
