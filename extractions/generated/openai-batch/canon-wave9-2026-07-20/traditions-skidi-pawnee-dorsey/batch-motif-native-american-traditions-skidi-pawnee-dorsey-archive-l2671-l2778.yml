canonical_text:
  quote: ''
  summary: A brief closing fragment says girls who had not known an old woman's actions
    were married into the four Pawnee tribal divisions so that each band had seeds.
    The following Skidi Pawnee tradition, introduced as 'The God-of-Wind,' describes
    famine during a buffalo hunt. A quiet boy considered foolish produces meat for
    children, makes a mud calf, and causes it to become a living buffalo calf. The
    calf appears on a hill and brings buffalo, enabling repeated hunts and food abundance.
    A starving man from another Platte River village finds the well-supplied Loup
    River camp, is fed, and reports his people's hunger; the camp then travels south
    to relieve them. The section synopsis also states that the boy later performs
    a ceremony for another village, that buffalo killed by unbelievers become coyotes,
    and that the boy vanishes and becomes the Wind-God in the north.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A closing fragment states that girls who had not known the old woman's doings
    were married into the four tribes, resulting in each Pawnee band having seeds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The section synopsis identifies the story as concerning an apparently foolish
    but wonderful boy who brings buffalo in a time of hunger and later becomes the
    Wind-God in the north.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The detailed narrative begins with the Skidi Pawnee on the Platte River starting
    a buffalo hunt, with most following the Platte River and three tipis going up
    the Loup River.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Loup River group traveled many days without seeing buffalo and became
    hungry as their corn and squash nearly ran out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A quiet boy, considered foolish because he had once been lost in a snowstorm,
    drew meat from under a mat near the fireplace and had his mother roast it for
    crying children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy dug mud, made a mud calf, placed it west of the tipi, lay down, tapped
    the tipi, and the mud calf became a running buffalo calf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy told people not to kill the calf when it appeared on a high hill because
    it was his made calf and was meant to bring buffalo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man told to watch toward the hill could not at first see anything, but after
    the boy spoke to him, he saw the calf on top of the hill facing east.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy said the calf had brought buffalo; the people found buffalo sitting
    in a hollow, attacked them on foot, killed and skinned them, and brought the meat
    home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Buffalo hunts recur: on later occasions the calf appears again, buffalo are
    killed, women process hides, robes, bones, and tallow, and by the fourth occurrence
    buffalo are numerous with the calf in the lead.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Another village on the Platte River was starving, with scouts finding no buffalo
    or other game and children and old women crying from hunger.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: A nearly starved man traveled north to the Loup River camp, was fed, learned
    of the boy and the mud calf, and reported that his own people were starving.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Loup River camp broke camp and traveled south to relieve the other village
    with meat, but the food was still not enough and children continued crying.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The section synopsis states that, at a later point in the story, buffalo killed
    by unbelievers change into coyotes after the boy performs a successful ceremony
    for another village.
  category: sequence
  evidence_refs:
  - ev:2
