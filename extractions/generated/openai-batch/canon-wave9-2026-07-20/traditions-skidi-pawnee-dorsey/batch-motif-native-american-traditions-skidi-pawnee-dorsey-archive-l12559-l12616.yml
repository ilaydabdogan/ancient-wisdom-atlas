canonical_text:
  quote: ''
  summary: Coyote puts on ritual-looking items, dances into a village, and is carried
    into a lodge where a wounded boy is placed beside him. After telling the people
    to withdraw, Coyote is left alone with the boy, reopens the nearly healed wound
    with a sharpened stick, kills him, cuts him up, boils him, and eats him. A little
    snake enters; Coyote gives it human flesh that chokes it. The snake reaches the
    people and whispers that the boy has been killed. The people find the boy's bones
    and realize the visitor was not the real medicine-man but Crow-Feathers, Coyote.
  language: English
  quote_policy: summarized
