  quote: ''
  summary: The passage closes one boy-hero episode in which a young warrior kills
    a turtle-powered enemy, is chosen chief, and learns through dreams that his pony
    has returned to mud while its colt will succeed it and Mother-Earth remains the
    source of his power. It then begins “The Boy and the Horse,” where an orphan boy,
    neglected during migrations and famine, receives dream instructions to pull a
    black lariat from a stone bank and obtains a wonderful horse that disguises itself
    as an old, worthless animal.
