  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man says he is a medicine-man going to a southern village to cure a wounded
    young man whose father is chief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The medicine-man describes repeated stops for singing and dancing before being
    carried into the chief's tipi on a blanket and set west of the fireplace.
  category: sequence
  evidence_refs:
  - ev:7
