canonical_text:
  quote: ''
  summary: Coyote kills and butchers a bear, roasts and packs the meat, is trapped
    when two rubbing elm trees catch his hand, loses the meat to a pack of coyotes,
    and later meets a medicine-man with ritual implements and a medicine bundle. After
    learning the medicine-man's song and dance for a healing ceremony, Coyote kills
    him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote drives a spiked arrow into a hole in the bear's back several times
    and kills the bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote skins and cuts up the bear, gathers dry wood, makes a large fire, roasts
    meat, and prepares meat to carry home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two elm trees rub against one another in the wind and make a squeaking noise
    that frightens Coyote.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coyote threatens the trees, climbs up, puts his hand where the limbs rub,
    and his hand is caught when the trees come together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While Coyote is held fast, a pack of coyotes comes, finds the meat, eats and
    carries off what he had prepared.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the coyotes leave, the trees part and release Coyote; he scrapes grease
