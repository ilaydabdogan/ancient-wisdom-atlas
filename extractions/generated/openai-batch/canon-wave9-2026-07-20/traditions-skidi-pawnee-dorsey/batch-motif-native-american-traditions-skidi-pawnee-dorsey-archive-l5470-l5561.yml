canonical_text:
  quote: ''
  summary: 'The passage closes a rat-power narrative: a boy feeds mice and rats with
    dried meat and fat, receives power from them, uses rat assistance to capture ponies
    and defeat enemies by having bowstrings gnawed, later loses further instruction
    after the old rat is killed, becomes a priest, dies, and the rat power ends. The
    supplied text then begins another narrative, “The Boy and the Thistles,” introducing
    poor orphan siblings; the boy dedicates himself to the Sun or any willing god,
    wanders to water and a mound, sleeps, and wakes in a village of strange white-painted,
    sharp-elbowed people.'
  language: English
  quote_policy: summarized
