canonical_text:
  quote: ''
  summary: 'The passage first reports a transfer of Bear-Man’s bear-songs, secrets,
    and sleight-of-hand performances to Scout’s father after gifts are given. It then
    begins the tale of The Bear Medicine: a boastful young Pawnee man accompanies
    his warrior brother’s war-party, enters a bear den, kills a grizzly bear, skins
    it with claws and head left on, carries and softens the robe, and later survives
    an enemy attack while wearing it. He joins another surviving fighter marked with
    white clay, a whistle, and down feathers; both escape, while other fugitives hide
    in timber and make a fire.'
  language: English
  quote_policy: summarized
