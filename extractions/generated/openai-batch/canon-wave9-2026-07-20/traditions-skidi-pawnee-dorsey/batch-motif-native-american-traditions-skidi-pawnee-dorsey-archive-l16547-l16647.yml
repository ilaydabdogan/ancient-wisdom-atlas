  text: The beaver is described as the leading medicine-man in an animal lodge regarded
    as a lodge of medicine-men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cedar is said to be held in peculiar regard, and a Pawnee story is noted
    in which a cedar-tree turns into a woman, really a female bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Spirits of dead people are described as assisting otherworldly powers under
    the control of an animal lodge to prevent a girl from falling into the hands of
    men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A human sacrifice is described as being offered to Morning-Star.
  category: action
  evidence_refs:
  - ev:6
