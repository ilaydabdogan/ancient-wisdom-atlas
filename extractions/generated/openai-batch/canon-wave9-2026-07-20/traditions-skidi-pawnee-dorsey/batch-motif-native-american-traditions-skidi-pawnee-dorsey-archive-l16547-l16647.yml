  text: Beaver and otter are described as paruxti animals able to exhale magic breath,
    draw blood from a patient, and act as midwives.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Witches called stoo are described as females with animal-derived wonderful
    power, feared because the power is rarely benevolent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Witch-Women are described as drawing people to their lodges to kill them
    and as cannibals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Young men assisted by animals are described as eventually overcoming Witch-Women
    and driving them from the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Spider-Woman is described as a daughter of Sun and Moon, under the Moon’s
    influence, and as a benevolent helper who gives seeds and the lariat rope and
    teaches climbing of mountains and trees.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Spider-Women are described as inhabiting mountain sides and as the source
    of springs with sweet water, where offerings were made to maintain their good-will.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: In a Wichita origin myth summarized in the note, Spider-Woman saves favored
