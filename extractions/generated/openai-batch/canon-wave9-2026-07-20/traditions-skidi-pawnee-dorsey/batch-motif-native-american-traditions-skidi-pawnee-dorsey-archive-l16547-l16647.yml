  quote: ''
  summary: Editorial and ethnographic notes describe an implement, animal medicine
    powers, a cedar-tree transformation tradition, dead spirits assisting otherworldly
    powers, human sacrifice to Morning-Star, Witch-Women, and Spider-Woman traditions.
    The notes also mention related Arapaho, Wichita, Cheyenne, and Blackfeet materials.
  language: English
  quote_policy: summarized
