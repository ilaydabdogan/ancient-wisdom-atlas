canonical_text:
  quote: ''
  summary: The passage describes two cures performed by an unnamed medicine-man, his
    later departure with warriors, and the opening narrative of “The Owl Medicine,”
    in which a young man protects an owl from a swift-hawk and receives night vision,
    instruction, and success in raiding and hunting. The passage ends with a brief
    heading-summary for “The Skeleton Medicine.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman fainted and lay as if dead for a whole day, and several medicine-men
    had been unable to help her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The healer ran around the fireplace, put his mouth on the woman’s head, sucked
    for a long time, was pulled away, and spat out a stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the stone was spat out, the woman opened her eyes briefly; the healer
    ordered her taken to the creek, where she was held under water until she struggled,
    then walked out well.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For another sick woman, the healer said she had the spirit of a horse, used
    a feathered quirt, applied mud mixed with stallion urine to her body and nostrils,
    put on a black lariat rope, whipped her, and she neighed like a horse before recovering
    in a few days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Warriors asked the healer to lead them on the warpath; he went with them and
    did not return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A young man on the warpath became separated from a war-party in misty, thickly
    timbered country, and an owl came inside his robe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The owl asked not to be released and said a warrior with a club was after
    him; the other bird present was the swift-hawk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The swift-hawk asked the young man to surrender the owl and offered war power,
    a war-club, success capturing ponies, scalps, and black lariat ropes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The owl said the swift-hawk was powerful in the daytime but that the owl had
    the advantage at night, and promised the young man power to see at night if saved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young man chose to keep the owl, and the swift-hawk left toward evening.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At night the owl led the young man along a visible path made by the hawk to
    a tree where the hawk sat; the young man could see as clearly as in daylight,
    and the owl killed the hawk.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The owl stayed with the young man in the timber, taught him many things, made
    his eyes able to see at night as well as by day, instructed him about February
    hunting, and led him to an enemy camp where he captured ponies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Afterward the young man led war-parties, captured many ponies at night, hunted
    successfully in February, became a great hunter, and told the story to another
    young man.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The following heading-summary states that one youth overcomes a skeleton and
    receives power and decoration, while another loses courage and dies in battle.
  category: sequence
  evidence_refs:
  - ev:10
