  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The note identifies the object but does not narrate its ritual use here.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the idea of lightning as fertilization with
    Hopi speech about lightning striking a field as the acme of fertilization.
  claim_level: same_function
  target: Hopi lightning-fertilization expression
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note compares a ritual or symbolic idea, not a full narrative sequence.
- id: claim:2
  claim: The passage explicitly contrasts Pawnee bundle fire drills with widespread
    North American fire-theft stories by saying the fire-theft story seems unknown
    to the Pawnee.
  claim_level: same_motif
  target: North American theft-of-fire motif
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: This is a negative comparison reported in a note; it does not establish
    an attested Pawnee fire-theft narrative in this passage.
