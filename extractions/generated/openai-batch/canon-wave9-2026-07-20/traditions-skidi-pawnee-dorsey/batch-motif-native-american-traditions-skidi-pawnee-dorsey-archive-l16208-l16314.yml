canonical_text:
  quote: ''
  summary: The passage describes a marriage-related transfer of horses, robes, medicine-bags,
    a war-bonnet, and a sacred bundle to a daughter-in-law's lodge; reciprocal feasting
    and pony-giving; Black's later household life, refusal of chieftainship, death,
    and burial on a named high hill. The appended notes explain several ceremonial
    and cosmological objects and terms, including Tirawa and the heavens, the gourd
    rattle as a western road and container of priestly spirits, quartz crystal, Four-Direction
    bundle war-clubs, lightning fertilization, fire drills in bundles, and Mother-Corn.
  language: English
  quote_policy: summarized
