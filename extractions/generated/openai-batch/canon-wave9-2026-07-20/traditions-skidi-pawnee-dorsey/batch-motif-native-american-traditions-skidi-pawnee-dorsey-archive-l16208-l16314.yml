candidate_motifs:
- id: motif:1
  label: marriage alliance through sacred-object and gift transfer
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes a ritualized transfer of a sacred bundle and valuable
    goods to the daughter-in-law's lodge, followed by reciprocal pony giving and distribution
    among kin.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The exchange is human and kinship-based; no divine marriage is stated.
- id: motif:2
  label: sacred bundle transferred to daughter-in-law
  taxonomy_refs:
  - sacred_exchange
  basis: The bundle is explicitly said to have to be given over to the daughter-in-law,
    who hangs it above the holy place toward the west.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain the full ritual authority or lineage rules
    of the bundle beyond this transfer.
- id: motif:3
  label: commensality affirming household or alliance
  taxonomy_refs: []
  basis: Black, the girl, and the old man are formally seated and share boiled dried
    buffalo meat and corn after the bundle and gift transfer.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly state the meal's symbolic meaning.
- id: motif:4
  label: ritual object as road to western celestial place and dead priests
  taxonomy_refs:
  - afterlife_journey_map
  basis: A note states that the gourd rattle symbolizes the Evening-Star's garden
    in the west, the road there, and the road to dead priests, whose spirits are represented
    inside it.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This appears in an explanatory note rather than in the narrative action.
- id: motif:5
  label: heavenly contribution to earth formation
  taxonomy_refs: []
  basis: A note explains that a quartz crystal symbolizes the contribution of Tirawa
    and other heavenly gods toward forming the earth.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The note is brief and does not narrate the whole cosmogonic episode.
- id: motif:6
  label: division of the earth with ritual implements
  taxonomy_refs: []
  basis: A note connects wooden war-clubs in Four-Direction bundles with gods dividing
    up the earth and with priestly imitation in Skull-Bundle rites.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The note says the war-club use is figurative and that the gods are supposed
    to have used their hands.
- id: motif:7
  label: lightning as agricultural fertilization
  taxonomy_refs: []
  basis: A note states the idea of fertilization by lightning and gives the example
    of lightning striking a field as fertilizing.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives the idea as a note, not as an episode in the main story.
- id: motif:8
  label: fire drill contained in sacred bundles for sacrifice
  taxonomy_refs:
  - fire
  - sacrifice
  basis: A note says all bundles are supposed to contain a fire drill used at special
    times when scalps are to be sacrificed.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not describe an actual fire-making or sacrifice scene.
- id: motif:9
  label: Mother-Corn kept within sacred bundles
  taxonomy_refs: []
  basis: A note states that a particular ear of corn found only in bundles is called
