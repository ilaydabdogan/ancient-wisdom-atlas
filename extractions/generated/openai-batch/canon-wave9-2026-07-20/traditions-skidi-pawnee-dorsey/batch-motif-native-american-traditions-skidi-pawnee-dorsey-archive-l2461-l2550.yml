canonical_text:
  quote: ''
  summary: Tirawa pities the people and directs the Sun and Moon to send their two
    boys to destroy Spider-Woman, who has withheld seeds and kills men. The boys descend
    from the heavens, are sheltered in the village, grow up, arm themselves, and travel
    north. Spider-Woman sends snakes, mountain lions, and bears against them; the
    older brother kills the leading animals and the rest flee. At Spider-Woman’s lodge,
    the boys are offered human brains and later mock pumpkins containing medicine.
    The older brother uses roots and powdered roots to protect them and make them
    vomit the food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tirawa looks down on the people with pity and commands the Sun and Moon to
    send their two boys to the village to help destroy Spider-Woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider-Woman had received seeds to plant, reap, and divide among the people,
    but instead she stored the seeds in sacks and buried them in holes, keeping them
    for herself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two boys are brought down from the heavens at night and placed on the
    east side of the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A leading man of the village finds the boys, takes them to his lodge, and
    keeps them while they grow into full-grown men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young men ask for bows of hedge and quivers full of arrows before starting
    toward the northern country.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spider-Woman sends snakes to meet the young men; the older brother kills the
    huge rattlesnake at their center, after which the other snakes disappear into
    holes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spider-Woman next sends mountain lions and bears; the older brother kills
    the largest mountain lion and the boys kill the bears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spider-Woman greets the boys as grandsons and orders girls to make fire and
    cook food for them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inside the lodge, the boys see human heads, and the older brother tells the
    younger that the food offered to them is human brains.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Spider-Woman thinks that she will take off the boys’ heads, keep the heads
    in the lodge, and transform the rest of their bodies into corn sacks by blowing
    on them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After eating, the boys leave the lodge; the older brother uses powdered roots
    so that both he and the younger brother vomit until their stomachs are empty.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Spider-Woman has mock dried pumpkins cooked with powdered root in the bowl,
    and the boys again go out and vomit.
  category: sequence
  evidence_refs:
  - ev:9
