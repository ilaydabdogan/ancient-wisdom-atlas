canonical_text:
  quote: ''
  summary: 'A crying newborn is used to identify its father by accepting an arrow.
    Many-Claws stops the crying by using glue on an arrow and is initially treated
    as the father, but a fiery stranger appears and the child goes to him; the stranger
    is identified as a meteor, stays through the summer, helps the people obtain plentiful
    food, and names the boy Young-Meteor. The passage then gives a summary and opening
    setting for the story of Black and White: two boys named White and Black, sons
    of a chief and a brave, grow up together like brothers in a powerful Pawnee village,
    while other chiefs and bands are introduced.'
  language: English
  quote_policy: summarized
