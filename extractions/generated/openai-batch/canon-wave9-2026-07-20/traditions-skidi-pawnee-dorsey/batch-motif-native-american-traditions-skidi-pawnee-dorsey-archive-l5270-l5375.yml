canonical_text:
  quote: ''
  summary: After being left behind, a boy and his sisters survive by salvaging food,
    fire, and hunting materials. The older sister makes weapons and shelter, and the
    boy becomes a hunter. A mountain lion and other Nahurac animals aid him, bring
    him into an animals’ lodge through a tree-and-water entrance, give him offerings
    and hunting power, and teach him mysteries. The children prosper while their people
    starve because the gods and animals are angry with the chief. Years later the
    grown boy meets a starving kinsman and sends meat and a message that the people
    must not return until they kill the chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children pick up their stunned dog, find live coals in ashes, make a fire,
    and eat salvaged sinew and meat scraps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older girl makes a bow from ash wood, arrows from dogwood, and a bowstring
    from gathered sinew.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children make a grass lodge for cold weather, and the boy hunts birds,
    then rabbits and turkeys.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An animal carrying a deer drops it and runs away; the children bring the deer
    home, and the older sister uses it for meat, sinew, antler arrow-points, hide,
    and clothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man with a deer addresses the boy as son, says he knows the children are
    there, says his friends agreed to care for them, and identifies himself as a mountain
    lion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy follows the man to an island, imitates him by climbing a tree and
    jumping into the water, and finds himself in a lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the lodge, Beaver says it is the lodge of Nahurac, says the animals sent
    for the boy out of pity, and says Magpie was sent to tell buffalo to move near
    enough to be killed for the children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Beaver says the children’s people are far away and hungry because the gods
    in the heavens and the animals are angry with the chief for what he did to the
    children and their sisters.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Beaver gives the boy items that people had offered to the animals, including
    knives, awls, blankets, robes, a fine bow, and flint-pointed arrows.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy brings the goods home, and his sister recognizes that the animals
    have taken pity on them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Animals come near the children’s tipi or lodge and are killed by the boy for
    food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The boy stays with the animals most of the time, learns their mysteries, and
    returns so changed that the girls do not know him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The children become well supplied with a large tipi, clothing, and dried meat,
    while the animals report that the people are starving and angry with the chief.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After many years, the boy is a young man and the girls are women; the animals
    tell him the people are coming back and later tell him a man is coming whom he
    must meet.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The young man meets a thin, hungry kinsman who is looking where the children
    had been left but finds no bones.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The children feed the kinsman, hear about the people’s suffering and fear
    of the chief, and send him back with meat and instructions.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The young man instructs that the people must not come until they have killed
    the chief; the kinsman reports this to the boy’s father and the braves, and the
    father agrees.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
