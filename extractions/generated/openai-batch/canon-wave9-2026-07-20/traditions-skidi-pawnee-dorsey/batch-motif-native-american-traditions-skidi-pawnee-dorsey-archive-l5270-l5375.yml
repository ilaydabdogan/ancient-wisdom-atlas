candidate_motifs:
- id: motif:1
  label: Abandoned children survive through craft and hunting
  taxonomy_refs: []
  basis: The children are left behind, salvage fire and scraps, make weapons and shelter,
    and begin hunting birds, rabbits, turkeys, deer, and buffalo.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage is an excerpt; the initial abandonment is referred to later
    rather than narrated in full within this range.
- id: motif:2
  label: Animal helpers care for abandoned children
  taxonomy_refs: []
  basis: A mountain lion says he and his friends agreed to take care of the children;
    Beaver says the Nahurac sent for the boy out of pity; animals provide goods, game,
    and instruction.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The animals’ identities and exact hierarchy are partly compressed in the
    passage.
- id: motif:3
  label: Initiatory visit to a hidden animal lodge
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The boy follows an animal helper, enters a hidden lodge by imitating a tree-and-water
    action, stays with the animals, learns their mysteries, and returns changed.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly call the visit an initiation; the classification
    rests on the sequence of entry, instruction in mysteries, and transformation.
- id: motif:4
  label: Offerings to animal powers returned as aid
  taxonomy_refs:
  - sacred_exchange
  basis: Beaver tells the boy to take and use things his people had offered to the
    animals, including tools, robes, a bow, and arrows.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage states the objects were offerings and later aid, but it does
    not present a formal exchange ritual in this excerpt.
- id: motif:5
  label: Supernatural anger expressed through communal starvation
  taxonomy_refs:
  - divine_judgment
  basis: Beaver says the people are hungry because the gods in the heavens and the
    animals are angry with the chief for what he did to the children; the people later
    continue starving and turn against the chief.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage gives the causal explanation in reported speech; broader narrative
    context may refine the judgment motif.
- id: motif:6
  label: Return conditioned on removal of the guilty chief
  taxonomy_refs:
  - return
  basis: The young man sends word that he and his sisters are alive but that the people
    must not come until they have killed the chief.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The taxonomy reference is broad; the passage concerns the people’s return
    to the survivors rather than a completed heroic return scene.
