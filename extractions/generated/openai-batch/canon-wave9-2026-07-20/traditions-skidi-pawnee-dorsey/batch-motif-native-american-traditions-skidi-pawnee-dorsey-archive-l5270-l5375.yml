  quote_or_summary: Beaver identifies the place as the lodge of Nahurac, says the
    animals pity the boy, have sent Magpie to tell the buffalo to approach, says the
    gods and animals are angry with the chief, and tells the boy to take goods offered
    to the animals.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:8
  type: summary
  locator: lines 5343-5351
  quote_or_summary: The boy brings the goods home and tells the girl, who understands
    the animals have taken pity; deer, raccoons, beavers, and otters come near and
    the boy kills them.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:9
  type: summary
  locator: lines 5352-5358
  quote_or_summary: The boy stays with the animals most of the time, learns their
    mysteries, returns so changed the girls do not know him, and kills buffalo close
    to the tipi.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:10
  type: summary
  locator: lines 5359-5367
  quote_or_summary: The girls make a large tipi and have clothing; the boy has killed
    many animals and they have dried meat. The animals tell him the people are starving
    and angry with the chief.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:11
  type: summary
  locator: lines 5368-5382
  quote_or_summary: After many years the boy is a young man and the girls are women;
    the animals warn him of the returning people and of a man coming. He meets a thin,
    hungry man looking where the children had been left, where no bones are found.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:12
  type: summary
  locator: lines 5383-5397
  quote_or_summary: The children feed the man, who is their kinsman and reports the
    people’s suffering and fear of the chief. When strong, he is given meat and told
    to say the siblings are alive and that the people must not come until they have
    killed the chief.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
- id: ev:13
  type: summary
  locator: lines 5398-5408
  quote_or_summary: The kinsman returns to the village, summons the boy’s father,
    reports that the children live and have meat, and the father, after receiving
    meat and hearing the message, says it shall be done; the braves are then quietly
    invited and told.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summary supplied.
