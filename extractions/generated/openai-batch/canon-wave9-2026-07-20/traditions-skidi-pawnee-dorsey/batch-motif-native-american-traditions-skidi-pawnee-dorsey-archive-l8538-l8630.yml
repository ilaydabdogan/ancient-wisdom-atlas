canonical_text:
  quote: Two boys receive from the animals magic arrows, with charge to slay a watermonster;
    they accomplish the task, saving the nest of the thunder-birds.
  summary: Two boys living near a lake are taken to a lodge of animals, given special
    bows, arrows, and otter quivers, and instructed to kill a lake monster. They later
    find and feed young thunder-birds on a hilltop. When the reptile-like monster
    climbs from the lake to swallow the young birds, the boys shoot blunt arrows into
    its mouth, killing it. The arrows become huge rooted trees, and the mother thunder-bird
    teaches the boys power over thunder, lightning, and rain.
  language: English
  quote_policy: quoted
