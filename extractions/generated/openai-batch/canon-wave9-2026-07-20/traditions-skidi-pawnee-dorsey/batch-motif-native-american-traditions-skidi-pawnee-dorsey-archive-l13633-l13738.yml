canonical_text:
  quote: ''
  summary: The passage contains two Coyote animal tales in which Coyote eats plant
    foods and dies from violent bodily effects, followed by the beginning and summary
    of a Big Turtle tale in which warriors climb onto a large turtle, are carried
    into a lake, continue to appear as living under water in a boy’s dream, and are
    connected with a sacred-bundle rite to empty the lake and reveal bones.
  language: English
  quote_policy: summarized
