canonical_text:
  quote: ''
  summary: A man finds two captured women in an enemy tipi, works with them to kill
    their husband/chief and another brave man, takes scalps and horses, retrieves
    his son from a cave, and returns with the women and child to his people. The son
    is marked by distinctive dress and later becomes a warrior, medicine-man, chief,
    and transmitter of elk-dance songs learned from animals. The passage then begins
    a new tale in which a boy is visited in dream by Mother Moon and acquires medicine
    power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man finds a camp-like sight that is only horses and one tipi, then hides
    among hills until sunset.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A captured woman comes from the tipi crying, recognizes the man as being of
    her tribe, and says another woman of their tribe is also there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man asks the captured woman to help him kill the man in the tipi so they
    can go home, and the women agree.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The man shoots the man inside the tipi with an arrow, and the women strike
    the fallen man on the head with axes; his scalp is taken and his body is left
    outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One woman summons the bravest man from another camp; when he enters the tipi,
    he is clubbed, killed, and scalped.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man tells the women to gather belongings; they saddle ponies, take the
    best horses, go south, and retrieve the man’s son from a cave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy from the cave wears a calf robe, is painted with white clay, has red
    berries around his neck, and has deer hoof strings around his hands and ankles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The party sees smoke behind them, recognizes pursuit, travels quickly through
    rough country and through the night, and eventually rests near wide streams lined
    with cottonwood trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the Platte River the party camps; the man kills many buffalo, and the women
    prepare robes, tan hides, and make a tipi while the boy sings at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The party reaches their people near the Republican River at night and sets
    up a tipi in the center of camp.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: After a fire is kindled, the man sends for an uncle; by morning people notice
    the new tipi, many ponies, and scalps hung on a pole, and word spreads that the
    young chief has returned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The child’s mother is ordered away, and the relatives of the captured women
    come, but the women remain with the man as wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Women form scalp-dances around the tipi and receive presents from the women;
    the man is asked to take his place as chief but refuses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the permanent village the elk-dance is being carried on; the boy enters
    it and teaches songs he had learned from animals, which the passage says are still
    sung in that dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The boy becomes a great warrior and medicine-man, selects young men, and takes
    them into the dance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: In battle the young man is seen dressed as he was when he came out of the
    cave, with froth in his mouth; he dips arrow points in his mouth and kills enemies,
    while arrows shot at him do not go through him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Chiefs make the young man a chief while he is young, but he does not attend
    councils and instead devotes himself to elk-dances and teaching songs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The next tale’s synopsis says a boy is visited in dream by Mother Moon, acquires
    womanish ways, becomes a mighty warrior, relieves a war-party, and shows a moon-mark
    in trance ceremonies.
  category: sequence
  evidence_refs:
  - ev:9
