canonical_text:
  quote: "“Our people are coming back, they are starving.”"
  summary: A brother and sister who have survived in the village with abundant buffalo
    meat and crops learn that their people are returning in starvation. Their grandfather,
    Man-with-Bloody-Horn, comes to check on them, finds them alive with plenty, is
    fed and greased, and is sent back with dried buffalo meat and a message inviting
    the chiefs and people to return and eat. The passage also describes his powerful
    bloody buffalo horn and ends with his wife preparing a fire after receiving the
    meat.
  language: English
  quote_policy: quoted
