canonical_text:
  quote: ''
  summary: A quiet young warrior gains fame in battle while refusing women. While
    scouting he finds a buffalo cow stuck in muddy water, lies with her, and ties
    his shell gorget to her horn. A male buffalo calf is later born and told that
    his human father was selected for contact because the buffalo elders wanted smoke,
    presents, and connection between the two peoples. The buffalo elders allow mother
    and child to visit the father, request tobacco, eagle feathers, and blue beads,
    and give them power to become human by rolling in dust. Near the human camp, the
    cow and calf transform into a woman and boy and wait while men play a game.
  language: English
  quote_policy: summarized
