canonical_text:
  quote: "“The birds helped me.”"
  summary: A boy abandoned on a hill is aided by birds, receives strength and weapons,
    kills buffalo to feed buzzards, is carried across great water, escapes pursuing
    buffalo by being changed into a blackbird, returns home, joins a buffalo hunt,
    and speaks to the mired buffalo about their failed attempt to kill him.
  language: English
  quote_policy: quoted
