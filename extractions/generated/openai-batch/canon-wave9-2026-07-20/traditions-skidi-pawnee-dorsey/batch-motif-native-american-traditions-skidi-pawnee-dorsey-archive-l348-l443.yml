  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Star of the South stands at the southern end of the Milky Way and receives
    the spirits of the dead in the Spirit Land.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fool-Wolf is said to have felt slighted in early divine councils and, from
    anger, introduced death into the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nahurak or Animal lodges gather in council, affect human fortunes, conduct
