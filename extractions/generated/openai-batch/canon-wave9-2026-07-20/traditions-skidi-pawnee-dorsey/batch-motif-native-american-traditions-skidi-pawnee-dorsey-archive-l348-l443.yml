canonical_text:
  quote: ''
  summary: 'The passage outlines a Skidi Pawnee religious cosmology: star and celestial
    deities are ranked by role in creation, governance, life, death, and ritual. It
    describes a female Bright-Star or Evening-Star figure, Morning-Star, the world-quarter
    gods, North-Star, Sun and Moon, lesser stellar deities, Fool-Wolf, animal lodges,
    ceremonial bundles, and village arrangements that mirror the stars.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female Bright-Star figure is described as having a connection with Morning-Star
    and giving birth to the first being upon earth, a girl.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wind, Cloud, Lightning, and Thunder are named as four assistants who transmit
    Tirawa's mandates to people on earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The female deity maintains a garden with ripening grain, many buffalo, and
    streams of life.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Morning-Star is called the father of the first earthly being and is named
    as the deity to whom the Skidi formerly offered a human maiden sacrifice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods of the four world quarters stand in the northeast, southeast, southwest,
    and northwest; they support the heavens, divide the earth, and create beings other
    than the first pair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: North-Star is described as symbolic of the chief, as presiding over councils
    of the gods, and as giving the ceremony for creating the chief.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hutukawahar and Hikus are associated with North-Star and are said to have
    sent buffalo and the breath of life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sun and Moon furnished the earth with the first male being, while Sun also
    gave mankind the bow and arrow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sun provides light during the day, and the passage says the fire for this
