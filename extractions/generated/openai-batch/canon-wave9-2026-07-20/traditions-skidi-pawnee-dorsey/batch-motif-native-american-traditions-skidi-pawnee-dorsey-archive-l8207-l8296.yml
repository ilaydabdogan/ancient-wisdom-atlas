canonical_text:
  quote: ''
  summary: A poor young man follows instructions from a talking horse, uses yellow
    paint in battle, repeatedly performs unacknowledged and then witnessed war deeds,
    captures ponies, distributes them through the chief to poor people, becomes a
    great chief and leader of surrounding tribes, and receives further instructions
    from the horse about how the people must respect his decisions.
  language: English
  quote_policy: summarized
