canonical_text:
  quote: ''
  summary: A riddle-speaker explains seemingly strange or frightening images as ordinary
    prairie scenes, and Wise-Spirit recovers. A witch-woman who eats people kills
    challengers in a diving contest by hiding in a cave under a bank, but a boy turns
    into a beaver and outlasts her, after which villagers kill her. An alternate version
    has the boy turn into an otter and defeat her in an ice-sliding contest. A later
    tale begins with Kiwuk, a successful gambler, carrying a woman across a stream;
    she becomes attached to his back as a forced wife and is revealed as an old woman,
    while healers and a crow are consulted.
  language: English
  quote_policy: summarized
