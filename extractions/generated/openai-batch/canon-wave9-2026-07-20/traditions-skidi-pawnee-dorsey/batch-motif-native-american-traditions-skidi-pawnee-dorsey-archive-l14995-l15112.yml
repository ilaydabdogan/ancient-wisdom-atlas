- id: obs:3
  text: A witch-woman lives alone on the edge of a village, lives on human beings,
    and challenges strangers to dive with her under a rule that the first to come
    out of the water is killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The witch-woman survives her diving contests by entering a cave under a bank
