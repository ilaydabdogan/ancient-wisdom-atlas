  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the ice-sliding variant, the people rush in and help kill the old woman
    after the otter wins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kiwuk is a young man skilled at gambling sticks, wins many garments and other
    goods, dresses well, and gives presents when people ask.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kiwuk meets a lovely woman at a stream; after he carries her across on his
    back, she says she will stay with him and is now his wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kiwuk tries to shake the woman off but cannot because she has grown into his
