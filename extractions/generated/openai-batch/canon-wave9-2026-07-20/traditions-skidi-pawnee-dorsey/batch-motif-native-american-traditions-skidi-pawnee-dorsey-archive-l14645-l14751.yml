canonical_text:
  quote: ''
  summary: The passage contains the conclusion of a story in which a younger brother
    becomes a snake and later helps his older brother gain horses; the complete tale
    of a woman who becomes associated with a horse, bears spotted pony children, and
    is killed after becoming horse-like; and the beginning and synopsis of a tale
    about a boy who becomes a prairie-dog after being scolded for eating corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating squirrel and marrow and going to bed, the younger brother wakes
    at midnight partly transformed into a snake and tells the older brother to put
    him into a hole in a hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: By morning the younger brother has become a snake with a big head, big eyes,
    and a rattle; he promises the older brother good luck and later says he will be
    there when desired.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The older brother kills an enemy man, captures an enemy woman and horses,
    and ties the woman to a tree near the snake’s hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Snakes come out of the hole; the captured woman and a horse die of fright,
    and later the snakes eat horses that the man leaves for them.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The older brother becomes wealthy in horses because he first goes to his snake
    brother before obtaining horses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man catches a spotted pony, brings it home, and tells his wife to care for
    it as if it were their chief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wife feeds and shelters the spotted pony carefully, giving it grass, cottonwood
    shoots, and protection from cold.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The horse appears to the wife as a fine-looking man wearing a buffalo robe
    marked with a spotted horse image and says that he was the horse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman remains with the horse-man, bears spotted pony children, develops
    a horse tail and long hair, and stands while nursing the colt.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hunters later find the spotted ponies and the strange-looking woman; after
    the children are caught, the woman gives in and is caught.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The woman’s husband recognizes her and shoots her dead because he dislikes
    seeing her with a horse’s tail.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The remaining spotted ponies are kept, increase in number, and become the
    source of many spotted ponies for the people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The synopsis of the prairie-dog story says a scolded boy lives with prairie-dogs,
    forgets his past, recovers his memory with help from birds, returns with a prairie-dog
    wife, is unfaithful, and both spouses turn into prairie-dogs related to the Skidi.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the story opening, a woman shows her son different kinds of corn, the boy
    chooses blue corn, and she names him Black-Eyed-Corn.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: During planting time, the hungry boy roasts and eats two ears of corn, is
    scolded by his mother, cries, and goes away.
  category: sequence
  evidence_refs:
  - ev:11
