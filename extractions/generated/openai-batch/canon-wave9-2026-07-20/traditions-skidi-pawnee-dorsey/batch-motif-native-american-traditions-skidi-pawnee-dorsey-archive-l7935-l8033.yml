canonical_text:
  quote: ''
  summary: A boy returns to his village with a speaking pony that identifies itself
    as part of Mother-Earth. The pony instructs him how to rejoin his parents, later
    advises him to trade it temporarily to the chief, refuses food, is damaged during
    a buffalo hunt, is returned and recovers, and finally protects the boy in battle
    after telling him to cover himself with dust.
  language: English
  quote_policy: summarized
