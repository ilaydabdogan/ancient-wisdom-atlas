canonical_text:
  quote: ''
  summary: Tirawa assigns heavenly stations and sends Clouds, Winds, Lightnings, and
    Thunders to Bright-Star. Through song, rattles, storm, a pebble, and war-clubs,
    waters are separated and earth is formed. Storm powers give life to earth, timber,
    streams, and seeds. Great-Star lies with Bright-Star, and Sun lies with Moon,
    producing a female child and a male child associated with seasonal birth and sacrifice.
    Bright-Star places the girl on clouds, a funnel cloud touches earth, and the girl
    stands on earth, giving rise to the Pawnee name Tcuraki, or Rain-Standing.
  language: English
  quote_policy: summarized
