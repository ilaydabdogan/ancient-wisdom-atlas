canonical_text:
  quote: ''
  summary: 'The passage first concludes a boy-hero episode: people kill a chief and
    burn his tipi; the boy later feeds them, directs them to buffalo, performs offerings
    and a medicine-men''s dance, marries, teaches the people, and becomes a chief.
    A new tale then begins: during a westward buffalo hunt, a woman sends her son
    back to the village for a forgotten hide-scraper. In a lodge he finds a crying
    woman by the altar who says she is a mother-mouse and asks him to recover her
    children from the Rain-bundle. The boy retrieves the nest of young mice, returns
    them, and is blessed. The mother-mouse identifies him as kin; the priest of the
    mice appears as an old man and then as a large rat, gives him hairs as a help-token,
    and a company of rats grants him power to become a rat. The mother-mouse also
    grants tireless travel and asks that the lodge people not harm the mice and rats.
    The boy returns to the hunters, who have plenty of dried meat and pemmican.'
  language: English
  quote_policy: summarized
