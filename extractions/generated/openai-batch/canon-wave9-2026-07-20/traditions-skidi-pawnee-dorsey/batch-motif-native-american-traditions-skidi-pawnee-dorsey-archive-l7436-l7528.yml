canonical_text:
  quote: ''
  summary: A young chief creates or reveals an old village-site setting with tipi
    poles, grease, and fat. A tarantula prepares a cobweb snare and cobweb ball. The
    white crow is attracted to the fat, caught, released after promising not to trouble
    or drive away buffalo, then mocks the chief and is repeatedly pulled down by the
    cobweb ball. After the crow threatens the people’s buffalo hunting, the chief
    kills, cuts up, and burns it. A snowstorm follows, and after the snow melts many
    buffalo are found and killed. Later, after the chief forbids anyone to strike
    or scold his two horses, his mother-in-law strikes the black horse; the black
    horse and the chief become bears, and destructive bear attacks with hot breath
    set the prairie on fire through power from the Sun.
  language: English
  quote_policy: summarized
