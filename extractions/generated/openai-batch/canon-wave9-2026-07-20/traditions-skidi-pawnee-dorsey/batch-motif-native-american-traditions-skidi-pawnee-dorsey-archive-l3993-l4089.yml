  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The guide describes a tipi with many white pillows and one black pillow covered
    with lice; dead persons stay if they sit on white pillows, while the living young
    man must sit on the black pillow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The guide instructs the young man to take two large black head lice, let them
    feed on him, carry them west to the girl's spirit, and drop them on her head so
    that her flesh and blood will return.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man sits on the black pillow, takes the two lice, wraps them in
    buckskin, feeds them, and is allowed to go to the village of the dead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The young man finds the girl alone in her tipi and drops the two lice on her
    head while pretending to examine her hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The girl warns him to kill buffalo on the prairie and not in the brush; when
    he follows buffalo into the brush, his pony and the buffalo turn into skeletons.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The girl scratches, flesh returns, and blood begins to circulate; later her
    ponies turn into skeletons when driven to water among the brush, after which the
    young man says it is time to return to the land of the living.
  category: sequence
  evidence_refs:
  - ev:10
