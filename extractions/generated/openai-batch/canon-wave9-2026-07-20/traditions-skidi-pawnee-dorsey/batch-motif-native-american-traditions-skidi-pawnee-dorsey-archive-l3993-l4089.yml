- id: obs:4
  text: The same being says he has power to go to the dead land, says he will ask
    the Wind for help, and later reports that the Wind consents to help take the young
    man to the Spirit Land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man is led from the tipi along a path and journeys for several days
