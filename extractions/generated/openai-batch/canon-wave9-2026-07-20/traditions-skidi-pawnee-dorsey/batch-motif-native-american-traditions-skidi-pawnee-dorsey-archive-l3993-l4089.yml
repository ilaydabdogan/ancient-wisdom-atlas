- id: obs:1
  text: While the young man is away with a war-party, the girl becomes sick and dies;
    her parents bury her in a tipi and leave it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man returns to the village, stays in the burial tipi, and mourns
    the girl for several days and nights.
  category: action
  evidence_refs:
