canonical_text:
  quote: ''
  summary: A young man returns from a war-party to find that a girl has died and been
    buried in a tipi. He mourns at her grave. A being associated with rainbow and
    skunk form offers help, obtains the Wind's consent, and guides him toward the
    Spirit Land. At a threshold tipi the young man must sit on a black lice-covered
    pillow rather than the white pillows of the dead, take two black head lice, and
    carry them to the girl's spirit. He drops the lice on her head so that scratching
    will restore her flesh and blood. In the dead land, animals turn into skeletons
    when taken into brush, and the young man proposes returning with the restored
    girl to the land of the living.
  language: English
  quote_policy: summarized
