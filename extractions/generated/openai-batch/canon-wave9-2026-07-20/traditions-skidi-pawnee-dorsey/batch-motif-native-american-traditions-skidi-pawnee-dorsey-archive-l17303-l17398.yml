canonical_text:
  quote: ''
  summary: The passage gives notes on Skidi quiver materials, a buffalo scalp covering
    a star bundle, several editorial cross-references, and a detailed account of a
    Skidi scalp-offering ceremony. In the ceremony a returning scalp is announced
    as being for Tirawa, placed with a sacred bundle by a priest, burned in a ritually
    made fire east of the village, and followed by smoke rites, name changing, and
    corn-bearing processions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Skidi commonly used tanned buffalo quivers, while privileged great warriors
    used otter or mountain-lion quivers said to increase warrior efficacy.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buffalo scalp is placed over a bundle devoted to a star to make the bundle
    resemble the star, which is described as sitting in darkness with bright eyes,
    and from whose black depths night comes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The star bundle is said to still exist and to be kept by Woman-Chief-Tipi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One note identifies Fox as the teller and points to Kroeber, Cheyenne, No.
    22 as a similar tale.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: One note interprets a reference as belonging to a time before the Skidi had
    contact with buffalo, when they lived on field products.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: One note mentions pursuit by a skull and by other objects.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: One note states that a wonderful power possessed by an unnamed male was used
    to kill people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One note identifies Yellow-Bear as a teller.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: For an aspiring warrior, taking a scalp to make it holy required a ceremony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: As a successful war-party neared the village, scalp-takers tied scalps to
    long poles and announced that each scalp was for Tirawa and for sacrifice at one
    of the seventeen bundles.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The priest put red ointment on his body, wore a buffalo robe hair side out,
    met the warrior, took the scalp into his lodge, and set the scalp pole at the
    altar with the scalp resting on the bundle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The young man was given fire-sticks, a flint knife, and the scalp, then went
    east of the village with the priest to make a fireplace and start fire while priests
    sang about each stage.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Men, women, and children assembled carrying sacred bundles and medicine bundles
    after the fire had been started.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The scalp was put into the fire, and the smoke was described as going straight
    up to Tirawa.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: After the offering, the priest faced east and recited a ritual to change people’s
    names, with the expectation that Tirawa would look favorably on them.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Priests and people circled the fireplace so that smoke enveloped them; then
    girls and old women carried corn-topped poles, and another group of old women
    dressed as men carried corn-husk shields, eagle feathers, corn-husk headdresses,
    and weed spears as if attacking an enemy.
  category: sequence
  evidence_refs:
  - ev:13
