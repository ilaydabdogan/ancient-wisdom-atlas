- id: obs:4
  text: The star-man sends a rainstorm and lightning through the hole; the woman is
    killed, while the boy is struck on the forehead and left with the picture of a
    star.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After falling to earth, the boy crawls away, returns to nurse from his dead
    mother for a time, and remains near her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When wild animals or birds try to harm the boy, clouds come and drive them
    away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy finds a bow and arrows, hunts rabbits and small birds, eats them raw,
    and also eats plums and grapes while traveling west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy enters a beautiful place with corn, beans, and squash and eats them
    raw; the field belongs to a witch-woman.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The witch-woman finds the boy’s footprints, calls him grandchild, takes him
    to her home, and the old couple are pleased because they plan to kill and eat
    him when he grows up.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman arranges for the boy to carry a bundle home so that the old
    man can kill him at the tipi entrance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy senses danger, throws the bundle in before entering, and a great snake
    bites the bundle instead of the boy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy beats the snake’s head with his bow; as it dies, it turns completely
    into the old man, revealing that the grandfather had become a snake to kill him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old woman returns, finds the boy alive and her husband dead, calls the
    boy wonderful, and plans revenge by having her animals devour him.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
