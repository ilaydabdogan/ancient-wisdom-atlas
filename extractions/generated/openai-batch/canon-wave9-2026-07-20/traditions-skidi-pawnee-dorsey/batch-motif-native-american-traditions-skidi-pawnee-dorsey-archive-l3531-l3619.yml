canonical_text:
  quote: ''
  summary: A woman lowers herself and her baby from the star people’s place through
    a hole by a sinew rope. The star-man sends storm and lightning, killing the woman
    and marking but not killing the boy. The boy survives beside his dead mother,
    receives protection from clouds, hunts and travels west, enters a witch-woman’s
    cultivated field, and is taken in by an old couple who intend to kill and eat
    him. When the old man assumes serpent form to kill him, the boy senses danger,
    uses a bundle as a decoy, kills the snake, and discovers it was his grandfather.
    The old woman vows revenge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman makes a larger hole, lays wood across it, ties on a sinew rope,
    and prepares a way to descend.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night, when the people prepare to stand out as stars, the woman goes to
    the hole with her baby on her back and begins sliding down the rope.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman uses loops and additional rope sections when the first rope is not
