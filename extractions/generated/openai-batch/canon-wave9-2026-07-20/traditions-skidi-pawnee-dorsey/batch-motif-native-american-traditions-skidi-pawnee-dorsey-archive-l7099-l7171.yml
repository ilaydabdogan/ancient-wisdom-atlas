canonical_text:
  quote: ''
  summary: A boy and his grandmother feed the village from stored meat, then use a
    wonderful robe at the north-side timber so that winds drive animals and bring
    plant foods. Crow-Feathers, the chief, the crier, and the grandmother help organize
    the village to surround the bottom and gather game and foods. After this is repeated
    four times, the boy says that underground foods were given to his grandmother
    by the Moon and the rest to him by the Sun, and that each person should now hunt
    and gather for themselves. The passage then begins a new tale, summarized as a
    poor boy aided by bears, transformed bear-horse, bear-shape, a white crow that
    is the defeated chief’s soul, and a tarantula; the narrative introduction describes
    a cruel chief and a poor boy living with his grandmother and a poor white pony.
  language: English
  quote_policy: summarized
