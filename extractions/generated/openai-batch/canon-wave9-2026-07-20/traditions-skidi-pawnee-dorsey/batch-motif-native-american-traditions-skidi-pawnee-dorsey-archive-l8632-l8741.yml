canonical_text:
  quote: ''
  summary: After mockery by the people, an older girl and her young brother stay behind
    when the camp goes hunting. The girl gathers corn for food and seed, makes a separate
    home and garden, but the hungry boy roasts and eats all the seed-corn, is punished,
    sings of transforming into an eagle, and flies away. The girl pursues him and
    meets a young man who proposes a trap to restore the eagle-brother to boy form;
    the excerpt ends with the eagle suspecting the trap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people mock the girl and boy; when the camp leaves to hunt, the girl decides
    that she and her about five-year-old brother will not follow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl gathers broken corn for food and a small amount of seed-corn, carries
    them, leads her brother by the hand, and goes east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pair settle in a rich bottom, where the girl builds a small grass house,
    prepares beds, hangs the seeds, stores the corn, clears land, and rations mush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: While the girl is making planting hills in the field, the hungry boy takes
    the hanging seeds, roasts kernels on hot coals, and eats them all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the girl asks about the missing seeds, the boy first denies knowledge
    and then admits that he ate them; the narrator connects this to children stealing
    seeds and lying when caught.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The girl says she depended on the seeds for planting, whips the boy with a
    stick, and the crying boy covers his body with his robe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The boy sings to his sister that her corn or seeds will speak to her and that
    parts of his body are becoming eagle parts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After singing about successive body parts, including bill and eyes, the boy
    flies out from the robe as an eagle, exits through the smoke-hole, and rises into
    the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The girl tries to grasp the eagle-brother's legs, runs after him crying, and
    tells a young man that she will be alone if her brother remains an eagle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The young man proposes that the girl hide under brush while he lies there
    with his belly cut open as bait, so that she can seize the eagle's legs and restore
    him to boy form.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The eagle comes down near the bait but sings that he is unwilling to eat the
    badger-like body and suspects a trap.
  category: speech
  evidence_refs:
  - ev:11
