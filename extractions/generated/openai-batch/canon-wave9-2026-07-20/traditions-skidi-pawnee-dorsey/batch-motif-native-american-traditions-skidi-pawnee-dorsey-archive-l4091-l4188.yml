canonical_text:
  quote: ''
  summary: 'The passage first closes a story in which a group passes under a rainbow,
    returns to a tipi grave, finds the buried girl''s body gone, and the boy and girl
    live together. It then begins the story titled “Scalped-Men and Spirit Land”:
    a bereaved man loses his wife and only son, wanders after mourning at his son''s
    grave, encounters scalped dead people in timbered country, follows them to a hidden
    cave, sees their sacred bundle and leader, is received with fire and food, and
    explains that he longs to join his dead wife and son.'
  language: English
  quote_policy: summarized
