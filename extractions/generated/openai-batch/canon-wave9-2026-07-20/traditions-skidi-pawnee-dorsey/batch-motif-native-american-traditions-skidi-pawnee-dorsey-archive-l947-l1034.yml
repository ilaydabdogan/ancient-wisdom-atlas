canonical_text:
  quote: ''
  summary: Tirawa commands celestial beings and four gods to send storm powers so
    that the Moon's child is placed on earth. The boy and a girl are awakened by rain,
    lightning, and thunder, come to understanding, have a child, and receive knowledge,
    ritual space, fire, tools, pipes, warrior signs, and other cultural goods from
    the gods. The young man later finds flint and implements at a lightning-struck
    mountain and makes bow and arrows, recalling that his father, the Sun, had held
    them up.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tirawa commands Bright-Star to instruct the four gods and the Moon so that
    the Moon's child is placed on the Clouds and lowered to earth by storm powers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four gods rattle gourds and sing; Winds, Clouds, Lightnings, and Thunders
    act together, and the boy Piruski is dropped onto the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy and the girl wander, come together, and at first have no knowledge
    or concern for things.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tirawa commands that life and understanding be put into the children; rain,
    lightning, and thunder surround them and they awaken and understand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the two lie together, a child is born to them, and they understand that
    they must labor to feed and clothe the child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman begins to build a grass lodge, and the gods are asked to provide
    such things as earth, timber, water, dew, fog, rain, mist, wind, and night.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A storm whirls around and passes over the lodge, after which the woman knows
    that the lodge has been visited by the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman has a lodge, an altar, a holy place in the west of the lodge, and
    remembrance of a pathway from the west to the centre of the earth; Tirawa dwells
    above in the centre.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The fireplace, its rim, and the use of fire-sticks are given or taught; Lightning
    teaches that a blaze can come from the fire-sticks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Speech, the lodge entrance, surrounding space, pipe-stone, pipe string, and
    pipe-stems are included among things given by the gods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The gods sing gifts for the man, including moccasins, strings, a robe, Atira's
    presence, a warrior office, Swift Hawk, feathers, a war-club, Swallow, paints,
    animal names, bow and arrow parts, and pipe-related offerings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: As each star comes over the land, the young man goes to the place where Lightning
    struck the mountains, finds flint-stones, bows, arrows, and axe pieces, and makes
    bow and arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The young man had seen bow and arrows held up by his father, the Sun.
  category: relationship
  evidence_refs:
  - ev:6
