canonical_text:
  quote: ''
  summary: 'Coyote flees from a pursuing stone, seeks help from a witchwoman, and
    is directed to a bull-bat family. The bull-bats break the stone with their power,
    but after Coyote mocks them they reassemble it and command it to kill him. The
    passage explains this as the reason stones are hard. A new Coyote episode begins:
    hungry Coyote sees seven buffalo and sings a false claim that he saved them from
    hunters, prompting them to consider rewarding him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is pursued by a stone and seeks help from a witchwoman, who says she
    cannot help and directs him to a bull-bat family in a valley near the next hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bull-bat father and his boys shelter Coyote and use their powers to break
    the pursuing stone into pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After being rescued, Coyote calls out to the bull-bats; the bull-bat father
    becomes angry, turns his boys into bull-bats, reassembles the stone, and tells
    it to kill Coyote.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The restored stone pursues Coyote, cuts off his attempt to return to the bull-bats,
    runs over him, mashes him, and kills him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator explains that stones became solid and hard because the bull-bats
    put the broken stone back together.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The next section synopsis says Coyote receives meat from buffalo after pretended
