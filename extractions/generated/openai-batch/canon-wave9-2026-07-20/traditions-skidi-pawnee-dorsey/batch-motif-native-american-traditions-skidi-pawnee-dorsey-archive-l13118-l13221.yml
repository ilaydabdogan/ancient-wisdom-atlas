    gives himself a mortal wound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hungry Coyote sees seven buffalo, performs with bow, arrows, song, and jumping
    motions, and claims he saved them from people with bows and guns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The buffalo listen to Coyote's song, accept his claim that they would have
    been killed without him, and say they ought to do something for him.
  category: speech
  evidence_refs:
  - ev:7
