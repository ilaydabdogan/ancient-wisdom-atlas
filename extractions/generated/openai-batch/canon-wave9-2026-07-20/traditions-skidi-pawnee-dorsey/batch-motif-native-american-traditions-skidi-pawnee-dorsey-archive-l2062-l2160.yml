candidate_motifs:
- id: motif:1
  label: Animal-claimed guarded woman in a dangerous lodge
  taxonomy_refs: []
  basis: The girl is said to belong to the animals, and her lodge is arranged with
    bears, snakes, ice, a witch-woman, and spirit-logs as obstacles or guardians against
    suitors.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not name this as a conventional motif; the label is descriptive.
- id: motif:2
  label: Suitor ordeal through lethal thresholds
  taxonomy_refs:
  - initiation
  basis: A man seeking to marry the girl must pass a cold slippery entrance, snakes,
    bears, and a poisonous snake before reaching her.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term 'initiation' is only broadly applicable; the
    passage frames the ordeal as a marriage barrier rather than an initiation rite.
- id: motif:3
  label: Shapeshifting suitor turns into hawk
  taxonomy_refs:
  - shapeshifter
  basis: Hawk-Man turns into a hawk and flies over thorn trees blocking the way to
    the girl's lodge.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives one transformation episode and does not elaborate a
    broader shapeshifter cycle.
- id: motif:4
  label: Bride-task requiring a guarded baby-board
  taxonomy_refs:
  - sacred_exchange
  basis: The girl says Hawk-Man may marry her only after he obtains a baby-board with
    wildcat-hide mat and deer-hoof rattles; the object is guarded by the old woman
    and spirit-sticks.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage presents the
    baby-board as a marriage condition, not explicitly as an exchange contract.
- id: motif:5
  label: Failed theft of a guarded object
  taxonomy_refs:
  - sacred_theft
  basis: Hawk-Man takes the baby-board while the keeper sleeps but is pursued by spirit-sticks
    and forced to drop it.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The baby-board is guarded by spirits, but the passage does not explicitly
    call the baby-board sacred.
- id: motif:6
  label: Marginalized poor youth receives nocturnal summons
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: A poor boy living outside the village is visited at night by an old man,
    told to go to a high hill, and later prays there before seeing celestial beings.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The excerpt ends before showing the full outcome of the summons, so the
    quest pattern remains incomplete.
- id: motif:7
  label: Celestial leader with assistant brother and star procession
  taxonomy_refs:
  - sibling_pair
  basis: The boy sees a bright red star and a smaller star assistant, and the passage
    identifies them as Great-Star or Morning-Star and his assistant brother among
    other stars.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The sibling-pair reference is limited to the identification of Great-Star's
    assistant as his brother; the passage does not develop a full paired-hero narrative.
- id: motif:8
  label: Threat of animal destruction of men opposed by celestial helper
  taxonomy_refs: []
  basis: The old man says the animals want to destroy the men and have only women,
    and he says he will not allow it.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The excerpt states the threat and opposition but does not yet narrate
    the resolution.
