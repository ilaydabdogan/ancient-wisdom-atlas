canonical_text:
  quote: ''
  summary: A girl born after her father returns to land is later placed at an instructed
    location and disappears into an animal-associated lodge. She is told she belongs
    to the animals, and suitors must pass dangerous animal and supernatural guardians.
    Hawk-Man attempts to win her by obtaining a guarded baby-board but fails. A poor
    boy is later summoned by an old man to a hill, where he prays and witnesses a
    star procession led by Great-Star, identified as Morning-Star, with his assistant
    brother.
  language: English, with some Latin phrases in the passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the man was put back on dry land, his wife gave birth to a girl; when
    the girl was older, he took her to an instructed place, and by the next morning
    she had disappeared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl was told in the lodge that she would belong to the animals and that
    any man who wanted to marry her first had to get the animals' consent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A lodge was to be made for the girl with cedar trees and three bears on the
    south side to guard her.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lodge entrance was to be freezing cold and slippery, so that an approaching
    young man could slip, fall, and die.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A suitor who passed the entrance would next meet two large rattlesnakes, then
    other snakes, then bears, and then a very poisonous snake near the bedside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A witch-woman or old woman in the north of the lodge kept a baby-board for
    the girl, and logs on her fire were described as spirits of men assigned to guard
    the baby-board.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The animals built a new lodge for the girl and placed bears in the south,
    snakes at the inner entrance, and ice at the first entrance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl was seen going in and out of the lodge, wearing buckskin, loose hair
    over her shoulders, rattlesnake-hide moccasins, and many feathers on her dress.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hawk-Man approached the lodge with an old man, was blocked by thorny trees,
    turned into a hawk, and flew over the trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl sang that Hawk-Man must obtain a baby-board with a wildcat-hide mat
    and deer-hoof rattles before he could marry her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hawk-Man took the baby-board while the old woman slept, but the spirit-sticks
    pursued him and threw live coals at him, causing him to abandon the baby-board
    and stop trying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Other young men also failed, and people were killed by the girl's mysteries
    and powers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A poor boy living with his poor mother outside the village was visited at
    night by an old man who told him to go to a high hill and said the animals wanted
    to destroy the men and have only women.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: The boy went to the hill at night, prayed to gods in the heavens, and toward
    morning saw a westward procession of star people led by a bright red star and
    a smaller star assistant.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
