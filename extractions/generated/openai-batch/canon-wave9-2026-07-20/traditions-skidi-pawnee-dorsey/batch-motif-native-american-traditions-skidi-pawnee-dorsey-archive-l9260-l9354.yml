canonical_text:
  quote: ''
  summary: A restored young man hunts elk, reclaims his clothing and woodpecker head-dress
    from Crow-Feathers, kills the false possessor, and returns to the old woman's
    lodge. Through a circular act around the tipi and eye-closing, the lodge becomes
    a fine buffalo-hide tipi and the old woman and Burnt-Belly are transformed. The
    chief's younger daughter joins the household and marries the young man. The young
    man then directs communal hunts on islands, producing abundant deer, rabbits,
    elk, and other game for the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fourth day the young man and the little fellow went to an island, killed
    an elk, divided the meat, and carried it home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A younger daughter of the chief saw the young man in the old woman's lodge,
    thought she knew him, and visited every day afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After becoming strong, the young man instructed the old woman to make him
    an ash bough club with a handle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: People wondered why Crow-Feathers, despite fine clothing and a woodpecker
    head-dress, did not bring game.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man entered the chief's lodge, saw his things and the man who had
    left him in the hole, beat that man with the club, drove him outside, and killed
    him by crushing his head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birds on the head-dress and leggings sang when the young man entered; they
    had pecked the other man while he possessed the items.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old woman walked in a circle around the tipi, then covered her head and
    closed her eyes; afterward she found herself in a fine buffalo-hide tipi, became
    middle-aged, and Burnt-Belly became a fine young man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: People saw the new tipi in the west and some attributed it to the mysterious
    boy who had lived on the island.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tipi contained flagroot-top mats and sweet grass from the island, and
    it smelled fragrant.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief's younger daughter made her home with the old woman and eventually
    married the young man.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man sent for the crier and had him announce that the men would attack
    game the next day.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The young man directed two parties to approach an island from east and west,
    give war-whoops and noises, and move toward the center, where game circled until
    killed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Further island drives produced good-sized deer and then elk, and people brought
    meat to the young man's tipi without requiring him to help slaughter the game.
  category: sequence
  evidence_refs:
  - ev:11
