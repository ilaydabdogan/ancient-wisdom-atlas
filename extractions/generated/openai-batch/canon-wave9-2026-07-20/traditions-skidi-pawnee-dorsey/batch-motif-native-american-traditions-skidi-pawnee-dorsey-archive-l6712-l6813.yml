canonical_text:
  quote: ''
  summary: An orphan boy and another boy follow a speaking elk to enemy villages.
    The elk equips and instructs the orphan, creates frightening magical noise and
    spirit attack, drives away ponies, protects the boys in flight, and requires scalps
    to be tied to its horn as a sacrifice to the Sun. The orphan returns with ponies,
    gives them to his mother and poor people, and repeats the warpath with the elk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The orphan boy wakes the other boy, says the elk is waiting for them for an
    attack on an enemy village, and both boys follow the elk to a hill overlooking
    the village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elk gives the orphan boy red clay body paint, tanned elk strings for his
    wrists, an elk neck skin with hoof rattles and two elk teeth, and a flute that
    is also described as a war-club; the other boy is asleep and receives nothing.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elk instructs the orphan boy to wait for its signal, run with the other
    boy, not look back, not watch the elk, and prevent the other boy from trying to
    kill or do anything.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the elk asks what the orphan boy wants, the boy asks to kill one man,
    take his scalp, and take a few ponies; the elk says this will be as he wishes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the first attack, villagers are frightened by a great noise and seem
    to perceive many warriors; the passage says this is the elk's magic and that the
    elk made spirits attack the village, though the boys do not see the spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the first attack, the elk drives ponies away from the village, the passage
    states that a man in the village is struck and killed by the man with the flute,
    and the orphan boy scalps the killed man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The other boy counts coup in the first raid and, in the second raid, does
    not kill anyone or take a scalp because the passage says it is not his privilege.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:8
  text: When enemies chase the boys, the elk blows its breath on the boys so they
    run faster and goes between the boys and the enemy, making the pursuers stop.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elk tells the orphan boy that the scalp is to be offered as a sacrifice
    to the Sun and directs him to tie it on the prong of the elk's left horn nearest
    its head.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the boys return near their village with ponies, the elk disappears after
    whispering to the orphan boy to come again on the warpath soon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The orphan boy gives many ponies to his mother and later summons poor people
    and gives ponies to them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boys go south again on the warpath; the mother provides food and moccasins,
    and the elk again leads them to the enemy camp, asks the orphan boy what he wants,
    and has the boys paint themselves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the second attack, the elk commands the boys to run, the village is frightened
    by noise, the elk drives ponies from the camp, the orphan boy kills a man and
    takes his scalp, and the boys run away with the ponies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the second scalp dries, the elk demands it, and the boy ties it to the
    second prong of the elk's horn before the boys drive the ponies home.
  category: sequence
  evidence_refs:
  - ev:9
