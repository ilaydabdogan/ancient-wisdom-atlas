canonical_text:
  quote: ''
  summary: A mysterious being, named Pahukatiwa in the passage, repeatedly communicates
    with Pawnee men. He warns of an enemy attack, gives leggings to be displayed on
    a pole against an enemy bearing his buffalo robe, instructs warriors in a dance,
    grants martial requests, attempts to teach another man powers through dangerous
    animal encounters, gives seven feathers for concealment by clouds and dust, teaches
    secrets through a dying elk, introduces the One-Horn-Buffalo-Dance, and finally
    leaves after people refuse to smoke with him, saying he will stand in the north
    under the North-Star as one of the stars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who had communicated with the mysterious being sees flashes of light
    around the village and hears noises near his tipi at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man and the mysterious being smoke together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mysterious being tells the man that enemies will attack in the morning
    and has the crier tell the people to keep still and lariat their ponies near their
    tipis.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mysterious being gives the man leggings, instructing that they be put
    on a long pole rather than worn on the legs, because the approaching enemy has
    his buffalo robe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Warriors and braves gather at the man’s tipi for dancing while the mysterious
    being sits among them and tells them how to dance and fight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The warriors are told to ask in the dance for martial achievements, and the
    passage says that whatever they asked they had.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The next day the enemy attacks; a man wearing the buffalo robe is identified,
    the Skidi display the leggings on a pole on the battlefield, and the Skidi overtake
    the enemy and kill many.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mysterious being takes another man far into the southern country to teach
    him powers and tells him to jump between two fighting mountain lions, but the
    man refuses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The mysterious being then sends the man into cedar timber to learn mysteries;
    the man sees two bears, turns back, and does not learn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The mysterious being gives the man seven feathers to take on the warpath,
    saying that if they are stuck in the ground and sprinkled with water, clouds,
    dust, and darkness will hide the warriors from enemies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The mysterious being takes the man into a ravine, shows him an old elk about
    to die, sends him to the elk, and the man learns the secrets of the dying elk.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mysterious being introduces a dance among the Pawnee known as the One-Horn-Buffalo-Dance,
    associated with the greatest warriors of the Skidi band.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After men who formerly talked with him refuse to smoke with him, the mysterious
    being becomes angry, says he will go far away to the north under the North-Star
    and stand as one of the stars, then disappears.
  category: sequence
  evidence_refs:
  - ev:8
