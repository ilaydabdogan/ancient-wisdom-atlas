canonical_text:
  quote: ''
  summary: The passage closes a ceremony involving procession, dancing, gifts, seed
    bundles, and petitions to Tirawa, then gives explanatory notes on elk power, ritual
    implements, initiation, magic food, buffalo, Sun-derived power, White-Crow, Pawnee
    month names, counting coup, thunder-bird or eagle assistance, miraculous conception,
    and beaver medicine power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A procession includes dancing, a scalp dance, making fun, and gifts from well-to-do
    men to old women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first band of girls and women carries seeds on their bundles to show Tirawa
    they retain the seeds given by Tirawa and want plenty of corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The last band of women imitates a successful war party so Tirawa will know
    they want success for their young men and future offerings to Tirawa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Priests return to the lodge, smoke pipes, fold the bundle, hang it at the
    altar, eat meat, and go home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Elk saliva, like the saliva of animals and beings generally, is described
    as a seat of power, with a destructive element; a boy would transfer this element
    by drawing an arrow across his mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elk horn is identified as an instrument to be used as a war-club, while
    the flute reference is explained through the elk’s mating-season whistling and
    the Pawnee courtship flute.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: One note identifies the spirits involved as the spirits of many elk, and another
    says they give strength or magic power of flight.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Telling a war story is described as a chief recounting his war prowess, showing
    authority to assist in initiating a new chief, and setting an example for the
    boy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note refers to miraculous production of buffalo by directing the reader
    to another note.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that magic food retaining its size despite demands made upon
    it is found in many Plains tribes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A fragmentary version says White-Crow was originally human, was driven north
    after trouble in camp, became a storm harbinger, and tried to prevent people from
    getting buffalo.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Pawnee months are listed from March through February with names tied to
    wind, planting, corn, snakes, geese, ducks, leaving something behind, and ice.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: Counting coup includes striking an enemy in his own village and especially
    in his own house.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: A note refers to an incident in which a boy renders assistance to the thunder-bird
