canonical_text:
  quote: ''
  summary: 'A poor grandmother named Spider-Woman and her grandson Burnt-Belly live
    at the west side of the village and survive by gathering fallen corn. Village
    youths mock them. A mysterious man wearing a woodpecker cap falls into a hole
    near their tipi. Crow-Feathers, identified as coyote, discovers him, takes his
    clothing and head-dress under pretense of rescue, leaves him in the hole, and
    uses the disguise to marry a chief’s daughter. The girl notices the birds on the
    head-dress pecking at his head. During a period of hunger in the village, Burnt-Belly
    finds the trapped man; Spider-Woman and the boy pull him out, feed him, and nurse
    him. When stronger, he asks for ash and dogwood poles to make bows and arrows,
    and he and the boy begin killing animals for food: a wood-rat, a rabbit, and a
    fawn.'
  language: English
  quote_policy: summarized
