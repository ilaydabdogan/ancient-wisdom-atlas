canonical_text:
  quote: ''
  summary: The passage describes Thunder-Man's relation to rainstorms, thunder, Lightning,
    and the Thunders; his testing and partial empowering of a poor boy; his later
    role as a medicine-man and priest of rain bundles who interprets thunder for communal
    instructions; and the beginning of a separate tale in which a cruel chief punishes
    three laughing children by confining and abandoning them, after which their dog
    gnaws through the covering and the children begin to escape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thunder-Man sits still during rainstorms, responds to thunder with a motion
    of his head, leaves the lodge, and is gone for several days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The witch-people are afraid of Thunder-Man because they killed his father,
    but Thunder-Man does not touch them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thunder-Man tells a poor boy that he cannot give him power, but can place
    him on a hill and call on the Thunders to take pity on him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When storm, thunder, and lightning surround the boy on the hill, the boy becomes
    frightened and leaves the place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thunder-Man says Lightning will not speak to the boy through thunder, then
    gives him paints and instructs him to draw a rainbow on his forehead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old Thunder-Man climbs onto the earth lodge, wears his robe hair-side
    outward, and tells the people what Thunder says.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thunder-Man tells the people to clean lodges and ground when disease is coming,
    and at other times tells them to bathe their children in the creek because gods
    will visit in the clouds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thunder-Man is described as a medicine-man and priest of all the rain bundles;
    other doctors prevent him from causing thunder and lightning in a medicine-men's
    dance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thunder-Man says there will never again be a flood upon earth because the
    Thunders said so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cruel chief orders the camp to move and forbids people to be outside their
    lodges or to laugh while he goes through camp.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Three little children laugh while playing with their puppy, and the chief
    has the crier announce that they will be punished and left in camp alone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The children are enclosed under a bent willow frame covered with rawhide and
    pinned down so they cannot get out.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The chief's orders include burning scraps of meat, sinews, knives, and other
    things, and pouring water over coals so that there will be no fire.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The children's father is whipped, and the father and mother are later whipped
    away when the camp breaks.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The children's puppy is thrown on the hard ground and killed; later the text
    identifies the creature gnawing through the rawhide as their dog.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: 'The three children are two girls and one boy: the oldest is a girl, the boy
    is next, and the youngest is a girl.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the dog has gnawed a large hole over four days, the youngest girl gets
    out, finds an old knife under grass near a fireplace, and the older girl uses
    it to cut the hole larger so all can get out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The prefatory synopsis says the boy is fed by a mountain lion, taken to the
    lodge of the animals, initiated in their mysteries, rejoins his people after the
    enemy's destruction, and becomes a chief.
  category: sequence
  evidence_refs:
  - ev:10
