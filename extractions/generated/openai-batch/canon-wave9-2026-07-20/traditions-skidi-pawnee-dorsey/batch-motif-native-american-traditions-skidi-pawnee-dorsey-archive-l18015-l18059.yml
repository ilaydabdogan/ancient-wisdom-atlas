canonical_text:
  quote: ''
  summary: 'The passage gives notes on several Skidi Pawnee ritual and symbolic details:
    a buffalo pronounced holy is prepared and taken as an offering to heavenly gods;
    its parts are oriented by north and south meanings at the tipi; decorated ritual
    objects are identified with Tirawa and Tirawa''s power; a sacred bear dance uses
    a cedar tree, bear regalia, drums, and leaders; long sticks are identified as
    probable coup sticks; and shooting stars are described as Tirawa-sent children
    of larger stars who can carry a girl''s prayers to their fathers in the heavens.'
  language: English
  quote_policy: summarized
literal_observations:
