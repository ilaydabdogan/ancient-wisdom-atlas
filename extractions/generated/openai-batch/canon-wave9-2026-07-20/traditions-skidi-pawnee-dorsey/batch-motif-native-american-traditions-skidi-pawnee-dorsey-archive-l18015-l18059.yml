  text: A buffalo pronounced holy is said to be intended as a sacrifice and offering
    to gods in the heavens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the buffalo is killed, its hide, soft parts, and quarters are arranged
    on a pony or horse and taken to the village and the lodge of the priests.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Outside the tipi entrance, the buffalo head is placed toward the north and
    the hind part toward the south; the note explains the north as the home of the
    buffalo and the south as dead man's land.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A handkerchief, face image, downy feather, skull, paint, and bundle are explained
    as representing Tirawa, Tirawa's surrounding darkness, Tirawa's thinking powers,
    and Tirawa's power controlling the bundle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sacred dance is preceded by setting up a cedar tree before the bear-lodge
    and all-night singing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the dance, participants paint themselves, wear bear claws, some wear bear
