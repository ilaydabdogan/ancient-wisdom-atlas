canonical_text:
  quote: ''
  summary: The passage contains the close of a Coyote and Raccoon trick episode, the
    full tale summary and narrative of Coyote and Eagle, and the heading-summary of
    Coyote and Artichoke. Coyote is outwitted by Raccoon at a stream and fails to
    cut down Raccoon's tree refuge with a mud axe. In the next tale, hungry Coyote
    asks Eagle to teach him fishing; Eagle cuts a strip of Coyote's hide into a fishing
    line and gives rules for its use. Coyote first catches fish successfully, then
    exceeds the instruction and calls fish downstream, causing his scalp to be pulled
    off. His family mistakes him for a scalped man, flees, and dies from running.
    A final synopsis states that Coyote bites an artichoke and dies from wind.
  language: English with embedded Latin passages
  quote_policy: summarized
