canonical_text:
  quote: ''
  summary: After the people hunt buffalo and play games in camp, Lightning gathers
    the people, priests, girl with bundle, lance men, and tipi into a sack and carries
    them as he travels. A jealous southeast Star, Skiritiohuts or Fool-Coyote, sends
    a wolf to find Lightning. The wolf steals the sack while Lightning sleeps on a
    high mountain, opens it, and the people emerge. When the true Lightning returns,
    the people kill the wolf. Lightning instructs them to skin and tan the wolf, place
    its hide on the sacred bundle, orient the carcass and hide toward specified directions,
    and explains the relation of east, north, south, death, and long life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people return with buffalo meat, while boys, old men, other men, and women
    play different games in and around the camp circle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lightning says he is satisfied after seeing the people, says his thoughts
    have traveled over the land, and says he must travel in all parts of the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lightning opens a sack; the people, four priests, the girl with her bundle,
    and two lance men enter it, and the tipi disappears before the girl enters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lightning ties the sack, puts it on his back, and continues his journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lightning repeats the same procedure many times, going east, north, south,
    and to many points associated with gods in the heavens, allowing the people to
    erect the camp circle and hunt buffalo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The gods and the Stars in the heavens are satisfied, except for a southeast
    Star named Skiritiohuts, Fool-Coyote, who is jealous of Bright-Star's power and
    of not being consulted.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Skiritiohuts places a wolf on earth and commands it to travel until it finds
    Lightning's tracks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wolf finds Lightning's tracks leading east; Lightning's steps are far
    apart, and buffalo seem to jump out from his moccasins as he lifts his feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wolf finds Lightning sleeping on a high mountain, removes the sack from
    under Lightning's head, and carries it south to bottom land with thick grass.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wolf opens the sack intending to find something good to eat; the lance
    men, girl with bundle, priests, and people come out and begin preparing the camp
    circle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some people bring meat to the wolf, mistaking him for Lightning, and the wolf
    snaps at it and eats it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the real Lightning is seen coming, people warn the camp, guard the girl's
    tipi, catch the wolf as it tries to leave, and kill it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lightning enters the lodge, puts his hands on the girl's head and shoulders,
    and then speaks to the men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Lightning says the wolf came from another power, says the people killed it
    without his consent, and orders them to skin, dry, and tan it and place the hide
    on the sacred bundle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Lightning says that by killing the wolf the people have made themselves liable
    to death, and says that without the killing he might have carried them forever
    as his people.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Lightning instructs that the wolf carcass should lie with its head toward
    the east and that the hide on the bundle should have its head toward the north.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: The passage explains that the carcass points east because the sender of the
    wolf stands a little south of the east, while the hide points north because the
    North-Star is leader and the north is associated with long life and old age; the
    south is associated with death.
  category: relationship
  evidence_refs:
  - ev:10
