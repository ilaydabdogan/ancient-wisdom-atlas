canonical_text:
  quote: ''
  summary: 'A set of notes records Skidi Pawnee beliefs and explanatory traditions:
    corn planting as a sign of divine favor and life expectancy; badger-blood reflection
    divination by moonlight; remarks on priests, chieftainship, warfare, ritual berries,
    Moon-caused black fluid, Pawnee-Cheyenne kinship terminology, Moon/Spider-Woman
    lowering people from heaven with a buffalo-hair rope, a priestly lariat rope,
    baby carriers, animal medicine-men, and shame-related suicide in a Spider-Woman
    spring tale.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first planting of corn is described as a serious performance whose success
    shows whether a person is favored by the gods of the west, especially the Evening-Star.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Failure of the corn seeds to mature is interpreted as an omen of short life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Older people skin a killed badger at night under a bright moon, pour its blood
    into a wooden bowl, and call children to look at themselves in the blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A child seeing itself in the blood with gray hair is expected to live to old
    age; a dark and indistinct image indicates death from sickness; no image indicates
    being killed by an enemy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mud-Bear, father of Roaming-Scout, is identified as a famous medicine-man
    and priest among the Skidi.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Pawnee chieftainship was hereditary and that a chief
    was expected to be peaceful, kind, and helpful to his people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage contrasts successful warfare with chieftainship and gives Crooked-Hand
    as a famous Skidi warrior who was never a chief and wore a robe covered with scalps
    taken by himself.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Red berries are said to be used by the Pawnee, Arikara, and Wichita in certain
    dog-soldiers lodge performances.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A black fluid is said by the narrator to have come from a boy’s stomach, with
    its flow caused by the direct action of the Moon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Pawnee is said to have been considered the father of the Cheyenne and
    addressed as such.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tirawa is said to have made wonderful beings and to have created people, but
    the gods did not know how to place the people on earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Moon, described as a woman, offers a buffalo-hair lariat rope and lowers
    people from her place so they can climb down to earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The last man is afraid to jump from the rope, the last woman stops above him,
    and after she cuts the ropes both fall to the ground holding rope.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After falling, the last woman and last man are turned into large spiders,
    and the Moon is sometimes called Spider-Woman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The black lariat rope is said to have formed the priests’ lariat rope, tied
    with soft downy feathers so that it has magic powers.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Pawnee baby carrier is described as a flat board about three feet long
    and ten inches wide, usually carved in the upper third and fitted with a bow to
    protect the baby’s head.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: The beaver is described as leader of the four-footed medicine-men underground,
    and the owl as leading medicine-man among the birds.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage states that shame making life intolerable and causing suicide
    is frequent in the tales; it mentions an excluded Skidi tale where a youth bathes
    in Spider-Woman’s spring, becomes a hermaphrodite, and takes his own life.
  category: sequence
  evidence_refs:
  - ev:12
