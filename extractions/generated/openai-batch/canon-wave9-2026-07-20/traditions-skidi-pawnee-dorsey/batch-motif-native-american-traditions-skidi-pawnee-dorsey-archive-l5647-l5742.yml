canonical_text:
  quote: ''
  summary: A snake or water-monster swallows the youth’s sister, but thistles grow
    from the monster’s back and the youth and sister emerge. They kill the monster
    with dry thistles; later thistle powers claim and teach the youth’s son, who uses
    thistle power to destroy hostile plant powers and subdue poisonous button-weed
    for medicine-men.
  language: English
  quote_policy: summarized
