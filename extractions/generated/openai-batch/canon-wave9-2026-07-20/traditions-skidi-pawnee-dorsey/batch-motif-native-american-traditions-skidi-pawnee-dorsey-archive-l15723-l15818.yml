canonical_text:
  quote: ''
  summary: Chopisit/Star and Skiriki/Little-Eyes feed the young men Black and White.
    An enemy war-party attacks; Black flees, while White fights. After the girls give
    Black the woman’s war-whoop, Black stops, removes his moccasins and leggings,
    and later disappears amid signs of battle. Little-Eyes follows the enemy, sees
    Black tied before a great fire, and prays to Tirawa, stars, a meteor, and cedar-trees
    to help her rescue her lover.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girls named Chopisit, or Star, and Skiriki, or Little-Eyes, bring bags
    to the young men; Little-Eyes gives Black meat he had previously thrown away,
    and both girls provide food that is distributed among the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scout reports a large approaching enemy force; leaders say all must fight
    and arrange for selected men to run away with the girls, but the girls say they
    can run on.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the attack begins, Black flees, while White stays, fights, kills several
    attackers, takes a horse from one attacker, and catches up with his uncle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Black runs past the girls; they give him the woman’s war-whoop. Later, after
    hearing it again, he looks up, stops, and notices himself dragging his bow on
    the ground.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Black removes his moccasins and leggings and piles them up at the place where
    he stops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girls ride through bottom land, hills, timbered country, and a river area;
    they climb trees or hide in bushes and hear war-cries and shooting.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: White says Black has been killed and suggests going home, where he can marry
    both girls; Little-Eyes refuses and rides back to find Black or cover him if he
    is dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the stopping-place Little-Eyes finds Black’s leggings and moccasins, many
    enemy bodies, blood, broken arrows, and long sticks, but she does not find Black
    and concludes he was captured.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Little-Eyes follows the enemy trail and comes near the enemy camp, where war-dances
    and mourning are taking place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A great fire is made on the north side of the enemy village, and Black is
    set before it with his hands and feet tied.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: At night Little-Eyes cries and asks Tirawa, different stars, a meteor, and
    cedar-trees to help her rescue her lover; the next day she follows the enemy on
    horseback.
  category: action
  evidence_refs:
  - ev:7
