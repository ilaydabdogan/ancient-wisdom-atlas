canonical_text:
  quote: there were two black bears, ready to tear one another to pieces
  summary: A poor boy kills a buffalo and resists a chief who tries to claim it. The
    boy and chief fight, become bears in changing forms, and the boy survives while
    the feared chief is killed with the aid of the boy's horse. The community debates
    the boy's powers, selects him as chief in council, gives him a pipe, and establishes
    him in a new household with the sub-chief's daughter and his grandmother.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: During a march toward buffalo country, a chase is planned, and the boy is
    first to select and kill a buffalo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief claims the buffalo as his own; the boy says he killed it and owns
    it; the chief strikes the boy with a bow, and the boy strikes back with his bow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Witnessing men see the chief and the boy tumble in grass and rise as two black
    bears prepared to fight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The two fighters change into different bear forms four times; at the fourth
    change they are both cinnamon bears, and afterward one is a grizzly and the other
    a cinnamon bear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A horse breaks loose, runs to the cinnamon bear, stamps on it with its forelegs,
    and the bear is killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: When the people approach, they see the boy sitting up and understand that
    the bad chief has been killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boy cuts up the buffalo meat, loads it on the pony, goes home, and unloads
    it at his grandmother's.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The grandmother cries and says the people will kill the boy because he has
    killed the feared chief.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The village discusses the boy's powers and holds a council; some say he may
    become worse than the chief, while others say his poverty means he will be good
    to them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The council decides to select the boy as chief and sends a man to notify him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before going to the council, the boy paints his entire body red and puts bear
    claws around his neck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The boy says the killed chief received powers through storms in the north,
    had a white Crow that guided him to buffalo, and that the crow would now scare
    buffalo away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: At the council, the boy's bear claws swing inside as he stoops to enter, frightening
    people; he is greeted with 'Nawa.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A sub-chief offers the boy a pipe filled with native tobacco and asks him
    to smoke first and become chief; the boy initially refuses, saying he is poor.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The sub-chief says the people will obey the boy, arranges for the grandmother
    to live with his daughter, asks the boy to marry his daughter, and gives a new
    tipi for the couple.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: The boy takes the pipe, smokes, accepts the chiefship, says the snow will
    soon go away, promises fair buffalo hunting and kindness, and tells the people
    not to touch or scold his ponies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: After the council, two chiefs take the boy to his new home, where the girl
    is seated to greet him; a wooden bowl of dried buffalo meat is placed before them,
    and they eat together.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The grandmother eats and sits at the entrance in the place assigned to her,
    and the men report the boy's words to their families.
  category: sequence
  evidence_refs:
  - ev:7
