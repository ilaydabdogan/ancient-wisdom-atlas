canonical_text:
  quote: ''
  summary: A permanent village on the Platte River is threatened by enemies. While
    most men respond to an alarm about raiders, a successful young gambler continues
    playing against a chief's son until the chief's son has lost everything. After
    hearing that the raiders were killed, the gambler gathers his possessions, goes
    west at night to the battlefield, arranges the dead enemy leader and companions,
    dresses them with fine clothing, places a pipe and tobacco before the leader,
    faces east, and mourns through the night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The village is described as a long-standing settlement on the Platte River
    with nearby buffalo and fields, and its warriors bring back scalps, slaves, and
    ponies from other tribes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Surrounding tribes attack the permanent village but are routed, with many
    killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An enemy warrior decides to raid the village for ponies or, failing that,
    to kill women on the outskirts and take scalps; he recruits other men and tells
    them to bring war equipment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men in the village regularly play gambling sticks, and one young man is especially
    lucky and has won many valuable items.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young gambler plays against a chief's son, betting robes, leggings, moccasins,
    quivers, headdresses, tobacco pouches, pipes, and other possessions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an alarm reports enemies in sight and stolen ponies, the other men leave
    the gambling grounds to pursue the enemy, but the young gambler and the chief's
    son keep playing until near sunset.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: By sunset the chief's son has lost everything he had, and the gambler carries
    the winnings back to his lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the lodge, people recount how the enemies were attacked and how the enemy
    leader was killed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young gambler is described as previously uninterested in war parties or
    battle and as focused on gambling, rich in possessions but not happy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Without eating supper, the gambler gathers a spear, war-bonnet, shield, fine
    buckskin shirts, leggings, moccasins, headdresses, and eagle feathers into a rawhide-tied
    bundle and goes west at night toward the place where the enemies were killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The gambler finds a dead man on a hill who appears to be the leader because
    of his dress; the leader's scalp has been removed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The gambler lays the leader with his head pointing west, then brings other
    dead men and places them in a circle, five on the leader's right and five on his
    left, with a boy placed on the east side opposite the leader.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The gambler dresses the leader and the other dead men in buckskin clothing,
    leggings, moccasins, and related garments, alternating between the right and left
    sides of the leader.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After dressing the dead, the gambler lays a long pipe and tobacco before the
    leader, faces eastward, cries and mourns all night, and remains there the next
    day without looking behind.
  category: action
  evidence_refs:
  - ev:10
