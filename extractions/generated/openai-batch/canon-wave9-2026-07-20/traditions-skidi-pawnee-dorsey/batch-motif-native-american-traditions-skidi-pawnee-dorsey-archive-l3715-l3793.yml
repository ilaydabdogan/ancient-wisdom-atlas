canonical_text:
  quote: we are the stars that you see circled in the heavens
  summary: A poor boy goes to a hill intending to die, is led through a tree into
    a lodge of star chiefs, is healed and transformed, receives instructions about
    war offerings and marriage restrictions, returns near morning, and leads village
    warriors toward enemy country.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The boy decides to go away to die and lies down on a high hill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After an unseen voice speaks twice, the boy sees a fine-looking man with long
    hair and a buffalo robe, who says he came to take the boy to his home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man leads the boy to a tree, jumps at it, and disappears; the boy imitates
    him and also disappears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy finds himself in a lodge with men seated in a circle, an errand man
    by the fireplace, and a leader seated in the west.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The leader tells the boy that the circle of men knows he is poor and needy
    and asks him to choose which man he wants to resemble; the boy chooses the man
    who brought him in.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chosen man tells the boy to walk, close and open his eyes, and feel his
    hair; the boy's lameness leaves him, his eyes are good, his hair becomes long
    like the chosen man's, and he receives the chosen man's robe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The leader identifies the men of the circle as the chiefs sitting in the heavens
    and as the stars circled in the heavens, and identifies the errand man as the
    central star.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The leader tells the boy to return underneath the ground to his people, go
    on the warpath, bring a pony and scalp offering to the hill, and delay marriage
    according to a sequence of war successes and bodily consequences.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy finds himself back on the hill near morning and enters a village lodge,
    where people do not know him but notice that he is fine-looking and speaks their
    language.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women in the village send observers and later two young girls sit beside the
    young man, one on each side.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The young man announces that he is a warrior ready to go on the warpath; warriors
    gather bows, arrows, and moccasins and follow him toward the enemy country.
  category: sequence
  evidence_refs:
  - ev:7
