canonical_text:
  quote: ''
  summary: A man brings the chiefs a message from distant buffalo and gathers eagle
    feathers, beads, a black handkerchief, and tobacco as presents. The man, a buffalo-woman,
    and a buffalo boy return to the buffalo; the boy decorates the buffalo with the
    gifts, and the bulls send buffalo to the hungry people. The calf or boy repeatedly
    leads buffalo to the people and later becomes the mediator who carries prayers
    and presents between humans and buffalo. The buffalo-woman returns briefly to
    camp but leaves after the man lies with another woman. The next section begins
    a tale in which a youth becomes a snake after eating marrow and helps his human
    brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At midnight the man asks the chief priest to gather eagle feathers, blue beads,
    a black handkerchief, and tobacco, and to summon the chiefs to his lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man tells the chiefs that he has come from far away with a message from
    the buffalo and that the buffalo asked for presents; if the presents are accepted,
    buffalo will come for the people to kill and eat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chiefs bless the man by pressing their palms on his head and down to his
    hands while whispering thanks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fire is put out, the group leaves in silence, the people hear hoofs, and
    the passage states that the man is human while the woman and boy are buffalo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When they reach the buffalo, the boy ties eagle feathers on the shaggy heads;
    the old bull receives a black handkerchief on one horn and blue beads with tobacco
    on the other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bulls decide to send a small drove with the man and boy; the people are
    told not to kill the calf because it is the man's son and will go after more buffalo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The people find and kill gift-marked buffalo, bring home meat, let the calf
    go, and later see buffalo coming again with the calf in the lead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy offers prayers and tobacco to the whole drove; the woman is later
    allowed to enter camp, where sweet grass and burnt offerings are used, the fire
    is put out, hoofs are heard, and the woman stops at the west altar or holy place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For many days the woman sits at the altar until she becomes used to the smell
    of the people, then takes her place by her husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One night the man and woman go out to the buffalo and offer tobacco and other
    presents; after this the buffalo disappear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the man lies with another woman, the buffalo-woman bellows, wakes the
    people, leaves, and the man later cannot see her, hearing only a reproachful voice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After years of hunger, the calf appears; people make presents to it, and it
    brings buffalo again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage explains that the buffalo bulls allow the people to kill buffalo
    because the boy remains with the buffalo, stands between people and buffalo, carries
    prayers and presents to the buffalo, and leads buffalo to the people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The next tale is introduced with the title of a man who became a snake and
    a synopsis stating that a youth becomes a snake by eating marrow and can assist
    his human brother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the opening of the snake tale, two Pawnee brothers leave a party, get lost,
