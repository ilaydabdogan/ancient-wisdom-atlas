canonical_text:
  quote: ''
  summary: A boy follows a meadow lark for many days and falls into an earth-lodge-like
    place where four old men teach him songs, prayers, bundle rites, and planting
    instructions under Tirawa's command. He receives a bundle containing seeds and
    dried meat, returns home with buffalo following, performs the instructed offering,
    and later becomes a high priest who distributes seeds and teaches songs as the
    people multiply.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy follows recurring ground marks and a meadow lark for many days, trying
    to catch or shoot the bird and sleeping beside it at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a steep bank of earth, the bird flies against the bank and the boy jumps
    and falls into a lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lodge is described as like an earth lodge, with four men at the west end
    and a boy at the entrance who is a meadow lark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lodge contains many parfleches filled with dried buffalo meat, many sacred
    bundles, and dried bladders filled with seeds placed on the bundles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old men say that Tirawa put them there to watch over the boy and gave
    them things to give him; they also say the bird was sent to bring him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old men unwrap a bundle, sing many songs, and teach the boy songs, actions,
    and a prayer addressed to Kurahoos for buffalo and good crops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy is told to carry a bundle containing seeds and to make a digging implement
    from a buffalo shoulder-blade, neck gristle, and a wooden handle, then make hills
    and plant the seeds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy is instructed to open the bundle at his father’s place, sing the taught
    songs, and place meat on a fire so that smoke rises to Tirawa.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The errand boy leads the boy out of the lodge and back toward home, and the
    boy sees many buffalo following them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the boy returns, his parents are glad; he has been gone several years,
    although it seemed to him only a few days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After returning, the boy opens the bundle, sings the songs, makes the meat
    offering, announces that buffalo are coming, and says the seeds will be planted
    for food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The oldest young man becomes a high priest, opens his bundle each spring,
    distributes seeds, and eventually the people plant and keep seeds themselves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The people plant many seeds, become numerous, and the young man teaches the
    songs to the people.
  category: sequence
  evidence_refs:
  - ev:9
