canonical_text:
  quote: ''
  summary: A poor boy who has considered killing himself is directed to a solitary
    dry oak-tree where two speaking owls reveal themselves. The white owl and its
    father give him feathers and hunting instructions. Using the feathers with bow
    and arrows, he becomes a successful night hunter, gains meat and hides, trades
    them for tools, a rifle, ponies, tipi materials, clothing, and later receives
    further owl instruction to acquire ponies before going north.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy is told to go toward home and find a solitary dry oak-tree in the
    center of an open place; the speakers say the tree is their home.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the speech to him, the boy had thought of killing himself; after finding
    the dry tree he cries there all day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night the boy sees two large owls on a limb of the dry tree, one white
    and one red; the white owl is the one speaking.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The white owl says the owls know the boy is poor and wanted to kill himself,
    and says they brought him to the tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The white owl says the two owls are leaders of all owls in the timber and
    go out at night to kill birds for food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The white owl says it will give one feather and its father will give another;
    the boy is told to put the feathers in his scalp-lock, close his eyes, and then
    see plainly at night while animals do not see him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy is instructed to make a bow and arrows, wear the two feathers, kill
    a raccoon, a turkey, an eagle, and several deer, and then return to the owls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman welcomes and feeds the boy; he asks her for a knife and makes
    a bow and arrows, while she obtains sinew and makes a bowstring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the boy puts the two owl feathers in his hair and follows the instruction
    about closing his eyes, he can see plainly at night and kills a raccoon and several
    rabbits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On later nights the boy kills turkeys, an otter, rabbits, an eagle, and several
    deer.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:11
  text: The otter hide is exchanged with a medicine-man for flint-stones, and the
    boy uses flint-stones for arrow-points.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The woman tans deer hides and uses hides to make moccasins; the household
    gains plenty of meat and buckskins.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The boy trades furs and tanned buckskins with white traders for money, knives,
    steel, and a rifle, and later trades for a pony and buffalo hides for a tipi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: When the boy returns to the owls, one owl says they are glad at his success
    and tells him to get many ponies because he will soon leave the country to go
    north.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: After further trading, the boy has many ponies, buckskin clothing, and blankets.
  category: attribute
  evidence_refs:
  - ev:12
