canonical_text:
  quote: ''
  summary: 'A young man attempts to confront and feed a skeleton at a fire but flees
    when threatened, is mocked, and later dies in battle. The passage then introduces
    the Buffalo-Skull Medicine Lodge: ritual leaders wear buffalo elements, smoke
    is offered to a southern being, and a wandering man follows a buffalo-human being
    to a cave where a red-painted buffalo skull rests on sage; after the man prays
    to the skull, a man appears and explains the skull altar and his ability to become
    buffalo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man prepares for a journey, kills a deer, ties the skin and meat to
    his pony, reaches a prior encounter-place, unsaddles and lariats the pony, kindles
    a fire, and roasts meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While roasting meat, the young man says that when his skeleton friend comes
    he will ask it to eat with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dusk the young man hears whistling and then grunting, and he sees a skeleton
    at a distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The skeleton tells the young man to rise and move away, says the place belongs
    to it, and says it cannot allow him to dirty the place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The skeleton carries a club, moves it up and down, and threatens to kill the
    young man if he does not leave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man continues inviting the skeleton, but when the skeleton comes
    close and raises the club, he runs away; the skeleton follows, grunts, and throws
    stones and limbs at him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young man reaches his pony, mounts it, and rides away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Men in the lodge laugh and say that the young man is coming because he has
    run from the skeleton.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young man returns to the lodge before daylight, says he did not feed the
    skeleton because it came at him with a club, and tells the men to keep their things.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Afterward the young man speaks little, is called a coward, rides straight
    into the enemy line during a battle, and is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Buffalo-Skull Medicine Lodge is described as the only medicine-man’s lodge
    in which a buffalo skull served as an altar.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two leading medicine-men wear buffalo tails and buffalo wool, and their heads
    are daubed with white clay so that their hair appears scalped.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the smoke ceremony, smoke is offered to a being supposed to dwell in the
    south.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A man who is always out and away from home sees a mysterious being on the
    Republican River; the being appears as a buffalo and then as a man, repeatedly
    over several days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The man decides to follow the being if it appears again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: While traveling in hilly country, the man follows the buffalo-being over hills
    and into a ravine; the being alternates between buffalo and man and then disappears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The man searches the ravine area and finds a cave.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: The cave is strewn with wild sage; at the altar is a large pile of sage with
    a red-painted buffalo skull upon it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:19
  text: The man rests his hands on the skull, addresses it as Father, says he is poor
    and friendless, and asks for pity.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: A man appears beside the supplicant and says he has heard the speech to the
    skull, that the skull is his altar, that its spirit is ever present with him,
    and that he can become a buffalo.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:21
  text: The appearing man says the supplicant has no animal life in him, that his
    spirit is altogether human, and that animals could not help him in sickness or
    make him brave against enemies.
  category: speech
  evidence_refs:
  - ev:10
