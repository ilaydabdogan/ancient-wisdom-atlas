  summary: The passage contains the close of a bundle-related spirit episode, the
    narrative of Scalped-Man seizing a young girl who escapes by deceiving him into
    diving under water, and a cosmogonic section in which skeptical people come to
    believe that the dead live after encounters with spirits or apparitional women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the spirit and other spirits disappear, the people obtain a bundle;
    the man leaves broken-hearted, is later seen as wild and apart from people, and
    the text states that if he had not held his son so long, spirits and people would
    have lived together again and death would have been unknown.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Scalped-Man has a den beside a creek and decides to find a woman to live with
    him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Scalped-Man waits near the village, seizes a young girl coming from the village,
    and carries her off after she cannot get away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the creek, the girl tells Scalped-Man that if she is to be his wife he
    must wash the sores and scales from his head by diving and rubbing under the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Scalped-Man repeatedly dives under the water; while he remains under longer,
    the girl runs toward home, meets hunters, and is taken home by them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Scalped-Man comes up and finds the girl gone, he laments his sore head,
    later sees her among the hunters, calls for her to return, and the girl refuses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Skidi priests hold annual religious meetings, offer meat and native tobacco
    to Tirawa, and teach that Tirawa is in the heavens, rules over all, and takes
    care of the dead people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some people mock the teachings about Tirawa, and White-Hawk is identified
    as a man who did not believe that dead people lived.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: White-Hawk returns to the village ahead of others, makes a fire and roasts
    corn, hears mysterious voices around the lodge naming him and speaking of dried-meat
    bundles for sacred bundles and dances, and then declares that he believes the
    dead live.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two women who do not believe White-Hawk encounter two women in the dark, one
    with a baby and one with a baby-board carrying a baby; the figures disappear,
    the women become sick, a doctor makes sweet-smelling smoke, and the women then
    believe that dead people live.
  category: sequence
  evidence_refs:
  - ev:7
