canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which a woman and her daughters
    use singing and hooked gambling sticks to detach and destroy an old witch-woman
    clinging to a boy; the witch-woman becomes a burr. It then gives the full tale
    of a hunter who, while pursuing beaver or otter with dogs, encounters a hairy
    subterranean old man in a cave, receives a dream message about old age, and leaves
    offerings at the cave. The passage also begins a tale about an orphan sister and
    brother protected by the chief of the eagles, who gives them representative trees
    and an eagle-feather-covered mound that warns of danger and is tied to their prosperity
    together.
  language: English
  quote_policy: summarized
