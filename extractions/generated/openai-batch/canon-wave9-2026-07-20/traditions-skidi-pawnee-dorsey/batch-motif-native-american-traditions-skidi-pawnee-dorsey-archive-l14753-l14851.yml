canonical_text:
  quote: ''
  summary: A woman follows her son's footprints to a prairie-dog town, where he appears
    among the prairie-dogs but refuses to return. Birds visit her; the red eagle sends
    the magpie, and the birds provide feathers and then bow and arrows to draw the
    boy out so the mother can catch him. The boy later returns with a prairie-dog
    wife. After becoming honored as a protected warrior, he violates his wife's warning
    by lying with a human girl; he and his wife turn into prairie-dogs, and the passage
    states that the Skidi are related to prairie-dogs and derive their mud village
    from them. The passage then begins the next tale, “The Snake-Hawks,” summarizing
    a hawk-wife's elopement with a snake, transformation, underground passage, re-transformation,
    and the founding of the snake-hawk family.
  language: English
  quote_policy: summarized
