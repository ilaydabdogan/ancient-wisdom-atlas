canonical_text:
  quote: ''
  summary: 'The passage closes a Blood-Clot-Boy episode in which a figure disappears
    during a buffalo hunt, is replaced by a blood clot, and then by a young buffalo
    bull. It then begins the Long-Tooth-Boy episode: a hunter finds his burned village
    and dead pregnant wife, removes a living child and the afterbirth, throws the
    afterbirth into the creek, and raises the child. A strange water-dwelling boy
    later appears, plays with the child, identifies himself as the neglected brother
    formed from the afterbirth, and repeatedly escapes into the water when the father
    tries to catch him.'
  language: English
  quote_policy: summarized
