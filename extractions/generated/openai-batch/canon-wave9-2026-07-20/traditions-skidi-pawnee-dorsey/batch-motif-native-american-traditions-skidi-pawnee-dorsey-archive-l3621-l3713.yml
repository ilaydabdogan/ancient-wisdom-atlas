canonical_text:
  quote: ''
  summary: A star-boy repeatedly goes to dangerous places despite an old woman's warnings.
    He defeats or subdues mountain lions, bears, and snakes, turning some of them
    into guardians or useful objects for the woman. His father, the Star, and the
    Sun help him survive the snakes. The boy later joins a village, becomes known
    as a powerful hunter, reveals that his bow is the rainbow and his arrows are stars,
    and disappears on a stormy night, after which people believe he became a star.
    The passage then begins another tale in which a neglected boy is aided by the
    stars, given a condition, disobeys, and is transformed back.
  language: English
  quote_policy: summarized
