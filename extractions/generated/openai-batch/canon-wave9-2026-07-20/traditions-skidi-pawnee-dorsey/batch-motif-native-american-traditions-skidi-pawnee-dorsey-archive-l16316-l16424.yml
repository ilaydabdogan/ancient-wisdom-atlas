canonical_text:
  quote: ''
  summary: Notes explain ritual meanings of animals, feathers, pipes, pipe attachments,
    agricultural implements, bundle terms, owls, visions, priests, and animal materials
    in Skidi Pawnee ceremonial traditions. Several objects are described as mediating
    between humans and deities through sacrifice, prayer, divine origin, or symbolic
    representation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hawk is described as a messenger of the Morning-Star; its skin is found
    in bundles, especially warrior bundles, and it is identified as a destroying-force
    emblem suitable for warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A warrior-bundle otter-skin bandoleer is arranged to carry Mother-Corn in
    front and the hawk behind.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In chiefs' decoration, an eagle feather placed above downy feathers is said
    to symbolize Tirawa standing above white fleecy clouds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pipe is conceived as property of the gods and, in ceremonies, is smoked
    only as a sacrifice to them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A scalp attached to the pipe stem is offered to the gods each time the stem
    is pointed toward the heavens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A string on pipes in sacred bundles is said to symbolize the road between
    men and the gods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Two pipes are mentioned: a red pipe devoted to the sun and a black pipe called
    the moon pipe; bluebird skin is generally attached to each.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bluebird is regarded as a messenger between Tirawa and men and is able
    to carry both sacrifice and prayers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shoulder-blades belonging to Four-Direction bundles are said to have been
    transmitted to earth by gods of the four directions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The term paruxti is explained here as the bundle given by the Evening-Star
    to two First-people and as meaning Wonderful-Being-Concealed; it is distinguished
    from waruxti, earthly mysterious power.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Owls symbolize four powers in the west, identified as four assistants of
    the Evening-Star: Wind, Cloud, Lightning, and Thunder.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage distinguishes dream from vision; a vision occurs while awake or
    in trance and involves communication with a visible visiting being.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: 'Several animal materials are assigned ritual uses: otter as quiver, bandoleer,
    and offering to the North-Star; bear jaw-bone and mountain lion for slaying a
    maiden sacrificed to the Morning-Star; wildcat and coyote skins as coverings for
    two shooters.'
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: A term for an old person learned in rites is explained as meaning more than
    medicine-man and is translated as priest.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Lightning is said to symbolize or personify the combined powers of the four
    gods of the west.
  category: relationship
  evidence_refs:
  - ev:16
