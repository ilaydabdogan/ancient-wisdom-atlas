canonical_text:
  quote: ''
  summary: A man caring for a baby survives by hunting buffalo, feeding the child
    from milk-bags, and hiding with him in caves in mountainous country. In a smaller
    cave, hidden beings identified with animals summon the boy to dance; he disappears
    at night and returns marked with white clay and deer-hoof signs. The father laments
    that the animals have taken the boy but decides to leave him there with prepared
    food so that he may gain animal knowledge. The man then travels west, is awakened
    by an eagle, sees approaching people he thinks are Cheyenne, and plans to take
    ponies and return for the boy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man found buffalo at a stream, wrapped the baby in his robe, hung the
    baby on a tree, and killed a cow with an arrow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man cut out the cow's milk-bag for the child to suck, made a fire, roasted
    meat for himself, and continued killing fresh cows so the child could feed and
    grow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In mountainous country, the man first entered a cave with drawings of people
    and animals and no visible ending, then moved on to a smaller cave in a canyon
    with no wild-animal tracks and made it his home.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man hunted while leaving the child in the cave, brought and roasted meat,
    made robes including a buffalo-calf robe for the child, and the child grew until
    he could talk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man made the boy a bow and arrows, told him to stay close to the cave,
    prepared softened pounded meat, and went to a high mountain to look for people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At night the man heard noises deeper in the cave; the boy said the people
    within wanted him to come dance with them and that they took him there whenever
    the man was away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy disappeared, singing and whistling were heard, and before daylight
    he returned with white clay on his body, deer-hoof marks, sea berries around his
    neck, and deer-string ornaments with hoofs on his wrists and ankles.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: On a second night the boy again left when singing and dancing noises began,
    and the man complained to a Father in the heavens that animals had taken the child
    he had fed on buffalo milk.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man decided not to kill the boy, considered leaving him so that he might
    use knowledge from the animals if found by his people, and prepared more food
    before leaving him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:10
  text: After traveling west to meet the enemy, the man slept on a mountain; an eagle
    touched him and flew away, and he saw many people below whom he thought might
    be Cheyenne.
  category: sequence
  evidence_refs:
  - ev:9
