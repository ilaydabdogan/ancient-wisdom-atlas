canonical_text:
  quote: ''
  summary: A poor boy on a high hill is approached and tested by several bears. After
    he remains despite fright, a father grizzly takes him to a cave in a cedar grove
    where the bears pity him and give him power. The boy chooses a black bear as companion,
    and the grizzly transforms it into a black horse, also directing him to take a
    gray horse. The boy returns to camp with the ponies; the chief tries to take them
    and later makes a claim on the boy's buffalo meat after the boy rides the gray
    horse in a successful hunt.
  language: English
  quote_policy: summarized
