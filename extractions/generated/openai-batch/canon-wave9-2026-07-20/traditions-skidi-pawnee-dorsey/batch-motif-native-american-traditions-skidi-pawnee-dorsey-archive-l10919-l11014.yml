canonical_text:
  quote: ''
  summary: A bereaved chief enters his son's grave and waits silently. Bird sounds
    and a great turkey appear at the grave; the turkey says it and its companions
    killed the young man and intend to use his body for medicines. The chief seizes
    the turkey, which is identified as a suspected witch medicine-man. Under restraint,
    the medicine-man reveals names, secret meetings, bird- and medicine-associated
    methods of killing, and a medicine string. The chief then kills and dismembers
    him, takes the remains home, and prepares to summon the remaining witches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief opens the grave, crawls inside, makes an air hole, lifts and hugs
    his dead son, then sits silently under his blanket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near the grave, the chief hears a horned owl hooting, a whistle, and a wind-like
    sound before a large turkey lands on the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The turkey says it came to take out the young man, cut him open, and take
    fat from his heart for medicines; it also says its power killed him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief reaches through the hole, seizes the turkey by the legs, and finds
    that it is the fat medicine-man suspected of being a witch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief ties the medicine-man with a rawhide lariat and questions him while
    saying he wants to know the names of the killers and the secrets of their power.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The medicine-man names others and describes attacks involving an owl claw,
    mescal, woodpecker and yellowhammer feathers, and turkey wing feathers placed
    in the boy's organs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that four men and one woman belonged to the secret meetings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The medicine-man gives the chief a string containing woodpecker, yellowhammer,
    and turkey feathers, plus small buckskin medicine packets and medicines for killing
    in four ways.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief says he will cut the rope but instead beheads the medicine-man,
    dismembers him, removes organs and skin, makes the remains look like deer meat,
    and takes them home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At his tipi, the chief tells his wife that witches had come to dig up their
    son; he asks her to boil the meat, keep an axe nearby, and sends for the remaining
    witch medicine-men and the man's sister.
  category: sequence
  evidence_refs:
  - ev:7
