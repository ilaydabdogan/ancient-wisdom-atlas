canonical_text:
  quote: ''
  summary: A man is led by a duck-woman to lodges in the water and into an underground
    tipi, where duck medicine people teach him powers, give him mud and feathers,
    and instruct him to make a duck-marked shield. He returns, makes a medicine bundle,
    gathers roots, captures ponies, constructs the shield, and gains renown when arrows
    do not pierce it. Blue-Hawk, another bird-powered man, challenges him to a medicine
    contest. Both prepare with bird-associated materials, fight with poisonous substances,
    die at sunset, and their bodies reveal internal signs of the opposing powers.
    The passage ends with the heading and brief abstract of the next tale about a
    gambler, wind spirits, invisibility, and transmitted power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many grass lodges are said to be in the water; a woman leads the man to a
    tipi, lifts the door, and he enters an underground space where he sees many people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man with mud smeared on his face and head and soft downy feathers on his
    head addresses the visitor as “my son.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says one of their women strayed away, an enemy bird tried to kill
    her, and she brought the visitor there after promising him powers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker identifies his people as medicine people who can cure sickness
    and can kill people by mysterious powers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitor is instructed to make a shield from a bent willow ring covered
    with tanned buffalo cow hide, with no hard material inside, a duck-head mark,
    and mud around the rim.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitor receives fragrant mud and duck-wing feathers, with instructions
    to sprinkle water on the feathers and run them through his hair so rain or fog
    will conceal him from enemies.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The duck-woman leads the man out of the waters to dry land, and he returns
    home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The man wraps the duck-given items in a bundle, gathers herbs and roots, and
    practices sleight-of-hand taught by the ducks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After capturing ponies, the man kills a young buffalo cow, has the hide tanned,
    and uses it to complete the shield with blue mud and a duck head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When enemies attack, arrows shot at the man do not go through the shield,
    even though it has only tanned buffalo hide and no hard interior.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Blue-Hawk, a man with hawk power, becomes jealous of Duck-Man and challenges
    him to fight on the open prairie with medicine and bird-given power rather than
    ordinary weapons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Blue-Hawk prepares with red ointment, hawk feathers in his scalp-lock, hawk
    claws around his wrists, and a buffalo shield with hawk feathers on the rim.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Duck-Man prepares by applying blue mud over his body and head, putting downy
    feathers on his head, and tying thistles, weeds, and flagroot stems around his
    neck.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The two men fight all day by throwing poisonous substances at each other;
    near sunset Duck-Man staggers, Hawk-Man vomits downy feathers, and both die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: When the bodies are opened, hawk claws are found in Duck-Man’s kidneys, while
    Hawk-Man’s throat is filled with downy feathers and dry roots are found in his
    kidneys.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Both men are buried the next day along with their medicine bundles and shields.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A following tale abstract says a generous gambler visits wind spirits at night,
    receives a feather of invisibility, offers captured scalps, and that a chief’s
    son also receives and later transmits power.
  category: other
  evidence_refs:
  - ev:11
