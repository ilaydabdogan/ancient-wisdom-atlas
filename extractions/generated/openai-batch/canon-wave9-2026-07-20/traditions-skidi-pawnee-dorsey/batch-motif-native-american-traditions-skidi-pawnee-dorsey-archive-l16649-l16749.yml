canonical_text:
  quote: ''
  summary: Editorial notes explain names, materials, ritual offices, symbolic objects,
    animal associations, taboos, directional meanings, and several tale motifs, including
    a woman taken to the moon and transformed, ritual mediation of buffalo arrival,
    offerings to northern gods, magical travel indicated by ruined moccasins, the
    south as land of the dead, and buffalo emergence from the earth’s womb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plant medicine is called squash medicine because its vines and fruit are
    thought to resemble squash.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says that a woman in an earlier story may have been a Witch-Woman
    who became a Spider-Woman after being taken to the moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note describes ash as the usual Pawnee bow wood and hedge or Osage orange
    as a southern wood used for some bows, including old Skidi Elk-dance bows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pumpkins and squash were harvested, cut into strips, braided, beaten, dried,
    stored, and later eaten as stew, sometimes with corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mats were used on beds and as floor coverings in earth lodges and tipis.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage refers to another tale in which a poor boy makes a mud horse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sacks of buffalo tallow are described as surplus food stock used in winter,
    pemmican, and boiled jerked meat.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The chief’s crier is distinguished from the priest’s crier and serves as intermediary
    between the chief and the people.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The priest’s crier recites rituals and announces the scouts’ discovery of
    a buffalo herd, and the passage says the announcement has religious significance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says buffalo were supposed to have been driven to the village
    by gods of the north in answer to prayers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A buffalo robe could be turned so the unpainted tanned side was exposed, and
    the note connects this with imitation of the woodpecker and a humble spirit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The expression translated as weeping for mercy is explained as a young man
    approaching an old priest with offerings and asking to be taught mysteries.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Two otter hides are described as offerings for sacrifice to gods of the north.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Two black handkerchiefs are described as typical of clouds, and two clamshells
    as symbolic of the Moon and rain.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: Magpies are described as successful at finding food and associated with the
    near presence of buffalo.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: The destruction of moccasins on a short journey is described as a common Plains-tale
    incident and as a likely sign of a magically compressed extended journey.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: A note explains that a married man might be ceremonially contaminated through
    association with an unclean wife and that odor could make buffalo disappear.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:18
  text: The south of the lodge and the south generally are identified as the land
    of the dead, while the north is identified as the true home of the buffalo.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:19
  text: Burying bones so the skeleton faced south is explained as aligning the calf
    spirit with travel toward the land of the dead and causing buffalo to move south
    from the north.
  category: action
  evidence_refs:
  - ev:16
- id: obs:20
  text: The passage explains a reference as the earth’s womb from which a man brought
    the buffalo.
  category: setting
  evidence_refs:
  - ev:17
- id: obs:21
  text: Lone-Chief is identified as hereditary owner of the Morning-Star bundle and
    as a prominent Skidi chief who told one of the tales.
  category: attribute
  evidence_refs:
  - ev:18
