canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a young man helping the people find buffalo
    and his son succeeding him as prophet after his disappearance. It then begins
    “The Child of the Animals”: a maiden becomes pregnant without sexual intercourse,
    gives birth near a western lake, throws the infant into the water, and later learns
    in a dream that birds and water-associated animals are caring for the child. She
    nurses him for years. The child, later known as Woodpecker, wears bird-adorned
    clothing, evades villagers, lives on an island, and describes its fragrant plants
    and a bow and arrow with magical hunting power. The passage then introduces an
    unusual red coyote whose capture and death the chief makes the condition for marrying
    his daughter; villagers dig covered pit traps for it. A printed synopsis also
    previews later events involving Crow-Feathers, Spider-Woman, and Woodpecker’s
    eventual victory.'
  language: English
  quote_policy: summarized
