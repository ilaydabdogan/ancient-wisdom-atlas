canonical_text:
  quote: ''
  summary: A living man encounters dead spirits who possess a lost bundle and are
    permitted by Tirawa and the gods to return it. The man asks to see his dead son
    rather than take the bundle home. The spirit leader consults the gods and announces
    rules for a meeting between living people and the dead, including silence, non-contact,
    a four-day camp, offerings on the fifth day, and transfer of the bundle. The man
    summons his people, who meet the dead procession near the cave of spirits. When
    the man's son appears, the man breaks the rule by speaking to him, hugging him,
    and refusing to release him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The leader states that he and the others are dead and that what the man sees
    are spirits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leader says the spirits should have gone to Spirit Land, but Tirawa released
    them so they could return the bundle belonging to their people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The leader offers to teach the man the bundle ceremony and tells him to take
    the bundle home to their people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man refuses the offered role because he is seeking his dead son and wants
    to go to Spirit Land where his wife and son are.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: While pleading, the man passes his hands over the leader's head and arms and
    asks the leader to take pity on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The leader burns sweet grass in the fire, opens the bundle, examines its contents,
    takes them outside for the gods to see, and says he will go to the gods in the
    west.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the leader disappears, the others hear the wind descend; the leader
    returns, burns native tobacco from the bundle, and offers it to the gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The returned leader announces that the gods in the west and Tirawa have approved
    a meeting between the people in Spirit Land and the living under stated rules.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rules include four days and four nights of camping without speech between
    the groups, the bundle hung between them, limited contact with the man's son,
    fifth-day offerings, and transfer of the bundle from a spirit high priest to a
    living high priest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man leaves that night, travels with unusual swiftness, reaches the village,
    and has a crier summon the people to meet the dead and recover the bundle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people travel south to a timbered country, camp there, and the man goes
    to the cave of spirits, where he is told how the living should stand and behave.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before meeting the dead, medicine ointment is put on the heads, faces, and
    hands of the living people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The people see a great dust reaching the heavens, then see an old man leading
    a troop with the bundle tied high on a long pole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old man sets up the tipi pole between the living people and the scalped-men,
    and the spirits pass through while the living see their dead friends without touching
    or speaking to them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: When the man's son comes, the man catches him, speaks to him, hugs him, and
    refuses to let him go, although he had been told only to seize, feel, and release
    him without speech.
  category: action
  evidence_refs:
  - ev:8
