canonical_text:
  quote: ''
  summary: After buffalo disappear and hunger spreads, a young chief refuses formal
    pipes and presents until a poor hungry boy petitions him. The chief accepts the
    pipe, scouts find buffalo, and the hunters discover that a white crow is frightening
    the herds away. The young chief tries repeatedly to catch the white crow by transforming
    into dead animals and a fish, but the crow recognizes him. While he cries on a
    hill, a tarantula offers strings and a ball to bind and catch the white crow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people previously had good hunting, but buffalo then disappeared or vanished
    when attacked.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People discussed whether the young man could call buffalo after the earlier
    buffalo-calling chief was gone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pipes and presents were sent to the young chief, but he did not receive them
    at first.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young chief took a poor man’s boy outside the village, fed him by changing
    a broken arrow into dried buffalo gut, and instructed him to speak in council.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In council, the poor boy laid his hands on the chief and asked him to pity
    the hungry people despite having no presents.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief accepted and smoked the pipe after the poor boy’s plea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Scouts found many buffalo, but the buffalo stampeded and the hunters could
    not catch them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hunters saw a white crow swoop down, cry “Kaw! Kaw!”, and scare the buffalo
    into running.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young chief identified the white crow as the cause and said the people
    would starve if he did not destroy it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young chief went to another country and tried to deceive the white crow
    by turning into a dead deer, dead rabbit, dead buffalo, and fish on a tree limb.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The white crow recognized the transformed forms as a man and flew away each
    time.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: After repeated failures, the boy cried on a hill and heard a great tarantula
    speak at his feet.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The tarantula offered strings and a ball so the boy could tie the white crow’s
    feet and catch it.
  category: speech
  evidence_refs:
