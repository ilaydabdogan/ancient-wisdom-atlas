candidate_motifs:
- id: motif:1
  label: Confinement of lightning or storm power by clothing and knots
  taxonomy_refs: []
  basis: Moccasins, an inward-facing robe, a fold, and a lariat knot are all described
    in relation to containing or representing Lightning and storm-divine elements.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is an explanatory note rather than a full narrative episode.
- id: motif:2
  label: Ritual participant embodies a storm being and observes rain taboo
  taxonomy_refs: []
  basis: The decorated leading priest represents Paruxti or Lightning, and face washing
    is prohibited because it would cause rain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The note does not give the full ceremony, only the relevant symbolic detail.
- id: motif:3
  label: Earth lodge as cosmic or heavenly model
  taxonomy_refs:
  - world_center
  - duality
  basis: The described arrangement in the earth lodge mirrors an arrangement in the
    heavens, with west altar, four world-quarter uprights, east opening, and Day-and-Night
    guardians.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The world-center and duality taxonomy links are approximate; the passage
    specifically says symbolic heavenly arrangement and paired Day/Night guardians.
- id: motif:4
  label: Origin of death through frustrated action and animal death
  taxonomy_refs: []
  basis: The note states that through the wolf’s death and the people’s action, Evening-Star
    brings about returns and death is introduced into the world.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The author explicitly says the story does not plainly bring this out and
    that the interpretation is inferred.
- id: motif:5
  label: Animal or bird messenger of celestial deity
  taxonomy_refs: []
  basis: The meadow lark is messenger of Evening-Star, and the bluebird is messenger
    of Tirawa.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives brief explanatory notes rather than a full messenger
    episode.
- id: motif:6
  label: Unconscious guidance to a definite destination
  taxonomy_refs:
  - departure
  basis: A note identifies the idea of a boy being led unconsciously to a definite
    destination and says it is not uncommon.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The underlying episode is not included in this passage; the departure
    taxonomy is broad.
- id: motif:7
  label: Deluge involving irreverent primeval monsters
  taxonomy_refs:
  - flood_and_renewal
  - divine_judgment
  basis: The note states that early earth was peopled by monsters lacking reverence
    toward heavenly gods and links this with the well-known idea of an engulfing deluge.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not narrate the deluge itself; divine judgment is suggested
    by the lack-of-reverence framing but not fully narrated here.
- id: motif:8
  label: Magic flight through space by ball or arrow
  taxonomy_refs: []
  basis: Magic flight through space by means of the double-ball, shinny-ball, or arrow
    is explicitly identified as a recurring idea.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives comparative apparatus and object description, not a
    full flight scene.
- id: motif:9
  label: Prayer transmitted through divine assistants
  taxonomy_refs: []
  basis: Prayers are said to be transmitted to Evening-Star by kurahoos, the four
    gods who assist Evening-Star.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only the transmission mechanism is given in this note.
