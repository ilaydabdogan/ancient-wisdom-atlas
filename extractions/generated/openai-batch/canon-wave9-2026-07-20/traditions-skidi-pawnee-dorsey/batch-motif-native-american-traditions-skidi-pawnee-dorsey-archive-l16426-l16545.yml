  claim: The confinement of Lightning’s power by moccasins is compared within the
    passage to another tale where a buffalo robe is worn hair-side inward.
  claim_level: same_function
  target: another tale with an inward-facing buffalo robe
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The other tale is not identified or summarized beyond this single clothing
    detail.
- id: claim:2
  claim: The passage places this Skidi Pawnee origin-of-death account within a broader
    set of specialized origin-of-death traditions in several Native American corpora.
  claim_level: same_motif
  target: origin-of-death traditions among Cherokee, Zuni, Tsimshian, and Cree examples
    cited by the note
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says this account is not common in American mythologies
    and gives bibliographic comparisons rather than detailed parallel narratives.
