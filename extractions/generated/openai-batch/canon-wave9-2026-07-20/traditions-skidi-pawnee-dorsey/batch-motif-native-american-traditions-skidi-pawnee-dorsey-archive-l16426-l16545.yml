canonical_text:
  quote: ''
  summary: Editorial notes explain ritual and cosmological meanings attached to moccasins,
    folds, knots, lariats, lodge arrangement, celestial beings, animal messengers,
    an origin-of-death episode, deluge traditions, and magic flight by game implements
    or arrows in Skidi Pawnee traditions and related comparative references.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moccasins worn in a specified way are said to confine the power of Lightning
    more closely.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A similar detail in another tale involves a buffalo robe worn with the hair
    side toward the body.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fold is explained as fastening the combined elements of the four gods or
    storms.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Pawnee ceremony, a leading priest wears a black lariat rope with a knot
    hanging behind and thereby represents Paruxti or Lightning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While the priest is so decorated, washing the face is taboo because it would
    cause rain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two guardians in the Pawnee earth lodge are conceived as standing at the outer
    entrance and are called chief and warrior or guardians of the lodge.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ritual arrangement is said to match an arrangement in the heavens and
    to be symbolically represented in the earth lodge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A girl stands at the altar with the bundle in the west, four priests represent
    four uprights and gods of the world-quarters, and two lance men represent the
    east opening and the guardians Day and Night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A communication method is noted as indicating victory and as used by returning
    war parties after a successful attack.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A star is explained as preceding the Morning-Star in winter, and Coyote is
    said to howl at it because he thinks it is the Morning-Star.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The note infers that the wolf’s visit to earth aimed to destroy or supplant
    Lightning and send Lightning back west, but this expectation was frustrated by
    the people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Evening-Star, through the death of the wolf, is said to have brought about
    the return of Lightning and the people, and death was introduced into the world
    through the people’s action.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The meadow lark is described as often being the messenger or errand boy of
    the Evening-Star.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Prayers are described as transmitted to the Evening-Star by kurahoos, identified
    as four gods and assistants of the Evening-Star.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The early earth is described in a comparative note as being peopled by monsters
    who lacked reverence toward the gods of the heavens, and the idea of an engulfing
    deluge is said to be widespread.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A bluebird is presumed and is described as usually regarded as the messenger
    or errand boy of Tirawa.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The double-ball game uses two small buckskin balls attached by a string and
    tossed with slender curved sticks.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: Magic flight through space by means of a ball or arrow is said not to be uncommon,
    and such power is said to be derived from the Sun.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
