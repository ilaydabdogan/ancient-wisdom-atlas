canonical_text:
  quote: ''
  summary: Long-Tooth-Boy and his brother repeatedly enter places their father has
    forbidden. They subdue and bring home a dangerous bear, defeat a man-eating witch-woman
    whose race trap kills the younger brother, restore the brother to life, animate
    the witch-woman’s skin with breath and spider-web, and later escape attacking
    buffalo by flying over them as snow-birds before becoming boys again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father prepares to leave for several days and warns the boys not to go
    to hills with cedar-trees, where young men had disappeared and an animal lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Long-Tooth-Boy persuades his fearful brother to go to the forbidden hills
    and identifies the place as the bears’ home, with the most powerful bear chief
    present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear comes out, throws breath of different colors, and submits after Long-Tooth-Boy
    touches it with his bow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys tie and ride the bear home, pretend it is chasing them, and frighten
    their father; Long-Tooth-Boy says it can pull roots and carry wood, but the father
    later kills it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father next warns the boys about an old witch-woman who kills and eats
    people, and the boys go to her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The witch-woman’s race trap makes victims run ahead toward a deep precipice;
    the younger brother jumps first and is killed.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Long-Tooth-Boy makes the witch-woman take the lead, jumps safely, and blows
    his breath so that her skin and dress separate from her flesh and bones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Long-Tooth-Boy raises the witch-woman’s skin, blows breath into it, ties spider-web
    around its waist, and makes it follow as though alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Long-Tooth-Boy tells his dead brother that he has slept long enough and should
    awake; the brother becomes alive again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boys bring the moving skin home and frighten the father; Long-Tooth-Boy
    says it is only the woman’s skin and can stand in the tipi as a sack.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father again warns of mysterious animals, but the boys go to a prairie
    with high rocks, the home of a young buffalo bull who tells them not to play there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Many buffalo come to kill the boys; the boys climb rocks, and the buffalo
    hook or strike the stones, losing their horns as the stones are reduced at the
    bottom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Long-Tooth-Boy tells his crying younger brother not to cry; both boys stretch
    out, fly over the buffalo as snow-birds, land at a distance, become boys again,
    and return home safely.
  category: sequence
  evidence_refs:
  - ev:7
