- id: obs:3
  text: A young fawn came from the timber near the tipi, and the girl told her brother
    to catch and kill it so she could make a seed sack from it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy followed the deer farther and farther, over hills and into timber,
    until he reached the home of Spider-Woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spider-Woman, described as an old woman, told the boy that his sister had
