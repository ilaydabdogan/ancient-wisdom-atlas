    her and lost awareness of his situation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sister was anxious for her brother, did not eat, and became sick and near
    death from longing for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the seventh day the girl blew her breath on a hill of eagle feathers, and
    the feathers flew into the sky and scattered across the country so the boy might
    find one and think of her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: While hunting, the boy found eagle feathers; each feather stirred his memory
