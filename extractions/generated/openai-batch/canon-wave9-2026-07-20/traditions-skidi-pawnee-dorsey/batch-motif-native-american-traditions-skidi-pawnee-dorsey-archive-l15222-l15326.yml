canonical_text:
  quote: ''
  summary: 'A sister and brother cultivate a field and use trees as lookouts. A fawn
    draws the brother away to Spider-Woman, who falsely says his sister has died and
    keeps him. The sister sickens from longing, scatters eagle feathers by her breath
    so he will remember her, and he returns and cares for her. She then recalls the
    feathers and sends a freezing northern storm that kills Spider-Woman; the tale
    ends with an explanation that people may become sick from longing for absent loved
    ones. The passage then begins “The Meteor’s Child”: a guarded young woman becomes
    pregnant after a meteor passes overhead, and a synopsis states that her child
    is by the meteor, with a later crying test and the descent of the radiant meteor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl made and enlarged a garden into a large field, and the children used
    trees to look over the field while also eating crops and wild fruits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One season the field had tall corn stalks bearing three or four ears.
  category: attribute
  evidence_refs:
