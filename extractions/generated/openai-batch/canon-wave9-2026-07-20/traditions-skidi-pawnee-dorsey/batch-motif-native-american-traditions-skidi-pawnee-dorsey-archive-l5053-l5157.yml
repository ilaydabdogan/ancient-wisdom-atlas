canonical_text:
  quote: ''
  summary: 'The passage first concludes a Long-Tooth-Boy episode: a father warns the
    boys not to approach a steep bank where a fire-breathing animal killed people
    and their mother; Long-Tooth-Boy kills the animal with a thunder-stone given by
    the thunder-bird, after which people return and establish a permanent village.
    The passage then begins the story of a poor orphaned boy who seeks supernatural
    power through solitary wandering and crying; after storms on a high hill he is
    struck and marked by Lightning, travels with a Lightning being in the clouds and
    heavens, returns to the village, and becomes known as Thunder-Man.'
  language: English
  quote_policy: summarized
