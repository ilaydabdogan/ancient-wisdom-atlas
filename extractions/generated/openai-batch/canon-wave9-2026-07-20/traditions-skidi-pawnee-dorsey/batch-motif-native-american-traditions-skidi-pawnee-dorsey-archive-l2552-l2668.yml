canonical_text:
  quote: "“that is the old woman that you see upon the full moon”"
  summary: Two brothers are kept by an old woman/Spider-Woman for a Skull bundle ceremony.
    She attempts to kill them in a dance at a steep bank by summoning storm and freezing
    weather, but they withstand it and are described as snowbirds. They counter-sing
    to make the storm pass and call the Sun’s heat. Grasshoppers from the Sun lift
    the old woman into the sky and place her on the Moon. The brothers then free girls
    from her lodge, and the girls carry seeds to four villages and give them to the
    people.
  language: English
  quote_policy: quoted
