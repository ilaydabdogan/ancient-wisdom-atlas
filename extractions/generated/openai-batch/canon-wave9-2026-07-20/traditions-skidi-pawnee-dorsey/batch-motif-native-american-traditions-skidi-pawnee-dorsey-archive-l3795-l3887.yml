canonical_text:
  quote: ''
  summary: 'The passage concludes an account in which a young man returns to a village
    because he cannot stop thinking about two girls; after a night with them he is
    found again to be poor, lame, blind, and scabby, and a man on the hill reproaches
    him for valuing women over prior instructions. The passage then gives the origin
    of the Few-Buffalo-Dancers Society: a well-to-do man follows a dream-command to
    mourn on a hill with mud on his head, receives instruction from a red eagle from
    the heavens and from a buffalo, prepares a painted buffalo skull and eagle-feather
    wand, learns songs through dreams, and forms the society. The final section begins
    the story of a sick young man who dies, is prepared for burial, rises at the grave,
    returns home, and later becomes prosperous, a warrior, medicine-man, and chief;
    the section synopsis says he visited Spirit Land and returned.'
  language: English with one Latin sentence
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After traveling away from the village, the young man kept thinking about the
    girls who had seated themselves by him and turned back when the company stopped
    for lunch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the young man re-entered the same lodge, word of his return spread through
    the village and the girls again came and sat by him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lodge people spread robes for the young man to sleep on, and the passage
    states in Latin that the girls went to his bed and that he had intercourse with
    both girls before sleeping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning the girls discovered that the young man was again poor, lame,
    blind, and scabby, and both left him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man returned to the hill, where the same man told him that he was
    no longer to be pitied because he had thought more of women than of the previous
    instructions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two girls agreed not to say anything about the young man they had captured,
    and the young man remained dirty, scabby, blind, and lame.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A well-to-do man had a dream instructing him to put mud on his head, go to
    a certain hill, and stand there for many days and nights mourning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the fourth day, many eagles appeared around the mourning man, including
    a large red eagle in front of him.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The red eagle said she was a woman living in the heavens who visits people
    at night and gives them dreams.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The red eagle instructed the man that someone would be sent to him and that
    he should place her feathers on a stick to make a wand, and remain there four
    days.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A buffalo came from the west and said the eagle controlled all animals and
    had sent the buffalo to instruct the man.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The buffalo instructed the man to obtain a buffalo skull, paint it with red
    vertical streaks, place it in his tipi, and put the feather wand in front of it
    so the skull would speak to him in dreams.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The man followed the instructions, made the painted skull and eagle-feather
    wand, learned songs from the wand and skull, and later formed the Few-Buffalo-Dancers
    Society.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The section synopsis for the next story says a young man died, traveled on
    the path of spirits, saw Tirawa in eagle form, met relatives, and was sent back
    to the living world.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: In the narrated opening of the next story, a sick young man died after many
    months of illness, and women mourned over him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The dead young man's mother wrapped him in a new robe, his body was kept overnight,
    and women dug a grave on a hill the next morning.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: When the people laid the young man at the edge of the grave, he moved and
    rose.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: After being untied from the robe, the revived young man returned home and
    later became well-to-do, a great warrior, a medicine-man, and a chief.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
