candidate_motifs:
- id: motif:1
  label: Human-animal marriage or sexual union
  taxonomy_refs:
  - sacred_marriage
  basis: The passage includes a man with a deer-wife, a sexual relationship with a
    buffalo woman, and a separate synopsis titled 'The Man Who Married a Buffalo.'
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The taxonomy label 'sacred_marriage' is broader than the literal wording;
    the passage explicitly supports human-animal marriage or union.
- id: motif:2
  label: Animal-human shape change
  taxonomy_refs:
  - shapeshifter
  basis: Deer figures enter a ravine and emerge as people, and the buffalo-marriage
    synopsis says the human husband is turned into a buffalo and later resumes human
    form.
  evidence_refs:
  - ev:2
  - ev:10
  confidence: high
  cautions: The passage gives more detail for the deer transformation than for the
    buffalo transformation, which is summarized.
- id: motif:3
  label: Animal kin teach human knowledge and arts
  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: The deer family teaches the man plant knowledge, and the man and deer-associated
    figures later teach flutes, sleight-of-hand performances, and songs learned from
    deer to human people.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  cautions: The passage does not call the man a culture hero; that taxonomy reference
    is inferred from his transmission of practices.
- id: motif:4
  label: Mixed animal-human child as mediator or provider
  taxonomy_refs: []
  basis: The buffalo-girl leads buffalo to the village for the people, while the synopsis
    states that the calf, being both buffalo and man, mediates between buffalo and
    humans.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The deer-boy also bridges deer and humans but is not explicitly called
    a mediator.
- id: motif:5
  label: Vision-authorized offering to Tirawa
  taxonomy_refs:
  - sacred_exchange
  basis: A visionary old man gives rules for making the deer family holy and offering
    deer and buffalo to Tirawa, with buffalo offerings linked to dreams.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives ritual instructions but does not elaborate the full
    ritual exchange system.
- id: motif:6
  label: Tasks imposed by animal in-laws before acceptance
  taxonomy_refs:
  - initiation
  basis: The buffalo-marriage synopsis says buffalo herd leaders impose tasks of recognizing
    the calf and cow and winning a race before the human husband is accepted and transformed.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This motif is present only in the synopsis of the next tale, not in the
    fully narrated portion of the passage.
- id: motif:7
  label: Dreaming or magically empowered child/youth
  taxonomy_refs:
  - miraculous_child
  basis: The synopsis begins with a youth who has magical power conferred by the wind,
    and the opening narrative presents a little boy with wonderful dreams.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The boy's later actions are outside the supplied passage, so the motif
    remains preliminary.
comparison_claims:
- id: claim:1
  claim: The passage itself supports grouping these materials under a human-animal
    marriage and animal-transformation pattern, matching the section heading's wording
    about people marrying animals or becoming animals.
  claim_level: same_motif
  target: Human-animal marriage / animal transformation pattern; available taxonomy
    refs include shapeshifter and sacred_marriage
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is a passage-internal classification, not evidence of historical
    contact with another tradition.
- id: claim:2
  claim: The buffalo-child material supports a cautious comparison to a mediator-provider
    pattern in which a mixed buffalo-human offspring enables relations between humans
    and buffalo.
  claim_level: same_function
  target: Animal-human mediator/provider pattern
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The deer-boy and buffalo-girl roles are not identical; the explicit
    mediator statement occurs in the synopsis for the buffalo calf.
- id: claim:3
  claim: The vision and buffalo-negotiation elements support a cautious functional
    comparison to sacred exchange, because animal powers or their representatives
    set conditions under which animals are offered or surrendered to humans.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives ritual and narrative conditions but does not provide
    full ceremonial details.
