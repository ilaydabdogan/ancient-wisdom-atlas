canonical_text:
  quote: ''
  summary: The passage recounts the end of a deer-wife narrative in which a man lives
    among deer, learns plant knowledge, returns with a deer-wife and deer-boy, then
    forms a relationship with a buffalo woman and has a buffalo daughter. Conflict
    between deer/elk and buffalo kin leads to separation, ritual instructions concerning
    offerings to Tirawa, and later transmission of flutes, sleight-of-hand performances,
    and songs learned from deer. The buffalo-girl leads buffalo to the human village
    and may provide a sacred bundle covering. The passage then gives a synopsis and
    beginning of another narrative, 'The Man Who Married a Buffalo,' involving a youth
    with wind-given power, a buffalo wife, a shell gorget, recognition tasks, transformation
    into buffalo form, and a mixed buffalo-human calf who mediates between humans
    and buffalo.
  language: English, with a short embedded Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deer family selected one male to teach the young man, who followed the deer
    from plant to plant and came to understand each plant's use.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deer and young deer entered a ravine and later came out in human form;
    the boy wore buckskin and a fawn skin, and the woman wore buckskin and an elk
    robe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man hunted west of camp, reached a river, and found a new tipi, later
    entering it and meeting a woman wrapped in a new buffalo robe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man stayed several nights with the woman in the tipi and had sexual relations
    with her; she told him to inform his deer-wife, who replied that she already knew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the tipi was absent for many years, it appeared again; a little girl
    ran to meet the man after someone inside called him her father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The buffalo woman said the deer-wife was angry and asked for a meeting between
    the deer-wife and her own people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The deer-woman brought her people and the man to the meeting place, where
    they found many buffalo; the groups fought while the two women exchanged insults.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The buffalo went west and north, while the elk went east and south; the man
    tried to follow the buffalo and his daughter, but bulls identified as the girl's
    grandfathers prevented him and told him to return to his deer son.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the way back, the man had a vision of an old man who instructed him that
    the deer family should be made holy and offered to Tirawa at any time of year,
    while buffalo should be offered to Tirawa only after a dream.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man rejoined his deer-wife and child and stayed with the deer; the passage
    states that the people are related to the deer family and the buffalo.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man periodically visited his people and taught them how to make flutes;
    later the deer-boy returned to the people, and the older man and woman returned
    and taught sleight-of-hand performances and songs learned from the deer before
    dying of old age.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The buffalo-girl leads the buffalo; she repeatedly led buffalo to the village
    so the people could kill many buffalo, and if killed her skin was used to cover
    a sacred bundle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The synopsis of 'The Man Who Married a Buffalo' describes a youth with wind-conferred
    magical power who unites with a female buffalo, leaves a shell gorget, later recognizes
    his buffalo child and wife, performs herd-imposed tasks, is turned into a buffalo,
    returns to human form, negotiates the surrender of buffalo to humans, and has
    a calf who mediates between buffalo and humans.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The opening of the next tale presents a village woman and her son after the
    father's death in battle; the boy has wonderful dreams, and his mother makes bows
    and arrows for him in winter.
  category: sequence
  evidence_refs:
  - ev:11
