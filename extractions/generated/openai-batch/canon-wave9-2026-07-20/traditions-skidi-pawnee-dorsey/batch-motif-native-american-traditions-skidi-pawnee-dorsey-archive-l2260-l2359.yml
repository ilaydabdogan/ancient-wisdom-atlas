- id: obs:4
  text: At a second entrance, rattling and hissing snakes die after the boy strikes
    the ground near them with his club.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bears that come to attack the boy are struck with the club and are revealed
    as skins; another snake near the bedside is killed with the club.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy uses the long stone to wear away the dangerous teeth and washes the
    woman with water from a bladder before marrying her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning snakes and bear robes are found around the lodge; the woman
