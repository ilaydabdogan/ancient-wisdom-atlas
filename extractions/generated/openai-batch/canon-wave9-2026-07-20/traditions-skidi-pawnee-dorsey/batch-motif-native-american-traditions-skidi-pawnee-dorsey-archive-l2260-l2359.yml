canonical_text:
  quote: ''
  summary: 'The passage closes a narrative in which a boy receives a stone from the
    sky, overcomes dangers at a lodge, neutralizes a dangerous woman, and the episode
    is given an etiological explanation. It then begins the narrative of how buffalo
    went south: Tirawa places an original buffalo at the northern place where heaven
    and earth meet; buffalo seek warmer southern country but are blocked by Spider-Woman
    at the center of the earth; named buffalo sons and a tobacco embassy are introduced.'
  language: English with Latin passages
  quote_policy: summarized
