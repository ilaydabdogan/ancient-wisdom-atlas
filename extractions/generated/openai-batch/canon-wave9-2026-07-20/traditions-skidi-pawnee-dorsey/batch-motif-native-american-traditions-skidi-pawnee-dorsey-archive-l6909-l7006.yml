canonical_text:
  quote: "“beneath they found a buffalo. They had made one.”"
  summary: 'The passage closes one tale in which an orphan boy receives public recognition
    after a chief blackens his face and the boy displays a scalp bundle; his elk helper
    then disappears into the rising sun, and the boy returns to his people, marries
    the chief''s daughter, has children, and dies. A new tale begins: a poor boy living
    with his grandmother receives a buffalo robe from the Sun or a man in the south.
    Through a dream-instructed procedure involving an east-side hole, a post, a black
    lariat, shaking the robe, running around the fireplace, and shooting the animated
    robe, the boy and grandmother create buffalo and store meat. Coyote later enters
    after smelling meat and says the nearby village is starving.'
  language: English
  quote_policy: quoted
