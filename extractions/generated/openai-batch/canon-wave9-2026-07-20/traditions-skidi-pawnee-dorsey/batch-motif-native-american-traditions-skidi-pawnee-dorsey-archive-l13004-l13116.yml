canonical_text:
  quote: ''
  summary: 'The passage closes one animal tale by explaining how several animals separated
    after recovering a girl from buffalo and how Coyote came to visit camps only at
    night. It then begins the tale of Coyote and the Rolling Stone: hungry Coyote
    prays to a round stone and offers his knife, finds game, takes back the knife,
    insults the stone when the game escapes, and is chased by the rolling stone. Wild-cats,
    mountain lions, bears, and a whirlwind-man all decline to help once they learn
    the pursuer is a stone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The badger remains in his hole, says he is satisfied after being frightened,
    notes that his claws have grown long, and chooses to live in the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox says he ran fast in fear, no longer wants to be near other people,
    and will make his home in the hills.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The crow declines to join the journey because many buffalo have died and he
    has plenty to eat there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hawk has flown away and is not seen again in the passage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The blackbird says he will return to the place where the buffalo went, feed
    from buffalo chips, sit on buffalo, and leave dirt on their backs as a sign that
    he helped take the girl from the buffalo to her brothers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Coyote goes alone to the brothers after the other animals leave him, and animals
    afterward become shy of Coyote, who becomes scarce among them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote tells the brothers that he found their sister with help from other
    animals and that he will visit their villages at night for food; the passage states
    that since then he is not known to come into Indian camps by day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the next tale, hungry Coyote climbs hills, finds a big round smooth stone,
    prays to it, calls it grandfather, and places his knife on it as a present for
    help getting food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Coyote finds an antelope or deer lying on a hillside, decides he would have
    found it without giving a present, retrieves the knife, and the animal runs away
    when he approaches.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote calls the stone names and says he will keep the knife.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The stone moves and rolls after Coyote; Coyote runs uphill because the stone
    is faster downhill and he can gain on it uphill.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Wild-cats invite Coyote into their lodge but tell him to pass on when they
    learn that a stone is pursuing him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Mountain lions also invite Coyote in, then refuse help when he says the pursuer
    is a stone, and direct him toward bears.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Bears say they can kill anything pursuing Coyote, but after learning it is
