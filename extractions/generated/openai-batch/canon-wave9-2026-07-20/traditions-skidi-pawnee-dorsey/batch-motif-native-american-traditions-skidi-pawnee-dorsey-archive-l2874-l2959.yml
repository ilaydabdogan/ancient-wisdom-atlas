canonical_text:
  quote: ''
  summary: 'The passage closes a buffalo-calling episode in which bones and blood-stained
    earth are buried, people dance and hunt buffalo, offerings of tongue, heart, meat,
    and smoke are made to deities, and the boy Womb disappears to stand in the north
    as Breath or Wind. It then begins the Ready-to-Give/Pahukatiwa episode: a warrior
    is killed and dismembered by enemies, his body cannot be found, and his spirit
    later tells a friend that gods and animals restored him to life, replacing his
    missing brains with duck down feathers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cooked meat is divided carefully so that no bones are dropped; bones and blood-stained
    earth are piled and buried east of the gifts, with the head facing south.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fourth day the people dance harder, scouts report many buffalo, and
    a crier tells the village to attack without fear because the buffalo are to be
    driven by Wind-Who-Stands-in-the-North, or Ready-to-Give.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who does not believe the boy shoots at buffalo, but the animals turn
    into coyotes as they fall or before he shoots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: People bring the best meat to the boy’s tipi, where dancing is taking place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tongue and heart are offered to gods in the heavens, and meat is burned so
    that crows and coyotes will not smell it and frighten the buffalo away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Part of the tongue and heart is burned for Tirawa so that smoke will go up
    to him, because minor gods have helped send buffalo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Buffalo go to the hill where presents are hung, make several circles, and
    move eastward before the people kill and slaughter many of them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The people decide to make a permanent village at a place known as Young-Calf-Standing-on-Hill.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy is called Stitakau, Womb, because when he wants to call buffalo he
