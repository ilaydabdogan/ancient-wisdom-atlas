canonical_text:
  quote: ''
  summary: A boy and his sister leave their possessions, travel by means of balls
    taken from the sister’s bundle, and make a fire by the sister’s breath that brings
    them into her own tipi with her belongings. They arrive near a village, where
    an unrelated man claims the boy as his brother, receives meat, and introduces
    him to the chief. The village is troubled by a mysterious animal that carries
    off warriors during night dances. The boy leads a successful war-party, then devises
    a plan involving a forked willow stick, a willow bed, and a procession of women
    and girls; whoever can tell what is in his mind will become his wife. An ugly-looking
    girl with bushy hair and a sore neck is introduced at the end of the passage.
  language: English
  quote_policy: summarized
