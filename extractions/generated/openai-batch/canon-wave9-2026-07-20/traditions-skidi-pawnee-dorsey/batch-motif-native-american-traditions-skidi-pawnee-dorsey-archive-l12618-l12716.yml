canonical_text:
  quote: ''
  summary: Coyote, disliked because of earlier mischief, seeks help from buzzards
    so he can fly above danger. The buzzards carry him upward but deceive him and
    drop him into a hollow tree. Coyote cuts holes in the tree, uses raccoon tails
    to make wood-gathering women think raccoons are inside, and escapes when they
    chop the tree down. He later kills and eats a baby left on a baby-board, steals
    an absent poor boy's clothing, imitates owl sounds, and enters a chief's lodge
    in disguise, where the final Latin sentence describes him lying with a girl who
    finds his conduct strange.
  language: English with a final Latin sentence
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote knows that people are against him because of his mischief and wants
    birds to give him the power to fly into the sky where people cannot find him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote addresses four buzzards as grandchildren and asks them to carry him
    upward, claiming he wants to look for game to take home to his children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two buzzards scout ahead, and two buzzards place Coyote on their joined wings
    with his hands holding their necks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buzzards instruct Coyote to close his eyes and not open them until told;
    they then fly high with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The leading buzzards stop at the chosen place, and the carrying buzzards split
    apart, dropping Coyote into a hollow log or tree before flying away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the hollow tree, Coyote uses a knife to make holes around the tree
    so he can look out from different places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A traveling company camps in the timber, and women go out with pack strings
    and axes to gather wood for their fire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Coyote cuts raccoon tails from his raccoon-hide quiver and sticks the tails
    through the holes, causing the women to think raccoons are inside the tree and
    to chop it down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the chopped tree falls, the women find Coyote sitting inside; he scolds
    them for tearing down the tree, although the fall is what he wanted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coyote finds a baby left on a baby-board while women gather wood, kills the
    baby, roasts and eats the body, and the woman later discovers the baby's head
    has fallen out of the board.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coyote visits the grandmother of a poor boy and learns that the boy is away
    and has left his clothing in her tipi.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: At night Coyote steals the poor boy's clothing, puts it on, and uses hooting
    sounds to make people believe he is the boy.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: In the final Latin sentence, Coyote enters the chief's lodge and lies with
    a girl rather than going to the wife associated with the impersonated role; the
    girl finds this strange because the boy had not previously behaved that way.
  category: action
  evidence_refs:
  - ev:8
