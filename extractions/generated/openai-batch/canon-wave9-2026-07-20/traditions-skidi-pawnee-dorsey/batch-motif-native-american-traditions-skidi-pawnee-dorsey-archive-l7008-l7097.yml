canonical_text:
  quote: ''
  summary: A boy and his grandmother feed Coyote while secretly producing buffalo
    by means of a buffalo robe. Coyote discovers enough to attach himself to the household.
    The boy marries the chief’s youngest daughter, secretly feeds her with a piece
    of meat that does not diminish, and later brings her to his grandmother’s tipi,
    where storms and wind precede the appearance of Sun images and a sacred bundle
    made from the boy’s bow and arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote visits the boy and old woman, receives roasted meat, and the next morning
    offers to gather wood and bring water for breakfast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy tells his grandmother that they should kill a buffalo before Coyote
    returns.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A buffalo robe is tied by the head to a post and shaken by the tail while
    the boy runs around and kills a buffalo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the buffalo is killed, the meat is skinned, cut up, jerked, stored in
    a cellar, and some remaining meat and bones are hidden in the tipi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote eats meat in the tipi, looks around for more, and concludes that the
    household must have buffalo or fresh meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote says he will make his home with the old woman because his other relatives
    have died; he is also given meat to take home to his people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because Coyote will not leave long enough for another private buffalo killing,
    the boy says he must let his uncle know the secret and change his custom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman cries around the tipi, arranges and shakes the buffalo hide,
    and the boy jumps to the buffalo and shoots it while Coyote is present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Coyote takes meat but returns to the boy’s tipi, stays there, and gains flesh
    while the other villagers starve.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy asks through the old woman to marry one of the chief’s daughters;
    the youngest daughter is chosen for him, while the others dislike him because
    he looks dirty.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy gives his hungry wife a piece of fat or meat and instructs her to
    eat it at night in small bites and then put it away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The wife eats from the piece at night, and it remains the same size; later
    the boy sends meat for her mother and father to eat in turn.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the other girls mock the boy and his wife, the boy takes his wife to
    his grandmother’s tipi and seats her on the south side, himself on the west, and
    the old woman on the northeast.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: A storm blows away the old tipi, another storm follows, and wind enters the
    tipi, goes around, covers the boy, and disappears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The boy has a robe with a picture of the Sun, the back of his tipi also has
    a Sun picture, and a sacred bundle with gourd rattles hangs on the poles; the
    bundle is said to have been made from his bow and arrows.
  category: object
  evidence_refs:
  - ev:8
