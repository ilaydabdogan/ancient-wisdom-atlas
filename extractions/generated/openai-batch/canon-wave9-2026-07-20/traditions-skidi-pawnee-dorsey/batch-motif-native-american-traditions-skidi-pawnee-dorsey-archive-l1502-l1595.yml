canonical_text:
  quote: ''
  summary: 'Lightning is ritually rubbed with buffalo fat, buffalo hair, and red clay,
    then instructs the priests to use sweet grass smoke to bathe ritual clothing and
    objects. Lightning gathers the cloud-beings into a sack and travels west, then
    seeks his brother Ready-to-Give in order to select a wolf so that people will
    not fight and kill one another. A small wolf overhears them, challenges them,
    drives them away, runs south, and dies. Lightning assigns Ready-to-Give winter
    power in the north and himself a western, spring-related course; the wolf’s death
    is linked to a land of the dead, sickness, ritual proclamation, and bundles turned
    south. The passage states that heavenly gods do not die, while people, like wolves,
    become sick and die. Lightning still carries the sack with Clouds and Rain, including
    Rain-Girl, daughter of Tirawa. A new section begins with a synopsis of an origin
    story: a celestial boy is led by a meadow-lark to underground people, learns sacred
    songs, receives a holy bundle with seeds, returns after many years, marries his
    sister, and becomes high priest. The narrated story then begins with Tirawa creating
    a girl and boy, who become parents of a boy who grows quickly and sees forked
    marks on the ground.'
  language: English
  quote_policy: summarized
