    lodge; after he turns over, smoke rises from it.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 1509-1514
  quote_or_summary: The priest exposes his robe, moccasins, feather, and other worn
    items to the sweet grass smoke after shaking them.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 1514-1519
  quote_or_summary: The cloud-beings learn what to do in a future life, enter the
    sack, and Lightning ties it, shoulders it, and goes westward.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 1520-1523
  quote_or_summary: Lightning remains angry with the wolf because death has entered
    the world and people will quarrel and kill one another.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 1523-1528
  quote_or_summary: Lightning journeys north, finds his brother Kauwaharu, Ready-to-Give,
    and asks him to select a wolf to give to the people to prevent fighting and killing.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 1529-1536
  quote_or_summary: Lightning and Ready-to-Give travel to earth, move from a high
    mountain to another mountain and a hill, face south, and discuss a gray wolf and
    a bluish wolf.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 1537-1545
  quote_or_summary: A little wolf beneath the precipice overhears them, thinks they
    mean him, and challenges them, saying he is as powerful as they are.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 1545-1549
  quote_or_summary: The wolf frightens them; Lightning runs west, Ready-to-Give north,
    and the wolf runs south until exhausted and dies.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 1550-1560
  quote_or_summary: Lightning tells Ready-to-Give to stand in the north forever with
    winter power, while Lightning will stand in the west and later travel east by
    way of the south toward spring.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 1560-1563
  quote_or_summary: Lightning says that where the wolf drove them, turned south, and
    died, there will be a land of the dead and people will die of sickness.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 1563-1567
  quote_or_summary: In ceremonies, an old man recites ritual to inform the gods that
    Lightning controls the earth and that all bundles are to be turned toward the
    south.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 1568-1571
  quote_or_summary: The two men ran but did not die, showing that heavenly gods were
    not to die, while people, like wolves, were to become sick and die.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 1572-1574
  quote_or_summary: Lightning still carries his sack with the Clouds and Rain, and
    rain comes from the people in the clouds.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 1574-1579
  quote_or_summary: The girl carried in the sack is the daughter of Tirawa; before
    opening the bundle Lightning addresses his Father; the girl is seen before the
    new moon and is named Rain-Girl.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 1581-1588
  quote_or_summary: The origin synopsis describes a celestial boy led by a meadow-lark
    to underground people, where he learns sacred songs and receives a holy bundle
    with cultivable seeds; he returns after many years, marries his sister, becomes
    high priest, and the people multiply.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 1592-1595
  quote_or_summary: The narrated origin story begins by saying Tirawa first created
    a girl and then a boy; they grew into woman and man, wandered, and the woman gave
    birth to a boy.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: '1595'
  quote_or_summary: The man has a grass lodge, bow, and arrows; the son grows quickly,
    receives a bow and blunt arrows, plays near the lodge, and sees forked marks on
    the ground.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-skidi-pawnee-dorsey.md
  rights_note: Public domain source; summarized.
