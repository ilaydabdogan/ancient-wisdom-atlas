canonical_text:
  quote: ''
  summary: A little bird who has become a young man reveals a transformed tipi, wealth,
    food, clothing, and ponies to his grandmother. He returns to his wife in the chief’s
    tipi, is observed by her family, conceals and then reveals his shining face, and
    is recognized by the village as the bird kept by the old woman. The older sisters
    attempt to displace the wife and lie beside him, after which the couple goes to
    their own tipi. The next day he summons Coyote-Man as runner, invites the chief
    and leading men, feeds them, and declares that he is married among them, comes
    from the sky, and will make the starving people happy.
  language: English with a brief Latin section
  quote_policy: summarized
