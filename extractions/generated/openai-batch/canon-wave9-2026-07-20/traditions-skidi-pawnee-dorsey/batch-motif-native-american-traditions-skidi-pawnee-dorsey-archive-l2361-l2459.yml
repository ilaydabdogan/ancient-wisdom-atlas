canonical_text:
  quote: ''
  summary: In the first episode, the buffalo chief sends his sons to Spider-Woman
    with escalating offers of buffalo in exchange for tobacco. After repeated refusals,
    the buffalo trample her lodge and fields, scatter crop seeds, pull down her cobwebs,
    and trample her into the ground, where she becomes a human-shaped root and vine
    used as squash medicine; buffalo become available more widely. The passage then
    begins and summarizes another account, “The Death of Spider-Woman,” in which Spider-Woman
    poisons and dismembers hunters, Tirawa sends Sun-Youths against her, she is carried
    to the sky and becomes the Woman in the Moon, and edible plant seeds are distributed
    among humankind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spider-Woman, called an old woman in the episode, says she has much tobacco
    but refuses to give any after an offer of one valley full of buffalo.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo chief sends Curly-Eyes, his younger son, as a messenger to offer
    two valleys full of buffalo for a handful of tobacco; Spider-Woman refuses again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young-Bull-with-White-Spot-on-Forehead is sent with an offer of half the buffalo,
    and Curly-Eyes is later sent with an offer of the whole drove.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buffalo move toward Spider-Woman’s place from the north, covering the
    north side before marching southward.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The buffalo chief, angered by repeated refusals, orders the buffalo to rush
    her camp, trample her tobacco and fields, scatter corn, squash, and pumpkin seeds,
    and trample Spider-Woman into the ground so that she becomes a root and vine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The buffalo rush Spider-Woman’s tipi; she tries to redirect them by waving
    objects, but they trample her tipi, corn fields, and possessions, and she disappears
    into the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the trampling, the cobwebs are taken down, the buffalo pass the centre
    of the earth, and the southern part becomes covered with buffalo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that, through this event, people everywhere obtained buffalo,
    and that Spider-Woman became a root and vine associated with squash medicine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The source synopsis of “The Death of Spider-Woman” states that Tirawa sends
    the Sun-Youths, who withstand Spider-Woman’s wild beasts, poison, and storm; grasshoppers
    carry Spider-Woman to the sky, where she becomes the Woman in the Moon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same synopsis states that edible plant seeds entrusted to Spider-Woman
    are distributed among humankind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the opening of “The Death of Spider-Woman,” Spider-Woman lives northeast
    of the villages and poisons hunters by feeding them poisoned food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After poisoning hunters, Spider-Woman cuts off heads, dries brains, strings
    ears on a cord, and sometimes places bodies in a creek where stream animals eat
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: People identify Spider-Woman as the killer, avoid that direction, and she
    then comes to villages, captures many people, and is said to have power from a
    mysterious animal in the earth.
  category: sequence
  evidence_refs:
  - ev:8
