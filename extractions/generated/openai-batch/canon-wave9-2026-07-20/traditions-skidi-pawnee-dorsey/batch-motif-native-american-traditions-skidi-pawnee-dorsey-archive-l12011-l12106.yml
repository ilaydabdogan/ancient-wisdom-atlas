canonical_text:
  quote: ''
  summary: 'The passage first describes Scabby-Bull using a sunrise-facing procedure
    and deer song to affect a boy’s condition, leaving a partial sun image on the
    boy’s forehead and checking but not fully curing a change described as becoming
    a woman. Scabby-Bull then cures another boy injured after crossing a lightning-struck
    place. After Scabby-Bull’s death, his brothers suspect another medicine-man, but
    others attribute the death to lung trouble. The passage then introduces a story
    of Coyote: an editorial synopsis recounts Coyote’s tricks, impersonations, stolen
    robes, misused powers, killings, punishment, burning, and return as a dangerous
    small hairy being. The narrative opening describes Coyote as a hairy, tricky man;
    a poor grandmother and grandson; an unkillable red bird associated with a high
    tree and sunset; the boy’s poverty, hunting, encounter with mysterious beings
    in water, tree-fall injury, recovery, and hunger in the village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Scabby-Bull sings a deer song about the sun and instructs the boy to leave
    the earth lodge, face east, and look at the rising sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sun is high, Scabby-Bull seats the boy in the west of the lodge
    and observes an image of one half of the sun on the boy’s forehead, attributed
    in the passage to a ray from the sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Scabby-Bull tells the boy’s relatives that the boy will not be entirely well,
    but that the process of becoming a woman has been checked.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A second boy sprains and swells his ankle after walking over ground struck
    by lightning, and Scabby-Bull cures him by taking away the power of the lightning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people say Scabby-Bull could do many wonderful things and was like a real
    animal, but he dies.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Scabby-Bull’s brothers want to kill another powerful medicine-man whom they
    suspect of causing Scabby-Bull’s death, but the man is not killed after white
    people tell the chiefs the disease was lung trouble.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The editorial synopsis of the Coyote story says Coyote claims a poor boy’s
    achievement, marries a chief’s eldest daughter in the boy’s place, steals magic
    robes, impersonates the boy, misuses powers, kills helpful or vulnerable beings,
    is burned at the stake, and revives as a small hairy being whose sight causes
    sickness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Coyote lives on the west side of a large village with his family; although
    he is a man, people see hair on his breast and know him as Coyote and tricky.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: An old woman and her grandson live on the south side of the village in poverty,
    using discarded hides and robes and picking up food in the village.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: On certain days a red bird flies over the village and sits on a dry limb of
    a high tree; villagers shoot at it, but it is not killed, and it flies west as
    the red color fades at sunset.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The poor boy reports to his grandmother that he met mysterious beings in the
    water.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: While hunting, the boy climbs after a raccoon, falls when a limb breaks, and
    is cut on the thigh by another limb; later he recovers with a large scar after
    mysterious noises are heard around him at night.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The boy, his grandmother, and the people in the village experience hunger,
    with little meat or corn available to discard or collect.
  category: setting
  evidence_refs:
  - ev:12
