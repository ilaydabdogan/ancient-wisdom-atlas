canonical_text:
  quote: ''
  summary: A gambler-warrior and a chief's son exchange gifts and become close friends.
    The gambler gives the chief's son captured people, ponies, a war-bonnet, and protective
    feather-and-mud medicine. The chief's son later marries a captured chief's daughter
    after twenty ponies are presented. Seeking the gambler's secret power, he repeatedly
    mourns on a hill; the gambler finally leads him at night to the place of the dead,
    where the dead people agree to accept him if he remains alone until morning.
  language: English
  quote_policy: summarized
