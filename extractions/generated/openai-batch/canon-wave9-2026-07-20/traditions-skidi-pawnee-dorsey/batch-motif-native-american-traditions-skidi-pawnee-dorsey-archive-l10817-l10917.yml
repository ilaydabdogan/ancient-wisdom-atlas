canonical_text:
  quote: ''
  summary: An aging chief transfers authority to his son, who sets a later day for
    the buffalo-hunt departure. The people prepare by caching goods. The newly made
    young chief becomes gravely ill, cannot be cured by medicine-men, and dies amid
    suspicions of witchcraft. After mourning, chiefs delay departure and arrange interim
    leadership. The old chief and his family camp apart from the main village; under
    a full moon, the father returns to the old village and opens his son's grave,
    whose construction is described.
  language: English
  quote_policy: summarized
