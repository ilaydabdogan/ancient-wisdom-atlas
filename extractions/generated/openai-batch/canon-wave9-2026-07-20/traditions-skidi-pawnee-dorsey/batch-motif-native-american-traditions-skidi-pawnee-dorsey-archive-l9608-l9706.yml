canonical_text:
  quote: ''
  summary: A wounded Skidi man left on a battlefield is found and guided home by a
    bear-being, who feeds him, carries him across water, shelters him, and teaches
    him bear mysteries and songs in dreams. After reaching the Loup River, the bear
    leaves him near cedar timber. A boy and villagers bring the man home; medicine-men
    remove the arrow from his back. The man smokes a pipe to the rising Sun and toward
    the bear’s place, saying the bear’s power comes from the Sun, and he recovers.
    Later he transmits bear medicine in exchange for gifts and performs a ceremony
    in which his hand becomes a bear paw, is cut off and shown, then is restored under
    a robe while men sing.
  language: English
  quote_policy: summarized
