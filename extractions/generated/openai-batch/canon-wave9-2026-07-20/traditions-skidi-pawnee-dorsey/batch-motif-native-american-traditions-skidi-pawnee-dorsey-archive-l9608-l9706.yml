  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: During many nights of travel, the man dreams of the bear in human form, and
    the bear teaches him bear mysteries and bear-songs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The bear leaves the man on the bank of the Loup River near mountainous cedar-covered
    country and tells him to visit in the timber after he recovers.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A young boy on horseback finds the wounded man, alerts the village, and the
    people carry the man home on a robe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Medicine-men open the wound, remove the whole arrow, wash the man, and put
    dry dust of roots on the wound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man smokes a pipe toward the rising Sun and then toward the west, where
    the bear stopped in the cedar mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man says the bear told him to smoke with the Sun because the bear’s power
    was from the Sun, and he says Sun and Bear have smoked and he will get well.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After this pipe-smoking act, the man begins to improve and becomes well, though
    he continues to whisper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Later, the man asks for robes, dried buffalo meat, and ponies as presents
    connected with teaching his mysteries.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: In a later performance, the man’s hand turns into a bear’s paw while his wrist
    is being cut; the paw is cut off, passed around, returned, and the hand is restored
    under a robe while men sing.
  category: sequence
  evidence_refs:
  - ev:8
