canonical_text:
  quote: ''
  summary: A girl and allied men rescue a burned captive during a dance, hide and
    nurse him in a cave, help him return in disguise to kill his captor and another
    burner, and then flee east with ponies, scalps, war-bonnets, shields, and other
    goods. Near home the young man Black meets a hunter and asks him to help stage
    a pretended attack on their own village.
  language: English
  quote_policy: summarized
