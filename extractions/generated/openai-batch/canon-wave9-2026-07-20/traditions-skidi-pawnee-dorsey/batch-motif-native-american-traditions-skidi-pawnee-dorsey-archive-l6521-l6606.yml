canonical_text:
  quote: ''
  summary: 'The passage opens with a brief closing fragment about a boy postponing
    marriage and the people learning to store corn and pumpkins. It then begins the
    tale “The Boy and the Elk”: an orphan boy, left behind after his poor guardian
    dies, follows the camp trail west while starving. After eating scraps, corn, sinew,
    and sinew taken from arrows in a tree, he collapses. At sunrise an elk appears,
    saying it was sent by the Sun, its father, to rescue and guard him until he becomes
    a great man. The boy rides on the elk’s horns, eats buffalo grass as if it were
    meat, and is brought near the village, where the elk tells him to enter, find
    a poor family, and choose a poor boy as companion. The tale synopsis also states
    that later the boy goes on the warpath, offers scalps to the Sun through the elk,
    is exalted by a chief, and the elk returns to the Sun.'
  language: English
  quote_policy: summarized
