canonical_text:
  quote: ''
  summary: A woman sends her son repeatedly to summon a man she identifies as his
    father. The man denies knowing the boy or his mother until he sees a shell gorget
    on the child and remembers a buffalo cow. He then sees a buffalo cow and calf
    leaving for the hills, follows them, and repeatedly encounters a tipi that appears
    in the evening and vanishes in the morning. The boy mediates between the man and
    his mother. During the journey the cow withholds water from streams, while the
    calf restores the man's strength by whipping him with its tail.
  language: English
  quote_policy: summarized
