canonical_text:
  quote: ''
  summary: A Skidi man hunting west of his village camps near a mound in a timbered
    place. A noisy skeleton with a club threatens him, but he does not flee, invites
    it to eat, disarms and wrestles it, and is called brother. After a pipe exchange,
    the skeleton takes him into a hidden ground lodge, becomes a man-like spirit,
    explains its wind and breath powers, and gives him a whistle, clay, club, and
    medicine instructions. The man dreams of the skeleton-man, returns home with the
    bundle, and later tells the story after others pass pipes to him; a younger man
    claims he can repeat the ordeal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Skidi village is placed on a branch of the Platte River, and one man travels
    west to hunt deer, eventually camping in a timbered area near a mound.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter kills a deer, gathers dry limbs, makes a fire, and roasts meat
    at his camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While roasting meat, he hears mysterious sounds described as a war-whoop,
    grunting, screaming, yelling, and whistling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A skeleton appears in the timber, speaks and yells at the man, orders him
    to leave, and threatens to hit him with a club.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man remains at the camp, says he is not afraid, invites the skeleton to
    eat, seizes the skeleton by the wrist, takes away its club, and wrestles with
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skeleton asks to be released, calls the man brother, says he is the bravest
    man who has come to its place, sits by the fire, and refuses offered meat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man fills a pipe with sumach leaves mixed with tobacco, lights it, makes
    whiffs above and to the ground, and passes it to the skeleton, who smokes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The skeleton says the mound is its home, says it has frightened many men away,
    and asks the hunter to go to its lodge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The skeleton’s lodge is reached through a clump of trees that the skeleton
    parts; they go between the trees into an opening in the ground, where wild sage
    is strewn and the entrance is covered by willows and cottonwood.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside the lodge, the skeleton transforms into a man and speaks as a spirit
    who died there, became a spirit through the winds, travels with the wind, and
    can make people sick and die by blowing breath upon them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The spirit gives the hunter its power and instructs him to wear a whistle,
    spread clay on his body, use the club as his weapon, use bow and arrows only for
    game, heal sickness by breath, and travel swiftly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man sleeps with his bundle for a pillow, dreams of the man in flesh who
    was the skeleton, and in the morning finds the bundle still present.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man returns home, gives the bundle to his wife to hang up, and later tells
    his story in his lodge after several men pass pipes to him.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: After hearing the story of the wrestling and conquest of the skeleton, a young
    man says he can stay there all night and wrestle the skeleton if it comes.
  category: speech
  evidence_refs:
  - ev:9
