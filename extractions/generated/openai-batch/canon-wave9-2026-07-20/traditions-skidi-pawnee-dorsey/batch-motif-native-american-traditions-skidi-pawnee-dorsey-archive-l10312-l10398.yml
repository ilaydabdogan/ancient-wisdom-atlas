canonical_text:
  quote: ''
  summary: A young wife follows an unknown caller under a riverbank into Scalped-Man's
    cave, where stolen goods and sacred bundles are kept. She lives there, gives birth
    with the help of a turtle that emerges from the water, later escapes with her
    baby and a warrior bundle, and instructs her kin to use fires and burning buffalo
    horns against Scalped-Man. The child is taken away after an apparent death and
    later returns as a young man who becomes a successful warrior and leading medicine-man
    named Pitawaruxti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A camp broke up to hunt because the people were hungry; during the journey
    a man quarreled with his young wife, and she went to the village edge crying.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Someone invited the woman to come along; she followed, reached a stream, and
    entered a cave through an entrance under the riverbank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cave contained wild sage, dried meat, brass kettles, corn-pounders, shields,
    spears, quivers, bows, war-clubs, and sacred bundles; the passage says Scalped-Man
    had stolen these things from the people.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Scalped-Man told the woman he lived there and wanted her to live with him;
    she tried to get away but did not succeed, and people searching for her could
    not find her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the woman wanted fresh meat, Scalped-Man went out and returned with a
    whole deer, and he did not allow himself to be away for long.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the birth, Scalped-Man brought a baby-board with a painted head part
    showing the Sun, brass tacks, a buckskin-and-porcupine-quill bow piece, and a
    stout elk string.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the woman was giving birth, Scalped-Man opened a sloping entrance toward
    the water, and a very large turtle came up from the water to assist her; the woman
    gave birth without pain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman escaped while Scalped-Man was away, carrying the baby and one sacred
    bundle, and gave the warrior bundle to her brothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman told the people to make fires around the village and put buffalo
    horns in the fires because the odor would drive Scalped-Man away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Scalped-Man came to the village crying for his child; after the child died
    without being sick, the child was tied to the baby-board and left at the village
    edge, and by morning the child was gone while the board remained.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A young man later appeared, and his mother knew him; the passage says he had
    not died but had been carried off by Scalped-Man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman's brothers became powerful because they carried the bundle, and
    the returned young man led successful war-parties and later performed powerful
    acts in a medicine-men's ceremony.
  category: sequence
  evidence_refs:
  - ev:9
