canonical_text:
  quote: "“My son, you are now to become a great man.”"
  summary: The passage narrates repeated war raids by two boys with an elk helper.
    The orphan boy takes scalps and ponies, gives away spoils, receives instructions
    about sleep and the Sun, obtains a mysteriously painted tipi, and is told by the
    elk to prepare for a leadership ritual involving scalps, chiefs, braves, food,
    and face-blackening.
