canonical_text:
  quote: ''
  summary: A poor orphan boy moves through a village being fed in tipis. When the
    people move on and leave him behind, an elk who calls him son carries and guides
    him. The boy becomes known as the poor orphan, befriends another poor boy, and
    persuades him to leave secretly on the warpath. During the journey the elk communicates
    with the orphan boy, provides spittle that enables the boys to eat grass, and
    leads them toward the enemy camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy enters tipis where people appear to be cooking or eating, is welcomed
    and fed, and continues moving from one tipi to another for food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the people break camp and leave, the boy remains alone at the village
    site.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An elk touches the boy, calls him “my son,” carries him across its horns,
    follows the trail of the people, and drops him near the new village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elk tells the boy to enter tipis as before and be fed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the new camp the boy goes to many tipis and becomes known as the poor orphan
    boy, while the people think well of him and give him food.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the people move west again, the elk tells the boy that many buffalo are
    near, that the people will stay to dry meat, and that the elk and boy should go
    together on the warpath.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Scouts report many buffalo, men kill many buffalo, and the people decide to
    remain at that place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The poor boy joins other boys at play; well-to-do boys dislike him, but one
    poor boy takes a liking to him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The older poor boy invites the poor orphan boy to his tipi, where the older
    boy’s mother welcomes them, cooks meat, and makes a bed of buffalo robes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two boys become great friends, and the older boy is described as several
    years older and as forming their plans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The poor orphan boy proposes that the two boys go on the warpath because both
    are poor; the older boy hesitates because of his mother.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The older boy’s mother permits him to go, says his uncles will care for her,
    and makes moccasins for both boys.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The two boys leave secretly at night from the mother’s tipi, and the younger
    orphan boy leads the way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After several days traveling south, the boys become hungry, their moccasins
    wear out, and the older boy sees an elk on a hilltop.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The orphan boy sits by the elk’s head; the older boy hears the elk rubbing
    its teeth, but the narrative states that the elk is talking to the orphan boy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The elk, the orphan boy, and the older boy go to a place with fine buffalo
    grass.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The orphan boy puts his hand into the elk’s mouth, takes spittle, puts it
    in the older boy’s mouth, and tells him to eat grass; all three eat grass until
    satisfied.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The orphan boy tells the older boy that the elk is his father and that the
    elk will help them go straight to the enemy camp.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: At night the boys lie down while the elk grazes, and the elk sleeps near the
    orphan boy.
  category: action
  evidence_refs:
  - ev:10
