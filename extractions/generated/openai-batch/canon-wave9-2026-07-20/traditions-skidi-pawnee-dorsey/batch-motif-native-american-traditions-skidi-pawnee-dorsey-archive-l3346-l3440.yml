canonical_text:
  quote: ''
  summary: The passage recounts the contrary-speaking Saru warriors, their killing
    of a chief snake and later a water serpent threatening young eagles, the eagle’s
    feather gift, and the final deaths of the last Saru. It then gives a synopsis
    of a girl who marries a star, goes to heaven, attempts to descend to earth, dies,
    and whose protected child becomes a powerful warrior associated with rainbow and
    star imagery.
  language: English
  quote_policy: summarized
