  text: Most Saru are killed in battle, leaving two who remain together.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a buffalo hunt in mountainous country, the people identify a short,
    many-colored snake as the chief snake and warn that it should not be killed; the
    two Saru shoot it to pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the chief snake is killed, snakes come from every direction; people
    flee or climb village arbors and kill snakes with clubs and sticks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two Saru move toward the hills where the snakes are coming from, kill
    many snakes, are bitten without apparent harm, kill a large snake, and then the
    snakes disappear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrative explains the episode as the reason snakes are found everywhere
    upon the land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The two Saru disappear for many days, come to a lake and high hill, encounter
    a cloud over the hill, speak contrariwise about not going on, and continue upward.
  category: sequence
  evidence_refs:
  - ev:6
