canonical_text:
  quote: ''
  summary: A poor boy pities young eagles, is summoned by an eagle, and receives a
    neglected horse that reveals itself as a heavenly being. The horse instructs and
    protects him, transforms into a fine horse, gives him lightning-associated battle
    preparations, and enables him to kill an enemy leader, though others mock him
    and claim the honor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy feels sorry for young eagles whose nest people had tried to reach
    and destroy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An eagle circles over the boy, speaks to him, says it knows his pity and poverty,
    and invites him to come along so he can be helped.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagle leads the boy to the nest tree; a thunderstorm rocks the tree, then
    passes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the base of the tree the boy finds arrows, removes the sinews from them,
    burns the sinews, and eats them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eagle directs the boy to a hill where a horse has been given to him; the
    boy finds a shabby bay horse recognized as a formerly swift horse owned by a chief.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: In a dream the horse tells the boy that it is not common, is from the heavens,
    and made itself sick and ugly so that the boy could own it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horse instructs the boy to wash it daily, hobble it where there is good
    dark grass, and take it to water after travel.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: When the camp moves, the boy sometimes remains behind with the horse; the
    horse later carries him rapidly after telling him to get on its back and shut
    his eyes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy follows a war-party despite being told to return and despite other
    men predicting that his horse will fail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a ravine the horse circles the boy, throws itself down, raises dust, and
    appears as a fine bay horse without blemish when the dust clears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The horse tells the boy to mix clay with water, draw lightning symbols on
    its shoulders and hips, cut an ash-tree limb, and use the stick as a fifth lightning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The horse says it is of the heavens, that clouds and lightning will kill people,
    and that it will protect the boy in battle.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The boy rides through the enemy line, strikes a leader wearing a war-bonnet
    with many eagle feathers, kills him, and returns to his own war-party.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the battle many warriors claim the honor, while the boy says nothing
    until later telling of his experience; his claim is dismissed as something that
    will invite mockery.
  category: sequence
  evidence_refs:
  - ev:9
