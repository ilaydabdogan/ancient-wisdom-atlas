canonical_text:
  quote: ''
  summary: The passage concludes a story in which a young man receives power from
    dead people, visits them with a gambler, uses their counsel in war, becomes chief,
    and passes spirit-given medicine objects through his family. It then begins the
    Scabby-Bull narrative, where two boys hunting birds are led by a magpie and a
    kingfisher toward mysterious places; one reaches the animals' lodge near Pahuk
    Island, while Scabby-Bull follows a deer associated with singing, a woman-like
    apparition, feathers, and a cedar-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mysterious speaker orders the young man to leave and threatens to strike
    and kill him; other groaning beings seem to prepare to attack, but the young man
    does not move.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leader of the dead people calls the young man his son, says he is dead,
    says heavenly gods made him part of the winds, gives him his power, embraces him,
    and sends him home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief's son and the gambler later go to the hills among the dead people,
    who are sitting in a circle; the chief's son sees clothing he had lost while gambling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before war parties, the chief's son or the gambler go to the dead people to
    learn whether there will be success; when no success is predicted, they remain
    behind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two men become powerful in the tribe, and the gambler marries the chief's
    daughter, who is also the boy's sister.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The gambler later leaves with his family and is not heard of again; the chief's
    son becomes chief and keeps the dead people secret.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At old age, the chief tells his wife about the power received from the dead
    people and about a large medicine-bundle containing mysteries and spirit-given
    clothing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old woman tells the children the mysteries; the sons visit the place but
    cannot communicate with or see the spirits, though the inherited objects have
    mysterious power and the sons become warriors and leaders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Scabby-Bull story, two boys hunt small animals; a magpie repeatedly
    screeches and flies a short distance as if leading Scabby-Bull away, while a kingfisher
    leads the other boy along a creek toward Pahuk Island.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At dark the other boy sees mysterious fires coming from the water, hears mysterious
    water-noises and sounds like a medicine-men's dance on the island, sleeps, and
    later finds himself in the animals' lodge.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Scabby-Bull dreams of mysterious performances, wakes near a swamp, follows
    a deer, hears beautiful singing associated with the deer, and sees a woman-like
    figure who disappears; a cedar-tree then stands in her place with downy feathers
    at its base.
  category: sequence
  evidence_refs:
  - ev:10
