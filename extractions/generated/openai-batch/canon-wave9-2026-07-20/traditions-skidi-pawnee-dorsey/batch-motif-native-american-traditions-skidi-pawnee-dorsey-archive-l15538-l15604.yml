canonical_text:
  quote: ''
  summary: The passage describes a public ceremony in which selected boys and girls
    first break the ground with sacred implements, a central fireplace is made, four
    poles are set to represent the world-quarters and gods holding up the heavens,
    sacred bundles are opened with songs and offerings, warriors put on ritual regalia,
    and a decorated skull is carried and danced with to make paths for animals, fish,
    buffalo, seeds, deer, and other animals to come to the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women, men, boys, and girls are summoned because the ground is to be broken,
    and priests identify two young boys and two young girls connected with chiefs
    and braves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four young people are given holy buffalo shoulder-blades and hoes and
    are assigned to the southwest, northwest, northeast, and southeast as the first
    to dig into mother-earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Warriors form four groups behind the children; the digging begins in the northeast,
    includes the other directions, is made four times, and then the people dig four
    feet deep.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A woman who keeps the bundle makes the fireplace in the centre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the next day four long poles are brought by warriors; the four young people
    dig holes, and warriors lift and set the poles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The four poles are said to represent the four world-quarters and to show that
    gods at those stations hold up the heavens.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A crier summons the people and the bundle keepers; bundles are opened ceremonially,
    songs are sung, and offerings are placed at the base of a pole in front of each
    bundle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Owners of warrior bundles open them, anoint themselves with red paint, wear
    eagle feather and otter-hide regalia with corn and hawk attachments, carry willow
    limbs, and some wear mountain lion, wolf, or wildcat hides.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the west, the open skull bundle is present; the skull is waved over sweet-smelling
    grass, washed with running-stream water, painted, marked, wrapped, feathered,
    and set between the bundle and the fireplace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A priest announces that the skull is decorated and that it is time for the
    skull to make paths in the four directions for birds, game, animals, fish, buffalo,
    seeds, deer, and other animals to come to the people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A priest carries the decorated skull in the named directions and dances while
    raising and lowering it as if motioning something to come; a quiet repeated sound
    is heard in the lodge.
  category: action
  evidence_refs:
  - ev:9
