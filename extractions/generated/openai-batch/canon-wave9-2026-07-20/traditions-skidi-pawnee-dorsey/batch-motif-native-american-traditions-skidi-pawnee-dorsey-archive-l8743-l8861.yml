canonical_text:
  quote: ''
  summary: A girl follows her brother, who has become an eagle. Several animal helpers
    attempt to help her capture him by using their exposed bodies as bait while she
    hides nearby. The eagle detects the first traps but is finally caught when he
    tries to eat a wood-rat. He becomes her brother again, later resumes eagle form
    to hunt game and steal seed-corn, and the siblings become prosperous.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl says her brother has turned into an eagle and that they were alone
    in the world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A badger is identified as the man who had tried to help the girl.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young man instructs the girl to hide feet-first in a hollow log while he
    lies nearby with his belly opened as bait; he is later identified as a young fawn
    or deer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eagle comes down with stormlike wind, inspects the bait, sings that a
    trap seems set for him, and flies away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another young man hides the girl in a coyote hole covered with brush and lies
    beside it with his belly opened; he is later identified as a rabbit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The eagle again refuses the bait as a trap, then sees the hoarse, crying girl,
    who says she will follow him wherever he goes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A handsome young man brings the girl to the brush-pile home of the wood-rats
    and arranges for her to hide under the place where the wood-rat lies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eagle accepts the wood-rat as food, bites a piece from the liver, and
    the girl catches his legs with both hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the girl catches the eagle, he turns back into her brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The restored brother tells his sister not to hold him so tightly because he
    will not leave her, and the rat is identified as the helper.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brother secretly becomes an eagle to catch rabbits, and the siblings make
    a fire and roast a rabbit before returning to their tipi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The brother continues bringing rabbits, young deer, and larger game, so the
    siblings have plenty to eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The brother becomes an eagle, goes to the village, steals a bag of corn, and
    brings the seeds to his sister.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The sister makes and enlarges a corn-field from the seeds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage gives an explanation for a saying that lost seed-corn may have
    been carried away by the eagle.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: The siblings become prosperous with meat and corn; later the wandering people
    stay with them, and the chief's daughter goes to the boy's large tipi.
  category: sequence
  evidence_refs:
  - ev:10
