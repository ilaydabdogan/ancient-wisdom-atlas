canonical_text:
  quote: "“When I died I found myself walking toward the east”"
  summary: A man recounts dying, traveling by an eastward road, being lifted in a
    suspended kettle to Spirit Land, receiving directions from figures including swans
    and Tirawa in the form of a golden eagle, visiting a village of relatives, receiving
    gifts and a return command from an uncle, and reviving as his body is prepared
    for burial. The line range then begins the next titled tale, summarized as a youth
    guided by rainbow-bearing skunk-form beings to Spirit Land to revive and return
    with his betrothed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Several men sit around a fireplace smoking and telling warpath experiences,
    and they ask a man to describe what happened when he died and came back to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man says he wants people to know that their relatives are living in Spirit
    Land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dying, the man finds himself walking east on a wide dusty path marked
    by footprints of men, women, and children.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A voice from above stops him, a soot-covered black brass kettle suspended
    by a black lariat rope descends, and he is told to enter it, cover his head, and
    not look up or down while it goes upward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a different country, four men wearing buffalo robes, black lariat ropes,
    red paint, and downy feathers direct him toward swans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A swan tells him that a forked road has a bloody left path for warriors and
    another path leading to the place where Tirawa sits.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Along the road he sees flowers and flower rings, puts a ring on his head,
    and replaces it with another as he goes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: He approaches a knoll from which fire comes; the fire grows around his feet,
    legs, and body, but he continues without fear, and when it subsides he sees a
    large golden eagle identified as Tirawa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tirawa tells him to take the eighth path on the south side, saying it leads
    to the village where his relatives live and is a path traveled by chiefs that
    he has a right to travel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the village, people play games, young men shoot arrows, ponies are present,
    women scrape buffalo hides, and the tipis are new and white.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: An uncle greets him, says he is too young to come because he has not yet been
    a warrior or chief, gives him a robe, beads, a chief title, and feather strings,
    and sends him back to his people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: As people are holding his head and feet to place him in a grave, he moves,
    is untied, stands up well, and says his uncle sent him back.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that the man later became a great warrior, medicine-man,
    and chief of the Pawnee.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The next titled tale is summarized as a youth being guided by rainbow-bearing
    beings in skunk form to Spirit Land, reviving his betrothed there, and returning
    with her to earth.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: In the opening of the next tale, a poor young man and a well-off young girl
    meet and talk; when she wants to marry, he says he must first make a name by going
    on the warpath, capturing ponies, and learning to kill buffalo.
  category: relationship
  evidence_refs:
  - ev:12
