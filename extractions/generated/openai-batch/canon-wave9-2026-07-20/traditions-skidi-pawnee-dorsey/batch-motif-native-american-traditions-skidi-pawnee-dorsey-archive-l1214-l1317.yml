canonical_text:
  quote: ''
  summary: The passage describes Skidi villages arranged by direction for a bundle
    ceremony, the installation and teaching of bundle rites, the placing and replacement
    of Closed-Man's skull on a bundle, and the opening of a subsequent cosmogonic
    narrative in which Tirawa and star beings send Lightning toward the earth with
    a sack containing celestial beings.
  language: English
  quote_policy: summarized
