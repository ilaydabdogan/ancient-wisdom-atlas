- id: obs:1
  text: Villages are described as occupying proper directional positions, and a fireplace
    is made at the center of the village for ceremony.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buffalo tipi and the Calf or Yellow-Calf bundle are placed on the west side,
    and a priest says the bundle is from Tirawa and is connected with making a chief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: People from the villages are told to return with parfleches of meat and to
    cut willows in the timber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men stand in a circle while priests explain the ceremony, and owners of bundles
    are taught ceremonies connected with other bundles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each band comes to the priest with its bundle, receives songs and ceremonies,
    and is then sent out into the world or allowed to remain with Closed-Man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Closed-Man dies, his skull is placed on a bundle so that his spirit
    will have power and remain present with the Skidi people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A tipi pole later breaks the skull on the bundle; the keeper says he had neglected
    a divine command to change the skull, and a ceremony replaces it with another
    skull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before the creation of mankind, Tirawa sends the giant Lightning to explore
    the earth.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Bright-Star commands Lightning to visit the earth, and wind, clouds, thunder,
    and lightning accompany his placement in a cloud.
  category: action
  evidence_refs:
  - ev:7
