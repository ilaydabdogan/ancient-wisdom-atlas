canonical_text:
  quote: ''
  summary: Coyote repeatedly seeks food through powers or tricks involving bodily
    cutting. At home, cuts to his scrotum first produce food but later cause bleeding,
    after which Beaver heals him and removes the power. In another episode, a male
    squirrel produces pecans from a cut scrotum, warns Coyote not to use the power
    often, and later heals Coyote and removes the power after Coyote overuses it.
    The passage ends as Coyote deceives Bear with mud-chapped lips and persuades him
    to allow a cut for fat.
  language: English
  quote_policy: summarized
