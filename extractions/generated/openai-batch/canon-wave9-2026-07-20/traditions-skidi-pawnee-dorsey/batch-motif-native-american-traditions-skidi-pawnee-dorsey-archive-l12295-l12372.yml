canonical_text:
  quote: "“Grow taller! Tree, I say grow taller!”"
  summary: Coyote tricks a boy into climbing a tree, makes the tree grow so that the
    boy cannot descend, puts on the boy’s animal-marked clothing, and claims the boy’s
    status and wife. Birds lower the boy safely in stages; the animated owls on the
    leggings signal his return, and the chief expels Coyote. Afterward, Coyote seeks
    food for his starving children and meets a male beaver who creates pemmican from
    grease and rotten driftwood, then reluctantly grants Coyote the same power.
  language: English
  quote_policy: quoted
