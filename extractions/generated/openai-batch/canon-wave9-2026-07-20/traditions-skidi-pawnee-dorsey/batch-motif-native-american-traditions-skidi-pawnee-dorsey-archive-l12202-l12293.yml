canonical_text:
  quote: ''
  summary: A poor boy is shown to possess the true red bird, while Coyote's claim
    is exposed as false. The younger daughter accepts the boy. The boy later enters
    a deep pond and returns transformed into a handsome young man with bird-decorated
    clothing, proving his identity by a thigh scar. Coyote becomes jealous and begins
    a deceptive hunting scheme intended to get rid of him and steal his clothing.
  language: English
  quote_policy: summarized
