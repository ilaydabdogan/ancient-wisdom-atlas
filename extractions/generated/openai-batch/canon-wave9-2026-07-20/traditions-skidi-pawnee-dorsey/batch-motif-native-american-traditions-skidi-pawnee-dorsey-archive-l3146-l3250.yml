  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage names Coyote but does not explicitly call him a trickster;
    the taxonomy assignment is based on the boundary-crossing animal-intruder pattern
    in this passage.
- id: motif:2
  label: Initiation into secret bundle ceremony by mysterious beings
  taxonomy_refs:
  - initiation
  basis: A sleeping boy is brought from the village, told that mysterious beings will
    teach him bundle secrets, serves them for years, learns the ceremony, and is sent
    home to perform annual rites.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the instruction as learning ceremony rather than using
    the word initiation.
- id: motif:3
