canonical_text:
  quote: ''
  summary: 'The passage recounts Coyote disturbing two blind old men, being hunted
    and killed by them, and his hide being made into a quiver placed on a sacred bundle.
    One old man later brings a sleeping boy through a moving stone entrance, and the
    boy learns the bundle ceremony before returning home to perform it annually. The
    blind men are later taken into the heavens beside Tirawa. A following section
    explains a skull bundle: the first man''s skull is placed on a bundle so his spirit
    remains with the people; after the skull breaks and darkness comes, priests replace
    and decorate it, after which the Sun returns. The passage closes with a heading-summary
    about holy corn stolen from a warrior bundle and recovered.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote struck two blind old men and tried to get the crow to assist him; the
    crow refused and laughed at Coyote.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blind men first accused each other of striking, then noticed the blows
    seemed hairy and suspected an animal was present.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The blind men took spears and divided their search around the lodge by east
    and west directions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stone addressed as Grandfather moved when commanded, opening and closing
    the entrance while preventing Coyote from escaping.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The blind men thrust spears into the lodge, heard Coyote moving and breathing,
    struck him in the side, and killed him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The blind men said their bundle lacked a coyote quiver, skinned Coyote, discarded
    the carcass, and kept the hide.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Coyote’s hide was made into a quiver for bow and arrow, but it never contained
    bows or arrows and was placed on the sacred bundle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: One old man went out at night through the moving stone and brought back a
    sleeping boy from the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy was told mysterious beings had brought him there to teach him the
    secrets of the bundle.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy waited on the two blind men for many years, learned the ceremony of
    the bundle, and was sent home with the bundle on his back to perform annual ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The blind men stayed in the rock until it was time for them to rise in the
    east, then were taken into the heavens and placed beside Tirawa.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some sacred bundles are said to contain coyotes or coyote quivers because
    the two men ordered those things to be in the bundles.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The first man created owned the skull bundle, taught songs and ceremony, and
    instructed that his skull be put on the bundle after death so his spirit would
    be present with the people.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: About a year after the first man was buried, his skull was taken from the
    grave, replaced there by a wooden skull, decorated, and tied to the bundle.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The bundle owner had a vision telling him to replace the skull with the skull
    of a certain buried chief, but he was afraid to change it.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: A fallen tipi pole broke the skull, and the day turned dark; priests gathered
    and decided to obtain the other skull.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: Priests opened the bundle, sang, exchanged the old skull pieces for the other
    chief’s skull, and decorated the new skull.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: When the sky-blue circle was put on the skull, a white spot appeared in the
    heavens; when decoration was completed, the Sun appeared and the sky cleared.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: The decorated skull bore an upright soft eagle-feather, a sky-blue semicircle
    on the forehead, black tanned buckskin around the head, a red-painted face, and
    downy feathers in the cheeks.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:20
  text: The next section heading-summary states that an ear of holy corn is stolen
