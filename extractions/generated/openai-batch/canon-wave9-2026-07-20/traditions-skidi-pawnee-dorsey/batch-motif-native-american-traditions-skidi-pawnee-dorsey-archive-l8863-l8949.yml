canonical_text:
  quote: "“I now wish to be changed into a man. I am now an eagle. I carry messages
    for Tirawa.”"
  summary: A chief consents to an eagle boy’s marriage and later installs him as chief.
    In the next tale, a poor old woman finds a young eagle in a buffalo wallow and
    raises it as her grandson. The eagle asks to marry a chief’s daughter; the youngest
    daughter accepts him while her elder sisters mock him. The bird leaves at night,
    instructs his grandmother to prepare a tipi frame and not look during a storm,
    and is then revealed as a handsome young man with special clothing, a sun-painted
    robe, pipe, tobacco pouch, and bundle.
  language: English
  quote_policy: quoted
