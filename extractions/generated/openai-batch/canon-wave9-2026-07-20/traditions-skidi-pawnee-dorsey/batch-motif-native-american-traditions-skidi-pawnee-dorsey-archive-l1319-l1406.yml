canonical_text:
  quote: ''
  summary: Bright-Star equips Lightning with a whirlwind-shaped sack, a black lariat,
    wonderful moccasins, and instructions to travel by cloud and across the completed
    earth. Lightning descends in cloud and thunderstorm imagery, scouts the earth
    for the people, opens the sack on a western mountain, and cloud-transformed people
    emerge to form a camp circle. A tipi is erected for the girl and her bundle, and
    priests later hang Lightning’s sack above the sacred bundle.
  language: English
  quote_policy: summarized
