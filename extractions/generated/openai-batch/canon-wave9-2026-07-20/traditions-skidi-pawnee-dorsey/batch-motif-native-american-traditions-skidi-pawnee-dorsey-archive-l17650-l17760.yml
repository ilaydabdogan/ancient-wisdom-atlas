canonical_text:
  quote: ''
  summary: The passage records several Pawnee suicides and reported statements that
    those who take their own lives do not enter Spirit Land, while those who die in
    battle travel a bloody road to the warriors’ home. Later notes describe ceremonial
    objects and implements, preparation of scalps, and a tradition in which Spider-Woman
    or black-tail deer appear as women, are revealed by shadows with deer ears, are
    connected with the Moon, and give a black lariat rope to men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pawnee man whose five wives died in succession stayed by the last wife’s
    grave and shot himself in the forehead with a pistol.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older people said the man who killed himself would not go to Spirit Land;
    they contrasted this with battle death, which leads by a bloody road to Spirit
    Land where warriors meet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man with consumption asked for a butcher-knife under the pretext of
    trimming his fingernails and killed himself by stabbing himself in the heart several
    times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indians said the young man with consumption would wander over the earth and
    could not go to Spirit Land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1881 nine young men killed themselves in one summer; the stated causes
    were the disappearance of buffalo, the loss of a road to enemies’ country, idleness,
    discouragement, and loss of reason to live.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: English-speaking Indians and older people told young men that suicide was
    wrong or unknown to the Skidi, that suicides were not received in Spirit Land,
    and that death by an enemy gave a right to the bloody road of warriors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Medicine strings of buckskin were worn by medicine-men and priests, and giving
    away the medicine string was described as virtually giving away the power to inflict
    death.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Notes identify a hard shield frame made from shrunken buffalo-bull neck hide
    and describe scalps stretched on willow rings and tied to willow sticks.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: A hunter nearing a stream of water thought of a woman, saw her before him,
    and recognized by her shadow with moving deer ears that she was a deer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hunter shot at the deer-woman, the deer hopped away, the hunter became
    sick, and medicine-men burned a root for him to inhale.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Many men were said to have similar experiences with black-tail deer that turned
    themselves into women; the test was to look at the shadow for moving ears.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The black-tail deer are said to be under the Moon’s influence, called statatciks
    or Deer-Ears-Spider, and associated with deer turned into women who communicated
    with men and gave them a black lariat rope for sleight-of-hand.
  category: relationship
  evidence_refs:
  - ev:8
