canonical_text:
  quote: ''
  summary: 'The passage closes one Coyote episode in which a boy discovers Coyote''s
    trick, reports it to the chief, and Coyote is bound and burned, after which he
    is associated with a small hairy Mysterious-Being in the timber. It then begins
    the tale ''Coyote Rescues a Maiden'': four brothers keep their sister in an earth
    lodge and use her swinging presence to draw buffalo; a synopsis states that the
    girl is carried off by buffalo, changed into a ring, stolen back by Coyote with
    animal helpers, and restored. The narrative opening shows Coyote visiting the
    girl while her brothers are away and trying to persuade her to sit in the swing.'
  language: English
  quote_policy: summarized
