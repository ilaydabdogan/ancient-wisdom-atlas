canonical_text:
  quote: ''
  summary: Tirawa sends two Morning-Stars to earth as blind old men living in a stone
    lodge with ceremonial bundles and weapons. Human sacrifices are to be made to
    the Morning-Stars through these bundles. A crow repeatedly steals meat from the
    blind men and shares it with Coyote. Coyote enters the lodge, steals meat, and
    the two old men accuse each other.
  language: English
