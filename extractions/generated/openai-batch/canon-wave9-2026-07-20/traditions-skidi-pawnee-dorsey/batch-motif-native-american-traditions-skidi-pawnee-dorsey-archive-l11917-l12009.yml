canonical_text:
  quote: ''
  summary: Scabby-Bull takes Warrior to a secluded holy place, tests his willingness
    to undergo choking and hanging ordeals, displays animal-associated powers during
    a deer hunt and at a pond, and later performs a curing rite for a ten-year-old
    boy called Half-Man-and-Half-Woman using medicines, deer songs, dancing, and markings
    associated with fawn skin, the heavens, deer, and the moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Scabby-Bull takes Warrior hunting and tells him that he will bring him to
    a holy place and that Warrior must obey if he wants to know Scabby-Bull's secrets.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The holy place is reached through a thicket, reeds, and bulrushes; it is a
    cleared circle with a central fireplace containing soft downy feathers instead
    of fire, and a fawn skin is taken from the west side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Scabby-Bull runs around the circle with the fawn skin, Warrior hears
    noises like many young deer in the circle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Scabby-Bull places a black buffalo-hair lariat with soft downy feathers around
    Warrior's neck and pulls it as if to choke him; Warrior is not frightened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Scabby-Bull says Warrior will do, and says the deer noises have told him that
    he will still live for some time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Scabby-Bull next makes a noose, tells Warrior to put his head through it,
    attempts to draw him up on a limb, and asks the animal gods to take pity on him;
    the passage identifies this as a test of Warrior's willingness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the hunt, Scabby-Bull tells Warrior not to shoot until Scabby-Bull
    sees him again; Warrior sees a deer, prepares to shoot, looks away, and then sees
    Scabby-Bull standing where the deer had been, laughing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a great pond, Scabby-Bull dives and brings up a large catfish; Warrior
    dives but finds no fish; Scabby-Bull smokes a few whiffs from his pipe to the
    fish and returns it to the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The parents of a ten-year-old boy called Half-Man-and-Half-Woman ask Scabby-Bull
    to cure him and promise robes, clothing, and ponies as presents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the lodge, Scabby-Bull and Warrior place their medicines west of the fireplace,
    place the boy east of it facing west, have the lodge swept and emptied, and remain
    with the boy.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: At night Scabby-Bull and Warrior sing deer songs, dance, and hop around until
    the boy imitates them and follows them outside; they circle around in an open
    place and return to the lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After re-entering the lodge, the boy has many white spots on his back against
    a black background, described as representing the fawn skin and the heavens.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that the marks showed Scabby-Bull that the deer and moon
    had left the boy and that the womanish feelings had gone out of him.
  category: other
  evidence_refs:
  - ev:8
