canonical_text:
  quote: ''
  summary: A young man named Black refuses to take the girl away secretly and says
    he will come at dawn to ask her parents according to custom. Both households prepare
    through fathers, errand men, male relatives, gifts, and a priestly escort. At
    dawn Black washes, enters the girl's lodge, waits near the entrance, and is accepted
    by her male relatives through a pipe ritual, a pony gift, instructions to treat
    her well, and an invocation of Tirawa for children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man says he will come at dawn to the girl's lodge to ask her parents
    for her and that presents must be sent to her relatives if they accept him as
    son-in-law.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl wants to go with him, but he refuses, brings her to the entrance
    of her lodge, embraces her, and sends her inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl's father sits by the fire, questions her early return, understands
    the meaning of dawn, and blesses her by laying his hands on her head and drawing
    them down over her shoulders and arms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Black tells his father that he wishes, according to custom, to enter the lodge
    of Little-Eyes and marry her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Black's father summons the young man's uncles; they sit in a circle around
    the fireplace, and the chief also attends.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Black's male relatives offer more than twenty ponies and many robes and remain
    in the lodge until dawn telling war stories.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At dawn Black washes in the creek, returns to his lodge, and is led by a priest
    through the village to the girl's lodge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the girl's lodge, a mat, buffalo robe, and two cushions have been placed
    north of the entrance for the old man and Black.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the old man and Black first sit near the entrance, they leave; fire
    is kindled, an errand man summons the girl's male relatives, and those relatives
    sit in a circle around the fireplace.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young male relative says Black has made a clear path to the lodge, has not
    come by night to steal the daughter, and has come led by the high priest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same young male relative says Black should be sent for, seated in the
    lodge with the daughter beside him, and given food to eat with her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young male relative holds the pipe to Black and says that by taking it
    Black accepts their daughter; he also gives Black a spotted pony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A coal is placed on the pipe bowl, and Black and the old man smoke; afterward
    the pipe is emptied and returned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young male relative tells Black to treat the daughter well, kill many
    buffalo for her relatives, and says Tirawa will give Black and the daughter many
    children.
  category: speech
  evidence_refs:
  - ev:8
