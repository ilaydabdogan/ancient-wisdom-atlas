literal_observations:
- id: obs:1
  text: The note says that killing birds by causing them to dance with their eyes
    closed is a common incident in Coyote tales of North American Indians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a variant, Coyote sees a beaver cut off and consume its own paws and then
    restore the members by bathing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coyote imitates the beaver's act four times, but on the fifth time loses his
    paws.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dangerous big water has a bad ford where people have lost ponies and dogs,
    and where some people have disappeared in the water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The turtle goes into the big water and dives with the men on its back while
    the boy remains by the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men later appear to the boy and say they were taken into the big water
    by a turtle, that many people are under the water, and that they are now children
    of the turtle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men instruct the boy to tell the people that those crossing the water
    must throw in presents to the turtle or give ponies to the water so that they
    may cross safely.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the message is delivered, people throw native tobacco, robes, feathers,
    and other desired gifts into the big water and can then cross safely.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Warriors give ponies to the water, and the ponies go under and do not come
    out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A young man visits the water alone, the dead warriors come and speak with
    him, and he becomes a prominent man among his people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The note identifies a five- or six-hole flute as widely distributed in North
