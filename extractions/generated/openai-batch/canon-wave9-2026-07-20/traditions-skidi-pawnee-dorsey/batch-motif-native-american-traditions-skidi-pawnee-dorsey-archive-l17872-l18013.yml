canonical_text:
  quote: ''
  summary: Editorial notes to several Skidi Pawnee tales identify narrators, variants,
    and cross-tradition parallels. The passage includes notes on Coyote incidents,
    an extended variant in which a turtle takes warriors under dangerous water and
    receives offerings for safe crossing, and brief notes on a courtship flute, blue
    beads as raindrops and heavens, and a Woman-and-Horse tale involving death and
    a dream prophecy.
  language: English
