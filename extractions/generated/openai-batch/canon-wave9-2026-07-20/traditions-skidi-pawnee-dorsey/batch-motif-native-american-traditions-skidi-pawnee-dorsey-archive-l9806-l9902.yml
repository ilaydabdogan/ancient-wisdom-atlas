canonical_text:
  quote: ''
  summary: The passage closes a war-power episode in which a boy associated with a
    bear robe returns home, is discussed by relatives and allies, predicts an enemy
    attack, fights successfully, and refuses chiefly anointing. It then begins “The
    Elk Medicine,” whose introductory synopsis describes a deserted boy raised in
    the wilderness, received in a cave of animals, given elk power and insignia, and
    later teaching elk-dances; the narrative opening describes Pawnee migration, selection
    of a young chief, marital conflict, rejection of a baby boy, and the father’s
    westward departure with the child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two returning men approach a large campfire and hear that a brother’s placing
    of a bundle caused enemies to turn back and attack two men, saving the others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two men enter camp, surprise those present, and one man reports what the
    boy had done before they travel on toward the village at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man asks to make friends with the boy because he has seen the boy’s bravery
    and the bear robe from which bullets fell; the same man hopes to learn the secret
    of the boy’s power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the boy is thankful because he has no power and the
    other man has the power of a scalped-man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy enters his lodge while everyone is asleep, finds his bed empty near
    the entrance, hangs his bear robe over a pole above the bed, lies down, and sleeps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The next morning the people find the boy in bed with the bear robe hanging
    above it; his father questions him, and the boy says he has nothing to say.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy later tells the visiting man that enemies are in sight and the village
    will be attacked; the next morning the visiting man paints himself and puts on
    feathers, and enemies are seen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the attack, the man with scalped-man’s power goes out first, while
    the boy sits by the fire for a time before putting on the bear robe and fighting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy kills the foremost enemy on the south side, kills more enemies, and
    the enemy force flees while villagers pursue and kill many.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the battle the boy marries; chiefs summon him for anointing, but he
    refuses to be made chief because he has killed many enemies and fears he may become
    angry and kill someone.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The introductory synopsis of “The Elk Medicine” describes a boy deserted by
    a jealous mother, raised in the wilderness by his father, received in a cave of
    animals, and given elk power and insignia.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The same synopsis says the youth instructs his people in elk-dances.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Pawnee migrate north to a stream of water, prosper with many buffalo,
    and later move south after their chief dies.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The people select the deceased chief’s son as a new young chief, and he has
    two wives after marrying another woman during the southward journey.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The young chief’s mother-in-law and older wife do not speak to him; at the
    new wife’s tipi, the wife throws a baby boy into his lap.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The father puts the baby on his back, remains behind, vows to care for the
    child and die if the child dies, and travels directly west instead of following
    the people south.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
