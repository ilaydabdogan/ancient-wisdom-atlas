candidate_motifs:
- id: motif:1
  label: Animal robe as protective war power
  taxonomy_refs: []
  basis: The boy’s bear robe is associated with bullets falling from it, and he later
    wears the robe when he kills enemies in battle.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage does not explain the origin of the bear robe or explicitly
    state the mechanism of protection.
- id: motif:2
  label: Alliance sought to obtain esoteric power
  taxonomy_refs:
  - sacred_exchange
  basis: A man asks to make friends with the boy because he wants the secret of the
    boy’s power, while the boy is thankful because the man has scalped-man power.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage shows an intention to gain knowledge through friendship, but
    it does not narrate a completed exchange or ceremony.
- id: motif:3
  label: Warrior foreknowledge before attack
  taxonomy_refs:
  - wisdom
  basis: The boy tells the visiting man that enemies are in sight and that the village
    will be attacked; the attack occurs the next morning.
  evidence_refs:
