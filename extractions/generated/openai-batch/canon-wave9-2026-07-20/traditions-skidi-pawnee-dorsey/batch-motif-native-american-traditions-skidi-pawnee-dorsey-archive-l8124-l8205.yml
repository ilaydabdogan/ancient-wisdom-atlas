canonical_text:
  quote: ''
  summary: A boy follows war-parties after receiving instructions from a horse that
    changes from an old or poor horse into a fine gray horse. In battle the horse
    outruns the warriors, the boy performs decisive attacks, and then horse and rider
    return unnoticed to the women’s camp, where the horse appears old again. Other
    men claim or receive the honors. Before a second expedition, the horse appears
    in a dream, instructs the boy to obtain a spear, and foretells four campaigns
    with increasing kills.
  language: English
  quote_policy: summarized
