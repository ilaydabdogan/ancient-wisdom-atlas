canonical_text:
  quote: ''
  summary: Hikuleo comes from Pulotu, adopts Lupeolovalu, and takes her to Pulotu.
    Hikuleo sets the south and north winds to guard the opening to her land. Mataikamoana
    voyages through the opening, is reported to Hikuleo by Atupuhaimoana, and is accepted
    as a wooer. Lupe is brought by a named vessel with the gods to Tonga, but Mataikamoana
    later visits Mapuikaufanga instead. Lupe flees back to the gods' vessel, asks
    for Mataikamoana and Mapuikaufanga to be killed, and the gods kill them and return
    to Pulotu.
  language: English
  quote_policy: summarized
