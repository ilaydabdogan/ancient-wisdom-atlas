canonical_text:
  quote: ''
  summary: A handsome young man, Taufaiteau, seeks the beautiful sisters of Tongoleleka.
    Guided by a god, he goes down to Pulotu, receives instructions, returns to earth,
    faces a marriage condition, kills a lion and later a guardian serpent, wins Tukukovikaealu
    through a falahola flower token, consults his kin, and marries her. Their son
    Havili later grows into a brave hunter, swims far from home to Fiji, and meets
    an old wizard who invites him to drink kava.
  language: English
  quote_policy: summarized
