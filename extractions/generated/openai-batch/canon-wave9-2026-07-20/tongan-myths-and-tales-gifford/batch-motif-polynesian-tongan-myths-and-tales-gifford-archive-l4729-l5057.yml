canonical_text:
  quote: ''
  summary: A chant and prose explanation tell of Ila and Hava, sisters and co-wives
    of the chief Naaanamoana. After a fishing prohibition is lifted, Hava discovers
    a stone-covered hole or crevice full of fish and brings large fish to her husband.
    Ila becomes jealous, follows Hava, opens the hole, and releases the fish. Hava
    tries to prevent their escape by pulling at named islands, places, and a casuarina
    tree, but the fish rush and turn, causing inlets, beaches, and shore indentations.
    Later chant lines mention receiving fish, escape into lagoon or sea, net-casting,
    a speaker turning into stone, and a presentation to Tui Ahau.
  language: English
  quote_policy: summarized
