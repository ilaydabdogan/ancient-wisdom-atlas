canonical_text:
  quote: ''
  summary: 'The passage gives a layered cosmological verse, then introduces three
    short Tongan cosmogonical tales: a divine genealogy linking gods and chiefly lines;
    a variant genealogy of Heimoana, the Maui, Hina, and the Tui Tonga; and the beginning
    of a tale in which shapeshifting travelers reach a sky-dwelling woman whose twins
    seek a land-hauling fishhook.'
  language: English
  quote_policy: summarized
