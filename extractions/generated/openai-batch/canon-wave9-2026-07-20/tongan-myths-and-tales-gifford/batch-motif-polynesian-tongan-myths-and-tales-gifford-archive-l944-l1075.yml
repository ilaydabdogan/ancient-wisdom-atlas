comparison_claims:
- id: claim:1
  claim: The passage compares Takataka’s divine genealogy with published tales of
    the Maui, stating that Faingaa’s descent from the Maui is corroborated while Loau’s
    derivation from Hikuleo lacks corroboration.
  claim_level: same_motif
  target: published tales of the Maui and other Tongan genealogical traditions mentioned
    by the collector
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only reports the collector’s comparison and does not include
    the external tales themselves.
- id: claim:2
  claim: The passage compares Lomu’s genealogy with most versions, noting that Lomu
    treats Maui Motua, Maui Atalanga, and Maui Kisikisi as brothers, while most versions
    treat them as grandfather, father, and son.
  claim_level: same_motif
  target: other versions of the Maui genealogy in Tongan tradition as summarized by
    the collector
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the relationship among the three Maui
    and gives no detailed account of the other versions.
