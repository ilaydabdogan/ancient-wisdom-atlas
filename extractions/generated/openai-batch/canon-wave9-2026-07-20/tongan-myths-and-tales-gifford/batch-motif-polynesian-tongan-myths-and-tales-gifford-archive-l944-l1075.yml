candidate_motifs:
- id: motif:1
  label: stratified sky and underworld cosmos
  taxonomy_refs: []
  basis: The opening verse organizes the cosmos into the sky, underworld, and multiple
    numbered skies with distinct inhabitants and phenomena.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a poetic excerpt, and no full explanatory myth is given
    for the sky levels.
- id: motif:2
  label: divine genealogy legitimating chiefly lines
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: The first and second tales trace chiefly dynasties, especially the Tui Tonga,
    to gods or divine lineages.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage also notes that some genealogical claims lack corroboration.
- id: motif:3
  label: twin and sibling unions as progenitors
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  basis: The first genealogy repeatedly uses sibling and twin marriages to produce
    major divine lineages, and the third tale features twins who seek land.
  evidence_refs:
  - ev:3
  - ev:11
  - ev:12
  confidence: high
  cautions: The twin births and twin marriages appear in separate tales within the
    passage.
- id: motif:4
  label: cosmic domain allocation among divine powers
  taxonomy_refs: []
  basis: Taufulifonua divides the universe by assigning the sky, this world, and Pulotu
    to different divine figures or lineages.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the allocation briefly and includes an overlap in the
    rulership of this world.
- id: motif:5
  label: mapped road to the world of the departed
  taxonomy_refs:
  - afterlife_journey_map
  basis: Pulotu is identified as the world of the departed, and its path is located
    between named islands with a named rock landmark.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: No detailed journey narrative to Pulotu is included here.
- id: motif:6
  label: serpent-incarnate goddess
  taxonomy_refs:
  - serpent
  basis: Heimoana is explicitly called a goddess whose incarnation was the sea snake.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not describe actions performed in sea snake form.
- id: motif:7
  label: conception caused by touch
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Maui Kisikisi touches Hina’s chest, after which she becomes pregnant and
    bears a sequence of children.
  evidence_refs:
