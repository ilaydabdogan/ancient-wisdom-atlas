canonical_text:
  quote: ''
  summary: The passage contains adjacent Tongan narratives. In one, Tui Tofua takes
    Vehivehi to Tofua, where they live in a cave and commit murders until Vehivehi
    kills Tui Tofua; later two captured women kill Vehivehi with his own axe after
    he orders them to make fire. In another, Fakapatu, god of Moungaone, lives in
    a sea cave whose roaring spray annoys Tui Tofua. Tui Tofua tries to swallow Fakapatu,
    but Fakapatu turns into a small fish, enters Tui Tofua’s stomach, grows larger,
    and forces Tui Tofua to promise that sharks will not harm Fakapatu’s people.
  language: English
  quote_policy: summarized
