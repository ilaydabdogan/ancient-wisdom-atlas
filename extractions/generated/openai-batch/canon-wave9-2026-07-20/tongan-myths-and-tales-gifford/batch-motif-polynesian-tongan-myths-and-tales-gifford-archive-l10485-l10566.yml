canonical_text:
  quote: ''
  summary: A childless couple has a stone-child, which grows and is cast into the
    sea. Sinilau follows sweet-smelling blossoms across the sea to an island, finds
    Tokelauhakotaha in a mirror-lined iron cave, and lives with her. Their two sons
    later swim to another land, survive an attempted killing by Hikuleo's people,
    reveal their parentage, and are recognized. Sinilau and Tokelauhakotaha are fetched,
    one son is made king, and the land's customs are changed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A couple repeatedly wishes for a child; the woman becomes pregnant and gives
    birth to a stone while her husband is away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stone is treated as the couple's child, grows larger, is kissed by both
    parents, carried away by boat, and thrown into the sea; a hurricane is blowing
    when the man returns.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Sinilau and his followers see the sea covered with sweet-smelling blossoms
    while riding breakers; after the followers object to searching, Sinilau swims
    away to find their source.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sinilau swims until his own land disappears and another land appears; a great
    wave carries him to the shore, where he covers his nakedness with a creeping plant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The new land is covered with sweet-smelling blossoms and contains a shining
    large iron cave lined with mirrors.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sinilau enters the cave, finds a beautiful naked girl sleeping, tests whether
