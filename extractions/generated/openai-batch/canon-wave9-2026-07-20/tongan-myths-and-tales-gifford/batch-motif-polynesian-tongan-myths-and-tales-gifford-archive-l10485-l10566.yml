    herself Tokelauhakotaha, and says her mother was a stone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tokelauhakotaha and Sinilau live together; she bears two sons named Mailefihinoahefatai
    and Mailetuuone.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The two sons play sika near the end of the island; their cane spears go into
    the sea, and they swim after them until another land appears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the other land, the children find Hikuleo taking kava; she orders them
    placed in a bowl and cut up to be eaten raw, but bamboo knives slide off their
    skins and cannot cut them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The children cry out that Sinilau is their father and Tokelauhakotaha is their
    mother; Hikuleo takes one child on each knee and orders drums and conch shells
    sounded.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sinilau's sisters hear the drums and conch shells, learn of Sinilau's two
