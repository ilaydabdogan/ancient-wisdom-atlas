canonical_text:
  quote: ''
  summary: In Pulotu, Hikuleo investigates the destruction of her canoe and discovers
    hidden visitors connected with the Tui Tonga. Haelefeke and two male companions
    are received with food and kava; Haelefeke consumes the feast, later transforms
    into an octopus and consumes a fruit tree and people, defeats a man-eating shark
    by swallowing it, obtains Hikuleo’s house for the Tui Tonga, removes Pulotu beings
    who weigh it down, takes a small fish during the return voyage, and has the house
    delivered to the Tui Tonga in Tonga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hikuleo hears a crash, sends people to investigate, and they report that her
    canoe has been smashed and replaced by an ivory canoe in the shed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hikuleo assembles prophets and conjecturers at Pulotu Tuumau to determine
    who broke the canoe; when they fail, she calls for hidden intruders connected
    with the Tui Tonga to show themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Haelefeke shows herself and calls two men out from the posts; the three visitors
    sit respectfully and are received as chiefs from Tonga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A reception feast includes the contents of one hundred ovens and kava in eight
    bowls; the two men consume very little, while Haelefeke consumes the kava, bowls,
    implements, food, containers, and carrying equipment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a heavily laden vi tree, the two men eat one fruit between them, while
    Haelefeke changes into a great octopus and consumes the fruit, the tree, and the
    people on it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hikuleo sends the visitors to surf near a ferocious man-eating shark, hoping
    the shark will eat them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the two men surf for the third time, the shark strands with them; they
    eat a small raw piece, and Haelefeke swallows the whole shark.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Hikuleo asks the purpose of the voyage, Haelefeke says they were sent
    by the Tui Tonga to fetch Hikuleo’s house, and Hikuleo permits them to take it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The two men cannot move the house because gods or people of Pulotu sit on
    it; Haelefeke strikes the house, knocks them off, and the house is carried to
    the vessel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the return voyage, Haelefeke seizes a small fish near the vessel; Pulotu
    inhabitants board and search the vessel and Haelefeke but fail to recover it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Haelefeke later produces the fish, shows that it is stained with blood, and
    releases it with words about going to the world and being caught in Tonga.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The travelers reach Tonga, and the house is taken to the Tui Tonga, who thanks
    his faithful servants.
  category: sequence
  evidence_refs:
  - ev:9
