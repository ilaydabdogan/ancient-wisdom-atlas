canonical_text:
  quote: ''
  summary: The passage tells of Hina and her brother Tulifaukiave. Tulifaukiave is
    killed while cutting trees with Hina’s husband, the king’s son. Hina performs
    a blood-and-water rite with a bowl and reed, adds saliva to the gathered blood,
    and Tulifaukiave rises from it. The siblings flee, pursued across rivers, mountains,
    and the sea; their pursuers perish when a small island breaks apart. Hina uses
    knowledge obtained from her mother to guide the journey. Later Tulifaukiave bathes
    in a beach pool described as their mother’s vomit, becomes beautiful, and is selected
    by a king’s daughter as her husband at a feast with boxing.
  language: English
  quote_policy: summarized
