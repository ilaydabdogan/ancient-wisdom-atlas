canonical_text:
  quote: ''
  summary: Hina, daughter of the Tui Haatakalaua in Tongatabu, is renowned for beauty.
    Sinilau of Samoa sails with his brother to Tonga, enters Hina's forbidden and
    heavily guarded enclosure, takes over a watch fire, extinguishes the fires and
    Hina's lamp, and approaches her. Hina kicks and spits on him, then recognizes
    him as Sinilau and follows him to the beach. Sinilau refuses to take her aboard
    and sails away; Hina swims after him to Samoa. Sinilau's mother finds Hina exhausted
    on the beach, hides her from Sinilau in a prohibited room, feeds her, bathes her
    in waters of life reserved for her, and brings her to the tapu king's house, where
    her juggling is heard during Sinilau's feast for choosing a wife.
  language: English
  quote_policy: summarized
