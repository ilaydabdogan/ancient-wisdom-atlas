canonical_text:
  quote: ''
  summary: Two gods, Tutula and Fakafumaka, sail toward Pulotu. The goddess Faimalie
    joins them after repeatedly beckoning. During the voyage she helps them through
    grounding and swamping. In Pulotu they encounter Elelovalu, Hikuleo’s vessel and
    house, hiding transformations, a feast that Faimalie consumes, an Underworld dive
    for clams, the death of a Pulotu diver caused by Tutula, and the return journey
    after Faimalie eats Hikuleo’s treasure yam and becomes pregnant. At Oa she gives
    birth to a yam. The passage ends by identifying Tutula also as Haelefeke and connecting
    Tepa with the origin of chant.
  language: English
  quote_policy: summarized
