candidate_motifs:
- id: motif:1
  label: royal sibling sexual encounter
  taxonomy_refs:
  - sibling_pair
  basis: The passage identifies Tuitatui and Latutama as siblings and says they had
    sexual intercourse on the platform.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports intercourse but does not frame it as marriage, divine
    union, or a normative rule.
- id: motif:2
  label: royal seat foundation through relocation
  taxonomy_refs:
  - royal_legitimacy
  basis: Talaatama and Talaihaapepe move their vessels and dwelling to Mua, and the
    passage uses this to explain why later Tui Tonga rulers dwell there.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy link is to royal residence and succession legitimacy; the
    passage does not make a cosmological world-center claim.
- id: motif:3
  label: substitute or dummy ruler enabling succession
  taxonomy_refs:
  - royal_legitimacy
  basis: Talaihaapepe installs a dressed piece of tou wood as Tui Tonga, later buries
    it, and then becomes Tui Tonga through a proclamation that he is its posthumous
    son.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage says the child and pregnancy are fictitious; this should not
    be treated as a literal miraculous birth.
- id: motif:4
  label: dismembered king completed by kinsman’s death
  taxonomy_refs:
  - sacrifice
  basis: After Havea is cut in two, Lufe requests to be killed so his buttocks and
    legs can be joined to the Tui Tonga’s trunk, and his relatives do so.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: No resurrection, rebirth, or afterlife consequence is reported in this
    passage.
- id: motif:5
  label: abandoned anomalous child discovered by a chief
  taxonomy_refs:
  - miraculous_child
  basis: Vae is born with a head like a pigeon’s, abandoned by fearful parents, and
    found by Ahe in a moving tapa-covered bundle.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage reports a bodily anomaly and abandonment, but does not state
    divine origin, miraculous conception, or transformation.
