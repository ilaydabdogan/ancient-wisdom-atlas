canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the Tui Tonga line: Tuitatui has sexual
    intercourse with his sister Latutama; Tuitatui’s sons move their vessels and residence
    from Heketa to Mua; Talaihaapepe installs a dressed piece of tou wood as a dummy
    Tui Tonga and later becomes ruler through a fictitious birth claim; later Tui
    Tonga rulers are killed; Lufe is slain to complete Havea’s dismembered corpse;
    and Vae, born with a pigeon-like head, is abandoned and found on Ata.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tuitatui invites his sister Latutama to climb up and see a vessel; she climbs
    to the platform while her attendant stays below.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tuitatui and his sister Latutama have sexual intercourse, and the attendant
    knows of it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tuitatui and Latutama dwell at Heketa in eastern Tongatabu; the passage locates
    a trilithon, Tuitatui’s terraced stone tomb, the Olotele, and a sikaulutoa game
    course there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tuitatui’s sons are Talaatama and Talaihaapepe; after Tuitatui dies, Talaatama
    succeeds him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Talaatama proposes leaving Heketa because it is a bad anchorage for their
    two vessels; the brothers move the vessels to Fangalongonoa and make their dwelling
    at Mua.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two vessels moved by Talaatama and Talaihaapepe are named Akiheuho and
    Tongafuesia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explains that Mua was prepared by Talaatama and Talaihaapepe and
    became the dwelling place of later Tui Tonga rulers, including Laufilitonga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Talaihaapepe has a piece of tou wood set up as Tui Tonga because he does not
    wish to become Tui Tonga immediately after Talaatama.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The piece of tou wood is dressed in tapa and fine mats, duly appointed, and
    given a royal wife.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the Tama Tou has been Tui Tonga for three years, vault stones are cut,
    the Tama Tou is buried, the wife is said to be pregnant, and Talaihaapepe is proclaimed
    as the child of the deceased Tama Tou.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Havea is assassinated while bathing at Tolopona; his body is cut in two, and
    his head and chest float ashore.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A gallinule called kalae pecks the dead chief’s face, and the beach is consequently
    called Houmakalae.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lufe asks to be killed so that his buttocks and legs can be joined to the
    Tui Tonga’s trunk; his relatives kill him and bury the completed remains.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Havea II is shot through the head by a Fijian man named Tuluvota and dies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vae, later named as Takalaua’s wife, is born with a head like a pigeon’s head;
