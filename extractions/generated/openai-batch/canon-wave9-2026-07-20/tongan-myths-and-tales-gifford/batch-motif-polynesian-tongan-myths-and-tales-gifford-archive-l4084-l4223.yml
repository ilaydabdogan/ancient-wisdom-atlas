canonical_text:
  quote: ''
  summary: The passage gives a Tui Tofua narrative and a variant. In the first, the
    fish god Seketoa comes from Niuatoputapu to Haapai, causes mischief, challenges
    Tui Tofua, and is defeated when Tui Tofua hides in rubbish, is swallowed, inflates
    inside Seketoa, and exits after Seketoa begs for mercy. Tui Tofua then asserts
    lordship over the islands and surrounding sea. In the variant, Tui Tofua is the
    son of Vakafuhu, serves as ambassador to the Tui Tonga, becomes involved in a
    sika-stick incident that angers his father, sails away with his people, and in
    mid-ocean directs them to jump into the sea and become sharks. Tui Tofua becomes
    a great man-eating shark; Faia refuses to jump and returns to report the event.
    The story explains Tui Tofua’s worship and the shark food taboo, and an old song
    retells the episode.
  language: English
  quote_policy: summarized
