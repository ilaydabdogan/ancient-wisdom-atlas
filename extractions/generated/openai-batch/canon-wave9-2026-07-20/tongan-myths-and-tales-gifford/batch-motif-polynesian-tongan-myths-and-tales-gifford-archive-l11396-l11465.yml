canonical_text:
  quote: "“The octopus became the sworn enemy of the rat.”"
  summary: The passage presents Tongan animal tales about a rat and an octopus. In
    two versions, a vessel sinks, the rat is rescued by an octopus, the rat soils
    the octopus’s head, and the octopus becomes hostile to rats. The tale also explains
    octopus head markings and the use of an imitation rat lure called makafeke.
  language: English
  quote_policy: quoted
