canonical_text:
  quote: ''
  summary: Talaatama is named as Tui Tonga. Talaihaapepe, his real younger brother,
    does not want to become Tui Tonga immediately after him, so he orders a garmented
    piece of tou wood called Tama Tou to be made Tui Tonga. The wooden figure is given
    a wife and publicly accepted as a man. After three years it is placed in a vault
    tomb, announced dead, and given a great funeral. The people are then made to believe
    that Tama Tou had a son by the Moheofo, the royal wife, who would be the next
    Tui Tonga; this supposed son is actually Talaihaapepe.
  language: English
  quote_policy: summarized
