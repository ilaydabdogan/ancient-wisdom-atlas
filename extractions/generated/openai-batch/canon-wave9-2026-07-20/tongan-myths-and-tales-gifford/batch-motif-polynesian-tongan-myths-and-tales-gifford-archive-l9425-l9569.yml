canonical_text:
  quote: ''
  summary: 'The supplied passage contains a tale explaining the origin of the yam:
    three named figures journey to Pulotu, face trials imposed by Hikuleo, return
    to earth, and Faimalie brings back and plants a yam from Pulotu. It also begins
    another tale in which two servants of a Tui Tonga are sent to fetch Hikuleo’s
    bone house; a goddess named Haelefeke joins them, the voyage to Pulotu is calm,
    and she directs them in hiding inside Hikuleo’s house.'
  language: English
  quote_policy: summarized
