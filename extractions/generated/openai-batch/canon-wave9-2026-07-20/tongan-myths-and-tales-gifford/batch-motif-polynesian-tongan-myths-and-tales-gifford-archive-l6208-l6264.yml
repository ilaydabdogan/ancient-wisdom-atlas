canonical_text:
  quote: ''
  summary: A Tongan narrative tells of Tokelaumoetonga, born after two Samoan castaway
    women lived alone on Kelefesia and Tonumea and one became pregnant following a
    wind test. Tokelaumoetonga visits the Tui Tonga's residence during a nuptial occasion,
    seduces the bride, exchanges garments with her, and departs. The Tui Tonga returns
    after smelling the turban's odor and kills the bride. Tokelaumoetonga later returns,
    mourns her, confesses, and is spared because of his beauty; he and the Tui Tonga
    mourn together before the burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story heading identifies the episode as Tokefaumoetonga/Tokelaumoetonga,
    the son of the sun, at Kelefesia.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fatafehi Lapaha was married to the Tui Tonga; after feasting, the Tui Tonga
    and his party left to catch flying foxes while the bride and chief women remained
    at home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small boat arrived carrying Tokelaumoetonga, who is described as the son
    of two Samoan women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two Samoan women had sailed from Samoa, their boat had sunk, and they
    survived by swimming to Kelefesia and Tonumea, where they lived for some time
    as the only human beings on the islands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two women wondered about pregnancy without other humans present, turned
    their buttocks to the wind as a test, and one became pregnant and gave birth to
    a male child named Tokelaumoetonga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tokelaumoetonga arrived at the Tui Tonga's residence and found everyone asleep
    except the bride, whom he seduced.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the seduction, Tokelaumoetonga gave the bride his turban made of a fine
    Samoan mat, and she gave him a girdle of red sennit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The odor of Tokelaumoetonga's turban reached the departing chiefs, prompting
    the Tui Tonga to return to town.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the Tui Tonga returned, Tokelaumoetonga had already departed, and the
    Tui Tonga killed the bride while she was still on her bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tokelaumoetonga returned to Kelefesia, told his two mothers he would go to
    Tongatabu because something dreadful had happened, and then went to the Tui Tonga's
    residence where funeral lights were burning for the murdered girl.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tokelaumoetonga mourned for the murdered girl, was summoned before the Tui
    Tonga, admitted seducing the wife, and stated his name.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Tui Tonga said his wife had been in the right, stated that he also strongly
    liked Tokelaumoetonga, regretted killing his wife, and invited Tokelaumoetonga
    to mourn with him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tokelaumoetonga and the Tui Tonga mourned through the night, and the burial
    took place at dawn with Tokelaumoetonga present.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage explicitly states that Tokelaumoetonga escaped death at the hands
    of the Tui Tonga because of his beauty.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the end, the Tui Tonga remained in Tongatabu and Tokelaumoetonga went to
    live in Kelefesia.
  category: setting
  evidence_refs:
  - ev:10
