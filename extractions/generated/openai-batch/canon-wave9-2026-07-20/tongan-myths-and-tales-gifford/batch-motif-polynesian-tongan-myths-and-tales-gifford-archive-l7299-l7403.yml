canonical_text:
  quote: ''
  summary: 'A chant recounts Muni-of-the-Torn-Eye: after shipboard hunger, a pregnant
    woman is cut up and Muni is thrown into the ocean, avoids a shark, and drifts
    to Lofanga. A man and wife find and adopt him after a plover has damaged his eye.
    Grown, he performs a rapid building task, asks to learn his father, journeys with
    a Fijian companion, follows a plover sign toward home, calls people through Motuku,
    seeks wrestling combat, uproots a kava plant with bats, identifies himself, and
    wrestles Pungalotolava, who speaks of becoming coral on sea and shore.'
  language: English
  quote_policy: summarized
