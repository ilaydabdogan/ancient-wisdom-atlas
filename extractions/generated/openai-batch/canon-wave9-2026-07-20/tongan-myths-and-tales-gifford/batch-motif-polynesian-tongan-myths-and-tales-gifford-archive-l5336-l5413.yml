canonical_text:
  quote: ''
  summary: Two versions explain the origin of the reef or rock Matahina. Hina receives
    and tends a young shark, calls it with a wooden board or gong and coconut shells,
    loses it when floodwater or a high tide lets it escape to the sea, searches with
    her family, and then enters the sea and becomes a reef or rock so the shark may
    come to her or find shelter. The first version also explains the stations of Hina's
    parents and siblings, and says the boat is in the sky as parts of Orion.
  language: English
  quote_policy: summarized
