canonical_text:
  quote: ''
  summary: The passage recounts Ata as the first land, named first men arising from
    a worm, and the sky gods appointing Laufakanaa to rule Ata, create wind, aid vessels
    with fair wind when petitioned, and receive offerings. Laufakanaa descends with
    a fishing net and is credited with introducing net-fishing and several food plants
    from the sky to Ata. The passage then gives Gifford’s editorial discussion of
    which Ata is meant, cites Maui land-fishing and hill-leveling accounts with different
    explanations for food-plant origins, and introduces a Tongan conception of multiple
    skies pushed high by Maui.
  language: English
  quote_policy: summarized
