canonical_text:
  quote: ''
  summary: 'A fragment and variant of a Pasikole tale: Faingaa and Sisi, divine figures
    who hold Pasikole in bondage, are repeatedly deceived by him. In one episode he
    leaves them suspended in baskets from a tree while they think they are still traveling.
    In another, during a canoe journey, he uses hidden garlands and a false report
    of a feast at the bottom of the sea to lure or bind them into the water. The passage
    ends with an explanation of shining patches under the sea as Faingaa and Sisi
    still struggling, and notes a phrase used by mothers to quiet infants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The variant states that Tonga was once peopled by gods rather than men, and
    that Faingaa and Sisi held Pasikole in bondage and made him perform heavy tasks.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:2
  text: In the preceding fragment, Pasikole wears a garland of hea flowers, says there
    is an entertainment below, and lowers Faingaa and Sisi into the sea in a net weighted
    with stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The preceding fragment says Faingaa and Sisi struggled for some time and would
    still be there but for Tangaloa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Faingaa and Sisi order Pasikole to make two large baskets, hang them at either
    end of a pole, and carry them while they sit inside seeing only the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pasikole hangs the basket-pole from a large tree branch and leaves; the drifting
    clouds make Faingaa and Sisi think they are still being carried until the baskets
    rot and they fall.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Later, Faingaa and Sisi decide to paddle to Samoa and order Pasikole to prepare
    the canoe; he hides garlands and sweet-smelling leaves in the stern.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Pasikole adorns himself with the hidden garlands, dives, hides under the stern,
    reappears between Faingaa and Sisi, and says he has been at a feast and entertainment
    at the bottom of the sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pasikole offers to attire Faingaa and Sisi properly for the people below the
    sea, but ties their hands and feet with garlands; when they dive, they cannot
    swim, while Pasikole returns to the canoe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says shining patches seen beneath the sea on dark nights are attributed
    to Faingaa and Sisi struggling in the water, and that mothers invoke them to quiet
    fretful infants.
  category: other
  evidence_refs:
  - ev:9
