canonical_text:
  quote: ''
  summary: The passage includes the close of one Sisimatailaa tale and two variants.
    Sisimatailaa opens the forbidden bundle Mala and is driven back by a hurricane,
    then uses the bundle Monu to supply overwhelming goods for a royal wedding. His
    mother identifies the sun as his father. In variants, women become pregnant through
    exposure to the rising sun, Sisimatailaa seeks or addresses his sun-father for
    ceremonial support, and one variant emphasizes the need to speak before sunrise,
    with repeated failure caused by sleep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sisimatailaa places the bundles Monu and Mala in his canoe and paddles away
    toward Tonumea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the woman’s island is out of sight, Sisimatailaa opens Mala; a hurricane
    breaks his canoe and blows him back to the island.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman on the island says he had been told not to open Mala, keeps Mala,
    and sends him away with Monu, instructing him to hang Monu just inside his house
    door and open it when he badly needs something.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sisimatailaa travels to Lapaha with his mother; Fatafehi informs the Tui Tonga,
    and a wedding ceremony is arranged, but Sisimatailaa and his mother have no goods
    for it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the wedding morning Sisimatailaa opens Monu, and the place fills with pigs,
    kava, yams, goods, and people until Fatafehi asks him to stop it; he stops it
    by wrapping Monu again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tui Tonga asks Makamakaatonumea who Sisimatailaa’s father is, and she
    says that his father is the sun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one variant, a young woman in Felemea repeatedly stands naked on an eastern
    rock in the rays of the rising sun, becomes pregnant, and gives birth to a beautiful
    boy named Sisimatailaa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the same variant, Sisimatailaa asks his mother about his father so that
    he can request help for a large social gathering; she tells him his father is
    the sun.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sisimatailaa first speaks to the sun when it is high, but the sun says it
    cannot return; the next morning before sunrise he calls again, and the sun later
    brings food and Tongan goods for the feast.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In another variant, a woman in Felemea exposes herself to the sun, becomes
    pregnant, gives birth to Sisimatailaa, and later tells him to inform his father,
    the sun, about his arranged wedding to a daughter of the Tui Tonga.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: In that variant, an old woman instructs Sisimatailaa to speak before the sun
    rises; he repeatedly becomes drowsy, sleeps until the sun is high, and is too
    late to converse because the sun cannot retrace its course.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
