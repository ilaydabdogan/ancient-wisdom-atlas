  quote: ''
  summary: The passage recounts Hinahengi from Pulotu, her turtle Sangone, Lekapai’s
    failure to follow instructions in Samoa, Sangone’s killing and buried shell, Loau’s
    death statement concerning Lafaipana, and Fasiapule’s mission from Tui Tonga Tuitatui
    to find Sangone’s shell through coded kava speech and Lafaipana’s knowledge.
  language: English
  quote_policy: summarized
