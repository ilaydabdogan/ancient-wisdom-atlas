canonical_text:
  quote: ''
  summary: After Takalaua is assassinated, his sons Kauulufonuafekai and Moungamotua
    learn of his death, pursue the two old assassins across several islands, spare
    Futuna after finding their younger brother alive, discover and capture the assassins
    in Uea, and bring them to Tongatabu for a slow public death during a kava ceremony.
    The passage also explains place names, personal names, the succession of Kauulufonuafekai
    as Tui Tonga, and the origins of the Fotofili and Taufa Tofua lines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Takalaua's two nearly grown sons, Kauulufonuafekai and Moungamotua, were floating
    model canoes at the beach when a woman told them the chief had died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrative explains the names Talafoou and Talafaite from the messenger's
    report and posture at the beach.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sons were told their father had been killed by two assassins who were
    old men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The assassins fled, and Takalaua's sons pursued them through Tongatabu, Haapai,
    Vavau, Uea, and Futuna, fighting groups who harbored or sheltered them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After abandoning the search, the brothers realized a third younger brother
    had been left behind and returned toward Futuna with a conditional plan to slaughter
    the inhabitants if he had been killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The younger brother was unharmed; the Futunans approached the Tongan vessel
    wearing chestnut-leaf necklaces and placed the Tongan youth in front.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kauulufonuafekai and Moungamotua rewarded the Futunans by granting them a
    rule concerning Tongan vessels and crews that might come ashore.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Uea, two Tongan spies went ashore at night, found the Ueans sleeping, and
    saw two old men sitting by a fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spies heard the old men speak of guarded roads and the names Filifoto
    and Filitao; the passage connects these words with Tongan names including Halaevalu
    and Fotofili.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The spies identified the two old men as the sought assassins and reported
    that the men were making spears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tongan fighting men captured the two assassins, brought them aboard, and reserved
    them for slow death in Tongatabu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Mua, the assassins were placed in the center of a kava ring, and participants
    cut or tore pieces from the living men as relish until they died.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kauulufonuafekai became Tui Tonga; his son Fotofili was sent to Niuafoou,
    and Moungamotua's son Taufa Tofua was sent to Tofua, with instructions to care
    for crews of Tongan vessels.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that the lines of Fotofili and Taufa Tofua originated from
    these descendants of Takalaua.
  category: relationship
  evidence_refs:
  - ev:7
