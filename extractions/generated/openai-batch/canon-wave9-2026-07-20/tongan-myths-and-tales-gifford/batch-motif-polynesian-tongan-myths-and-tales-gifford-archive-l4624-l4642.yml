canonical_text:
  quote: ''
  summary: A Tongan account explains Nukunamu Island as a piece of land stolen from
    Foa by two Samoan gods. The theft leaves a hollow that becomes the Malaeamoho
    swamp. The Tongan god Tafakula sees the theft, pursues the gods, and from a mountain
    on Tofua frightens them with a bright red bodily display. The Samoan gods drop
    the stolen land in the ocean near Foa, where it remains as Nukunamu, and return
    to Samoa.
  language: English
  quote_policy: summarized
