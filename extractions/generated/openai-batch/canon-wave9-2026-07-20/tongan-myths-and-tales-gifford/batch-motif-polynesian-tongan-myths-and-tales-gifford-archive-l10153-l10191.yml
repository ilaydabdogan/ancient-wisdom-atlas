canonical_text:
  quote: ''
  summary: A beautiful woman named Hina lives at Halakakala in Tonga. Sinilau travels
    to see her, and they arrange to wed, but wait for Hina's absent mother. During
    a canoe race, both canoes enter a whirlpool. Sinilau calls for rescue; Hina first
    asks that her lover be saved, then criticizes a foolish lover who forgets his
    sweetheart in adversity. Hina dies and Sinilau is saved. The whirlpool near Eua
    is said to be the source of sharks, and fishermen call sharks by the name Hina
    when noosing them at the reef Halakakala.
  language: English
  quote_policy: summarized
