canonical_text:
  quote: ''
  summary: Longopoa leaves the puko tree at night carrying a puko branch, travels
    with the gods while carrying their fish basket, repeatedly says the basket is
    not full as they fish from Samoa toward Tonga, then jumps ashore and crows like
    a rooster so the gods hurry home before dawn. He forgets to plant the branch before
    greeting his family; when he plants it at dawn it is too late, explaining why
    the puko tree no longer produces food.
