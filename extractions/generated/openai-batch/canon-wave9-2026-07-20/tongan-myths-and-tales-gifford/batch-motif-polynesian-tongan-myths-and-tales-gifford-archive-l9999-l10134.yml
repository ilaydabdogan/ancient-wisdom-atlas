- id: obs:4
  text: In the verse account, the eel goes to Samoa, lives in Hina's water of life,
    and Hina becomes pregnant; she names her man as Eel the Shining One.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the first coconut account, the people of Samoa clean and bail Hina's pool,
    remove the eel, cut it up, and eat it while Hina weeps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eel's head is buried, and after five nights a coconut shoot appears and
    grows rapidly; the coconut yields oily meat for Hina's child, and its trunk can
    be used for a sun shelter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One prose explanation says the eel originated through Tufu and Kale; Kaloafu
    and Teuhie adopt the child, learn it is a god, are chased by it, flee to Hihifo,
    and become two rocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In one variant, Hina is raised as a virgin with women attendants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In that variant, a spirit in the form of a big eel lives in a pond at the
    foot of a mountain, becomes a man, falls in love with Hina, seduces her, and Hina
    becomes pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The eel foretells a heavy storm and overflowing waters, says Hina's house
    alone will stand, and tells her to have his head cut off and buried after he places
    it on her threshold.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The eel tells Hina that a plant will grow from the buried head; after three
    years it will have fruit with three eyes, edible flesh, drinkable liquid, and
    old nuts useful for oil and planting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A second variant makes Eel a male child with sisters Teuhie and Kaloafu; he
    pursues them in affection, they become rocks in the sea, and later a virgin in
    Samoa becomes pregnant to him before people determine to kill him.
  category: sequence
  evidence_refs:
  - ev:7
