canonical_text:
  quote: ''
  summary: 'The passage introduces Hina and Sinilau as widely known Polynesian deities
    in Tongan tales, with Hina linked to lunar imagery. It then gives a verse/prose
    account and two variants of Hina and the origin of the coconut: an eel-god or
    eel-spirit is associated sexually with Hina or a virgin, is killed or has his
    head cut off, and the buried or planted head produces the coconut, whose parts
    and uses are explained. Related episodes explain Kaloafu and Teuhie becoming rocks
    after fleeing the eel.'
  language: English
  quote_policy: summarized
