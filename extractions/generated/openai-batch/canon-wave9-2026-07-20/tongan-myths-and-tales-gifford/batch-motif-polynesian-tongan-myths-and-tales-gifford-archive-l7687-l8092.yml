    is not explained in this passage.
- id: motif:2
  label: Liminal sea voyage through strange zones
  taxonomy_refs:
  - mystical_quest
  basis: The vessel passes a white sea, a floating pumice sea, and a slimy sea before
    the mast is caught at a great tree and the vessel is lost through a sky opening.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The recitative gives striking travel images but does not explicitly frame
    them as initiation or cosmography.
- id: motif:3
  label: Miraculous conception and birth from swallowed whale flesh
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: A woman swallows a whale shoulder, becomes pregnant, and gives birth to named
    whale twins.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain the mechanism beyond the swallowed whale
    shoulder and subsequent pregnancy.
- id: motif:4
  label: Sacred or extraordinary twins
  taxonomy_refs:
  - sacred_twins
  basis: The whale offspring are explicitly twins and are named Tonga and Tununga-tofuaa.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The twins are whales rather than human children; their sacred status is
    inferred from the extraordinary birth and divine context.
- id: motif:5
  label: Return ride on nonhuman carriers
  taxonomy_refs:
  - return
  basis: Kae rides the whale twins back toward Tongatabu after staying with Sinilau.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The return is clear for Kae, though the twins are also sent on Sinilau's
    errand.
- id: motif:6
  label: Betrayal of entrusted animal helpers
  taxonomy_refs:
  - trickster_boundary
  basis: After asking to ride the twins, Kae summons Haamea with weapons; Tonga reports
    that Tununga was overtaken and that Tonga's own back is thick with lances; Sinilau
    later asks why Kae came to betray.
  evidence_refs:
  - ev:10
  - ev:13
  - ev:14
  - ev:17
  confidence: medium
  cautions: The betrayal is explicit in Sinilau's speech, but the broader trickster
    classification is interpretive and should be reviewed.
