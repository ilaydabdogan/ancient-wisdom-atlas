  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kae sleeps between two whales, hides under an enormous bird, and wants to
    seize the bird as a token for Tonga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At dawn the bird flies over mid-ocean with Kae holding onto its breast, and
    Kae falls at Akana.
  category: action
  evidence_refs:
  - ev:8
