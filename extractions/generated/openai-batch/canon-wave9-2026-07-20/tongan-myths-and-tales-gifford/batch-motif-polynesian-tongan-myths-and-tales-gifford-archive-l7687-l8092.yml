  text: Sinilau befriends Kae and gives him social standing, but Kae does not sit
    in the kava ring.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A woman swallows a whale shoulder in one mouthful, becomes pregnant, and gives
    birth to twin whales named Tonga and Tununga-tofuaa.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kae asks Sinilau to bring the twins so that he can ride them and report their
    strength at Tongatabu.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Sinilau sends Tununga and Tonga on an errand and tells them to return with
    coconuts, scented oil, tapa, and coconut mats.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Near Tongatabu, Kae tells the twins to go to shallow water while he goes to
