canonical_text:
  quote: ''
  summary: A recitative recounts the voyage of Kae and Longopoa from Tongatabu toward
    a talking puko tree, their vessel's passage through strange seas and loss through
    a sky opening, Kae's arrival at Kanivatu and transport by a great bird to Sinilau,
    the miraculous birth of whale twins Tonga and Tununga-tofuaa, Kae's return to
    Tongatabu riding the twins, his betrayal of them, and Sinilau's divine retaliation
    and judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A vessel is built and loaded in Haamea for a voyage away from Tongatabu toward
    a talking puko tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Navigators report sightings of Haapai and Vavau, but Loau rejects their reports
    as lies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The vessel reaches a white sea, a floating pumice sea, and a slimy sea.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a great pandanus tree, the mast becomes entangled, and Longopoa and Kae
    climb the tree and push the vessel free.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The vessel is lost through a sky opening into a place called the land of space.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Longopoa and Kae are identified as two gods, and they decide to swim separately,
    each seeking a land of his own.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kae comes ashore at Kanivatu, where stranded whales and many neiufi fish are
