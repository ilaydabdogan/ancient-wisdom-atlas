canonical_text:
  quote: ''
  summary: The passage summarizes variant accounts of the adventures of Longopoa and
    Kae. In Vao’s version, Loau is Tui Tonga and sails in an ancient double canoe;
    at a reef with a pandanus tree and a rock, Longopoa and Kae leap ashore while
    the vessel sinks. Kae later deals with Sinilau, disobeys instructions involving
    twin whales, shows ingratitude, and is killed and eaten. In Paluto’s version,
    Loau takes mockers on a real voyage to the horizon, the vessel is lost in a whirlpool
    where earth and sky meet, Longopoa’s rooster-like crow frightens gods, and Samoan
    gods later participate in Kae’s death, the reconstitution of a whale, and the
    origin of a basket type.
  language: English
  quote_policy: summarized
