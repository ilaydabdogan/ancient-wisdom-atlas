canonical_text:
  quote: ''
  summary: Munimatamahae, also called Muni, repeatedly reassures his aged foster parents
    when chiefs assign them large communal tasks. He single-handedly makes a fishing
    net, constructs half of a fence, builds a boat, and builds one side of a boat
    house, often breaking or uprooting trees by hand and finishing before the chiefs
    and people begin their own portions. The chiefs and people had intended the tasks
    as pretexts to kill him, and at the end they plan to trap him beneath a boat during
    its launch by walling him in at bow and stern.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man and woman cry because they do not know who will help with their
    assigned end of the fishing net.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Munimatamahae tells the old man and woman not to cry and says he will fix
    the net work himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Munimatamahae collects hibiscus bark, makes rope, breaks coconut leaves and
    trunk by hand, and completes the household's portion of the net while his father
    and mother do nothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the father reports that the net is finished, the chiefs are surprised;
    the narration states that the fishing plan was a subterfuge meant to create an
    excuse to kill Munimatamahae if he failed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chiefs next order that a big enclosure or fence be built, assigning one
    half to the old couple and Muni and the other half to the chiefs and people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Muni visits the fence site, stretches out his arm, breaks coconut, koka, breadfruit,
    and other trees, and quickly completes his assigned part before the chiefs and
    people begin theirs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chiefs and people are frightened when they see Muni's fence work, leave
    their own part unfinished, and are described as seeking a reason to kill him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chiefs and people then decide to build boats, assigning one boat to the
    old people and Muni and another to themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Muni cuts logs, gathers coconuts for fiber, beats husks, plaits rope, and
    completes his boat in two days while the people have not started theirs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the father reports that the boat is finished, the chiefs ask whether
    anything can be done that would enable them to kill Munimatamahae.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The chiefs arrange a boat-house task; Muni uproots and breaks trees for posts,
    gathers coconut leaves for thatch, and completes the roof on his side while the
    chiefs' side remains unbuilt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The chiefs plan to launch the boat, put Muni beneath it, and wall him in from
    bow and stern as a way to get rid of him.
  category: action
  evidence_refs:
  - ev:11
