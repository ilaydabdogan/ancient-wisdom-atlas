canonical_text:
  quote: ''
  summary: Two Tongan rock-origin accounts are given. In the first, a great eel moves
    through named places, pursues two women who flee to the end of the land, and the
    women jump into the sea and become the rocks Teuhie and Kaloafu; the eel is said
    to be the sea eel. In the second, a Tungua girl bears a child after an unexplained
    pregnancy attributed by the people to Pulotu; the mischievous boy is set adrift
    in a canoe, sinks in the breakers, and a tall rock appears where he sank.
  language: English
  quote_policy: summarized
