  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kauulufonuafekai, Moungamotua, and the other sons were angry and said they
    would seek the two murderers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kauulufonuafekai and his people pursued the murderers Tamasia and Malofafa
    by vessel and fought or conquered Tongatabu, Eua, Haapai, Vavau, Niuatoputapu,
    Niuafoou, and Futuna in the course of the pursuit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Aboard the vessel, Kauulufonuafekai asked whether his bravery was his own
    or came from a god, and his brothers, warriors, and people answered that bravery
    and strength came from a god's blessing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kauulufonuafekai denied that his bravery came from a god and proposed that
    in the Futuna fight he would leave his back for the god to protect while guarding
    his front himself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Futuna fighting was said to be for nothing, because the murderers were
    not there but at Uea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man in ambush speared Kauulufonuafekai through his back into his chest,
