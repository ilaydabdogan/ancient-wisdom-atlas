canonical_text:
  quote: ''
  summary: The passage recounts Vae's care, transformation from pigeon-headed form,
    marriage to Tui Tonga Takalaua, and the birth of their sons. After Takalaua is
    murdered, Kauulufonuafekai and his brothers pursue the murderers through several
    islands. Kauulufonuafekai disputes that his bravery comes from a god, proposes
    a bodily test, is wounded from behind at Futuna, and treats the wound as proof
    of his own bravery. Lotauai is captured at Futuna; Kauulufonuafekai returns for
    love of him, and Lotauai tells the Futunans that his being alive will spare them
    from destruction.
  language: English
  quote_policy: summarized
