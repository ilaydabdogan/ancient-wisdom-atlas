canonical_text:
  quote: ''
  summary: A party digs up shining plates identified by Lafaipana as Sangone’s and
    carries them to the Tui Tonga. The Tui Tonga orders preparations for the return
    to Tonga. Lafaipana asks to accompany him and gives the Tongans a desired pigeon’s
    roosting perch. In Tonga, the Tui Tonga prepares to obtain a casuarina tree for
    Lafaipana, but the Tui Tonga’s wife gives an instruction about any woman obtained,
    and Lafaipana clarifies that he did not mean a real tree but a girl and a woman
    who have not known a man.
  language: English
