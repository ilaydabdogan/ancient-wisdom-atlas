canonical_text:
  quote: "“I am Muni the only one.”"
  summary: In a chant-like passage, a conqueror is feared, a figure goes to Hahake
    to contend with the conqueror, and an absent opponent has gone to the reef Halakakala.
    A large kava plant stands alone with flying foxes in its branches. The actor uproots
    the plant with one hand and tells others to tell Pungalotolava to chase him to
    the place of men, identifying himself as Muni. A note says the banana variety
    Tuukautalai is reputedly named from this incident, in which Muni stood by the
    plant while overhearing his foster parents discuss him.
