canonical_text:
  quote: ''
  summary: A family suffers successive deaths. The seventh child, Tui Haatala, leaves
    instructions not to bury his body and goes down to Pulotu to learn the cause.
    In Pulotu he encounters Hikuleo, eats from an eight-forked yam, bathes, and learns
    that Hikuleo has brought the dead family members to dwell there but will let him
    and the remaining siblings return. On returning, Tui Haatala finds his body buried,
    hangs his wet fine mat on a pandanus tree, and the dripping water creates a stream.
    He then wanders among islands and is known by different names, including Fehuluni
    in Tonga and Moso in Samoa.
  language: English
  quote_policy: summarized
