- id: obs:9
  text: Tui Haatala hung his wet fine mat on a large pandanus tree, and the dripping
    water caused a little stream called Maaeatanu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tui Haatala said he would not stay there or go to Pulotu, and he traveled
    from Eua through several islands, including Samoa and Fiji.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The figure is said to be called Fehuluni by Tongans, Moso by Samoans, and
    another name in Fiji, while still being Tui Haatala.
  category: relationship
  evidence_refs:
  - ev:5
