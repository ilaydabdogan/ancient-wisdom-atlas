canonical_text:
  quote: ''
  summary: The passage explains how ava fish, said to have come from Samoa, were moved
    through several Tongan lagoons and containers until they multiplied at Nomukeiki.
    During a hurricane, a couple caring for the fish climbed a tree, and the god Haelefeke
    stole the ava to take them to Nomuka. Some fish fell into the sea during the flight
    and became sea ava; the rest thrived in the Nomuka lagoon.
