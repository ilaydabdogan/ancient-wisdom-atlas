canonical_text:
  quote: ''
  summary: 'Two youths capture a duck and a dangerous humu fish for chief Maafu; because
    relatives are angry, Maafu tells them to go stand in the sky with the bird and
    fish, where they are visible on fine nights and guide voyagers. A second account
    explains the evening star: Tapu and Kitea, both described as mischievous fools,
    have a son named Tapukitea, whose mischief angers chiefs and people; his parents
    kill him so he may stand in the sky, where he remains.'
  language: English
  quote_policy: summarized
