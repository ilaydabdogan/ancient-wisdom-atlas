canonical_text:
  quote: ''
  summary: Ahoeitu is recognized as the son of Eitumatupua. His jealous brothers kill
    and eat him, while his head is thrown among hoi plants. Eitumatupua discovers
    the murder, has the brothers vomit the eaten parts into a wooden bowl, retrieves
    the head and bones, and restores Ahoeitu with water and nonuhaha leaves. Ahoeitu
    is appointed to descend to earth as the first divine Tui Tonga, while his brothers
    receive subordinate roles. The passage then explains Tui Tonga rank through sky
    descent, lists later rulers, names Tuitatui as builder of the Haamonga-a-Maui,
    and begins a later episode in which Tuitatui deceives his sister Latutama from
    a raised platform.
  language: English
  quote_policy: summarized
