canonical_text:
  quote: ''
  summary: 'The passage first recounts Telea''s anger at Talafaiva after Lolomanaia
    enters by a tree, Uka''s killing of Talafaiva, Telea''s grief, and Talafaiva''s
    stone vault and memorial tree. It then gives a variant account of the first Tui
    Tonga: the world is first inhabited by offspring of the worm, Kohai is made first
    Tui Tonga, a heavenly chief descends a casuarina tree to an earth woman, their
    son Ahoeitu is born, heavenly soil and a yam are sent down, and Ahoeitu later
    climbs the tree to heaven and is recognized by his father.'
  language: English
  quote_policy: summarized
