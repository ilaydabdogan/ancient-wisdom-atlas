canonical_text:
  quote: ''
  summary: 'The passage gives connected Tongan origin accounts in which Hava tries
    to stop escaping fish by pulling islands and lands into their path, then becomes
    stone; Ila and, in one account, Naaanamoana also become stones. A variant explains
    that Hava and Ila are old priestesses connected with the fish of Tui Tonga Fatafehi:
    Hava obtains mullet from a cave by moving a large stone, while Ila secretly opens
    the cave and leaves it open so the fish escape. Hava fails to block them with
    islands and features of the Tongatabu lagoon, and Hava and Ila become stones at
    Palalafa. The passage also explains a continuing mullet behavior involving a small
    fish messenger at Lokofa. A following account begins the origin of the artificial
    mound Kafoa, where Tumato and Veahuluvao flee an obligation, make a mound as atonement,
    and set up a large stone called Matangavaka.'
  language: English
  quote_policy: summarized
