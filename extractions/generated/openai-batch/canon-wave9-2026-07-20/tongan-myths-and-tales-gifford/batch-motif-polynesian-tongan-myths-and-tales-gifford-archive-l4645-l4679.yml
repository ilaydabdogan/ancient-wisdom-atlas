canonical_text:
  quote: The mountain became the island of Kao.
  summary: The passage gives an origin account for Kao Island. Samoan deities steal
    a high mountain from Tofua, leaving a lake behind. A Tongan god, Tafakula, frightens
    them by displaying a brilliantly shining anus, which they mistake for sunrise;
    they drop the mountain near Tofua, where it becomes Kao. A variant names the Samoan
    thief as Haelefeke and similarly says Tafakula's brilliant red anus makes him
    think dawn has come, causing him to drop Kao and flee.
  language: English
  quote_policy: quoted
