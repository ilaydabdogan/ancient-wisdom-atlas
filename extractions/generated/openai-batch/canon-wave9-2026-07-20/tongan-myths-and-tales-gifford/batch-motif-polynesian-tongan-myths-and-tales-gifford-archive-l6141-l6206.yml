canonical_text:
  quote: ''
  summary: A Tongan variant tells how Sisimatailaa, living with his mother Fataimoeloa
    at Felemea, is taken by the Tui Tonga, later marries the Tui Tonga's daughter
    Fatafehi, learns that his father is the sun, visits the sun at sunrise, receives
    two baskets, suffers a hurricane after opening the forbidden basket Mala, and
    causes canoes and people of Felemea to appear by opening Monu. The story also
    explains wedding gifts, the first ngafingafi mats, the ceremonial kava-ring status
    of Felemea people, and the descent of Fakatouio.
  language: English
  quote_policy: summarized
