canonical_text:
  quote: ''
  summary: A Tofua giant, Taufatahi, visits the Moungaone giant Fakapatu to test cleverness
    and strength. Fakapatu deceives him with a mouth like a cave entrance, then later
    enters or acts from within Taufatahi's stomach, causing dangerous swelling. Taufatahi
    offers gifts to live; Fakapatu asks instead that Moungaone people be immune from
    fish bites in waters from Tofua to Fiji and Samoa. Taufatahi agrees, and the story
    explains why Moungaone people say no fish harms them outside the reefs.
  language: English
  quote_policy: summarized
