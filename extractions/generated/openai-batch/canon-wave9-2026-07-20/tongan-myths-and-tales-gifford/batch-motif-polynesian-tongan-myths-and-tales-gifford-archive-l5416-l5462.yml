canonical_text:
  quote: ''
  summary: 'The passage gives an origin account for the springs Veefefe on Eua: Tuutaki
    deceives a woman’s relatives at a covered precipice, later is pushed over the
    precipice by the woman while drinking from a coconut shell, and the shattered
    shell gives rise to springs. A following related account describes Tuutaki as
    a famous warrior of Eua, his wife’s revenge by pushing him over a cliff, his corpse
    impaled in a tree in a defiant posture, and a Fijian war party retreating in fear
    when they see him.'
  language: English
  quote_policy: summarized
