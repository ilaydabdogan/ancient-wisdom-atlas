canonical_text:
  quote: ''
  summary: Loau, king of Haamea, secretly leads Kae, Longopoa, and a canoe crew on
    a voyage whose true destination is the horizon. They pass multiple island groups,
    strange seas, and the horizon, then reach a whirlpool at the end of the sky. Loau
    orders the canoe into the whirlpool; Kae and Longopoa leap away and cling respectively
    to a pandanus branch and a large stone. Kae later swims to a sandy island, eats
    flesh from dead sea animals, clings to a huge bird called kanivatu, is carried
    near Samoa, and goes to Sinilau’s house. Kae reports the loss of the crew, stays
    in Samoa, then asks to return to Tonga; Sinilau promises that he will be taken
    there.
  language: English
  quote_policy: summarized
