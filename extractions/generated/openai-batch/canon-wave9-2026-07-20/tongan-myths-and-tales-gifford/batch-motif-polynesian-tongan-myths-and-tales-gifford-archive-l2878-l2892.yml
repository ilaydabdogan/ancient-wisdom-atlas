canonical_text:
  quote: ''
  summary: After Tui Tonga Talaatama dies without sons, his child brother Talaihaapepe
    refuses the title and asks that his wooden doll Tama Tou be made Tui Tonga. Because
    of the boy's high rank, the request is accepted. Years later Talaihaapepe announces
    the doll's death, has it buried with ceremony and mourning in Langi Tama Tou,
    and then becomes Tui Tonga himself.
