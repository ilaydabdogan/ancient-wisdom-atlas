canonical_text:
  quote: ''
  summary: 'A boat party of gods from the world undergoes contests and trials in Pulotu.
    Fakafuumaka defeats a Pulotu diver by preventing him from surfacing. Hikuleo then
    imposes a final vi-tree trial: the visitors must catch all the fruit and eat it
    all or die. Haelefeke catches every fruit with his tentacles, and Faimalie devours
    the fruit, leaves, branches, and trunk. Hikuleo expels the visitors back to the
    world. Faimalie departs with a swallowed yam, while Lohi steals taro from Pulotu,
    plants it in Eua, and the passage identifies this as the beginning of taro in
    Tonga.'
  language: English
  quote_policy: summarized
