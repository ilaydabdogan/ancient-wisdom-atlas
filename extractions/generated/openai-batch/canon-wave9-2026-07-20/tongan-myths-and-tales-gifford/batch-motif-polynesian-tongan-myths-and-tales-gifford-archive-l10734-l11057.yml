canonical_text:
  quote: ''
  summary: The passage introduces variant notices for the Pasikole tale, then gives
    a song and prose explanation. Pasikole is presented as a Samoan man, though the
    song says some call him a god and others a man. Two goddesses, Sisi and Faingaa,
    love him because of his yellow hair, but he has a wife and seeks to deceive them.
    He tricks them into baskets, carries them, hangs them in a puko tree on the mountain
    Holohipepe, and leaves them until the baskets rot and they fall. When they pursue
    him, he devises another trick involving a canoe, fishing net, deep ocean, secret
    diving, and adornment. The song also includes Tangaloa looking down from the sky
    and sending Fuluhao to see the abandoned goddesses.
  language: English
  quote_policy: summarized
