  quote: ''
  summary: The passage explains the name Tuitatui and the later arrangement of the
    kava circle. An earlier kava-party arrangement left the Tui Tonga vulnerable because
    people surrounded the chiefs. Tuitatui used a long stick to strike the knees of
    anyone who came too close, causing people to keep their distance; his name is
    glossed from king, strike, and knee, and the kava circle was afterward arranged
    as he made it.
