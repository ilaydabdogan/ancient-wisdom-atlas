canonical_text:
  quote: ''
  summary: The supplied passage gives variants of the origin of kava. In the main
    account, Loau visits Fevanga and Fefafa during famine; Fevanga kills and roasts
    his leprous daughter with a kape plant for Loau. Loau orders the child’s head
    and body buried separately and says plants will grow. Kava and sugar cane grow;
    a rat eats them in sequence, explaining the order of kava drinking and sugar-cane
    relish. Fevanga later brings the plants to Loau, and ceremonial kava preparation
    is described. A second variant names the daughter Kavaonau and has kava grow from
    her grave. A third variant has a chief woman cook her baby for the Tui Tonga during
    famine; the Tui Tonga refuses to eat human flesh and orders a chief’s burial.
  language: English
  quote_policy: summarized
