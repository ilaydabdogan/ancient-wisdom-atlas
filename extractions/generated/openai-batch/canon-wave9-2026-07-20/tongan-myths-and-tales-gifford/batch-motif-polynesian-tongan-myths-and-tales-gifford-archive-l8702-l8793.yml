canonical_text:
  quote: ''
  summary: In Pulotu, Faimalie rebukes the four companions who had left her behind,
    then eats the vast feast that they cannot finish, including food, oven leaves,
    ropes, and carrying sticks. Hikuleo and the chiefs of Pulotu become angry and
    impose life-or-death sports contests on the visiting gods from the world. Haveatoke
    competes in surf riding against a Pulotu champion, kills him by biting the back
    of his neck, and claims victory. Hikuleo then demands a diving contest, and Fakafuumaka
    volunteers to face the Pulotu diver.
  language: English
  quote_policy: summarized
