canonical_text:
  quote: ''
  summary: The passage first identifies a plant growing from a child's grave as kava
    and records Tui Tonga's instruction that it be tended because its use may bring
    curse or blessing. It then introduces Tongan fish-god tales, naming several deities
    and summarizing variants in which men or body parts become sharks or fish, canoes
    become rocks, offerings are linked to grave pebbles, and transformed sharks guard
    shores and assist endangered boats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plant comes up from a child's grave; Tui Tonga orders it tended and says
    it will be a curse or blessing depending on use; the plant is identified as kava.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fish-god tales concern Tui Tofua, Fakapatu, and Seketoa, who are associated
    with Tofua, Moungaone, and Niuatoputapu islands; Tui Tofua and Seketoa are said
    to be transformed men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Taufatahi is mentioned as another fish god and as an important deity with
    a priest and sacred precinct in Tongatabu; a priest named Kautai was living at
    Mua in 1921.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Six versions of the origin of the shark god Tui Tofua were collected, three
    of which are printed in the collection.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Samson Latu's version, the father and son names are transposed, Vakafuhu
    is the son, Vakafuhu becomes a man-eating mud shark, and his canoe becomes the
    rock Tolungamaka.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After offerings are made to Vakafuhu and his companions, small black volcanic
    pebbles appear on the beach of Siuatama and are used on the graves of the men
    transformed into sharks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Samoan companion who is not transformed transmits instructions concerning
    the use of volcanic pebbles on the graves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Samuel Pele's version, Tui Tofua struggles with Seketoa by taking the form
    of the sokisoki, a spiny fish, and entering Seketoa's stomach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the same variant summary, a Samoan's little finger is severed and becomes
    a shark rather than a porpoise; Tui Tofua and accompanying sharks are heralded
    by discoloration of the sea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The tale says that if a vessel sinks near Tofua or Kotu island, no one will
    die because Tui Tofua is nearby as a protecting deity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Paul Taufiaevalu's version, the king of Tofua's son returns from Samoa
    after tattooing, commits fornication with his father's concubines, and is condemned
    to death with his comrades.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The condemned youths escape by jumping into the sea and becoming sharks; the
