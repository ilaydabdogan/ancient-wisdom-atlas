canonical_text:
  quote: ''
  summary: The passage narrates Momo's coded request for Nua, the births of Fasiapule
    and Tuitatui from the same mother, Fasiapule's symbolic disclosure of brotherhood
    to King Tuitatui, Fasiapule's tricking of two goddesses and flight to Fiji, and
    his later removal of Tuitatui's body in Eua by substituting another body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tuitatui is described as perhaps the greatest of the Tui Tonga line, and the
    building of the Trilithon of Tongatabu is attributed to him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Momo sends his attendant Lehauli to Loau with a request phrased as wanting
    “new yams and old yams,” and Lehauli misunderstands the message as a request for
    literal yams.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loau interprets and answers the yam language as referring to daughters, and
    Momo then asks for Nua, Loau's married daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nua is married to Ngongokilitoto in a marriage for love; he releases her to
    the Tui Tonga but plans regular visits signaled by water dripping on a kape leaf.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nua has already borne Fasiapule to Ngongokilitoto, asks Ngongokilitoto to
    cease visiting so that a later child will certainly be the Tui Tonga's, and then
    bears Tuitatui.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Tui Tonga dies, Tuitatui becomes king and does not know that he
    has a brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a ceremony where the Haangongo people present produce, Fasiapule enters
    the kava ring carrying a basket with charcoal, a ripe mamae, a toto fruit, and
    banana-tree pith containing a fiber.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fasiapule uses the banana pith, mamae, toto, and charcoal in speech to explain
    shared motherhood, mutual pity, common blood, and Tuitatui's previous ignorance
    of him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A female servant who served Tuitatui's parents confirms that Fasiapule is
    Nua's son by Ngongokilitoto and that Fasiapule and Tuitatui are brothers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fasiapule tricks the angry goddesses Sisi and Faingaa by placing them in coconut-leaf
    baskets, hanging the baskets from a tree, changing his appearance, and fleeing
    to Fiji.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After returning from Fiji, Fasiapule sees a light in Eua from Tonga and travels
    by canoe to Eua with a Fijian companion.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The light is from funeral torches for Tuitatui; Fasiapule kills his Fijian
    companion, substitutes the companion's body for Tuitatui's, and carries Tuitatui's
    body away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Fasiapule lashes Tuitatui's body to a pole with hibiscus fiber, and the place
    where this happens is said to be called Fautapu.
  category: setting
  evidence_refs:
  - ev:10
