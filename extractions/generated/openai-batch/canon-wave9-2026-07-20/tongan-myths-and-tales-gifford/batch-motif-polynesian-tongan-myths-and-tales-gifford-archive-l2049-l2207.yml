canonical_text:
  quote: Ahoeitu ... became the Tui Tonga of this world, the first Tui Tonga from
    heaven.
  summary: Ahoeitu, son of Eitumatupua, visits his elder brothers in heaven, is admired,
    and is killed and eaten by the jealous brothers. Eitumatupua forces the brothers
    to vomit up the remains, recovers the head and bones, and restores Ahoeitu with
    water and Malay apple leaves. Eitumatupua then sends Ahoeitu down to earth to
    become the first Tui Tonga from heaven, while the elder brothers receive subordinate
    or restricted offices. The passage closes with descendants and later holders of
    the Tui Tonga title.
  language: English
  quote_policy: quoted
