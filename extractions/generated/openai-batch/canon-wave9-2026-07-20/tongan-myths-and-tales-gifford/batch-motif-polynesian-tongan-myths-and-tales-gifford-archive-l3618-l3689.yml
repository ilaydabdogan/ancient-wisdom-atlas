canonical_text:
  quote: ''
  summary: A Tongan tale and variant recount how Tuutanga, daughter of Atamataila,
    is carried to become the Tui Tonga's wife. Her lover Kinikinilau signals to her
    with a marked pandanus fruit at Tafaata and tells her to remember that place.
    Tuutanga later bears Tafolo to the Tui Tonga, then returns to Kinikinilau and
    bears Paku, from whom the Fakafanua name or chiefly line is traced.
  language: English
  quote_policy: summarized
