canonical_text:
  quote: ''
  summary: 'The passage first explains origins of certain yams, fish, and taro, including
    Faimalie’s theft from Pulotu, her birth-giving to a yam in the bush, and other
    yams said to have fallen from the sky or come from heaven. It then concludes and
    chants a narrative of a canoe journey to Pulotu: Fai/Faimalie boards the vessel,
    survives a storm by bailing and lightening the canoe, reaches Pulotu, destroys
    Hikuleo’s vessel, encounters Hikuleo’s household, and consumes the food brought
    by the people of Pulotu.'
  language: English
  quote_policy: summarized
