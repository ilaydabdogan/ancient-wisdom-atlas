canonical_text:
  quote: ''
  summary: The passage introduces and compares variants of the Tongan tale of Munimatamahae/Muni.
    It records variant details about Muni's mother being killed on a vessel, Muni
    being cast ashore and later targeted by a scuttled boat, his landing in Tongatabu
    to seek his father, his wrestling with Punga near Holonga, Punga's flying-fox
    divination, and several Fiji sequels in which Muni confronts Hetoa, a part-man
    part-god cave being, or a great dog that eats people and is about to receive the
    king's daughter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editor identifies the tale of Munimatamahae, glossed as Muni-of-the-torn-eye,
    as a popular extant Tongan tale current in Haapai and reports hearing it from
    thirteen persons as well as consulting published versions.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several accounts place Muni's mother on one side of a vessel when she was
    seized and killed; some state that the chief of the vessel ordered a 'root' to
    be struck off from one side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four versions identify the vessel's chief as the Tui Tonga, and one version
    names Muni's mother as Tetele.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beach on Lofanga where Muni was cast ashore is given different names in
    different versions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fishing expedition includes an attempt to get rid of Muni by scuttling the
    boat on which he had gone to sleep; most versions attribute this to hostile fellow
    islanders, while one attributes it to foster parents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: All accounts make Hihifo in western Tongatabu the place where Muni landed
    while searching for his father, though the exact landing place varies.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Muni's wrestling with Punga is placed near Holonga, and versions vary on whether
    Punga was killed or only vanquished.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two steep mounds beside the main highway are attributed to earth shaken from
    the roots of a great kava plant after Muni broke it in two.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: One variant has Punga determine the importance of events at his home by where
    his white flying fox alights on a bamboo pole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Fiji variants, Muni either wrestles Hetoa and is killed or wrestles a part-man,
    part-god being in a cave until both fall into the cave dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In Moungatonga's variant, Muni tells his father Motukuveevalu that he will
    take his Fijian attendant home and then return; in Fiji he learns of a fierce
    dog living in a cave.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The cave dog is said to eat one man each day, and the next intended victim
    is the daughter of the king of Fiji.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Muni tells the doomed girl not to go, goes to the dog's cave himself, seizes
    the rushing dog by the throat, chokes it to death, and the Fijian towns hold festivals
    because they are delivered.
  category: sequence
  evidence_refs:
  - ev:12
