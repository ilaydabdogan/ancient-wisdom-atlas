canonical_text:
  quote: ''
  summary: Tuitatui, the Tui Tonga, travels by canoe, sees a maiden at Eueiki, and
    tests whether she is human or spirit before persuading her to board. The maiden,
    Nua, later bears four children. The passage then attributes tombs, stones, the
    Haamonga trilithon, an inasi ceremony, and later settlement and genealogical matters
    to Tuitatui, his children, and related figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tuitatui is described as the Tui Tonga, a feared chief over groups of islands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tuitatui travels by canoe toward Halakakala and sees a woman on the weather
    shore of Eueiki with her legs dangling into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man at the front of the canoe poses a riddle and then explains that it refers
    to the woman's legs, her seat on a fau tree branch, and a light on the sea opposite
    her.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Tuitatui tells his men to paddle quickly so they can determine whether the
    figure is human or a spirit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tuitatui and the maiden exchange remarks at the shore, and he invites her
    to come aboard.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden asks whether they should go to Tonga or remain on Eueiki, and Tuitatui
    falsely says the entrance was rough.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While Tuitatui remains undecided about whether she is human or spirit, the
    maiden says she will stay if he wants food and will not come aboard.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tuitatui concludes that the maiden is human, begs her to board, and she enters
    the canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At shore, the maiden gives her name as Nua and recognizes Tuitatui from reports
    of his unusually big long head.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tuitatui and Nua live together, and Nua bears Uanga, Afulunga, Fatafehi, and
    Sina.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Works attributed to Tuitatui include a terraced stone tomb at Heketa, a resting
    stone, and the terraced stone tomb of Moungalafa.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Tuitatui urges his men to work while he is alive, and the men decide to make
    an unsurpassable structure called the Burden of Maui.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Haamonga work begins with an inasi ceremony attended by distant islands,
    and three stones are arranged using an earth mound.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After the top stone is placed, earth is removed to make the mound where Tuitatui
    is buried, and the Haamonga stands as an observatory.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Uanga and his younger brothers are credited with making the Haamonga and the
    terraced stone tomb at Mua called Langileka.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Uanga removes his sister Fatafehi with her silent consent, and Mua is later
    peopled by her brother.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: The passage states that the child of Nua was the one to whom provisions were
    brought and identifies him as the Tui Tonga.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:18
  text: The passage names Ahoeitu as a chief who came from the sky and notes unknown
    Tui Tonga between him and Tuitatui.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:19
  text: The passage identifies Tuitatui as the younger half-brother of Fasiapule,
