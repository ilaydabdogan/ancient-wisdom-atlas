canonical_text:
  quote: ''
  summary: The passage contains two miscellaneous stories. In the first, Tangaloa
    descends from heaven with his son, travels from Tonga to Fiji, builds an impregnable
    water-tight fort with carpenters, and a Fijian god’s rainstorm causes the fort
    to float and scatter the carpenters throughout the world. In the second, a guarded
    girl named Sun is hidden between a shore house with ten enclosures and an ocean
    dwelling; a Samoan man named Moon, aided by his cat, crosses the sea, overcomes
    fierce animal guardians by asking for their teeth, reaches Sun, marries her with
    her father’s consent, and becomes king with Sun as queen.
  language: English
  quote_policy: summarized
