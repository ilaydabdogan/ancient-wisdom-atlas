canonical_text:
  quote: ''
  summary: The passage introduces a cycle of Tongan son-of-the-sun stories, then narrates
    how the Tui Tonga encounters Sisimatailaa at Tonumea, chooses him as husband for
    Fatafehi, brings him through several islands where royal daughters leave gifts
    after visiting him, and later sends him to live with Fatafehi. Sisimatailaa returns
    to his mother, learns how to seek his father, fails to stay awake before sunrise,
    calls to the sun, is recognized as the sun's son, and receives instructions concerning
    the lucky bundle Monu and the unlucky bundle Mala, which he disobeys by obtaining
    both.
  language: English
  quote_policy: summarized
