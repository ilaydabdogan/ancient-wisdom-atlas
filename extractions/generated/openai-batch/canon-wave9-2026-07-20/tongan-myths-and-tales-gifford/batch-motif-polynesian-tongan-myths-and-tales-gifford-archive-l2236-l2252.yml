  summary: The passage recounts a marriage negotiation between Tui Tonga Momo and
    the chief Loau of Haamea. Momo sends an attendant with a request for yam cuttings,
    which the narrator explains means a request for one of Loau's daughters in marriage.
    Loau answers in the same yam-seed idiom to indicate that Nua already has children
    and the younger daughter is too young; Momo still chooses Nua, who is taken to
    live with him.
