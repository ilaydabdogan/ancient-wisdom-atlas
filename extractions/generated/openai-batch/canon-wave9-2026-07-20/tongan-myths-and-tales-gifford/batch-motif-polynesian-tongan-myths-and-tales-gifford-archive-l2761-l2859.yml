candidate_motifs:
- id: motif:1
  label: Sacred animal shell preserved as god and royal relic
  taxonomy_refs: []
  basis: The tortoise shell is used as a god, passed through named holders, sold,
    and later partly recovered and kept by a king.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states sacral use and custody but does not explain ritual
    function beyond 'used as a god.'
- id: motif:2
  label: Quest to confront a personified destructive wind
  taxonomy_refs:
  - mystical_quest
  basis: After a storm destroys the plantation, Lekapai sets out to seek the wind
    and struggle with it.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is broad; the episode is specifically a pursuit
    of the wind after agricultural loss.
- id: motif:3
  label: Control of a weather deity by binding hair
  taxonomy_refs: []
  basis: At the daughter's instruction, Lekapai ties the wind god's hair to trees
    and grass and wakes him, forcing him to plead for release.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No wider comparative identification is asserted from the passage alone.
- id: motif:4
  label: Marriage reward for releasing a bound deity
  taxonomy_refs:
  - sacred_exchange
  - sacred_marriage
  basis: The wind god promises his daughter to Lekapai if released and then tells
    the pair to live together.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage presents the marriage arrangement plainly; 'sacred marriage'
    is used cautiously because one spouse is a divine daughter, not because a rite
    is described.
- id: motif:5
  label: Violated prohibition at a hidden water place
  taxonomy_refs:
  - forbidden_knowledge
  basis: Lekapai is told not to enter the other part of the house because the wife's
    water hole is there; he disobeys and is injured and trapped.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: 'The taxonomy label is approximate: the immediate prohibition concerns
    a place, not explicitly knowledge.'
- id: motif:6
  label: Betrayal of animal transport and retaliatory punishment
  taxonomy_refs: []
  basis: Lekapai ignores instructions about Sangone, causes her death by calling Samoans
    to kill her, and is then killed by his wife.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies Sangone as the wife's mother but does not explicitly
    label the episode as moral punishment, though the sequence supports the reading.
- id: motif:7
  label: Hidden remains revealed by a child's utterance
  taxonomy_refs: []
  basis: Lafaipana's play speech reveals that Sangone's plates are buried beneath
    the dead candle-nut tree.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The revelation is accidental or playful in context; the passage does not
    state intentional prophecy.
- id: motif:8
  label: Ruler's expedition to recover remains or relics
  taxonomy_refs: []
  basis: The Tui Tonga voyages to Samoa to search for Sangone's plates and orders
    digging after learning their burial place.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The status of the plates as relics is inferred from the search and burial
    context; the passage does not call them relics.
