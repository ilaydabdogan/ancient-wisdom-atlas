canonical_text:
  quote: ''
  summary: The passage first reports the later custody of Sangone's tortoise shell
    as a god and royal relic. In the variant tale, Lekapai pursues the wind after
    a storm destroys his plantation, reaches an island, binds the wind god's hair
    at the instruction of the god's daughter, marries her, violates prohibitions involving
    a water hole and the turtle Sangone, causes Sangone's death in Samoa, and is killed
    by his wife. The Tui Tonga later goes to Samoa to recover Sangone's plates, whose
    burial place is revealed by a child near a dead candle-nut tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fasiapule brought a tortoise shell to Tuitatui; it was used as a god, handed
    down to Laufilitonga, sold after Laufilitonga became Christian, and later partly
    recovered by King Maeakafa in Fiji.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lekapai and his family moved to Samoa, planted food crops, and a great storm
    destroyed the plantation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: After the plantation was destroyed, Lekapai proposed seeking the wind and
    contending with it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Samoa was out of sight, Lekapai reached a reef-surrounded island; a
    wave upset the boat, and he clung to a large hingano tree before going ashore
    and following a trail inland.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A girl told Lekapai that the wind was her father, that storms occurred when
    he was awake and calm when he was asleep, and instructed Lekapai to tie parts
    of the father's hair to trees and grass.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lekapai followed the girl's instructions, stamped on the ground, and the wind
    god awoke knowing his daughter had ordered the act.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wind god pleaded to be released and promised his daughter to Lekapai;
    after being unbound, he told Lekapai and the girl to live together.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lekapai's wife forbade him to enter the other part of the house because her
    water hole was there; he disobeyed, fell in, and was found injured and trapped.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Lekapai wanted to return to Samoa, his wife instructed him not to crack
    coconuts on the turtle's head and to leave the turtle in deep water; Lekapai disobeyed
    both instructions.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: Samoans killed and cut up Sangone, and the wife later knew that her mother
    had been eaten and that her plates were buried under a candle-nut tree.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Lekapai fell asleep while Sangone was being cut up, awoke back in the girl's
    house, was reproached by her, and was slain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Tui Tonga voyaged to Samoa to seek Sangone's plates; a child named Lafaipana
    called out during play that the plates were buried under a dead candle-nut tree.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Tui Tonga and his party went ashore, partook of kava and food, and after
    eating he declared that he had come to search for Sangone's plates.
  category: sequence
  evidence_refs:
  - ev:12
