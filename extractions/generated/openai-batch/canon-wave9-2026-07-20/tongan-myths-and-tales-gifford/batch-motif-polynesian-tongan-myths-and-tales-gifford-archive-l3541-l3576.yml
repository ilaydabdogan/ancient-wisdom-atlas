canonical_text:
  quote: ''
  summary: A young chief of Uea is refused passage to Tonga by Tui Halamaka. After
    appealing to his father and maternal relatives, a large double-boat named Lomipeau
    is built. The boat carries stone blocks for royal tombs in Tonga, sails by Kao
    and Tofua, reaches Tonga, unloads at Mua, and later discharges stone at Uiha.
    Discarded oven ashes become the island of Mounu, and discarded rowlock stones
    become the peninsula of Fonuamotu.
  language: English
  quote_policy: summarized
