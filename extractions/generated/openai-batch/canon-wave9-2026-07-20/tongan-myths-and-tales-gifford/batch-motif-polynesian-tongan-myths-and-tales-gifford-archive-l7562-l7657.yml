canonical_text:
  quote: ''
  summary: Sinilau sends Kae home to Tonga on two named whales, Samoa and Tonga, asking
    Kae to return gifts for them. Kae instead has people attack the whales; Tonga
    is killed and eaten while Samoa escapes and reports back. Sinilau sends gods to
    recover Kae and the dung of those who ate Tonga; Kae is killed and eaten, and
    Tonga is reconstituted and restored to life from the dung placed in Sinilau's
    well. The passage then turns to Longopoa, who reaches a deserted island with a
    speaking puko tree that feeds him from a roasted branch and instructs him how
    to return to Tonga and plant a branch that will produce food.
  language: English
  quote_policy: summarized
