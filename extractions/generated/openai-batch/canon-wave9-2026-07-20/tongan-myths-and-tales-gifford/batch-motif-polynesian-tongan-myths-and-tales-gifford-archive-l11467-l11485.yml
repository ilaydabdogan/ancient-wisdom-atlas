  quote: ''
  summary: A rat visits ants who are eating the sweet hollow core of a ripe plantain.
    After they ignore his request for a piece, the rat angrily plugs the plantain
    end with rat excrement, causing the ants inside to smother and die. The tale explains
    why a split plantain appears to contain a core resembling many ants and an object
    like rat excrement at the end.
