canonical_text:
  quote: ''
  summary: Sinilau discovers Hina after an old woman has hidden her during his wife-choosing.
    He kills the old woman, falsely reports her death as sickness, and buries her.
    Sinilau and Hina sleep separately; after concubines warn that Hina appears goddess-like,
    he neglects her until he finds her starving and asking for water and food. A fleet
    from Tonga arrives searching for Hina, and her uncle directs her to return with
    Sinilau. Sinilau has his concubines burned in a great oven, then sails with Hina
    to Tonga in separate boats. In Tonga Hina is placed inside a walled enclosure
    while Sinilau is kept outside. Sinilau sends a messenger with yams, pretending
    they are for Hina’s dog and asking Hina to chew them; he then eats the chewed
    yams himself. The chiefs urge the delayed wedding, which takes place, and Hina
    and Sinilau live together.
  language: English
  quote_policy: summarized
