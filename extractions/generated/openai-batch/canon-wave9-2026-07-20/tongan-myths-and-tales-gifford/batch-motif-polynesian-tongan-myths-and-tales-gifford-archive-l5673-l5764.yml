canonical_text:
  quote: ''
  summary: Maafu Tukuiaulahi pretends illness and sends Maafu Lele and Maafu Toka
    on errands involving a lagoon, taro leaves, deep seawater, a dangerous duck, and
    a dangerous humu fish, intending that the boys be destroyed. Maafu Lele kills
    both creatures, and the boys return. Maafu Tukuiaulahi explains that he sought
    to remove them because of their wickedness and the fear of his people. The youths
    agree to depart not to another place on earth but to the sky, taking the duck
    and fish with them. The narrative identifies two dark openings in the Milky Way
    as Maafu Lele and Maafu Toka, and two star clusters as Toloa the duck and Humu
    the fish, giving the origin of the Magellan Clouds. A variant begins with Ngongo’s
    daughter dying before marriage to Maafu’s son and becoming an ulie lizard; she
    watches the man from a cave near a spring, sucks a discarded coconut husk he used
    after bathing, becomes pregnant, and gives birth to Maafu Lele and Maafu Toka.
    The variant then repeats Maafu’s plan to remove the troublesome youths by sending
    them after a fierce duck.
  language: English
  quote_policy: summarized
