candidate_motifs:
- id: motif:1
  label: provocative seizure that initiates contest
  taxonomy_refs: []
  basis: Muni breaks Pungalotohoa’s gate, takes his kava, and leaves a message inviting
    Pungalotohoa to seek him, after which Pungalotohoa pursues him and the contests
    begin.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call the kava sacred; the motif is phrased
    as a literal provocation rather than a sacred theft.
- id: motif:2
  label: heroic strength contest leading to rule
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  basis: Muni defeats Pungalotohoa in throwing and boxing, after which Pungalotohoa
    gives him Tonga, wives, and chiefship.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents the transfer as the defeated rival’s speech, not
    as a formal public coronation.
- id: motif:3
  label: death and return to life of a defeated rival
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Pungalotohoa is crushed and dies in the boxing contest, then comes to life
    again after a little while.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only Pungalotohoa’s brief return to life is described; no ritual or cosmological
    explanation is given.
- id: motif:4
  label: defeated being becomes coral or stone
  taxonomy_refs:
  - shapeshifter
  basis: After defeat, Pungalotohoa says he will be punga on shore and in the sea,
    and the narrative says he became the stone called punga.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The available taxonomy term is approximate because the passage describes
    becoming stone or coral rather than repeated voluntary shapeshifting.
- id: motif:5
  label: miraculous exposed child survives water and is adopted
  taxonomy_refs:
  - miraculous_child
  basis: Muni is cast into the ocean from a pregnant woman, is not eaten by a shark,
    drifts ashore, and is adopted by a fishing couple, later growing enormous.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not state divine parentage or a sacred birth within this
    excerpt.
- id: motif:6
  label: prodigious builder and culture hero
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The song calls Muni a conqueror of exceptional wisdom, and he builds a canoe-house
    in one day by breaking and uprooting trees; the prose also has him build a house
    and gather the people.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  confidence: medium
  cautions: The culture-hero function is suggested by conquest, building, and gathering
    people, but the passage does not present a broad inventory of cultural institutions
    founded by Muni.
- id: motif:7
  label: quest to find father and home
  taxonomy_refs:
  - return
  basis: Muni asks old people to identify his father and is directed to Great Tonga,
    where a rail’s flight marks the road to his home.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The excerpt ends while the father-seeking action is still in progress,
    so the completed return is not shown here.
- id: motif:8
  label: cave as refuge and danger site
  taxonomy_refs: []
  basis: The passage uses caves both for Motuku’s dwelling after defeat and for the
    place where Pungalotohoa formerly killed and roasted people, later used for gathering
    survivors.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The cave is a recurrent setting, but the passage does not explicitly interpret
    it.
