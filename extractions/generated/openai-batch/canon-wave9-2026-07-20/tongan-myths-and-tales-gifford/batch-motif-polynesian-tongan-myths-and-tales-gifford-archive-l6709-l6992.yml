canonical_text:
  quote: ''
  summary: 'The passage recounts Muni/Munimatamahae’s provocation of Pungalotohoa
    by breaking his gate and taking his kava, their contests of throwing and boxing,
    Pungalotohoa’s death, revival, defeat, and transformation into punga stone or
    coral, followed by Muni’s gathering of people. A song then narrates Muni’s earlier
    story: Motuku’s defeat and cave-dwelling, a pregnant woman killed on a vessel,
    Muni cast into the ocean, rescued and adopted, growing enormous despite a torn
    eye, performing prodigious building feats, and seeking his father in Tonga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Muni goes to Hahake to seek Pungalotohoa and inspect his land, house, and
    wives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Pungalotohoa’s dwelling, Muni receives no answer at the shut gate, breaks
    the gate, uproots Pungalotohoa’s kava, and leaves a message inviting Pungalotohoa
    to seek him if he wants to drink the kava with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Muni tears the kava in two on the road and shakes earth from each half on
    opposite sides of the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pungalotohoa returns, sees the broken gate and uprooted kava, and hears from
    his people that Munimatamahae did it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pungalotohoa angrily overtakes Muni on the road and asks why Muni broke the
    gate and took the kava.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pungalotohoa and Munimatamahae hold a throwing contest; Pungalotohoa throws
    and breaks trees, while Munimatamahae throws farther, breaking coconuts and other
    trees, and Pungalotohoa is outdone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pungalotohoa and Munimatamahae box; each throws the other, but Pungalotohoa’s
    bones are broken, his body is crushed, and he dies before coming back to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being beaten, Pungalotohoa gives Muni the land of Tonga, his wives,
    and chiefship, and says he will remain outside the land as punga on shore and
    in the sea.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that Pungalotohoa became the stone called punga.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Muni builds a large house, brings his father to live there instead of in the
    bush, and gathers the remaining bush people at a cave formerly used by Pungalotohoa
    to kill and roast people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The song calls Muni a conqueror and says his wisdom and ideas were so great
    that even Loau would not surpass him.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the song, Motukuveevalu and Punga fight; Punga chases and overcomes Motuku
    at Haatafu, and Motuku then lives in a cave while his wife leaves on a vessel.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the song, a storm comes after the vessel has sailed for one night; a woman
    is brought from the smaller canoe, cut up, found to be pregnant, and Muni is thrown
    into the ocean.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Muni is not eaten by a shark, drifts ashore at Lofanga, is found on a big
    rock by a torch-fishing couple while a plover pecks his eye, and is adopted and
    raised by them.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: The adopted Muni grows enormous, but his face is damaged because one eye is
    torn.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: When assigned part of a canoe-house, Muni says the work will not be difficult,
    breaks great coconut trees, uproots a koka tree, and builds the structure in one
    day.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Muni later says he has been betrayed and that others may have thought he would
    die.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: Muni asks two old people to tell him who his father is; he is told to go to
