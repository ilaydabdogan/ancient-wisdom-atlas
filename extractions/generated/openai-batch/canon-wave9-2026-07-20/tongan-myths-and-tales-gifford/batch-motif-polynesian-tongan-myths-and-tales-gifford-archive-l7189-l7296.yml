canonical_text:
  quote: ''
  summary: Muni comes to Punga’s home at Poha while Punga is fishing, forces entry,
    rapes Punga’s concubines, uproots a large kava plant, and challenges Punga. Flying
    foxes, especially a white one, signal trouble to Punga, who returns and pursues
    Muni. Muni has torn the kava plant in two and shaken its soil into two mounds.
    Punga and Muni wrestle and each throws the other; an explanation is given for
    soft coral and a weak coral rat. Later Muni voyages with a Fijian companion to
    Ono in Fiji, where a big dog has eaten the people. The dog kills the Fijian and
    drags him to its cave. Muni tracks the blood, kills the dog by tearing it in two,
    then returns sadly to his canoe, lies down to die, and drifts.
  language: English
  quote_policy: summarized
