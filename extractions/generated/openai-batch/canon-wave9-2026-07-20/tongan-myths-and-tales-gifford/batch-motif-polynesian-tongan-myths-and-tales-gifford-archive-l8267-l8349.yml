canonical_text:
  quote: ''
  summary: The excerpt follows Kae after a canoe is lost at an enormous pandanus tree.
    Kae swims to an island, encounters the bird Kanivatu and whales, clings to the
    bird during flight, and falls at Samoa. Sinilau makes him an attendant. A whale
    shoulder is swallowed by Sinilau’s wife, who gives birth to twin whales, Tonga
    and Tunungatofuaa. Sinilau sends the whale twins to carry Kae to Tonga and requests
    return goods, but Kae has the whales speared; Tununga is killed and Tonga escapes
    to report to Sinilau. Sinilau then assembles the gods of Samoa and gives them
    instructions involving places, baskets, and Kae.
  language: English
  quote_policy: summarized
