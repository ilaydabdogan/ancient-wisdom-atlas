canonical_text:
  quote: ''
  summary: Muni is repeatedly targeted by chiefs and people who try to kill him by
    enclosing him under a boat and later by cutting a boat loose at sea after removing
    its equipment. He survives by bailing with a food bowl and paddling with a board,
    returns to his foster parents, learns that his pregnant mother was killed and
    eaten and that he was cast into the sea and found by them, then travels to Tonga
    to find his father. A rail guides him to his father, who hides in the bush from
    the cannibal chief Pungalotohoa. Muni clears brush and cooks food despite his
    father's fear that smoke will reveal them.
  language: English
  quote_policy: summarized
