canonical_text:
  quote: ''
  summary: The passage recounts Vae/Vaelaveamata’s unusual birth, abandonment, fostering,
    concealment, discovery by Tui Tonga fishermen, transfer to Mua, renaming during
    a dance, marriage to Tui Tonga Takalaua, Takalaua’s murder, the sons’ pursuit
    of the murderers before burial, Kauulufonuafekai’s succession, appointments of
    island governors, and the origin of an upper/lower social division with distinct
    kava customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaelaveamata is introduced as the wife of Tui Tonga Takalaua; when born, she
    had a head like a pigeon, and her parents disliked her, left her on Ata, and sailed
    away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahe found the abandoned child in the bush and brought her to his wife, and
    the couple cared for her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the girl grew, she gradually lost the pigeon head and became very beautiful;
    her foster parents hid her in their store room when anyone approached because
    they feared chiefs would seize her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tui Tonga fishermen saw the girl sunning herself at Ata, reported her beauty
    to the Tui Tonga, and the Tui Tonga ordered a boat to bring her to Mua.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During a Fijian dance, the Tui Tonga beat the drum while watching Vae and
    ordered her moved from the last row to the second row and then to the front row.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The drumbeat was wrong while Vae was farther away and became correct when
    she was in the front row; the Tui Tonga renamed her Vaelaveamata because the improperly
    used drumsticks had struck his face.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vae/Vaelaveamata became the wife of Takalaua and bore the children Kauulufonuafekai,
    Moungamotua, Latuteovave, Melinoatonga, and Lotauai.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Takalaua was murdered while eating at Mataaho by Tamasia and Malofafa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman carried news to Takalaua’s children, who were sailing boats; her sitting
    posture and her phrase about new information are given as explanations for the
    place names Faite and Talafoou.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the sons found their father dead, they kissed his feet; Kauulufonuafekai
    told his brothers not to bury their father until they had found and slain the
    murderers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The brothers fought the harborers of the murderers and pursued the fugitives
    through multiple islands until the murderers were captured at Uea; they later
    returned to Tongatabu to bury their father.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kauulufonuafekai was appointed Tui Tonga and apportioned islands and offices
    to his brothers and other named governors.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Moungamotua was appointed Tui Haatakalaua and protector of the Tui Tonga;
    the passage says this arrangement produced an upper and lower division of people
    with distinct kava-making, kava-distribution, and seating practices.
  category: relationship
  evidence_refs:
  - ev:10
