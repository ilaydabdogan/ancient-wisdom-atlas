canonical_text:
  quote: ''
  summary: The passage gives the end of a Sisimatailaa story and then a variant. In
    the main story, Sisimatailaa, son of the sun, seeks wedding garments for marriage
    to the Tui Tonga’s daughter. The sun gives him two parcels, Monu and Mala, forbidding
    him to open Mala. He opens Mala and disaster falls on the world, but he brings
    Monu to his mother; at the wedding Monu yields radiant garments. The bride later
    bears Fakatouio. In the variant, a woman becomes pregnant to the sun and bears
    Sisimatailaa. When grown, he seeks the sun, receives Monu and Mala, is warned
    not to touch Mala, marries in Samoa, and later opens Mala after his wife urges
    him; goods pour out, the vessel sinks, and the pair drown.
  language: English
  quote_policy: summarized
