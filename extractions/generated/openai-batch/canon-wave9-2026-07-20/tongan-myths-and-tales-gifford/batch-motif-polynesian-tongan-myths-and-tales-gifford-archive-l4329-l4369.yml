  summary: The passage narrates the origin of Seketoa as an immortal fish god of the
    seas near Niuatoputapu and Tafahi. It gives his ruling-line genealogy, describes
    Moimoi’s jealousy and failed attempt to kill him, and ends with Seketoa’s statement
    that he will drown himself, become a fish, guard the seas, and answer Maatu’s
    call in fish shape.
