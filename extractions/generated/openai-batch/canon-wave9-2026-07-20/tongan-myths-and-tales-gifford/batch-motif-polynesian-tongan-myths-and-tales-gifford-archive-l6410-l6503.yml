canonical_text:
  quote: ''
  summary: The passage introduces Pungalotohoa as a violent cannibal strongman in
    Tonga and Munimatamahae as another strong man. Motukuveevalu hides from Pungalotohoa
    and sends his pregnant wife away by boat with two yams. People on the boat kill
    and bake the woman; the yam heads become two reefs. The woman's viscera and living
    unborn child are cast into the sea and drift to Lofanga, where an old couple finds
    and adopts the child. The child is named Muni after the beach and Matamahae after
    the plover-torn face, grows very strong and mischievous, and causes anger among
    the chiefs and people of Lofanga.
  language: English
  quote_policy: summarized
