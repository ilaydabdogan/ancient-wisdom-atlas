canonical_text:
  quote: ''
  summary: The passage frames a tale as an origin account for heavenly bodies, especially
    the Magellan Clouds. It begins with the chief Maafu, his bathing at a water hole,
    a female lizard who swallows his discarded coconut husk, the birth of human-appearing
    twin boys, their recognition of Maafu as father, their mischievous and athletic
    behavior, and Maafu's failed attempt to send them into danger at a water hole
    guarded by a huge duck.
  language: English
  quote_policy: summarized
