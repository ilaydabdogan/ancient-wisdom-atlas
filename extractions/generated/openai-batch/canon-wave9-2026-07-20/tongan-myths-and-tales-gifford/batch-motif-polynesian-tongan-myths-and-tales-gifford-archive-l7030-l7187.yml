candidate_motifs:
- id: motif:1
  label: Sea-cast child survives and is adopted
  taxonomy_refs:
  - miraculous_child
  basis: The child is thrown into the sea after his pregnant mother is killed, drifts
    to Lofanga, is found alive, adopted, named Muni, and later grows strong.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly call the survival miraculous or divine;
    the label is based on the narrative sequence.
- id: motif:2
  label: Extraordinary strength displayed through impossible tasks
  taxonomy_refs:
  - culture_hero
  basis: Muni completes the canoe-house work by uprooting trees, saves himself by
    bailing a double boat with single scoops, and creates the deep Telio hole with
    one shove.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage presents heroic strength but does not explicitly describe
    Muni as a culture hero or as founding a custom.
