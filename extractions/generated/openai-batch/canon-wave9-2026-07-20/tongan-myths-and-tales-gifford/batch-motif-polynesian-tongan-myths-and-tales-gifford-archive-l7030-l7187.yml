  label: Quest for true parentage and return to father’s land
  taxonomy_refs:
  - departure
  - return
  basis: After learning he is not the son of the Lofanga couple, Muni asks who his
    parents are, sails to Tongatabu, follows the rail, and finds his father.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The term 'return' is interpretive because Muni himself grew up away from
