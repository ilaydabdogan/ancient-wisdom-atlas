canonical_text:
  quote: ''
  summary: The passage explains a story about Muni. Motukuveevalu and Punga fight,
    Motuku is driven away, and Punga rules Tongatabu. Motuku’s pregnant wife boards
    a vessel; during starvation at sea she is killed and the child is thrown into
    the sea. The child drifts to Lofanga, is found and adopted by a couple, and is
    named Muni. Muni grows very strong, survives hostile plots, learns he is not the
    couple’s son, sails to Tongatabu, follows a rail to his hidden father, and declares
    his intention to seek out Punga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening verse describes Muni standing and wrestling with an unnamed opponent,
    lifting or waving him high, and a complaint from above that Muni has the land
    while the speaker is coral on land and sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Motukuveevalu dwelt in Hihifo, Pungalotohoa or Pungalotolava dwelt in Hahake,
    and after they fought Motukuveevalu was chased to Haatafu while Punga ruled in
    Tongatabu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Motukuveevalu’s wife went along the sea shore to Hahake, boarded a vessel,
    and wanted to see foreign lands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The voyagers had no food, were starving near two reefs in Haapai, killed the
    pregnant woman, and threw the child into the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child drifted to Lofanga island and lay on a rock, where a man and his
    wife heard him cry when a plover pecked him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man and wife took the child home, adopted him, and called him Muni.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Muni grew strong and self-willed, and the island people envied him and tried
    to find a way to hurt him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the island people assigned an impossible canoe-house task to the man
    and wife, Muni told them not to cry, tore down full-grown trees, pulled up the
    koka tree for the house, and completed the work quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The island people and the man and wife planned a fishing trip to Meama, left
    Muni asleep to watch the canoe, removed the paddles, sculling oar, bailing scoop,
    and other items, untied the canoe, and fled to Lofanga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Muni woke when noise from a broken bowl alerted him as the vessel was nearly
    swamped.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Muni bailed each hull of the double boat with one large scoop, tore up one
    connecting pole, and sculled back to Lofanga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Lofanga, Muni listened by a large banana tree and heard the man and wife
    say he was not their son.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Muni asked who his parents were, and the man and wife told him his father
    was at Great Tonga, that he should anchor at Telio in Hihifo, and that he should
    follow a rail as the road to his home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Muni and his Fijian companion sailed to Tongatabu; the Fijian could not bore
    the anchor stick into the stone at Telio, but Muni pushed once and made a deep
    hole.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Muni followed a rail, saw it enter a bower, lifted the creeper, and found
    his father lying underneath.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Motukuveevalu did not at first know Muni was his son, but after Muni explained,
    he remembered and kissed and talked to him.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Motukuveevalu told Muni not to speak loudly because he was hiding from enemies,
    but Muni spoke louder and said to call their relations while he went to seek someone
    to fight, meaning Punga.
  category: speech
  evidence_refs:
  - ev:11
