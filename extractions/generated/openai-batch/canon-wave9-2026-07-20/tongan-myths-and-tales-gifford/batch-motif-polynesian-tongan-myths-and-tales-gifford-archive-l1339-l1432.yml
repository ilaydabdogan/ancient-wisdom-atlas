canonical_text:
  quote: "“This great casuarina tree reached to the sky, and a god came down from
    the sky by this great tree.”"
  summary: The passage relates an origin tale in which Kohai, the first Tui Tonga,
    comes from the head of a worm or grub. A sky god, Tangaloa Eitumatupua, descends
    by a sky-reaching casuarina tree, cohabits with Ilaheva/Vaepopua, fathers Ahoeitu,
    provides clay and a yam from the sky for the child, and later receives Ahoeitu
    when the grown child climbs the tree to the sky. The excerpt ends with Ahoeitu
    encountering his celestial brothers, who become jealous of him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Human offspring of a worm or grub first appeared on earth; the head of the
    worm became Kohai, named as the first Tui Tonga, and the worm’s descendants became
    numerous.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large casuarina tree grew on Toonangakava between Mataaho and Talakite in
    the lagoon of Tongatabu and reached to the sky.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tangaloa Eitumatupua, a god, came down from the sky by the great casuarina
    tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilaheva, also called Vaepopua, was fishing when the sky god came to her, caught
    her, and cohabited with her; their sleeping place was called Mohenga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The god ascended by the casuarina and later returned; after he and Ilaheva
    slept on Talakite and overslept until dawn, a tern called tala saw them and cried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The island name Talakite is explained as commemorating the tern seeing them,
    and another island is called Mataaho, glossed as Eye-of-day.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ilaheva became pregnant, gave birth to a male child, and tended the child
    on earth while the god dwelt in the sky.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The god asked about the child and named him Ahoeitu, glossed as Day-has-dawned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After asking whether Ilaheva’s land was clay or sand, the god said he would
    throw down clay and a yam from the sky for Ahoeitu’s garden; the passage names
    the mount Holohiufi and the yam heketala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ahoeitu grew up at Popua with his mother and asked who his father was; his
    mother told him that his father, Eitumatupua, was in the sky.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Ahoeitu wanted to go to the sky but had nothing to travel in, his mother
    told him to climb the great casuarina because it was the road to the sky.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Before Ahoeitu’s ascent, his mother gave him a tapa loin cloth, anointed his
    head with oil, and told him he would find his father catching pigeons on a mound
    by a wide road in the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ahoeitu climbed the great casuarina, reached the sky, followed the road, found
    the mound, and saw his father catching pigeons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When Eitumatupua saw Ahoeitu, he sat down; Ahoeitu addressed him respectfully
    and told him not to sit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Ahoeitu and Eitumatupua pressed noses and cried; Ahoeitu said he had come
    from earth, sent by his mother Ilaheva to seek his father.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Eitumatupua took Ahoeitu to his residence, where they had kava and food.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Eitumatupua’s celestial sons were playing sikaulutoa; Ahoeitu went to watch,
