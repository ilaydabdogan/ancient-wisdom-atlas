canonical_text:
  quote: ''
  summary: An old man has tried to alter a girl's choice of husband in favor of his
    son, but the king declares that the daughter has chosen Tulifaukiave. Tulifaukiave
    fetches his sister Hina, and the siblings display poverty before coming to the
    king's house. Hina is bathed and clothed, Tulifaukiave marries the king's daughter,
    and Hina marries the king's son. The two couples rule different parts of the country.
    Their children later marry, and the passage explains this as the origin of a chiefly
    Tongan mat-rolling custom connected with perpetuating chiefly blood through marriage
    among relatives.
  language: English
  quote_policy: summarized
