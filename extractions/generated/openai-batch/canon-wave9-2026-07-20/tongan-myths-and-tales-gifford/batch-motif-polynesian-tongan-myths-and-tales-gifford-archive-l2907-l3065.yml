canonical_text:
  quote: ''
  summary: A younger brother, Nganatatafu, accompanies his elder brother Tatafumeimua
    to Samoa, where the elder intends to court Hina. Hina summons Nganatatafu after
    a servant sees his striking hair, and she gives him bonito fish as a remembrance;
    the fish follow him to Haano, where their arrival, custody, chiefly portions,
    and tapu restrictions are explained.
  language: English
  quote_policy: summarized
