canonical_text:
  quote: ''
  summary: 'The passage closes a male Tui Tonga genealogy, then recounts episodes
    concerning the Tui Tonga Telea/Uluakimata: the status and rival portions of his
    wives, Mataukipa’s complaint to her father and his explanation that her children
    will rule, the later fulfillment of that prediction through Fatafehi and Sinaitakala,
    and a separate episode in which Lolomanaia uses a tree to enter Telea’s fenced
    mountain dwelling and sleep with Talafaiva, leaving a black tattoo mark as evidence
    and provocation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists male Tui Tonga succession material, says the old Tui Tonga
    are offspring of the Worm and are gone, and says the female Tui Tonga list is
    not given.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Telea, also called Uluakimata, has many wives, including Talafaiva, Nanasilapaha,
    and Mataukipa, each associated with additional wives brought to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Talafaiva is described as exceptionally beautiful and as a very high-ranking
    chief because both of her parents were chiefs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mataukipa repeatedly receives the tail of the fish and rump of the pig, while
    Talafaiva and Nanasilapaha receive preferred fish and pig portions; this troubles
    Mataukipa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mataukipa carries her child to her father Kauulufonuahuo at Mataliku, where
    he is described as an industrious gardener and food is prepared.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kauulufonuahuo tells Mataukipa not to grieve because her portions mean that
    land will come to her children and they will be rulers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Telea dies, Mataukipa’s son Fatafehi is appointed Tui Tonga, her daughter
    Sinaitakala becomes female Tui Tonga, and her descendants continue as Tui Tonga
    down to Laufilitonga.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Telea prefers to dwell in the bush, especially on the weather shore of Vavau,
    where dwelling and sleeping places are named after deeds he performed there.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Telea and Talafaiva live on Euakafa in a house on a mountain top, enclosed
    by a reed fence, with a large foui tree nearby; Talafaiva asks that the tree be
    cut down, and Telea refuses.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lolomanaia comes from Makave by vessel because he is in love with Talafaiva,
