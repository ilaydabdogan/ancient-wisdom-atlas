canonical_text:
  quote: ''
  summary: The passage recounts Tuitatui, a Tui Tonga at Heketa, his sister Latutama,
    a female Tui Tonga, and an episode in which he lures her into a loft by falsely
    claiming a fleet is arriving. After she ascends, he seizes her; maidens below
    see blood and he explains it as from a flying fox, giving rise to the place-name
    Toipeka. The passage also attributes the Haamonga-a-Maui and other structures
    to Tuitatui. After his death, his sons Talaatama and Talaihaapepe move the Tui
    Tonga residence from Heketa to Fangalongonoa/Mua with two named boats.
  language: English
  quote_policy: summarized
