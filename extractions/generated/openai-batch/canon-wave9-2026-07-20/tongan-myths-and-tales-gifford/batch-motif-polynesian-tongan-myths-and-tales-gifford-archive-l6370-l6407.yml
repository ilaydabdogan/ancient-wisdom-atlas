canonical_text:
  quote: ''
  summary: Muni hears of a strong Fijian warrior, visits him, agrees to a wrestling
    trial, and kills him by throwing him into the air. The account then states uncertainty
    about whether Muni returned to Tonga or remained in Fiji. A brief variant, titled
    “Muni-of-the-Torn-Eye,” says Kae, Muni’s mother, gives birth at the foot of a
    ngahu tree on Luangahu; the vessel chief throws the baby boy into the sea; waves
    carry him to a reef in Lofanga; a plover pecks one eye; and Sinilau takes him
    ashore and names him Muni.
  language: English
  quote_policy: summarized
