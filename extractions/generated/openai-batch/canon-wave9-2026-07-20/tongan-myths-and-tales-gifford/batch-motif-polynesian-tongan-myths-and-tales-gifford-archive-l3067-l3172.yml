canonical_text:
  quote: "“Take this bonito with you to Haano and once every year you will see it,
    as a proof that my love is unchanged.”"
  summary: The passage first describes broken laws and taboos around the bonito gift
    and the strength of the bonito return at Haano. In the variant tale, the Tui Tonga
    goes to Samoa to bring back Hina as a wife, but restricts the handsome Haano chief
    Nganatatafu from going ashore. Hina hears of Nganatatafu, meets him at night,
    and tries to run away with him. When he returns to the departing Tongans, she
    gives him a live bonito to take to Haano as a yearly sign of her unchanged love.
    The Tui Tonga forces Nganatatafu and his attendants overboard near Haano; one
    attendant, Fisiu, dies, giving a sandy point its name. The tale explains why bonitos
    come close to Haano once a year and why they retreat if Tui Haangana, a descendant
    of Nganatatafu, appears.
  language: English
  quote_policy: quoted
