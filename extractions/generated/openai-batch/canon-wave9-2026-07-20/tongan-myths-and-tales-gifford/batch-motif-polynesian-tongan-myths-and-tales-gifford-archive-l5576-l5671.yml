canonical_text:
  quote: ''
  summary: In the close of one account, Maafu sends two boys to fetch bottom water
    from a pond that contains a huge parrot fish; one boy catches the fish by thrusting
    his arm down its throat. After Maafu announces plans to send the boys away, they
    say they will go to the sky with their duck and fish. They ascend and are identified
    as Maafu Toka and Maafu Lele, stars known as the Magellan clouds and useful for
    navigating to Vaini. A variant begins with Maafu Tukuiaulahi, a high chief at
    Vaini, whose bath spring has fetaanu trees inhabited by a female lizard. The lizard
    sucks his used coconut-husk brush, becomes pregnant, and gives birth to two boys
    named Maafu Toka and Maafu Lele. The boys seek their father, disrupt a kava gathering
    with a sika spear, are recognized by the chief as his children, but later kill
    children and become feared by the people.
  language: English
  quote_policy: summarized
