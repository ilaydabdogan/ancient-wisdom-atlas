  summary: A Fijian god transporting two fish in taro leaves is struck by another
    god’s stone, spilling the fish at the edge of Pasiki rather than in the town center
    where Haelefeke had instructed they be placed to form a lake. Later, the Samoan
    god Moso and other Samoan gods steal the island Tanoa from Nomuka’s lake, but
    Tafakula deceives them with a sun-bright bodily display, causing them to think
    daybreak has come, drop Tanoa between Mango and Fonoifua, and flee to Samoa.
