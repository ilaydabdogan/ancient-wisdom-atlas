canonical_text:
  quote: ''
  summary: A tale explains that the little island of Tanoa was once in the middle
    of Nomuka lagoon. The god Haelefeke, from the Otutolu islands, stole it and began
    carrying it away. Near Fonoifua, Tafakula produced an eastern light from his anus;
    Haelefeke mistook it for sunrise, dropped the island, and fled, leaving Tanoa
    beside Fonoifua.
