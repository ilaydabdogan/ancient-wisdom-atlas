  text: Four named gods embark in a boat with the stated intention of journeying to
    Pulotu, described as the unseen world and land of the departed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Faimalie stands on the beach, asks the boat party where they are going, and
    asks to go with them.
  category: action
  evidence_refs:
