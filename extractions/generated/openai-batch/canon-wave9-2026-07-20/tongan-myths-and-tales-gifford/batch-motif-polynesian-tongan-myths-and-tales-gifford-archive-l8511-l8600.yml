  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hikuleo summons the Haamatakikila, Those of the Piercing Eyes, but they fail
    to find the hidden travelers.
  category: action
  evidence_refs:
  - ev:6
