    outrigger or bail water, and the party eventually accepts her aboard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The five travelers reach Pulotu, pull their boat onto the beach, go to Hikuleo's
    house while Hikuleo is absent, and hide there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: People of Pulotu see the boat on the beach, suspect it is from the world,
    search for the crew, and report to Hikuleo that they cannot find them.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: 'The five travelers conceal themselves by transformation or placement: one
    becomes a small insect in a roof post, others go into the ground, one hides in
