  text: The hidden gods breathe audibly in mockery after searches fail, prompting
    the people of Pulotu to continue seeking them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Those of the Keen Scent, the Guessers, and Those-of-the-Sharp-Ears are called
