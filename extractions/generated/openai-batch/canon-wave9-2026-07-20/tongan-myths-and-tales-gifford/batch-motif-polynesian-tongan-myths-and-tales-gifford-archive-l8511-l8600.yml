canonical_text:
  quote: ''
  summary: Four named gods set out by boat for Pulotu, the unseen world and land of
    the departed. The goddess Faimalie joins them despite their concern that the boat
    is overloaded. They arrive in Pulotu, hide in Hikuleo's house, and evade repeated
    searches by Pulotu's people and by specialized groups with piercing eyes, keen
    scent, guessing ability, and sharp ears. Hikuleo then prepares to investigate
    personally.
  language: English
  quote_policy: summarized
