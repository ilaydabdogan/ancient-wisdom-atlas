canonical_text:
  quote: ''
  summary: A pregnant woman from Haapulou eats a tied pigeon described as her household
    god. While voyaging, she gives birth at Ata to a child with a pigeon’s head. The
    parents abandon the child and placenta under refuse, but islanders Ahe and Tofue
    find the crying infant, adopt her, and raise her until she becomes an exceptionally
    beautiful maiden named Ulukihelupe. Fisherman Hele sees her bathing while on a
    royal fishing errand, reports her beauty to Tui Tonga Takalaua, and the chief
    orders that she be brought to him, threatening her adoptive parents with death
    if they refuse. Ulukihelupe is taken to Takalaua, lives with him, and gives birth
    to his first child, Kauulufonua.
  language: English
  quote_policy: summarized
