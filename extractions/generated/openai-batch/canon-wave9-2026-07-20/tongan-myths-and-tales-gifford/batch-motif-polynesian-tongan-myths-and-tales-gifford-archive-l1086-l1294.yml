canonical_text:
  quote: ''
  summary: The passage introduces Tongan Maui traditions, gives a poem praising Maui
    exploits, then gives a prose account in which several Maui figures come from Pulotu
    bringing fire, begin the first weeding on earth, and explain why weeds regrow
    and why fire is found in trees. It also summarizes variant Tongan accounts of
    the low sky being raised by different Maui figures, notes a comparison to Philippine
    low-sky tales, and begins an unpublished episode in which Maui's family weeps
    because he leaves them hungry.
  language: English
  quote_policy: summarized
