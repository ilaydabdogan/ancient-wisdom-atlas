canonical_text:
  quote: ''
  summary: The passage tells of Matangi and Malu, whose first daughters are albino
    female twins with cannibal appetites. The twins eat a later child and are described
    as spirit-possessed. When another daughter is born, the parents hide her in an
    elevated house and use foul smells to make the twins believe she is leprous. The
    girl, Ofahekakala, grows up beautiful. Sinilau travels to seek her as a wife,
    resists the albino twins' attempt to deter him, meets her, and arranges marriage.
    Their son Loau is later associated with Haamea, Haaloau, and a voyage to the horizon
    with attendants Longopoa and Kae.
  language: English
  quote_policy: summarized
