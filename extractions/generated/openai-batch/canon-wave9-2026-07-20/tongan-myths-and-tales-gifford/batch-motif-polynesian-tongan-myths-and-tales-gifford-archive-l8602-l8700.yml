canonical_text:
  quote: ''
  summary: In Pulotu, Hikuleo calls five hidden gods from the world to reveal themselves.
    Hikuleo and the people of Pulotu offer them an immense kava under threat of death
    if it is not finished. Four gods drink, become drunk, and weep, while Faimalie,
    an old goddess whom the others had nearly left off the overloaded boat, remains
    quiet. Faimalie drinks the remaining kava and consumes the bowl, strainer, kava
    stalks, kava root, and twenty coconut trees. Angered, Hikuleo orders a huge cooked
    feast and again threatens death if the food is not eaten.
  language: English
  quote_policy: summarized
