canonical_text:
  quote: ''
  summary: Two Vavau men travel to Tongatabu to see Fatafehi, daughter of the Tui
    Tonga. Fatafehi agrees to marry Lolomanaia, titled Tui Afitu, and sails with him
    toward Vavau. Near Fonoifua she asks the island's name, calls it her first son,
    and gives it to Lolomanaia. The passage explains that the island later belongs
    to the present Tui Afitu, descendant of Lolomanaia, while the former chief Taifonoifua
    was dispossessed. Fatafehi is described as the female Tui Tonga with authority
    to dispose of the island.
  language: English
  quote_policy: summarized
