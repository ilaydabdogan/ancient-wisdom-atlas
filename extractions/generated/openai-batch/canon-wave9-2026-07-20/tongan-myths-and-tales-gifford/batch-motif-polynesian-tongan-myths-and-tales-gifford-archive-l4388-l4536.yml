candidate_motifs:
- id: motif:1
  label: Origin of a local fish species through transport between islands
  taxonomy_refs:
  - culture_hero
  basis: The variants explain how ava fish came from Samoa or from an earlier location
    to Nomukeiki and Nomuka through the actions of Nomu and Iki and, in one version,
    Heimoana.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage is an origin account for a fish species, but the available
    taxonomy term 'culture_hero' only partly fits the human and divine bearers.
