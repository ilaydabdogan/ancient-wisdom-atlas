canonical_text:
  quote: ''
  summary: The passage gives variants explaining the origin and movement of the ava
    fish of Nomuka and Nomukeiki. In some versions Nomu and Iki bring the fish from
    Samoa and transfer them between lakes until they thrive. Another version has fish
    discovered in a water-filled hole in a chestnut tree after a white tern repeatedly
    flies over it. The fish are transported in leaf or wooden containers, offered
    as tribute, moved by the god Heimoana, and associated with lake and sea ava. A
    further variant names early inhabitants and gods who guard the fish against a
    Fijian god intending to take them.
  language: English
  quote_policy: summarized
