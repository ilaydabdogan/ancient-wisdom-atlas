comparison_claims:
- id: claim:1
  claim: 'The Nomu-and-Iki variants share the same broad origin pattern: ava fish
    are moved from Samoa through several islands or lakes until a suitable Tongan
    water body is found, and local names are explained through the bearers.'
  claim_level: same_motif
  target: Internal passage variants of the ava-fish origin at Nomuka and Nomukeiki
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: The Tanoa Island variant changes Nomu and Iki from a married Samoan
    couple to siblings born at Nomuka, so the shared pattern is not identical across
    all versions.
- id: claim:2
  claim: The Fijian-god episode fits a guarded-resource and attempted-sacred-theft
    pattern because a god plans to steal live ava fish under the surveillance of Tafakula
    and Haelefeke.
  claim_level: same_motif
  target: sacred_theft motif family
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt does not show a successful theft; Haelefeke gives two small
    fish after warning and delay.
- id: claim:3
  claim: Tafakula's ability to appear as either male or female is functionally similar
    to a shapeshifter motif, but the passage provides only a descriptive attribute
    rather than a transformation scene.
  claim_level: same_function
  target: shapeshifter motif family
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The claim is limited because no action of changing form is narrated.
