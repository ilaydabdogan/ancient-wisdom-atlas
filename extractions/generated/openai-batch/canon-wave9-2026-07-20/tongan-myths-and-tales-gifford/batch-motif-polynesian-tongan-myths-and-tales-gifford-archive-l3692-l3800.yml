canonical_text:
  quote: ''
  summary: The passage introduces Tongan origin-of-kava variants connected with Loau
    and then gives one version in which Fefafa and Fevanga host the chief Loau/Tui
    Tonga on Eueiki during a food shortage. Lacking meat, they kill their daughter
    Kavaonau for the oven. Loau refuses the act, orders burial, and after five nights
    kava grows from the daughter's head and sugar-cane from her intestines. A rat
    demonstrates the effects of each plant, and Loau identifies the plants and prescribes
    implements and roles for kava preparation. The tale explains the appearance of
    kava and the scaly skin of excessive kava drinkers through Kavaonau's leprosy.
  language: English
  quote_policy: summarized
