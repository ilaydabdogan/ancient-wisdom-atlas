canonical_text:
  quote: ''
  summary: A Tui Tonga punishes two attendants who burned his house by ordering them
    to go to Pulotu for breadfruit-wood house material. On the way, the goddess Fehuluni
    redirects them to Samoa and Faifaimalie’s house. While Faifaimalie is away fishing,
    Fehuluni and the attendants take the body of the Tui Tonga’s son, and Fehuluni
    swallows two unknown yam varieties. During the return voyage the yams emerge near
    Haapai; they are taken to Peu to plant for the Tui Tonga, while the son’s body
    is carried to Tongatabu for burial. Peu later supplies yams to the Tui Tonga and
    receives land. The two yam varieties are named kaliokaho and kaumcle and are contrasted
    with the heketala yam associated with Ahoeitu.
  language: English
  quote_policy: summarized
