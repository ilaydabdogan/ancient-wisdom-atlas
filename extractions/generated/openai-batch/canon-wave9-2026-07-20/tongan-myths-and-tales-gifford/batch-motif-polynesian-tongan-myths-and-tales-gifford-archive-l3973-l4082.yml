canonical_text:
  quote: ''
  summary: Two Tongan variants recount Tui Tofua, son of Vakafuhu and Langitaetaea.
    After a sika-playing incident involving Vakafuhu’s concubines and/or Vakafuhu’s
    rebuke, Tui Tofua departs by canoe with first-born male companions and a Samoan
    companion. The companions enter the sea and become sharks; in the variant Tui
    Tofua becomes a man-eating shark. The Samoan avoids full shark transformation,
    cuts off a finger, and the finger becomes a porpoise. He carries Tui Tofua’s message
    for relatives to bring garlands, and in the variant tapa, to Siuatama beach, where
    the transformed shark-kin receive offerings or adornment.
  language: English
  quote_policy: summarized
