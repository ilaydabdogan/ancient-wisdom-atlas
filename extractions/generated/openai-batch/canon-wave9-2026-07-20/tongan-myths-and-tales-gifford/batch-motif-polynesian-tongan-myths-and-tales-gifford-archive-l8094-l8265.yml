canonical_text:
  quote: the big pandanus tree, that stood at the edge of the world.
  summary: Loau builds a vessel in a pool and undertakes an otherworldly voyage toward
    Pulotu despite warnings. The travelers pass successive strange seas and reach
    a pandanus tree at the edge of the world, where Kae and Longopoa separate from
    Loau's vessel as it passes through a hole in the sky and is lost. Kae reaches
    an island of the man-eating Kanivatu bird, uses the bird to reach Samoa, is hosted
    by Sinilau, and is sent to Tonga on twin whales. Kae betrays this hospitality
    by killing and eating one whale, Tununga, while Tonga escapes and reports to Sinilau.
    Sinilau has the gods retrieve Kae, who is reproved, cursed, killed, and buried.
    Tununga's pieces are placed in a tub and he comes alive again, though missing
    a tooth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Loau is described as a chief living at Haamea who built a vessel for use in
    his pool, causing people to deride the idea because the vessel was not dragged
    to the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Loau instructs his people to prepare provisions for a voyage to see the big
    talking puko tree and wonders at Pulotu, identified in the passage as the residence
    of the gods; he refuses navigators' advice to call in because the canoe is unsuitable
    for a long voyage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The voyage continues toward the horizon through a shallow sea, a floating
    pumice-stone sea, and a slimy sea, where the travelers lower the sail and drag
    the vessel.
  category: setting
  evidence_refs:
  - ev:3
  - ev:11
- id: obs:4
  text: At a big pandanus tree standing at the edge of the world, the mast becomes
    entangled; Kae and Longopoa cling to the branches, and the vessel is shoved through
    a hole in the sky and lost with Loau and his friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kae and Longopoa decide to swim separately when the tide comes in; after many
    days Kae reaches an island inhabited by the enormous man-eating bird Kanivatu,
    where whales and many fish lie aground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kae hides from Kanivatu, then grips the bird's breast while it flies; the
    bird carries him until he lets go near land and falls in Samoa at Akana.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sinilau, chief of the place in Samoa, treats Kae kindly and makes him a friend;
    Kae wishes to return to Tonga, and Sinilau sends the twin whales Tonga and Tunungatofuaa
    to take him to Tongatabu with presents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kae decides to kill the two whale escorts, tricks them into shallow water,
    and has people spear them; Tununga is killed, divided among chiefs, cooked, and
    eaten, while Tonga escapes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tonga returns to Samoa and reports the treachery and the killing of his twin
    sibling; Sinilau angrily assembles the gods of Samoa, orders them to collect excrement
    from the places where Tununga was eaten, and has Kae brought back while asleep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kae hears Sinilau's cock, discovers he is already in Samoa, receives Sinilau's
    reproof for ingratitude, is cursed by the assembled people, killed, and buried.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pieces of Tununga are placed in a large tub, and Tununga suddenly squeaks
    and is alive again, although one tooth is missing because Kae had taken it to
    the Tui Tonga.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The included variant repeats the sailing route through distant places and
    strange seas, including a white sea, floating pumice-stone sea, and slimy sea,
    and includes Loau's refusal to stop the voyage.
  category: sequence
  evidence_refs:
  - ev:11
