canonical_text:
  quote: ''
  summary: The passage narrates Sinilau, a sky-dwelling figure, taking Mulikivaito
    from Samoa to the sky; the birth of a lizard and later children; the assignment
    of royal rule across Tonga and other islands to the children; the arrival of food
    during famine; two sisters' encounters with the lizard; and the final revelation
    that the lizard disguise conceals Sinilau, who returns to the sky while Mulikivaito
    remains on earth with her children.
  language: English
  quote_policy: summarized
