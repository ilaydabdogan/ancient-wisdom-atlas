canonical_text:
  quote: ''
  summary: During a kava reception, an old wizard sends two coconut-shell water bottles
    for water; the Tongan visitor sends clubs that break them, then uses an arrow
    in the roof to produce water. The wizard tells him of an immense eight-headed
    snake living in a neighboring mountain and ruling the people. Havili goes to the
    mountain, walks on the snake, is addressed as a great chief, and receives a feast
    that he must consume or die. He commands his clubs to eat the feast and all surrounding
    materials, after which the snake sends men to report what happened.
  language: English
  quote_policy: summarized
