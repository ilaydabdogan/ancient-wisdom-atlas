canonical_text:
  quote: ''
  summary: Talau, once a high mountain in Vavau visible from Samoa, causes jealousy
    among the gods of Samoa. They plan with Moso to carry Talau to Samoa at night.
    At midnight the Samoan gods lift Talau, but Tafakula, a Tongan god, sees them
    and tricks them by making rooster-like noises from the eastern horizon. Believing
    sunrise has come, the Samoan gods drop Talau and flee. The broken summit becomes
    Lotuma Island near Mt. Talau.
  language: English
