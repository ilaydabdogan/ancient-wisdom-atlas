canonical_text:
  quote: ''
  summary: The passage summarizes Tongan cosmogony as assuming preexistent sky, sea,
    and Pulotu rather than beginning from a void. It reviews variant accounts of Maui
    genealogy, Tangaloa Atulongolongo’s bird incarnation in a land search, an origin
    story for sexual knowledge involving twin deities at Tonga Mamao, a variant creation
    of three humans from a maggot or worm, distinctions between Maui-fished islands
    and heaven-thrown volcanic lands, and brief references to land-fishing variants
    and a sequel on wind and food plants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Tongan cosmogony does not begin with a void but assumes
    the preexistence of the sky, the sea, and Pulotu, the home of souls of departed
    chiefs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there is no hint of creation of the sea, sky, sun, moon,
    or stars in the Tongan cosmogonical tales; their preexistence is stated or tacitly
    assumed.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:3
  text: 'Variant accounts disagree about the paternity and names of the Maui: Father
    Reiter and Maatu name Taufulifonua as father, while Collocott names Biki or Piki;
    Maatu and Collocott also list variant Maui names.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maatu’s manuscript specifies that Tangaloa Atulongolongo became incarnate
    as the tulione, a kind of kin bird described as snipe or plover, while searching
    for land.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the cited manuscript account, Piki and Kele make a new country called Tonga
    Mamao and take their children Taufulifonua and Havea Lolofonua there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Taufulifonua and Havea Lolofonua are described as innocent, naked, unashamed
    twin deities who bathe in the sea as the tide rises over them.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: A fish called oo causes Havea Lolofonua pain; Taufulifonua’s attempt to relieve
    her leads to the beginning of sexual knowledge and regular cohabitation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'One garbled verbal account says three human beings were created from a maggot
    or worm: a woman named Kohai, a man named Momo, and a third person whose name
    was forgotten; the names are assigned future, present, and past meanings, probably
    by the raconteur.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Certain accounts distinguish islands fished up by the Maui from islands not
    fished up; non-fished lands include several volcanic islands and are said to have
    been thrown down from heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The non-fished countries are called land-stones of Hikuleo and are described
    as uneven, earthquake-prone, and full of holes and pits.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: A brief Maui land-fishing variant makes Eua the expedition’s starting point,
