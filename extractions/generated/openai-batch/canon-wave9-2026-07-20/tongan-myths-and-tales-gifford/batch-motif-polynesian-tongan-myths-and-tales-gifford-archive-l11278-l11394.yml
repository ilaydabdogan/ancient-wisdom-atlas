canonical_text:
  quote: ''
  summary: The passage gives two mortuary origin stories. In the first, Fau and Hanu
    mourn their only daughter; Hanu chooses a stone burial vault over Fau's proposed
    canoe coffin, and the child is adorned with fine mat clothing, a cowry-shell necklace,
    and flower garlands, which the text presents as origins of related burial and
    chiefly ornament customs. In the second, Vake, a Haano chief, is decapitated in
    fighting on Foa, carries his head back toward Haano, drops near the town, and
    is buried at Tukia, which becomes his family's graveyard; the text says his family
    god brought him back because Tongans want burial in their native places.
  language: English
  quote_policy: summarized
