canonical_text:
  quote: ''
  summary: The Emperor rebukes a man and hands him to the Mononobe for execution on
    a moor. A carpenter among the man's comrades laments Mane in a song centered on
    the carpenter's ink-cord. Hearing the song, the Emperor feels remorse, sends a
    messenger of mercy on a black horse of Kahi to stop the execution, and the bound
    man is unbound. The rescued man then sings about the black horse; a note records
    a variant reading, and footnotes explain the ink-cord and an epithet for dark
    or black things.
  language: English
  quote_policy: summarized
