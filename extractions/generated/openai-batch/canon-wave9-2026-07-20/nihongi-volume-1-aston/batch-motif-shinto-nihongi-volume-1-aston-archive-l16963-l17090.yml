canonical_text:
  quote: ''
  summary: The passage recounts a strange bird caught and presented to the Emperor,
    identified by Lord Chyu as a Kuchi known in Pékché, then tamed and used in a royal
    hunt, leading to the establishment and naming of Taka-ama. It then reports a wild
    goose egg on the Mamuta embankment, confirmed by messenger and discussed in exchanged
    songs between the Emperor and Takechi no Sukune as an unheard-of event in Yamato.
    A later section describes Silla failing to bring tribute, envoys being sent, a
    white deer presented to the Emperor, a command to invade if Silla remained recalcitrant,
    and a Silla prisoner giving tactical information about the enemy line.
  language: English
  quote_policy: summarized
