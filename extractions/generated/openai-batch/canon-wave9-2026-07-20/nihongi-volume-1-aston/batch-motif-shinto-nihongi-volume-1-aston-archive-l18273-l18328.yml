canonical_text:
  quote: ''
  summary: The passage recounts Tamada no Sukune appearing before the Emperor with
    armour hidden under his clothing, being exposed by an Uneme who serves him sake,
    fleeing, and then being captured and executed. It then records the burial of Emperor
    Midzu-hawake. A later banquet scene describes the Emperor playing the lute, the
    Empress dancing, the customary phrase by which a dancer offers a woman, the Empress
    naming her younger sister Otohime, and Otohime's exceptional radiance and beauty.
  language: English
  quote_policy: summarized
