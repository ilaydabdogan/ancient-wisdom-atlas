  quote: ''
  summary: 'The passage recounts three episodes: an emperor halts the reassignment
    of tomb guardians after a guardian named Meki changes into a white deer; a provincial
    governor reports a great floating tree that is made into an imperial vessel; and
    an imperial prince investigates a hut-like structure on a moor and receives an
    explanation of an ice-storage chamber.'
