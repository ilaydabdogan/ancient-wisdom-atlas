canonical_text:
  quote: ''
  summary: The Kings of Pékché pledge loyalty to the honourable country and its sovereign.
    Envoys later present a seven-branched sword, a seven-little-one mirror, and other
    valuables to the Empress, speak of a river-source near Mount Cholsan and the iron
    of that mountain, and instruct Prince Chhim-nyu to cultivate friendship and send
    yearly tribute. Subsequent notices record the death of King Syoko and the enthronement
    of Kusyu.
  language: English
  quote_policy: summarized
