canonical_text:
  quote: ''
  summary: 'The passage records diplomatic and court events: a violent authority in
    Imna is recalled; a Korye tribute address is rejected and torn up; the old government
    ship Karano is reused as firewood for salt, leading provinces to build ships;
    a fire in Silla lodgings burns many ships and prompts Silla to send skilled workmen;
    an unburnt remnant of Karano becomes a resonant koto commemorated in song; and
    envoys are sent toward Wu to procure seamstresses.'
  language: English
  quote_policy: summarized
