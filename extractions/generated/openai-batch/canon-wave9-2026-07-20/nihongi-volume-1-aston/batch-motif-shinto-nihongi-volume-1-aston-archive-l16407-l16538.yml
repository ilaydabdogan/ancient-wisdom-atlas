  text: The Empress replies in song with the image of a summer insect seeking fire
    and says that the palace precinct being in that condition is not good.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor answers in song with an image of a traveller crossing the little
