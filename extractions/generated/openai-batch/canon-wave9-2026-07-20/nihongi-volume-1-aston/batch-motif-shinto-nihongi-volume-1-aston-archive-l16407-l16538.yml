canonical_text:
  quote: ''
  summary: The passage recounts a poetic exchange between the Emperor and Empress,
    the Empress's refusal of consent, her excursion to Kii and Kumano, the Emperor's
    marriage to Imperial Princess Yata during her absence, the Empress's anger and
    scattering of mitsuna leaves into the sea at Naniha, the naming of Kashiha ferry,
    and later attempts by the Emperor and his attendant Toriyama to bring the Empress
    back as she continues by water and mountain routes toward Yamato.
  language: English
  quote_policy: summarized
