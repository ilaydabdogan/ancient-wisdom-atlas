  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the thirtieth year, the Empress makes an excursion to Kii, reaches Kumano,
    and returns with mitsuna leaves gathered there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the Empress's absence, the Emperor weds Imperial Princess Yata and
