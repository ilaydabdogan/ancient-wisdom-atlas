canonical_text:
  quote: ''
  summary: The passage recounts Tamichi defeating Silla troops and taking captives,
    later being killed by the Yemishi, his wife dying after receiving his armlet,
    and a serpent emerging from his tomb to poison the Yemishi after they desecrate
    it. It also records two kunugi trees suddenly growing together over a road at
    Arehaka and the Land of Wu and Koryo attending court with tribute.
  language: English
  quote_policy: summarized
