canonical_text:
  quote: ''
  summary: The passage first records Ama no hi-hoko’s settlement, associated potters,
    marriage to Matawo, and a descent line ending in Tajima-mori. It then narrates
    how Prince Sahohiko, the Empress’s maternal elder brother, plots treason, tests
    the Empress’s loyalty between brother and husband, persuades her with arguments
    about fading beauty and rule, gives her a dagger, and orders her to kill the sleeping
    Emperor. The Empress is frightened, hides the dagger in her garments, and intends
    to remonstrate with her brother.
  language: English
  quote_policy: summarized
