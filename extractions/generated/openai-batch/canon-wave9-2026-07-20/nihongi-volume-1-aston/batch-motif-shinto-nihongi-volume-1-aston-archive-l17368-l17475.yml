canonical_text:
  quote: ''
  summary: The passage narrates a succession conflict in which the Heir to the Throne
    concludes that Imperial Prince Nakatsu has impersonated him and seduced Kurohime.
    Nakatsu attempts to kill the Heir, surrounds and burns his palace, but loyal men
    help the Heir escape. The Heir receives route guidance from a girl, raises troops,
    captures pursuers, confronts Akoko’s opposing force, and pardons Akoko after Akoko
    offers his sister Hinohime and begs forgiveness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kurohime says the bells are the ones brought the previous night, and the Heir
    concludes that Imperial Prince Nakatsu assumed his name and seduced her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imperial Prince Nakatsu fears trouble, prepares to kill the Heir, secretly
    raises a force, and surrounds the Heir’s palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Heguri no Tsuka no Sukune, Mononobe no Ohomahe no Sukune, and Achi no Omi
    inform the Heir and assist him in escaping on horseback.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nakatsu, not knowing the Heir is absent, sets fire to the palace, and the
    fire lasts all night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Hanifu Hill, the Heir becomes sober, looks back toward Naniha, sees the
    blaze, and flees by way of Ohosaka toward Yamato.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the entrance of Mount Asuka, a girl tells the Heir that the mountain is
    full of armed men and advises him to go by the Tagima road.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Heir composes a song crediting the girl with directing him toward the
    Tagima way rather than straight ahead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Heir turns aside, raises troops of the district, and crosses by way of
    Mount Tatsuta.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Armed pursuers identify themselves as fishermen of Nojima in Ahaji sent by
    Hamako, or in one account Sato-tomo, on behalf of Nakatsu; the Heir’s troops ambush
    and capture them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Akoko, Atahe of Yamato, who had loved Nakatsu and was privy to his conspiracy,
    secretly assembles several hundred choice troops and withstands the Heir.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Akoko tells the messenger that he has prepared a force in order to assist
    the Prince Imperial, but the Heir doubts his intentions and tries to kill him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Akoko offers his younger sister Hinohime as a present, begs pardon through
    her, is pardoned, and the passage says the custom of the Atahe of Yamato sending
    tribute of ladies of the Palace probably began at this time.
  category: sequence
  evidence_refs:
  - ev:7
