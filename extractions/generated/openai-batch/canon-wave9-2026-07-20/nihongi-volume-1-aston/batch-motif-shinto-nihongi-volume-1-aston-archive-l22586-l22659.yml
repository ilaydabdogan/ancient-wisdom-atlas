canonical_text:
  quote: ''
  summary: 'A chronicle passage reports that Hitaka no Kishi was sent to Corea to
    fetch skilled artisans. A woman at Mitsu in Naniha laments for her spouse, calling
    him an elder brother both to herself and to her mother. Kaso hears her and interprets
    her cryptic reference to autumn garlic as an allusion to a complicated genealogy:
    Funame and Karama had Nakume; Nakume and Yamaki had Akitame; after Karama and
    Nakume died, Yamaki had illicit intercourse with Funame and had Araki; Araki married
    Akitame and then departed for Koryo in Hitaka''s suite, causing Akitame''s distraught
    lament.'
  language: English
  quote_policy: summarized
