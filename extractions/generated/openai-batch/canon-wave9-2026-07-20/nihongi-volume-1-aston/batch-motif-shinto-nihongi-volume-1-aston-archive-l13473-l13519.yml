canonical_text:
  quote: "“the Gods guided her”"
  summary: The passage describes the Empress, dressed in male attire, undertaking
    an expedition against Silla under divine guidance. A Silla prince submits and
    promises tribute to the divine child in Japan. A variant account instead says
    the prince is captured, mutilated, killed, and buried; later his wife deceives
    the appointed governor, finds the body, kills the governor, reburies the prince,
    and places the governor beneath the prince’s tomb to mark rank.
  language: English
