canonical_text:
  quote: ''
  summary: Dated notices from Yūryaku’s reign report white cormorants at Tanagami
    and the establishment of a service group; the arrival of Kwisin, a refugee associated
    with Paekche and Wu; imperial punishments after a Bird-department bird is killed
    by a dog and after night-duty coolies complain; a mission to Wu; and the beginning
    of a lofty edifice where the carpenter Mita moves with flight-like agility and
    an Uneme of Ise falls while serving meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: White cormorants were reported dwelling on the shore at Tanagami in the district
    of Kurimoto, province of Ohomi, and orders were given to establish toneri of Kahase.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A refugee from Pékché gave his name as Kwisin, and it was also stated that
    Kwisin was a man of the Land of Wu; two named persons are identified as his descendants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bird of the Bird-department was bitten by a dog belonging to a man of Uda
    and died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor became angry, branded the dog’s owner on the face, and made him
    one of the Bird-keepers’ Be.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Office coolies from Shinano and Musashi, while on night duty at the Palace,
    said that birds were plentiful in their country and called the Emperor unjust
    and wicked for punishing a man over one bird.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After hearing the coolies’ speech, the Emperor ordered them to gather and
    make a heap of birds; when they could not complete it, he enlisted them in the
    Bird-keepers’ Be.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Awo, Musa no Sukuri, and Haka-toko Hinokuma no Tamitsukahi went on a mission
    to Wu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Emperor commanded the carpenter Mita of Tsuke to begin constructing a
    lofty edifice; the passage notes a variant naming him Mita of Winabe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mita ascended the high building and ran about nimbly on all sides as if flying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: An Uneme of Ise looked up at the high edifice, marvelled at Mita’s movement,
    fell on her face in the courtyard, and upset a dish of meat she was serving.
  category: sequence
  evidence_refs:
  - ev:8
