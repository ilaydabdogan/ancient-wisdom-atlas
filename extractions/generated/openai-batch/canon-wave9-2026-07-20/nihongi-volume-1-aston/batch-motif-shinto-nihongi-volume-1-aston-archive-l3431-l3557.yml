canonical_text:
  quote: ''
  summary: The passage moves from notes on curved jewels and purification to the punishment
    of Sosa no wo no Mikoto. The assembled gods condemn and banish him to the Bottom
    Nether Land. In stormy weather he seeks lodging in grass rain gear and is refused,
    an episode used to explain later taboos and expiatory fines. Before departing,
    he ascends to see his elder sister, the Sun-Goddess, who arms herself because
    she suspects him of wanting to seize her realm. Sosa swears an oath in which the
    sex of children produced through chewing sacred objects will prove his intention.
    The Sun-Goddess chews a sword, and Sosa chews jewels rinsed at the true well of
    Heaven, producing male deities. He then explains his pure motive, entrusts the
    children to his sister, and returns downward toward the Nether Land.
  language: English
  quote_policy: summarized
