canonical_text:
  quote: "“Hereupon the Emperor understood the voice of the lute, and pardoned the
    offence.”"
  summary: The passage recounts two court incidents. In the first, the Emperor suspects
    Mita of misconduct with an Uneme and assigns the Mononobe to carry out punishment,
    but Hada no Sake no Kimi plays a lute and sings so that the Emperor understands
    and pardons the offence. In the second, Hadane no Mikoto secretly seduces the
    Uneme Yamanobe no Koshimako, is called to account through Mononobe no Me no Ohomuraji,
    purges the offence with eight horses and eight swords, and begins a song about
    Koshimako.
