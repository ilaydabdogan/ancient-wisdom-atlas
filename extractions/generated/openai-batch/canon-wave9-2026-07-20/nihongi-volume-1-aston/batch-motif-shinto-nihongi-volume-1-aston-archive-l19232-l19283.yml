canonical_text:
  quote: ''
  summary: A prisoner curses the water of the well of Iha in Miwa so that common people
    may drink it but royal persons may not. The Emperor then has a lofty pavilion
    erected at Asakura in Hatsuse, assumes the Imperial Dignity, establishes the palace,
    and appoints senior officials. In the first year, Princess Kusaka no Hatahi hime
    is appointed Empress. Three concubines are named, with their parentage and children.
    One imperial princess is said to attend to the sacrifices of the Great Deity of
    Ise. Woguna Kimi, formerly an Uneme, becomes pregnant after one night with the
    Emperor, bears a girl, and the Emperor refuses to bring the child up because of
    suspicions.
  language: English
  quote_policy: summarized
