canonical_text:
  quote: ''
  summary: The passage includes a commentarial note on majinahi as supernatural prevention
    or control, including a charm-like notice against ants. It then narrates Oho-na-mochi
    no Kami seeking a partner in governing the world; a radiant being appears from
    the sea, identifies itself as his guardian or wondrous spirit, asks to dwell on
    Mount Mimoro in Yamato, and is enshrined there as the God of Oho-miwa. The passage
    also names descendants or children of this deity and gives another version in
    which Koto-shiro-nushi no Kami transforms into an eight-fathom bear-sea-monster,
    with notes comparing the wani to dragon imagery and Dragon-King traditions.
  language: English
