canonical_text:
  quote: ''
  summary: The Oho-omi refuses to surrender Imperial Prince Sakahi no Kurohiko and
    Prince Mayuwa after they take refuge in his house. The Emperor surrounds the house
    with an army. The Oho-omi dresses and adjusts his garters while his wife laments
    in song, then kneels at the camp gate and says he cannot obey even at the cost
    of his life. He offers his daughter Kara-hime and seven buildings of Katsuraki
    as ransom, but the Emperor refuses, burns the houses, and the Oho-omi and the
    two princes die in the fire. Nihe no Sukune takes the Imperial Prince’s dead body
    in his arms and also burns to death. The burned remains cannot be sorted and are
    placed in one coffin.
  language: English
  quote_policy: summarized
