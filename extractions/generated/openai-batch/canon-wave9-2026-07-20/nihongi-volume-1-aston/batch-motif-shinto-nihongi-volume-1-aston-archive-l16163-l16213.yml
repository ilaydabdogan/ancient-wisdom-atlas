canonical_text:
  quote: ''
  summary: 'A Nintoku reign passage describes flood-control works: channels and embankments
    are made to manage tide and river overflow. When the Mamuta embankment cannot
    be closed, the Emperor dreams that a god names two men to be sacrificed to the
    River-God. One man dies by entering the water; the other challenges the River-God
    to prove itself by sinking two calabashes, after which a whirlwind tries to submerge
    them. The passage ends before the outcome is stated.'
  language: English
  quote_policy: summarized
