canonical_text:
  quote: This is called a song of longing for one’s country.
  summary: 'The passage includes a country-longing song about Yamato, then narrates
    Emperor Keiko’s tour through Tsukushi and neighboring districts: he investigates
    an assembled crowd prepared for a banquet, summons and executes a noncompliant
    local brother, receives water from a spring that appears after prayer, follows
    an unowned fire to shore at night, kills a Tsuchi-gumo, and encounters two Aso
    deities who assume human form.'
