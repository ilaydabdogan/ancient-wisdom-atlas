canonical_text:
  quote: ''
  summary: 'The passage lists reign contents and then introduces the history of writing
    and historiography in Japan: Chinese writing and learning are said to have reached
    Japan through Corea, with Wani/Wangin appointed as a Chinese tutor; writing is
    then described in administrative use, provincial recording, hereditary scribal
    groups, and state-sponsored historical compilation, including the Kiujiki/Kujiki,
    the Kojiki, and later national-history projects. One earlier chronicle is said
    to have been partly destroyed by fire, with national annals saved from the flames.'
  language: English
  quote_policy: summarized
