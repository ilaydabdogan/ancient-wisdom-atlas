  quote: ''
  summary: The passage records bird omens interpreted as an indication from Heaven,
    leading to exchanged bird names being given to two children as a covenant for
    future generations. It then records an empress appointment and royal offspring.
    Later, the Emperor observes from a lofty tower that no cooking smoke rises in
    the land, infers popular poverty and failed crops, contrasts this with the happy
    households of wise ancient reigns, and issues a decree.
  language: English
