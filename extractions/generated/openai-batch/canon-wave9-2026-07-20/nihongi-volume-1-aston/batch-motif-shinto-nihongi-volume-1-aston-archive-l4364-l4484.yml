canonical_text:
  quote: ''
  summary: After Ame-waka-hiko’s death, Aji-suki-taka-hiko-ne ascends to Heaven to
    offer condolence. Because he exactly resembles Ame-waka-hiko, the dead god’s family
    mistakes him for their living lord; angered, he cuts down the mortuary house,
    which becomes Moyama, the mourning mountain. Taka-mi-musubi then convenes the
    gods to choose envoys to pacify the Central Land of Reed-Plains for the August
    Grandchild. Futsu-nushi and Take-mika-dzuchi descend to Idzumo, confront Oho-na-mochi,
    and demand his submission. After Oho-na-mochi consults his son Koto-shiro-nushi
    through a messenger in a named boat, both son and father choose withdrawal. Oho-na-mochi
    gives the envoys his broad spear and becomes concealed; the envoys put rebellious
    beings to death, with a variant noting the Star-God Kagase-wo as the remaining
    refuser of submission.
  language: English
  quote_policy: summarized
