canonical_text:
  quote: ''
  summary: The passage recounts Sosa no wo no Mikoto finding a divine sword in a serpent’s
    tail and sending it to Heaven; Iso-takeru and Sosa’s children distributing tree
    seeds; a variant in which Sosa creates useful trees from his body hair and assigns
    their uses; Sosa’s eventual entry into the Nether Land; Oho-kuni-nushi/Oho-na-mochi
    and Sukuna-bikona constructing and ordering the world, establishing healing and
    protections, and Sukuna-bikona departing to the Everlasting Land; and Oho-na-mochi
    repairing imperfect parts of the land and subduing violent natural elements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After cutting the serpent’s tail, Sosa no wo no Mikoto found a divine sword
    inside it and sent it to Heaven rather than keeping it for private use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iso-takeru no Kami descended from Heaven with many tree seeds, brought them
    back from the land of Han, and sowed them throughout the Great Eight-island-country,
    producing green mountains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one variant, Sosa no wo no Mikoto’s beard, breast hair, buttock hair, and
    eyebrow hair became Cryptomerias, Thuyas, Podocarpi, and Camphor-trees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sosa no wo no Mikoto assigned uses to the trees, including floating riches,
    timber for fair palaces, and burial receptacles, and made many kinds of fruit
    grow for food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sosa no wo no Mikoto’s three children, Iso-takeru, Oho-ya-tsu-hime, and Tsuma-tsu-hime,
    dispersed tree seeds and crossed to the Land of Kii.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sosa no wo no Mikoto later dwelt on the Peak of Kuma-nari and eventually entered
    the Nether Land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Oho-kuni-nushi no Kami is listed under several alternate names and is said
    to have one hundred and eighty-one divine children.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Oho-na-mochi no Mikoto and Sukuna-bikona no Mikoto jointly constructed the
    sub-celestial world and established methods for healing diseases and preventing
    or controlling calamities affecting humans and animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Oho-na-mochi asked whether the country they had made was well made, and Sukuna-bikona
    answered that some parts were complete and others incomplete.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sukuna-bikona went to the Everlasting Land; a variant says he reached it after
