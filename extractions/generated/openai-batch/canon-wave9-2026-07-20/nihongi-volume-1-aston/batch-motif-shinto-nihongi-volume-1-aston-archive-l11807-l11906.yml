canonical_text:
  quote: "“in outward form thou art Our child, in reality thou art a God.”"
  summary: Yamato-dake no Mikoto offers to quell a new rebellion of the eastern Yemishi.
    The Emperor gives him a battle-axe, describes the eastern frontier as populated
    by violent people and obstructing deities and demons, praises Yamato-dake as divinely
    ordained, instructs him to combine policy, kindness, words, and arms, and appoints
    attendants for the expedition. Translator notes compare the weapon and speech
    with Kojiki and Chinese literary models.
  language: English
  quote_policy: quoted
