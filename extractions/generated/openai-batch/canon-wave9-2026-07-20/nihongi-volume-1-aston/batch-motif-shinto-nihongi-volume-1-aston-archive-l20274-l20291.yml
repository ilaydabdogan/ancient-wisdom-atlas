  summary: Tsumaro is told that his masters have been killed and shown where their
    bodies are. He laments that his master has fallen, attacks the enemy, and dies
    in the same hour. Other forces withdraw, the general-in-chief dies of illness,
    and Kino Ohiha no Sukune, after hearing of his father’s death, goes to Silla,
    removes Wokahi no Sukune from command, and exercises authority.
