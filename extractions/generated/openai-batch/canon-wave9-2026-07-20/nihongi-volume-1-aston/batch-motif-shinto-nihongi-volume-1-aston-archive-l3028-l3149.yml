canonical_text:
  quote: Then the eighty myriads of Gods met on the bank of the Tranquil River of
    Heaven
  summary: The gods assemble beside the Tranquil River of Heaven to decide how to
    supplicate an unnamed female figure. Omohi-kane arranges for long-singing birds
    to cry, Ta-jikara-wo is stationed beside the Rock-door, and Ame no Koyane with
    Futo-dama prepare a five-hundred-branched Sakaki tree from Heavenly Mt. Kagu,
    hanging jewels and a mirror on its branches.
  language: English
  quote_policy: quoted
