canonical_text:
  quote: ''
  summary: After a funeral, Kagehime laments the loss of her beloved husband and makes
    a song using animal imagery. On the eleventh day of the eleventh winter month,
    Ohotomo asks the eldest son for permission to attack the rebel Matori; plans are
    made, troops besiege and burn the Oho-omi's house, and Matori curses the salt
    sea before being killed with his people, omitting the sea-brine of Tsunoga from
    the curse.
  language: English
  quote_policy: summarized
