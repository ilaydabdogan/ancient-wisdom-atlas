  quote: ''
  summary: The passage reports an imperial response to a captured deer whose belling
    had soothed anxious thoughts, followed by the exclusion and relocation of a Saheki
    Be ancestor. It then gives a popular story in which a man sleeps on a moor at
    Toga beside two deer; near cock-crow the male deer recounts a dream of white mist
    covering his body, and the female deer interprets this as a sign that he will
    be shot by men and die if he goes out.
