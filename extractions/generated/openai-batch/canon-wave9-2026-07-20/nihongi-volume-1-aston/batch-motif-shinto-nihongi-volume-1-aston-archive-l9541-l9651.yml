canonical_text:
  quote: ''
  summary: The passage reports prosperity and peace under the Emperor, followed by
    a decree ordering shipbuilding in every province. It then narrates a succession
    decision by dream augury between Toyoki no Mikoto and Ikume no Mikoto, in which
    dreams on Mount Mimoro are interpreted to assign eastern rule to Toyoki and imperial
    succession to Ikume. A later episode concerns divine treasures brought from Heaven
    and stored at Idzumo, their rendering up to the imperial court during Idzumo Furune's
    absence, and Furune's resentment toward his younger brother Ihi-iri-ne, whom he
    deceives into visiting and bathing at Yamiya pool while carrying a wooden sword
    disguised as a real one.
  language: English
  quote_policy: summarized
