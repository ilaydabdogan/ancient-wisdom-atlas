canonical_text:
  quote: ''
  summary: Izanagi creates a river from water made against a tree, delaying the Ugly
    Females of Yomi while he reaches the Even Pass of Yomi. He blocks the path with
    a massive rock, faces Izanami, pronounces divorce, and exchanges statements with
    her about daily deaths and births. He then commands that she come no further and
    throws down his staff, named Funado no Kami, and his girdle. Footnotes compare
    the pursuit to a folklore pattern and gloss Funado/Kunado as a road god or “come-not-place.”
  language: English
  quote_policy: summarized
