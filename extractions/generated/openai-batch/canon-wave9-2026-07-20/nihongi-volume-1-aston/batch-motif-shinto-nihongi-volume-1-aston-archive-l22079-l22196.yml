canonical_text:
  quote: ''
  summary: The passage describes an exhumation at the moor of Kaya, where remains
    are found intermingled as an old woman had said. The skulls are distinguished
    by a nurse's statement about Nakachiko's missing upper teeth, but the bones cannot
    be separated, so paired similar misasagi and alike funeral rites are established.
    The Emperor honors the old woman Okime with residence, support, and a bell. Later,
    the Emperor holds a revel by winding streams, rewards Wodate with the mountain
    office and title, and spares Karabukuro from execution by assigning him to tomb
    and mountain service.
  language: English
  quote_policy: summarized
