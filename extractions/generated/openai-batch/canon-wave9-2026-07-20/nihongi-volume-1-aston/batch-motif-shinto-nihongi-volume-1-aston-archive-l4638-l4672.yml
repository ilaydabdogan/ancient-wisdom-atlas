canonical_text:
  quote: ''
  summary: A scholarly note distinguishes the term ihaya from muro, then summarizes
    competing interpretations of pits in Yezo, Itorup, Kusiro, and the Kurile Islands.
    J. Milne interprets some pits as dwellings of a pre-Aino race named Koro-pok-guru
    from Aino tradition. Baron A. von Siebold argues instead that their appearance,
    regular arrangement, artifacts, and correspondence with mapped Japanese Government
    military encampments point to a more recent military use. The passage concludes
    that pit-dwelling in northern climates is not a reliable marker of race.
  language: English
  quote_policy: summarized
