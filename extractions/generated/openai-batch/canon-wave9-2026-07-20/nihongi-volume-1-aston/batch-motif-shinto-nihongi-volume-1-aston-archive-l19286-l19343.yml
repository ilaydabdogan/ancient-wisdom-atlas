canonical_text:
  quote: ''
  summary: In a court setting, Me no Ohomuraji notices a little girl, remarks on her
    resemblance to the Emperor, and discusses the Emperor’s suspicion about her conception
    after a single night. Ohomuraji argues that suspicion is unwarranted. The Emperor
    makes the girl an Imperial Princess and appoints her mother as a concubine. In
    a later dated entry, Iketsu hime of Pekché has an amour with Tate of Ishikaha
    despite the Emperor’s intended favor; the Emperor orders Muruya and Kume Be to
    punish her by binding her limbs to a tree and burning her.
