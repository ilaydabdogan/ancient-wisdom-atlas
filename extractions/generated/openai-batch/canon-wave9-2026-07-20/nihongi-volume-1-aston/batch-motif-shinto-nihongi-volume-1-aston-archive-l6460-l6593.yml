canonical_text:
  quote: ''
  summary: The passage recounts Toyo-tama-hime leaving with a child and later sending
    him away through Tama-yori-hime; gives genealogies for Hiko-nagisa-take-u-gaya-fuki-ahezu
    and his sons; introduces Emperor Kami-Yamato Ihare-biko, including his divine-sea
    lineage, qualities, heirship, marriage, and children; and presents his speech
    grounding rule in a heavenly grant to Hiko-ho no Ninigi and describing remote
    regions still ruled by contending local chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Toyo-tama-hime departs with the child and later says that the offspring of
    the Heavenly Grandchild should not be left in the sea, so she has Tama-yori-hime
    take him and send him away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Toyo-tama-hime's resentment is described as extreme, and Ho no ori no Mikoto
    understands that they will never meet again and sends her a poem.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hiko-nagisa-take-u-gaya-fuki-ahezu no Mikoto takes his aunt Tama-yori-hime
    as consort and has four male children by her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hiko-nagisa-take-u-gaya-fuki-ahezu no Mikoto dies in the palace of the western
    country and is buried in the Misasagi on the top of Mount Ahira in Hiuga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several variant writings give different names and orders for the sons, including
    forms identifying Sano with Kamu-yamato-Ihare-biko no Mikoto after the realm and
    the eight islands are subdued.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Emperor Kami-Yamato Ihare-biko's personal name is Hiko-hoho-demi; he is described
    as the fourth child of Hiko-nagisa-take-u-gaya-fuki-ahezu no Mikoto, and his mother
    is Tama-yori-hime, daughter of the Sea-God.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: From birth, Kami-Yamato Ihare-biko is described as having clear intelligence
    and resolute will, and at age fifteen he is made heir to the throne.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: When grown, Kami-Yamato Ihare-biko marries Ahira-tsu-hime of Ata in Hiuga
    and has Tagishi-mimi no Mikoto and Kisu-mimi no Mikoto by her.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: At age forty-five, Kami-Yamato Ihare-biko addresses his elder brothers and
    children.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: In his speech, Kami-Yamato Ihare-biko says that Taka-mi-musubi no Mikoto and
    Oho-hiru-me no Mikoto gave the land of fair rice-ears to the heavenly ancestor
    Hiko-ho no Ninigi no Mikoto.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the same speech, Hiko-ho no Ninigi no Mikoto opens the barrier of Heaven,
    clears a cloud-path, follows a superhuman course, and comes to rest.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speech describes the world at that time as desolate, dark, and disorderly,
    and says the ancestor fostered justice and governed the western border.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speech states that more than 1,792,470 years have elapsed since the heavenly
    ancestor descended, while remote regions still do not enjoy imperial rule and
    local lords and chiefs divide territory and fight.
  category: speech
  evidence_refs:
  - ev:13
