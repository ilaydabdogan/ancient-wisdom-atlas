canonical_text:
  quote: The Emperor’s hair was white * from his birth.
  summary: The passage introduces Emperor Shiraga-take-hiro-kuni-oshi-waka-Yamato-neko,
    describing his parentage, white hair from birth, love of the people, and appointment
    as Prince Imperial. After Emperor Ohohatsuse dies, Kibino Waka-hime secretly urges
    her younger son Hoshikaha to take the Treasury to gain imperial rank. The elder
    son Ihaki objects that this would betray the Prince Imperial, but Hoshikaha follows
    his mother’s advice, takes possession of the Treasury, and locks the outer door.
