  summary: 'The passage gives bibliographic and editorial information about the Nihongi:
    it lacks a title-page or preface; later sources report that it was completed and
    presented to Empress Gemmio in A.D. 720 by Prince Toneri and Yasumaro Futo no
    Ason; it once included a now-lost genealogy book; and its wording and structure
    suggest compilation from selected materials arranged chronologically.'
  language: English
