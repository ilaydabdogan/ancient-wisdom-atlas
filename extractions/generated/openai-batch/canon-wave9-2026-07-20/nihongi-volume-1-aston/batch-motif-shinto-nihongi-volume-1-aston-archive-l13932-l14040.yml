canonical_text:
  quote: ''
  summary: The passage recounts a Nihongi episode in which Silla envoys secretly send
    Mi-cheul back to Silla by ship and use a straw figure to feign his illness; Katsuraki
    no Sotsuhiko discovers the deception, burns the envoys in a cage, attacks Silla,
    and takes captives said to become ancestors of Han people in several villages.
    A long note quotes the Tongkam account of Pak Ché-syang, who uses stratagem to
    rescue Misaheun from Wa, remains behind, refuses to renounce Silla/Kélin loyalty
    under torture, is burned to death, and is posthumously honored.
  language: English
  quote_policy: summarized
