  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The Tongkam note describes Pak Ché-syang of Silla proposing to use stratagem
    against Wa, to pretend he committed a crime and absconded, and to have his family
    arrested after he leaves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ché-syang swears not to see his wife and children again; when his wife comes
    after him at departure, he says he is leaving for certain death.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: In Wa, Ché-syang presents himself as a rebel; the Lord of Wa doubts him but
