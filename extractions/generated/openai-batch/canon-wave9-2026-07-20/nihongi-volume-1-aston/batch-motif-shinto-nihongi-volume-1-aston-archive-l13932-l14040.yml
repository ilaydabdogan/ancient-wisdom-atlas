    army toward Silla, making Ché-syang and Misaheun guides.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Ché-syang and Misaheun repeatedly go out by boat under the appearance of pleasure
    excursions; Ché-syang advises Misaheun to return secretly, and Misaheun escapes
    while Ché-syang remains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the Wa discover Misaheun has disappeared, they bind Ché-syang and pursue
    Misaheun, but mist and darkness prevent them from overtaking him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Lord of Wa questions Ché-syang about secretly sending Misaheun away and
