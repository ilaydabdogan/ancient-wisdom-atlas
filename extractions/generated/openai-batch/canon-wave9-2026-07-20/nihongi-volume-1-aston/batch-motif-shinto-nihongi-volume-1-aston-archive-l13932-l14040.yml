- id: obs:1
  text: A man asks the Emperor for leave to return briefly to his own country to learn
    whether a report is true; the Emperor grants leave and sends him with Katsuraki
    no Sotsuhiko.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tsushima, at the harbour of Sabi no umi, Silla envoys secretly provide
    a separate ship and sailors, put Mi-cheul on board, and make him escape to Silla.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The envoys place a straw figure in Mi-cheul's berth and present it as a sick
    man near death; Sotsuhiko sends nurses and discovers the deception.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sotsuhiko seizes three Silla envoys, places them in a cage, burns the cage
    with fire, and kills them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sotsuhiko goes to Silla, touches at Tatara harbour, takes the Castle of Chhora,
