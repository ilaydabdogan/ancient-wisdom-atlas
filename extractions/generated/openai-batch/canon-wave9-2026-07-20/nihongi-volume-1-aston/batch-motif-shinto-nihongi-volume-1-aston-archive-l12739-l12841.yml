canonical_text:
  quote: ''
  summary: The passage narrates imperial travel by ship, ritual offerings involving
    branches, mirrors, swords, jewels, local deities obstructing a harbor passage
    until prayed and sacrificed to, the Empress delayed by tide and appeased with
    fish and bird ponds, Itote's presentation of sakaki trees and regalia to the Emperor,
    and an oracle through the Empress promising bloodless submission of Silla if the
    deity is worshipped properly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An offering arrangement places a white-copper mirror, a ten-span sword, and
    Yasaka jewels on branches set upon the bows of a nine-fathom ship, and a fish-salt-place
    is presented to the Emperor.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker defines ferries as eastern and western gates, islands as august
    baskets and pans, and the Sea of Sakami as the salt-place, then acts as the Emperor's
    pilot.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the ship enters the Bay of Oka it cannot go forward, and the Emperor
    asks Kuma-wani why it does not proceed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kuma-wani says that two deities at the entrance of the bay, the male Oho-kura-nushi
    and the female Tsubura-hime, are the cause of the ship's inability to advance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Emperor prays to the two deities, has sacrifice made to them, appoints
    Iga-hiko as priest, and the ship is then able to proceed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Empress travels in a different ship by the Sea of Kuki, is unable to advance
    while the tide is out, and later anchors at Oka with the flowing tide.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kuma-wani makes a fish-pond and a bird-pond, gathers fishes and birds into
    them, and the Empress's anger is gradually appeased when she sees them sporting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Itote pulls up sakaki trees of 500 branches, sets them at the bow and stern
    of his ship, hangs Yasaka jewels, white-copper mirrors, and ten-span swords on
    the branches, and presents them to the Emperor at Hikejima.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Itote's speech links the Yasaka jewels with subtle government, the mirror
    with surveying mountains, streams, and sea-plain, and the ten-span sword with
    maintaining peace in the Empire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Emperor commends Itote, calls him Isoshi, and the passage explains a place-name
    from this naming.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Emperor arrives in the district of Naka and dwells in the palace of Kashihi.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Emperor consults his ministers about attacking the Kumaso, and a god inspires
    the Empress with contrary instructions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The god describes a richer land, identified as Silla, and says that if properly
    worshipped it will submit freely without the Emperor's sword being stained with
    blood.
  category: speech
  evidence_refs:
  - ev:7
