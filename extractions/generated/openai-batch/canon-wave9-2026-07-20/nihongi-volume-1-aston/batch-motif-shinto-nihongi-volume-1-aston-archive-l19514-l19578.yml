canonical_text:
  quote: ''
  summary: The Emperor Wake-take no Mikoto encounters a tall man who resembles him
    and identifies himself as the god Hito-koto-nushi. The god joins the Emperor in
    a hunt, exchanges respectful conduct with him, and escorts him to the Water of
    Kume, after which the people praise the Emperor's virtue. Later, during a progress
    to Yoshino and Kahakamino Ono, a dragon-fly removes a gad-fly near the Emperor;
    pleased, the Emperor calls for and then composes an ode in praise of the dragon-fly.
  language: English
  quote_policy: summarized
