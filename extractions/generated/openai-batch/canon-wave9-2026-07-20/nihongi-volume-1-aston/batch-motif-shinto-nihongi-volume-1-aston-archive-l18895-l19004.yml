canonical_text:
  quote: ''
  summary: In A.D. 454, the Emperor sends Ne no Omi to ask Imperial Prince Ohokusaka
    for his younger sister Hata-hi as wife for Imperial Prince Ohohatsuse. Ohokusaka,
    ill and concerned for his sister, accepts and sends a jewel head-dress as a token
    of good faith. Ne no Omi covets and keeps the head-dress, falsely reports Ohokusaka's
    refusal, and the Emperor kills Ohokusaka. Ohokusaka's loyal retainers, the Hikakas
    father and sons, kill themselves beside his corpse. The Emperor then takes Nakashi
    hime as concubine and gives Hata-hi to Ohohatsuse.
  language: English
  quote_policy: summarized
