canonical_text:
  quote: ''
  summary: 'The passage records court events near the end of one emperor’s reign:
    overseas envoys bring tribute, are feasted, and receive presents; a five-day national
    drinking festival is held; prisoners are inspected; the Yemishi and Hayato render
    homage; an archery gathering is held; the emperor dies and is buried. It then
    introduces Emperor Woke by alternate name and genealogy.'
  language: English
  quote_policy: summarized
