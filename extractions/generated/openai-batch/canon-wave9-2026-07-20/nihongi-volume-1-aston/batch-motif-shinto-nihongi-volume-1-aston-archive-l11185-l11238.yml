  summary: The passage recounts grants of provincial fiefs to many royal children
    and links them to the Wake lineages; an episode in which the Emperor sends Oho-usu
    no Mikoto to examine two beautiful daughters of Kambone, but Oho-usu secretly
    has intercourse with them and fails to report; the Emperor’s return from Mino
    and relocation of the capital to Maki-muku; the Kumaso rebellion and withheld
    tribute; and an imperial journey toward Tsukushi in which smoke to the south is
    interpreted as evidence of brigands, leading to reconnaissance by named agents.
