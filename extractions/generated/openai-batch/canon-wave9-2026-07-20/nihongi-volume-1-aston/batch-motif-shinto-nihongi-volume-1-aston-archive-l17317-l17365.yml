canonical_text:
  quote: ''
  summary: 'The passage records the burial of the preceding emperor, introduces Book
    XII and Emperor Iza-ho-wake as eldest son and heir of Emperor Ohosazaki, and narrates
    an incident before Iza-ho-wake’s accession: he seeks Kurohime as concubine, sends
    Prince Nakatsu to announce the lucky day, and Nakatsu impersonates him, seduces
    Kurohime, and leaves wrist-bells behind. The heir later visits Kurohime’s chamber
    and hears the bells at the couch.'
  language: English
  quote_policy: summarized
