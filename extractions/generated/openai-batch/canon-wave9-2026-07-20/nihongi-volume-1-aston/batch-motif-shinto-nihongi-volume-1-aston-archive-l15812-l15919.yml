canonical_text:
  quote: ''
  summary: The passage recounts a ferry ambush in which Imperial Prince Oho-yama-mori
    is made to fall into a river and dies; his body is recovered and answered by a
    song. It then describes the Prince Imperial at Uji ceding imperial dignity to
    Oho-sazaki no Mikoto, a three-year vacancy, a fisherman whose fish offerings are
    repeatedly refused and spoil, the Prince Imperial’s self-death, and Oho-sazaki’s
    mourning at the corpse, after which the Prince Imperial comes to life and sits
    up.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hempen-clad person took the helm, secretly mingled with ferrymen, brought
    Imperial Prince Oho-yama-mori aboard, ferried him to the middle of the river,
    and induced the boat to heel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Imperial Prince Oho-yama-mori fell into the river, sank, rose again to the
    surface, floated downstream, sang, was prevented from reaching the bank by ambushed
    soldiers, and finally sank and died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A search was made for Oho-yama-mori’s body, which came to the surface at the
    ferry of Kahara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Prince Imperial saw the dead body and recited a song addressed to a Mayumi
    tree for Adzusa bows by the ferry of Uji.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oho-yama-mori was buried at Mount Nara, and afterward the Prince Imperial
    built and dwelt in a palace at Uji.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the Prince Imperial ceded the Dignity to Oho-sazaki no Mikoto, he
    remained for a long time without assuming imperial rank, and the imperial rank
    was vacant for three years.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fisherman repeatedly tried to offer fresh fish, but the Prince Imperial
    sent him to Naniha and Oho-sazaki sent him back to Uji; the fish spoiled during
    these journeys.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After repeated refusals and spoilage of the fish, the fisherman threw away
    the fish and wept, and the passage gives this as the origin of a proverbial saying.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Prince Imperial said that his elder brother would not change his resolution
    and asked why he should prolong his life and trouble the Empire; he then died
    by his own hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Oho-sazaki no Mikoto heard of the Prince Imperial’s death, came from Naniha
    to the Uji Palace, beat his breast, wept aloud, loosed his hair, bestrode the
    corpse, and called to the Prince three times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Oho-sazaki’s threefold call, the Prince Imperial came to life, raised
    himself, and remained sitting.
  category: sequence
  evidence_refs:
  - ev:6
