canonical_text:
  quote: ''
  summary: The passage recounts appointments and rewards after the Emperor's victories,
    including reward for Yata-garasu. The Emperor declares that ancestral spirits
    from Heaven assist him, orders sacrifice to the Heavenly Deities, and worships
    his imperial ancestors at spirit-terraces in the Tomi hills. Later he surveys
    the land from a hill and gives it the name Akitsu-shima. The passage also preserves
    earlier divine names for Yamato given by Izanagi, Oho-namuchi, and Nigi-haya-hi,
    including a heavenly rock-boat descent by Nigi-haya-hi. It ends with the appointment
    of the Prince Imperial, the Emperor's death, and burial near Mount Unebi.
  language: English
  quote_policy: summarized
