    borne imperial princes, with one version giving two and another three; Oho-Yamato-hiko-suki-tomo
    no Mikoto is made Prince Imperial; Shiki-tsu-hiko no Mikoto is named as ancestor
    of the Wi-tsu-kahi no Muraji; and the Emperor dies at age 57.'
