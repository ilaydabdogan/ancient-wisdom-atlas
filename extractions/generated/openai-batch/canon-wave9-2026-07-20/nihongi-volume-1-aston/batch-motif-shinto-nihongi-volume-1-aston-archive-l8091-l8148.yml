  summary: The passage describes the structure of Misasagi burial mounds, including
    circular and triangular mounds, moats, terraces, clay cylinders, vaults, and sarcophagi.
    It reports an officially recognized Misasagi of Jimmu Tenno, annual visits by
    an Imperial Envoy bearing offerings, an invitation to compare similar ancient
    tumuli in China and Corea, and scholarly uncertainty about the tomb site.
