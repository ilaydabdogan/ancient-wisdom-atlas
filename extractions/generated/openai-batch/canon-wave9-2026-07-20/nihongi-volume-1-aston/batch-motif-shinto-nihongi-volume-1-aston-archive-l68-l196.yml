  summary: The passage is the translator’s preface and opening contents list. It states
    that the translation aims to make an ancient Japanese chronicle available for
    study of mythology, folklore, early civilization, and customs; acknowledges institutional
    and scholarly assistance; notes visual materials for imperial tombs and mounds;
    and begins a contents outline from the Age of the Gods to named imperial reigns.
  language: English
