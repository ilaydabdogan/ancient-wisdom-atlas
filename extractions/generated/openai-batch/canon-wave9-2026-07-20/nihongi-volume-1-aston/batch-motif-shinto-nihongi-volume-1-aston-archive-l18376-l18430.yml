canonical_text:
  quote: ''
  summary: The passage recounts Otohime being kept from the inner palace and housed
    separately at Fujihara because of the Empress's vexation. On the night the Empress
    gives birth to Ohohatsuse, the Emperor goes to Fujihara, provoking the Empress
    to protest, set fire to the parturition house, and prepare to kill herself before
    the Emperor soothes her. A later scene shows the Emperor secretly observing Sotohori
    Iratsume at Fujihara as she sings of her husband's expected arrival, using a spider
    or “little crab” as an omen; notes explain the name Soto-wori-hime and the spider
    omen.
  language: English
