canonical_text:
  quote: This divine stone became changed into a beautiful maiden
  summary: A village god identified as a white stone is obtained as compensation for
    an ox, placed in a bed-chamber, changes into a maiden, disappears eastward, and
    becomes a deity of Himegoso shrines. A later notice says the Silla prince Ama
    no hi-hoko arrives with seven objects, which are stored in Tajima and made divine
    things forever.
  language: English
  quote_policy: quoted
