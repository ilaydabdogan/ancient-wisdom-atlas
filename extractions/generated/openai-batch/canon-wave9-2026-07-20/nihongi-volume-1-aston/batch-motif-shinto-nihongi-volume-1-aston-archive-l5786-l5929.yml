canonical_text:
  quote: ''
  summary: 'The passage recounts a breached childbirth prohibition: Toyo-tama-hime
    is seen in dragon form, abandons her infant on the seashore, and bars the sea-path.
    It then gives a variant in which Hiko-hoho-demi loses his elder brother''s fish-hook,
    receives help from Shiho-tsuchi no Oji, descends to the sea realm, reaches the
    Sea God''s palace by a well and cassia-tree, marries Toyo-tama-hime, and later
    seeks to return while the Sea God gathers fishes to recover the hook.'
  language: English
  quote_policy: summarized
