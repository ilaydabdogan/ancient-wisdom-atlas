canonical_text:
  quote: ''
  summary: 'The passage names imperial persons, recounts an earlier incident in which
    the future Empress was mocked by a local official on horseback while she was in
    a garden and gave him an orchid root, and then narrates her later punishment of
    him after attaining rank: she considers execution, accepts his plea that he did
    not know her status, remits death, removes his title, and renames him Inaki. A
    final annalistic note records an envoy sent to Silla to obtain a good physician.'
  language: English
  quote_policy: summarized
