canonical_text:
  quote: ''
  summary: A prince initially refuses to accept the imperial succession. Oho-nakatsu
    hime remains attending him in severe cold until water freezes on her arm and she
    is near death. The prince relents, the ministers deliver the Imperial signet with
    obeisances, and he assumes the Imperial Dignity. In the following year Osaka no
    Ohonakatsu hime is appointed Empress, the Osaka Be is established on her behalf,
    and her children are listed. A translator's note compares the Osaka Be with a
    Kojiki account of a na-shiro or namesake, while noting difficulties with that
    explanation.
  language: English
