canonical_text:
  quote: ''
  summary: A military ruse leads Prince Oshikuma to disarm his troops at a river,
    after which Takechi no Sukune re-arms, advances, pursues, and routs him. Oshikuma
    and Isachi no Sukune drown themselves at Seta; their bodies later surface at Uji.
    The passage then records the Empress receiving the title Grand Empress, the Emperor's
    burial, Homuda-wake's appointment as Prince Imperial, and a Silla embassy seeking
    the return of a hostage through deceit.
  language: English
  quote_policy: summarized
