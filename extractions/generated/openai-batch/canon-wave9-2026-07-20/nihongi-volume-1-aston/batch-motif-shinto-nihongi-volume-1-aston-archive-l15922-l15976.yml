canonical_text:
  quote: ''
  summary: The Prince Imperial describes the succession as Heaven's command, announces
    his abdication, gives Imperial Princess Yata to his elder brother, and lies down
    again in his coffin and dies. Oho-sazaki no Mikoto mourns and buries him, then
    assumes imperial dignity, establishes the capital at Naniha, and keeps the palace
    plain so as not to delay agriculture. A retrospective birth-omen account reports
    an owl entering the Emperor's parturition house and a wren entering the Prime
    Minister's wife's parturition house on the same day.
  language: English
  quote_policy: summarized
