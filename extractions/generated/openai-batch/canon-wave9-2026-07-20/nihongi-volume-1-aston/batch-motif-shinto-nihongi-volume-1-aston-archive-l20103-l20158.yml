canonical_text:
  quote: ''
  summary: In an A.D. 464 chronicle episode, a speaker describes the land as dangerously
    precarious and asks the Japanese authorities for war generals. The King of Imna
    persuades named Japanese-associated commanders to assist Silla. Kashihade no Omi
    and colleagues prepare an attack, create a hidden passage and ambush at night,
    and rout pursuing Koryé forces at dawn. The passage states that enmity between
    Silla and Koryo began from this event, and the commanders warn Silla not to disobey
    the Celestial Court. A translator/editorial note questions the historical corroboration
    of the episode.
  language: English
