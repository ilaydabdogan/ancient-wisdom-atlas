canonical_text:
  quote: ''
  summary: The passage follows the Emperor's voyage and eastward military movement
    through Usa, Oka, Aki, Kibi, Naniha, Kafuchi, and toward the inner country. It
    records local hosts at Usa, a one-pillar palace and banquet, an imperial marriage
    command, ancestral lineages, preparations for conquest, place-name explanations,
    a failed advance against Naga-sune-hiko at Kusaka, the wounding of Itsuse no Mikoto,
    and the Emperor's plan to retreat, sacrifice to the gods, and attack with the
    Sun-Goddess's support.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A special name is granted to a man called Shihi-netsu-hiko, who is identified
    as the first ancestor of the Yamato no Atahe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The voyage reaches Usa in Tsukushi, where Usa-tsu-hiko and Usa-tsu-hime appear
    as ancestors of the local Kuni-tsu-ko of Usa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Usa-tsu-hiko and Usa-tsu-hime build a palace raised on one pillar on the banks
    of the River Usa and offer a banquet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: By Imperial command, Usa-tsu-hime is given in marriage to the Emperor's attendant
    minister Ama no tane no Mikoto, who is identified as a remote ancestor of the
    Nakatomi Uji.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Emperor moves through Oka, Aki, and Kibi, builds a temporary palace at
    Takashima, and spends three years preparing ships and provisions for an attempt
    to subdue the Empire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Imperial forces proceed eastward by ship and encounter a very swift current
    at Cape Naniha, producing place-name explanations connected with waves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The forces proceed inland, but a narrow and precipitous road at Tatsuta prevents
    them from marching abreast; they return and try another eastward route over Mount
    Ikoma.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Naga-sune-hiko interprets the arrival of the children of the Heavenly Deity
    as an attempt to take his country, levies his forces, and intercepts them at the
    Hill of Kusaka.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A battle occurs at Kusaka, and Itsuse no Mikoto is struck on the elbow by
    a random arrow; the Imperial forces cannot advance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Emperor states that, as descendant of the Sun-Goddess, he should not attack
    while advancing against the sun; he proposes retreat, sacrifice to the Gods of
    Heaven and Earth, and advance with the Sun-Goddess's might and rays behind them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Emperor orders the army to halt and withdraw; the enemy does not attack,
    and the Emperor sets up shields at the port of Kusaka, leading to the place-name
    Tatetsu or Tadetsu.
  category: sequence
  evidence_refs:
  - ev:10
