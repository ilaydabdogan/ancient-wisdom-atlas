canonical_text:
  quote: ''
  summary: Taka-mi-musubi sends Ame-waka-hiko to the Central Land of Reed-Plains with
    a heavenly bow and arrows. Ame-waka-hiko marries Shita-teru-hime, seeks to govern
    the land himself, and does not report back. A pheasant sent to observe him is
    shot with the heavenly arrows; the arrow returns to Taka-mi-musubi, who casts
    it back down, killing Ame-waka-hiko. His wife's lament reaches Heaven, his body
    is brought up by a swift wind, and birds are assigned roles in his funeral rites
    for eight days and nights.
  language: English
  quote_policy: summarized
