canonical_text:
  quote: ''
  summary: A variant narrative tells how Ataka-ashi-tsu-hime conceives and bears four
    children after one night with the Heavenly Grandchild. When he mocks and doubts
    the children, she enters a doorless muro, vows that the children should perish
    if not his and survive if they are, and sets the chamber on fire. The children
    and their mother emerge unharmed, and the Heavenly Grandchild explains that the
    episode proves their paternity, divine one-night conception, the mother's dignity,
    and the children's spirit. A following variant gives a divine genealogy involving
    Ame no Oshi-ho-ne, Taku-hata-chichi-hime Yorodzu-hata hime, Taka-mi-musubi, Ama-no-ho-no-akari,
    Ho-no-ninigi, Kaguyama, and the Ohari no Muraji, and begins a scene of sending
    the Heavenly Grandchild down to the Central Land of Reed-Plains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ataka-ashi-tsu-hime is identified as the daughter of Oho-yamatsu-mino Kami;
    after being favored by the Heavenly Grandchild, she becomes pregnant in one night
    and gives birth to four children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ataka-ashi-tsu-hime brings the children forward and informs the Heavenly Grandchild;
    he laughs mockingly, questions whether one-night conception by him is possible,
    and denies that the children are his.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ataka-ashi-tsu-hime makes a doorless muro, enters it, makes a conditional
    vow about the children's survival or death, and sets the muro on fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three children spring forth at successive stages of the fire and announce
    their names as Ho-no-akari no Mikoto, Ho-no-susumi no Mikoto, and Ho-no-ori no
    Mikoto.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A fourth child, Hiko-ho-ho-demi no Mikoto, springs forth when Ataka-ashi-tsu-hime
    recoils from the heat; afterward Ataka-ashi-tsu-hime comes forth from the embers
    unharmed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Heavenly Grandchild says he already knew the children were his and explains
    that his mockery was meant to make their paternity, divine one-night conception,
    the mother's dignity, and the children's spirit evident.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A genealogical variant says that Ame no Oshi-ho-ne no Mikoto takes Taku-hata-chichi-hime
    Yorodzu-hata hime no Mikoto as wife, with another version naming her differently;
    she bears Ama-no-ho-no-akari no Mikoto and Ama-tsu-hiko-ne-ho-no-ninigi-ne no
    Mikoto, and Kaguyama no Mikoto is named as ancestor of the Ohari no Muraji.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Taka-mi-musubi no Mikoto sends down the Heavenly Grandchild Ho-no-ninigi no
    Mikoto to the Central Land of Reed-Plains and commands the eighty myriads of Gods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A translator's note characterizes the fire episode as an ordeal by fire and
    mentions later fire and boiling-water ordeal practices.
  category: other
  evidence_refs:
  - ev:9
