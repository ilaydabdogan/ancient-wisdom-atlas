candidate_motifs:
- id: motif:1
  label: return from Yomi followed by purification
  taxonomy_refs:
  - hero_descent
  - return
  basis: The passage states that Izanagi has visited the Land of Yomi, has brought
    ill-luck or defilement on himself, and then seeks ablution.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The descent or visit to Yomi itself is only referred to retrospectively
    in this passage.
- id: motif:2
  label: purifying ablution generates deities
  taxonomy_refs:
  - sacred_birth
  basis: Izanagi's washing and blowing while entering and leaving water produces named
    deities and further deities of Heaven, Earth, and the Sea-plain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage describes production of deities, not ordinary human birth.
- id: motif:3
  label: divine parent assigns cosmic rulership to children
  taxonomy_refs:
  - divine_parent_child
  basis: Izanagi charges his children with rule or governance over High Heaven, Heavenly
    matters, and the Ocean plain.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This appears in a variant introduced as 'one writing'.
- id: motif:4
  label: slain food deity whose body yields sustenance
  taxonomy_refs:
  - death_rebirth
  basis: After Uke-mochi is killed, livestock, grains, beans, rice, and silkworms
    arise from parts of her body and become human food and useful resources.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The killing is not described as a voluntary or ritual sacrifice in the
    passage.
- id: motif:5
  label: sun and moon deity separation creating day-night apartness
  taxonomy_refs:
  - duality
  - sibling_pair
  basis: Ama-terasu and Tsuki-yomi, both children of Izanagi in the variant, are separated
    by one day and one night after Ama-terasu rejects him.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage states their separation but does not explicitly frame it as
    a full cosmological explanation beyond day and night apartness.
- id: motif:6
  label: divine origin of agriculture and sericulture
  taxonomy_refs:
  - culture_hero
  basis: Ama-terasu makes the products from Uke-mochi into seeds for dry and water
    fields, oversees first rice sowing in Heaven, and begins silkworm rearing.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy label 'culture_hero' is approximate because the figure is
    a high deity rather than a human hero.
- id: motif:7
  label: farewell ascent before final departure to the Nether Land
  taxonomy_refs:
  - departure
  - ascent
  - sibling_pair
  basis: Sosa no wo asks to ascend to High Heaven to meet his elder sister before
    proceeding to the Nether Land forever.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives the petition and permission but not the outcome of the
    later Nether Land journey.
comparison_claims:
- id: claim:1
  claim: The passage apparatus explicitly compares Uke-mochi's corpse yielding crops
    and other useful beings with myths in which creation comes from fragments of a
    fabulous anthropomorphic being, including the Chinese P'an-ku myth and Indian
    and Iranian examples.
  claim_level: same_motif
  target: Anthropomorphic body-fragment creation traditions cited in the translator's
    note, including P'an-ku and Indian/Iranian myths
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the translator's note; the passage does
    not provide details of the compared myths or evidence for historical contact.
- id: claim:2
  claim: The apparatus relates Izanagi's blowing or spitting in purification to Japanese
    purification practice and comparative ethnographic examples, supporting a cautious
    same-function comparison for expelling impurity.
  claim_level: same_function
  target: Spitting or expectoration as purification practice noted in the passage
    apparatus
  evidence_refs:
  - ev:2
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The main narrative says Izanagi 'blew out' or 'blew forth'; the spitting
    interpretation and external comparison are in annotation rather than the narrative
    itself.
