canonical_text:
  quote: ''
  summary: The passage recounts messages at Yomi, Izanagi's post-Yomi purification
    and production of deities, the assignment of cosmic domains to his children, Tsuki-yomi's
    visit to Uke-mochi, the killing of Uke-mochi after she produces food from her
    mouth, the emergence of animals, crops, and silkworms from her corpse, Ama-terasu's
    establishment of food crops and sericulture, and Sosa no wo's request to visit
    Heaven before departing to the Nether Land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Road-wardens of Yomi deliver a message saying that the speaker will remain
    in Yomi and will not depart with Izanagi.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kukuri-hime no Kami says something that Izanagi hears and approves, and she
    then vanishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After visiting the Land of Yomi, Izanagi is said to have brought ill-luck
    or defilement upon himself and seeks to wash it away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Izanagi goes to gates with strong tides, then performs ablutions at Wodo in
    Tachibana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During repeated entries into and exits from the water, Izanagi blows out or
    forth and produces several named deities and other deities of Heaven, Earth, and
    the Sea-plain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In one variant, Izanagi charges Ama-terasu with ruling High Heaven, Tsuki-yomi
    with association in Heavenly matters, and Sosa no wo with governing the plain
    of Ocean.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ama-terasu sends Tsuki-yomi to wait upon Uke-mochi no Kami in the Central
    country of reed-plains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Uke-mochi faces land, sea, and mountains, producing boiled rice, fish, and
    animals from her mouth, and sets them out on one hundred tables.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tsuki-yomi calls the mouth-produced food filthy, draws his sword, kills Uke-mochi,
    and reports the event to Ama-terasu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ama-terasu condemns Tsuki-yomi as wicked and refuses to see him face to face;
    the two are separated by one day and one night and dwell apart.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ame-kuma-bito finds Uke-mochi dead, with ox, horse, millet, silkworm, panic,
    rice, wheat, large beans, and small beans produced from parts of her body.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ama-terasu receives these products, identifies them as food for visible humans,
    assigns crops to dry fields and water-fields, sows rice in heavenly fields, and
    obtains a plentiful autumn harvest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ama-terasu takes the silkworms in her mouth and succeeds in reeling thread
    from them, marking the beginning of silkworm rearing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Sosa no wo petitions to proceed to the Nether Land, asking first to go to
    the Plain of High Heaven and meet his elder sister; permission is granted and
    he ascends to Heaven.
  category: action
  evidence_refs:
  - ev:8
