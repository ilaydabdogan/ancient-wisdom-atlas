  quote: ''
  summary: The passage reports an imperial response to a boast and transfer of a village,
    then narrates the suppression of Ayashi no Womaro, a robber and tax defaulter,
    whose burning house yields a huge white dog that is slain and becomes Womaro.
    It then describes the carpenter Mane, whose precise work is disrupted after the
    Emperor arranges a distracting wrestling display by the Uneme.
