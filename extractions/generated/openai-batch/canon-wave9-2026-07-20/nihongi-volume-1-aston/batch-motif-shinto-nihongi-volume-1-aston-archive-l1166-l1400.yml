canonical_text:
  quote: "“Is there not a country beneath?”"
  summary: The passage gives a genealogy of heavenly gods across generations, including
    companion-born gods, male-female mate pairs, branches, and children. It culminates
    in Izanagi and Izanami standing on the Floating Bridge of Heaven, asking whether
    there is a country below, and thrusting down the jewel-spear of Heaven to find
    the ocean. Translator notes discuss the spear’s possible phallic and earth-axis
    interpretations and state that some deities were regarded as ancestors of noble
    Japanese families.
  language: English
  quote_policy: quoted
