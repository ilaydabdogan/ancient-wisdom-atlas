canonical_text:
  quote: ''
  summary: A fierce and strong man associated with the Omi of Kasa confronts a poisonous
    water-snake at a river-fork pool by throwing three calabashes into the water and
    setting a test. The water-snake changes into a deer but cannot sink the calabashes;
    the man enters the water with a sword and kills it. He then kills the water-snake's
    fellows in an underwater cave, after which the river water turns to blood and
    the pool is named Agatamori. The passage then reports pestilential vapours and
    minor rebellion, followed by the Emperor's benevolent rule, public peace for more
    than twenty years, and the Emperor's death. Translator notes explain midzuchi
    as water-snake or water-god, compare a Chinese river-god water-snake belief, note
    widespread belief in poisonous serpent breath, and state that part of the governance
    passage is taken nearly verbatim from a Chinese book.
  language: English
  quote_policy: summarized
