canonical_text:
  quote: ''
  summary: The passage reports pacification by the generals of the four roads and
    tranquility in the land. In a decree, the Emperor states that after receiving
    Celestial Dignity and guarding ancestral shrines, his influence had been obscured,
    causing disorder among male and female principles, irregular heat and cold, epidemic
    disease, and calamities. He says he worshipped the Gods of Heaven and Earth, instructed
    and chastised tribes, restored authority, and now orders a new census, ranks of
    seniority, and forced-labour arrangements. A later entry begins the census and
    imposes renewed gendered taxes, after which the Gods of Heaven and Earth are said
    to be harmonious. Translator notes discuss possible Chinese textual borrowing
    and explain the taxes.
  language: English
  quote_policy: summarized
