canonical_text:
  quote: ''
  summary: The passage describes Wo-Asa-tsuma wakugo no Sukune as an imperial prince
    who was kind but grievously ill. After Emperor Midzuha wake dies, the ministers
    offer Wo-Asa-tsuma the Imperial signet and urge him to assume the Imperial Dignity.
    He repeatedly refuses because of illness, inability to walk, prior self-mutilation,
    and perceived unfitness. The ministers insist that the throne should not remain
    vacant and invoke the command of Heaven. His concubine Osaka no Oho-nakatsu hime
    brings water for washing hands and also urges him to accept.
  language: English
  quote_policy: summarized
