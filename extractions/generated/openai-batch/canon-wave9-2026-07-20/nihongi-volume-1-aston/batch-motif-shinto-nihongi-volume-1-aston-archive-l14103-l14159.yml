canonical_text:
  quote: ''
  summary: 'The passage gives an answering song by Takechi no Sukune on behalf of
    the Prince Imperial, praising an august liquor brewed by a singing man with a
    drum set on a mortar. It then records notices from the History of Wei about Wa
    embassies: the Queen of Wa sends envoys to offer tribute, and later Chinese officials
    proceed to Wa with an imperial rescript, seal, and ribbon. Notes discuss the word
    for brewing and historical geography.'
  language: English
  quote_policy: summarized
