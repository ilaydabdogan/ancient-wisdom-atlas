canonical_text:
  quote: ''
  summary: The passage recounts a military encounter in which Asahi no Iratsuko is
    feared for his archery. Mononobe Me no Muraji advances with Oho-wono-te, who bears
    a shield. Asahi shoots through the shield and armor and wounds Oho-wono-te, but
    Oho-wono-te shields Me no Muraji, who captures and kills Asahi. Ushiro no Sukune
    delays reporting from shame; Sanuki no Tamushi Wake reports his cowardice to the
    Emperor. The Emperor removes the Wina Be from Ushiro no Sukune and gives it to
    Mononobe Me no Muraji. The passage also records the establishment of the Anaho
    Be by imperial command and a Koryo attack that severely defeats Paekche.
  language: English
  quote_policy: summarized
