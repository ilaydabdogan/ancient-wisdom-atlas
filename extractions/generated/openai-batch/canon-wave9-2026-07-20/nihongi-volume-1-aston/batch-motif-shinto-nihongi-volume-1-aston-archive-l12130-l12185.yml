canonical_text:
  quote: ''
  summary: Yamato-dake no Mikoto, unaware that a master God has become a serpent,
    treats the serpent as only a messenger and steps over it. The mountain god raises
    clouds, icy rain, mist, and gloom, leaving him unable to find a path until he
    drinks from a spring at the mountain foot and recovers his senses. He then becomes
    ill, returns through Ohari toward Ise and Otsu, finds a sword he had earlier left
    under a fir-tree, sings to the single pine-tree, and at Nobo offers captured Yemishi
    to a shrine and sends Kibi no Take-hiko to report to the Emperor.
  language: English
  quote_policy: summarized
