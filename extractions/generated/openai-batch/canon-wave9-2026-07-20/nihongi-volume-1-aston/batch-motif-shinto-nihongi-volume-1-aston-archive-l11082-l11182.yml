  quote: ''
  summary: The passage records a sacrifice to the Gods of Heaven and Earth, then narrates
    the Emperor's journey to Mino, his pursuit of Oto-hime as a consort, her concealment
    and later encounter at a carp pond, her refusal and proposal of her elder sister
    Yasaka Iri-hime as consort, and subsequent lists of consorts, children, and lineage
    ancestors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: WA Eig no Mikoto is sent and caused to do sacrifice; Ya-nushi-oshiho-dake-wo-goro
    no Mikoto goes to Kashihara in Abi and sacrifices to the Gods of Heaven and Earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ya-nushi-oshiho-dake-wo-goro no Mikoto lives at Kashihara in Abi for nine
    years and takes Kage-hime as wife; she is described as the mother of Takechi no
    Sukune.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Emperor travels to Mino after courtiers report that Oto-hime is a handsome
    woman of perfect beauty and daughter of Imperial Prince Yasaka Irihiko.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor wishes to obtain Oto-hime as consort and goes to her house; Oto-hime
    hears he is coming and conceals herself in a bamboo-grove.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Emperor has Oto-hime reside in the Kuguri Palace, lets loose carp in a
    pond, and amuses himself by watching them morning and evening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Oto-hime secretly comes to see the carp sporting and stands over the pond;
    the Emperor detains her and has intercourse with her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Oto-hime says that the way of husband and wife is an old and present rule,
    but that it is not convenient for her; she states that she is averse to conjugal
    intercourse and takes no pleasure in being within the curtain under imperial command.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Oto-hime tells the Emperor that she has an elder sister named Yasaka Iri-hime,
    beautiful in countenance and virtuous in disposition, and asks that the sister
    be placed in the hinder palace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Emperor assents, summons Yasaka Iri-hime, makes her his consort, and she
    bears him seven sons and six daughters whose names are listed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Additional consorts named Lady Midzuha, Ikaha-hime, Takada-hime, Oho-tane-hime,
