canonical_text:
  quote: ''
  summary: Two variant accounts describe Sosa no wo no Mikoto damaging the Sun-Goddess’s
    rice-fields and committing further outrages. After an offense connected with the
    New Palace seat, the Sun-Goddess enters the Rock-cave of Heaven and closes its
    door. The gods assemble ritual objects, including a mirror, jewels, offerings,
    and sakaki, and recite liturgies. The Sun-Goddess opens the cave door or is drawn
    out, restoring her radiance to the universe. Sosa no wo is fined with purification
    articles and banished.
  language: English
  quote_policy: summarized
