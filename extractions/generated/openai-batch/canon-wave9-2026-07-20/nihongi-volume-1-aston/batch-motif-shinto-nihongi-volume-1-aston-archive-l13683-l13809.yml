canonical_text:
  quote: ''
  summary: The passage first reports that unnamed gods were enshrined according to
    their instructions, allowing the Empress to cross the sea peacefully. Prince Oshikuma
    retreats to Uji while the Empress moves through Kii, meets the Prince Imperial,
    and prepares to attack. A prolonged darkness called the Eternal Night is investigated
    and attributed to two shrine priests having been buried together; after their
    coffins are separated and reinterred, sunlight and the distinction between day
    and night return. The Empress then sends commanders against Prince Oshikuma. At
    Uji, an opposing vanguard singer urges battle across the river, while Takechi
    no Sukune prepares his forces with concealed bowstrings and wooden swords and
    speaks deceptively to Prince Oshikuma.
  language: English
  quote_policy: summarized
