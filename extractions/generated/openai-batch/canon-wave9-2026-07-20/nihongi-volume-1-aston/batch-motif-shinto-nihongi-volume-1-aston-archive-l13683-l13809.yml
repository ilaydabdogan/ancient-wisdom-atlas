- id: obs:5
  text: The Empress asked Toyomimi about the omen, and an old man reported a tradition
    naming this kind of omen Atsunahi no tsumi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: An explanation was given that the priests of Shinu and Amano had been good
    friends, that the priest of Shinu died, and that the priest of Amano lay beside
    the corpse and died so that they were buried together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tomb was opened, the joint burial was confirmed, the coffins were changed
    and interred separately, and sunlight appeared with a distinction between day
    and night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the 5th day of the 3rd month, the Empress ordered Takechi no Sukune and
    Take-furu-kuma to lead a large army against Prince Oshikuma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Uji, Prince Oshikuma came out to offer battle, and Kuma no Kori, in the
    vanguard, sang a song urging the fighters to cross the river and join battle with
    bows and arrows.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Takechi no Sukune ordered his troops to bind their hair mallet-wise, conceal
    spare bowstrings in their top-knots, gird on wooden swords, and deceive Prince
    Oshikuma with words of submission.
  category: action
  evidence_refs:
  - ev:7
