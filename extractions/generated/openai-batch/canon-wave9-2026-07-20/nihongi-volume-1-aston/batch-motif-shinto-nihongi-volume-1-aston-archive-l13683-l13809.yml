- id: obs:3
  text: The Empress went south to Kii, met the Prince Imperial at Hitaka, consulted
    her ministers, decided to attack Prince Oshikuma, and moved to the Palace of Shinu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For many days it was dark like night, and people called the condition the
