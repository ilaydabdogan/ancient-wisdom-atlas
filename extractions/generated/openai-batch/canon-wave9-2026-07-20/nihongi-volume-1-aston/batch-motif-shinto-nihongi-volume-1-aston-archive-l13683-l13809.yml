- id: obs:1
  text: Unnamed gods were enshrined in accordance with their instructions, and the
    Empress was then able to cross the sea in peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Oshikuma withdrew his troops and encamped at Uji.
  category: action
  evidence_refs:
