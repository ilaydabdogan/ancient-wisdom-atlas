canonical_text:
  quote: ''
  summary: Hiko-hoho-demi no Mikoto is conveyed by a basket-work skiff into the sea,
    reaches the Sea-God's palace, receives hospitality, marries Toyo-tama-hime, and
    later departs with the recovered fish-hook, tide-controlling jewels, sea-creature
    escort, and instructions. On returning, he uses the jewels against his elder brother,
    who submits. Toyo-tama-hime, pregnant with the Heavenly Grandchild's offspring,
    asks for a seaside birth-house, arrives on a great tortoise with her younger sister,
    enters before the house is finished, and asks not to be looked upon during delivery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A river wild-goose is described as entangled in a snare and distressed; the
    unnamed actor in the sentence takes pity, loosens it, and lets it go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shiho-tsutsu no Oji appears, makes a basket-work skiff without interstices,
    places Hoho-demi no Mikoto in it, and pushes it into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The skiff sinks of its own accord, a Pleasant Road appears, and that road
    leads Hoho-demi no Mikoto to the Sea-God's palace.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sea-God comes out to meet the visitor, invites him inside, seats him on
    eight layers of sea-asses' skins, offers a prepared banquet, and asks why the
    Grandchild of the Heavenly Deity has come.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An embedded variant says the Sea-God had been told by his child that the Heavenly
    Grandchild was mourning by the seashore.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hiko-hoho-demi no Mikoto relates what has happened; he remains at the Sea-God's
    palace, and the Sea-God gives him Toyo-tama-hime as wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After three years, when the time comes for Hiko-hoho-demi no Mikoto to depart,
    the Sea-God sends for the tahi and finds the fish-hook in her mouth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sea-God presents the fish-hook to Hiko-hoho-demi no Mikoto and instructs
    him to recite a formula over it and fling it to his elder brother with a back-handed
    motion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sea-God summons the sea-monsters, asks how long each will take to carry
    the Heavenly Grandchild home, and sends the one-fathom sea-monsters as escorts
    because they say they can perform the service in one day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Sea-God gives Hiko-hoho-demi no Mikoto the tide-flowing jewel and the
    tide-ebbing jewel and teaches him how to use them.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sea-God further instructs Hiko-hoho-demi no Mikoto to make puddle fields
    when his elder brother makes high fields, and to make high fields when the elder
    brother makes puddle fields.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After returning home, Hiko-hoho-demi no Mikoto follows the Sea-God's instructions;
    the tide-flowing jewel causes the elder brother to suffer as if drowning, and
    the tide-ebbing jewel relieves him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Hi no susori no Mikoto pines away, laments that he has become impoverished,
    and submits to his younger brother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Toyo-tama-hime tells the Heavenly Grandchild that she has conceived his offspring,
    says she cannot give birth in the ocean, and asks him to build and await her in
    a house by the seaside.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Hiko-hoho-demi no Mikoto builds a parturition-house with cormorants' feathers
    as thatch; before the thatching is completed, Toyo-tama-hime arrives riding a
    great tortoise with her younger sister Tama-yori-hime and enters because delivery
    is urgent.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Toyo-tama-hime quietly asks the Heavenly Grandchild not to look at her while
    she is about to be delivered.
  category: speech
  evidence_refs:
  - ev:12
