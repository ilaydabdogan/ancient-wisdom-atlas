canonical_text:
  quote: ''
  summary: In A.D. 480, the childless Emperor sends Ohotomo no Muruya to the provinces
    and establishes three Shiraga Be groups so that a trace may remain for posterity.
    Later that winter, Wodate of the Be of Kume of Iyo, described as ancestor of the
    Yamabe no Muraji and Governor of Harima, is sent for the offerings of the feast
    of first-fruits. The supplied excerpt ends as it introduces a new muro of Hosome,
    Miyakko. Notes gloss the Shiraga Be categories and compare the passage with a
    Kojiki mention of a Shiraga Be.
  language: English
  quote_policy: summarized
