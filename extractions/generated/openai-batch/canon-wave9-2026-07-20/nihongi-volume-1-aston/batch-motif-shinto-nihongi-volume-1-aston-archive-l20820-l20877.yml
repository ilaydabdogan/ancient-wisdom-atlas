canonical_text:
  quote: ''
  summary: 'The passage records imperial administrative actions under Yūryaku: the
    Hada House is assigned to Lord Sake of Hada, whose workmen present fine silks
    and who receives a title; mulberry planting and industrial taxes are ordered;
    the Aya Be are organized and a title is granted; Hanishi potters provide pure
    vessels for imperial meals and are reorganized as the Nihe no Hanishi Be; and
    Mononobe leaders are sent against Ise no Asahi no Iratsuko, who meets the troops
    in battle and speaks of his archery.'
  language: English
  quote_policy: summarized
