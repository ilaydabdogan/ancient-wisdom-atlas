canonical_text:
  quote: ''
  summary: The passage gives a genealogy for Imperial Prince Oshiha of Ichinobe and
    Hayehime, describes the Emperor as a ruler shaped by hardship on the borders and
    attentive to the poor, and recounts the killing of the Emperor's father, the flight
    and concealment of Prince Woke and Prince Ohoke, and the actions and death of
    the retainer Omi/Kusakabe no Muraji, also called Tatoku.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Genealogy says Imperial Prince Oshiha of Ichinobe married Hayehime, daughter
    of Ari no Omi, and had three sons and two daughters named Winatsu hime, Prince
    Ohoke, Prince Woke, Princess Ihitoyo, and Prince Tachibana.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor is described as having lived for a long time on the borders and
    as being thoroughly acquainted with the miseries of the people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor is described as dispensing virtuous influence, enforcing government
    regulations, helping the poor, supporting the husbandless, and receiving the allegiance
    of the Empire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Imperial Prince Ichinobe no Oshiha and the Toneri Saheki be no Nakachiko were
    slain by Emperor Ohohatsuse on the moor of Kaya.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ichinobe no Oshiha and Saheki be no Nakachiko were buried in the same grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After hearing that their father had been shot to death, the Emperor, identified
    by the note as Woke, and Prince Ohoke were afraid, escaped, and hid themselves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Toneri Omi, Kusakabe no Muraji, with his son Adahiko, secretly served
    the royal fugitives so that they avoided disaster by fleeing to the district of
    Yosa in Tamba.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Omi changed his name to Tatoku, fled to a cave in Mount Shijimi in Harima,
    and strangled himself there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Emperor, still ignorant of where Omi had gone, urged his elder brother
    Prince Ohoke to go toward Akashi in Harima, where both changed names.
  category: sequence
  evidence_refs:
  - ev:6
