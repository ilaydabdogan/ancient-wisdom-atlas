canonical_text:
  quote: ''
  summary: An opening verse asserts exclusive requited love. The eldest son realizes
    that Shibi has possessed Kagehime and that disrespect has been shown to him; he
    becomes enraged, goes to Ohotomo no Kanamura no Muraji, raises troops, and plans
    action. Ohotomo no Muraji ambushes and kills Shibi no Omi at Mount Nara. A variant
    says Shibi was spending the night at Kagehime’s house when he was slain. Kagehime
    goes to the place of death, weeps, and sings a lament naming places passed and
    mentioning boiled rice, water, and falling tears. Translator notes explain that
    the poem contains wordplay largely lost in English.
  language: English
  quote_policy: summarized
