canonical_text:
  quote: ''
  summary: The passage gives variant accounts of the birth of islands, including placenta
    imagery and twin or triplet islands. It then describes the female and male deities
    becoming husband and wife, producing islands and a leech-child, producing sea,
    rivers, mountains, tree and herb ancestors, and then producing the Sun-Goddess,
    Moon-god, another leech-child, and Sosa no wo. The Sun-Goddess and Moon-god are
    sent to Heaven; the leech-child is abandoned in a heavenly boat; Sosa no wo is
    described as fierce, cruel, and destructive.
  language: English
  quote_policy: summarized
