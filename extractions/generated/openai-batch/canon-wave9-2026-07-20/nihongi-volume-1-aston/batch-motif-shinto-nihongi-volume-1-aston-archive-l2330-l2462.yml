comparison_claims:
- id: claim:1
  claim: The editorial note explicitly invites comparison between the Japanese mythic
    context and the Chinese P’an-ku myth, especially a pattern in which a divine or
    primordial body is associated with the production of cosmic or natural features.
  claim_level: same_function
  target: Chinese P’an-ku myth
  evidence_refs:
  - ev:1
  counter_evidence_refs:
  - ev:1
  confidence: low
  limitations: The same note reports Hirata’s rejection of identification and discusses
    differences in solar gender; the provided passage does not establish historical
    contact or exact equivalence.
- id: claim:2
  claim: The passage supports a same-function comparison between Izanagi’s peaches
    repelling the Thunder-Gods or evil spirits and Chinese peach lore in which peaches
    or peach wood ward off demons or disease spirits.
  claim_level: same_function
  target: Chinese peach demon-averting lore and peach-wood exorcistic practice noted
    by the translator
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is supplied by an editorial note; it does not by itself
    prove borrowing or a specific historical transmission path.
