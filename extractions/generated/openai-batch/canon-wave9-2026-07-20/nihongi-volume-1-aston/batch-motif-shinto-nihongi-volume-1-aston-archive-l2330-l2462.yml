canonical_text:
  quote: ''
  summary: The passage includes an editorial comparison with the Chinese P’an-ku myth,
    then gives variant accounts in which Kagutsuchi is slain and cut apart, producing
    gods, mountain gods, and the fiery quality of natural things. It then recounts
    Izanagi’s attempt to see Izanami after death, her warning not to look, his seeing
    her decayed body with eight Thunder-Gods upon it, his flight, the use of peaches
    to repel the thunders, the establishment of a boundary with a staff, and an alternate
    version in which the divine pair sever their relationship at Yomi after the violated
    viewing taboo.
  language: English
  quote_policy: summarized
