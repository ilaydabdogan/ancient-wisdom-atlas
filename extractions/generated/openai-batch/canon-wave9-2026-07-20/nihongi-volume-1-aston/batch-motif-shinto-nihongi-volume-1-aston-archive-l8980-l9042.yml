canonical_text:
  quote: ''
  summary: The passage describes an imperial ritual crisis. Yamato-oho-kunidama no
    Kami is entrusted to Nunaki-iri-bime no Mikoto for worship, but she is judged
    unfit. After calamities, the Emperor fears blame from the Gods of Heaven and Earth,
    proposes divination, assembles many deities at Kami-asachi, and receives an inspired
    oracle through Yamato-to-to-hi-momoso-hime no Mikoto. The oracle identifies Oho-mononushi
    no Kami as the instructing deity. When worship has no effect, the Emperor bathes,
    abstains, purifies the Hall, prays for dream instruction, and dreams of a noble-appearing
    man announcing himself as Oho-mono-nushi no Kami.
  language: English
  quote_policy: summarized
