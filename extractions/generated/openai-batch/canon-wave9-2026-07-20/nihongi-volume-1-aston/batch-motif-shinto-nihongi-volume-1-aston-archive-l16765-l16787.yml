  quote: ''
  summary: A dream interpretation or speech about white salt and mist is followed
    before dawn by a hunter killing a male deer, giving rise to a proverb about a
    belling male deer and dream interpretation. In the following dated entry, the
    Emperor wishes to take Imperial Princess Medori as a concubine and appoints Imperial
    Prince Hayabusa wake as intermediary; Hayabusa secretly weds her and delays reporting,
    so the Emperor goes to her chamber unaware that she has a husband.
