canonical_text:
  quote: ''
  summary: In the fifth year, the Emperor hunts on Mount Katsuraki. A supernatural
    bird warns the party before a raging wild boar attacks. The attendants flee into
    trees, while the Emperor stops and kills the boar. He threatens to execute the
    attendants, but the Empress intercedes, and he accepts her words. A later section
    reports that Lord Kasyuni of Pékché, after hearing of Iketsu hime's death by burning,
    decides to end the tribute custom of sending women as Uneme, sends his younger
    brother Lord Kun to Japan, and gives Lord Kun a pregnant consort with instructions
    that any child born during the journey be sent back by ship.
  language: English
  quote_policy: summarized
