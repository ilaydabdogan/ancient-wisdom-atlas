  summary: The passage gives editorial notes on a nuptial hut and then several variant
    accounts of Sosa no wo no Mikoto. He descends or travels, encounters Inada/Kushi-nada
    figures, aids grieving divine parents whose children are devoured by an eight-forked
    serpent, uses sake to intoxicate the serpent, slays it, discovers Kusa-nagi no
    Tsurugi in its tail, and is linked through marriage and genealogy to later deities.
  language: English
