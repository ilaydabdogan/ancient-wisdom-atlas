canonical_text:
  quote: ''
  summary: The passage opens Book I, “The Age of the Gods.” It describes an original
    state in which Heaven and Earth and the Im/Yo principles are undivided in an egg-like
    chaotic mass. The clearer element forms Heaven, the grosser element settles as
    Earth, divine beings arise between them, land-soil floats like a fish on water,
    and a reed-shoot-like thing becomes the deity Kuni-toko-tachi no Mikoto, followed
    by two further deities.
