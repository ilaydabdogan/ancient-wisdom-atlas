    labor for Palace construction, the people's intense unsupervised work until the
    Palace buildings are completed, and a later command in which the Emperor describes
    marshy land, few cultivated fields, and sluggish river waters. Notes discuss a
    Be also called Nibu Be and a Kojiki explanation of two Be as commemorative institutions.
