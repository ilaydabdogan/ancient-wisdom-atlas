canonical_text:
  quote: ''
  summary: Hiko-hoho-demi loses his elder brother's fish-hook and, after failed attempts
    to replace it, grieves by the sea. Shiho-tsutsu no Oji places him in a close-woven
    basket and sends him into the sea, where he reaches the Sea-God's palace. The
    Sea-God receives him, gathers the fishes, and finds the lost hook in the mouth
    of the Red-woman fish. Hiko-hoho-demi marries Toyo-tama-hime and lives in the
    sea-palace for three years, then longs for his own country. The Sea-God returns
    the hook and gives him tide-flowing and tide-ebbing jewels with instructions for
    subduing his elder brother. Hiko-hoho-demi returns, the elder brother submits
    and is spared, and Toyo-tama-hime later comes to the shore pregnant, accompanied
    by Tama-yori-hime.
  language: English
  quote_policy: summarized
