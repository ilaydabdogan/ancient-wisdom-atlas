canonical_text:
  quote: ''
  summary: The passage first gives an editorial note comparing the Japanese yata-garasu
    with the Chinese Yang-wu or Sun-crow, a red three-clawed bird said to inhabit
    the sun, and remarks on supernatural animal guidance in old-world story. In the
    narrative, the Emperor praises Hi no Omi no Mikoto as a faithful, brave, successful
    guide and renames him Michi no Omi. The Emperor summons the two Ukeshi chiefs
    of Uda; the Younger comes and reports that the Elder is resisting, has arranged
    an ambush, and has prepared a palace trap for a banquet. Michi no Omi verifies
    the hostility, forces Ukeshi the Elder into the house he prepared, and Ukeshi
    the Elder is crushed by the engine. His body is decapitated, the blood gives rise
    to the place-name Uda no Chi-hara, and Ukeshi the Younger prepares a feast of
    beef and sake.
  language: English
  quote_policy: summarized
