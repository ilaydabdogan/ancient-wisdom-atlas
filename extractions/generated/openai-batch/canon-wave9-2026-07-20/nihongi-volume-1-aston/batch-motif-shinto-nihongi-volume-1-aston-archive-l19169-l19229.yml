canonical_text:
  quote: "“There is a wild boar!”"
  summary: The Emperor, resentful of a prior succession plan favoring Imperial Prince
    Ichinobe no Oshiha, deceitfully arranges a hunting excursion, falsely calls out
    that there is a wild boar, shoots the prince dead, and also kills the prince’s
    household man Uruwa. A later notice says Imperial Prince Mimtima encounters a
    force sent against him and joins battle.
