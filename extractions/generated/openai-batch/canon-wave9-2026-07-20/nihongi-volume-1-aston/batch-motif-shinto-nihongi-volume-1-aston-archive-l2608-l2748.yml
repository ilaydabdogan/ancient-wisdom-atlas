canonical_text:
  quote: ''
  summary: 'The passage begins with an editorial note on variant traditions concerning
    Susa no wo, Uke-mochi, and a sun-and-moon aetiology. It then gives two endings
    for Izanagi after completing his task: withdrawal into a gloomy abode on Ahaji
    or ascent to Heaven and residence in the smaller palace of the Sun. The main narrative
    describes Sosa no wo''s fierce ascent to Heaven, Ama-terasu''s suspicion and armed
    challenge, Sosa no wo''s explanation that he wishes to see his elder sister before
    going to the Nether Land, and an oath-test in which deities are born from Ama-terasu''s
    treatment of his sword and from Sosa no wo''s treatment of her Yasaka jewels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'An editorial note reports variant traditions: the Kojiki makes Susa no wo
    slay Uke-mochi, while the Kiujiki agrees with a previously given version connected
    with why the sun and moon are not seen together.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ama-terasu no Oho-kami and Uke-mochi no Kami are identified in the note as
    principal deities worshipped at Ise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One account says Izanagi no Mikoto, after completing his task and before a
    change in his spirit-career, built an abode of gloom on the island of Ahaji and
    dwelt there forever in silence and concealment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another account says Izanagi no Mikoto ascended to Heaven, reported his mission,
    and lived in the smaller palace of the Sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Sosa no wo no Mikoto went up to Heaven, the fierceness of his divine
    nature caused commotion in the sea and groaning in the hills and mountains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ama-terasu no Oho-kami heard of Sosa no wo's coming, suspected he intended
    to rob her of her kingdom, and referred to parental allotment of separate limits
    to the children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ama-terasu no Oho-kami adopted martial dress, wore Yasaka jewels, armed herself
    with quivers, an elbow-pad, bow, and sword-hilt, stamped the courtyard earth,
    kicked it about, and cried out in defiance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sosa no wo no Mikoto answered that his heart was not black, that he was obeying
    his parents' command to proceed forever to the Nether Land, and that he had come
    from afar to see his elder sister face to face before departing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ama-terasu no Oho-kami asked how Sosa no wo no Mikoto would make evident the
    redness, or purity, of his heart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sosa no wo no Mikoto proposed a mutual oath in which they would produce children;
    female children from him would show an impure heart, while male children would
    show a pure heart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ama-terasu no Oho-kami took Sosa no wo no Mikoto's ten-span sword, broke it
    into three pieces, rinsed the pieces in the true-well of Heaven, chewed them,
    blew them away, and three female deities were born from the mist of her breath.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sosa no wo no Mikoto took Ama-terasu no Oho-kami's string of five hundred
