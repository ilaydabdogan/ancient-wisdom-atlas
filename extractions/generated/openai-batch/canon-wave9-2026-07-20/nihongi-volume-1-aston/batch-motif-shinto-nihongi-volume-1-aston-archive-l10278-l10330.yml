  quote: ''
  summary: In the Suinin section, the Emperor notices that the Imperial Prince gains
    speech on seeing a swan. Amano Yukaha Tana volunteers to catch the bird, follows
    it to Idzumo according to one account, captures and presents it, and is rewarded
    with a title and associated occupational groups. The passage then shifts to the
    Emperor commanding five Daibu and praising the wisdom, government, worship, humility,
    and restraint of his predecessor.
