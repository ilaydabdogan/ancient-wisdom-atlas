  text: The Emperor reacted with astonishment and said that Heaven had bestowed two
    children on them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor sent Wodate, a token of authority, and attending Toneri to Akashi
    to meet and escort the two princes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wodate and companions arrived in Settsu escorting Ohoke and Woke, and Omi
