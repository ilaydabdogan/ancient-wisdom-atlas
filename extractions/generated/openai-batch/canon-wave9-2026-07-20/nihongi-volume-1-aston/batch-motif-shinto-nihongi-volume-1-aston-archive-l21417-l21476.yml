  text: An official associated with the Oshinomi Be and the granary of Shijimi saw
    Ohoke and Woke, identified them as sons of Imperial Prince Oshiha of Ichinobe,
    recognized them as his lords, and cared for their nurture.
  category: action
  evidence_refs:
  - ev:1
