canonical_text:
  quote: ''
  summary: The passage recounts the recovery of a lost fish-hook from a fish’s mouth,
    instructions for returning it with an imprecation, and Hoho-demi’s return from
    the sea realm. It then tells of Toyo-tama-hime’s childbirth by the seashore, Hoho-demi’s
    forbidden viewing of her sea-monster form, her return to the sea, and the naming
    of the child. A variant version describes Hoho-demi in a cassia tree by a well,
    Toyo-tama-hime seeing his reflection, the Sea God hosting him, the fish-hook’s
    discovery in Kuchi-me’s mouth, an etiological explanation for that fish’s exclusion
    from imperial food, and the Sea God’s gift of tide jewels with further instructions
    for returning the hook.
  language: English
  quote_policy: summarized
