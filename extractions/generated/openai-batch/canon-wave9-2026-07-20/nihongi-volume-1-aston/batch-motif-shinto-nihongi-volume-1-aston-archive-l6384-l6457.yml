canonical_text:
  quote: ''
  summary: The Sea-God recovers the elder brother’s fish-hook through Kuchime and
    gives it to Hiko-hoho-demi no Mikoto with instructions for a spoken curse, spitting,
    and whistling to raise wind against the elder brother when he fishes. The younger
    brother obeys; a tempest overwhelms the elder brother, who begs for rescue and
    promises vassal service. The elder brother then performs a ritualized imitation
    of drowning, said to continue as a custom. A following episode says Toyo-tama-hime,
    angered that the Heavenly Grandchild did not heed her request at the time of delivery,
    wraps her child, lays him on the beach, returns to the sea, and thereby explains
    the lack of communication between land and sea.
  language: English
  quote_policy: summarized
