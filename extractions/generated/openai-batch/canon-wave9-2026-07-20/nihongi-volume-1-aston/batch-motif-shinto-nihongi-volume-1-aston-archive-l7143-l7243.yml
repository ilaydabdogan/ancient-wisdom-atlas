canonical_text:
  quote: ''
  summary: In the Jimmu narrative, the Emperor receives dream directions, hears Ukeshi
    the Younger’s warning about hostile groups, sends two disguised men to take clay
    from Heavenly Mount Kagu, makes ritual vessels from it, sacrifices to the Gods
    of Heaven and Earth at the River Nifu, and tests success through signs including
    an opened road, self-forming ame, and fish floating downstream.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor receives directions in a dream with reverence and proceeds to
    act on them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ukeshi the Younger warns that enemy groups in Yamato intend to give battle
    and advises taking clay from the Heavenly Mount Kagu to make platters for sacrifice
    to heavenly and earthly deities.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor has Shihi-netsu-hiko disguised as an old man and Ukeshi the Younger
    as an old woman, then sends them secretly to take earth from the summit of Heavenly
    Mount Kagu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The enemy army fills the road, and Shihi-netsu-hiko prays that the road open
    if the Emperor can conquer the land, but that the brigands block them if not.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hostile band laughs at the disguised pair, leaves the road, and allows
    them to pass to the mountain, where they take clay and return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor makes eighty platters, eighty Heavenly small jars, and sacred
    jars from the clay, then sacrifices to the Gods of Heaven and Earth at the upper
    waters of the River Nifu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A foam-like phenomenon appears on the Asa-hara plain by the river of Uda and
    is attributed in the passage to a curse cleaving to them.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Emperor vows to make ame in the platters without using water; the ame
    forms of itself.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Emperor vows that if fish become drunken and float downstream after sacred
    jars are sunk in the River Nifu, he will succeed in establishing the land; after
    the jars are sunk mouth-downward, the fish surface, gape, gasp, and float downstream.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Shihi-netsu-hiko reports the fish omen to the Emperor, who rejoices and plucks
    up a five-hundred-branched masakaki tree.
  category: sequence
  evidence_refs:
  - ev:9
