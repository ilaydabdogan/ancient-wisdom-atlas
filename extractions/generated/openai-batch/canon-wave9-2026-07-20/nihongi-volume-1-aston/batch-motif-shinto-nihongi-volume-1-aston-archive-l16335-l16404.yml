canonical_text:
  quote: ''
  summary: The passage recounts an imperial arrangement involving Hayamachi and Kugahime,
    in which Kugahime is sent toward Kuhada, becomes ill, dies on the journey, and
    has a tomb remembered. It then reports that Silla failed to bring tribute, that
    two envoys were sent to inquire, and that the Silla people, afraid, presented
    a large tribute. Finally, the Emperor tells the Empress that he wishes to take
    Imperial Princess Yata as a concubine; the Empress refuses, and the Emperor and
    Empress exchange songs using images of a spare bowstring, doubled garments, night
    couches, and companionship.
  language: English
  quote_policy: summarized
