canonical_text:
  quote: ''
  summary: The passage recounts the Empress Iha no hime dwelling at Tsutsuki, refusing
    messengers and the Emperor after he has taken Imperial Princess Yata as concubine,
    and the Emperor’s poetic attempts at reconciliation. It then records succession
    events, the Empress’s death and burial, Yata’s appointment as Empress, and a later
    episode in which the Emperor and Empress hear a melancholy deer cry from Toga
    moor until a buck from that moor is presented in a basket.
  language: English
  quote_policy: summarized
