canonical_text:
  quote: ''
  summary: The passage first gives a fragmentary genealogy in which Mizo-kuhi-hime,
    also called Tama-kushi-hime, bears Hime-tatara I-suzu-hime, who becomes empress
    of Kami-Yamato Ihare-biko Hohodemi. It then recounts Oho-na-mochi, while pacifying
    the land, hearing a human voice from the sea and finding a dwarf who arrives on
    the tide in a plant-rind boat and wren-feather clothing. Taka-mi-musubi identifies
    this figure as Sukuna-bikona, one of his children who slipped from between his
    fingers and fell. Book II begins with the divine genealogy of Ninigi, the desired
    installation of Ninigi as lord of the Central Land of Reed-Plains, the presence
    there of shining deities, evil buzzing deities, and speaking vegetation, and the
    dispatch of Ama-no-ho-hi, who fails to report after currying favor with Oho-na-mochi.
  language: English
  quote_policy: summarized
