canonical_text:
  quote: ''
  summary: The passage opens Book IV on Emperor Kami-Nunagaha-mimi, later Suizei Tennō,
    giving his parentage, qualities, grief at his father's death, and the subsequent
    plot by his elder half-brother Tagishi-mimi. Kami-Nunagaha-mimi and Kami-Ya-wi-mimi
    learn of the plot, prepare weapons through appointed craft groups and smiths,
    and Kami-Nunagaha-mimi intends to kill Tagishi-mimi while he is alone in a great
    muro at Kataoka.
  language: English
  quote_policy: summarized
