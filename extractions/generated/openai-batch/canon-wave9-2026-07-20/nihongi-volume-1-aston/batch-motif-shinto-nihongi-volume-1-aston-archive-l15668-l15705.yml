canonical_text:
  quote: ''
  summary: Book XI introduces Emperor Oho-sazaki, giving his parentage and personal
    qualities. After Emperor Homuda's death, the Prince Imperial offers to yield the
    Imperial Dignity to Oho-sazaki, argues that a ruler must care for the people like
    Heaven and Earth, describes himself as unfit, praises Oho-sazaki as benevolent
    and suitable, and notes the ritual obligation to serve the ancestral shrines and
    the Gods of Earth and Grain.
  language: English
  quote_policy: summarized
