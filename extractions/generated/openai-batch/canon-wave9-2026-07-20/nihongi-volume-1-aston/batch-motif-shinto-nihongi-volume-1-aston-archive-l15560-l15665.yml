canonical_text:
  quote: ''
  summary: The passage recounts guided travel to Wu and the receipt of women workworkers,
    the sending of a Pékché royal woman with attendants to the Emperor, an imperial
    inquiry about elder and younger children that precedes succession arrangements,
    the Emperor's death, and later offerings or assignments of women workworkers connected
    to a deity, Oho-sazaki no Mikoto, and named descendant groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King of Koryo sent two men, Kureha and Kureshi, as guides for persons
    who needed to know the road.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: With the guides' help, the party reached Wu, where the King of Wu gave four
    women as workwomen.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The King of Pékché sent his younger sister, the Lady Sin-chi-to, to wait upon
    the Emperor as his concubine; she came with seven women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor summoned Oho-yama-mori no Mikoto and Oho-sazaki no Mikoto and
    asked them whether they loved their children and whether elder or younger children
    were dearest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Oho-yama-mori no Mikoto answered that none were like the elder children, and
    the Emperor showed displeasure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Oho-sazaki no Mikoto answered that the older child was already grown and less
    worrisome, while a young child might not reach manhood and was therefore pitiable;
    the Emperor was pleased.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator states that the Emperor wished to establish Uji no Waka-iratsuko
    as Prince Imperial and made the inquiry to conciliate the two Imperial Princes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Uji no Waka-iratsuko was established as successor; Oho-yama-mori no Mikoto
    was put in charge of mountains, rivers, woods, and moors; Oho-sazaki no Mikoto
    became assistant to the Prince Imperial and administered state affairs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Emperor died in the Palace of Toyo-Akira at the age of 110, with another
    account naming the Palace of Ohokuma.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Achi no Omi and his companions arrived in Tsukushi from Wu, and the Great
    God of Muna-gata asked for workwomen.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ane-hime was offered to the Great God of Muna-gata and is identified as ancestor
    of the Mitsukahi no Kimi in Tsukushi.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Three women were later offered to Oho-sazaki no Mikoto after the Emperor's
    death; their descendants are identified as the present seamstresses of Kure and
    Kaya.
  category: relationship
  evidence_refs:
  - ev:11
