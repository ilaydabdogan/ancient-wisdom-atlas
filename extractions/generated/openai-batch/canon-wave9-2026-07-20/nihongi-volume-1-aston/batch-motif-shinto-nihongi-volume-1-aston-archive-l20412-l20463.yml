canonical_text:
  quote: ''
  summary: A remarkable red horse is obtained by exchange, but after being stabled
    it becomes a clay horse; the original piebald horse is then found among clay horses
    at the Homuda misasagi and recovered. A second notice says geese presented by
    Wu are killed by a dog, after which Minuma no Kimi compensates the Emperor with
    replacement geese and bird-keepers. An editorial note identifies such clay horses
    as substitutes for living horses formerly sacrificed at tombs.
  language: English
  quote_policy: summarized
