canonical_text:
  quote: ''
  summary: Sosa no wo no Mikoto descends to the head-waters of the River Hi in Idzumo,
    finds grieving parents and their daughter Kushi-nada-hime, learns that an eight-forked
    serpent devours their daughters yearly, transforms the girl into a comb, prepares
    sake to intoxicate the serpent, slays it, discovers a sword in its tail, gives
    the sword to the Gods of Heaven, and later celebrates marriage at Suga, where
    a child is born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sosa no wo no Mikoto descends from Heaven and goes to the head-waters of the
    River Hi in Idzumo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He hears weeping and finds an old man, an old woman, and a young girl between
    them whom they are caressing and lamenting over.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man identifies himself as the Earthly Deity Ashi-nadzuchi, identifies
    his wife as Te-nadzuchi, and identifies the girl as their daughter Kushi-nada-hime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents say they formerly had eight daughters, but an eight-forked serpent
    devoured them year after year, and the time for Kushi-nada-hime to be devoured
    is approaching.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sosa no wo no Mikoto asks whether the father will give him the daughter, and
    the father agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sosa no wo no Mikoto changes Kushi-nada-hime into a many-toothed close-comb
    and places it in the knot of his hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sosa no wo no Mikoto has Ashi-nadzuchi and Te-nadzuchi brew eight-fold sake,
    prepare eight cupboards, and set a tub of sake in each cupboard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The serpent appears with an eight-forked head and tail, red eyes, firs and
    cypresses growing on its back, and a body extending over eight hills and eight
    valleys.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each head of the serpent drinks one tub of sake; the serpent becomes drunk
    and falls asleep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sosa no wo no Mikoto draws his ten-span sword and chops the serpent into small
    pieces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Sosa no wo no Mikoto reaches the tail, his sword is notched; he splits
    the tail open and finds a sword inside, called Kusa-nagi no tsurugi in the passage.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage gives an alternate original name for the discovered sword, Ama
    no Mura-kumo no tsurugi, and reports that Sosa no wo no Mikoto gives the divine
    sword to the Gods of Heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Afterward Sosa no wo no Mikoto seeks a place for marriage, comes to Suga in
    Idzumo, says his heart is refreshed, and builds a palace there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: One version includes a poem about many clouds and a manifold fence to receive
    spouses; afterward the spouses have intercourse and a child named Oho-na-muchi
    no Kami is born.
  category: sequence
  evidence_refs:
  - ev:9
