canonical_text:
  quote: 'In words, secrecy is to be prized: in deeds, caution is advisable.'
  summary: A secret two-person plot is carried out against Tagishi-mimi no Mikoto.
    Kami-Ya-wi-mimi no Mikoto fails to shoot through fear, and Kami-Nunagaha-mimi
    no Mikoto kills Tagishi-mimi himself. Kami-Ya-wi-mimi yields sovereignty to Kami-Nunagaha-mimi,
    who later assumes imperial rank. The passage then records empress appointments,
    descent, heir designation, deaths, burials, and the accession of Emperor Shiki-tsu-hiko-tama-demi.
  language: English
  quote_policy: quoted
