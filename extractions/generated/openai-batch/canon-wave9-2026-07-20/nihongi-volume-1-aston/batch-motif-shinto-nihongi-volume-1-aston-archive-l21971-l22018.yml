  summary: A speaker praises an Imperial scion and argues that the ruler should care
    for the Temples of Earth and Grain and the people. The Emperor consents in deference
    to his elder brother but does not immediately take the throne. The world praises
    the mutual yielding of elder and younger brother. Later, high officials urge the
    Emperor to accept the inheritance, become Lord of the Temple of Heaven, continue
    the ancestral line, correspond to Heaven's mind, and satisfy the people's hopes.
