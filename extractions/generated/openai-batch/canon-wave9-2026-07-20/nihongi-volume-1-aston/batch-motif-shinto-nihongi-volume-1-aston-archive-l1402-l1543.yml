  summary: The passage combines translator/editorial notes on phallic worship with
    a creation narrative. Drops from a spear coagulate into Ono-goro-jima; two deities
    descend, make it the central pillar of the land, circumambulate it, correct an
    unlucky order of speech, and unite as husband and wife. Their births produce Ahaji,
    Yamato, Iyo, Tsukushi, twin islands Oki and Sado, and other islands, with some
    small islands said to arise from coagulated salt-water or fresh-water foam.
