candidate_motifs:
- id: motif:1
  label: hereditary custody of divine and imperial treasures
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage explains the origin of treasure custody at Iso no kami through
    imperial grant, divine request, and later Mononobe custodianship.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage explicitly gives an origin for custodianship; the broader
    taxonomy link to royal legitimacy is interpretive and should be reviewed.
- id: motif:2
  label: ascent to a divine heavenly storehouse by ladder
  taxonomy_refs:
  - ascent
  basis: Inishiki responds to Oho-naka-tsu-hime’s objection by saying a ladder can
    be made for the high divine storehouse, and the passage cites this as a proverb’s
    origin.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The ascent is presented as speech and proverbial origin, not as an enacted
    journey.
- id: motif:3
  label: precious jewel discovered inside a killed animal
  taxonomy_refs: []
  basis: Ayuki kills a mujina, and a magatama of Yasaka gem is found inside the animal’s
    belly and offered to the Emperor.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly matches this object-discovery pattern.
- id: motif:4
  label: concealed sacred object reveals itself
  taxonomy_refs: []
  basis: Kiyo-hiko conceals the Idzushi short sword in his clothing, but it appears
    from among his garments and becomes visible to the Emperor.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage describes concealment and revelation but does not call the
    act theft.
- id: motif:5
  label: autonomous weapon becomes enshrined deity
  taxonomy_refs: []
  basis: The Idzushi short sword disappears, moves of its own accord, goes to Ahaji,
