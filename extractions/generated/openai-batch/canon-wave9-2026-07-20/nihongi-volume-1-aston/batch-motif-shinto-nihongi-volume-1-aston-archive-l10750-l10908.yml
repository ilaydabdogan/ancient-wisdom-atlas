canonical_text:
  quote: ''
  summary: 'The passage recounts several Suinin-era origins and treasure episodes:
    swords and divine treasures are deposited at Iso no kami and entrusted to hereditary
    custodians; a proverb about ascending to the divine storehouse of Heaven by ladder
    is explained; a gem is found inside an animal killed by a dog and offered to the
    Emperor; treasures brought by the Silla prince Ama no hihoko are requested, including
    the Idzushi short sword, which reveals itself, disappears, and is later worshipped
    as a god on Ahaji; Ama no hihoko’s arrival and marriage in Tajima are narrated;
    Tajima Mori is sent to the Eternal Land for out-of-season fragrant fruit and returns
    after the Emperor’s death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten groups of Be were granted to Imperial Prince Inishiki, and a thousand
    swords were deposited first in Osaka and later in the shrine of Iso no kami.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed God requested that Ichikaha of the Kasuga Omi family attend to
    the swords, and the Emperor commanded this arrangement.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inishiki no Mikoto said he was old and unable to have charge of the divine
    treasures, and asked his younger sister Oho-naka-tsu-hime no Mikoto to take charge
    of them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oho-naka-tsu-hime refused, saying she was a feeble woman and asking how she
    could ascend to the divine storehouse of Heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inishiki replied that he could make a ladder for the high divine storehouse,
    and the passage gives this as the origin of a proverb about ascending to the divine
    storehouse of Heaven by planting a ladder.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Oho-naka-tsu-hime ultimately gave the divine treasures to Mononobe no Tochine
    no Oho-muraji, and the Mononobe no Muraji are said to retain charge of the treasures
    of Iso no kami.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Tamba, Mikaso’s dog Ayuki killed a wild animal called a mujina, and a magatama
    of Yasaka gem was found in the animal’s belly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gem found inside the animal was offered to the Emperor and is said to
    be in the shrine of Iso no kami.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Emperor requested to see the divine treasures associated with the Silla
    prince Ama no hihoko, and Kiyo-hiko presented several treasures while concealing
    the short sword Idzushi in his clothing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The concealed short sword became visible from Kiyo-hiko’s garments; after
    the Emperor questioned him, Kiyo-hiko presented it, and all the treasures were
    deposited in the Sacred Treasury.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Idzushi short sword later disappeared from the Sacred Treasury, came of
    its own accord to Kiyo-hiko’s house, disappeared again, and finally went to Ahaji,
    where islanders considered it a God and built it a shrine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ama no hihoko arrived by ship in Tajima, identified himself as a son of the
    king of Silla, dwelt in Tajima, married Mata no wo, and became an ancestor in
    Kiyo-hiko’s line.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Emperor commanded Tajima Mori to go to the Eternal Land to obtain fragrant
    fruit that grows out of season, later called Tachibana.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the Emperor died, Tajima Mori returned from the Eternal Land with eight
    sticks and eight bundles of the fragrant fruit and lamented.
  category: sequence
  evidence_refs:
  - ev:10
