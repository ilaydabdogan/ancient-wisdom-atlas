canonical_text:
  quote: ''
  summary: Kamu-nashi-hime meets the Emperor's messengers with branch-borne objects
    and a white flag, asks that arms not be used against her people, and identifies
    four fortified brigands who will not obey the Imperial command. Take-moro-gi and
    others lure and kill the four men. The Emperor travels through named regions,
    establishes temporary palaces, receives Haya-tsu-hime's report about Tsuchi-gumo
    in a cave and at Negino, prepares camellia mallet-weapons, defeats the Tsuchi-gumo,
    performs divination and a stone omen with named gods, and reaches Hiuga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kamu-nashi-hime is described as chieftain of the whole country with numerous
    followers; when the Emperor's messengers arrive, she displays branches bearing
    a sword, mirror, and jewel, hoists a white flag on her ship, and comes to meet
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamu-nashi-hime says her people are not rebellious, but names four brigands
    in strong places who plunder, gather followers, appoint relations as local chiefs,
    and refuse the Imperial command.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Take-moro-gi and the others entice Asa-hagi's followers with red trousers
    and other objects, use them to beckon the four unsubmissive men, then seize and
    kill them and their followers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor continues to Tsukushi and Buzen, erects a travelling palace at
    Nagawo, and the passage explains place names including Miyako and Ohokida.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Haya-tsu-hime, a local chieftain, meets the Emperor and reports two Tsuchi-gumo
    in the Rat's Cave and three more at Negino; she says they are powerful, have many
    followers, and will resist if summoned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Emperor halts, consults his Ministers, orders action against the Tsuchi-gumo,
    has camellia trees made into mallet-weapons, and his soldiers attack the cave
    group; the whole band is killed and place names are explained from the mallets
    and blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the campaign against Uchi-zaru, enemy arrows fall like rain; the Emperor
    retreats, performs divination on a river-bank, arrays his troops, defeats Yata,
    refuses Uchi-zaru's submission, and the defeated group dies by leaping into a
    ravine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before attacking, the Emperor prays over a large stone that, if success is
    destined, it will rise when kicked; after he kicks it, it rises like a Kashiha
    leaf to the Great Void, and three gods to whom he prayed are named.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Emperor arrives in Hiuga and erects another travelling palace, called
    the palace of Takaya.
  category: action
  evidence_refs:
  - ev:9
