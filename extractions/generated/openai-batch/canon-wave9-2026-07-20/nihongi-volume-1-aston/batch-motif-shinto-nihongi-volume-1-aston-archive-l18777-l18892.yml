canonical_text:
  quote: ''
  summary: The passage introduces Emperor Anaho’s parentage, narrates a succession
    crisis after the preceding emperor’s death, describes the Heir Apparent’s loss
    of public and ministerial support, refuge in Ohomahe no Sukune’s house, poetic
    exchange, and death by his own hand with a variant banishment account. It then
    records Anaho’s accession, the honoring of the Empress as Grand Empress, relocation
    of the capital, and the refusal of Imperial Princesses to accept a betrothal involving
    Imperial Prince Ohohatsuse because of his violent reputation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anaho is identified as a child of Emperor Wo-asa-tsuma waku-go no Sukune;
    a variant account calls him the third child. His mother is Osaka no Oho-nakatsu-hime
    no Mikoto, daughter of Imperial Prince Wakanuke-futa-mata.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the emperor’s death and funeral, the Heir Apparent is said to have committed
    a barbarous outrage by debauching a woman; the nation censures him, the Ministers
    refuse to follow him, and they give allegiance to Imperial Prince Anaho.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Heir Apparent prepares an army to attack Anaho, while Anaho also raises
    a force and prepares for battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the terms “Anaho arrow-notch” and “Karu arrow-notch” began
    at this time; a note reports a Kojiki variant about the arrow term and materials.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Knowing that Ministers and people do not support him, the Heir Apparent hides
    in the house of Mononobe, Ohomahe no Sukune; Anaho hears this and surrounds the
    house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Anaho sings at Ohomahe’s gate, using imagery of a metal gate’s shelter and
    waiting until rain stops.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ohomahe no Sukune answers with a song about a courtier’s garter-bell falling
    off and courtiers making a noise; a note interprets it as a remonstrance against
    making a great fuss over Prince Karu’s escape.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ohomahe asks Anaho not to harm the Heir Apparent and says he will advise him;
    the Heir Apparent then dies by his own hand in Ohomahe’s house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A variant account says the Heir Apparent was banished to the Land of Iyo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the 14th day of the 12th month, Anaho assumes the Imperial Dignity, the
    Empress is honored as Grand Empress, and the capital is moved to Isonokami, called
    the Palace of Anaho.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Imperial Prince Ohohatsuse seeks a betrothal involving the daughters of Emperor
    Midzuhawake; the passage says their names are not found in the records.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Imperial Princesses refuse, saying Ohohatsuse is violent and quick to
    anger, and describing themselves as lacking beauty and cleverness.
  category: speech
  evidence_refs:
  - ev:8
