canonical_text:
  quote: ''
  summary: A divine message and repeated dreams instruct Emperor Sujin to appoint
    Oho-tata-neko and Naga-ochi as masters of worship for particular deities. Oho-tata-neko
    identifies himself as child of Oho-mono-nushi. Through divination, ritual appointments,
    offerings, shrine organization, sacred sake, and further dream-directed rites
    involving red and black shields and spears, pestilence ceases and the country
    attains peace and abundance. The emperor then proclaims that rites to the gods
    have exhausted calamity and dispatches ministers to the regions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine will states that if Oho-tata-neko, described as the deity's child,
    worships the deity, there will be immediate peace and lands beyond the sea will
    submit of their own accord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three named people report the same dream, in which a noble-looking man instructs
    that Oho-tata-neko and Ichi-shi no Naga-ochi be appointed as masters of worship
    for two named deities so that the Empire will have profound peace.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor seeks Oho-tata-neko by proclamation, finds him in Suye, assembles
    princes, ministers, and the eighty Be, and asks him whose child he is.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oho-tata-neko identifies Oho-mono-nushi no Oho-kami as his father and Ikudama-yori-bime
    as his mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Emperor uses divination to determine that sending Ika-shiko-wo to distribute
    offerings is lucky and that worshipping other gods at that moment is unlucky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Emperor appoints Oho-tata-neko master of the worship of Oho-mono-nushi
    and Nagaochi master of the worship of Yamato no Oho-kuni-dama.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After later divination, the Emperor worships many other deities, distinguishes
    Heavenly and Earthly shrines, and allots land and houses for divine service.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After these rites, the pestilence ceases, the country has peace, the five
    kinds of grain are produced, and the peasantry has abundance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ikuhi is appointed Brewer to the Great Deity and later presents sacred sake
    to the Emperor, singing that the sake was brewed by Oho-mono-nushi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A feast takes place in the shrine of the god, with songs about the Hall of
    Miwa and its door; afterward the shrine door is opened and the Emperor departs.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The passage states that Oho-tata-neko became the first ancestor of the Kimi
    of Miwa.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a later dream, a divine person instructs the Emperor to worship the God
    of Sumi-zaka with eight red shields and eight red spears and the God of Oho-zaka
    with eight black shields and eight black spears.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Emperor follows the dream instruction and worships the Gods of Sumi-zaka
    and Oho-zaka.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Emperor proclaims that after due rites to the Gods of Heaven and Earth,
    calamity has become spent, and he orders ministers to be dispatched to the four
    quarters to make his will known.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
