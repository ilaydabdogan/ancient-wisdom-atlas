canonical_text:
  quote: ''
  summary: The passage records a command for an unnamed subject to go with the Prince
    Imperial and worship the Great God of Kebi in Tsunoga. The Prince Imperial returns
    from Tsunoga, and the Grand Empress gives him a banquet in the Great Hall, raises
    her cup, wishes him long life, and sings that the liquor has been sent as an offering
    by the august God Sukuna from the Eternal land. A fragment then says an unnamed
    woman wailed, died, was made the Goddess-mother of a mountain, and has a shrine
    there. The remaining notes discuss Korean name identifications, doubts about the
    text, interlinear kana names, Silla/Corean language issues, and possible meanings
    of “Kushi no Kami.”
