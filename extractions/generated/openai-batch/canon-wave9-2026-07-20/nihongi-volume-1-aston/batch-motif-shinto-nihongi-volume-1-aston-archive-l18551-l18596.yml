canonical_text:
  quote: ''
  summary: A divine speaker says that beasts were not caught by his intent and requires
    a pearl from the bottom of the sea of Akashi as an offering. Fishermen search
    for it; Wosashi dives to the bottom, retrieves a great sea-ear containing a peach-sized
    pearl, and dies after surfacing. The pearl is offered to the God of the Island,
    after which many beasts are caught, and Wosashi is buried in a tomb. The next
    dated notice names Imperial Prince Kinashi Karu heir to the throne and describes
    his beauty, his sister's beauty, and his desire to be united with her.
  language: English
  quote_policy: summarized
