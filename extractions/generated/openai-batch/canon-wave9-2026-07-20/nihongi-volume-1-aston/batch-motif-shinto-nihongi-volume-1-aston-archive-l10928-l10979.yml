canonical_text:
  quote: "“This Eternal Land / Is no other than the mysterious realm of Gods and Genii”"
  summary: A returning speaker, identified in the passage as Tajima Mori, recounts
    crossing waves and weak water to the Eternal Land, a realm of Gods and Genii inaccessible
    to ordinary mortals. He says ten years passed during the journey and return, and
    that he returned by trusting in the spirits of the Emperors. Finding the Emperor
    dead and unable to report his mission, he turns toward the Emperor’s misasagi,
    weeps, dies, and is mourned by the ministers. The passage then names Tajima Mori
    as first ancestor of the Miyake no Muraji.
  language: English
  quote_policy: quoted
