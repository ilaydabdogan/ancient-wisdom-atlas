canonical_text:
  quote: ''
  summary: The passage recounts variant accounts in which Toyo-tama-hime, seen in
    private after changing into a great sea-monster, names her newborn child and departs
    across the sea; the child is then nurtured by wet-nurses and later by her younger
    sister. A further account describes the younger brother with the mountain gift
    grieving by the shore, receiving guidance from Shiho-tsutsu no Oji and sea-monster
    coursers, entering the sea, reaching the Sea-God's palace by way of a shore, well,
    and cassia-tree, and being recognized by the Sea-God as the grandchild of the
    Heavenly Deity.
  language: English
  quote_policy: summarized
literal_observations:
