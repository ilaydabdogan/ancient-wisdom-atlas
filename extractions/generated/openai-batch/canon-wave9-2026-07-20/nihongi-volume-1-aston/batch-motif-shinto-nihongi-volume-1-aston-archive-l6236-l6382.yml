  evidence_refs:
  - ev:1
- id: obs:2
  text: After the child is born, the Heavenly Grandchild asks what the child should
    be called, and the mother gives the name Hiko-nagisa-take-u-gaya-fuki-ahezu no
    Mikoto.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After naming the child, Toyo-tama-hime departs straight across the sea, and
