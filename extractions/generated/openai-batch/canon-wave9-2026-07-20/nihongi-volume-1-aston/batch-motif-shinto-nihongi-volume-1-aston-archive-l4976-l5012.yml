canonical_text:
  quote: The Heavenly Deity sent Futsu-nushi no Kamiand Take-mika-tsuchi no Kami to
    tranquillize the Central Land of Reed-Plains.
  summary: A Heavenly Deity sends Futsu-nushi no Kami and Take-mika-tsuchi no Kami
    to pacify the Central Land of Reed-Plains. The two gods say that an Evil Deity
    in Heaven, Ama-tsu-mika-hoshi or Ame no Kagase-wo, should be executed before they
    descend to make the land clear. Iwahi-nushi no Kami receives the designation Iwahi
    no Ushi. The surrounding notes discuss Sarume ritual dancers, Uzume no Mikoto,
    the Sun-Goddess rock-cave episode, and Miko mediumship.
  language: English
