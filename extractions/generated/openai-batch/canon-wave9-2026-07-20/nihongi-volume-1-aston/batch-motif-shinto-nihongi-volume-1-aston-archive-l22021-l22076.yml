canonical_text:
  quote: ''
  summary: The passage recounts the Emperor's acceptance of rule as sanctioned by
    Heaven and ceded by the Prince Imperial, his formal assumption of Imperial Dignity
    at Yatsuri Palace, variant notices about palace locations, the appointment of
    Princess Wono as Empress with a general amnesty, and her lineage. It then reports
    the Emperor's lament over a late Prince who died on a desert moor, the Emperor's
    childhood concealment and later restoration, the search for the late Prince's
    bones, shared weeping with Prince Imperial Ohoke, and an old woman named Okime
    who says she knows the burial place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An accession speech says the undertaking comes by the will of Heaven, has
    been ceded by the Prince Imperial, and should be accepted in accordance with the
    command of the intended ruler's elder brother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor accepts the order, summons Ministers of State and functionaries
    to the Yatsuri Palace in Hither Asuka, assumes the Imperial Dignity, and the functionaries
    enter office.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Alternative book notices give other palace locations for Emperor Woke: Wono,
