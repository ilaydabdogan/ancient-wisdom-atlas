    for, and raised to continue the Great Work.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Emperor says he searched widely for the late Prince's honoured bones but
    could not find anyone who knew where they were.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Emperor's speech, the Emperor and Prince Imperial Ohoke burst into
