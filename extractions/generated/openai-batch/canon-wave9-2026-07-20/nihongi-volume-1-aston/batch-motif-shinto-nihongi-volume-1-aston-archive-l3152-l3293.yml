  confidence: high
  cautions: The taxonomy reference captures the return aspect; the specific cave setting
    is recorded separately as a symbol.
- id: motif:2
  label: Withdrawal of a deity brings universal darkness
  taxonomy_refs:
  - departure
  - duality
  basis: In the variant, Ama-terasu enters the Rock-cave and shuts the Rock-door,
    after which all under Heaven is dark and day and night are indistinguishable.
  evidence_refs:
