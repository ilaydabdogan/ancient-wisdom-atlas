canonical_text:
  quote: "“standing before the door of the Rock-cave of Heaven, skilfully performed
    a mimic dance”"
  summary: The passage recounts ritual actions before the Rock-cave of Heaven, Ama-terasu
    peeping out and being led from the cave, the setting of a rope boundary, the punishment
    and banishment of Sosa no wo, and a variant in which Sosa no wo’s offense in a
    sacred weaving-hall leads Ama-terasu to shut herself in the cave, causing universal
    darkness until the gods deliberate and commission a divine image.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage names a mirror, Ma-futsu no Kagami, and translator notes discuss
    a large mirror associated with Ise worship as an emblem of the Sun-Goddess.
  category: object
  evidence_refs:
  - ev:12
- id: obs:2
  text: Blue soft offerings and white soft offerings are hung on lower branches, and
    the gods recite liturgy together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ama no Uzume holds a spear wreathed with Eulalia grass, stands before the
    door of the Rock-cave of Heaven, and performs a mimic dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ama no Uzume uses a Sakaki tree from the Heavenly Mount Kagu as a head-dress,
    makes braces from club-moss, kindles fires, places a tub upside down, and utters
    inspired speech.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ama-terasu hears the merriment, questions how Uzume can be joyful, opens the
    Rock-door slightly, and peeps out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ta-jikara-wo takes Ama-terasu by the hand and leads her out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nakatomi no Kami and Imibe no Kami draw a limit with a bottom-tied rope and
    ask Ama-terasu not to return into the cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The gods blame Sosa no wo, fine him, chastise him, pluck out his hair as expiation,
    and then banish him downward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A variant says Sosa no wo expiates by having the nails of his hands and feet
    plucked out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In another version, Sosa no wo flays a piebald colt backward and throws it
    into the sacred weaving-hall where Waka-hiru-me is weaving garments of the deities.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Waka-hiru-me is startled, falls from the loom, wounds herself with the shuttle
    in her hand, and divinely departs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ama-terasu accuses Sosa no wo of evil intentions, says she does not wish to
    see him face to face, enters the Rock-cave of Heaven, and shuts the Rock-door.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After Ama-terasu shuts the Rock-door, all under Heaven is in continual darkness,
    with no distinction between day and night.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The eighty myriads of gods meet in the High-market-place of Heaven and inquire
    into the matter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Omohi-kane, described as talented at devising plans, proposes that an image
    of the goddess be made and prayed to.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Ishi-kori-dome is appointed artisan, takes copper from the Mt. Kagu of Heaven
