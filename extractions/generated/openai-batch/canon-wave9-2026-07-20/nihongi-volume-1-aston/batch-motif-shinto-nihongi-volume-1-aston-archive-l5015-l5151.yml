  category: attribute
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:12
  text: Taka-mi-musubi commands the setting up of a Heavenly divine fence and Heavenly
    rock-boundary for religious abstinence on behalf of descendants.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ame no Koyane and Futo-dama are commanded to take the divine fence to the
