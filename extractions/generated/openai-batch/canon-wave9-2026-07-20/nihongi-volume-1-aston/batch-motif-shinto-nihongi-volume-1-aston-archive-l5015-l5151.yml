canonical_text:
  quote: ''
  summary: Futsu-nushi and another deity confront Oho-na-mochi in Idzumo about yielding
    the country to the Heavenly Deity. After an initial refusal, Taka-mi-musubi offers
    Oho-na-mochi divine authority, a palace, ritual provisions, and festival honors
    if public governance is transferred to the August Grandchild. Oho-na-mochi accepts,
    delegates his place to Kunado, gives him jewels, and becomes concealed. Futsu-nushi
    then pacifies the land, rewarding obedient deities and killing rebels. Oho-mono-nushi
    and Koto-shiro-nushi declare loyalty in Heaven. Taka-mi-musubi gives Mi-ho-tsu
    hime to Oho-mono-nushi as wife and assigns divine guards and ritual craftspeople.
    Taka-mi-musubi also commands the establishment of a divine fence and rock-boundary
    for abstinence on behalf of descendants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two deities descend to Itasa in Idzumo and ask Oho-na-mochi whether he will
    deliver up the country to the Heavenly Deity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oho-na-mochi initially refuses, saying he suspected the two gods were coming
    to his place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Taka-mi-musubi sends the two gods back and offers terms: the August Grandchild
    will conduct public matters, while Oho-na-mochi will rule divine affairs.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The offered provisions include a palace at Ama no Hi-sumi, a thousand-fathom
    paper-mulberry rope tied in 180 knots, strong pillars and thick planks, cultivated
    rice-fields, sea-pleasure conveyances, bridges, white shields, and festival service
    by Ame no Ho-hi.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oho-na-mochi accepts the command, says the August Grandchild may direct public
    affairs, and says he will retire to direct secret matters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Oho-na-mochi presents Kunado as his replacement, gives him pure Yasaka jewels,
    and then becomes concealed for ever.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Futsu-nushi appoints Kunado as guide and undertakes a circuit of pacification,
    killing rebels and rewarding those who obey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Oho-mono-nushi and Koto-shiro-nushi are named as leading deities who obey;
    they assemble many gods in Heaven and declare loyal behaviour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Taka-mi-musubi warns Oho-mono-nushi against marrying an Earth deity, gives
    him Mi-ho-tsu hime as wife, and sends him down with many deities as guards for
    the August Grandchild.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Several deities are appointed to ritual craft functions, including hatter,
    shield-maker, metal-worker, tree-fibre maker, and jewel-maker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note identifies Ma-hitotsu no Kami as the one-eyed god and compares the
