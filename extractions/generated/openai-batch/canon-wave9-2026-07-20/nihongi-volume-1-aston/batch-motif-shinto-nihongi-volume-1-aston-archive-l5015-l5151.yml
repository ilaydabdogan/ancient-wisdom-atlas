candidate_motifs:
- id: motif:1
  label: transfer of earthly rule to a heavenly descendant
  taxonomy_refs:
  - royal_legitimacy
  - divine_parent_child
  basis: The passage says public matters formerly under Oho-na-mochi will be conducted
    by Taka-mi-musubi’s grandchild, with obedient deities assigned as guards for that
    descendant.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage frames the transfer as divine command and negotiated acceptance;
    broader dynastic implications should be reviewed against surrounding text.
- id: motif:2
  label: ritual compensation for surrender of public authority
  taxonomy_refs:
  - sacred_exchange
  basis: Oho-na-mochi is offered continued rule of divine affairs, a palace, rice-fields,
    bridges, boat, shields, and festival honors in exchange for yielding public matters.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The interpretation as exchange is based on the sequence of command, terms,
    and acceptance in the passage.
- id: motif:3
  label: retreat and concealment of former deity
  taxonomy_refs:
  - departure
  basis: Oho-na-mochi states he will withdraw, delegates his place to Kunado, and
    becomes concealed for ever.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The footnote glosses concealment as death, but the passage’s narrative
    wording is concealment and withdrawal.
- id: motif:4
  label: pacification by divine envoy with reward and punishment
  taxonomy_refs:
  - divine_judgment
  basis: Futsu-nushi conducts a circuit of pacification, kills those rebellious to
    his authority, and rewards those who obey.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes punitive and rewarding action but not a formal judgment
    scene.
- id: motif:5
  label: heavenly marriage alliance securing loyalty
  taxonomy_refs:
  - sacred_marriage
  basis: Taka-mi-musubi gives his daughter Mi-ho-tsu hime to Oho-mono-nushi after
    warning that marriage to an Earth deity would indicate disaffection.
