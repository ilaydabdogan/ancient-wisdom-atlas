  summary: The passage recounts Prince Imperial Ohoke preventing the Emperor from
    destroying the misasagi of Emperor Oho-hatsuse; Okime’s request to return home
    in old age and the Emperor’s farewell gift and song; a notice of peace and prosperity;
    two divine oracles, from the Moon-God and the Sun-Goddess, requesting dedications
    to their ancestor Taka-mimusubi; related shrine appointments; establishment of
    the Saki-kusa Be; and the Emperor’s death.
