canonical_text:
  quote: ''
  summary: The passage recounts how Hiko-hoho-demi no Mikoto uses tide-flowing and
    tide-ebbing jewels, following the Sea-God's instruction, to compel his elder brother
    to submit after a dispute over a fish-hook. The elder brother first promises service,
    retracts, flees up a mountain and tree as the tide rises, then acknowledges fault
    and pledges that his descendants will serve for eighty generations. The passage
    connects this to Hayato service at the Imperial Palace and includes a variant
    account in which the brothers exchange sea and mountain gifts, fail in each other's
    domains, and quarrel over the lost fish-hook.
  language: English
  quote_policy: summarized
