canonical_text:
  quote: ''
  summary: The passage introduces Okinaga-tarashi-hime no Mikoto as Empress and describes
    her response to the death of Emperor Naka-tsu-hiko, which she associates with
    his failure to obey divine instructions. She orders purification and constructs
    a worship palace, then acts as priest while ritual assistants play a lute and
    examine divine utterances. After seven days and nights, deities answer and identify
    themselves, including an Ise deity, Kotoshiro-nushi, and water-associated deities.
    The gods are worshipped according to their words, Kamo no Wake is sent against
    the Kumaso, who submit, and a winged plunderer named Hashiro Kuma-washi is introduced.
    When the Empress sets out against him, a whirlwind blows off her hat, giving rise
    to the place-name Mikasa.
  language: English
  quote_policy: summarized
