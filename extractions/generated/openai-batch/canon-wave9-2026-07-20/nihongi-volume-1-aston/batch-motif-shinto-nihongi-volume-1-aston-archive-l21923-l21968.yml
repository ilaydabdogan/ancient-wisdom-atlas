canonical_text:
  quote: ''
  summary: At a twelfth-month assembly, Prince Imperial Ohoke performs obeisance with
    the Imperial Seal and offers the Empire to his younger brother. The Emperor/Woke
    refuses on grounds of junior status and prior imperial intention favoring the
    elder brother, using metaphors of superior radiance and sufficient rain and stating
    norms of elder-brother affection and younger-brother reverence. Ohoke replies
    by citing Shiraga's earlier assignment of imperial affairs to him while praising
    the younger brother's retiring conduct. Translator notes identify Chinese literary
    borrowings and a possible Yih-king allusion.
  language: English
  quote_policy: summarized
