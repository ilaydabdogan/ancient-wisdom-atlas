canonical_text:
  quote: ''
  summary: The passage recounts worship at the upper waters of the River Nifu and
    the beginning of the custom of sacred jars. The Emperor appoints Michi no Omi
    no Mikoto as ruler of a public festival to Taka-mi-musubi no Mikoto, gives him
    the title Idzu-hime, and assigns sacred names to jars, fire, water, food, firewood,
    and grass. After tasting or offering the food of the Idzube, the Emperor marches,
    defeats bandits at Mount Kunimi, and later secretly orders Michi no Omi and the
    Oho-kume to lure remaining enemies into a great muro at Osaka with a banquet.
    When the enemies become intoxicated, a song signals the troops to kill them. The
    passage explains the origin of a Kume singing and laughing practice and ends with
    the Emperor warning against arrogance after victory.
  language: English
  quote_policy: summarized
