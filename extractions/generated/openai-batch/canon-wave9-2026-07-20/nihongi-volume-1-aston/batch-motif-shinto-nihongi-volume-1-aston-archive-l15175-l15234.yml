canonical_text:
  quote: ''
  summary: The passage includes a cited succession episode in which Sy6l-lyé kills
    his elder brother and becomes king, while Tyonchi is protected by Wa soldiers
    and later established as king after Sy6l-lyé is killed. It then reports a Silla
    frontier expedition led by Kidzu no Sukune and his colleague. In a later imperial
    entry, the Emperor visits the Palace of Yoshino, where the Kuzu present newly
    brewed sake, sing a song about making and brewing it in a cross-mortar, address
    the Emperor as father, and perform mouth-drumming and upward-looking laughter.
    The narrator says a similar present custom may preserve an ancient relic and describes
    Kuzu character and foodways.
  language: English
  quote_policy: summarized
