  quote: ''
  summary: The passage describes a speaking and clamorous natural landscape, failed
    and injured pheasant messengers, the heavenly descent of the Heavenly Grandchild,
    land offered to him by Nagasa, his union with the mountain deity’s daughter Toyo-ata-tsu/Kono-hana,
    the birth and proof of his children, variant genealogies, and the opposing sea
    and mountain gifts of two brothers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rocks, tree-stems, and herbage are said to have the power of speech; at night
    they make a fire-like clamour and by day swarm like flies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taka-mi-musubi no Mikoto says that Ame-waka-hiko was earlier sent to the Central
    Land of Reed-Plains but has not returned, and sends the cock-pheasant Na-naki
    to investigate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cock-pheasant descends, sees fields of millet and pulse, remains there,
    and does not return; the passage connects this with a modern saying about a pheasant
    special messenger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hen-pheasant Na-naki is later sent, is struck by an arrow shot by Ame-waka-hiko,
    returns upward, and makes a report.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Taka-mi-musubi takes the coverlet from the true couch, clothes the Heavenly
    Grandchild with it, and sends him downward through the eight-piled clouds of Heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Heavenly Grandchild arrives at the Peak of Sohori-yama of Takachiho, proceeds
    to Cape Kasasa, ascends Takashima, and inspects the land.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Koto-katsu-kuni-katsu Nagasa says the land is where he dwells and offers it
    to the Heavenly Grandchild.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Nagasa identifies maidens in an eight-fathom palace on the crest of the waves,
    tending a loom with jingling wrist jewels, as daughters of Oho-yama-tsu-mi no
    Kami: Iha-naga-hime and Kono-hana saku-ya-hime/Toyo-ata-tsu hime.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Heavenly Grandchild favours Toyo-ata-tsu hime; after one night she becomes
    pregnant, he doubts her, she gives birth to Ho-no-suseri and Ho-no-ori/Hiko-hoho-demi,
    and the mother’s vow proves their paternity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Toyo-ata-tsu hime becomes angry and will not speak to the Heavenly Grandchild;
    he grieves and composes a song using seaweed, shore, couch, and beach-birds imagery.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Several variant writings give alternate divine genealogies, consorts, and
    offspring, including a note that one child is ancestor of the Ohari no Muraji.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The elder brother Ho-no-susori has a sea-gift, the younger brother Hiko-hoho-demi
    has a mountain-gift, and the brothers exchange gifts without gaining benefit.
  category: sequence
  evidence_refs:
  - ev:11
