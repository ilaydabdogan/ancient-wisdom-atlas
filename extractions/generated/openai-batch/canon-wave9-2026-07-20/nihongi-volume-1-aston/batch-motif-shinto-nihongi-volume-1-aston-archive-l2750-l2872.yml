canonical_text:
  quote: ''
  summary: Ama-terasu no Oho-kami and Sosa no wo no Mikoto dispute and test intentions
    through oaths involving swords, jewels, wells, and the production or assignment
    of divine children. Variant accounts describe Ama-terasu arming herself against
    Sosa, Sosa explaining that he only wishes to see his elder sister or present jewels,
    the production of female and male deities from swords and jewels, and the sending
    of female deities to Tsukushi to assist the descendants of Heaven and receive
    worship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ama-terasu says the five male deities came from the seed of her august necklace
    of 500 Yasaka jewels, calls them her children, and brings them up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ama-terasu says the ten-span sword belonged to Sosa no wo no Mikoto and identifies
    the three female deities as his children, delivering them to him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The deities described in the opening paragraph are said to be worshipped by
    the Munagata no Kimi of Tsukushi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In one variant, the Sun-Goddess suspects that Sosa no wo no Mikoto intends
    to rob her of the Plain of Heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In that variant, the Sun-Goddess arms herself with swords, a quiver, an elbow-pad,
    a bow, and arrows before meeting Sosa no wo no Mikoto.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sosa no wo no Mikoto states that he has no evil intentions and has come only
    briefly to see his elder sister face to face.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun-Goddess swears an oath that if Sosa no wo no Mikoto's heart is pure
    and he has no intent of robbery, the children born to him will be male.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sun-Goddess eats a ten-span sword, a nine-span sword, and an eight-span
    sword, producing three female deities named Oki-tsu-shima-bime, Tagi-tsu-hime,
    and Tagori-hime.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sosa no wo no Mikoto rinses the five-hundred string of jewels in a heavenly
    well, eats them, and produces five male deities.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the production of the five male deities, the Sun-Goddess learns that
    Sosa no wo no Mikoto's intentions are free from guilt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The three female deities produced by the Sun-Goddess are sent down to Tsukushi
    to dwell in the province, assist the descendants of Heaven, and receive worship
    from them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In another variant, Ha-akaru-tama meets Sosa no wo no Mikoto before his ascent
    to Heaven and presents him with beautiful curved Yasaka jewels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the second variant, Sosa no wo no Mikoto proposes that he and Ama-terasu
    bind themselves by an oath in which female children would indicate a black heart
    and male children a red heart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the second variant, Ama-terasu and Sosa no wo no Mikoto dig three true-wells
    of Heaven, stand opposite one another, covenant, and exchange a sword and curved
    jewels.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ama-terasu makes the jewels float on the true-well of Heaven, bites off the
    heads of the jewels, blows them away, and a deity named Ichiki-shima-hime no Mikoto
    is produced from her breath.
  category: action
  evidence_refs:
  - ev:8
