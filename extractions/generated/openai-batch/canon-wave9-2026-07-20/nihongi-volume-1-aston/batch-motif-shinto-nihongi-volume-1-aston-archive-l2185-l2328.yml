canonical_text:
  quote: ''
  summary: The passage names objects and deities associated with the boundary of Yomi,
    including a rock blocking the Even Pass of Yomi. Izanagi returns from a filthy
    underworld place, purifies himself in water, and numerous deities are produced
    from his washing. Washing his left eye, right eye, and nose produces Ama-terasu,
    Tsuki-yomi, and Sosa no wo, to whom he assigns domains. Sosa no wo refuses to
    rule, longs to follow his mother to the Nether Land, and is driven away. Translator
    notes compare Izanagi’s ablutions and the Yomi boundary with broader lustration
    and underworld-entry patterns.
  language: English
  quote_policy: summarized
