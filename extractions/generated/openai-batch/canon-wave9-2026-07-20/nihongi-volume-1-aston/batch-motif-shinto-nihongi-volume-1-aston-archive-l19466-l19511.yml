canonical_text:
  quote: "“a rainbow appeared, like unto a serpent”"
  summary: In the 3rd year of Yuriaku, Kunimi slanders the Imperial Princess Taku-hata
    and Takehiko by alleging illicit intercourse. Takehiko’s father Kikoyu kills Takehiko
    at the River Ihoki. The Emperor questions the Princess; she denies knowledge,
    then buries a divine mirror at Isuzu no Kahakami and hangs herself. Searchers
    later find a serpent-like rainbow at the spot, dig up the mirror, and discover
    her body nearby. An examination finds water and a stone in her belly, enabling
    Kikoyu to establish Takehiko’s innocence. Kikoyu then kills Kunimi and hides in
    the Shrine of Isonokami. In the following year, while the Emperor hunts on Mount
    Katsuraki, a tall man appears over the vermilion valley.
  language: English
  quote_policy: quoted
