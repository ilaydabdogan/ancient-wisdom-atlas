canonical_text:
  quote: "“In my country there is great store of these rare treasures.”"
  summary: Shima no Sukune sends Nihaya and Kwa-ko to Pékché to make friendly inquiries.
    King Syo-ko' receives them, gives gifts, shows his treasure-house, and says he
    wishes to send tribute. Later Pékché and Silla tribute envoys come to court. The
    Grand Empress and Prince Imperial rejoice and mourn that the late Emperor cannot
    meet them. The Silla tribute is judged abundant and rare, while the Pékché tribute
    is inferior; the Pékché envoys say they lost their way and reached Sabi.
  language: English
  quote_policy: quoted
