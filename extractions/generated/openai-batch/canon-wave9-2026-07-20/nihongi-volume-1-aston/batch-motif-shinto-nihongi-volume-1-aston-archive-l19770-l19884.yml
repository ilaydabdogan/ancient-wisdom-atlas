canonical_text:
  quote: ''
  summary: The passage recounts the island birth of Lord Shima, later King Munyéng,
    and a related Pékché source note; the Emperor’s excursion to Hatsuse and naming
    of a moor; a comic episode in which Sukaru collects babies instead of silkworms
    and is made to raise them; tribute from Wu; and Sukaru’s capture of the Deity
    of Mimuro Hill in the form of a great serpent whose thunder and flaming eyes frighten
    the ritually unprepared Emperor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant consort gives birth to a child on the island of Kahara in Tsukushi;
    the child is named Lord Shima, sent by ship to his country by Lord Kun, and later
    becomes King Munyéng.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note from the Pékché Shinsen says King Kéro sent his younger brother Lord
    Konchi to Great Wa to wait upon the Emperor and confirm former friendship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor visits the small moor of Hatsuse, praises the hills and moors
    in song, and names the moor Michi no Ono.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor orders the Empress and his concubines to plant mulberry trees
    with their own hands to encourage the silk industry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sukaru is ordered to collect silkworms, mistakenly collects babies, presents
    them to the Emperor, and is told to raise them himself.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Land of Wu sends envoys with tribute.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Emperor commands Sukaru to seize and bring the form of the Deity of Mimuro
    Hill, with variant identifications supplied for the deity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sukaru ascends Mimuro Hill and catches a great serpent, which he shows to
    the Emperor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The serpent’s thunder rolls and its eyeballs flame; the Emperor, not having
