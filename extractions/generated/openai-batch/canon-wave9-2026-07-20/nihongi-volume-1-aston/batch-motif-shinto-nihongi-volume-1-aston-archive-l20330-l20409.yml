canonical_text:
  quote: ''
  summary: 'The passage first describes imperial arrangements for the funeral and
    burial of Ki no Woyumi no Sukune, including construction of a tumulus and burial
    by a Hanishi official. It then recounts gifts, a petition involving an eight-hand
    mirror, and the imperial permission by which Wokahi no Sukune remains in the Land
    of Tsuno, explaining the beginning of the Tsuno no Omi there. A new report from
    Kahachi province begins: Hiaktison visits his son-in-law after his daughter gives
    birth, returns home by moonlight past the Homuda imperial tomb at Ichihiko hill,
    and encounters a horseman on a red courser; the excerpt breaks off mid-incident.'
  language: English
  quote_policy: summarized
