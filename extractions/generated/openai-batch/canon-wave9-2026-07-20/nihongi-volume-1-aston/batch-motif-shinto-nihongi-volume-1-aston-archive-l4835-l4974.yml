    of Reed-Plains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ama no Oshiho-mimi stands on the floating bridge of Heaven, looks down, judges
    the country not yet tranquillized and hideous, ascends again, and reports why
    he did not descend.
  category: sequence
  evidence_refs:
