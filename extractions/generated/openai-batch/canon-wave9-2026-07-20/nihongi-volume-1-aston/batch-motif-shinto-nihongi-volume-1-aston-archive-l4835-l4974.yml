canonical_text:
  quote: ''
  summary: Ama-terasu arranges a heavenly descent to the Central Land of Reed-Plains.
    After an initial attempt is withdrawn because the land is not yet pacified, two
    gods secure the land’s delivery from Oho-na-mochi through his son Koto-shiro-nushi.
    Ama-terasu then sends the August Grandchild Ninigi with sacred treasures and attendant
    deities, commissions him to govern, and the party encounters Saruta-hiko at the
    heavenly crossroads. Ame no Uzume questions Saruta-hiko, who becomes the harbinger;
    Ninigi descends to Takachiho, and Uzume receives the Sarume title.
  language: English
  quote_policy: summarized
literal_observations:
