canonical_text:
  quote: ''
  summary: The passage records the burial of Oho-tarashi-hiko, the honoring of the
    Empress as Grand Empress, the appointment of Takechi no Sukune as Prime Minister
    because of his same-day birth with the Emperor, and an imperial command establishing
    provincial and village offices. The command praises the predecessor emperor as
    divinely valorous and order-restoring, states the current emperor's succession,
    and orders local officials as a defense for the Inner Country. Footnotes explain
    the five-elements scheme and the meaning of Inaki.
  language: English
  quote_policy: summarized
