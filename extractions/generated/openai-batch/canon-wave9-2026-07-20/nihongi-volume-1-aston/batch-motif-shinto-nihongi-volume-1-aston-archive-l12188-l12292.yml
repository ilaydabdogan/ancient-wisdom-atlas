canonical_text:
  quote: "“taking the shape of a white bird, came forth from the misasagi”"
  summary: Yamato-dake no Mikoto gives a final speech, dies on Nobo Moor, and is mourned
    by the Emperor, who orders his burial. Yamato-dake then appears in the form of
    a white bird, leaves the tomb, moves through several places where additional tombs
    are erected, and finally soars to Heaven; only his clothing and cap are buried.
    The passage then records later court vigilance and appointments, and notes the
    Kusanagi sword at Atsuta shrine and the removal of disruptive Yemishi from the
    shrine precinct.
  language: English
  quote_policy: quoted
