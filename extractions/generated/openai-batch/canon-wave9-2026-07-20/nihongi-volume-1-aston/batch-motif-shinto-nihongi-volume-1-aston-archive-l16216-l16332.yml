  summary: The passage records the completion and naming of an embankment connected
    with Koromo no ko’s survival, foreign tribute and labor from Silla, tribute of
    iron shields and targets from Koryo, a court archery test in which Tatebito no
    Sukune alone pierces the targets and receives a title, several canals, granaries,
    ponds, embankments, roads, and bridges that produce agricultural abundance, and
    a palace episode in which the Emperor gives Kuhada no Kugahime to Hayamachi after
    exchanged songs, though she refuses him when he visits her house.
  language: English
