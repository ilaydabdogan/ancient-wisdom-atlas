canonical_text:
  quote: ''
  summary: The Emperor visits the Palace of Chinu; Sotohori Iratsume sings of wishing
    to meet her lord often, and the Emperor warns that the Empress must not hear the
    song. Earlier, the Emperor sought to preserve Sotohori’s name, and provincial
    Miyakko were charged to establish Fujihara Be for her. Later, during a hunt on
    Ahaji island, abundant animals appear but none are caught; the hunt is stopped,
    divination is performed, and the Island God gives an oracle.
  language: English
  quote_policy: summarized
