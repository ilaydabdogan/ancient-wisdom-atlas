canonical_text:
  quote: ''
  summary: The passage records Yamato-bukuro no Sukune receiving restoration of his
    original title because of his sister Okime’s services; imperial music, banquet,
    and park revels with officials; acclamations for the Emperor; and an address in
    which the Emperor tells Prince Imperial Ohoke of their father’s unjust killing
    by Emperor Oho-hatsuse, laments the cast-away bones, and declares a desire to
    avenge or wash away the disgrace, citing maxims of vengeance against a father’s,
    brother’s, or comrade’s enemy.
  language: English
  quote_policy: summarized
