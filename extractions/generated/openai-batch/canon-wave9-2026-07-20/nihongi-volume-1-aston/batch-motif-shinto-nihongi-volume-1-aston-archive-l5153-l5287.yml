canonical_text:
  quote: ''
  summary: Translator notes explain himorogi as a sacred group of sticks or possible
    carved posts, discuss enclosed Shinto worship space, and describe Greater Divination
    by fire-cracked bone. The narrative then recounts Ama-terasu giving a sacred mirror,
    rice-ears, attendants, and regalia-associated objects to her child and grandchild;
    the heavenly birth of Ninigi; Ninigi’s descent to Takachiho; his recognition by
    a local lord; and his marriage to the younger daughter of Oho-yama-tsu-mi after
    rejecting her elder sister, whose curse links his descendants’ short life to flowers
    rather than enduring rocks.
  language: English
  quote_policy: summarized
