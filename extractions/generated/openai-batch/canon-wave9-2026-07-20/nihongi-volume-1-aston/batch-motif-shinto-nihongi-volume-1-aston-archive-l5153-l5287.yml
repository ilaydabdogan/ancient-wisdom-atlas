candidate_motifs:
- id: motif:1
  label: Transmission of sacred objects from a divine ancestor
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Ama-terasu gives the mirror, rice-ears, attendants, and personal objects
    associated by note with regalia to her child and grandchild before the descent.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage supports sacred transfer directly; royal-legitimacy framing
    depends partly on the note identifying regalia and should be reviewed in broader
    context.
- id: motif:2
  label: Divine parent-child commission and substitution of the grandchild
  taxonomy_refs:
  - divine_parent_child
  - departure
  basis: Ama-terasu addresses Ame no Oshi-ho-mimi as her child, arranges his consort,
    and then sends down the grandchild instead of the parents.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
