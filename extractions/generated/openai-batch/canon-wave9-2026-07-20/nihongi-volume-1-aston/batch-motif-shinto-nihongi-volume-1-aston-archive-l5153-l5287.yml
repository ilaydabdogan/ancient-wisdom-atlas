comparison_claims:
- id: claim:1
  claim: The translator cautiously compares the enclosed-ground meaning of a Shinto
    worship place with the original signification of Roman templum and Greek temenos.
  claim_level: same_function
  target: Roman templum and Greek temenos as delimited sacred spaces
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a note-based comparison of signification and function only;
    it does not establish historical contact or common origin.
- id: claim:2
  claim: The translator compares the Greater Divination by fire-cracked deer shoulder-blade
    with Chinese and Mongol practices, while noting Chinese tortoise-shell use and
    occasional Japanese tortoise-shell use.
  claim_level: same_function
  target: Chinese and Mongol pyromantic divination; Chinese and Japanese tortoise-shell
    divination
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports similarity of technique but does not demonstrate
    borrowing, chronology, or shared origin.
