canonical_text:
  quote: ''
  summary: The Emperor travels south, responds to the Kumaso rebellion, and orders
    the Empress to meet him at Anato. While travelling by ship, the Empress sprinkles
    sake on assembled tahi fish; the fish become drunk and float up, allowing fishermen
    to catch them. The passage states this explains a seasonal habit of local fish
    floating belly-up in the sixth month. The Empress later finds a Nyoi pearl in
    the sea. The Emperor establishes a palace in Anato, proceeds to Tsukushi, and
    Kuma-wani prepares a 500-branched Sakaki tree on hearing of his arrival. A note
    explains the Nyoi pearl as a Buddhist-associated object and calls the term anachronistic
    here.
  language: English
  quote_policy: summarized
