- id: obs:4
  text: On the 14th day of the 12th month, the Empress gave birth to Emperor Homuda
    in Tsukushi, and the birthplace was called Umi by people of that time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In one version, deities spoke by the mouths of Uchi-saru-taka, Kuni-saru-taka,
