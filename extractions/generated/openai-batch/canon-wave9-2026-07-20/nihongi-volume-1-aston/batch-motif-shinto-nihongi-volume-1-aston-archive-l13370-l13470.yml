canonical_text:
  quote: ''
  summary: The passage first reports Silla's submission, tribute obligation, and the
    institution of interior governments, followed by the Empress's return from Silla
    and the birth of Emperor Homuda in Tsukushi. An alternate version says deities
    spoke through named human mouthpieces and later through the Empress as she played
    a lute. The deities promised a treasure-land if the Emperor offered his ship and
    the Ohota water-field, but the Emperor questioned them. The deities named themselves,
    declared that the unbelieving Emperor would not possess the country, foretold
    that the child in the Empress's womb would possess it, and the Emperor died that
    night. The excerpt ends as the Empress begins worship.
  language: English
  quote_policy: summarized
