  text: The Emperor answered skeptically, questioned whether the gods were deceiving
    him, objected that he would have no ship if he offered it, and asked the gods
    to name themselves.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The gods gave several names, including Uha-tsutsu no wo, Naka-tsutsu no wo,
