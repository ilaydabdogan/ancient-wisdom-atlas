canonical_text:
  quote: ''
  summary: The passage reports that King Kero ascended the throne; the Emperor sent
    Aretoku to ask for a nyérang, and Peékche sent the daughter of the Lady Moni,
    named Nyérang Chékké, as tribute. It then describes the Emperor's progress to
    Yoshino and Mimase, where he orders a chase, hunts across peaks and jungles, nearly
    exhausts the birds and beasts, rests by springs and groves, counts the chariots
    and horses, and asks the Ministers whether they should cut up the fresh meat themselves.
  language: English
  quote_policy: summarized
