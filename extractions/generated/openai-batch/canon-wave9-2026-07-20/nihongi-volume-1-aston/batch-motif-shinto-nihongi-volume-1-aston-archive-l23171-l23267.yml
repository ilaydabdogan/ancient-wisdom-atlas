    lewd voices, excess sake, palace women, and luxury textiles.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Emperor died in the Palace of Namiki in the twelfth month of the eighth
    year.
  category: sequence
  evidence_refs:
  - ev:11
