  quote: ''
  summary: Chronicle entries for the reign describe repeated violent acts ordered
    by the Emperor, a decree establishing the Wohatsuse Toneri because there is no
    successor, tribute relations with Pékché, a Pékché-related note on rebellion and
    succession, the Emperor’s hunting park and court excesses amid popular hardship,
    and his death at the Palace of Namiki.
  language: English with one Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor made men lie face down in a dam sluice, had them washed away,
    stabbed them with a three-bladed lance, and took delight in this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor issued a decree saying there was no successor and established
    the Wohatsuse Toneri so that the designation would not be forgotten.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pékché sent Lord Mana with tribute, and the Emperor detained him because Pékché
    had not sent tribute for many years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor made men climb trees, shot them down with a bow, and laughed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The King of Pékché sent Lord Shika with tribute and a memorial stating that
    Mana was not related to the sovereigns of Pékché; Shika later had a son, Lord
    Pop-sa, named as ancestor of the Kimi of Yamato.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Pékché-related note describes Chak Ka’s refusal of an appointment, hostility
    to the king, an assassination during a hunting journey, the accession of the king’s
    son Shima/Yöryung, and Chak Ka’s later execution after rebellion.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: The Emperor subjected naked women to sexual violence involving horses, examined
    the women afterward, killed some, made others public slaves, and took pleasure
    in these acts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Emperor dug a pond and made a park filled with birds and beasts, where
    he liked hunting, racing dogs, and testing horses.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage says the Emperor went out and in at all times without avoiding
