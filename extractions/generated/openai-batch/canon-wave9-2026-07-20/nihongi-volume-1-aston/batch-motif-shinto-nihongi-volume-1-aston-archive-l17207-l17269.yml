  summary: The passage records an imperial reception of ice that becomes the basis
    for a seasonal storage rule; describes Sukuna of Hida, a two-faced man who plunders
    and is killed by an imperial agent; recounts the Emperor selecting and beginning
    construction of a misasagi, where a deer dies and a shrike emerges from its ear,
    giving rise to a place-name; and begins an account of a poisonous great water-snake
    at a river fork in Kibi.
