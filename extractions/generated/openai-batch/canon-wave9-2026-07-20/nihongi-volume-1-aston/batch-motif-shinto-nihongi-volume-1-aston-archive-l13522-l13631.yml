canonical_text:
  quote: "“Let our rough spirits be worshipped at the village of Yamada in Anato.”"
  summary: The Empress leads a punitive sea expedition toward Silla; the frightened
    people of Silla kill the Prince’s wife as an apology. Three accompanying gods
    ask that their rough spirits be worshipped at Yamada in Anato, where a shrine
    is then established. Later the Empress carries the deceased Emperor’s remains
    toward the capital by sea. Princes Kakosaka and Oshikuma, alarmed by the birth
    of an Imperial Prince and the possibility of an infant sovereign, secretly plot
    resistance, using tomb-building as a pretext while assembling stones, boats, and
    weapons. A translator’s note compares this narrative with a Korean Tongkam account
    of Wa-Silla conflict.
  language: English
  quote_policy: quoted
