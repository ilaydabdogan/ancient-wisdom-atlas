canonical_text:
  quote: sitting on a rock, I make this solemn declaration of alliance
  summary: 'The passage narrates a military campaign involving Pékché commanders and
    allies: troops invade and conquer Silla, subdue provinces, slaughter the people
    of Chim-mi-ta-nyé, grant that country to Pékché, receive spontaneous surrender
    from four villages, and meet the Pékché king and prince. Chikuma Nagahiko remains
    with the Pékché king, and solemn declarations are made on Mount Phi-ki and Mount
    Ko-sya, the latter seated on a rock and framed as an enduring alliance.'
  language: English
  quote_policy: quoted
