canonical_text:
  quote: ''
  summary: Saho-hiko resists an imperial force from a stronghold made of rice-stalks,
    called a rice-castle. After a month without surrender, the Empress, grieving over
    the ruin of her elder brother, enters the castle with the Imperial Prince Homutsu
    wake no Mikoto. The Emperor surrounds the castle and demands their release; when
    they are not sent out, General Yatsunada sets the castle on fire. The Empress
    escapes with the child, declares her guilt, contemplates strangling herself, and
    asks that five virtuous daughters of Prince Michi no Ushi of Tamba be granted
    as mates in connection with the Empress’s palace under her charge. A translator’s
    note links the term for rice-castle, inaki, with granaries, custodians, and later
    noble titles.
  language: English
  quote_policy: summarized
