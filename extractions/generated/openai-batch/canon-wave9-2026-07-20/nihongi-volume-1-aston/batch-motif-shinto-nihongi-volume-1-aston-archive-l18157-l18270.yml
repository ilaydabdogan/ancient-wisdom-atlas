canonical_text:
  quote: ''
  summary: The passage records imperial decrees to correct disputed Houses, surnames,
    and titles. Ministers approve the measure. Because many people claim imperial
    descent, miraculous origin, or descent from Heaven, the Emperor orders purification,
    abstinence, divine witnessing, and an ordeal by boiling water at Amagashi Hill.
    Truthful claimants are said to remain unharmed, while false claimants are harmed
    or avoid the test; afterward Houses and surnames become ordered. The passage then
    reports an earthquake, an investigation of a temporary imperial burial shrine,
    Tamada no Sukune's absence and revelry, his gift of a horse to Aso, his killing
    of Aso, and his concealment in the precinct of Takechi no Sukune's tomb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor decrees that social disorder is connected with lost or falsely
    claimed Houses, surnames, and titles, and asks the Ministers to deliberate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ministers support restoring what is lost, correcting what is perverted,
    and determining Houses and surnames.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that ministers, functionaries, and provincial Miyakko describe
    themselves variously as descendants of Emperors, as having miraculous origins,
    or as having ancestors who came down from Heaven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor orders people of the various Houses and surnames to wash, practice
    abstinence, call the Gods to witness, and plunge their hands in boiling water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Caldrons for the boiling-water ordeal are placed on the “Evil Door of Words”
    spur of Amagashi Hill.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The announced rule of the ordeal is that a truthful person will be uninjured
    and a false person will suffer harm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The practice is named Kuka-tachi, and the passage also describes variants
    involving boiling mud stirred with bare arms or a red-hot axe placed on the palm.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Participants put on straps of tree-fibre and plunge their hands in boiling
    water; those called true remain uninjured, while those called false are harmed
    or avoid the test.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the ordeal, Houses and surnames are described as becoming ordered, with
    no one continuing to falsify them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An earthquake occurs in the fifth year, seventh month, fourteenth day.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tamada no Sukune had been ordered to superintend the temporary burial of Emperor
    Midzu-ha-wake.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Aso, Ohari no Muraji, is sent to examine the temporary burial shrine after
    the earthquake and reports that Tamada no Sukune is absent.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tamada no Sukune is found gathering men and women and holding revel instead
    of being present at the temporary burial place.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Tamada no Sukune gives Aso a horse as a present, then secretly waylays and
    kills him on the road.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: After killing Aso, Tamada no Sukune runs away and hides within the precinct
    of the tomb of Takechi no Sukune.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: When the Emperor hears of the matter, he sends for Tamada no Sukune.
  category: action
  evidence_refs:
  - ev:12
