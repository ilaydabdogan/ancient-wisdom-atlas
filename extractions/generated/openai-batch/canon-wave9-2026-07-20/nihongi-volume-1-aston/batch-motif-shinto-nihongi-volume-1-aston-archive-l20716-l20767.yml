canonical_text:
  quote: ''
  summary: A party from Wu arrives with skilled workmen, weavers, and seamstresses.
    A highway and settlement area are named in connection with Wu. The Emperor orders
    nobles to receive the envoys; one seamstress is presented to the God of Oho-Miwa,
    another is appointed to a seamstresses’ group, and the weavers and seamstresses
    are described as founders of later seamstress groups. The Emperor arranges a feast
    for the men of Wu and appoints Ne no Omi as table companion. A Toneri secretly
    observes Ne no Omi’s ornamentation and reports his jewel head-dress. The Emperor
    orders nobles to appear in banquet dress, after which the Empress laments and
    the Emperor asks why she weeps.
  language: English
  quote_policy: summarized
