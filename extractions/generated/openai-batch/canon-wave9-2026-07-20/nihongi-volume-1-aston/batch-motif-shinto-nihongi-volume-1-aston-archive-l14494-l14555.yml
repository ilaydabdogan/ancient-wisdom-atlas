canonical_text:
  quote: "“went into a cave of a rock and died.”"
  summary: In the sixty-second year, Silla fails to attend the court, and Sotsuhiko/Sachihiko
    is sent against it. A Pékché record says that Silla sends two beautiful women
    to entice him; he accepts them, abandons the invasion of Silla, and attacks Kara
    instead. The King of Kara, his sons, and subjects flee to Pékché, and the King’s
    younger sister appeals to the Empress in Great Wa. The Empress sends Mongna Keuncha
    with an army to restore Kara’s temples of Earth and Grain. A variant account says
    Sachihiko hides from the Empress’s wrath and, after learning he will not be pardoned,
    enters a rock cave and dies.
  language: English
  quote_policy: quoted
