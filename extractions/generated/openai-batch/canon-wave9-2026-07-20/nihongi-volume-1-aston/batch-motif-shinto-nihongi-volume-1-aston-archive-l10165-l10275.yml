canonical_text:
  quote: ''
  summary: The passage recounts the deaths of Saho-hiko and his younger sister in
    a burning castle; the summoning of Nomi no Sukune from Idzumo to wrestle Taima
    no Kuyehaya, resulting in Kuyehaya's death and an etiological place-name; the
    placement of women of Tamba in the imperial side-court and Hibasu-hime's appointment
    as Empress; Takano-hime's rejection, shame, fall from a carriage, and death; and
    the Emperor's concern over the adult Prince Homutsu-wake, who never speaks, followed
    by a scene in which a crying swan crosses the sky before him.
  language: English
