canonical_text:
  quote: ''
  summary: The passage reports Saho-hime’s appointment as Empress, the birth and muteness
    of Homu-tsu-wake, the removal of the capital to Makimuku, and diplomatic episodes
    involving Imna/Kara, Japan, and Silla. One account tells of the horned Tsunoga
    Arashito, a royal son from Great Kara, who travels by ship seeking a sage emperor,
    is delayed, serves Emperor Ikume, receives red silk, and whose country is renamed
    Mimana after Emperor Mimaki. Both the main account and alternate account connect
    Silla’s seizure of red silk with the beginning of hostility between Silla and
    Imna/Kara. A further writing begins an episode in which Arashito’s ox disappears
    and its tracks stop in a village.
  language: English
  quote_policy: summarized
