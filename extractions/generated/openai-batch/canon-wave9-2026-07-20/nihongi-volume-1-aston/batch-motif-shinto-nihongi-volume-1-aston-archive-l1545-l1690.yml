canonical_text:
  quote: ''
  summary: Several variant Nihongi accounts describe Izanagi no Mikoto and Izanami
    no Mikoto receiving or using the jewel-spear of Heaven to find or form Ono-goro
    island from the ocean or a floating substance, descending there, establishing
    a palace and the pillar of Heaven, performing a marriage circuit around the pillar,
    and producing island offspring after a corrected ritual order. The passage also
    includes the Leech Child set adrift in a reed-boat, an animal model for intercourse,
    placenta imagery for certain islands, and a translator’s comparative note on the
    reed-boat.
  language: English, with one Latin sentence in a variant passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Gods of Heaven addressed Izanagi no Mikoto and Izanami no Mikoto, told
    them to bring the country into order, and gave them the jewel-spear of Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two deities stood on the floating bridge of Heaven, plunged down the spear,
    stirred the ocean, and the brine from the spear-point coagulated into the island
    called Ono-goro-jima.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two deities descended to Ono-goro-jima, dwelt there, erected an eight-fathom
    palace, and set up the pillar of Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The male and female deities described corresponding bodily places called the
    sources of masculinity and femineity, and the male deity expressed a desire to
    unite them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two deities promised to go separately around the pillar of Heaven, met,
    the female deity spoke first, the male deity answered, and they became husband
    and wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Their first child was the leech, which they placed in a reed-boat and sent
    adrift; their next was the island of Ahaji, which was also not counted among their
    children in that account.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the first unsuccessful offspring, the deities returned to Heaven and
    reported the circumstances; the Heavenly Gods divined by the greater divination
    and instructed them that the woman had spoken first and that they should return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deities went around the pillar again, with the male deity speaking first
    when they met, then dwelt together in the same palace and had island children
    whose collective country was called the Great-Eight-Island Country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Variant accounts place the two deities in the mist of Heaven, in the Plain
    of High Heaven, or speaking about something resembling floating oil, and each
    describes the jewel-spear of Heaven finding, scraping together, or forming Ono-goro.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One variant says it was unlucky that the female deity spoke first, and after
    the corrected greeting a motacilla bird flew in, moved its head and tail, and
    the two gods imitated it to learn the art of intercourse.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: One variant says the two deities became husband and wife, treated the islands
    of Ahaji and Aha as placenta, and then produced several named islands, including
    Oki and Sado as twins.
  category: sequence
  evidence_refs:
  - ev:7
