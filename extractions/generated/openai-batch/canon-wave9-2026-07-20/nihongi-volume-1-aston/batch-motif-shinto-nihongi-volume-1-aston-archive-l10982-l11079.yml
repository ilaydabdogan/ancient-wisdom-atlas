canonical_text:
  quote: ''
  summary: The passage opens Book VII by giving Emperor Keiko's genealogy, accession,
    empress, and children. It records the twin birth and mortar-derived names of Oho-usu
    and Wo-usu, describes Wo-usu/Yamato-dake's exceptional qualities, and notes a
    divination that cancels an imperial journey to Kii for sacrifices to the Gods
    of Heaven and Earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oho-tarashi-hiko-oshiro-wake is identified as the third child of Emperor Iku-me-iri-hiko-isachi,
    with Hibasu-hime no Mikoto as his mother and Prince Michi no ushi of Tamba as
    his maternal grandfather.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Emperor Iku-me-iri-hiko-isachi raised Oho-tarashi-hiko-oshiro-wake to Prince
    Imperial at age twenty-one; after the emperor's death, the Prince Imperial assumed
    the Imperial Dignity.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The lady of Inabi in Harima was appointed Empress; an alternate version identifies
    her as the younger lady of Inabi in Harima.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Empress is said to have borne two sons, Oho-usu and Wo-usu no Mikoto;
    one writing instead says she bore three sons, adding Waka-Yamato-neko.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oho-usu and Wo-usu no Mikoto are described as twins born on the same day with
    the same placenta.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The emperor, wondering at the twin birth, is said to have informed the mortar
    and then named the two princes Great Mortar and Little Mortar.
  category: action
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: Wo-usu no Mikoto is also called Yamato Woguna and Yamato-dake no Mikoto.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wo-usu no Mikoto is described as having a manly spirit as a child, extraordinary
    beauty at manhood, a height of one rod, and strength sufficient to lift a tripod.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Divination was made about whether the emperor should go to the Land of Kii
    to perform sacrifices to all the Gods of Heaven and Earth; the result was unlucky,
    so the imperial car was countermanded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The translator's note explains usu as a Japanese term connected with arrangements
    for hulling or grinding grain, properly the mortar but also used for mortar-and-pestle
    combinations or querns.
  category: object
  evidence_refs:
  - ev:7
