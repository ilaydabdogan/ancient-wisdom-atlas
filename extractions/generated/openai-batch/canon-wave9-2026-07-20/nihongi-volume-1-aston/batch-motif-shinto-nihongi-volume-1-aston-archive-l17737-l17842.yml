canonical_text:
  quote: ''
  summary: The passage records imperial judgment against the Kimi of the Cart-keepers
    for misappropriating people allotted to divine service, his expiation and removal
    from office, the appointment of Princess Hatahi as Empress, the establishment
    of a Treasury and Treasury Be, the taking of two sisters as concubines, their
    lament for their powerful absent brother Prince Washizumi, his refusal to come
    when summoned, his identification as ancestor of two houses, and the Emperor’s
    illness and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Emperor summoned and questioned the Kimi of the Cart-keepers after allegations
    that he had taken men allotted to the service of the Deities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Emperor stated two offences: appropriating subjects of the Son of Heaven
    and wrongfully including persons allotted to the Gods of Heaven and Earth in the
    Cart-keepers’ Be.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Emperor imposed the expiation of evil and the expiation of good, sent
    the Kimi to Cape Nagasa to perform rites, removed him from charge of the Cart-keepers’
    Be of Tsukushi, and re-allotted them to the three Deities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Imperial Princess Hatahi of Kusaka was appointed Empress.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Treasury was instituted and a Treasury Be was established.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Emperor brought Futohime no Iratsume and Takatsuru no Iratsume, daughters
    of Prince Funashi wake, into the Empress’s palace and made them concubines.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The two concubines lamented continually because they had not spoken face to
    face with their elder brother, Prince Washizumi, for many days.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Prince Washizumi was described as strong and nimble, having alone taken a
