canonical_text:
  quote: ''
  summary: The passage recounts a dispute over imperial succession, a legal-administrative
    dispute over Yamato rice-lands, and a subsequent plot by a resentful prince to
    kill the Prince Imperial and seize the Imperial Dignity. Oho-sazaki no Mikoto
    repeatedly defers to the late Emperor's choice, investigates the rice-land claim
    through testimony and precedent, forgives the offending prince, and later warns
    the Prince Imperial of an armed attack.
  language: English
  quote_policy: summarized
