  quote: ''
  summary: The passage recounts the recognition of A-chik-ki as a reader of the classics
    and teacher of Ujino Waka-iratsuko, the summoning and arrival of Wang-in from
    Pékché as a superior learned teacher, lineage claims for writing-related clans,
    the death of King Ahwa of Pékché and Prince Tyén-chi’s return to succeed to royal
    dignity, and a military mission to Kara/Silla to open a way for Sotsuhiko.
  language: English
