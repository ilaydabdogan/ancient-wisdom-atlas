canonical_text:
  quote: ''
  summary: A version recounts that Ama no hi-hoko arrives by ship from Silla, anchors
    in Harima, identifies himself as the son of the King of Silla, says he gave his
    country to his younger brother Chiko, and offers allegiance and eight tribute
    objects to the Emperor. The Emperor offers him a choice of dwelling places; Ama
    no hi-hoko asks to travel through provinces and choose a suitable place, then
    travels by the Uji river through Ohomi, Wakasa, and to Tajima. Editorial notes
    connect the passage with Korean elements in Shinto and a related Kojiki legend.
  language: English
  quote_policy: summarized
