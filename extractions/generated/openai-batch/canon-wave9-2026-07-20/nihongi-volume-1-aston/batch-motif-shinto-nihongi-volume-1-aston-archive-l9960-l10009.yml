- id: obs:4
  text: Ama no hi-hoko says that after hearing there was a sage monarch in Japan,
    he gave his country to his younger brother Chiko and came to offer allegiance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Ama no hi-hoko brings eight tribute objects: a Ha-boso gem, an Ashi-daka
    gem, an Ukaka or Akashi red-stone gem, an Idzushi short sword, an Idzushi spear,
    a sun-mirror, a Kuma-himorogi, and an Isasa sword.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Emperor orders Ama no hi-hoko to dwell either at Shisaha in Harima or
    at Idesa in Ahaji, according to his pleasure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ama no hi-hoko asks to visit various provinces and be granted the place agreeable
