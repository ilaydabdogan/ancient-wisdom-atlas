canonical_text:
  quote: ''
  summary: The passage recounts the production and assignment of deities connected
    with Sosa no wo no Mikoto and the Sun-Goddess, followed by Sosa no wo's destructive
    and polluting acts in the Sun-Goddess's rice-fields, New Palace, and sacred weaving
    hall. After being startled and wounded, Ama-terasu enters the Rock-cave of Heaven,
    closes the Rock-door, and the world is left in darkness without the normal alternation
    of night and day. Translator notes discuss ritual purity, a comparison to Indian
    piebald celestial animals, and the Sun-Goddess's anthropomorphic and solar aspects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jewels associated with Sosa no wo are placed in his mouth and then on his
    hand or forearm; they change and produce named gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other named gods are produced from Sosa no wo's right forearm, left foot,
    and right leg.
  category: action
  evidence_refs:
