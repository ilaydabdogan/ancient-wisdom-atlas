canonical_text:
  quote: ''
  summary: The chronicle records Prince Shiraga being made Heir Apparent. It then
    tells that a man associated with Urashima went fishing, caught a large tortoise
    or turtle that changed into a woman, married her, descended with her into the
    sea, reached Horai San, and saw genii. Notes identify Horai San with the Chinese
    P'eng-Lai-Shan, one of the Three Isles of the Genii, and describe it as a paradise
    with a fountain of life and ever-growing plants. The passage also notes the death
    of a Pekché king.
  language: English
  quote_policy: summarized
