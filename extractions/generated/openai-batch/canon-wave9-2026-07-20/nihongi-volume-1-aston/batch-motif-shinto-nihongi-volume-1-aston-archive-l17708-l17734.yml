canonical_text:
  quote: ''
  summary: A report states that a younger sister, with an alternate version naming
    Sanakita no Komotsu no Mikoto, has gone to be buried at Hasa. A messenger arrives
    in haste and announces that the Imperial concubine is dead. The Emperor is shocked,
    orders his carriage, returns, and later arrives from Ahaji. The Imperial concubine
    is buried. The Emperor reproaches himself for not appeasing a divine curse, believes
    this caused the concubine's death, and seeks to determine where the fault lay.
    The passage ends with the beginning of an incomplete statement naming the Kimi
    of the Cart-keepers.
  language: English
  quote_policy: summarized
