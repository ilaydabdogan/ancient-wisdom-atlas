canonical_text:
  quote: ''
  summary: 'In the Ojin annals, men approach by sea and are first taken for stags
    because they wear deer-skins with horns. They report that Ushi of Morogata offers
    his daughter Kami-naga-hime to the Court, and the Emperor receives her. The passage
    gives an etiology for the harbour-name Kako and possibly for kako as a term for
    sailors. It then records tribute and allegiance from Pékché-related figures: a
    seamstress Maketsu, the Lord of Yutsuki whose people are detained by Silla in
    Kara, and A-chik-ki with two horses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group approaches over the sea and enters the harbour of Kako in Harima;
    the Emperor asks his courtiers what stags are swimming over the great sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A messenger examines the group and sees that they are men wearing deer-skins
    with horns attached.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men say that Ushi, Kimi of Morogata, is old, has ceased his service, cannot
    forget the Court, and offers his daughter Kami-naga-hime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor is delighted, sends for Kami-naga-hime, and has her follow the
    Imperial ship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says people of the time called the landing place the harbour of
    Kako and suggests this may have begun the use of kako as a general name for sailors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An editorial note says Kako is written with characters meaning deer-little-one.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the fourteenth year, the King of Pékché sends as tribute a seamstress named
    Maketsu, described as first ancestress of the seamstresses of Kume.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lord of Yutsuki comes from Pékché, offers allegiance, and says he was
    bringing one hundred and twenty districts of his people when men of Silla prevented
    them and forced them to remain in Kara.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Katsuraki no Sotsuhiko is sent to bring the men of Yutsuki from Kara, but
    three years pass and he does not return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the fifteenth year, the King of Pékché sends A-chik-ki with two quiet horses
    as tribute; the horses are fed in stables on the acclivity of Karu, and A-chik-ki
    is appointed to oversee their foddering.
  category: action
  evidence_refs:
  - ev:6
