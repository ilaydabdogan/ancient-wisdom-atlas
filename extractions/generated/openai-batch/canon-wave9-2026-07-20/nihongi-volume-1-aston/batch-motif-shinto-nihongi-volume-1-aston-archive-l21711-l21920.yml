canonical_text:
  quote: ''
  summary: The passage presents celebratory poems and dances, including house-prosperity
    imagery, animal-dance imagery, a willow by water, and a sacred cedar. Through
    a Tatsutsu dance and cryptic poetic declarations, the figure later identified
    as Woke reveals princely status and descent from Oshiha no Mikoto. Wodate recognizes
    the princes, provides for them, and reports to the capital. Emperor Shiraga, childless,
    arranges for the princes to be received and appointed. After Shiraga's death,
    Ohoke and Woke defer the dignity to one another, and Imperial Princess Awo/Ihitoyo
    temporarily holds court and governs until her death.
  language: English
  quote_policy: summarized
