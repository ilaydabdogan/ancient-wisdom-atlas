  quote: ''
  summary: The passage describes shields and spears as emblems of authority, the use
    of mountains, rivers, and lanes to define administrative boundaries, directional
    reckoning by relation to the sun, and names for the sunny and shady sides of mountains.
    It then states that the people possessed their dwellings tranquilly and the Empire
    was at peace. Later annal entries report that the Emperor appointed his nephew
    Tarashi-naka-tsu-hiko no Mikoto as Prince Imperial and that the Emperor died aged
    107.
