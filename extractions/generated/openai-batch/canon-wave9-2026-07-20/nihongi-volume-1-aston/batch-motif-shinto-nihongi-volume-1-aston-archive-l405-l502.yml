  quote: ''
  summary: The introduction describes the Katari Be as hereditary reciters who may
    have helped conserve legendary materials, then characterizes the Nihongi as a
    mixed work whose early sections contain myth, legend, fiction, miraculous stories,
    and ancient poems. It says the narrative becomes more historical in later centuries,
    while also emphasizing the strong influence of Chinese language, thought, literary
    models, and historical writing on the text.
