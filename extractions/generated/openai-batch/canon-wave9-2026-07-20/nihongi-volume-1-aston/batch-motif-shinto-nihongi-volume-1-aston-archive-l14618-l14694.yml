canonical_text:
  quote: ''
  summary: The passage introduces Emperor Homuda, later Ojin, as a royal child born
    after the Empress’s campaign against Silla. It describes signs of wisdom in childhood,
    a divine grant made while he was in the womb, a distinctive flesh mark on his
    arm associated with an archer’s elbow-pad and his name, an alternate account of
    name exchange with a deity, his accession after the Grand Empress’s death, and
    a genealogical list of consorts and children.
  language: English
  quote_policy: summarized
