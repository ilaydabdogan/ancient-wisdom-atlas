canonical_text:
  quote: "“There was there a beautiful little snake”"
  summary: The passage recounts an omen of Yamato’s overturning, the revolt and defeat
    of Take-hani-yasu-hiko and Ata-bime, ritual acts and etiological place-names from
    the campaign, then the nocturnal marriage of Yamato-toto-hi-momo-so-bime to Oho-mono-nushi,
    his manifestation as a small snake, her death by chopstick, and the making of
    her tomb by humans and gods.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed woman in the opening fragment wraps earth from Mount Kako in Yamato
    in her neckerchief, prays that it represents the Land of Yamato, turns it upside
    down, and reads this as a warning of troubles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Take-hani-yasu-hiko and his wife Ata-bime conspire to revolt, raise an army,
    come by different roads, and intend to join forces and attack the capital.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor sends Isaseri-hiko no Mikoto against Ata-bime; her force is intercepted
    at Oho-saka, routed, and slain, and Ata-bime is killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oho-hiko and Hiko-kuni-fuku take sacred jars and plant them at the top of
    the acclivity of Takasuki in Wani before advancing against Take-hani-yasu-hiko.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The imperial forces ascend and occupy Mount Nara, and the mountain is said
    to receive its name because the troops trod level the herbs and trees.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the River Wakara, also called Idomi, Hani-yasu-hiko and Hiko-kuni-fuku
    challenge each other; Hani-yasu-hiko shoots first and misses, while Hiko-kuni-fuku
    shoots him in the breast and kills him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Hani-yasu-hiko is killed, his troops lose courage, retreat, are pursued,
    and several place-names are explained from the rout, decapitations, discarded
    armor, defiled breeches, and bowed heads.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yamato-toto-hi-momo-so-bime no Mikoto becomes the wife of Oho-mono-nushi no
    Kami, who is not seen in the daytime and comes at night.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yamato-toto-hi-momo-so-bime asks to see her husband’s countenance in the morning;
    the Great God agrees to enter her toilet-case and asks that she not be alarmed
    at his form.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At daybreak she looks into the toilet-case and finds a beautiful little snake,
    about the length and thickness of a garment cord, and she is frightened and exclaims.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Great God is ashamed, changes suddenly into human form, says that she
    has shamed him and that he will shame her in turn, and ascends to Mount Mimoro.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Yamato-toto-hi-momo-so-bime looks up, feels remorse, sits down, stabs herself
    in the pudenda with a chopstick, dies, and is buried at Oho-chi; her tomb is called
    Hashi no haka.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The tomb is said to have been made by men in the daytime and by gods at night,
    using stones carried from Mount Oho-saka and passed hand to hand by the people.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the rebels have yielded or been executed and the home district is at
    peace, the Emperor orders the generals of the four roads to set out because tribes
    abroad remain tumultuous.
  category: speech
  evidence_refs:
  - ev:12
