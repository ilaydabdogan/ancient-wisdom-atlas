- id: motif:2
  label: Royal order threatened by revolt and restored by loyal commanders
  taxonomy_refs:
  - royal_legitimacy
  basis: The rebels intend to attack the capital, while imperial commanders frame
    the campaign as punishment of revolt against the Royal chamber and restore peace
    in the home district.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:12
  confidence: high
  cautions: The passage is chronicle-style military narrative; broader ideological
    interpretation should be reviewed.
