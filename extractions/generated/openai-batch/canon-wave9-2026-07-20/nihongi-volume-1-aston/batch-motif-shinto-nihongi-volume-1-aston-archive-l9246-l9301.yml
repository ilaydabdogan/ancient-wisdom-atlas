canonical_text:
  quote: ''
  summary: The ruler sends and appoints generals with instructions to attack those
    who refuse his orders. Oho-hiko no Mikoto reaches an acclivity, where a maiden
    sings a warning that Prince Mimaki-iri is unaware of people preparing to kill
    him. When questioned, the maiden says she is only singing, repeats the song, and
    disappears. Oho-hiko reports this to the Emperor. The Emperor’s aunt, described
    as intelligent and able to foresee the future, interprets the song as a sign that
    Take-hani-yasu-hiko is plotting treason, and mentions that his wife Atabime secretly
    took earth.
  language: English
  quote_policy: summarized
