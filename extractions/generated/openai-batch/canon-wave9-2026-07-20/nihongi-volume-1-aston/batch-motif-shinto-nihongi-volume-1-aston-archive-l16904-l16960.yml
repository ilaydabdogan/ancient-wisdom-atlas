canonical_text:
  quote: ''
  summary: The passage recounts suspicion over jewels resembling those of Imperial
    Princess Medori, Aganoko's confession that he took them from her after her death,
    his avoidance of execution by surrendering private lands, and the naming of that
    land Tama-de. It then describes Ki no Tsuno no Sukune's mission to Pékché, his
    administrative survey of provinces and districts, the binding and delivery of
    Lord Chyu after disrespect, Chyu's escape and concealment in Japan, and his eventual
    pardon. Translator notes compare the Pékché incident with earlier entries in the
    Nihongi chronology.
  language: English
  quote_policy: summarized
