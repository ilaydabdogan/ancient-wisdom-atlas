canonical_text:
  quote: ''
  summary: An Imperial Princess, named in a song as Medori, is weaving while women
    sing of cloth for an august cloak for Hayabusa wake. A ruler discovers that Imperial
    Prince Hayabusa wake has secretly wedded her and is angry but at first refrains
    from punishment. Hayabusa wake reclines with his head on the princess's knee and
    frames a falcon as swifter than a wren, saying this means he will be first. His
    attendants then sing of a falcon ascending to Heaven and seizing the wren on Tsuki
    trees. The ruler becomes enraged, says the quarrel has become a matter affecting
    the State, and wishes to kill Hayabusa wake.
  language: English
  quote_policy: summarized
