canonical_text:
  quote: "“There is nothing but far seas and towering billows”"
  summary: The passage records a tribute mission from Wa, then a mission by Shima
    no Sukune to Thak-syun. The King of Thak-syun reports that three men from Pékché
    had earlier asked for passage to an honourable eastern country, but he replied
    that he did not know the route and that the seas were difficult. The Pékché men
    decided to return and later prepare a ship, asking to be informed if envoys from
    the honourable country arrived.
  language: English
  quote_policy: quoted
