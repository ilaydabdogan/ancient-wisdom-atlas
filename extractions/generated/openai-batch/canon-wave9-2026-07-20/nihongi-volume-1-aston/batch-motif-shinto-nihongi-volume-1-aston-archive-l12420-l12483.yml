  summary: The passage reports a disturbance by the Yemishi, an imperial military
    response, surrender by named Yemishi chieftains, punishment or pardon according
    to submission, and lasting peace in the Eastern Land. It then records construction
    of the Pool of Sakate, provincial granaries, the emperor's residence at Shiga/Taka-Anaho
    and death, followed by the genealogy, appointment, and accession of Emperor Waka-tarashi-hiko.
