canonical_text:
  quote: ''
  summary: A god instructs that a gentle spirit will attach to and protect the Empress,
    while a rough spirit will serve as vanguard and guide for the squadron. The Empress
    worships after receiving the instructions and appoints a director of ceremonies.
    When the time for delivery arrives, she places a stone in her loins and prays
    that delivery occur in that land after the enterprise is completed and she returns.
    The stone is said to remain by the roadside in Ito. The rough spirit is then ordered
    to act as vanguard of the forces, and the gentle spirit is requested to guard
    the Royal vessel.
  language: English
  quote_policy: summarized
