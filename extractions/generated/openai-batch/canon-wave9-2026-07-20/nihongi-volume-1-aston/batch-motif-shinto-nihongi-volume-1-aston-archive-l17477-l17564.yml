canonical_text:
  quote: ''
  summary: The Heir, staying at the shrine of Furu no Iso no Kami, refuses to trust
    his younger brother Midzuha wake until Midzuha kills the rebellious Imperial Prince
    Nakatsu. Midzuha accepts the task, secretly induces Nakatsu's Hayato retainer
    Sashihire with brocade clothing, and Sashihire kills Nakatsu with a spear in the
    privy. Sashihire is then killed because he betrayed his own lord. Midzuha reports
    back, is favored by the Heir, and receives official granaries. Hamako of Adzumi
    is arrested and later branded near the eye after the death penalty for rebellion
    is remitted. The Prince Imperial assumes the Dignity at Ihare.
  language: English
  quote_policy: summarized
