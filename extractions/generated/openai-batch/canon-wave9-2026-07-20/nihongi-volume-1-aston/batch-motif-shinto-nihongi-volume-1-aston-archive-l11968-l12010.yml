canonical_text:
  quote: ''
  summary: A storm threatens the Prince's ship at sea. Oto-tachibana-hime says the
    storm is likely due to the God of the Sea and offers herself to redeem the Prince's
    life; she plunges into the waves, after which the storm ceases and the ship reaches
    shore. Yamato-dake no Mikoto then travels by sea toward the Yemishi frontier with
    a great mirror on his ship. The Yemishi chiefs first prepare resistance, but on
    seeing the Prince's ship they are awed, abandon their weapons, ask whether he
    is a deity, and submit after the Prince identifies himself as the son of a deity
    of visible men.
  language: English
  quote_policy: summarized
