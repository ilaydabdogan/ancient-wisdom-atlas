- id: obs:8
  text: In the main account, the Prince recognizes the deception, produces fire with
    a fire-drill, kindles a counter-fire, and escapes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An alternate version says the sword Mura-kumo wields itself and mows away
    the herbage near the Prince, allowing him to escape; this is given as the reason
    the sword was called Kusa-nagi.
  category: sequence
  evidence_refs:
  - ev:5
