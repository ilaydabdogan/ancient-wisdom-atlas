canonical_text:
  quote: ''
  summary: Yamato-dake no Mikoto sets out on an eastern expedition, visits the shrine
    of Ise, and receives the sword Kusa-nagi from Yamato-hime no Mikoto. In Suruga,
    brigands lure him into a moor and set it on fire; he escapes by making a counter-fire,
    while an alternate version says the sword mows down the surrounding herbage. He
    then destroys the robber-band, after which the place is named Yaketsu, and proceeds
    toward Sagami and Kadzusa.
  language: English
  quote_policy: summarized
