canonical_text:
  quote: ''
  summary: The passage recounts imperial campaigns against Shiki the Elder and Naga-sune-hiko.
    A stratagem using feebler and stronger troops leads to the defeat of Shiki. In
    a later battle, a golden kite perches on the Emperor's bow and dazzles the enemy.
    Naga-sune-hiko challenges the Emperor's claim by invoking Nigi-haya-hi no Mikoto,
    a heavenly child who descended in a Rock-boat, and by displaying heavenly weapons
    as proof. The Emperor shows matching heavenly tokens. Nigi-haya-hi kills Naga-sune-hiko,
    submits to the Emperor, and is identified as ancestor of the Mono no Be House.
  language: English
  quote_policy: summarized
