canonical_text:
  quote: ''
  summary: The passage describes a bamboo grove giving a place its name, Kami-ataka-ashi-tsu-hime
    selecting rice-fields by divination and preparing sake and boiled rice for entertainment,
    and an alternate account of Taka-mi-musubi wrapping Ninigi in a coverlet before
    Ninigi opens Heaven’s rock-door, parts the clouds, and descends. Ama-no-oshi-hi,
    accompanied by Ame-kushi-tsu Oho-kume and bearing heavenly weapons, precedes the
    Heavenly Grandchild down to the floating bridge at Takachiho. The party searches
    for a country and reaches Cape Kasasa, where the local god Koto-katsu-kuni-katsu-Nagasa
    says there is a country and yields it to the Heavenly Grandchild, who abides there.
    Translator notes connect the rice episode with the Nihi-name/Shin-jō-sai new-rice
    festival.
  language: English
  quote_policy: summarized
