canonical_text:
  quote: ''
  summary: A speaker reports hearing from the Ancient of the Sea about an eastern
    land encircled by blue mountains, associated with a heavenly descent in a Rock-boat
    and judged suitable as a world-center capital for the Heavenly task. The Imperial
    Princes agree to go. The Emperor then leads the princes and a naval force eastward.
    At the Haya-suhi gate, a fisherman named Utsuhiko identifies himself as a Country-God
    who has come to receive the son of the Heavenly Deity; he agrees to guide the
    Emperor and is made pilot of the Imperial vessel.
  language: English
  quote_policy: summarized
