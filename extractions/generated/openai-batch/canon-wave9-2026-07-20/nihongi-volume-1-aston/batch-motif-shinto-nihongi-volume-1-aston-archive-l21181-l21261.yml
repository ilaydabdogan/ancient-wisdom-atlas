canonical_text:
  quote: ''
  summary: The dying Emperor speaks about succession, praises the Prince Imperial,
    and warns in another account against Prince Hoshikaha. After the Emperor's death,
    Yemishi troops under Oshiro rebel and raid neighboring districts. Oshiro fights
    them at Port Saba; after arrows fail against those dodging or lying down, he twangs
    an empty bow by the shore, sings of his renown, then kills and pursues the rebels
    until they are massacred near Port Uragake, with a variant account saying he sent
    men to kill them there.
  language: English
  quote_policy: summarized
