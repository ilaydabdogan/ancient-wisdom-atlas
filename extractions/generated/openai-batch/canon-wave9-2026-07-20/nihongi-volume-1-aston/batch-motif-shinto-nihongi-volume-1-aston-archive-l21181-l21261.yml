- id: obs:2
  text: A variant account says the Emperor warned that Prince Hoshikaha had an evil
    disposition and violent heart and might try to harm the Prince Imperial after
    the Emperor's death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Five hundred Yemishi under Oshiro's command heard of the Emperor's death,
    called it an opportunity, assembled, and invaded neighboring districts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oshiro met the Yemishi at Port Saba, fought them, and shot at them, but some
    skipped and others lay down to avoid the arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Oshiro twanged an empty bow by the sea-shore, and two companies of those who
