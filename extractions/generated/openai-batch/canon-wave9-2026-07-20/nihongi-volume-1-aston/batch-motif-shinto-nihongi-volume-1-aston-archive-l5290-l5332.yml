canonical_text:
  quote: ''
  summary: A resentful female speaker explains the shortness of human life by declaring
    that visible mankind will decay like tree flowers. Kami-ataka-ashi-tsu-hime announces
    conception by the August Grandchild, who denies that the child can be his. Kono-hana-saku-ya-hime
    responds with shame and anger, makes a doorless muro, vows that the true offspring
    of the Heavenly Grandchild will survive unharmed, enters the chamber, and burns
    it with fire. Children are born at successive stages of the flames. A variant
    account gives a different order and names for the three children, says the fire
    harms neither mother nor children, and adds that the mother cuts the navel-strings
    with a bamboo knife. A note identifies Hiko-ho-ho-demi as ancestor of the Mikados
    and mentions a local custom of cutting the umbilical cord with bamboo or copper.
  language: English
  quote_policy: summarized
