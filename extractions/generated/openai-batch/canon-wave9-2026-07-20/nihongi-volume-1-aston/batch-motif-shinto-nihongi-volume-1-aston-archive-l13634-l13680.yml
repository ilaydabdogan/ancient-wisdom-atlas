canonical_text:
  quote: ''
  summary: Prince Kakosaka and Prince Oshikuma raise troops and perform a hunt-prayer
    at Toga; a wild boar kills Prince Kakosaka, and Prince Oshikuma retreats. The
    Empress, hearing of Oshikuma's army, sends Takechi no Sukune with the Imperial
    Prince by another route while she sails toward Naniha. Her ship is unable to proceed,
    so she returns to Muko and performs divination. Several deities admonish her concerning
    where their spirits should dwell, and worshippers are appointed for them.
  language: English
  quote_policy: summarized
