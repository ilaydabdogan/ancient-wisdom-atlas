canonical_text:
  quote: ''
  summary: The passage recounts the restoration and enthronement of the eldest son
    as Emperor, with an accession speech invoking Heaven, Earth, and the need for
    a ruler. It then lists appointments and events of the early reign, including severe
    acts of cruelty attributed to the Emperor, a labor levy for castle building, a
    burial notice for a Pékché figure, and the deposition of an oppressive Pékché
    king followed by the rise and origin account of King Shima/Munyong.
  language: English
  quote_policy: summarized
