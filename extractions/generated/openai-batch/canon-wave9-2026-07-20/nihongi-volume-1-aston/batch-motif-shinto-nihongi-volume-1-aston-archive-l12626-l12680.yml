canonical_text:
  quote: ''
  summary: The passage records tribute of white birds to the Emperor, their seizure
    by Prince Gama-mi-wake, and the Prince's execution after the act is treated as
    an affront to the late Prince, the Emperor's father. It then gives a public moral
    explanation based on father and elder-brother hierarchy, records the appointment
    of Oki-naga-tarashi-hime as Empress, lists consorts and imperial children, and
    notes a royal progress to Tsunoga with the establishment of the Palace of Kehi
    and the Ahaji granary.
  language: English
  quote_policy: summarized
