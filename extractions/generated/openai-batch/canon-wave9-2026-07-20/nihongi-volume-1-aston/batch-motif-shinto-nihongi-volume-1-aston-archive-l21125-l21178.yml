  summary: A first-person imperial speaker addresses court officials and provincial
    administrators, describing their relation as both ruler-vassal and father-child.
    He says he sought to preserve peace through the wisdom of the Omi and Muraji,
    but disease and age have weakened him. He laments incomplete refinement in clothing,
    caps, civilization, and government, states that he acts for the nourishment of
    the people and the Empire rather than private benefit, and warns that Prince Hoshikaha
    has treasonous intentions that would bring disgrace and harm to the nation.
