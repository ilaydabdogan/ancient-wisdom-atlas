  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In winter, in the eleventh month of the second year of Emperor Shiraga, Wodate
    Iyo no Kumebe, Governor of Harima, goes to Akashi to arrange offerings for the
    festival of first-fruits; a variant writing says he went to collect land tax.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wodate arrives while the Obito of the Shijimi granaries is holding a house-warming
    for a new muro and extending the daytime celebration into the night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emperor tells his elder brother Prince Ohoke that the evening should be
    used to reveal their names and disclose their high rank.
  category: speech
  evidence_refs:
  - ev:3
