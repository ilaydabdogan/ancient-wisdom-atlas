canonical_text:
  quote: "“It belongs to this very evening to reveal our names and to disclose our
    high rank.”"
  summary: During a house-warming for a new muro held by the Obito of the Shijimi
    granaries, two brothers serving in humble roles discuss revealing that they are
    grandsons of Emperor Izahowake. They are seated low as light-holders, praised
    for their courteous humility, ordered to dance by Governor Wodate, and the younger
    brother rises to offer a ceremonial health for the new muro.
  language: English
  quote_policy: quoted
