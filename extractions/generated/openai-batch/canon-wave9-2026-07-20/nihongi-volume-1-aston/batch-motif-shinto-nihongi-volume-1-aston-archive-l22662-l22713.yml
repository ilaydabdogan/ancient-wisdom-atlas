canonical_text:
  quote: ''
  summary: The passage gives a complex genealogy involving Yamaki, Nakume, Funame,
    Akitame, and Araki, including a variant account and an explanation of old kinship
    terms. It then records Hitaka no Kishi returning from Korye with two artisans,
    the appointment of Wo-hatsuse Wakasazaki no Mikoto as Prince Imperial, and a report
    of peace, good government, and agricultural abundance.
  language: English
  quote_policy: summarized
