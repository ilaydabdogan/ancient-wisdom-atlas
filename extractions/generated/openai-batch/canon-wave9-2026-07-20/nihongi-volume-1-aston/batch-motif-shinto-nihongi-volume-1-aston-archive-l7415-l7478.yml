canonical_text:
  quote: ''
  summary: An editorial note discusses the Yemishi/Ainu and a poem’s metre. The narrative
    then reports that the Emperor moves camp, the imperial army advances against the
    Hiko of Shiki, and the Emperor summons Shiki the Elder. The Yata-garasu, a crow,
    repeats the summons as coming from the child of the Heavenly Deity. Shiki the
    Elder rejects it and aims a bow at the crow, which flees to Shiki the Younger.
    Shiki the Younger fears the divine approach, feeds and entertains the crow on
    eight leaf-platters, obeys it, and warns the Emperor that his elder brother has
    gathered eighty bandits and arms. The Emperor consults his generals, who advise
    further explanation and only then warlike measures if submission is still refused.
  language: English
  quote_policy: summarized
