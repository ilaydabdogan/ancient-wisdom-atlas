canonical_text:
  quote: ''
  summary: During Ōjin's reign, three ponds are made. A man reports to the Emperor
    that Kami-naga-hime of Hiuga, daughter of Ushimorowl, is exceptionally beautiful.
    The Emperor wishes to obtain her, sends a messenger to summon her, and she arrives
    and is settled at Kuhadzu. The Imperial Prince Oho-sazaki no Mikoto falls in love
    with her. The Emperor notices this and wishes to unite her with him, seating her
    prominently at a palace banquet and addressing his son in a song that imagines
    a blushing maiden hidden among blossoming branches.
  language: English
  quote_policy: summarized
