canonical_text:
  quote: The Empire censured him, and called him “The greatly wicked Emperor.”
  summary: After a hunt, the Emperor becomes angry because the ministers do not answer
    him, draws his sword, and kills the steward Mumakahi of Ohotsu. The Grand Empress
    and the Empress send Hi-no-hime with sake to meet him, and her appearance softens
    him. In the hinder palace, the Emperor explains his anger to the Empress Dowager,
    who interprets the ministers’ silence as misunderstanding his intention to establish
    a Fleshers’ Be. She offers Nagano and two scullions, and other officials later
    present people for the Fleshers’ Be. The Fumubito Be and Toneri Be are also instituted.
    The passage closes by saying the Emperor wrongfully slew many men and was censured
    by the Empire.
  language: English
  quote_policy: quoted
