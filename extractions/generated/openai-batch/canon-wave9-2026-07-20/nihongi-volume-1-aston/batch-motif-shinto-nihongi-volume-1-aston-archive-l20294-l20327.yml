canonical_text:
  quote: ''
  summary: A resentful unnamed person makes a false report about Ohiha no Sukune to
    Karako no Sukune, producing coolness between the commanders. The King of Pekché
    invites the commanders to join him in viewing the frontier. During the journey,
    at a river, Karako shoots at Ohiha from behind; Ohiha shoots Karako into the midstream
    and Karako dies. The rival Omi return without reaching the Palace of the King
    of Silla. Separately, the Uneme Ohomi follows the dead body of Woyumi no Sukune
    to Japan and asks Ohotomo no Muruya no Ohomuraji to have a burial place selected
    by divination.
