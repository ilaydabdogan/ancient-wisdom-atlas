canonical_text:
  quote: ''
  summary: Kutyé and companions report that men of Silla captured and imprisoned them,
    threatened to kill them, feared their curse, robbed and exchanged their tribute,
    and threatened them into silence. The Grand Empress and Homuda wake no Mikoto
    pray to the Gods of Heaven about investigating the matter; the gods direct that
    Takechi no Sukune prepare a plan and Chikuma Nagahiko serve as envoy. Chikuma
    is then sent to Silla. Later Areda wake and Kaga wake are made generals, cross
    with Kutyé and others to Thak-syun, and are warned that their troops are too few
    to defeat Silla.
  language: English
  quote_policy: summarized
