canonical_text:
  quote: ''
  summary: The passage recounts the transfer of Ama-terasu no Oho-kami from Toyo-suki-iri-hime
    to Yamato-hime, Yamato-hime's search for a place to enshrine the goddess, the
    goddess's choice of Ise as her dwelling, and the building of a shrine and Abstinence
    Palace there. It also gives an alternate account of Yamato-hime as the Emperor's
    assistant in service to Ama-terasu, followed by a divine admonition from the Great
    God of Yamato about a primordial covenant, proper ritual worship, divination to
    appoint an officiant, and the substitution of a sacrificer when the chosen woman
    is physically unable to perform the rite.
  language: English
  quote_policy: summarized
