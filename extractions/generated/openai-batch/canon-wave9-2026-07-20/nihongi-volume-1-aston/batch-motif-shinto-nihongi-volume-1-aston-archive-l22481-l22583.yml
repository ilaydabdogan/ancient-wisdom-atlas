canonical_text:
  quote: ''
  summary: 'The passage gives annalistic notices for Emperor Ohoke/Ninken: his recovery
    and appointment as Prince Imperial, his accession at Isonokami, variant palace
    notices, appointment of Kasuga no Oho-iratsume as Empress with genealogy and children,
    burial of Emperor Woke, the self-inflicted death of Empress Naniha no Wono after
    feared punishment for disrespectful service, and administrative notices concerning
    palace attendants, prisoners, and the Saheki Be.'
  language: English
