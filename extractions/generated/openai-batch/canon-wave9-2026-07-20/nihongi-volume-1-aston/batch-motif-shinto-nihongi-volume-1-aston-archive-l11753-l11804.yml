canonical_text:
  quote: ''
  summary: Yamato-dake no Mikoto reports that he subdued the Kumaso and killed harmful
    ferry deities whose poisonous vapour plagued travellers, thereby opening land
    and water routes. The Emperor commends him. Later, rebellion and turbulent deities
    trouble the eastern frontier; the Emperor asks whom to send, Yamato-dake names
    Oho-usu, and Oho-usu hides in fear.
  language: English
  quote_policy: summarized
