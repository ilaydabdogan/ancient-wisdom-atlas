  summary: The passage reports the conclusion of a divine mission, the descent of
    the August Grandchild from Heaven to Takachiho, his search for and occupation
    of a country, his encounter with Ka-ashi-tsu-hime, their union, her one-night
    pregnancy, his doubt of the child, and her entrance into a doorless muro with
    a fire-based declaration about the child's paternity.
