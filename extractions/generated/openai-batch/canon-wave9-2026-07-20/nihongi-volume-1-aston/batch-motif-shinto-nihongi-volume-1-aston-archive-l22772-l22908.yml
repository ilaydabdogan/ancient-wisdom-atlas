canonical_text:
  quote: ''
  summary: The passage recounts an eldest son or prince going to an assignation with
    Kagehime at Tsubaki-ichi after an official delays sending horses. At the gathering,
    among song-makers, the prince takes Kagehime’s sleeve, but Shibi no Omi pushes
    him away and stands between them. The prince and Shibi exchange songs using images
    of sea current, tunny-fish, fences, a sword, an earthquake, and a pearl. Translator
    notes identify the setting as an uta-gaki or poetical tournament, explain wordplay,
    and compare the episode with a different Kojiki account.
  language: English
  quote_policy: summarized
