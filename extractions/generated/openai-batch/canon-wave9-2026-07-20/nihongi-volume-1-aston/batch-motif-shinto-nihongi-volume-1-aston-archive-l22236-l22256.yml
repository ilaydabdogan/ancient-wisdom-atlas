  quote: ''
  summary: The passage includes a royal speaker calling himself Son of Heaven and
    expressing a desire to demolish a misasagi. A note explains that executioners
    and cemetery watchmen called Hinin, or “not-man,” had their names erased from
    census registers because they were considered to belong to the service of the
    dead rather than the living. Another note says most misasagi had one to five guardians’
    houses allotted to them.
