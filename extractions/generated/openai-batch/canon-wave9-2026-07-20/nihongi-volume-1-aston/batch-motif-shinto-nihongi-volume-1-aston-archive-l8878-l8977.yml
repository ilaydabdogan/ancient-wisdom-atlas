canonical_text:
  quote: ''
  summary: The passage introduces Emperor Mimaki-iri-biko-i-niye, later Sujin Tennō,
    gives his parentage, virtues, accession, consorts, children, removal of the capital,
    and an imperial decree grounding rule in ancestral inheritance and the regulation
    of men and spirits. It then records pestilence, rebellion, the emperor’s appeal
    to the Gods of Heaven and Earth, and the prior worship of Ama-terasu no Oho-kami
    and Yamato no Oho-kuni-dama together in the Great Hall before Ama-terasu is entrusted
    to Toyo-suki-iri-bime no Mikoto for worship elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mimaki-iri-biko-i-niye is identified as the second child of Emperor Waka-yamato-neko-hiko-oho-hi-hi;
    his mother Ika-shiko-me is described as daughter of Oho-he-so-ki no Mikoto, ancestor
    of the Mononobe House.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mimaki-iri-biko-i-niye was made Prince Imperial at nineteen and is described
    as intelligent, cultured, circumspect, and profoundly honoring the Gods of Heaven
    and Earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the death of Waka-yamato-neko-hiko-oho-hi-hi, the Prince Imperial assumed
    the Imperial Dignity; the passage also records the honoring of his mother, the
    appointment of Mimaki-hime as Empress, and lists offspring by the Empress and
    consorts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the third year the capital was removed to Shiki and was called the Palace
    of Midzu-gaki.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a decree, the Emperor says the Imperial ancestors assumed Supreme Rank
    in order to shepherd men and spirits and regulate the Empire, and he calls on
    ministers and functionaries to cooperate loyally in bringing peace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the fifth year there was widespread pestilence and more than half the people
    died; in the sixth year the people took to vagabondage and rebellion became violent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In response to the crisis, the Emperor rose early, remained in awe until evening,
    and requested punishment from the Gods of Heaven and Earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ama-terasu no Oho-kami and Yamato no Oho-kuni-dama had been worshipped together
