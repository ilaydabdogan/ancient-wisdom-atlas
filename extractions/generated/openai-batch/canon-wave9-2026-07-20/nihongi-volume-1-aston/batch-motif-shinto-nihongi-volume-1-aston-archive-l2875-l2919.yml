- id: obs:1
  text: Female deities are produced from breath after parts of jewels are bitten through
    and blown away; Ta-gori-hime no Mikoto is associated with Naka-tsu miya, and Tagi-tsu-hime
    no Mikoto with He-tsu miya.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sosa no wo no Mikoto makes his sword float on the surface of the True-Well
    of Heaven, bites off the end, blows it away, and five male deities are produced
    from his breath.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In an alternate writing, the Sun-Goddess and Sosa no wo no Mikoto stand opposite
    one another, separated by the Tranquil River of Heaven.
  category: setting
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:4
  text: The Sun-Goddess establishes a covenant saying that if Sosa no wo has no traitorous
    heart, the children he produces will be male; if they are male, she will consider
    them her children and cause them to govern the Plain of Heaven.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
