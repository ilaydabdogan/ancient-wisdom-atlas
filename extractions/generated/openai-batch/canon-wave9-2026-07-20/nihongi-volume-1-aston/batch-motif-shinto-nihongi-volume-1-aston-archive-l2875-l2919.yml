canonical_text:
  quote: ''
  summary: The passage gives variant accounts of deities generated when jewels or
    swords are bitten, eaten, blown away, or held. It names female and male deities
    produced in these ways, describes a covenant between the Sun-Goddess and Sosa
    no wo across the Tranquil River of Heaven, and states that male children would
    show lack of treachery and be treated as the Sun-Goddess's children to govern
    the Plain of Heaven.
  language: English
  quote_policy: summarized
