canonical_text:
  quote: ''
  summary: The passage recounts the Emperor distributing flesh and sake to soldiers,
    a Kume song, and a progress through Yoshino where several unusual local figures
    identify themselves as ancestral beings. It then describes the Emperor's ascent
    of Mount Takakura to survey enemy forces and a dream in which a Heavenly Deity
    instructs him to perform a ritual using earth from the shrine of Heavenly Mount
    Kagu, heavenly platters, sacred jars, sacrifice, and imprecation.
  language: English
  quote_policy: summarized
