canonical_text:
  quote: ''
  summary: The passage describes a country southeast of the capital beyond a mountain,
    whose people dwell by the River Yoshino amid difficult terrain and begin visiting
    Court frequently with local produce. It then records the immigration of Achi no
    Omi and his son Tsuga no Omi with people from seventeen districts. Later, the
    Emperor travels to Naniha, ascends a lofty tower, and asks his concubine Yehime
    why she laments while looking west. Yehime says she longs for her parents and
    asks to return to see them; the Emperor approves her filial feeling.
  language: English
  quote_policy: summarized
