canonical_text:
  quote: ''
  summary: The passage recounts fire-associated births from a burning muro, the death
    and burial of Ama-tsu-hiko hiko-ho-no-ninigi, and an alternate account in which
    Ama-terasu sends Ame-waka-hiko to subdue the Central Land of Reed-Plains. Ame-waka-hiko
    delays, marries daughters of Earthly Deities, kills a pheasant messenger with
    a heavenly arrow, and is killed when the arrow is returned from Heaven under a
    conditional curse. His body is mourned in Heaven; Aji-suki-taka-hiko-ne, who resembles
    him, is mistaken for him, cuts down the mourning house, and the fallen structure
    becomes Mount Mourning. Songs then celebrate Aji-suki-taka-hiko-ne’s radiance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed female figure sets fire to a muro, and three children are born
    in sequence in relation to smoke and heat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three children are named Ho no Susori no Mikoto, Hiko-ho-hodemi no Mikoto,
    and Ho no akari no Mikoto; two are associated with later ancestral lines.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note identifies the muro in this passage as an ubu-ya or parturition-house
    and describes it as a temporary hut used for confinement.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ama-tsu-hiko hiko-ho-no-ninigi no Mikoto dies and is buried in the Misasagi
    of Hiuga no ye in Tsukushi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ama-terasu no Oho-kami commands Ame-waka-hiko to go first to the Central Land
    of Reed-Plains, described as the region for her child to rule, and to subdue rebellious
    deities there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ama-terasu gives Ame-waka-hiko the Heavenly deer-bow and Heavenly true-deer-arrows
    before dispatching him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After receiving the command, Ame-waka-hiko descends, marries many daughters
    of Earthly Deities, and makes no report for eight years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Omohi-kane no Kami advises sending a pheasant to inquire into Ame-waka-hiko’s
    delay.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pheasant flies down, perches on a many-branched cassia-tree before Ame-waka-hiko’s
    gate, and asks why he has made no report for eight years.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ama-no-sagu-me sees the pheasant, calls it a bird of evil cry, and says it
    should be shot and killed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ame-waka-hiko shoots the pheasant with the heavenly bow and arrow; the arrow
    passes through the pheasant’s breast and reaches the place of the Heavenly Deity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Heavenly Deity recognizes the arrow, pronounces a conditional curse over
    it, flings it back, and the returning arrow kills Ame-waka-hiko.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage gives the returning-arrow episode as the reason for the saying,
    “Fear a returning arrow.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ame-waka-hiko’s wife and children take his dead body upward, make a mourning
    house in Heaven, deposit the body there, and lament.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Aji-suki-taka-hiko-ne no Kami, a friend of Ame-waka-hiko, ascends to Heaven
    to condole and is said to have an exact resemblance to the dead man.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Ame-waka-hiko’s wife and children mistake Aji-suki-taka-hiko-ne for their
    living lord and cling to his robe and girdle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Aji-suki-taka-hiko-ne becomes angry at being mistaken for a dead man, draws
    his ten-span sword, and cuts down the mourning house.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The mourning house falls to earth and becomes Moyama, Mount Mourning, in the
    province of Mino.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: Aji-suki-taka-hiko-ne’s glory is described as so effulgent that it illuminates
    the space of two hills and two valleys.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:20
  text: A song compares Aji-suki-taka-hiko-ne’s lustre to jewels associated with the
    Heavenly Weaving-maiden.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:21
  text: An alternate explanation says Aji-suki-taka-hiko-ne’s younger sister, Shita-teru-hime,
    made the song to identify him to the company.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:22
  text: A second poem invokes a side-pool of a rocky stream, country wenches, and
    the spreading of a net; both poems are described as Rustic measure.
  category: speech
  evidence_refs:
  - ev:13
