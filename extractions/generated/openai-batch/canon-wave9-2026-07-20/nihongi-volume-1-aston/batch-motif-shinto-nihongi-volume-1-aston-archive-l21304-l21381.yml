canonical_text:
  quote: ''
  summary: Ohotomo no Muruya invokes the dying injunctions of Emperor Ohohatsuse,
    joins with Yamato no Aya no Tsuka to besiege and burn the Treasury, and Imperial
    Prince Hoshikaha and several companions are killed. Wone escapes the fire, gains
    pardon through Ayahiko, and gives rice-land in return. The Omi of Upper Kibi arrive
    by sea with forty war vessels to aid Hoshikaha but turn back after hearing of
    his death, and the Emperor punishes them. Muruya and other nobles deliver the
    Seal to the Prince Imperial; the Emperor assumes imperial dignity, establishes
    his palace, and assigns ranks. Emperor Ohohatsuse is buried, and the Hayato mourn
    at the tomb, refuse food, die after seven days, and are buried nearby.
  language: English
  quote_policy: summarized
