- id: obs:3
  text: Fishermen of several places noisily refused obedience to an Imperial command;
    Ohohama no Sukune was sent to subdue the clamour and was made controller of the
    fishermen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Because King Sinsa of Pékché was described as disrespectful to the Celestial
    Court, four envoys were sent; the people of Pékché slew Sinsa and the envoys established
    Ahwa as king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The provinces were directed to establish Be of fishermen and Be of mountain
    wardens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The province of Idzu was charged with constructing a ship ten rods in length;
    after launch it floated lightly and swiftly and was called Karano.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Emperor made a progress to Afumi and, near the Moor of Uji, made a song
    describing the visible house-places and the land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Men of Koryo, Pékché, Imna, and Silla attended the Court and were ordered
    under Takechi no Sukune to dig a pond, which was named for the men of Han.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Pékché record says King Ahwa was disrespectful to the honourable country,
    that several territories were taken, and that Prince Chik-chi was sent to restore
    former friendship.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Takechi no Sukune was sent to Tsukushi to inspect the people, and his younger
