canonical_text:
  quote: ''
  summary: Chronicle entries for A.D. 274-275 record clan ancestries, tribute and
    labor by Eastern Yemishi, control of disobedient fishermen, diplomatic action
    toward Pékché and the installation of Ahwa as king, establishment of occupational
    Be, construction and naming of a swift ship, an imperial progress with a song,
    attendance by men from several peninsular polities and their digging of a pond,
    a Pékché record about restoring friendship, and the beginning of Umashi no Sukune's
    slander against Takechi no Sukune.
  language: English
  quote_policy: summarized
