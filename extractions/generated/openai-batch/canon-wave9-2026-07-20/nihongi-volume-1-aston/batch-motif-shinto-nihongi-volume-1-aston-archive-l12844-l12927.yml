canonical_text:
  quote: ''
  summary: An unnamed god tells the Emperor that the Kumaso will surrender if specified
    offerings are made. The Emperor doubts the divine message after seeing only sea
    from a high hill. The god, speaking through the Empress, says a distant country
    is visible like a reflection from Heaven in water and declares that the unbelieving
    Emperor will not possess it, but the Empress's unborn child will. The Emperor
    attacks the Kumaso, fails, and dies. The Empress and ministers conceal his death,
    move the body by sea, and give it a secret fireless temporary burial because of
    the expedition against Silla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The god states that the Kumaso will surrender and names the Emperor’s ship
    and the water-fields called Ohota as offerings to be given in worship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Emperor doubts the god’s words, climbs a high hill, looks into the distance,
    and sees ocean but no land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Emperor asks whether there can be a country in the Great Void and accuses
    the god of cheating him with vain illusions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The god speaks again by the mouth of the Empress and says the country appears
    outstretched like a reflection from Heaven in the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The god declares that because the King refuses belief, he will not possess
    the land, while the child newly conceived by the Empress will obtain it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Emperor remains incredulous, attacks the Kumaso, and retreats without
    victory.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Emperor becomes suddenly ill and dies; an alternate version says he was
    slain by an enemy’s arrow while attacking the Kumaso.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Empress and Prime Minister Takechi no Sukune suppress mourning for the
    Emperor and prevent news of his death from becoming known to the Empire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Emperor’s body is secretly removed, entrusted to Takechi no Sukune, transported
    by sea to Anato, and temporarily buried at the Palace of Toyora in a fireless
    temporary burial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Prime Minister returns from Anato and reports to the Empress; the year’s
