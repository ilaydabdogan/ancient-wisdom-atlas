canonical_text:
  quote: ''
  summary: An imperial prince flees with Imperial Princess Medori toward Ise. The
    Emperor orders Wofuna and Aganoko to pursue and kill them, while the Empress asks
    that Medori's body not be exposed and that her jewels not be taken. The fugitives
    narrowly escape at Mount Soni and cross the mountain, where the prince sings of
    crossing it with his beloved. The pursuers kill them at Komoshiro in Ise, take
    Medori's jewels from her undergarments, bury the bodies by the River Ihoki, and
    deny seeing the jewels when questioned. Later, at a first-rice festival banquet,
    excellent jewels appear on the hands of two named women.
  language: English
  quote_policy: summarized
