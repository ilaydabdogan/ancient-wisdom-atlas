canonical_text:
  quote: When the Emperor was born, a supernatural radiance filled the building.
  summary: The passage reports that Mikoto was appointed Empress and loved by the
    Emperor; that Nakashi hime bore Prince Mayuwa to Imperial Prince Ohokusaka and
    Mayuwa was spared and raised in the palace; that the Emperor was assassinated
    by Mayuwa and later buried; and that Emperor Oho-hatsuse Wakatake was born amid
    supernatural radiance and grew into a strong man. It also describes Emperor Anaho
    at the Mountain Palace, where he takes leisure, orders sake and a banquet, and
    speaks to the Empress about royal family relationships.
  language: English
