canonical_text:
  quote: "“Alas! my wife!”"
  summary: Yamato-dake no Mikoto returns through several lands to Kahi and resides
    at Sakawori palace. At night, after a light is kindled and food is served, he
    asks in song how many nights have passed since Tsukuba and Nihibari; a man in
    charge of the lights answers in song and is rewarded. Yamato-dake grants the Yuki
    Be to Take-hi, speaks of remaining disobedient regions, travels toward Usuhi-saka,
    remembers Oto-tachibana-hime, laments her from the summit of Usuhi, and the eastern
    provinces receive the name Adzuma. He sends Kibi no Takehiko to inspect the route
    and people of Koshi.
  language: English
  quote_policy: quoted
