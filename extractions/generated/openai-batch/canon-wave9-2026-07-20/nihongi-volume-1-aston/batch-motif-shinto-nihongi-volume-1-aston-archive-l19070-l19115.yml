canonical_text:
  quote: ''
  summary: Anaho acts on Ne no Omi's slander by killing the Imperial Prince Ohokusaka
    and appointing Nakashi hime Empress. Prince Mayuwa overhears Anaho say he fears
    him, and later kills Anaho while he sleeps drunk with his head on the Empress's
    knees. A retainer reports the murder to the Emperor identified in a note as Yiriaku.
    The Emperor arms himself, suspects his elder brothers, questions Imperial Princes
    Yatsuri no Shiro-hiko and Sakahi no Kurohiko, kills Yatsuri, and examines Mayuwa.
    Mayuwa says he sought only revenge on his father's enemy, not the Celestial Dignity.
    Sakahi and Mayuwa secretly communicate and flee to the house of the Oho-omi Tsubura.
  language: English
  quote_policy: summarized
