canonical_text:
  quote: ''
  summary: The Emperor seeks Otohime after the Empress has offered or given her to
    him. Otohime, living with her mother at Sakata in Afumi, refuses repeated summons
    because she fears the Empress's feelings. The Emperor sends Ikatsu no Omi to bring
    her; Ikatsu prostrates himself in her courtyard and persists for seven days. Otohime
    finally comes with him to avoid causing the ruin of the faithful servant, and
    on the journey she gives him sake by the well of Ichihi.
  language: English
  quote_policy: summarized
