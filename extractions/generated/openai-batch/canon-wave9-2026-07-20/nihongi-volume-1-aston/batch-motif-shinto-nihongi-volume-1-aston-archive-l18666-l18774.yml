canonical_text:
  quote: ''
  summary: The passage recounts the banishment of Karu no Iratsume to Iyo and the
    Heir Apparent's songs of exile, return, bed taboo, spouse, and suppressed weeping.
    It then records the Emperor's death and burial, a Silla mourning and tribute mission,
    and a later misunderstanding in which Silla envoys' affection for nearby mountains
    is misheard as a reference to court women, leading to imprisonment, release, and
    reduced tribute.
  language: English
  quote_policy: summarized
