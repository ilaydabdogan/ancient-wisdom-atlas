canonical_text:
  quote: ''
  summary: The Emperor appoints Prince Mata/Mute, a son of Prince Konchi, to reign
    over another country, gives him weapons and an escort of 500 Tsukushi soldiers,
    and the prince becomes King Tong-syéng. The passage then notes increased tribute
    from Pékché and a naval attack on Koryé. Later the Emperor becomes gravely ill,
    delegates administrative powers to the Prince Imperial, bids farewell to officials,
    dies in the Great Hall, and leaves a final command invoking ordered rule, submission
    of outsiders, distant war, and the will of Heaven. Embedded notes compare the
    succession notice with entries from the Tongkam.
  language: English
  quote_policy: summarized
