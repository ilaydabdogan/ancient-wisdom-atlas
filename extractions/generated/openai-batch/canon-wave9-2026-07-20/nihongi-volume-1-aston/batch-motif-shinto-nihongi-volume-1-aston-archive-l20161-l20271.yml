canonical_text:
  quote: a God warned him, saying:—'Go not.'
  summary: In the reign of Yuryaku, Katabu and an Uneme are sent to sacrifice to the
    Deity of Munagata, but Katabu violates the Uneme at the ritual place and is later
    hunted down and slain by imperial order. The Emperor wishes to campaign personally
    against Silla, but a god warns him not to go, so he appoints generals and frames
    the expedition as Heaven's punishment. Ki no Woyumi receives Ohomi as an attendant
    after reporting his wife's death, and the army enters Silla, where Tok is reduced,
    enemy and allied commanders die, and a follower searches for his fallen master.
  language: English
  quote_policy: quoted
