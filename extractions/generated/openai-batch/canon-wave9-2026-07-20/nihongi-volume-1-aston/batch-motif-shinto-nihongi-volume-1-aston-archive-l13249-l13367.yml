canonical_text:
  quote: ''
  summary: The passage describes a sea expedition from Wani to Silla aided by wind,
    waves, and sea creatures. The King of Silla fears the encroaching sea and the
    approaching fleet, identifies the force as belonging to divine Nippon and its
    Tenno, and submits with oath-bound tribute. The Empress refuses to kill him because
    he has submitted, takes possession of records and treasure, plants her spear as
    a memorial, and receives a hostage and eighty vessels of tribute. The passage
    also contains notes on names and white egg-shaped stones from an adjacent context.
  language: English
  quote_policy: summarized
