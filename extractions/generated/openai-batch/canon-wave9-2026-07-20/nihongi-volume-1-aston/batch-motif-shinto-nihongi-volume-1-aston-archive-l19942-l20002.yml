canonical_text:
  quote: "“slew her husband, and wedded her himself”"
  summary: The passage recounts that the Emperor kills Ke-hime’s husband and marries
    her; Tasa, learning this, goes to Silla for aid. The Emperor orders Otokimi and
    Akawo to chastise Silla, while Kwan-in Chiri advises obtaining more skilled artisans
    from Han through Pékché. Otokimi travels toward Pékché, encounters a country god
    in the form of an old woman who says the destination is one day farther, and returns
    without chastising Silla, then gathers tribute artisans and waits on a large island.
  language: English
