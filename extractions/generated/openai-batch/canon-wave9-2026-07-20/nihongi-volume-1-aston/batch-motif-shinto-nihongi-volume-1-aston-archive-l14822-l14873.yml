canonical_text:
  quote: ''
  summary: A charge of treason leads the Emperor to send messengers to kill Takechi
    no Sukune. Takechi protests his loyalty. Maneko, who strongly resembles him, urges
    him to escape to court and then kills himself in Takechi's place. Takechi travels
    secretly by sea to the Court and explains his innocence. Because Takechi and Umashi
    no Sukune dispute the matter and the Emperor cannot determine right and wrong,
    an ordeal by boiling water is ordered before the Gods of Heaven and Earth. Takechi
    wins the ordeal, overthrows Umashi with a cross-sword, but releases him at the
    Emperor's command.
  language: English
  quote_policy: summarized
