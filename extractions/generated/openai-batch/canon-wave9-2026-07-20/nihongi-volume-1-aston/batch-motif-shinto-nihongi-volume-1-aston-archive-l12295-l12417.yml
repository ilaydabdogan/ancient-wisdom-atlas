canonical_text:
  quote: ''
  summary: The passage reports that a group of Yemishi placed near Mount Mimoro cut
    the trees of the sacred mountain, disturbed neighboring villages, and were moved
    outside the home provinces by imperial command. It then gives genealogical notices
    for Yamato-dake no Mikoto's consorts and children, including founders of named
    houses. The Empress Harima no Oho-iratsume dies and Ya-saka-iri-hime is appointed
    Empress. The Emperor tours eastern regions connected with Prince Wo-usu, receives
    a clam dish prepared by Ihaka Mutsukari, and grants a steward group. Later Prince
    Hiko-sajima is appointed over eastern provinces, dies before arrival, and is secretly
    buried in Kodzuke by eastern people; Prince Mimoro-wake is then commanded to complete
    his father's governorship.
  language: English
  quote_policy: summarized
