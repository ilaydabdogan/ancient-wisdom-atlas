canonical_text:
  quote: "“The Prince must therefore make the people the foundation.”"
  summary: The passage presents Emperor Nintoku abolishing forced labor for three
    years so the people may rest, while his own palace, clothing, food supplies, and
    treasury are left unrepaired or unrenewed. The palace decays, but seasonal weather,
    abundant grain, and thick cooking smoke indicate popular prosperity. In a dialogue
    with the Empress, the Emperor argues that a ruler exists for the people and that
    the people’s prosperity is the ruler’s prosperity. Later, service groups are established
    for an imperial prince and the Empress, and the provinces petition that after
    three years of labor remission the people have abundance though palace and treasury
    have declined.
  language: English
  quote_policy: quoted
