canonical_text:
  quote: ''
  summary: A speaker explains that a jewel head-dress had been presented by Prince
    Oho-kusaka when she was offered to the Emperor, leading the Emperor to confront
    Ne no Omi. Ne no Omi admits fault, is excluded with his kin from ministerial office,
    flees, builds a rice-castle, and is slain. His descendants are reassigned into
    service groups, while a title is granted to a descendant of Hikaka. Later Wone
    no Omi boasts of his father's stronger castle and is executed after verification.
    A following entry states that the Hada House was dispersed and that service control
    was disputed among Omi, Muraji, and Hada no Miyakko.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker identifies the jewel head-dress as a presentation made by her
    elder brother, Prince Oho-kusaka, when she was offered to the Emperor under orders
    of Emperor Anaho.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says this caused her to suspect Ne no Omi and to weep with grief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Emperor becomes astonished and angry, confronts Ne no Omi, and Ne no Omi
    admits fault and says he deserves death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Emperor orders that Ne no Omi, his children, descendants, and connections
    should no longer have any concern with the order of Ministers of State.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ne no Omi flees and hides; at Hine he makes a rice-castle, stands on the defensive,
    and is ultimately slain by Government forces.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Officials divide Ne no Omi''s descendants into two parts: one becomes common
    people of the Oho-kusaka Be allotted to the Empress, and the other becomes sack-bearers
    for the Chinu no Agata-nushi.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A descendant of Hikaka is sought out, granted a title, and made Oho-kusaka
    Be no Kishi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wone no Omi, son of Ne no Omi, says at night that the Emperor's castle is
    not strong but his father's castle is strong.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the Emperor hears Wone no Omi's words and has Ne no Omi's house inspected,
    Wone no Omi is seized and put to death; Ne no Omi's descendants are made Sakamoto
    no Omi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Hada House is dispersed; the Omi and Muraji enforce services as they please
    and do not allow the Hada no Miyakko to control them, leading Sake, Hada no Miyakko,
    to complain.
  category: sequence
  evidence_refs:
  - ev:5
