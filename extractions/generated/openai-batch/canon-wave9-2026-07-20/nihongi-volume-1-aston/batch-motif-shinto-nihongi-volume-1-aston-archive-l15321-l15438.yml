canonical_text:
  quote: |-
    Ye have seen face to face
    My spouse of Kibi.
  summary: Yehime is permitted to visit Kibi and is sent by ship with eighty fishermen
    from Mihara in Ahaji as sailors. The Emperor watches her ship from a high tower
    and sings to the islands of Ahaji and Adzuki as witnesses to his spouse of Kibi.
    He later hunts and travels through Ahaji, goes to Kibi and Adzuki, receives Mitomo
    wake's service, and divides Kibi districts among Mitomo wake's children, relatives,
    and Yehime, explaining local descent. A following notice records the death of
    a Pékché king, the succession of a child king, Mong-man-chi's administration and
    misconduct, the Emperor's summons, and a Pékché-record note on Mong-man-chi's
    parentage.
  language: English
  quote_policy: quoted
