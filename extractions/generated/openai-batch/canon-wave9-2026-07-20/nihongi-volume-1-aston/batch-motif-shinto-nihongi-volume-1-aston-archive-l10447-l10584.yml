canonical_text:
  quote: ''
  summary: The passage reports imperial inspection and custody of Idzumo divine treasures;
    divination concerning war implements as offerings to the gods; deposition of bows,
    arrows, and cross-swords in shrines; and seasonal sacrifices. It then narrates
    the death and burial of Yamato-hiko no Mikoto, whose personal attendants are buried
    alive at the tomb precinct and die there. The Emperor grieves at their suffering
    and orders counsel to stop the custom of following the dead. A later section has
    the Emperor ask two princes what they desire, granting one bow and arrows and
    naming the other successor to the Imperial Dignity. The passage also notes the
    death of Empress Hibasu-hime and includes translator/editorial comparisons concerning
    funeral human sacrifice.
  language: English
  quote_policy: summarized
