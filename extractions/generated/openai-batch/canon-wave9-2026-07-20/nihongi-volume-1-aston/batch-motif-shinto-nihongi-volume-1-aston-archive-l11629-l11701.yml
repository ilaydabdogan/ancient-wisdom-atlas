    made to sacrifice to Ama-terasu no Oho-kami.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the twenty-fifth year, Takechi no Sukune was commissioned to inquire into
    the geography of the northern and eastern circuits and the condition of their
    people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the twenty-seventh year, Takechi no Sukune returned from the East Country
    and reported to the Emperor about a country called Hitakami in the Eastern wilds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people of Hitakami are described as men and women who tie their hair in
