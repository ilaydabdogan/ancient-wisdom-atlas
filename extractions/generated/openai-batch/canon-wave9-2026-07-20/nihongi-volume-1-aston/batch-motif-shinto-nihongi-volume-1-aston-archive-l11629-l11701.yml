- id: obs:1
  text: Stewards left behind a drinking cup, and the place where it was forgotten
    was called Ukuha; the present name Ikuha is explained as a corruption, and Ukuha
    is said to have been an old Tsukushi word for a drinking cup.
  category: object
  evidence_refs:
  - ev:1
