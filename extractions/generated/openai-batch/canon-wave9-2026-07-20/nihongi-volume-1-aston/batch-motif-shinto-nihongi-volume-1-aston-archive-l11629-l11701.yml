canonical_text:
  quote: ''
  summary: 'The passage records annalistic events: a place-name is explained from
    a forgotten drinking cup; the Emperor returns from Hiuga; Princess Ihono is made
    to sacrifice to Ama-terasu no Oho-kami; Takechi no Sukune is sent to survey northern
    and eastern provinces and later reports on Hitakami and the Yemishi; the Kumaso
    rebel; and Yamato-dake no Mikoto is sent at age sixteen to attack them, recruiting
    archers and companions for the expedition.'
  language: English
  quote_policy: summarized
