canonical_text:
  quote: He assumed the form of a white deer and stood before him.
  summary: Yamato-dake no Mikoto crosses a difficult mountainous region in Shinano,
    encounters a mountain deity in white deer form, kills it with garlic, loses his
    way, and is guided out by a white dog. The passage explains later protective use
    of garlic against the deity's breath. He then returns to Ohari, takes Miyazu-hime
    as wife, hears of a savage deity on Mount Ibuki, leaves his sword at her house,
    goes on foot, and meets the mountain god in the form of a great serpent.
  language: English
  quote_policy: quoted
