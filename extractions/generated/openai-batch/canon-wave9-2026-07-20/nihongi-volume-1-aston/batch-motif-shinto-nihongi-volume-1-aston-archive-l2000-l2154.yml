canonical_text:
  quote: ''
  summary: The passage includes an editorial note on the word imo, then narrates Izanagi
    mourning Izanami; tears become a deity. Izanagi cuts Kagu-tsuchi with a sword,
    and the pieces and blood give rise to gods and rocks. Izanagi then enters Yomi
    to seek Izanami, who says she has eaten there and asks not to be looked upon.
    Izanagi uses a comb-tooth torch to look, sees her decayed condition, calls the
    land polluted, and flees. Izanami sends the Ugly Females of Yomi after him; he
    throws down a head-dress and a comb, which become grapes and bamboo-shoots eaten
    by the pursuers, before Izanami herself gives chase.
  language: English
  quote_policy: summarized
