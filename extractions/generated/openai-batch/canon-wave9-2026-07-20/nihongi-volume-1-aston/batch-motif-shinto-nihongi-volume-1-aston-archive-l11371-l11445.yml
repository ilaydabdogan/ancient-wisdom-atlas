canonical_text:
  quote: ''
  summary: The Emperor consults ministers on subduing the Kumaso without a damaging
    military campaign. A minister proposes using gifts and the daughters of a Kumaso
    brave to gain intelligence. Ichi-fukaya helps intoxicate and disarm her father,
    who is killed by an escorting soldier; the Emperor then executes her for unfilial
    conduct and gives Ichi-kaya to the Miyakko of Ki. After the Kumaso country is
    subdued, the Emperor resides at Takaya, takes Mihakashi-hime as concubine, and
    fathers Toyo-kuni-wake, named as ancestor of the Miyakko of Hiuga. Later he names
    Hiuga because it faces the Rising Sun and composes poetry after mounting a great
    stone.
  language: English
  quote_policy: summarized
