  quote: ''
  summary: The passage recounts Emperor Keikō’s travels in Tsukushi and nearby districts,
    including etymological explanations for the names Aso, Mike, and Yame. A huge
    fallen Kunugi tree is described as a bridge and declared divine by the Emperor.
    In another mountain district, a local official reports that a female deity, Yametsu-hime,
    dwells among the mountains.
