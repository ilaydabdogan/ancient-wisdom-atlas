canonical_text:
  quote: ''
  summary: A warning about treason and fear of imperial retaliation is sent to Otokimi;
    Kusuhime, his wife, kills and secretly buries him because she abominates the treason.
    The Emperor investigates Otokimi’s disappearance and orders the settlement and
    relocation of skilled Pékché/New Aya artisans. The passage then reports Silla’s
    failure to send presents, its alliance with Koryo, a Koryo guard’s threatening
    speech overheard by a Silla groom, a coded Silla order to kill cocks that results
    in killing resident Koryo men, and Koryo’s military response against Silla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A secret warning to Otokimi says the Emperor has married the sender’s wife
    and had children by her; the sender fears calamity and proposes that Otokimi go
    to Pékché and stop its communication with Japan while the sender holds Imna and
    also ceases communication with Japan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kusuhime, Otokimi’s wife, is described as patriotic and loyal; she abominates
    the treason, kills her husband stealthily, and secretly buries him in the chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kusuhime remains on the large island with Akawo, Ama no Atahe, in charge of
    skilled artisans presented by Pékché.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After hearing that Otokimi is missing, the Emperor sends messengers; the Pékché
    artisans are ultimately settled in Hirokitsu in Ato, Yamato, where many die of
    disease.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Emperor commands Muruya, Ohotomo no Ohomuraji, to have Tsukami, Yamato
    no Aya no Atahe, remove named groups of New Aya artisans to Upper Momohara, Lower
    Momohara, and Magami no Hara.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An alternate book says Otokimi returned from Pékché and presented groups of
    Aya workmen, tailors, and fleshers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Awo, Musa no Suguri, and Haka-toko, Hinokuma no Tami-tsukahi, are sent to
    the Country of Wu in the eighth year, second month.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Silla is described as refractory and not sending presents; Silla fears the
    Central Land, makes friendship with Koryo, and receives one hundred picked Koryo
    soldiers as guards.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Koryo soldier on furlough tells a Silla groom that the groom’s country will
    soon be conquered or become Koryo territory; the groom pretends belly pain, stays
    behind, escapes to Silla, and reports the speech.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The King of Silla sends messengers instructing the people to kill the cocks
    kept in their houses; the people understand and kill the resident men of Koryo,
    except for one who escapes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A note explains that the name Kokuryé resembles an onomatopoeic word for the
    crowing of a cock.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: The lone Koryo survivor returns home and reports the events; the King of Koryo
    raises an army and encamps by a city named Chhyukchong-nyu, with an alternate
    reading giving Tokushūki.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Koryo army makes music with song and dance; the King of Silla hears singing
    and dancing at night on all sides, concludes that the enemy has occupied all Silla,
    and appeals to the King of Imna.
  category: sequence
  evidence_refs:
  - ev:12
