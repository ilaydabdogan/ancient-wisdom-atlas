canonical_text:
  quote: ''
  summary: 'The passage describes an Omaha chieftainship admission procedure: after
    a favorable decision, chiefs carry the Sacred Pipes to the elected man''s lodge,
    where he may refuse or accept. Acceptance is marked by smoking the pipes and by
    chiefs entering with the pipes and passing around his fireplace, signifying his
    membership in the Ni''kagahi xu''de order. The passage then explains eligibility
    for the Ni''kagahi sha''be order through graded acts and begins listing the first
    grade, which requires procuring materials for an official staff used by the leader
    of the annual buffalo hunt.'
  language: English
  quote_policy: summarized
