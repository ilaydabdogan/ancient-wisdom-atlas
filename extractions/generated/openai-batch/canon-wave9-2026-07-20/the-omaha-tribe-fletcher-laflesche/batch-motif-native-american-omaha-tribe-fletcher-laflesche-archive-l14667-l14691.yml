canonical_text:
  quote: ''
  summary: Chiefs send runners to inspect a tree seen burning while standing at night.
    After council, men prepare as for battle, run to the tree near a lake, strike
    it as an enemy, cut it down, and carry it to the village. Chiefs sing and deliberate
    for four nights, house the tree in a tent, trim and personify it, attach ritual
    objects and a scalp lock, paint it, set it before the tent on a crotched staff,
    and summon the people to see the Pole.
  language: English
  quote_policy: summarized
