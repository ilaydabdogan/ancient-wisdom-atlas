canonical_text:
  quote: ''
  summary: During a buffalo hunt, signs of an unknown tribe lead Omaha leaders to
    assemble a council, select young men as scouts, summon them through a herald with
    the Sacred Pack to War, administer a silent pipe-smoking oath, warn them to report
    truthfully under penalty from unseen powers, provision them, and send them out
    in small groups to examine the surrounding country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a buffalo hunt, observed trail signs of an unknown tribe are reported
    through a chain of authority to the Seven Chiefs, the keeper of the Tent of War,
    and a council of leading We'zhinshte men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council selects certain young men of the tribe, described as sons of leading
    warriors, to act as scouts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The herald appears in ceremonial attire, wearing a robe with the hair outside
    and a downy eagle feather fastened to his scalp lock.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The herald plants a crotched pole in front of the tent door and hangs the
    Pack Sacred to War on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The herald calls each selected young man by name and commands him to come
    examine the land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the herald's voice, the camp becomes silent, children are hushed or taken
    into tents, and people listen for the herald's words.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Summoned men hurry to the Tent Sacred to War without stopping to paint or
    ornament themselves; if a called person is considered too young, his father responds
    instead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Those summoned enter the tent and sit in a circle.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two Pipes Sacred to War have red catlinite bowls and decorated wooden stems;
    one stem bears skin strips and elk hair, and the other is painted red and black
    in sections.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that the red and black blocks on one pipe stem symbolize
    night and day, death and life, and are similar in significance to blocks on the
    He'dewachi pole.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The pipes are filled from tobacco kept in an elk-skin bag while the war ritual
    is recited, though the text states that this ritual has been lost.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The pipes are passed around the circle in a specified order; the oldest men
    sit where they receive the pipes first, and the smoking is silent and obligatory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The text says the required smoking is equivalent to taking an oath to obey
    custom and do one's duty even at risk of life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A leading We'zhinshte man warns the scouts to make truthful reports because
    unseen powers hear their words and punish falsehood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Threatened consequences for an untruthful report include being struck by lightning,
    bitten by a snake, injured in the foot by a sharp object, or killed by the enemy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the charge, the young men receive food packed in bladder bags and extra
    moccasins, then depart in small groups to scout in all directions for a radius
    of 10 or 15 miles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Young men of the tribe are instructed by the herald to wear their blankets
    in a given manner so they will not be mistaken for spies.
  category: action
  evidence_refs:
  - ev:7
