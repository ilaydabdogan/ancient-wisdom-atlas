literal_observations:
- id: obs:1
  text: At council meetings, the men sat in a semicircle, with the two principal chiefs
    seated side by side behind the fireplace, facing east and the lodge entrance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The two principal chiefs represented the two halves of the hu''thuga: the
    Hon''gashenu on the right toward the south and the Inshta''cunda on the left toward
    the north.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other council members sat according to the order of their counts, and positions
    changed only under specified conditions such as death, resignation, or vacancies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A question or plan was passed from member to member around the circle repeatedly
    until all agreed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The council's unity of decision was regarded as having supernatural power
    and authority.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old men explained that council members had been made chiefs by the Sacred
    Tribal Pipes, which were from Wakon'da.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the chiefs had deliberated and smoked, their decision was described as
    the word of Wakon'da.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The keeper of the Sacred Pipes laid them before the two principal chiefs,
    and the keeper of the ritual filled them with native tobacco while intoning the
    ritual in a low voice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The keeper had to prevent either Pipe from falling; if a Pipe fell, the council
    meeting ended and the keeper's life was in danger from supernatural powers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Pipes were held for the two principal chiefs and then passed around the
    council so that each member could smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old men said that the seven must have one heart and speak as with one
    mouth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the council reached a conclusion, a herald proclaimed the decision around
    the camp circle, and no one dared dispute it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Council of Seven maintained internal peace and order, made peace with
    other tribes, secured allies, determined the annual buffalo hunt time, and confirmed
