canonical_text:
  quote: ''
  summary: 'The passage describes how traders introduced manufactured metal implements
    to the Omaha, displacing many older stone, bone, and elk-derived tools in daily
    life. It also notes ceremonial continuities: early red-handled knives remained
    required gifts in tattooing, and the ancient flint knife continued to be used
    in tribal rites, including cutting a male child''s hair during consecration to
    Thunder and bleeding for curative purposes.'
