  summary: The passage describes Omaha warrior dress and restrictions, including a
    war leader's tied robe strings, battle clothing, a wolfskin war robe associated
    with Zhinga/gahige, black face paint after an enemy is killed, the occasional
    presence and duties of wives in war parties, and a wolf song that depicts a younger
    sister following warriors with her share of spoils.
