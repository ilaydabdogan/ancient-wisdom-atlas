    but does not provide detailed rites for the Omaha gens in this excerpt.
- id: claim:2
  claim: The cedar-thunder association is presented as recurring among cognate tribes,
    including Osage and Omaha examples named by the authors.
  claim_level: same_motif
  target: Cedar associated with thunder rites in cognate tribes
  evidence_refs:
