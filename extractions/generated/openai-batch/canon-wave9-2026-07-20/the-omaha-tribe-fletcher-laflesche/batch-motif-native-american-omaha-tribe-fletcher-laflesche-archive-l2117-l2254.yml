    of the Omaha.
  claim_level: visual_similarity
  target: Buffalo-gens child hair cuts in Oto and Omaha traditions
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports visual resemblance and suggests a possible tabu
    connection, but the broader ritual function is not fully described here.
