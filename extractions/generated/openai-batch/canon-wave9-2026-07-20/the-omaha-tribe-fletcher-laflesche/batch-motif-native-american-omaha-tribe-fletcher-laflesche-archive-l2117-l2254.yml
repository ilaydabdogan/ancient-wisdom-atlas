canonical_text:
  quote: ''
  summary: The passage describes rites, tabus, symbolic hair cuts, arrow markings,
    ritual duties, and associated objects of Ponca gentes, especially the Waça'be
    and Thi'xida. It links the Waça'be Hi'cada subgens with thunder, birds, eagle
    identity, cedar, death in thunder villages, and a prohibition on climbing trees.
    It also describes a diagram of Ponca gentes and subgentes with tabus, including
    bear, birds, blood, puma, deer, buffalo, snake, and ice associations. For the
    Thi'xida gens, the passage describes war-honor truth-testing packs, rights in
    chiefly elections, peace-pipe and puma tent paintings, puma-skin pipe coverings,
    color terms, arrow markings, and a child's symbolic hair cut compared with buffalo-gens
    hair cuts among Oto and Omaha.
  language: English
  quote_policy: summarized
