- id: motif:2
  label: ritual prohibition against upward movement to avoid premature death
  taxonomy_refs: []
  basis: The passage says climbing trees was forbidden because going upward would
    anticipate death and shorten life.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is described as a gens prohibition rather than a narrative episode.
- id: motif:3
  label: thunder rites associated with cedar and eagle or birds
  taxonomy_refs: []
  basis: The passage links the Hi'cada bird tabu and Eagle-group identity with thunder,
    and also states that cedar was associated with thunder rites in cognate tribes.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The cedar association is partly supported through cross-references named
    in the passage rather than by a full rite described here.
- id: motif:4
  label: serpent renewal through shed skin
  taxonomy_refs:
  - serpent
  basis: The diagram explanation says a Wazha'zhe name refers to the snake after shedding
    old skin and again being in full power, while another refers to cast-off snake
    skin.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage uses the image to explain names and tabus; it does not tell
    a serpent myth.
- id: motif:5
  label: ritual object tests truth before conferring war honors
  taxonomy_refs: []
  basis: The Thi'xida gens owned a pack used to test the truth of warriors when they
    were accorded war honors.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The specific testing procedure is not described in this passage.
- id: motif:6
  label: peace-giving covered pipe associated with animal covering
  taxonomy_refs: []
  basis: The passage interprets the subgens name as referring to those who dwell with
    the covered pipes that give peace, and states that puma skin covered the pipes.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The larger Wa'wa ceremony is only cross-referenced, not described here.
- id: motif:7
  label: symbolic child hair cuts as gens identity markers
  taxonomy_refs:
  - initiation
  basis: The passage describes distinct symbolic child hair cuts for the Waça'be and
    Thi'xida gentes and compares the Thi'xida cut with buffalo-gens hair cuts in Oto
    and Omaha groups.
  evidence_refs:
  - ev:6
  - ev:14
  confidence: medium
  cautions: The passage calls the cuts symbolic but does not explicitly describe an
    initiation ceremony.
