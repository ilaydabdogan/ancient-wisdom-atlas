  summary: The passage describes an Omaha pack received by the writers in 1884, feared
    as dangerous because it was believed to contain poison and to bring death to anyone
    handling it sacrilegiously. It notes cedar sprays tied through the pack strings,
    the later opening of the pack at the Peabody Museum, and the objects found inside,
    including toy-like boxes, small bundles with red paint, shells, unidentified fragments,
    and six woven bags.
