canonical_text:
  quote: ''
  summary: The passage describes the introduction of guns among the Omaha in the early
    nineteenth century, the Omaha names given to guns, bullets, and gunpowder, the
    later arrival of rifles, and the resulting decline of arrow making and some teachings
    for the young. It also notes that metal utensils replaced native pottery, while
    wooden bowls, though disappearing from family use, remained in sacred tribal ceremonies
    and serious rites.
