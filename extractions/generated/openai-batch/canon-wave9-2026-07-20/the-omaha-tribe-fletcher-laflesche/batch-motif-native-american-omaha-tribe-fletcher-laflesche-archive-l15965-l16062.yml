canonical_text:
  quote: ''
  summary: The passage describes the twelfth song of the Sacred Pole ceremony, the
    woman's shooting of arrows through basketwork on the Pole, the resulting augury
    for hunting and warfare, and the conclusion of the ceremony. It explains the Pole's
    twofold significance as supernatural authority and as the men who defend and provide
    for the tribe, emphasizes the union of masculine and feminine ritual performance,
    stages a mock attack on enemy effigies to honor defensive warriors, and notes
    the seasonal end of buffalo-hunting regulations and later distress caused by the
    disappearance of buffalo.
  language: English
  quote_policy: summarized
