canonical_text:
  quote: ''
  summary: The passage describes Omaha qualifications for chiefs, the Council of Seven
    Chiefs, the sacred authority of the two Tribal Pipes, the dual organization of
    tribal ceremonial offices, cosmological meanings attached to the number seven,
    woodpecker-head pipe ornamentation, and the non-voting attendance of five sacred-object
    keepers at council meetings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man of disputatious or quarrelsome nature could not secure election to the
    chiefly orders by gifts; a chief was expected to govern himself.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Council of Seven Chiefs is described as a small body representing the
    entire tribe, controlling the people, settling contentions, and subordinating
    factions to central authority.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The presence and ceremonial use of the two Sacred Tribal Pipes served as the
    credential for creating and exercising council authority.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two Sacred Tribal Pipes stood for the dual organization of the Jiu'thuga;
    their keeping belonged to the Pke'cabe gens of the southern earth side, and their
    ceremonial filling belonged to the Inshta'cunda gens of the northern upper realm.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Through ceremonies and use of the two Sacred Tribal Pipes, the two halves
    of the Jiu'thuga were described as being welded, making the Pipes representative
    of the tribe as a whole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The council number seven is said probably to have originated in the number''s
    significance as representing the whole of man''s environment: the four quarters,
    four paths from Above to Below, and the place where man stood.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: One Tribal Pipe reportedly bore seven woodpecker heads for the seven chiefs,
    while the other bore one woodpecker head for the unity of chiefly authority; the
    passage also notes wider associations of the woodpecker with the sun and calumet
    pipes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The seven council members belonged to the Ni'kagahi sha'be order and held
    their places until death or voluntary resignation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Five ex officio keepers could attend council meetings but had no voice in
    decisions, which belonged solely to the Seven Chiefs.
  category: relationship
  evidence_refs:
  - ev:9
