  quote: ''
  summary: An Omaha song is glossed as involving distant voices, an owl speaking,
    morning, and a directed shout. The accompanying explanation tells of a warrior
    in a forest camp who hears owl hoots at night, judges some answering sounds to
    be human imitations, discovers enemies, warns the sleeping warriors, and thereby
    helps the Omaha repel a dawn attack. The song is said to commemorate the man's
    alertness and trained ear.
