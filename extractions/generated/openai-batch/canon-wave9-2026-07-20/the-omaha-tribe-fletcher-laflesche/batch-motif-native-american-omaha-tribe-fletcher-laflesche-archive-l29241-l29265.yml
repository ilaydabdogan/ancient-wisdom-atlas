  quote: ''
  summary: 'The passage describes six ranked war honors that could be claimed on the
    body of an enemy: striking an unwounded enemy, striking a wounded enemy, striking
    a dead enemy, killing an enemy, taking the scalp, and severing the head. Several
    grades limit the number of warriors who can claim the same honor from one enemy.'
