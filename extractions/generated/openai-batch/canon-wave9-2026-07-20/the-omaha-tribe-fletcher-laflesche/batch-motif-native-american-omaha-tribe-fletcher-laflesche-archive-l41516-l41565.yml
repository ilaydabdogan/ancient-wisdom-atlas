canonical_text:
  quote: ''
  summary: The passage describes the decline of buffalo herds, the ending of Omaha
    annual buffalo hunts after 1876, distress over dietary change, an appeal to Wakon'da
    through old Sacred Pole ceremonies using beef as a substitute, economic adaptation
    through farming and livestock, service to the United States during the Civil War
    and railroad construction, and a shift from older tribal governance to a council
    under the authority of the United States Indian Agent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The slaughter of buffalo herds seriously reduced the supply of game, and after
    1876 annual buffalo hunts ceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Omaha suffered because they were not used to relying only on grain and
    were not accustomed to beef.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: During this distress, the tribe appealed to Wakon'da through older ceremonies
    connected with anointing the Sacred Pole, using purchased beef as a substitute
    for buffalo meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Omaha teaching held that buffalo had been sent from
    every quarter for human use by Wakon'da.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Maize cultivation increased, wheat was raised, produce was sold to white settlements,
    and the proceeds were used to buy food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pigs, chickens, and cattle were raised in moderate numbers.
  category: action
  evidence_refs:
