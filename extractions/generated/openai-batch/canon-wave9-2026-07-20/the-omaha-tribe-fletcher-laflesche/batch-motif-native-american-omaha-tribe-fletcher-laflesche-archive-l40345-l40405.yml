    with the Omaha. It describes distant Omaha journeys to a northern lake post, the
    spread of trading posts and fur-company activity, Omaha avoidance of colonial
    wars, harmful effects of white contact, and a later seasonal trading practice
    near Omaha villages in which a trader arrived with goods after hunts and signaled
    people by firing guns.
