canonical_text:
  quote: ''
  summary: The passage lists Omaha personal and gentile names with explanations tied
    to animals, weather, war incidents, places, celestial bodies, and cognate tribal
    names. It then recapitulates features of Omaha tribal organization, including
    ritual duties of gentes, the Sacred Tent of War, rites for the first thunder of
    spring, the Sacred Shell, the Cedar Pole, elk taboo, and the leadership role of
    the Hon'ga gens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A name referring to a wild-cat claw is explained as an hereditary possession
    used in ceremonies conducted by a gens.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some names are explained through thunder, including strength or power of thunder
    and a stormy day of thunder and lightning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several names are built from the word for snake, including snake, snake leader,
    and little snake; some are noted in Ponca contexts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: One name was bestowed because a man rushed suddenly on a large party of Sioux
    while armed only with a hatchet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: One name was won by a partially paralyzed man who killed an adversary in single
    combat during a fight with the Dakota.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dream names in the passage refer to elk bone, a swift horse, and buffalo stomach
    fat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Names from incidents or historic experiences include the Omaha name for the
    Platte River, deer horn branch, a bad village associated with poisoning, a Thunder
    village from which Thunder issues to kill men, a cook, and a fireplace.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some names are described as borrowed from cognate tribes, including Dakota
    and Oto names, and one name is said to derive from a Dakota name meaning White
