  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Five gentes formed the southern half of the tribal circle and were described
    as having charge of the physical welfare of the people.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The We'zhinshte gens had charge of the Sacred Tent of War and rites connected
