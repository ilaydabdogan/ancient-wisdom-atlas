  quote: ''
  summary: The passage describes the Presbyterian Mission following the Omaha in 1857,
    the completion of a stone mission house in 1858, its landscape setting near the
    Missouri River, and its use as a boarding and day school with a chapel. Missionaries
    and their families lived there with Omaha children under their care; the children
    received English names and instruction in English and gendered practical skills.
    The author states that the mission school continued for nearly thirty years and
    was of lasting benefit.
