canonical_text:
  quote: ''
  summary: The passage explains Omaha interpretations of symbols painted or attached
    to ceremonial pipe stems and related objects in the Wa'wan ceremony, including
    colors, birds, feathers, gourd, four lines, tobacco pouch, sweet grass, and buffalo
    hair. It then contrasts the Omaha and Pawnee forms of the ceremony and describes
    advance messengers carrying a symbolic tobacco pouch to a prospective host, the
    peace speech and consultation over return gifts, kinship terms used for the parties,
    and the reception of the Wa'wan party near the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The green, blue, and red colors on the stems are interpreted respectively
    as the earth's verdure, the sky, and the sun associated with life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A straight red groove running the length of both stems is interpreted as the
    straight path or path of life, with the stated result that the sun of life and
    happiness shines on a man who follows it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Red streamers are interpreted as sun rays, and white cords binding them are
    interpreted as moonlight; night is said to be believed the mother of day.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eagle is described as the bird of tireless strength; the owl represents
    night and death; the woodpecker represents day, sun, and life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Downy feathers are sometimes said to symbolize eggs and sometimes the feathers
    shed by a young eagle when it matures and can fly.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The gourd is said to represent eggs and the reproduction of living forms.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A band and four painted lines are interpreted as the sky boundary or horizon
    and as the four paths of the four winds in the four directions, over which help
    comes to man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tobacco pouch is similarly painted and has a braid of sweet grass and
    a mat of buffalo hair attached to it.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:9
  text: The buffalo hair is explained as symbolizing food and clothing and is glossed
    as promising safe and peaceful searching for food if the ceremony's teachings
    are accepted and followed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Omaha form of the ceremony makes the eagle prominent, while the Pawnee
    version has corn in that position.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Omaha ceremony the pipes are taken up with movements representing an
    eagle rising from her nest and with songs; in the Pawnee version the pipes are
    taken up without song or ceremonial movement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: When the Wa'wan party takes pipes to another tribe, four men are chosen within
    a day's journey to carry the symbolic tobacco pouch ahead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: All four advance men wear buffalo robes with the hair outside; the man who
    carries the tobacco pouch wears a downy eagle feather tied to his scalp lock and
    is called Ninia'thin, meaning tobacco carrier.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The four advance men enter the designated man's lodge, pass around the fire
    by the left, place the tobacco pouch before him, sit to the right of the entrance,
    fill a pipe, and offer it to the host.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The bearer names the leader who sent the tobacco bag and speaks about the
    value of peace and peaceful relations between the two tribes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The host consults relatives and followers about whether they can make the
    required return gifts and accept the pipes; inability to provide ponies or a recent
    family death are named as honorable reasons to refuse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The leader of the Wa'wan party is addressed as Father, his followers as Fathers,
    the receiver of the pipes as Son, and his party as Sons.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Near the village, the Wa'wan party halts, uncovers the pipes, places them
    at rest on a crotched stick and cat skin, and is welcomed by the host or a prominent
    male relative.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: After the welcome, two principal singers take the pipes while a third stands
    between them holding the cat skin wrapped around the crotched stick.
  category: action
  evidence_refs:
  - ev:9
