canonical_text:
  quote: Pack belonging to a lodge of the Shell society.
  summary: The passage explains that, when the Sacred Tent of War contents were deposited
    in the Peabody Museum, a pack was found among the articles. It was later identified
    as belonging to a lodge of the Shell society. Big Elk had been its keeper and,
    because of his standing in the We'zhinshte gens and the Council of Seven, had
    stored it in the Tent of War. After his death and subsequent disruption of tribal
    customs, the pack remained with the Tent of War articles.
