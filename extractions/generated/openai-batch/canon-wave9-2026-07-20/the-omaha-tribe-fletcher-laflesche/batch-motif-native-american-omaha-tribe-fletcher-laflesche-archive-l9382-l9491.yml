canonical_text:
  quote: ''
  summary: The passage explains Omaha tribal organization through the hu'thuga, a
    tribal circle and kinship order interpreted as the union of Earth people and Sky
    people. It describes exogamy, paternal descent, and maternal extension of kinship,
    then compares Ponca, Osage, Kansa, and Quapaw arrangements as related or fragmentary
    expressions of a sky-earth symbolic order. It also notes Ponca rites connected
    with Thunder, ice or hail, the serpent, and lightning.
  language: English
