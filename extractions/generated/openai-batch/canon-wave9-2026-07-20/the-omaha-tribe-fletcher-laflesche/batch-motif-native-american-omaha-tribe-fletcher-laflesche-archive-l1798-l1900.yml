canonical_text:
  quote: ''
  summary: The passage explains the Omaha term for tribe as related to fighting external
    enemies as a unified body, discusses the name Omaha as meaning upstream in contrast
    to Quapaw as downstream, and gives two traditional versions of a river crossing
    that separated Omaha, Iowa, and Quapaw groups. It also explains forms of tribal
    and personal identification and introduces traditions of former unity among five
    cognate tribes.
  language: English
  quote_policy: summarized
