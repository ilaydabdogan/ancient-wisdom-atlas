  quote: ''
  summary: 'The passage gives a brief historical note on the Quapaw tribe: their current
    remnant population in northern Oklahoma, earlier location south of the Osage,
    contact with French and Spanish traders, land cessions and relocations in 1818
    and 1824, and the difficulty of reconstructing their ancient organization because
    tribal life has been shattered. It also includes a caption for a figure labeled
    Quapaw man.'
