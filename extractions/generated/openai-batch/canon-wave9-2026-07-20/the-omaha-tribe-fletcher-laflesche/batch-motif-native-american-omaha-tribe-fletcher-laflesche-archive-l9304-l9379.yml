canonical_text:
  quote: ''
  summary: The passage describes the Omaha hu'thuga, the ceremonial circular tribal
    camping order used especially during the annual buffalo hunt. It explains the
    eastward opening as a dwelling door, the placement of gentes and the Sky and Earth
    divisions, the sacred governance of the hunt, the address to the tribe as two
    sides of a house, and the interpretation of the form as a symbol of cosmic and
    social order rather than merely convenience or safety.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tribe is described as having ten gentes, and hu'thuga is identified as
    the ceremonial camping form or order in which each village or gens had a definite
    place.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hu'thuga order was used when the tribe was away from its village on the
    annual buffalo hunt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The annual buffalo hunt was initiated and conducted with religious ceremonies,
    and appointed men directed it with authority over all persons, including chiefs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The camping form was circular and had an opening to the east, described as
    representing the door of a dwelling.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old men explained the opening as the way through which people went out for
    game, returned with food, warriors departed to defend the tribe, and warriors
    were welcomed back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The entrance is described as the door into the dwelling place of the tribe,
    where each gens had a place like each family member within a lodge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Inshta'cunda division, identified as Sky people, theoretically formed
    the northern half of the hu'thuga, while the Hon'gashenu division, identified
    as Earth people, theoretically formed the southern half.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: During tribal ceremonies the opening was actually toward the east; at other
    times it faced the direction of travel while the order of the gentes was kept
    as if the opening faced east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the hu'thuga is probably a symbol rather than only
    an arrangement for convenience and safety.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says safety was connected with help derived through recognition
    of cosmic forces and religious observances rather than only from the physical
    arrangement of tents.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: An orator addressing the tribe collectively used a form naming the Inshta'cunda
    and Hon'gashenu and glossed as 'both sides of the house.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hu'thuga as the dwelling of the entire tribe is said to be the type reproduced
    in each member's dwelling, where masculine and feminine forces from two distinct
    groups or regions were to be united.
  category: relationship
  evidence_refs:
  - ev:8
