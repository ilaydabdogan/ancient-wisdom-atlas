  summary: The passage gives the Omaha tribe's Nebraska location, legal and social
    changes after land cession and allotment, 1884 demographic information, remarks
    on reluctance to speak of the dead, and a discussion of North American indigenous
    movements, cultural spread, and the Omaha's placement within the Siouan linguistic
    stock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha people are described as living in Nebraska in Burt, Cuming, and
    Thurston counties, north of the city of Omaha.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Omaha tribe had never been at war with the United
    States and was the only tribe then living in Nebraska that had been there when
    white settlers entered the country.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An 1882 act of Congress allotted acres to Omaha individuals from land selected
    as their reservation in 1854, when the tribe ceded extensive hunting grounds to
    the United States.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Omaha were dependent on farming, mechanical work,
    commerce, and similar occupations, and that the 1882 act placed them under Nebraska
    civil and criminal law.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ancient tribal organization is said to have ceased because of changed
    environment, the extinction of the buffalo, and the immediate presence of white
    civilization.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage identifies exogamy between kinship groups and the giving of gens
    names to children as remaining ancient customs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A few societies still existed, but their influence was waning; their songs
    and dramatic dances were enjoyed and revived memories of the time when the Omaha
    were distinct and independent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In June 1884 the Omaha numbered 1,179 people, and the allotment of lands to
    tribal members was completed in that month.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that unwillingness to speak of the dead made it impracticable
    to obtain the exact number of children who had been born.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage attributes a sex imbalance among people aged 17 to 40 partly to
    men's exposure to the hazards of hunting and war, occupations said to have ceased
    in 1876.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: For many centuries before contact with early white travelers, traders, and
    colonists, aboriginal peoples north of Mexico are described as moving across the
    continent in multiple directions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that traces of ancient movements had been overlaid by later
    movements and that the archeologist's task was to disclose those traces and read
    their history.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Inland waterways and coast lines on two oceans are said to have probably favored
    the spread of culture from one region to another.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Omaha tribe is identified as belonging to the Siouan linguistic stock,
    whose branches are described as having moved westward, northward, and into outlying
    communities.
  category: relationship
  evidence_refs:
  - ev:10
