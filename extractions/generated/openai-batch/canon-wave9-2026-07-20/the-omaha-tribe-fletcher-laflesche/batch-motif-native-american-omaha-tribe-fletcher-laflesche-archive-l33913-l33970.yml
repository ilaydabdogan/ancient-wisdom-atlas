canonical_text:
  quote: ''
  summary: A stranger instructs a father and mother in secret teachings and the later
    initiation of selected men and women. He sings four songs with animals and island
    dwellers joining in. He then has the mother call each of her four children; each
    child falls dead when the stranger cries out, is placed on a skin, and is painted
    with red and colored markings. The stranger explains the red lines as life-giving
    rays of the sun and interprets the children's different body colors as clear sky/day,
    night sky, moon/night, and earth.
  language: English
  quote_policy: summarized
