canonical_text:
  quote: ''
  summary: 'A ritual song announces that a party bearing pipes is approaching. The
    song text is explained, with Hun''ga referring to the child as a symbol of innocence,
    docility, and peace. During singing, pipe stems are waved and rattles shaken,
    without a drum. The party advances through four halts to the lodge entrance, enters
    silently, and the pipe bearers face east on the west side of the lodge. A following
    song declares that a worthy man has been found to receive the pipes and the blessings
    associated with them: peace, abundant life, food, and happiness.'
  language: English with Omaha song words and translations
  quote_policy: summarized
