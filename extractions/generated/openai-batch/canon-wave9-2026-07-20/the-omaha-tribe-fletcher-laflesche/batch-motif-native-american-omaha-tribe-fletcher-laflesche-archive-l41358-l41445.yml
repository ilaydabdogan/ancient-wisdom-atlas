  quote: ''
  summary: The passage gives a historical account of Joseph La Flesche's family background,
    childhood movements between Omaha, Sioux, and French-speaking trade contexts,
    education in languages and tribal customs, relationship with Big Elk, path toward
    chieftainship, role in treaty negotiations, advocacy for cash payments, conflict
    with trader factions, and founding of a village modeled partly on white settlements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Omaha boy was taken captive by the Sioux, grew up among them, and became
    influential there; his sister later married the French trader Joseph La Flesche.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son, also named Joseph, was born of the union of Joseph La Flesche and an
    Omaha woman, probably about 1818, at the old village Ton'wontonga on Omaha Creek.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Joseph's mother left her French husband and married an Omaha man; when Joseph
    was about six, he visited his Sioux-resident uncle with his aunt and remained
    for three or more years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During his stay among the Sioux, Joseph learned the Dakota language, and later,
    after being taken to St. Louis by his father, he learned French.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Joseph learned from old Omaha chiefs, especially Big Elk, about the qualifications
    required for chieftainship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Joseph determined to become a chief and continued to acquire languages, hunting
    skill, trading experience, and knowledge of tribal customs and lore.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Joseph concluded that white settlers would remain in the country and that
    Omaha people would have to adapt in some degree to white ways and customs.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Big Elk invited Joseph to join a preliminary council before the annual buffalo
    hunt, and Joseph was seated next to Big Elk without objection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Joseph had begun making gifts required for chieftainship and counting his
    hundred.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Big Elk's son died, Joseph was recognized as Big Elk's son and counted
    as belonging to the We'zhinshte gens, contrary to ordinary usage based on his
    mother's gens.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Joseph La Flesche planned to succeed Big Elk while also working on projects
    he believed would help the Omaha people move into a new path under changing conditions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Joseph watched the mission school at Bellevue, spoke with missionaries, and
    took part in negotiations connected with the present reservation after Omaha hunting
    lands were disposed of to the United States.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After Big Elk's death in 1853, Joseph La Flesche met the old requirements
    for chieftainship, took Big Elk's place, and became one of the two principal chiefs.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the 1854 treaty delegation to Washington, La Flesche argued against payments
    in goods and demanded money for Omaha land.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: A silver dime used by La Flesche to illustrate his argument was remembered
    as connected with a victory for cash payments and with the hostility of trader
    factions toward him.
  category: object
  evidence_refs:
  - ev:13
- id: obs:16
  text: At Bellevue, Joseph gathered young progressive men around him; they later
    formed the nucleus of the tribe's young men's party.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:17
  text: On the new reservation, Joseph chose a village site south of the mission and
    formed a village intended to resemble a white settlement in some respects.
  category: setting
  evidence_refs:
  - ev:15
