canonical_text:
  quote: Do your duty. I broke the order of the chief and must take my punishment.
  summary: The passage describes United States governmental regulation and licensing
    of trade with the Omaha after the Louisiana Purchase, the rise of agency-licensed
    reservation traders, and the later decline of hunting and trader influence after
    buffalo destruction, settlement, and railroads. It also recounts an honored warrior
    who became drunk, was ordered flogged by a chief despite their friendship, accepted
    the punishment, and afterward gained esteem while strengthening the chief's effort
    to stop drinking.
  language: English
