literal_observations:
- id: obs:1
  text: The passage states that the Kansa former organization was similar to that
    of other cognates, that the tribe had two great divisions, and that Kansa gens
    names are found among Osage, Ponca, Omaha, and Quapaw groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kansa name Monin/ka is glossed as earth and is compared with Osage and
    Omaha names glossed as earth makers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The names Wazha/zhe, Ponca, and Kansa are each said to occur as tribal, kinship-group,
    or gens names in one or more of the named cognate tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The name Wazhin/ga inikashikithe includes a term glossed as bird and is explained
    as referring to making themselves one people by observing a common rite.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Birds are said to figure in rites of all the cognates and to be taboo in gentes
    practicing rites pertaining to certain birds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The name Te inikashikithe is glossed with buffalo, and buffalo rites are said
    to occur in all five cognates.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The name O'pxon inikashikithe is glossed with elk; elk-named gentes are said
    to occur in the Osage and Quapaw tribes, and the elk is taboo to the Omaha Werzhinshte
    gens.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The name Hon is glossed as night and is said to occur in the Osage tribe as
    a group name.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The names Ho^gash^ga and Hon/gatonga are glossed as little Ho^ga and big Hon/ga
    and are compared with names in Osage, Quapaw, and Omaha contexts.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tsi'zhu washtage is glossed with docile or peaceable, and Tsi'zhu washtage
    is identified as the peacemakers of the Osage Tsi'zhu group.
  category: attribute
  evidence_refs:
  - ev:7
