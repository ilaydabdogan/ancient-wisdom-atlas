canonical_text:
  quote: '"I shall leave the question of the truth of this story to the Thunder god
    to decide."'
  summary: The passage recounts a disputed claim to a first-strike war honor, which
    the keeper refers to the Thunder god; a later fatal accident is understood as
    supernatural punishment for false speech. It then describes the war-honor decoration
    called “the Crow,” its materials, use, and stated symbolic meanings, including
    associations with battlefield aftermath, Thunder, eagle, wolf, crow, soldiers,
    hunting order, and warrior protection.
  language: English with embedded Ponca ritual lines
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Witnesses agreed that the man with the bow struck the enemy first, while the
    man with the gun struck the bow and not the enemy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The keeper twice asked the two disputants to repeat their stories so the one
    in the wrong could withdraw a false statement; both maintained their original
    accounts, and the stick was not dropped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The keeper said he would leave the truth of the matter to the Thunder god
    to decide and that the truth would be known within the year.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the summer tribal buffalo hunt, a horse fell on the man who claimed
    the gun-strike honor, and he was killed; the death was believed to be supernatural
    punishment for false speech.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A man who had more than once attained honors of the first three grades became
    entitled to wear the ornament called “the Crow.”
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Crow was worn at the back, fastened by a belt, and included long painted
    skin pendants, rows of eagle feathers, an entire eagle skin, two arrow shafts
    tipped with red-dyed hair, a wolf tail, and an entire crow skin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the composite decoration illustrated beliefs that
    humans are vitally connected with all forms of life, remain in touch with the
    supernatural, and that warrior acts are under Thunder’s supervision as god of
    war.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that war honors recognized individual achievement and were
    accredited by Thunder through representative birds associated with Thunder and
    contained in the Sacred Pack.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Crow decoration is said to symbolize a battlefield after conflict, with
    fluttering feathers representing birds fighting over dead bodies, white spots
    representing bird droppings, and arrow shafts representing both bodies and fatal
    arrows in a lifeless enemy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The eagle is associated with war and with Thunder’s destructive powers and
    storms; the wolf and crow are connected with carnage and with the office of soldiers.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The soldiers on the annual tribal hunt acted as marshals and kept people and
    hunters in order during the surround of the herd; they were chosen from men entitled
    to wear the Crow, and the regalia was worn at the hunt and at some ceremonial
    dances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Ponca ritual secured from an old Ponca chief was used when soldiers were
    appointed for the tribal hunt and is said to illuminate the relation of the crow
