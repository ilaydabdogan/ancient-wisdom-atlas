canonical_text:
  quote: ''
  summary: The passage presents two Omaha society songs with literal word glosses
    and explanatory stories. The first song commemorates an unnamed dying warrior
    who asks that his father’s name, not his own, be proclaimed among the slain so
    that aged men will remember the father. The second song praises A'gahamonthin,
    a warrior who publicly vowed to drag an enemy from his horse or die, fulfilled
    the vow in battle against the Yankton, was killed, and thereby inspired an Omaha
    victory.
  language: English with Omaha song words/transliteration
