  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The authors introduce campfire notes meant to illustrate training in industry,
    good manners, and consideration for others.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old man sat by a campfire, traced figures with a stick, and spoke while
    others sat in a circle under a clear night sky.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old man said that old sayings were used to keep young people in order,
    teach mindfulness of elders, and discourage self-indulgence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A saying warned boys not to use a knife for cutting meat, with the explanation
    that relying on a knife made one lazy rather than self-reliant.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A custom held that a borrowed kettle should not be returned empty, and a saying
    warned a lad not to eat the food left in the kettle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The kettle saying associated selfishly eating the returned food with arrows
    twisting and with failure to prosper.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The tender buffalo intestine called washna was suitable for elders with few
    or no teeth, and boys were warned not to eat it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The washna warning linked eating it with dogs barking at a youth on a war
    party for spoils; the reason was left mysterious to frighten youths away from
    the food.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Young men were warned not to drink broth from the kettle because their ankles
    would rattle and joints become loose.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Young men were warned that eating marrowfat would make them quick-tempered,
    soft-hearted, and afraid before an enemy.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: Young men were forbidden to smoke because smoking was said to make them short-winded
    and easily overcome in battle.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Old men told young men that they must learn to make arrows.
  category: speech
  evidence_refs:
  - ev:14
