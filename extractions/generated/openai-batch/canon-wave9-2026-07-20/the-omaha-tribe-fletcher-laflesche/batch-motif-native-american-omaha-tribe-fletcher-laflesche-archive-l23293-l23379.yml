literal_observations:
- id: obs:1
  text: Boys were described as having relatively little etiquette training early on,
    but later had to learn specific seated and standing postures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small boys and girls played together, but girls’ duties and restraints later
    separated them from boys.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A girl was not considered marriageable until she could dress skins, make and
    sew garments, embroider, and cook.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A young man was not considered a desirable husband until he had shown hunting
    skill, alertness, and courage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Politeness included etiquette concerning the fire, not interrupting a speaker,
