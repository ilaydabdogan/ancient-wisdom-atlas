canonical_text:
  quote: ''
  summary: The passage describes the We'zhinshte gens taboo against eating male elk
    flesh or wearing moccasins made from male elk skin, except that such moccasins
    were placed on the dead for recognition by gentile relatives in the other world.
    It also describes bodily punishment for taboo violation and explains that gens
    names, especially ni'kie names, referred to rites and taboo and were bestowed
    during initiation into the tribe.
  language: English
  quote_policy: summarized
