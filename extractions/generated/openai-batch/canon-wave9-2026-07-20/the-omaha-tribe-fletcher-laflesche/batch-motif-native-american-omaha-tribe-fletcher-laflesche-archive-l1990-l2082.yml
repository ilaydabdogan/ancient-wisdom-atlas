  summary: The passage argues that comparing rites and customs among cognate tribes
    may reveal an ancestral organization. It then discusses the term Hon'ga, meaning
    “leader,” across Omaha, Osage, Kansa, Quapaw, and Ponca traditions; recounts an
    Osage tradition of incorporating a same-language Hon'ga group; explains the “Separate
    Hon'ga” designation; and notes traditions connecting Hon'ga with the Omaha, a
    battle-place name, and a January month-name.
