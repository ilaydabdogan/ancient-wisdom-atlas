  summary: The passage identifies Nu'xe as ice or hail and as the name of a people
    from the upper world, lists a buffalo-bull-named Sub-Shoka group, and describes
    Osage Tsi'zhu and Hon'ga divisions within an east-opening tribal circle. It compares
    Osage division positions and duties with Omaha divisions and compares the Ponca
    Nu'xe gens with the Osage Nu'xe group.
