  summary: The passage describes an Omaha society whose members sang with intense
    earnestness, notes that its organization was known only as a division into four
    groups or lodges, describes its sickness treatments by bleeding, sucking out a
    disturbing object, and a painful massage technique, and states that its rituals
    were incompletely known. A part of the opening ritual was obtained from the former
    leader Waki'dezhinga and is said to deal with Creation and cosmic forces.
