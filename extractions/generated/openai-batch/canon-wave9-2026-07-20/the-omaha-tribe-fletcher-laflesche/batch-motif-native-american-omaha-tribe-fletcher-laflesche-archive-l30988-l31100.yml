  summary: The passage gives Omaha terms and translations for a Hethu'shka song stanza,
    then explains that Hethu'shka songs recorded society-approved brave deeds, recalled
    incidents, ceremonies, teachings, and duties, and promoted standards of warrior
    conduct and loyalty within and beyond the society.
