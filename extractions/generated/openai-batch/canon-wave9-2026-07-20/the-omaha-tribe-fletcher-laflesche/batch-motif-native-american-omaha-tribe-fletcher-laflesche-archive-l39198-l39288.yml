canonical_text:
  quote: ''
  summary: The passage describes Omaha beliefs and stories about the spirit world,
    the Milky Way as the path of the dead, ghostly sounds and protections against
    ghosts, dreams and omens of death, and mourning practices after a death in the
    family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The spirit world is described as having an environment similar to earth, with
    similar avocations and continued interest in this world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dead warriors are said to attend Thunder, and voices of certain dead brave
    men may be recognized during thunderstorms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One explanation says the aurora borealis is caused by chiefs holding a dance;
    another explanation says it is the sun's light returning from west to east.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Omaha did not seem to have a conception of supernatural
    rewards or punishments after death.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the forks of the path of the dead, identified with the Milky Way, an old
    man wrapped in a buffalo robe directs good and peaceable people to a short path
    and allows contumacious people to take a long path.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'A log across a chasm is described as a crossing for the dead: the good have
    no difficulty, while the bad may fall and be lost.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies the simple and ancient belief as the Milky Way being
    the path of the dead.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The spirit of a murderer is said not to find his relatives and to search endlessly
    without rest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Restless ghosts are supposed to whistle, and children are frightened by whistling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: People camping on old battlefields or separated on hunts are said to hear
    sounds of fighting or unseen strange people making camp and going about ordinary
    activities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ghosts are said to take possession of village earth lodges and hold dances
    and feasts when the tribe is away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In one story, ghostly visitors were only partly visible, with feet and legs
    visible up to the knees.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: A knife placed across an open food vessel is said to prevent a mischievous
    ghost from tampering with the food.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Ghosts are said never to cross a stream; even a small stream creates an impassable
    barrier between a person and a ghostly pursuer.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: Dreams of ceremonial Wa'wan pipes, snakes entering the body, or lice are said
    to betoken death, although keeping the snakes out allows escape from death.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: If a horse shies at a person, the animal is said to see blood on him, indicating
    that the person will soon die.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: When death enters the family circle, mourners weep, slash their arms and legs,
    cut locks of hair and throw them on the body, and wail.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: A silent mourner may draw a blanket over his head, sit motionless, refuse
    food and speech, and sometimes die.
  category: sequence
  evidence_refs:
  - ev:16
