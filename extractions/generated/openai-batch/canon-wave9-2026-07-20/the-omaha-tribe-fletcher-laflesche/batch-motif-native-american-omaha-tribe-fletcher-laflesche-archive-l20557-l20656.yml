canonical_text:
  quote: ''
  summary: The passage describes Omaha fishing as a practical food-gathering activity
    using baited line devices, shooting, spearing, and movable willow weirs. It then
    describes Omaha kinship terminology, including avoidance of personal names in
    address, potential relationships created by marriage rules, obligations involving
    widows and related women, ceremonial use of kinship terms, and notes on variant
    relationship terms and first-born baby names.
  language: English
  quote_policy: summarized
