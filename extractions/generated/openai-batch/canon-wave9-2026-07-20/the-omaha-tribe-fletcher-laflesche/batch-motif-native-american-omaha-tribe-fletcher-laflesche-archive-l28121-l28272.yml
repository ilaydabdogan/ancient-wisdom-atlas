canonical_text:
  quote: ''
  summary: The passage describes Omaha war-party songs, the use of dance and song
    against homesickness, the secret departure of a war party after the mi'kafi dance,
    the leader's instruction by the keeper of a Sacred Pack, a night procedure involving
    four men sent to the cardinal points to answer a wolf cry, and the later ceremonial
    opening of the Pack with deployment of eight scouts around the party.
  language: English, with Omaha terms and vocables
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A translated song says wolves travel over the earth without fear, and the
    speaker says he will go forth like them fearlessly and not feel strange in any
    land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Homesickness is described as dreaded by warriors because it unnerved them
    and presaged defeat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The leader watches for signs of nostalgia, including men speaking of sweethearts,
    and organizes a dance with songs to hearten the party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A free translation of one song says that the one the speaker wishes to marry
    has gone to war, while the one the speaker hates has remained.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mi'kafi dance is described as the war party's last public appearance before
    departure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The war party's departure is kept secret; the leader appoints a time and place,
    and each man steals away to the meeting place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The secrecy of departure is said to prevent undesirable persons from joining
    the party.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each war-party leader is instructed in his duties by the keeper of the Sacred
    Pack to which he has applied for permission to go on the warpath.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At night on the march, the leader selects four men and sends them to four
    designated places in the directions of the four cardinal points to listen for
    wolf howling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Toward midnight a man in camp gives the cry of the wolf, the four men answer
    from their posts, return to camp, and all go to sleep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The party travels only during the first night; afterward the men rest at night
    and move by day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Near the destination, the carried Pack is opened ceremonially and eight scouts
    are deployed to the rear, sides, and front of the party.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a scout discovers a village with a chance for booty or war trophies,
    he runs to report to the leader while singing.
  category: action
  evidence_refs:
  - ev:9
