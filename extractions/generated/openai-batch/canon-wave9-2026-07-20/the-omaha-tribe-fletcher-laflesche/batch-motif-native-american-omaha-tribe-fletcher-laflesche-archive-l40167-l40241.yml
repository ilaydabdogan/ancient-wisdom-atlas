canonical_text:
  quote: ''
  summary: The passage describes Omaha traditions as shaped by an equable environment,
    with orderly seasons and day-night cycles linked to stability, truthfulness, and
    Wakon/da's instruction. It states that falsehood is punished by Wakon/da through
    storm and lightning, emphasizes Omaha practical thought through the Sacred Legend's
    repeated formula that the people thought, mentions the Sacred Pole as an emblem
    of governmental authority, describes ceremonies for birth, tribal membership,
    death, and the journey to the realm of spirits, and states that Omaha religion
    and language treat nature anthropomorphically.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Omaha traditions are described as placing the people in an environment without
    extreme climate, volcanic calamity, lofty mountains, or deep canyons, and in a
    hospitable country with orderly seasons and days.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The equable movement of seasons and days is said to have impressed the Omaha
    mind and led to a conception of stability as a desirable ethical quality for human
    life and social relations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The orderly progression of seasons and of day and night is described as a
    method by which Wakon/da taught humans to be truthful so that their words and
    acts could be depended on.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Punishment of falsehood is said to be relegated to Wakon/da through natural
    agencies such as storm and lightning, which break the ordinary calm order of the
    heavens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that Omaha mythologies may be less complicated and ornate
    than those of some other tribes and that the Omaha took a more practical than
    fanciful view of nature and human life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the Omaha placed a higher value on faculties of the
    mind than on emotional attributes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Sacred Legend is described as recounting experiences from the time the
    people opened their eyes and beheld the day down to the adoption of the Sacred
    Pole as an emblem of governmental authority.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the account of the Sacred Legend, every acquisition or change that bettered
    the people's condition is said to result from the exercise of the mind, introduced
    by the formula that the people thought.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Examples attributed to thought include regulation of the annual tribal hunt,
    punishment of murder as a social offense, efforts to control the war spirit, and
    the formation of tribal organization.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ceremonies and rituals are said to herald the birth of a child and introduce
    the child to its place and duties as a member of the tribe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the presence of death, ceremonies are said to give sympathy to mourners
