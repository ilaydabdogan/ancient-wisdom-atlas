canonical_text:
  quote: ''
  summary: The passage lists Omaha medicinal uses of several roots and plants, explains
    a cat-tail blossom name connected with corn ripening, describes a human-shaped
    medicinal root used by correspondence to bodily pain, notes that remedies were
    often accompanied by song or ritual and that doctors received fees, and describes
    ordinary bathing and ceremonial sweat baths involving heated stones, water, steam,
    song or ritual, and cold-water immersion.
  language: English
  quote_policy: summarized
