canonical_text:
  quote: ''
  summary: The passage discusses the social significance of Omaha and related Plains
    dress items. Moccasins mark gens, tribal identity, initiation, funerary recognition,
    and a homeward-message saying. War bonnets and war-shirt fringes are described
    as distinctions authorized by warriors. Society dress marks membership, and robe
    or blanket wearing expresses individual moods and purposes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says animal skins were cut and sewn into moccasins so that the
    animal form was lost and the form pertained to man; the moccasin became typical
    of man as a social being.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Omaha and cognate tribes, the moccasin held an important place in rites
    that stressed the obligation of a gens and were social in character.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a child's initiation into the tribe, when the child received a gens name,
    moccasins were put on the child's feet with song and ritual as the child was turned
    by the winds and sent into the walk of life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among a Ponca subdivision of the Ni'kapashna gens, whose tabu was deer, deer-skin
    moccasins were put on the dead so the spirit could be recognized by its own people
    and not lose its way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Tapa' gens of the Omaha tribe, which had the same deer tabu, followed
    the same funerary moccasin custom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The We'zhinshte gens put elk-skin moccasins on the feet of dead members, while
    elk was tabu to the living.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A saying states that worn-out moccasins set on the trail pointing toward home
    and told to report the wearer's welfare will do so.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The moccasin was formerly the only part of personal attire not regarded as
    interchangeable between tribes, since each tribe had a distinctive cut and ornamentation
    by which a man's tribe could be recognized.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man could not make or purchase a war bonnet for his own use; in olden days
    it had to be built by fellow-tribesmen, and its feathers represented the warriors'
    war record and consent.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hair fringe on a war shirt represented the warriors' consent to let the
    owner decorate the garment in that way.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dress of societies marked their memberships and stimulated a brotherhood
    independent of blood ties.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The robe or blanket was worn and shifted in varied ways to meet moods and
    actions, and certain adjustments expressed purposes or feelings in recognizable
    ways.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
