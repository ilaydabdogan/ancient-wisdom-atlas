canonical_text:
  quote: Into your midst has come a new life.
  summary: The passage describes Omaha relative isolation from early European influence,
    then presents an eighth-day birth rite in which a priest announces a newborn as
    a new life entering the universe. The priest petitions celestial, atmospheric,
    earthly, plant, animal, and insect powers to consent and make the child's path
    smooth over four hills, which the text explains as the stages from infancy to
    old age and as an expression of interdependence among all forms of life.
  language: English
  quote_policy: quoted
