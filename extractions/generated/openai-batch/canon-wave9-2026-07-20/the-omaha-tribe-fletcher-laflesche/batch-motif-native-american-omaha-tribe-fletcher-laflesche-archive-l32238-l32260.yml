canonical_text:
  quote: ''
  summary: The passage describes the Te' ithaethe society, whose name is explained
    as referring to persons to whom the buffalo showed compassion by appearing in
    a vision and giving power. The society held knowledge of medicines for treating
    wounds, admitted men and women who had buffalo dreams, and used certain roots,
    water, and forceful blowing of medicated liquid into wounds. A following anecdote
    begins with an accidental shooting of a boy and the community's alarm.
