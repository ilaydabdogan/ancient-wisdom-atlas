canonical_text:
  quote: ''
  summary: A fast song accompanies a dramatic opening ceremony. Four ritual actors
    called "children" circle the fire four times, ritually "shoot" groups from several
    lodge lines, and those struck fall rigid, rise, and join the procession until
    twenty circle the fire. The accompanying song is explained as referring to a story
    in which, after a shell is found, a grieving husband calls to his wife that they
    will run home. The movement is said to place participants in accord with animals
    and mysterious animals and to convey swiftness, magic power, added life, and reproductive
    power.
  language: English with Omaha song terms
  quote_policy: summarized
