canonical_text:
  quote: ''
  summary: The passage describes ingredients of a poison associated with a ritual
    figure, explains markings and objects on the figure, recounts that the figure
    imitates a human-skin receptacle made after a Monster flayed a man, and describes
    a Shell society procedure for secretly deliberating punishment, arranging a directional
    ritual space, and offering a pipe and live coal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The poison was said to be made from the root of a vine variety with many rootlets
    clinging to tree bark, with decaying lizard flesh and a water-surface bug added,
    and was kept in the left arm of the figure.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanation given for using the left side was that the left is first,
    painting begins on the left, and the action follows the sun.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The figure has a roach of hair made from bear skin, zigzag lines from the
    eyes described as tears, gibbous or dying moons on the shoulders signifying death,
    a sun circle, a bear claw kept in the sun figure, and red arm lines representing
    lightning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The figure was said to represent a man flayed by the Monster, whose skin the
    Monster used as a receptacle; the Monster told a man and his wife to make the
    figure in imitation of the human-skin bag and use it in the ceremony.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Big Elk was said to have had bear-paw moccasins; the passage states that no
    one living could say whether they were worn in the ceremony and that the moccasins
    no longer exist so far as could be learned.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A lost ritual was said to have explained all parts of the figure, including
    the strings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a man committed an offense that seemed to require punishment, the society
    met at night to discuss both the act and the man’s character.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the society decided to punish the man, the figure was brought out and was
    described as seeming to stand for the united purpose of the society, whose members
    had to act as a unit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before sunrise, servants prepared a secret meeting place by excavating a circular
    fireplace, piling the earth toward the east, and laying four sticks in the fireplace
    pointing to the four directions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Members came singly and quietly, sat in a circle, while four masters representing
    the four “children” sat at the west facing east; a small bow and two flint-point
    arrows were placed before the masters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wronged man laid his pipe before the masters and ordered a servant to
    take the pipe and a live coal to a certain man; if that man accepted the pipe,
    he lit it.
  category: action
  evidence_refs:
  - ev:6
