  summary: The passage states that Omaha buffalo hunting did not use magical songs,
    decoy calls, or disguises. Success was attributed to ritual observance by the
    leader, obedience by the tribe, and hunter skill. The hunt is described as solemn
    rather than sporting, with recognition of Wakon/da's control over life. The text
    contrasts Omaha attitudes toward killing animals for food with those of whites
    and states that the destruction of the buffalo disrupted Omaha social and religious
    customs.
