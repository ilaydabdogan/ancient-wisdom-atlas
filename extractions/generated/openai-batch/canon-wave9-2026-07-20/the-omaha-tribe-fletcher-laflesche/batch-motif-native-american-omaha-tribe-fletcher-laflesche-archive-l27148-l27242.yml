- id: obs:3
  text: The passage states that the Omaha word for tribe was derived from defensive
    fighting and links that idea to a stable community held together against outside
    aggressors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Omaha tribal organization was based on religious ideas
