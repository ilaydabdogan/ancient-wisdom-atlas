canonical_text:
  quote: ''
  summary: The passage explains Omaha distinctions between defensive and aggressive
    warfare, connects defensive warfare with protection of households and tribal formation,
    and describes aggressive warfare as ritually subordinated to cosmic powers, especially
    Thunder as god of war. It also recounts a belief that two men who neglected the
    Sacred Tent of War were killed by lightning as punishment from the Thunder god.
  language: English
  quote_policy: summarized
