canonical_text:
  quote: The setting up of a tent was always a woman's task.
  summary: 'The passage describes the erection of an Omaha tipi: a woman ties and
    raises four poles to form the fundamental framework, additional poles are arranged
    in a circular locking order, the frame is described as firm and wind-resistant,
    and a named rear pole relates to the buffalo tail and center line of the hide
    cover.'
