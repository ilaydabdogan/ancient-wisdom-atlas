canonical_text:
  quote: ''
  summary: The passage describes Omaha reverence for the Sacred Pole and its tent,
    the movement of the Pole to the Peabody Museum without its ritual songs, and the
    narrator's attempts to obtain those songs from Wakon/monthin. Wakon/monthin first
    refuses because the songs belong to another ceremonial house, but in a later visit
    he acknowledges that old customs have changed after a pipe prayer and smoking
    gesture.
  language: English
