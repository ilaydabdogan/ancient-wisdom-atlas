canonical_text:
  quote: ''
  summary: The passage gives literal translations and explanations of Omaha society
    songs. One song is explained as the singer saying that a pebble has come, found
    him, and struck him with its power. Another song refers to mysterious magic-giving
    beings and to a fish, and is explained by an incident in which a bathing society
    member sees a hawk, transforms into a fish, then into a rock, and escapes while
    the pursuing bird hurts its bill. The passage also introduces an early society
    incident in which members, after their magic strengthened, chose two persons to
    test magic on and shot them with a pebble.
