canonical_text:
  quote: O red-hot fire, hasten!
  summary: The passage gives a literal and free translation of a song calling on flames
    and red-hot fire to come quickly and help. During the song, a ball of grass is
    raised, thrown down, and said to burst into flames, which are understood as symbolizing
    lightning. The text explains that the closing song returns to cosmic forces represented
    in the Turning the Child ceremony and notes a rite consecrating the boy to the
    Thunder god. At the ceremony's conclusion, the father cuts his son's hair according
    to the symbolic manner of his gens; later the scalp lock, described as the sign
    of the warrior, is kept braided.
  language: English
