canonical_text:
  quote: ''
  summary: 'The passage describes elements of Omaha men''s personal adornment: regalia
    indicating war honors, earrings and costly ear-piercing that reflected kin wealth,
    necklaces, beaded garters sometimes fitted with bells for dance rhythm, belts
    carrying paint-stick cases and fire-making materials, and perfumes made or worn
    from sweet grass and columbine seeds.'
