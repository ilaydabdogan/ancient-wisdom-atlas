  summary: The passage describes Omaha procedures for dressing hides, jerking meat,
    tanning skins with buffalo brains, soaking and softening skins, and finishing
    skins differently for moccasins, tent covers, robes, deer, and elk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A single wet skin is worked for several hours and then left to dry in the
    sun until it becomes dry and hard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hides intended for moccasins or tent covers are prepared on both sides; hair
    is scraped off with an implement called we'uhi, and the scraping process is called
    wafu.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Prepared skins are folded for packing and taken home for tanning; after successful
    hunts, women may be kept busy day and night preparing many skins.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Meat is jerked immediately by cutting flesh into thin slices and hanging it
    on frames so wind and sun can dry it rapidly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rain or a warm, moist atmosphere can cause quantities of meat and pelts to
    spoil, and meat may be attacked by insects.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For tanning at home, dried buffalo brains are boiled and smeared on the hard
    skin with a brush made from wild sage; meat broth may substitute if brains are
    unavailable.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The skin is immersed in a stream overnight under stones, then wrung out, stretched,
    pressed with an implement, and rubbed with dry corn meal to absorb moisture.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The final softening process uses a post and sinew loop; the skin is pulled
    side to side through the loop several times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Finishing differs by intended use: moccasin skins are browned by smoke, tent-cover
    skins are kept white, robes keep the hair, and deer and elk skins require less
    labor than buffalo hide.'
  category: attribute
  evidence_refs:
  - ev:7
