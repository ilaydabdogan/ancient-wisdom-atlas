  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiefs and waihon sit as muffled figures with bowed heads and smoke a pipe
    sacred to the Hide while the ritual is sung.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Part I, the pipe appears, and man is commanded to take it in order to supplicate
    Wakon/da.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Part II, creation is recalled, buffalo are created, their growth and perpetuation
    are provided for, and buffaloes converge toward man from every direction until
    they cover the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Part III, Wakon/da assures that the animals are to grow and perpetuate
    themselves for the benefit of man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the opening hunt songs, a chiefs' council determines the route, the people
    start toward the lowing herds, and the herds retreat but remain visible at a distance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Runners go in search of the herds with aid from birds, return with good news,
    and a herald reports the council decision, repeats the director's admonition,
    and proclaims the start signal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Later hunt songs depict the hunt field, men seeking animals they have shot,
    cutting meat, teaching plenty and economy, hunters returning to camp, boys carrying
    meat for the sacred feast, and some hunters camping on the field.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Each song is repeated four times, pauses occur after each part, and an error
    requires restarting from the first song because the order must not be broken.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The writers question whether the ritual is entire, although the old keeper-priest
