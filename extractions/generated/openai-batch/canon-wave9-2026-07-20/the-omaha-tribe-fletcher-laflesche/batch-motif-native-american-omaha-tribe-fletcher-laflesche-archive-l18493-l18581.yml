canonical_text:
  quote: The ritual deals with the gift of the buffalo to man
  summary: 'The passage summarizes the Omaha ritual of the White Buffalo Hide: a nineteen-song
    rite in four groups concerning the sacred pipe, supplication to Wakon/da, the
    creation and increase of buffalo for human benefit, and an ordered communal buffalo
    hunt ending in meat preparation and sacred feast provisions. It also notes strict
    rules of repetition and sequence, and uncertainty about whether the recorded ritual
    is complete.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The ritual is described as dramatic in character, composed of nineteen songs
    divided into four groups, and concerned with the gift of buffalo to man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a supernatural presence pervades the ritual from opening
