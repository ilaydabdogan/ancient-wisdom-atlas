canonical_text:
  quote: ''
  summary: The passage describes Omaha warfare as deadly and devastating rather than
    governed by humane restraint. It states that an Omaha warrior who could not escape
    fought until death, that enemies were killed rather than captured, and that Omaha
    custom did not include prisoner adoption. It notes that women were sometimes allowed
    to escape and gives an example of a war captain ordering his men to let a fleeing
    woman go. It also states that no authentic account had been obtained of Omaha
    torture of anyone during the previous century or more.
