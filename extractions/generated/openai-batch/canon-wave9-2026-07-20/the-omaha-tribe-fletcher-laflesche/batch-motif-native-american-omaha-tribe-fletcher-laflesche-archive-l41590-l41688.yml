canonical_text:
  quote: ''
  summary: The passage introduces an appeal by Omaha tribal members for individual
    land patents. An ethnological writer gathers data and invites men to petition
    Congress. The memorial states that Omaha petitioners have worked and cultivated
    their allotted or claimed lands, built homes, and seek clear titles so they and
    their children can remain. Named petitioners describe uncertainty over ownership,
    the disappearance of buffalo and game, the adoption of farming, reliance on plows
    and houses, desire for law and government, and persistent requests for land titles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of the writers entered the tribe for ethnological study and believed that
    if the United States Government knew the truth, it would give the Omaha a legal
    right to their homes and to land associated with ancestral graves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer gathered data about Omaha people who had tried to support themselves
    on lands for which they held certificates or on later-selected tracts, and invited
    these men to join a petition to Congress.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The memorial identifies the undersigned as Omaha tribal members who had taken
    certificates of allotment or entered claims within the Omaha reserve.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The petitioners state that they worked their lands for three to ten years,
    cultivated five to fifty acres on each farm, and many built houses while all tried
    to make permanent homes for themselves and their children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The petitioners ask the Senate to grant each person a clear and full title
    to the land on which he has worked.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The petitioners say they labor with discouragement because the farms are not
    legally their own and because they may be forced to leave the lands on which they
    have worked.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The petition reportedly had signatures from 55 men, with appended statistics
    about cultivated land, stock, dependents, and remarks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Xitha'gaxe says he worked hard on his land to avoid begging, believed the
    land was his, then learned it was not and became hesitant to build a house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Xitha'gaxe says he cut wood three times to build a house, but each time an
    agent told him the Government wished to build one; the wood lay and rotted, and
    he asks for title and a house of his own.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hon'donmonthin says that when he was a boy he saw game, buffalo, and animals
    used by his forefathers, but now they are gone and he sees houses and white men
    cultivating the land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hon'donmonthin says he wants title to his land, is troubled about it, and
    in the morning looks at his fields while wishing God may help him do better with
    his land and let it be his own.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mawa'donthin says he took hold of the plow without knowing how, put in his
    ponies, and his wife held the reins.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mawa'donthin says he supports titles, wants title to his land, and thinks
    his children will know the good it brings even if he does not.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Wa'thishnade says that before farming he was a wild Indian going around the
    country looking for death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Wa'thishnade says the reserve lacks government and law, that this creates
    trouble, and that the petitioners will keep asking until the Government grants
    titles.
  category: speech
  evidence_refs:
  - ev:8
