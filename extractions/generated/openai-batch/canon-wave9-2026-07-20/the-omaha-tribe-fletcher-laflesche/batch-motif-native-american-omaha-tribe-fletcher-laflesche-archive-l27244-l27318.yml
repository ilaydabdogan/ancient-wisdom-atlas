canonical_text:
  quote: ''
  summary: The passage describes Omaha war rites connected with Sacred Packs of War,
    whose sacred contents were bird skins. Birds are described as associated with
    sky powers, storm, and Thunder, the god of war, and as messengers or officers
    through whom Thunder knows warriors' deeds. Aggressive warfare required ceremonies
    connected with these packs for tribal sanction. Unauthorized war parties could
    incur severe punishment, public humiliation, loss of honor, compensation obligations,
    and exclusion from chiefly advancement.
  language: English
  quote_policy: summarized
