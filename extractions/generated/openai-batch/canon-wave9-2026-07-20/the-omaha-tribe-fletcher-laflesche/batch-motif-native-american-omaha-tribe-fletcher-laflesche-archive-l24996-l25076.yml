canonical_text:
  quote: In their play the children were apt to mimic the occupations of their elders.
  summary: 'The passage describes Omaha children''s amusements: make-believe housekeeping,
    hunting, ponies, warriors, handmade toys and dolls, a follow-the-leader game called
    “the crooked path,” quiet games by the fire, bone-slide throwing, and a bird-striking
    sport during the buffalo hunt.'
  language: English
  quote_policy: quoted
