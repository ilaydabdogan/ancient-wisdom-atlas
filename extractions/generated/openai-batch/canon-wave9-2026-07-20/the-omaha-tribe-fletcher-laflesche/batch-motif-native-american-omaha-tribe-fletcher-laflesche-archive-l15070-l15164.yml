canonical_text:
  quote: "“It held the tribe together; without it the people might scatter,”"
  summary: The passage describes the Ancient Cedar Pole as prototype of the Sacred
    Pole, both as pole-objects representing beings and associated with Thunder. It
    recounts a legendary cedar tree marked by Thunder birds from four directions and
    mysterious burning, after which people prayed to the Pole. It also explains the
    Pole’s relation to the White Buffalo Hide, political authority, warfare, hunting,
    and tribal cohesion. A keeper carries the Pole on his back during the annual hunt.
    In an incident, an elderly keeper leaves the Pole behind under hardship; a young
    man risks danger to retrieve it, returns it to the keeper, gives him his horse,
    and is made an honorary chief.
  language: English
  quote_policy: quoted
