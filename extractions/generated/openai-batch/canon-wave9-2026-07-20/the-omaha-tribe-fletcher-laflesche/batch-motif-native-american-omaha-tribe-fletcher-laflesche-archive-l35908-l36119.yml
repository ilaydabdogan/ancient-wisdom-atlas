  summary: The passage gives the dismissal song of the lodge of the "youngest son,"
    explains its few Omaha words, and states that it refers to parents speaking after
    the death of their children about following other paths over the earth. It then
    describes the order in which lodges depart, the washing off of paint, and introductory
    notes on songs of the lodge of the "eldest son," including slow rest songs, fast
    dramatic "shooting" songs, a thunder song after winter, and editorial comments
    on dual forces, life, death, and magic in the society's beliefs.
  language: English
