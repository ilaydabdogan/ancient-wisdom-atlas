  summary: The opening ritual addresses the Aged One, identified in the source note
    as the Primal Rock, sitting amid waters. It speaks of carrying and cleansing little
    ones, impurities drifting away, proper prayer, hills of life, the Pole of the
    Tent or willow framework dipping into water, and children placed amid wind and
    air. The source note explains the sweat-lodge stones, steam, willows, winds, four
    directions, and four hills in relation to the rite.
