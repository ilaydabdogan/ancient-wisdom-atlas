canonical_text:
  quote: ''
  summary: 'The passage gives Omaha ritual songs and explanations for actions before
    anointing the Sacred Pole: the priest is commanded to show his knife, is authorized
    by the Hon/ga to cut fat from four meat offerings, the fat is mixed with red paint,
    the Pole''s pipe is smoked as consecratory prayer, and the priest approaches and
    touches the Pole with a brush bearing sacred paint while the buffalo is identified
    as a life-giving gift from Wakon''da.'
  language: English with Omaha ritual terms
  quote_policy: summarized
