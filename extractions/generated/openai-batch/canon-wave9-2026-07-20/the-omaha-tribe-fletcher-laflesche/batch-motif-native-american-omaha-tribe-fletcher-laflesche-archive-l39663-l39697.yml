canonical_text:
  quote: ''
  summary: 'The passage explains distinctions in Omaha uses of the term Wakon''da:
    as a permeating invisible life and power addressed in prayer, as a term applied
    to mysterious objects or events, and as related to but distinct from media through
    which gifts or powers may be transferred. It describes men''s solitary pipe prayers
    in the hills with smoke and an unspoken petition, and women''s direct prayers
    without a pipe or intermediary.'
  language: English
  quote_policy: summarized
