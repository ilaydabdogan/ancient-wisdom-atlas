canonical_text:
  quote: ''
  summary: The passage describes the sacred hereditary leadership of the Inke'cabe
    gens in the buffalo surround, gives a buffalo-emergence legend connected to personal
    names, presents a fragmentary corn-origin legend for the Nini'bato subgens and
    its red-corn taboo, and describes ritual duties involving sacred corn, Sacred
    Tribal Pipes, child hair cutting, and ceremonial paint for a pole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Leadership vested in the Inke'cabe gens is described as sacred and necessary,
    and the text says that even an infant last Inke'cabe would be carried to lead
    the people in the wanon'pe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inshta'thabi served as director or leader of the surround at the last buffalo
    hunt in the winter of 1875-76 and is identified as the last waihon' of the wanon'pe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the buffalo legend, the buffalo were underground before a young bull found
    his way to the surface of the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buffalo herd followed the young bull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The herd came to a river whose water looked shallow but was deep, and the
    splashing water looked gray in the air when the buffalo jumped in.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The herd swam across the stream, found good pasture on the other side, and
    remained on the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A sequence of names in the gens is explained through buffalo-related experiences
    or traits, including water splashing gray, knob horns, a hungry calf, brown ankles,
    seven, big chest, big hair, worn horns, arrow chief, and land of the buffalo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Nini'bato subgens name is glossed as connected with keeping or possessing
    a pipe, and the red ear of corn is identified as its tabu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Nini'bato fragmentary legend, the first Inke'cabe of the Omaha are
    one man and one woman, who live together and have children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman finds little mounds, later sees unknown plants growing from them,
    gathers ears from the plants, and brings them to her husband and children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The family roasts the ears by the fire and eats them; the passage states that
    corn was sacred to these people and that they do not eat the red ear of corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Nini'bato subgens has the duty to provide ears of red corn, and at planting
    time sacred kernels are ceremonially distributed, four kernels to each family
    in the tribe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A family within the Nini'bato subgens has hereditary charge of the Sacred
    Tribal Pipes, which the passage describes as a symbol of tribal authority.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Children of this subgens have all hair cut off except two small bunches, one
    on each side of the crown; the passage says these tufts may refer to the little
    mounds from which the corn grew.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Nonxthe'bitube subdivision has hereditary right to prepare paint for the
    pole used in the He'dewachi ceremony and observes both the red-corn tabu and an
    additional charcoal tabu.
  category: relationship
  evidence_refs:
  - ev:8
