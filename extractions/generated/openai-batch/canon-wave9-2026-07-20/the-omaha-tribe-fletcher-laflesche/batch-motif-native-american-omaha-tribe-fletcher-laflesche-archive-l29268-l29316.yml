canonical_text:
  quote: The decorations were called u'kion.
  summary: The passage describes Omaha war-honor decorations and privileges associated
    with six graded honors, including eagle feathers worn in different orientations,
    arrow or bow insignia, a later necklace of gun-wadding shavings, a ceremonial
    office for the sixth grade, and a deer-tail headdress for holders of the first
    three grades.
  language: English
  quote_policy: quoted
