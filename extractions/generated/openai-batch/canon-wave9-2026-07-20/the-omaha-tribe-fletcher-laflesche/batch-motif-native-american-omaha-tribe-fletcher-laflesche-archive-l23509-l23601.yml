canonical_text:
  quote: ''
  summary: 'The passage describes Omaha etiquette in tents and earth lodges: the central
    fire governs seating and movement; guests occupy the honored space behind the
    fire, wait quietly, and depart with formal words; in-law address may be indirect
    as respect for elders; personal names are avoided in favor of kinship or formal
    address terms; strangers are not asked names or business; bird sayings are presented
    as a reversal of these social customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In tents and earth lodges, the fire is described as central and as the point
    from which rules of etiquette are drawn.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The space behind the fire, opposite the entrance, is described as the place
    of honor for guests, with skin robes spread for comfort and welcome.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A guest must not pass between the host and the fire, and no one is to pass
    between a seated guest and the fire without notice and apology.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A newly arrived guest sits quietly for a time before conversation begins,
    and important matters are not introduced hastily.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When leaving, a guest rises, uses the proper relationship term, and says either
    Shonpa'xeJia, glossed as “I have finished,” or te ha, glossed as “permit me.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage describes indirect-address customs between spouses and parents-in-law,
    especially toward the wife's parents and the husband's father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Old Omaha men are reported to explain the in-law address custom as respect
    shown by the younger to the elder generation, though the rule was not rigidly
    practiced.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that an individual's personal name is not used to address
