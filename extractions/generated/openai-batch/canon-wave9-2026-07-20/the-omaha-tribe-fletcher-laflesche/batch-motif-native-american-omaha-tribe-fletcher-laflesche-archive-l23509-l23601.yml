  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kinship terms are described as the ordinary terms of social intercourse, while
    formal terms are used for strangers, respected men, women, boys, and young men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Politeness forbids asking a stranger his name or his business; the passage
    reports that embassy men could transact business and leave without their personal
    names being learned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage presents bird sayings in which the whip-poor-will sings its own
