canonical_text:
  quote: ''
  summary: The passage describes Omaha subgens organization, including animal-related
    taboos, symbolic child haircuts representing birds, turtles, and eagles, obsolete
    turtle rites connected with rain and storms, camp positions, and the ceremonial
    pipe and council role of the Te'pa itazhi subgens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For the Wazhin'ga itazhi subgens, the tabu was all small birds; boys might
    shoot arrows or strike at birds in games but would not touch a bird with their
    hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wazhin'ga itazhi child's hair was shaved except for a fringe around the
    skull base, a short front lock, and a broad back lock; these parts were explained
    as the bird body's feathered outline, head, and tail.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wazhin'ga itazhi camped next on the left of the Waca'be itazhi.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The name Ke'in is explained as compounded from words meaning turtle and to
    carry, glossed as turtle carriers or bearers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ke'in rites are said to have fallen into disuse and to be known only by
    tradition.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Ke'in tradition, a turtle form was outlined on the ground and sod was
    cut out to make an intaglio figure; ceremonies connected with the figure pertained
    to securing rain and dispelling storms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ke'in tabu was the flesh of the turtle, which could not be eaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The Ke''in child''s hair was cut to represent a turtle: a short fringe outlined
    the shell, a forehead tuft represented the head, two tufts on each side represented
    feet, and a nape lock represented the tail.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ke'in camped on the left of the Wazhin'ga itazhi.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The name Te'pa itazhi is derived as buffalo, head, and do not touch; rites
    pertaining to the buffalo head are described as lost, with no trustworthy tradition
    remaining.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A pipe was given to the Te'pa itazhi subgens to insure its place, as representative
    of its gens, in the tribal Council of Seven Chiefs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The head of the Te'pa itazhi subgens had an official position as one of the
    bearers of the Sacred Tribal Pipes when they were ceremonially smoked.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Te'pa itazhi tabu was the head of the buffalo; members would not touch
    a spoon made from buffalo horn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Te'pa itazhi child's hair cut referred not to the buffalo-head tabu but
    to the eagle connected with the pipe; the remaining tufts and locks represented
    the eagle's head, tail, and two wings.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Pipes used in the Wa'wan ceremony could be painted on tents of members of
    the gens, one on each side of the entrance and one at the back.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Te'pa itazhi camped next on the left of the Ke'in.
  category: setting
  evidence_refs:
