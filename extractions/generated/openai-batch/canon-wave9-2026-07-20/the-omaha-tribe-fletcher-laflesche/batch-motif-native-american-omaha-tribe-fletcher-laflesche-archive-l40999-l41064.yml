canonical_text:
  quote: ''
  summary: The passage recounts United States treaties and acts concerning the Omaha
    reservation from 1865 to 1907, including land sales for Winnebago occupancy, use
    of proceeds for agricultural and school purposes, the end of treaty-making in
    favor of legislation with tribal consent, allotment in severalty, United States
    citizenship for allotted Omaha, railroad rights-of-way, and the establishment
    of the towns Rosalie and Walthill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A March 1865 treaty at Washington recorded the Omaha sale of a northern strip
    of their reservation to the United States for Winnebago occupancy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Part of the payment for the 1865 land sale was designated for stock, implements,
    breaking lands, and related purposes, and the treaty repeated a provision for
    individual Omaha holdings including certain relatives residing with them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'An act of March 3, 1871 changed the mode of United States negotiations with
    Indian tribes: treaties were no longer to be made, and legislation was to be enacted
    with tribal consent.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A June 1872 act recorded the Omaha sale of 50,000 acres from the western part
    of the reservation, with proceeds designated for fences, houses, implements, livestock,
    and schools.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A June 1874 act recorded the sale of 20 additional sections in the northern
    reservation for Winnebago use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An August 7, 1882 act allotted Omaha lands in severalty to each man, woman,
    and child, with patents held in trust by the United States for twenty-five years
    and restrictions on taxation, encumbrance, and sale during the trust period.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The 1882 act placed the Omaha under Nebraska civil and criminal law and opened
    specified unallotted reservation land to purchase by white settlers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A clause in the severalty act of February 7, 1887 made allotted Omaha citizens
    of the United States.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Railroad rights-of-way through the reservation were granted in 1894 and 1896;
    a survey was approved in 1905, and the road was completed and operating through
    the reservation in April 1907.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two towns, Rosalie and Walthill, were located on the railroad, with townsite
    approvals and first lot sales recorded in 1906 and 1907.
  category: setting
  evidence_refs:
  - ev:6
