canonical_text:
  quote: ''
  summary: The passage describes Omaha customs for butchering deer, antelope, elk,
    and buffalo after a chase. It explains helper rights, killer’s rights, marked
    arrows, methods of positioning and flaying the animal, named hides and their uses,
    skilled cutting, buffalo meat portions and their graded values, a ritual restriction
    on choice side meat used in the Anointing of the Sacred Pole, and the treatment
    of the tongue as a delicacy remembered for children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a chase, anyone could help butcher the game, and the first person to
    arrive had to begin work at once to secure the rights of the first helper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Animal portions were graded and assigned by custom to helpers according to
    the order in which they began work on the carcass.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man who shot the animal retained rights in it even if others began cutting
    it before he arrived.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each man’s arrows bore a peculiar mark, so the fatal shot and the killer’s
    share could be identified without dispute.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Animals were positioned on the back with the head drawn backward and tucked
    to support the body before butchering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hide was removed through a sequence of incisions intended to leave the
    hide in one piece.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hide belonged to the man who killed the animal, and different seasonal
    buffalo hides had distinct names and uses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Straight, well-made cuts required practice and increased the pride, value,
    and beauty of a skin, especially when used as a robe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: After flaying a buffalo, the butchering proceeded through named portions including
    hind leg, fore leg, breast, side meat, ribs, and tongue.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:10
  text: Two portions of side meat were considered choice; they were offered at the
    ceremony of Anointing the Sacred Pole and were taboo to the Waxthe'xeton subgens
    of the Hon'ga, who had charge of those rites.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tongue was the last part removed and could be left untouched when hunters
    were late or in haste.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A speaker explained that men might overlook small delicacies, but remembered
    them when their children asked for them.
  category: speech
  evidence_refs:
  - ev:7
