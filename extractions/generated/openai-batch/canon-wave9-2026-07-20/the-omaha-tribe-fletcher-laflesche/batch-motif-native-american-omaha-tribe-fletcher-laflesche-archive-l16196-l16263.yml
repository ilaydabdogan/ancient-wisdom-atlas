canonical_text:
  quote: I make him beautiful! I make him beautiful!
  summary: 'An eyewitness describes an Omaha ceremony centered on the Sacred Pole:
    offerings are made, meat fat is mixed with burnt red clay and used to paint the
    Pole, a woman in buffalo and eagle regalia pierces a feather/down bundle with
    arrows, meat is distributed to the Honga keepers of the Pole, and a staged alarm
    and mock battle are performed before the Holy Tent and Sacred Pole.'
  language: English
  quote_policy: quoted
