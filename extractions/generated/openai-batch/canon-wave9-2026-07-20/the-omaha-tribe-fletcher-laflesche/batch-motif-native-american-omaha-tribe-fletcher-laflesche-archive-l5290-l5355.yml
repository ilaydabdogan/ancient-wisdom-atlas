  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A later tradition says the Omaha were camped in timber when a man heard pounding
    in the woods, investigated, and returned to camp in great fright.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The frightened man said he had seen a beast-like being with a hair-covered
