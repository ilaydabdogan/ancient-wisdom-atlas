canonical_text:
  quote: ''
  summary: The passage presents Omaha traditions and historical commentary concerning
    early meetings with white people. In the Sacred Legend, the Omaha see unknown
    white objects on the water, hide and watch, then feed a starving man left behind
    by the strangers; later the strangers reciprocate with iron implements. The passage
    also gives historical notes about French contact and a later tradition in which
    an Omaha man hears pounding in the woods and sees an unfamiliar hairy-faced, pale-skinned
    being associated with the name wa'xe and early traders identified as French.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage locates the first meeting with the white race in a northern region
    near lakes where the Omaha used birch-bark canoes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people discovered white objects on the waters, did not know what they
    were, and became frightened as the objects floated toward shore.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people abandoned their canoes, ran to the woods, climbed trees, and watched
    from hiding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men were seen getting out of the white objects; the Indians watched the strange
    men for several days without speaking to them or going near them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The strangers later entered the white objects and floated away, leaving behind
    a starving man whom the Indians thought was a leader.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Indians approached the starving man with a stalk of maize having ears
