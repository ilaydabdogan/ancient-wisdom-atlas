canonical_text:
  quote: ''
  summary: 'The passage describes parts of an Omaha ceremony: mourning women respond
    to the ceremony''s contrast with loss, other women bring gifts that can be counted
    toward men''s honors and membership eligibility, willow wands are prepared and
    carried as symbols of the tribe''s people, keepers and an honor woman smoke a
    ceremonial pipe, and a ritualized war action is performed against a selected tree.
    The tree is struck, cut with four-direction gestures, felled toward the east,
    and the passage explains the simulated war action as manifesting Thunder''s authority
    over warriors, honors, and death in battle.'
  language: English
  quote_policy: summarized
