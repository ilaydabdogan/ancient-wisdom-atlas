canonical_text:
  quote: ''
  summary: An injured boy is examined, carried into a hastily erected tent, and treated
    by buffalo doctors. A doctor says that a buffalo vision revealed medicine and
    taught a song; he prepares roots, sings with the other doctors, uses water, imitates
    a buffalo, and forces the water into the wound. The father and the man who wounded
    the boy make gestures of thanks, and a second doctor repeats the treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy lies on the ground with blood coming from wounds on the back of his
    head and under his right eye.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tall man wrapped in a buffalo robe examines the boy's wrist and heart, says
    he is alive, and orders a tent to be set up for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man is sent to call the buffalo doctors, who arrive on horses and
    enter the tent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sides of the tent are raised to admit air and allow the people to witness
    the operation.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: One buffalo medicine man recounts that, in a vision, he saw a buffalo that
    revealed the secret of the medicine and taught him the song to use with it.
  category: speech
  evidence_refs:
  - ev:3
