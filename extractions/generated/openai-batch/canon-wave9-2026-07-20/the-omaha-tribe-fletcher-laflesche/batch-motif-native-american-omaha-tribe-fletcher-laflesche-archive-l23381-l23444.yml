canonical_text:
  quote: ''
  summary: An Omaha ethnographic passage records teachings used in the care and training
    of children and young men. Elders warn against laziness, borrowing, theft, envy,
    and violation of hunting rights; they also prescribe or forbid particular uses
    of animal parts, including swallowing turtle heart and eating buffalo heart fat
    or liver for strength, courage, self-control, and voice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old men warn that lack of industry leads to borrowing possessions, being disliked,
    temptation to steal, and disappointment when buffalo meat is given to a thrifty
    and generous person instead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys were made to swallow a turtle's heart so their hearts would be strong;
    the first-person speaker says he swallowed one and afterward could control himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The turtle is described as hard to kill: its removed heart can still quiver
    and its severed head can still bite; only the heart was used in the described
    practice.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old men state that a young man or lad must not unjoint a game rib, eat elk
    marrow, or pick rabbit bones with his teeth, and they attach bodily consequences
    to these acts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A lad is warned not to eat a turkey's head or play with cut-off turkey legs
    because these acts are said to cause watery eyes while hunting or cold, frost-bitten
    fingers in winter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fat around the buffalo heart was given to children for strong hearts and courage,
    and buffalo liver was to be eaten raw to make a man courageous and give him a
    clear voice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A lad must not shoot a buffalo already wounded by a man, because the buffalo
    belongs to the man who first wounded it; a lad who did so would be chastised.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Instruction prohibits envy, maiming another man's horse, and taking another
    person's robe, blanket, moccasins, or other property; yielding to such temptation
    leads to being shunned.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage links laziness with ragged clothing, poor moccasins, lack of good
    arrows, poverty, damaged horses, a hole-filled tent skin, and avoidance of one's
    own tribe.
  category: speech
  evidence_refs:
  - ev:7
