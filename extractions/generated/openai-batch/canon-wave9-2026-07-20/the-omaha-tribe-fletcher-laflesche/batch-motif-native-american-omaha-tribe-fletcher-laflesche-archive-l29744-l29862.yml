    of his ability to fulfill his promise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A war-party leader who wishes to practice augury is said to rely on the wolf
    or crow to reveal future events.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: In a story about Shu'degaxe and Mixa'ska, Shu'degaxe hears a wolf howling
