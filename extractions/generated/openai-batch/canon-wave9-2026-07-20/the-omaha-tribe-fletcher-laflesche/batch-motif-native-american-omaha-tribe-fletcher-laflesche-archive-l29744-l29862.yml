canonical_text:
  quote: ''
  summary: A ritual song and its explanation describe the wolf and crow as ancient
    helpers who bring animal herds near, sustain people with food, and aid warriors
    and hunters. The passage explains the refrain, links the animals' ancient 'moving'
    to Wakon'da, recounts the creation of the soldier office and the war ornament
    called 'the Crow,' and gives traditions about a crow offering a white down token
    and a war leader interpreting a wolf's howl as a promise of victory in exchange
    for a vow to feast with him.
  language: English
  quote_policy: summarized
