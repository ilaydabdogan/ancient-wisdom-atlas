canonical_text:
  quote: ''
  summary: The passage describes a Ponca ceremony for conferring graded war honors.
    It identifies ancient and modern sacred packs, their keepers, dream affiliations
    with Thunder or the gray wolf, seasonal timing, camp arrangement, testimony before
    the pack under divine sanction, and the badges, duties, and privileges attached
    to four war honors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Ponca ceremony of conferring war honors bore the
    same name as the Omaha ceremony and that the account is presented to aid comparison
    between the two tribes' customs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists three ancient packs and two modern packs; the keepers of
    two ancient packs and both modern packs are associated with dreams of Thunder,
    while one ancient pack descended from a grandfather and is associated with dreams
    of the gray wolf.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony had no fixed time; the pack keepers chose a summer time after
    thunder had sounded and when animals, bugs, and snakes were above ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the ceremony was to occur, the people camped in the order of the gentes
    and made the hu'thuga complete; victorious warpath participants and men from defensive
    battles stood in a line near the center of the tribal circle facing the entrance.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Candidates had sent horses and goods to the pack keeper as fees; the keeper
    designated a man to carry the pack, and the pack bearer stood before the line
    of warriors leaning on a planted forked staff throughout the ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The keeper addressed a warrior as 'My servant' and warned him to tell the
    exact truth, saying that the gods heard crashing among the clouds would strike
    him dead if he did not.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The warrior addressed his story to the pack rather than to any person; if
    no one questioned, disputed, or corrected him, the keeper conferred the honor
    belonging to his action.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The first honor was for striking an unwounded man; its signs included an upright
    eagle feather in the scalp lock, gray-wolf-skin moccasin strings, black paint
    on the upper body, and authority to nominate soldiers.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The second honor was for being first to strike a fallen enemy; its signs included
    a horizontal eagle feather in the scalp lock, irregular black body stripes, and
    being called to serve as a soldier.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The third honor was for being second to strike a fallen enemy; it had no badge,
    but entitled the man to sit and eat with soldiers and to duties connected with
    stopping or managing the moving camp.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The fourth honor was for killing a man; if done with a gun, the slayer carried
    a gun with its end painted red, wore a necklace of shavings, and received a named
    buffalo meat cut; if done with an arrow, he wore an arrow in the scalp lock with
    half the shaft painted red and received a different meat cut.
  category: attribute
  evidence_refs:
  - ev:11
  - ev:12
