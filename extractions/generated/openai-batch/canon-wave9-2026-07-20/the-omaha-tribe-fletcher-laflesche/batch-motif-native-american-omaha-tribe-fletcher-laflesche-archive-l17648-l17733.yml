  summary: The passage classifies Omaha hunting terms and practices, distinguishing
    solitary and small-party hunts from the annual tribal buffalo hunt. It describes
    seasonal timing, the special ceremonial and religious character of buffalo hunting,
    gens-based leadership in buffalo chasing, hunting methods for deer and elk, and
    names for butchered meat.
