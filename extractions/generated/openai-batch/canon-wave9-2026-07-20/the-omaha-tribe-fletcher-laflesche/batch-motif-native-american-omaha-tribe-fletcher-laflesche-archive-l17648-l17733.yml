literal_observations:
- id: obs:1
  text: The passage lists several named ways of going hunting, including solitary
    family hunting, a man or small male group searching for game, bivouacking among
    deer, and driving or starting up game.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the shkonthe form of deer hunting, hunters scattered and advanced abreast
    while younger brothers or sons rushed into the woods to start up the game and
    sometimes take a shot themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who was not a good hunter might join a shkonthe party and try to reach
    a slain deer first in order to gain first butchering rights and receive a particular
    cut of meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The small-party hunting forms named in the passage were fall and winter activities
    and were not organized under a leader.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The annual summer tribal buffalo hunt occurred after the cultivation of corn,
    provided the main supply of meat, involved the entire tribe, and was attended
    with much ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The winter buffalo hunt was undertaken for pelts, and chasing a found herd
    involved intercepting or surrounding the animals at every turn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man of the Inke'cabe gens was present in a winter buffalo-hunting party,
    he had the right to lead the company by virtue of his gens, and the hunters obeyed
    his authority.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The buffalo hunt was inaugurated and conducted with religious rites recognizing
    dependence on Wakonda and enforcing formalities that gave each tribal member an
    opportunity to obtain a share in the game.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Elk and deer were not treated as having the same vital relation to the people
    as buffalo, so hunting them involved less ceremony.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: For still-hunting deer, a lone man used a whistle imitating a fawn's cry to
    attract male and female deer.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: When animals were butchered, their flesh was given the common name ta; fresh
