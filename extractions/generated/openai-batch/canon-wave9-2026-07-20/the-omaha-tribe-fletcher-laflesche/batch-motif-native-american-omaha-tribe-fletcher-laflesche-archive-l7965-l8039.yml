canonical_text:
  quote: ''
  summary: The passage describes Omaha and related child rites. Among the Omaha, when
    a child could walk unaided, the child underwent the Thiku'winxe, or Turning the
    Child, a ceremony introducing the child into the tribe and relating the child
    to wind, earth, fire, stone, moccasins, and names. A footnote describes Osage
    rites in which a ritual man recites creation accounts and prepares an infant for
    nourishment, water, and solid food. The passage also explains Omaha and Oto customs
    involving a hole cut in a baby's moccasin as an indirect prayer for long life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Omaha, after birth no further ceremony concerning the child's relation
    to the cosmos, gens, or tribe took place until the child could walk steadily by
    itself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the child could walk unaided and direct its own steps, it was ceremonially
    introduced into the tribe.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: The ceremony is named Thiku'winxe and is translated in the passage as “turning
    the child.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: All Omaha children, both boys and girls, passed through the Turning the Child
    ceremony.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ceremony is described as directly related to the cosmic forces of wind,
    earth, and fire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the ceremony the children were symbolically sent into the midst of the
    winds, their feet were set upon stone, and the flames were invoked to aid them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the ceremony moved the child into status as a distinct human
    being, a member of the birth gens, and a recognized member of the tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the rite, the child's baby name was thrown away, new tribal-style moccasins
    were put on, and the child's ni'kie name was proclaimed to nature and the assembled
    people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A family custom cuts a small hole in the sole of one moccasin made for a little
    baby.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hole in the baby moccasin lets the child answer a spirit-world messenger
    that it cannot go on a journey because its moccasins are worn out.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: An Oto custom also cuts a hole in a child's first pair of moccasins, and visiting
    relatives interpret the worn moccasins as showing that the child has traveled
    over the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage describes the Oto moccasin statement as an indirect prayer that
    the child may live long.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The new whole moccasins put on after the Omaha ceremony are said to assure
    that the child is prepared for the journey of life and that the journey will be
    long.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Osage rites described in the footnote, a man who had talked with the
    gods recites creation-related accounts and touches the child's lips and body before
    the child receives nourishment, water, or solid food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:15
  text: The Turning the Child ceremony took place in springtime after the first thunders
    had been heard.
  category: setting
  evidence_refs:
  - ev:7
