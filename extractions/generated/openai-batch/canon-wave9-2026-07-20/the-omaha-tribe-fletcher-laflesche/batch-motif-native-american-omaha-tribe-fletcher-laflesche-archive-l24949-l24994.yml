canonical_text:
  quote: ''
  summary: The passage describes Omaha household and personal property rules, ownership
    by wives, men, women, children, and societies, the absence of communal ownership
    in land or food, the description of land as bountiful mother earth, burial of
    some articles with the deceased, inheritance of other possessions, hospitality,
    a meat offering at the ceremony of Anointing the Pole, and ownership or free use
    of certain songs.
  language: English
  quote_policy: summarized
