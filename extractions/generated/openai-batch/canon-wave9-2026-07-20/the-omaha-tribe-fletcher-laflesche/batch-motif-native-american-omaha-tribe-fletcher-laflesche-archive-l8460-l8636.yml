canonical_text:
  quote: ''
  summary: The passage explains that hair can typify life and that cutting a lock
    from a boy and giving it to Thunder gives the child's life into the god's keeping.
    A later crown lock is kept distinct, bears war honors, and is cut from a slain
    enemy as a central triumph object because it represents the enemy's life. A ritual
    song presents the Thunder god as accepting the consecration through the hair lock
    and declaring control over the warrior's life, with death occurring when the god
    wills. The editors note uncertainty about the full sequence of songs but state
    that a following song was the final song of the ceremony.
  language: English, with Omaha ritual song text and English translations/commentary
  quote_policy: summarized
