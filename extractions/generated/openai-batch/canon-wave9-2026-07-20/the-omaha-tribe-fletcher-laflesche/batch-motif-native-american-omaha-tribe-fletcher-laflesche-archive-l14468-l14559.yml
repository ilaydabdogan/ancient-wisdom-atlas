canonical_text:
  quote: ''
  summary: The passage describes Omaha rules and punishments for offenses including
    kin responsibility, adultery, murder, scaring game during a buffalo hunt, and
    disturbing tribal peace. It describes banishment of a murderer, precautions against
    the murdered person’s spirit haunting the village and bringing famine, the use
    of fat as a symbol of plenty, reconciliation through Tribal Pipes and gifts, and
    a form of chastisement by chiefs called wazhin'agthe. It also cross-references
    a similar Ponca custom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives are described as standing as one in offenses, so one relative could
    be held responsible for another’s acts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Running off with a man’s wife or adultery was punished by the husband or his
    near relatives; the woman might be whipped, and the guilty man could lose property
    or be slashed or beaten if he resisted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A jealous wife was described as likely to attack another woman with a knife,
    and such an assault, called non'wonpi, was seldom interfered with.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man’s wife died leaving children, custom required him to marry his wife’s
    sister, and the deceased wife’s relatives might threaten punishment if he failed
    to do so.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The term wanon'kathe is applied to murder or acts causing personal injury;
    unpremeditated injury could be condoned by gifts, while deliberate murder was
    punished by banishment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A banished murderer camped outside the village, communicated only with nearest
    kindred, wore a close-fitting skin garment continuously, and lived apart from
    his family.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: To prevent a murdered man from haunting his village, the body was turned face
    downward and the soles of the feet were slit lengthwise to impede his steps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The return of a spirit to haunt people was called wathi'hide, translated in
    the passage as “disturbance,” and such a spirit was supposed to bring famine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A piece of fat was placed in the murdered man’s right hand so that, if he
    came to the village, he would bring plenty rather than famine; the passage states
    that fat was the symbol of plenty.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: After sentence was passed on a murderer, chiefs took the Tribal Pipes and
    gifts to the murdered man’s family; if the family accepted the gifts and smoked
    the pipe, no further disturbance followed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The offense wathi'hi consisted of scaring off game during the buffalo hunt
    by secretly hunting for oneself, thereby imperiling the tribe’s food supply.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The punishment for wathi'hi included flogging by soldiers; resistance brought
    double flogging, and the offender’s tent, horses, property, and tent poles could
    be destroyed, confiscated, or burned.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The punishment called wazhin'agthe is described as chiefs placing will power
    on an offender, putting the person out of friendly relations with men and animals.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage directs the reader to a Ponca custom for a similar placing of
    the mind on an offender and then introduces White Eagle, a Ponca narrator, before
    the next account.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: A figure caption in the passage identifies rattlesnake heads and fangs.
  category: object
  evidence_refs:
  - ev:12
