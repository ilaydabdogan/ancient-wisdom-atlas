canonical_text:
  quote: ''
  summary: A Ponca tradition recounts the Ponca separation from the Omaha, their movements
    near rivers and buffalo-hunting country, their first encounters and battles with
    the mounted Padouca, their initial misunderstanding of horses, a Padouca speaker's
    claim that a Ponca grave-spirit gave him the Ponca language, a peace and barter
    exchange through which the Ponca acquired horses and instruction, and renewed
    war in which the Ponca stole horses and returned toward the Missouri.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ponca are described as the last of the cognates to form a separate tribe,
    with departure occurring near the time of a peace ceremony involving the Omaha,
    Arikara, and other tribes and on or near the Missouri River.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ponca tradition says the people followed a stream northward to a place where
    they could step over the water, then turned southward and hunted buffalo toward
    the Rocky Mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before encountering the Padouca, the Ponca had dogs as their only burden-carrying
    animals and traveled on foot.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ponca first met the Padouca while hunting buffalo, and the Padouca were
    mounted on animals that the Ponca initially thought were part of one creature
    with the riders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes Padouca weapons and protections, including elk-horn
    bows, bone-tipped arrows, stone battle-axes, rawhide horse armor, rawhide shields,
    and some breastplates.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: After learning that the mounted being was a man on an animal, the Ponca called
    the animal kawa; horse odor could warn them of the Padouca approach, and a herald
    announced the warning to camp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ponca killed both Padouca men and horses because they did not yet know
    the use of horses, and they could not locate Padouca villages because the Padouca
    moved away from their dwellings when meeting them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a great battle, the fighting lasted all day until a Ponca shot a Padouca
    in the eye and he fell from his horse, after which the battle ceased.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Padouca man approached, motioned for a Ponca to come forward, spoke in Ponca,
    and said he knew the language as a gift from a Ponca spirit who rose from a grave
    and spoke to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two tribes agreed to make peace, exchanged visits, and the Ponca bartered
    bows and arrows for horses while learning where the Padouca village was located.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Padouca taught the Ponca to ride horses and to put burdens on them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After learning to use horses, the Ponca renewed war, attacked the Padouca
    village, fought against the village stockade, stole many horses, and returned
    eastward to the Missouri with horses after the Padouca abandoned the village.
  category: sequence
  evidence_refs:
  - ev:10
