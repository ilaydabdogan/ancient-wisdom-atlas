canonical_text:
  quote: ''
  summary: 'A “Quest of Food” second song repeats address formulas to buffalo-related
    addressees: a generic male or bull, a majestic one, a cow or mother one, a young
    buffalo, and an addressed difficulty. The literal translation explains the formula
    as asking the moving addressee to come nearer. The commentary identifies the song
    as supplicating and explains that the newborn male is called toward humans, for
    whose benefit he was created; the second stanza presents the male as grown and
    imposing.'
