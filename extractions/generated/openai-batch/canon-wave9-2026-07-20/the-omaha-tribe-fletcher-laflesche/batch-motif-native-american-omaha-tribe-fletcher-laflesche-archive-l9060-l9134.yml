  text: A young man fasted for many days and, while returning home, entered an earth
    lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four men in the lodge greeted the young man, assigned him a guest place, and
    gave him food; weapons were hanging on the lodge posts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the doorway the young man was shown a spear and a battle-ax and told to
    choose; he chose the battle-ax after considering it the manliest weapon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the way to his village the chosen battle-ax had turned into a hoe, and
    when he arrived home he became as a woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second young man had fasted many times and had dreams that he believed would
    make him a man of valor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The second young man led followers on the warpath, defeated an enemy, and
    returned with trophies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During a victory dance, an owl hooted near the woods and repeatedly said that
