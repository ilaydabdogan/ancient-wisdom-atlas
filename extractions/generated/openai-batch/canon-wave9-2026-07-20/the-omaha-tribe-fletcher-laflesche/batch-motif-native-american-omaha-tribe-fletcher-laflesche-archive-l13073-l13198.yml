canonical_text:
  quote: ''
  summary: The passage is an ethnographic catalog of personal names in Omaha tribal
    organization, especially the Nini'baton subdivision and Washeton subgens. It gives
    name forms and meanings, including references to seven original chiefs, a solitary
    winter buffalo, grizzly bear, moon movement, thunder, horns, elk, a mythical animal,
    and some Ponca or Dakota associations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The section catalogs personal names for the Nini'baton subdivision and the
    Washeton subgens, including categories such as Ni'kie names, borrowed names, derisive
    names, female names, and A'kie names.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: The name Gahi'pethonba is explained from words for chief and seven and is
    said to refer to the seven original chiefs when the Omaha reorganized.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One name is glossed as grizzly bear maker, and Teu'koha is explained as referring
    to a male buffalo in winter whose habit was to remain alone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several female names are explained with moon references, including return
    of the new moon, moon moving above, moon traveling across the heavens, a sacred
    yellow moon, and a new coming that refers to the moon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Washeton A'kie names describe abandonment or positions in a file, such
    as the last in a file or walking last in a file.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:6
  text: Several names explicitly refer to thunder and describe motion or sound, including
    passing toward home, walking at night, noise standing, roaring as he stands, and
    an old man walking.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:7
  text: Several names use horn or horned-animal imagery, including a horn worn down,
    a horn not yet jagged from age, a white or pale horn associated with a mythical
    animal, and a branching horn referring to the elk.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage notes some names or name contexts as Ponca and identifies one
    borrowed name as Dakota.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:6
  - ev:8
- id: obs:9
  text: The name I'bahonbi is glossed as 'He is known' and is said to refer to a chief's
    son.
  category: relationship
  evidence_refs:
  - ev:8
