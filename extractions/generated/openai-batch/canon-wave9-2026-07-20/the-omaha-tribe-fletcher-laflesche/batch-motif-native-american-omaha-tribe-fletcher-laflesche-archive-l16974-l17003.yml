canonical_text:
  quote: ''
  summary: 'The passage describes discontinued Omaha rites connected with spring planting:
    lost stanzas, selection of a planting plot, thrusting a pole into the ground,
    and distribution of sacred red corn. The Hon''ga subgens kept the sacred red ears;
    the Inke''cabe provided them, served the Hon''ga, and distributed four kernels
    to each family. Women mixed the sacred kernels with preserved seed corn because
    the sacred corn was believed to vivify the seed, make it fructify, and bring a
    good harvest. After the rites ceased, the maize ritual continued to be sung before
    the White Buffalo Hide ritual in hunting ceremonies.'
  language: English
  quote_policy: summarized
