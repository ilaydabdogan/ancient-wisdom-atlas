  quote: ''
  summary: 'The passage describes the Omaha women''s work of dressing and tanning
    skins, called waton''the, as important labor because pelts supplied clothing and
    shelter. It outlines early steps in preserving a green skin during the annual
    hunt: washing it, stretching it with slits and pegs, and scraping flesh from it
    with an elk-leg-bone implement called we''bazhabe.'
