canonical_text:
  quote: "“Death is not to be dreaded.”"
  summary: A stranger instructs a father and mother about earth-colored body paint,
    stars, shells, a holy white swan, still lake water, and powers from mysterious
    lake animals. He directs them to lay their four children face downward by the
    water. The stranger walks over the lake and disappears; successive waves draw
    the children into the lake. After grieving, the parents find a white shell and
    a dark shell, and the mist opens like a path where the four children stand well
    and happy and tell them not to grieve.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The stranger links earth-colored body paint on the youngest child with a stated
    brotherhood of earth and stars, points to a circle of stars, and says shells are
    like stars.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stranger identifies a holy bird as the white swan, calls it leader of
    the animals about the lake, and says the down near the left wing should be worn
    on the head while the left wing symbolizes the bird’s power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stranger says the lake is still and that a person’s mind must be quiet
    like the lake so that mysterious animals dwelling there can give powers for strange
    acts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stranger tells the father and mother to remain for four days, then sings
    two songs; animals about the lake join the singing, and those on the rock strike
    the drum.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the stranger’s direction, the parents lay the four children face downward
    on the beach in order, with each child’s head placed toward the water or at the
    feet of the preceding child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stranger enters the tent, leaves his robe there, walks on the water toward
    the place where sky and water meet, and disappears beyond it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four successive waves roll over the lake and draw in the bodies of the eldest
    boy, the second child, the girl, and the youngest child, one after another.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The parents watch silently, then experience desolation and grieve by cutting
    their hair, throwing away clothing, and wailing beside the lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman finds a white shell in the water, and the man later finds a dark
    shell in the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mist parts to make an opening down the lake like a path, and the four
