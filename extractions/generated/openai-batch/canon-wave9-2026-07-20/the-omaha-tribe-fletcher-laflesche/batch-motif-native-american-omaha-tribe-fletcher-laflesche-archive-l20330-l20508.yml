canonical_text:
  quote: ''
  summary: A Ponca elder describes the Feast of the Soldiers, held after abundant
    buffalo kills. A bowl of soup and meat is placed near the lodge door, a ritual
    officer recites a four-part ritual, and four drops of broth are offered at each
    part, including offerings connected with named men, the wolf, and the crow. The
    passage explains that the broth offering recognizes long-dead chiefs as still
    living and caring for the people. The ritual invokes chiefs, a great water crossing,
    red and black clubs, and the finding of great animals.
  language: English; ritual text includes Ponca transliteration with partial English
    free translation
  quote_policy: summarized
