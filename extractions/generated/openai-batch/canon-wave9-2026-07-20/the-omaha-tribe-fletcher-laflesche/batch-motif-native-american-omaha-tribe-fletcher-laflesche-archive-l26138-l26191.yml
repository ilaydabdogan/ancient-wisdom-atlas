canonical_text:
  quote: ''
  summary: The passage gives a Wa'wan ceremonial song whose refrain Hun'ga is glossed
    as referring to a child and symbolizing peace. It explains that the song addresses
    the host, who is sought as one valued for peace and to be made a son. After the
    song, ceremonial pipes are arranged on a wild-cat skin near the fireplace with
    a crotched stick, rattles, duck-head ends, and a pipe with white feathers representing
    masculine force. The pipe movements are said to imitate an eagle descending, rising,
    and resting on its nest. Pipe bearers guard the pipes, the host leaves and later
    returns at sunset, and participants sit in prescribed places while servers fill
    pipes and tend fire and cooking.
  language: English
  quote_policy: summarized
