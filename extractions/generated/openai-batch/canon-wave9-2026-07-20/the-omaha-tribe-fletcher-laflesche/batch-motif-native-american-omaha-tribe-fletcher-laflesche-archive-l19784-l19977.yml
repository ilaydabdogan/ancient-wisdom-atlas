canonical_text:
  quote: ''
  summary: The passage describes songs associated with the Omaha communal hunt. A
    runner signals news from an eminence near camp, causing voices and gratitude,
    followed by camp restraint to avoid frightening the herd. A heraldic song announces
    the council's decree that hunters prepare to surround the herd, follow the washa'be,
    and remember the sacred articles, birds, shell, and official meanings united in
    it. The passage then introduces a seventh song proclaiming the time to start.
  language: English with Omaha song text and English explanatory translation
  quote_policy: summarized
