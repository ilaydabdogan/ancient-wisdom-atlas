canonical_text:
  quote: At the entrance facing the east he held the food up to the sun; then poured
    out the offering at the entrance to the dwelling.
  summary: 'The passage describes a ritual sequence connected with a feast: a food
    offering is raised toward the sun and poured at the east-facing entrance, sacred
    articles are touched, meat and food are served, members thank the host before
    eating, gifts are distributed through the "eldest son," and dismissal songs associated
    with instruction by a mysterious stranger are sung in prescribed order.'
  language: English
