  quote: ''
  summary: 'The passage describes Omaha punishments used to safeguard chiefly authority
    and social order: a poisoned ironwood staff kept in the Tent Sacred to War, rattlesnake
    materials associated with the poison, council authorization of lethal punishment,
    possible warning through poisoning the offender''s horses, and lesser responses
    to theft and assault.'
