canonical_text:
  quote: ''
  summary: 'A maize ritual song presents a first-person speaker standing through successive
    growth stages: leaves, joints, clothing, hair, tassels, and fruit. The final stanzas
    direct addressees to grasp, pluck, roast, rip from the cob, and eat the fruit.
    The prose note explains that the maize is anthropomorphized, calls humans to behold
    its growth and fruitage, and contains a final abnegation.'
