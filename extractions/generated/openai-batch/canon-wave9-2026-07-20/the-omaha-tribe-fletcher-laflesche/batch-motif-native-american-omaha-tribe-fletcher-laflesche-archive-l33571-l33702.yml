canonical_text:
  quote: '"I have been seeking for you over the breadth of the land."'
  summary: The passage describes a Hon'hewachi membership song composed by a man after
    the death of his beloved sister. Mourning alone on the hills, he sees and hears
    her spirit, becomes comforted, stops mourning, and resumes his duties. The passage
    also notes inherited songs, the honor attached to women bearing the mark of honor,
    the renewal of the Sacred White Buffalo Hide, and introduces the Shell Society
    as a secret society associated with magic, healing, songs, herbs, roots, and possible
    comparison with related societies.
  language: English
  quote_policy: quoted
