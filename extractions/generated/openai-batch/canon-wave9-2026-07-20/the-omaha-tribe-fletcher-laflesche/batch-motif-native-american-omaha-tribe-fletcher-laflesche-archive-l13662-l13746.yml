canonical_text:
  quote: ''
  summary: The passage describes an Omaha ball game said to have cosmic significance,
    with the ball's first movements related to winds as bringers of life and with
    the two divisions of the hu'thuga representing earth and sky. It then explains
    the invisible boundary between the two divisions, boys' fights at that boundary,
    and symbolic hair cutting as a way to teach gens identity. The later section discusses
    weak political unity, risks of group separation in buffalo country, religious
    rites kept by exogamous groups, and rites that symbolically connect cosmic forces,
    birth, well-being, and the Wind.
  language: English
  quote_policy: summarized
