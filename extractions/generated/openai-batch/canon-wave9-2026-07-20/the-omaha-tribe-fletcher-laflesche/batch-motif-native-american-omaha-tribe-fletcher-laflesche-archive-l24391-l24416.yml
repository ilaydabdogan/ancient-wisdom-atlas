  summary: 'The passage describes Omaha personal adornment: a man''s dance attire
    may include skunk or fox skin bound below the knee as a leg ornament; women part
    and braid the hair, paint the parting and cheeks red, and wear jewelry and sweet
    grass; a figure caption names mounted warriors; a man may paint his horse to represent
    a valorous act for which he won honors.'
