canonical_text:
  quote: ''
  summary: 'The passage explains an Omaha conception of Wakon''da as an invisible
    life and power permeating all things and relating seen and unseen, dead and living,
    parts and wholes. It describes gendered cosmic duality: Above/Sky as masculine
    and father, Below/Earth as feminine and mother, with sun/day masculine and moon/night
    feminine. The union of these forces is said to perpetuate life and food supply
    and to be arranged by Wakon''da. This cosmology is reflected in Omaha social organization
    into two grand divisions, Sky people and Earth people; myths say human beings
    were born from their union, and the two divisions were linked to marriage/exogamy.
    Duality is further reflected in two principal chiefs and two tribal pipes kept
    together in ceremonial use.'
  language: English
  quote_policy: summarized
