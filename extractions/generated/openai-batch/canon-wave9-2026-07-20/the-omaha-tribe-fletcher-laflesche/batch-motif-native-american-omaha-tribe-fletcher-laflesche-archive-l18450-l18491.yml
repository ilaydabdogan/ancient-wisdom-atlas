canonical_text:
  quote: ''
  summary: 'The passage describes gifts sent one at a time so they could be counted
    toward one hundred, enabling a man to enter the Hon''hewachi and put a mark of
    honor on his daughter. It also describes the tribal movement near buffalo herds:
    the Sacred Tent led the people, and when it stopped and the buffalo was untied,
    everyone stopped and saw the man present gifts to the Sacred Hide. A figure caption
    identifies a pipe belonging to White Buffalo Hide.'
