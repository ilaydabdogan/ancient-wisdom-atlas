canonical_text:
  quote: ''
  summary: The passage describes part of an Omaha ceremony involving a child, eagle
    down, songs, the counting of honors won in defensive warfare, carrying the child
    to a lodge, a final dance by two young men with feathered stems, symbolic movement
    toward and from the east, challenges through recounting brave deeds, receipt of
    ponies, and a token of thanks by the little Hun'ga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eagle down was sprinkled over the child's head, making the child look like
    a callow bird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Warriors counted honors while telling deeds of valor performed in defensive
    warfare.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains that only honors won in defensive warfare could be counted
    at this point because such acts defended the women and children of the tribe and
    promoted safety and perpetuation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The child could not be lifted up and carried to the lodge where the ceremony
    was to be completed until a man had counted honors won in defensive warfare over
    the child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the counting of honors, words meaning 'it is done; I carry you' were
    sung.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The child was taken on the back of a man who followed the swayed pipes while
    a song seeking the little child was sung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the lodge, the leader stood outside at the right of the door and held the
    child between his knees; the singers sat at the left of the door.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Two young men were selected for the final dance, stripped to breechcloths,
    painted with red circles on breast and back, given a hinxpe' feather on the scalplock,
    and each carried a feathered stem.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: People who had given horses to the Wa'wan party gathered their ponies, dressed
    in gala clothing, and approached the lodge to witness the final dance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The two young men danced in two straight lines to and from the east, holding
    feathered stems high above their heads and simulating the flight of the eagle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The dancers' line is said to signify that one following the teachings of the
    ceremony and the straight red line on the pipes could go forth and return in peace
    to his lodge without fear.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: A man could stop before a dancer, receive the pipe, recount deeds, and lay
    the pipe on the ground, creating a challenge that could be answered only by someone
    recounting an equal deed of valor.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Children of the donors led ponies to the leader, and the little Hun'ga stroked
    the arm of the messenger as a token of thanks.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: When all ponies had been received, the final dance ended.
  category: sequence
  evidence_refs:
  - ev:14
