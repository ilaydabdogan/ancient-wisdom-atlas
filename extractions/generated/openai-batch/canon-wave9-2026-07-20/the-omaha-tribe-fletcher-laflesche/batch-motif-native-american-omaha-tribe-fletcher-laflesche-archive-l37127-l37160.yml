  quote: ''
  summary: The passage describes an Omaha society figure-shaped bag inherited through
    generations, formerly associated with a now-lost ritual. The figure represented
    the society and was called Galii'ge tonga, “great chief.” Its head and limbs corresponded
    to society roles, kin labels, celestial bodies, animals, and bags containing poisons,
    medicines, roots, and shells.
