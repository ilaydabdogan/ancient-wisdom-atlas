  summary: 'The passage explains words in an Omaha song as recalling the birth of
    a man: an elder sister joyfully enters a secluded tent and sees a male child.
    The commentary says that, when he enters the field of action, he must prove himself
    worthy of that birth-joy, and that the song expresses the social responsibility
    placed on the men of the tribe. It also notes that the aria is sung by men and
    was harmonized by John C. Fillmore.'
