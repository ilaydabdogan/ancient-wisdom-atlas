canonical_text:
  quote: ''
  summary: 'The passage describes Omaha wathin''ethe, acts or gifts that could be
    counted toward entrance into the Hon''hewachi. It gives examples: gifts benefiting
    the tribe or the poor; Waha''xi clothing and feeding an old woman; gifts that
    restore peace or end mourning; robe gifts delivered by a child; Wa''wa and He''dewachi
    gifts; and a funeral case in which a proposed horse killing and substitute mule
    offering were both spared and counted as gifts associated with the dead.'
  language: English
  quote_policy: summarized
