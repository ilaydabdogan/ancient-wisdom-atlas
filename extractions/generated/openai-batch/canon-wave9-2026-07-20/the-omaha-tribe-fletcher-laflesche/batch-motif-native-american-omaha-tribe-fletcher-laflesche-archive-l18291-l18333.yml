canonical_text:
  quote: ''
  summary: 'The passage describes a regulated Omaha buffalo surround: two youths bearing
    the washa''be and pipestem lead two parties around the herd under the waihon''s
    command; marshals enforce order with whips; the emblems are joined as the signal
    to charge; selected boys collect buffalo tongues and a heart for a sacred feast
    and return them to the Sacred Tent of the White Buffalo Hide; the emblems and
    meat are later returned to camp, and women jerk the meat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the designated place of attack, two youths paused while hunters divided
    into two parties, one following the youth with the washa'be and the other following
    the youth with the pipestem.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the command of the waihon, the two young men ran at full speed to circle
    the herd, followed by mounted hunters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marshals with whips held the riders back and in order; anyone breaking into
    the herd, advancing beyond the emblems, or failing to control his horse was flogged.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The marshals were the only men wearing ornaments during the hunt and were
    decorated with the insignia called “the Crow.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunters wore only moccasins and breechcloths.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the two youths met, the washa'be was thrust into the ground and the pipestem
    was tied to it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The joining of the washa'be and pipestem was the signal for the marshals to
    command the charge on the buffalo herd.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hunters charged with shouts and yells and drove the bewildered buffalo
    in confused circles toward camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two selected boys immediately took the places of the youths with the emblems
    in order to secure tongues and a heart for the sacred feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boys had to take a tongue from a fallen buffalo before that buffalo had
    been touched with a knife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boys carried unstrung bows and placed the tongues on them.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The instructed method was to open the buffalo's throat, pull the tongue through,
