canonical_text:
  quote: ''
  summary: A Ponca man who unintentionally killed another man is punished with the
    consent of the people by the dead man's father. The punishment includes cutting
    and sewing the man's robe, a ritual action with the arrow and the dead body, a
    prescribed statement denying human killing, cutting his hair, placing a buffalo-heart
    covering over his head, and banishment for four years. The passage explains a
    belief that a murdered person's spirit can raise wind, betray hunters to game,
    scatter herds, and deprive the people of food; it notes that the Omaha have the
    same belief. The man obeys the directions and weeps daily, and the dead man's
    relatives pardon him after one year, allowing him to return to his tribe and family.
  language: English
  quote_policy: summarized
