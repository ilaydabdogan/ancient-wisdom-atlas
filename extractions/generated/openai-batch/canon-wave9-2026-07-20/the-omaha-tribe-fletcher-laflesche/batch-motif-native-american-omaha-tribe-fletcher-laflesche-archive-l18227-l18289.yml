canonical_text:
  quote: ''
  summary: 'The passage describes Omaha buffalo-hunt procedures: the hunt director’s
    responsibility for the people, the movement and placement of the Sacred Pole and
    White Buffalo Hide, silence and order enforced by marshals, a procession led by
    sacred-object bearers, four ritual halts with smoke offerings to Wakon/da, and
    an incident in which a man’s interruption of the prescribed order was followed
    by injury and interpreted as supernatural punishment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hunt director is described as responsible for fortunate and unfortunate
    actions of the tribe and as belonging to the people in the manner of a hand belonging
    to a body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the herd was far enough away that the tribe had to move camp before the
    chase, the Pole and the Hide remained where the runners’ message had been received
    until the people were ready to move.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the journey to a new camp, the two sacred objects and the Seven Chiefs
    led the advance while marshals rode on the sides of the cavalcade to maintain
    order.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the new camping place, camp was made silently and silence was maintained
    to avoid frightening the herd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the herd was found near the camp, the Sacred Pole and White Buffalo Hide
    were returned to their tents and marshals enforced silence, including killing
    barking dogs if necessary.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each hunter was attended by one or two mounted boys who led fast running horses
    for the chase; the hunter’s own mount would later be used to bring meat from the
    field.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The herald’s return to the tent of the White Buffalo Hide signaled the hunters
    to move.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two young men bearing the washa'be and the pipestem started first and led
    the procession of hunters, which was headed by the director and the Seven Chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The advance to the herd occurred in four stages, and at the close of each
    stage the chiefs and the director sat and smoked.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The slow approach provided time for smoke prayer offerings to Wakon/da for
    success, checked haste and excitement, and ensured orderly progress so each person
    could take part and obtain a share of the food supply.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The four stops are described as having a religious character and as not to
    be disregarded with impunity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In a reported hunt incident, a man objected to the slow progress at the third
    halt, rushed toward the herd with other hunters, and the resulting confusion injured
    several hunters and left the man crippled for life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The disaster after the interrupted rite was regarded as a supernatural punishment
    for irreverently interrupting the prescribed order.
  category: other
  evidence_refs:
  - ev:6
