canonical_text:
  quote: ''
  summary: The passage describes Omaha sacred pipes retained by the people; the Council
    of Seven Chiefs and its delegated soldiers; rules for defense, unauthorized warfare,
    ceremonies, and admission to a society; the absence of other tribal governing
    chiefs; the importance of peace, order, and plentiful food; later disruption by
    traders and United States officials; and an older belief that a legitimate chief
    was favored by Wakonda and represented aspects of that power.
  language: English
