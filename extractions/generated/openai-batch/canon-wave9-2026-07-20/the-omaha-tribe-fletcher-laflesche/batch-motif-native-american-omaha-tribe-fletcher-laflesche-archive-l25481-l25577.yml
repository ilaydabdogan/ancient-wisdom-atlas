canonical_text:
  quote: Song was an integral part of the life of the Omaha.
  summary: The passage describes Omaha song as a central religious, emotional, social,
    and ceremonial practice. Songs are transmitted with exactness, may have few or
    no lexical words, can be owned or restricted by social membership, and are usually
    performed chorally with drums and octave doubling.
  language: English
  quote_policy: quoted
