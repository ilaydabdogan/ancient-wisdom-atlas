canonical_text:
  quote: The Arikara were the first to find the maize.
  summary: An Arikara maize-origin account tells of a young hunter who repeatedly
    sees a buffalo standing motionless in one spot between two rivers, each day facing
    a different direction. After four days the buffalo vanishes, and a strange plant
    appears in a central buffalo track. The hunter reports this to chiefs and prominent
    men, who inspect the place, believe the plant was given by Wakon/da, and arrange
    to guard it until it ripens.
  language: English
  quote_policy: quoted
