canonical_text:
  quote: ''
  summary: The passage states that magic was not part of Omaha religion or its We'wacpe
    rites. Some powers and future-looking practices were distinguished from magic,
    while Shell and Pebble society members alone claimed powerful magic. Witchcraft
    was said not to be found among the Omaha; magic was feared, but practitioners
    were avoided rather than punished.
