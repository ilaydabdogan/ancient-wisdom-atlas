canonical_text:
  quote: ''
  summary: The narrator describes appearing before the Sacred Tent where the Sacred
    Pole, called the Venerable Man, was kept. An old man accepts scarlet cloth, brings
    warm water, raises his hand to the sky, weeps, and sprinkles the people and horses
    with water using artemisia, which is said to wash away the Venerable Man's anger.
    Later, after a hunt, the camp is pitched in ceremonial form near the Platte River.
    A large Holy communal Tent is assembled from Sacred Tents and other skin tents.
    Boys play there while elders take a census with sticks for ceremonial contributions.
    On the third night officers guard the tent and restrict approach. The next morning
    boys are called by name; the narrator's mother gives him meat to bring. At the
    Holy Tent an old man in buffalo attire touches him, takes the meat, and places
    it before a dark slanting pole with a scalp on it while a man behind the pole
    transfers counting sticks as names are called.
  language: English
  quote_policy: summarized
