- id: obs:1
  text: Ancient rites pertaining to sacred stones are described as representing water
    or rain, with swan down used ceremonially on the stones and a connection to the
    Pebble society's water rites.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: All four stones are said to be lost, and the last one was probably buried
