canonical_text:
  quote: ''
  summary: 'The passage describes Omaha gens-related ritual offices and symbols: sacred
    stones associated with water or rain, swan down, the Pebble society, and a probable
    Creation connection; named family groups with duties involving sacred stones,
    wolf rites, water and swan duties, and pipes; taboos concerning swan, clay, and
    soot used for paint; a distinctive child hair cut; and a camping order for the
    groups.'
  language: English
  quote_policy: summarized
