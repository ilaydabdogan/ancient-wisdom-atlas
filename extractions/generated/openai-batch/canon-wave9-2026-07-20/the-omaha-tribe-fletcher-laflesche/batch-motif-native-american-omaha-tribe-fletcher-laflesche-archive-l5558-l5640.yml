canonical_text:
  quote: ''
  summary: The passage recounts Omaha and Iowa displacement by Dakota attacks; the
    Omaha settlement at Village creek/Omaha creek; devastation by smallpox and cholera;
    a tradition in which disfigured and despairing survivors set out as a whole tribe
    to die fighting enemies; an encounter and battle with the Ponca involving a captured
    Omaha-Ponca-affiliated warrior killed by his Omaha uncle; a failed and then successful
    peace approach using the tribal pipe; later fighting, return, contact with Lewis
    and Clark and a steamboat called a mystery boat; and eventual abandonment of the
    village because of renewed attacks, while the site continued as a burial place.
  language: English
  quote_policy: summarized
