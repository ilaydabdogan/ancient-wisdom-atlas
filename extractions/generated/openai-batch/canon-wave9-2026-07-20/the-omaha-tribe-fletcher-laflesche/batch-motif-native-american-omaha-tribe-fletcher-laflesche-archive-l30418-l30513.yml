canonical_text:
  quote: ''
  summary: The passage describes an ancient Omaha Cedar Pole kept by the We'zhinshte
    gens, its associations with cedar, thunder, thunderbirds, war, the Sacred Shell,
    and the Sacred Pole, and traditions about its form and possible painting rites
    after the first spring thunder. It then summarizes Omaha social and secret societies,
    especially the Hethu'shka society, its sacred pipes, Kon'ce custodians, heroic
    purpose, and association with Thunder.
  language: English
