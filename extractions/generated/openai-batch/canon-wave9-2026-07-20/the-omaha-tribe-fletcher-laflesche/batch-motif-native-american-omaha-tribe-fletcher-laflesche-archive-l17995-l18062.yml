canonical_text:
  quote: ''
  summary: The passage describes the Omaha procedure for appointing the waihon' and
    deciding the route and departure day for the buffalo hunt. A council is convened
    by the Hon'ga subgens with the governing council and Washa'be subgens; sacred
    pipes, formal dress, silence, speech restrictions, consensus, resource planning,
    consultation with women over difficult travel stages, heraldic proclamation, and
    a sacred feast are described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the washa'be was made, the Hon'ga subgens in charge of the White Buffalo
    Hide called a council including the governing tribal council, the Washa'be subgens,
    and the man who wished to be waihon'.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The calling of the council by the Hon'ga subgens constituted the appointment
    of the man to the office of waihon'.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The council determined the direction of travel and the day of departure, decisions
    described as important for food supply and safety from enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The food eaten at the council was dried buffalo meat or maize, cooked before
    sunrise.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunrise the two Sacred Tribal Pipes were ceremonially filled while their
    ritual was chanted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those present wore buffalo robes with the hair outside and sat bowed with
    crossed arms so that the robe covered the head like a hood.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Feathers, ornaments, and articles pertaining to war could not be worn or present
    in the Sacred Tent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Pipes were smoked formally and in silence, then cleaned by appointed officers
    and returned to their keeper.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A principal chief opened the proceedings by mentioning terms of relationship
    between himself and others present; each responded when designated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A chief or member who had given way to violence in word or act since the last
    similar council was barred from speaking officially.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The stated reason for barring such a person from official speech was that
    official action would transfer the consequences of his misdeed to the people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: After eligible speakers had spoken deliberately, the newly chosen waihon'
    summarized the views acceptable to the majority, and disagreement required the
    men to remain in council until agreement was reached.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The council laid out the general route, considering wood, plentiful water,
    and places where wild turnips could be gathered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The waihon' selected daily camps as the people traveled, usually 10 to 15
    miles apart, with wood and water again important in choosing a camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: If lack of wood or water made the distance between camps too great for one
    journey, the waihon' directed the tribal herald to consult the women and report
    the majority wish before issuing an order.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the initial council reached a decision, the official herald proclaimed
    to the people the day fixed for departure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: While the council remained in the bowed attitude, a sacred feast was served
    in seven wooden bowls, passed four times around the council, with each person
    taking a mouthful from a black horn spoon.
  category: action
  evidence_refs:
  - ev:7
