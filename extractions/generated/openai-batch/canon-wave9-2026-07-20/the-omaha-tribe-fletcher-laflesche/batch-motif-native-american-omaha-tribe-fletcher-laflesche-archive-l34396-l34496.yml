canonical_text:
  quote: ''
  summary: The passage describes an opening ceremony in which pipes are filled, smoked,
    and passed around the assembly; seven invitation sticks are carried around the
    fire to officers personating family roles; lodge packs are turned, marked with
    tobacco, struck, opened, and used to distribute regalia and medicines; paints
    are prepared; and a woman performs actions linked to a story of a mysterious stranger
    before painting occurs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The host received lodge pipes, filled one with prepared tobacco, and had a
    servant carry it to the u'zhu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The u'zhu lit, smoked, and passed the pipe to his left; additional pipes were
    sent to lodge masters, and the pipes were filled, smoked, and passed four times
    around the assembly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The host gave a servant seven invitation sticks made by the host, not reused,
    squared at both ends, and measured by the length of a clenched fist.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Holding the sticks in his left hand, the servant circled the fire and presented
    them in order to the persons identified as the "eldest son," "second son," "daughter,"
    and "youngest son"; each removed one stick and returned the rest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The accompanying diagram identifies the positions of the fireplace, entrance,
    u'zhu, family-role officers, drum, rattles, gifts, servants, and members at the
    meeting.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Keepers took up the lodge packs, held them by the ends, and turned them four
    times from left to right so that the animals and roots within the packs might
    move from north to south.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A keeper used his left hand to make four bottom-to-top lines of tobacco on
    a pack, dropped the remaining tobacco on it, struck the pack four times with an
    open palm, and lifted it slightly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the packs were untied, authorized officers distributed regalia, gave
    required medicines from the packs to members who wanted them, and placed the packs
    behind the masters' seats.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The host's red and green paint was placed on a cloth on top of the drum directly
    in front of the u'zhu.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The u'zhu sent red clay paint to a woman at the extreme south end, and she
    began combing her hair; the passage states that this represented the act of a
    mysterious stranger caring for children in the story.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The woman took her otter-skin mystery bag, went left around the circle of
    members, held her left hand out toward each person, and named the relationship
    term by which she could address that person.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The u'zhu mixed green or blue clay with water in a small wooden bowl and sent
    it to the master representing the "youngest son"; after the woman's return, she
    and the members of that lodge were painted.
  category: action
  evidence_refs:
  - ev:11
