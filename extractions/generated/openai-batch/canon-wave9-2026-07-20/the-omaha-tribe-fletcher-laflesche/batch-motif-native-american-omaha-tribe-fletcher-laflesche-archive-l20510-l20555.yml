  summary: The passage presents a ritual or song sequence in which a great herd of
    animals is associated with the people’s successful return home along a trail strewn
    with fat. A male gray wolf persona speaks of moving and galloping along the trail.
    A male crow persona says he will help and act as instructor. The people are astonished
    by a figure’s coming, disappearance beyond a ridge or hill, return, and appearance
    on the ridge; the passage concludes with the claim that one herd of animals has
    been killed for the people and that instruction has been given.
