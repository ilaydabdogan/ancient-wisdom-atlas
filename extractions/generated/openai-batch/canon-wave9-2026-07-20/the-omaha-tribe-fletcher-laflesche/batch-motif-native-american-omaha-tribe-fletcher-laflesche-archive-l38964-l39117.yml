canonical_text:
  quote: ''
  summary: The passage describes an Omaha medicinal sweat-lodge rite and a ritual
    prayer addressed to stones as the “Aged One.” The ritual presents the Aged One
    as ancient, knowledgeable, seated where paths converge, exposed to the four winds,
    and able to receive supplications for protection, healing, and long life. The
    accompanying commentary explains the stone as a symbol of the steadfast power
    of Wakon'da and compares this symbolic use to Omaha address to animals, thunder,
    lightning, and cosmic forces. The passage then begins a section on death and burial
    customs, stating that death was viewed as inevitable while long life was desired.
  language: English
  quote_policy: summarized
