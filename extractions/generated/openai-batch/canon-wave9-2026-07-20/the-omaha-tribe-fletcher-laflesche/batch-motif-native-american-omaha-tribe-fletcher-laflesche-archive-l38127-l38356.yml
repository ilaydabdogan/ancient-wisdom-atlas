canonical_text:
  quote: ''
  summary: The passage gives part of an Omaha ritual supplication to an “Aged One,”
    followed by an explanation of a sweat-lodge ritual used before initiation into
    the Pebble society. The ritual preparation includes a white dog for a feast, heated
    stones, required presence of society leaders, red painting of the dog before strangling,
    songs before ritual stages, and a warning that ritual mistakes cause early death.
    The beginning of Sweat Lodge Ritual No. 3 addresses the Aged One as a recumbent
    Rock and mentions a great water impossible to traverse.
  language: English with Omaha transliteration
