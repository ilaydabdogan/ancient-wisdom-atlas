canonical_text:
  quote: ''
  summary: 'The passage describes Omaha musical structure and performance: songs are
    not built on a defined scale, rhythm is central, singers use vocal pulsation and
    sometimes hand movement to create wavering tones, drum and melody may use conflicting
    rhythms, and the Wa''wa ceremony combines melody, drum, and swaying pipes into
    a single rhythmic presentation. It also discusses the difficulty of representing
    these songs on piano or organ and the Omaha preference for certain harmonized
    versions when songs are translated to those instruments.'
  language: English
  quote_policy: summarized
