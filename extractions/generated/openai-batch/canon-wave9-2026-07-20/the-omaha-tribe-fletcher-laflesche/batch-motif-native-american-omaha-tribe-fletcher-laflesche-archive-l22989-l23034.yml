- id: obs:4
  text: Claims by men with a potential right to marry a girl could make secret escape
    necessary if she wished to exercise free choice in selecting a husband.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A courting couple who had agreed to marry would meet in the evening; the youth
    rode near the girl's lodge, gave the signal, she came out, and they rode away
    to one of his relations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a day or two the young man took the girl to his father's lodge; if she
    was received as his wife, other men's claims to marry her were canceled by that
    act.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gifts had to be made to the girl's parents and shared with her relatives in
    order to ratify the marriage.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man's father made a feast and invited the girl's relatives; acceptance
    of the invitation and receipt of presents settled the marriage beyond dispute.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The bride's father generally later gave his daughter return gifts of about
