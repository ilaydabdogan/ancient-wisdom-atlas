canonical_text:
  quote: ''
  summary: 'The passage describes Omaha courtship and marriage customs: a suitor used
    a humble conventional proposal, lovers used signals to arrange meetings, marriage
    commonly occurred by elopement, and the union was ratified by reception at the
    groom''s father''s lodge, gifts, a feast, return gifts, and possible labor for
    the father-in-law. It then begins a story in which a respected bachelor helps
    his unsuccessful brother by wooing a girl and arranging an elopement on the brother''s
    behalf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man asking for marriage used a conventional form of address that praised
    the girl and her relations, did not boast of himself, and asked rather than demanded
    that she become his wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Signals other than songs or flute calls could inform a girl that her lover
    was near; examples include a falling tent pole or another interpretable noise.
  category: action
  evidence_refs:
