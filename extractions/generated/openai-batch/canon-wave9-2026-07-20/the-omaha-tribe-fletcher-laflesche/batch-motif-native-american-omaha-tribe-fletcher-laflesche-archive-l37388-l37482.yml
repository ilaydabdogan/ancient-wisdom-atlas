canonical_text:
  quote: ''
  summary: 'The passage recounts a story of a society member disrupting secret rites,
    being thrown from a bluff, transforming into a bird, and escaping across the Missouri
    River. It notes stories of otter-skin mystery bags becoming live otters, an explanation
    for the sacred shell, and then describes the Pebble Society: its name, vision-based
    membership, water monster imagery, clothing and body paint, seasonal secret meetings,
    and an observed ritual involving calico, fire, charcoal painting, regurgitated
    pebbles, ritual shooting, rigidity, circling the fire, and closing song.'
  language: English
  quote_policy: summarized
