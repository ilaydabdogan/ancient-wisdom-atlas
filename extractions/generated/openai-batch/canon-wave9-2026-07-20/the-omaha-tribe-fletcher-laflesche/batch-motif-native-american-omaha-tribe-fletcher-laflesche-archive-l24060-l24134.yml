canonical_text:
  quote: ''
  summary: The passage describes Omaha quill work as a women's craft, including preparation
    of porcupine quills, uses in embroidery, dye-making for black, red, yellow, green,
    and white, softening and flattening techniques, the Omaha term for quill work,
    and the usual evolution of patterns during work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Embroidery with porcupine quills is described as a feminine accomplishment,
    and Omaha women are said to have done fairly good work.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Quills were plucked soon after the porcupine was killed, sorted by length
    and size, and laid in bladder bags with the black ends together.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The largest tail quills were kept for ornamenting comb cases and workbags,
    while long medium-sized quills were reserved for fine work.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Porcupine hair and hair from the turkey's tassel were used for embroidery
    finer than could be done with quills.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fine quills were used on the upper middle line of moccasins, larger quills
    on ankle flaps, and Omaha garments were not often ornamented with quill work.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some old women said early colors were black, red, and white; they also said
    red and black were native dyes and yellow, blue, and green were introduced by
    traders, though the passage notes that yellow and dark blue could be made from
    roots known to some women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Black dye was made by roasting yellow earth or clay with tallow over fire,
    preparing a maple bark and leaf decoction in water, adding the roasted earth,
    and soaking quills overnight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Red dye was made from the root of a small marsh or lowland plant, boiled in
    water with quills until they became bright red; the dye was called 'feather dye.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Red quills were dyed early in the morning before the first meal, and few persons
    were said to be competent to dye a good red.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yellow dye was made from early cottonwood buds or roots of an unidentified
    vine; white was the natural unbleached quill color; green was colored with verdigris.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Quills were never split; they were held in the mouth for warmth and moisture
    to make them pliable.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Warm, moist quills were flattened with the nails of the right thumb and finger,
    and this treatment was repeated just before sewing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Quill work was called u'ihifke, described as an old untranslatable term; patterns
    were generally not traced but evolved as the worker proceeded.
  category: speech
  evidence_refs:
  - ev:8
