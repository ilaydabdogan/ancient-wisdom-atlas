canonical_text:
  quote: ''
  summary: 'The passage describes Omaha social amusements and practices: a game song
    fragment, post-burial foot races with gifts from the deceased person’s family,
    dramatic elements in ceremonies without a full drama tradition, swimming and diving,
    winter storytelling by elders around a fire, joking by the maternal uncle, and
    a spring boys’ festivity called inde''gthepe involving striped masks, thunder
    imitation, gift requests from maternal uncles, and tolerated mischief.'
