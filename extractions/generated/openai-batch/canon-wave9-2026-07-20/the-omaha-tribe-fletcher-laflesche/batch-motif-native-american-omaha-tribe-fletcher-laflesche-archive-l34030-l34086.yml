canonical_text:
  quote: "“Such is the story of the origin of the Shell society.”"
  summary: A couple sees a mist-veiled, great-lake-sized mythic animal after hearing
    voices. They return to their tent with provisions and later rejoin their tribe.
    Following the instructions of a mysterious stranger, they found the Shell society,
    initiate others, prepare packs with ceremonial articles and medicinal roots, and
    transmit secret knowledge and magic power said to come through the stranger as
    messenger of an animal council dwelling in and around the great lake.
  language: English
  quote_policy: quoted
