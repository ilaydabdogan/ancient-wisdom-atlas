canonical_text:
  quote: ''
  summary: The passage explains Omaha meanings attached to covering, clothing, ritual
    dress, animal hides, and war regalia. It reports an old keeper's interpretation
    of a Legend passage about early development near a great water and the desire
    for covering as self-consciousness. It then describes beliefs that all life is
    related, that Wakon'da imbues natural forms with life, and that animal or plant
    powers may strengthen human spirit. Ritual clothing, especially animal hides and
    skins, is presented as a medium for appeal to supernatural aid, while war decorations
    publicly proclaim achievements and rights to appeal to powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old keeper interpreted the Legend passage as referring to natural birth
    and the development of people who dwelt near a great water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the people's desire for covering marked the arousing
    of self-consciousness and distinguishes the Legend's term for self-covering from
    the ordinary word for clothing.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage states that Omaha thought treated nature subjectively and anthropomorphically,
    considered all life as one and related, and viewed human physical life as sustained
    by other life forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that a man's spirit, will, and power to act could be strengthened
    by the spirit or power of a bird, animal, or plant.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that natural forms were understood as imbued with life from
    Wakon'da and could serve as visible media of help for body and spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that rites grew up around the quest for food and that ceremonial
    dress exemplified the beliefs about supernatural dependence and natural forms.
  category: action
  evidence_refs:
  - ev:4
