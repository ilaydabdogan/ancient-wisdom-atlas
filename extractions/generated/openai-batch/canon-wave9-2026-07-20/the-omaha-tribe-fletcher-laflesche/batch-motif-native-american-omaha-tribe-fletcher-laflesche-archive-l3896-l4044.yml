canonical_text:
  quote: ''
  summary: The passage catalogs Osage kinship groups and subgroups, giving names,
    translations, ritual offices, attendant sho'ka groups, and several explanatory
    traditions involving peace pipes, animal and celestial names, war-party pathmaking
    and concealment, Waba'xi killing a buffalo and being reproved by Wakon'da, and
    the Thunder people whose name refers to thunder resting on a cedar tree as it
    descended.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ho'nga utanatsi are described as an 'Instructor of rites,' and the Mon'hinci,
    translated 'stone knife,' served as sho'ka or servant/intermediary between ceremonial
    officials and participants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wazha'zhe group is divided into seven subgroups, and the Wazha'zhe cka
    subgroup keeps seven pipes for making peace within the tribe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several Wazha'zhe subgroups and sho'ka subdivisions are named with animal,
    plant, water, or bird terms, including puma in the water, great turtle, cat-tail,
    loud-voiced crow, bald eagle, white-tail deer, fish, and bow makers.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Wa'tsetsi explanation says that a comet fell from the morning star and
    came to join the council of that subgroup.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Uzu'gaxe subgroup had the duty of making a war party's path clear and
    safe, and war-party scouts were taken from this group.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Monso'tsemonin sho'ka subdivision was called on to cause fog, wind, or
    dust in order to conceal a war party's movements.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hon'ga leader group includes subgroups named for bear, puma, porcupine,
    elk, earth-makers, peacemakers, white eagle, little Hon'ga, and a wind-associated
    sho'ka subdivision; the office of herald belonged to this group.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Tsi'zhu household group includes names referring to age and wisdom, fear
    of Wakon'da, wolf, crane, buffalo-face, sun-carrying, night, the Pleiades, peacefulness,
    and the last household.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: In the explanation of the Buffalo-face people, Waba'xi searched for game,
    found a buffalo, killed it by pointing his finger at its face, and was reproved
    by Wakon'da.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Ni'ka Wakondagi or Gronin group is identified as the Thunder people, and
    the Xon'tsewatse name refers to the cedar tree upon which thunder rested as it
    descended.
  category: relationship
  evidence_refs:
  - ev:9
