canonical_text:
  quote: ''
  summary: The foreword explains the basis of the Omaha study, including long-term
    personal research, institutional support, preservation of revered objects, historical
    disruption after buffalo extinction and government pressure, transformed prairie
    life, and Francis La Flesche’s collaboration in preserving Omaha ceremonies, ritual
    poetry, music, and lore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account is presented as the result of personal studies made while living
    among the Omaha and revised through ongoing contact over twenty-nine years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prof. Frederic Ward Putnam gave criticisms and permitted use of Omaha material
    collected under Peabody Museum auspices.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Objects once held in reverence by the Omaha were secured and deposited in
    the Peabody Museum for safekeeping.
  category: object
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:4
  text: When the writer went to live among the Omaha, the tribe had recently been
    forced to abandon hunting because of the sudden extinction of the buffalo herds,
    though ancient customs and memories of the old life remained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Increasing contact with the white race and rapid environmental change produced
    confusion, and inherited beliefs were described as no longer applying to the people’s
    conditions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the buffalo had been destroyed, wild grasses were changing,
    and Omaha native pursuits were restricted by a power the Omaha could not understand.
  category: setting
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:7
  text: Government dealings with the Ponca caused unrest among the Omaha, including
    fear that they might be driven from their homes and ancestral graves; relief came
    when Congress assured their lands in 1882.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:8
  text: The passage contrasts earlier prairie camps, game paths, and the annual buffalo-hunt
    trail with later towns, railroads, plowed fields, farming, English schooling,
    and bank accounts.
  category: setting
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:9
  text: The writer states that the volume uses original material gathered directly
    from native people and seeks to make the Omaha their own interpreter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Francis La Flesche is described as a collaborator of more than twenty-five
    years, the son of Joseph La Flesche, and a witness in boyhood to some ceremonies
    described in the volume.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ceremonies were explained to Francis La Flesche by his father and old men
    described as keepers of ancient rites and rituals; he aimed to preserve Omaha
    history, music, ritual poetry, ceremonial meanings, and rapidly vanishing lore.
  category: action
  evidence_refs:
  - ev:6
