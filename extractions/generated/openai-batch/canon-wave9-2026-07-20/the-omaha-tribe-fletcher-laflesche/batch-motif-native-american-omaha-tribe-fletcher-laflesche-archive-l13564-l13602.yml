canonical_text:
  quote: ''
  summary: 'The passage describes how the Omaha hu''thuga is divided into two grand
    divisions: the Hon''gashenu, called Earth people, whose gentes oversee rites and
    duties tied to physical welfare, food supply, governance, and the Sacred Tribal
    Pipes; and the Inshta''cunda, called Sky people, whose gentes oversee rites seeking
    supernatural aid and affirming supernatural power over life, death, and punishment.
    The two Sacred Tribal Pipes require custody and preparation by different gentes
    and, when used, represent both divisions.'
  language: English
  quote_policy: summarized
