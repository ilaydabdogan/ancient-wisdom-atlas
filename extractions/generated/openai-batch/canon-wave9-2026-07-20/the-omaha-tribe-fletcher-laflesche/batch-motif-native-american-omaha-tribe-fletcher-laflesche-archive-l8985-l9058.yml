canonical_text:
  quote: ''
  summary: The passage describes a youth's solitary fasting for a vision, a four-day
    period of restraint afterward, private disclosure to an older man with a similar
    vision, and the making of a sacred trophy or sign from the vision being. It then
    lists evaluations of different vision forms and recounts moon dreams in which
    a man may be forced into a changed gendered role. The final portion gives Osage
    accounts, attributed to Black Dog, of men called Mixu'ga who become as women through
    dreams or visions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth went forth to fast silently and unobserved, without being accosted,
    counseled, or directed, and returned alone to his father's lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his return, no one asked about his absence; for four days he was to
    rest, eat little, and speak little.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After four days, the youth could go to an old and worthy man known to have
    had a similar vision, eat and smoke with him, and privately mention the vision.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the youth spoke of his vision before the four-day period ended, the passage
    says the vision would be lost to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After speaking to the old man, the youth was required to travel until he met
    the animal or bird seen in his vision, kill it, and preserve all or part of its
    body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The preserved trophy became the visible sign of the vision and the most sacred
    of the man's possessions; it could be worn on his scalp lock or person during
    sacred festivals, war, or other important occasions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the vision came as a cloud or the sound of thunder, the passage says
    these were symbolized by objects or by designs painted on the man or his belongings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some visions were described as lucky; hawks helped with war success and prowess,
    bears had recuperative power but were not so good, elk were fleet, snakes were
    not good, and dreaming of the moon might bring calamity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the moon dream, the moon appeared holding a burden strap in one hand and
    a bow and arrows in the other, and the dreamer was told to choose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the dreamer awoke before taking the strap or captured the bow, he escaped
    the dream's penalty; if the strap came into his hand, he was doomed to forfeit
    his manhood and become like a woman.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Men who become as women are called Mixu'ga, glossed in the passage as 'instructed
    by the moon'; Osage young men fast to secure dreams or visions for strength in
    war or hunting, but some dreams or visions make them imagine that they are women.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Osage story, a fasting young man met a matronly woman who addressed
    him as daughter, gave him a hoe, instructed him in cultivation and domestic arts,
    and afterward he adopted feminine speech, dress, and occupations.
  category: sequence
  evidence_refs:
  - ev:9
