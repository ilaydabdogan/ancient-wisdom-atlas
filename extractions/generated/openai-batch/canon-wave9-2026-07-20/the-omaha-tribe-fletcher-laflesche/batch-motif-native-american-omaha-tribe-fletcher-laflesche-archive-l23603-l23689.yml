canonical_text:
  quote: ''
  summary: The passage describes Omaha household meals, offerings of food to Wakon'da,
    rules of serving and thanking, etiquette for children and guests, formal feast
    customs, borrowed-kettle courtesy, and the spatial arrangement of people and belongings
    within a lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two meals were generally taken, one in the morning and one at night; cooked
    food was removed from the fire and kettles were placed near the mother's place
    in the tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Family members, neighbors, and informal guests sat in a circle around the
    fire for a meal.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother apportioned food into bowls and could be assisted by an elder daughter,
    near kinswoman, or intimate friend.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After everyone had been served, the father or principal guest made an offering
    by lifting a small portion of food and dropping it into the fire in recognition
    that food was the gift of Wakon'da.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the offering ceremony, everyone was free to eat; if the ceremony was
    omitted, no one ate until everyone had been served unless the mother told them
    not to wait.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At the end of a meal, dishes were returned to the mother, and each person
    gave thanks by mentioning a term of relationship; parents thanked on behalf of
    children too young to speak.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: If food remained in a returned dish, an apology or explanation was made to
    the mother or hostess.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children learned expected expressions of relationship in the presence of company
    and were corrected for noises or grimaces while eating.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Chiefs were required to take soup quietly, and the text states that a religious
    reason was said to be attached to the custom but was not definitely ascertained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At a formal feast, men served the food, and the offering to Wakon'da was made
    by the man of highest rank present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At a formal feast, etiquette required a prominent man to ask the servers whether
    they had provided for themselves, and the host who gave the feast did not partake
    of the food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Etiquette called for eating all food placed before one; if that was not possible,
    untasted food was to be carried home in the guest's own bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A borrowed kettle had to be returned with a little of whatever had been cooked
    in it remaining in the vessel; this remnant was called ihe'xuxe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: A borrowed kettle returned scoured clean by a white woman was resented as
    a lack of respect and courtesy toward the owner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The ground space of a lodge was distinctly marked by customary places for
    the father, mother, young men, old people, young girls, little ones, and personal
    packs.
  category: setting
  evidence_refs:
  - ev:8
