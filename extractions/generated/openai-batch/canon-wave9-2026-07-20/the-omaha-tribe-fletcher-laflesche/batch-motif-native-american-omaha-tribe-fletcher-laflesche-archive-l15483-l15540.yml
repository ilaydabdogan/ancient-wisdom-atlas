canonical_text:
  quote: ''
  summary: The passage gives the third ritual song centered on the Axondepa, a round
    wrist shield worn on the left wrist to protect a man from the bowstring. The editors
    explain that the repeated words evoke aspects of the Pole, including tribal unity,
    the Council of Seven Chiefs as one heart and one voice, the authority of Thunder,
    and associations with a man and a bow. During the song, wickerwork containing
    down is fully opened for ceremonies. The passage then introduces the fourth song,
    during which an officiating priest arranges four selected pieces of buffalo meat
    before the Pole; these represent four buffaloes, four hunts, and prior ceremonial
    offerings of hearts and tongues.
