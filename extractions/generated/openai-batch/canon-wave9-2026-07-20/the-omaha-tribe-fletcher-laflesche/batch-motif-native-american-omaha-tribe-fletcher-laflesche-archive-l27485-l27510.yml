canonical_text:
  quote: ''
  summary: The passage describes the organization of Omaha war parties, including
    their size, voluntary membership, rare solitary war expeditions motivated by grief,
    the carrying and placing of a dead child's moccasins beside a killed enemy so
    that the enemy's spirit may guide the child in the spirit land, and a requirement
    of continence for war-party volunteers until their return.
  language: English
  quote_policy: summarized
