  text: A war party could vary from eight or ten warriors up to one hundred warriors.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man seldom went on the warpath alone unless under great sorrow, such as
    the death of a child or other near relative.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A grief-driven man might seek to kill someone who would become a spirit companion
