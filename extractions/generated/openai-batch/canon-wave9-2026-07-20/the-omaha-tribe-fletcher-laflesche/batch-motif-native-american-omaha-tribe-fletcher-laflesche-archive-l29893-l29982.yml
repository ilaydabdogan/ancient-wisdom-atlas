canonical_text:
  quote: ''
  summary: 'The passage describes the construction and ritual preparation of a war
    bonnet: a deer-skin skull cap with upright golden eagle feathers, red hair tips,
    counted war honors, feast-based participation by warriors, ermine and vision-derived
    symbolic attachments, songs, and changes to the flap after horses became common.
    It also describes presentation of a bonnet to a young man as a challenge, the
    mourning actions of his female kin, an anecdote in which a boy carrying the bonnet
    becomes an unintended herald of victory, and a related custom of hair fringes
    on garments representing counted honors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The war bonnet is described as a dressed deer-skin skull cap with a rear flap
    and a border supporting upright golden eagle feathers around the wearer's head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each eagle feather stood for a man, and the red-painted hair tip fastened
    to a feather represented that man's scalp lock.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before a feather could be attached, a man had to count the honors that entitled
    him to wear and prepare the feather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who wanted a war bonnet prepared a feast and invited warrior friends
    to his lodge; after eating, they counted honors on the eagle plumes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Formerly, only a man who had taken a scalp could attach the red hair tip,
    so a feather with such a tip represented both a war honor and a scalp-taking honor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When counting honors, a warrior held up the feathers and recited what he had
    done in a named battle before handing the feather to the bonnet maker.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each feather required an honor, no honor could be counted twice, and large
    bonnets could require many helpers and several days of work.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Strips of ermine were attached to fall over the ears and cheeks, and the passage
    states that ermine represented alertness and skill in evading pursuit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bird or other symbolic object from a man's vision could be placed on the
    crown, and the man believed that through this vision he received supernatural
    aid in need.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A noted warrior could have a bonnet made as a gift to the son of a valiant
    man; the gift honored the family, prompted valuable return gifts, and challenged
    the son to win similar honors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the young man entered his father's lodge to receive the bonnet, women
    of the family wailed for him as dead, cut their hair, and made grief demonstrations
    because of the dangers he would face.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the anecdote, a leading man in a defensive fight sent his war bonnet back
    to the village with a lad, who entered camp wearing it and jokingly acted as a
    victorious warrior before being recognized as heralding a notable victory.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Hair fringes on leggings or shirts required warriors' consent; each lock or
    tuft had an honor counted on it and represented a war honor, and female relatives
    generally furnished the hair.
  category: relationship
  evidence_refs:
  - ev:9
