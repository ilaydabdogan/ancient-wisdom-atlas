canonical_text:
  quote: ''
  summary: The passage describes Omaha village traditions along the Missouri, including
    a village known as “Where the snowbirds came” and the Bow Creek village later
    called “Bad Village.” A story explains that a respected man’s daughter, promised
    against her will to an older warrior despite preferring another man, disappeared
    after the wedding feast. When she was later found being stripped and flogged,
    her youngest brother killed the warrior. The killing caused a battle within the
    village, many deaths, and a separation of the people into eastward and southward-moving
    groups. A later generation encountered Omaha-speaking relatives east of the Missouri
    and persuaded them to return, reuniting the Omaha people.
  language: English
  quote_policy: summarized
