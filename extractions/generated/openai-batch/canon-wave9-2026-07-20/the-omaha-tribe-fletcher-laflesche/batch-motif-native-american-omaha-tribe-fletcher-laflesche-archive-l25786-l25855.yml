  quote: ''
  summary: The passage compares Omaha and Pawnee forms of a pipe-related ceremony,
    noting lost Omaha ritual details, shared articles and symbolism, and differences
    such as the absence of corn in the Omaha form. It describes Omaha peace symbolism
    centered on the eagle as Mother, a cloudless sky, the curlew mark and call on
    the feathered pipe stems, fierce animal powers redirected toward peace, and the
    child named Hunga as an emblem of future generations and innocence. It also connects
    the Omaha emphasis on peace to a council and to tribal and intertribal concerns.
  language: English
  quote_policy: summarized
