canonical_text:
  quote: ''
  summary: The passage recounts Wakon/monthin's custody of the White Buffalo Hide,
    his wish to keep it until spring and then place it with the Sacred Pole, the theft
    of the Hide and his mourning, the later tracing of the Hide to Chicago, physical
    descriptions of the Hide and its pipe, Monxe'wathe's account of paired male and
    female Sacred White Buffalo Hides, and a gift-making ritual at the Sacred Tent
    during the annual buffalo hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wakon/monthin completed the rituals and agreed to deliver the White Buffalo
    Hide to the writers the following spring or summer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wakon/monthin wanted to keep the sacred object with him for one more winter
    until the grass grew again; he kept it in a tent set apart for its use near his
    cabin, where it hung on a pole tied as a bundle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Hide had formerly presided over the hunt; its ritual
    was sung, chiefs smoked its sacred pipe, and the people feasted on the chase.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wakon/monthin said it was right that the Hide should go to be with the Sacred
    Pole, as it used to be, when the grass came again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: While Wakon/monthin was at the Agency, thieves broke into his tent and stole
    the White Buffalo Hide.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For months after the theft, Wakon/monthin went out every morning while the
    morning star was in the eastern sky and wailed as for the dead; the passage says
    his sorrow shortened his days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The writers traced the Hide to a man in Chicago, tried to buy it back and
    place it beside the Sacred Pole, but the purchaser refused; the Hide was deposited
    with the Academy of Sciences in Lincoln Park, Chicago.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Hide is described as the skin of a small whitish buffalo, with hoofs and
    horns intact and a row of shell disks fastened down the back.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pipe belonging to the Hide is described as red catlinite, nearly circular,
    and representing the hoof of the buffalo.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Monxe'wathe stated that there were formerly two Sacred White Buffalo Hides,
    one male and one female; the male hide was buried with its keeper, and the female
    hide was in Wakon/monthin's charge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the annual buffalo hunt, a man wishing to make gifts to the Sacred
    Tent could ask the keeper to 'untie the buffalo'; the keeper made a frame of withes
    and spread the Hide over it so it looked like a live buffalo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The gift-giving man stood before the tent with a little girl, and sent his
    presents one by one by the girl's hand to the keeper.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A footnote states that the albino buffalo was sacred among close cognates
    of the Omaha and among Dakota tribes, and mentions Mandan, Blackfeet, and Dakota
    white-buffalo contexts.
  category: relationship
  evidence_refs:
  - ev:7
