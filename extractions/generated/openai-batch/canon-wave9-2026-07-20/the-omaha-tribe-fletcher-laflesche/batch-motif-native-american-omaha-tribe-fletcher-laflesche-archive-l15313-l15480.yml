  summary: 'The passage describes Omaha ritual songs and actions for Sacred Pole ceremonies:
    placement and touching of the Pole, unloosing a covered wickerwork object, cutting
    a symbolic ground figure called uzhin''eti, singing that the work is complete,
    and preparing the next day''s culminating rites with red-painted regalia and buffalo
    items.'
