canonical_text:
  quote: "“Goes, where the four hills of life and the four winds are standing”"
  summary: The passage describes part of an Omaha ceremony introducing a child into
    the tribe. A priest turns the child on a stone to face the directions while a
    ritual song invokes winds, four hills, and thunder. The child receives new moccasins
    and takes four steps as an entrance into long life. The child's ni'kie name is
    announced, the baby name is declared discarded, and the priest instructs the child
    in taboo and penalties.
  language: English with Omaha ritual song text and terms
  quote_policy: quoted
