  summary: The passage describes a Ponca account of the Wa'wan ceremony, especially
    the closing act of blessing a little Hun'ga child with folded pipes. The pipes
    are passed over the child and laid toward the four directions while a promise
    of firm movement, long life, and many descendants is spoken. The child stands
    at the intersection of the four lines and then walks four steps toward the sun.
