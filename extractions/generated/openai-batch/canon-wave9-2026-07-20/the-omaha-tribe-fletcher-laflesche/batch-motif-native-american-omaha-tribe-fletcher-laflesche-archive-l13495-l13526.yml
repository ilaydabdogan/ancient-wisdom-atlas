canonical_text:
  quote: ''
  summary: 'The passage describes the Nida as a mythical earth-moving creature and
    as a name applied to mastodon-like remains and elephants. It then summarizes Omaha
    ritual custodianship: the Buffalo Hide keeper conducted maize and buffalo rites;
    Sacred Pole keepers guarded rites maintaining chiefly authority; the Hon''gashenu
    half held rites for protection, peace, food, and clothing. The north half of the
    tribal circle held rites concerning creation, stars, and cosmic life-forces, especially
    Inshta''cunda rites introducing a child to the Cosmos, inducting the child into
    tribal duty, and filling the Sacred Tribal Pipes. The passage concludes that rites
    tied to tribal government remained active while others declined.'
  language: English
  quote_policy: summarized
