canonical_text:
  quote: ''
  summary: 'The passage describes Omaha procedures when buffalo signs are found: chiefs
    and ritual officers appoint marshals, runners are summoned to scout, runners signal
    and report a herd, sacred objects are brought out, leaders organize the surround,
    and a herald commands the tribal divisions to prepare for the chase.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When signs of buffalo game were discerned, chiefs, the waihon', and the Washa'be
    subgens met in council and appointed men to act as soldiers or marshals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marshals were chosen from brave and trustworthy warriors who had won the
    right to wear “the Crow.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The marshals were summoned to the Sacred Tent of the White Buffalo Hide and
    told to recognize no kin relations while performing their duty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The marshals prevented noise, stopped private departures, held hunters back
    until the signal for attack, and private action that stampeded a herd could mean
    death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The waihon' selected about twenty young men as runners to search for a herd
    suitable for the tribe to surround.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tribal herald stood before the Sacred Tent containing the White Buffalo
    Hide and summoned named young men to secure knowledge of the land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When runners found a suitable herd, they returned swiftly, paused on a prominent
    point, and signaled by running from side to side; two runners crossed each other
    as they ran.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the runners were seen, the Sacred Pole and the pack containing the White
    Buffalo Hide were carried to the edge of camp, followed by the Seven Chiefs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The White Buffalo Hide was arranged over a frame to resemble a buffalo lying
    down, and the Sacred Pole was set up leaning on its crotched-stick staff.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Runners delivered low-toned reports on the herd’s location and size, taking
    care not to exaggerate.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The herald notified the people by shouting that smoke or dust was rising from
    the earth as far as the eye could reach.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The director remained alone in his own tent until hearing the herald, then
    went to the Sacred Tent of the White Buffalo.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The waihon' became leader of the council, selected two men to lead the surround
    with the washa'be and pipestem, and selected two boys to secure twenty tongues
    and one heart for the sacred feast.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The herald circled left around the tribal circle, commanding people to bring
