canonical_text:
  quote: ''
  summary: 'A table-like passage lists waterways and places known to the Omaha, with
    explanations for several names: a long creek with a lake, old Padouca village
    site, and a lifted stone; Bear Creek with grizzlies and cedars; Horse-tail Creek
    with a steep ford; a dry creek where wells were dug; a place where turkeys were
    gathered for arrow feathers; a place where boys fought with pebbles; a ridge with
    a hole; and several named rivers including Holy River, Ohio River as the river
    down which they came, and Des Moines River as a place of many raccoons.'
  language: English
  quote_policy: summarized
