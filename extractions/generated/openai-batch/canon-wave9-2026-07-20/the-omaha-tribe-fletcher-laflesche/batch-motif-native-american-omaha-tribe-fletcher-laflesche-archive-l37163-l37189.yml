  quote: ''
  summary: The fragment describes a ritual figure or object whose left arm and leg
    contain poisons and magic shells for punishment and are paired as male and female.
    Its right arm and leg represent brothers, earth, and stars, and contain medicines
    for healing. An explanation says the punishment effected through the figure was
    directed by Wako'da to keep order and check crime. Two figure captions identify
    bags found in a pack.
