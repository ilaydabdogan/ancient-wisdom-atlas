canonical_text:
  quote: ''
  summary: In an Omaha society ceremony, an u'zhu directs a servant to collect members'
    animal-skin mystery bags in groups of four, paints the animal heads on the bags
    with blue paint, and has the servant make four feints and four strokes on a drum.
    The text explains this as representing a story episode in which animals in a lake
    and on an island struck drums when children were painted. Lodge representatives
    associated with the eldest son, second son, and daughter process around the fire
    to the entrance, face the fire or west and fire, and sing; the first song is translated
    and explained as referring to instructions from a father and mother at the society's
    organization, to abandoned ones, and to an arrow that is identified as a shell.
  language: English, with Omaha song text and vocabulary glosses
  quote_policy: summarized
