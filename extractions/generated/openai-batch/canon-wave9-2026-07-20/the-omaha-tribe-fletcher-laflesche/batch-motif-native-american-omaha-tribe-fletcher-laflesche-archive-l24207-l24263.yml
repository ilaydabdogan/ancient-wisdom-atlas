  summary: The passage describes Omaha woven bags, bead necklaces, a simple loom and
    weaving method, and the making and naming of lariats and cords from nettle fiber,
    hemp rope, and buffalo hair. It notes ceremonial use of some bags and gives material
    and technical details for weaving and braiding.
