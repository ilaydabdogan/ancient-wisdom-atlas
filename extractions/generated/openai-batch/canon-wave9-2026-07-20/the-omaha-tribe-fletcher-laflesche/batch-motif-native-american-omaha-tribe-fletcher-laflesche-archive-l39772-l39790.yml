canonical_text:
  quote: '"the union of the earth and the sky"'
  summary: The passage explains an Omaha view in which humans are closely connected
    with animals but not descended from them. It interprets myths of earth-sky union
    as expressing a masculine-feminine dual force fundamental to creation and ordained
    by Wakon/da. It says this dual force was important to Omaha organization but was
    not developed into anthropomorphic gods and goddesses; instead, Omaha thought
    sought human counterparts and ethical lessons in animals, night and day, and the
    branching tree.
