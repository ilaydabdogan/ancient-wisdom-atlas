canonical_text:
  quote: ''
  summary: The passage describes part of an Omaha Sacred Pole ritual. A wordless song
    is characterized as prayer to Wakon'da. The people stand in a great circle with
    branches, answer a war cry, wave the branches, and advance toward the pole in
    four repeated movements led by the bearers of the Sacred Tribal Pipes. A vocabled
    call song is translated as bidding those walking yonder to come hither. After
    the fourth halt, men stand nearer the pole and women behind, and the pipe bearers
    and gentes turn in ordered sequence.
  language: English with Omaha transliterated vocables/song text
  quote_policy: summarized
