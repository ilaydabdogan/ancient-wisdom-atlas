canonical_text:
  quote: ''
  summary: 'The passage gives a feast song with literal and free translations, then
    describes a society feast: serving with two sticks, special meat for the bravest
    man, the host’s abstention, a leader’s thanksgiving speech about food and its
    acquisition, eating by members, a dramatic exploit-dance with a picked bone, and
    a choral dismissal procession around the lodge and fireplace before departure
    under the stars.'
  language: English
  quote_policy: summarized
