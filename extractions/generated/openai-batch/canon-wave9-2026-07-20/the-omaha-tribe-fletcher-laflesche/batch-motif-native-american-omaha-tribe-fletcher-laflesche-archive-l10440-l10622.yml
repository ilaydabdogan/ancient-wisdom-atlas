canonical_text:
  quote: ''
  summary: The passage describes the Washa'beton subgens as maker and decorator of
    a ceremonial staff and custodian of the White Buffalo Hide and its tent, with
    a buffalo-tongue tabu. It describes the Hon'gaxti subdivision as custodian of
    maize rites, sacred corn, planting time, and a corn-husk tabu. It links buffalo-hunting
    rites and maize rites through sacred-tent decoration, a symbolic haircut for Ho'nga
    children, migration traditions, and personal names referring to sacred objects,
    animals, buffalo imagery, and corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Washa'beton subgens had the official duty of making and decorating the
    washa'be staff, although it did not provide the materials for the staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The washa'be is described as a peculiar staff whose name is glossed from a
    term for a dark object and possession, and it belonged to the leader of the people
    during the annual tribal hunt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Washa'beton had charge of the White Buffalo Hide and its tent, and its
    tabu was buffalo tongues brought to the sacred feast.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Hon'gaxti subdivision had charge of ceremonies connected with maize, preserved
    the sacred corn, chanted its ritual, and fixed the time for planting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hon'gaxti tabu was the outer green husk of the ear of corn, and the Sacred
    Tent decoration in charge of the Washa'be subgens was a full-grown stalk of corn.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states as a probability that the Hon'gaxti was the original subgens
    and that buffalo-hunting rites later overshadowed maize rites when the people
    came into buffalo country.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tribal tradition reported in the passage says that during migrations west
    and northwest the people became more strictly hunters and maize cultivation fell
    into abeyance or was temporarily abandoned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Washa'beton subgens camped to the left of the Waxthefxeton subgens.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Children of the Ho'nga gens received a symbolic haircut in which all hair
    was cut close except for a ridge from forehead to nape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hair ridge was said to represent the line of a buffalo's back against
    the sky and was also said to fit the appearance of growing corn viewed the same
    way.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Waxthefxeton personal-name list includes names glossed by references to
    the Sacred Buffalo Hide, buffalo herds, the Sacred Pole, the crow as a symbol
    in making the washa'be, divining arrows, smoke stain, buffalo actions, and corn.
  category: other
