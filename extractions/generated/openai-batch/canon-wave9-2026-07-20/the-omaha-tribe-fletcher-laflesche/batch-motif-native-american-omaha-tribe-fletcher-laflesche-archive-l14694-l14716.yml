canonical_text:
  quote: '"All our prayers must be accompanied by gifts."'
  summary: The chiefs address the gathered people about the Sacred Pole, calling it
    a mystery to which troubles, offerings, requests, and prayers will be brought.
    They state that the Pole belongs to all the people but will be kept by one family
    in the Hon'ga gens, whose Keepers can grant authority to leaders in exchange for
    presents. The people set a recurring time in July to paint the Pole and enact
    battles before it, establishing the Waxthe'xe xigithe ceremony.
