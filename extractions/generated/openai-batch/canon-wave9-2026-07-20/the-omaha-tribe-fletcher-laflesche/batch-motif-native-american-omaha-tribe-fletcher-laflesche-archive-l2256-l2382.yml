canonical_text:
  quote: ''
  summary: 'The passage describes Ponca gens offices and rites: a Thi''xida head-pain
    cure using a bow and arrow; Ni''kapashna war, deer-hunt, and mortuary customs;
    Poncaxti and Monkon pipe custodianship and the Turning the Child rite; and Washa''be
    buffalo-hunt duties, with comparison to Omaha names and ritual offices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People of the Thi'xida gens were said to cure head pain by wetting an arrow
    with saliva, placing it on a bowstring, pointing it at the sick man's head four
    times, and rubbing the head with the arrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ni'kapashna name is glossed as skull and is said to refer to bone exposed
    by scalping; the gens had charge of war pipes, directed the council of war, and
    supervised deer hunting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a member of the Taha'ton itazhi subdivision died, deer-skin moccasins
    were placed on his feet so that he would not lose his way and would be recognized
    in the spirit world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Poncaxti gens camped in the rear of the tribal circle facing the opening;
    the Poncaxti and its Monkon subdivision had charge of principal pipes, including
    the chief's pipe used for conjuring.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A tradition of finding the Omaha Sacred Pole was preserved in the Poncaxti
    gens, and a man of the Monkon subgens was said to have reached the Pole first
    in a race.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ponca tribe was required to camp in complete hu'thuga order for the Feast
    of Soldiers and Turning the Child ceremonies.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: For Turning the Child, a tent was pitched, dedicated as holy, and arranged
    with a stone near the fire in the center and sweet grass on the stone.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mothers brought children to an old man with hereditary right to perform Turning
    the Child; he led each child to the center, stood the child on the stone, and
    turned the child successively to the east, south, west, north, and back east.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: An informant explained that the child was brought face to face with the life-giving
    winds of the four directions and that the stone represented long life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the turning, the child's baby name was thrown away and a name from the
    father's gens was publicly bestowed; boys also had a lock of hair cut from the
    crown and kept by the officiant.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Monkon subdivision painted its tents with black and yellow bands, and
    the Poncaxti symbolic child hair cut left tufts at the forehead, nape, and both
    sides of the head.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Washa'be gens name was the same as the Omaha buffalo-hunt leader's ceremonial
    staff and the Omaha Hon'ga subdivision associated with the White Buffalo Hide
    and maize ritual.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Ponca Washa'be gens had duties in the tribal buffalo hunt, helped regulate
    the people with the Monkon subdivision, and appointed officers to maintain order
    on the hunt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that the Ponca had no ceremonies for planting or caring
    for maize and depended chiefly on hunting, obtaining maize more by barter than
    cultivation.
  category: other
  evidence_refs:
  - ev:11
