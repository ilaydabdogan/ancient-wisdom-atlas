canonical_text:
  quote: ''
  summary: The passage describes offices, spatial arrangement, membership, initiation
    rules, animal associations, and ritual objects of the Shell society. Four ritual
    children/officers are linked with sun, stars, moon, and earth, placed on masculine/day
    and feminine/night sides of the lodge. Offices and regalia are acquired by purchase.
    Membership requires secrecy, unanimity, and formerly a waiting period. A mysterious
    stranger’s instructions about seven initiates and seven initiation sticks are
    recalled. Animal beings and skins are associated with lodges, supernatural power,
    food, water, earth, and air.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The four named children or offices are linked with cosmic bodies or powers:
    the eldest son with the sun, the second son with the stars, the daughter with
    the moon, and the youngest son with the earth.'
  category: relationship
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: The eldest son and youngest son are placed on the south side of the dwelling,
    described as the side where the sun travels, causing the earth to bring forth,
    and also as the masculine side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The second son and daughter are placed on the north side of the lodge, described
    as typifying night and feminine forces.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the eldest son is diagonal to the daughter, while
    the second son is diagonal to the youngest son; the mysterious stranger declares
    that the earth and stars are brothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The society’s offices are obtained by purchase rather than election, and office-holders
    often sell an office when age or illness prevents them from fulfilling its duties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several offices have remained in the families of present occupants for multiple
    generations, and the principal officers must be personally present for meetings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Minor ritual positions include placing the four children before the fireplace,
    beating the drum, caring for and handling a wooden bowl of water, selecting feast
    servers, assigning choice meat, and inviting guests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Membership does not require a dream; a member must keep a secret, avoid quarrelsomeness,
    and be accepted by unanimous consent.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The mysterious stranger instructs the man and wife to initiate seven men and
    seven women, wait four years, and then initiate seven more of each sex; seven
    initiation sticks are still used in reference to this instruction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says there should be seven lodges, but the society has changed
    to five lodges for reasons the informants could not explain.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Four animals associated with giving themselves as food are connected with
    the lodges of the four children: black bear, elk, buffalo, and deer.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The eagle is associated with the u'zhu, the head of the society, because it
    is said to have descended, spoken to the man, joined the society, and promised
    supernatural power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Former initiates were required to bring animal skins representing water, earth,
    and air.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a member killed a bear, elk, deer, or buffalo, a portion of the meat
