canonical_text:
  quote: ''
  summary: The passage explains earth and sky subgentes in the Inshta/cunda gens,
    describes the surviving Washe'ton subgens and its child-consecration rites, and
    recounts a tradition about the Nini/baton subdivision accepting responsibility
    for a sacred pipe and a ritual that was later lost.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Inshta/cunda gens formerly had two subgentes, one referring to the earth
    and one to the sky.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rites and name of the earth subgens are described as lost, and its members
    are said to have mingled with the surviving subgens.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The present tabu of the entire gens is identified as worms, insects, and related
    creatures, and is said to relate to the lost earth-subgens rites.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The surviving subgens is said to control rites pertaining to the sky and to
    a power descending to fructify the earth through rain, storm clouds, thunder,
    and lightning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Worms, insects, and small burrowing creatures are presented as signs or symbols
    of the earth's response to the power from above.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tradition says that a mole painted red was one symbol used in the lost subgens
    rites.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The name Washe'ton is explained as meaning the act of possessing children.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Through Washe'ton rites, a child's life was consecrated to the life-giving
    power symbolized by thunder and lightning, and the child was described as reborn
    as a member of the tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the fourth day after birth, a baby name was given; a boy received a belt
    with wild-cat claws, and a girl received a girdle of mussel shells on a string.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The shell is connected with water, and water is described as a medium for
    transmitting power from the Above to mother earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The placing of the symbolic emblems on the infant is described as a prayer
    for preservation of the tribe and continuation of life through children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In a tradition about the Nini/baton subdivision, selected families initially
    refused an offered pipe, with their chief saying he was not worthy to keep it
    because he was a wanderer and a bloody man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The pipe was offered and rejected three times; the fourth time it was left
    with the families, returned with gifts, and later fully accepted with its duties.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The accepted duties included furnishing a member of the Council of Seven Chiefs
    and preserving and reciting a ritual used when the two Sacred Pipes were filled
    for ceremonial purposes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The ritual is described as irrevocably lost after its last keeper, Mon'hinci,
    died about 1850 without imparting it to anyone.
  category: sequence
  evidence_refs:
  - ev:8
