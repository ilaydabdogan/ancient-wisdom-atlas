canonical_text:
  quote: ''
  summary: The passage lists the fifth and sixth war honors and their visible signs,
    then recounts part of a Ponca honor-conferring ceremony in which the keeper of
    the Sacred Pack, speaking as Thunder's representative, requires candidates to
    tell the truth under threat of sudden supernatural punishment. Two men then make
    competing claims to the same first-grade honor, one holding a gun and one a bow;
    the excerpt ends before the bow claimant's statement is completed.
