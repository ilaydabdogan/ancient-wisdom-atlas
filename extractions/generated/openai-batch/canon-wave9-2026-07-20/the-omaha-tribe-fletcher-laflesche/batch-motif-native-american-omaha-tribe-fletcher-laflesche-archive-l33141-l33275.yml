canonical_text:
  quote: ''
  summary: 'The passage describes part of a Hon''hewachi initiation sequence: qualified
    men count war honors, a drum is placed after the meal, songs are sung, a sponsor
    reports the candidate''s completed prescribed gifts, chiefs and members assemble
    to consider and judge the candidate''s record, and a young pubescent virgin girl
    enters and dances to receive a mark of honor. The song is also described as the
    rhythmic model for songs of the Hon''hewachi and as an example of society-specific
    ceremonial rhythm.'
  language: English with Omaha song text and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremony became difficult to complete because men who could count war
    honors were dying out; an Oto example is given in which a man had to be obtained
    from a cognate tribe to beat the drum properly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a meal, the chiefs and members resumed their seats, the drum was placed,
    and a song was sung.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One stanza is explained as the sponsor coming to the Hon'hewachi members to
    report that the candidate had completed the required number of wathin'ethe, or
    prescribed gifts, and awaited acceptance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another stanza is explained as referring to the herald's official call, which
    gathered chiefs and members to consider the candidate's count and public record
    of acts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A further stanza refers to the final judgment of the men assembled to consider
    the candidate's claim to membership.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the summing up, the young girl on whom the mark of honor was to be
    placed entered and danced before the assembled Hon'hewachi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The girl's dance is described as the fourth and last step leading to the consummation
    of the candidate's long effort.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The selected girl was generally the candidate's daughter, or otherwise the
    daughter of a relative or close friend; she had to be a virgin recently at puberty,
    wore gala garments, and could be accompanied by young women who had already received
    the mark of honor.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The song is described as the rhythmic model for all Hon'hewachi songs, and
    the passage states that songs of other societies or rites similarly followed their
    own rhythmic standards.
  category: attribute
  evidence_refs:
  - ev:9
