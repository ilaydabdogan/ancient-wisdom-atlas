  quote: ''
  summary: The passage describes the delayed fulfillment of treaty promises to survey
    Omaha reservation land for individual homes. After influence from the village
    called the "make-believe" white men, government action led to surveying, land
    selections, certificates, prairie breaking, and timber work; however, only a few
    people benefited, much material went unused, and hope and ambition declined.
