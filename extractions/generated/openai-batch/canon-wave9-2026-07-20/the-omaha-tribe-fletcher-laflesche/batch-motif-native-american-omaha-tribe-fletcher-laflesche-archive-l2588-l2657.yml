canonical_text:
  quote: ''
  summary: Standing Buffalo, of the Wazha'zhe gens, reports a story learned from his
    mother about Wakon'da making the Wazha'zhe and commanding them to travel. The
    people journey west, cross a great water on rocks that appear from beneath the
    surface, honor the stones in sweat-lodge practice, meet people who speak the same
    language, receive a bow, dog, and corn from Wakon'da, and continue until the Omaha
    find and carry a Sacred Tree. The Ponca movements then follow rivers including
    the Missouri, Platte, and Niobrara.
  language: English
  quote_policy: summarized
