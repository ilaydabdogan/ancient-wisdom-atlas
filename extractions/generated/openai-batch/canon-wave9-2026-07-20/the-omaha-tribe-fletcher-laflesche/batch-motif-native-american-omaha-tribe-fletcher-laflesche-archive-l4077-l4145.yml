canonical_text:
  quote: ''
  summary: The passage describes an Osage adoption ceremony for a captive. Ritual
    leaders assemble, the captive is placed as a stranger, a child-initiation and
    naming ritual is recited, the captive moves across the tribal circle, is cut,
    washed, fed, made to smoke a cedar-adorned sacred pipe, anointed, painted, named
    “made to live,” and incorporated as the child of the adopter. The passage explains
    the drama as death to former kinship and past life and rebirth into an Osage family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A captive taken by a war party could be adopted by a person who had lost a
    child or had no children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the ceremony, the adopted person became Osage in all respects and was
    subject to the duties of the family entered through a kind of new birth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The captor invited leading Tsi'zhu washtage men, described as peacemakers,
    and Pgro^ga chiefs, described as having charge of war rites.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Food was prepared for the leaders, and the host made a solemn speech stating
    his desire to adopt the captive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ritual leaders from Nu'xe, O/pxon, Fbatse, Wa'tsetsi, and Hon/ga groups were
    assembled.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The captive was seated in the back of the lodge opposite the entrance, identified
    as the seat of the stranger.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ritual used at the initiation and naming of a child born in the tribe
    was performed, and it recounted the creation and history of the tribe and the
    four stages of human life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The captive was led from the Tsi'zhu washtage chief to the Ingron'ga, symbolically
    traversing the tribal circle from the north peacemakers to the south war authorities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Ingron'ga chief cut the end of the captive's nose with a sharp flint knife,
    causing blood to flow, and the Tsi'zhu washtage chief wiped the blood away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Water and food were brought and administered to the captive by the Tsi'zhu
    washtage chief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A sacred pipe was filled, adorned with cedar fronds, lit, and ceremonially
    smoked by the captive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The captive was anointed with buffalo fat, painted with two black stripes
    across the face, and given the name Ni'wathe, glossed as “made to live.”
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage explains that bloodletting signified loss of the captive's former
    blood and kinship, washing removed traces of former birth, and Osage food made
    new Osage blood.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage explains that pipe smoking confirmed and sanctified the act, anointing
    brought the captive within tribal rites and avocations, and black stripes recognized
    Thunder as god of war and the captive's future warrior duties.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage states that the drama represented the captive's death to his birth
    people and past life and his rebirth into the adopting Osage family.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: At the close, participating chiefs ate the feast provided by the adopting
    man; later the name Xi'wathe was dropped and the adopted child received a name
    belonging to the father's group.
  category: sequence
  evidence_refs:
  - ev:8
