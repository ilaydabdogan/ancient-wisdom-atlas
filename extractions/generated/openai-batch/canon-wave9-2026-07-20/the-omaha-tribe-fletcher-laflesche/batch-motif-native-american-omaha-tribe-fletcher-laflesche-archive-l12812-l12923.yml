  summary: The passage lists Omaha/Ponca name entries, including dream and female
    names with translations or uncertain meanings. It then describes the Inshta'cunda
    gens, whose name refers to lightning, whose rites were connected with thunder
    and lightning as sky forces representing Wakon'da's power over life and death,
    and whose Sky-people half was paired with Earth people in the birth of the human
    race. The passage also describes subgens loss, depletion, and name-system change.
