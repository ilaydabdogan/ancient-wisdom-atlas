canonical_text:
  quote: ''
  summary: The passage argues that Omaha, Ponca, Osage, Kansa, and Quapaw tribal organizations
    preserve features from a former parent organization. It describes traditions of
    unplanned severance through accident, quarrel, chiefly ambition, or following
    game; examples of shared gentes and rites involving turtle, wind, earth makers,
    ice, and Ponca kindred; and correspondences between Omaha personal names and Osage
    war-related ritual offices involving concealment by mist or dust and clearing
    a war party's path.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that groups branching from a parent organization preserved
    familiar features of tribal organization.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cognate tribes are described as divided into kinship groups that practice
    exogamy and trace descent through the father.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each gens has its own name and personal names; these personal names refer
    to the group's symbol or to rites allied with that symbol.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Traditions among Omaha, Ponca, Osage, Kansa, and Quapaw say separations from
    the parent organization and later partings occurred through accident, strife,
    or circumstances related to following game, not concerted action.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Wazha'zhe or Osage tradition says they broke from the Ponca because of a
    quarrel over game; a Ponca Wazha'zhe story says the departing people became lost
    and later were known as a large tribe bearing the Wazha'zhe name.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a group broke off, its members could come from several gentes; gentile
    kindred retained identity in name and common rite and formed a gens in the new
    tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A turtle group occurs as a subgens among the Omaha, Osage, Kansa, and Quapaw,
    and its members keep the turtle rites in each tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kansa or Wind people form a gens in each of the Omaha, Osage, Kansa, and
    Quapaw tribes and keep rites pertaining to the wind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each of the Omaha, Osage, Kansa, and Quapaw has a gens similar to the Mon'thinkagaxe,
    translated as 'earth makers'; a Nu'xe or Ice gens is found in the Ponca, and the
    name is also borne by subgentes in the Osage, Kansa, and Quapaw.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tradition says the Ponca were once a gens in the Omaha tribe and broke away
    in a body; the passage also suggests that some Ponca kindred may have accompanied
    Osage, Kansa, and Quapaw groups and later formed Ponca gentes in those tribes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Personal names are presented as evidence of former union when they refer to
    ceremonies no longer observed in the tribe where the names exist but still practiced
    in cognate tribes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Omaha personal name Ushu'demonthin means 'he who walks in the mist' or
    'in the dust raised by the wind'; the cognate Osage gens Monso'tsemonin means
    'they who walk concealed by the mist or dust.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Osage Monso'tsemonin gens kept a war rite used before attack or during
    retreat, causing mist to rise or wind to raise dust so warriors could walk concealed
    from enemies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Omaha personal name Uzu'gaxe means 'to clear the pathway' and is explained
    by an Osage gens of the same name whose office was to find a way across or around
    natural obstacles in a war party's path.
  category: action
  evidence_refs:
  - ev:10
