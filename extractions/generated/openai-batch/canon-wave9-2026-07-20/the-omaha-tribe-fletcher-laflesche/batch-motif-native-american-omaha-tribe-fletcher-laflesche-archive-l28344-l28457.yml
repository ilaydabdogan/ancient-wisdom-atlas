canonical_text:
  quote: ''
  summary: The passage describes the We'ton waan, a class of Omaha songs composed
    and sung by women to transmit strength and courage to absent warriors. It gives
    a song addressing a younger male warrior about the difficulty of becoming a man
    and proving the teaching by valor. It then describes the Tent of War, its placement
    and custody by the We'zhinshte gens and hereditary keeper, rules around sacred
    war articles, and an ablution with warm water and artemesia required after accidental
    contact with the tent or its belongings.
  language: English
  quote_policy: summarized
