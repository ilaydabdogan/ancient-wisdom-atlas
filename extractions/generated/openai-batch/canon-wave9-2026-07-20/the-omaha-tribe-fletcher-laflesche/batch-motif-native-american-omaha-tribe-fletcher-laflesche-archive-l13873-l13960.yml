  quote: ''
  summary: The passage describes two Omaha orders of chiefs, their relative rank,
    the acts and gifts required for entrance, the election procedure for admission,
    and the labor, bravery, and household production represented by the required gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the establishment period of the chief orders is lost in the
    past, but internal evidence suggests they formed after the council with its Nini'bato
    membership had been established and accepted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'There were two orders of chiefs: Ni''kagahi xu''de and Ni''kagahi sha''be.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ni'kagahi xu'de order was unlimited in membership, but admission depended
    on the consent of the Ni'kagahi sha'be.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name Ni'kagahi xu'de is explained with reference to a uniform brown color
    like the brown earth, where all are alike in hue or rank.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The name Ni'kagahi sha'be is explained as referring to an object raised above
    a uniform level and seen dark against the horizon; men in this order were regarded
    as elevated before the people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Entrance into the Ni'kagahi sha'be was possible only when a vacancy occurred,
    only for a member of the Ni'kagahi xu'de, and only after performance of acts called
    wathin'ethe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wathin'ethe consisted of acts and gifts that brought no material return to
    the actor or donor but through which honor was received.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage describes wathin'ethe as acts and gifts related to tribal welfare,
    internal order and peace, support for chiefs and keepers, and friendly relations
    with other tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Entrance into Ni'kagahi xu'de was through certain wathin'ethe, and in that
    case the aspirant's gifts were made solely to the Seven Chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Election to Ni'kagahi xu'de occurred at a meeting of the Ni'kagahi sha'be
    called by leaders of the Hon'ga gens; after the tribal pipes were smoked, the
    candidate's name, record, and gifts were considered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The prescribed gift articles included eagles, eagle war bonnets, quivers with
    bows and arrows, catlinite pipes with ornamented stems, tobacco pouches, otter
    skins, buffalo robes, ornamented shirts, and leggings, with older and more recent
    substitutions also listed.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: The passage says acquiring or making these articles required hunting prowess,
    care in accumulating, skilled industry, travel, exposure to danger from enemies,
    bravery, and warrior skill.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Men made bows and arrows, war bonnets, and pipes; women performed ornamentation,
    including preparing and dyeing porcupine quills and embroidering with them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: There was no prescribed number of gifts for entrance into the Xu'de order,
    but they had to be sufficient for the chiefs to admit the man; after admission,
    persistent industry and care could make him a candidate for Sha'be when a vacancy
    occurred.
  category: sequence
  evidence_refs:
  - ev:7
