canonical_text:
  quote: ''
  summary: The passage describes the making of seven pipes for maintaining peace within
    the tribe, their use in mediating homicide disputes, their distribution or non-distribution
    among named bands, the offices attached to certain pipes, and a chiefs’ pipe used
    in a punitive ritual involving tobacco ashes and spoken formulas directed at an
    offender’s body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seven additional pipes were made for keeping peace within the tribe and preventing
    bloodshed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man killed another, chiefs were to offer a pipe to the aggrieved relatives;
    after four successive refusals, the relatives could not later appeal to the pipes
    for help or mercy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seven pipes were taken out for distribution among different bands of the
    tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Waca'be were passed by because they were engaged in a ceremony associated
    with taking life; the Hi'cada sat in a tent with red-hot stones and cedar wreaths
    on their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Thi'xida received a pipe and were assigned charge of the council that
    elected chiefs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ni'kapashna received a pipe and were assigned management of the council
    of war and direction of the deer hunt to preserve order.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Pon/caxti and Monkon/ were reached next and were given a pipe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Washa'be received a pipe, and together with the Monkon/ were given charge
    of the tribal buffalo hunt, including journey direction, camp making, and order;
    the two principal chiefs were to come from these two bands.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Wazha'zhe were divided by trouble and murder, so they received a round-stemmed
    ornamented pipe rather than a flat-stemmed pipe; a later dispute remained over
    which division received the peace pipe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nu'xe received a pipe and an office in the buffalo hunt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: One pipe belonged to the chiefs, could be filled only by leading chiefs, was
    used to punish troublemakers, and was placed in the charge of the Monkon/ band.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the punishment rite, chiefs gathered, the leader filled the pipe, all present
    smoked it, the chiefs focused their minds on the offender, and the leader poured
    ashes on the ground four times with statements assigning effects to parts of the
    offender’s body; the man died soon after.
  category: sequence
  evidence_refs:
  - ev:7
