canonical_text:
  quote: ''
  summary: An account of Wa'backa's war party describes tribal mobilization, temporary
    transfer of authority to one leader, authorization by a sacred pack, a women's
    song used to strengthen warriors, a pre-dawn attack on a Pawnee village, Wa'backa's
    death, and a later victory omen involving birds associated with the same pack
    and attributed to the Thunder god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people were aroused; men made arrows, women made moccasins, and Wa'backa
    made a club to use against the offending Pawnee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs temporarily set aside their office and gave control of all the
    people to Wa'backa; the passage states this was the only known instance of such
    control being given to one man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wa'backa received authority from a sacred pack and permission to take it with
    him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men, women, and children went with Wa'backa, and the women composed a song
    sung during the march.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The song is identified as probably belonging to a class of songs used by women
    to send strength to an absent warrior on the battlefield.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: About half a day's journey from the Pawnee village, the people halted by Maple
    Creek and buried their tents; the act gave rise to an Omaha name for the stream.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before day, Wa'backa led warriors to a palisaded Pawnee village; they leaped
    the palisade, tore sod from earth lodges, and set fire to the straw covering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Smoke drove people out of the Pawnee lodges, and they were slaughtered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wa'backa went to the lodge of the Pawnee chief who had slighted earlier peaceful
    overtures and clubbed him to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Many were killed on both sides; the Omaha took booty, but Wa'backa died fighting,
    and his death ended the battle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The club used by Wa'backa is said to be preserved in the pack he carried,
    which later testimony described as containing bird items and a bladder tobacco
    bag.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A later war leader instructed from the pack carried a blackbird and a swallow
    from it on the warpath.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: During that later leader's victory dance, blackbirds alighted on the scalp
    pole and swallows swept around the camp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The old leader said the birds had come to greet the victorious party, and
    the people regarded the event as a favorable omen sent by the Thunder god.
  category: speech
  evidence_refs:
  - ev:8
