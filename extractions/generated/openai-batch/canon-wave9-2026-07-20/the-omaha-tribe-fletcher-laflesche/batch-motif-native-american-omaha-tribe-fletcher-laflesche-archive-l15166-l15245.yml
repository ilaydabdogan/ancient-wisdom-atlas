canonical_text:
  quote: '"Waxthe''xe xigithe" ... "the Sacred Pole" ... "to tinge with red"'
  summary: The passage describes the Omaha ceremony of anointing or reddening the
    Sacred Pole. It explains the ceremony's commemorative and thanksgiving purposes,
    the preliminary council, ritual eating, the selection of honored men by reed tokens,
    the gathering of lodge poles from tribal tents to make a communal sacred lodge,
    movement restrictions during the rites, and the role of Xu'ka prompters.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The ceremony is named Waxthe'xe xigithe, glossed as the Sacred Pole and to
    tinge with red.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony commemorates the original presentation of the Pole to the people
    and also gives thanks for gifts received through the hunt.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ceremony takes place after the fourth tribal chase and after four ceremonies
    connected with buffalo tongues and hearts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Waxthe'xeton subgens of the Hon'ga gens has charge of the Pole and calls
    the Seven Chiefs to the Sacred Tent for preliminary business.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the closed Sacred Tent, the chiefs wear buffalo robes ceremonially, crouch,
    eat without knife or spoon in imitation of buffalo feeding, and avoid dropping
    food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If food falls on the ground, it is pushed toward the fire and is said to be
    desired or claimed by the Pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After agreeing on the ceremony day, the council smokes the pipe belonging
    to the Pole and the herald announces the decision to the tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Runners search for buffalo; a herd found within four days is counted sacred
    and supplies fresh meat for the ceremony, while failure to find a herd results
    in use of dried meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each chief takes a reed from a bundle kept in the Sacred Tent and names a
    man known for valorous exploits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The representative reeds are distributed to designated men, and each man accepts
    the distinction by returning his reed to the subgens leader at the Sacred Tent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The designated men visit lodges, strike selected poles, and recount their
    past valiant deeds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Men from the Waxthe'xeton subgens, with their wives, withdraw and carry selected
    poles to make a semicircular lodge near the Sacred Tent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The communal lodge is erected on the site of the Sacred Tents, opens toward
    the center of the tribal circle, represents all the people, and is called holy
    or sacred.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: A halt is called until the rites end; horses must remain outside the hu'thuga
    and people may not loiter near or cross the entrance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Two guards are stationed at the opening of the tribal circle to enforce the
    movement restrictions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The leader summons the Seven Chiefs and head men of the gentes, who wear buffalo
    robes and take seats in the communal tent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Xu'ka group of the Tha'tada gens acts as prompters for Hon'ga ceremonies
    and uses small stick counters to follow the ritual songs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: A note says four grass figures in front were later used to represent enemies.
  category: object
  evidence_refs:
  - ev:8
