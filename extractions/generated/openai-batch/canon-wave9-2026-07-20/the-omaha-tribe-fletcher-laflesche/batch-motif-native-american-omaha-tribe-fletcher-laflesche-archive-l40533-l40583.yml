  quote: ''
  summary: The passage describes the introduction of strouding, broadcloth, calico,
    needles, thread, pins, steel traps, and canvas among the Omaha, noting Omaha names
    for these goods, their uses in clothing and shelter, and trade-related shifts
    from skins to manufactured materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heavy woolen strouding was probably introduced by English traders during the
    latter part of the eighteenth century.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Omaha first saw cloth, they named it by using the word for skin robe,
    with color terms added for specific cloth colors; broadcloth was named as a smooth
    robe because of its surface.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men used strouding for leggings, breechcloths, and sometimes robes; women
    used it for skirts, sacks, and knee-length leggings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Broadcloth was not used by men; richer tribal members bought it for women's
    skirts and leggings, and sometimes a woman had a broadcloth robe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Needles and thread became known with strouding and broadcloth, and Omaha names
    were given for them; pins were not known until well into the nineteenth century.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Calico was introduced by American traders about the middle of the nineteenth
    century, became common because it was cheap, and was called 'thin skin.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The commercial value of dressed skins and the later high price of strouding
    helped shift common clothing materials from skins to strouding and then to calico.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Steel traps were introduced by traders to facilitate catching beavers; the
    Omaha word for metal came to signify trap, and trapping was named as placing in
    metal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Omaha supplied buffalo, bear, beaver, mink, raccoon, and deer skins and
    were regarded as good hunters, trappers, and desirable trading partners.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Canvas became a common substitute for the buffalo-skin tent cover about the
    middle of the nineteenth century and took the older name meaning tent skin.
  category: sequence
  evidence_refs:
  - ev:4
