  quote: Having arrived at the door of the lodge, they paused and sang as follows.
  summary: A Wa'wan party reaches a lodge, sings a song whose literal translation
    includes coming and seeking a little child, then enters. The child and its parents
    await them. The leader carries clothing and skin pouches containing red and black
    paint. The child is clothed and painted by a designated member who has counted
    defensive-war honors, while pipes are waved to another song.
