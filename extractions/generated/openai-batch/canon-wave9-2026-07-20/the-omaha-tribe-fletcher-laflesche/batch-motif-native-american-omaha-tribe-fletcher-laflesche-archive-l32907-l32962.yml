canonical_text:
  quote: ''
  summary: The passage describes the We'ku feast as a peace-making occasion between
    tribes involving invited guests, gift contributions, a pipe offering, distribution
    of gifts, and a meal. It also describes deeds that could be counted as waihin'ethe,
    including battle rescue, the long secret preparation required before counting
    a hundred acts, beliefs about misfortune if a chosen maid were named too soon,
    and the Hon'hewachi use of will power, wazhin'agihe, to punish offenders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The We'ku feast occurred after a difference between two tribes when chiefs
    wished to make peace.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Seven Chiefs called chiefs and young warriors together and announced the
    proposed We'ku feast for the tribe with whom there had been trouble.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men volunteered gifts for receiving the invited tribe; a man intending a large
    gift understated it, while men able to make only small donations said nothing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Three or four high-ranking and respected donors were sent to invite the other
    tribe to the feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: As the guests approached, the men who had contributed gifts mounted horses
    and rode out, charging on them as if they were enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The host leader carried a smoking pipe, offered it to the guest leader, and
    the guest leader accepted it after it was lighted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: After the pipe offering, gifts were distributed, the feast was eaten, peace
    was concluded, and the guests were entertained among Omaha families.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:8
  text: Saving a comrade's life in battle or preventing his capture could be counted
    among the highest waihin'ethe because it required risking one's own life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: A man preparing to count his hundred generally worked silently for years and
    did not reveal either his purpose or the maid chosen to receive the honor mark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: There was a belief that if the man disclosed his chosen maid before he was
    ready for the tattooing, either the girl would die or misfortune would befall
    him.
  category: other
  evidence_refs:
  - ev:3
- id: obs:11
  text: Passing the long test for entrance into the society was regarded as proof
    that members were favored by Wakon/da and possessed result-producing will power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Hon'hewachi could punish a disturber or offender through wazhin'agihe
    by fixing their minds on him and placing on him the consequences of his actions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The punishment was believed to thrust the offender away from helpful relations
    with men and animals, with misfortune and death following.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: Wazhin'agihe was described as belonging to the same class of acts as wazhin'
    'iheihe; one was believed to send disaster and the other to help through will
    power.
  category: relationship
  evidence_refs:
  - ev:4
