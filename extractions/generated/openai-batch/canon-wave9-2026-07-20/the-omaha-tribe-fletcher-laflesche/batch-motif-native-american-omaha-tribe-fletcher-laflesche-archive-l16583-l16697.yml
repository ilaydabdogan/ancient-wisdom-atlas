canonical_text:
  quote: ''
  summary: 'The passage describes Omaha He''dewachi/Sacred Pole rites: a fallen tree
    is addressed and prepared as a pole, carried with prescribed halts, painted in
    red and black bands, placed in a central hole prepared with smoking and offerings,
    and raised. The text explains the pole as simulating a man, as symbolizing the
    tribe, and as bearing decorations referring to cosmic powers. It also lists sacred
    woods used in the rite and describes public ceremonial dress and war-honor markings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tree treated as a warrior foe falls because Thunder is said to have decreed
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leader addresses the fallen tree and says he has come for it so that it
    may see the people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young men cut away branches, leave a tuft of twigs and leaves at the top,
    strip the bark, bind the top tuft with a black covering, and pile discarded material
    at the stump.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In earlier practice a woman carried the pole; in later practice young men
    of equal height carried it level on their left shoulders while the woman walked
    beside them with her burden strap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four halts are made on the way to the Jiu'ihuga, and the pole is taken to
    the leader's tent with its butt end thrust toward the fireplace.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two men from the Nonxthe'bitube subdivision mix red and black paint and paint
    the pole in bands, one painting black and the other red.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The red and black bands are said to signify night and day, thunder and death,
    earth and sky, and vivifying and conserving powers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Young men dig a hole for the pole in the center of a level place, sometimes
    in the center of the hu'tkuga and sometimes outside the camp.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Earth from the hole is heaped to the east, and a symbolic figure is incised
    between the heap and the hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The keepers sit in a circle around the hole, smoke the pipe, and pass it four
    times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Swan down, identified as from a water bird, and tobacco, identified as an
    offering to Wakon'da, are sprinkled in the hole before the pole is raised.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The leader says the preparation is finished and instructs that the pole be
    raised so that the people's grandfather may see him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The preparatory ceremonies occupy three days, and the dance and public festival
    take place on the fourth day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The pole is said to simulate a man, with the black covering on top as his
    head.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: As a tree, the pole is said to symbolize the tribe, while the people's wands
    are described as its branches and parts of the whole.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Seven kinds of wood are identified as sacred to the ceremony, with specific
