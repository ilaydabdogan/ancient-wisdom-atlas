canonical_text:
  quote: ''
  summary: The passage explains the Omaha puberty rite Non'zhinzhon, its meaning as
    an inward, prayerful state, its placement at the threshold of conscious individual
    life, and its purpose of bringing the youth into personal relation with Wakon/da.
    A Sacred Legend recounts elders instructing parents to send clay-marked children
    to lonely hills to cry and pray for four days without asking a specific favor,
    then lift tear-wet hands to sky and earth. Later explanation describes the rite
    as addressed to Wakon/da rather than lesser powers, as observed in spring, and
    as involving a prayer song known across the tribe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rite called Non'zhinzhon marked the next stage in the life of an Omaha
    youth and took place at puberty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The word Non'zhinzhon is explained as meaning to stand sleeping, implying
    a person standing as if oblivious to the outward world and conscious of what occurs
    within the mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the rite occurred when the child's mind had become white,
    using an image of night passing into day to describe increasing discernment and
    memory.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the verge of conscious individual life, the youth was to enter into personal
    relations with the mysterious power that permeates and controls nature and existence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Sacred Legend, the people felt weak and poor, and the old men gathered
    and proposed that the children cry to Wakon/da for strength.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Parents put soft clay on the children's faces and sent them to lonely places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The old men told youths on the hills not to ask for any particular thing,
    because the answer might not come as expected and Wakon/da might give whatever
    was good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The youths were to pray and cry on the hills for four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: When the youths stopped praying and crying, they were to wipe their tears
    with their palms, lift their wet hands to the sky, and then lay them to the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: The writers caution that the statement calling this the people's first appeal
    should not be taken literally, because the rite is complex and embodies beliefs
    requiring long formulation.
  category: other
  evidence_refs:
  - ev:3
- id: obs:11
  text: Old men explained that the rite must be observed by all youths; after the
    first time a youth could repeat it until he was old enough to marry and had children,
    while a priest might continue to fast and pray.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The appeal in Non'zhinzhon was said to be to Wakon/da, the great power, and
    not to lesser powers such as the sun, stars, moon, or earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The appeal was for help throughout life, including hopes for a happy life,
    good health, success in hunting, success and safety in war, and protection from
    enemy weapons, even though the youth was forbidden to ask for a special favor.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The rite was observed in spring and not in summer or winter.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: 'Clay on the head was explained in different ways: some said it symbolized
    humility; others connected it with soft clay or mud brought up by diving animals
    from which the earth was created; the writers considered the latter more probable.'
  category: other
  evidence_refs:
  - ev:5
- id: obs:16
  text: In preparation for the fast, the youth was taught a prayer to be sung during
    the ordeal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The prayer was said to be known to every youth in the tribe regardless of
    gens and was presented as voicing a fundamental Omaha belief.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: A note states that every male was obliged to pass through Non'zhinzhon at
    the proper age, while girls and women were not obliged but sometimes went through
    the fast because the rite was open to them.
  category: relationship
  evidence_refs:
  - ev:6
