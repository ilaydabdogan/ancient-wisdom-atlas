canonical_text:
  quote: ''
  summary: The passage describes Omaha departure ceremonies for an aggressive war
    party. A leader who obtained authority from a Sacred Pack was relieved of personal
    responsibility for deaths or disasters, because the party had placed itself under
    the Thunder god through sacred birds in the Sacred War Pack. The passage explains
    this through Omaha beliefs in linked forms of life under Wakon/da. The keeper
    of the Sacred Pack instructed the party, sacred birds mediated with the Thunder
    god, and Hon'hewachi night-dance songs and a feast prepared the men by removing
    fear of death through the symbolism of night as both death and birth.
  language: English
  quote_policy: summarized
