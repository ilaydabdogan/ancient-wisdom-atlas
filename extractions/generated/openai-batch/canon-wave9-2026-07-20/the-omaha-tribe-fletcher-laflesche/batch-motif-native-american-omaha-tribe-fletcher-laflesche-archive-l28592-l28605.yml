canonical_text:
  quote: the voice of a woman would be heard singing a song to inspirit the men
  summary: When warriors departed to battle in defense of their homes, there were
    no public ceremonies or dances. Women sang rally songs to encourage the defenders,
    and at the close a woman gave the bird-hawk cry to evoke the supernatural power
    of that bird, associated with the god of war. The songs were composed and sung
    solely by women, with vocables in the first part used to complete the musical
    phrase of the second part.
