  summary: 'The passage gives a practical account of weapon manufacture and maintenance:
    shaping and caring for a bow, preparing and twisting sinew bowstrings, keeping
    an emergency bowstring, beginning the preparation of arrow shafts, and identifying
    a war-club illustration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bow is shaped by pressure with the feet while held over live coals; if strung
    without this shaping, it would break the string.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bow head is bent more than the foot; a good bow has a slight curve at
    the middle of the back, with two notches on the head and one on the foot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stringing and unstringing the bow are called by a term glossed as “to loosen,”
    said to be used only for this action.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: To preserve strength and elasticity, the unstrung bow is bent backward before
    being returned to its sheath, and both bow and bowstring are kept dry because
    moisture weakens them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bowstring is made from sinew beside the backbone muscle of buffalo or
    elk; the sinew is soaked overnight in water mixed with glue, stripped into strands,
    and squeezed dry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A strand measured twice the bow’s length is looped over a branch on a pole
    driven into the ground; the maker twists the ends, tightens the strands, combines
    them into one string, and knots the ends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The looped end of the bowstring fits the head notches of the bow, while the
    other end remains free for adjustment; the bowstring is glossed as “the bow tendon.”
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each man keeps two bowstrings, one fastened on the bow and another carried
    in the quiver for emergencies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Dogwood and ash saplings are used for arrow shafts; the shafts are whittled
    to size, hung over fire for seasoning, and have knots cut out or scraped level.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A figure caption identifies a war club as a native drawing.
  category: object
  evidence_refs:
  - ev:5
