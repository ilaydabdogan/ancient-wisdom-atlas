canonical_text:
  quote: "“The tuft represented the head of the elk; the lock, its tail.”"
  summary: The passage describes Omaha naming and childhood hair-cutting practices.
    After an initiatory rite and the bestowal of a ni'kie name, a father cut a child's
    hair in a way that symbolized the tabu of the child's gens. In the We'zhinshte
    gens, a boy's head was shaved except for a forehead tuft and a long lock at the
    nape of the neck; these represented the head and tail of an elk.
  language: English
