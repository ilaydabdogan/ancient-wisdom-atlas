  quote: In the beginning the people were in water.
  summary: The passage introduces an Omaha sacred legend associated with the Sacred
    Pole and early habitat. The legend says the people began in water, emerged to
    behold the day, later made plant-fiber coverings, lived near a large body of water
    in wooded game country, developed stone tools, generated fire from a dry elm root
    and stick, and began building grass houses.
  language: English
