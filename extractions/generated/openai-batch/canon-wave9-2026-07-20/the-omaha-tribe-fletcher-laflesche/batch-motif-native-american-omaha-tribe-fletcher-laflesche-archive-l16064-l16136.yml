canonical_text:
  quote: ''
  summary: An ethnographic account describes Omaha attempts to restore buffalo and
    plenty by performing the Anointing of the Sacred Pole using purchased cattle,
    the failure of repeated ceremonies, and a childhood memory of an old man carrying
    the Pole during a buffalo hunt, followed by instructions to seek cleansing after
    boys' horses accidentally struck him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After several unsuccessful buffalo hunts, poverty and distress replaced former
    plenty.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people urged the Hon/ga to perform the ceremony of Anointing the Pole,
    although buffalo scarcity made the full performance impossible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A plan was made to use tribal money due from the United States to buy thirty
    cattle for the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The United States Agent described the request as a tradition of killing cattle
    and making a feast when the people did not go on the buffalo hunt; the passage
    states that this misunderstood the motive of the request.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the intended rites were hoped to bring back the buffalo and
    save the people from an unknown and dreaded future.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cattle were bought and the ceremony took place, but repeated expenditures
    for second and third ceremonies did not change conditions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pole later stood untouched in its tent and was dreaded as powerful for
    harm while seemingly unable to restore old prosperity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a remembered annual buffalo-hunt scene, an old man walked amid the moving
    Omaha community wearing a buffalo robe and carrying a dark long pole-like object
    with hair hanging from one end.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The narrator's lariat startled five horses; the gray and black horses ran
    against the old man and nearly knocked him over.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The father instructed the boys to go to the Sacred Tent with the gray and
    black horses and a piece of scarlet cloth, state that the touch was unintentional
    disrespect, and ask to be cleansed from the wrong.
  category: speech
  evidence_refs:
  - ev:9
