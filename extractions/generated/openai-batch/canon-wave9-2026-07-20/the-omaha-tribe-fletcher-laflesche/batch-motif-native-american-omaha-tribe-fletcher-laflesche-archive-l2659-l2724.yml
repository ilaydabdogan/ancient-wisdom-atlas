canonical_text:
  quote: "“If you return successful four times, then I shall resign my place in your
    favor.”"
  summary: White Eagle recounts how his grandfather Little Bear, a poor young man
    believed to have dream-related power, was chosen by a bereaved chief to avenge
    or locate the place of the chief’s son’s death. Little Bear uses sacred battle
    articles, survives an attack, succeeds in four expeditions, gives his shares of
    spoils to the chief, and receives the chief’s office. White Eagle then traces
    succession from Little Bear to Two Bulls, Wexgayapi, and himself.
  language: English
  quote_policy: quoted
