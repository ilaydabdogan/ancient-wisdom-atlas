  summary: 'The passage includes a plate caption for a wolfskin war robe worn by Zhi''ga''gahige,
    then describes the Omaha war leader as commanding officer of a war party, obligated
    to protect the party even at risk of his life. It lists subordinate members and
    four service classes: hunters, moccasin carriers, kettle carriers, and men who
    build fires, bring water, and carry provisions.'
