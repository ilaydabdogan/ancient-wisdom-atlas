canonical_text:
  quote: ''
  summary: The passage explains Omaha prescribed gifts for entrance into chieftainship
    and societies. Such gifts supported chiefs and keepers in their public duties,
    hospitality, and ceremonial obligations; they also stimulated industry and peace.
    Families drew on surplus food and goods for society feasts and gifts, and most
    families were expected to provide a specified meat cut for the anointing of the
    Sacred Pole, with refusal believed to risk supernatural punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Entrance into chieftainship was secured through prescribed acts and gifts
    called waihin'eih-e.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Most of the gifts connected with chieftainship entrance were made to the Seven
    Chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gifts were described as voluntary in one sense but obligatory for a man
    who wanted prominence in the tribe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gifts recognized the chiefs' office and authority and supplied means for
    demands made on them because of their position.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Chiefs were expected to entertain visitors from other tribes and leading men
    within the tribe and to give adequate gifts to visitors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Chiefs and Keepers were often kept from hunting by official duties, reducing
    their ability to secure food and raw materials for gifts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Gifts from aspirants to tribal office were described as a form of payment
    to Chiefs and Keepers for services rendered to the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The custom of gifts was said to stimulate industry and enterprise among men
    and women and to serve the cause of peace within the tribe.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: Gifts were also demanded as entrance fees to societies, and admission to the
    Hon'hewachi was described as particularly costly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Society meetings required food for feasts and, in some ceremonies, gifts drawn
    from family surplus; people did not give feasts or gifts that left the family
    without food or clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the anointing of the Sacred Pole, every family except those of the Hon'ga
    subgens was expected to provide a supply of tezhu meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: There was no formal penalty for failing to provide the Sacred Pole meat contribution,
    but a belief had arisen that refusal would be punished supernaturally.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The customs are interpreted in the passage as showing recognition of social
    and public duties and the obligation to support chiefs and keepers who served
    the general welfare.
  category: other
