canonical_text:
  quote: ''
  summary: 'A Wa''wan ceremony is described: poor people and onlookers stand near
    the door while a feast waits. The pipes may not be taken up until someone from
    the host''s party invites the singers to perform, an invitation requiring the
    gift of a horse. The host and the Wa''wan leader then thank the giver through
    prescribed hand movements and gestures, and the host also thanks his relatives
    and friends by kinship terms.'
  language: English
  quote_policy: summarized
