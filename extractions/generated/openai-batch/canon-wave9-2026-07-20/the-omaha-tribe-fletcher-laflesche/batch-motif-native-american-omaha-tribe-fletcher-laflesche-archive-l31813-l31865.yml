canonical_text:
  quote: ''
  summary: The passage describes the Pu'gthon, an Omaha society restricted to chiefs.
    Its songs were restricted to members and preserved by a lifetime keeper who was
    expected to train a successor. A belief arose that the keeper's singing of old
    songs brought death to his family, so requests for songs were accompanied by large
    gifts. The songs concerned acts of chiefs and were needed for society dances,
    at which chiefs wore full regalia and buffalo-head headdresses resembling masks.
    The passage recounts that, during a final performance by the keeper, a Sioux warrior
    killed the keeper's daughter, after which the society's meetings ended. Few songs
    survived, and most associated incidents were lost.
  language: English
  quote_policy: summarized
