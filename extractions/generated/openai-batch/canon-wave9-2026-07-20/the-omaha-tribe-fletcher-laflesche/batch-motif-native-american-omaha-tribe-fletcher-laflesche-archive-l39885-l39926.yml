  summary: The passage lists Omaha terms for desirable social qualities and ethical
    conduct, including unselfishness, self-control, dependability, helpfulness, gratitude,
    courtesy, sympathy, hospitality, generosity, diffidence, and a term for a clever
    child expected to die young. A footnote explains terms connected with ownership,
    captive animals, abuse or torment, captives, and a warrior's 'captive song' sung
    when facing death in battle.
