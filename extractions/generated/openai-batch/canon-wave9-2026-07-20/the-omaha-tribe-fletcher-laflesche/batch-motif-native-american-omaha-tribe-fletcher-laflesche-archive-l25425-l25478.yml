  summary: The passage describes an Omaha flute or flageolet and two kinds of rattles.
    It notes that a flute failing to produce the desired vibratory tone would be set
    aside. It then describes the deer-hoof rattle and the gourd rattle, including
    their construction, sound-producing materials, symbolic painting, and use in ceremonies,
    rites, societies, and by persons called doctors.
