canonical_text:
  quote: '"I am an animal, and have been sent by all the animals that live near the
    great lake..."'
  summary: A stranger who has cared for a family's children accepts the parents' offered
    children, reveals himself as an animal messenger from a council of animals near
    a great lake, explains animal powers granted with sun and moon consent, leads
    the family to the lake, and instructs them in a bear-heart-and-tongue meal with
    songs.
  language: English
  quote_policy: quoted
