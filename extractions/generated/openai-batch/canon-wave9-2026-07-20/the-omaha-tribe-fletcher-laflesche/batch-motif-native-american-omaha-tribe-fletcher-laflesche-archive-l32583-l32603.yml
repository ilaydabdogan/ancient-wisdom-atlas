canonical_text:
  quote: ''
  summary: Two men, one Ponca and one Omaha, feast together while secretly attempting
    lethal magic against each other. The Ponca draws a picture of the Omaha on the
    ground, strikes it with a club associated with the Thunder beings, and asks the
    Thunder beings to strike the Omaha. The Omaha suspects magic and protects himself
    by singing his songs. After the Omaha party returns home, the Ponca who invoked
    the Thunder is struck by lightning. A song is composed to commemorate the event,
    naming the Ponca Gati'demonthin and representing him as weeping because his request
    was turned back upon himself.
  language: English
