canonical_text:
  quote: ''
  summary: The passage explains the need for a visible object symbolizing Omaha tribal
    unity and governing authority, then gives origin traditions for the Sacred Pole.
    In one version, a young hunter discovers a tree that shines at night without heat
    or consumption; elders find four animal paths to it, judge it to be a gift from
    Wakon/da, and cut it into a portable pole. The passage also notes Omaha and Ponca
    lake-setting traditions and an Omaha Sacred Legend version in which Thunder birds
    make fiery paths from the tree toward the Four Winds.
  language: English
