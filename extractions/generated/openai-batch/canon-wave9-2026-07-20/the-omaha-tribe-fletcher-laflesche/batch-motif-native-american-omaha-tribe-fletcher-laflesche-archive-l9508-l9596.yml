canonical_text:
  quote: ''
  summary: 'The passage describes the We''zhinshte gens of the Omaha tribe: its camp
    position, custody of the Sacred Tent of War, duties in war councils and honors,
    scouting responsibilities, rites connected with Thunder, an offering made at first
    spring thunder, and an origin account for the gens taboo of the male elk.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The We'zhinshte gens camped on the left of the entrance into the hu'ihuga,
    and its name is explained as referring to those through whom the tribe made known
    anger or displeasure over injuries by another tribe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sacred Tent of War was set before the We'zhinshte tents and was kept by
    this gens together with paraphernalia for rites concerning war and Thunder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When hostile acts by another tribe raised a policy question, the keeper of
    the Tent of War called the Seven Chiefs and leading men of the gens to council,
    where the We'zhinshte presided.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After deliberation and decision, the keeper filled the Sacred Pipe of the
    Tent of War, and the Seven Chiefs smoked it; the passage says this religious act
    sanctified the decision.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The herald of the We'zhinshte proclaimed the chiefs' decision to the tribe,
    and volunteer war parties generally followed if war was authorized.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The keeper of the Tent of War and leaders of the gens officiated at Wate'gictu,
    where prescribed honors were publicly given to successful warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the annual buffalo hunt, the gens organized scouts in response to an
    order from the Seven Chiefs when signs of danger were discovered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first spring thunder was regarded as a signal of awakening life-giving
    forces after winter, and an older ceremony with song and ritual involved both
    the We'zhinshte gens and the Waca'be itazhi, or black bear, subgens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The account of the old thunder ceremony is described as no longer trustworthy
    because men who knew the rites had died; a song connected with it was sometimes
    sung during dangerous thunderstorms.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: When the first thunder sounded, the keeper of the Tent of War took a small
    pipe, ascended a nearby hill, and offered smoke to Wakon'da.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The keeper planted a small wand on the hill pointing east; four small bunches
    of tobacco enclosed in bits of bladder were bound to it with human hair.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The passage states that the combination of tobacco, bladder, and human hair
    on the wand seems to relate the act and lost ceremony to Thunder as arbiter of
    life and death.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: The We'zhinshte taboo was the male elk, and the gens was sometimes called
    the Elk gens.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: An origin story says only male elk skin could be found to cover sacred war
    articles, and this was understood as the male elk aiding the people by direction
    of Wakon'da; the animal therefore became taboo to the gens.
  category: sequence
  evidence_refs:
  - ev:9
