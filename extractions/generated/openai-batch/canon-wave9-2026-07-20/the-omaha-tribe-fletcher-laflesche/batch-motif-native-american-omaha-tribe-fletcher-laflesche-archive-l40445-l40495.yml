canonical_text:
  quote: ''
  summary: The passage describes how the arrival of white traders and iron implements
    altered Omaha work, hunting, exchange, religious customs, village life, wealth
    standards, women's labor, and marriage practices. It contrasts older hunting and
    cultivation, connected with rites directed toward Wakon/da, with later pelt trade
    and hunting for gain.
  language: English
