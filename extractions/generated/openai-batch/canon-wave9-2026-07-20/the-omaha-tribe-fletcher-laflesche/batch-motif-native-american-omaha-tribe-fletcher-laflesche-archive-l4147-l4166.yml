canonical_text:
  quote: ''
  summary: In a legendary account of present tribal organization, the Wazha'zhe kinship
    group is said to have possessed seven pipes used to make peace within the tribe.
    A pipe could be sent by the sho'ka to settle a quarrel. The Wazha'zhe, Hon/ga,
    Hon/ga utanatsi, and later the Tsi'zhu are described as making peace and uniting
    in sequence, with pipes involved in the first unions. Big Heart and others state
    that each of five groups had its own traditions and did not interfere with the
    others.
  language: English
  quote_policy: summarized
