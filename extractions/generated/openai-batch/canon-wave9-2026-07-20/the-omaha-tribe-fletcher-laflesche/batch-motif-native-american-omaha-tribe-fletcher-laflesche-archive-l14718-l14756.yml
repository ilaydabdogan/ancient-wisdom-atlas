canonical_text:
  quote: ''
  summary: The passage explains the Omaha term Waxthe'xe for the ancient Cedar Pole
    preserved in the Tent of War and its connection to the tattooed Xihexe' mark of
    honor. A father or near kin who had achieved entrance into the Hon'hewachi could
    secure the right, vested in the Pole, to have the mark tattooed on a girl; the
    mark signified his achievements rather than hers. The passage also distinguishes
    Omaha associations with hunting and peace from war, then describes an Osage practice
    of tattooing a mark of honor on warriors and hereditary keepers of Honor Packs
    of War, including a neck-and-chest design with a central stone-knife element and
    side bands.
  language: English
  quote_policy: summarized
