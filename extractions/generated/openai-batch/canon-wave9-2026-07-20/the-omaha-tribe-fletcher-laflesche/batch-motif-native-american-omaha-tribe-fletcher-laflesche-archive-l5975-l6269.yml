  summary: The passage is a tabular ethnographic list of Omaha and Ponca stream and
    place names, giving native names, English meanings, and corresponding modern watercourses
    or map identifications. Several names record deaths, massacres, animal bites,
    ritual or social events, vegetation, earth features, and practical crossings.
  language: English with Omaha place names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists indigenous names, English meanings, and map equivalents
    for rivers, creeks, branches, and related watercourses in Iowa, Nebraska, and
    South Dakota.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several watercourse names describe physical water or land qualities, including
    turbid river, shallow water, wide river, white-sand creek, bare earth, sand hills,
    crooked cliff, and green clay.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some names are explained by deaths or disease, including places where many
    died of smallpox, where many Ponca died, where Wa'bakihe died, and where Ubi'cka's
    daughter died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some names are explained by violence or killing, including massacres of Hon'ga
    people and Ponca, the killing of Big Grizzly Bear, women killed by a war party,
    and Buffalo Bull killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some names refer to animal encounters or animal habitations, including Pahe'zhon
    bitten by a snake, a girl bitten to death by a dog, and a place with a beaver
    village or dam.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: One entry explains a creek name through a sweat-lodge incident in which a
    Ponca invited a Pawnee, the Pawnee could not endure the heat, fled without clothes,
    and was not heard of again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some entries name social or ceremonial events, including a feast made to chiefs,
    Wani'tawaxa visiting the Ponca, and a dance held over the head of a Sioux.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Several names refer to vegetation or wooded features, including cedar, elm,
    plum, thorn-apple, cottonwood, hazelnut, hackberry, ash, and pine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: A bridge creek entry says that a bridge would be built of tent poles and skins
    because the creek was not fordable.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: One Niobrara-area entry is glossed as the place where Black Buffalo Bull planted.
  category: action
  evidence_refs:
  - ev:9
