  quote: ''
  summary: The passage describes regular meetings of a society, scheduled in certain
    months identified with the mating seasons of black bear, buffalo, elk, and deer.
    It explains that a host prepares a required feast and gifts, summons four servants
    to announce the meeting, and sends a servant to obtain a tobacco board and four
    sticks. A figure caption identifies an otter-skin bag of the Shell society.
