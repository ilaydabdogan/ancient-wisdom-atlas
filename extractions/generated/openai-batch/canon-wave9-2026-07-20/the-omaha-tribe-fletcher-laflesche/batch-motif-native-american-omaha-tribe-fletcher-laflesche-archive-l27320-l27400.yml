canonical_text:
  quote: ''
  summary: 'The passage describes Omaha procedures for authorizing a war party through
    a keeper of a Sacred Pack of War: four simple feasts, opening of the pack, instruction
    in duties and rites, and loaned sacred birds or secret charm bags. It then identifies
    four Sacred Packs and introduces a historical account of Wa''backa, whose losses
    in a Pawnee raid led to a grievance visit, perceived insult, a vow of retaliation,
    public wailing in the Omaha village, and a song urging revenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man wishing to lead an aggressive war party was expected to go to the keeper
    of a wain'waxube, or Sacred Pack of War, and invite him to a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feast is described as a simple repast in honor of an action or person
    and had to be repeated four times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the fourth feast, the keeper opened the Sacred Pack before the prospective
    leader and instructed him in duties, morning and evening rites, and how to organize
    and conduct the party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: One of the sacred birds was sometimes given to the leader to carry on the
    war path and was to be returned to the keeper of the pack.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The packs contained small concealed charm bags believed to help the leader
    and his men; their contents were secret, and before attack each man fastened his
    own charm bag on his person.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: There were four Sacred Packs among the Omaha, with differing opinions reported
    about their rank.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A pack connected with the Sacred Tent of War and another hereditary pack associated
    with Geunhabi are singled out; the latter is linked with Wa'backa and a fight
    against the Pawnee.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wa'backa obtained authority for his war party from the keeper of the special
    pack and carried the pack with him, after which the pack became specially honored
    by the Omaha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: While the Omaha and Pawnee were at peace, some Pawnee men raided the Omaha
    village and drove off horses, including Wa'backa's horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wa'backa and others who had lost horses went to the Pawnee village to ask
    the principal chief to require restoration of the property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Reported Pawnee responses include saying the horses were borrowed and should
    be exchanged later for arrows, and another version in which a bowl of beans and
    a war club were placed before an Omaha visitor with a threat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Wa'backa said he would return with more arrows than the Pawnee would care
    to see, and Pawnee boys and young men laughed at him and his companions as they
    left.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the way back, Wa'backa discarded or altered clothing, entered the Omaha
    village, stood at the chief's house wailing with hands lifted to heaven, and called
    for revenge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A moved young man composed and sang a song around the village calling on the
    people to rise and wipe out the insult.
  category: action
  evidence_refs:
  - ev:8
