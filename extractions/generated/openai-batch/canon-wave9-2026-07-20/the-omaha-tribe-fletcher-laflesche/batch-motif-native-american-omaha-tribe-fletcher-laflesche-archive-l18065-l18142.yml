canonical_text:
  quote: ''
  summary: 'The passage describes rules and ritual conduct around the Omaha annual
    buffalo hunt: a fixed departure date reached before Wakon/da, the fasting and
    abstinent conduct of the wathon or director, an appointed blame-bearing substitute,
    the transport of sacred articles, camp arrangement in the tribal circle, the appearance
    of camp at night, and the morning signal to resume the march.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the day for departure was fixed, it could not be changed because such
    a change would break faith with Wakon/da, in whose presence the decision had been
    reached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For four days before departure, the man who was to act as wathon fasted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the others departed, the wathon removed his moccasins, carried no weapons,
    and followed slowly with bare feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the wathon reached camp after supper, he entered his tent and everyone
    withdrew, leaving him alone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fast, barefoot march, and solitary vigil were explained as a prayer to
    Wakon/da for courage and wise, successful leadership in seeking food and clothing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: During his term as wathon, the director was expected to eat little, live apart
    from his family, and pray continually because the people depended on him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The director's manner of life was called non'zhinzhon, a term also applied
    to a youth's solitary fast to pray to Wakon/da.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Non'zhinzhon was explained as a state in which the person stands oblivious
    to the natural world and communicates with the unseen and supernatural world,
    receiving power and direction from Wakon/da.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chiefs and leading men tried to prevent or control minor quarrels because
    the hunt required harmony, obedience to authority, and order.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Frequent disturbances or unfavorable winds that frightened buffalo away could
    require the resignation of the wathon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: To avoid the director's resignation, chiefs appointed a man who took the name
    wathon and assumed blame for quarrels and mishaps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the march, the contents of the three Sacred Tents were in the charge of
    their keepers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The White Buffalo Hide was carried by its keeper in earlier days and later
    was packed on a pony.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The washa'be was carried by a virgin and was kept near the White Buffalo Hide
    because it belonged to that sacred article.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Sacred Pole was carried by its keeper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: At camp, each woman knew where to place her tent in the Hu'thuga, or tribal
    circle, and the Sacred Tents were set up in their respective places.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:17
  text: After camp was made, ponies were tethered or hobbled, wood and water were
    secured, and preparations for the evening meal began.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: At night, each conical tent was lit from its central fire, with moving life
    inside appearing in silhouette, beside rippling waters and under stars.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:19
  text: The morning signal to move was the dropping of the cover from the director's
    tent; when its poles were visible, women began removing tent covers.
  category: sequence
  evidence_refs:
  - ev:8
