canonical_text:
  quote: ''
  summary: 'The passage describes part of an Omaha society opening ceremony: ceremonial
    figures called “children” pass around a fire, stand at the west facing east, drink
    water in four-sip turns from a shared bowl that is then passed around the membership,
    and then circle the fire while songs are sung to the four directions. The passage
    also notes movement of the drum and goods and ends with the “eldest son” turning
    north to sing.'
  language: English
  quote_policy: summarized
