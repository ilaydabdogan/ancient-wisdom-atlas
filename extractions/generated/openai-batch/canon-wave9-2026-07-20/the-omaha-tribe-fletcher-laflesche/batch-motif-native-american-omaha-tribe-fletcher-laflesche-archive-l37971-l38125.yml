canonical_text:
  quote: ''
  summary: The passage gives ritual words and ethnographic explanation for an Omaha
    sweat lodge curative rite. A standing house or sweat lodge, a tent frame, animals
    that provide its covering, the primal rock or heated stones addressed as a venerable
    old man, ever-flowing water, grass used for heating stones, and patients called
    little ones are invoked. The rite prays that distressed children or patients may
    seek protection, receive health, strength, and length of days, and live to old
    age.
  language: English
