canonical_text:
  quote: ''
  summary: 'The passage describes scouting and defensive war procedures: scouts use
    elevated vantage points while concealing themselves, return to report through
    an honored senior scout, and may trigger a war council. If enemies are suddenly
    seen, an alarm is given by waving a robe from a vantage point. The camp prepares
    defenses, women build breastworks with planting hoes, warriors may fall back to
    them, and women and children may hide in trees or holes, sometimes feigning death
    to survive.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person might ascend to an elevated vantage point to search a region, but
    in dangerous areas concealed himself so he could see without being seen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Being called as a scout was described as an honor ranking as high as participation
    in a war party.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Having smoked the war pipe was described as an honor that could be counted
    when brave deeds were recited.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: On returning, the eldest scout, identified as the one first offered the pipe,
    went to the Tent of War to report to leaders of the We'zhinshte gens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If enemies had been found, a messenger summoned leading warriors to a council
    of war, where the scouts' report was considered and action determined.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The council's decision varied according to the reported size and behavior
    of the enemy force, including retreat, defense, attack, or driving the enemy away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Departing warriors were led by a prominent warrior or perhaps a chief; a chief
    of the Council of Seven could go to war only in defensive warfare.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: If enemies were suddenly discovered by a man outside the camp, he went to
    a vantage point and waved his robe above his head as an alarm called we'pa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When such an alarm was given, the camp was prepared at once for defense.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women threw up breastworks with planting hoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If warriors were hard pressed in an attack, they fell back to the breastworks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: If the camp was near timber and disaster occurred, women and children hid
    among the trees, and warriors sometimes followed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Old women related instances of hiding children in holes and lying over them
    as if dead during a surprise attack.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: One woman was stabbed while feigning death, did not move, saved her children,
    recovered from the wound, and later told the story.
  category: sequence
  evidence_refs:
  - ev:6
