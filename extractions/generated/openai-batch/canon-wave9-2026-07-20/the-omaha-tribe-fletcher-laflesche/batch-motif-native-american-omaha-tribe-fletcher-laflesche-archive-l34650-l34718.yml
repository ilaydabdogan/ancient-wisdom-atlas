canonical_text:
  quote: ''
  summary: In an Omaha society opening ceremony passage, a ritual participant returns
    a painted stick to the host. The “youngest son” and his lodge circle the fire,
    face the fire and west, hold up a red painted invitation stick, and sing a song
    glossed with terms for going, seeing, yonder, and walking in a path. Afterward
    they circle the fire by the left, return the stick, and sit. A servant or servants
    fetch water in a wooden bowl said to represent the earth holding the lake from
    the story; the water must come from a quiet natural source and is checked by an
    officer. Another officer begins summoning kinship-labeled figures—the eldest son,
    second son, and daughter—toward placement before the fire.
  language: English with Omaha song terms
  quote_policy: summarized
