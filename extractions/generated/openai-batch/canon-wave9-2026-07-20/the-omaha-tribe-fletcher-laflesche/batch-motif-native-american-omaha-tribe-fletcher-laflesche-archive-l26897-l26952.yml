canonical_text:
  quote: ''
  summary: 'The passage describes a Hun''ga painting rite performed on a child during
    songs: paint is displayed, red paint is put on the child''s face, black lines
    are drawn in prescribed places, and the design is explained as referring to sky,
    four-direction paths, winds, sunlight, and life. The same style of painting is
    said to be used sometimes for certain dead persons for entrance into life after
    death. A subsequent song accompanies tying a downy eagle feather on the child.'
