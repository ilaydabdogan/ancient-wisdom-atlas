canonical_text:
  quote: ''
  summary: 'The passage describes Omaha grooming and personal marking practices: a
    stiff-grass hair brush, use of buffalo fat, men''s hair styles and scalp lock,
    the placement of an eagle-feather war honor in a bone case on the scalp lock,
    red paint on hair parting lines, paint terminology by use, and face/body painting
    connected with dreams, achievements, honors, battle, hunting, ceremonies, societies,
    and prayerful appeal.'
  language: English
  quote_policy: summarized
