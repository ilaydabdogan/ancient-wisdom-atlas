  summary: The passage describes Omaha secret societies as sacred or mysterious dances
    and introduces the Monchu' ithaethe society. Entry into this society depends on
    a dream of the bear, understood as the bear showing compassion by appearing in
    a dream or vision and giving power. The society is associated with knowledge of
    sleight-of-hand performances, including thrusting wands down the throat, and this
    knowledge is said to have come originally from animals.
