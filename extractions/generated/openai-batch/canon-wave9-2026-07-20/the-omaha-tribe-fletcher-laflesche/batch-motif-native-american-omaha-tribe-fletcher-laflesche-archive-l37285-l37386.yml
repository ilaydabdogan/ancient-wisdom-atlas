canonical_text:
  quote: ''
  summary: The passage describes a secret Shell society proceeding in which a pipe
    is offered and smoked to secure consent and secrecy, a bear's claw is used to
    draw the offender's figure on the ground, poisoned arrows are ritually aimed and
    then shot into the figure's heart, and the offender is watched until sickness
    and death while masters sing at night without fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pipe is offered to selected men; if one refuses, the accuser may designate
    another, and repeated refusals can lead to abandoning the punishment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pipe must be lighted with a live coal carried in a split stick.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the pipe is accepted, it is lighted and smoked by all society members,
    which the passage says signifies consent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The refilled pipe is sent to the leaders and members of other lodges, and
    its circulation binds lodges and individuals to secrecy and fulfillment of the
    contemplated act.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The accuser has the servant take the bear's claw from the breast of the figure
    to the man who accepted the pipe, and the masters decide how many days the offender
    should live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man receiving the claw places his left hand on each member's head and
    says, "To trust you with my action."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Using the bear's claw without lifting his hand, the man draws a continuous
    outline of a human figure on the earth, including eyes, nose, mouth, a line to
    the heart, a circle for the heart, and lungs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A servant is ordered to take bow and arrows to the man who drew the figure;
    if refused, they are offered to another man, and the servant circles the fire
    while going.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man who accepts the bow and arrows receives poison from a master and poisons
    the arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The archer makes four feints at the figure and, on the last, shoots an arrow
    into the figure's heart and leaves it standing there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The masters say, "Let each man take care of himself," after which members
    throw off robes and leave singly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two servants watch the offender, who becomes sick; the masters gather at night
    in a tent without fire and sing low until he dies.
  category: sequence
  evidence_refs:
  - ev:6
