canonical_text:
  quote: ''
  summary: The passage describes the Watha'wa, a four-day initiatory feast and public
    count in which a candidate for the Hon'hewachi prepares gifts, food, and fees,
    sits before chiefs and society members, has willow sticks representing past gifts
    passed around the council circle, publicly recites and classifies the gifts, answers
    challenges through witnesses, and has the completed count proclaimed to the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who had arranged the required count, fees, food, and sponsor could have
    his name proposed to the Hon'hewachi and, if no objection was made, prepare for
    initiation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tribal herald summoned the Council of Seven and Hon'hewachi members to
    the candidate's lodge, which had been prepared for the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Articles not intended as gifts were removed from the lodge, because the candidate
    could retain nothing present when the Seven Chiefs entered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Seven Chiefs entered wearing robes in ceremonial manner and bearing the
    pipe for the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A buffalo skin was placed behind the fireplace; two bunches of grass served
    as pipe rests; tobacco was placed on a board near the fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two Ni'kagahi u'zhu sat at the center back of the lodge; other Council
    members, Hon'hewachi members, the candidate, and the herald occupied specified
    places.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A bundle of willow sticks, each representing a wathin'ethe, was handed from
    the candidate to the herald, laid before the Ni'kagahi u'zhu, passed left around
    the circle, and returned to the candidate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: People gathered outside the lodge, including aspirants to Hon'hewachi membership;
    the candidate's relatives were anxious to help his memory, and outsiders could
    dispute his statements.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The candidate took up reed after reed and stated what kind of gift it represented,
    when and where it was made, and to whom it was given.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The gifts had to be classified publicly, and contested statements could be
    supported by witness testimony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The counted gift categories included horses, robes, bows and arrows with quivers,
    pipes, and shell disks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the count, the candidate enumerated the articles gathered for fees;
    the herald proclaimed the completed count to the people, making the record public
    and thereafter unchallengeable.
  category: sequence
  evidence_refs:
  - ev:6
