canonical_text:
  quote: ''
  summary: The passage describes Omaha doctors singing and preparing medicine for
    a wounded boy, interpreting a song through an image of buffalo healing wounds
    near a round water-filled wallow. The doctors treat the boy for four days. At
    dawn he is lifted to stand, instructed to take four steps east toward the rising
    sun, and the successful fourth step is marked by a triumph song. Fees are distributed
    after the treatment. The passage then begins a section on the Wanonxe ithaethe
    society, whose members are people to whom ghosts appeared in dreams or visions
    and who are believed able to foretell events, especially approaching death.
  language: English
  quote_policy: summarized
