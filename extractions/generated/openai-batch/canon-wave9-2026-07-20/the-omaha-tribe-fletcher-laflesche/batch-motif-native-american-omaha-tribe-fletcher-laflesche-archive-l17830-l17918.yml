canonical_text:
  quote: ''
  summary: The passage describes Omaha rules for butchering buffalo, elk, deer, antelope,
    and bear; the allocation of animal portions among hunters and helpers; preparation
    of intestines, bones, and meat; transport of meat by ponies; and women’s work
    in drying and processing meat.
