- id: obs:3
  text: If helpers butchered an animal while the hunter was absent, they took their
    proper portions and left the hunter’s portions on the hide for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prominent men did not usually perform the butchering; poor men or young men
    did so to obtain food or choice bits.
  category: relationship
  evidence_refs:
  - ev:3
