  summary: In a section on courtship and marriage, the passage describes friendship
    as important for men and women, often beginning in childhood and lasting through
    life. It contrasts women's friendships with those of young men exposed to warpath
    and chase, notes enduring friendships among women, describes friends as confidants,
    and states that a man might follow and protect a friend in danger. It also says
    falsehood to a friend in love or war marked a person as without honor. A figure
    caption mentions playing on the flute.
