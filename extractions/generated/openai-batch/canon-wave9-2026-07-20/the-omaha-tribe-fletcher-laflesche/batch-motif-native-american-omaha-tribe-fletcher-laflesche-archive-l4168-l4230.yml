canonical_text:
  quote: ''
  summary: A Wazha'zhe legendary account says that some Wazha'zhe lived in the sky,
    learned from the sun and moon that they were their children, and were told to
    descend to earth. They found the earth covered with water. The elk called the
    winds from the four quarters, and the waters rose away, exposing rocks and then
    earth. Elk hairs on the soil grew into crops, grasses, and trees. The narrative
    then describes affiliations among Wazha'zhe, Hon'ga, Elk, Hon'ga utanatsi, and
    Tsi'zhu groups, including incorporation through presentation and acceptance of
    a pipe. A Hon'ga group account repeats descent to a water-covered earth, help
    sought from gods, the elk summoning four winds, and adds animal dives in which
    muskrat, loon, and beaver drown, while crawfish brings up mud from which land
    is formed. A final statement says stars are children of the sun and moon and that
    the Wa'tsetsi were stars that came down like meteors and became people.
  language: English
  quote_policy: summarized
