canonical_text:
  quote: ''
  summary: The passage describes Wa'wan ceremony objects, especially the pipes and
    their feather and color symbolism; identifies the presenting and receiving parties
    and their ceremonial kinship; states qualifications and authorization for inaugurating
    a party; lists required gifts and return gifts; and describes the traveling party
    and its handling of the pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A green-painted pipe stem carried seven tail feathers from a young golden
    eagle; these feathers were associated with men's war honors, and the pipe is said
    to symbolize masculine forces.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, on each pipe, masculine and feminine forces were
    symbolically united through the combination of feather type and stem color.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near the mouthpiece was a painted woodpecker head; the pipes were grasped
    by a duck's neck and rested on a red-painted crotched stick when laid down.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wild-cat skin with feet, claws, and head skin intact served as mat and transport
    covering for the pipes.
  category: object
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: The required ceremony articles also included two gourd rattles, a bladder
    tobacco pouch tied with sweetgrass, an eagle wing-bone whistle, and three downy
    eagle feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Two parties without blood relationship were principal participants: the presenting
    side, called wa''wan oka, and the receiving side, called a''wan iaka.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man could carry the pipes to another gens within the tribe or to another
    tribe, but not to a man of his own gens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The relationship ceremonially established by taking and receiving the pipes
    was equivalent to that of father and son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Only a man to whom the Wa'wan pipes had been presented four times was considered
    sufficiently instructed to inaugurate a Wa'wan party, and he needed consent from
    the Seven Chiefs before definite action.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Presentation of the pipes required substantial gifts, and return gifts were
    also made; these exchanges were said to support peace and welfare and could count
    toward chieftainship or admission into the Hon'hewachi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Wa'wan party included a dozen or more men; some wives of leading men sometimes
    accompanied and assisted them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: During travel, the pipes were carried in the catskin cover by a bearer who
    walked in advance with the leader; songs were not sung on the journey, but ceremony
    songs referred to travel and preparations.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
