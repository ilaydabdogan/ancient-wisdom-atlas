  summary: The passage describes the Omaha Sacred Tents, especially the tent for the
    Sacred Pole, their placement, decoration, restrictions, rules for accidental contact
    and cleansing, and later decisions about preserving or burying sacred articles
    associated with tribal ceremonies and chiefly authority.
