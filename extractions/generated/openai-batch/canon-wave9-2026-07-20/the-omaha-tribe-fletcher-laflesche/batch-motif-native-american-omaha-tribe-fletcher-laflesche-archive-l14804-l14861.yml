literal_observations:
- id: obs:1
  text: A tent set apart for the Sacred Pole was pitched in front of the Waxthe'xetona
    subgens of the Hon'ga gens, who were charged with the Pole.
  category: setting
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: The tent was decorated with round red spots; the authors say these probably
    referred to the sun and reject an alternative identification with buffalo wallows
    as improbable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three Sacred Tents of the Omaha tribe were feared because of their contents,
    and people were not to approach or touch them unbidden.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fire could not be borrowed from any of the Sacred Tents, and holes could not
    be made about the fireplace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If a person, animal, or object accidentally touched a Sacred Tent, the offending
    person, animal, or object had to be taken to the keeper for ceremonial cleansing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A piece of meat that fell into the fire while being roasted in a Sacred Tent
    had to remain there until fully consumed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The contents of two Sacred Tents were placed for safekeeping in the Peabody
    Museum: those of the Sacred Tent of War in 1884, and the Sacred Pole with its
    belongings in 1888.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sacred objects are described as essential in tribal ceremonies and expressive
    of the authority of the chiefs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Leading men of the tribe rejected destroying the sacred relics and decided
    they should be buried with their keepers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writers sought to prevent burial of the sacred objects so that the objects
    could be examined in relation to ceremonies and tribal autonomy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After years of effort, with special credit given to Pshta'maza, Joseph La
    Flesche, the sacred articles were secured.
  category: action
  evidence_refs:
  - ev:7
