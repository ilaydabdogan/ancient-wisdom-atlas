canonical_text:
  quote: '"Where shall I go, now you are gone?"'
  summary: The passage describes Omaha marriage stability, divorce, household ownership
    by women, child support expectations, women's labor and esteem, and an anecdote
    in which a widower mourns his dead wife while an elder counsels him on the irreplaceable
    nearness of a wife.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Divorce is described as not uncommon, but long monogamous marriages also occurred,
    and tribal sentiment did not favor changing marriage relations from caprice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man abused his wife, she could leave him, and her conduct was justified
    by her relations and by tribal opinion; because the tent or dwelling belonged
    to the woman, the unkind husband became homeless.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young children generally remained with the mother, while the father's brothers
    were expected to help the woman support them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman described as immoral could be put away and sometimes severely punished
    by her husband, and in that case no one interfered to protect her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Omaha woman is said to have worked hard, preparing food, shelter, clothing,
    and garden patches, and much of the people's livelihood depended on her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman held no public office, but her wishes were respected, she was esteemed,
    and many tribal movements and ceremonies depended on her timely assistance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The family is described as generally a center of affection, with many happy
    families bound closely together.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the mourning anecdote, an old Omaha man stood beside a husband whose wife
    lay dead.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The mourning husband wailed, held the dead woman's cold hand, used endearing
    terms not uttered to the living, and asked where he should go now that she was
    gone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The old man told the mourner that losing a wife was the sorest trial for a
    man, that he would miss her care, that harsh words spoken to her would bring tears,
    and that a husband's joy dies with his wife.
  category: speech
  evidence_refs:
  - ev:4
