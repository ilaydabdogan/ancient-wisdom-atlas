canonical_text:
  quote: ''
  summary: The passage records elder admonitions contrasting lazy or thriftless conduct
    with industrious or thrifty conduct for boys, men, girls, and women. It links
    work skills, good clothing, hospitality, generosity, and a good tent with social
    welcome and remembrance, while laziness or ignorance leads to envy, theft, dependence
    on strangers, social neglect, and friendless death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elder speech contrasts a lazy man's poor clothing with an industrious man's
    well-prepared clothing and adornment.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lazy man is described as unable to entertain others, envious, socially
    avoided, unattended at death, and without known mourning or burial memory.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The energetic and thrifty man is described as invited to feasts, easy to approach,
    generous to weaker people, visited on his deathbed, mourned, and remembered.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Old men are said to have addressed both boys and girls to prevent envy, theft,
    and laziness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Girls were expected to learn scraping, dressing, and tanning skins, and to
    make tent covers, garments, and moccasins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A girl or woman who does not learn the teachings is pictured at a stranger's
    house near the kettle pole, going for water, opening a pack, stealing dried meat
    into her belt, and eating it stealthily without satisfaction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The thrifty woman is described as having a good tent, good tools, and good
    clothing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The thriftless woman is described at a stranger's place with holes in her
    moccasins, cutting a piece from her robe for patching, borrowing a workbag, and
    stealing sinew into her belt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The husband of a thrifty woman is said to bring her the best materials and
    tools, and other people are said to want to enter her good tent and talk with
    the couple.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman who remains ignorant of women's work is said to ask other women to
    cut and fit her moccasins, leave her people, enter a strange tribe, fall into
    trouble, and die friendless.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a woman is thrifty and builds a good tent or earth lodge, people are said
    to like her and assist her husband.
  category: relationship
  evidence_refs:
  - ev:9
