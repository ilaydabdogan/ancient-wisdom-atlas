  quote: ''
  summary: The passage describes a ritual song associated with a symbolic thunderstorm
    and the warrior or Thunder god. During the song a leader applies black paint to
    parts of his face and chest, and other members do the same after servants pass
    the bowl. The leader then handles pipes, drops tobacco on the earth, lifts and
    points pipe stems upward and toward the four directions, lights the pipes, and
    gives them to servants while a prayer is sung.
