canonical_text:
  quote: ''
  summary: 'The passage describes Omaha courtship-related social practices: young
    male friends help one another dress and adorn themselves, may act as go-betweens
    with a chosen girl, and courtship meetings often occur at springs in the early
    morning when girls go for water in pairs or with female companions. Young men
    wait hidden near such places, and a lover often makes his presence known through
    a flute love song composed for the instrument.'
