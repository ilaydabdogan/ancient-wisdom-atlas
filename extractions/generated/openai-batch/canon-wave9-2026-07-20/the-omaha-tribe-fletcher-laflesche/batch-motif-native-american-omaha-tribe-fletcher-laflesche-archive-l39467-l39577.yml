canonical_text:
  quote: ''
  summary: The passage describes the hereditary office of keeper for Omaha gens or
    subgens sacred objects and rites, the keeper's ritual authority and succession,
    and the social standing of keepers. It then defines We'wacpe as institutional
    tribal religious rites intended to bring the people into order and composure,
    to open a way between the people and Wakon/da, and to maintain prescribed ritual
    order. It distinguishes these rites from personal supernatural seeking and most
    secret society rites, lists rites included in the We'wacpe class, and describes
    the Hede'wachi ceremony in which all the people advance toward a decorated central
    pole while led by the two Sacred Pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each gens or subgens had a particular family with hereditary right to furnish
    the keeper responsible for the sacred object of the gens and its rituals and rites.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The keeper alone had authority to perform the ceremony, recite rituals, conduct
    rites, instruct his son and successor, and transmit the knowledge and right to
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If all male members of a keeper's family died, the Seven Chiefs were required
    to select another family in the same subgens to take up the keeper's duties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Keepers did not ordinarily wear distinctive ceremonial dress or live apart,
    but were respected and generally conformed their lives to the sacredness of their
    duties; some keepers became chiefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: We'wacpe was a name for tribal religious rites and was explained as something
    that brings the people into order and thoughtful composure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: We'wacpe rites were described as having social value by holding people together
    through common belief and ceremonial expression, and by increasing self-control,
    composure, and submission to authority.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: We'wacpe rites partook of prayer and were believed to open a way between the
    people and Wakon/da, so the rites had to be given accurately for the return of
    desired benefit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A mistake in rendering a ritual could require a ceremony of contrition to
    avert trouble from the people, because interruption of prescribed ceremonial order
    was believed to be subject to supernatural punishment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: We'wacpe rites were institutional and were distinguished from personal rites
    in which a youth sought relation with the supernatural, and from most secret society
    rites except the Hon'hewachi.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage lists We'wacpe rites connected with maize, the annual buffalo
    hunt and White Buffalo Hide, the two Sacred Tribal Pipes, the Sacred Pole, the
    introduction of the child to the cosmos, Turning the Child, the consecration of
    the boy to Thunder, the Hede'wachi, and the Wa'wan ceremony.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
- id: obs:11
  text: In the Hede'wachi, all the people were led by the two Sacred Pipes, borne
    by hereditary keepers, in an advance by gentes toward a symbolically decorated
    pole at the center of the tribal circle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The teaching of the Hede'wachi was that the tribe must be a living unit, as
    the tree and its branches are one.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Wa'wan ceremony was classed with We'wacpe because it brought peaceful
    relations within and outside the tribe.
  category: attribute
  evidence_refs:
  - ev:11
