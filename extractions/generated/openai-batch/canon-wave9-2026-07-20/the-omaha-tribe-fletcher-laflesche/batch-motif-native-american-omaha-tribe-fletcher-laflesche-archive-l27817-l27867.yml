canonical_text:
  quote: The wolf skin is said to have been used in augury by a war party.
  summary: The passage describes objects from the Sacred War Pack, especially a wolf
    skin used by a war party for augury. The skin was soaked, placed around a seated
    man's throat, tightened without choking him, and the man, while unconscious, was
    expected to see future conditions and events. The passage also notes a Winnebago
    otter-skin parallel and states that the pack authorized warfare, with pipes ceremonially
    smoked when defensive warfare was authorized.
  language: English
  quote_policy: quoted
