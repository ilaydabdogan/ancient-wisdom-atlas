canonical_text:
  quote: ''
  summary: The passage lists Omaha personal names and glosses, including names involving
    the moon, buffalo, birds, badger, tick, paint, and fire. It then describes the
    Hon'ga gens as a central and leading gens in the tribal camp, compares its place
    to the father's place in a family tent, and explains the duties of its two subgentes
    in relation to two Sacred Tents. One tent is associated with the White Buffalo
    Hide, physical welfare, food rites, and warfare; the other with the Sacred Pole,
    Thunder, supernatural Powers, Wakon'da-derived chiefly authority, Sky people,
    and rites concerning relation to the supernatural. It also describes tabus, offerings,
    crane feathers on divining arrows, and worker families serving Sacred Pole ceremonies.
  language: English
  quote_policy: summarized
