canonical_text:
  quote: ''
  summary: The passage describes the Hethu'shka society as selecting brave men and
    enforcing peace through public exclusion of disruptive members. It then describes
    preparations for a society meeting in a cleared lodge, including wood, food, black
    paint, and pipes. A song sung when the leader takes up the black paint links charcoal-black
    paint with black clouds on the face, warlike readiness, and warriors waiting to
    go where Thunder leads them. The author explains that the song's weariness means
    impatience for heroic action rather than literal tiredness.
  language: English
  quote_policy: summarized
