canonical_text:
  quote: '"It is the Holy Tent of the Omahas," I replied. "What is inside of it?"
    "The Sacred Pole," I answered.'
  summary: An ethnographic narrator describes the Omaha transition to agricultural
    allotment, encounters the Holy Tent and Sacred Pole, recalls the Pole's social
    and ritual importance, hears the Keeper's wife lament its abandonment, and later
    receives the Pole and its belongings from Smoked Yellow, the last Keeper.
  language: English
  quote_policy: quoted
