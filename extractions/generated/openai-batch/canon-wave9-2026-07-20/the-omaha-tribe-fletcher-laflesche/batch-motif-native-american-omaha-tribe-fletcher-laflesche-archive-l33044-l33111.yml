canonical_text:
  quote: ''
  summary: After the count, a solemn pipe-smoking ceremony presents the counted wathin'
    ethe to Wakon'da and represents an oath of membership. The pipe is lit, passed,
    oriented, circled around the fireplace, raised toward the zenith, cleaned, and
    returned to rest according to prescribed movements said to refer to heavenly bodies.
    A sacred porridge is then brought in two bowls, eaten in four spoonfuls by each
    participant with restrictions against spilling or making noise, and partly distributed
    to chiefs' households. Any Council of Seven chief not belonging to the Hon'hewachi
    leaves, leaving the candidate and society members in the lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pipe-smoking ceremony follows completion of the count and is described
    as a formal presentation to Wakon'da and as an oath of membership.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A firebrand is not used to light the pipe; instead, a live coal is taken from
    the fire with a split stick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pipe is first positioned with its stem toward the south and is to pass
    in an unbroken circle from south to north before being laid down with its stem
    toward the north.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The herald holds the pipe while chiefs smoke it, then carries it around the
    fireplace and holds it up to the zenith before laying it to rest.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The chief who lighted the pipe grasps stem and bowl, swings the pipe slowly
    in a right-to-left circle, cleans it, and lays it back on the grass rest with
    the stem to the south.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The movements connected with passing and resting the pipe are said to refer
    to movements of the heavenly bodies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The herald places the pipe's grass rest and the bundle of counting sticks
    together in the back part of the lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Members of the candidate's family outside the lodge fill two large wooden
    bowls with porridge made of pounded maize and pass them into the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each person takes four spoonfuls of the porridge, and care is taken not to
    spill the sacred food or make noise with the lips while eating.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chief sitting toward the south pours a few drops of food into a depression
    in the ground near the fireplace, made with the knuckle of the right forefinger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Remaining food in the two bowls is assigned to chiefs on the north and south
    sides, carried to their homes by wives and daughters, and the emptied bowls are
    returned near the lodge door.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Any Council of Seven chief who is not a member of the Hon'hewachi is excused,
    thanks the assembly, and leaves; the lodge then contains only the candidate and
    Hon'hewachi members.
  category: sequence
  evidence_refs:
  - ev:7
