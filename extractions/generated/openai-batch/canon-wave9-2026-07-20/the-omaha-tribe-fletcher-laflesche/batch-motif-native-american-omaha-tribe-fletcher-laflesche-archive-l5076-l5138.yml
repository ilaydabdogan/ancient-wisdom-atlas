  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The people planted kernels in small mounds resembling the original mound;
    the kernels sprouted, grew through summer, ripened, and were eaten.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The people observed ears of different colors, including white, blue, and yellow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The next season the Arikara harvested abundantly, invited other tribes for
