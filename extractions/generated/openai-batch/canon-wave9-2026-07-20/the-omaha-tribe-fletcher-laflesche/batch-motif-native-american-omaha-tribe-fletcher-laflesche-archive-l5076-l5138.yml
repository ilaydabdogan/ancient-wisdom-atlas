canonical_text:
  quote: ''
  summary: A mysterious plant develops fruit. The people hesitate to touch it until
    a youth volunteers to test it; he handles the plant, eats some grains, and suffers
    no harm. The people preserve and plant kernels, raise a harvest, and later the
    Arikara share the plant with visiting tribes, including the Omaha. Authorial commentary
    identifies the plant as maize and notes the story’s blending of buffalo and maize
    as principal food supplies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plant first blossomed, then produced a new growth from its joints with
    a hairlike top that darkened; the people concluded this growth was the ripe fruit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the youth acted, the assembled people wanted to know the plant’s use
    but did not dare touch it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A youth described his own life as of little value and volunteered to be the
    first to touch and taste the plant so that others could learn whether it was good
    or bad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth placed his right hand on the blossoms, moved it downward to the
    root as though blessing the plant, grasped the fruit, parted the husks, displayed
    grains, ate some, and replaced the husks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youth reported that the fruit was solid, ripe, and red; after he suffered
    no ill effects, the people concluded that the plant was given to them for food.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: In the fall the plant browned with the prairie grass, and the fruit was plucked
