canonical_text:
  quote: ''
  summary: A non-narrative ethnographic list of Omaha names and glosses under tribal
    organization. The entries include male, female, borrowed, dream, fanciful, and
    nickname categories, with meanings tied to buffalo, the buffalo chase, pipe bearers,
    tribal pipes, water, moon imagery, arrows, and notes of Ponca and Dakota parallels
    or borrowing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is organized as a catalog of name categories, including fanciful
    names, male names, Ni'kie names, borrowed names, dream names, nicknames, and female
    names.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several entries are glossed with buffalo referents, including buffalo calf,
    bull, buffalo neck skin, buffalo tongue, sacred buffalo, medicine cow, and buffalo
    herds fleeing hunters.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
  - ev:13
- id: obs:3
  text: The name Inshtaxthabi is glossed as appointed eyes and is said to refer to
    an appointed and hereditary leader of the chase.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name Mounonkuge is explained as referring to the rumbling sound made by
    buffalo herds' hoofs when they flee hunters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The name Tade'ta is linked to the running of pipe bearers in the He'dewachi
    ceremony, and U'thixide is said probably to refer to runners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The female name I'nikashabi is said to refer to tribal pipes, described as
    objects by which the tribe is identified as a people.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Female names in the passage include New moon, New moon coming, and Moon hawk.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The name Nionbathin is glossed through the elements water, day, and walk or
    travel.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tewakonnonzhin is listed as Sacred buffalo and is also described as a borrowed
    Dakota name equivalent to medicine cow.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Multiple entries include parenthetical notes locating similar or identical
    names in Ponca subdivisions.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The female name Hamate is said to refer to the child Hon'ga in the Wa'wa ceremony.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The fanciful names Monthegahi and Monthihi are both glossed as referring to
    arrow.
  category: object
  evidence_refs:
  - ev:12
