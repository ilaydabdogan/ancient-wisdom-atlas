canonical_text:
  quote: ''
  summary: A stranger remains with a man, his wife, and their children after the tribe
    moves off to hunt. The stranger repeatedly gives water to the family, washes and
    combs the children, directs travel and hunts, teaches plant knowledge, instructs
    the family in preparing meat and reserving heart and tongue portions, and leads
    all-night song ceremonies associated with animal cries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tribe moves away to hunt, leaving a man, his wife, their children, and
    a stranger behind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the father watches the stranger, while the stranger pretends to sleep
    but also watches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stranger fetches water, gives it to the children and parents, combs the
    children's hair, and washes them; this pattern is repeated on later mornings.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:4
  text: The stranger directs the family to move and teaches the parents to observe
    trees, fruits, herbs, and roots useful for food and medicine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stranger sends the man to a place near a stream, scattered elm trees,
    thickets, and wild bean vines; the man kills thirteen deer there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stranger instructs the man to roast four shoulders, distributes meat to
    the children and parents, and orders the rest dried before the fire and cached.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stranger sends the man to sand hills and scattered cottonwood trees; the
    man kills a forked-horn elk about four years old and several deer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stranger orders the elk heart and tongue to be set aside for a ceremony
    and later tells the woman to fetch water and cook them.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: During the elk ceremony the stranger sits at the south side of the fireplace,
    with the father, mother, and children seated in order to his left.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The stranger sings twenty-two songs, teaches them to the father and mother,
    and has the family sing all night; animal cries are heard between songs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After several days the stranger sends the man to a creek with ravines, great
    elms, knolls, and stumps; the man kills an unexpected buffalo cow and several
    deer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The buffalo heart and tongue are cooked and eaten in a second night ceremony
    with ordered seating, songs, animal cries, and an exit song to be remembered before
    going out.
  category: sequence
  evidence_refs:
  - ev:8
