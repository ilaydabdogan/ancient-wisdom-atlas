canonical_text:
  quote: ''
  summary: 'The passage describes the Omaha annual buffalo hunt: its seasonal timing
    after crop cultivation, the tribe''s departure and transport arrangements, the
    role and authority of the wathon'' or director of the hunt, and the materials
    and hereditary manufacture of the washa''be ceremonial staff.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After crops had advanced and corn, beans, and melons had been cultivated for
    the second time, the season had arrived for the annual buffalo hunt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Preparations for the hunt took several weeks, and men, women, and children
    moved out on a journey that could cover several hundred miles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The very old, the sick, and a few people who cared for and protected them
    remained in the otherwise deserted village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Articles not needed for the hunt were cached, and the entrances to the caches
    were concealed because of fear of marauding enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Earth lodges were left empty; tent covers and poles were taken along, and
    portable dwellings were used during the hunt.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ponies served as burden bearers, carrying tent poles, parfleche cases, clothing,
    regalia, food supplies, cooking utensils, and sometimes children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Travois supported nests for children, while men and women walked or rode depending
    on the family's horse supply.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Some boys rode unbroken ponies during the cavalcade, described as their first
    chance to win a place as independent riders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: A man seeking the office of wathon' spent months gathering materials for the
    washa'be staff, with labor from himself and his family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The gathered staff materials included an ash sapling, two eagles, a crow,
    a swan skin, a dressed buffalo skin, sinew, a shell disk, a kettle, and a pipestem.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: The wathon' or director of the hunt held a highly responsible and honored
    office requiring courage and the ability to lead and command obedience.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: During the term of office, the whole tribe was placed under the director's
    direction and control, while the Council of Seven Chiefs acted as counselors and
    obeyed his instructions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The director managed the march, selected camps, sent runners to find buffalo
    herds, directed the hunt, and was responsible for the welfare of the people and
    other occurrences.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The aspirant took or sent prescribed articles to the Washa'be subgens of the
    Ho"'ga gens, which held the hereditary right to make the staff.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The staff was made from an ash pole more than eight feet high with a crook
    at the end, covered with buffalo skin and wound with swan-down strips to make
    it white.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:16
  text: Eagle feathers were fastened to one side of the staff, golden eagle feathers
    hung from the crook, crow feathers were placed near the sharpened base, and a
    shell disk was fastened to the accompanying pipestem.
  category: object
  evidence_refs:
  - ev:6
