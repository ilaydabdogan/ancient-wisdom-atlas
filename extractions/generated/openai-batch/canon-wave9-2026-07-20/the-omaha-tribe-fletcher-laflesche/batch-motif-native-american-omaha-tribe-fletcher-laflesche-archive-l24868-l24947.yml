canonical_text:
  quote: ''
  summary: 'The passage explains several illustrated robe or blanket adjustments as
    a social language: an old man''s wrapped pose signifies age and weakness; a young
    lover conceals himself while watching for his sweetheart at a spring; a public
    observer waits for the right moment; a speaker addresses the tribe or council;
    an admonishing speaker pauses to draw on past experience; and an angry man pulls
    his robe over his head, withdrawing from observation and emphasizing separation
    from others.'
