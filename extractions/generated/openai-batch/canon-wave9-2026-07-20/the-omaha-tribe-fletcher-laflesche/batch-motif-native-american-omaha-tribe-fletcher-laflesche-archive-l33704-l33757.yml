canonical_text:
  quote: '"I am a being of mysteries."'
  summary: The passage introduces the Omaha story of the origin of the Shell society.
    A mysterious stranger repeatedly visits a village in spring and is hosted by a
    modest hunter’s household at the urging of the hunter’s wife. On the fourth spring,
    after repeated hospitality, the stranger identifies himself as a being of mysteries
    and says he will instruct the man during a season of travel, expecting a return
    to be named later.
  language: English
  quote_policy: quoted
