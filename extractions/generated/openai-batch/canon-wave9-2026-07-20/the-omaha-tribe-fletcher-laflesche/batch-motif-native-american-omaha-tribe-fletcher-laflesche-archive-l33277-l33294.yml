canonical_text:
  quote: ''
  summary: The passage describes Omaha society songs classified by rhythm, especially
    in relation to named societies and rites. Members of the Hon'hewachi were required
    to compose personal songs conforming to the society's initial rhythmic standard,
    often referring to a dream or vision received after supplication. Chiefs and members
    stayed overnight at a candidate's lodge and remained guests until the tattooing
    ceremony was completed, while the candidate's family stayed nearby and two marked
    women cooked for the assembled guests.
  language: English
