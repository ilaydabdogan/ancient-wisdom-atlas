  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Kon'ce held the office of starting the ball game played by the two grand
    divisions of the Jiu'thuga.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Tade'ata subgens camped on the left of the Te'pa itazhi of the Tha'tada,
