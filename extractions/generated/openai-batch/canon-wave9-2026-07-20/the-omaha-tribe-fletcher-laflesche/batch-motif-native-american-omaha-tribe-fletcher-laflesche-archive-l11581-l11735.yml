canonical_text:
  quote: ''
  summary: 'Ethnographic prose describing the Kon''ce gens: its ancient name, camp
    placement, two subdivisions, former wind rites, a remembered breeze-calling jest,
    verdigris taboo, symbolic children''s hair cut linked to wind rites and compass
    directions, ceremonial offices, and personal names associated with wind, clouds,
    moon, earth, and other terms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gens name is described as ancient, untranslatable, and connected with
    the Kansa, a cognate tribe related to the Omaha.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Jiu'ihuga, the Kon'ce gens camped on the left of the Tha'tada.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The gens had two subdivisions: Tade''ata and Xini''baton/Nini''baton.'
  category: relationship
  evidence_refs:
  - ev:3
  - ev:11
- id: obs:4
  text: Tade'ata is glossed as 'in the direction of the wind,' and its name is said
    to refer to clouds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Former rites connected with wind were in the charge of the Tade'ata subgens,
    but the text says they have been lost.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A remembered jesting action involved beating a Kon'ce man with robes when
    mosquitoes were thick, which was said to call up a breeze to drive the mosquitoes
    away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Verdigris was the taboo of the entire gens and its subgentes, and the people
    were forbidden to touch it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The symbolic cut of children's hair represented a design formerly cut upon
    the earth after sod was removed during ancient wind rites.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The hair cut left four tufts—at the forehead, nape, and over each ear—representing
    the four compass points, with narrow lines of hair extending upward to a round
    top tuft.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Hethu'shka society was formerly led around the tribal circle by the Kon'ce;
