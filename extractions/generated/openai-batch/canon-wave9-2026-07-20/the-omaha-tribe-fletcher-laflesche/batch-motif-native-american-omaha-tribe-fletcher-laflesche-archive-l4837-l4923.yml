canonical_text:
  quote: ''
  summary: The passage presents Omaha migration and settlement traditions, including
    remembered deserted villages, contacts and peace-making with neighboring peoples,
    the cutting and ritual importance of the Sacred Pole, a battle in which the Pole
    nearly was captured, the burial of battle dead in a mound, the formation of a
    governing council of seven, and a later peace ceremony identified with the Pawnee
    Hako.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old men are reported to have seen traces of deserted village sites east of
    the Missouri in a region where the tribe is said once to have lived.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dakota tradition is said to tell of meeting the Omaha near the Blue Earth
    and Minnesota rivers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that legends and rites support the view that the Omaha
    dwelt for a considerable time in a forest region and show the influence of the
    woods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sacred Pole is said to have been cut while the people were in wooded country;
    the Ponca were still with the Omaha, and Ponca legends were similar regarding
    finding and cutting the Pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tree from which the Sacred Pole was cut is said to have stood near a lake;
    a proposed identification with Lake Andes is reported but rejected by the best
    tribal authorities and not favored by traditions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Omaha are said to have organized themselves into their present order before
    the cutting of the Sacred Pole, and the rites connected with the Pole are described
    as conserving that order.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a village near the Big Sioux, a disastrous battle occurred; the village
    was abandoned after the dead were gathered and buried in a great mound surrounded
    by a stone wall, and tradition says the Sacred Pole nearly was captured.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A legend says the Omaha made peace with the Cheyenne while the Ponca were
    with them, and that the Iowa and Oto joined in the peace; an old narrator reports
    but rejects an Osage claim to have been present.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the place where peace with the Cheyenne had been made, the people formed
    a government by selecting wise, thoughtful, generous, and kind men as a council
    of seven to govern the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the Big Sioux battle, Omaha war parties reached and crossed the Missouri
    and fought the Arikara, who are said to have been first encountered on the west
    side of the Missouri.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Omaha later built a village at a loop of the Big Sioux where a small stream
    enters from a canyon with two pinnacled cliffs and violent wind disturbing the
    water; they were then living in bark houses and had not yet adopted the earth
    lodge.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the canyon-mouth village, peace was made among the Arikara, Cheyenne, Omaha,
    Ponca, Iowa, and Oto and was sought to be confirmed through the Wa'wan ceremony,
    identified in the passage as the same ceremony as the Pawnee Hako.
  category: action
  evidence_refs:
  - ev:9
