canonical_text:
  quote: A fire was kept burning on the grave for four nights that its light might
    cheer the dead as he traveled
  summary: The passage describes Omaha mourning expressions, preparation and mound
    burial of the dead, grave goods, commemorative feasts and races, food offerings
    understood as remembrance, a four-night grave fire for the dead person's journey,
    and a bloodletting ceremony by young men for a respected deceased person.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Grief is described as expressed through abandonment of things otherwise prized,
    not only immediately after bereavement but whenever sorrow is recalled.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the He'dewachi festival, those who had lost children or near relatives
    since the last celebration were accustomed to wail while others expressed joyful
    anticipation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman on the annual hunt who remembered a lost child's fondness for wild
    potatoes could throw her gathered roots down at the center of the tribal circle
    and return empty-handed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The body was prepared for burial soon after death, dressed in best clothing,
    sometimes supplied with regalia, weapons, and shield, and could be viewed from
    outside by lifting the tent cover.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In older practice, the body was carried on a rude litter and placed in a shallow
    hilltop grave in a sitting posture facing east, with poles and earth forming a
    mound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After horses were acquired, a horse was sometimes strangled at the grave,
    but it was not buried with the man; personal belongings of men, women, and children
    were usually put in the grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the death and burial of a young man or woman, parents could hold a feast
    for the deceased person's companions, followed by races and distribution of contributed
    property to winners.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food placed on the grave is explained as remembrance and compared with dropping
    a bit of food into the fire in remembrance of Wakon'da's gift of food; the passage
    states this was not because the dead needed or ate the food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A fire was kept on the grave for four nights so its light might cheer the
    dead while traveling; after that time the dead was supposed to have reached the
    journey's end.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a greatly respected person died, young men sometimes stripped to the
    breechcloth, cut two incisions in the upper left arm, inserted willow twigs with
    leaves through the flesh, and processed bleeding to the lodge of the dead.
  category: sequence
  evidence_refs:
  - ev:7
