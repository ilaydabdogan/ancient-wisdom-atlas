canonical_text:
  quote: ''
  summary: 'The passage explains songs associated with an Omaha society tradition:
    a mother sends her son to invite a mysterious stranger to a feast; the act is
    remembered as leading to the society and a gift of magic. Another song concerns
    the youngest son, who is called into a tent and ritually “shot” by the mysterious
    stranger, through which magic is given and can be transmitted. The stranger is
    also said to have taught songs while the family ate magically obtained game. The
    passage ends with a ritual sequence involving disrobing, feast food, broth placed
    in the fireplace, circling the fire, and facing east.'
  language: English
