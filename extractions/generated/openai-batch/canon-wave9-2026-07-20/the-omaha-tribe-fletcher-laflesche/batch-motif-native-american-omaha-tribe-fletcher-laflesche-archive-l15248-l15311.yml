canonical_text:
  quote: ''
  summary: 'The passage describes Omaha ceremonial procedures connected with the Sacred
    Pole: how ritual song mistakes require contrition and restarting, how Xu''ka serve
    as prompters, how the Sacred Pole is positioned in the communal lodge, how reeds
    are used to count eligible warriors by name, and how called men make buffalo-meat
    offerings to the Pole, with feared consequences for refusal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When there was doubt about the proper song in the Sacred Pole ritual sequence,
    the Hon'ga consulted the Xu'ka.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a Sacred Pole song was sung out of sequence, the Waxthe'xeton subgens of
    the Hon'ga stood with arms lifted and palms upward, wept, had their tears wiped
    by an official server, and then restarted the ceremony from the beginning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same prompter role is described for the Xu'ka in relation to the ritual
    of the Sacred White Buffalo Hide, whose course was required to be unbroken and
    straight.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the described ceremonial occasion, the herald wore a band of matted buffalo
    wool around his head with a downy eagle feather standing in it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wife of the keeper of the Pole carried the Sacred Pole to the edge of
    the communal lodge, and the keeper arranged it to lean on a crotched stick toward
    the center of the hu'thuqa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The pipe belonging to the Sacred Pole was smoked before a bundle of reeds
    was brought to count men of the tribe able to serve as warriors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each chief drew a reed and named a qualified householder; the herald then
    advanced to the Pole and shouted the name for the whole tribe to hear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A called man was expected to send a fine, fat piece of buffalo meat of the
    tezhu' cut by one of his children; a parent could help if the meat was heavy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Children carrying the meat feared the fat intended for the Pole and sometimes
    wiped greasy fingers on grass to avoid blame or possible sacrilege.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Refusal to make the offering to the Pole is said to result in being struck
    by lightning, wounded in battle, or losing a limb through a splinter in the foot.
  category: sequence
  evidence_refs:
  - ev:8
