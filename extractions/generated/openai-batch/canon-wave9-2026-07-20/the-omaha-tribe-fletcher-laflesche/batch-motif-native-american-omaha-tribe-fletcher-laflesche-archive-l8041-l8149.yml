canonical_text:
  quote: ''
  summary: The passage describes an Omaha ceremony for children old enough to walk
    steadily. A sacred tent is prepared, parents bring children with new moccasins
    and gifts, and the priest petitions and blesses the child for long life, strength,
    and possessions. The ritual space includes a central fire, a stone east of the
    fire, and grass west of it. The priest speaks in the capacity of Thunder, invokes
    the four Winds, then faces the child east with feet on the stone and turns the
    child around.
  language: English
  quote_policy: summarized
