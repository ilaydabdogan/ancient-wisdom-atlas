canonical_text:
  quote: ''
  summary: The passage gives a Thunder Song with literal glosses, explains it as referring
    to a man who fasts and prays while Thunder beings address him as friend, and then
    describes the Hon'hewachi society of honorary chieftainship. The Hon'hewachi section
    links membership, prescribed acts and gifts, tattooed symbols of night and day,
    the role of Night and Wakonda, and older sacred objects such as the Cedar Pole
    and Sacred Shell to creative cosmic forces.
  language: English
  quote_policy: summarized
