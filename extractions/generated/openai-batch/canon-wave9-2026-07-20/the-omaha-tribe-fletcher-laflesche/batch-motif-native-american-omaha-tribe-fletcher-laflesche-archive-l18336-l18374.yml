canonical_text:
  quote: The feast being a sacred one, the consecrated food was prized, as it was
    believed to bring health and long life.
  summary: The passage describes a sacred feast connected with the White Buffalo Hide.
    Certain Omaha groups attend in ceremonial buffalo robes. The Washa'be/Washa'beton
    subgens prepare the food but abstain from buffalo tongue because it is tabu and
    because they act as hosts for the White Buffalo. Consecrated food is valued for
    health and long life. After the feast, the White Buffalo Hide is mounted in the
    place of honor facing east while ritual song, bowed posture, and pipe smoking
    occur.
  language: English
  quote_policy: quoted
