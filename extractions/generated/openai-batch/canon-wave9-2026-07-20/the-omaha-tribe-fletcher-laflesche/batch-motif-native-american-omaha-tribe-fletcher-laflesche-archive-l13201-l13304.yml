canonical_text:
  quote: ''
  summary: The passage is an ethnographic list of Omaha names with glosses, etymologies,
    and notes. Several entries describe thunder, lightning, clouds, wind, storm aftermath,
    a cedar tree struck by thunder, a ritual keeper associated with cutting hair and
    consecrating a child to thunder, thunder under the guise of a stealthy warrior,
    lightning entering a lodge, a small reptile hiding in earth when thunder comes,
    storm movement along valleys and river courses, thunder footsteps, animal referents,
    treaty appearances, and related Ponca or Osage occurrences.
  language: English
  quote_policy: summarized
