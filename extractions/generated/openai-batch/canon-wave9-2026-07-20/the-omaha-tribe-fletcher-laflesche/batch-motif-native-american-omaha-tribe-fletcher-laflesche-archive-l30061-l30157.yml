canonical_text:
  quote: ''
  summary: Ethnographic description of Omaha arrow making, arrow types and uses, shooting
    games, personal and gens-related arrow decoration, bow changes after horses, and
    quiver construction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arrow shafts were measured against the left arm and hand, cut to length, notched,
    and slit to receive an arrowhead shank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arrowheads were inserted into the slit and fastened with sinew soaked in glue;
    the glue was made by boiling horn, turtle shell, or rawhide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Feathers were wound onto arrowshafts with sinew soaked in glue water, and
    burnt mica was used for whitening and drying the sinew.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Waving lines or grooves were made along shafts to prevent the wood from returning
    to its natural bend; the passage explicitly says they were not made as blood channels
    or as lightning symbols.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Three arrow types are listed: stone- or flint-headed arrows for big game
    and defensive warfare; sharpened-foot arrows for small game, practice, and gambling;
    and knobbed-foot arrows used by boys to kill birds.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In shooting games, an arrow stuck in the ground served as the mark, and players
    aimed to strike the place where it entered the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stakes in shooting games could be arrows, goods, robes, saddles, or horses;
    when the stakes were goods or horses, only two men could contest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arrows were decorated in pairs to identify the slayer of an animal during
    hunting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The expression monwin'don, literally referring to arrows being together or
    united, was used to indicate that things were similar.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Among the Omaha, arrow decoration was individual and not a common gens mark;
    among the Ponca, certain gentes painted arrows in prescribed ways.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before horses, bows and arrows were made long for accuracy; after horses came
    into use, shorter bows were used because shooting could occur at closer range
    and long bows were inconvenient on horseback.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The quiver was made of skin with a broad shoulder strap; otter-skin quivers
    ornamented with quills or beads were used on dress occasions.
  category: object
  evidence_refs:
  - ev:7
