canonical_text:
  quote: Wakonda! here, needy, he stands, and I am he.
  summary: The passage gives an Omaha prayer to Wakonda and explains a rite in which
    a youth stands as a needy suppliant, fasts and prays for up to four days and nights,
    refrains from using his bow and arrows, and may receive a vision or sound that
    becomes a personal medium of supernatural aid and a sacred song or call.
  language: English with Omaha terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The prayer addresses Wakonda and describes the speaker as standing here in
    need and humility.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer is called Wakonda gikon and is glossed as weeping from lack, want,
    or conscious insufficiency.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The suppliant is described as standing alone in a solitary place with clay
    on his head, tears falling, and hands lifted in supplication.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Omaha thought the appeal of a young, untried, poor supplicant
    could move Wakonda, who could understand and respond.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youth is to fast and pray for four days and nights if physically able.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Even if hungry, the youth is forbidden to use the bow and arrows his father
    placed in his hands when he left home for the solitary test.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If, during sleep or trance, the youth sees or hears something, that thing
    becomes a special medium through which he can receive supernatural aid.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A cadence generally accompanies the sight of the thing, and this cadence becomes
    the song or call by which the man may summon aid.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the form that appears is believed to be drawn toward the
    man by pity; examples are a buffalo or thunder having compassion on him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The vision and sacred call are kept as the man's own, are not ordinarily spoken
    of, and are described as a personal connection with the vast universe.
  category: attribute
  evidence_refs:
  - ev:7
