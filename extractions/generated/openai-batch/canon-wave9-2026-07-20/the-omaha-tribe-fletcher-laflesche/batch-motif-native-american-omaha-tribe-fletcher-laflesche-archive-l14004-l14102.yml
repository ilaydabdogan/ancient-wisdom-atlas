canonical_text:
  quote: ''
  summary: The passage describes Omaha graded acts by which an aspirant could gain
    recognition toward entrance into the Ni'kagahi sha'be order. These acts involve
    feasts, gifts to chiefs or sacred objects, ritual custodians, public proclamation,
    pipe-mediated peacemaking after killings, death-honoring donations, and a nonregular
    generous act called waba'hon involving the dedication of game with tobacco.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the second grade, an aspirant asks the tribal herald to summon the Ni'kagahi
    sha'be and the keeper of the pipe-filling ritual to a feast and must provide gifts
    including leggings, robes, bows and arrows, and tobacco; the ritual keeper can
    thwart the act by leaving the pipes unfilled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the third grade, a man makes a feast for the Ni'kagahi sha'be and tethers
    a horse with a new robe at his tent door as gifts to the guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the fourth grade, during the annual hunt, a man presents a horse or new
    robe to the Sacred Pole while the Pole and governing chiefs are in advance; the
    tribe halts and the herald proclaims the giver's name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the fifth grade, the Sacred White Buffalo Hide is opened and shown, and
    a shell disk or other valuable article is presented to the Hide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the sixth grade, gifts are taken to the family of a chief when a death
    occurs; a remembered example is a horse with a bearskin offered in honor of the
    dead son of old Big Elk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the seventh grade, after an accidental or anger-related killing, chiefs
    take Sacred Tribal Pipes and gifts to the dead person's kindred; if the aggrieved
    party smokes the pipe and accepts the gifts, bloodshed is averted and peace is
    maintained.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the gifts of the seven grades are made to chiefs of
    the governing council in recognition of their authority and to enable the giver
    to secure entrance into the Ni'kagahi sha'be when a vacancy occurs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The first grade is described as different from the other six because it is
    connected with the ceremonial staff of the leader of the annual buffalo hunt rather
    than being a direct gift to chiefs, but it is still treated as recognition of
    authority.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Waba'hon is described as a generous deed outside the regular grades; it involves
    placing a deer, buffalo, or elk on its breast and putting bits of tobacco along
    its back to signify dedication of the animal as a gift to the chiefs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A chief can receive a waba'hon gift only if he has performed or can count
    four waba'hon acts; near kin may help him count, and if they do, the game is divided
    with them.
  category: relationship
  evidence_refs:
  - ev:9
