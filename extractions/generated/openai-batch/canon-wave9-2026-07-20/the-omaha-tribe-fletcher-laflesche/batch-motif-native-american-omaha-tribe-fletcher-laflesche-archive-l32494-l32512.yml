canonical_text:
  quote: ''
  summary: A society member may be asked by relatives to avert a foretold death by
    heating water while singing and casting the water beside, not directly before,
    the lodge entrance of the threatened person. This act is said to thwart the spirit's
    movement toward the spirit world and force it to return, allowing the person to
    live. Members may also be asked to stop rain by filling and smoking a small plain
    pipe, elevating the stem, singing, and sending smoke upward toward cosmic forces.
  language: English
  quote_policy: summarized
