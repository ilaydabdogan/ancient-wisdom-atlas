canonical_text:
  quote: ''
  summary: The passage describes an Omaha warfare-related ritual in which keepers
    of Sacred Packs sing, admonish men to tell the truth, invoke Thunder as Grandfather,
    and test a warrior’s claim to a war honor by dropping a red witness stick over
    a pack. If the stick rests on the pack, the claim is accepted as true by the birds
    in the pack and the claimant may wear the grade insignia; if it falls to the ground
    after dispute, the claim is rejected and the honor is lost.
  language: English
  quote_policy: summarized
