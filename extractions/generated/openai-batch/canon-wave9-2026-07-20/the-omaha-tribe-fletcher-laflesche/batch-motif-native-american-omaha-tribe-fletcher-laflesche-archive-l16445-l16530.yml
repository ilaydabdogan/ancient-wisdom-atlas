canonical_text:
  quote: ''
  summary: The passage describes the He'dewachi ceremony as a rite associated with
    tribal unity, maize cultivation, summer abundance, cosmic rhythms of night and
    day, the leadership of the Sacred Tribal Pipes, and a central symbolic tree or
    pole selected through a warrior-like ritual performance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage links the ceremony to dangers caused by hunting groups separating,
    rivalry among leaders, and the need for plans by which the people could move together
    without quarrels.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the He'dewachi may be older than the Sacred Pole and was
    associated with a time when people depended on maize rather than ideas centered
    on buffalo hunting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two Sacred Tribal Pipes are said to have led the people in a rhythmic
    advance by gentes toward the central symbolic tree or pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ceremony took place in summer, when plum and cherry trees were full of
    fruit and creatures were awake and out.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pole, described as the central object of the ceremony, was cut from cottonwood
    or willow, trees described as tenacious of life.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the ceremony grew up with corn and was under the charge of
    a subgens associated with a red ear of corn tabu and the distribution of sacred
    corn.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In later days the He'dewachi followed the Anointing of the Sacred Pole but
    remained distinct from it, except that permission was obtained from the Hon'ga
    gens as a courtesy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explicitly relates the He'dewachi to cosmic forces shown in the
    succession of night and day and the life and growth of living things.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man requesting the ceremony used the formula, “Let the people waken themselves
    by dancing,” and the request was accompanied by a gift.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hereditary keepers held a council at night and selected a man of their
    gens with many war honors to choose a tree for the ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Early the next morning the selected man chose a tall, straight cottonwood
    tree and returned like a victorious warrior.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The returning man used objects and gestures to portray booty, horses, or an
    enemy scalp, then thrust a stick into the ground and said, “I have found the enemy.”
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The hereditary keepers put on robes with the hair side outside and announced
    thanks and the timing of the ceremony to the tribe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A woman of the Inke'pabe gens with a tattooed mark of honor accompanied the
    keepers, wore her robe hair side out, and carried an ax and burden strap.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The warrior who had selected the tree gathered men of the gens while awaiting
    the return of the hereditary keepers.
  category: action
  evidence_refs:
  - ev:9
