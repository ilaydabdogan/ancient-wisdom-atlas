canonical_text:
  quote: ''
  summary: The passage describes Omaha earth-lodge construction, including roofing,
    sod covering, entrances, floor hardening with water and fire, couches, women’s
    sod work, and kin assistance. It then describes caches near dwellings for food,
    goods, regalia, and stored household articles during the summer buffalo hunt.
    It also describes village arrangement, gens affiliation and exogamy, seasonal
    absence, and the people who remained behind during the annual hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The earth lodge roof and walls were covered with willow, coarse grass, sod,
    and tamped earth, with a circular opening left for smoke.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entrance way projected from the door and had skin curtains at both the
    inner and outer doors.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lodge floor was prepared by removing loose earth, tamping, flooding with
    water, spreading dried grass, setting it on fire, and repeating wetting and heating
    until the floor was hard and level.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Couches were arranged around the wall between framework posts and served as
    seats by day and beds by night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women always cut and put on the sods for an earth lodge, and kindred helped
    one another because the sod work had to be completed rapidly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that earth lodges required considerable labor and were
    possessed only by industrious and thrifty people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A cache was generally built near each dwelling, usually to the left of the
    entrance, as a deep rounded hole with a narrow neck, lined with split posts and
    dried grass and protected with grass and sod.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Caches stored winter food, corn, jerked meat, pelts, regalia, and extra clothing,
    with some items kept in parfleche cases.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the people left the village for the summer buffalo hunt, cumbersome household
    articles were placed in caches and the openings were carefully concealed; gala
    clothing and regalia were taken along for tribal ceremonies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The village was not arranged around a central open space or in gens order,
    although gens order was observed during hunts and tribal ceremonies.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each family knew its gens, observed its rites, and obeyed exogamy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the annual buffalo hunt the village was never wholly deserted; the
    sick, infirm, and very poor remained, some able-bodied men stayed as guards, and
    sometimes young men remained near sweethearts who had to stay home.
  category: sequence
  evidence_refs:
  - ev:7
