  summary: The foreword describes the work as based on close access to Omaha ceremonies,
    customs, and memories of early nineteenth-century tribal life. It notes that the
    informants had been active participants in that life, which had since passed away,
    and acknowledges Edwin S. Tracy's help transcribing songs, especially those of
    the Shell society.
