  text: Women are described as rapid, precise, and deft in setting up a tent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a tent is pitched on a journey, its opening is generally arranged to
    face east, even in darkness.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a village or longer-term camp, a band of willow withes is bound around
