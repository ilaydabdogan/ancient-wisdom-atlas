canonical_text:
  quote: ''
  summary: The passage gives Omaha personal-name glosses and then describes the Tecinde
    gens, whose name refers to the buffalo tail. It reports that the gens's ancient
    rites are lost but were traditionally connected with the crow. In creation myths,
    human beings were first bodiless beings in the upper world or air, and the crow
    helped them obtain bodies so they could live on earth as men and women. The gens
    taboo forbade touching unborn animal young and later applied especially to buffalo
    young and a rib associated with the fetal head. A symbolic child's haircut left
    tufts for calf horns and a lock for the calf's tail. The passage also lists Tecinde
    and Ninibaton personal names with glosses involving buffalo, crow, moon, arrows,
    feathers, an old hero, and other referents.
  language: English
  quote_policy: summarized
