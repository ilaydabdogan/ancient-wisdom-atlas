canonical_text:
  quote: ''
  summary: A priest laments departed persons, solitude, and the stealthy loss of the
    Sacred Buffalo, a consecrated object formerly associated with communal unity.
    After smoking a pipe, he reflects on the people's abandonment of older customs
    and agrees to give the songs of the Sacred Pole to the listener. He feels ancestral
    spirits hovering near him, regains strength and memory, and sings the songs while
    the listener records them; the narration presents the performance as a remnant
    of fading religious rites.
  language: English
