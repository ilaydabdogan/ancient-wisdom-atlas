canonical_text:
  quote: ''
  summary: The passage explains Omaha terminology for settlements and gentes, how
    a person states gens identity, how animal terms such as buffalo or elk refer to
    ritual symbols rather than animal descent, the custodial duties of gentes in Ni'kie
    rites, and the organization of gentes into subgentes or subdivisions with patrilineal
    kinship and marriage prohibitions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha applied a settlement designation to towns and cities of white people,
    including St. Louis and Washington.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gens could be distinguished from the tribal village by adding uba'non to
    the term for village, understood as a group of kindred people in a place among
    whom marriage is prohibited.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The question asking a person's gens is literally framed as asking in which
    of the tribe's various villages the person has a place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the questioner is Omaha or Ponca, the reply may give the gens name directly,
    such as Tapa'.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the questioner is a stranger who does not know Omaha gens names, the reply
    may identify the person by a religious rite symbol, such as buffalo person or
    elk person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The animal-symbol reply is explicitly not said to mean that the person thinks
    of himself as that animal or is descended from it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The animal-symbol reply indicates membership in a group that has charge of
    rites in which that animal is used as a symbol.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: A gens in charge of a Ni'kie rite has the duty to care for the rite's symbols
    and paraphernalia and to act as priests for the rite.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Participation in the ceremony is not confined to the officiating gens; the
    people of the tribe have a voice in it and share in its benefits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ni'kie is glossed as a declaration by the people or their chiefs of consent
    to a certain proposition.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some distinctive gens names also occur in close cognate tribes, and the passage
    says these duplicated names may come from a parent organization whose remnants
    retained old rites and names.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: An Omaha gens is described as a composite group made of subgentes or subdivisions
    called little villages or split-off parts that still keep with the main body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each subgens has its own name, Ni'kie-class rite, set of personal names, tabu,
    and place in ceremonial camp order.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: A subdivision differs from a subgens by lacking a distinctive rite, though
    it may have a particular office in the gens rite, a tabu referring to that office,
    and a set of personal names.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The common bond between subgentes of a gens is kinship traced solely through
    the father, and marriage between members of subgentes or subdivisions of a gens
    is forbidden.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: A person first gives the name of the gens rather than the subgens; the gens
    is paramount to its subdivisions, and the tribe embraces all gentes as one body.
  category: sequence
  evidence_refs:
  - ev:7
