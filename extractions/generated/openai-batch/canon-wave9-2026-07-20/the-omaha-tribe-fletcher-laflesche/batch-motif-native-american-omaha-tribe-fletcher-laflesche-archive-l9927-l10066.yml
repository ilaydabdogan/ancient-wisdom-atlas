canonical_text:
  quote: ''
  summary: 'The passage describes Omaha subgens offices, tabus, ceremonial associations,
    and a hi''gon story connected with the Wathi''gizhe hoop game: during famine,
    an orphan boy and his grandmother use a hoop that becomes buffalo, feeding the
    people and resulting in the orphan being made a chief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The I'ekithe subdivision is glossed as “he who speaks or proclaims,” and the
    hereditary office of tribal herald belonged to it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The herald needed a strong, clear voice and proclaimed the chiefs’ decisions
    and orders, especially when the tribe was on its annual hunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the official herald was incapacitated, the substitute had to be chosen
    from the same subdivision; the subdivision’s tabu was the red ear of corn.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Wathi'gizhe subgens name was also the name of a hoop used in a ceremonial
    game formerly played by chiefs alone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The story connected with the hoop game is identified as hi'gon, meaning that
    the story is not literally true.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the story, the people lacked food and game, and an orphan boy living outside
    the village with his grandmother planned with her to help the people obtain food.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy made a hoop and gave it to his grandmother, who took it to the top
    of a nearby hill while the boy stood halfway up the hill.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: When the grandmother rolled the hoop downhill and called out that a buffalo
    was coming, the hoop became a buffalo at the boy’s station.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy shot and killed the buffalo, butchered it, and gave its flesh to the
    people to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The grandmother and orphan repeated the action four times; afterward great
    buffalo herds came and the people had plenty of food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people made the orphan a chief as a mark of gratitude.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The office of wathon, director of the herd surround, was hereditary in a family
    of the Wathi'gizhe subgens.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Custody of songs and singers for the He'dewachi ceremony came from the Wathi'gizhe
    subgens, while Sacred Tribal Pipe bearers for that occasion came from the Xini'bato
    or Nini'baton subgens as named in the passage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Wathi'gizhe tabu was the tongue and head of the buffalo.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Wathi'gizhe child’s hair was cut with tufts representing the buffalo’s
    head, horns, and tail.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states camp positions in the Jiu'thuga for Nini'baton, We'zhinshte,
    Nonxthe'bitube, Wathi'gizhe, I'ekithe, and Honga groups.
  category: setting
  evidence_refs:
  - ev:8
