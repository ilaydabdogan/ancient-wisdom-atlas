canonical_text:
  quote: ''
  summary: The passage lists Omaha names, then describes the Inshtaçunda division
    and the Mon'thin-kagaxe gens, whose name is glossed as related to earth-making.
    It reports that lost rites of this gens were connected with rock or stone and
    the gray wolf. In myths, rock or stone is said to symbolize permanence, long life,
    and wisdom acquired by age, while the wolf symbolizes human restlessness, questioning
    of fate, and destructiveness. Rock or stone and gray wolf are represented as brothers
    and were ritually united in a now-unknown way. The passage also reports four sacred
    stones painted white, black, red, and green or blue, placed in a circular hole
    and covered with swan down; one surviving stone was kept by Ton'wongaxe and was
    said to be made to walk at Pebble society meetings.
  language: English
  quote_policy: summarized
