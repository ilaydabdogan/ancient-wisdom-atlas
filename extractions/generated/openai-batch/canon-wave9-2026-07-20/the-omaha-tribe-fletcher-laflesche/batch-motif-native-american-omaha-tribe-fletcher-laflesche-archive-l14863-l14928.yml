literal_observations:
- id: obs:1
  text: The legend of the Sacred Pole is said to have been known only to a chief of
    the Hon'ga, and fear of the Pole made obtaining the information difficult.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In September 1888, Shu'denaci came to Joseph La Flesche's house to tell the
    legend treasured with the Sacred Pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The former principal chief said he would accept any penalty that followed
    the revealing of the sacred traditions, an act described as formerly profanation
    punishable by the supernatural.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: While speaking, the old chief tapped the floor with a small stick in a rhythm
    compared to drumming used when invoking unseen powers during rites.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Joseph La Flesche was said to have been struck by fatal disease near the close
