  quote: ''
  summary: The passage recounts the difficulty of obtaining the Sacred Pole legend
    because of fear and taboo, describes Shu'denaci's three-day telling of the legend
    at Joseph La Flesche's house, notes the former principal chief's willingness to
    accept any penalty for revealing sacred traditions, and describes the cottonwood
    Sacred Pole, its attached zhi'be or leg, and the support staff that held it inclined.
  language: English
