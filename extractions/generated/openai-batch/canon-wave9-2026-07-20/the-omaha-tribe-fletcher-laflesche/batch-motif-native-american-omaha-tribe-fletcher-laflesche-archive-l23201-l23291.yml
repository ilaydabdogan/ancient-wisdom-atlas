canonical_text:
  quote: ''
  summary: The passage describes Omaha care of infants, soothing practices, beliefs
    about people who understand baby sounds, twin births, divination of an unborn
    child’s sex, meanings assigned to a teething child’s gestures, the term for an
    orphan, the Turning the Child ceremony and a boy’s hair consecration to Thunder,
    and subsequent training in etiquette, language, obedience, and gendered conduct
    for girls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother used part of her garment, tied with a girdle, to hold a clinging
    child in a bag-like resting place while she worked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writers state that Omaha babies did cry, and that efforts were made to
    soothe a crying child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women made a low murmuring sound, compared to wind in pines, to help
    a child sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief that certain people understood the different
    sounds made by a baby and could be called when a baby cried persistently.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: One explanation sometimes given for persistent infant crying was that the
    baby did not like its name, after which the name would be changed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one case, an interpreter of baby sounds identified a buffalo calf skin
    placed beside a baby as the cause of crying because its fur tickled the child;
    turning the skin pacified the baby.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The birth of twins was considered a sign that the mother was kind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A saying describes twins walking hand in hand around the Tiu'thuga looking
    for a kind woman to become their mother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A pregnant woman could offer a bow and a burden strap to a friend’s pre-verbal
    child; choosing the bow indicated a boy, and choosing the burden strap indicated
    a girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A teething child who looked at a person while grinding its teeth, stretching
    out its arms, and clenching its hands was understood to mean a break in friendship
    with that person.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A child who had lost one or both parents was called wahon'thinge, translated
    as “no mother” or “orphan.”
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: After a child could walk steadily, it passed through a ceremony called Turning
    the Child.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A boy underwent an additional cutting of a lock of hair in consecration of
    his life to Thunder and to the tribe’s protection as a warrior.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After these ceremonies, home training began, and the child’s name marked ni'kie
    rites and gentile relationship.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Children were trained to respect elders, use proper relationship terms, be
    peaceable, obey parents, speak grammatically, pronounce words properly, and practice
    politeness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Little girls were trained in specific ways of sitting and rising, silent movement
    in and out of the lodge, neat hair and garments, and early care of younger children.
  category: action
  evidence_refs:
  - ev:10
