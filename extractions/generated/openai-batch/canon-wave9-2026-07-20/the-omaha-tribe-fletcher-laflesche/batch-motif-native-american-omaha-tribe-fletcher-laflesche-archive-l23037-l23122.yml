canonical_text:
  quote: War means the destruction of life, marriage its perpetuation.
  summary: The passage describes Omaha marriage customs, including recognition and
    consent, cohabitation as marriage, exogamy, prohibitions involving war, family
    authority, maternal-uncle guardianship, arranged marriage with gifts and escort,
    and polygamy as a household-labor arrangement among some prominent men.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Formal recognition of the girl as the son's wife by the young man's father
    completed the described ceremony, but denial of parental consent did not invalidate
    the marriage or the children's rights through their father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cohabitation constituted marriage if the woman was not already another man's
    wife; a relation with another man's wife was a punishable social offense.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Husband and wife were required to belong to different gentes and not be close
    blood relations through their mothers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: It was counted an honor for a man to marry a woman bearing the tattooed “mark
    of honor.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Marriage with a man on, or about to go on, the warpath was not permitted and
    was said to risk disaster because war destroys life while marriage perpetuates
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A hunter’s failure to kill game could be explained by saying that his wife
    might be giving birth to a child.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father held the highest authority in the family, while the mother exercised
    nearly equal authority in most matters concerning the children’s welfare.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: If both parents died and the father had no brothers, the mother’s brother
    had full control of the children and was regarded as defender and helper.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Arranged marriages by a girl’s parents were often with a mature man of established
    position who made large presents to the girl’s parents and relatives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the arranged-marriage scene, the girl was well dressed, mounted on a pony,
    accompanied by four old men, and taken to the husband’s lodge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Young men derided this kind of arranged marriage by saying that an old man
    could win the girl’s parents but not the girl.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Polygamy existed but was not the rule; a man rarely had more than two wives,
    and the wives were generally sisters or aunt and niece.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Polygamy was more common among prominent men, whose public duty of entertaining
