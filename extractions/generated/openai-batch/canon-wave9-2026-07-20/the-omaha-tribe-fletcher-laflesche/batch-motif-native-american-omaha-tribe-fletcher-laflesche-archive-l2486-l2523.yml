canonical_text:
  quote: ''
  summary: A leader directs a servant to obtain a specific smooth-barked ash sapling.
    In a council setting, several eagles successively drop downy feathers in the cleared
    center; the white, bald, and spotted eagles are rejected, while the fantail or
    imperial eagle is accepted. Its feathers, together with other bird, animal, plant,
    and material articles, are used in making peace pipes intended to establish friendly
    relations with other tribes. A note lists the nine articles and recommends comparison
    with Omaha accounts of the Wa'wa pipes.
  language: English
  quote_policy: summarized
