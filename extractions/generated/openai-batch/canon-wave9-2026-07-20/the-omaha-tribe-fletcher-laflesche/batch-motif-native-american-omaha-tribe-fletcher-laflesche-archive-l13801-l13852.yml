canonical_text:
  quote: '"holding the people together"'
  summary: The passage reports Omaha accounts of how a central governing council and
    Nini'bato subdivisions were established. Wise old men planned the council for
    peace and cohesion; two respected old men carried two Sacred Tribal Pipes around
    the tribal circle to designate families. The pipes functioned as credentials and
    as sacred media connected with prayer, oath, responsibility, and obligations to
    Wakon'da and the tribal community.
