  summary: The passage describes the Omaha robe or blanket as a flexible garment used
    expressively and practically. It gives examples of a young girl shifting a white
    blanket with her moods, an adult woman belting a blanket to make a covering and
    pouch for a baby or burden, and men arranging the robe in ways associated with
    hesitation, walking, running, hunting, and racing.
