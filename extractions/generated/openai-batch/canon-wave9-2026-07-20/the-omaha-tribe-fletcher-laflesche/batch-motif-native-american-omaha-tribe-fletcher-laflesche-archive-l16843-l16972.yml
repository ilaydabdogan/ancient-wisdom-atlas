  quote: ''
  summary: The passage explains songs and actions in the He'dewachi dance around a
    sacred pole or tree, including gifts, concentric-circle dancing, branches carried
    and returned to the tree, the role of Thunder, and the ceremony's stated teaching
    of tribal unity. It then introduces the Ritual of the Maize, describing sacred
    corn, its relation to the Sacred Tribal Pipes, songs honoring maize growth, annual
    distribution at planting, and marking planting land with poles.
