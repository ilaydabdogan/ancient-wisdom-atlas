canonical_text:
  quote: ''
  summary: The passage describes songs and rites during the anointing of the Sacred
    Pole. Paint is made to adhere, the Pole is reddened and made beautiful, and the
    people watch. After the anointing, a woman officiates. The Pole is interpreted
    as representative of man as family protector and provider. A ground figure called
    uzhin'eti functions as a prayer symbol for good gifts from Wakon'da. At its center
    a buffalo chip is kindled, sweet grass and cedar are burned, and seven arrows
    are passed through the smoke. The arrows represent the Seven Chiefs, peaceful
    unity, and the means by which man secured Wakon'da's buffalo gift. The woman represents
    the mother of the race and prays for continuance and prosperity.
  language: English with Omaha terms
  quote_policy: summarized
