  quote: ''
  summary: 'The passage describes Hethu''shka dance dress and regalia: members wore
    breechcloths, grass bunches formerly associated with scalps, painted and decorated
    themselves according to war-honor grades, and sometimes wore bells. It notes that
    Dakota tribes and the Winnebago later knew the dance as the Grass dance or Omaha
    dance, and that the leader needed sufficient rank to wear the Crow decoration.'
