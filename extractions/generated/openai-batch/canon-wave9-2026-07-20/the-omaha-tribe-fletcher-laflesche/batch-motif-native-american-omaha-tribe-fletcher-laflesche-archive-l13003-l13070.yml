canonical_text:
  quote: ''
  summary: The passage reports an interrupted transmission of a sacred pipe charge
    and ritual, describes a crop-preservation ceremony in which an insect wing fragment
    is placed in feast food as a dramatic prayer against pests, and records an insect-related
    tabu and symbolic haircut for the gens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man withheld a sacred charge from his son because he judged the son
    not yet temperamentally suited; the old man died before transferring it, and the
    Sacred Tribal Pipes have not since been ceremonially filled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The exact nature of the ritual could not be learned; the passage says it appeared
    to concern the history and ceremonies of the Sacred Pipes, and old chiefs regarded
    it as too sacred to discuss.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nini'baton subdivision is described as having only one surviving person.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When corn was threatened by grasshoppers or other destructive insects, the
    field owner applied to the Inshta'cunda gens for help, and a feast was prepared
    for persons with hereditary rights to make the ceremonial appeal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A young man was sent to the threatened cornfield to catch a grasshopper or
    beetle and bring it back.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The leader removed a wing from the captured insect, broke a piece from the
    tip, and dropped that piece into the food vessel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage explicitly describes the whole ceremony as a dramatic form of
    prayer and says the feast symbolized an appeal for abundant food.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage explains the broken wing fragment as expressing a wish that destructive
    insects would lose activity and stop destroying corn; it also states a belief
    in a living connection between a part and its whole.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage corrects other reports by stating that only a bit of the insect
    wing was put into the ceremonial feast food, with no other creature or insect
    part used.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The hu''thuga placement is described: the lost gens was left of the Ingthe''zhide,
    followed by the Nini''baton subdivision and then the Washe''ton subgens.'
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The entire gens was forbidden to touch creeping insects, bugs, worms, and
    similar creatures.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The symbolic haircut removed hair from the crown and left small locks around
    the skull base, said to represent the many legs of insects.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote states that lightning is said to feed on gum weed and leave a worm
    at the root.
  category: other
  evidence_refs:
  - ev:10
