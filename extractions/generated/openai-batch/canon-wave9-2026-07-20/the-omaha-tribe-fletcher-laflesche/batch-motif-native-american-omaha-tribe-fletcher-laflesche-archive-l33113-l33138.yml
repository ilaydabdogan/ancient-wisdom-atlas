canonical_text:
  quote: Wapkathin Jio!
  summary: A candidate selects two brave men as heralds to summon chiefs entitled
    to attend the Feast of the Hon'hewachi. The heralds wear buffalo robes, blacken
    their faces, place eagle down on their heads, circle the camp to give an official
    call, return to the candidate's lodge, and repeat the call at the tent door. The
    leader orders ritual instruments and food to be prepared. The right to beat the
    drum belongs to the man able to count the highest war honors. A note compares
    a food-and-drop-pouring gesture with a Ponca Feast of Soldiers ceremony.
  language: English
  quote_policy: quoted
