canonical_text:
  quote: ''
  summary: 'The passage describes Omaha child care: children are desired and loved;
    babies are cared for chiefly by the mother with help from family members, fathers,
    and grandfathers; infants are placed on a cradle-board with soft bedding and bindings;
    the cradle-board is used for sleeping, carrying, hanging in shade, or attaching
    to a saddle; older babies cling to the mother over her shoulder.'
