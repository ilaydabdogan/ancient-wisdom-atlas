canonical_text:
  quote: ''
  summary: The passage closes discussion of the Pebble and Shell societies, describing
    a ritual song about shooting and killing as proof of magic, noting an archaic
    word shared with Winnebago, and comparing the Pebble and Shell societies as shamanistic
    societies emphasizing magic. It then begins a section on Omaha views of disease
    and treatment, describing disease as mysterious, sometimes attributed to magic,
    treated with herbs, roots, formulas, prayer to Wakon'da, invocations to plant
    power, purchased ritual knowledge, specialized healers, bleeding, massage, restrictions
    around wounds, and healing ceremonies with songs and a small drum.
