canonical_text:
  quote: ''
  summary: The passage describes the Omaha We'bashna ceremony, a hair-cutting rite
    in which a priest cuts a lock from a boy's crown, stores it in a sacred parfleche
    case, and sings a ritual song. The rite consecrates the boy's life to Thunder,
    described as a war power controlling the warrior's life and death. The passage
    also explains the ritual responsibilities of the Washe'to subgens and We'zhinshte
    gens, the guarded entrance of the tribal circle, the ceremony's placement west
    of the fire facing east, and the ritual song addressing Thunder as Grandfather
    dwelling far above.
  language: English, with Omaha ritual-language transcription
  quote_policy: summarized
