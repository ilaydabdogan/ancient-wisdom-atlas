canonical_text:
  quote: belief in the continuity of life and of human relationships
  summary: The passage describes an Omaha funeral song ceremony in which a near relative
    thanks the singers, removes willow twigs from their arms, and throws the twigs
    down. It explains the rite as expressing continuity of life and relationships.
    It then describes a bereaved father carrying a dead child’s moccasins on the warpath
    and placing them beside a slain enemy so that the dead man would recognize and
    befriend the child on its way to relatives in the other world. The passage ends
    by noting that Omaha religious and ethical teachings were embedded in rites and
    explained by thoughtful elders.
  language: English
  quote_policy: quoted
