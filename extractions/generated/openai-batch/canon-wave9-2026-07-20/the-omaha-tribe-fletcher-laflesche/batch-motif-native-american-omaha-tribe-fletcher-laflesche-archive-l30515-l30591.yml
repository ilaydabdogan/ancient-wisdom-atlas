canonical_text:
  quote: ''
  summary: The passage describes the Hethu'shka as an Omaha-origin warrior society
    and dance that spread to other tribes, while only the Omaha retained the religious
    opening observances. It outlines membership requirements, officers, meeting preparation,
    sacred pipes, fire service, feast duties, black paint preparation, graded seating
    in the lodge, and the arrangement of drum and singers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hethu'shka spread beyond the Omaha, including to the Pawnee and other
    tribes, whose songs followed the model of the original Omaha songs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only the tribe in which the Hethu'shka originated observed the religious rites
    and songs of the opening ceremonies; outsiders used the dramatic dance, songs,
    and closing feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Omaha Hethu'shka membership was restricted to warriors who had received public
    war honors before the Packs Sacred to War, and admission required invitation and
    absence of objection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The officers were hereditary keepers of the Hethu'shka sacred pipes, a leader,
    and a herald; a leader was accepted after inviting members to a feast and receiving
    no objection.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The herald had to be a reputable warrior with a strong, clear voice, and the
    leader appointed young men as servants to attend the fire and assist in ceremonies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Meetings were held irregularly, usually about monthly, in the dwelling of
    a respected member, with a volunteer host providing food, tobacco, and prepared
    black paint.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The host could supply tobacco for the pipes but could not fill or prepare
    the pipes for smoking, because this was reserved to the hereditary Kon'ce keeper.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Members sat in an appointed circle within the lodge, graded by public war
    honors, with the leader at the back opposite the door and lower grades placed
    progressively toward the door.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The drum was placed at the left of the leader's seat, male singers gathered
    around it, women singers sat behind them, and the choir led the singing.
  category: setting
  evidence_refs:
  - ev:8
