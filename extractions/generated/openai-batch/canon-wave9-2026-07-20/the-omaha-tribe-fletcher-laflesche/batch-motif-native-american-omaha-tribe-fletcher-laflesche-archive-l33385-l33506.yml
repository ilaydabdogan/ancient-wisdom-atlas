canonical_text:
  quote: Night moves, it passes, and the day is coming.
  summary: The passage gives tattooing songs and explanations for Omaha ritual tattoo
    symbols of night and day. It interprets a star design as night and a mother force
    with four points linked to life-giving winds. A second song is explained as referring
    to the serpent as representative of teeming moving life over the earth. The passage
    also notes crescent moon and turtle tattoos, the girl's expected silence during
    tattooing, omens from healing, individual songs by society members, a Ponca comparison
    in song order, food distribution, and the conclusion of the tattooing.
  language: English
  quote_policy: quoted
