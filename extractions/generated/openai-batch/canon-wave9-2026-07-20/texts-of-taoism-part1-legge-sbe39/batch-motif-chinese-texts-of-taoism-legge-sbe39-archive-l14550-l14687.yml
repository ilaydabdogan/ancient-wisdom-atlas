canonical_text:
  quote: ''
  summary: The passage criticizes rulers and schools who disturb the human mind through
    benevolence, righteousness, laws, knowledge, and punishment, resulting in social
    decay and disorder. It then begins an episode in which Hwang-Ti, after nineteen
    years on the throne, visits Kwang Khang-3ze on the summit of Khung-thung to ask
    about the perfect Tao, agriculture, and the ordering of Yin and Yang.
  language: English
  quote_policy: summarized
