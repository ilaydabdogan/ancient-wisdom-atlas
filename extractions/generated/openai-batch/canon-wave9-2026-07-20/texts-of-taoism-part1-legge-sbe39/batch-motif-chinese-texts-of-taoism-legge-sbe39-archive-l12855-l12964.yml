canonical_text:
  quote: ''
  summary: The passage presents Mang-sun's outward mourning and inward lack of loss,
    compares death to leaving a dwelling at dawn, uses dream images of being a bird
    or fish to question waking certainty, describes unity with mysterious Heaven,
    recounts a dialogue in which Hsii Yu criticizes Yao's moral instruction as disfigurement,
    and introduces Yen Hui's claim of progress through ceasing to think of benevolence
    and righteousness.
  language: English
  quote_policy: summarized
