  quote: Who can (make) the muddy water (clear) ? Let it be still, and it will gradually
    become clear
  summary: The passage first rejects proposed identifications of Laozi's teaching
    with the Hebrew tetragrammaton or a Western source, saying Laozi has in view the
    mysterious Tao rather than a personal Being. It then describes ancient masters
    of the Tao as subtle, hidden, cautious, grave, evanescent, unpretentious, vacant,
    and muddy. It adds that muddy water clears by stillness, rest arises through ongoing
    movement, and those preserving the Tao do not seek to be full of themselves.
