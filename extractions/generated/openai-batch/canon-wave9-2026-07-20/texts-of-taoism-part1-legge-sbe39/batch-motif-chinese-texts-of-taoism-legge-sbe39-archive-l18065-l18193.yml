canonical_text:
  quote: A frog in a well cannot be talked with about the sea
  summary: Zo of the Northern Sea instructs the earl of the Ho through analogies of
    limited perspective, the measureless sea, cosmic scale, and the relativity of
    great and small. Human fame, knowledge, success, failure, life, and death are
    placed within a wider order that exceeds fixed measures.
  language: English
  quote_policy: quoted
literal_observations:
