  text: A speaker says he had heard people making little of Kung-ni's knowledge and
    Po-i's righteousness, had not believed them, but now fears he would have remained
    ignorant if he had not come to the gate of the vast realms he beholds.
  category: speech
  evidence_refs:
  - ev:1
