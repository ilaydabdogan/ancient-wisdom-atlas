canonical_text:
  quote: ''
  summary: The passage contrasts an ancient age of perfect virtue, simple practices,
    and self-contained communities with a later condition in which admiration for
    conspicuous qualities, pursuit of wise men, technical devices, sophistry, and
    garrulous speech produce disorder. It argues that natural faculties and non-action
    preserve order, while fondness for knowledge disturbs people, animals, and the
    world.
  language: English
  quote_policy: summarized
