canonical_text:
  quote: All my life I had been seeking for it, and now I have obtained it.
  summary: Yin Kiang thanks Heaven for revealing the knowledge and mystery of its
    operation, bows, and departs. The passage then criticizes ordinary people who
    seek distinction and rulers who employ profitable methods without seeing their
    dangers. It describes a great man or sole possessor who is not treated as a thing,
    moves freely through the universe and nine regions, and teaches responsively like
    shadow, echo, and sunlike movement.
  language: English
  quote_policy: quoted
