canonical_text:
  quote: ''
  summary: The passage argues that measures, weights, tallies, seals, and even benevolence
    and righteousness teach people to steal. It contrasts a person executed for stealing
    a hook with one who steals a state and becomes a prince. It says sages and their
    teachings are agencies of worldly profit that should be hidden, like fish kept
    in deep waters. The passage then proposes abolishing or destroying artificial
    standards, valuables, instruments, ornaments, colors, and technical tools so that
    people recover simplicity and natural faculties of hearing, seeing, and skill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Making pecks, bushels, weights, steelyards, tallies, seals, benevolence, and
    righteousness is said to teach people to steal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who steals a hook is put to death, while another who steals a state
    becomes its prince.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says benevolence and righteousness are most strongly professed
    at the gates of princes and asks whether this is stealing benevolence, righteousness,
    sageness, and wisdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Great robbers are described as carrying off princedoms and gaining from measures,
    weights, tallies, and seals; rewards and the threat of the axe are said not to
    restrain them.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that giving such gain to robbers and making them impossible
    to restrain is an error committed by sages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A saying states that fish should not be taken from deep waters and that the
    agencies for the profit of a state should not be shown to men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage identifies sages and their teachings as agencies for the profit
    of the world that should not be exhibited to it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Putting an end to sageness and wisdom is said to stop great robbers; putting
    away jade and breaking pearls is said to stop small thieves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Burning tallies and breaking seals is said to make the people simple and unsophisticated;
    destroying pecks and snapping steelyards is said to end wrangling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Confusing the six musical accords, burning organs and lutes, and stopping
    the ears of the musician blind Khwang is said to restore natural hearing to all
    men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Abolishing ornaments, disusing the five colors, and gluing up the eyes of
    Li Aa is said to restore natural vision to all men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Destroying the hook and line, throwing away the compass and square, and smashing
    the fingers of the artful K/ui is said to restore natural skill to all men.
  category: sequence
  evidence_refs:
  - ev:8
