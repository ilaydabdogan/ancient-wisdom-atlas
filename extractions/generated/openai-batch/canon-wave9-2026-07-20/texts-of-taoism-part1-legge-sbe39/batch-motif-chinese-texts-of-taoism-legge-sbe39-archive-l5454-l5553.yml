canonical_text:
  quote: ''
  summary: The passage first describes a person in whom there is “no place of death,”
    so that rhinoceros, tiger, and weapon find no point of entry. The commentary frames
    this as the Tao functioning as an antidote to decay and death. Chapter 51 then
    describes the Tao as producing and nourishing all things, receiving spontaneous
    honor, and acting without possession, boasting, or control. The opening of chapter
    52 calls the Tao that originated all under the sky the mother of them all.
  language: English
  quote_policy: summarized
