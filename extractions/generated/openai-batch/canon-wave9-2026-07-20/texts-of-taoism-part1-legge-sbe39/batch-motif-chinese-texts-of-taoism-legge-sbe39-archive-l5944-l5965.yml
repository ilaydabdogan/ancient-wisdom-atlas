  summary: A note says the chapter title, rendered “Transformation according to Circumstances,”
    does not clarify the chapter and that the chapter should be read as a sequel contrasting
    government by the Tao with government by correction. The chapter then states that
    moderation is best for regulating the human constitution and serving the heavenly,
    and that moderation brings an early return to the normal state, described as repeated
    accumulation of the attributes of the Tao.
