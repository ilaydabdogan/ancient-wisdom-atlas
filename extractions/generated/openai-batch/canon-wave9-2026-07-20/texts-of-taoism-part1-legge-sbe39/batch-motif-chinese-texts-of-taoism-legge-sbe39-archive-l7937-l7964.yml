  summary: A brief notice explains the title Thien Tao as “The Way of Heaven,” characterizes
    it as the silent spontaneity of nature, and connects it with perfected government,
    teaching, non-action, and the Tao. The notice also discusses a distinction between
    ruling powers and subordinates, comments on critics who found some portions unlike
    Kwang-3ze, and notes Taoism’s antagonism to Confucianism.
