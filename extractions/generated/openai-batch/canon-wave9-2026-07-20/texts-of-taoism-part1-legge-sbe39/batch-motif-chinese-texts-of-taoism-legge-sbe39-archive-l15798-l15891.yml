canonical_text:
  quote: the waters which flow into it can never fill it, nor those which flow from
    it exhaust it
  summary: Aun Mang says he is going to the ocean and describes its inexhaustible
    nature. Yiian Fung asks him to explain sagely government, the government of kindly
    virtuous men, and the state of spirit-like men. The replies describe rule according
    to natural fitness and ability, benevolent provision that leaves people satisfied
    and rested, and spirit-like men who ascend on light, lose bodily limitations,
    and return things to their proper nature in chaotic obscurity. A new, incomplete
    episode begins with Man Wu-kwei and Khih-Zang Man-k/i looking at the army of king
    Wa.
  language: English
  quote_policy: quoted
