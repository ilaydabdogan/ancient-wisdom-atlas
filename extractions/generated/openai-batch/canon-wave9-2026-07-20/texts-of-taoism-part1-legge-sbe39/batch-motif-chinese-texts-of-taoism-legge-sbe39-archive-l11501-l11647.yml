canonical_text:
  quote: ''
  summary: The passage discusses persons who have lost their feet yet are presented
    as centered on inner nature rather than bodily condition or social rank. It uses
    images of still water, mirrors, evergreen trees, a brave soldier, ascent, an archer,
    and a teacher's instruction to describe self-possession, correction, and acceptance
    of what is appointed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening refers to a man treating the loss of his feet as only the loss
    of so much earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khang Ki says the man is occupied with his proper self, has discovered the
    nature of his mind, holds to it as unchangeable, and asks why men make so much
    of him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The reply contrasts running water and still water, saying people do not use
    running water as a mirror but still water, which can arrest them in contemplation
    of their real selves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reply presents pine and cypress as green in both winter and summer, and
    Yao and Shun as correct examples among those influenced by Heaven.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The reply says the preserved original endowment can be verified by the fearlessness
    of a brave soldier whose heroic spirit affects a very great army.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The reply describes an ideal person whose rule is over heaven and earth, who
    holds all things in his treasury, treats his body as lodging, uses ears and eyes
    as conveyers of images, unifies knowledge, and has a mind that never dies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The reply says that if such a person chose a day to ascend far on high, men
    would try to follow him there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shan-thu Ai is introduced as another man who had lost his feet and who studied
    with Tze-chan of Kang under the master Po-hwan Wu-zin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tze-chan asks Shan-thu Ai to remain behind if he goes out first, and challenges
    him for not yielding to a person of official rank.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Shan-thu Ai replies by questioning whether official rank is recognized in
    the master's school and says Tze-chan takes pleasure in official rank and precedence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shan-thu Ai says that when a mirror is bright dust does not rest on it, and
    that long dwelling with a man of ability and virtue makes one without error.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tze-chan calls Shan-thu Ai a shattered object and says he still strives to
    make himself out as good as Yao.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Shan-thu Ai says the virtuous know such a calamity was unavoidable and rest
    in it as appointed; he illustrates this with people standing in the field of an
    archer's bent bow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Shan-thu Ai says people with feet laugh at him and make him angry, but when
    he goes to the teacher the feeling is removed by instruction in what is good.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Shan-thu Ai says he has attended the teacher for nineteen years and has not
    known that he is without feet.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Shan-thu Ai says his and Tze-chan's object of study is internal virtue, not
    an adjunct of the body, and Tze-chan then becomes uneasy, changes his manner and
    looks, and asks him to say no more.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
