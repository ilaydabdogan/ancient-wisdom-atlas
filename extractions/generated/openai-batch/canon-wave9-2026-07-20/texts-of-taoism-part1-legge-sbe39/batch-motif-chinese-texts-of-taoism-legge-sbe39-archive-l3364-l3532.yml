  quote: ''
  summary: The passage includes Legge's notes on grass-dogs, bellows, breath, and
    chapters 6-10 of the Tao Teh King. It presents the undying valley spirit and female
    mystery as root of heaven and earth; heaven, earth, and the sage as enduring through
    selflessness; water as an image of non-striving excellence; warnings against fullness,
    wealth, and arrogance; breath discipline and infant-like pliancy; and the Tao
    as producing and nourishing without claiming, boasting, or controlling.
