canonical_text:
  quote: ''
  summary: 'A brief notice summarizes parts of a Taoist book: images of secure freedom
    under rule; lessons by named teachers; Lao-3ze lecturing on nonentity; a wizard
    or physiognomist defeated by Ht-3ze, affecting Lieh-3ze; a homily on non-action
    using a mirror simile; and an allegory in which gods of the southern and northern
    seas bore holes into Chaos and thereby destroy primal simplicity.'
  language: English
  quote_policy: summarized
