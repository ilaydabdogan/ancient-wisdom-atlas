  quote: ''
  summary: The passage gives editorial and interpretive notices for Taoist books.
    It summarizes earlier paragraphs in which inquiries about governing the world
    or governing men are redirected toward governing oneself and nourishing the heart.
    It then introduces the book named “Heaven and Earth,” explaining these as Great
    Powers whose silent, spontaneous influence provides a model for government, and
    cites Lai Sht-Z#ih on rulers acting according to Heaven’s spontaneity while rejecting
    coercive methods.
