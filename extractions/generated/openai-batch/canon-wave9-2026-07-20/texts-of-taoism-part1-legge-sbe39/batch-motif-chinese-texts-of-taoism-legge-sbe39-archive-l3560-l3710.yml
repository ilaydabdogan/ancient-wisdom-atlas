  quote: ''
  summary: The passage presents teachings on the usefulness of emptiness, restraint
    of sensory desire, the fear attached to favour and disgrace, bodily vulnerability
    to calamity, self-regard as a qualification for governing, and the Tao as imperceptible,
    formless, ancient, and usable as a guide for present things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The usefulness of a wheel, clay vessel, and apartment is said to depend on
    empty or hollow space rather than only on their material construction.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary states that the three illustrations set forth the Tao's freedom
    from preoccupation and purpose, and the use of what seems useless.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that five hues, five notes, five flavours, chariot racing,
    hunting, and rare objects can impair the senses, disturb the mind, or change conduct
    for the worse.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sage is said to satisfy the belly rather than the eyes, putting away the
    latter and preferring the former.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Favour and disgrace are described as similarly fearful because gaining favour
    brings anxiety about losing it and losing it brings fear of worse calamity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Great calamity is linked to having a body; without the body, the passage asks
    what calamity could come to the self.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: One who would administer the kingdom while honouring or loving it as his own
    person may be employed or entrusted with rule.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Tao is presented as looked at but unseen, listened to but unheard, and
    grasped at but not held; these qualities are blended and called The One.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Tao is described as neither bright above nor obscure below, ceaseless,
    unnamed, returning to nothing, and called the Form of the Formless and Semblance
    of the Invisible.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Meeting or following the Tao does not reveal a front or back, but laying hold
    of the Tao of old can direct present things and is called the clue of Tao.
  category: sequence
  evidence_refs:
  - ev:9
