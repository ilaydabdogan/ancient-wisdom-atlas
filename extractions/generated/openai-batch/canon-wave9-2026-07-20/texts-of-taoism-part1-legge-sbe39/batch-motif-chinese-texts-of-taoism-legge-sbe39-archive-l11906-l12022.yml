canonical_text:
  quote: ''
  summary: The passage describes a sagely man who lacks ordinary contrivances, passions,
    desires, and social approvals or disapprovals, because his Heavenly nature is
    nourished by Heaven. Hui-zi questions whether such a passionless being can still
    be called a man, and Kwang-zi answers that the Tao gives personal appearance and
    Heaven gives bodily form. Kwang-zi clarifies that being without passions means
    not inwardly harming the body through likings and dislikings, pursuing one’s course
    without effort, and not trying to increase life. He rebukes Hui-zi for externalizing
    his spirit, toiling his vital powers, and clinging to a tree and dryandra stump.
    The opening of Book VI then defines perfection of knowledge as knowing the roles
    of the Heavenly and the Human and completing one’s natural term without untimely
    death, while noting that such knowledge remains not fully determined.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sagely man is described as having no plans, no cutting or hacking to do,
    no loss, and no goods to dispose of, so ordinary wisdom, glue, arts of intercourse,
    and merchant-like activity are unnecessary to him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lack of these four things is called nourishment of the sagely man’s Heavenly
    nature and Heavenly food received from Heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sagely man has the bodily form of a man but not the passions and desires
    of other men, and human approvals and disapprovals are not found in him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hui-zi asks whether a man can be without desires and passions, and Kwang-zi
    answers that he can, because the Tao gives personal appearance and powers and
    Heaven gives bodily form.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kwang-zi explains that being without passions and desires means not doing
    inward harm to the body by likings and dislikings, always pursuing the course
    without effort, and not trying to increase the store of life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kwang-zi says Hui-zi treats his spirit as external, subjects his vital powers
    to toil, sings while leaning against a tree, sleeps while grasping a rotten dryandra
    stump, and talks about what is strong and white.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The opening of Book VI states that knowing the roles of the Heavenly and the
    Human is perfection of knowledge; the Heavenly is naturally born with a person,
    while the Human uses existing knowledge to nourish what is not yet known.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same opening passage says that completing one’s natural term of years
    without an untimely end is the fullness of knowledge, but that this knowledge
    still awaits confirmation because it is not yet determined.
  category: sequence
  evidence_refs:
  - ev:6
