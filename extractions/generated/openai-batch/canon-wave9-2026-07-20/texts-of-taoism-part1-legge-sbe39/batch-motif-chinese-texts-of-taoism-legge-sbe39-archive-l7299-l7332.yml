canonical_text:
  quote: ''
  summary: 'The passage summarizes notices on parts of a Taoist text: neglect of cautions
    leads to bodily loss for a master of the Left; Lao-jze is said to have failed
    in nourishing the Lord of Life, producing excessive mourning by disciples; a following
    sentence is interpreted as implying the continued existence and transfer of spirit
    after death, with body as faggots and spirit as fire. The passage also reports
    commentarial analogies to Buddhist transmigration, to Yi conveying floodwaters,
    and to stories of skill acquired by habit.'
  language: English
  quote_policy: summarized
