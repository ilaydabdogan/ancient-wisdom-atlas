canonical_text:
  quote: ''
  summary: The passage describes a spirit-like man with refined body and manner, a
    diet of wind and dew, aerial travel on clouds and flying dragons, healing and
    harvest-bringing powers, and invulnerability to floods and extreme heat. It then
    gives brief anecdotes about a Sung dealer whose ceremonial caps are useless in
    Yueh, Yao visiting four Perfect Ones and losing concern for his throne, and Hui-3ze
    beginning a story to Awang-3ze about a large calabash from seeds sent by the king
    of Wei.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described man has skin compared to ice and snow, a manner compared to
    a virgin, does not eat the five grains, and instead inhales wind and drinks dew.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described man mounts clouds, drives flying dragons, and roams beyond the
    four seas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: By concentrating his spirit-like powers, the described man can save people
    from disease and pestilence and secure an annual plentiful harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An unnamed speaker initially regards the account as wild and unbelievable,
    and Lien Shi responds by comparing this failure to blindness, deafness, and a
    defect in intelligence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lien Shi says that even if all things were in confusion and the world cried
    out to be rectified, the described man would not have to labor at rectifying it
    as his own business.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lien Shi says that floods reaching to the sky could not drown the described
    man and that extreme heat melting metals and stones and scorching the ground and
    hills would not hurt him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lien Shi says that from the dust and chaff of himself the described man could
    mould Yaos and Shuns, and therefore would not occupy himself with ordinary things.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man of Sung dealing in ceremonial caps travels to Yueh, where the people
    cut off their hair and tattoo their bodies, leaving them with no use for the caps.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yao rules with perfect government within the four seas, goes to see four Perfect
    Ones on the distant hill of Kt-shih, and afterward his throne appears no more
    to his oblivious eyes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hui-3ze tells Awang-3ze that the king of Wei sent him seeds of a large calabash;
    the grown fruit could contain five piculs, and he used it to hold water.
  category: speech
  evidence_refs:
  - ev:8
