canonical_text:
  quote: ''
  summary: A master mechanic named Shih encounters a huge oak-tree used as an altar
    for the spirits of the land. He dismisses its timber as useless, but the tree
    later appears in his dream and explains that its uselessness has preserved its
    life and size, unlike productive fruit trees that are damaged and cut short. After
    waking, Shih reflects on the dream and answers his workman’s question about the
    tree’s altar status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A master mechanic named Shih, traveling toward Ki, comes to Khii-yuan and
    sees an oak-tree used as an altar for the spirits of the land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The oak-tree is described as extremely large: an ox behind it could not be
    seen; it measures a hundred spans around; it rises eighty cubits on a hill before
    branching; about ten branches are large enough for boats to be hollowed from them.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Crowds come to see the oak-tree, but Shih does not stop to look at it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One of Shih’s workmen admires the tree and asks why Shih ignored such a large
    and beautiful mass of timber.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Shih says the tree is useless as timber: a boat would sink, coffin wood would
    rot, furniture would break, a door would exude sap, and a pillar would be eaten
    by insects.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shih explains that because the tree’s material is good for nothing, it has
    reached a great age.
  category: speech
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:7
  text: On Shih’s return journey, the altar-oak appears to him in a dream and speaks
    to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dream-speaking oak contrasts itself with ornamental and fruit-bearing
    plants such as hawthorns, pear-trees, orange-trees, pummelo-trees, and gourds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The oak says fruit-bearing trees are damaged when their fruit ripens: fruit
    is knocked down, branches are broken, and smaller branches are torn away.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The oak says productive ability makes lives bitter and causes premature endings
    for such trees.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The oak says it long sought to understand its own uselessness and finally
    learned that uselessness had been of great use to it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The oak argues that if it had possessed useful properties, it would not have
    grown to its great size.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The oak says that both it and Shih are things, and questions how one thing
    can pass judgment on another.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After waking, Shih keeps thinking about the dream.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The workman asks why, if the tree is so taken with uselessness, it nevertheless
    serves as the altar for the spirits of the land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Shih tells the workman to be silent and says the tree simply happened to grow
    there; the passage then continues into an incomplete statement about whether the
    tree would be in danger if it were not used as an altar.
  category: speech
  evidence_refs:
  - ev:8
