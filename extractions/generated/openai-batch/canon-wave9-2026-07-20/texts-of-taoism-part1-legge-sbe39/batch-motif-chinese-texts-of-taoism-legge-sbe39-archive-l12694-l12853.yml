canonical_text:
  quote: "“Fishes breed and grow in the water; man developes in the Tao.”"
  summary: A dialogue describes two survivors singing and playing a lute beside a
    corpse, Tze-kung’s objection to their conduct, and Confucius’s explanation that
    their view lies outside common ritual ways. Further exchanges use fish in water
    as an analogy for human development in the Tao, discuss the person who stands
    aloof yet accords with Heaven, and present Yen Hui’s question about Mang-sun 3hai
    mourning his mother without visible grief. Aung-ni replies by framing death and
    life as uncertain transformation and asks whether ordinary life may be like an
    unawakened dream.
  language: English
  quote_policy: quoted
