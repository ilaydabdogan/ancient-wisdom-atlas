canonical_text:
  quote: ''
  summary: The passage contrasts reticent early rulers and self-so people with later
    disorder. It says that when the Great Tao ceased to be observed, benevolence,
    righteousness, wisdom, shrewdness, hypocrisy, filial sons, and loyal ministers
    appeared. It urges renouncing sageness, wisdom, benevolence, righteousness, contrivance,
    gain, and learning in favor of simplicity. A first-person speaker contrasts himself
    with satisfied and intelligent ordinary people, describing himself as infant-like,
    homeless, chaotic, drifting, dull, and different, while valuing the nursing-mother,
    identified as the Tao. The passage then begins to describe Tao as the source of
    active force, unseen and untouched, containing forms, semblances, and essences.
  language: English
  quote_policy: summarized
