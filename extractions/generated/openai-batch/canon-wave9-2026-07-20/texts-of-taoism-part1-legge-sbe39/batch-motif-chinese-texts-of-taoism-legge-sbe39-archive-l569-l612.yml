canonical_text:
  quote: ''
  summary: The passage surveys commentarial materials for Lao-3ze, especially Wang
    Pi's text and commentary and 3iao0 Hung's Helps/Wings to Lao-3ze. It describes
    that compilation as presenting views from sixty-four writers across Taoist, Buddhist,
    Confucianist/Literati, and imperial categories, then quotes Julien and Balfour
    on the problem of Confucian influence in interpreting Lao-3ze.
  language: English
  quote_policy: summarized
