canonical_text:
  quote: ''
  summary: The passage closes a reflection on action and transformation with Kwang
    Au's butterfly dream, in which he cannot determine whether he is a man who dreamed
    of being a butterfly or a butterfly dreaming of being a man. Editorial notes explain
    this as the Transformation of Things. The next section teaches that life is limited
    while knowledge is unlimited, recommends accord with the Central Element for preserving
    life, and begins the story of a cook cutting up an ox for ruler Wan-hui.
  language: English
  quote_policy: summarized
