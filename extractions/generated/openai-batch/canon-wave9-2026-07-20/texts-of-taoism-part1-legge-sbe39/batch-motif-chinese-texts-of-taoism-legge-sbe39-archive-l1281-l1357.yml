  summary: A scholarly introductory passage reviews early catalogued editions and
    commentaries on Lao’s treatise, especially the commentary of the “old man of the
    Ho-side,” Han imperial interest in Taoism, Emperor King’s designation of the treatise
    as a King, Wang Pi’s commentary, later commentarial proliferation, and divisions
    of the text into Tao and Teh sections and into chapter counts.
