canonical_text:
  quote: ''
  summary: Introductory commentary to Book XVII explains the title ‘Autumn Waters’
    or ‘Floods of Autumn,’ presents water as an image for the greatness and spontaneity
    of the Tao, contrasts quiet water imagery associated with Lao-tzu with Chuang-tzu’s
    use of the inundated Ho and the ocean, and summarizes later descriptions of river-sea
    conversations and other examples illustrating non-action, the Heavenly, and the
    recovery of the True condition.
