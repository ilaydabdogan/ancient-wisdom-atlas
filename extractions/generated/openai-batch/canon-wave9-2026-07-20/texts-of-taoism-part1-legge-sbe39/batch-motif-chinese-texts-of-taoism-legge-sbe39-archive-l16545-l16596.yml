canonical_text:
  quote: ''
  summary: 'An unnamed speaker defines Benevolence and Righteousness as accord with
    all things, love for all people, and absence of selfish thoughts. Lao Tan rebukes
    this view, calling it vague or self-involved, and urges the speaker to imitate
    the regular courses of Heaven and Earth, the sun and moon, stars, animals, and
    trees rather than make a noisy display of virtue. A new anecdote then begins:
    Shih-/ang KAi comes to Lao-ze after a hundred-day journey to see one he had heard
    was a sage.'
  language: English
  quote_policy: summarized
