canonical_text:
  quote: Be on your guard; be careful; see that you keep yourself correct!
  summary: 'Yen Ho asks Aii Po-yu how to serve as teacher to the dangerous eldest
    son of duke Ling of Wei. Aii Po-yu counsels cautious self-correction, outward
    association and inward harmony without either joining the youth’s errors or displaying
    superiority. He supports the advice with animal exempla: the praying mantis opposing
    a carriage, tiger keepers managing ferocity by feeding carefully, and horse handlers
    whose sudden action can provoke injury and damage.'
  language: English
  quote_policy: quoted
