canonical_text:
  quote: ''
  summary: The passage contains Legge’s translation and notes for portions of Tao
    Teh King chapters 77-80. It presents the Way of Heaven as rebalancing excess and
    deficiency like the bending of a bow, contrasts it with human accumulation, describes
    water as soft yet overcoming the hard, links true kingship with bearing reproach
    and woes, describes forbearance in covenant settlement, and sketches a small simple
    state returning to knotted cords and unused weapons or vehicles.
  language: English
  quote_policy: summarized
