canonical_text:
  quote: Because he does not strive, no one finds it possible to strive with him.
  summary: 'The excerpt describes mysterious excellence in government, then presents
    chapter 66''s analogy of rivers and seas receiving valley streams by being lower
    and applies it to the sage ruler who leads by placing himself below and behind
    others. Chapter 67 says the Tao appears inferior because of its greatness and
    names three precious things: gentleness, economy, and shrinking from precedence;
    gentleness is said to protect and to prevail even in battle.'
  language: English
