  quote: "“Discussions about Things,” equivalent to our “Controversies.”"
  summary: The passage is an editorial-philological note introducing Book II and explaining
    the title Kazi Wt Lun. It rejects Mr. Balfour’s title translation, cites Chinese
    critics, parses the characters Wi Lun and Khi, and quotes or condenses Mr. Kang’s
    commentary about Kwang-3ze’s phrase referring to conflicting views among numerous
    schools.
