canonical_text:
  quote: ''
  summary: An anxious minister or commissioner asks Kung-ni for help before undertaking
    a difficult mission. Kung-ni answers with counsel about implanted familial duty,
    loyal service to a ruler, unavoidable obligation, restrained diplomatic speech,
    exact transmission of messages, and the tendency of excess to turn order into
    disorder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker expects Ai to treat him respectfully as a commissioner
    but fears delay and difficulty in moving a prince of a state to action.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he received his charge in the morning, is drinking iced water
    in the evening, and is already suffering from internal heat and conflicting anxieties
    before beginning the affair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker fears that if the matter fails, the king will deal with him after
    the manner of men, and he says that as a minister he cannot bear the mission’s
    burden.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Kung-ni replies that there are two great cautionary considerations: an implanted
    requirement in nature and the conviction of what is right.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kung-ni presents a son’s love for parents and a minister’s service to a ruler
    as obligations from which the heart or person cannot escape.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kung-ni says that one who is a minister or son must do what he cannot but
    do, forget his own person, and need not dwell on pleasure in life or dislike of
    death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kung-ni advises the speaker that in relations between states, near states
    should verify friendliness by deeds, while distant states require truthful messages.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Messages between states are carried by internuncios, and messages conveying
    satisfaction or dissatisfaction are described as especially difficult to transmit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that excess in language leads to recklessness, failure
    of belief, distrust, and danger for the internuncio.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A cited rule for speech advises transmitting a message exactly as it stands
    and without overflow of language.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kung-ni gives analogies in which skilful wrestlers begin with open trials
    and end with masked attempts, and regulated drinking begins in order and ends
    in disorder.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kung-ni generalizes that people are sincere at first but end by becoming rude.
  category: speech
  evidence_refs:
  - ev:9
