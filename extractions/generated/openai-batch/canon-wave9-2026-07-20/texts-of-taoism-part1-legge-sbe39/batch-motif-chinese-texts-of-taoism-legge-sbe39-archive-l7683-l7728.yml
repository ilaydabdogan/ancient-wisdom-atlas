canonical_text:
  quote: "“benevolence and righteousness are not natural growths of humanity, but
    excrescences on it”"
  summary: The passage is Legge’s brief notice of Book VIII, explaining its title
    through bodily anomalies and summarizing the book’s argument that benevolence,
    righteousness, art, and music are unnatural additions to human nature. It says
    Shun first introduced these virtues and thereby disturbed the world, contrasts
    an earlier Tao-guided simplicity with later moral striving, and cites Po-i and
    robber Shih as examples between which the author finds no essential difference.
  language: English
  quote_policy: quoted
