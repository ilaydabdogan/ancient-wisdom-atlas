canonical_text:
  quote: ''
  summary: A cripple called Sht-shan the Toeless comes on his heels to see Kung-ni/Confucius.
    Kung-ni first rebukes him for a past calamity, but Toeless replies that he still
    possesses something more honorable than his feet and had expected the Master to
    act like Heaven and Earth, which cover and sustain all things. Confucius then
    invites him in and later urges his disciples to be stimulated by Toeless's desire
    to learn. The supplied range ends as Toeless begins to tell Lao Tan about the
    encounter.
