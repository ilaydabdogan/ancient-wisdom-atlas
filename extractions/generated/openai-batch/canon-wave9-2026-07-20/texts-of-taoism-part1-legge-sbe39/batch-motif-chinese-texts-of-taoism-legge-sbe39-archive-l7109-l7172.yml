canonical_text:
  quote: ''
  summary: 'The passage introduces Book I of the Writings of Kwang-3ze, explaining
    its title as easeful wandering and summarizing its themes: untroubled enjoyment
    through the Tao, examples from creatures of different sizes, human exemplars,
    definitions of the Perfect, Spirit-like, and Sagely Man, illustrations involving
    named figures and conversations, the usefulness of what appears useless, and an
    old rejected view that the great phang represented Kwang-3ze himself.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The title of Book I is explained through three characters sharing an ideagram
    glossed as alternating walking and halting, and is rendered as sauntering or rambling
    at ease.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introduction states that the book concerns untroubled enjoyment of the
    mind, secured by the Tao, even though the character for Tao does not occur in
    the book.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kwang-3ze is said to illustrate his thesis with creatures of the largest and
    smallest sizes, which should not judge one another and may each find happiness
    in the Tao.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The exposition moves from creatures to human examples, naming Yung-3ze and
    Lieh-3ze and then one whose enjoyment is independent of every other being or instrumentality.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage lists three definitions of the accomplished Taoist: the Perfect
    Man, the Spirit-like Man, and the Sagely Man.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sagely Man is said to be illustrated by Yao and Hsii Yu, and the Spirit-like
    Man by a conversation between Kien Wu and Lien Shu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The translator describes the account of the Spirit-like Man as startling and
    compares its statements with cosmic divine imagery involving light, heavens, waters,
    clouds, wind, a cherub, and eternity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A later paragraph is summarized as containing two illustrations that nothing
    is really useless if used Taoistically, with a comparison to Confucius in the
    Analects attributed to 3iao Hung.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: An old view held that Kwang-3ze intended himself by the great phang, but Li
    Shih-ih is quoted as rejecting that view as wide of the mark.
  category: other
  evidence_refs:
  - ev:8
