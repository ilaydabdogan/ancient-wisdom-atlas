canonical_text:
  quote: ''
  summary: A dialogue presents Wang I answering questions about knowledge by giving
    examples of different creatures having different suitable places, foods, mates,
    and responses to human beauty. Wang I concludes that fixed distinctions such as
    benevolence, righteousness, approval, and disapproval are confused and difficult
    to discriminate. Asked whether the Perfect man lacks knowledge of advantage and
    harm, Wang I describes the Perfect man as spirit-like, unaffected by heat, cold,
    thunder, wind, death, life, advantage, or injury, and roaming beyond ordinary
    bounds. The passage then begins a new dialogue with Khii 3hido-3ze asking Khang-wi
    3ze.
  language: English
  quote_policy: summarized
