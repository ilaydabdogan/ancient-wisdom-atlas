canonical_text:
  quote: The title of this eighth Book, Phien M 4u, has been rendered ... ‘ Double
    Thumbs.’
  summary: The passage introduces Book VIII as part of the second section of the author's
    writings, explains that later book titles are believed to have been assigned from
    opening words by Kwo Hsiang, compares that titling practice with other scriptural
    and classical collections, and discusses the title Phien Mau as referring to an
    additional or excrescent growth associated with the great toe rather than the
    thumb.
