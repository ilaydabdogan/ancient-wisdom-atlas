canonical_text:
  quote: ''
  summary: The passage criticizes coercive management of horses, clay, and wood as
    violations of their nature and compares this error to the governance of the world.
    It describes an age of perfect virtue in which people lived simply, without class
    distinctions, in equality and proximity with birds, beasts, and other creatures.
    It then says the appearance of sagely men, benevolence, righteousness, music,
    and ceremonies caused perplexity and separation among people.
  language: English
  quote_policy: summarized
