canonical_text:
  quote: ''
  summary: The passage contrasts remedial rule after disorder with an age of perfect
    virtue in which moral conduct occurs without named categories or records. It criticizes
    flattery of fathers, rulers, and common opinion, describes the world as deluded,
    compares unheard lofty words to grand music drowned by vulgar sound, and ends
    with an ugly man anxiously inspecting his newborn son at midnight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Man Wi-kwei asks whether the Lord of Yu governed when the kingdom was ordered
    or after it had become disordered.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord of Yu is compared to one who has medicine for sores, false hair for
    the bald, and healing for the ill.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A filial son carrying medicine to a sick father, with distress in his face,
    is used as a comparison; the passage says a sage would be ashamed of such a thing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the age of perfect virtue, people attached no value to wisdom and did not
    employ men of ability.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Superiors are compared to higher branches of a tree, and the people are compared
    to deer of the wild.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people of perfect virtue act uprightly, love one another, are loyal, and
    keep faith without naming these acts as Righteousness, Benevolence, Loyalty, or
    Good Faith.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The highest filial son and loyal minister are described as not flattering
    the father or fawning on the ruler.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man who assents to common opinion, shapes his phrases, displays robes and
    colors, and arranges his bearing to win approval is described as following and
    flattering others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that one who knows his own stupidity or delusion is less
    stupid or deluded than one who does not.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A three-person walking example states that if only one traveler is deluded
    they may reach the goal, but if two are deluded they will not.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Grand music is said not to penetrate villagers' ears, while popular songs
    make them laugh; lofty and perfect words are said not to remain because vulgar
    words predominate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two earthenware instruments are said to confuse the music of a bell, and the
    speaker says he lets his purpose go instead of forcing his way.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: An ugly man with a son born at midnight hastens with a light to look at the
    child, fearing the child may resemble him.
  category: action
  evidence_refs:
  - ev:8
