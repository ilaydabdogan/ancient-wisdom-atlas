canonical_text:
  quote: the age of Perfect Virtue
  summary: The passage describes an original paradisiacal condition under the Tao,
    identified through Awang-3ze's descriptions as an age of Perfect Virtue. In this
    age people lived simply, did not value wisdom or named moral categories, used
    knotted cords, kept to plain food, clothing, and dwellings, avoided class distinctions,
    lived without extensive infrastructure, and coexisted peacefully with birds, beasts,
    and other creatures. Legge notes the absence of explicit piety or religious ceremony
    in this account, then says that by the time of Lao and Awang the cultivation of
    the Tao had fallen into disuse, leading Lao to resign and withdraw.
  language: English
  quote_policy: quoted
