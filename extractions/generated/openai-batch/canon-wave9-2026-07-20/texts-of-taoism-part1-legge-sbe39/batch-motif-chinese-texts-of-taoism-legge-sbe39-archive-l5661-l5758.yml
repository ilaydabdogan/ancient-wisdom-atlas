canonical_text:
  quote: ''
  summary: The passage first describes ostentatious princes with ornamented robes,
    swords, luxurious consumption, and great wealth as robbers and boasters contrary
    to the Tao. Chapter 54 then presents images of Tao-associated planting that cannot
    be uprooted and enfolding that cannot be taken away; descendants bring sacrifices
    to a shrine. It says that Tao nursed in oneself makes vigour true and that its
    rule or prevalence brings benefit through the family, neighbourhood, state, and
    kingdom. The closing prose says these effects are known by observation across
    those social scales, and the commentary frames the chapter as cultivation of the
    Tao and observation of its effects.
  language: English
