canonical_text:
  quote: "“returns to the state of non-existence, from which the Tao called him to
    be born as a man”"
  summary: The passage is a commentary-style notice describing the True Man as one
    whose nature agrees with the Tao, who is passive under the Tao’s ordering, and
    who may return to non-existence after earthly life. It contrasts this with a later
    dictionary definition of the True Man as a transformed mountain recluse ascending
    to heaven. It also notes ancient and cosmic possessors of the Tao, wonders, longevity,
    a minister becoming a star, learning the Tao, tranquillity under affliction, and
    Confucius being presented as an expounder of Taoism.
  language: English
  quote_policy: quoted
