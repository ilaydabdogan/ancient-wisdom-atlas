canonical_text:
  quote: "“The Perfect man has no (thought of) self; the Spirit-like man, none of
    merit; the Sagely-minded man, none of fame.”"
  summary: The passage contrasts limited spiritual attainment with a hypothetical
    person who rides the powers of heaven, earth, and the seasons without waiting
    for anything. It then gives an abdication dialogue in which Yao offers the throne
    to Hsii Yo, who refuses it as a pursuit of name rather than reality. A following
    dialogue introduces Kien Wu, Lien Shi, Khieh-yu, and a report of a Spirit-like
    man dwelling on a remote hill.
  language: English
  quote_policy: quoted
