canonical_text:
  quote: he lost his dark-coloured pearl
  summary: The passage describes a ruler-like person who displays the Tao and perceives
    where ordinary perception fails. It then tells how Hwang-Ti ascends Khwan-lun
    from the north of the Red-water, loses a dark-coloured pearl, and has it sought
    unsuccessfully by Wisdom, Li A, and Ahieh Kau before Purposeless finds it. A note
    identifies the pearl with the Tao. The passage then gives a teacher lineage involving
    Yao, Hsii Yu, Nieh Khiieh, Wang I, and Phei-i, and records Hsii Yu warning Yao
    that Nieh Khiieh would be dangerous as a correlate of Heaven because he relies
    on human cleverness rather than the Heavenly gift.
  language: English
  quote_policy: quoted
