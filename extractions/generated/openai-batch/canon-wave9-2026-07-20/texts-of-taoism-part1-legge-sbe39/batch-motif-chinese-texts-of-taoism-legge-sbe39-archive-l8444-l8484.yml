canonical_text:
  quote: What really belongs to man is the Tao.
  summary: The passage is a brief critical notice introducing Book XXVI, titled from
    characters translated as “External Things.” It explains that external things may
    help or harm unpredictably, while Tao is presented as what truly belongs to a
    person and can sustain happiness if prized and cultivated. The notice also comments
    on the relevance, possible spuriousness, and possible Buddhist influence in parts
    of the book.
  language: English
