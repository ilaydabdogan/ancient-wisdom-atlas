canonical_text:
  quote: ''
  summary: The passage presents Tao Teh King chapters 43-45 and the opening of chapter
    46 with Legge's notes. It states that the softest overcomes the hardest, that
    what lacks substantial existence enters where there is no crevice, and that few
    attain teaching without words and the advantage of non-action. It contrasts fame,
    life, and wealth; praises contentment and knowing when to stop; describes great
    fullness as void and straightness as seeming crooked; says action overcomes cold,
    stillness overcomes heat, and purity and stillness give law to all under heaven.
    The commentary identifies the softest thing as water, discusses Tao or air as
    unsubstantial, compares related chapters, and explains cold/heat through Yang/Yin.
  language: English
  quote_policy: summarized
