canonical_text:
  quote: ''
  summary: The passage explains Tao as a metaphorical name for an ineffable, non-personal
    mode or principle underlying movement and things. It contrasts Taoist uses of
    Heaven/Thien with Confucian and common Chinese usages, distinguishes the Way of
    Heaven from the Way of man, and presents non-action, stillness, and freedom from
    striving as characteristics of sages aligned with Tao.
  language: English
  quote_policy: summarized
