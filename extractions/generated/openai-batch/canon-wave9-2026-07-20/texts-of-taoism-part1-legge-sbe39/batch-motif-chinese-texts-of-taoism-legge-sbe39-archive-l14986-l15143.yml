canonical_text:
  quote: The Way of Heaven and the Way of Man are far apart.
  summary: The passage describes a selfless figure united with the community of existences,
    lists antithetical qualities of things, people, virtue, Tao, and Heaven, presents
    sages acting without interfering with Heaven or the Tao, distinguishes the Way
    of Heaven from the Way of Man, and opens a discussion of Heaven-and-Earth rulership
    by one cosmic course and non-action.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A figure is described as belonging to the great community of existences, having
    no individual self, having nothing called his own, and being the friend of heaven
    and earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists paired qualities for Things, People, Affairs, Laws, Righteousness,
    Benevolence, Ceremonies, Virtue, the Tao, and Heaven, each combining a limiting
    or hidden aspect with a required function.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sages contemplate Heaven without assisting it, perfect virtue without
    being embarrassed by it, proceed according to the Tao without planning, and engage
    other norms and affairs without depending on them as ultimate supports.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The text states that those who do not understand Heaven are not pure in virtue,
    and those who do not comprehend the Tao lack a course they can pursue successfully.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The text distinguishes the Tao as the Way of Heaven and the Way of Man: non-doing
    with honour is assigned to Heaven, doing with embarrassment is assigned to Man,
    Heaven plays Lord, and Man plays Servant.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The opening of Book XII states that the transforming power of heaven and earth
    proceeds from one lathe, the myriad things have one government, and mankind has
    one ruler.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ruler’s course is said to proceed from the qualities of the Tao and to
    be perfected by Heaven; ancient rulers are said to have ruled the world by doing
    nothing.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Looking at names, distinctions, abilities, and things in the light of the
    Tao is said to validate the ruler’s appellation, the separation of ruler and ministers,
    the performance of offices, and the response of things to rule.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage describes a sequence in which one attribute pervades Heaven and
    Earth, one course operates in all things, governance works through departments,
    skill, righteousness, natural virtue, the Tao, and the pattern of Heaven.
  category: sequence
  evidence_refs:
  - ev:7
