canonical_text:
  quote: ''
  summary: In a dialogue, Yiin Kiang asks Hung Mung how to restore cosmic and seasonal
    harmony and nourish living beings. After an initial refusal and a later meeting,
    Hung Mung says human governing disturbs Heaven’s order and harms animals, vegetation,
    and insects. He advises nourishing the mind by doing nothing, relinquishing bodily
    and sensory fixation, freeing the spirit, cultivating similarity with chaos, and
    recognizing that all things return to their root.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yiin Kiang says the breath of heaven is out of harmony, the breath of earth
    is bound up, the six elemental influences are not concordant, and the four seasons
    are untimely; he asks how to blend the six influences to nourish all living things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hung Mung responds to the first question with bodily gestures and says he
    does not know.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Three years later, while rambling in the east and passing by the wild of Sung,
    Yiin Kiang meets Hung Mung again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the second meeting, Yiin Kiang addresses Hung Mung as Heaven, bows twice
    with his head to the ground, and seeks instruction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hung Mung describes himself as wandering listlessly and under a wild impulse,
    and says he sees that nothing proceeds without method and order.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yiin Kiang says people follow him wherever he goes and imitate him, and he
    asks Hung Mung for a word about this situation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hung Mung says disturbance of Heaven’s regular method, collision with the
    nature of things, and obstruction of Heaven’s mysterious operation are due to
    the error of governing people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hung Mung describes the consequences of such disturbance as scattering animal
    herds, making birds sing at night, and bringing calamity to vegetation and insects.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hung Mung tells Yiin Kiang that his mind needs nourishment and that by taking
    the position of doing nothing, things will transform themselves.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hung Mung instructs Yiin Kiang to neglect the body, cast out hearing and sight,
    forget commonality with things, cultivate similarity with the chaos of the plastic
    ether, unloose the mind, set the spirit free, and be still as if without a soul.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hung Mung says every one of the multitude of things returns to its root unknowingly
    and remains in a state of chaos during existence.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A supplied note states that Yiin Kiang and Hung Mung were not men and were
