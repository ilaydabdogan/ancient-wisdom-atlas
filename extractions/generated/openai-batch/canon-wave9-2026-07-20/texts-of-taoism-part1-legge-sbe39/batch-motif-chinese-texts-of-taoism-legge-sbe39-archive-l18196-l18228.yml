canonical_text:
  quote: ''
  summary: The earl of the Ho asks whether the common claim is true that the most
    minute has no bodily form and the most great cannot be encompassed. Zo of the
    Northern Sea replies by distinguishing small and great standpoints, subtle essence
    and vast mass, bodily form and numerical division, and the limits of words and
    discriminating thought. He then describes the Great Man as acting without injury,
    gain-seeking, pride in benevolence, pride in declining wealth, or reliance on
    others for boasting; the passage breaks off mid-sentence.
  language: English
