canonical_text:
  quote: ''
  summary: The passage uses the image of old wood made into an ornamented sacrificial
    vase, while the rest is discarded, to argue that both refined and discarded wood
    have lost their proper nature. It lists sensory attractions and preferences as
    causes of loss of human nature, criticizes Yang and Mo for courses that lead to
    distress, and compares such condition to caged animals and bound criminals. It
    then begins a section on the Way of Heaven, describing its universal operation,
    the spontaneous stillness of sages, and the clarity of still water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A portion of a hundred-year-old tree is cut and fashioned into a sacrificial
    vase with a bull figured on it and green and yellow ornamentation; the remaining
    portion is cut away and thrown into a ditch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacrificial vase and the discarded wood differ in beauty and ugliness,
    but both are said to have lost the proper nature of the wood.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Five causes of loss of proper nature are listed: fondness for five colours,
    five notes, five odours, five flavours, and preferences and dislikes.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The five listed things are described as injurious to life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yang and Mo are described as each thinking he has found the proper course,
    while the speaker says their courses lead to distress.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A course that leads to distress is compared to a dove in a cage being treated
    as if it had found the right thing for itself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Preferences and dislikes, music, and colours are said to pile up fuel inwardly,
    while caps, a plumed bonnet, tablets, and long girdles restrain the person outwardly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: People who think they have obtained what they desire while inwardly stuffed
    and outwardly bound are compared to criminals with tied arms and fingers in a
    screw, or to tigers and leopards in sacks or cages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Way of Heaven, the Way of the Tis, and the Way of the Sages are described
    as operating so that things are perfected, people turn to them, and all within
    the seas submit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those who understand Heaven, are in sympathy with sages, and know the work
    of the Tis and kings act spontaneously, appear ignorant, and are still.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stillness of sages is said not to arise from skilful ability; all things
    are unable to disturb their minds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Still water is described as clear enough to show a person’s beard and eyebrows.
  category: attribute
  evidence_refs:
  - ev:6
