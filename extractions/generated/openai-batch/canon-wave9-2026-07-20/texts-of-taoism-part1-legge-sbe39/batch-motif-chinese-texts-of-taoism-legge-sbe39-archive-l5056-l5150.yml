canonical_text:
  quote: ''
  summary: 'The passage presents the Tao as hidden and nameless yet able to supply
    and complete things. Chapter 42 describes a sequence in which the Tao produces
    One, One produces Two, Two produces Three, and Three produces all things; all
    things leave Obscurity and embrace Brightness, harmonized by the Breath of Vacancy.
    It then gives examples of reversal: rulers use lowly designations for themselves,
    and some things increase through diminution while others diminish through increase.
    The speaker teaches that the violent and strong do not die naturally. Editorial
    commentary frames the chapter as illustrating the Tao’s movement by contraries
    and compares related sayings and interpretations in other Taoist or later commentarial
    sources.'
  language: English
  quote_policy: summarized
