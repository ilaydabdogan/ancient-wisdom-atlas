canonical_text:
  quote: ''
  summary: A didactic sequence presents a millipede, serpent, and wind discussing
    Heaven-given modes of motion and power. It then recounts Confucius surrounded
    at Khwang, calmly singing and teaching 3ze-li about fate, time, and the courage
    of the sagely man before the armed leader withdraws after recognizing a mistaken
    identity. The final section begins with Kung-sun Lung confessing that Kwang-3ze's
    words have unsettled his learning, and Mau of Wei responds with a silent gesture.
  language: English
  quote_policy: summarized
