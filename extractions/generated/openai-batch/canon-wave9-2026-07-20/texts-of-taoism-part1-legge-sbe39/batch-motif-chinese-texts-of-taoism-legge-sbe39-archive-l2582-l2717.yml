canonical_text:
  quote: "“To-day I have seen Lao-3ze, and can only compare him to the dragon.”"
  summary: The passage introduces Sze-ma Khien’s historical account of Lao-3ze and
    contrasts it with the non-historical, anecdotal character of Kwang-jze’s writings.
    It recounts Lao-3ze’s meeting with Confucius, Confucius’s comparison of him to
    a dragon, Lao-3ze’s cultivation of the Tao while remaining concealed, his departure
    through a north-western barrier-gate, Yin Hsi’s request for a book, and Lao-3ze’s
    writing of a two-part work on the Tao and its attributes before disappearing from
    known history. A footnote also reports later fabulous legends about Lao-3ze’s
    prolonged gestation and aged appearance at birth, and says such legends were copied
    from Buddhist legends about Sakyamuni.
  language: English
  quote_policy: quoted
