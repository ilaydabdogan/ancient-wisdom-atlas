canonical_text:
  quote: ''
  summary: In a dialogue, Confucius speaks to Lao Tan about benevolence and righteousness.
    Lao Tan replies with images of irritation, natural simplicity, innate animal coloring,
    and fish stranded on dry land, arguing against forced moral exertion. Confucius
    later returns home silent for three days and tells his disciples that in Lao Tan
    he has seen the dragon, a being that coils, unfolds, rides cloudy air, and is
    nourished by Yin and Yang. 3ze-kung then seeks to visit Lao Tan, describing him
    through images of stillness, dragon-like manifestation, thunderous voice, and
    movement like heaven and earth; the passage ends as 3ze-kung begins an argument
    about ancient rulers.
  language: English
  quote_policy: summarized
