canonical_text:
  quote: ''
  summary: The passage presents Tao as active, nameable, and safe to rest in; compares
    its relation to the world to rivers and seas receiving valley streams; gives aphorisms
    on self-knowledge, self-conquest, contentment, endurance, and dying without perishing;
    describes the Great Tao as all-pervading, productive, non-claiming, clothing all
    things, and presiding over their return to root; and describes the sage as accomplishing
    great things by not making himself great. Commentary discusses Tao and Teh, afterlife
    interpretations, Buddhist and Daoist comparisons, and body-shedding similes.
  language: English
  quote_policy: summarized
