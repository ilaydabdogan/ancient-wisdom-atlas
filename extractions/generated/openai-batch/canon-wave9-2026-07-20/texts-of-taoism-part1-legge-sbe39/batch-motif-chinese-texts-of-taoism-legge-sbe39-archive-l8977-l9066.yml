canonical_text:
  quote: ''
  summary: 'The passage contrasts ordinary measures of longevity and ability with
    vast or extraordinary examples: Phang is renowned for long life; Thang’s questions
    to Ai describe the enormous khwan fish in the Pool of Heaven and the phang bird
    rising on a whirlwind toward the southern ocean; a quail mocks the bird from its
    low flight among bushes. The passage then applies the contrast of small and great
    to human self-estimation, Yung-jze’s indifference to praise or blame, and Lieh-jze
    riding on the wind.'
  language: English
  quote_policy: summarized
