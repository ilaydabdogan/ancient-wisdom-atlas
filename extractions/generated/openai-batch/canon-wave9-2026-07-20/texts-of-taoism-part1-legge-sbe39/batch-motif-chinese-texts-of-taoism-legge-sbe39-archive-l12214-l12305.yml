canonical_text:
  quote: Death and life are ordained, just as we have the constant succession of night
    and day
  summary: The passage describes the True men as balanced between Heavenly and Human
    elements, presents death and life as Heaven-ordained, uses fish in dried springs
    to advocate forgetting mutual dependence in larger waters, contrasts praise and
    blame of Yao and Kieh with seeking the Tao, and gives analogies of hiding a boat,
    a hill, and finally the world in the world to express secure participation in
    the Tao.
  language: English
  quote_policy: quoted
