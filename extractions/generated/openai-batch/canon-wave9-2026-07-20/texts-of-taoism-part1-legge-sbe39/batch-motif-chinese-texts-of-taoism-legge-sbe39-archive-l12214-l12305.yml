  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Death and life are said to be ordained like the succession of night and day,
    and men are said to have no power over them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some persons are said to regard Heaven as father and love it; some regard
