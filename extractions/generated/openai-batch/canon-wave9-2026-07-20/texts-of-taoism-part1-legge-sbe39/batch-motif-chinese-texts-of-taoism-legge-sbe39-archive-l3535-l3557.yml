canonical_text:
  quote: The whole seems to tell what can be accomplished by one who is possessed
    of the Tao.
  summary: 'Legge comments that the chapter is difficult and possibly corrupt in its
    first clause. He summarizes it as describing what a person possessed of the Tao
    can accomplish: acting without self-consciousness or self-satisfaction, managing
    vital breath to reach Taoistic bodily perfection, keeping intelligent and animal
    souls together, and ruling people without purpose and effort. He glosses “the
    gates of heaven” as the nostrils, the organ of breath. The passage ends with the
    beginning of the next chapter’s wheel-and-empty-nave image.'
  language: English
  quote_policy: quoted
