canonical_text:
  quote: ''
  summary: The passage describes ideal persons whose emotions and bearing are aligned
    with seasonal imagery and whose actions are suitable yet unpredictable. It then
    characterizes the sagely man through paradoxical political and ethical statements,
    names several men who served others rather than seeking their own pleasure, and
    gives a further portrait of the True men of old as nonpartisan, humble, silent,
    ceremonially observant, wise in timing, and accordant in virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plural group is described as having foreheads that beamed simplicity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same group’s coldness is compared to autumn, their warmth to spring, and
    their joy and anger to the four seasons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group is said to do what is suitable with regard to all things, while
    the extent of their action cannot be known.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A sagely man is said to be able, in conducting war, to destroy a state without
    losing the hearts of the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sagely man’s benefits and favors may extend to myriad generations without
    his being described as a lover of men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage rejects joy-sharing, manifest affection, regulating conduct by
    times and seasons, distinguishing profit from injury, acting for a name, and improper
    self-loss as marks of the highest person.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The named men are said to have served other men and sought to secure what
    those others desired, not their own pleasure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The True men of old are described as judging others aright without partisanship
    and feeling their own insufficiency without flattery or cringing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The True men of old are described as naturally peculiar without obstinacy,
    humble without display, placid and satisfied, attractive, bland, adaptive, severe,
    and haughtily indifferent.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The True men of old seem to keep their mouths shut and, when looking down,
    to have forgotten what they wished to say.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The True men of old regard punishments as the substance of government, ceremonies
