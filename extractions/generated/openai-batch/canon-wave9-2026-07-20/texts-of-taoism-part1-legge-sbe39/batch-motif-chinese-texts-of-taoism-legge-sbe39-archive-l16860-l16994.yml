canonical_text:
  quote: It is thus that the Tao admits of no substitute.
  summary: A dialogue states that perfect benevolence does not depend on affection
    and that filial duty and other named virtues are insufficient to describe it.
    The speaker uses a journey southward and the inability to see a northern mountain
    as an analogy for distance. A second dialogue has Pei-man Ahang ask Hwang-Ti about
    a performance of the Hsien-chih music that made him afraid, weary, and perplexed.
    Hwang-Ti explains the music as made with human instruments but attuned to Heaven,
    propriety, righteousness, Grand Purity, the five virtues, the four seasons, the
    harmony of things, thunder, Yin and Yang, and the brilliance of the sun and moon.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The minister asks whether, if there is no affection and no love, the perfectly
    benevolent can be called not filial.
  category: speech
  evidence_refs:
