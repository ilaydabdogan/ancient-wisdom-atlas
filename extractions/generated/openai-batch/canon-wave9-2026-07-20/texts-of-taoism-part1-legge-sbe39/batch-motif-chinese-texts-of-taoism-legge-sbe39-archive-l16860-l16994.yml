- id: obs:2
  text: Awang-3ze says that perfect benevolence does not admit the feeling of affection
    and that filial duty is not sufficient to describe it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Awang-3ze gives an example of a person travelling south to Ying, standing
    there facing north, and not seeing Mount Ming because of distance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Awang-3ze lists a progression involving the difficulty of forgetting parents,
    making parents forget him, forgetting all people in the world, and making all
    people forget him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Awang-3ze says the virtue's benefit extends to myriad ages, that no one knows
    its source, and that filial duty, fraternal respect, benevolence, righteousness,
    loyalty, sincerity, firmness, and purity are insufficient for it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pei-man Ahang says that the first part of Hwang-Ti's music made him afraid,
    the next made him weary, and the last perplexed him; he became agitated, unable
    to speak, and lost self-possession.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hwang-Ti says the performance used instruments of men, was attuned according
    to Heaven, proceeded according to propriety and righteousness, and was pervaded
    by Grand Purity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hwang-Ti says the Perfect Music first responded in human affairs, conformed
    to Heaven, indicated five virtues, corresponded to spontaneity in nature, showed
    the four seasons, and displayed harmony among all things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The music is described as swelling and dying away, distinguishing peaceful
    and military strains, becoming clear and rough, and blending contraction and expansion
    of elemental processes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The notes are described as flowing in waves of light; Hwang-Ti commands a
    terrifying crash of thunder; the music has no formal conclusion or prelude, seems
    to die away and burst into life, closes and rises again, and continues without
    pause.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the second part, Hwang-Ti says he made the music describe the harmony of
    Yin and Yang and surrounded it with the brilliance of the sun and moon; the notes
    are short and long, soft and hard, unified without fixed regularity, and fill
    valleys and ravines.
  category: speech
  evidence_refs:
  - ev:7
