literal_observations:
- id: obs:1
  text: A person skilled in Tao’s wars is described as assuming no martial posture.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the fighter with good will does not resort to rage, the vanquisher
    keeps apart from foes, and the one whose commands are fulfilled acts humbly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that not contending is a source of might, that men’s wills
    are bent so that they unite with him, and that his ends are like Heaven’s.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The commentary says the practiser of the Tao accomplishes work like Heaven,
    without striving or crying, and appears under the figure of a mailed warrior of
    the ancient chariot.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A master of the art of war says he does not dare to be host or commence war,
    prefers to be guest and act defensively, does not dare advance an inch, and prefers
    to retire a foot.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The military saying describes marshalling ranks where there are no ranks,
    baring arms where there are no arms, grasping a weapon where there is no weapon,
    and advancing against an enemy where there is no enemy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
