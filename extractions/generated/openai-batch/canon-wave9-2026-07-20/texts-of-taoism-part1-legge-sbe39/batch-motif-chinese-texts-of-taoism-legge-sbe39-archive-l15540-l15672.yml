canonical_text:
  quote: ''
  summary: The passage first names a primordial quality as mysterious and as submission
    to the Natural Course. In a dialogue, the Master asks Lao Tan whether people who
    regulate the Tao by fixed distinctions can be called sages; Lao Tan rejects such
    artificial regulation and describes self-forgetting as identification with Heaven.
    In another dialogue, Kiang-lii Mien reports political advice given to a ruler,
    while Ki A#éh criticizes it and describes the non-obvious influence of a great
    sage ruler rooted in an original formative condition. The final fragment introduces
    3ze-kung observing an old gardener carrying water from a well to irrigate channels.
  language: English
  quote_policy: summarized
