  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kiang-lii Mien tells Ki A#éh that he advised the ruler of Li to be courteous,
    exercise self-restraint, distinguish the public-spirited and loyal, and repress
    the cringing and selfish.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ki A#éh laughs quietly and says Kiang-lii Mien's advice is like a mantis trying
    to stop a carriage with its arms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ki A#éh says that if the ruler followed this advice, it would be like increasing
    the dangerous height of towers and adding to valuables, causing multitudes to
    turn toward the same direction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After being startled, Kiang-lii Mien asks to hear what influence a ruler should
    exert.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ki A#éh says a great sage ruler would stimulate the people's minds, change
    their manners, extinguish evil and violent minds, and carry them forward as if
    they acted from their own nature.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Ki A#éh says the people transformed by the great sage ruler would not know
    what made them act so.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Ki A#éh says such a ruler would not look up to Yao and Shun as elder brothers,
