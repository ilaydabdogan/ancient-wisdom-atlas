canonical_text:
  quote: When the perfect man employs his mind, it is a mirror.
  summary: The passage describes an encounter in which a wizard flees after Hi-3ze
    shows a state called pure vacancy. Lieh-3ze then judges that he has not yet begun
    to learn his master’s doctrine, withdraws home for three years, performs humble
    domestic tasks, and returns to simplicity. A following teaching praises non-action
    and describes the perfect man’s mind as mirror-like, responsive without retaining.
  language: English
  quote_policy: quoted
