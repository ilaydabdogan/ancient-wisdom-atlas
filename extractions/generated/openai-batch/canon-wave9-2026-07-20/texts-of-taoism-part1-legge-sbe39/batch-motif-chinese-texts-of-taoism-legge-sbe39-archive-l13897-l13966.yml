  summary: The passage uses examples of worked raw materials, harnessed horses, and
    people under sagely institutions to argue that imposed craft, control, ritual,
    and moral teaching alter prior natural conditions and produce vessels, cunning,
    knowledge-seeking, and competition for gain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raw materials are cut and hacked to form vessels, and natural jade is broken
    and injured to make handles for libation-cups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Disallowing the attributes of the TAo and departing from natural instincts
    are linked to the preference for benevolence and righteousness and the coming
    into use of ceremonies and music.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The confusion of the five colours is linked to ornamental figures, and the
    confusion of the five notes is linked to musical accords.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage calls the cutting of raw materials the crime of the skilful workman
    and the injury to the characteristics of the TAo the error of sagely men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Horses in the open country eat grass and drink water; when pleased they rub
    and intertwine their necks, and when enraged they kick back-to-back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After yoke, moon-like frontlet, bit, and reins are imposed, horses look askance,
    curve their necks, rush viciously, try to get the bit out, and filch the reins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The horses' thief-like knowledge and ability are called the crime of Po-lao.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the time of Ho-hsii, the people are described as occupying dwellings without
    knowing what they were doing and walking out without knowing where they were going.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The people in that earlier condition fill their mouths with food, are glad,
    and slap their stomachs to express satisfaction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Sagely men appear with bendings and stoppings in ceremonies and music, and
    with benevolence and righteousness displayed to excite people’s endeavours and
    comfort their minds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the sagely men appear, the people begin to move in love of knowledge
    and strive with one another in pursuit of gain; this is called the error of those
    sagely men.
  category: sequence
  evidence_refs:
  - ev:4
