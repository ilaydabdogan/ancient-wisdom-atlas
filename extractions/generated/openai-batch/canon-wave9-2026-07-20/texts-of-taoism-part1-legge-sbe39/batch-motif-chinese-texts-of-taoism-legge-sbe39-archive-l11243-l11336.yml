  text: Nan-po 3ze-£/i rambles on the Heights of Shang and sees a large extraordinary
    tree whose shade could cover the teams of a thousand chariots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tree's smaller branches are twisted and crooked, and its root or stem
    is divided into rounded portions, making it unsuitable for rafters, beams, coffins,
