- id: obs:3
  text: A leaf of the tree wounds the mouth when licked, and its smell can make a
    person frantic or intoxicated for more than three days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 3ze-ki calls the tree good for nothing and says that this is how it attained
    such size; spirit-like men acknowledge this worthlessness and its result.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Aing-shih in Sung, catalpae, cypresses, and mulberry trees are cut down
