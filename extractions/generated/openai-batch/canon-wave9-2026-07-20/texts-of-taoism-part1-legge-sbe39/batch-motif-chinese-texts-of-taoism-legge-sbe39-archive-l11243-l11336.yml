canonical_text:
  quote: ''
  summary: Nan-po 3ze-£/i, also called 3ze-ki in the passage, sees an enormous tree
    whose crooked branches, divided root, harmful leaves, and overpowering smell make
    it useless as timber; he concludes that its uselessness explains its great size
    and preservation. The passage contrasts this with useful trees in Sung, which
    are cut down for posts, beams, and coffin planks and so die prematurely. It then
    says that certain physically marked oxen, pigs, and men are excluded from sacrifice
    to the Ho; wizards deem them inauspicious, while spirit-like men deem them fortunate.
    The next example introduces the deformed Shi, who supports himself and others
    through humble work and, because of ailments, is not assigned certain state services.
  language: English
  quote_policy: summarized
