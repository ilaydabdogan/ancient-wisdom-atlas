  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The useful timber trees do not complete their natural lives and come to a
    premature end under the axe and bill because they supply good timber.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kieh book specifies oxen with white foreheads, pigs with turned-up snouts,
    and men suffering from piles, and forbids their sacrifice to the Ho.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wizards regard the listed peculiarities as inauspicious, while spirit-like
    men regard the beings marked by them as very fortunate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The deformed Shi is described with chin, shoulders, hair-knot, viscera, and
    thigh bones arranged in abnormal ways.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shi earns a living by sharpening needles, washing clothes, sifting rice, and
    cleaning it, and he can support ten individuals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the government calls out soldiers, Shi bares his arms among others, and
    when great service is required, no work is assigned to him because of his constant
    ailments.
  category: sequence
  evidence_refs:
  - ev:9
