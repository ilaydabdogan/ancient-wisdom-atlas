canonical_text:
  quote: ''
  summary: 'The passage is Legge''s brief notice on Book XXX and the following notice
    on ''The Old Fisherman.'' It describes the Book XXX narrative as metaphorical:
    Kwang-zze is made to play a part, a ruler of Kado is said to love sword-fighting
    and keep bravoes, and the story represents a degraded ruler recalled to duty.
    It then discusses ''The Old Fisherman,'' including its disputed genuineness, its
    satire of Confucius, the fisherman lecturing Confucius by a stream, Confucius
    and his disciples reading and singing in a forest on the Apricot Terrace, and
    the old man moving his skiff to shore and away among reeds.'
  language: English
  quote_policy: summarized
