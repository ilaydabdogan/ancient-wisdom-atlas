  quote: ''
  summary: The passage discusses Taoism’s opposition to the pursuit of knowledge and
    contrasts Lao’s Tao with Confucius’s path of duty. It quotes a maxim about renouncing
    wisdom and contrivance, gives Kwang-jze’s parable in which Heedless and Hasty
    bore seven orifices into Chaos until Chaos dies, then turns to Lao’s lesson of
    humility using water as an illustration.
