canonical_text:
  quote: ''
  summary: 'The supplied passage presents Taoist teachings and translator commentary
    on guarding the Tao, possessing the “mother of the state,” long continuance, and
    rulership. It then gives chapter 60: governing a great state is likened to cooking
    small fish; when the kingdom is governed according to the Tao, the manes of the
    departed do not use their spiritual energy to harm people, and the ruling sage
    also does not harm them. The passage closes with the beginning of chapter 61,
    where a great state is compared to a low, down-flowing stream that becomes a center
    for small states, and the female is said to overcome the male by stillness.'
  language: English
  quote_policy: summarized
