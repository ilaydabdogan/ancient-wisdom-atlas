canonical_text:
  quote: How (ceaselessly) heaven revolves! How (constantly) earth abides at rest!
  summary: The passage opens with questions about the motion and ordering of heaven,
    earth, sun, moon, clouds, rain, and winds. Woi-hsien Thido answers by referring
    to heaven’s six Extreme Points and five Elements, and says rulers govern well
    when acting in accordance with them. A second dialogue begins in which Tang asks
    Kwang-3ze about Benevolence, and Kwang-3ze replies that wolves and tigers are
    benevolent because father and son among them are affectionate.
