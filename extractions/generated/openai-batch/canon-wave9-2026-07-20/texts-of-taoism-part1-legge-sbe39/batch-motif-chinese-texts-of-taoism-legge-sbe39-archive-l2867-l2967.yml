canonical_text:
  quote: ''
  summary: Legge introduces the Thai Shang Kan Ying Phien as a popular Taoist moral
    tract rather than a difficult philosophical treatise. He describes it as teaching
    good and bad conduct, recording human deeds, ensuring retribution, and urging
    repentance and reformation. He notes that its rewards and punishments are not
    extended beyond death, but may pass to posterity. The passage also discusses the
    work’s popularity, uncertain authorship, possible Sung origin, the meaning of
    Thai Shang, and later imperial titles that ranked Lao-3ze among the gods.
  language: English
  quote_policy: summarized
