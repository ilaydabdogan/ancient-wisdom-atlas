canonical_text:
  quote: "“Before there were heaven and earth, from of old, there It was, securely
    existing.”"
  summary: 'The passage discusses Legge’s interpretation of Taoist statements about
    Tao, Ti/God, primordial beginning, and the genesis of things. Tao is described
    as preceding heaven and earth, as source of spirits and Ti, and as producing heaven
    and earth. The text then summarizes Kwang-3ze’s views about the beginning: a primordial
    state of nothing and nameless vacancy, the arising of first existence without
    bodily shape, and the subsequent production of forms, spirits, and natures. Legge
    stresses that this is evolution or transformation rather than creation proper.'
  language: English
  quote_policy: quoted
