canonical_text:
  quote: ''
  summary: A dialogue contrasts the different governing methods of ancient rulers
    and presents Lao Tan's account of how successive rulers altered human dispositions,
    produced rivalry, scheming, weapons-use, social factions, and disorder. The passage
    condemns the wisdom of the Three Kings and Five Tis as contrary to natural brightness,
    purity, and seasonal beneficence, and more harmful than a scorpion sting or beast
    bite. It ends with 3ze-kung disconcerted and begins a separate exchange in which
    Confucius tells Lao Tan he has long studied six classical books.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker states that Yao gave the kingdom to Shun, Shun gave it to Yi, Yi
    used strength, Thang used arms, King Wan obeyed, and King Wu rebelled; the speaker
    concludes that their methods were not the same.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lao Tan tells his interlocutor that Hwang-Ti ruled so that the people's minds
    conformed to the One or simplicity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lao Tan says Yao ruled so that the people's hearts cherished relative affection,
    with differing mourning observances for different kin not blamed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lao Tan says Shun ruled so as to create rivalry in the people's minds; in
    that period, children are described as speaking at five months and naming people
    before age three, and men began to die prematurely.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lao Tan says Yu ruled so that people's minds changed, became scheming, and
    used weapons while claiming to kill thieves rather than other men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people are said to have formed different combinations throughout the kingdom,
    producing great consternation; the Literati and followers of Mo Ti then arose.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lao Tan says the rule of the Three Kings and Five Tis may bear that name,
    but nothing was greater than the disorder it produced.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wisdom of the Three Kings is described as opposed to the sun and moon
