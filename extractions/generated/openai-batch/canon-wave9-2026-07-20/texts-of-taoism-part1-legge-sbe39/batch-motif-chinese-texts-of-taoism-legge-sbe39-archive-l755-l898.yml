canonical_text:
  quote: ''
  summary: A preface passage lists scholarly works consulted for translating Kwang-3ze,
    evaluates commentaries and editions, stresses the need for individual critical
    judgment, and then turns to the Tractate of Actions and their Retributions, naming
    earlier European translations and editions used for the translator's version.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author mentions consulting Professor Gabelentz's treatise on the speech
    or style of Kwang-3ze and states broad agreement with its views on usage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author introduces a list of works employed in preparing his version.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first listed work supplies Kwo Hsiang's commentary, includes Lai Teh Ming's
    explanations of sounds and meanings, and has selected comments and notes added
    by a Ming editor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 3iao Hung's Helps to Kwang-3ze draws materials from forty-eight authorities,
    divides the books into paragraphs, and includes concluding books on variant readings
    and articles about Kwang-3ze and his text.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: La Shi-#ih's Kwang-3ze Hsiieh is described as preceding the books with short
