  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hsiian Ying or 3ung, also called Mau-kung, is credited with a careful and
    ingenious commentary, but the author's copy is said to be so incorrectly printed
    that it requires caution.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Mr. Balfour appears to have used the same flawed edition
