canonical_text:
  quote: ''
  summary: The passage is a scholarly note on the Book called “Robber Kih.” It reports
    Sze-ma K‘ien’s ascription of the book to Kwang-3ze, notes a contrast between Kih
    and Yen Hui used to question a just Providence, doubts the historical existence
    of the robber figure, describes the first paragraph as possibly satirical ridicule
    of Confucius in which the sage is outcrowed by the robber, discusses character-indicating
    coined names, and concludes that the book’s genuineness is doubtful though any
    forgery must be early.
  language: English
  quote_policy: summarized
