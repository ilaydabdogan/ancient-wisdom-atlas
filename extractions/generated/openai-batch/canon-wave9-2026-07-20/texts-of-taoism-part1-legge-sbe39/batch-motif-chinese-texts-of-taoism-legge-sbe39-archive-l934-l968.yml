  quote: ''
  summary: A corrigendum/addendum reports alternative readings of Taoist Chapter XIV.
    It summarizes Dr. Edkins's proposal that three Chinese monosyllables represent
    one or three divine names connected with Babylonian or Accadian forms, including
    a divine triad, chaos, separating word, and divine light. The editorial voice
    rejects this reading as unsatisfactory and prefers Chinese dictionaries and commentators.
  language: English
  quote_policy: summarized
