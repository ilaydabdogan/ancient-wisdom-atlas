canonical_text:
  quote: The partial becomes complete; the crooked, straight; the empty, full; the
    worn out, new.
  summary: 'The passage presents Tao Te Ching chapters 22-23 with notes: apparent
    deficiency becomes completion; the sage gains recognition through humility and
    non-striving; abstaining from speech accords with natural spontaneity; violent
    wind and sudden rain do not last; pursuit or failed pursuit of the Tao can still
    be brought into agreement and attainment through sufficient faith. Commentary
    adds explanatory images of a hollow filled by overflowing water and withered tree
    foliage renewed in spring.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The passage states paired reversals: partial becomes complete, crooked becomes
    straight, empty becomes full, and worn out becomes new; it also contrasts few
    desires with many desires.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sage holds in his embrace one thing identified in translation as humility
    and manifests it to all the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage avoids self-display, self-assertion, self-boasting, and self-complacency;
    the passage says this results in shining, distinction, acknowledged merit, and
    superiority.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the sage is free from striving, and therefore no one in the
    world can strive with him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The commentary explains the emptiness that becomes full as a hollow cavity
    in the ground filled by overflowing water, and the worn out that becomes new as
    withered tree foliage renewed in spring.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says abstaining from speech marks one who obeys the spontaneity
    of his nature.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A violent wind is said not to last a whole morning, and a sudden rain not
    to last the whole day; Heaven and Earth are named as what these things are owing
    to, yet cannot make such spasmodic actions last long.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: One making the Tao his business agrees with those pursuing the Tao, those
    pursuing the manifestation of its course, and those failing in both.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who agree as to the Tao, its manifestation, or their failure are said
    to have the happiness of attaining; insufficient faith on one side leads to want
    of faith on the other.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The commentary glosses the chapter title as Absolute Vacancy or Emptiness
    and Nothingness, describing entire conformity to the Tao and saying the Tao restrains
    spasmodic loquacity.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note states that the Tao seems in some way to correspond to Plato's Eternal
