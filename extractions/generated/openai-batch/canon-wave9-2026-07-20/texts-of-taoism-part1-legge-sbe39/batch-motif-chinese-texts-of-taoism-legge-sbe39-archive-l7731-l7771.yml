canonical_text:
  quote: "“Governing men is like governing horses.”"
  summary: 'The passage introduces Book IX, whose opening characters are translated
    as “Horses” and “Hoofs,” and summarizes Lin Hsi-kung’s interpretation: coercive
    government of people is compared to harmful horse management and to artisans altering
    clay and wood against their nature. Good government leaves people to fulfill their
    Heaven-given constant nature; imposed sagely institutions lead to loss of perfect
    virtue, pursuit of gain, and error.'
  language: English
  quote_policy: quoted
