canonical_text:
  quote: ''
  summary: The passage first describes an exemplary Man of Tao or Great Man who does
    not seek worldly distinction, rank, reward, or self-regard. It then presents a
    dialogue in which the earl of the Ho asks how external and internal things can
    be distinguished as noble or mean, great or small. Zo of the Northern Sea answers
    that from the standpoint of the Tao things are neither noble nor mean; viewed
    relatively, everything can be called both great and small, useful and not useful,
    approved and condemned. He supports this with images of heaven and earth as a
    tiny grain and a hair point as a mound or mountain, with the mutual implication
    of East and West, and with political exempla of rulers whose abdication or contention
    led either to success or ruin.
  language: English
  quote_policy: summarized
