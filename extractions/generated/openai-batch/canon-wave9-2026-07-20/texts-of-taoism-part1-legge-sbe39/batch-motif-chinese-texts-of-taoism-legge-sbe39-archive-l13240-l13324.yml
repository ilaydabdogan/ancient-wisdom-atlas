canonical_text:
  quote: ''
  summary: The passage describes Ki-hsien, a wizard or physiognomist who foretells
    human fate. Lieh-3ze is impressed by him, but Ht-3ze says Lieh-3ze has only received
    the outward letter of his doctrine, not its reality and spirit. Lieh-3ze brings
    Ki-hsien to Ht-3ze on successive days. Ki-hsien first predicts Ht-3ze's imminent
    death, then predicts recovery, and then says he cannot understand Ht-3ze's physiognomy
    because the master is never the same. Ht-3ze explains each result as caused by
    a different way he showed himself internally.
  language: English
  quote_policy: summarized
