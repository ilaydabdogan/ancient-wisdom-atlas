canonical_text:
  quote: ''
  summary: The passage presents Daoist sayings on absolute vacancy and non-action,
    describes the sage as restful, placid, and non-initiating, relates his life and
    death to Heaven and transformation, associates his stillness and movement with
    Yin and Yang, criticizes emotional disturbance, and uses clear, flowing water
    as an image for heavenly virtue and spirit-nourishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Absolute vacancy and non-action are described as qualities that maintain the
    level of heaven and earth and as the substance of the Dao and its characteristics.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sage is described as entirely restful, mentally balanced and at ease,
    placid and indifferent; anxieties and evils do not enter him, his virtue is complete,
    and his spirit remains unimpaired.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage's life is likened to the action of Heaven, his death to the common
    transformation of things, his stillness to Yin, and his movement to Yang.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sage does not initiate happiness or calamity; he responds to influences
    and pressure, acts only when obliged, discards wisdom and memories of the past,
    and follows his Heaven-given nature.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sage is said to suffer no calamity from Heaven, no involvement from things,
    no blame from men, and no reproof from spirits of the dead; his life seems to
    float and his death to rest.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage states that sadness and pleasure, joy and anger, and love and
    hatred indicate defects, while freedom from sorrow and pleasure, unchanged mind,
    absence of opposition, indifference to external things, and absence of dissatisfaction
    are perfections.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A body toiled without rest becomes worn out, and a spirit used without cessation
    becomes toiled and exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Water without admixture is clear, water not agitated is level, and obstructed
    water that cannot flow cannot preserve its clearness; this is called an image
    of the virtue of Heaven.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Being guileless and pure, still and uniform, indifferent and doing nothing,
    and moving while acting like Heaven are presented as the way to nourish the spirit.
  category: action
  evidence_refs:
  - ev:7
