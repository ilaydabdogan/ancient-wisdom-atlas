canonical_text:
  quote: ''
  summary: After Lao Tan dies, AZin Shih briefly condoles and then leaves. Questioned
    by disciples, he criticizes the excessive mourning around Lao Tan as overattachment
    and neglect of Heaven-nature. He teaches that the Master's coming and going occur
    at their proper time, so quiet acquiescence gives no occasion for grief or joy.
    Death is described through images of a loosened divine-suspended cord, consumed
    faggots, and fire transmitted elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lao Tan is said to have died; AZin Shih goes to condole, cries out three times,
    and comes out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciples ask whether AZin Shih had been a friend of the Master and whether
    such brief condolences were proper.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: AZin Shih replies that he had been a friend and says he formerly thought Lao
    Tan was the 'man of men' but no longer thinks so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: AZin Shih reports seeing old men wailing as if they had lost a son and young
    men wailing as if they had lost their mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: AZin Shih says Lao Tan's attraction and uniting of people to himself caused
    involuntary condolences and wailing, which he calls hiding Heaven-nature, excessive
    human feeling, and forgetting what was received in being born.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: AZin Shih says the Master's coming was at the proper time and his going was
    the simple sequence of that coming; quiet acquiescence and submission give no
    occasion for grief or joy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ancients are reported to have described death as the loosening of the
    cord on which God suspended life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the faggots have been consumed, while the fire is
    transmitted elsewhere and is not known to be over or ended.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A source note interprets the faggots as the body and the fire as the animating
