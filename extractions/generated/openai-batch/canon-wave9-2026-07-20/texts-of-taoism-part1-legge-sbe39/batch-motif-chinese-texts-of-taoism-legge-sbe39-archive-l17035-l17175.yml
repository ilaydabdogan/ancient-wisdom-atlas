canonical_text:
  quote: ''
  summary: The passage first describes the music of Heaven as ineffable, wordless,
    and understood by sages, and reports a speaker’s sequence of music that awes,
    wearies, and perplexes the listener. It then presents Yen Yiian asking the music-master
    Ain about Confucius. Ain criticizes Confucius by comparing old royal practices
    to sacrificial grass-dogs that are honored before a rite and discarded afterward,
    recounts Confucius’s hardships, and uses analogies of a boat and carriage, a shadoof,
    and different fruits to argue that rules and measures change according to time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Contrasting labels such as death and life, fruit and flower, are applied to
    changing conditions, while the notes are described as moving, flowing, separating,
    shifting, and lacking regular sounds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sages are said to understand the nature of this music and to judge it according
    to prescribed spontaneity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The music of Heaven is described as delighting the mind without words, without
    audible sound or visible form, and as filling heaven and earth and enveloping
    the universe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A first-person speaker says he performed music calculated successively to
    awe, to weary, and to perplex; the listener responded with fear, weariness, perplexity,
    and a sense of stupidity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker states that the listener’s stupidity is akin to the Tao and may
    be used to convey the Tao in the person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Confucius was travelling in the west in Wei, Yen Yiian asked the music-master
    Ain about the course of the Master, and Ain replied that it was over with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before sacrificial presentation, grass-dogs are placed in a box or basket,
    wrapped in embroidered cloths, and approached by ritual personnel who fast in
    preparation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the grass-dogs have been set forth, passers-by trample them, and grass-cutters
    take and burn them for cooking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ain says that restoring the used grass-dogs to their former wrappings and
    sleeping under them would lead to evil dreams or nightmare.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ain compares Confucius to someone taking the grass-dogs presented by the ancient
    kings and leading his disciples to wander, abide, and sleep under them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Confucius’s cited hardships include a tree cut down in Sung, departure from
    Wei, extremity in Shang and Aau, and a siege between A/an and Bhai for seven days
    without cooked food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ain says travel by water calls for a boat and travel by land calls for a carriage,
    and that pushing a boat on dry land will not succeed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ain compares ancient time and the present time to water and dry land, and
    compares Au and Lf/Ld, as printed, to a boat and a carriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ain describes a shadoof as bending down when pulled and rising when released,
    while being pulled by a person rather than pulling the person.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The rules of propriety, righteousness, laws, and measures of the three Hwangs
    and five Tis are said to have derived their excellence from aptitude for government,
    not from being the same as present rules.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Different fruits are compared as having different flavours while all being
    suitable for eating; Ain concludes that rules of propriety, righteousness, laws,
    and measures change according to the time.
  category: relationship
  evidence_refs:
  - ev:7
