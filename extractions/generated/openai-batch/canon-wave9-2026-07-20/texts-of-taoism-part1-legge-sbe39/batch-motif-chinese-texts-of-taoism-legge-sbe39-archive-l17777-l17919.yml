canonical_text:
  quote: ''
  summary: The passage criticizes attempts to correct human nature through common
    learning or artificial methods, praising ancient regulation of the Tao through
    placidity and non-use of knowledge. It describes an early state of Perfect Unity
    in which Yin and Yang, seasons, beings, and human knowledge were undisturbed.
    It then narrates a decline through successive ancient rulers and cultural forms,
    ending with people disordered and unable to return to their true nature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who seek to correct nature or regulate desires by vulgar learning and
    common ways of thinking are called deluded and ignorant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancients who regulated the Tao nourished knowledge by placidity and abstained
    from employing that faculty in action.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When knowledge and placidity blend and nourish each other, harmony and orderly
    method come forth from nature.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Imperfect or one-sided Ceremony and Music throw the world into confusion;
    attempts to rectify others while one’s virtue is beclouded cause loss of proper
    nature.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The men of old, while the chaotic condition was undeveloped, shared placid
    tranquillity; Yin and Yang were harmonious and still, the seasons had definite
    times, and living beings were not injured or prematurely ended.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The primeval condition is called Perfect Unity, marked by no action and constant
    spontaneity.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Sui-zian and Fa-hsi arose and administered the world, compliance appeared
    but unity was lost.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Shan Nang, Hwang-Ti, and later the lords of Thang and Yu appear in the continuing
    deterioration; Thang and Yu introduce government by transformation and are said
    to vitiate purity and destroy simplicity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After people left the Tao for the Good, associated their minds and knowledge,
    and multiplied elegant forms, primal simplicity was extinguished and people became
