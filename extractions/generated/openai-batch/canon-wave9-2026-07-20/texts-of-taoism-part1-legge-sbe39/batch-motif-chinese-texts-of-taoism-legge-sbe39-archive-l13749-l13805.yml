canonical_text:
  quote: ''
  summary: The passage closes a reflection on avoiding error in the characteristics
    of the Tao, then opens Book IX, 'Horses' Hoofs.' It describes horses as naturally
    able to endure cold, feed on grass, drink water, and move freely. It contrasts
    this with Po-lao's claim to know how to manage horses, after which people mark,
    clip, pare, halter, bridle, hobble, confine, starve, thirst, gallop, and race
    them, causing some to die. A note identifies Po-lao as a mythical first tamer
    of horses.
  language: English
  quote_policy: summarized
