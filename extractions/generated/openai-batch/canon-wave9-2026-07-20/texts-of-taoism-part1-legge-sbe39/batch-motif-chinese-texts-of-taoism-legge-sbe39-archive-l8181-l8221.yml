  quote: ''
  summary: The passage is a brief notice of Book XVIII, Kih Lo or Perfect Enjoyment.
    It summarizes the book as treating freedom from distress and fear of death through
    Taoist non-action, then lists episodes involving Kwang-3ze at his wife's death,
    Taoist professors facing death, a skull appearing in a dream to speak of happiness
    after death, Confucius and Yen Hui, and a final paragraph compared with Lieh-3ze
    and Buddhist transformation ideas.
