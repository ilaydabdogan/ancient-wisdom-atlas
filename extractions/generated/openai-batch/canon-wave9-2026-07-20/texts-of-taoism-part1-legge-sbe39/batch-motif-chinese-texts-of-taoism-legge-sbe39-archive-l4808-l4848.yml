  summary: The passage contrasts highest and lower possession of the Tao's attributes,
    distinguishes non-purposive action from striving, ranks benevolence, righteousness,
    and propriety, and describes a sequence in which loss of the Tao leads to attributes,
    then benevolence, righteousness, propriety, and the beginning of disorder.
