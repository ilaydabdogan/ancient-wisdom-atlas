canonical_text:
  quote: ''
  summary: The passage summarizes Taoist statements about death, transformation, body,
    spirit, breath, return to the Tao, and later characterizations of Taoism as longevity
    practice. It includes accounts of Lao-3ze's death, Awang-jze's response to his
    wife's death, two men facing dissolution near graves on Kwan-lun, and an appended
    metamorphosis sequence involving panther, horse, and man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that little in the Tao Teh King bears on a tenet concerning
    body and spirit, but it notes descriptions of life as coming forth and death as
    entering.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the death of Lao-3ze, Awang-jze describes the master's coming and going
    as occurring at the proper time and as a simple sequence, with no occasion for
    grief or joy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same account describes death as the loosening of a cord on which God suspended
    life, and says that consumed faggots can be pointed to while the fire is transmitted
    elsewhere.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When Awang-jze's wife died, Hui-3ze came to condole and found Awang-jze squatting
    on the ground, drumming on a vessel, and singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hui-3ze says that not wailing for an old wife is enough, but drumming on the
    vessel and singing is excessive and strange.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Awang-jze says he was initially affected by his wife's death, then reflected
    on her state before life, bodily form, and breath.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Awang-jze describes successive changes from chaotic condition to breath, bodily
    form, birth, and death, and compares those changes to the procession of the four
    seasons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Awang-jze says his wife lies sleeping in the Great Chamber and that wailing
    for her would show failure to understand what is appointed for all.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two ancient deformed men, while looking at graves on Kwan-lun and feeling
    symptoms of dissolution, discuss whether death should be dreaded; one answers
    that life is borrowed, the living frame is dust, and life and death are like day
    and night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage explains birth as repeating the Grand Beginning, in which Tao
    appeared from primal nothingness and developed the world of material things and
    the human body that contains or covers an immaterial spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the immaterial spirit returns to the Tao that gave
    it and in due time receives a new embodiment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'A narrative associated with Lieh-3ze and an old bleached skull is said to
    end in metamorphoses: the panther produces the horse, the horse produces man,
    and man re-enters the great machinery from which all things come forth at birth
    and re-enter at death.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Later Confucian and Buddhist writers are reported as describing Taoism in
    terms of preserving breath and prolonging longevity, but the passage says Lao
    and Awang hardly support that representation for their time.
  category: other
  evidence_refs:
  - ev:7
