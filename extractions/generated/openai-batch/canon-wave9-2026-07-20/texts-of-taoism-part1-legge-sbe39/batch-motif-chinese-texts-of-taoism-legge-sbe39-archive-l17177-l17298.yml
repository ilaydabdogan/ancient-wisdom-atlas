canonical_text:
  quote: "“If the Tao could be presented (to another); men would all present it to
    their rulers...”"
  summary: The passage contrasts external imitation with inner fitness through examples
    of a monkey dressed in ducal robes and an ugly woman imitating Hsi Shih’s frown.
    It then presents a dialogue in which Confucius seeks the Tao from Lao Tan, who
    says the Tao cannot be simply transmitted, given, or told unless there is an inward
    presiding principle and outward obedience. Lao Tan describes benevolence and righteousness
    as temporary lodgings, praises untroubled ease and indifference, criticizes attachment
    to wealth, fame, and power, and names eight things as instruments of rectification
    for those able to comply with great changes.
  language: English
  quote_policy: quoted
