canonical_text:
  quote: ''
  summary: The passage is a brief notice explaining the title and contents of Book
    XXVII, Yu Yen. It identifies the title as meaning “Metaphorical Words” or literally
    “Lodged Words,” describes Kwang-3ze’s writing style as metaphorical, quotation-rich,
    and Taoist in orientation, explains “Kih Yen” as “Cup” or “Goblet Words,” and
    summarizes later paragraphs as accounts of changes in views, feelings, character,
    appearance, spirit, and manner. It closes with a textual-critical note about a
    disputed relation to Book XXXII.
  language: English
  quote_policy: summarized
