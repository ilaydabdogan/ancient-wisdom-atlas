canonical_text:
  quote: "“Disputation is a proof of not seeing clearly.”"
  summary: The passage contrasts the sage’s inward, non-argumentative judgment with
    ordinary disputation; states aphorisms about the Great Tao, wordless argument,
    and the limits of displayed virtue; names an inexhaustible “Heavenly Treasure-house”
    or “Store of Light”; and gives a brief dialogue in which Yao asks Shun about his
    wish to smite three small-state rulers, while Shun replies with an image of former
    ten suns illuminating all things and urges that Yao’s virtue should exceed the
    suns.
  language: English
  quote_policy: quoted
