canonical_text:
  quote: ''
  summary: 'The passage first recounts Po-khang 3ze-kao resigning princely rank after
    the transfer of rule from Yao to Shun and then to Yu, choosing to plough instead
    and criticizing government by rewards and punishments. It then gives a cosmogonic
    account of the Grand Beginning: nameless vacancy, first existence without form,
    production and differentiation of things, bodily shape containing spirit and Nature,
    and cultivated Nature returning to primordial vacancy and the union of heaven
    and earth.'
  language: English
  quote_policy: summarized
