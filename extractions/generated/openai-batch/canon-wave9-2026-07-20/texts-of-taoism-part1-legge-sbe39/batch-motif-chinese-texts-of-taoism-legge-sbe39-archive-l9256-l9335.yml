canonical_text:
  quote: The difference of result was owing to the different use made of the art.
  summary: 'The passage presents several paired examples about the use of large or
    apparently useless things: large calabashes destroyed after failing as drinking
    vessels; a salve used by one family for silk bleaching but by a stranger for military
    advantage and reward; a large Ailantus tree dismissed as useless for carpentry;
    and animal contrasts involving a wild cat or weasel and a yak.'
  language: English
  quote_policy: quoted
