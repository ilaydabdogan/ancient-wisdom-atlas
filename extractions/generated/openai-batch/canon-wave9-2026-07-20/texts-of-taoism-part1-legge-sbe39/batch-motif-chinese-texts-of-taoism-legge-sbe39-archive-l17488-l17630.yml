canonical_text:
  quote: ''
  summary: Confucius reports his unsuccessful attempt to persuade rulers by means
    of six writings and ancient exemplars. Lao-3ze replies that such writings are
    only vestiges, not the source that made them, and illustrates the Tao through
    natural processes of generation and transformation. After three months Confucius
    returns saying he understands transformation, and Lao-3ze confirms that he has
    found the Tao. The following section classifies several human pursuits as arrogance,
    self-cultivation, government, leisure, and longevity-seeking, then contrasts them
    with sages who attain without fixed contrivance and follow the way of heaven and
    earth.
  language: English
  quote_policy: summarized
