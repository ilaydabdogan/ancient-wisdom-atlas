canonical_text:
  quote: ''
  summary: The passage argues that things naturally become what they are without artificial
    binding, and that benevolence and righteousness, when imposed as external connecting
    links, deceive and alter nature. It gives examples of people sacrificing themselves
    for gain, fame, family, or the kingdom; a male and female slave losing sheep through
    different distractions; and Po-i and a robber dying for different causes but equally
    injuring their nature. It concludes that goodness, clear hearing, and clear vision
    are not external attainments but consist in allowing one’s endowed nature and
    the qualities of the Tao to follow their own course.
  language: English
  quote_policy: summarized
