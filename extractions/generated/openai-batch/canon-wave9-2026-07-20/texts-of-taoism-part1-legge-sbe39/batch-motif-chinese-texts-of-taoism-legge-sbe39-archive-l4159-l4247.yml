canonical_text:
  quote: There was something undefined and complete, coming into existence before
    Heaven and Earth.
  summary: The passage rejects self-display, self-assertion, vaunting, and self-conceit
    as contrary to the Tao. It then describes an unnamed, formless, unchanging reality
    prior to Heaven and Earth, designated as Tao, called Great, regarded as the Mother
    of all things, moving outward into remoteness and returning. It presents a hierarchy
    in which Man takes law from Earth, Earth from Heaven, Heaven from Tao, and Tao
    from its own being-what-it-is.
  language: English
  quote_policy: quoted
