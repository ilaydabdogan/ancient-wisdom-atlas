canonical_text:
  quote: "“adding fire to fire, and water to water”"
  summary: Kung-ni warns Yen Hui that direct moral correction of a dangerous ruler
    will fail and may lead to death. He cites earlier rulers who killed worthy ministers
    or destroyed states, and rejects Yen Hui’s proposed strategies of humility, ritual
    conformity, and appeal to antiquity.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A speaker warns that if someone forcibly presents benevolence and righteousness
    before a tyrant, the tyrant may regard the reprover as injurious and harm him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warning says that attempts to defer to the ruler may intensify the evil
    situation, expressed through the paired images of adding fire to fire and water
    to water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kieh is said to have killed Kwan Lung-fang, and Kau is said to have killed
    prince Pi-kan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The killed ministers are described as cultivating themselves, sympathizing
    with oppressed lower people, comforting them, and opposing their superiors on
    their behalf.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yao and Yu are cited as attackers of other states or rulers; the passage says
    the attacked populations were left empty or exterminated amid continuous warfare
    and insatiable craving.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ruler of Wei is described as craving fame and greater substance and as
    resembling the destructive precedents just cited.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yen Hui proposes going with uprightness, humility, and uniform endeavor, but
    Kung-ni rejects the plan and describes the target ruler as self-conceited, obstinate,
    and outwardly agreeable without inward self-condemnation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yen Hui proposes an inwardly straightforward but outwardly bending strategy,
    supported by appeals to antiquity and by ministerial court observances such as
    carrying a tablet, kneeling, and bowing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yen Hui frames his second proposal as working with Heaven, with other men,
    and with the ancients; Kung-ni rejects it as over-planned and ineffective for
    transformation.
  category: sequence
  evidence_refs:
  - ev:6
