canonical_text:
  quote: ''
  summary: The passage presents an ordered account of ancient rule rooted first in
    Heaven and the Great Tao, only later using names, offices, rewards, and penalties.
    It then gives a dialogue in which Shun corrects Yao's human-centered compassion
    by pointing to heavenly stillness and natural cycles as the model for rule. A
    final, incomplete episode has Confucius seeking help from Lao Tan to deposit writings,
    and Lao Tan questioning Confucius's summary of the classics as Benevolence and
    Righteousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ancients are said to begin with apprehending Heaven and then the Tao,
    before moving to Benevolence and Righteousness, duties, objects and names, personnel
    assessment, and rewards and penalties.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the resulting order has people fulfilling their named duties,
    serving superiors, nourishing inferiors, regulating things, cultivating themselves,
    and falling back on the method of Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Putting objects and names or rewards and penalties first is described as ignorance
    of the root or first steps of government.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who knows only the instruments of government, not its method, is
    described as fit to be used as an instrument but not fit to rule others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ceremonies, laws, numbers, measures, and jurisprudential minutiae are assigned
    to the service of inferiors toward superiors, not to the nourishment of the world
    by superiors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shun asks Yao how he exercises his mind by the Grace of Heaven; Yao answers
    that he is humble toward the helpless, does not neglect the poor, grieves for
