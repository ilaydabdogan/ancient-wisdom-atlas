canonical_text:
  quote: ''
  summary: 'The passage presents Taoist counsel against forceful rule and war: the
    kingdom is likened to a spirit-like vessel; arms and sharp weapons are ominous;
    armies bring desolation; a skilled commander uses force only from necessity and
    stops; victory is treated as a matter for mourning. It then describes the nameless
    Tao, spontaneous political submission to a ruler who guards it, and Heaven and
    Earth uniting to send sweet dew.'
  language: English
  quote_policy: summarized
