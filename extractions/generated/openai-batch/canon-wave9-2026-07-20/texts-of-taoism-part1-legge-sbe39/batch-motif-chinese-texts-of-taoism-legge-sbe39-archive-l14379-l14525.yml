canonical_text:
  quote: ''
  summary: The passage presents a Daoist argument that the world should be allowed
    to be and treated with forbearance rather than actively governed. It says interference,
    emotional extremes, rewards and punishments, and cultivated delights disturb human
    nature, while the superior man governs best by doing nothing and resting in innate
    nature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he has heard of letting the world be and exercising forbearance,
    but not of governing the world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Letting be and forbearance are explained as ways to prevent people from carrying
    their nature beyond its normal condition or altering its characteristics.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that when people do not exceed or alter their nature, good
    government of the world is secured.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yao’s government is said to have made people look joyful, while Aieh’s government
    is said to have made people look distressed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Excessive joy is associated with excessive Yang, and excessive irritation
    is associated with excessive Yin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The imbalance of Yang and Yin is compared to the four seasons not arriving
    at proper times and to cold and heat lacking harmony.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says misplaced joy and dissatisfaction make movements uncertain,
