canonical_text:
  quote: ''
  summary: 'A ruler praises a cook whose cutting of an ox proceeds with rhythmic precision.
    The cook explains that he follows the method of the Tao rather than mere art:
    after long practice he no longer sees the carcass as a whole, but lets the knife
    move through natural spaces and joints. His knife has remained sharp for nineteen
    years because it avoids hard obstructions. The ruler says he has learned the nourishment
    of life from the cook''s words. A second episode describes Kung-wan Hsien seeing
    the one-footed Master of the Left and concluding that the condition is from Heaven,
    followed by an analogy of a marsh pheasant that endures effort for food and drink
    rather than seek abundant nourishment in a coop.'
  language: English
  quote_policy: summarized
