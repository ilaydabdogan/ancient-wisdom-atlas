canonical_text:
  quote: ''
  summary: 'The passage begins with a fragment about a tree whose uselessness saves
    it from axe and injury. It then opens the section titled “Khi Wu Lun, or ‘The
    Adjustment of Controversies’”: Nan-kwo 3ze-khi sits in a trance-like posture,
    his disciple Yen Aang 3ze-yi questions him, and 3ze-khi explains the notes of
    Man, Earth, and Heaven through wind passing through natural apertures. The passage
    closes with statements contrasting great and small knowledge and speech, sleep
    and waking, and the striving of mind with mind.'
  language: English
