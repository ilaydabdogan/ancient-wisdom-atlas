canonical_text:
  quote: ''
  summary: The passage presents the Tao as a mother/source whose qualities the human
    being should guard, teaches restraint of mouth and nostril portals as breath discipline,
    praises perception of the small and guarding the soft, and describes using light
    to return to its source. The commentary relates these ideas to the Tao as Mother
    in chapter 1, to breath practices, and to later Taoist life-preserving arts. The
    passage then begins chapter 53, contrasting the level Great Tao with by-ways and
    criticizing social neglect of fields and granaries.
  language: English
  quote_policy: summarized
