  quote: Their movements came from nowhere; their home was in the deep darkness
  summary: A speaker describes a musical performance whose notes affect hidden and
    celestial realms, continue after the instruments cease, and exhaust an addressed
    listener who cannot understand, see, or reach them. In the final part, the speaker
    uses notes blended by spontaneity, compared to plants from one root and forest
    music without visible form, spreading without trace from obscurity and darkness.
