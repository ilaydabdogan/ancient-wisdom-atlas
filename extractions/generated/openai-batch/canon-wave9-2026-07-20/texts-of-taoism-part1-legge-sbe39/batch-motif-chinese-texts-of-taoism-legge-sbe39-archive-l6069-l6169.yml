canonical_text:
  quote: ''
  summary: The passage teaches that humility lets great and small states gain one
    another; identifies this as a favored Laozi theme illustrated by a low-lying stream;
    praises Tao as the most valuable thing, superior to courtly gifts and able to
    benefit both good and bad people; and describes Taoist practice as non-action,
    reversal of ordinary valuations, kindness in response to injury, and attending
    to difficult or great matters while they are still easy or small.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great state gains small states by condescending to them, while small states
    win over a great state by abasing themselves to it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great state wishes to unite and nourish people; the small state wishes
    to be received by and to serve the other; the great state is told that it must
    learn to abase itself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary names humility as the theme and notes an illustration from
    a low-lying stream to which smaller streams flow.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tao is said to have the most honoured place among all things, to enrich good
    men, and to guard or efface the ill of bad men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The words and deeds associated with Tao are said to purchase honour and raise
    their performer, and people who are not good are not abandoned by it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A courtly offering of a large round symbol of rank and a team of horses is
    said to be inferior to a lesson of Tao presented on the knees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ancients are said to have prized Tao because it could be obtained by seeking
    it, and because the guilty could escape the stain of guilt by it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The way of Tao is described as acting without thinking of acting, conducting
    affairs without trouble, tasting without discerning flavour, treating small as
    great and few as many, and recompensing injury with kindness.
  category: action
  evidence_refs:
  - ev:8
