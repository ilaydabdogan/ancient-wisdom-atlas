canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which Lao-jze travels west, is stopped
    by the pass-warden Yin Hs, writes a manuscript on the Tao and its characteristics,
    gives it to the warden, and departs into an unknown death or seclusion. It also
    notes a later tea-custom anecdote and surveys textual evidence for the Tao Teh
    Xing through quotations, library catalogues, and a teaching lineage from an old
    man on the Ho-side.
  language: English
  quote_policy: summarized
