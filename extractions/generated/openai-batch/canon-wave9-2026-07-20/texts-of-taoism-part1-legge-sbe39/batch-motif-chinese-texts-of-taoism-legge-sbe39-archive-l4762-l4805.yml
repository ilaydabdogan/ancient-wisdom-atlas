canonical_text:
  quote: ''
  summary: 'The passage presents Tao Te Ching chapter 37 with Legge''s notes: the
    Tao acts without deliberate action and thereby leaves nothing undone; rulers who
    maintain it allow all things to transform of themselves; desire is to be met by
    nameless simplicity, freedom from external aim, stillness, and absence of desire,
    so that things proceed rightly. The note identifies this as government according
    to the Tao, described as doing without doing and governing without government.'
  language: English
  quote_policy: summarized
