  quote: ''
  summary: Shui A#ii? asks Lao Tan how, if he does not govern the world, he can make
    people’s minds good. Lao Tan replies by warning against meddling with or disturbing
    people’s minds, describing the mind as moving between depression and exaltation,
    prisoner-like and wrathful states, softness and sharpness, heat like fire and
    cold like ice, and great swiftness. Footnotes identify a quotation from the Tao
    Teh Xing, ch. 13, and state that one personage is probably imaginary.
