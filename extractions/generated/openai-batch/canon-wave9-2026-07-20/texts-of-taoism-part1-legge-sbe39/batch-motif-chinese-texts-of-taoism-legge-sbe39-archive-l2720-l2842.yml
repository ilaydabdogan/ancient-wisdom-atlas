canonical_text:
  quote: ''
  summary: The passage discusses sparse and possibly legendary accounts of Lao-3ze,
    including his departure through a pass and uncertain death, then summarizes accounts
    of Kwang-3ze as a follower and writer in Lao-3ze's tradition. It includes anecdotes
    in which Kwang-3ze refuses royal office by comparing court service to a sacrificial
    ox, and later rejects a grand burial by naming heaven, earth, sun, moon, stars,
    and constellations as sufficient funerary provisions while accepting that creatures
    will consume his body.
  language: English
  quote_policy: summarized
