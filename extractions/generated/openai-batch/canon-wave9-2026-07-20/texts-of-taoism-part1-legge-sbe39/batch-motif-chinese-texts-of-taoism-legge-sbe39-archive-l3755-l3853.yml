canonical_text:
  quote: "“When things (in the vegetable world) have displayed their luxuriant growth,
    we see each of them return to its root.”"
  summary: The passage presents vacancy and stillness as practices aligned with the
    Tao, describes all things as returning to their root after activity and growth,
    and says knowledge of the unchanging rule leads through forbearance and community
    to kingliness, heaven-likeness, possession of the Tao, and endurance. Commentary
    explains these images through metaphors of an overflowing vessel, a worn garment,
    and beings receiving and reporting a charge from the Tao.
  language: English
  quote_policy: quoted
