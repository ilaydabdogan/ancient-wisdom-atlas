canonical_text:
  quote: ''
  summary: Khang Ki asks Kung-ni about Wang Thai of Lu, a man described as having
    lost both feet whose followers are numerous despite his not teaching or discoursing.
    Kung-ni calls Wang Thai a sage, says he would make him his teacher, and explains
    that life, death, cosmic upheaval, bodily loss, sensory distinctions, and ordinary
    differences do not disturb Wang Thai's fixed relation to what the translator's
    note identifies as the Tao.
  language: English
  quote_policy: summarized
