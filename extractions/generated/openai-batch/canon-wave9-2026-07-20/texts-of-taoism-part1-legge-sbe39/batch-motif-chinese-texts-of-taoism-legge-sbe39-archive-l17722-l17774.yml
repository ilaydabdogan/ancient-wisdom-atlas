canonical_text:
  quote: ''
  summary: The passage contrasts the careful preservation of a famous sword with the
    far-reaching, formless human spirit, called the Divinity in man. It says that
    pure simplicity preserves the Spirit and can become one with it in harmony with
    Heaven. A saying then contrasts gain, fame, and ambition with the sage’s valuing
    of essential purity, defining the True Man as one who embodies simplicity and
    purity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sword made at Kan-yiieh is described as preserved carefully in a box and
    not used because it is considered a perfected valuable sword.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The human spirit is described as going forth in all directions, flowing without
    limit, reaching heaven above, and wreathing round the earth beneath.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The human spirit is said to transform and nourish all things, to be unrepresentable
    by any form, and to be named the Divinity in man.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:4
  text: The path of pure simplicity is said to guard and preserve the Spirit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the path of pure simplicity is preserved and not lost, it becomes one
    with the Spirit and acts in harmony with the orderly operation of Heaven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A saying states that ordinary people value gain, pure scholars value fame,
    the wise and able value ambition, and the sage prizes essential purity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Simplicity is defined as that in which there is no admixture, and purity as
    that in which the spirit is not impaired.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The one who can embody simplicity and purity is called the True Man.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:9
  text: A note explains that the seaboard states of Wu and Yueh were famous for swords,
    and that Kan-yiieh appears to have been a place in Wu famous for weapons.
  category: setting
  evidence_refs:
  - ev:5
