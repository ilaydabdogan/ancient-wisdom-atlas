canonical_text:
  quote: ''
  summary: 3ze-kung proposes that a gardener use a wooden shadoof to raise water efficiently.
    The gardener rejects ingenious contrivances, linking them with scheming, loss
    of pure simplicity, and an unsettled spirit unfit for the Tao. He rebukes 3ze-kung
    for fame-seeking and for attempting to regulate the world without regulating himself.
    3ze-kung is ashamed and later tells his disciples that those who cleave to the
    Tao disregard success, praise, and blame; he compares himself to waves moved by
    wind. Confucius responds by saying the gardener only pretends to cultivate the
    arts of the Embryonic Age and lacks the sequel to his insight. The passage then
    begins a new episode in which Kun Mang, on the way to the ocean, meets Yiian Fung
    on the eastern sea shore, with a translator note comparing these names to other
    non-ordinary names in the preceding book.
  language: English
  quote_policy: summarized
