canonical_text:
  quote: ''
  summary: The passage gives Legge’s commentary on the Tao as an impersonal source
    and returning principle, then translates and comments on Tao Teh King chapters
    26-29. The chapters teach gravity and stillness, invisible skill that saves without
    rejecting, humility and return to simplicity, and the failure of active attempts
    to seize the spirit-like kingdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary says subordinate causes get their force or power from the Tao,
    describes the Tao as spontaneity evolving from itself, and discusses its flowing
    away and coming back.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chapter 26 states that gravity is the root of lightness and stillness is the
    ruler of movement.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The wise prince marches all day without going far from his baggage waggons
    and remains quietly in his proper place despite brilliant prospects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lord of a myriad chariots is said to lose his root if he acts lightly
    and to lose his throne if he proceeds to active movement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Chapter 27 lists skilled practitioners: a traveller who leaves no traces,
    a speaker who leaves no blame, a reckoner without tallies, a closer without bolts
    or bars, and a binder without strings or knots.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sage is said to be skilled at saving men and things and therefore casts
    away no man and no thing.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: The skilled person is described as a master for the unskilled, and the unskilled
    person as a helper of the skilled person’s reputation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chapter 28 describes one who knows manhood’s strength while maintaining female
    feebleness; many drains flow to him as to one channel, and he becomes again a
    simple child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same chapter describes one who knows white while keeping to black’s shade
    and one who knows glory while loving disgrace; he is compared to a spacious vale
    and is hailed as a simple infant man.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:10
  text: Unwrought material, when divided and distributed, forms vessels; the sage,
    when employed, becomes head of the officers and uses no violent measures in his
    greatest regulations.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chapter 29 says the kingdom is a spirit-like thing that cannot be obtained
    by active doing; one who tries to win or grasp it destroys or loses it.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:13
- id: obs:12
  text: 'Chapter 29 lists reversals in the course of things: front becomes behind,
