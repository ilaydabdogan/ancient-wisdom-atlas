canonical_text:
  quote: ''
  summary: This preface section evaluates translators and commentators of the Tao
    Teh Xing and the writings of Kwang-3ze/Chuang Tsze. It contrasts grammatical interpretation
    with Taoist philosophical interpretation, discusses Mr. Balfour’s reliance on
    explanations attributed to Lii Yen, describes a later Taoist commentary attributed
    to Immortals and Divine Rulers of the Eight Grottoes, notes a Taoist collection
    and a commentator possibly portrayed as a mountain recluse, praises Wai Khang’s
    commentary, and comments on Balfour’s pioneering translation of Kwang-3ze.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a Ji Chia commentator treats the Tao Teh Xing as a grammarian
    rather than as a philosopher, favoring syntactical construction over the philosophy’s
    own canons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Mr. Balfour used explanations of the Tao Teh Xing current
    as the work of Lii Yen, identified in the passage by several alternate names and
    called a Taoist of the eighth century.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that the narrator finds accounts of Lii Yen suspicious
    and much of them false, and notes that editions attributed to him are numerous
    and divergent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Thai Shang Hwun Hsiian Tao Teh Kan King is described as a later work that
    professes to be produced by the Immortals of the Eight Grottoes, each styled a
    Divine Ruler.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same commentary divides eighty-one chapters among the Immortals, except
    that the Divine Ruler called the Universal Refiner receives the last eleven chapters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The text of that commentary is said to be broken into short clauses explained
    by God, the True Helper, who is also associated with commentary on chapters 31
    to 40.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator presents the divine titles and attributions in the commentary
    as an example of later Taoism becoming polytheistic, while still judging the composite
    commentary to be good.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A recommendatory preface is ascribed to Wan K'ang, called the god of Literature,
