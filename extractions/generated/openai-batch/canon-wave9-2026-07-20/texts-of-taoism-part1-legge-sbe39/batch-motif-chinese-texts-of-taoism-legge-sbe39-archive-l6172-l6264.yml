canonical_text:
  quote: ''
  summary: The passage presents aphorisms from chapter 64 of the Tao Teh King about
    anticipating difficulty, acting before disorder appears, and recognizing that
    large things begin from small origins. It contrasts ulterior action and grasping
    with the sage’s non-ulterior conduct, care at the end as at the beginning, and
    support of natural development. The included notes describe this as a methodical
    Taoistic “doing nothing,” not absolute inactivity. The beginning of chapter 65
    states that ancient practitioners of the Tao made people simple rather than enlightened,
    and links excessive knowledge with difficulty in governing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that one who promises lightly keeps little faith, one who
    treats things as easy finds them difficult, and the sage sees difficulty even
    in what seems easy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translator’s note says the chapter describes the method of the Tao and
    the sage’s accomplishment of objects by forestalling difficulties; it also says
    Taoistic “doing nothing” is not absolute quiescence or inactivity.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chapter 64.1 says things at rest, things not yet showing signs, brittle things,
    and very small things are easier to handle before they become developed or disordered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Chapter 64.2 gives three examples of large outcomes arising from small beginnings:
    a tree from a tiny sprout, a nine-storey tower from a heap of earth, and a thousand-li
    journey from a single step.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chapter 64.3 says action with an ulterior purpose does harm and grasping in
    that way loses its hold; the sage does not act or grasp in that manner.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
