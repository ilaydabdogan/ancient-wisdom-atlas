canonical_text:
  quote: "“How do I know that the love of life is not a delusion ?”"
  summary: A questioner reports language about a sagely man detached from worldly
    affairs and asks Khang-wt 3ze about its relation to the Mysterious Way. Khang-wt
    3ze replies that such words are difficult, criticizes hasty interpretation through
    egg/cock and bow/dove images, describes the sagely man’s handling of uncertainty,
    time, and spontaneous things, and questions ordinary assumptions about life, death,
    dream, and waking through Li Ai and dream examples.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The reported language describes the sagely man as not occupying himself with
    worldly affairs, not pursuing profit or avoiding harm, not seeking, not caring
    to be found in an established Way, and speaking paradoxically.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The questioner says the Master treated the language as a shoreless flow of
    words, while the questioner thinks it describes the Mysterious Way and asks Khang-wt
    3ze for an opinion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khang-wt 3ze replies that the words would have perplexed Hwang-Ti, says the
    questioner is too hasty, and uses images of seeing an egg and expecting a cock
    and seeing a bow and expecting a roasted dove.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Khang-wt 3ze frames impossible cosmic language about standing beside the sun
    and moon and holding all space and time, then explains this as the sagely man
    keeping his mouth shut and putting aside uncertain and dark questions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sagely man is contrasted with people who bustle and toil; he seems stupid,
    blends ten thousand years together, and sees the myriad things as pursuing their
    spontaneous course.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Khang-wt 3ze asks whether love of life may be a delusion and dislike of death
    may resemble a young person losing the way while really going home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Li Ai is said to have wept when the ruler of Jin first got possession of her,
    but later regretted weeping after coming to the king’s place, sharing his couch,
    and eating rich meat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says people who dream of drinking may wake to wail and weep, while
    those who dream of wailing and weeping may wake and go hunting; only after waking
    do they know it was a dream.
  category: sequence
  evidence_refs:
  - ev:7
