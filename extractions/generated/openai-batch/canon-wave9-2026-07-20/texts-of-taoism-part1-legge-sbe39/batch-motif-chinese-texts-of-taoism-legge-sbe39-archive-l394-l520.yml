  summary: Legge’s preface explains the contents and translation history of the Taoist
    texts in this volume. It characterizes the Treatise of Actions and their Retributions
    as moral or ethical Taoism of the eleventh century, contrasts earlier Taoist works
    as philosophical, and lists later Taoist religious features such as monastic institutions,
    rituals, longevity practices, alchemy, immortality pills, elixir vitae, astrology,
    spirits, magic, purgatory, and hell. It also notes contacts and comparisons involving
    Buddhism, Confucianism, Christianity, and European scholarship.
  language: English
