  quote: ''
  summary: 'The passage summarizes practical Taoist ethics attributed to Lao: water
    and softness overcoming hardness, the three jewels of gentleness, economy, and
    not taking precedence, non-retaliation, political humility between states, aversion
    to war, and later historical decline of Taoism in relation to Confucianism and
    Buddhism.'
