- id: obs:1
  text: Toeless says Khung Zit has not attained to being a Perfect man, keeps disciples
    around him, seeks a reputation as extraordinary, and that the Perfect man treats
    such reputation as handcuffs and fetters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lao Tan asks why Khung Zit was not led to see life and death as unified and
    admissible and inadmissible as one category; Toeless answers that the condition
    is a punishment inflicted by Heaven and asks how he can be freed from it.
  category: speech
  evidence_refs:
  - ev:2
