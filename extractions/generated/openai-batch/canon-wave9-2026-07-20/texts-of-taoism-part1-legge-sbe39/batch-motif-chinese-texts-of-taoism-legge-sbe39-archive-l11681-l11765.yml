canonical_text:
  quote: ''
  summary: The passage first presents a dialogue about Khung Zit not yet being a Perfect
    man, his reputation and disciples being treated as fetters, and Lao Tan’s suggestion
    that unity of life and death and of admissible and inadmissible could free him.
    It then gives Duke Ai’s report of Ai-thai Tho, an ugly man whose family and ruler
    become strongly attached to him despite his lack of rank, wealth, rhetoric, or
    physical attractiveness. Kung-ni answers with an illustration of pigs leaving
    their dead mother when they perceive that the animating presence is gone.
  language: English
  quote_policy: summarized
