canonical_text:
  quote: I have become acquainted with the Tao.
  summary: The passage lists named figures who obtained or became acquainted with
    the Tao and gained cosmic placement, longevity, political office, or starry ascent.
    It then presents a dialogue in which Nan-po 3ze-khwei asks Nii Yii why, though
    old, he has a childlike complexion. Nii Yii attributes this to the Tao, says not
    everyone can learn it, and recounts teaching Pt-liang through staged mental renunciations
    until he could perceive individuality, pass beyond past and present, and penetrate
    the non-difference of life and death. The Tao is described as present amid both
    overthrow and completion and named Tranquillity amid Disturbances.
  language: English
  quote_policy: quoted
