  quote: sympathy between men and other creatures in their primal state
  summary: The passage is a translator/editorial notice discussing a book attributed
    to Kwang-3ze. It reports doubts about the book's genuineness, connected with its
    style and its description of sympathy between humans and other creatures in a
    primal state. The translator says the question cannot be adjudicated definitively
    and expresses surprise at the author's ideas about the primal state and condemnation
    of sages.
