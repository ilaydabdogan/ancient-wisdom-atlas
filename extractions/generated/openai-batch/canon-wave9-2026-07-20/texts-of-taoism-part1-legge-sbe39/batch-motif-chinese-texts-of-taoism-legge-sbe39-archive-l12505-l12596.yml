canonical_text:
  quote: ''
  summary: A transmission fragment is followed by a dialogue among four men about
    birth, death, nothingness, and the body. One of them, 3ze-yii, becomes ill and
    physically deformed but remains at ease. In conversation with 3ze-sze, he says
    he would not dislike further transformations of his body and spirit into useful
    forms, and he presents submission to the allotted time of life and death as a
    state in which joy and sorrow do not enter the mind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment lists a sequence in which one figure learned from another
    through several named predecessors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four named men are presented as talking together: 3ze-sze, 3ze-yii, 3ze-li,
    and 3ze-ldi.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker asks who can understand the head as made from nothing, the spine
    from life, the rump-bone from death, and death and birth as composing one body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The four men look at one another and laugh; none grasps the drift of the questions,
    but they remain friends together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Not long afterward, 3ze-yii falls ill and 3ze-sze visits to inquire after
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 3ze-yii attributes his deformed state to the Creator and is described as a
    crooked hunchback with displaced viscera, bent chin, elevated shoulder, an ulcer
    on his crown, and gasping breath.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Despite his condition, 3ze-yii is said to be easy in mind and not troubled
    by it; he limps to a well and looks at himself in it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When asked whether he dislikes his condition, 3ze-yii answers that he does
    not.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 3ze-yii imagines the Creator transforming his left arm into a cock, his right
    arm into a cross-bow, his rump-bone into a wheel, and his spirit into a horse.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 3ze-yii says that life has its time for action, death requires submission,
    and resting in what time requires prevents joy and sorrow from entering the mind.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage uses the image of loosing the cord by which life is suspended,
    but says one who is hung up cannot loose himself because he is held by bonds.
  category: speech
  evidence_refs:
  - ev:7
