canonical_text:
  quote: ''
  summary: A recluse rejects Hwang-Ti as unfit to hear the perfect Tao. Hwang-Ti withdraws
    from government, lives in solitary emptiness for three months, returns with ritual
    humility, and asks how to rule his body for long life. Kwang Kang-ze teaches that
    the perfect Tao is obscure, dark, silent, and approached by stillness, purity,
    sensory quiet, and guarding what is within. He describes cosmic regions called
    the Grand Brilliance, the Deepest Obscurity, the Unending, and the Illimitable,
    and claims long preservation of his body through unity and harmony. The passage
    then turns to Yiin Xiang encountering Hung Mung, who hops like a bird and says
    he is enjoying himself.
  language: English
  quote_policy: summarized
