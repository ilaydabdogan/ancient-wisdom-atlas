canonical_text:
  quote: ''
  summary: A brief notice explains the title and contents of Book XXV. It says the
    title comes from the opening characters, designating Phang Yang of Li, who seeks
    introduction to a king in order to offer counsel. The notice says the book later
    treats ordinary village opinion as insufficient to express the Tao, and states
    that even the name Tao is only a metaphorical term inadequate to the highest notion
    of it.
