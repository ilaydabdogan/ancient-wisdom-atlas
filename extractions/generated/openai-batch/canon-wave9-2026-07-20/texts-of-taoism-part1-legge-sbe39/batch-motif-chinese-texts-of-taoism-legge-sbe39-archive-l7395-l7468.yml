canonical_text:
  quote: ''
  summary: The passage explains the title and themes of Book V. It describes the fa
    as matching bamboo slips used to verify an agreement or covenant, interprets virtue
    as the characteristics of the Tao made evident in a person's influence, summarizes
    figures with lost feet or deformities whose inward serenity and teaching are not
    impaired, notes descriptions of the Tao as free from falsehood and as author of
    transformations, discusses a dispute between Hui-3ze and Kwang-3ze, and reports
    a faint comparison with Mencius on the superior man.
  language: English
  quote_policy: summarized
