    Tao.”"
  summary: The passage quotes La Sha-#ih’s commentary, which interprets the book’s
    episodes as illustrating Doing Nothing, the contrast between the heavenly and
    the human, the difficulty of knowing the human mind, the dangers of opposing Heaven,
    and Kwang-3ze’s harmony with Heaven.
