canonical_text:
  quote: ''
  summary: 'The passage contains translator commentary comparing a Han Ying passage
    and an Analects-related conversation about recompensing injury with kindness.
    It then quotes contrasting responses by three disciples and Confucius''s evaluation
    of them. The excerpt continues into a chapter on life and death: people come forth
    and live, enter again and die; groups of three in ten are described as ministers
    of life, ministers of death, or seekers of life whose movements lead to death
    because of excessive life-preserving efforts. It ends with the beginning of a
    statement about a person skilled in managing life travelling without needing to
    avoid a rhinoceros.'
  language: English
