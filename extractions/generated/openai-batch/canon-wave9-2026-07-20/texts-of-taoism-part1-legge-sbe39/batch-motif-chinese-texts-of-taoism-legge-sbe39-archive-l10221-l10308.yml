canonical_text:
  quote: there is the great awaking, after which we shall know that this life was
    a great dream
  summary: The passage presents a discourse in which life is described as a dream
    known only after a great awakening; disputants cannot settle right and wrong by
    partisan adjudication; conflicting opinions are to be harmonized through the invisible
    operation of Heaven and by appeal to the Infinite. It then begins a dialogue in
    which the Penumbra asks the Shadow why it lacks stability, and the Shadow replies
    that it follows the movements of something else.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says that after a great awakening people will know that life was
    a great dream, and adds that the speaker, the addressee, and A#iti are all dreaming.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker argues that winning a discussion does not by itself prove that
    the winner is right and the loser wrong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says no proposed adjudicator can resolve the matter if the adjudicator
    agrees with one side, disagrees with both, or agrees with both.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says the harmonising of conflicting opinions is found in the invisible
    operation of Heaven and by following this into the unlimited past.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker contrasts affirmation with denial and assertion with rejection,
    then says to forget time and the conflict of opinions and appeal to the Infinite.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Penumbra asks the Shadow why it is without stability, since it formerly
    walked and now has stopped, and formerly sat and now has risen.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Shadow replies that it waits for the movements of something else in order
    to do what it does, and that this something else waits further on something else.
  category: relationship
  evidence_refs:
  - ev:5
