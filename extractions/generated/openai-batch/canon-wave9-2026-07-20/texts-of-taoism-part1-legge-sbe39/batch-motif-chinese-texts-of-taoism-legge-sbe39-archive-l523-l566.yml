canonical_text:
  quote: ''
  summary: The preface describes the translator's earlier work on versions of Laozi's
    text, the publication and criticism of F. H. Balfour's Taoist Texts, H. A. Giles's
    challenge to the genuineness of the Tao Teh Xing, the translator's reply and continued
    confidence in the text as a relic of Laozi, and the Chinese edition and commentary
    used for the published translation.
  language: English
  quote_policy: summarized
