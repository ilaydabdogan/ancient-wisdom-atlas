canonical_text:
  quote: ''
  summary: A bodily deformed poor man is presented as still able to support himself.
    Then Confucius is approached by Khieh-yi, called the madman of X03, who addresses
    him as a Phoenix and warns him about virtue, public danger, and the need to preserve
    life in disordered times. The speech ends with images of mountains, trees, grease,
    fire, cinnamon, and varnish, arguing that usefulness can lead to damage while
    uselessness has an overlooked advantage.
  language: English
  quote_policy: summarized
