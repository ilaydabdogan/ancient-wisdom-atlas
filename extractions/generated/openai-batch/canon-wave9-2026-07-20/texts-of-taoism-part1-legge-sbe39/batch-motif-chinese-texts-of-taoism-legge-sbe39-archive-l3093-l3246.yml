canonical_text:
  quote: ''
  summary: 'The passage first describes Taoist popular worship, Yi Hwang Shang Ti
    as a deified heavenly figure who receives reports on human conduct, later Taoist
    manifestoes with purgatorial and hell imagery, and temples administered by Taoist
    monks. It then gives the opening chapters of the Tao Teh King: the Tao is beyond
    fixed naming, is described as originator and mother of all things, is approached
    through desirelessness and mystery, and is followed by a teaching on paired opposites,
    non-action, wordless instruction, and unclaimed accomplishment.'
  language: English
  quote_policy: summarized
