canonical_text:
  quote: ''
  summary: A frog in a dilapidated well describes its confined pleasures to a turtle
    of the Eastern Sea; the turtle describes the sea’s immeasurable extent and unchanging
    waters, leaving the frog terrified and amazed. The speaker then rebukes Kung-sun
    Lung with analogies of inadequate tools or small creatures attempting vast tasks,
    describes A wang-jze as ranging between Yellow Springs and the Empyrean, and warns
    with a story of learners who lose their old skill without acquiring a new one.
    Kung-sun Lung departs speechless. In a separate anecdote, Kwang-3ze fishes in
    the river Pha when officers from the king of Ati offer him charge over the realm;
    he refuses by preferring the living tortoise dragging its tail in mud over an
    honored dead tortoise-shell in a temple.
  language: English
  quote_policy: summarized
