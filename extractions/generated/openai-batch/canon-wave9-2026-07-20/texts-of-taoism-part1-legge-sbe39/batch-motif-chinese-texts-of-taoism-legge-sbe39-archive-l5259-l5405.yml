canonical_text:
  quote: ''
  summary: The passage links disregard of the Tao with militarized borderlands and
    contrasts ambition, discontent, and acquisitiveness with enduring contentment.
    It then presents knowledge of the far-off without outward travel, daily diminution
    rather than accumulation, non-action that nevertheless accomplishes, and a sage
    who takes the people's mind as his own, responds with goodness and sincerity to
    all, and treats the people as children.
  language: English
  quote_policy: summarized
