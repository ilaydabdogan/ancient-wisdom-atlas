canonical_text:
  quote: Acting without action is what is called Heaven(-like).
  summary: The passage describes ancient rulers or sages who, by stillness, lack of
    desire, and non-action, allow the world to be sufficient and transformed. The
    Master teaches that the Tao pervades and sustains all things, defines qualities
    of the Superior man, and depicts the sage as indifferent to wealth, rule, long
    life, early death, prosperity, and poverty. A later section describes the Tao
    as still and pure, uses metal and stone as examples of latent sound, and connects
    bodily life and manifested attributes to the Tao.
  language: English
  quote_policy: quoted
