canonical_text:
  quote: ''
  summary: The passage introduces Book XXXII, titled from the surname and name of
    Lieh-jze. It discusses textual overlap with a paragraph in writings ascribed to
    Lieh-jze, questions about Lieh-jze's historical existence and dating, possible
    relations between Lieh-jze material and Kwang-3ze, and a brief statement that
    Lieh's master Wa-sin judged him not to have fully attained the Tao.
  language: English
  quote_policy: summarized
