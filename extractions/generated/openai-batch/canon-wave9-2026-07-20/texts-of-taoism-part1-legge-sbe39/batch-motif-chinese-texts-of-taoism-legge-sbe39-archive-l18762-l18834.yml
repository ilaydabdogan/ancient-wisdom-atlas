canonical_text:
  quote: ''
  summary: Two anecdotes are presented. In the first, Hui-yze, a minister in Liang,
    fears that Kwang-3ze has come to replace him and searches for him; Kwang-3ze answers
    with a parable of the Young Phoenix and an owl guarding a putrid rat. In the second,
    Kwang-3ze and Hui-yze debate whether Kwang-3ze can know the enjoyment of fishes
    seen from the Hao dam.
  language: English
  quote_policy: summarized
