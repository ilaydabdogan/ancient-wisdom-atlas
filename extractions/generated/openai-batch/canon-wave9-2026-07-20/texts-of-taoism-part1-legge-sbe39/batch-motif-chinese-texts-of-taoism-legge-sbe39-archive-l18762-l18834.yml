    see him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed person tells Hui-yze that Kwang-3ze has come wishing to supersede
    him in office; Hui-yze becomes afraid and searches for the stranger throughout
    the kingdom for three days and three nights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kwang-3ze describes a southern bird called the Young Phoenix that flies from
    the South Sea toward the north.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Young Phoenix is said to rest only on bignonia, eat only the fruit of
    the melia azederach, and drink only from the purest springs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: An owl possessing a putrid rat screams angrily when a phoenix passes overhead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kwang-3ze applies the owl image to Hui-yze’s possession of Liang, asking whether
    Hui-yze wishes to frighten him in the same way.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kwang-3ze and Hui-yze walk on the dam over the Hao while thryssas or fishes
    come out and play at ease.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hui-yze challenges Kwang-3ze’s claim to know the enjoyment of fishes because
    Kwang-3ze is not a fish.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kwang-3ze replies by questioning how Hui-yze can know what Kwang-3ze does
    or does not know, and concludes that he knows the fishes’ enjoyment from being
    with Hui-yze over the Hao.
  category: speech
  evidence_refs:
