canonical_text:
  quote: The still mind of the sage is the mirror of heaven and earth, the glass of
    all things.
  summary: The passage praises vacancy, stillness, quietude, silence, and non-action
    as the level, root, and origin of heaven, earth, Tao, sagehood, rulership, harmony,
    and the Joy of Heaven. It compares still water to the sage’s mind, links stillness
    and movement with sagehood and kingship, and states that those who know the Joy
    of Heaven act like Heaven in life and undergo transformation at death.
  language: English
  quote_policy: quoted
