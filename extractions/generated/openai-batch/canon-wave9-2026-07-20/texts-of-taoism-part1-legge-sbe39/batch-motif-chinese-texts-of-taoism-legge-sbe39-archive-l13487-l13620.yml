canonical_text:
  quote: That which is the perfectly correct path is not to lose the real character
    of the nature with which we are endowed.
  summary: The passage argues that extraordinary sensory, moral, and debating capacities
    become excessive when they depart from the natural constitution. It uses examples
    of duck and crane legs, extra toes and fingers, tools, fastenings, ceremonies,
    and music to argue against artificial alteration of what is naturally so.
  language: English
  quote_policy: quoted
