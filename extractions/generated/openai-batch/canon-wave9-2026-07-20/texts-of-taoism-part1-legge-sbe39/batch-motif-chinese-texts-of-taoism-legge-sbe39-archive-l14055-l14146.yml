canonical_text:
  quote: ''
  summary: The passage argues that regulations and principles associated with sages
    can protect or enable thieves and great robbers. It gives examples of four worthy
    men who suffered violent deaths, then presents a robber explaining that successful
    robbery has its own versions of sageness, bravery, righteousness, wisdom, and
    benevolence. The passage concludes that sage-principles benefit few and injure
    many, using proverbs and images of causal dependence to claim that when sages
    arise, great robbers also arise.
  language: English
  quote_policy: summarized
