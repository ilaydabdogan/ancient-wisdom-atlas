canonical_text:
  quote: ''
  summary: The passage warns that words can be like wind-driven waves that obscure
    the real point and provoke quarrels. It cites rules for an intermediary, telling
    him not to exceed instructions or force a settlement because this imperils negotiations.
    It then advises the addressee to accept the circumstances of his position, nourish
    a central course through unavoidable obligations, and be prepared to sacrifice
    his life in fulfilling the charge identified in a note with the Tao rather than
    a political ruler.
