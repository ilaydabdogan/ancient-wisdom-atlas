canonical_text:
  quote: "“In the morning I will give you three (measures) and in the evening four.”"
  summary: The passage uses the parable of a monkey keeper changing the stated order
    of an acorn ration to show that opposed responses may rest on an underlying sameness.
    It then describes ancient views about the beginning of things and argues that
    definite opinions and preferences injure the doctrine of the Tao. It gives examples
    of highly skilled specialists whose arts or arguments remained partial and obscure.
  language: English
  quote_policy: quoted
