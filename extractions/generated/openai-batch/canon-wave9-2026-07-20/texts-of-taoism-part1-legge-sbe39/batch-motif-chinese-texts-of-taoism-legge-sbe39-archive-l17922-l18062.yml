canonical_text:
  quote: ''
  summary: 'The passage contrasts the world’s estrangement from the Way with the hidden
    virtue of sagely and retired scholars, who preserve the Way by stillness, self-rectification,
    and freedom from anxiety rather than by worldly rank. It then opens the section
    on the autumn floods: the Ho River swells with incoming streams, its spirit-lord
    rejoices in his apparent greatness, travels east to the North Sea, and is humbled
    by the sea’s expanse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The world and the Way are described as having become lost to each other, so
    that the Way is not conspicuous in the world and the world does not appreciate
    the Way.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sagely men may not be physically hidden in hills and forests, yet their virtue
    is described as hidden because of the world’s condition, not because they seek
    concealment.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The persons called Retired Scholars did not conceal their persons, words,
    or knowledge, but the conditions of the times prevented appropriate action.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When circumstances permitted, the Retired Scholars would restore unity; when
    circumstances blocked action, they deepened their roots, remained still, waited,
    and preserved the Way in themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ancients who preserved the Way did not rely on sophistical reasoning,
    totalizing knowledge of the world, or comprehensive grasp of all virtues; they
    sought restoration of their nature.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
