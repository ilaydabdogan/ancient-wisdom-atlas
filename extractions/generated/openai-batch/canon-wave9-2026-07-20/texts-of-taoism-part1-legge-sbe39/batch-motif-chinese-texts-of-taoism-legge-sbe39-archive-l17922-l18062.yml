  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the time of the autumn floods, the hundred streams discharged into the
    Ho River, making its current greatly swollen.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The swollen river is described as so broad that, across the channel, an ox
