canonical_text:
  quote: ''
  summary: The passage opens Legge's introduction by questioning whether Taoism is
    older than Lao-jze. It situates Taoism among China's 'Three Teachings,' notes
    the relative antiquity of Confucianism and Taoism, describes Confucius as a transmitter,
    gives Lao-jze's likely birth date and meetings with Confucius, and argues that
    the Tao Teh Xing refers to earlier sages and maxims. It also describes Lao-jze's
    view of distant antiquity as a happy, innocent society in which rulers were barely
    known to the people.
  language: English
  quote_policy: summarized
