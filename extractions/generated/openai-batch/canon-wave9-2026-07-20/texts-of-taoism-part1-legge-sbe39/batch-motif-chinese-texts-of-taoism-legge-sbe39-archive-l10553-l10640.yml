  quote: ''
  summary: Yen Hui asks Kung-ni for permission to go to Wei because its ruler is reckless,
    the people are suffering, and he hopes to apply teachings to cure the state's
    evils. Kung-ni warns that such intervention is dangerous unless the method is
    unmixed and rooted first in oneself; he says virtue can be dissipated by pursuit
    of reputation and wisdom can become a weapon of contention.
  language: English
  quote_policy: summarized
