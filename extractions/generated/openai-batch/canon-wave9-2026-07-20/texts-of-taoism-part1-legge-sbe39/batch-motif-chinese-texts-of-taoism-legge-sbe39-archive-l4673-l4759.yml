canonical_text:
  quote: "“The soft overcomes the hard; and the weak the strong.”"
  summary: The passage describes the holder of the Great Image of the invisible Tao
    as attracting the world and giving people safety, rest, peace, and ease. It contrasts
    ordinary pleasures with the Tao, which seems flavorless and unimpressive yet has
    inexhaustible use. A second section describes reversal-patterns in which a prior
    opposite action precedes an intended action, names this “Hiding the light,” states
    that soft and weak overcome hard and strong, and warns that fishes should remain
    in the deep and state-profit instruments should not be shown to the people.
  language: English
  quote_policy: quoted
