  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that without the listed qualities supplied through the
    One, heaven would rend, earth would break and bend, spirits would fail, valleys
    would be parched, creatures would pass away, and rulers would decay.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dignity is described as rooted in previous meanness, and loftiness as stabilized
    by lowness.
  category: relationship
  evidence_refs:
  - ev:4
