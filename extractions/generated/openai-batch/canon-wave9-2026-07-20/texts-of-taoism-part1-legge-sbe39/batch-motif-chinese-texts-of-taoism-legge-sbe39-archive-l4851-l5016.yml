  summary: The passage contrasts solid fruit with flimsy flower, describes heaven,
    earth, spirits, valleys, living creatures, and rulers as dependent on the One
    or Tao, explains dignity through lowliness and rulerly humility, and states that
    the Tao moves by contraries and that existence arises from non-existence.
  language: English
