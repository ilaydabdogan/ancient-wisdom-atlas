canonical_text:
  quote: ''
  summary: A questioner asks a nameless man about governing the world. The nameless
    man rejects active contrivance, describes wandering beyond the cardinal points
    in nonentity, and advises pure simplicity, blending with primary ether, naturalness,
    and absence of selfish consideration. Yang 3ze-Kii asks Lao Tan whether an alert
    and intelligent student of the Tao can be compared with intelligent kings. Lao
    Tan contrasts such contrivance with the unobtrusive rule of intelligent kings,
    whose influence benefits all without being attributed to them. The passage closes
    by introducing a mysterious wizard in Aang.
  language: English
  quote_policy: summarized
