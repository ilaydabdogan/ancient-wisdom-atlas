canonical_text:
  quote: such freedom is the fasting of the mind.
  summary: Yen Hui asks Kung-ni for a method. Kung-ni distinguishes ordinary sacrificial
    fasting from the fasting of the mind, defined through unity of will, non-reliance
    on ordinary hearing, and freedom from preoccupation. Hui reports a change in his
    former self, and Kung-ni gives further counsel using images of an enclosure, no
    other door or medicine, wingless flight, an empty room filled with light, and
    spiritual intelligences dwelling within. The passage then begins a new episode
    in which the duke of Sheh asks Kung-ni about a royal mission.
  language: English
  quote_policy: quoted
