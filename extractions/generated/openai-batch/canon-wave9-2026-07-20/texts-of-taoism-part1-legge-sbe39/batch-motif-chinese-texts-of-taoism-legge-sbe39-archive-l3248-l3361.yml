  quote: ''
  summary: The passage contains introductory commentary and translated portions of
    Tao Te Ching chapters 3-5. It frames antinomies as analogues of Taoist contraries,
    describes the sage's rule as reducing rivalry, desire, knowledge, and action,
    depicts the Tao as empty like a vessel and primordial before ordinary lineage,
    and compares heaven-earth and sage-rule to grass-dogs and to an empty but productive
    bellows.
