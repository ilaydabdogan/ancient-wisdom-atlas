canonical_text:
  quote: ''
  summary: Yen Hui tells Kung-ni that he has progressed to sitting and forgetting,
    explaining this as dissolution of bodily connection, discarding perception, leaving
    form and knowledge, and becoming one with the Great Pervader. Kung-ni praises
    the transformation and asks to follow him. A second episode tells of 3ze-yii visiting
    his friend 3ze-sang after ten days of rain, bringing rice, hearing his mixed song
    and wail, and receiving 3ze-sang's explanation that his poverty and extremity
    are appointed rather than caused by parents, Heaven, or Earth acting unkindly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hui says he has lost all thought of ceremonies and music, and the Master replies
    that this is good but not enough.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On a later day, Hui says he is making progress and describes it as sitting
    and forgetting everything; Kung-ni asks what he means.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hui explains that his connection with the body and its parts is dissolved,
    his perceptive organs are discarded, he leaves material form, bids farewell to
    knowledge, and becomes one with the Great Pervader.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kung-ni says that one with the Pervader is free from likings, transformed,
    and impermanent; he says Hui has become superior to him and asks leave to follow
    his steps.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 3ze-yii and 3ze-sang are described as friends.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After ten days of continuous rain, 3ze-yii fears that 3ze-sang may be in distress,
    wraps some rice, and goes to give it to him to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At 3ze-sang's door there are sounds between singing and wailing, a lute is
    struck, and words invoke Father, Mother, Heaven, and Men; the voice cannot sustain
    itself and the line is hurried.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: 3ze-sang says he has tried in vain to understand why he has been brought to
    extremity, asks whether parents, Heaven, or Earth would have made him poor unkindly,
    cannot identify a cause, and concludes that his state is appointed for him.
  category: speech
  evidence_refs:
  - ev:6
