canonical_text:
  quote: ''
  summary: 'A translator''s notice summarizes themes in Kwang-3ze''s second book:
    Tao as the remedy for controversy, a non-personal Tao, epistemic limits about
    creation and ultimate causes, human experience as dream or illusion, and the concluding
    butterfly dream in which Kwang-3ze cannot determine whether he dreamt he was a
    butterfly or a butterfly is dreaming it is him.'
  language: English
  quote_policy: summarized
