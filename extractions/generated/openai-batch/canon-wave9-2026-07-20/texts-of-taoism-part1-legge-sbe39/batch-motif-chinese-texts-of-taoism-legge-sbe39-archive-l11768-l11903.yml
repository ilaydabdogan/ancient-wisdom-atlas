canonical_text:
  quote: ''
  summary: The passage describes Ai-thai Tho as trusted and loved without speech or
    service, then presents Duke Ai questioning ung-ni about complete powers and their
    unmanifested realization. The reply defines complete powers as harmony undisturbed
    by changing circumstances, using still water and seasonal language as examples.
    Duke Ai reports that the teaching has changed his view of rulership. The passage
    then gives two examples of physically deformed counselors pleasing rulers, concluding
    that extraordinary virtue can cause bodily form to be forgotten and that the sagely
    person rests in inner enjoyment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ai-thai Tho is described as believed without speaking, loved without performing
    special service, and sought for government appointments.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Duke Ai asks what it means for a person's powers to be complete, and ung-ni
    answers by listing paired conditions such as death and life, ruin and preservation,
    poverty and wealth, and cold and heat as changes of circumstance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The reply says these changing circumstances should not disturb the harmony
    of the nature or enter the treasury of intelligence.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Complete powers are characterized by continuous harmony and satisfaction,
    unbroken pleasure of mind day and night, and relations with external things described
    as always spring-time and seasonally appropriate.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The unmanifested realization of these powers is explained through the example
    of a level pool of still water that preserves peace within its circuit and receives
    no agitation from without.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the conversation, Duke Ai tells Min-jze that his former understanding
    of sovereign duty may not be the real one and that he may risk the ruin of his
    state by employing himself too lightly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Duke Ai says that he and Khung XZid are not merely ruler and subject but are
    in a virtuous friendship.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: An unnamed person with no lips, bent legs, and other deformity counsels Duke
    Ling of Wei, who is pleased with him and thereafter regards a perfectly formed
    man as comparatively lean and small-necked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another unnamed person with a large goitre like an earthenware jar counsels
    Duke Hwan of KAi, who is pleased with him and thereafter regards a perfectly formed
    man as comparatively lean and small-necked.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that when virtue is extraordinary, bodily deficiency may
    be forgotten; it also describes the sagely man as finding enjoyment in his mind
    and regarding wisdom as shoots from an old stump and agreements as glue.
  category: speech
  evidence_refs:
  - ev:8
