  quote: ''
  summary: A dialogue passage uses examples of implements, animals, political succession,
    and paired cosmological terms to argue that functions and judgments differ by
    circumstance. The earl of the Ho asks how to choose what to do or reject, and
    Zo of the Northern Sea answers from the standpoint of the Tao, warning against
    fixed distinctions and advising impartial regard for all things amid continual
    change.
  language: English
  quote_policy: summarized
