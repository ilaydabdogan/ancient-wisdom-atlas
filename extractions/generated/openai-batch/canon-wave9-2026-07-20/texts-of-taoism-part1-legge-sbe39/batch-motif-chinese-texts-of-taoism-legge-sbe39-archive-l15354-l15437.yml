canonical_text:
  quote: After a thousand years, tired of the world, he leaves it, and ascends among
    the immortals.
  summary: A critique of a knowledge-driven and inconstant ruler is followed by an
    episode in which Yao meets the border-warden of Hwa. The warden blesses him with
    long life, riches, and many sons; Yao declines these as sources of fears, troubles,
    and obloquy. The warden counters that a sage can distribute offices and wealth
    appropriately, live without fixed attachment, cultivate virtue in disorder, and
    after a thousand years leave the world, ascend among the immortals on white clouds,
    and reach the place of God.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening passage describes a man whose plans would take effect with the
    speed of fire, who would be enslaved by his own initiatives, respond to things
    and public opinion, change as things changed, and lack constancy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same man is said to be unfit to be the correlate of Heaven; his government
    would lead to disorder, calamity for a minister, and ruin for a sovereign.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yao is looking about at Hwa when the border-warden addresses him as a sage
    and asks a blessing of long life for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The border-warden goes on to wish riches and many sons for Yao, while Yao
    repeatedly says “Hush.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yao says that many sons bring many fears, riches bring many troubles, and
