- id: obs:2
  text: The Tao is described as having emotion and sincerity, doing nothing, and having
    no bodily form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tao may be handed down by a teacher and apprehended by the mind, but it
    may not be received by scholars and cannot be seen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tao is said to have its root and ground in itself and to have existed
    securely before heaven and earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
