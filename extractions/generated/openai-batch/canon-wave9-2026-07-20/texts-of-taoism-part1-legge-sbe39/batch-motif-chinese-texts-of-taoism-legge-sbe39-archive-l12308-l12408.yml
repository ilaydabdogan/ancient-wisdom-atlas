canonical_text:
  quote: ''
  summary: The passage presents bodily existence as undergoing many transformations
    and describes the sagely person as accepting death, old age, beginning, and ending
    as good. It then identifies the Tao as formless, self-grounded, apprehensible
    but unseen, prior to heaven and earth, and the source of spirits, God, heaven,
    and earth. It lists several named figures or celestial powers that obtained the
    Tao and thereby regulate cosmic order, dwell in sacred places, rule mountains
    or rivers, or ascend to the cloudy sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The human body is said to come from a special mould and to undergo myriad
    transformations; the sagely person treats early death, old age, beginning, and
    ending as good.
  category: attribute
  evidence_refs:
