canonical_text:
  quote: ''
  summary: A dialogue reports that Wang 12 did not know how to answer four questions,
    leading to praise of an earlier mode of simplicity and untroubled knowledge. A
    second dialogue criticizes rule by imposed regulations and praises sage government
    through personal correctness, illustrated by impossible-task similes and by bird
    and mouse analogies. A fragment begins with Thien Kan traveling south of mount
    Yin toward the Lido-water.
  language: English
  quote_policy: summarized
