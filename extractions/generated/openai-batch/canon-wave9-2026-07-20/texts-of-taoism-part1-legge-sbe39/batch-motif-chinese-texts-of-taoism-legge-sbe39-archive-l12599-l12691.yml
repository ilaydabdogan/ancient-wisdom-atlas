canonical_text:
  quote: "“We are born as from a quiet sleep, and we die to a calm awaking.”"
  summary: The passage presents 3ze-lai dying while his household wails; 3ze-li tells
    them not to disturb him as he passes through a change and asks what the Creator
    may make him become. 3ze-lai replies that one should submit to Yin and Yang, treats
    nature as the support of life and death, and uses images of metal casting, womb-forming,
    and a cosmic melting-pot to accept whatever form follows. A second episode names
    three friends who speak of effortless association and wandering in the sky and
    mists beyond limits; they laugh and remain friends, and later 3ze-sang Hi dies
    before burial is mentioned.
  language: English
  quote_policy: quoted
