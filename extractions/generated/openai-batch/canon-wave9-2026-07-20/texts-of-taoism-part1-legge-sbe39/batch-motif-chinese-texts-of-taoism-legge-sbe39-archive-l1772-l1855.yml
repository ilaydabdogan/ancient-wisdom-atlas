canonical_text:
  quote: ''
  summary: Legge distinguishes Taoist uses of Thien/Heaven from Confucian and English
    theological uses, arguing that early Taoist texts do not use Thien as a personal
    God. He cites Kwang-jze examples in which mystical beings or masters of the Tao
    are addressed as Heaven, and he references Lao's statement that the Tao may precede
    Ti. A footnote reports a later tradition describing Kwang Khang-3ze as an old
    immortal living on a hill in a rocky grotto.
  language: English
  quote_policy: summarized
