canonical_text:
  quote: ''
  summary: The passage introduces the True Man as the condition for True knowledge,
    then describes the True men of old as uncalculating, without self-complacency,
    able to ascend heights and pass through water and fire unharmed, deeply and silently
    breathing, indifferent to pleasant food, free from anxiety and fear of death,
    accepting life and returning to the state before life without resisting the Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there must be the True Man and then there is True
    knowledge, after a question about whether the Heavenly and the Human are distinct.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The True men of old did not reject the views of the few, did not seek heroic
    accomplishment before others, and did not lay plans to attain their ends.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The True men could make mistakes without repentance and succeed without self-complacency.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The True men could ascend the loftiest heights without fear, pass through
    water without being made wet, and go into fire without being burnt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that by their knowledge the True men ascended to and reached
    the Tao.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The True men of old did not dream when asleep, had no anxiety when awake,
    did not care whether food was pleasant, and breathed deeply and silently.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The breathing of the True Man is described as coming from his heels, while
    men generally breathe from their throats.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men defeated in argument are described as having words come from their gullets
