  quote: ''
  summary: The passage presents an ideal of plain living in an isolated small state,
    then Chapter 81 aphorisms contrasting sincere and ornate speech, Tao-skill and
    disputation, knowledge and extensive learning. It describes the sage as non-accumulating,
    giving to others yet possessing more, and links the Way of Heaven and the sage
    with non-injury and non-striving. Translator notes frame the chapters as simplicity
    and contraries and compare the giving aphorism with Bunyan and Kwang-jze analogues.
  language: English
  quote_policy: summarized
