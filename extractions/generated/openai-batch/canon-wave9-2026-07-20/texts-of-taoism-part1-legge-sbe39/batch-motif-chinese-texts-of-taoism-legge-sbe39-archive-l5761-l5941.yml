canonical_text:
  quote: ''
  summary: Chapters 55-58 describe the person endowed with Tao as infant-like, protected
    from harmful creatures and marked by bodily harmony; the knower of Tao as silent,
    closed, softened, and beyond ordinary social valuations; government by non-action
    as preferable to coercion, weapons, legislation, and contrivance; and the sage
    as non-injuring, straightforward, and undazzling amid the reversals of misery
    and happiness, good and evil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who has abundant attributes of the Tao is compared to an infant and
    is said not to be stung, seized, or struck by poisonous insects, fierce beasts,
    or birds of prey.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The infant is described as having weak bones and soft sinews but a firm grasp.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The infant is described as not yet knowing the union of male and female, while
    still showing signs taken to indicate perfection of physical essence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The infant is described as able to cry all day without the throat becoming
    hoarse, which the passage takes as showing harmony in its constitution.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Knowing harmony is said to show the unchanging Tao and to establish wisdom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Life-increasing arts are said to turn to evil, and making the vital breath
    burn is described as false strength.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Things that become strong are said then to become old; whatever is contrary
    to the Tao is said soon to end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that one who knows the Tao does not care to speak about
    it, while one ready to speak about it does not know it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The knower of Tao is described as keeping the mouth shut and closing the portals
    of the nostrils.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The knower is said to blunt sharp points, unravel complications, temper brightness,
    and agree with obscurity; this is called the Mysterious Agreement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Such a person is described as beyond familiarity and distance, profit and
    injury, nobility and meanness, and as the noblest person under heaven.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage contrasts ruling a state by correction and using weapons with
    crafty dexterity against making the kingdom one's own through freedom from action
    and purpose.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Multiplication of prohibitions, profit-making implements, crafty dexterity,
    and legislation are each associated with worsening poverty, disorder, strange
    contrivances, and theft or robbery.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A sage is quoted as saying that doing nothing, keeping still, taking no trouble,
    and manifesting no ambition will allow the people to transform, become correct,
    become rich, and attain primitive simplicity of themselves.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Government that seems unwise is said to supply goodness, while meddling government
    brings ill and disappointment.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Misery and happiness are described as lying beside or beneath each other,
    and correction and good are said to turn into distortion and evil.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The sage is compared to a square that cuts no one and a corner that injures
    no one; he is straightforward without license and bright without dazzling.
  category: attribute
  evidence_refs:
  - ev:13
