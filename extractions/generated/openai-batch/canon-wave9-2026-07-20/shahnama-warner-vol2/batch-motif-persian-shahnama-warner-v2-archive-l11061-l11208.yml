canonical_text:
  quote: ''
  summary: After Sudaba's accusation against Siyawush, Kai Kaus seeks counsel. The
    archmages advise an ordeal by fire, saying heaven will not allow the innocent
    to be harmed. Kai Kaus orders two great piles of firewood made and ignited. Siyawush,
    wearing white and prepared as for burial, prays to God for passage through the
    fire and rides his black steed into the flames while the people grieve and Sudaba
    looks on hostilely.
  language: English
  quote_policy: summarized
