canonical_text:
  quote: ''
  summary: Rustam battles the White Div in a cave, kills him, removes his liver, and
    returns with it to Shah Kai Kaus. Ulad asks Rustam to keep his promise, and Rustam
    reaffirms it. Rustam reports the demon's death; Kai Kaus praises him and orders
    the White Div's blood applied to his own and his people's eyes, restoring their
    sight. Kai Kaus is placed on an ivory throne as monarch of Mazandaran, then sends
    forces through the land against warlocks and divs before calling for a letter
    to the monarch of Mazandaran.
  language: English
  quote_policy: summarized
