canonical_text:
  quote: ''
  summary: Afrasiyab and Siyawush arrange teams for a mounted ball game. Siyawush
    excels at play, restrains Iranian teammates to avoid strife, then proves his strength
    and skill with bow and mounted archery. Afrasiyab praises him, feasts with him,
    sends royal gifts, commands respect for him, and invites him to hunt.
  language: English
  quote_policy: summarized
