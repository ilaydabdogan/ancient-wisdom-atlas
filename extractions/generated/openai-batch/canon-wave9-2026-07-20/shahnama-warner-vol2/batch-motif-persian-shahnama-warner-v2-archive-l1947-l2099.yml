canonical_text:
  quote: ''
  summary: A praise of Mazandaran rouses Kai Kaus to plan an expedition there. The
    Iranian nobles fear war with the divs and secretly decide to summon Zal for counsel.
    A messenger carries their urgent plea to Zal, who resolves to advise the Shah
    despite expecting Kaus may be headstrong. Zal travels to court, is honored by
    the leaders, and declares that wise counsel must not be withheld from the Shah.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Words praising a fair land of joy and golden adornment rouse Kai Kaus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kai Kaus resolves to lead a host against Mazandaran and tells his warriors
    that, since he surpasses former rulers in fortune, Grace, and birth, he must surpass
    them in prowess also.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nobles dislike the plan, turn pale and frown, and do not wish to fight
    the divs, but they publicly declare themselves the Shah's slaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The nobles meet privately and say the Shah's words, if acted on, will ruin
    Iran; they cite earlier rulers who did not attack Mazandaran.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tus proposes sending a cameleer in haste to Zal so that Zal may offer wise
    counsel and tell the Shah that Ahriman prompted the plan.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The nobles' message says that the portal of the divs must never be opened.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A cameleer travels toward Nimruz and delivers the nobles' urgent message to
    Zal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The messenger says the Shah desires treasure where he has not toiled and would
    sit enthroned in Mazandaran.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Zal grieves, calls Kaus headstrong, and says he will go and offer his advice;
    if Kaus remains headstrong, Rustam will be among the troops.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At sunrise Zal prepares and journeys toward the Shah, escorted by chiefs.
  category: action
  evidence_refs:
  - ev:8
