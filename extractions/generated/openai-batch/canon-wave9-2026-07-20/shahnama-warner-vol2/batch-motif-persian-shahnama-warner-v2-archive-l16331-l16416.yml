canonical_text:
  quote: "“to-night is born Shah Kai Khusrau!”"
  summary: Piran persuades the king not to kill Farangis, shelters her in Khutan,
    dreams of radiant Siyawush announcing Kai Khusrau’s birth, and then sees the extraordinary
    newborn prince and vows to protect him from Afrasiyab.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A speaker warns the king that harming his pregnant child would bring curses
    and Hell, and asks that Farangis be sent to his abode until the child is born.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king accepts the proposal and says he has ceased wishing to shed Farangis’s
    blood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Piran rejoices, rescues Farangis at the court-gate, curses the guards, and
    carries her unhurt to Khutan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At his palace, Piran tells Gulshahr to harbor and attend Farangis until she
    gives birth, after which he will devise a plan.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Time passes, and the Moon, an epithet used for Farangis, approaches delivery.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On a dark and moonless night while animals sleep, Piran dreams of a splendour
    brighter than the sun and sees Siyawush enthroned with a sword.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the dream, Siyawush tells Piran to wake, think of the future, and celebrate
    because Shah Kai Khusrau is born that night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Piran wakes Gulshahr, reports the dream, and sends her to minister to Farangis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gulshahr finds the prince already born and returns joyfully to Piran, calling
    the sight a miracle and saying the babe lacks only crown, mail, mace, and lands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Piran visits the royal babe, praises the Almighty for the child’s stature,
