canonical_text:
  quote: ''
  summary: Piran persuades Afrasiyab that Kai Khusrau is harmless and obtains a royal
    oath that the boy will not be harmed. He then instructs Khusrau to feign senselessness
    before the king. Khusrau is outfitted with royal signs and brought to Afrasiyab,
    who questions him; Khusrau gives unrelated answers. Afrasiyab concludes that he
    is a fool, spares him, and orders him sent to his mother at Siyawushgird with
    provisions and protection from harmful teachers. Piran rejoices that the danger
    has passed.
  language: English
  quote_policy: summarized
