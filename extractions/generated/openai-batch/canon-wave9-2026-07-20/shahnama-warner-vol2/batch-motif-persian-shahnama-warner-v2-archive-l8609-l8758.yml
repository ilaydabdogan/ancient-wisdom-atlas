    sire, yet Rustam refuses the request to reveal his name.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The excerpt gives Suhrab's suspicion and speech but does not complete
    a recognition scene or explicitly confirm biological identity within the selected
