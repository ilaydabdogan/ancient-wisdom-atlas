canonical_text:
  quote: ''
  summary: The passage opens with counsel on the mortality of all people, including
    former exalted monarchs, and a message that Zal should continue serving the world-monarch.
    It then narrates the dawn encounter between Rustam and Suhrab. Suhrab notices
    the opponent's resemblance to himself and suspects that he may be Rustam, his
    father. Suhrab proposes peace, wine, repentance, and disclosure of lineage, but
    Rustam rejects the proposal and insists on wrestling. Suhrab overthrows Rustam
    and prepares to behead him, but Rustam claims a martial custom forbids execution
    on the first fall. Suhrab lets him go, pursues an antelope, and is reproached
    by Human for sparing a dangerous foe.
  language: English
  quote_policy: summarized
