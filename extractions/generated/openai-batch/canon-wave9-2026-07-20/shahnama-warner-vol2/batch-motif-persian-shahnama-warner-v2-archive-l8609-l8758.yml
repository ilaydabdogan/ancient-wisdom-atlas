- id: motif:2
  label: Heroic arming at dawn before single combat
  taxonomy_refs: []
  basis: Rustam arms at sunrise in a tiger-skin cuirass, mounts his dragon-steed,
    and enters a prepared battlefield; Suhrab also arrays himself in mail and carries
    an ox-head mace.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: This is a recurrent epic scene pattern, but the passage itself only supplies
    the immediate arming details.
- id: motif:3
