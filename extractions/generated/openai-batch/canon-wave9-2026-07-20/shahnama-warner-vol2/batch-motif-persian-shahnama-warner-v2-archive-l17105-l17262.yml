canonical_text:
  quote: ''
  summary: 'The passage describes an Iranian war of vengeance after Siyawush: Rustam
    musters forces, Faramarz leads the van into Turan, confronts and kills Warazad
    of Sipanjab, beheads him while invoking Siyawush, burns his land, and reports
    to Rustam. A messenger informs Afrasiyab, who recalls an old prophecy, equips
    his forces with treasure and weapons, and orders his son Surkha to fight while
    warning him about Rustam.'
  language: English
  quote_policy: summarized
