canonical_text:
  quote: '"The sire in anguish and the son exhausted."'
  summary: Suhrab asks whether his opponent is Rustam and requests the truth about
    his parentage. Rustam denies being Rustam. The two then fight in an exhausting
    duel with successive weapons and grappling. The narrator identifies them as father
    and son and laments that humans may fail to recognize their own children. Rustam
    marvels at Suhrab's prowess, comparing the duel unfavorably to fighting the White
    Div. Suhrab wounds and mocks Rustam. Each hero attacks the other side's army,
    causing bloodshed. At twilight Rustam proposes that they resume at daybreak to
    learn the Maker's will, and the combatants return to camp.
  language: English
  quote_policy: quoted
