canonical_text:
  quote: ''
  summary: Giv recounts a reciprocal marriage alliance, boasts of his lineage and
    strength, declares that he is bearing royal Kai Khusrau toward Iran for enthronement,
    threatens Piran, then uses a feigned retreat to draw Piran away from the stream
    and host. Giv lassos and binds Piran, takes his flag, returns to the bank, and
    routs the Turkmans single-handedly.
  language: English
  quote_policy: summarized
