canonical_text:
  quote: ''
  summary: A royal correspondent offers the prince refuge, wealth, royal honors, protection,
    and escort, while warning him about difficult travel across the sea. Zanga carries
    the sealed letter and gifts. Siyawush then writes to Kai Kaus about his distress,
    past ordeals, and uncertain future, and gives command of the host and its goods
    to Bahram, with instructions concerning Tus. He selects a smaller retinue and
    informs the nobles that Piran has crossed the river on secret business from Afrasiyab.
  language: English
  quote_policy: summarized
