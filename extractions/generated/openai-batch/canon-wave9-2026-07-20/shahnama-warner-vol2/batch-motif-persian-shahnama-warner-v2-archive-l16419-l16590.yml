canonical_text:
  quote: ''
  summary: A child is praised for beauty, royal Grace, and likeness to Faridun. The
    king repents of prior wrongdoing but fears a prophecy that a noble king from the
    seed of Tur and Kai Kubad will arise and receive homage in Iran and Turan. He
    orders that the child be sent away from home to mountain shepherds and kept ignorant
    of his birth. Piran entrusts Kai Khusrau to shepherds from Mount Kalur, sends
    a nurse, and commands strict protection. As the boy grows, his strength and hunting
    prowess reveal his noble birth. A shepherd complains that the boy now fights fierce
    beasts. Piran recognizes his high birth, brings him a horse and royal robes, takes
    him to the palace, and cares for him anxiously. Afrasiyab later summons Piran
    and worries that one of Faridun's race is being raised as a shepherd-swain.
  language: English
  quote_policy: summarized
