canonical_text:
  quote: ''
  summary: Piran secures Afrasiyab's approval for the marriage of Farangis and Siyawush,
    arranges gifts and a bridal procession through Gulshahr, and the marriage is formalized
    by custom, faith, and a witnessed contract. Farangis is adorned and brought to
    Siyawush; their union is celebrated for a week. Afrasiyab then grants Siyawush
    gifts, a province, a silk patent, and royal insignia, followed by feasting, public
    generosity, and the opening of dungeons.
  language: English
  quote_policy: summarized
