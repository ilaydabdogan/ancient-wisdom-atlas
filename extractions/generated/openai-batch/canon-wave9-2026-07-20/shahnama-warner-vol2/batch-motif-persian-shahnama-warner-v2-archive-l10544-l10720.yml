canonical_text:
  quote: ''
  summary: Siidaba/Stidaba attempts to persuade Siyawush to swear a compact with her,
    offering her daughter, herself, and later royal treasures. She embraces and kisses
    him, but he resists out of loyalty to the Shah and fear of evil conduct, proposing
    instead that her daughter would suffice and asking that the matter remain secret.
    Siidaba reports to Kaus that Siyawush chose her daughter; Kaus rejoices and assigns
    treasures for Siyawush. Siidaba then plans to use guile and, if rejected, to accuse
    him before the king. On a later visit she again offers wealth and love, and threatens
    to ruin his hope of reigning if he refuses.
  language: English
  quote_policy: summarized
