canonical_text:
  quote: ''
  summary: Rustam compels a sorcerous div disguised as stone to reveal his form. Kai
    Kaus has the div and other divs executed, gathers and distributes booty, thanks
    the Lord for victory, rewards Rustam, and invests Clad as ruler of Mazandaran.
    Kaus then returns to Iran amid public celebration, grants further gifts and Nimruz
    to Rustam, assigns offices and lands to chieftains, and the realm is described
    as flourishing under justice and security.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker sets a guard and orders a sorcerer to abandon black arts and sorceries,
    take his proper shape, or have the stone broken with steel and battle-ax.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sorcerer hears the threat, the stone dissolves like mist; a king
    in helmet and cuirass is seen, and Rustam seizes his hand while joking that the
    rock feared his ax.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shah sees the revealed figure as unfit for crown and throne, with a loathly
    face, lanky shape, and boar's head, neck, and tusks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kai Kaus orders the div hewn in pieces, and other impious divs are beheaded
    by the Shah's command and thrown beside the way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Booty from the camp is gathered, including thrones, crowns, girdles, steeds,
    jewelry, and arms; the troops receive shares according to their due.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kaus prays to the righteous Judge, credits victory over the sorcerers and
    the revival of his fortune to divine favor, and spends a week in prayer.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: On the eighth day Kaus opens the treasury and gives to those who lack; later
    he calls for cups and spends a night in revel while rethroned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kaus tells Rustam that Rustam has displayed prowess everywhere and that Kaus
    has received his throne from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rustam says his success was due to Clad, his faithful guide, and asks that
    Clad be granted investiture by covenant and seal as monarch of Mazandaran.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Shah assents, summons chiefs from Mazandaran, tells them not to bear a
