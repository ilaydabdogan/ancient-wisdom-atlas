  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Piran praises Siyawush's stature, gentleness, culture, counsel, propriety,
    prowess, wisdom, noble birth, and royal quality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Piran says Siyawush quarrelled with his father to save a hundred nobles' lives
    and gave up the throne and crown to lesser men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Piran advises Afrasiyab to send Siyawush a letter, prepare a dwelling, honor
    him, give him a princess as wife, and cherish him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Afrasiyab answers with an adage that a fostered lion's whelp will turn on
    its keeper when its teeth and claws are grown.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Piran argues that Siyawush has not inherited his father's ill nature and that,
