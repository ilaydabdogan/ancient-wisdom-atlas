canonical_text:
  quote: ''
  summary: The passage recounts Siyawush's painful parting from loyal followers, his
    instruction that Zanga tell Afrasiyab he will keep his covenant despite losing
    royal prospects, Zanga's embassy to Afrasiyab, Afrasiyab's private consultation
    with Piran, Piran's advice to honor and incorporate Siyawush through hospitality
    and marriage, Afrasiyab's hesitation expressed through a lion's-whelp proverb,
    and the beginning of a written response invoking the Maker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two chieftains weep at the prospect of parting from the prince and fearing
    they will not see him again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zanga declares that he and another speaker are slaves of their leader, love
    him, and offer their souls and bodies as ransom while promising loyalty until
    death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Siyawush tells Zanga to inform Afrasiyab that the peace has brought him a
    lot of war, but that he will keep his covenant even if he loses the throne.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Siyawush describes God as his refuge, heaven as his covering, and the ground
    as his throne, and asks for a cistern where he may be apart from reports of his
    father's evil nature and anger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Zanga travels with a hundred noble horsemen, bearing hostages and goods from
    the prince's court to Afrasiyab's city.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tuwurg welcomes Zanga; Afrasiyab embraces him, seats him by the throne, and
    receives the letter and message.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Afrasiyab summons Piran privately and discusses Kai Kaus's words, nature,
