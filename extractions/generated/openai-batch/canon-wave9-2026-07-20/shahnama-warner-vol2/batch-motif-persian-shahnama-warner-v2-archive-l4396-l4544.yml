canonical_text:
  quote: ''
  summary: The passage combines editorial notes and narrative. In the note, Kai Kaus
    is tempted to aspire beyond earthly kingship, loses divine Glory, and is spared
    from destruction by the fravashi of the unborn Kai Khusrau, which appeals to Kai
    Khusrau's future role against Turan. The note also mentions underground dwellings
    associated with Kai Kaus, an Iblis/Ahriman naming issue, and a comparison of the
    Fight of the Seven Warriors to a Chevy Chase-type border foray. The narrative
    then recounts Kai Kaus's royal progress, conquest and settlement of Barbar through
    tribute and lawgiving, his stay with Rustam in Zabulistan, a rebellion in Misr
    and Sham, and Kaus's naval expedition toward Hamavaran, where Misr, Barbar, and
    Hamavaran gather a vast army.
  language: English
  quote_policy: summarized
