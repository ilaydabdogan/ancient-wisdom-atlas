canonical_text:
  quote: ''
  summary: Kai Kaus sends forth the host with the flag of Kawa, reviews and blesses
    the warriors, and tearfully parts from Siyawush. Siyawush marches through Zabulistan,
    joins Zal and Rustam, gathers forces, reaches Balkh, defeats the opposing commanders,
    enters the city, and writes Kai Kaus a victory letter praising God and asking
    whether to cross the Jihun against Afrasiyab.
  language: English
  quote_policy: summarized
