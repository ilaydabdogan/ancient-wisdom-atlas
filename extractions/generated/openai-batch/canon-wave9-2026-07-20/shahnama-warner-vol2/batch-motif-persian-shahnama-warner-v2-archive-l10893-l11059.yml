canonical_text:
  quote: ''
  summary: Sudaba bribes an unnamed woman to induce abortion and conceal the matter
    so that the dead children can support a false charge connected with Siyawush.
    The woman obeys, gives birth to two children described in demonic terms, and Sudaba
    places them on a golden salver while raising a public lament. Kaius investigates,
    summons astrologers, and orders the woman found and questioned. The astrologers
    deny royal parentage for the children and associate them with the witch and Ahriman,
    while Sudaba continues to accuse Siyawush and appeals to further judgment.
  language: English
  quote_policy: summarized
