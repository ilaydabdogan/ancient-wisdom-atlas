  text: After pardon, Kaus's scattered troops gather, he sits crowned on a golden
    throne, gives a donative, and is described as reforming the world and becoming
    a light to great and small.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Illustrious chiefs from the provinces renew allegiance and come to Kaus's
    court; princes attend him as he sits on a jewel-work throne with crown and ox-head
