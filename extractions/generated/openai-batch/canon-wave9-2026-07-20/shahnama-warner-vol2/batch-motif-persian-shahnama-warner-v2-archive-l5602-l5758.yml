  evidence_refs:
  - ev:1
- id: obs:2
  text: Kaus weeps, calls on God, refuses palace and courtly activity, prays in the
    dust for forty days, gives largess, and is forgiven by God.
  category: action
  evidence_refs:
  - ev:1
