canonical_text:
  quote: ''
  summary: 'Kaus accepts reproof, performs prolonged penance before God, is forgiven,
    and resumes kingship with renewed allegiance from chiefs. The passage then introduces
    the story of Rustam and the warriors: after a feast at Nawand, Giv proposes a
    hunt in Afrasiyab''s preserves in Turan; Rustam agrees, the party hunts for a
    week, and Rustam warns that Afrasiyab may respond with counsel, ruse, and battle,
    so an outpost is needed.'
  language: English
  quote_policy: summarized
