  - ev:7
  confidence: high
  cautions: The horse's recognition is explicit; broader royal-legitimacy interpretation
    should be reviewed in context of the surrounding epic.
- id: motif:3
  label: royal Grace marks the hero
  taxonomy_refs:
  - royal_legitimacy
  basis: Giv describes Kai Khusrau as possessing divine Grace and Kaian stature, and
    says God has given him worth, birth, throne, stature, state, and Grace.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The extraction relies on the translation's wording 'Grace divine' and
