comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Afrasiyab's expected pursuit to the White
    Div, supporting a cautious same-function comparison between a human enemy-pursuer
    and a demonic pursuer image.
  claim_level: same_function
  target: White Div / demonic pursuer image
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is a simile in Farangis's warning; it does not make
    Afrasiyab literally a div.
- id: claim:2
  claim: Giv's fear that Bihzad may be Ahriman in the likeness of a horse supports
    only a cautious comparison to demonic disguise or shapeshifter patterns.
  claim_level: same_function
  target: shapeshifter or demonic-disguise motif family
  evidence_refs:
  - ev:9
  - ev:11
  counter_evidence_refs:
  - ev:5
  - ev:7
  - ev:10
  confidence: low
  limitations: The narrative evidence identifies Bihzad as Siyawush's steed and later
    shows Khusrau controlling him; the demonic reading belongs to Giv's mistaken anxiety.
- id: claim:3
  claim: The repeated contrast between God-given Grace and Ahriman/div imagery aligns
    the episode with a duality pattern of divine favor versus demonic hostility.
  claim_level: same_function
  target: duality motif family
  evidence_refs:
  - ev:3
  - ev:9
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses the terms in speeches and reactions; broader doctrinal
