- id: motif:5
  label: demonic pursuit and hostile land
  taxonomy_refs:
  - duality
  basis: Farangis compares Afrasiyab's expected pursuit to the White Div and calls
    the land the abode of Ahriman; Giv later fears Ahriman has appeared as a horse
