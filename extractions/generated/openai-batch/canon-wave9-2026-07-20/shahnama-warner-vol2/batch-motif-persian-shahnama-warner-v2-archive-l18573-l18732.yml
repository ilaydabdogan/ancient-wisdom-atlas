  - ev:6
  confidence: high
  cautions: The passage emphasizes flight and concealment rather than a formal exile
    ritual.
- id: motif:2
  label: destined horse recognizes the rightful rider
  taxonomy_refs:
  - royal_legitimacy
  basis: Siyawush commands Bihzad to become Khusrau's charger, and Bihzad later recognizes
    Kai Khusrau as a master when shown the saddle and reins.
  evidence_refs:
  - ev:5
