- id: motif:4
  label: mountain meadow as refuge and meeting place
  taxonomy_refs:
  - ascent
  basis: Farangis directs Kai Khusrau to a mountain meadow with streams, and Kai Khusrau
    and Giv travel toward the heights seeking safety before meeting Bihzad at the
    stream.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The mountain is a refuge and route in this passage, not explicitly a cosmic
