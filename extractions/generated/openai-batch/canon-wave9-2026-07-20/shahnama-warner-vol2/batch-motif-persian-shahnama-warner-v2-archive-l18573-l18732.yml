canonical_text:
  quote: ''
  summary: Kai Khusrau travels with Giv, learns of Kai Kaus's grief and Giv's long
    hardships, and treats Giv as a fatherly helper. At Siyawushgird, Farangis advises
    secret flight from Afrasiyab and directs Khusrau to a mountain meadow where Bihzad,
    Siyawush's black steed, will be found. Khusrau shows the saddle and bridle, the
    horse recognizes him, mourns Siyawush, and accepts him. Bihzad carries Khusrau
    swiftly, causing Giv to fear a demonic deception, but Khusrau later reveals that
    he knew Giv's thoughts, and Giv blesses him as divinely endowed with royal Grace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kai Khusrau and Giv depart from the wood while Kai Khusrau asks about Shah
    Kai Kaus and Giv's seven years of hardship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Giv reports the vision of Gudarz, his own long toil, and the desolation and
    grief surrounding Kai Kaus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kai Khusrau grieves at the report, tells Giv that fate gives him rest after
    travail, asks him to be as a father, and tells him to keep silent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the journey to Siyawushgird, Giv goes before Kai Khusrau with an Indian
    sword and kills anyone who meets them, covering the bodies with earth and dust.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Siyawushgird, Kai Khusrau and Giv make Farangis a confidant and agree privately
    to leave unnoticed by the troops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Farangis warns that Afrasiyab will pursue them like the White Div and that
    the land is full of enemies and is the abode of Ahriman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Farangis instructs Kai Khusrau to go at dawn to an out-of-the-way meadow near
    a cloud-covered mountain, carrying a saddle and black bridle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Farangis describes a meadow with rivulets and streams where herds water at
    noon, and tells Kai Khusrau to show the saddle and bridle to Bihzad.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Farangis recounts that Siyawush freed Bihzad to remain on mountains and meadows
    until Khusrau came, at which point Bihzad was to become Khusrau's charger.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kai Khusrau and Giv travel toward the heights seeking safety, and Kai Khusrau
    shows Bihzad the saddle and reins at the stream.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bihzad looks at Kai Khusrau, recognizes a master, gazes at Siyawush's riding
    gear, remains still, and weeps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kai Khusrau and Giv weep with Bihzad, curse Afrasiyab, and Kai Khusrau caresses,
