- id: obs:1
  text: Siyawush says he cannot fight Garsiwaz because such a contest could harm their
    good relations, and he asks that another champion be chosen if combat is required.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Garsiwaz asks the Turkmans who will face Siyawush; the Turkmans are silent
