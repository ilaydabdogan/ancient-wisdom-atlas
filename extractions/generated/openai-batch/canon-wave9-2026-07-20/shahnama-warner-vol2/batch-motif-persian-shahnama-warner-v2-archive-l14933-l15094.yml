canonical_text:
  quote: ''
  summary: Siyawush refuses to fight Garsiwaz directly, defeats two Turanian champions
    without lethal weapons, and later sends a submissive letter and gifts. Garsiwaz,
    angered by the humiliation of the warriors, returns to Afrasiyab and privately
    accuses Siyawush of disloyalty, invoking old conflict and the image of fire and
    water. Afrasiyab is troubled and recalls his prior trust, gifts, and kinship ties
    with Siyawush.
  language: English
  quote_policy: summarized
