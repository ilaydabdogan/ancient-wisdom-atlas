canonical_text:
  quote: ''
  summary: In the Mazandaran campaign, the king of sorcerers brings out his host.
    Kai Kaus arrays the Iranian forces with named commanders, while Rustam leads.
    Juya, a noble of Mazandaran, challenges the Iranians; the army hesitates until
    Rustam asks permission to fight. Rustam rides Rakhsh, exchanges taunts with Juya,
    and kills him with a spear. The opposing king orders a general battle. The armies
    fight amid dust, darkness, drums, weapons, and blood. After a week, Kaus removes
    his royal casque, prostrates himself before the Judge and Guide, prays for victory
    over the divs, then returns to battle and renews the assault with his commanders
    and Rustam.
  language: English
  quote_policy: summarized
