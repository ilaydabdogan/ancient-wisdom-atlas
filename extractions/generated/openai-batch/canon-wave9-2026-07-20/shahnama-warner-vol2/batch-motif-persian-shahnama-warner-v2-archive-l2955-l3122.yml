canonical_text:
  quote: ''
  summary: Ulad confronts Rustam after a watchman reports trouble in the preserves.
    Rustam taunts him, attacks and routs his force, captures Ulad with a lasso, and
    demands guidance to Kai Kaus and the White Div. Ulad describes the long and dangerous
    route through gorge, cavern, mountain guards, rocks, river, div-hosts, and war
    elephants. Rustam laughs at the danger and asks Ulad to guide him to Kai Kaus.
  language: English
  quote_policy: summarized
