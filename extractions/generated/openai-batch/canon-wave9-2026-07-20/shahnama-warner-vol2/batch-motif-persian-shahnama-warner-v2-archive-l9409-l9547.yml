canonical_text:
  quote: ''
  summary: News reaches Samangan and Tahmina that Suhrab has fallen in battle, killed
    by his father's sword. Tahmina mourns with extreme bodily grief, laments that
    Suhrab sought his father and did not use the token she gave him, handles his crown,
    throne, horse, clothing, armor, weapons, and other possessions, distributes his
    goods, desolates the palace, and dies after a year. Bahram then speaks a moral
    reflection on not clinging to the dead and preparing for one's own departure,
    since life is temporary and death is summoned by God.
  language: English
  quote_policy: summarized
