canonical_text:
  quote: '"Sprout from the razed roots of a noble Tree"'
  summary: An unnamed figure equips Kai Khusrau with treasure, regalia, and blessing,
    then sends him and Farangis to the seat built by Siyawush. The city, formerly
    overgrown with thorns, receives them joyfully. The people praise Kai Khusrau as
    a shoot from Siyawush's ruined lineage, and the passage describes renewal around
    Siyawush's blood-soaked dust as an evergreen memorial tree. A gnomic reflection
    follows on the instability of the world and the sky's reversals, then the narration
    turns toward vengeance and Giv's removal of Kai Khusrau from Turan.
  language: English
  quote_policy: quoted
