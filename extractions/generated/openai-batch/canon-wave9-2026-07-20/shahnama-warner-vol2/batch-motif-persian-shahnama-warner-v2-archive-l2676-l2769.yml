canonical_text:
  quote: How Rustam fought with a Dragon
  summary: In the third course, a dragon from a deadly waste repeatedly approaches
    while Rustam sleeps. Rakhsh wakes him several times, first earning Rustam's anger
    because the dragon remains unseen in the gloom. On the third warning, the dragon
    roars and breathes fire; Rakhsh again alerts Rustam, the dragon becomes visible,
    and Rustam challenges it. The dragon claims the waste as its ancient domain, Rustam
    gives his lineage, and combat begins, with the outcome not included in the supplied
    excerpt.
  language: English
  quote_policy: quoted
