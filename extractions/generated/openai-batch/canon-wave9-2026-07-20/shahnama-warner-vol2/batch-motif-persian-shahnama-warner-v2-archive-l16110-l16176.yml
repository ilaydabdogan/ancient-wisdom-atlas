canonical_text:
  quote: ''
  summary: Garsiwaz signals Gurwi, who humiliates and drags the bound prince Siyawush.
    Siyawush prays to God for a future offspring who will avenge him and restore order.
    Pilsam follows in grief and receives Siyawush's farewell message for Piran. Gurwi,
    given a dagger by Garsiwaz, executes Siyawush at the former shooting-bout mark,
    catches his blood in a golden basin, and empties it where commanded. A plant springs
    from the blood and is named the Blood of Siyawush. After the killing, a dark tempest
    obscures the sun and moon, and the people curse Gurwi.
  language: English
  quote_policy: summarized
