canonical_text:
  quote: ''
  summary: Suhrab surveys the Iranian camp from enclosure to enclosure and asks Hajir
    to identify the chiefs by their tents, thrones, troops, animals, and standards.
    Hajir names the Shah, Tus, Gudarz, Giv, Fariburz, and Guraza, but conceals Rustam’s
    identity by saying the warrior in the green enclosure is an unnamed ally from
    Chin. The narrator emphasizes fate, and Suhrab continues seeking signs of his
    father.
  language: English
