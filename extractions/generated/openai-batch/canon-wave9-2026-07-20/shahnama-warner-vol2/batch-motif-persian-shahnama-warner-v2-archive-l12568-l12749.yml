canonical_text:
  quote: '"I will go look / For some retreat to hide me from the Shah."'
  summary: Siyawush privately consults Bahram and Zanga. He recounts Sudaba's hostility,
    the war with Turan, the treaty with Afrasiyab, and his fear that obeying Kai Kaus's
    renewed command to fight would violate oaths sworn by God. He orders Zanga to
    return the hostages and treasures to Afrasiyab, assigns Bahram charge of the army
    until Tus arrives, hears Bahram's contrary advice, and finally refuses the counsel,
    choosing to leave the camp rather than shed blood unjustly.
  language: English
  quote_policy: quoted
