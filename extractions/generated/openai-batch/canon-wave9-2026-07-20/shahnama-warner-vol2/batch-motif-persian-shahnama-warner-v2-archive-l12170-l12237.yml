canonical_text:
  quote: ''
  summary: Garsiwaz sends a swift messenger to Afrasiyab reporting that Siyawush will
    end the war only if hostages are given. Afrasiyab anxiously considers the political
    and military risk, selects about one hundred kinsmen as hostages, sends them with
    gifts to Siyawush, and withdraws his forces from several cities. Rustam is reassured
    by the retreat. Siyawush prepares rich departure gifts for Garsiwaz, who leaves
    with blessings.
