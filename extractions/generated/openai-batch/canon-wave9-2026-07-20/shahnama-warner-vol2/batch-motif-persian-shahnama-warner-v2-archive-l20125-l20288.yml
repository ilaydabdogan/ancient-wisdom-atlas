canonical_text:
  quote: ''
  summary: Gudarz and Tus dispute the succession. Kai Kaus avoids choosing directly
    between the candidates and declares that the throne will go to whoever captures
    the Castle of Bahman. Tus and Fariburz march there but fail because the fortress
    is inaccessible and surrounded by burning heat associated with Ahriman. Kai Khusrau
    then proceeds toward the castle with royal display and dictates a letter invoking
    God, royal Grace, and opposition to Ahriman or sorcerers.
  language: English
  quote_policy: summarized
