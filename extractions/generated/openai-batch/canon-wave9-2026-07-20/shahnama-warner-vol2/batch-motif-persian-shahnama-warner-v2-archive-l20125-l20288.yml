- id: obs:1
  text: Gudarz threatens violence against Tus if he had weapons and accuses Tus of
    making discord among the Kaians for selfish ends.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tus replies by asserting that he is Tus, son of Naudar, a Shah and a Shah's
    son, and boasts that his spear could rend the centre of Mount Kaf.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gudarz advises Kai Kaus to call the noble youths before him, judge which has
    royal mien and Grace divine, and give that one the crown and throne.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kai Kaus says both candidates are dear to him and that choosing one may cause
    the other to seek vengeance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kai Kaus orders both candidates, each with a host, to go to the Castle of
    Bahman and says he will give the throne to the one who captures it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Castle of Bahman is described as near the entrance of Ardabil, where Ahriman
    is continually making war on those who worship fire and where no archimages dare
    settle.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tus and Fariburz go before the Shah, and Tus announces that he will take drums,
    host, elephants, and Kawa's flag.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kai Kaus states that victory in war depends on the purpose of the Lord of
    sun and moon, not on the number of men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tus marches with Kawa's standard, troops, and elephants, while Fariburz is
    positioned at the army's centre.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Near the Castle of Bahman, the ground seems to breathe fire, lance-points
    flame in the heat, warriors are scorched under mail, and the air is likened to
    a net of rebel Ahriman.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The castle ramparts rise to heaven, and Tus says there is no known approach
    to the castle.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tus tells Fariburz that neither Fariburz nor anyone else can take the hold.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Tus and Fariburz go around the castle for seven days, find no entrance, and
