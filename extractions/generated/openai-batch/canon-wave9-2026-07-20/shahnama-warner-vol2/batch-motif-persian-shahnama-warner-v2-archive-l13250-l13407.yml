canonical_text:
  quote: ''
  summary: A prince, Siyawush, is reassured by a powerful paladin-counsellor and travels
    to Gang, where Afrasiyab receives him with embraces, speeches of peace, royal
    hospitality, a palace, banquets, gifts, and a planned polo display of prowess.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed paladin and counsellor claims high rank, troops, kinsmen, lands,
    war-gear, and treasure, offering all as ransom if the prince will stay, and swearing
    by Holy God to serve and protect him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince rejoices, eats with the speaker, grows like sire and son with him,
    and travels in high spirits to Gang, the Turkman monarch's abode.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Afrasiyab descends on foot to meet Siyawush; Siyawush dismounts and runs to
    him; the two embrace and kiss each other's head and eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afrasiyab says that evil is now asleep, war and tumult will cease, deer and
    pard will drink together, and peace has been restored by Siyawush.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Siyawush blesses Afrasiyab's race with justice and praises the Lord, Maker
    of the soul, from whom peace, battle, and revenge come.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Afrasiyab sits hand in hand with Siyawush on a throne and praises his stature,
    looks, and kingly Grace, then criticizes Kaius for losing sight of such a son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Afrasiyab selects and furnishes a palace for Siyawush with gold cloth, a gold
    throne, and brocade, and bids him live there contentedly.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: After a banquet and drinking-bout, Siyawush returns home gleefully and in
    his cups forgets Iran, while Afrasiyab cannot sleep for thinking of him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Afrasiyab orders Shida, his kinsmen, and high-ranking paladins to take gold-caparisoned
    steeds and other gifts to Siyawush; warriors present gold coins, royal gems, greetings,
    and further royal gifts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Afrasiyab proposes polo, saying that no warrior can face Siyawush's mall;
    Siyawush praises Afrasiyab, and Afrasiyab calls him a prince, glory of the throne,
    royal crown, and backbone of the host.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: At the Ground, Afrasiyab asks that he and Siyawush be opponents and choose
    sides; Siyawush initially says he cannot play against him, but Afrasiyab insists
    that he display his prowess before the cavaliers.
  category: sequence
  evidence_refs:
  - ev:11
