canonical_text:
  quote: ''
  summary: 'The passage gives the argument and notes for the story of Siyawush: Giv
    and Tus find a damsel; the Shah marries her and Siyawush is born; Rustam raises
    Siyawush; Sudaba tempts and falsely accuses him; he clears himself by ordeal;
    he campaigns against Afrasiyab, then goes over to him after the Shah rejects peace
    terms; he marries Jarira and Farangis, gains honours, is killed through Garsiwaz''s
    envy, and Farangis gives birth to Kai Khusrau. The notes discuss epic source-combination,
    the duration and pretext of Sudaba''s temptation, Zoroastrian next-of-kin marriage,
    Siyawush/Syavarshana in the Zandavasta, and traditions about Gang-dizh/Kangdez.'
  language: English
  quote_policy: summarized
