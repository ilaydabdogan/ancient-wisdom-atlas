canonical_text:
  quote: ''
  summary: Siyawush receives the king's permission to survey and dwell in the granted
    realm, travels with Farangis, Piran, troops, arms, treasure, signet-ring, and
    crown, visits Khutan, then finds a fertile site bordered by mountains, sea, hunting-ground,
    trees, and rivulets. He resolves to build a splendid city, and Piran offers support.
    The narrator then introduces Gang-dizh, reflects on mortality, and describes the
    city as beyond sea, wilderness, and inhabited land, upon an unmatched lofty mountain.
  language: English
  quote_policy: summarized
