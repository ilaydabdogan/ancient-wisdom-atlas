canonical_text:
  quote: ''
  summary: Afrasiyab mourns a fallen warrior and orders revenge. The Turanian army
    is mustered with drums, trumpets, elephants, weapons, and battle cries. Rustam
    is warned of Afrasiyab’s approach, and both armies array their forces. Pilsam
    asks leave to challenge Rustam; Afrasiyab promises him royal rewards if he succeeds.
    Piran warns that Pilsam is acting rashly, but Pilsam insists. Afrasiyab equips
    him, and Pilsam advances to challenge Rustam. Giv answers first, is struck by
    Pilsam, and Faramarz comes to Giv’s aid. The supplied excerpt ends before the
    combat is resolved.
  language: English
  quote_policy: summarized
