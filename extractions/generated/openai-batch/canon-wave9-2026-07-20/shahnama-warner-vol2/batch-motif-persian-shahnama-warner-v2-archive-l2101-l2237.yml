canonical_text:
  quote: ''
  summary: Zal attends Kaus at court, praises him, and then warns him not to invade
    Mazandaran, describing it as an enchanted land of warlock-divs that previous kings
    avoided. Kaus rejects the warning, boasts of surpassing earlier rulers, appoints
    Zal and Rustam as regents of Iran, and sets out. After camping near Mount Ispuruz,
    he orders Giv to lead two thousand mace-wielders to clear the path by killing
    inhabitants, burning settlements, and slaying warlocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zal approaches Kaus with downcast eyes and folded arms, praises him as a mighty
    worldlord, and wishes him victory, wisdom, and justice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kaus receives Zal graciously, gives him a seat on the throne, and asks about
    the long journey, the chieftains, and Rustam.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zal says he has heard that Kaus plans a journey against Mazandaran and notes
    that earlier Shahs did not attempt it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zal describes Mazandaran as the home of warlock-divs, under spells, unconquerable
    by scimitar, wit, or treasure, and considered unlucky even to contemplate.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Zal warns Kaus not to spend men, wealth, and money on the expedition and uses
    the image of a tree planted with royal blood whose growth and fruit would be a
    curse.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kaus replies that he surpasses earlier kings in courage, Grace, and treasure
    and says he will go to Mazandaran, snare its inhabitants, tax them heavily, or
    leave them dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kaus tells Zal and Rustam to act as regents of Iran and says God is his helper
    and the prince of divs his quarry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Zal answers that Kaus is Shah and the others are his slaves, says he has spoken
    according to knowledge, and states that death and destiny cannot be escaped.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zal leaves grieved; the passage says both sun and moon were darkened in his
    eyes, and nobles including Tus, Gudarz, Bahram, and Giv accompany him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Giv says that if Kaus were not Shah he would esteem him as nothing, praises
    Zal, and says that after God they trust Zal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next day Kaus sets out with the troops, Gudarz and Tus lead, and Kaus
    sets up his throne before Mount Ispuruz while terror falls on the divs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At dawn Kaus orders Giv to choose two thousand mace-wielders to prepare a
    path toward Mazandaran, slaughter young and old, burn settlements, turn day to
    night, and kill warlocks before they are aware.
  category: speech
  evidence_refs:
  - ev:8
