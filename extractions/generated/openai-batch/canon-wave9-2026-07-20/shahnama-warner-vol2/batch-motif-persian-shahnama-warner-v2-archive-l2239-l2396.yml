canonical_text:
  quote: ''
  summary: Giv leads Iranian warriors into Mazandaran, where they kill inhabitants,
    sack and burn cities, and plunder a richly described land. The monarch of Mazandaran
    sends the div Sanja to summon the White Div. The White Div attacks the Iranian
    host with darkness, smoke, stones, and darts, blinds Kai Kaus and many warriors,
    captures the army, and transfers treasures and captives to Arzhang. Kai Kaus regrets
    ignoring Zal's counsel and sends a swift messenger to Zal in Zabul asking for
    aid.
  language: English
  quote_policy: summarized
