canonical_text:
  quote: There are two routes both hard and dangerous;
  summary: Rustam is urged to undertake a dangerous mission against Mazandarun's demonic
    and human enemies. Zal describes a long road and a shorter dark road haunted by
    div and lion. Rustam accepts the journey, invokes God and destiny, vows to rescue
    surviving Iranians and defeat named enemies, dons tiger-skin, mounts Rakhsh, and
    receives tearful farewells from Zal, Riidaba, and the people.
  language: English
  quote_policy: quoted
