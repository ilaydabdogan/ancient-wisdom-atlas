canonical_text:
  quote: ''
  summary: The passage describes an almost inaccessible rock and a splendid city later
    identified as Gang-dizh, with gardens, waters, game, birds, flowers, strong walls,
    and royal buildings made by Siyawush. Siyawush visits the place with Piran, asks
    astrologers about its fortune, receives an unfavorable answer, and grieves that
    his wealth and palace will pass to an enemy. He tells Piran that Afrasiyab will
    possess the throne, that he himself will be guiltlessly slain through slander
    and fate, and that war and devastation will follow between Iran and Turan. Piran
    pledges loyalty and protection.
  language: English
  quote_policy: summarized
