canonical_text:
  quote: ''
  summary: Rustam counsels Kaus not to compel Siyawush to break a treaty with Afrasiyab.
    Kaus angrily rejects Rustam, appoints Tus to command, and sends a harsh letter
    ordering Siyawush to send the hostages in chains, renew war, or surrender command
    to Tus and return. Rustam leaves for Sistan. Siyawush receives the letter, questions
    the messenger, and reflects that sending the innocent hostages or attacking without
    cause would bring moral and divine guilt, while returning command to Tus would
    also bring harm.
  language: English
  quote_policy: summarized
