- id: obs:1
  text: Rustam tells Kaus that he already has signet, crown, throne, Iranian treasure,
    and safety, and advises him to avoid wanton strife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rustam says that even if Afrasiyab secretly intended to break covenant, the
    Iranians are ready for battle, but Kaus should not require Siyawush to break the
    treaty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rustam states that Siyawush will never break his promises and that the deed
    contemplated by the Shah will horrify him.
  category: speech
  evidence_refs:
  - ev:1
