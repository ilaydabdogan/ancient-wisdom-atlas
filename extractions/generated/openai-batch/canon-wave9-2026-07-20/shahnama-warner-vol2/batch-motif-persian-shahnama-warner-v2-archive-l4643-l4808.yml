canonical_text:
  quote: ''
  summary: Kai Kaus sends an eloquent envoy to the ruler of Hamavaran to request his
    only daughter, Siidaba. The ruler reluctantly yields, and Siidaba agrees to the
    union. A compact and legal rites follow, with a lavish marriage procession and
    marriage portion. Later, Siidaba's father invites Kai Kaus as an honored guest
    while planning to entrap him. Siidaba warns Kai Kaus, but he ignores her and attends
    with his warriors. After a week of lavish hospitality at Shaha, Hamavaran and
    Barbaristan forces attack at night, seize Kai Kaus and notable Iranian warriors,
    and bind them.
  language: English
  quote_policy: summarized
