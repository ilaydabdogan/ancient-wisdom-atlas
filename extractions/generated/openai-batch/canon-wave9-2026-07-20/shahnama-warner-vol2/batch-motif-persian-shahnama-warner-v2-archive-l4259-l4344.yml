canonical_text:
  quote: ''
  summary: The passage is an argument and editorial note for a section on Kai Kaus.
    It summarizes his campaigns against Barbar, Misr, and Hamavaran; his marriage
    to Sudaba; his treacherous capture; invasions of Iran; Rustam's rescues and restorations
    of the Shah; Kai Kaus' building of palaces on Mount Alburz and attempted ascent
    to heaven; and a later raid by Rustam into Turan. The note discusses duplicated
    tradition, geography, the meaning of Zirih, the expedition as possibly aimed at
    a trade route, parallels in Tabari and Mas'udi, and a proposed historical reminiscence
    involving Antiochus Sidetes.
