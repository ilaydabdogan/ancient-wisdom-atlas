canonical_text:
  quote: ''
  summary: A convoy of slaves and valuables travels from Turan toward Iran and Zabul.
    Afrasiyab, learning of Tus and Rustam across the river, finds his land devastated,
    exhorts his captains to vengeance, and renews war against Iran, producing burning,
    distress, and seven years of drought. In this crisis Gudarz dreams that Surush
    sits on a watery cloud over Iran and tells him of Kai Khusrau, a young prince
    in Turan of Siyawush's line, destined to come to Iran, avenge his father, overthrow
    Tur, and be found only by Giv. Gudarz wakes, thanks God, summons Giv, and recounts
    the dream as a divine command and heavenly appointment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large convoy including ten thousand boys and girls described as slaves,
    musk, furs, perfumes, money, weapons, crowns, and thrones is loaded and sent from
    Turan toward Iran and Zabul, drawing near Zal; Tus, Gudarz, and Giv go to the
    Shah at Pars.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Afrasiyab hears that Tus and Rustam are across the river and sets out westward
    toward the sea of Gang with vengeance and war in mind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Afrasiyab finds the country overturned: nobles slaughtered, people enslaved,
    horses and treasures absent, trees without green leaves, the world consumed with
    fire, and palaces overthrown and burned.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afrasiyab weeps tears of blood and addresses the captains of the host, urging
    vengeance, continual fighting, attack on Iranian cities, and the gathering of
    arms and troops.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Afrasiyab assembles a war-ready host, leads warriors against Iran, plans attacks
    from every side, and burns settlements and trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For seven years the sky is rainless; conditions are reversed and people are
    impoverished by distress and travail while Rustam remains at Zabul and Turkman
    sworders hold sway.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gudarz dreams at night that a watery cloud rises over Iran and that Surush
    sits on it and addresses him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Surush tells Gudarz that relief from distress is connected with a youthful
    prince in Turan named Shah Kai Khusrau, offspring of Siyawush, noble in worship
    and race, of the stock of Kai Kubad and maternally sprung from Tur.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Surush predicts that when Kai Khusrau reaches Iran, heaven will grant his
    desire; he will avenge his father, overturn Tur's sovereignty, make the waters
    of the Red Sea boil, pursue vengeance on Afrasiyab, live in his cuirass, and spend
    days and nights in the saddle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Surush says that none among the chiefs and warriors of Iran will discover
    Kai Khusrau except Giv, and that this outcome is destined by the sky.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Gudarz wakes, places his hoary beard on the ground, thanks God, and becomes
    hopeful for a Shah to rule the world.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At dawn Gudarz sits on an ivory throne in a furnished hall, summons Giv, blesses
    him, and recounts that Surush appeared in sleep by God's command on a cloud amid
    wind and rain.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: In Gudarz's retelling, Surush asks why the world is filled with warfare and
    parched with drought, attributes this to Kaus lacking Grace and might and not
    following the precedents of Shahs, and says Giv is ordained by heaven to remove
    sorrow, toil, and bondage.
  category: speech
  evidence_refs:
  - ev:13
