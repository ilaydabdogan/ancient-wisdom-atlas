canonical_text:
  quote: ''
  summary: Rustam recognizes Pilsam, recalls an astrological prophecy about him, challenges
    and kills him. The battle then expands into a blood-darkened clash between the
    Iranian and Turanian forces. Afrasiyab rallies his troops and attacks the Iranian
    right, but Rustam arrives with allies. Afrasiyab and Rustam fight; Rustam nearly
    captures Afrasiyab after killing his horse, but Human strikes Rustam and enables
    Afrasiyab to escape.
  language: English
  quote_policy: summarized
