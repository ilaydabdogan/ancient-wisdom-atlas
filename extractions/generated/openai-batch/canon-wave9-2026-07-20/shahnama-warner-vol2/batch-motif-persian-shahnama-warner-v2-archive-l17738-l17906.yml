  summary: The passage moves from Rustam's battlefield success and pursuit of the
    Turanian enemy to Afrasiyab's fear that Khusrau could be enthroned in Iran. Piran
    advises against killing Khusrau, arranges his removal, and provides for him before
    sending him farther away. The next section begins Rustam's conquest of regions
    around Chin and his redistribution of royal goods and offices, including counsel
    on just rule and the instability of worldly kingship.
  language: English
