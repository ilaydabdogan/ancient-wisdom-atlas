canonical_text:
  quote: ''
  summary: In the aftermath of Suhrab's wounding by Rustam, Suhrab asks Rustam to
    spare the Turkmans, recalls his failed search for his father, and attributes his
    death to the stars. Rustam returns mourning to the Iranian host, halts further
    fighting, learns that Hajir concealed Rustam's identity from Suhrab, nearly kills
    Hajir, then tries to kill himself. Gudarz restrains and counsels him about death's
    universality. Rustam then sends Gudarz to Kaus to ask for an elixir.
  language: English
  quote_policy: summarized
