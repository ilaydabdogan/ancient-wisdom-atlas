canonical_text:
  quote: ''
  summary: The passage moves from Siyawush's speech about fated war, bloodshed, heavenly
    decree, and the transience of wealth to Piran's troubled reflection that he brought
    Siyawush into Turan. Piran is then ordered by Afrasiyab to campaign through distant
    provinces. Afrasiyab sends Siyawush an affectionate letter, and Siyawush travels
    with treasure, troops, and attendants to Bahar, where he founds Siyawushgird,
    decorates it with royal and martial images, and gains renown in Iran and Turan.
    Piran later visits the new city, is welcomed by Siyawush, tours the transformed
    site, and blesses the prince.
  language: English
  quote_policy: summarized
