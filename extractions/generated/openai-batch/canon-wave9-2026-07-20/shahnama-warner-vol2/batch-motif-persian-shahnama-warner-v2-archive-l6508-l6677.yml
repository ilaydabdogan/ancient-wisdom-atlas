canonical_text:
  quote: ''
  summary: Tahmina declares her admiration for Rustam, offers herself in marriage,
    hopes for his child, and promises the return of Rakhsh. Rustam arranges the marriage
    through an archimage and Tahmina's father consents. Rustam gives Tahmina an armlet
    as a paternal token for any future child, then departs after Rakhsh is restored.
    Nine months later Suhrab is born, grows with extraordinary speed and strength,
    demands to know his lineage, and learns from Tahmina that Rustam is his father.
    Tahmina shows him paternal gifts and warns him to conceal the matter from Afrasiyab.
    Suhrab responds by proposing a campaign to place Rustam on Iran's throne, overthrow
    Afrasiyab, and make Tahmina mistress of Iran.
  language: English
  quote_policy: summarized
