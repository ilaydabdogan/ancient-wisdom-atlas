canonical_text:
  quote: ''
  summary: Garsiwaz reports to Afrasiyab that Siyawush has slighted him, ignored the
    royal letter, corresponded with Iran, and poses a military threat. Afrasiyab becomes
    enraged, rejects the letter unread, and summons troops. Siyawush, distressed,
    speaks with Farangis, who laments and urges refuge in God. Siyawush dreams of
    a river, a flaming mountain, fire, water, armed men, and Afrasiyab with elephants
    blowing the flames. After a scout reports Afrasiyab's approaching army and a messenger
    brings a warning from Garsiwaz, Farangis urges Siyawush to flee Turan.
  language: English
  quote_policy: summarized
