canonical_text:
  quote: ''
  summary: The passage opens with a theological reflection on God as sustainer, creator,
    and lord of knowledge and destiny. It recalls the monarch of Turan killing a royal
    youth and being met by evil destiny, while God causes a noble fruit-bearing Tree
    to arise from his loins; a note identifies this Tree as Kai Khusrau. Giv then
    sets out alone toward Turan to seek Kai Khusrau, questions men about him, kills
    those who deny knowledge, kills a guide after questioning him, and continues searching
    for seven years through desert and mountains in severe hardship.
  language: English
  quote_policy: summarized
