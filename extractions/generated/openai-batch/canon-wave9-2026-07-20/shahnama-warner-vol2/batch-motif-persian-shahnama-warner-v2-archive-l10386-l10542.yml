canonical_text:
  quote: ''
  summary: Kai Kaus discusses Siyawush with Sudaba, who praises the prince and proposes
    that he take a wife from royal kin, including her own daughters or women of the
    houses of Kai Arash and Kai Pashin. Kaus privately tells Siyawush that God-inspired
    longing and a horoscope from star-reading archimages point to a future king from
    Siyawush's loins, and urges him to choose a wife. Siyawush outwardly submits to
    the Shah's will but fears Sudaba's involvement. Sudaba then prepares her bower
    with her daughters and attendants, sends Hirbad to summon Siyawush, and displays
    the women as possible brides. Siyawush is distressed, remains silent, and inwardly
    rejects marriage among those he regards as foes, linking Sudaba to Hamavaran.
  language: English
  quote_policy: summarized
