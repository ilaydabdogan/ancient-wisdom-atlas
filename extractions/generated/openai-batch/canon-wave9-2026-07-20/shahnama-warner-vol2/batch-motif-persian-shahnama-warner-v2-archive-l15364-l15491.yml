canonical_text:
  quote: ''
  summary: Garsiwaz tells Siyawush that Afrasiyab has changed and intends harm, presenting
    past acts and family ties as unreliable. Siyawush, distressed but unwilling to
    disobey the king, proposes going with Garsiwaz to learn the reason for the king’s
    anger. Garsiwaz dissuades him, offers to mediate, and advises him to write a letter
    and prepare for possible flight to Chin or Iran. Siyawush believes him. A scribe
    writes Siyawush’s respectful letter to Afrasiyab, explaining that Farangis is
    ill and that her condition prevents Siyawush from coming. Garsiwaz takes the sealed
    letter and rides quickly to Afrasiyab’s court with harmful intent.
  language: English
  quote_policy: summarized
