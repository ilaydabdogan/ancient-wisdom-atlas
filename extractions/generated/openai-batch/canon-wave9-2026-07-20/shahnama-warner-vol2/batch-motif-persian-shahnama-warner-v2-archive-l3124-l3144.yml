canonical_text:
  quote: ''
  summary: Rustam rides Rakhsh with Olad running beside him until they reach Mount
    Ispuriiz, near the entrance to Mazandaran where divs and warlocks have overthrown
    Kaus. At midnight fires and torches appear, and Olad explains that the div Arzhang
    is there and keeps the place noisy so that few dare sleep. Rustam sleeps until
    dawn, binds Olad to a tree, takes his ancestral mace on the saddle, and departs
    confidently and with ruse.
  language: English
