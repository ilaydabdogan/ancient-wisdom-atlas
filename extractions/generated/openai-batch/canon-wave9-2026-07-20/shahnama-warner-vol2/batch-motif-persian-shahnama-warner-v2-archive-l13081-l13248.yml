canonical_text:
  quote: ''
  summary: Siyawush leaves his own chiefs under Bahrain’s command and travels tearfully
    toward Jihun. News of his joining the Turkman host reaches Tus and Kai Kaus, who
    mourns but abandons immediate revenge. Afrasiyab orders a ceremonial welcome.
    Piran comes with kin, gifts, elephants, throne, banner, steeds, music, and scents;
    he embraces and honors Siyawush, promises service and Afrasiyab’s fatherly protection.
    The welcome makes Siyawush remember an earlier honored visit to Rustam in Zabul
    and grieve for Iran. At Kachar Bashi, Piran praises Siyawush’s lineage and qualities.
    Siyawush asks for a covenant with Piran as the condition for making the land his
    home, and Piran urges him to stay and trust Afrasiyab.
  language: English
  quote_policy: summarized
