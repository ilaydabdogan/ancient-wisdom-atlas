canonical_text:
  quote: ''
  summary: Rustam is described as an overlord receiving submission and tribute, while
    Fariburz is urged to avenge Siyawush. Zawara, led by a Turkman to Siyawush’s former
    hunting-ground, is overcome by grief and swears renewed vengeance against Afrasiyab,
    prompting Rustam to ravage Turan. Turanian nobles plead for mercy, and later counsellors
    urge Rustam to return to Iran and avoid greed; Rustam accepts the counsel and
    prepares to depart.
  language: English
  quote_policy: summarized
