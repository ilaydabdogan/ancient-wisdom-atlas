canonical_text:
  quote: ''
  summary: Kai Khusrau arrives with Giv and is honored by the Iranian chiefs, Gudarz,
    and Shah Kai Kaus. The city and court celebrate his arrival. Khusrau recounts
    the murder of his father, the mistreatment of his mother, his childhood exile
    among livestock in the mountains, his evasive concealment before the hostile king,
    and Giv’s martial efforts to bring him back safely, including the capture and
    sparing of Piran.
  language: English
  quote_policy: summarized
