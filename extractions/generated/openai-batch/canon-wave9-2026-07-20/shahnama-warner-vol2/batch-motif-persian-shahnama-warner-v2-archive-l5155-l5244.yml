canonical_text:
  quote: ''
  summary: Rustam defeats and captures enemy rulers, forcing the monarch of Hamavaran
    to ask quarter, release Kai Kaius and the Iranian leaders, and restore treasures.
    Kai Kaius then prepares royal conveyance and regalia for Sudaba, gathers large
    forces, and moves to reassert his claim on Iran. Arab spearmen hear of Rustam’s
    victories and compose a royal letter affirming service to the Shah against throne-seeking
    enemies.
  language: English
