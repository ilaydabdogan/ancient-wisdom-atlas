canonical_text:
  quote: ''
  summary: Rustam crosses Jihiin and reports the enemy's withdrawal; he warns Kai
    Kubad not to expect peace in wartime. Kai Kubad praises right conduct, treats
    Pashang's avoidance of strife as not to be judged unjustly, grants lands and royal
    honors to Rustam, assigns Kabul to Mihrab, and distributes rich gifts to Zal and
    other warriors. He then goes to Pars and Istakhr, claims the crown with general
    assent, sits on the Kaian throne, declares a policy of justice, piety, liberality,
    and support for the needy, inspects the realm for ten years, administers justice,
    and builds many cities.
  language: English
  quote_policy: summarized
