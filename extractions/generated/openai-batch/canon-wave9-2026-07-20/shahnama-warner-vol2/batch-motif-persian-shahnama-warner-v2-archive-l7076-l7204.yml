canonical_text:
  quote: ''
  summary: Gazhdaham reports to Kai Kaus that a mighty host led by the very young
    but overwhelming warrior Suhrab is attacking White Castle; he describes Suhrab's
    exceptional stature, weapons, voice, fearlessness, and resemblance to famous heroes,
    and reports that Suhrab unhorsed Hajir. Gazhdaham warns that Iran's defenses are
    endangered, sends the letter, and prepares to withdraw. At sunrise Suhrab forces
    White Castle's gates after the garrison has fled through a hidden way, searches
    in vain for Gurdafrid, and Kai Kaus convenes his captains, who agree to summon
    Rustam from Zabul.
  language: English
  quote_policy: summarized
