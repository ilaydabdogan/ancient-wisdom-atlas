canonical_text:
  quote: ''
  summary: Kai Kaus has a royal letter written on white silk to the king of Mazandaran,
    invoking God, warning of punishment, and demanding submission, tribute, and attendance
    at court. Farhad carries the sealed letter, is received with intimidation, and
    remains composed. The king of Mazandaran reacts angrily to the letter, mourns
    slain allies and divs, hosts the envoy, and sends back a defiant boast of armies
    and elephants. Farhad reports the reply to Kai Kaus. Rustam offers to go as envoy
    with a harsher answer, and Kai Kaus dictates another threatening letter.
  language: English
  quote_policy: summarized
