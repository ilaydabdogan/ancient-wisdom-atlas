canonical_text:
  quote: ''
  summary: A scholarly note describes the end of an old epic cycle, the introduction
    of the house of Luhrasp, a religious motive centered at Balkh, a repeated horse-name
    element in key names, religious wars connected with Zarduhsht's evangel, and several
    cautious comparisons between Shahnama legends and Greek or Near Eastern legendary
    materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says that with Khusrau the old epic cycle of the poem comes to an
    end, and the Kaianian dynasty may be regarded as complementing the Pishdadian
    dynasty up to that point.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The note introduces a second group: Shahs of the house of Luhrasp, including
    Luhrasp, Gushtasp, Bahman, Humai, Darab, Dara, and Sikandar.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Luhrasp is described as of Kaian race and as owing his accession to Khusrau's
    nomination.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: With Luhrasp's accession, the note says a new religious epic motive is introduced
    and the scene shifts to Balkh.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The note emphasizes the recurrence of the name-ending 'asp,' identified as
    the Persian word for 'horse,' in names such as Luhrasp, Gushtasp, Jamasp, Paurushasp,
    and Arjasp.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wars between Gushtasp and Arjasp are described as admittedly religious,
    and the note suggests they may have been internal Iranian wars caused by dissensions
    from Zarduhsht's evangel rather than original Iranian-Turanian wars.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The note says authentic historical overlap between the Shahnama and ancient
    Greek writers begins only with Sikandar, and that Firdausi's information there
    came from a modified Pseudo-Callisthenes tradition.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: 'The note says two main Greek versions of the youth of Cyrus the Great may
    be identified in the Shahnama: Herodotus'' version with the birth and upbringing
    of Kai Khusrau, and Ctesias'' version with the early days of Ardshir Papakan.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The note explicitly says that these legendary parallels do not imply Firdausi's
    debt to Greek sources, but rather that both Firdausi and the Greek writers used
    the same cycle of legend at widely separated times.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The note says a Greek version of the love-interest in the story of Gushtasp
    in Rum is preserved in Athenaeus, quoting Chares of Mytilene.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The note says that Humai, the seventeenth Shah, may preserve a reminiscence
    of Semiramis.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The note concludes that the Kaianian dynasty contains especially abundant
    and fine epic subject matter, with the reign of Kai Kaus in this volume singled
    out as unsurpassed.
  category: attribute
  evidence_refs:
  - ev:9
