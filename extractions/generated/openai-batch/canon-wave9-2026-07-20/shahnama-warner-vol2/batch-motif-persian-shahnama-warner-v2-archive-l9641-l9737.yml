  quote: ''
  summary: The passage gives historical commentary on Kharazm, Alfir, Kangha, and
    Gang-dizh; then compares the birth and youth of Kai Khusrau in the Shahnama with
    Herodotus' account of Cyrus, including dreams, attempted infant killing, exposure,
    substitution, foster upbringing, childhood kingship, and later overthrow of Astyages.
    It ends with the opening of a poetic prelude urging eloquence and fitting words.
  language: English
  quote_policy: summarized
