canonical_text:
  quote: ''
  summary: An unnamed female speaker asks a warrior who has seen Rustam to accompany
    Suhrab and show him his father. During a feast, Rustam secretly observes Suhrab,
    kills Zhanda Razm when questioned, returns to the Iranian camp, and reports on
    Suhrab. Suhrab discovers Zhanda Razm dead, vows revenge, then at sunrise arms
    himself, surveys the Iranian army, and questions Hajir about the names of Iran’s
    chiefs under a demand for honesty.
  language: English
  quote_policy: summarized
