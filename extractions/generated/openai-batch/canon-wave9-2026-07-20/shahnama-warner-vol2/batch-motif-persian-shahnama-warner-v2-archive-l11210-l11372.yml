  quote: "“The young Shah cometh from the fire!”"
  summary: Siyawush emerges unharmed from the fire ordeal, is publicly acclaimed as
    innocent by divine mercy, and is reconciled with Shah Kaiis. Kaiis condemns Sudaba
    to death for her role in the ordeal, but Siyawush intercedes and obtains her pardon.
    Sudaba later regains influence over the Shah and works secretly against Siyawush.
    News then arrives that Afrasiyab has come with a large force.
