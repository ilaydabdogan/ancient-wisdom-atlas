canonical_text:
  quote: ''
  summary: Rustam receives a threatening answer concerning Kai Kaus, musters his host,
    crosses by sea to Hamavaran, and routs the enemy. The king of Hamavaran appeals
    to Barbar and Misr for aid. The three rulers assemble vast forces with elephants.
    Rustam warns Kai Kaus, receives encouragement grounded in trust in God, challenges
    the opposing armies, and then arrays the Iranian host for battle, with Guraza
    on the right, Zawara on the left, and Rustam in the center.
  language: English
  quote_policy: summarized
