canonical_text:
  quote: ''
  summary: Kai Kaus sends Giv with a sealed urgent letter summoning Rustam against
    a dangerous warrior. Giv rides without rest to Zabul and delivers the message.
    Rustam doubts the danger, reflects on his young son in Samangan, and delays departure
    with feasting and drinking despite Giv's repeated warnings that Kaus is anxious
    and may become angry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The message praises Rustam as Iran's unique protector, recalls his deeds in
    Mazandaran and Hamavaran, and says no one else can confront the threatening warrior.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kai Kaus gives a sealed letter to Giv and orders him to ride instantly, not
    to tarry or sleep in Zabul, and to tell Rustam that war is imminent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Giv travels night and day without rest, sleep, water, or food until he reaches
    Zabul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rustam receives Giv with troops and nobles, asks for news of the Shah and
    Iran, and goes with him to the palace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Giv delivers the letter, reports on Suhrab, and gives other tidings and presents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After reading the letter, Rustam laughs in amazement and doubts that such
    a powerful horseman could have come from the Turkmans.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rustam says that the daughter of the king of Samangan bore him a son, but
    that the boy is still a child and not yet versed in warfare.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The report says that the hostile warrior defeated Hajir and bound him head
    and foot with a lasso.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Giv urges Rustam to depart quickly for Iran, repeating Kai Kaus's warning
    not to sleep in Zabulistan.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rustam dismisses the danger, proposes remaining for merriment and wine, and
    calls the matter a trifle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Rustam and his companions drink, feast, call for harp and minstrelsy, and
    delay for several days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the fourth day Giv warns that Kai Kaus is rash, anxious, not eating or
    sleeping, and may grow angry because of the delay.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Rustam again tells Giv not to worry about Kai Kaus's reaction.
  category: speech
  evidence_refs:
  - ev:7
