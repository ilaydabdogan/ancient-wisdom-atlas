canonical_text:
  quote: ''
  summary: Iblis and the divs plot to tempt Kai Kaus away from God. A div, disguised
    as an attractive youth, flatters the Shah and urges him to conquer or understand
    heaven. Kaus constructs an eagle-powered throne using spears and suspended lamb
    flesh; the eagles lift him skyward but become exhausted and descend near Amul.
    Kaus survives by miracle, repents in the forest, and is later found and rebuked
    by Rustam, Giv, Tus, Gudarz, and the paladins for his self-willed attempt to reach
    heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iblis addresses the assembled divs and says they need a shrewd, presentable
    div to tempt the Shah, soil his Grace, and wean him from God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wicked div volunteers to pervert Kai Kaus's mind from God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The div appears as a youth of good address, waits until the Shah goes hunting
    from Pahlav, approaches with roses, kisses the ground, and flatters the Shah.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The disguised div tells Kaus that heaven is his fit home, asks about the sun,
    moon, night, day, and the turning sky, and urges him to take heaven as well as
    earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kaus's heart strays; he does not stop to think and believes that heaven favors
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states that the sky is ladderless, that God is One, and that
    the Maker has no need of sky and earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kaus asks the wise how far it is from earth to moon, and the astrologers reply.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kaus orders young eagles taken from their aeries and raised in homes with
    rich food until they are strong enough to carry off mountain-sheep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kaus makes an aloe throne with gold seats, fixes long spears at its corners,
    hangs a lamb's leg from each spear-head, ties four eagles to the throne, and sits
    with a cup of wine before him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hungry eagles try to reach the meat and lift the throne upward toward
    the clouds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The narrator reports other versions of the legend, including that Kaus tried
    to outsoar angels or to attack heaven with artillery.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: After a long flight, the eagles become exhausted, droop their wings, and bring
    Kaus, his spears, and his throne down to earth in a forest near Amul.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The world preserves Kaus by a miracle; a duck appears in answer to his prayers;
    he remains in the wood in shame and grief, imploring Almighty God for relief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Kaus's host searches for him; Rustam, Giv, and Tus receive news of him and
    march with troops and drums.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Gudarz says he has not seen anyone as self-willed as Kaus and accuses him
    of lacking wisdom, common sense, and Faith.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The paladins rebuke Kaus, recall his earlier troubles, say that trying to
    soar even a hand-breadth is revolt, and urge him to serve God alone.
  category: speech
  evidence_refs:
