canonical_text:
  quote: "“To scheme, my friend! / Is better than to fight.”"
  summary: Siyawush commissions Rustam to carry a silk letter to Shah Kaus. The letter
    praises God and the sovereign, reports Afrasiyab’s peace offer through Garsiwaz
    with gifts and hostages, and asks Kaus to show goodwill. Garsiwaz reports to Afrasiyab,
    who says a dream of his fall drove him to stratagem. Rustam delivers the message
    to Kaus, who angrily rejects the hostages and proposes renewed war and executions.
    Rustam counsels restraint, recalling Kaus’s earlier instructions and warning against
    attacking one who has opened the door of peace.
  language: English
  quote_policy: quoted
