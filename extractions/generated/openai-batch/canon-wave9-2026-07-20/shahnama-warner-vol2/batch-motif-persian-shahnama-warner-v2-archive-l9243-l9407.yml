canonical_text:
  quote: ''
  summary: After Suhrab's death, the Shah counsels Rustam on mortality and the futility
    of grief. Rustam asks that Human and other Turanian and Chinese chiefs be spared
    and conducted away. Rustam returns toward Zabulistan with Suhrab's bier, where
    Zal, Rudaba, nobles, warriors, and the people mourn. The body is displayed, lamented,
    enclosed again, and placed in a richly described bier and charnel. News of Rustam
    killing his son spreads, and Human returns to Turan to report the event to Afrasiyab.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with a reflection that crowned and prosperous people are
    brought down, all must pass away, and the final end is not knowable by humans.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shah approaches Rustam with his retinue after being informed about Suhrab
    and counsels him that all die and that grief cannot recall the dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Shah says Suhrab's soul is in heaven and that Suhrab was impelled by fate
    to perish by Rustam's hands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rustam says Human remains with other chieftains of Turan and Chin and asks
    that they not be treated as foes but be conducted away by Zawara.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kaus replies that, despite harm done by foes, Rustam's sorrow makes him abandon
    thoughts of revenge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Shah marches homeward with the host, while Rustam waits for Zawara's news
    and then marches at dawn toward Zabulistan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Zal and the people come out in anguish and distress to meet Rustam, and they
    reach Suhrab's bier.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The nobles scatter dust on their heads, dock the tails of their horses, and
    tear the tymbals and drums.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zal dismounts when he sees the bier, Rustam walks in front of it on foot,
