canonical_text:
  quote: ''
  summary: Kai Kaus urges Siyawush to visit Sudaba and his sisters in the women’s
    bower. Siyawush suspects a test and is troubled, but agrees to obey. Hirbad leads
    him through the veil into a richly decorated women’s space where Sudaba receives
    him with embraces and praise. Siyawush recognizes her affection as unseemly, withdraws
    to his sisters, and then reports back to the Shah, who rejoices.
  language: English
  quote_policy: summarized
