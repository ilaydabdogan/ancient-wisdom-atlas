canonical_text:
  quote: ''
  summary: Kai Khusrau rewards Giv with gifts, treasure, and a patent for provinces,
    then honors Farangis and welcomes Iran as her home. At Kishwad's palace in Istakhr,
    Kai Khusrau is placed on a golden throne and blessed as Shah. The warriors of
    Iran serve him except Tus, son of Naudar, who refuses allegiance. Giidarz sends
    Giv to warn Tus that refusal will bring strife; Tus answers by asserting his military
    rank, royal ancestry, prowess, and objection that a new monarch was established
    without his counsel.
  language: English
  quote_policy: summarized
