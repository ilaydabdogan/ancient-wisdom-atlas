canonical_text:
  quote: ''
  summary: Siyawush tells his pregnant wife Farangis that his dream has been fulfilled
    and that he will die in Turan. He foretells the birth and future kingship of their
    son Kai Khusrau, Farangis's rescue, and vengeance from Iran. He farewells her,
    releases and charges his horse Bihzad to serve Kai Khusrau, destroys other horses
    and royal goods, then meets Afrasiyab's armed host and refuses to fight, citing
    fate, loyalty, and God.
  language: English
  quote_policy: summarized
