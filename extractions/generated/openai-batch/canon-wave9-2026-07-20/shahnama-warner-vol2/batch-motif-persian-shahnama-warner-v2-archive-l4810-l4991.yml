canonical_text:
  quote: ''
  summary: Kai Kaus is captured through the stratagem of the ruler of Hamavaran and
    confined with his chiefs in a fortress on a cloud-capped mountain rising from
    the ocean. Sudaba refuses to leave him and joins him in captivity. In Iran, the
    absent king and empty throne lead to disorder, invasion, and enslavement. The
    people appeal to Rustam, who musters an army, sends encouragement to Kai Kaus,
    and sends a warlike ultimatum to the ruler of Hamavaran demanding the Shah's release.
  language: English
  quote_policy: summarized
