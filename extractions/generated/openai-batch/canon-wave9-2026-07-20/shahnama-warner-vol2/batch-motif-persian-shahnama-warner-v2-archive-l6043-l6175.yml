canonical_text:
  quote: ''
  summary: The passage narrates Zawara’s duel with Alkus, Zawara’s fall, Rustam’s
    intervention and defeat of Alkus, the rout of the Turanian/Turkman host, Afrasiyab’s
    flight and escape from Rustam’s lasso, the Iranians’ gathering of spoils, their
    report to Shah Kaius, and a closing reflection on fortune and old legend.
  language: English
  quote_policy: summarized
