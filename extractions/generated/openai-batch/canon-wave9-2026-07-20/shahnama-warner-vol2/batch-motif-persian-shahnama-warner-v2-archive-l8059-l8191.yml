canonical_text:
  quote: ''
  summary: Suhrab questions Hajir about Rustam’s absence from the royal army, promises
    reward if Hajir identifies him, and threatens beheading if he conceals the information.
    Hajir praises Rustam’s might but decides inwardly not to reveal Rustam’s bearings,
    fearing Suhrab could kill him and seize Kaus’s throne. Hajir defies Suhrab, who
    strikes him down, then arms himself, mounts his steed, raises a battle-cry, and
    rushes toward Kaus’s army.
  language: English
  quote_policy: summarized
