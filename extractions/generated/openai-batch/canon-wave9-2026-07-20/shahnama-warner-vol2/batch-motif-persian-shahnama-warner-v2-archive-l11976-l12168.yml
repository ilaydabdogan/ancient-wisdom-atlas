  quote: "“We both would wash out vengeance from our hearts.”"
  summary: A peace overture involving lavish gifts is sent to Siyawush through Garsiwaz.
    Garsiwaz crosses the Jihun, is formally received by Siyawush, and presents gifts
    said to come from Afrasiyab. Siyawush and Rustam consult privately; Rustam suspects
    haste and advises caution. Siyawush proposes that Afrasiyab prove sincerity by
    sending a hundred family members as hostages, surrendering Iranian cities, and
    ceasing revenge.
