canonical_text:
  quote: ''
  summary: An unnamed high-born damsel explains that she was robbed and fled. Tus
    and Giv quarrel over her, then bring her to Kai Kaus, who desires her, asks her
    lineage, rewards the generals, and installs her in the women’s bower. After nine
    months she bears Siyawush. The child is beautiful and remarkable, but astrologers
    see hostile stars over him. Rustam asks to rear him, takes him to Zabul, teaches
    him martial and royal accomplishments, and later prepares to return with him to
    the Shah amid public celebration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The damsel says her steed collapsed from weariness, that people over a hill
    robbed her of gold, crown, and jewels, beat her with a scabbard, and that she
    escaped in terror.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tus and Giv both become enamored of the damsel and argue over which of them
    first found or pursued her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A noble advises that the damsel be taken to the monarch of Iran and that Tus
    and Giv accept his decision.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kai Kaus sees the damsel, falls in love with her, describes her as a quarry
    for the lord, and asks about her lineage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The damsel states that she is of high birth on her mother’s side, that her
    father descends from Faridun, and that her father’s father is prince Garsiwaz.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kai Kaus rewards each general, sends the damsel to the women’s bower, has
    her seated on a throne and ivory seat, crowns her with gold and turquoise, and
    gives her rich adornments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After nine months and the return of spring, the damsel bears a child described
    as glorious, fairy-formed, and unusually beautiful; Kai Kaus names him Siyawush
    and praises heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Readers of the sky see that the stars are hostile to the boy, grieve over
    his fortune, seek refuge in God, and warn the Shah about his son’s future.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rustam asks to rear the child, saying no nurse on earth is like him, and Kai
    Kaus entrusts Siyawush to Rustam, who takes him to Zabul.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Rustam teaches Siyawush riding, archery, lasso use, courtly conduct, feasting,
    hunting with birds and cheetahs, judgment, rule, speeches, combat, and command
    of an army.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Siyawush becomes a peerless prince, grows tall, captures lions, and asks Rustam
    to bring him to his father so the Shah may examine the results of his education.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Rustam equips Siyawush with horses, slaves, precious metals, weapons, crowns,
    girdles, and cloth, then journeys with him while townspeople decorate the route
    and celebrate.
  category: sequence
  evidence_refs:
  - ev:10
