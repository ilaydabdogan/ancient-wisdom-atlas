canonical_text:
  quote: ''
  summary: The passage narrates Rustam's first two courses. In the first, he departs,
    hunts and cooks an onager, sleeps in a reed-bed that is a lion's lair, and Rakhsh
    kills the lion while Rustam sleeps. In the second, Rustam and Rakhsh nearly perish
    in a waterless desert; Rustam prays, follows a trackless ram to a spring, blesses
    it, refreshes himself and Rakhsh, hunts, cooks, and rests.
  language: English
  quote_policy: summarized
