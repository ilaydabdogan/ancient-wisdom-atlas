canonical_text:
  quote: ''
  summary: Kai Kaus repents of insulting Rustam and sends Gudarz to recall him. Gudarz
    and the Iranian leaders appeal to Rustam, who protests that he has served Kaus
    before but returns when his courage and fame are challenged. Kaus apologizes,
    Rustam affirms his allegiance, and the court feasts. At dawn Kaus musters a vast
    army and marches toward the stronghold, where Suhrab and Human view the approaching
    host.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shah accepts Gudarz's advice, repents, and tells Gudarz to go to Rustam,
    restore favor, and bring him back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gudarz and the leaders of the host pursue Rustam, salute him, and say that
    Kaus speaks rashly in anger but later regrets it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rustam says he needs nothing from Kaus, defines his throne and crown as martial
    equipment, recalls freeing Kaus in earlier dangers, and says he fears only God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gudarz tells Rustam that the Shah and warriors suspect he is frightened of
    the Turkman chief and warns him not to eclipse his fame or dim the crown and throne
    while an enemy host is near.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rustam denies fleeing from battle, says he withdrew because the monarch scorned
    him, and returns to Shah Kaus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kaus rises when he sees Rustam and apologizes, describing his temper as choleric
    and saying that the new foe made his heart faint.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rustam answers that the world belongs to Kaus, that he and others are Kaus's
    subjects, and that he is a liege before the Shah's gate.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kaus announces a banquet for that day and battle for the next; the chiefs
    gather, gems are scattered, and they drink wine into the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At dawn Kaus orders Giv and Tus to bind drums on elephants, opens the treasury,
    distributes supplies, calls the army to horse, and loads baggage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The army's march is described as darkening heaven with dust, shaking the plain
    with drums, and making javelins and darts flash like flame through dust.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A lookout warns Suhrab that a host has come; Suhrab mounts the walls, shows
    the army to Human, and Human becomes afraid.
  category: sequence
  evidence_refs:
  - ev:8
