canonical_text:
  quote: ''
  summary: Afrasiyab sends Piran and then other Turanian champions against the Iranians.
    Piran attacks Rustam with ten thousand Turkmans, but Rustam slays many. Pilsam
    boasts, receives the king's approval, and fights several Iranian chiefs before
    Piran intervenes against four-on-one combat. Rustam enters the melee, Pilsam flees,
    and Afrasiyab then summons Alkus, who advances with cavalry and meets Zawara's
    challenge.
  language: English
  quote_policy: summarized
