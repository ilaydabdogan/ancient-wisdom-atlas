  quote: '"turning from his oath and covenant"'
  summary: Kai Kaus responds to Afrasiyab's broken oath by planning revenge. Advisers
    urge him to send a champion instead of going himself. Siyawush volunteers to lead
    the war, hoping to escape Sudaba and his father's distrust. The narrator foreshadows
    Siyawush's death in Tiiran by plots. Kai Kaus gives him command, resources, and
    troops, and orders Rustam to guard him as the host is mustered.
