- id: obs:1
  text: Tus rejects making a king from the offspring of Afrasiyab or from the line
    of Pashang and says Fariburz, son of Kaius, is worthier of the crown and throne
    than Kai Khusrau.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Giv rebukes Tus, says Tus lacks royal counsel, and states that God bestows
    sovereignty on one who has Grace, mien, sense, and counsel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gudarz becomes angry, beats the drums, and marches out with his sons, grandsons,
    and twelve thousand men of his own kin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tus also mobilizes, binding drums on elephants while warriors prepare and
    Kawa's standard leads the central host.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kai Khusrau is seen seated on a turquoise throne carried by a mighty elephant,
    crowned, adorned with jewels and ornaments, holding an oxhead mace, and surrounded
