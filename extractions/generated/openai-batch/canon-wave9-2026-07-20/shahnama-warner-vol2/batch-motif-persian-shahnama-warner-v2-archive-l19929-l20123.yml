canonical_text:
  quote: ''
  summary: The passage presents a dispute over whether Kai Khusrau or Fariburz should
    inherit kingship. Tus objects to Kai Khusrau because of his descent from Afrasiyab,
    while Giv and Gudarz defend Kai Khusrau through royal Grace, descent from Siyawush,
    miraculous river crossing, and a dream message from Surosh. Armed factions nearly
    confront one another, but Kaius summons the leaders to prevent civil war.
  language: English
  quote_policy: summarized
