  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kaius summons the two captains and instructs them to avoid turning gain into
    loss, replace the sword, and appear before him without retinues.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before Kaius, Tus argues that Fariburz should receive the world, diadem, crown,
    and throne because he is Kaius's son rather than a grandson.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gudarz answers that Kai Khusrau is the son of Siyawush, resembles him in face
