  text: Rustam praises Siyawush as unmatched among shahs, noble, reticent, majestic,
    and powerful in feasting and battle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rustam goes to Sudaba's palace, drags her by the hair from the bower and throne,
