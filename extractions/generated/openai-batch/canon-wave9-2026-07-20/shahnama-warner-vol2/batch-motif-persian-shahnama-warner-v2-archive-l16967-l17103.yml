  text: Shah Kaus responds to the news by bowing his crowned head, tearing his robes
    and cheeks, leaving the throne for the dust, and mourning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Iranians and named cavaliers mourn Siyawush with funeral clothing, black
    and blue garments, pale cheeks, blood-weeping eyes, and dust instead of helmets.
  category: action
  evidence_refs:
  - ev:1
