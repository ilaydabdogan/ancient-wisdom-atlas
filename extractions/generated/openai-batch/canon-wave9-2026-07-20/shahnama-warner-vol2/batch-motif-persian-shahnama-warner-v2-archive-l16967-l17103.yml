canonical_text:
  quote: ''
  summary: After the death of Siyawush is reported, Shah Kaus and the Iranians mourn
    publicly. Rustam hears the news, mourns, gathers troops, vows vengeance, rebukes
    Kaus for his conduct and for Sudaba's influence, kills Sudaba while Kaus remains
    passive, then summons the chiefs for a retaliatory campaign.
  language: English
  quote_policy: summarized
