canonical_text:
  quote: ''
  summary: Siyawush displays extraordinary skill in a royal hunt, gaining praise.
    Afrasiyab favors him above other courtiers for a year. Piran urges Siyawush to
    strengthen his position through marriage, first offering his daughter Jarira,
    whom Siyawush accepts and marries. Later Piran advises him to seek Afrasiyab's
    daughter Farangis as an additional royal alliance.
  language: English
