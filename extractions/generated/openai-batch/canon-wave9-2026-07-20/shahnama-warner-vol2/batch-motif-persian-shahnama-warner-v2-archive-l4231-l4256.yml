  summary: Fruits and foliage are described as continually blessing the Shah's crown
    and throne. A spoken blessing asks the Creator to bless the Shah because his justice
    civilizes the earth and includes bounty. News spreads that Kai Kaus has taken
    the crown and throne from Mazandaran. Loyal people bring gifts and offerings to
    the monarch, and the world is described as Paradise-like, wealthy, and just. The
    narrator then transitions from the Mazandaran war to the contest with Hamavaran.
