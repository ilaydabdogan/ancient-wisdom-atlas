canonical_text:
  quote: ''
  summary: After a reflection on the instability of worldly fortune, the passage describes
    lamentation in the halls of Siyawush, Afrasiyab's order that Farangis be dragged
    out and beaten so that no avenging offspring or royal lineage may come from Siyawush,
    the condemnation of this order by nobles and populace, and Piran's hurried intervention
    to halt the executioners and rebuke Afrasiyab for killing innocent Siyawush and
    mistreating his own child.
  language: English
  quote_policy: summarized
