- id: obs:1
  text: The passage opens with counsel to release anxious care because the world is
    fickle and no worldly lot abides.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cry rises from the halls of Siyawush; slaves tear their hair, and Farangis
    mourns, tears her cheeks, and curses her father's soul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Afrasiyab orders Garsiwaz to bring Farangis forth, drag her outside by the
    hair, and have guards and executioners strip and beat her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afrasiyab states that the beating is to continue until Farangis casts the
    'seed of vengeance' onto Turanian soil, and he says he wants no tree, bough, leaf,
    crown, or throne to come from Siyawush's root.
  category: speech
  evidence_refs:
  - ev:3
