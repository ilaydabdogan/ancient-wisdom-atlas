canonical_text:
  quote: ''
  summary: A messenger brings Garsiwaz's words to Siyawush. Garsiwaz arrives, and
    Siyawush plans to go with him after a three-day revel. Privately, Garsiwaz fears
    his scheme will fail if Siyawush goes directly to Afrasiyab, so he feigns grief
    with tears. Siyawush offers to support him against the king or any enemy. Garsiwaz
    instead warns Siyawush by invoking old conflicts between Turan and Iran, Afrasiyab's
    killings, and Ahriman's division of hearts. Siyawush answers that the Maker is
    his ally, trusts that Afrasiyab's past gifts show favor, resolves to go to court,
    and says truth dispels falsehood while suspicion leads away from God.
  language: English
  quote_policy: summarized
