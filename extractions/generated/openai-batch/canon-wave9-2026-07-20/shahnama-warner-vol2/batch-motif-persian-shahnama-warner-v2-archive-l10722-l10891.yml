canonical_text:
  quote: ''
  summary: Siyawush refuses Sudaba’s illicit advance on grounds of religion and loyalty
    to his father. Sudaba tears her clothing and face, raises an alarm, and accuses
    Siyawush before the Shah. The Shah questions both, decides to investigate rather
    than act in haste, and tests for physical signs by smelling Siyawush. Finding
    no scent or sign that Siyawush touched Sudaba, he recognizes Siyawush as blameless
    but forgives Sudaba for political and family reasons. Disgraced, Sudaba seeks
    help from a pregnant woman skilled in charms, spells, deceit, and artifice.
  language: English
  quote_policy: summarized
