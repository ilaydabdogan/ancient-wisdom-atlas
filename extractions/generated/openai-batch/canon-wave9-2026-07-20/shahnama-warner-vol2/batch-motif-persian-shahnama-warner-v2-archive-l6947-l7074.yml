canonical_text:
  quote: ''
  summary: In a battlefield encounter, Suhrab pursues and unmasks Gurdafrid, discovers
    that the armored fighter is a woman, and captures her with a lasso. Gurdafrid
    persuades him that continuing the fight would bring shame and offers the stronghold,
    then enters the hold through the gate. Once inside, she mocks Suhrab from the
    ramparts and warns him that the Shah and Rustam will destroy his host. Suhrab
    threatens to raze the walls, pillages the surrounding land, delays the assault
    until daybreak, and returns to camp.
  language: English
  quote_policy: summarized
