  quote: ''
  summary: The passage reports the birth of Farud, the sending of a saffron hand-impression
    as proof and message to Siyawush, Siyawush’s blessing and reward to the messenger,
    Garsiwaz’s jealousy at Siyawush’s rising power, Farangis’s royal display, and
    a sequence of public games and martial displays in which Siyawush excels at polo,
    spear-play, and archery before Garsiwaz proposes a mounted wrestling contest.
