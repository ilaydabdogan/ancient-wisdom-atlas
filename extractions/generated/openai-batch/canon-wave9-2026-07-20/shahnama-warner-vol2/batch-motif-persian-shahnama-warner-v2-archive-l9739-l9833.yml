canonical_text:
  quote: ''
  summary: 'The passage opens with the poet’s reflections on craft, old age, perseverance,
    speech, divine accountability, and the retelling of an old rustic minstrel’s tale.
    It then begins the story of the mother of Siyawush: Tūs, Giv, Gudarz, and other
    cavaliers leave the Shah’s gate to hunt near Daghwi, by a river and a forest near
    the marches of Turan. In the wood they find a beautiful maiden. Tūs questions
    her, and she says she fled from her drunken father, who drew a sword against her.
    She identifies herself as kin to Garsiwaz and descended from Shah Faridun, after
    which Tūs asks why she came on foot, unmounted and unguided.'
  language: English
  quote_policy: summarized
