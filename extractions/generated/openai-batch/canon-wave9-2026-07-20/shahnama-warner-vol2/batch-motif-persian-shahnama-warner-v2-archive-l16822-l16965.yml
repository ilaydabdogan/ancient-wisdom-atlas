canonical_text:
  quote: ''
  summary: 'The passage introduces Part V: Rustam avenges Siyawush, Giv searches for
    and brings Kai Khusrau to Iran, and a dispute over royal succession is resolved
    in Kai Khusrau''s favor. Translator notes emphasize Giv''s sacred mission and
    possible divine assistance, Tus''s political motive, and an Ardabil heat legend
    connected with fire-springs. The poet then laments old age and asks for divine
    respite, followed by the report to Shah Kaus that Siyawush has been killed, with
    nature mourning and details of the beheading.'
  language: English
