canonical_text:
  quote: ''
  summary: 'The passage introduces the War with Mazandaran: Kai Kaus is seduced by
    a div into invading Mazandaran, is captured and blinded with his host by the White
    Div, and is rescued by Rustam. The accompanying note describes Mazandaran’s geography
    beyond the Central Clime, its separation by the Alburz Mountains, its fertile
    but unhealthy marshy environment, traditions about white demons of Mazandaran,
    the White Div’s cave, and Rustam’s difficult route toward the region.'
  language: English
  quote_policy: summarized
