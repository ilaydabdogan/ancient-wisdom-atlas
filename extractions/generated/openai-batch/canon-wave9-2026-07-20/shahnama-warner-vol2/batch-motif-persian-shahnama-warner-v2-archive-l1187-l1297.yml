canonical_text:
  quote: ''
  summary: Afrasiyab describes an overpowering enemy warrior, admits that the Turanian
    forces cannot withstand him, and urges Pashang to make peace with Kai Kubad. He
    appeals to the old division of lands by Faridun, lists the heavy losses of wealth
    and chieftains in the war, warns of Iranian forces approaching from four sides,
    and Pashang, moved and astonished, chooses an envoy to Iran.
  language: English
  quote_policy: summarized
