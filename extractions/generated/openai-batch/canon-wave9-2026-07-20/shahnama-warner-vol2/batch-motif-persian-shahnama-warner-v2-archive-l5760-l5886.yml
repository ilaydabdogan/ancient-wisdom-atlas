canonical_text:
  quote: '"We must not dally, but devise a ruse, / And fall upon them unawares."'
  summary: Afrasiyab learns of Rustam and seven warriors, plans a surprise attack
    under cover of a hunt, and sends a large force. A scout warns Rustam, who remains
    confident, drinks and toasts Kai Kaus and others, then arms with his companions.
    Giv attempts to hold a bridge, the warriors form for combat, Giv strikes down
    enemies, and Rustam advances as Afrasiyab enters the melee.
  language: English
  quote_policy: quoted
