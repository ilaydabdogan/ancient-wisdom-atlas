canonical_text:
  quote: ''
  summary: Rustam rests after roasting an onager while Rakhsh grazes. Turkman horsemen
    track and capture Rakhsh after the horse kills three of them. Rustam wakes, finds
    Rakhsh missing, and follows the tracks to Samangan, where the king receives him,
    promises to recover the horse, and entertains him. At midnight Tahmina, the king's
    daughter, enters Rustam's chamber with a slave bearing a taper, identifies herself,
    and says she has heard many tales of Rustam's feats.
  language: English
  quote_policy: summarized
