canonical_text:
  quote: ''
  summary: A decorated letter proposes that Kai Kubad accept Faridun's old division
    of lands, end the feud over Iraj, and keep the Jihun as boundary. Gifts accompany
    the embassy. Kai Kubad replies that Afrasiyab caused the renewed war by crossing
    the river and by earlier wrongs, but agrees to renew the compact if the other
    side repents. A treaty is drawn up, the envoy returns to Pashang, and Pashang
    withdraws.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A highly decorated letter opens with an invocation of the ruler of sun and
    moon and a prayer that Faridun's soul be accepted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The letter says Tur brought calamity on Iraj over crown and throne, says vengeance
    for Iraj was already carried out by Minuchihr, and argues that feuds should not
    endure forever.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The letter appeals to Faridun's first apportionment, names Turkestan to Ma
    wara 'u'n-Nahr with Jihun as the sender's share, and warns that transgressing
    the boundaries would lead to war, divine wrath, and loss in both worlds.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The letter urges both sides to retain the divisions given to Salm, Tur, and
    Iraj, become friends, and remember that a person finally owns only a grave-sized
    portion of earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sender seals and sends the letter to the Iranian host with jewels, crowns,
    gold thrones, gold-girt damsels, Arabian steeds with golden trappings, Indian
    swords in silver sheaths, and native wares.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An envoy reaches Kubad and gives him the letter and message.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kai Kubad replies that the war was not recommenced by his side, but was caused
    by Afrasiyab, who crossed the river to invade.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kai Kubad's reply says the older wrong began with Tur against Iraj and also
    recalls Afrasiyab's treatment of Naudar and his deed against wise Ighriras.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
