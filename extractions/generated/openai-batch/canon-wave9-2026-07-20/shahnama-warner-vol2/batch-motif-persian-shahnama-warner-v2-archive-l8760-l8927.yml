  text: After escaping his foe, Rustam goes to a rivulet, drinks, bathes, and prays
    to God for strength and victory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says Rustam once possessed such strength that his feet would
    sink into rock, and that he had previously prayed for that strength to be diminished.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Facing Suhrab, Rustam asks God to restore his former strength, and the narrator
    states that God grants the prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Suhrab comes to the field with a lasso on his arm, a bow in hand, and a plunging
    charger, then taunts Rustam for returning after escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rustam and Suhrab tie their steeds and begin wrestling while holding each
