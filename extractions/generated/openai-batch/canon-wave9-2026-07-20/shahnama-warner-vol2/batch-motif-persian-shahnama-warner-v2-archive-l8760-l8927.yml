canonical_text:
  quote: ''
  summary: Rustam recovers at a rivulet, prays for restored strength, and returns
    to fight Suhrab. The two wrestle; Rustam throws Suhrab down and wounds him with
    a sword. As Suhrab lies dying, he speaks of seeking his father and of a keepsake
    from his mother. Rustam reveals that he is Rustam, sees the gem-token, recognizes
    Suhrab as his son, and grieves. Warriors from the camp search for Rustam, report
    his absence, and Kaus orders military signals and a messenger.
  language: English
  quote_policy: summarized
literal_observations:
