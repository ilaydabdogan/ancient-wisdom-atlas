  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Suhrab says that, if Rustam is truly Rustam, Rustam has slain him despite
    his advances, and he asks Rustam to undo his breastplate and view the jewel.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Suhrab says his mother bound the keepsake of his father on his arm and told
