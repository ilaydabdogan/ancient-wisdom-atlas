    arrange a private marriage. Piran petitions Afrasiyab for a match with Farangis.
    Afrasiyab objects because prior warnings and astrologers foretold that his descendant
    through this union would harm him and destroy his realm. Piran advises him not
    to trust the star-readers and says a prince will spring from the noble pair.
