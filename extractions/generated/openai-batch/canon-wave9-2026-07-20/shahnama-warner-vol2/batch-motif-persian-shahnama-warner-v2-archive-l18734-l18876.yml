canonical_text:
  quote: ''
  summary: Farangis, Kai Khusrau, and Giv prepare a secret departure toward Iran by
    opening a hidden palace hoard and taking arms, armour, gems, and horses. Piran
    learns of their flight and sends Kulbad, Nastihan, and mounted troops to seize
    or kill them before they cross a river. While Kai Khusrau and Farangis sleep from
    fatigue, Giv keeps watch, meets the pursuers in battle, drives them back, and
    reports victory to Kai Khusrau.
  language: English
  quote_policy: summarized
