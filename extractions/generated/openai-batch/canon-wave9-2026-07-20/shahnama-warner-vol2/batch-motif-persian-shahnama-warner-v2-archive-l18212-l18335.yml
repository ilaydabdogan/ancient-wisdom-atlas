  quote: ''
  summary: Giv accepts a quest urged by his father to find Kai Khusrau, prepares to
    depart, grants Bamigashasp leave to visit Rustam, sets out alone toward Turan
    with horse, lasso, sword, and disguise, entrusts Bizhan to Gudarz, exchanges prayers
    and embraces with his father, and the passage closes with a moral reflection on
    mortality and service to God.
