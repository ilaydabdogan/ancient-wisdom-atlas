canonical_text:
  quote: ''
  summary: A battle near Sipanjab ends with Faramarz defeating and capturing Surkha.
    Rustam praises Faramarz, then orders Surkha executed in retaliation for Siyawush.
    Surkha pleads innocence and friendship with Siyawush, but Rustam rejects the plea,
    swears vengeance against Turkmans of that frontier, and has Surkha killed and
    his body displayed. Turanian survivors report the death and desecration, noting
    Iranian revenge for Siyawush.
  language: English
  quote_policy: summarized
