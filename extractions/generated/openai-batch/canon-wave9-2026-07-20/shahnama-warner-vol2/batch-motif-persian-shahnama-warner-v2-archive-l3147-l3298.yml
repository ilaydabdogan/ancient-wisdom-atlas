canonical_text:
  quote: ''
  summary: Rustam, wearing a royal helm and tiger-skin, seeks the div Arzhang, kills
    him, and routs the divs. He returns to Kai Kaus and the Iranians, who are in bonds
    and afflicted with blindness or darkness. Kai Kaus warns Rustam about the White
    Div, describes the route over seven mountains to a frightening cavern, and says
    that three drops of blood from the White Div's vitals will cure blindness. Rustam
    sets out with Ulad and Rakhsh; Ulad advises attacking when the divs sleep in the
    heat. Rustam attacks the guards, enters the dark cave, sees the sleeping White
    Div, wakes him rather than killing him asleep, and the White Div charges with
    a millstone.
  language: English
  quote_policy: summarized
