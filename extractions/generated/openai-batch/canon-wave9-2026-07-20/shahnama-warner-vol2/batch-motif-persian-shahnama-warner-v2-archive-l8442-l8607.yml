canonical_text:
  quote: ''
  summary: At night after battle, Suhrab and Rustam each receive reports about the
    other side's champion. Suhrab boasts of his slaughter and vows to leave no foe
    alive. Giv reports that Suhrab challenged Tus and other Iranian warriors, with
    none prevailing, while maintaining single combat. Rustam describes Suhrab's youth,
    enormous strength, and resistance to being lifted from the saddle, then says they
    will wrestle the next day and that victory belongs to God. Kai Kaus promises prayer
    for Rustam's victory. Rustam later gives Zawara instructions for dawn and for
    what to do if he is defeated, including ending the war effort, returning to Zabulistan,
    and consoling his mother.
  language: English
  quote_policy: summarized
