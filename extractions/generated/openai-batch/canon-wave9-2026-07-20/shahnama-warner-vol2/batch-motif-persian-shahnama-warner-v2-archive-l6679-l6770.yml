canonical_text:
  quote: ''
  summary: Suhrab asks for a horse strong enough to bear him and his weapons. His
    mother has herds brought, but Suhrab proves many horses inadequate until a warrior
    presents a colt of the breed of Rakhsh. Suhrab accepts the charger, arms himself,
    seeks leave and aid from his grandsire to go to Iran and see his father, and receives
    royal equipment. Afrasiyab hears of Suhrab's campaign, sends Human and Barman
    with troops, and orders them to keep father and son from recognizing one another.
  language: English
  quote_policy: summarized
