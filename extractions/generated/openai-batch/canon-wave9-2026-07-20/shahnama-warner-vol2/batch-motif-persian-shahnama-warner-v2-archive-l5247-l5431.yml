  summary: The passage presents a letter exchange between Kaiis and Afrasiyab over
    Iran, a battle in which Rustam helps defeat Afrasiyab, and a subsequent account
    of Kaiis ruling justly, appointing Rustam, and compelling divs to build elaborate
    palaces and stables on Mount Alburz, where the royal dwelling has paradisal weather
