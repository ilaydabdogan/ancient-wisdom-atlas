candidate_motifs:
- id: motif:1
  label: Pledge kept under attack
  taxonomy_refs:
  - covenant
  basis: Siyawush is described as constant to his pledge and therefore does not draw
    weapons or permit his companions to fight even when Afrasiyab orders attack.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not state the full terms of the pledge, only that Siyawush
    remains constant to it.
- id: motif:2
  label: Innocent prince ordered to execution
  taxonomy_refs: []
  basis: Siyawush claims innocence; soldiers ask what fault the king has found; Afrasiyab
    nonetheless orders him beheaded on barren ground.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the killing as unjust royal violence, not as a stated
    ritual sacrifice.
- id: motif:3
  label: Malicious counsel turns a king against a guiltless hero
  taxonomy_refs: []
  basis: Garsiwaz questions Siyawush's innocence, is called a double-dealer, interrupts
    the parley, and supports the murderers.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:9
  confidence: high
  cautions: The wider cause of Garsiwaz's hostility is only briefly referenced as
    an earlier contest.
- id: motif:4
  label: Wisdom restrains anger and haste
  taxonomy_refs:
  - wisdom
  basis: Pilsam says deliberation avoids regret, reason is medicine for anger, and
    Afrasiyab should delay the execution.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: This is presented as counsel within the scene, not as a completed resolution
    in the supplied passage.
- id: motif:5
  label: Royal heir's blood threatens retaliatory war
  taxonomy_refs:
  - royal_legitimacy
  basis: The crown and throne are said to weep for Siyawush; Pilsam says his head
    is fit for a crown and warns that Kaus, Rustam, and Iranian champions will avenge
