canonical_text:
  quote: ''
  summary: Siyawush protests his innocence before Afrasiyab while Garsiwaz accuses
    and urges hostility. Afrasiyab orders an attack; Siyawush keeps his pledge by
    not drawing weapons or letting his companions fight. The Iranian force is slaughtered,
    Siyawush is wounded, bound, yoked, and dragged toward Siyawushgird. Afrasiyab
    orders him beheaded on a barren place, but soldiers and then Pilsam object, urging
    deliberation, warning against Ahrimanic haste, and predicting vengeance from Kaus,
    Rustam, and other Iranian champions.
  language: English
  quote_policy: summarized
