  quote: '"By God''s name and the prince''s Grace, the dfvs Went at his bidding"'
  summary: Kai Khusrau asserts divine authorization against a castle of sorcerous
    or demonic opponents. He fixes a letter to a spear and sends Giv to plant it by
    the castle wall while invoking God. The letter vanishes with a crash, the rampart
    splits, darkness and storm-like signs arise, and Khusrau orders an arrow assault
    that slays many divs. Light and a breeze clear the darkness; the gate appears,
    and Khusrau enters the city inside the hold with Gudarz. At the place where light
    first shone he founds a domed Fire-fane for Azargashasp, attended by astrologers,
    archmages, and learned men. News of his divinely graced victory reaches Iran;
    chiefs bring offerings, Fariburz seats and salutes him as Shah, Tus submits Kawa's
    flag, drums, and golden boots and is restored to office, and Kai Kaus welcomes
    Khusrau in a throne-setting scene.
  language: English
  quote_policy: quoted
