  quote: ''
  summary: The passage narrates Siyawush's triumphant arrival at Kai Kaus's court,
    his reception with blessings and gifts, his later investiture after seven years'
    probation, the death of his mother and his mourning, Gudarz's consolation about
    fate and heaven, and the beginning of Sudaba's desire for Siyawush, including
    her secret invitation and his refusal.
  language: English
