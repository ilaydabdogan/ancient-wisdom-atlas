canonical_text:
  quote: ''
  summary: The king of Mazandaran sends Kalahur to confront Rustam. Kalahur tests
    Rustam by gripping his hand, but Rustam overpowers him, and Kalahur advises paying
    tribute. Rustam then appears at the Mazandaran court as an envoy, delivers a letter
    and warning, and praises Rustam in the third person. The king rejects Kaus's demands,
    asserts his own royal authority, threatens war, and tries to buy Rustam's allegiance.
    Rustam rejects the offer. When the king orders the envoy arrested and beheaded,
    Rustam kills the executioner by tearing him apart. He refuses later gifts, leaves
    Mazandaran, returns to the Shah, and urges preparation to fight the divs.
  language: English
  quote_policy: summarized
