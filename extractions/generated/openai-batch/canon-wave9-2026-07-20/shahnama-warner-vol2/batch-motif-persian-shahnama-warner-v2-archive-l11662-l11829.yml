canonical_text:
  quote: ''
  summary: The Shah receives a letter, prays for the young Siyawush, and sends a reply
    praising his victory while instructing him not to disband the army and warning
    him about Afrasiyab. The reply reaches Siyawush, who obeys. Garsiwaz reports the
    Iranian strength to Afrasiyab, who reacts angrily, holds a festival, and then
    suffers a terrifying dream. In the dream Afrasiyab sees a parched battlefield
    full of serpents, eagles, dust, blood, fallen standards, slain troops, an Iranian
    host, his own capture, and his death by a young sword-bearing figure before Shah
    Kaus.
  language: English
  quote_policy: summarized
