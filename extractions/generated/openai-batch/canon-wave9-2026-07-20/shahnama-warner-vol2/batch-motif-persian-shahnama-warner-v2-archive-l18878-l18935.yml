  quote: ''
  summary: Khusrau praises and blesses Giv, then travels with him toward a trackless
    waste. Defeated Turkman troops return to Piran, who angrily questions Kulbad.
    Kulbad reports that Giv endured many axe blows, fought like an elephant, slew
    many, and routed the warriors single-handed. Piran rebukes Kulbad for shameful
    defeat and then selects six thousand horsemen to pursue Kai Khusrau.
