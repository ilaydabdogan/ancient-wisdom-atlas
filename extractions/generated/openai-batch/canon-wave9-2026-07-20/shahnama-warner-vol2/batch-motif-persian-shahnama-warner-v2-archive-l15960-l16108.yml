canonical_text:
  quote: ''
  summary: Damur and Gurwi urge Afrasiyab to heed Garsiwaz and kill the captured Siyawush.
    Afrasiyab says he has seen no fault in Siyawush, but fears both prophecy and revenge.
    Farangis appears in ritual grief, pleads that Afrasiyab not kill a guiltless king,
    invokes divine and cosmic judgment, recalls earlier punished tyrants and Iranian
    champions, then laments the bound Siyawush and curses his accusers. Afrasiyab
    dismisses her and orders guards to confine her in a hidden dark chamber.
  language: English
  quote_policy: summarized
