canonical_text:
  quote: ''
  summary: After Afrasiyab's troubling dream, Garsiwaz advises summoning experts in
    dream interpretation, astrology, and occult lore. Afrasiyab gathers priests, sages,
    and astrologers, commands secrecy, gives them wealth, and asks them to interpret.
    Their spokesman predicts that conflict with Siyawush will bring devastation to
    Turan even if Afrasiyab kills him. Afrasiyab then considers peace, gifts, and
    an embassy. In council he describes the ruin caused by unjust war, including social
    and natural disorder, and orders Garsiwaz to prepare an embassy with horsemen
    and precious things for Siyawush.
  language: English
  quote_policy: summarized
