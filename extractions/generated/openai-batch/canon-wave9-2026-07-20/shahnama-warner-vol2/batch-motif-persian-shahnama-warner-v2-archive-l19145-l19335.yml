canonical_text:
  quote: ''
  summary: Giv captures Piran and brings him before Kai Khusrau. Piran appeals for
    mercy, and Farangis intercedes because Piran had formerly protected her and Khusrau.
    Giv has sworn to shed Piran's blood, so Khusrau directs him to satisfy the oath
    by piercing Piran's ear. Piran is then released on his horse under bonds and an
    oath that only Gulshahr may loose him. Afrasiyab later surveys the defeat, hears
    that Giv alone routed the troops, reflects on God-given fortune, and encounters
    Piran wounded, dusty, bloody, and bound, praising Giv's prowess.
  language: English
  quote_policy: summarized
