canonical_text:
  quote: ''
  summary: Rustam seeks a healing substance and wine from Shah Kaus for the wounded
    Suhrab. Kaus refuses because Suhrab's survival could strengthen Rustam and endanger
    the Shah. Gudarz reports the refusal. Before Rustam can go in person, he is told
    that Suhrab has died. Rustam mourns the son he slew, anticipates the grief and
    curses of kin, covers Suhrab's face, and the army performs public mourning by
    dust-casting, wailing, and burning the camp furnishings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A request is made for a treasury substance that can make the wounded whole,
    together with a cup of wine, so that the speaker's son may recover.
  category: action
  evidence_refs:
