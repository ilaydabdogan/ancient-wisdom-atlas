  text: Rustam laments that he has slain his own son in old age and wonders what explanation
    he can give to Suhrab's mother.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Suhrab is described as a noble warrior-youth, a paladin by birth, valiant,
