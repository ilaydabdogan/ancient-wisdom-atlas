  text: The Shah says that although he honors Rustam, he will not send the elixir
    because Suhrab might live, strengthen Rustam, and bring ruin on him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Shah cites Suhrab's threats and concludes that cherishing foes invites
    contempt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gudarz returns to Rustam, condemns the Shah's harshness, and urges Rustam
    to go personally to change the Shah's heart.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rustam lays the youth on an embroidered robe and sets out, but a messenger
