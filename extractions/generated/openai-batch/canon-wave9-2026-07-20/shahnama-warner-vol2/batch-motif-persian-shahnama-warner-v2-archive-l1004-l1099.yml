  evidence_refs:
  - ev:6
- id: obs:8
  text: Afrasiyab comes forth; Rustam closes with him, catches him by the belt, and
    drags him from his saddle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rustam hopes to take Afrasiyab to Kai Kubad, but the girdle snaps; Afrasiyab
