- id: obs:1
  text: Rustam asks Zal to locate Afrasiyab in the fight and to describe his garb
    and banner.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rustam says that he sees a violet flag and declares that he will seize Afrasiyab's
    girdle and bring him back face-down.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zal warns Rustam not to take risks, characterizes Afrasiyab as a fire-breathing
    Dragon and destructive war-cloud, describes his black flag and mail and iron-and-gold
    armor, and advises avoidance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rustam replies that God, his heart, sword, and arm will aid and defend him,
    and vows to bring Afrasiyab by the belt despite the Dragon and div language.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rustam, called a lion-youth and shelter of the host, rides Rakhsh toward the
    army of Turan amid shouting and trumpet-blare.
  category: action
  evidence_refs:
  - ev:4
