canonical_text:
  quote: ''
  summary: In a battle under Kai Kubad, Rustam asks Zal how to identify Afrasiyab,
    rejects Zal's warning, rides Rakhsh into the army of Turan, seizes Afrasiyab by
    the belt, but the belt snaps and Afrasiyab is rescued and flees. News of this
    defeat prompts the Shah to order a general attack.
  language: English
  quote_policy: summarized
