canonical_text:
  quote: ''
  summary: A formidable warrior, later named Suhrab, attacks Shah Kai Kaus's enclosure
    and intimidates the Iranian warriors. He taunts Kaus, recalls an oath to destroy
    Iran's spearmen and hang Kaus alive, and brings down the tent-enclosure by wrenching
    out tent-pegs with his spear. Kaus sends Tus to summon Rustam. Rustam complains
    that Kaus calls him only for toil and battle, then arms himself, mounts Rakhsh,
    leaves Zawara in charge, and goes out. Rustam and Suhrab move aside for single
    combat. Suhrab mocks Rustam's age, while Rustam answers mildly, recounting his
    victories and saying that he pities the youth and does not wish to kill him.
  language: English
  quote_policy: summarized
