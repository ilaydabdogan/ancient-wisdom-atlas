canonical_text:
  quote: ''
  summary: The passage explains the Doctrine of the Three Bodies, the Five Dhyani
    Buddhas, and the Five Wisdoms as an esoteric sequence from Sangsara toward Nirvana.
    It maps Bardo days to elements, aggregates, obscuring passions, transmuted wisdoms,
    and personifying Buddhas, ending with a discussion of Ether, the Intermediate
    State, and undeveloped supramundane consciousness in ordinary humanity.
  language: English
  quote_policy: summarized
