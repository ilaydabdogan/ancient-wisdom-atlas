- id: obs:2
  text: The Doctrine of the Three Bodies is described as teaching the descent of Teachers
    from the threshold of Nirvana to Sangsara and the progression from Sangsara to
    Nirvana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Five Dhyani Buddhas are said to personify universal divine attributes
    and to symbolize the Sacred Way leading to Dharma-Kaya, Buddhahood, Perfect Enlightenment,
    and Nirvana.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Dharma-Kaya is described as all-pervading voidness and the Body of Truth;
    the Dharma-Dhatu is described as the seed or potentiality of truth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the First Day of the Bardo, the Dharma-Dhatu is said to dawn as the glorious
    blue light of Vairochana and to be symbolized as the Aggregate of Matter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Matter is said to give rise to creatures; animal stupidity and the illusion
    of shape constitute bondage, and their transmutation becomes Right Knowledge or
    Divine Wisdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the Second Day, the Water-Element produces the life-stream or blood; anger
    and consciousness are transmuted into Mirror-like Wisdom personified in Vajra-Sattva.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the Third Day, the Earth-Element produces solid constituents; egoism and
    touch are transmuted into the Wisdom of Equality personified in Ratna-Sambhava.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the Fourth Day, the Fire-Element produces animal heat; attachment or lust
    and feelings are transmuted into All-Discriminating Wisdom personified in Amitabha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the Fifth Day, the Air Element produces breath of life; envy or jealousy
    and volition are transmuted into All-Performing Wisdom personified in Amogha-Siddhi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ether is said to produce the mind or Knower and the desire-body of Intermediate
    State dwellers, but it does not dawn for the deceased because ordinary humanity
    has not developed the Wisdom Faculty of Consciousness.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Vajra-Sattva is related to Mirror-like Wisdom and Bodhic Wisdom and is described
