canonical_text:
  quote: ''
  summary: The passage instructs the deceased in the Bardo to recognize the dazzling
    green light of All-Performing Wisdom, reject attraction to the dull green light
    of the Asura-loka produced by jealousy, pray to Amogha-Siddhi and Tara for guidance
    across the Bardo, and thereby merge into the Divine Father-Mother and attain Buddhahood.
    It then introduces the Sixth Day, when the Divine Fathers-Mothers of the Five
    Orders and the lights of the Six Lokas shine simultaneously.
  language: English
  quote_policy: summarized
