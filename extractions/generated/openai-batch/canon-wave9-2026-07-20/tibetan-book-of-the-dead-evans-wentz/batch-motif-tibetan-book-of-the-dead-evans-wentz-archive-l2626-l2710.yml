  quote: ''
  summary: The passage describes an after-death judgement in which Yama questions
    the deceased about warning messengers of mortality, pronounces karmic consequences,
    and hell-furies inflict purgatorial punishments. It then cites an Anguttara Nikaya
    version with three heavenly messengers and introduces literal and esoteric interpretations
    of rebirth, including yogic recollection of past births and heavenly vision of
    beings passing between states according to karma.
