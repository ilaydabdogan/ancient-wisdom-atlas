canonical_text:
  quote: "“the after-death state is very much like a dream state”"
  summary: The passage explains Bardo experiences as non-universal after-death visions
    shaped by a person's mental content, religious training, and karmic thought-forms.
    It compares the after-death state to dreaming, gives examples of different religious
    afterlife visions, and describes Bardo visions changing until their karmic force
    is exhausted and the Dreamer emerges from the womb into human life again.
