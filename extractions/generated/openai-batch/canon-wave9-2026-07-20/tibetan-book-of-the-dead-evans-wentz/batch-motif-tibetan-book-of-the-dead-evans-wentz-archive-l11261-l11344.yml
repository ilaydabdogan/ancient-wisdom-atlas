canonical_text:
  quote: ''
  summary: The passage explains Yoga as a joining or yoking of lower human nature
    to higher or divine nature through control of mental processes. It describes ignorance
    as arising from false belief in phenomenal reality, and says that when erroneous
    concepts are removed, Illumination dawns as the Primal Clear Light of the Dharma-Kaya.
    It uses metaphors of a dusty mirror, muddied water in a crystal vase, the Veil
    of Isis, and gold separated from impurities to explain how Yoga clears the mind
    and separates Truth from Error. It states that Bardo Thodol teachings require
    Right Knowledge based on realization, and that yogic schools share the goal of
    emancipation from phenomenal existence, called Mukti by Hindus and Nirvana by
    Buddhists.
  language: English
  quote_policy: summarized
