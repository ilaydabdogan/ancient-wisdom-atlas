canonical_text:
  quote: ''
  summary: A prayer for right-knowledge asks the practitioner to recognize dreams,
    waking experience, the body, and bardo appearances as illusory or mind-formed.
    It names successive bardos of meditation, death, reality, and rebirth, prescribing
    undistracted samadhi, abandonment of craving and fear, recognition of apparitions
    as thought-forms, closing of the womb-door, meditation on the Guru Father-Mother,
    and devotion to the Dharma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks to grasp the true nature of dreams, train in the Clear Light
    of Miraculous Transformation, and value practice that blends the sleep state with
    waking experience.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Dhyana Bardo dawns, the speaker asks to abandon distractions and
    illusions, remain in undistracted samadhi, obtain firmness in visualization and
    perfected stages, and avoid misleading passions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Bardo of the Moment of Death dawns, the speaker asks to abandon attraction,
    craving, and worldly weakness, enter bright teachings or the heavenly space of
    the Unborn, and know the flesh-and-blood body as impermanent and illusory.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Bardo of Reality dawns, the speaker asks to abandon fear and recognize
    whatever appears as the speaker's own thought-forms and as apparitions in the
    Intermediate State.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says not to fear the bands of the Peaceful and Wrathful because
    they are the practitioner's own thought-forms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the Bardo of taking Rebirth dawns, the speaker asks to hold to one wish,
    continue good deeds, close the womb-door, recollect revulsion, cast off jealousy,
    and meditate upon the Guru, the Father-Mother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: An addressed procrastinating person is warned that neglecting death, wasting
