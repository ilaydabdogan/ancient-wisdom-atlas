canonical_text:
  quote: ''
  summary: The passage discusses an esoteric interpretation of rebirth doctrine. It
    summarizes an Egyptian/Herodotean theory in which the soul remains in an after-death
    state for three thousand years while bodily constituents transmigrate through
    plants and animals, then reassembles a human body. It connects this to symbolic
    readings of Mystery rites, the Bardo rebirth doctrine, bodily atoms, and the distinction
    between transmigrating matter and the human mind. The notes compare descent-and-return
    traditions involving Rhampsinitus, Nachiketas, Yama, Kunjarakarna, Vairochana,
    and Purnavijaya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A summarized ancient theory says the human soul remains in an after-death
    state for three thousand years, while the body disintegrates and its constituents
    enter animals and plants; at the end, the soul gathers the same particles and
    is reborn in a human body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Herodotus is described as knowing Mystery teachings but refusing to disclose
    them literally, including Egyptian rites at Sais and Greek rites of Demeter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mysteries are described as symbolic dramatic performances for initiates
    and qualified neophytes, illustrating teachings concerning death and resurrection
    or rebirth; transmigration into animal bodies is said to be symbolic rather than
    literal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the amended Egyptian/Herodotean theory helps illustrate the
    symbolic or esoteric interpretation of the Bardo rebirth doctrine.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that bodily atoms transmigrate even before the body's final
    dissolution, that the body renews itself every seven years, and that the mind
    remains human during one lifetime and the larger evolutionary cycle until Nirvanic
    Enlightenment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states as esoteric teaching that matter, in solids, liquids, and
    gases, eternally transmigrates, while what is specifically human and specifically
    sub-human remains so according to a law of like attracting like.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: King Rhampsinitus is described as descending into Hades and returning to the
    human world; Egyptian priests are said to have instituted what was probably a
    rebirth festival in his honour.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nachiketas is described as going to Yama-Loka, the realm of Yama, King of
    the Dead, and then returning to the realm of men; the Katha Upanishad is said
    to use the story for teachings on birth, life, and death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In an Old Javanese legend, the Yaksha Kunjarakarna is commanded by Lord Vairochana
    to go to Yama's kingdom to see what is prepared for evil-doers; the version also
    includes thousand-year periods of transmigration before rebirth in a human body
    free from karmic blemishes, and Purnavijaya is recalled to human life.
  category: sequence
  evidence_refs:
  - ev:8
