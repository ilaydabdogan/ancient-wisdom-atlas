canonical_text:
  quote: ''
  summary: 'The passage explains deathbed instructions for the Bardo: the dying person
    should remain conscious, the vital force is described as remaining in the median
    nerve during a critical interval, the Clear Light is to be recognized, and a guru
    or religious companion may guide the dying person through symptoms such as earth
    sinking into water. Editorial notes describe the Bardo body as an ethereal duplicate
    and compare the need for a deathbed helper with an Ars Moriendi instruction.'
  language: English
  quote_policy: summarized
