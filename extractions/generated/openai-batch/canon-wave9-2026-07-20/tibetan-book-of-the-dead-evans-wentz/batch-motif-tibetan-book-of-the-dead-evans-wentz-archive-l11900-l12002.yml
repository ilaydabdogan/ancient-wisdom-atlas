- id: obs:1
  text: The passage states that individualized mind or consciousness cannot realize
    Reality while it treats phenomenal appearances or states as real.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bardo Thodol teaching is summarized as saying that a mind which regards
    itself as separate from other minds is a plaything of Ward/Ignorance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The separated mind is said to regard the hallucinatory panorama of existences
    within Samsara as real and to lose itself in the Quagmire of Phenomena.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Followers of the Semitic Faiths are described as committed to a theory of
    soul and personal immortality after death in a phenomenal paradise or hell.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Realization of Reality is described as dependent on removing error and false
    belief from the mind and reaching a state in which Mara no longer controls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the mind is freed from karmic obscurations and from the belief that appearances
    in heavens, hells, or worlds are real, Right Knowledge is said to dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes forms merging into non-form, phenomena into that which
    is beyond phenomena, ignorance being dissipated by the Light of Truth, personality
    ceasing, and the pilgrim becoming one with Dharma-Kaya and reaching the Goal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ashvaghosha is named as a great Patriarch who set down essential Mahayana
    teachings in writing in The Awakening of Faith.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The quoted teaching says True Reality is originally one, while degrees of
