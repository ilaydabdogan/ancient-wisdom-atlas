canonical_text:
  quote: ''
  summary: 'The passage explains Reality in Bardo Thodol terms: individualized consciousness
    treats phenomena as real and is bound by ignorance, while liberation requires
    removal of error, dissipation of ignorance, cessation of personality, and union
    with Dharma-Kaya. It contrasts this with personal-immortality views attributed
    to Semitic faiths and quotes Ashvaghosha''s Awakening of Faith on True Reality,
    ignorance, the non-objective world, and Nirvana.'
  language: English
  quote_policy: summarized
