canonical_text:
  quote: ''
  summary: 'The passage describes Tibetan Buddhist death ceremonies after death-symptoms
    are complete: the corpse is covered, left untouched while separation of the Bardo
    body is completed, and a ritual specialist arrives to conduct a chant directing
    the deceased spirit toward the Western Paradise of Amitabha and away from the
    Intermediate State. The specialist commands the spirit to leave bodily and worldly
    attachments and checks the crown aperture for signs of departure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After death-symptoms are completed, a white cloth is thrown over the corpse's
    face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: No person touches the corpse so that the separation of the Bardo body from
    its earth-plane counterpart is not disturbed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The separation process is said normally to take three and one-half to four
    days unless assisted by a priest called the Zpho-bo, described as an extractor
    of the consciousness-principle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Zpho-bo sits at the head of the corpse and dismisses lamenting relatives
    from the death-chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Zpho-bo orders the doors and windows of the death-chamber closed to secure
    silence for the service.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The service consists of a mystic chant with directions for the spirit of the
    deceased to find its way to the Western Paradise of Amitabha and escape the Intermediate
    State if karma permits.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lama commands the spirit to quit the body and its attachment to living
    relatives and goods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lama examines the crown of the corpse's head at the sagittal suture, called
    the Aperture of Brahma, to determine whether the spirit has departed there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the scalp is not bald, the lama pulls out a few hairs directly over the
    Aperture of Brahma.
  category: action
  evidence_refs:
  - ev:6
