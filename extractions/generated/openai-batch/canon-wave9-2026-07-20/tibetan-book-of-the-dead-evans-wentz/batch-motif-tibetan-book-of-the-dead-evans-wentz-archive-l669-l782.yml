canonical_text:
  quote: ''
  summary: 'Foreword passage describing Bardo experiences: terrifying Lower Bardo
    divinities as reflections of evil karma, Peaceful and Wrathful Devatas associated
    with heart and head, reservations about Yoga and Mantra comparisons, entry into
    the Third Bardo around the fifteenth day, karma-directed destinations including
    Hell, Heaven, other Lokas, and earthly rebirth, visions of mating parents before
    rebirth, entry into a womb, and the continuity of changing Skandhas through death
    and rebirth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Power and bad action are described as dissolvent; those attached to the world
    experience this dissolving power as terrible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased’s evil karma in Sangsara is said to be reflected as Divinities
    of the Lower Bardo, who terrify the deceased and cause him to flee and sink toward
    birth in one of the Lokas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Peaceful Devatas are said to issue from the heart, while Wrathful Devatas
    are said to issue from the head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentator states that the heart/head statement does not necessarily
    refer to Yoga centres or to the doctrine of Serpent Power and Six Centres.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Tibetans employ Sanskrit mantras, that such mantras are often
    corrupt in Tibetan books, and that the commentator is uncertain whether Tibetan
    theory matches Hindu theory.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Around the fifteenth day, if not previously liberated, the deceased enters
    the Third Bardo and seeks rebirth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Third Bardo, the deceased’s past life has become dim, the future is
    indicated by premonitory signs, and the soul-complex takes on the colour of the
    Loka in which it is destined to be born.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: If karma leads the deceased to Hell after the Judgement, the deceased goes
    there in a subtle body that cannot be injured or destroyed but can suffer pain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The deceased may instead go to the Heaven-world or another Loka; punishment
    and reward are not eternal, and eventual return to earth follows expiation or
    the end of heavenly enjoyment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For immediate earthly rebirth, the deceased sees visions of mating men and
    women, knows he lacks a gross body of flesh and blood, and desires such a body
    to enjoy physical life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The passage describes sexed attraction and aversion toward the future parents:
    for male birth, aversion to father and attraction to mother; for female birth,
    the reverse.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage cites another Buddhist doctrinal passage in which a being, troubled
    by desire, sees its parents united and conceives desire and hatred according to
    its future sex.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The deceased passes from the Bardo dream-world into a womb of flesh and blood
    and then into waking earth-experience; this is identified as reincarnation or
    rebirth in the flesh.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that nothing is permanent, the soul-complex and body are
    constantly changing, and the process of transformation is not interrupted by death.
  category: attribute
  evidence_refs:
  - ev:10
