canonical_text:
  quote: ''
  summary: The passage explains the need for Bardo instructions for the dying and
    dead, especially when prior teaching, vows, or mental clarity are insufficient.
    It describes the second Bardo as a state of lucidity involving a shining illusory
    or thought-body, where recognition of Clear Light and the meeting of Mother-Reality
    and Offspring-Reality can bring liberation from karma. If recognition fails, the
    third Chonyid Bardo dawns with karmic apparitions. The deceased can perceive funeral
    rites and mourners but cannot be heard by them, and then experiences terrifying
    sounds, lights, and rays; the living are instructed to call the deceased by name
    and explain the teaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the deceased’s favourite deity as a tutelary deity,
    usually one of the Buddhas or Bodhisattvas, with Chenrazee/Avalokiteshvara named
    as a popular example.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A swimming analogy is used to say that hearing theory without practice may
    leave a person unable to act effectively at death; a living guru may uphold and
    direct the deceased, though karma may still obstruct recognition of the Bardo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The instruction is said to be necessary for those mentally weakened by disease,
    and indispensable for those liable to miserable states because of breached vows
    or failed obligations.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the first Bardo stage is missed, applying a distinct recalling in the second
    stage is said to awaken the deceased’s intellect and lead to liberation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the second Bardo, the deceased’s body is described as a shining illusory-body
    or thought-body, and a state of lucidity arises while the deceased does not know
    whether he is dead.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:6
  text: Successful instruction during this lucid state is said to bring about the
    meeting of Mother-Reality and Offspring-Reality, after which the Clear Light dispels
    karma’s power.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before karmic illusions have arisen, the Knower is said to hover within places
    limited by its activities, and effective teaching can keep him from being turned
    away from Enlightenment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the Clear Light is not recognized in the earlier stages, the third Bardo,
    called the Chonyid Bardo, dawns and karmic apparitions appear.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The deceased can see funeral-related actions and hear the weeping and calling
    of friends and relatives, but they cannot hear him calling to them, and he goes
    away displeased.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: At this time the deceased experiences sounds, lights, and rays that awe, frighten,
    terrify, and fatigue him; the instruction is to call the deceased by name and
    explain the teaching.
  category: sequence
  evidence_refs:
  - ev:10
