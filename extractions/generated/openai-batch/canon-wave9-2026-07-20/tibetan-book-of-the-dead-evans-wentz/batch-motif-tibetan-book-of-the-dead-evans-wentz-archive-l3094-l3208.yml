canonical_text:
  quote: ''
  summary: The passage frames rebirth doctrine as requiring esoteric rather than literal
    interpretation, then cites Plato's Republic and the myth of Er as a parallel to
    Bardo rebirth symbols. Er dies, returns to life, and reports an otherworld journey
    involving judges, upward and downward routes, and souls choosing future lives.
    The passage emphasizes Odysseus' choice of an unambitious private life as a clue
    that the animal and human forms in the Platonic account are symbolic of character
    rather than a literal doctrine of transmigration.
  language: English
  quote_policy: summarized
