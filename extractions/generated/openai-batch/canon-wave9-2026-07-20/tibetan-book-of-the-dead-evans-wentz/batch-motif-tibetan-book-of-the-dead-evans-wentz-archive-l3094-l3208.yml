  text: The passage says esotericists reject popular literal interpretations of rebirth
    and karma doctrines attributed to Manu's Laws.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Bardo rebirth symbols should be considered from an
    esoteric standpoint and introduces Plato's Republic as an appropriate parallel.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Er, son of Armenius, is described as slain in battle, found undecayed after
    ten days, laid on a funeral pile, and returned to life on the twelfth day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Er reports that after his soul left his body, he journeyed with a great company
    to a mysterious place containing two openings in the earth and two openings in
    heaven.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Judges sit in an intermediate space and direct the just toward an upward right-hand
