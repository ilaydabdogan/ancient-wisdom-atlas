    choosing an eagle, and Thersites choosing a monkey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Odysseus' soul receives the last lot and chooses the life of a private man
    without cares, a life neglected by the others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the Platonic account can be read superficially and
