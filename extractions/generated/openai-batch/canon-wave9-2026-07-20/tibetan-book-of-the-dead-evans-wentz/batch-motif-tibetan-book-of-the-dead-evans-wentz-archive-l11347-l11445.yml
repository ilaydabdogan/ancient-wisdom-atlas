canonical_text:
  quote: ''
  summary: The passage explains the Clear Light as a death and Bardo experience, links
    its recognition to Right Knowledge, mental concentration, and possible liberation
    beyond the cycle of death and rebirth, then gives a Tantric/Yogic framework involving
    vital force, sheaths, vital airs, Hindu and Buddhist Tantra, and the classification
    of the Bardo Thödol as a Yoga-based Tantric work concerned with birth, death,
    rebirth, states of existence, beings, and salvation.
  language: English
  quote_policy: summarized
