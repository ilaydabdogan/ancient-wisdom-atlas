canonical_text:
  quote: ''
  summary: Two notes cite Richard's translation and compare Suzuki's translation.
    The first says ignorance and mental disturbance may be annihilated while the essence
    of mind remains unchanged; if mind itself were annihilated, beings could not manifest.
    The second uses a lost man's confusion of east and west as an analogy for beings
    who imagine the mind is disturbed, and says understanding birth-and-death as immortality
    or suchness leads to entry into the gate of suchness.
