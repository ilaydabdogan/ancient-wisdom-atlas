canonical_text:
  quote: ''
  summary: 'The passage describes characteristics of existence in the Intermediate
    State: beings of similar nature can perceive one another; the deceased sees familiar
    places and relatives as in dreams but receives no reply; the deceased is warned
    not to cling to relatives and to pray to compassionate divine figures. It describes
    wandering under the force of karma, a grey twilight-like light, a possible duration
    up to the forty-ninth day, and terrifying darkness and threats understood as illusion.
    An introductory note warns disciples not to pursue psychic powers before moral
    mastery.'
  language: English
  quote_policy: summarized
