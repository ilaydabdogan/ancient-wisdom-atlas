  summary: 'The passage explains yogic subtle anatomy: vital airs govern bodily functions;
    invisible psychic channels conduct forces; the central channel in the spine is
    likened to Mt. Meru; left and right channels coil around it like serpents around
    Hermes'' caduceus; chakras are arranged along the central channel; Kundalini or
    Serpent Power lies coiled at the root and is awakened to rise through the centres
    to the thousand-petalled lotus, where consciousness exits at death and heavenly
    ambrosia descends.'
