canonical_text:
  quote: ''
  summary: The passage is an editorial and biographical note on Lama Kazi Dawa-Samdup,
    translator of the Bardo Thodol, including his teacher-disciple relationships,
    initiation, family obligations, career, death, publications, and the editor's
    decisions about transliteration and interpretation. It then gives an epigraph
    attributed to Milarepa about seeing the Dharma-Kaya of one's own mind and introduces
    the Chonyid Bardo as an after-death intermediate-state instruction associated
    with deliverance by hearing, peaceful and wrathful deities, and a warning about
    Death's messengers.
  language: English
  quote_policy: summarized
