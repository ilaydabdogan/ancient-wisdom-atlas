canonical_text:
  quote: ''
  summary: The passage describes Tahdol mantras as funerary talismans for safe passage
    through the Bardo and happy rebirth, then presents instructions for recognizing
    wrathful Heruka deity appearances on successive post-mortem days as manifestations
    of the deceased's own intellect. Recognition, belief, and merging with the tutelary
    deity are said to bring liberation or Buddhahood; terror and non-recognition lead
    to further appearances of blood-drinking deities of different orders.
  language: English
  quote_policy: summarized
