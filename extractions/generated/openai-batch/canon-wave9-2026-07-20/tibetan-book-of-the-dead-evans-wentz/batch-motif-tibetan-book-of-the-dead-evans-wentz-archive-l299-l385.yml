canonical_text:
  quote: ''
  summary: 'The passage explains Hindu and Yoga doctrines of death: bodily apertures
    serve as exits, the best exit is through the cranial Brahmarandhra near the thousand-petalled
    lotus center, and the crest-lock marks that sacred spot. It describes the withdrawal
    of the vital current through the central channel, the dying person''s life-review
    as the symbolic “Book” of memory, the loss of empirical consciousness at death,
    and the unveiling of Pure Consciousness or the Clear Light of the Void. It further
    states that the Void is not absolute nothingness and notes colour symbolism across
    Hindu, Buddhist, and some Islamic mystical systems.'
  language: English
  quote_policy: summarized
