canonical_text:
  quote: ''
  summary: The passage excerpts and comments on a medieval Christian judgement scene
    involving a dying creature, good and bad angels, personified faculties, virtues,
    the Virgin, and the Son. It then compares Christian judgement texts and images
    with Tibetan judgement imagery, noting intermediate-state judgment, scales, heaven
    above hell below, a ladder, Christ, demons, a cauldron, and spiked punishments,
    while contrasting forgiveness of sins with karma and rebirth.
  language: English
  quote_policy: summarized
