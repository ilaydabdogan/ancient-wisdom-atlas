  quote: The Dhaymakdaya can manifest itself in various corporeal forms just because
    it is the real essence of them
  summary: The passage explains that certain beings mistake the Body of Transformation
    as externally sourced and limited, though it is described as a shadow or reflection
    of their own evolving-consciousness and as not subject to limitation or measurement.
    It then identifies the Body of Bliss as a second aspect of the Dharmakaya dependent
    on activity-consciousness in the Bodhisattva path, and states that the Dharmakaya
    can manifest in corporeal forms because it is their real essence.
