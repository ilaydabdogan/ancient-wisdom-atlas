canonical_text:
  quote: ''
  summary: The passage presents an expository account of the Bardo as a staged sequence
    in the mind of the deceased, directed by Karma. It describes the dawning Clear
    Light, Peaceful and Wrathful Deities, flight to the womb, the growth and death
    of the mental-body, chakra lotuses and their petal-symbols, and the symbolic functions
    of several Dhyani Buddhas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bardo is described as resembling an initiatory mystery-play in which actors
    for each day appear on the mind-stage of the deceased, who is the sole spectator,
    while Karma is the director.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The higher or more divine elements of the deceased's consciousness-principle
    dawn first in the primal Clear Light.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The visions diminish in glory: the Peaceful Deities of the Heart-centre and
    Throat-centre merge into the Wrathful Deities of the Brain-centre.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fiercest Wrathful Deities personify human and brutish propensities and
    appear as horror-producing, threatening spectral hallucinations.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The percipient flees from the threatening thought-forms to the refuge of the
    womb and is described as becoming a plaything of Maya and a slave of Ignorance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The after-death mental-body grows from Bardo childhood to Bardo maturity,
    fades, and dies in the Intermediate State as the Knower abandons it and is reborn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Heart-centre Lotus, or Anahata-chakra, is described as a red lotus with
    twelve petals, each petal representing an element of personality.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The Throat-centre Lotus, or Vishuddha-chakra, has sixteen petals: seven Sanskrit
    musical notes, the venom of mortality, seven seed mantras, and the nectar of immortality.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Brain-centre Lotus has a thousand petals assigned letters of the Sanskrit
    or Tibetan alphabet and other symbols, and is said to contain in potential state
    everything in the other chakras or in the universe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Dhyani Buddhas are described as symbolizing definite spiritual attributes
    of the cosmos, with named functions assigned to Vairochana, Vajra-Sattva, Ratna-Sambhava,
    Amitabha, and Amogha-Siddhi.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: In his esoteric aspect, Vajra-Sattva is said to contain or receive the merging
    of all the Peaceful and Wrathful Deities of the Mandala of the Bardo Thödol.
  category: relationship
  evidence_refs:
  - ev:9
