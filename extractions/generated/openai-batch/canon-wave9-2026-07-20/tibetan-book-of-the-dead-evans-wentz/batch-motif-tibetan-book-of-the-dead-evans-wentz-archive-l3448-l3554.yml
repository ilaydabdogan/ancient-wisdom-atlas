canonical_text:
  quote: ''
  summary: The passage interprets animal forms and environments in the Sidpa Bardo
    as symbols of karmically conditioned traits rather than necessarily literal animal
    rebirths. It contrasts popular literal rebirth beliefs with an esoteric reading,
    then describes the deceased in the Plane of Uncertainty overcoming desire through
    Right Knowledge, passing to paradise realms, and, in the case of a highly developed
    yogic saint, returning under the Lords of Karma as a compassionate teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says animal forms and environments named in the Second Book may
    be possible forms and environments entered by the human consciousness-principle
    upon rebirth, and then offers symbolic interpretations of them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog-form is said to symbolize excessive sexuality or sensuality and, in
    popular Tibetan lore, jealousy; the dog-kennel environment is said to symbolize
    abiding in a state of sensuality.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pig is said to symbolize ignorance or stupidity dominated by lust, along
    with selfishness and uncleanliness; the pigsty environment is said to symbolize
    worldly existence dominated by those characteristics.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ant is said to symbolize industry and lust for worldly possessions; the
    ant-hill environment is said to indicate dwelling under corresponding life conditions.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The insect or grub is said to symbolize an earthly or grovelling disposition,
    and its hole an environment dominated by that disposition.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Calf, kid, lamb, horse, and fowl forms are said to symbolize corresponding
    characteristics commonly associated with those animals and humans; the passage
    mentions animal mythology, Aesop, Ezekiel, and Revelation as comparative examples
    of animal symbolism.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the animal symbols should imply that, according to
    karma, the human consciousness-principle normally continues in human form with
    traits symbolized by animals unless it wins Emancipation; exceptional karmic retrogression
    may lead gradually into sub-human kingdoms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage gives examples of animal-like human types, including tiger-man,
    swine-man, fox-man, monkey-man, worm-man, ant-man, butterfly-man, ox-man, and
    lion-man, and rejects popular beliefs that murderers, sensualists, or misers must
    literally be reborn as particular animals.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the Plane of Uncertainty, if Right Knowledge dominates desire for grosser
    sensations, the consciousness-principle capable of realizing Buddhahood triumphs
    and the deceased passes the interval between death and rebirth in a paradise realm
    rather than in the Bardo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A very spiritually developed enlightened one, described as a great yogic saint,
    may gain the highest paradises and be reborn among humankind under the guidance
    of the Lords of Karma, also called Guardians of the Great Law.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The earth-returning one is said to reincarnate out of compassion to assist
    humankind, coming as a Teacher, Divine Missionary, or Nirmanakaya.
  category: sequence
  evidence_refs:
  - ev:11
