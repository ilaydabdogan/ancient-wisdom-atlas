canonical_text:
  quote: the spyang-pu or face-paper is ceremoniously burned in the flame of a butter-lamp
  summary: The passage describes Tibetan death ceremonies involving restoration of
    the deceased's post-mortem awareness, an effigy or spyang-pu, inscriptions invoking
    refuge and guidance, signs for the six worlds of samsaric existence, burning of
    the face-paper in a butter-lamp flame to determine the deceased's fate, transformation
    of ashes into miniature stupas, and later memorial/social rites.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The lamas' stated aim is to restore complete consciousness to the deceased
    after the swoon-state following death and to accustom the deceased to the Otherworld.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rite involving the effigy and spyang-pu is described as a survival from
    pre-Buddhist Bön practice, and Waddell is quoted as calling it essentially a Bön
    rite.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spyang-pu inscription has the deceased take refuge in the lama-confessor
    and peaceful and wrathful deities, and asks the Great Pitier to forgive accumulated
    sins and impurities and show the way to another good world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Phonetic symbols on the spyang-pu refer to six worlds of samsaric existence:
    deva, asura, human, brute animal, preta, and hell worlds.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the termination of the funeral rites, the spyang-pu or face-paper is burned
    in the flame of a butter-lamp and the spirit of the deceased is given a final
    farewell.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The color and action of the butter-lamp flame are used to determine the after-death
    fate met by the deceased.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ashes of the burned spyang-pu are collected, mixed with clay, and made
    into miniature stupas called sa-tschha, often bearing ornamentation or sacred
    letters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: One miniature stupa is kept on the family altar, while the rest are deposited
    in a sheltered place such as a crossroads, hill-top, rock ledge, or cave.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the paper is burned, the rest of the effigy is dismantled; the clothes
    go to the lamas, who sell them and keep the proceeds as part of their fee.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: One year after death, a feast in honor of the deceased is usually given and
    the service of the Medical Buddhas is performed; thereafter, a widow is free to
    remarry.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note states that in Ceylon death-feasts are given to Bhikkhus seven days,
    one month, and one year after death, in the name of the dead, with merit offered
    to the dead to help higher rebirth under some circumstances.
  category: other
  evidence_refs:
  - ev:8
