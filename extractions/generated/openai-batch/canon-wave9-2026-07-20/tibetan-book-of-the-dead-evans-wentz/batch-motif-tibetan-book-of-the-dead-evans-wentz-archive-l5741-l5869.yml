  quote: "“Act so that thou wilt recognize the Bardo.”"
  summary: The passage instructs a deceased addressee on the first day of Bardo visions.
    After a three-and-one-half-day swoon, the deceased is told to recognize the Bardo,
    encounter Vairochana and the Mother of the Space of Heaven, face a brilliant blue
    wisdom light and a dull white deva light, and choose faith in the blue light rather
    than attachment to the deva light.
