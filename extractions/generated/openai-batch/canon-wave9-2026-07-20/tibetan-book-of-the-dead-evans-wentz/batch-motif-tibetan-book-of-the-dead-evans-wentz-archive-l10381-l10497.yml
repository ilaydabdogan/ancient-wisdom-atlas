canonical_text:
  quote: ''
  summary: 'The passage explains the efficacy of the Bardo Thödol in the Sidpa Bardo:
    the deceased may be reminded of memorized ritual instruction, avoid miserable
    rebirth, select or close womb-doors, and be directed toward liberation or an appropriate
    rebirth. It describes the presence of Peaceful and Wrathful Deities, Maras, and
    Interrupters; the deceased’s mental body and heightened perception; several similes
    for directing the deceased; and funerary instructions near the corpse, including
    repeated impressing of the teaching, not disturbing the body, avoiding animal
    killing, avoiding lamentation, and performing virtuous deeds.'
  language: English
  quote_policy: summarized
