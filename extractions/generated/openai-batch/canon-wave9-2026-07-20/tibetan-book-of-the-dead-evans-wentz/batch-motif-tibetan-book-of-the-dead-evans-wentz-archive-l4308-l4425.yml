  summary: The passage recounts traditions about Padma Sambhava translating Tantric
    books into Tibetan, hiding them in secret places, and empowering disciples or
    incarnations to retrieve them later as Tertons. It identifies the Bardo Thodol
    as one such recovered sacred funeral text, cites a block-print list of Eight Lingpas
    or Tertons, and reflects on oral transmission, antiquity, and a comparison with
    the Egyptian Book of the Dead as a record of belief in existence after death.
