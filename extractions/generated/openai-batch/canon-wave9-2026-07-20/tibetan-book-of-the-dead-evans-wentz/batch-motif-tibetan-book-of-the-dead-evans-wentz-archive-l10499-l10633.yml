canonical_text:
  quote: ''
  summary: 'The passage closes the Bardo Thodol by describing its recitation, memorization,
    and liberating power for the dead or dying. The appendix then gives ritual instructions
    for invoking Buddhas and Bodhisattvas when someone is dying: offerings are made,
    incense is held, and a prayer asks compassionate beings to protect the dying person
    through the dangers, darkness, karmic forces, death-messengers, and narrow passage
    of the Bardo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Religious deeds for the deceased are listed, including feeding lamas and the
    poor, almsgiving, presenting religious texts or images to monasteries, and endowing
    monasteries if the deceased had wealth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bardo Thodol and other religious texts may be expounded to the dead or
    dying, joined to The Guide, and recited as often as possible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The words and meanings are to be memorized; if death is inevitable the dying
    person should recite and reflect if able, and a friend should read the Book if
    strength does not permit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Doctrine is described as liberating by being seen or heard, without needing
    meditation or sadhana, and as liberating those of great evil karma through a Secret
    Pathway.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Select Teaching is said to grant Buddhahood at the moment of death and
    to be unsurpassed even by the Buddhas of the Three Times.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The appendix describes rituals and prayers that professional readers of the
    Bardo Thodol must know and apply as needed, beginning with invocation of Buddhas
    and Bodhisattvas when someone is dying.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ritual instruction says to offer actual and mentally-created offerings
    to the Trinity, hold sweet-smelling incense, and repeat the invocation with fervency.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Buddhas and Bodhisattvas in the Ten Directions are addressed as compassionate,
    foreknowing, divinely sighted, loving, and protective, and are asked to come and
    accept the offerings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dying person is described as passing from this world to the world beyond,
    taking a great leap, having no friends or protectors, and having the light of
    this world set.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dying person is described as entering thick darkness, falling down a steep
    precipice, entering jungle solitude, being pursued by Karmic Forces, going into
    Vast Silence, being borne away by the Great Ocean, being wafted on the Wind of
    Karma, and being terrified by Messengers of the Lord of Death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The prayer asks the Compassionate Ones and the Trinity to defend and protect
    the person, turn him from the gloom of the Bardo, the red wind of Karma, the Lords
    of Death, and the long narrow passage-way, and catch him with the hook of grace.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The instruction says that the speaker and others present should repeat the
    prayer three times with humility and faith.
  category: action
  evidence_refs:
  - ev:9
