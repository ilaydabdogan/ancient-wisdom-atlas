  summary: The passage instructs the deceased on the Thirteenth and Fourteenth Days
    to face visions of wrathful female deities, animal-headed goddesses, door-keepers,
    Herukas, and Yoginis. These figures arise from regions or circles associated with
    the deceased's own brain, appear with corpses, blood, weapons, animal heads, and
    directional placements, and are to be recognized without fear as thought-forms
    or tutelary deities.
