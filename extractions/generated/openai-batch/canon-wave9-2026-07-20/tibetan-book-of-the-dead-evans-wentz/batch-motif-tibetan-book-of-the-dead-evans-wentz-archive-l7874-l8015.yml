canonical_text:
  quote: ''
  summary: The passage instructs the nobly-born not to fear multiple directional Yogini
    and deity appearances that arise from within the brain. It explains that Peaceful,
    Wrathful, Mighty, and Blood-Drinking Deities are emanations connected with Dharma-Kaya,
    Ratna-Sambhava, and the addressee's own intellect. Recognizing them as one's own
    radiances leads to at-one-ment and Buddhahood, while fear and nonrecognition lead
    to illusory thought-forms and continued wandering in Samsara.
  language: English
  quote_policy: summarized
