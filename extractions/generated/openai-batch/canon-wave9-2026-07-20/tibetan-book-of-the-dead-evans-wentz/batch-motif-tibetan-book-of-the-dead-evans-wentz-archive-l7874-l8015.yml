  text: The Fifty-eight Blood-Drinking Deities are said to emanate from the addressee's
    own brain and to shine upon the addressee.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the addressee knows the Blood-Drinking Deities as radiances of the addressee's
    own intellect, the text says the addressee will merge in at-one-ment with them
    and obtain Buddhahood.
  category: action
