canonical_text:
  quote: ''
  summary: A prayer invokes conquerors, gurus, devas, dakinis, and related divine
    figures to guide the speakers. It repeatedly describes beings wandering in Sangsara
    through illusion or specific afflictions, assigns each condition a bright light-path
    of wisdom or practice, asks a named Bhagavan or guru group to lead, asks a Mother
    figure to serve as rear-guard, and seeks rescue from the fearful narrow passage-way
    of the Bardo and placement in perfect Buddhahood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prayer addresses conquerors and their sons in the Ten Directions, an ocean-like
    congregation of peaceful and wrathful conquerors, gurus, devas, and dakinis, asking
    them to hear out of love and compassion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers ask the assembly of gurus and dakinis to lead them along the
    Path.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the speakers are wandering in Sangsara through illusion, the prayer names
    the bright light-path of undistracted listening, reflection, and meditation, asks
    the Gurus of the Inspired Line to lead, and asks the bands of Mothers to be rear-guard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When wandering in Sangsara through violent anger, the prayer names the bright
    light-path of Mirror-like Wisdom, asks Vajra-Sattva to lead, and asks Mother Mamaki
    to be rear-guard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When wandering in Sangsara through intense pride, the prayer names the bright
    light-path of the Wisdom of Equality, asks Ratna-Sambhava to lead, and asks the
    Mother She-of-the-Buddha-Eye to be rear-guard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When wandering in Sangsara through great attachment, the prayer names the
    bright light-path of Discriminating Wisdom, asks Amitabha to lead, and asks the
