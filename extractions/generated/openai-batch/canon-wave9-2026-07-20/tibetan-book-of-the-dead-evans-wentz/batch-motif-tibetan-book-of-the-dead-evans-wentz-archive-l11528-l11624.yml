canonical_text:
  quote: ''
  summary: 'The passage explains tantric mandalas and psychic centres in relation
    to the Chényid Bardo: deities dawn over a sequence of fourteen days from the Heart-,
    Throat-, and Brain-centres. It also explains shakti and yab-yum symbolism as the
    union of male and female principles, and comments on restricted esoteric teaching.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The yogi is said to experience Illumination after being filled with supreme
    spiritual power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Bardo Thodol is described as chiefly concerned with three psychic centres:
    the Heart-centre, Throat-centre, and Brain-centre.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brain-centre is called the Northern Centre, the Heart-centre the Southern
    Centre, and the two are described as poles of the human organism.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three chief mandalas are related to the three principal chakra and divided
    into fourteen subsidiary mandalas corresponding to the first fourteen days of
    the Bardo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The first chief mandala contains 42 deities from the Heart-centre; the second
    contains 10 deities from the Throat-centre; the third contains 58 deities from
    the Brain-centre.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The 42 deities are called peaceful, the 58 deities are called wrathful, and
    all groups together form 110 principal deities in the Greater Mandala of the Chényid
    Bardo.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that all the mandalas have definite orientation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage gives a day-by-day sequence in which Dhyani Buddhas, Bodhisattvas,
    Door-keepers, Buddhas of the Six Lokas, Knowledge-Holding Deities, Herukas, Kerima,
    Htamenma, and animal-headed deities dawn.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Each deity, as it dawns from its appropriate psychic-centre, is explained
    as representing after-death karmic activity of a corresponding impulse.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Shakti is defined as the female or negative phase of divine force, personified
    by the consort of a god.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The yab-yum union of male and female principles is said to symbolize completeness
    or at-one-ment; the male is associated with Power and the female with Wisdom.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says inner teachings are withheld from those not carefully prepared
    and are given only to pupils long on probation and found worthy.
  category: speech
  evidence_refs:
  - ev:11
