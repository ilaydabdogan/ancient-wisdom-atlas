canonical_text:
  quote: ''
  summary: The passage explains Bardo visions as hallucinatory, karmically shaped
    embodiments of the deceased percipient’s own thought-forms. Peaceful Deities are
    described as heart-born personifications, Wrathful Deities as brain-centre personifications
    and changed aspects of the Peaceful Deities. Named deities are also interpreted
    as embodiments of universal forces. Recognition that these apparitions lack independent
    reality and are one’s own thought-forms is said to liberate the deceased into
    Reality. The deceased is described as a spectator of a visionary panorama that
    begins gloriously and later becomes terrifying, from which flight is impossible
    because the visions are inseparable from himself.
  language: English
  quote_policy: summarized
