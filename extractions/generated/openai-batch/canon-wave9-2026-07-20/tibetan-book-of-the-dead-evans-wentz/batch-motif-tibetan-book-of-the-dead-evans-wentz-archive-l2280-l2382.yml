    proceeding from the psychic heart-centre and appearing first.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Peaceful Deities come in peaceful aspect to control and influence the
    deceased after his connection with the human world has been severed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased is said to have left relatives, friends, unfinished works, unsatisfied
    desires, and a yearning to regain the opportunity of human embodiment for spiritual
    enlightenment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Karma is described as masterful; unless liberation occurs in the first stages,
