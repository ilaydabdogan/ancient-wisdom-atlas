canonical_text:
  quote: ''
  summary: The passage instructs the deceased in the Bardo not to become angry at
    living relatives who sacrifice animals, conduct rites, give alms, use inherited
    goods, or perform rituals imperfectly. Anger, attachment, resentment, and disbelief
    are said to affect the moment of rebirth and lead to Hell, the world of pretas,
    or other miserable states. The deceased is told to cultivate love, renounce possessions,
    think of offering them to sacred recipients, interpret perceived ritual faults
    as reflections of impure thought, and take refuge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Living relatives may dedicate acts for the deceased by sacrificing animals,
    performing religious ceremonies, and giving alms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased is warned that, because the vision is not purified, anger at
    relatives' actions may arise and may bring about birth in Hell; the instruction
    is to prevent anger and meditate on love for them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Attachment to worldly goods left behind, or anger toward successors enjoying
    those goods, is said to affect the psychological moment and lead to Hell or to
    the world of pretas; the deceased is told to abandon attachment and renounce the
    goods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The deceased is told to think of the remaining worldly goods as offerings
    to the Precious Trinity and guru, and to abide without attachment or desire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Funeral rites, mantra recitations, and rites for absolving bad karma may appear
    to the deceased to be conducted incorrectly, with sleep, distraction, non-observance
    of vows, lack of purity, or levity by officiants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The deceased is said to have limited karmic prescience and therefore to perceive
    fear, black actions, irreligious conduct, and incorrectly recited rituals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the deceased thinks the officiants are playing false, the passage says
    depression, resentment, disbelief, and loss of faith will follow and will lead
    to miserable states.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The instruction is to treat perceived ritual defects as reflections of the
    deceased's own impure thoughts, compared to blemishes seen in a mirror, and to
    take refuge.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: An editorial note says animal sacrifice performed in the deceased's name produces
    karmic consequences for the deceased and that anger on the Bardo-plane must be
    avoided.
  category: other
  evidence_refs:
  - ev:7
