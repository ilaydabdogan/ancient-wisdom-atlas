canonical_text:
  quote: ''
  summary: 'The passage gives an origin account for the Bardo Thodol: it was first
    written in the time of Padma Sambhava, hidden, and later recovered by Rigzin Karma
    Ling-pa from a hill by the Serdan River. It identifies Rigzin as a Knowledge-Holder
    and treasure-revealer, describes the text as a Tibetan Lost Book, and summarizes
    the arrival of Buddhism and Lamaism in Tibet, including royal marriages, the invitation
    of Padma Sambhava, and his exorcism of demons at Samye so a monastery could be
    completed.'
  language: English
  quote_policy: summarized
