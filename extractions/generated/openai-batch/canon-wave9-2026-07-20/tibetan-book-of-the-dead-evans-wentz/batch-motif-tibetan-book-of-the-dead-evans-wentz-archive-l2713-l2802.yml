canonical_text:
  quote: ''
  summary: The passage discusses recollection of previous births through meditation,
    then frames the interpretation of rebirth doctrine as controversial. It contrasts
    esoteric interpreters, who test doctrine and reject scriptural infallibility,
    with an exoteric interpretation in which the human consciousness-stream can re-embody
    in sub-human beings. It also presents an esoteric account of human embodiment,
    life-flux, continuity, and Enlightenment, using a seed analogy.
  language: English
  quote_policy: summarized
