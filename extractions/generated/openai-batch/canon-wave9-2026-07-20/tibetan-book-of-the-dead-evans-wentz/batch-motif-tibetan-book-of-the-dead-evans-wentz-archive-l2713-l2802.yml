  text: The quoted passage uses the image of darkness departing and light arriving
    for the result of meditation and subduing passions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The editor states that successful practice of this yoga is not known among
    contemporary Southern Buddhists, but is reported among Northern Buddhists and
    Hindus, producing modern saints and some believed to be Arhants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The editor says the right interpretation of the Rebirth Doctrine is highly
    controversial among peoples who hold the doctrine and is fundamental to the Bardo
    Thodol.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Initiates holding the esoteric interpretation are said to test doctrines before
