  quote: ''
  summary: An expository addendum identifies ultimate reality, Dharma-Kaya, and Supreme
    Nirvana as unborn, unending, non-annihilating, wise, pure, and non-dual. It then
    invokes Ashvaghosha as support for Mahayana philosophy underlying the Bardo Thodol
    and contrasts Northern/Mahayana and Southern/Hinayana Buddhism by institutional
    organization, ritual, pantheon, Yoga, and named religious figures.
  language: English
  quote_policy: summarized
