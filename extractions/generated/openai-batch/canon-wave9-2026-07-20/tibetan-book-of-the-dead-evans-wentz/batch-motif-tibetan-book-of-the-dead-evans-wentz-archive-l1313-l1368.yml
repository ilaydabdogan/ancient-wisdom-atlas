  text: The fifth element, Ether, is said to have a primal form symbolized as the
    green light-path of the Wisdom of Perfected Actions, and this light-path does
    not dawn for the deceased because the Wisdom or Bodhic faculty is not perfectly
    developed.
  category: attribute
  evidence_refs:
