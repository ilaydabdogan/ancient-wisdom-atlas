canonical_text:
  quote: ''
  summary: The passage explains a Tibetan Buddhist instruction for the dying in which
    void consciousness and shining intellect are recognized as inseparable, as the
    All-Good Buddha, Dharma-Kaya, and Buddha Amitabha. Editorial notes explain Father/Mother
    symbolism, consciousness terminology, and a comparison with the Diamond Sutra.
    The instruction says to repeat the teaching three or seven times so the dying
    person recognizes the Clear Light and attains liberation; if the primary Clear
    Light is not recognized, a secondary Clear Light dawns after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note identifies Chés-nyid Kuntu-bzang-po, Sanskrit Dharma-Dhatu
    Samanta-Bhadra, as the embodiment of the Dharma-Kaya and the first state of Buddhahood.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note describes the Father as phenomena, bliss, radiance, or intellect,
    and the Mother as consciousness of phenomena or voidness perceiving bliss, radiance,
    or intellect.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the intellect is not to be regarded as the voidness
    of nothingness, but as unobstructed, shining, thrilling, blissful consciousness,
    the All-Good Buddha.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that one's own void consciousness and shining, blissful
    intellect are inseparable, and that their union is the Dharma-Kaya state of Perfect
    Enlightenment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies shining, void consciousness, without birth or death,
    with the Immutable Light, Buddha Amitabha.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Recognizing the voidness of one's own intellect as Buddhahood is described
    as keeping oneself in the divine mind of the Buddha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The instruction says to repeat the teaching distinctly and clearly three or
    seven times; this recalls the prior setting-face-to-face by the guru, causes naked
    consciousness to be recognized as the Clear Light, and makes liberation certain
    through union with the Dharma-Kaya.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the primary Clear Light has not been recognized, the secondary Clear Light
    is said to dawn upon the deceased immediately after death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Footnotes distinguish rig-pa as consciousness in a pure spiritual aspect from
    shes-rig as intellect or consciousness of phenomena, and state that in the Samanta-Bhadra
    state experiencer and experienced are inseparably one.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: An editorial comparison cites a Diamond Sutra teaching that phenomena are
