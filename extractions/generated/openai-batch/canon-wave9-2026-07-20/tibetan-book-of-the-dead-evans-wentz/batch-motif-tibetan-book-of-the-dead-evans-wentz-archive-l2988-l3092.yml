canonical_text:
  quote: ''
  summary: The passage presents an esoteric interpretation of rebirth, using citations
    from The Laws of Manu. It says human consciousness or a life-flux does not instantly
    disintegrate after death, and that moral action conditions future states. Manu
    is quoted as describing a complex human constitution involving vital spirit, elemental
    body, reasonable or intellectual soul, and divine essence. The vital or animal
    soul is said to be examined, rewarded, punished by Yama, purified, returned to
    pure elements, or made to enter sub-human and other forms according to sins. The
    editor distinguishes this from a literal belief that a whole human consciousness
    reincarnates into an animal within forty-nine days.
  language: English
  quote_policy: summarized
