canonical_text:
  quote: May [I] be led safely across the fearful ambush of the Bardo;
  summary: 'A bardo prayer asks to be led by Vairochana and guarded by the Divine
    Mother across the Bardo into Buddhahood. The passage then gives Second Day instructions:
    Vajra-Sattva/Akshobhya appears with Mamaki and attendant Bodhisattvas; a bright
    white light of Mirror-like Wisdom and a dull smoke-coloured light from Hell appear;
    the deceased is urged not to fear the white light but to take refuge in it.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The prayer presents the speaker as wandering in Samsara because of intense
    stupidity and asks to be led on the radiant light-path of Dkarma-Dhatu Wisdom
    by Vairochana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer asks that the Divine Mother of Infinite Space be the speaker’s
    rear-guard and that the speaker be led safely across the fearful ambush of the
    Bardo into All-Perfect Buddhahood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that, by praying with intense humble faith, the deceased
    will merge in a halo of rainbow light into Vairochana’s heart and obtain Buddhahood
    in the Sambhoga-Kaya in the Central Realm of the Densely-Packed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the deceased is startled by the glorious light and flees because of anger
    or obscuring karma, Vajra-Sattva, attendant deities, and the deceased’s evil deeds
    meriting Hell will come to receive the deceased.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the Second Day, the pure form of water is said to shine as a white light,
    and Vajra-Sattva/Akshobhya appears from the deep blue Eastern Realm of Pre-eminent
    Happiness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vajra-Sattva/Akshobhya is described as blue, holding a five-pronged dorje,
    seated on an elephant-throne, embraced by Mother Mamaki, and attended by four
    named Bodhisattvas.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The aggregate of consciousness in its pure form, Mirror-like Wisdom, shines
    as a bright white light from the heart of Vajra-Sattva, the Father-Mother, while
    a dull smoke-coloured light from Hell shines alongside it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The instruction warns that anger may produce fear of the dazzling white light
    and fondness for the smoke-coloured Hell light, and it commands the deceased to
    know the white light as Wisdom and take refuge in it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage identifies Vajra-Sattva as coming to receive the deceased and
    save the deceased from the fear and terror of the Bardo, and describes the rays
    of grace as a hook.
  category: speech
  evidence_refs:
  - ev:8
