canonical_text:
  quote: ''
  summary: The passage instructs the deceased in the Bardo not to be attracted to
    or repelled by womb appearances, to take refuge, pray to compassionate divine
    figures, release attachment to living relatives, and enter favorable light paths.
    It then gives officiant instructions for repeated readings and prayers, followed
    by a general conclusion describing graded possibilities for liberation, upward
    departure, recognition of Clear Light or deities, and downward wandering into
    the Sidpa Bardo for those with weak karmic connections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A womb may appear good or bad, and the instruction is to avoid both attraction
    and repulsion by entering a state of impartiality.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those unable to abandon attraction and repulsion, and described as having
    low mentality and evil karma, are said to be liable to take refuge among brutes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deceased is addressed by name and told to call upon the Precious Trinity,
    take refuge, and pray to the Great Compassionate One.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The deceased is told to walk with head erect, know themselves in the Bardo,
    and cast away attachment to sons, daughters, and other relations left behind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deceased is directed toward the White Light-Path of the devas or the Yellow
    Light-Path of human beings, and toward mansions of precious metals and delightful
    gardens.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The officiant is instructed to repeat the address seven times and to read
    or offer several named Bardo prayers and texts, including the Zahdol and a rite
    of liberation through propensity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Advanced devotees or yogis are said to be able to use Transference at death,
    avoid traversing the Intermediate State, and depart by the Great Straight-Upward
    Path.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Less practiced persons may recognize the Clear Light in the Chonyid Bardo
    at death and proceed upward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Others may be liberated when Peaceful and Wrathful Deities dawn upon them
    in the Chonyid Bardo, if recognition occurs at a turning point.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those with very weak karmic connections and many obscurations are described
    as wandering downward into the Sidpa Bardo and falling under awe and terror.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note says portions of the Zahdol are made into yantras or talismans, attached
    to the bodies of living and dead persons, and cremated or interred with the corpse
    at death.
  category: object
  evidence_refs:
  - ev:9
