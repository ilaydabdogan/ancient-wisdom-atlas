canonical_text:
  quote: ''
  summary: The passage explains mantras as guarded words of power tied to sound, vibration,
    deity invocation, initiation, guru transmission, Kundalini awakening, inner ascent
    through psychic centres, ritual purity, and divergent white- and black-magic uses.
    It also notes that the Bardo Thodol often directs the dying or deceased to visualize
    a tutelary deity or guru and remember teachings from the human guru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A left-hand adept or black magician is described as using mantras to call
    up, command, and even annihilate elementals or inferior spiritual beings by knowing
    their particular vibration as sound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mantras are described as jealously guarded words of power kept by guru lineages;
    candidates are tested before the Treasures are entrusted to them and before they
    become Guardians.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tested shishya receives a mantra said to give power over the sleeping Goddess
    Kundalini; when uttered, the Goddess awakens, comes to be commanded, and can either
    destroy or save depending on use.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mantra sounds set inner vital airs in motion; the Goddess catches subtle occult
    sound and causes it to ascend from the Root-Support Psychic-Centre through higher
    centres to the Lotus of a Thousand Petals, where the Supreme Guru responds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Visualizing a deity or audibly pronouncing the mantra corresponding to that
    deity is described as a way to make the deity appear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mantras are said to be ineffective unless properly intoned, and to appear
    meaningless to the uninitiated without guidance from the human guru.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Correct pronunciation of a deity's mantra is said to depend on bodily purity
    and proper intonation; the devotee purifies the mouth, tongue, and mantra and
    awakens the mantra's sleeping power.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The occult ability to use mantras is said to confer supernormal powers that
    may be used as white magic for good ends or black magic for evil ends; one path
    leads upward to Emancipation and the other downward to Enslavement.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Bardo Thodol is described as frequently directing the dying or deceased
    to concentrate on or visualize a tutelary deity or spiritual guru, or to recollect
    teachings from the human guru, especially teachings given at mystic initiation.
  category: action
  evidence_refs:
  - ev:9
