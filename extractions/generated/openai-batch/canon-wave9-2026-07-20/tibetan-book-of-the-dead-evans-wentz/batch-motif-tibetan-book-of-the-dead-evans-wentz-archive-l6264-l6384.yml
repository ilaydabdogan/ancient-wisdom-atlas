canonical_text:
  quote: ''
  summary: The passage instructs the deceased to trust the bright red rays of Amitabha's
    grace and avoid the dull red Preta-loka light. A prayer asks Amitabha and the
    Divine Mother to guide the deceased across the Bardo to Buddhahood. The Fifth
    Day section then describes Amogha-Siddhi, his consort Dolma, attendant Bodhisattvas,
    the green light of the air element, and the green light of All-Performing Wisdom
    appearing to the deceased.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed deceased is told to regard the rays as the grace of Bhagavan
    Amitabha, take refuge in them, trust them, and not flee from them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased is warned not to be attracted to the dull red light of the Preta-loka,
    which is described as a light-path that can lead to the World of Unhappy Spirits
    and suffering from hunger and thirst.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prayer asks to be led on the radiant light-path of Discriminating Wisdom
    by Bhagavan Amitabha, with the Divine Mother She-of-White-Raiment as rear-guard,
    safely across the dangerous ambush of the Bardo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The text states that praying humbly and earnestly leads to merging into the
    heart of the Divine Father-Mother Amitabha in a halo of rainbow-light and attaining
    Buddhahood in the Sambhoga-Kaya in the Western Realm named Happy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For beings not yet liberated, the Fifth Day brings the appearance of Bhagavan
    Amogha-Siddhi with attendant deities, light, and rays of grace; a light from the
    Asura-loka, produced by jealousy, also comes to receive the deceased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the Fifth Day, the green light of the primal form of the element air shines,
    and Amogha-Siddhi appears green from the Green Northern Realm, bearing a crossed-dorje,
    seated on a sky-traversing Harpy-throne, and embraced by the Divine Mother Faithful
    Dolma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Amogha-Siddhi appears with two Bodhisattvas, Chag-na-Dorje and Dibpanamsel,
    and two female Bodhisattvas, Gandhema and Nidhema; the six Bodhic forms shine
    from a halo of rainbow light.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The green light of All-Performing Wisdom is described as dazzling, transparent,
    radiant, and issuing from the heart of the Divine Father-Mother Amogha-Siddhi
    to strike the deceased's heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Editorial notes identify the crossed-dorje as symbolizing equilibrium, immutability,
    and almighty power; the Harpy-throne as involving bird-human creatures; Dolma/Tara
    as a Saviouress; and Gandhema as associated with spraying perfume and a shell-vase
    of perfume.
  category: attribute
  evidence_refs:
  - ev:6
