canonical_text:
  quote: "“When I behold the future parents in union”"
  summary: A Bardo prayer asks for protection from hunger, thirst, heat, and cold;
    for future parents to be perceived as a divine Father-Mother pair; for favorable
    rebirth, miraculous bodily qualities, memory of past lives, mastery of knowledge,
    and benefit to sentient beings. Notes relate these requests to preta and hell
    sufferings, Buddha birth traditions, and Pali Canon teachings on conscious womb-entry.
    The passage ends with a colophon dedicating the manuscript’s merit to sentient
    beings called Mothers and wishing auspiciousness for the book and world.
  language: English
  quote_policy: quoted
