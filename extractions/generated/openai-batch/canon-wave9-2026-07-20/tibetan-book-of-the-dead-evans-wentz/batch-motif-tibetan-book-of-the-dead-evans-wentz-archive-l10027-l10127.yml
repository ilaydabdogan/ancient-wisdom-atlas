canonical_text:
  quote: ''
  summary: Commentarial material explains the Bardo as an illusory intermediate state
    in which spirits may be delayed by false beliefs, spirit-evocation, or karma.
    The translated instruction advises the post-mortem addressee to recognize Voidness
    or illusion, meditate on the Great Compassionate One, and, if rebirth is unavoidable,
    select a womb-door or transfer to a Buddha realm while resisting hostile forces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that beings in the Intermediate State, including sprites,
    prefas, demons, and deceased human entities, can become habituated to the Bardo
    and have their normal evolution retarded.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spirit called up in evocation is described as being strengthened in the
    illusion that the Bardo is a state where real spiritual progress is possible,
    so it may make no attempt to leave.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Bardo is described as a realm of illusion in which experiences and visions
    accord with karma and with thought-forms carried over from earth-life.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some evoked spirits are described as senseless ghosts or psychic shells that
    are animated when in rapport with a human medium.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage distinguishes Tibetan oracular practice, in which lamas call low-order
    tutelary deities called bkah-dod, from intentionally calling the ghosts of recently
    deceased humans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some bkah-dod are said to be spirits of lamas or devotees who failed to obtain
    enlightenment and became demoniacal or malignant through evil karma.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says obsessing demons can mentally and psychically harm untrained
    mediums and clients.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Necromancy in Sikkim and Bhutan is described as widespread among some Buddhist
    layfolk and opposed by lamas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The instruction says that recollection of teachings on Voidness is best; otherwise
    the addressee should regard all things as illusion, avoid attraction, and meditate
    on the Great Compassionate One.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: If karma makes womb-entry necessary, the addressee is instructed in selecting
    the womb-door and warned not to enter just any womb.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: If compelled by tormenting furies to enter a womb, the addressee is told to
    meditate upon Hayagriva.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The addressee is said to possess slender supernormal foreknowledge, allowing
    places of birth to be known one after another.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'Two alternatives are stated: transference of the consciousness-principle
    to a pure Buddha realm, or selection of an impure sangsaric womb-door.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Bardo-bound spirit may be delayed for hundreds or thousands of years, cannot
    pass to a paradise realm or be reborn during that delay, and ultimately enters
    a womb.
  category: sequence
  evidence_refs:
  - ev:8
