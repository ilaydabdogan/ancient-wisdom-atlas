literal_observations:
- id: obs:1
  text: Jambuling is described as a continent whose name means a region where jambu-fruit
    fall into water; it is pear-shaped or subtriangular, blue, abundant in riches
    and plenty, and 7,000 miles in diameter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jambuling’s inhabitants are said to have faces conforming to the continent’s
    shape, and both good and evil are said to be present there.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Western Continent, Balongchéd or Godhana, is described as sun-shaped,
    red, 8,000 miles in diameter, and inhabited by powerful round-faced people who
    eat cattle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Northern Continent, Daminyan or Uttara Kuru, is described as square, green,
    10,000 miles in diameter, and inhabited by people with corresponding horse-like
    square faces.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Northern Continent, trees supply the inhabitants’ sustenance and wants,
    and the Kuru are said to haunt trees as tree-spirits after dying.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each satellite continent is said to resemble the continent to which it is
    attached and to be half its size.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ngadyabling, the left satellite of Jambuling, is described as the world of
    the Rakshasas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Padma Sambhava is said to have gone to the Rakshasas to teach them goodness
    and salvation, and is believed to remain there as their king.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mt. Meru is described as having an eastern face of silver, a southern face
