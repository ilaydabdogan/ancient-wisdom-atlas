  summary: 'The passage describes regions within Buddhist cosmography: Jambuling,
    the Western Continent, the Northern Continent, and satellite continents including
    a Rakshasa world. It also notes symbolic interpretation of Mt. Meru’s colored
    material faces and says such symbolism is treated by Indian and Tibetan occult
    specialists as requiring an explanatory key.'
  language: English
