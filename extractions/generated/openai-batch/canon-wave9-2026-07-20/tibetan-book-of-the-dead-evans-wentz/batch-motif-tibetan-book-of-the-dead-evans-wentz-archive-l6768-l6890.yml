canonical_text:
  quote: ''
  summary: Amitabha's red light-path of Discriminating Wisdom appears to the addressed
    nobly-born one. The passage instructs the hearer to recognize the lights as radiances
    of their own intellectual faculties, remain in non-thought, and not fear or be
    attracted. It contrasts pure Wisdom radiances with dull impure lights of the Six
    Lokas, warning that attraction to the latter leads to rebirth and suffering in
    samsara. The hearer is told to trust the Five Orders of Buddhas and pray for guidance
    by the Five Victorious Conquerors and rearguard protection by the Five Orders
    of Divine Mothers.
  language: English
  quote_policy: summarized
