canonical_text:
  quote: ''
  summary: The passage explains postmortem stages in which a Bodhisattva's light directs
    the dying toward the Tathagata, the deceased is urged to recognize the Clear Light
    for liberation, and failure leads through a secondary Clear Light, the first Bardo,
    and then the Chinyid Bardo. It describes the soul-complex as emerging from the
    Void into a dream-like state until rebirth in a fleshly body, and includes authorial
    comparisons with Shaiva/Tantric schemes and Spiritist views of postmortem continuity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bodhisattva emits a light called “Seeing the Buddha” so that the dying will
    think of the Tathagata and go to the Tathagata's pure realms after death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dying or deceased man is instructed to recognize the Clear Light, with
    liberation presented as the result if recognition occurs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the deceased does not recognize the Clear Light, worldly tendency draws
    him away, and a secondary Clear Light is presented, dimmed by Maya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the mind does not rest in the secondary presentation, the first or Chikhat
    Bardo ends; its duration is described as variable.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Chinyid Bardo there is a recovery of Death-Consciousness of objects,
    compared to reawakening from a swoon but not to ordinary waking life before death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The soul-complex emerges from the Void into a dream-like state, which continues
    until it attains a new fleshly body and wakes again to earth-life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author first thought the fifteen days after recovery from the swoon resembled
    a gradual arising of limited consciousness known from the thirty-six Tattvas and
    related Shaiva/Tantric material, but then rejected that reading.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author states that after the first Bardo the scheme begins with complete
    recovery of Death-Consciousness, without intermediate stages, and treats postmortem
    psychic life as a continuation of the life immediately before the swoon.
  category: speech
  evidence_refs:
  - ev:8
