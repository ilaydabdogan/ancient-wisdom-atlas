canonical_text:
  quote: ''
  summary: The passage describes signs of death through elemental images, gives instructions
    for a reader or lama to address the dying person, directs the dying person to
    resolve toward Buddhahood for all sentient beings, explains recognition of the
    Clear Light in the Bardo, and includes editorial notes on trained lamas, karma-conditioned
    rebirth, assumed religious forms, and a comparison with a Christian deathbed manual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage lists three chief symptoms of death with symbolic counterparts:
    pressure as earth sinking into water, coldness turning to heat as water sinking
    into fire, and a sensation of being blown to atoms as fire sinking into air.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each death symptom is said to have visible external bodily changes, including
    loss of facial muscle control, hearing, and sight.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the symptoms of death are nearly complete, the reader is instructed to
    speak a resolution to the dying person in a low voice near the ear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dying person is addressed as nobly-born, or as venerable sir if a priest;
    if a brother in the Faith or another person, the reader calls the person by name.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dying person is instructed to resolve to take advantage of death to obtain
    Perfect Buddhahood for the good of all sentient beings through love, compassion,
    and effort toward the Sole Perfection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that at this time the Dharma-Kaya of Clear Light after
    death can be realized for the benefit of all sentient beings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The resolution includes knowing the Bardo, mastering the Great Body of Union
    in Bardo, appearing in whatever shape will benefit beings, and serving sentient
    beings infinite as the limits of the sky.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: An explanatory note says trained lamas detect interdependent psychic phenomena
    culminating in the release of the Bardo body from its human-plane envelope.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The translator’s note says learned lamas, while dying, explained the process
    of death to their pupils in analytical detail.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A footnote says realization of Ultimate Truth is possible in this state if
    sufficient progress on the Path was made before death; otherwise the deceased
    wanders into lower Bardo conditions as determined by karma until rebirth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note explains the phrase about appearing in whatever will benefit beings
    as assuming a religiously appealing form, such as Shiva for a Shaivite devotee,
    Buddha Shakya Muni for a Buddhist, Jesus for a Christian, and the Prophet for
    a Moslem.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The reader is instructed to repeat the words distinctly with lips close to
    the ear so that the dying person’s mind does not wander.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the breath has completely ceased, the nerve of sleep is to be pressed
    firmly, and a lama or more learned person is to impress the Clear Light instruction.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The deceased or dying person is told that the present intellect is naturally
    void, without characteristics or colour, and is Reality, the All-Good.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: A footnote identifies Shes-rig as the intellect, the knowing or cognizing
    faculty.
  category: attribute
  evidence_refs:
  - ev:13
