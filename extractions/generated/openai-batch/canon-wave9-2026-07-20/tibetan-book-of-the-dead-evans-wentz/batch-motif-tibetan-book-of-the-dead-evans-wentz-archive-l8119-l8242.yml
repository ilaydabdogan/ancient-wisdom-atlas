- id: obs:1
  text: The reader or deceased person is instructed to have faith in the Blood-Drinking
    Deities and to offer a prayer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer describes the speaker as wandering in Sangsara and the Bardo under
    overpowering illusions, alone and separated from dear friends.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bands of Peaceful and Wrathful Bhagavans are asked to lead the speaker, while
    Wrathful Goddesses Rich in Space are asked to serve as rear-guard and save the
    speaker from fearful ambuscades of the Bardo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Buddhas are asked to prevent fear, awe, and terror when the void forms
    of one’s own thoughts shine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The prayer asks that the five bright Wisdom-Lights and the divine bodies of
    the Peaceful and Wrathful Ones be recognized without dread or awe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Tutelary deities are asked to dissipate karmic misery, and the natural sound
    of Reality, likened to a thousand thunders, is to be transmuted into the sounds
    of the Six Syllables.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: The Gracious Compassionate One is asked for protection; the Clear Light is
    asked to dawn; the Five Elements are asked not to arise as enemies; and the realms
    of the Five Orders of Enlightened Ones are to be beheld.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that sincere repetition of the prayer causes fears to vanish
    and leads to Buddhahood in the Sambhoga-Kaya, and it instructs repetition three
    or seven times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The note identifies the Six Syllables as the mantra of Chenrazee, credits
    the mantra with ending the cycle of rebirth, and assigns each syllable a color
    and a rebirth realm whose door it closes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: An old Tibetan folk-tale says that a devotee’s irreligious mother, habituated
    to reciting the mantra, was reborn in Hell; her son went to rescue her, and her
    recitation there liberated herself and all who heard it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The conclusion says that misleading illusions occur at death, that the text
    is indispensable, and that practiced meditators may recognize Truth or the Clear
    Light when body and consciousness separate.
  category: sequence
  evidence_refs:
  - ev:5
