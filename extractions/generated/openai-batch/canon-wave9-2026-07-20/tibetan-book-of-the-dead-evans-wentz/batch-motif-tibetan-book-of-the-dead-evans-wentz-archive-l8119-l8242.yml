canonical_text:
  quote: ''
  summary: The passage gives a Bardo prayer asking Blood-Drinking, Peaceful, Wrathful,
    and tutelary deities, Buddhas, goddesses, and Chenrazee to guide and protect the
    wanderer, remove fear, enable recognition of lights and divine bodies, transform
    the thunder-like sound of Reality into the Six Syllables, and bring Buddhahood.
    Notes explain the Chenrazee mantra, its six syllables and associated rebirth realms,
    and an old Tibetan folk-tale in which mantra-recitation liberates a mother and
    other beings from Hell. The conclusion stresses that misleading illusions arise
    at death and that recognition of Truth or the Clear Light is decisive in the Bardo.
  language: English
  quote_policy: summarized
