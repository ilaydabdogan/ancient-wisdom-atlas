    hook of compassion and lead the deceased to holy paradises.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A further prayer asks bands of Heroes and Knowledge-Holders to lead on the
    bright light-path of Simultaneously-born Wisdom and asks bands of Mothers, the
    Dakinis, to be the rearguard.
  category: speech
  evidence_refs:
