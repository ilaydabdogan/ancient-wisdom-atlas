canonical_text:
  quote: ''
  summary: The passage warns the deceased not to follow a dull blue light leading
    to the brute-world, but to direct faith toward a bright five-coloured radiance
    and the Knowledge-Holding Deities, Heroes, and Dakinis who can lead the deceased
    to pure paradise realms. It then marks the end of the peaceful deity phase and
    introduces the dawning of fifty-eight wrathful, flame-enhaloed, blood-drinking
    deities, described as changed aspects of the former peaceful deities. Recognition
    of these deities can bring liberation or Buddhahood; fear and non-recognition
    lead beings downward into unhappy worlds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is warned not to be attracted to the dull blue light of the
    brute-world because attraction to it leads to fall into that world and its sufferings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is instructed to put faith in a bright, dazzling, five-coloured
    radiance and to direct the mind toward the Knowledge-Holding Conquerors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prayer says the Knowledge-Holding Deities, Heroes, and Dakinis have come
    from holy paradise realms to receive the deceased.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
