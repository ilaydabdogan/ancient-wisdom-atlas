- id: obs:1
  text: Birth in Hell is said to be associated with evil karma, wailing-like songs,
    and being compelled to enter unresistingly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hellward landscape includes lands of gloom, black houses, white houses,
    black holes in the earth, and black roads.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Entering Hell is said to bring unbearable pains of heat and cold and a very
    long delay before getting out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Karmic tormenting furies pursue the deceased from behind and appear in front,
