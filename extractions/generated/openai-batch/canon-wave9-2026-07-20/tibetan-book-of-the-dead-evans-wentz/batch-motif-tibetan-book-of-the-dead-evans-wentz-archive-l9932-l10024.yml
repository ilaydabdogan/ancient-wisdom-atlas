canonical_text:
  quote: ''
  summary: The passage warns that evil karma may draw the deceased toward Hell through
    ominous sights and sounds. It describes pursuit by karmic tormenting furies, terrifying
    weather, and the impulse to flee into mansions, caverns, jungles, or closing lotus
    blossoms identified with the womb. It instructs the deceased to visualize wrathful
    protective deities so as to be separated from the furies and gain the power to
    select the womb-door. It also explains that some spirits in the Intermediate State
    assume and retain forms through changes in mental attitude.
  language: English
  quote_policy: summarized
