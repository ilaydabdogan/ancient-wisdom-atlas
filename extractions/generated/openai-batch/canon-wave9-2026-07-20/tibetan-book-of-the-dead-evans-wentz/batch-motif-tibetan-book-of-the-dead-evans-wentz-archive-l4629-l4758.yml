canonical_text:
  quote: ''
  summary: 'The passage begins with a Buddhist verse in which holy persons heed Death’s
    messengers, recognize attachment as the source of birth and death, and free themselves
    from misery. The text then offers obeisances to divine bodies, deities, Padma
    Sambhava, and gurus. It introduces the Great Doctrine of Liberation by Hearing
    for devotees in the Intermediate State, describes its divisions and preliminary
    Guide Series, and gives a sequence of instructions: practice the Guide, use Transference
    in the moments of death if needed, listen to the doctrine in the Intermediate
    State of Reality, observe death symptoms, and apply Transference when symptoms
    are complete. Editorial notes explain the deities as internal principles, Padma
    Sambhava’s title, the Guide Series as practical guidance through Bardo toward
    rebirth or Nirvana, and Transference as relating to consciousness-principle or
    life-flux rather than a permanent soul.'
  language: English
  quote_policy: summarized
