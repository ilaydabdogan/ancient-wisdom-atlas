canonical_text:
  quote: ''
  summary: The passage instructs that training in meditation and in the Bardo teaching
    during life prepares one for peaceful and wrathful visions in the Chonyid Bardo.
    It presents the text as the Great Liberation by Hearing, to be read aloud to living
    persons, the ill, and corpses, because hearing and later recollection in the Intermediate
    State may bring liberation. It closes one section on setting the consciousness
    face-to-face with Reality and introduces Book II on the Intermediate State when
    seeking rebirth, followed by a doctrinal quotation attributed to Ashvaghosha on
    calm reality and ignorance.
  language: English
  quote_policy: summarized
