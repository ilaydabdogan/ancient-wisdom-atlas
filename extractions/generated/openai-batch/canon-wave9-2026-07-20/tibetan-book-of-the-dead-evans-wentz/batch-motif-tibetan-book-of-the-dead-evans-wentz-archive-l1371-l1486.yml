canonical_text:
  quote: ''
  summary: The passage outlines the “Wisdom Teachings” as symbolically expressed Mahayana
    doctrines of the Bardo Thodol. It explains realization of Voidness as the aim
    of yoga and as attainment of Dharma-Kaya/Buddhahood; presents the Three Bodies
    of Buddhahood; uses ocean, cloud, rainbow, and rain imagery for Dharma-Kaya, Sambhoga-Kaya,
    and Nirmana-Kaya; identifies Samsara and Nirvana as ultimately identical in the
    realm of pure intellect; and describes enlightened rebirths as Nirmana-Kaya incarnations.
    It also notes an association between Dharma-Kaya and the Primordial Buddha Samanta-Bhadra.
  language: English
  quote_policy: summarized
