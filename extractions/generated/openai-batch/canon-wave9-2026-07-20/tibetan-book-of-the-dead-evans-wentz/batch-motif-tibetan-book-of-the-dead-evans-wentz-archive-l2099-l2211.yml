canonical_text:
  quote: ''
  summary: The passage describes Tibetan funeral disposal methods as returning the
    body to elements; gives details of air-burial and ordinary corpse transport; explains
    the astrologer's role in determining funeral handling, death-demon exorcism, and
    rebirth precautions; describes Sikkim cremation rites centered on a flour diagram
    of Sukhavati and Amitabha as fire; and introduces the Bardo as the transitional
    state between death and rebirth, with three sequential phases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a human body consists of earth, water, air, and fire,
    and that burial methods return the body to the corresponding element.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In air-burial, birds devour the corpse; after the flesh is removed, the bones
    are broken, mixed with flour into dough, and given to birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In an ordinary Tibetan funeral, no coffin or corpse-receptacle is used; the
    corpse is laid on cloth over a light framework with two poles, covered with white
    cloth, and carried by two men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Sikkim, the corpse may be carried sitting in an embryonic posture.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Funerals in Sikkim and Tibet are conducted according to directions from the
    astrologer who cast the death-horoscope.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The astrologer states who should handle and carry the corpse, the form of
    burial, the kind of evil spirit that caused the death, exorcism ceremonies, rituals
    for the deceased spirit, rebirth precautions, and the place and family of rebirth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a Sikkim cremation site, a flour-outlined mystic diagram symbolizing Sukhavati
    is made on the ground, and the central space for the pyre is dedicated to Amitabha.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the beginning of the cremation rites, the chief ritual officiant visualizes
    the funeral-pyre as Amitabha's mandala and the fire as Amitabha; the corpse and
    its heart are also visualized in relation to Amitabha.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sweet-smelling oils, spices, sandalwood, and incense-sticks are cast into
    the fire as a sacrifice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the end of the cremation rites, priests and mourners visualize the spirit
    of the departed as purged of karmic obscurations by the fire identified with Amitabha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Other Tibetan or Tibetan-influenced burial forms are said to have parallel
    funeral services based on the same symbolic rituals, with variations by sect and
    province.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bardo is glossed as a state between two states, specifically the state between
    death and rebirth.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: For three and one-half or four days after death, the Knower or principle of
    consciousness of an ordinary deceased person is believed to be in a sleep or trance-state,
    usually unaware of separation from the body.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The after-death state is presented as a sequence of the First Bardo at the
    moment of death, the Second Bardo of experiencing reality, and the Third Bardo
    while seeking rebirth.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
