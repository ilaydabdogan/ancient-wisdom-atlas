canonical_text:
  quote: ''
  summary: The passage gives an editorial note on mudras, then describes knowledge-holding
    deities and dakinis appearing in a mandalic circle with ritual implements, dance,
    music, bone ornaments, human-hide banners, and other charnel imagery. It then
    describes five-coloured Wisdom radiances issuing from the hearts of the five chief
    Knowledge-Holding Deities toward the addressee, a simultaneous dull blue light
    from the brute world, and awe-inspiring Truth sounds that the addressee is instructed
    not to fear but to recognize as inner wisdom or inner light.
  language: English
  quote_policy: summarized
literal_observations:
