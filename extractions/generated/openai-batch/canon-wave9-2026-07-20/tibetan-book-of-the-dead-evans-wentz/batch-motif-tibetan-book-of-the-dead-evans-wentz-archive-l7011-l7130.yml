  text: The note defines a mudra as a mystic sign made by posturing the hand, fingers,
    or body, and describes the hand configuration of the mudra of fascination.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A red Knowledge-Holding Deity of the Great Symbol appears to the west of the
    circle, smiling and radiant, embraced by the Red Dakini, holding a crescent-knife
    and a blood-filled skull, dancing, and making the mudra of fascination with the
    right hand held aloft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A green Self-Evolved Knowledge-Holder appears to the north of the circle,
    with a half-angry and half-smiling radiant face, embraced by the Green Dakini,
    holding a crescent-knife and a blood-filled skull, dancing, and making the mudra
    of fascination with the right hand held aloft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The outer circle contains innumerable bands of dakinis, heroes, heroines,
