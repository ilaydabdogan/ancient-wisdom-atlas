canonical_text:
  quote: ''
  summary: An addendum section contrasts Northern and Southern Buddhism on esoteric
    doctrine, discusses the Tri-Kaya/Dharma-Kaya, argues against fundamental Christian
    derivation of Northern Buddhism, and advances a cautious hypothesis that Christianity
    was shaped by earlier Oriental religious systems. It compares Christian monasticism,
    Trinity, Incarnation, Gnostic teachings on rebirth and karma, and esoteric/exoteric
    teaching distinctions with older Hindu, Buddhist, Jain, Taoist, Indian, and Egyptian
    traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Tibetan lamas claim a transcendental Buddhism based on Tantric
    teachings and applied Yoga, transmitted orally from the Buddha, while Southern
    Buddhism denies this claim and limits the Buddha's teaching to the Pali Canon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Southern Buddhism does not propound the Esoteric Trinity
    or Tri-Kaya, although it notes references or expositions of Dharma-Kaya and Rupa-Kaya
    in cited Buddhist texts.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage rejects the hypothesis that Northern Buddhism was fundamentally
    shaped by early Christian missionaries, citing recovered writings attributed to
    Ashvagosha and saying any Christian influences would have been superficial at
    most.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A footnote reports that Tson Khapa may have known Christianity through Roman
    priests near his birthplace, but the passage treats this as irrelevant to the
    earlier Nyingmapa manuscript tradition and notes that the Kargyutpa sect predates
    the Gelugpa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author states a hypothesis that Christianity was probably shaped in symbolology,
    rituals, and beliefs by religions preceding it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says early Christian monasticism in Egypt, with yoga-like practices,
    apparently had direct relationship with older monastic systems of Hinduism, Buddhism,
    Jainism, and Taoism.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the Christian doctrines of Trinity and Incarnation are not
    unique and had developed in pre-Christian India and in the Osirian religion of
    Egypt.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the primitive Christian Gnostic Church was generally in accord
    with older Oriental teachings on rebirth and karma, while the later exoteric Church
    repudiated such teachings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A footnote presents Origen as holding rebirth and karma to be Christian and
    distinguishes doctrines taught to the multitude from doctrines revealed after
    exoteric teaching.
  category: speech
  evidence_refs:
  - ev:9
