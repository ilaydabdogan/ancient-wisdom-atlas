canonical_text:
  quote: ''
  summary: The passage gives deathbed instructions for setting a dying or deceased
    person face to face with the Clear Light. It describes a hierarchy of suitable
    readers, the timing of the instructions relative to breathing and the movement
    of vital-force through subtle channels, an address to the dying person, and bodily
    procedures such as the right-side Lion posture and pressing the throat arteries.
    An editorial note explains the Great Straight Upward Path as a Northern Buddhist
    doctrine of possible instantaneous emancipation through conscious recognition
    of the Clear Light at death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons who have received the practical teachings can be set face to face
    with the fundamental Clear Light and obtain the Unborn Dharma-Kaya without an
    Intermediate State through the Great Perpendicular Path.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editorial note states that the Great Straight Upward Path teaches the possibility
    of instantaneous spiritual emancipation or Buddhahood without entering the Bardo
    Plane, if the disciple recognizes and becomes one with the Clear Light at death.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The preferred person to apply the instructions is the deceased person's guru;
    if unavailable, a brother of the Faith, a learned person of the same Faith, or
    a correct and distinct reader may read them repeatedly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The repeated reading is said to remind the deceased of prior instruction and
    to lead to recognition of the Fundamental Light and Liberation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When expiration has ceased, the vital-force is described as sinking into the
    nerve-centre of Wisdom, while the Knower experiences the Clear Light of the natural
    condition.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After this, the vital-force is described as moving through the right and left
    nerves, and the Intermediate State momentarily dawns; the directions are to be
    applied before it rushes into the left nerve.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The speech addressed to the dying person tells them that breathing is about
    to cease, that the time has come to seek the Path, that they are about to experience
    the Clear Light in the Bardo, and that they should know themselves and abide in
    that state.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bardo state is described in the speech as one in which all things are
    like a void and cloudless sky, and the naked spotless intellect is like a transparent
    vacuum without circumference or centre.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The address is to be repeated many times in the ear of the dying person before
    expiration ceases, so that it impresses the mind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When expiration is about to cease, the dying person is to be turned onto the
    right side in the Lying Posture of a Lion, the throat arteries are to be pressed,
    sleep is to be arrested, and the arteries are to be pressed gently but firmly.
  category: action
  evidence_refs:
  - ev:8
