  quote: ''
  summary: The passage describes a Tibetan spyang-pu effigy of the deceased, its central
    bound figure, associated objects representing the five excellent sensuous things,
    food offerings to the deceased spirit, and the reading of the Bardo Thödol to
    the effigy when visualized as the deceased. It then compares the Tibetan effigy
    and head-piece to ancient Egyptian funerary effigies, Ka images, and the reading
    of the Egyptian Book of the Dead.
