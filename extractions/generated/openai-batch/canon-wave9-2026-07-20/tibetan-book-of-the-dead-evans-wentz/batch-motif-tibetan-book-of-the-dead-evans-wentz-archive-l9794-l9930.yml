canonical_text:
  quote: ''
  summary: The passage explains why postmortem teachings and funeral rites are considered
    efficacious, then instructs the officiant to address the deceased and teach selection
    of a womb-door. It lists premonitory visions associated with possible rebirths
    in continents or as devas, asuras, beasts, or pretas, and gives instructions to
    enter or avoid particular visions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Supernormal perception is described as limited and operative in the after-death
    state for an ordinary deceased person, but permanent and unlimited for a Buddha
    or a devotee perfected in yoga.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased is said to have a memory ninefold more lucid than before, and
    the intellect becomes clear enough to meditate on what is taught.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text says funeral rites and repeated readings of the Great Bardo Thodol
    for forty-nine days are important because the deceased may be liberated through
    successive settings-face-to-face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officiant is instructed to invoke the aid of all Buddhas and Bodhisattvas,
    repeat the Refuge, call the deceased by name three times, and speak instructions
    about the womb-door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deceased is told that, if the womb-door has not been closed, it is almost
    time to assume a body and the deceased must select a womb according to the teaching.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Signs and characteristics of the place of birth are said to appear, and the
    deceased is told to recognize them and choose the continent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: For birth in the Eastern Continent of Lupah, a lake adorned with male and
    female swans will be seen; the deceased is told not to go there because religion
    does not predominate there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: For birth in the Southern Continent of Jambu, grand delightful mansions will
    be seen; the deceased is told to enter if one is to enter.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: For birth in the Western Continent of Balang-Chod, a lake adorned with male
    and female horses will be seen; the deceased is told not to enter because religion
    does not prevail there, despite wealth and abundance.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: For birth in the Northern Continent of Daminyan, a lake adorned with male
    and female cattle, or trees around it, will be seen; the deceased is told not
    to enter because religion does not predominate there, despite long life and merits.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: For birth as a deva, delightful temples or mansions built of various precious
    metals will be seen, and the deceased may enter them.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: For birth as an asura, either a charming forest or circles of fire revolving
    in opposite directions will be seen, and the deceased is told not to enter.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: For birth among beasts, rock-caverns, deep holes in the earth, and mists will
    appear, and the deceased is told not to enter.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: For birth among pretas, desolate treeless plains, shallow caverns, jungle
    glades, and forest wastes will be seen; going there entails pangs of hunger and
    thirst, and the deceased is told not to go there.
  category: setting
  evidence_refs:
  - ev:12
