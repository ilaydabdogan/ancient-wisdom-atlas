canonical_text:
  quote: ''
  summary: A Sidpa Bardo instruction describes karmic apparitions terrifying the deceased,
    elemental catastrophe sounds, three colored precipices identified as passions,
    prayer to compassionate sacred figures, different postmortem experiences according
    to merit or karma, advice against attachment and distraction, temporary resting
    places such as bridge-heads, temples, and stupas, realization of death, and dependence
    on dedicated food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons of much evil karma are said to experience karmically produced flesh-eating
    rakshasas with weapons who shout commands such as striking and slaying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists apparitional pursuit by beasts and people, snow, rain, darkness,
    fierce wind, and sounds resembling collapsing mountains, overflowing seas, roaring
    fire, and fierce winds.
  category: setting
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: When terrified by these experiences, the bardo dweller flees in every direction
    and finds the way obstructed by three deep precipices colored white, black, and
    red.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The text states that the precipices are not really precipices but Anger, Lust,
    and Stupidity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note identifies the precipices as karmic illusions and says falling down
    them symbolizes entrance into a womb prior to rebirth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressee is instructed to recognize the state as the Sidpa Bardo and
    to invoke the Compassionate One, the Guru, and the Precious Trinity to avoid falling
    into unhappy worlds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Those with accumulated merit and sincere religious devotion experience pleasure,
    happiness, and ease; neutral beings experience neither pleasure nor pain but colorless
    indifference.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The addressee is warned not to be attracted to pleasurable experiences and
    to worship the Guru and Trinity with such merit-given delights.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If experiencing only indifference, the addressee is instructed to keep the
    intellect undistracted in meditation upon the Great Symbol without thinking about
    meditating.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At bridge-heads, temples, and stupas, the bardo dweller can rest briefly but
    cannot remain long because the intellect has been separated from the earth-plane
    body.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Knower becomes dim, fleeting, and incoherent; the thought of being dead
    arises, followed by sadness, a chilled heart, and sorrow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Only food dedicated to the deceased can be eaten, and there is no certainty
    regarding friends at that time.
  category: relationship
  evidence_refs:
  - ev:10
