canonical_text:
  quote: ''
  summary: The passage describes the deceased consciousness moving through Bardos,
    experiencing karmically generated visions, mistaking itself for embodied, desiring
    a body, and entering the Third Bardo in search of rebirth. It contrasts ordinary
    post-death processes with the possible liberation or immediate rebirth of enlightened
    yogis, and states that unresolved karmic conditions keep the deceased within the
    Intermediate State for a symbolic forty-nine-day period until rebirth or liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Passing from one Bardo to another is described as analogous to birth, with
    the Knower waking from one swoon or trance state to another until the Third Bardo
    ends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Second Bardo, symbolic visions arise one by one as hallucinations created
    by karmic reflexes of actions performed in the earth-plane body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that what the deceased has thought and done becomes objective
    as thoughtforms and passes as a panorama of consciousness-content.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some learned Gelugpa lamas are said to hold that the symbolic visions of the
    one hundred and ten principal deities of the Chönyid Bardo are seen by spiritually
    advanced devotees who have studied Tantricism.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ordinary deceased person is described as being under the delusion that
    he still has a body of flesh and blood.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the deceased realizes that he has no such body, he develops a strong
    desire to possess one.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Seeking a body, the deceased enters the Third Bardo of seeking rebirth; rebirth
    in this or another world ends the after-death state.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the commonalty this process is called normal, while exceptional minds
    with yogic knowledge and enlightenment may experience only the more spiritual
    stages of the early Bardo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The most enlightened yogis may escape all of the Bardo by passing into a paradise
    realm or by reincarnating in this world immediately after discarding the human
    body while maintaining continuity of consciousness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that thoughts are things and parents of actions, and uses
    sowing and harvest language for consequences here and hereafter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: If escape from the Intermediate State is not achieved within a symbolic period
    of forty-nine days, whose actual duration is determined by karma, the deceased
    remains subject to karmic illusions of the Bardo and progress is impossible.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hell is named as a possible rebirth state for the very exceptional evil-doer,
    while the ordinary person is described as expiating normal moral delinquencies
    through human rebirth.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Liberation by gaining Nirvana after death is described as cutting karmic bonds
    of worldly or sangsaric existence.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: For the ordinary person, the passage states that hope of reaching Buddhahood
    lies in being reborn as a human being, and that birth outside the human world
    delays the Final Goal.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note states that the Pali Ti-Pitaka records several instances of high deva
    rebirth immediately after death on the human plane.
  category: speech
  evidence_refs:
  - ev:11
