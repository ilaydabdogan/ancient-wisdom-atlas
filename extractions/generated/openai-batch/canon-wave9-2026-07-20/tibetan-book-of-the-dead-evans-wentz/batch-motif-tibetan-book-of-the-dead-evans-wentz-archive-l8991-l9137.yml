canonical_text:
  quote: Voidness cannot injure voidness; the qualityless cannot injure the qualityless.
  summary: The passage instructs the deceased in the Bardo to recognize the Lords
    of Death and terrifying apparitions as hallucinations of mind, to recognize Voidness
    and the Four Kayas, to rely on Chenrazee or the tutelary deity if unable to meditate,
    and to avoid attachment or aversion as postmortem experiences and rebirth visions
    arise.
  language: English
  quote_policy: quoted
