  summary: Commentary distinguishes ordinary unconscious rebirth from a higher esoteric
    rebirth doctrine. It describes an unenlightened being passing through forgetfulness,
    womb-entry, and rebirth from the Bardo, then discusses human and brute consciousness,
    Tylor on transmigration, Druidic/Celtic parallels, Western psychology, and Huxley
    on heredity and character.
