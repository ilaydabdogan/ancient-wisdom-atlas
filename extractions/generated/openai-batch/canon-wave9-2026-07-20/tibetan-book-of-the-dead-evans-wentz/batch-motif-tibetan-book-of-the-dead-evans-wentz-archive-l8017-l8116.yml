canonical_text:
  quote: ''
  summary: The passage instructs the deceased in the Bardo to recognize terrifying
    visions as their own thought-forms. If unrecognized, Peaceful and Wrathful Deities
    appear as Maha-Kala and Dharma-Raja, the Lord of Death, and the deceased wanders
    in Samsara. Dharma-Raja appears in vast frightening forms holding a karmic record-board
    and uttering violent commands, but these forms are explained as non-material emanations
    of the deceased’s own intellect. Recognition dissipates fear and leads to at-one-ment
    and Buddhahood. The deceased is then instructed to take refuge in tutelary deities,
    the Precious Trinity, and the guru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is instructed to recognize fearful and terrifying visions as
    their own thought-forms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the addressee fails to recognize the visions and becomes frightened, Peaceful
    Deities shine forth as Maha-Kala, Wrathful Deities shine forth as Dharma-Raja,
    thought-forms become Illusions or Maras, and the addressee wanders into Samsara.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Failure to recognize one’s own thought-forms is said to prevent Buddhahood
    despite scriptural learning and long religious practice, while recognition is
    said to obtain Buddhahood by one important art and one word.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'If thought-forms are not recognized at death, forms of Dharma-Raja appear
    in the Chonyid Bardo in three scales: heaven-sized, Mt. Meru-sized, and eighteen
    times the addressee’s own body.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Dharma-Raja forms are described with upper teeth biting the lower lip,
    glassy eyes, hair tied on top of the head, large bellies, narrow waists, and a
    karmic record-board in the hand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dharma-Raja forms utter commands to strike and slay, lick human brain,
    drink blood, tear heads from corpses, and tear out hearts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The addressee’s present body is described as a mental-body of karmic propensities
    that cannot die even if slain or chopped up.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bodies of the Lord of Death and other terrifying forms are described as
    emanations from the radiances of the addressee’s own intellect and as not materially
    or externally real.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Knowing that the terrifying forms are not externally real dissipates fear
    and leads to merging in at-one-ment and obtaining Buddhahood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The addressee is instructed to take refuge, remember the Precious Trinity,
    recollect the tutelary deity by name, and pray for rescue in the Bardo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The addressee is instructed to call upon the guru by name and pray for rescue
    and continued grace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note explains the karmic record-board as a board or register written with
    karmic records of the deceased’s life, and cites a Tibetan saga use of a karmic
    register of the Lords of Death.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: An editorial note states that this passage and a related judgement passage
    have striking correspondence with parts of the Egyptian Book of the Dead.
  category: other
  evidence_refs:
  - ev:11
