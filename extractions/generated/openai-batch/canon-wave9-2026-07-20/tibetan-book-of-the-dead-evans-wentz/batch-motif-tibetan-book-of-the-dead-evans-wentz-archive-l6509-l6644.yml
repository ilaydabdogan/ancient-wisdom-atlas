- id: obs:3
  text: Recognition of the radiances of the Five Orders of Wisdom as emanations of
    the addressee's own thoughtforms is said to lead to Buddhahood in the Sambhoga-Kaya
    through absorption into a halo of rainbow light.
  category: sequence
  evidence_refs:
  - ev:3
