  summary: The passage instructs the addressed 'nobly-born' that the radiances and
    deities previously appeared but were not recognized. It describes the Sixth Day
    appearance of the lights of the Five Orders, the four colors of the elements,
    five Dhyani Buddha Father-Mother pairs with attendants from central and directional
    realms, and an outer circle of wrathful and female door-keepers.
