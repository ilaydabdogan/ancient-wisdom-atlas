canonical_text:
  quote: ''
  summary: The passage gives ritual directions for reading the Bardo Thodol after
    death or near death. If Transference has not succeeded, an officiant reads the
    text near the corpse, or, if no corpse is present, occupies the deceased person's
    accustomed bed or seat, summons the departed spirit, and reads while restraining
    mourning relatives. It then prescribes offerings, repeated recitations of Bardo
    prayers, and an ordered sequence of instructions concerning death symptoms, Reality
    in the Intermediate State, rebirth, and the Clear Light at the moment of death.
    Editorial notes compare some practices with Egyptian, Brahmanic, and medieval
    Christian death rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If Transference has been effectually employed, the Thodol need not be read;
    if not, it is to be read correctly and distinctly near the dead body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If there is no corpse, the reader occupies the deceased person's accustomed
    bed or seat, expounds the power of Truth, summons the spirit, imagines it present
    and listening, and reads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the reading, relatives or a fond mate are not to be allowed to weep
    or wail and are to be restrained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the body is present after expiration has ceased, a lama, trusted brother
    in the Faith, or affectionate friend reads the Great Thodol with lips close to
    the body's ear without touching it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An editorial note says the departed one is summoned in the name of Truth and
    that the spirit, in an invisible Bardo-plane body, must be present at the reading
    to receive guidance through the Otherworld.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: An editorial note says the body of a dying person should not be touched so
    that the consciousness-principle may depart through the crown aperture; departure
    through another aperture may lead to non-human birth, with the ear associated
    with rebirth among the Gandharvas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The officiant is instructed to make a grand offering to the Trinity if possible,
    or to arrange available objects and mentally create an illimitable offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Path of Good Wishes invoking the Buddhas and Bodhisattvas is to be recited
    seven times or three times, followed by other Bardo prayers and root words read
    distinctly with proper intonation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Great Thodol is then read seven times or three times according to the
    occasion, and its sequence includes death symptoms, a reminder setting the deceased
    face-to-face with Reality in the Intermediate State, and methods for closing the
    doors of the womb while seeking rebirth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The next section is introduced as the Bardo of the Moments of Death, with
    instructions on symptoms of death and the Primary Clear Light seen at the moment
    of death.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: Editorial notes state that one prohibition is also found in Brahmanism and
    compare recited deathbed prayers with medieval Christian craft-of-dying texts.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:10
