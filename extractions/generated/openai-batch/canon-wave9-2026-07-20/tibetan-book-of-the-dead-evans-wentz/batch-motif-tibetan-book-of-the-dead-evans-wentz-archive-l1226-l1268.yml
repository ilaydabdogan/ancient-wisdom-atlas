canonical_text:
  quote: ''
  summary: The passage explains the forty-nine days of the Bardo as an esoteric symbolic
    structure. It compares physical embryonic development with a post-mortem psychic
    process undergone by the Knower or consciousness-principle, relates the number
    forty-nine to sevenfold symbolic systems such as the Seven Vowels, Seven Fires,
    svastika signs on the seven-headed Serpent of Eternity, and Hermetic seven after-death
    zones, and comments on seven as a sacred and natural number.
  language: English
  quote_policy: summarized
