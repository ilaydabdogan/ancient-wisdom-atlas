canonical_text:
  quote: ''
  summary: 'The passage interprets the Five Elements in the Bardo Thodol through a
    sequence of planetary rounds: Fire first appears in a rotating fire-mist, Air
    separates and surrounds the embryonic planet, Water emerges from vaporous air,
    and Earth forms as a crust. It compares this teaching with the Hindu churning
    of the Sea of Milk and then states that the Four Elements dawn upon the deceased
    during the first four days of the Bardo.'
  language: English
  quote_policy: summarized
