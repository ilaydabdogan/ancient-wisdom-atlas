canonical_text:
  quote: symbolical of being born out of this life into the life beyond death
  summary: 'The passage describes Tibetan Buddhist death ceremonies: ritual work when
    no corpse is present, astrological determination of funeral procedures, preparation
    and placement of the corpse, offerings to the departed spirit, Bardo readings
    and chants, a forty-nine-day ritual period, and construction of an effigy of the
    deceased.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: If no corpse is present, a lama mentally concentrates on the deceased, visualizes
    the body as present, calls the spirit of the deceased, and performs a ceremony
    lasting about one hour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An astrologer-lama casts a death horoscope from the moment of death to determine
    who may approach or touch the corpse, how the corpse should be disposed of, the
    funeral timing and manner, and what rites should be performed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The corpse is tied in a sitting posture, described as like an embryonic posture,
    and placed in a corner of the death-chamber not assigned to the household daemon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the embryonic posture is symbolical of being born
    from this life into life beyond death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Relatives and friends gather at the house of the deceased and are fed and
    lodged until the corpse is disposed of.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Until disposal, and while mourners are being entertained, the spirit of the
    deceased is offered part of each meal; the food is placed in a bowl before the
    corpse and later thrown away after the spirit has extracted subtle invisible essences.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the corpse is removed, an effigy of the deceased is placed where the
    corpse had been, and food offerings continue before it until the forty-nine days
    of the Bardo have expired.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During funeral rites, including reading the Bardo Thodol, lamas chant by relays
    day and night a service intended to assist the spirit of the deceased to reach
    the Western Paradise of Amitabha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lamas who read the Bardo Thodol return to the house of death once a week until
    the forty-ninth day, though the schedule may be shortened.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Chonyid Bardo is to be read and reread from the First to the Fourteenth
    Day, and the Sidpa Bardo from the Fifteenth Day onward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The duration and scale of rites vary by family means, with poorer families
    possibly ceasing after the Fourteenth Day and wealthier families continuing longer,
    sometimes through the full forty-nine days.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The effigy is made from a stool, block of wood, or other suitable object dressed
    in the clothes of the deceased, with a printed paper inserted where the face should
    be.
  category: object
  evidence_refs:
  - ev:7
