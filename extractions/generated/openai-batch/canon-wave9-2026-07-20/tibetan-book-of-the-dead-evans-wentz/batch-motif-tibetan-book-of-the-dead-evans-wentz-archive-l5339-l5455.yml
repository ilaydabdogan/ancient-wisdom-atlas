canonical_text:
  quote: ''
  summary: The passage explains the death-moment recognition of the Clear Light, the
    possibility of immediate liberation, the usual loss of equilibrium into lower
    Bardo states and rebirth, the flow of vital-force and consciousness after expiration,
    and ritual instructions by a lama, reader, guru, or brother in the Faith to direct
    the deceased toward Clear Light or deity meditation. It includes analogies of
    a needle falling from a thread, a bouncing ball, and a tutelary deity like the
    moon reflected in water, and it notes an editor's comparison to a Christian deathbed
    devotional practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dying person familiar with the state through prior spiritual or yogic training
    may win Buddhahood at the death moment, stop the Wheel of Rebirth, and achieve
    liberation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this ability is rare, and that the usual condition leads
    to progressive descent into lower Bardo states and then rebirth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lamas use the simile of a needle balanced on a thread that eventually
    falls when it loses balance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The consciousness-principle is described as momentarily balanced in the Clear
    Light, but karmic propensities, ego, self, and dualistic ideation cause it to
    fall away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After expiration, the Clear Light dawns, the vital-force flows through the
    right or left nerve and exits through a bodily aperture, and a lucid condition
    of mind follows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The duration of the primary Clear Light is said to depend on karma, the condition
    of the nerves, and whether there has been previous practice in setting-face-to-face.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the consciousness-principle gets outside the body, it asks whether it
    is dead, sees relatives and connections, and hears wailings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At this interval, terrifying karmic illusions and frightful apparitions or
    experiences caused by the Lords of Death have not yet appeared.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: For one in the perfected stage, the lama or reader is instructed to call the
    deceased by name three times and repeat the instructions for setting-face-to-face
    with the Clear Light.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: For one in the visualizing stage, the reader is instructed to read the meditation
    on the tutelary deity and tell the deceased to concentrate on that deity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The tutelary deity is to be meditated upon as like the reflection of the moon
    in water, apparent yet inexistent in itself, and also as like a being with a physical
    body.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: For common folk, the instruction is to meditate upon the Great Compassionate
    Lord.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Persons who had been set face to face by a guru but had not become familiar
    with it require a guru or brother in the Faith to impress the recognition vividly.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A translator's note compares the consciousness-principle after death to a
    ball whose first bound is highest, then lower, until karmic force is spent and
    rebirth follows by entering a womb.
  category: sequence
  evidence_refs:
  - ev:6
