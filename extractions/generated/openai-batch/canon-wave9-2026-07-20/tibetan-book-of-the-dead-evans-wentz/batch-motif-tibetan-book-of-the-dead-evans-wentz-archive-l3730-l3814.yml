canonical_text:
  quote: ''
  summary: The passage describes a Northern Buddhist cosmography centered on Mt. Meru,
    layered realms, Asuras beneath the heavens, concentric oceans and golden mountains,
    infinite iron-walled universes likened to cosmic eggs, karma or natural law, etheric
    foundations symbolized by crossed dorjes, symbolic measurements, and the four
    chief continents including the Eastern Continent and the Southern Continent identified
    with Earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names eight Mother Goddesses who appear in the text and associates
    them with early Hindu Mother Goddesses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mt. Meru contains four realms, one above another; the lower three are inhabited
    by orders of genii and the fourth lies immediately beneath the heavens.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Asuras, also called Ungodly Spirits or Titans, dwell in the fourth realm
    beneath the heavens, are described as expelled because of pride, and wage unending
    war with the gods above.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The universe is described through concentric layers: ocean around Mt. Meru,
    golden mountains, further oceans and mountains, and an outer ocean holding continents
    and satellites, all enclosed by an iron wall.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Beyond one universe lie infinitely many others; each universe is likened to
    a cosmic egg enclosed within an iron-wall shell that separates it from other universes
    by darkness.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: All universes are said to be under natural law, with karma commonly made synonymous
    with that law, and the passage states that Buddhist thought need not affirm or
    deny a supreme creator.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each universe rests on blue air or ether, symbolized by crossed dorjes, and
    the outer ocean rests upon this foundation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that oceans symbolize strata of air or ether, while mountains
    symbolize congealed air or material substance; from an occult viewpoint, oceans
    are Subtle and mountains Gross, alternating as opposites.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The numerical dimensions assigned to the universe are said often to be suggestive
    or symbolical rather than literal, with Mt. Meru, oceans, and mountain girdles
    given progressively diminishing measurements.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Four chief continents are placed in the four directions, and each has two
    smaller satellite continents, making twelve continents in total; the passage calls
    this number symbolical.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Eastern Continent is called Vast Body, is shaped like a crescent moon,
    is assigned the color white, and has inhabitants described as crescent-faced,
    tranquil-minded, and virtuous.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Southern Continent is identified as Planet Earth and called Jambuling,
    with its name explained as possibly referring to a jambu-tree fruit falling into
    water.
  category: setting
  evidence_refs:
  - ev:10
