canonical_text:
  quote: ''
  summary: 'The passage gives instructions for the Eleventh and Twelfth Days of the
    Bardo: if the deceased fails to recognize preceding deities and flees in fear,
    blood-drinking deities of the Lotus and Karmic Orders appear. The text describes
    Padma-Heruka and Karma-Heruka with their consorts, ritual implements, colors,
    faces, hands, and directions of emergence from the deceased''s brain. The deceased
    is repeatedly told not to fear but to recognize these apparitions as tutelary
    deities and products of the mind, which brings liberation, merging, and Buddhahood.
    The passage also uses a lion-skin analogy for mistaken fear, describes Mother
    and Offspring Clear-Light joining, and begins the Thirteenth Day with further
    wrathful appearances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that recognizing the apparitions as tutelary deities and
    merging with them in at-one-ment leads to Buddhahood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If terror and awe arise and the deceased does not recognize the deities but
    flees, the blood-drinking Lotus Order comes on the Eleventh Day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Padma-Heruka is described as reddish-black, with three faces, six hands, four
    feet, and ritual objects including a lotus, trident-staff, club, bell, human scalp
    filled with blood, and small drum.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mother Padma-Krotishaurima embraces Padma-Heruka, clings to his neck, and
    offers a red shell to his mouth; the Father and Mother are in union and issue
    from the western quarter of the deceased's brain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deceased is instructed not to fear Padma-Heruka and the Mother, but to
    recognize them as products of the deceased's own intellect, as tutelary deities,
    and in reality as Father-Mother Bhagavan Amitabha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the deceased still fails to recognize and flees, the blood-drinking deities
    of the Karmic Order, accompanied by Kerima, Htamenma, and Wang-chugma, come on
