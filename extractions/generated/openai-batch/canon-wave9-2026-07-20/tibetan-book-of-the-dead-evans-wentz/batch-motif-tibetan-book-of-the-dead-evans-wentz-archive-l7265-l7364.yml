canonical_text:
  quote: ''
  summary: The passage explains how different kinds of deceased persons encounter
    Bardo radiances and blood-drinking deities. Prior yogic or esoteric training enables
    recognition of these appearances and liberation, while failure to recognize them
    can lead to miserable states. It also describes signs at death or cremation, such
    as rainbow-radiance and bone-relics, and says certain mantrayanic devotees are
    led to pure paradise realms by Heroes, Heroines, and Knowledge-Holders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ordinary devotee may feel fear, terror, and awe when beholding the deities
    because he has not had adequate yogic training to recognize the Bardo immediately
    after death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The adept in yoga is described as mastering Death, knowing apparitional appearances
    to be unreal and powerless, and therefore having no Bardo to experience.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that when one radiance ceases another dawns, and the deceased
    person’s intellect becomes one-pointedly alert.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explicitly states that blood symbolizes sangsaric or samsaric
    existence, and that blood-drinking symbolizes thirsting for, drinking of, and
    quenching thirst for that existence.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Meditating on, worshipping, praising, or having seen images of the blood-drinking
    deities in life is said to enable recognition of them when they dawn in the Bardo,
    resulting in liberation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Discipline-holding abbots and metaphysical doctors who remain uninstructed
    in these Bardo teachings are said to lack certain funeral signs, fail to recognize
    the deities, view them as inimical, and pass into miserable states.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A devotee who realizes that the deities are karmic personifications of his
    own propensities, faces them unwaveringly, meets them like old acquaintances,
    and loses personality in them is said to attain enlightenment or Buddhahood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that unusual phenomena are believed to mark the death,
    birth, and funeral of a great hero or saint, and that Tibetan accounts include
    shaped bones and pearl-like or seed-like nodules in cremation ashes.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage instructs that even a rough or inelegant mantrayanic devotee who
    holds esoteric doctrines should not be disrespected, and says reverence to those
    doctrines can bring liberation at this stage.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mantrayanic devotees who have practiced visualization, perfection processes,
    and essence mantras are said not to wander far in the Chönyid Bardo and to be
    led to pure paradise realms after breathing ceases.
  category: sequence
  evidence_refs:
  - ev:10
