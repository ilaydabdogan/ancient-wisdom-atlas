canonical_text:
  quote: ''
  summary: The passage opens with obeisances and introductory verses, then shifts
    from the Chonyid Bardo to the Sidpa Bardo. The officiant is instructed to address
    the deceased, explain the after-death Bardo-body, warn against attachment to visions
    of possible rebirth realms, and prescribe resting in the primordial bright void
    state or meditating on the tutelary deity and guru as means toward liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with obeisance to assembled Deities, Tutelaries, and Gurus,
    with a request for liberation in the Intermediate State.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introductory verses state that the Chonyid Bardo has already been taught
    and that a vivid reminder concerning the Sidpa Bardo is now being given.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The officiant is told that some deceased persons, because of evil karma, fear,
    terror, and lack of familiarity, fail to recognize during the Chonyid Bardo and
    continue to the Fourteenth Day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The officiant is instructed to offer worship, recite a prayer invoking the
    aid of Buddhas and Bodhisattvas, call the deceased by name three or seven times,
    and then speak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The deceased is told that birth in the Hell-world, in the Deva-world, and
    in the Bardo-body is a kind of supernormal birth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The deceased is told that after failing to recognize the radiances of the
    Peaceful and Wrathful, fainting through fear, and recovering, the Knower rises
    and a radiant body resembling the former body springs forth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes the after-death body as having all sense-faculties,
    unimpeded motion, karmic miraculous powers, and visibility to pure celestial eyes
    of similar Bardo beings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage identifies this body as born of desire, a thought-form hallucination
    in the Intermediate State, and calls it the desire-body.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The deceased is told that visions of the future place of birth will appear
    according to whether the rebirth is to be as a deva, asura, human being, brute,
    preta, or being in Hell.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The deceased is instructed not to follow, be attracted by, or be weak before
    the visions; the passage says fondness for them leads to wandering amid the Six
    Lokas and suffering pain.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The deceased is instructed to rest the mind undistractedly in the unobscured,
    primordial, bright, void state of the intellect in order to obtain liberation
    without entering the womb.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: If unable to know the self, the deceased is instructed to meditate with intense
    fondness on the tutelary deity and guru.
  category: speech
  evidence_refs:
  - ev:12
