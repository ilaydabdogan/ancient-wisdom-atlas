  summary: An explanatory note interprets the tortures and Judgement of the deceased
    as symbolic of conscience. The Good Genius rises in judgment against the Evil
    Genius; the Judge is conscience in its stern impartial aspect, and the Mirror
    is memory. Personified elements of the deceased's consciousness-content offer
    excuses, accusations, and pleas for pardon, and the lamas explain that the Judgement
    proceeds in this way. A following note begins to describe the astral or desire-body,
    but the supplied passage cuts off mid-sentence.
