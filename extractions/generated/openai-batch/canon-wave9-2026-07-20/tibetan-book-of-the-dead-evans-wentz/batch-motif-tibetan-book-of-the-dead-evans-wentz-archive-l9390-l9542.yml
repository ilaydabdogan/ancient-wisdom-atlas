canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for a deceased person in the Sidpa
    Bardo who may be drawn toward rebirth. The officiant is told to call the deceased
    by name and instruct them to recognize Bardo signs, resist entry into a womb,
    meditate on a tutelary deity or the Compassionate Lord, dissolve the visualization
    into the vacuous Clear Light, maintain a single resolve, link good karma, and
    close the womb-door.
  language: English
  quote_policy: summarized
