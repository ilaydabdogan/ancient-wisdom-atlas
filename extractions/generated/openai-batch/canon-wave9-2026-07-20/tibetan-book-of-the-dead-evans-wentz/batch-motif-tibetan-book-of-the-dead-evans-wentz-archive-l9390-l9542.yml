- id: obs:4
  text: The deceased may encounter gusts of wind, icy blasts, hail-storms, darkness,
    and the impression of being pursued by many people.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: On fleeing these impressions, the deceased may seem to enter places of misery
    or places of happiness according to karmic merit, and signs of the future birthplace
    may appear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Two chief ways of closing are named: preventing the being from entering a
