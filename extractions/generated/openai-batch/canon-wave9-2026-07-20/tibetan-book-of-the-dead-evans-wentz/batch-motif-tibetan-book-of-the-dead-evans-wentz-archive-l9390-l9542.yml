  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the deceased is ready to enter a womb, a stanza instructs them to hold
    one resolution, join the chain of good karma, close the womb-door, remember the
    opposition, abandon jealousy, and meditate on the Guru Father-Mother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The passage gives signs of wandering in the Sidpa Bardo: no reflection in
    water or mirrors, no shadow cast by the body, and the gross material body has
    been discarded.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The deceased is told to form one single resolve, avoid distraction, remember
    spiritual relationships and teachings, and persevere in good acts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage describes the present moment as a boundary between going upward
