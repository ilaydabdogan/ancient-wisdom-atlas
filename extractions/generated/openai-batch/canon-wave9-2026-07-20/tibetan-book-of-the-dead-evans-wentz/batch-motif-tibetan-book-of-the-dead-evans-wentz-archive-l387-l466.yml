canonical_text:
  quote: Form (Ripa) is the Void and the Void is Form.
  summary: The passage explains Sangsara and Nirvana, the Void, realization and ignorance,
    the Six Worlds and Six Poisons, and the instruction that the dying or deceased
    should recognize after-death apparitions as mind-produced so as to reach liberation.
    It also compares the philosophical scheme with Indian Mayavada Vedanta.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage divides all experience into Sangsdra/Sangsara and Nirvana; Sangsara
    is finite experience in the Six Worlds, while Nirvana is release from the worlds
    of Birth and Death and their pains.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Void is described as beyond relations and not strictly nameable as Nirvana
    because Nirvana is a term relative to the world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Perfect Experience, identified with Buddhahood, is described through cognitive,
    emotional, and volitional aspects: unobscured consciousness, pure bliss, and freedom
    of action or power.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practical religious problem is described as passing from lesser experience
    to complete experience through removal of obscuration; at base the two are one
    in the Void.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that a person is already liberated but does not know it;
    realization frees him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage cites the Prajna-Paramita saying that form is the Void and the
    Void is form, and contrasts realization as becoming a Buddha or Knower with non-realization
    as being an ignorant being in Sangsara.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Two paths are named: Knowledge, which leads to or is Nirvana, and Ignorance,
    which means continued fleshly life as human, brute, or denizen of other lokas.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ignorance in its cosmic aspect is called Maya, glossed in Tibetan as a magical
    show; it produces the notion of self and otherness and manifests as the Six Poisons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The text urges the dying or dead man to recognize apparitions as creatures
    of his own maya-governed mind that veil the Clear Light of the Void; recognition
    brings liberation at any stage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The commentary states that this philosophical scheme has an obvious resemblance
    to Indian Mayavada Vedanta and cites the Padma Purana calling Mayavada covert
    Buddhism.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The after-death apparitions are said to be real enough for the deceased who
    fails to recognize their unsubstantiality and cleave through them to the Void.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Clear Light is described as a Dazzlement like an infinitely vibrant spring
    landscape, but this image is said to translate an indescribable joyful inner experience
    rather than describe an object.
  category: attribute
  evidence_refs:
  - ev:8
