  summary: The passage instructs the deceased to pray for rescue from the dread Bardo,
    recognize and merge with inner light, and attain liberation or Buddhahood. It
    then describes the Seventh Day, when Knowledge-Holding Deities and a pathway to
    the brute world appear, followed by a mandala scene with central, eastern, and
    southern deity pairs bearing ritual objects and radiance.
  language: English
  quote_policy: summarized
