canonical_text:
  quote: ''
  summary: The passage presents doctrinal statements on the non-duality of matter
    and mind, the Dharmakaya as the basis for manifestations of Tathagatas and Bodhisattvas,
    the unreality or relativity of defilement and purity, the skilful use of words
    to guide beings toward Absolute Reality, the primordial purity of mind despite
    finite defilement, the cessation of finite mind when ignorance ceases, an analogy
    of a lost man confusing east and west, and the eternal, luminous, pure, joyful,
    unchanged nature of the Absolute.
  language: English
