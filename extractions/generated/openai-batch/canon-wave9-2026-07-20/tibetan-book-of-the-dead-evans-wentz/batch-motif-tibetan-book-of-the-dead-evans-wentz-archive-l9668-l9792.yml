canonical_text:
  quote: ''
  summary: 'The passage gives several instructions for a consciousness in the Bardo
    that is drawn toward rebirth. It describes attraction and repulsion toward prospective
    parents, then teaches meditations intended to close the womb-door: resolving against
    attraction and repulsion, recognizing appearances as unreal and illusion-like,
    and resting in the Clear Light with mind in an uncreated state. Instructions to
    the officiant explain why such teachings can be heard and effective for Bardo
    consciousness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that attraction toward one parent, repulsion toward the
    other, and jealousy arise according to whether one is to be born male or female.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is instructed to meditate that attraction and repulsion have
    caused wandering in Sangsara and to resolve not to act through them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that this firm resolution alone can close the door of the
    womb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the addressee is still ready to enter the womb, another method is introduced
    under the teaching called “The Untrue and the Illusory.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The meditation names the father and mother pair, black rain, storm-blasts,
    clashing sounds, terrifying apparitions, and all phenomena as illusions in their
    true nature.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage compares phenomena to dreams, hallucinations, echoes, Gandharva
    or Odour-eater cities, mirage, mirrored forms, phantasmagoria, and the moon seen
    in water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: Holding to the thought of unreality is said to dissipate belief in reality,
    turn the consciousness backward, and close the womb-door.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: 'If the tendency to hold phenomena as real remains, a fifth method is introduced:
    meditating upon the Clear Light.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Clear Light meditation states that all substances are one’s own mind,
    that mind is vacuous, unborn, and unceasing, and that it should rest like water
    poured into water.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The passage says the womb-doors of the four kinds of birth are closed by maintaining
    the relaxed, uncreated state of mind.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Instructions to the officiant say that the teachings can liberate people of
    different capacities because the Bardo consciousness can perceive what is spoken,
    has perfected faculties, is alert under awe and terror, and moves where the mind
    directs.
  category: speech
  evidence_refs:
  - ev:11
