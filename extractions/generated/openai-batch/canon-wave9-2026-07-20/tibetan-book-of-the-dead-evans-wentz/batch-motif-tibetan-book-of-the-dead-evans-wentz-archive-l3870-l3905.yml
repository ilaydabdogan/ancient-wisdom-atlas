canonical_text:
  quote: ''
  summary: 'The passage summarizes fundamental teachings of the Bardo Thédol: all
    samsaric realms and beings are mind-dependent phenomena; phenomena are transient
    and unreal apart from the perceiving samsaric mind; craving causes samsaric existence;
    without Enlightenment, birth and death recur; after-death existence continues
    karmically under changed conditions; and the interval between death and rebirth
    is shaped by prior actions and experienced as a dreamlike visionary state.'
  language: English
