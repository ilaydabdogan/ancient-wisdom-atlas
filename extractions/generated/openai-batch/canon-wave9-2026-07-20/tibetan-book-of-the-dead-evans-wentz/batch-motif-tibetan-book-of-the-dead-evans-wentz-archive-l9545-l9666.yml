canonical_text:
  quote: ''
  summary: The passage instructs the addressed consciousness in the bardo to avoid
    entering a womb when visions of sexual union appear. It gives devotional methods
    for closing the womb-door by seeing the pair as Guru and Divine Mother or by meditating
    on a tutelary Father-Mother pair. It then explains four kinds of birth, warns
    that attachment and repulsion at conception may lead to human, animal, hell, ghost,
    or six-loka rebirth, and ends by urging rejection of jealousy and meditation on
    the Guru Father-Mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed being is told that visions of males and females in union will
    appear, and that it should not go between them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visionary father and mother are to be regarded as the Guru and the Divine
    Mother, with meditation, bowing, mental worship, and a request for religious guidance.
  category: action
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:3
  text: If the womb is not closed and the being is ready to enter it, the being is
    instructed to meditate on the Divine Guru Father-Mother or a Compassionate Tutelary
    with Shakti and to make mental offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A third method is introduced as a means of repelling attachment and repulsion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage lists four kinds of birth: egg birth, womb birth, supernormal
    birth, and birth by heat and moisture.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Entering the womb through attachment and repulsion may lead to birth as a
    horse, fowl, dog, or human being.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The passage describes sexed feelings before birth: a male rebirth involves
    hatred toward the father and attraction toward the mother, while a female rebirth
    involves hatred toward the mother and attraction toward the father.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the moment when sperm and ovum are about to unite, the Knower experiences
    bliss, faints into unconsciousness, and later is encased in an oval embryonic
    form.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage names possible animal rebirths such as dog, pig, ant, insect,
    grub, calf, kid, and lamb, and associates such forms with suffering and no immediate
    return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage warns that the being may wander into hell, the world of unhappy
    ghosts, or throughout the Six Lokas and suffer inconceivable miseries.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The final instruction is to reject attraction and repulsion, close the womb-door,
    abandon jealousy, and meditate on the Guru Father-Mother.
  category: speech
  evidence_refs:
  - ev:6
