comparison_claims:
- id: claim:1
  claim: The passage explicitly places Tibetan after-death judgement lore in comparison
    with St. Patrick’s purgatorial lore, Celtic Otherworld and rebirth legends, Proserpine
    lore, Semitic heaven/hell/judgement doctrines, resurrection doctrine, and Plato
    as examples of widespread afterlife belief patterns.
  claim_level: same_motif
  target: cross-traditional purgatory, Otherworld, rebirth, judgement, and resurrection
    lore
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives a broad editorial comparison but does not provide
    detailed evidence from each named tradition within this excerpt.
- id: claim:2
  claim: The passage identifies Northern Buddhist and Pali canonical versions as parallel
    to the Tibetan judgement scene, especially through the King of Death and the Five
    Messengers of Death sequence.
  claim_level: same_motif
  target: Northern Buddhist and Pali canon after-death judgement versions, including
    Devadita Vagga and Devadita Suttam
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides only a summary of the Pali version, and the supplied
    excerpt ends before completing the messenger sequence.
- id: claim:3
  claim: The passage reports that the Tibetan Judgement Scene image was traced to
    Wheel of Life imagery at Tashiding and Ajanta Cave No. XVII, supporting a cautious
    visual-comparative link among these judgement depictions.
  claim_level: visual_similarity
  target: Tashiding Wheel of Life and Ajanta Cave No. XVII Wheel of Life judgement
