- id: claim:4
  claim: The footnote claims a common prehistoric origin for Irish, Mithraic, and
    Celtic underground initiation or purgatorial sites, connected with a cult of the
    Bardo-world and its inhabitants.
  claim_level: common_inheritance
  target: St. Patrick’s Purgatory, Mithraic subterranean places, New Grange, and Gavrinis
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
