canonical_text:
  quote: ''
  summary: The passage introduces the after-death judgement by comparing purgatorial,
    Otherworld, rebirth, judgement, and resurrection beliefs across several traditions.
    It describes a Tibetan Judgement Scene in which the Religious King of the Dead,
    identified with Yama, holds a mirror reflecting the naked soul while Shiye weighs
    good and bad deeds in scales with white and black pebbles. It then summarizes
    Buddhist parallel versions in which the Buddha teaches about the Bardo, embodied
    existence, karma, the six lokas, and the evil-doer brought before the King of
    Death to be questioned about the Messengers of Death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names Christianized St. Patrick purgatorial lore, Celtic Otherworld
    and rebirth legends, Proserpine lore, Semitic doctrines of heaven, hell, judgement,
    and resurrection, and a passage in Plato as witnesses to widespread afterlife
    beliefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tibetan Judgement Scene painting is said to have been made in Gangtok, Sikkim,
    in 1919 by the Tibetan artist Lharipa-Pempa-Tendup-La, in accord with monastic
    tradition.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the described judgement scene, the judgement is meted out by the impartial
    Shinge-chho-gyal, the Religious King of the Dead, also identified as Dharma-Raja
    and as a form of Yama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Religious King of the Dead holds a mirror in which the naked soul is reflected.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The servant Shiye weighs good deeds against bad deeds in scales; good deeds
    are represented by white pebbles and bad deeds by black pebbles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says an early prototype of the judgement scene was preserved in
    the Wheel of Life at the Tashiding temple-picture, and that its origin was traced
    to a similar Wheel of Life in Ajanta Cave No. XVII.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that other versions of the judgement scene occur in Northern
    Buddhist canonical and apocryphal literature and that parallel versions occur
    in the Pali canon of Southern Buddhism.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the summarized Pali version, the Buddha sojourns at Jetavana Monastery
    and addresses assembled monks concerning the after-death state of existence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Buddha is compared to a clear-sighted man seated between two houses, each
    with six doors, seeing all who come and go.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: One house symbolizes the Bardo or disembodied state, the other symbolizes
    embodied existence, and the twelve doors symbolize the six entrances and six exits
    of the six lokas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Buddha explains that karma governs all states of existence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The evil-doer is brought before the King of Death and questioned about the
    Five Messengers of Death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The first messenger is symbolized by a newborn babe lying on its back, with
    the message that old age and death are inevitable for all living creatures.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The second messenger appears as an aged, decrepit person, with the message
    that the babe grows, matures, decays, and becomes a victim of Death.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The third messenger appears as a person confined by illness, unable to rise
    or lie down without aid, and brings the message that disease as well as death
    is inevitable.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: The fourth messenger is described as a thief undergoing very terrible punishment;
    the supplied passage breaks off before completing the messenger’s message.
  category: other
  evidence_refs:
  - ev:11
- id: obs:17
  text: A footnote describes an Irish purgatorial cavern at Loch Derg associated with
    St. Patrick’s Purgatory and says it was formerly a place for mystic pagan initiations.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:18
  text: The same footnote compares Mithraic subterranean places of worship and initiation
    with the Irish Purgatory and other Celtic underground initiation places such as
    New Grange and Gavrinis.
  category: relationship
  evidence_refs:
