canonical_text:
  quote: ''
  summary: A foreword passage argues that symbolic language and esoteric interpretation
    are important for understanding Buddhist and other religious doctrines. It attributes
    to learned lamas a belief in a secret international symbol-code among initiates,
    surveys alleged symbolic continuities across Eastern and Western traditions, lists
    Christian ritual symbols as survivals of pagan symbolism, and contrasts Northern
    Buddhist esoteric claims with Southern Buddhist literalist criticism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment says that certain keys can unlock much of Buddha’s doctrine
    that has been almost inaccessible to Europeans.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some learned lamas, including Lama Kazi Dawa-Samdup, are said to have believed
    in a secret international symbol-code used by initiates and relevant to guarded
    occult doctrines in several Asian regions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Occidental occultists are described as arguing that Egyptian and Mexican hieroglyphs,
    Greek philosophical symbolism, Druidic teaching, parables, fables, and mystery
    plays illustrate symbolic or esoteric modes of expression.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A footnote suggests a possible relationship among Aesop’s Fables, the Panchatantra,
    the Hitopadesha, Jataka tales, and primitive Oriental animal folk-tales or animal
    symbols.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A footnote says Christian mystery plays contain symbolism akin to Tibetan
    mystery plays and mentions the medieval character St. Jehoshaphat as an apparent
    Romanist canonization of the Buddha.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A footnote connects the De Arte Moriendi cycle with Oriental ideas concerning
    death and after-death existence and with the Bardo Thodol and the Egyptian Book
    of the Dead.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage cites a study arguing for parallelism between New Testament texts
    and texts of the Buddhist Canon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author qualifies the preceding comparative claims, then states that ordinary
    language has not always been adequate for expressing transcendental doctrines
    or moral maxims.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage lists Christian symbols including the lamb, dragon or serpent,
    dove, all-seeing eye in a triangle, fish, ever-burning fire, risen sun, church
    architecture and orientation, cross, and clerical robe colors or designs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says that the interpretive key to many Christianized symbols was
    lost and that Gnosticism was rejected as heretical though it understood itself
    as esoteric.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Northern Buddhism is said to have been condemned by Southern Buddhists for
    claiming custodianship of esoteric doctrine transmitted by initiates from the
    Buddha and for teaching doctrines outside the Pali Canon.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Pali Scriptures are said to contain parables and metaphorical expressions
    that lamas regard as symbolic and confirmatory of their esoteric tradition.
  category: speech
  evidence_refs:
  - ev:12
