canonical_text:
  quote: ''
  summary: The passage instructs the deceased in the Bardo to avoid dull lights leading
    to Hell or the human world, to trust bright wisdom lights, and to pray to Vajra-Sattva
    or take refuge in Ratna-Sambhava. It describes deity appearances, rainbow radiance,
    grace-rays as hooks, and the possibility of merging with divine light and attaining
    Buddhahood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The deceased is told not to be attracted to the dull smoke-coloured light
    from Hell, which is linked to accumulated evil karma from violent anger and would
    lead to Hell-Worlds and misery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased is instructed to avoid anger, trust the dazzling bright white
    light, and pray to Bhagavan Vajra-Sattva for guidance across the Bardo, with Divine
    Mother Mamaki as rear-guard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that praying in intense humble faith results in merging in
    rainbow light into Vajra-Sattva's heart and obtaining Buddhahood in the Sambhoga-Kaya
    in the Eastern Realm called Pre-eminently Happy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the Third Day, some persons, because of bad karma and pride, flee even
    when the hook of grace-rays strikes them; Ratna-Sambhava, accompanying deities,
    and the human-world light-path then come simultaneously.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Ratna-Sambhava appears yellow, bearing a jewel, seated on a horse-throne,
    and embraced by Divine Mother Sangyay-Chanma.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:6
  text: Akasha-Garbha, Samanta-Bhadra, Mahlaima, and Dhupema are named among six Bodhic
    forms shining from a rainbow halo of light.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The yellow light of the Wisdom of Equality and a dull bluish-yellow light
    from the human world strike the deceased's heart side by side.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Through egotism, the deceased may fear the bright yellow light and be attracted
    to the dull human-world light; the instruction says not to fear the bright light,
    but to know it as Wisdom and as the radiance of one's own intellect.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the deceased recognizes the radiance of their own intellect, the Divine
    Body and Light merge into them inseparably and they obtain Buddhahood; otherwise
    they are told to regard the light as Ratna-Sambhava's grace and take refuge in
    it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: An editorial note explains the grace-rays as a hook of salvation that catches
    the deceased and draws them away from Bardo dangers.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: An editorial note says the prohibition against anger is yogic and parallels
    moral teaching against anger in the Egyptian Precepts of Ptah-hotep.
  category: other
  evidence_refs:
  - ev:10
