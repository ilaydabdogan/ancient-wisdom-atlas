  - ev:2
- id: obs:4
  text: A second stanza describes wandering in Sangsara through intense propensities
    and traveling along the bright light-path of Simultaneously-born Wisdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heroic Knowledge-Holders are asked to lead, while the Mothers, the Dé@kinis,
