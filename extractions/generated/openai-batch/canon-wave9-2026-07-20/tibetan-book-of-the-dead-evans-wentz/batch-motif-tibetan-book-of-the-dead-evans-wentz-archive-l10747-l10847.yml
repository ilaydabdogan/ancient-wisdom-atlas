canonical_text:
  quote: ''
  summary: A prayer asks for guidance through Sangsara and the Bardo along bright
    light-paths, with wrathful deities, goddesses, knowledge-holders, and Dakinis
    acting as guides and rear-guards. It asks that elements not become enemies, that
    the realms of colored Buddhas be seen, and that Bardo sounds and radiances be
    recognized as one’s own. The following root verses instruct the devotee to use
    the Birthplace Bardo and Dream Bardo for undistracted practice and realization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers describe wandering in Sangsara through intense illusion and ask
    to travel along a bright light-path of abandoning hallucinatory fear, awe, and
    terror.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhagavans of the Wrathful Ones are asked to lead, while the Wrathful Goddesses
    Rich-in-Space are asked to act as rear-guard.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks to be saved from the fearful narrow passage-way of the Bardo
    and placed in perfect Buddhahood.
  category: action
