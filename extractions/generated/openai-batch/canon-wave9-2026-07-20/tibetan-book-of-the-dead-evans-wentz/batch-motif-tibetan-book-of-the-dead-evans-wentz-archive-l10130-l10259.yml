- id: obs:2
  text: The instructed speaker laments wandering in Samsara and wishes to be born
    in the Happy Western Realm at the feet of Buddha Amitabha, miraculously from a
    lotus blossom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that directing an undistracted wish to a desired realm results
    in birth there instantaneously.
  category: sequence
  evidence_refs:
