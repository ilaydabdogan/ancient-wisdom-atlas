canonical_text:
  quote: ''
  summary: The passage instructs an intermediate-state consciousness first to seek
    supernormal rebirth in a pure paradise realm, especially the Happy Western Realm
    of Amitabha or Maitreya's Tushita Heaven, through concentrated wish. If this is
    not possible, it gives instructions for selecting a human womb-door, avoiding
    deceptive appearances caused by karma, choosing a religiously favorable birth,
    transforming the womb into a celestial mansion through good-will, and praying
    to Buddhas, Bodhisattvas, tutelary deities, and the Great Compassionate One.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first instruction is for transference to a pure paradise realm by thinking,
    meditating, and directing resolution toward that realm.
  category: action
  evidence_refs:
