canonical_text:
  quote: ''
  summary: The passage contrasts Buddhist liberation through self-exertion, Right
    Knowledge, and personal realization with Christian doctrines of Father, Son, Saviour,
    forgiveness, and vicarious atonement. It notes prayers to higher powers in the
    Bardo Thodol, possible Christianlike appearances in some Northern Buddhist rituals,
    and an underlying karmic model in which merit neutralizes evil karma. It closes
    by identifying the Bardo Thodol as a ritual treatise whose symbolism contains
    essential Northern Buddhist teachings.
  language: English
  quote_policy: summarized
