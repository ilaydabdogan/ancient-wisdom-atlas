canonical_text:
  quote: happiness and misery will depend upon karma.
  summary: 'The passage describes the deceased wandering in the Sidpa Bardo with a
    mental body, longing for a body, failing to re-enter the corpse, and suffering
    because of karma. It then gives judgment instructions: the deceased is told that
    suffering comes from karma, that good and evil deeds are counted by paired geniuses,
    that the Lord of Death consults the Mirror of Karma, and that a fury may inflict
    dismemberment on a mental body that cannot truly die.'
  language: English
  quote_policy: quoted
