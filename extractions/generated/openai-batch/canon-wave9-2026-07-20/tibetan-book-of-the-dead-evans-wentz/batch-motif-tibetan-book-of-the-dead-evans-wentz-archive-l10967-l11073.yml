canonical_text:
  quote: "“When I wander alone by myself in the Bardo, / [O] ye Conquerors, Peaceful
    and Wrathful…”"
  summary: A first-person prayer asks for protection in the Bardo after life is exhausted.
    The speaker invokes Peaceful and Wrathful Conquerors and Buddhas to dispel ignorance,
    fear, karmic misery, misleading revelations, savage sounds, hostile weather, and
    darkness, and asks to recognize radiances, apparitions, Clear Light, and sacred
    sounds as liberating signs leading to higher birth.
  language: English
  quote_policy: quoted
