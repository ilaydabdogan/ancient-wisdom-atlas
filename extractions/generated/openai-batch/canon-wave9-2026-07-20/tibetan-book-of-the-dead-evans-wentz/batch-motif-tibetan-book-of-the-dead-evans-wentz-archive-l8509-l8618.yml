canonical_text:
  quote: ''
  summary: The passage instructs the officiant to help the deceased recognize the
    Bardo state. It explains that the deceased has a desire-body with restored senses,
    unimpeded motion, and karmically natural miraculous powers, including rapid travel
    and shape-changing, but warns against desiring these powers. It frames the teaching
    with yogic mental discipline, cosmic geography around Mt. Meru, and rebirth-related
    thresholds such as the mother's womb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage assumes that the deceased received some teaching in mental concentration
    and non-thought, and it cites Patanjali's definition of yoga as restraint or suppression
    of mental modifications.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The officiant is instructed that if recognition occurs, liberation is obtained
    without wandering in the Six Lokas; if recognition is hindered by bad karma, further
    instructions are to be spoken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressed deceased is told that, on the After-Death Plane, formerly impaired
    senses are now unimpaired, keen, and complete.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bardo-body is described as endowed with all sense-faculties, and this
    condition is presented as evidence that the addressee is deceased and wandering
    in the bardo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The present body is described as a desire-body, not made of gross matter,
