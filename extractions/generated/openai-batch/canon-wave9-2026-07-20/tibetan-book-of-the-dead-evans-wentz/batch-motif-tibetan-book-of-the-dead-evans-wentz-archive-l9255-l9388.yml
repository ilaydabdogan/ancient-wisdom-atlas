  evidence_refs:
  - ev:5
- id: obs:8
  text: The recitation of the prayer is said to guide the deceased and bring recollection,
    recognition, and liberation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If recognition is difficult because of evil karma, the officiant is instructed
