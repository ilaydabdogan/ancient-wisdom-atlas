  text: The deceased is instructed to trust and exercise sincere love toward those
    left behind, because what they do for the deceased can tend to the deceased's
    benefit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: White religious rites by successors and relatives, together with correct meritorious
