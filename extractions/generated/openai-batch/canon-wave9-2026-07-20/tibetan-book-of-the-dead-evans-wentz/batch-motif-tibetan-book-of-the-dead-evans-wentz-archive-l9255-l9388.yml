canonical_text:
  quote: The light of that place wherein thou art to be born, through power of karma,
    will shine most prominently.
  summary: The passage gives instructions for the Bardo of Seeking Rebirth. It describes
    ritual aid for the deceased, the volatility and power of thoughts in the Intermediate
    State, prayers to the Buddhas, the Compassionate One, and tutelary deities, and
    the dawning of six coloured lights corresponding to possible rebirth realms. It
    instructs the deceased to meditate on any light as the Compassionate One in order
    to prevent birth and gain recognition or liberation.
  language: English
  quote_policy: quoted
