  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The body of the past life is said to become dimmer while the body of the future
    life becomes clearer; the deceased then seeks a body and wanders distractedly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lights of the Six Sangsaric Lokas are said to shine, with the light of
