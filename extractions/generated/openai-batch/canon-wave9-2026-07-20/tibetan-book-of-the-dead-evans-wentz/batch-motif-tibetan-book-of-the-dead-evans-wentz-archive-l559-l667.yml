  summary: The passage describes the deceased becoming aware of death while still
    imagining a body, then passing through bardo experiences involving the Clear Light,
    the three kayas, liberating and samsaric visionary lines, Lokas with poisons,
    and peaceful and wrathful divinities. A footnote recounts a ghost appeased by
    offerings of whisky and beer poured on a grave.
