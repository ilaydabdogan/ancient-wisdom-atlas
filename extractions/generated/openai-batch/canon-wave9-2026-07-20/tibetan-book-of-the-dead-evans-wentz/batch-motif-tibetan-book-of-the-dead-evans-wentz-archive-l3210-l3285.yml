canonical_text:
  quote: ''
  summary: The passage interprets examples from Plato's account of souls choosing
    lives after death. It treats animal forms such as swan, nightingale, lion, eagle,
    and monkey as symbolic correspondences to character, status, or vocation rather
    than literal animal rebirth. It contrasts this esoteric reading with an exoteric
    reading and compares the Bardo Thodol's emphasis on Right Knowledge with Plato's
    emphasis on sound philosophy.
  language: English
  quote_policy: summarized
