canonical_text:
  quote: "“take the right path—the white one. Come this way!”"
  summary: The passage describes Tibetan death ceremonies in which a lama addresses
    and guides the deceased spirit, leads a funeral procession with ritual instruments,
    and explains several corpse-disposal practices, including exposure, cremation,
    burial, water disposal, and embalming of high-status religious figures. It also
    describes enshrined mummies and rituals performed before them.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A lama presents a scarf of honour to the corpse, addresses it as the deceased,
    advises it to eat the offered food, warns it that it is dead, tells its ghost
    not to haunt the place or trouble relatives, and directs it toward the right white
    path with the aid of its spiritual teacher.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the start of the funeral procession, the lama holds one end of a long scarf
    while the other end is tied to the corpse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The procession includes chanting and ritual music made with a miniature hand-drum,
    a human thigh-bone trumpet, a handbell, a conch-shell, and brass cymbals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief lama periodically looks back to invite the spirit to accompany the
    body and to assure it that the route is correct.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The procession order includes corpse-bearers, mourners carrying refreshments,
    and weeping relatives; some refreshments are to be cast on the funeral-pyre for
    the deceased, and some are consumed by priests and mourners.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Priestly guiding of the deceased spirit is described as necessary for lay
    people, while deceased lamas are said to know the right path because of training
    in the Bardo Thédol.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Corpse-disposal methods described include exposure on a hill-top or rocky
    eminence to birds and beasts of prey, cremation, earth burial, casting into rivers
    or other waters, and embalming for certain eminent figures.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:8
  text: The passage reports a belief that earth burial can allow the deceased spirit
    to see and re-enter the corpse, producing a vampire; cremation or rapid dissipation
    of the body is said to prevent this.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the Dalai Lama, the Tashi Lama, and some great men or saints, embalming
    involves packing the corpse in marsh salt, coating it with a cement-like mixture
    of clay, sandalwood, spices, and drugs, drying it, painting it with dissolved
    gold, and setting it up like an image.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Shigatze there are five funereal temples for such mummies; prayers, incense,
    and elaborate rituals are performed before the enshrined mummies.
  category: setting
  evidence_refs:
  - ev:7
