canonical_text:
  quote: ''
  summary: The passage instructs the deceased hearer not to follow dull karmic lights
    leading to human or Preta rebirth, but to trust radiant wisdom lights. It includes
    a prayer to Ratna-Sambhava and the Divine Mother as guides through the Bardo,
    and describes the Fourth Day appearance of Amitabha, associated deities, red fire-light,
    and All-Discriminating Wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed hearer is warned not to become fond of a dull bluish-yellow
    light from the human world, described as a path connected with violent egotism
    and human rebirth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Attraction to the dull bluish-yellow human-world light is said to result in
    birth in the human world and suffering birth, age, sickness, and death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage instructs the hearer to abandon egotism and propensities, trust
    the bright dazzling light, and focus on Bhagavan Ratna-Sambhava.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A prayer asks Ratna-Sambhava to lead the hearer on the radiant light-path
    of the Wisdom of Equality and asks the Divine Mother, She-of-the-Buddha-Eye, to
    be a rear-guard across the Bardo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Praying with humility and faith is said to lead to merging into the heart
    of Ratna-Sambhava, the Divine Father-Mother, in a halo of rainbow light, and attaining
    Buddhahood in the Sambhoga-Kaya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the Fourth Day, some beings are described as unable to recognize the radiances
    because of bad karma, failed vows, obscurations, covetousness, or miserliness,
    and as fleeing from the sounds and radiances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the Fourth Day, Amitabha and attendant deities appear together with a light-path
    from the Preta-loka associated with miserliness and attachment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Fourth Day red light is described as the primal form of the element fire,
    and Amitabha is described as red, holding a lotus, seated on a peacock-throne,
    and embraced by Divine Mother Gekarmo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bodhisattvas Chenrazee and Jampal, and female Bodhisattvas Ghirdhima and Aloke,
    attend Amitabha in the appearance from a halo of rainbow light.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The red light of the All-Discriminating Wisdom proceeds from the heart of
    the Divine Father-Mother Amitabha and strikes against the hearer's heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A dull red light from the Preta-loka appears side by side with the Light of
    Wisdom, and the hearer is told not to be fond of it and to abandon attachment
    and weakness toward it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that intense attachment can make the hearer terrified of
    the dazzling red light and fond of the dull red light of the Preta-loka.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The hearer is instructed to recognize the dazzling red light as Wisdom, merge
    into it inseparably, and attain Buddhahood.
  category: sequence
  evidence_refs:
  - ev:9
