literal_observations:
- id: obs:1
  text: The passage distinguishes guru lines or orders by abode, including divine
    gurus in Shiva’s Heaven, siddha gurus in the Human-World and Heaven-Worlds, and
    manava gurus on Earth only.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women as well as men, if qualified, may be gurus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A shishya is usually placed on probation for one year before the first initiation;
    an unworthy candidate is rejected, while a worthy one is prepared by the guru.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During probation the shishya performs exercises suited to individual needs;
    after probation the guru explains the reason for the exercises and their expected
    results.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Once a guru is chosen, the shishya is not to disobey or take another guru
    unless the first guru can guide the shishya no further.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before initiating a shishya, the guru prepares through special ritual exercises
    and invokes the gift-waves of the divine line of gurus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The guru’s preparation is said to establish direct communication with the
    spiritual plane on which divine gurus exist.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The actual initiation consists of giving the shishya a secret mantra or Word
