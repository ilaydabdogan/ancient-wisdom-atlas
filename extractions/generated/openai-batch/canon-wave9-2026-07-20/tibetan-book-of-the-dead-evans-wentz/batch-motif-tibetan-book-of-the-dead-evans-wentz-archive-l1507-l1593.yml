canonical_text:
  quote: ''
  summary: The passage locates Vajra-Dhara, Amitabha, the Five Dhyani Buddhas, Lotus
    Herukas, Peaceful and Wrathful Deities, and Padma Sambhava within a Buddhist body-schema
    and Bardo context. It reports the translator's view that the Adi-Buddha and Dharma-Kaya-associated
    deities are impersonal personifications rather than personal gods, explains the
    Tri-Kaya as an esoteric trinity corresponding to the exoteric Buddhist triad of
    Buddha, Dharma, and Sangha, describes an oral guru-lineage of transmission, and
    reports the translator's comparative claims about Christianity, Buddhist influence,
    and Jesus as a Bodhisattva.
  language: English
  quote_policy: summarized
