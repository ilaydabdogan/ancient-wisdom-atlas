canonical_text:
  quote: ''
  summary: The passage discusses literal and esoteric readings of Buddhist rebirth
    materials. It treats Jataka accounts of the Buddha’s previous births, the six-tusked
    white elephant in birth symbolism, the Bardo Thodol as a doctrine of death and
    rebirth, animal-thrones of the Five Dhyani Buddhas, and the Circle of Existence
    with animal symbols for sins and causes of rebirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Jataka attributes many previous births in sub-human form
    to the Buddha and contrasts symbolic esoteric interpretation with literal Theravadist
    interpretation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The six-tusked white elephant is identified as an animal symbol used in a
    parallel Pali account and treated as symbolism common to Northern and Southern
    Buddhism.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bardo Thodol is described as a Doctrine of Death and Rebirth that developed
    over unknown centuries and may have combined esoteric and popular interpretations.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage lists animal-thrones associated with the Five Dhyani Buddhas:
    lion with Vairochana, elephant with Vajra-Sattva, horse with Ratna-Sambhava, peacock
    with Amitabha, and harpy with Amogha-Siddhi.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage explains the animal-throne symbols as descriptive of attributes:
    lion as courage, might, and sovereign power; elephant as immutability; horse as
    sagacity and beauty; peacock as beauty and transmutation; harpy as mightiness
    and conquest over the elements.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The deities are said to be symbolic of Bodhic attributes of the Dharma-Kaya
    and of supramundane forces of Enlightenment that can guide the devotee toward
    Buddhahood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A quoted account of the Circle of Existence says it portrays the three original
    sins, causes of rebirth, forms of existence, and tortures intended to deter evil-doers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The three original sins in the Circle of Existence are depicted as a pig,
    a cock, and a snake, with meanings given as ignorance or stupidity, animal desire
    or lust, and anger.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the symbolic illustrations of the Twelve Nidanas, a monkey eating fruit
    is said to symbolize entire knowledge of good and evil fruits through tasting
    sensuous experience.
  category: action
  evidence_refs:
  - ev:9
