canonical_text:
  quote: ''
  summary: An editorial note explains that the Khordad Yasht initially addresses Haurvatat,
    the Genius of Health and Waters, but mostly concerns the Bareshnum purification
    ceremony as a test of the true Zoroastrian. The note connects the ceremony with
    Airyaman driving away diseases created by Angra Mainyu. The passage then gives
    fragmentary liturgical lines invoking Ahura Mazda, confessing Mazda-worship and
    allegiance to Zarathustra, rejecting the Daevas, and offering sacrifice, prayer,
    propitiation, and glorification to named holy beings including Haurvatat.
  language: English
  quote_policy: summarized
