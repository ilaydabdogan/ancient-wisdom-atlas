canonical_text:
  quote: ''
  summary: The passage is a liturgical list worshipping the piety and Fravashis of
    named holy figures. It names Maidhyomungha as the first to listen to Zarathustra's
    word and teaching; lists several other holy persons; identifies Saena as appearing
    on earth with a hundred pupils; lists sons of Zarathustra; and invokes the Fravashi
    of the holy king Vishtaspa. Translator notes connect Maidhyomungha with first
    discipleship, Saena with teaching and possible bird imagery, Zarathustra's sons
    with social-religious roles, and Vishtaspa with kingship and defense of Zoroastrianism.
  language: English
  quote_policy: summarized
