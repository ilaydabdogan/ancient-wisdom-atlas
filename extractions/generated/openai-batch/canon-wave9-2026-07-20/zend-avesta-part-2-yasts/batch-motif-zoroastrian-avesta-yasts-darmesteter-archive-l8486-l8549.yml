canonical_text:
  quote: ''
  summary: 'A litany invokes and blesses holy Rashnu, the strong, wherever he may
    be: in the bright Karshvare Xvaniratha, in the sea Vouru-Kasha, on the eagle''s
    tree in the middle of that sea, and on the Aodhas and Sanaka of the Rangha. The
    eagle''s tree is described as a tree of good, powerful, and all remedies, bearing
    the seeds of all plants. Notes associate the eagle with Saena/Simurgh and describe
    a later seed-dispersal sequence involving Chanamrosh and Tishtar.'
  language: English
  quote_policy: summarized
