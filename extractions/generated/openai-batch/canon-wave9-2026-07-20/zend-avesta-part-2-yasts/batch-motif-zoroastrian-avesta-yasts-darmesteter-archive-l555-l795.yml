  summary: A section of Sirozah I lists invocations for calendar days 9 through 27,
    naming divine fire, waters, celestial bodies, stars, cow and bull figures, divine
    speech and law, wind, time, glory, and sacred mountains, with explanatory notes
    linking some fires, kings, and mountains.
