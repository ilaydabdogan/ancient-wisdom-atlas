canonical_text:
  quote: the bright and glorious Ti^trya keeps that Pairika in bonds
  summary: Ahura Mazda tells Zarathustra that the bright star Tishtrya was created
    as a ritual power comparable in worthiness to Ahura Mazda, in order to oppose
    the Pairika Duzyairya. Tishtrya binds the hostile Pairika, protects Aryan lands
    when properly invoked, and withdraws healing power if forbidden persons take the
    offerings. The passage then turns to Gos/Drvaspa, described in the introduction
    as a cow or animal-kingdom personification, and opens with liturgical propitiation.
  language: English translation of Avestan/Zoroastrian liturgical material with English
    translator notes
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tishtrya is described as a bright and glorious star, healthful, wise, happy,
    powerful, lord of a thousand boons, and giver of boons to a person who has pleased
    him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda tells Spitama Zarathustra that he created Tishtrya as worthy of
    sacrifice, prayer, propitiation, and glorification as Ahura Mazda himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated purpose for Tishtrya's creation and worship is to withstand and
    drive back the malice of the Pairika Duzyairya, whom evil-speaking people call
    Huyairya.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: If Tishtrya had not been created for this role, the Pairika Duzyairya would
    wage war day and night against the material world and seek to extinguish its life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tishtrya keeps the Pairika in twofold, threefold, and all-body bonds that
    cannot be overcome, compared to a thousand strong men binding one man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Proper sacrifice and invocation to Tishtrya by the Aryan countries would prevent
    hostile hordes, plague, leprosy, venomous plants, and enemy chariots or spears
    from entering those lands.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Zarathustra asks Ahura Mazda what sacrifice and invocation to Tishtrya should
    be performed, and Ahura Mazda prescribes libations, bundles of baresma, and a
    head of cattle of one uniform color.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A murderer, a whore, and one who does not sing the Gathas, spreads death,
    and withstands the Mazdaean law are forbidden to take from these offerings.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: If forbidden persons take the offerings, Tishtrya withdraws his healing virtues,
    and plagues and hostile hordes strike the Aryan nations in increasing numbers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Satavaesa, made by Mazda, is blessed together with Tishtrya and is described
    as pushing waters forward.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Gos Yasht introduction describes Gos as 'the cow,' a personation of the
