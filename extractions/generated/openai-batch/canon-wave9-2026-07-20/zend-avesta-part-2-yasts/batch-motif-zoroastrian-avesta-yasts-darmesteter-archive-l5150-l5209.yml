  quote: ''
  summary: The passage describes vapours forming clouds and following the wind along
    Haoma's paths, with wind, rain, cloud, and sleet descending to places, fields,
    and the seven Karshvares. Apam Napat divides the waters among countries with the
    mighty wind, water-made Glory, and the Fravashis of the faithful. Tishtrya, the
    bright star, moves from the east along a divinely appointed watery path. Sacrificial
    praise is promised for divine brightness and glory.
