canonical_text:
  quote: ''
  summary: The passage teaches that right sacrifice and prayer according to Ahura
    Mazda’s wish are connected with legitimate power and reign, while improper worship
    brings loss of power and bad treatment in the next world. It gives a holy spell
    for cleansing birth and growth, purifying a woman, increasing children, milk,
    seed, offspring, and flowing springs. It warns against a fiend that dries up milk,
    describes the perfume of fire as driving away destructive beings, names Mithra,
    Rashnu Razista, and the Law of Mazda-worshippers as agents wishing removal, and
    ends with a Gathic saying about happiness and Ahura Mazda’s granting of wishes.
    Ahura Mazda answers Frashaostra that the departing soul sits near the head on
    the first night, singing the Gatha and sitting in Good Words.
  language: English
  quote_policy: summarized
