canonical_text:
  quote: ''
  summary: At Hamaspathmaedha, the Fravashis of the faithful come and go through the
    borough for ten nights, asking who will praise, sacrifice to, remember, bless,
    and receive them with meat, clothes, and prayer. A man who makes such an offering
    receives their blessing for household prosperity. The following sections say the
    Fravashis show paths to waters, plants, and the heavenly lights, so that waters
    flow, plants grow, and stars, moon, sun, and endless lights move after prior immobility;
    the Daevas are named as oppressing the heavenly lights.
  language: English
  quote_policy: summarized
