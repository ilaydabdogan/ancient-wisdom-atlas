canonical_text:
  quote: ''
  summary: The passage gives formulaic invocations and sacrifices to Vayu, the Waters,
    and the one who divides them. Hutaosa offers Vayu a sacrifice with golden ritual
    furnishings, baresma, and boiling milk, asking to be loved and well received in
    king ViJtaspa's house, and Vayu grants the boon. A group of unmarried maids offers
    the same kind of sacrifice and asks for husbands, good treatment, offspring, and
    wise spouses; Vayu grants this boon. The passage also includes a fragmentary martial
    boon involving Husravah and the Aryans, and a closing self-identification in which
    Vayu says his name is Vayu because he goes through the two worlds.
  language: English
  quote_policy: summarized
