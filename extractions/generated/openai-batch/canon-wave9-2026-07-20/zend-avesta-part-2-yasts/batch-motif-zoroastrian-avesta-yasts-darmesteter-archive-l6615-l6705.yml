  evidence_refs:
  - ev:1
- id: obs:2
  text: A pious man is described as holding libations in his hands and worshipping
    Mithra with a sacrifice that invokes Mithra by name and uses proper words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker repeatedly promises to offer libations to Mithra, addressing him
