canonical_text:
  quote: ''
  summary: The passage presents a liturgical address to Mithra. It states that Mithra
    comes to the faithful when invoked by his own name; the pious worshipper offers
    libations with proper words; the prayer asks Mithra to hear, sit at the sacrifice,
    accept consecrated libations, gather them to Garo-nmana, grant boons including
    riches, strength, victory, wisdom, and holy conversation, and empower the worshippers
    against foes and hostile beings. The following hymn sections praise Mithra as
    sleepless, awake, beneficent, all-knowing, attended by many spies, and as one
    who makes waters flow and plants grow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mithra says that if he is invoked by his own name in sacrifice, as other Yazatas
    are invoked by their names, he will come to the faithful at the appointed time.
