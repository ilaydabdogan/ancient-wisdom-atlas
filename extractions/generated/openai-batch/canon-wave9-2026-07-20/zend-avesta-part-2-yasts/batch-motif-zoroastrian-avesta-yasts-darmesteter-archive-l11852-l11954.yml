canonical_text:
  quote: ''
  summary: Verethraghna, made by Ahura, is invoked as moving with arrayed armies alongside
    Mithra and Rashnu, asking about lies and oath-offenses and about whom to afflict
    with illness and death. Ahura Mazda says that due sacrifice and prayer to Verethraghna
    protect the Aryan countries from enemies, disease, venomous plants, chariots,
    and spears. Zarathui-tra asks how the rite should be performed, and Ahura prescribes
    libations, baresma bundles, and a uniformly colored head of cattle, while excluding
    certain impure or law-opposing persons from the offerings. If such persons take
    the offerings, Verethraghna withdraws healing virtues and plagues and hostile
    hordes fall on the Aryan nations. Verethraghna also declares that the Soul of
    the Bull lacks due sacrifice while Daevas and their worshippers spill blood, bring
    named plant and wood materials to the fire, and are confounded when they try to
    strike.
  language: English
  quote_policy: summarized
