  summary: The passage invokes Mithra as the sleepless lord of wide pastures. It describes
    Haoma offering a pure sacrifice to Mithra on Haraiti Bareza, Ahura Mazda establishing
    Haoma as a priest, Haoma’s cosmic-reaching ritual voice and star-inlaid mortar,
    prescribed human offerings to Mithra, divine confession of the religion, and prayers
    for Mithra’s protection in the material and spiritual worlds from Death, Aeshma,
    and other demonic threats, as well as for strength and victory over enemies.
