canonical_text:
  quote: ''
  summary: 'Ahura Mazda explains where the faithful person''s soul abides on the second
    and third nights after death: near the head, singing the Ushtavaiti Gatha and
    tasting immense pleasure. At dawn after the third night, the soul experiences
    plants, scents, and a sweet southern wind. In that wind the soul''s own conscience
    appears as a beautiful maiden and identifies herself as the conscience shaped
    by the faithful person''s good thoughts, words, deeds, religion, worship, and
    generosity.'
  language: English
  quote_policy: summarized
