canonical_text:
  quote: ''
  summary: 'The passage recounts several offerings and petitions addressed to Ardvi
    Sura Anahita: petitioners ask for victory over enemies, a dry passage across a
    river, and success against an adversary who poses hard riddles. Ahura Mazda commands
    Anahita to descend from the stars to the earth so that rulers, warriors, priests,
    maids, and women in childbirth may seek boons from her. Anahita descends and speaks
    to Zarathushtra about their appointed roles.'
  language: English
  quote_policy: summarized
