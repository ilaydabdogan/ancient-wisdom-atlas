canonical_text:
  quote: ''
  summary: The excerpt opens Rashn Yast with propitiation and a dialogue in which
    Zarathustra asks Ahura Mazda about the true and powerful Holy Word. Ahura Mazda
    identifies the Holy Word itself as true and effective, then gives ritual instructions
    involving a three-twigged baresma, a prepared var, fire, boiling milk, oil, and
    plant sap. Ahura Mazda and Rashnu are invoked as helpers, accompanied by named
    powers, and Rashnu is praised with truth- and discernment-related epithets. A
    translator note identifies the var as an ordeal connected with truth-testing traditions.
  language: English
  quote_policy: summarized
