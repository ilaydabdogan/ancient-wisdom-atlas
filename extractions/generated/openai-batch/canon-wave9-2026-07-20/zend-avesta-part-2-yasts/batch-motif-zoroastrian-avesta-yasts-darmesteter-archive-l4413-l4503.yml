canonical_text:
  quote: ''
  summary: The passage contains the end of a solar hymn and the beginning of a lunar
    hymn. It invokes Mithra's club against the Daevas, praises the friendship of the
    moon and sun, offers sacrifices and liturgical materials to the undying, shining,
    swift-horsed Sun, and asks for brightness, health, and the blissful abode of the
    holy ones. The lunar section introduces recitation days and explains links among
    Bahman, the Moon, Gos, and Ram, including a sequence in which the Moon proceeds
    from Bahman and Gos proceeds from the Moon. The passage ends with a Mazdaean confession
    and the beginning of an offering to Havani and the Moon.
  language: English
  quote_policy: summarized
