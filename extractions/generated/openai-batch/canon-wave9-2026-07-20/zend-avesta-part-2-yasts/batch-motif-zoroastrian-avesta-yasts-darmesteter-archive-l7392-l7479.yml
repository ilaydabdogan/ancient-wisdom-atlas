canonical_text:
  quote: "'We sacrifice unto Mithra, the lord of wide pastures, .... sleepless, and
    ever awake.'"
  summary: The passage invokes Mithra, describes him as lord and master over social
    domains, ranks his force or presence between different social relationships, connects
    him with the Law of Mazda, and includes a prayer comparing the sun rising above
    Hara Berezaiti with the speaker's hoped-for rising above Angra Mainyu's will.
    A following section commands Spitama to offer sacrifice to Mithra and instruct
    his pupils to do likewise.
