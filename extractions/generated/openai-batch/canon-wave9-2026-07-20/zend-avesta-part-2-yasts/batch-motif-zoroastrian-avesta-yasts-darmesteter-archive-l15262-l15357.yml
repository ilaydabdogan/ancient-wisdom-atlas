canonical_text:
  quote: ''
  summary: 'The passage describes the soul after the third night: it remains near
    the skull, experiences extreme suffering, encounters foul northern wind, and,
    for the wicked soul, proceeds by four steps into named hells and Endless Darkness.
    An editorial note supplies a parallel development in which the wicked soul meets
    a hideous female personification of its own bad actions, conscience, religion,
    and deeds.'
