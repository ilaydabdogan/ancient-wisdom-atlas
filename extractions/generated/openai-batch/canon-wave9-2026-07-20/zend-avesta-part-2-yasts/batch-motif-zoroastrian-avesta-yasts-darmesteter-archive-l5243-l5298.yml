canonical_text:
  quote: ''
  summary: The passage praises Tishtrya, the bright and glorious star. It says Tishtrya
    afflicts and destroys the Pairikas sent by Angra Mainyu to stop water-bearing
    stars. Tishtrya drives them away from the sea Vouru-Kasha; wind then moves clouds
    carrying fertile waters, and friendly showers spread over the seven Karshvares.
    Standing, spring, stream, and rain waters are described as waiting for Tishtrya
    to rise so that overflowing waters may run to beautiful places and fields. The
    passage also includes a fragment referring to Ashi Vanguhi and Parendi on a light
    chariot and to a mountain on shining waters.
