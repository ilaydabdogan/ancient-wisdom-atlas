  summary: A fragment describes extraordinary bodily gifts and the eyesight of the
    Kara fish in deep Rangha waters. Section XII sacrifices to Verethraghna, made
    by Ahura, and describes him as making virility, death, and resurrection. The holy
    Zarathustra offers sacrifice asking for victorious thought, speech, action, address,
    and answer; Verethraghna grants him manliness, strength, bodily health, sturdiness,
    and the night-sight of a male horse.
