  summary: The passage praises and sacrifices to Mithra as a sleepless, ever-awake
    lord. Various social figures and persons in distress invoke him for help with
    uplifted hands. A wronged poor man who follows the good law is said to wail, and
    the voice of that wailing reaches the sky and travels over the earth.
