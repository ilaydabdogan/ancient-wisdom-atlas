candidate_motifs:
- id: motif:1
  label: sacrificial invocation of divine and cosmic powers
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly uses the formula of sacrificing unto named gods, Amesha-Spentas,
    Fravashis, fires, waters, astral bodies, and other sacred powers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives a liturgical list rather than a narrative account of
    sacrifice.
- id: motif:2
  label: wisdom as a sacred invoked power
  taxonomy_refs:
  - wisdom
  basis: The litany invokes Vohu-Mano together with heavenly Wisdom and Wisdom acquired
    through the ear, both made by Mazda.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not narrate the acquisition or teaching of wisdom; it
    only invokes wisdom as a sacred power.
- id: motif:3
  label: seasonal and agricultural abundance
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage invokes prosperity and thrift of the seasons, holy years, fatness
    and flocks, plenty of corn, productive females, all plants, and stars holding
    seeds of plants.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage lists seasonal and fertility associations without describing
    a full seasonal myth.
- id: motif:4
  label: divine parent-child relation of fire
  taxonomy_refs:
  - divine_parent_child
  basis: Atar is repeatedly identified as the son of Ahura Mazda.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage states the relationship but does not narrate Atar's birth.
- id: motif:5
  label: royal glory and sacred kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: The Atar section invokes the Glory of the Aryas, the awful Glory of the Kavis,
    King Husravah, and Nairyo-Sangha dwelling in the navel of kings.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage associates glory and kingship but does not present an enthronement
    or legitimacy narrative.
