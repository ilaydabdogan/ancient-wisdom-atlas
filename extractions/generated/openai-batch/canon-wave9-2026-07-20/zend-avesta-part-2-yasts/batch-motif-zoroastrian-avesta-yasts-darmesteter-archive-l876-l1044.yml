canonical_text:
  quote: ''
  summary: A Sirozah II litany enumerates sacrifices to Ahura Mazda, the Amesha-Spentas,
    named divine beings, Fravashis, fires, waters, mountains, lakes, astral bodies,
    animals, plants, and stars. The passage associates these powers with wisdom, order,
    metals, mercy, seasons, flocks, corn, fire, glory, healing, royal figures, holy
    waters, the Sun, the Moon, the seed of the Bull, and stars that contain seeds
    of waters, earth, and plants and oppose Yatus and Pairikas.
  language: English
  quote_policy: summarized
