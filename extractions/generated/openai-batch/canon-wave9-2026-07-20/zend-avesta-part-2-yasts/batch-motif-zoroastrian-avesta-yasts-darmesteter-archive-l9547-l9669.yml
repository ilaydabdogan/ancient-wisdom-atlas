canonical_text:
  quote: ''
  summary: The passage praises the Fravashis of the faithful as protective, beneficent
    powers. They guard a person like weapons, shields, and a thousand watchers; they
    ask for praise, sacrifice, offerings, invocation, and worship. The text worships
    faculties, souls, waters, plants, Fravashis, and the Fravashi of Ahura Mazda.
    It describes the Fravashis as effective cosmic powers who stood firm when the
    Good Spirit and the Evil One created the world, and who countered Angra Mainyu’s
    malice so waters flowed and plants grew.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Fravashis come as a weapon and as a shield to guard a
    man from the unseen Druj, the female Varenya fiend, an evil-doer, and Angra Mainyu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The protected man is said not to be destroyed by sword, club, arrow, spear,
    or stones flung from the arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fravashis come on this side and that side, never resting, and ask who
    will praise, sacrifice to, meditate on, bless, receive, invoke, and worship them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The requested reception includes meat, clothes, and a prayer, and the Fravashis
    speak of a gift that brings never-failing food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage includes worship of perception, intellect, conscience, those of
    the Saoshyants, souls of many kinds of animals, and their Fravashis.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Fravashis are described with epithets including liberal, valiant, beneficent,
    powerful, strong, light, and effective.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Fravashis are said to have stood holding fast when the Good Spirit and
    the Evil One created the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Angra Mainyu broke into the creation of good holiness, malice was destroyed
    so that waters did not stop flowing and plants did not stop growing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage worships all waters, all plants, and the Fravashis by their names.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Fravashi of Ahura Mazda is worshipped and described as greatest, best,
