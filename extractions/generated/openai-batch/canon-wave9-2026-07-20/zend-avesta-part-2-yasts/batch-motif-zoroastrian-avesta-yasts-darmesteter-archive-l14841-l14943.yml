canonical_text:
  quote: ''
  summary: The passage blesses sacrifice and prayer connected with Mount Ushi-darena,
    the kingly Glory, and a blissful abode for the holy. It then presents a liturgical
    invocation of the Mazda-made star Vanant for strength, healing, and resistance
    against Khrafstras of Angra Mainyu. A later fragment frames a dialogue in which
    Zarathustra asks Ahura Mazda which word contains the glorification of all good
    things; Ahura Mazda answers that it is the praise of Holiness, whose faithful
    recitation praises Mazda’s good creations and increases strength, victory, and
    piety.
  language: English
  quote_policy: summarized
