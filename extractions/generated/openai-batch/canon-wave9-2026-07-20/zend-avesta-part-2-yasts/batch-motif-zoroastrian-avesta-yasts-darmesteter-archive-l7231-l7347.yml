canonical_text:
  quote: ''
  summary: The passage invokes Mithra as sleepless and all-encompassing. It contrasts
    the limited, misguided earthly person with heavenly Mithra’s superior goodness,
    wisdom, hearing, and sight. Mithra is described as standing in royal power, seeing
    liars, and asking whom he should reward with glory, health, wealth, offspring,
    and sovereignty, or punish with sickness, death, poverty, sterility, loss of offspring,
    and removal of sovereignty. Translator notes compare Mithra’s encompassing arms
    and the named rivers to the Haoma-pressing ritual image.
  language: English
  quote_policy: summarized
