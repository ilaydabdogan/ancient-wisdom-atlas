canonical_text:
  quote: ''
  summary: A liturgical passage invokes and sacrifices to the Sun, the waters of Ahura,
    Ahura Mazda, Amesha-Spentas, Mithra, Tistrya, unseen holy gods, stars, moon, sun,
    and baresma-yielding trees. It asks for brightness, glory, bodily health, divine
    help, and entry into a luminous highest space or blissful abode of the holy ones.
    Mithra is described as truth-speaking, lord of wide pastures and countries, watchful
    with many ears and eyes, fully knowing, sleepless, and present around countries
    in all directions.
  language: English
  quote_policy: summarized
