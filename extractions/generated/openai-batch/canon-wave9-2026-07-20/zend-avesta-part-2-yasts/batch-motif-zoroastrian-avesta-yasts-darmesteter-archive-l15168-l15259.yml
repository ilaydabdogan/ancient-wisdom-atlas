canonical_text:
  quote: ''
  summary: The passage describes an exalted speaker made more lovely and foremost
    through good thought, speech, and deed. It then maps the faithful soul’s four
    postmortem steps through Good-Thought, Good-Word, and Good-Deed Paradises into
    Endless Lights. A previously departed faithful person questions the new arrival,
    but Ahura Mazda says not to ask one who has just crossed the fearful way where
    body and soul part. The righteous dead receive the food or oil of Zaremaya. Zarathustra
    then asks Ahura Mazda where the wicked soul abides after death; Ahura Mazda says
    it sits near the skull, sings the Kima Gatha, and experiences great suffering.
  language: English
  quote_policy: summarized
