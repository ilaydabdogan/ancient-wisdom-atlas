canonical_text:
  quote: ''
  summary: Tishtrya calls for offerings, descends to the sea Vouru-Kasha as a white
    horse, and is met by the dark horse-form Daeva Apaosha. After an initial defeat
    caused by insufficient worship, Ahura Mazda offers Tishtrya a named sacrifice
    and gives him multiplied strength. Tishtrya returns, defeats Apaosha, announces
    the release of waters to fields and the material world, stirs the sea, and rises
    with Satavaesa as vapours rise above Mount Us-hindu in the sea.
  language: English
  quote_policy: summarized
