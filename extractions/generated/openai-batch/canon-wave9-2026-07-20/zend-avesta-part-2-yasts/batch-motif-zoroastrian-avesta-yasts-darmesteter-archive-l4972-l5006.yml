  quote: ''
  summary: A male speaker calls people to assemble and asks who will offer him libations
    with Haoma and holy meat, saying he should receive sacrifice and prayer in the
    material world. He offers wealth in male children or oxen and purification of
    the soul. In two subsequent ten-night periods, the bright and glorious Tishtrya
    mingles his shape with light, first moving as a golden-horned bull and then as
    a white beautiful horse with golden ears and a golden caparison.
