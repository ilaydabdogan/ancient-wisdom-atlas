canonical_text:
  quote: ''
  summary: Ashi Vanguhi is invoked as shining, high, and powerful. Zarathu^ra offers
    her sacrifice and receives a boon concerning Hutaosa's adherence to the law. Kavi
    Vi^taspa offers sacrifice and receives a boon for victory over enemies and for
    bringing nations to the good law. Ashi then speaks about libations she will not
    accept, recounts being pursued and hiding beneath animals, laments reproductive
    offenses and deprivation of marriage and childbirth, and is answered by Ahura
    Mazda, who tells her to remain and walk inside the kingly palace. The passage
    closes with liturgical worship and blessing formulas.
  language: English
  quote_policy: summarized
