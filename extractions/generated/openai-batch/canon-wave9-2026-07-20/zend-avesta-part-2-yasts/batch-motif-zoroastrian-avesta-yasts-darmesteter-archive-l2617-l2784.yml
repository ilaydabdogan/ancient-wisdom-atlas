canonical_text:
  quote: ''
  summary: A section of the Khordad/Haurvatat Yast presents sacrifice to Haurvata/
    and related holy powers, Ahura Mazda’s instruction to Zarathustra about the benefits
    and protective power of Haurvata/, ritual use of a spell and furrows to distinguish
    the faithful from the wicked and drive away Druj/Nasu powers, restriction of the
    spell’s transmission, and a closing blessing for brightness, glory, and a blissful
    abode.
  language: English
  quote_policy: summarized
