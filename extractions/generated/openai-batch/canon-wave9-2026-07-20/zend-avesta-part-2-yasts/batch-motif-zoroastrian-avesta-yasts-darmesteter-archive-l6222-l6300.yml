canonical_text:
  quote: ''
  summary: The passage praises Mithra as sleepless, ever awake, powerful, all-seeing,
    and undeceivable. Weapons and hostile spells fail against one helped by Mithra;
    he rescues those who have not lied to him from distress and death, while terrifying
    and disabling those who lie to him. Mithra is also described as a warrior who
    strikes Daevas, withstands Pairikas, establishes nations in strength and victory
    when not deceived, and ruins a havoc-loving nation. A repeated refrain promises
    sacrifice for his brightness and glory.
  language: English
  quote_policy: summarized
