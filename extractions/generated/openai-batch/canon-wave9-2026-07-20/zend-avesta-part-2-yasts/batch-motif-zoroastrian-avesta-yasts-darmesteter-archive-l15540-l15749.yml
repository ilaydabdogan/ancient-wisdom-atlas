- id: obs:2
  text: Zarathustra identifies himself as a pious man who speaks words of blessing
    and blesses King Vishtaspa with a good, exalted, and long life, long-lived men
    and women, and sons born from his body.
  category: speech
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:3
  text: The blessing asks that Vishtaspa have a son like Jamasp and that he be beneficent,
    fiend-smiting, strong, and well-armed through comparisons with Mazda, Thraetaona,
    Jamasp, and Takhma-Urupa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The blessing compares desired traits of Vishtaspa to Yima Khshaeta, Azi Dahaka,
