    wisdom in assemblies, beauty, and bodily faultlessness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The blessing asks that Vishtaspa be rich in cattle and horses, holy like Zarathustra,
    able to reach the distant Rangha as Vafra Navaza did, and beloved by gods and
    reverenced by men.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:6
  text: 'The blessing asks that ten sons be born: three Athravans, three warriors,
    three tillers of the ground, and one like Vishtaspa himself.'
  category: speech
  evidence_refs:
