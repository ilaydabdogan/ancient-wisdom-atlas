canonical_text:
  quote: ''
  summary: The passage introduces Afrin Paighambar Zartusht and notes textual difficulties
    and overlap with Yast XXIV. The main section presents Zarathustra blessing King
    Vishtaspa with long life, flourishing men and women, sons, wealth, holiness, strength,
    victory, glory, freedom from sickness and death, and final bliss in the bright
    abode of the holy ones. The blessing uses a catalogue of comparisons to divine,
    heroic, royal, and cosmic exemplars, and a following Yast XXIV opening repeats
    much of the same blessing pattern.
  language: English
  quote_policy: summarized
