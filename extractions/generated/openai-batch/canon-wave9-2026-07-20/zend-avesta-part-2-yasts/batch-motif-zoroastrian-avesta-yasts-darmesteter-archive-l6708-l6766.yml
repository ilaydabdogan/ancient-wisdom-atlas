canonical_text:
  quote: ''
  summary: The passage praises Mithra as wise, undeceivable, sleepless, all-knowing,
    and lord of wide pastures. It says he denies gifts and removes bodily powers from
    those who have lied to him, protects the man he helps from weapons, watches over
    the seven Karshvares, gives prosperity and sovereignty, and is accompanied by
    named beings and personified powers. The speaker or worshipping community offers
    sacrifice for Mithra's brightness and glory.
  language: English
  quote_policy: summarized
