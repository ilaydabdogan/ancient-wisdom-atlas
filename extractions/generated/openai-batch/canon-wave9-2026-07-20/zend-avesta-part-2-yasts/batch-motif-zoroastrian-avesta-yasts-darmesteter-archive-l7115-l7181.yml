canonical_text:
  quote: ''
  summary: The passage invokes Mithra, lord of wide pastures, as sleepless and ever
    awake. After sunset he traverses the wide round earth, touches its far ends, and
    surveys the space between earth and heaven. He wields a hundred-knotted, hundred-edged
    brass club. Angra Mainyu, Aeshma, Bushyasta, unseen Daevas, and Varenya fiends
    flee from him in fear. The speaker prays not to meet Mithra's angry rush or be
    smitten by him, praises him as strongest and most fiend-smiting among gods, and
    offers sacrifice for his brightness and glory. A following section repeats the
    sacrifice to Mithra and the fear of Daevas and Varenya fiends.
  language: English
  quote_policy: summarized
