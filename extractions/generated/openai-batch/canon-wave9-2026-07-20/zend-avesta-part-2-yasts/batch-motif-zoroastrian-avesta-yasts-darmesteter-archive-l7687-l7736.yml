canonical_text:
  quote: ''
  summary: The passage praises Mithra as sleepless and ever awake, describes white
    stallions drawing his chariot, and contrasts the happiness of a person for whom
    a holy priest properly sacrifices to Mithra with the woe of one served by an unholy
    priest. Proper worship is associated with Mithra visiting the person's dwelling
    and bringing boons, while improper priestly service fails to delight Ahura Mazda,
    the Amesha-Spentas, Mithra, the Law, Rashnu, and Arshtat.
  language: English
