  quote: ''
  summary: The passage introduces the Ormazd Yasht as an enumeration and praise of
    Ahura Mazda's names and their efficacy, especially as a defense when recited.
    It notes ritual recitation contexts, discusses wider traditions concerning divine
    names, describes a corrupt fragment as possibly concerning a final struggle between
    Ormazd and Ahriman and the annihilation of the Daevas, and then gives liturgical
    formulas praising good thoughts, words, and deeds, offering sacrifice and prayer
    to the Amesha-Spentas, reciting the Ashem Vohu, and professing Mazda-worship.
