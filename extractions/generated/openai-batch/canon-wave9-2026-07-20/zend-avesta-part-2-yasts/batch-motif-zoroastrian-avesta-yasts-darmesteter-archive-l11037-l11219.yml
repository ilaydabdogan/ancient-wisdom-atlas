  summary: A liturgical passage worships the Fravashis of holy men and women in many
    countries and across all time, asks them to come quickly and help, invites them
    into the house, offers sacrifice and raised-hand supplication, praises Zarathustra
    and holy law-followers, worships earth, heavens, souls, and good beings, and asks
    the Fravashis to bless the house and carry worship to Ahura Mazda and the Amesha-Spentas.
