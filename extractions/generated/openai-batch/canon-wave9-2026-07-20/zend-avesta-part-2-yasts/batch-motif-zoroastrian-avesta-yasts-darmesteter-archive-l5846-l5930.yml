canonical_text:
  quote: ''
  summary: The passage praises Drvaspa as a holy power made by Mazda who protects
    flocks and yokes horses for the faithful. Kavi Vi^-taspa sacrifices animals and
    libations behind the waters of the river Daitya and asks Drvaspa for victory over
    named enemies and for nations to be brought to the good law. Drvaspa grants the
    boon. A liturgical refrain offers libations, Haoma, meat, baresma, spells, words,
    speech, deeds, and prayers, and asks for brightness, glory, health, and a blissful
    abode among the holy ones.
  language: English
  quote_policy: summarized
