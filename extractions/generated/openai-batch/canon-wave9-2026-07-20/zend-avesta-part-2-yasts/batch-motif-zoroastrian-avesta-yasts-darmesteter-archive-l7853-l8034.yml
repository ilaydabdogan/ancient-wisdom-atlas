canonical_text:
  quote: ''
  summary: Introductory notes identify the Srosh Yast Hadhokht as a liturgical hymn
    to Sraosha. The passage invokes Ahura Mazda, confesses Mazda-worship, and offers
    sacrifice, prayer, propitiation, glorification, and libations to Sraosha and other
    named beings. Sraosha is described as holy, tall-formed, fiend-smiting, a protector
    of the poor, and a helper. Good prayer, sacred words, the Mathra Spenta, the Ahuna
    Vairya, and the word of truth are said to repel fiends, Druj, Daevas, and other
    hostile beings. A faithful man or woman who pronounces the word with holiness
    is protected in dangerous circumstances such as high waters, dark rainy nights,
    river fords, branching roads, assemblies, and encounters with Daeva-worshippers,
    idolaters, thieves, Yatus, and Pairikas.
  language: English
  quote_policy: summarized
