  quote: "“We sacrifice unto the awful Glory, that cannot be forcibly seized, made
    by Mazda ....”"
  summary: The passage describes a divine Glory made by Mazda that cannot be forcibly
    seized. Good and evil powers struggle for it with darts. Atar and Azhi Dahaka
    threaten one another over the Glory; each withdraws from fear, and the Glory goes
    to the sea. The opening fragment also reports Keresaspa killing an opponent, and
    the notes connect the episode with Yima and with an editorial Greek comparison.
  language: English
