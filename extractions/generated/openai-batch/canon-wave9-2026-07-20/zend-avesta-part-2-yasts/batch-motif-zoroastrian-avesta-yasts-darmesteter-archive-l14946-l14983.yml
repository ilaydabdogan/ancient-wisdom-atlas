  quote: ''
  summary: The passage states that a recital of the praise of Holiness has different
    degrees of worth according to when it is delivered. Ahura Mazda answers questions
    addressed to holy Zarathustra, identifying especially valuable recitations performed
    while eating the gifts of Haurvata/ and Amereta/^ or while drinking Haoma strained
    for sacrifice, together with profession of good thoughts, good words, and good
    deeds and rejection of their evil counterparts. The final answer in the supplied
    range begins but is incomplete.
