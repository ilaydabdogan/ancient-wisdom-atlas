  quote: ''
  summary: The passage introduces Ashi Vanguhi as a feminine personification of piety
    and as a source of good, riches, fortune, and wealth. It summarizes the contents
    of the Ashi Yast, listing figures who worship her and groups whose offerings she
    rejects. The opening stanzas sacrifice to Ashi and describe her attributes, including
    radiance, strength, healing power, a loud-sounding chariot, fullness of intellect,
    and her kinship as daughter of Ahura Mazda and sister of the Amesha-Spentas.
  language: English
