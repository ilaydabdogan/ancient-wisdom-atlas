canonical_text:
  quote: ''
  summary: A liturgical sequence in the Ram Yast invokes sacrifice to the Waters and
    to Vayu. Several figures offer sacrifice to Vayu with golden ritual furnishings,
    baresma, and milk offerings, then ask for boons. Haoshyangha, Takhma Urupa, and
    Yima receive their requested boons; Azi Dahaka's request to depopulate the seven
    regions of earth is refused; Thraetaona begins a request to overcome Azi Dahaka,
    described as a many-mouthed, many-headed fiendish being.
  language: English
  quote_policy: summarized
