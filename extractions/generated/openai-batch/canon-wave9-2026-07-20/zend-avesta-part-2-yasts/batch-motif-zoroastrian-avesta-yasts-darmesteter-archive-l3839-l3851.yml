  summary: A divine speaker says that through her brightness and glory flocks, herds,
    and human beings continue upon the earth, and that she keeps all good things made
    by Mazda like a shepherd keeping a flock. Zarathustra then asks Ardvi Sura Anahita
    what sacrifice he should use to worship and forward her, so that Mazda may make
    her run down to the earth.
