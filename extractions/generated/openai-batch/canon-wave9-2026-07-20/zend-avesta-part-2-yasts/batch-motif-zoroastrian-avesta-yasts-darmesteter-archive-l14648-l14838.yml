candidate_motifs:
- id: motif:1
  label: Mazda-made royal Glory legitimizes rulers and heroes
  taxonomy_refs:
  - royal_legitimacy
  basis: The Glory is made by Mazda, cleaves to Vishtaspa and the future Saoshyant,
    is sought by Frangrasyan for rule over all Karshvares, and is listed as borne
    by several heroic or royal figures.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: One line naming Frangrasyan as a bearer of Glory is accompanied by a translator's
    note suggesting possible corruption or an unknown variant.
- id: motif:2
  label: Holy prayer repels demonic beings
  taxonomy_refs: []
  basis: Zarathustra's repeated Ahuna Vairya prayer drives all Daevas beneath the
