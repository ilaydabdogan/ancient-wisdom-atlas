canonical_text:
  quote: ''
  summary: The passage describes the Mazda-made kingly Glory as attached to holy and
    royal figures, especially Zarathustra, Vishtaspa, Saoshyant/Astvat-ereta, and
    several heroic kings. Demonic powers flee before Zarathustra and his prayer. Frangrasyan
    tries and fails to seize Zarathustra's Glory. Vishtaspa receives the kingly Glory
    and supports the Law. A future restoration is foretold in which Saoshyant and
    his helpers restore the world, the dead rise, creation becomes deathless, and
    evil powers are defeated by beneficent forces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A holy lawful figure is described as excelling in holiness, rule, brightness,
    glory, and victory, and demonic beings flee or are checked at his sight.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zarathustra sings and repeats the Ahuna Vairya prayer four times with increasing
    loudness, and the prayer drives the Daevas beneath the earth and removes sacrifice
    and prayer from them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Frangrasyan tries to seize the Glory of Zarathustra in order to rule over
    all the Karshvares; he rushes around the seven Karshvares, but the Glory escapes
    to hidden inlets of the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The awful kingly Glory made by Mazda cleaves to king Vishtaspa, who thinks,
    speaks, and acts according to the Law, professes that Law, destroys foes, and
    causes Daevas to retire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vishtaspa drives the Druj before him, makes room for the holy religion, supports
    the law of Ahura and Zarathustra, takes a bound feminine figure or entity from
    the Hunus, establishes her in the middle of the world, and conquers named enemies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The kingly Glory is said to cleave in the future to the victorious Saoshyant
    and his helpers when he restores the world; the restored world will not age, die,
    decay, or rot, and the dead will rise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The creation of the Good Spirit becomes deathless, while the Druj and her
    hundredfold brood perish despite rushing to kill holy beings.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Astvat-ereta rises from Lake Kasava as a friend of Ahura Mazda, son of Vispataurvairi,
    and knower of victorious knowledge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Glory is listed as having been borne by Thraetaona, Frangrasyan, Husravah,
    and Vishtaspa in episodes involving the killing or defeat of enemies or hostile
    powers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A future figure looks on living creatures with an eye of intelligence and
    plenty, and his look delivers the living creatures to immortality.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Friends of Astvat-ereta come forward as fiend-smiting, well-thinking, well-speaking,
    well-doing, law-following, and free from false speech.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Aeshma bows and flees; Akem-Mano is smitten by Vohu-Mano, falsehood by truth,
    hunger and thirst by Haurvatat and Ameretat, and Angra Mainyu bows and flees powerless.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
