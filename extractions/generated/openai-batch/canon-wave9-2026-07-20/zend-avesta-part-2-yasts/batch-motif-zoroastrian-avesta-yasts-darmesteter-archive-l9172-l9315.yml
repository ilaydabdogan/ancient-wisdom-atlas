canonical_text:
  quote: ''
  summary: The passage praises the Fravashis of the faithful as renowned armed helpers
    in battle who aid the faithful, rout hostile forces, grant victory, boons, glory,
    and health, and respond to worship and invocation. It describes Zarathustra worshipping
    them in struggle and distress. It also presents the Fravashis as heavenly powers
    connected with Satavaesa, waters, plants, nourishment, and the welfare of animals
    and people. In the closing section, they are armored in brass and light, kill
    Daevas, bring the breath of victory through the wind, and turn with Mithra, Rashnu,
    a cursing thought, and the victorious wind toward the side that first worships
    them faithfully, smiting opposing nations in great numbers.
  language: English
  quote_policy: summarized
