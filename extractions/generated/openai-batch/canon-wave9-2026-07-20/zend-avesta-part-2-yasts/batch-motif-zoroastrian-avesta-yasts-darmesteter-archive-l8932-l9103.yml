canonical_text:
  quote: ''
  summary: The passage praises the Fravashis of the faithful as powerful beneficent
    beings whose brightness and glory sustain cosmic order, fertility, birth, celestial
    movement, battle-aid, and ritual protection. Ahura Mazda instructs Zarathushtra
    to recite fiend-smiting invocations to the Fravashis on dangerous roads. The hymn
    describes the Fravashis as maintainers of sky, waters, earth, cattle, and the
    conceived child, and as givers of victory, boons, health, and glory to faithful
    worshippers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fravashis of the faithful are said to have helped the divine speaker;
    without them, animals and men would not subsist and the Druj would possess strength,
    dominion, and the material world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Without the Fravashis, immaterial creatures between earth and sky would be
    harassed and smitten by the Druj, and Angra-Mainyu would not give way to the blows
    of Spenta-Mainyu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Through the Fravashis' brightness and glory, waters flow from never-failing
    springs, plants grow from the earth, and winds drive clouds toward the springs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Through the Fravashis' brightness and glory, females conceive, give birth
    safely, and become blessed with children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Through the Fravashis' brightness and glory, a man is born who becomes a chief,
    listens to holy words, is favored by Wisdom, and returns victorious from discussions
    with Gaotema.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sun, moon, and stars are said to go their ways through the Fravashis'
    brightness and glory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In fearful battles the Fravashis of the faithful are described as wise helpers,
    and the Fravashis of the primitive law or unborn Saoshyants are said to be the
    most powerful.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Fravashis of the living faithful are said to be more powerful than those
