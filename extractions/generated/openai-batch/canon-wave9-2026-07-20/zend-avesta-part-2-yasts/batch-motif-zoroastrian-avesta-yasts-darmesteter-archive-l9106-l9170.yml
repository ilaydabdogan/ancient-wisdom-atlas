  summary: The passage describes Mazda invoking a group for help during the fixing
    of sky, waters, earth, plants, and the development of the child in the womb. Spenta-Mainyu
    fixes and maintains cosmic domains, while the strong Fravashis sustain the sky,
    are praised as beneficent and health-giving, fight hostile beings, and deliver
    Victory and the Ascendant to countries where they receive sacrifice and prayer.
