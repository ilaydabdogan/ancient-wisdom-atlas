canonical_text:
  quote: ''
  summary: A question is asked about remedying curses and spells. Ahura Mazda instructs
    Zarathustra to use a feather of the Vareghana bird to rub the body and turn curses
    back on enemies. Holding a bone or feather of that bird makes a man difficult
    to strike or rout and brings help, homage, and glory. The bird is described as
    carrying lordly chariots, including that of Kavi Usa; Thraetaona rides it when
    he smites the destructive multi-headed demon Az'i Dahaka, created by Angra Mainyu.
    The passage then sacrifices to Verethraghna and compares him with the great bird
    Saena and with water-filled clouds beating mountains. Zarathustra asks where Verethraghna's
    name should be invoked.
  language: English
  quote_policy: summarized
