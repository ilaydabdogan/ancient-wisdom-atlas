canonical_text:
  quote: "“We sacrifice unto Mithra, the lord of wide pastures, .... sleepless, and
    ever awake”"
  summary: The passage praises Mithra as vigilant, glorious, and powerful. Verethraghna,
    made by Ahura, runs before him against foes in the form of an iron-limbed boar.
    The enemy and those who have lied to Mithra are violently destroyed. Mithra addresses
    Ahura Mazda, saying that if people worship him by name with sacrifice, he will
    come to the faithful at the appointed time. The speaker petitions Mithra for protection
    from exile, help against malicious killers, and a prosperous abode through prayers,
    consecrations, offerings, and libations.
  language: English
  quote_policy: quoted
