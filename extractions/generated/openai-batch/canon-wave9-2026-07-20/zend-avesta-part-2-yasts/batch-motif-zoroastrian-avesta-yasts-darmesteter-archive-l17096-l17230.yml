canonical_text:
  quote: ''
  summary: A liturgical prayer addresses Atar, the Fire and son of Ahura Mazda. The
    speaker asks that Atar receive proper offerings, burn and protect the house, grant
    welfare, wisdom, courage, offspring, and a blessed abode for the soul. Atar is
    described as observing those who pass by, desiring offerings from those for whom
    he cooks, blessing those who bring proper fuel, assisting those who comfort him,
    and taking vengeance on those who harm him.
  language: English
  quote_policy: summarized
