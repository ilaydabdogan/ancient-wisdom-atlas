canonical_text:
  quote: ''
  summary: 'In XXVIII.119-121, Spitama Zarathujtral is addressed and told to offer
    sacrifice to Ardvi Sura Anahita, described as a spring. Ahura Mazda is said to
    have made four horses for her: wind, rain, cloud, and sleet. The passage describes
    ongoing rain, snow, hail, and sleet upon the earth, Anahita''s numerous armies,
    and the golden height Hukairya, from which Anahita leaps with great Glory and
    power. A first-person worshipper says a sacrifice will be offered for her brightness
    and glory.'
