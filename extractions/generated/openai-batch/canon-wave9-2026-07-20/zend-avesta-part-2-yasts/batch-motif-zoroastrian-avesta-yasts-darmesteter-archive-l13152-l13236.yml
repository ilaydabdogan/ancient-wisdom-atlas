canonical_text:
  quote: ''
  summary: The passage invokes Ashi Vanguhi and states that men whom she attends are
    happy and prosperous, with daughters, battle horses and chariots, camels, silver,
    gold, and fine garments. The speaker asks Ashi not to turn away and describes
    her divine qualities and family. Ashi rises on her chariot and asks who invokes
    her. Zarathustra identifies himself as the first mortal to praise Asha and sacrifice
    to Ahura Mazda and the Amesha-Spentas; his birth and growth make waters, plants,
    and good creation rejoice, while Angra Mainyu flees from the earth.
  language: English
  quote_policy: summarized
