canonical_text:
  quote: ''
  summary: Zarathustra instructs the young king Vistaspa in worship, sacrifice, invocation,
    moral conduct, ritual purity, and the path to Paradise. The passage links tree
    and twig rites, Haoma and royalty, divine invocation for victory, Fire as a warrior
    against fiendish powers, and prayers that lead the soul to Garo-nmana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young king Vistaspa is addressed as one to be protected while he smites
    adversaries, foes, and those who hate him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vistaspa asks Zarathustra what kind of sacrifice should be used to worship
    and further the creation of Ahura Mazda.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zarathustra instructs Vistaspa to go to a beautiful, high-growing, mighty
    tree made by Mazda and to greet it with ritual words.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The faithful man is told to cut one, two, or three baresma twigs, bind them
    according to rites, and prepare Haoma for sacrifice; the smallest Haoma twig is
    said to give royalty to the man who performs the rite.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Zarathustra directs invocation of Ahura Mazda and other powers so that the
    invoked god may grant the desired boon and empower the smiting of the Druj and
    enemies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The prayers are said to cleanse the body from deeds of lust, and Fire, called
    the son of Ahura Mazda and a valiant warrior, is described as falling upon fiends,
    men of the Druj, and wicked Daeva-worshippers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A dead man trembles at a way made by Time and open to both wicked and righteous;
    the footnote identifies this way with the Cinvat-bridge.
  category: setting
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: Recitation of the Staota Yesnya prayers is said to bring a person up to the
    blessed Garo-nmana, described as a beautifully made palace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who has committed a serious crime is said not to follow the way of
    the Law and is instructed to praise, desire, and embrace the Law, like a good
    horse turning from a wrong way to a right one.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage tells followers to go forward with praises on the way of the good
    Mazdean law, and says heavenly reward is seized by giving gifts to one who holds
    up the Law.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Law is to be given to one unfriendly to it so that he may become friendly;
    the addressee is told to wash hands with water, and his future son is to do the
    same.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Amesha-Spentas promise to come and show Zarathustra the way to the other
    world, long glory in the spiritual world, happiness of the soul in Paradise, and
    Garo-nmana of Ahura Mazda.
  category: speech
  evidence_refs:
  - ev:12
