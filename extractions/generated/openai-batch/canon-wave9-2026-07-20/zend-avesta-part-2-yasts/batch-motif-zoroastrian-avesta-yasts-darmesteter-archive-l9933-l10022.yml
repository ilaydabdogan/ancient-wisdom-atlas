  summary: The passage describes a mighty-speared, lordly Word who drives the Druj
    away, opens space for the holy religion, and supports the law of Ahura and Zarathushtra.
    It then describes a bound feminine figure, identified in a note as Daena/the religion,
    being taken from the hands of the Hunus and established at the middle of the world
    as holy, high-ruling, stable, and abundant in cattle and pastures. The remainder
    is a litany worshipping named holy Fravashis, with notes on some names and on
    Atar/fire-associated names.
