canonical_text:
  quote: ''
  summary: The passage includes a note on Bareshnum purification, then describes Ahura
    Mazda gently showing the departing soul its way. Zarathustra addresses young king
    Vishtaspa about following the Law of Mazda, charity toward the poor, protection
    from the Druj, prosperity for offspring, and avoidance of Angra Mainyu's influence.
    Atar blesses the incense-bringer with herds, sons, and desired boons, while words
    and hymns of praise are directed to Mazda and to the Garo-nmana of Ahura Mazda.
  language: English
  quote_policy: summarized
