  quote: ''
  summary: Zarathushtra is told to offer sacrifice to Ardvi Sura Anahita. Are^a^aspa
    and Va;zdaremaini offer sacrifice by the sea Vouru-Kasha with many animals and
    ask Anahita to grant them victory over Kavi Vii'taspa, Zairivairi, and the Aryan
    people. Anahita refuses to grant the requested favor despite their libations,
    gifts, sacrifices, and entreaties.
