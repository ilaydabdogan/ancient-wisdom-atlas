canonical_text:
  quote: ''
  summary: A hymn section sacrifices to Mithra, describing him as sleepless and awake,
    a supporter or breaker of houses, a giver of herds, male children, peace, trouble,
    and other boons. The speaker offers sacrifice and libations, petitions for prosperity,
    wisdom, victory, and the defeat of enemies, and then portrays Mithra as a battle-governing
    power who terrifies armies, punishes those who lie to him, makes their weapons
    fail, and acts with Rashnu, Sraosha, and two Yazatas in routing them.
  language: English
  quote_policy: summarized
