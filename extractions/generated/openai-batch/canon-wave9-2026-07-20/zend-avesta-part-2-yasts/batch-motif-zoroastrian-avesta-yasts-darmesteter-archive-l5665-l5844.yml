canonical_text:
  quote: ''
  summary: 'The passage repeatedly invokes the powerful, Mazda-made, holy Drvaspa,
    who protects flocks and aids the faithful. Several figures offer sacrifice and
    request boons: Thraetaona asks to overcome A^i Dahaka and deliver two women; Haoma
    asks to bind Franghrasyan and bring him to Husravah for vengeance; Husravah asks
    to kill Franghrasyan to avenge Syavarshana and Aghraeratha; and Zarathustra asks
    to bring Hutaosa into conformity with the Mazdean law so she may spread it. In
    each case Drvaspa grants the boon. A translator''s note compares Haoma''s capture
    of Franghrasyan with a Shah Namah version in which Haoma becomes a hermit who
    captures Afrasyab and delivers him to Khosrav.'
  language: English
  quote_policy: summarized
