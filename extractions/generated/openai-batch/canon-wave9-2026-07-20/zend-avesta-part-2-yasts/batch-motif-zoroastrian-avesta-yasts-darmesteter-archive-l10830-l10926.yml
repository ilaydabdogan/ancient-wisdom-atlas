canonical_text:
  quote: ''
  summary: The passage requests health, glory, offspring, afterlife benefit, dominion,
    longevity, remedies, and protection. It worships the Fravashis of several named
    holy figures and associates these invocations with withstanding human enemies,
    brigands, Yatus, Pairikas, Daevas, fiends, and Aeshma. A note attached to the
    jar epithet explains a jar-upbringing and compares it with Vedic figures.
  language: English
  quote_policy: summarized
