    be exterminated at one stroke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage asks for health, Mazda-made Glory, bodily health, a good virtuous
    offspring, and a part in the blessed world for wisdom and for those who do not
    follow impiety.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The desired offspring is described as wise, chief in assemblies, bright, clear-eyed,
    of good intellect, and able to free the father from the pangs of hell.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage asks for a splendid dominion, long life, boons, and remedies,
    and says these are to withstand Yatus, Pairikas, oppressors, the blind, the deaf,
    and evil done by oppressors.
  category: action
  evidence_refs:
  - ev:2
