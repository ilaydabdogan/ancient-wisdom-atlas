canonical_text:
  quote: ''
  summary: The passage praises the kingly Glory made by Mazda, describing its strength,
    protective effects, and ritual sacrifice. It is said to cleave to a series of
    Kavi kings, making them brave, strong, wise, happy, and powerful. It also cleaves
    to Kavi Husravah, granting strength, victory, lawful power, health, offspring,
    blessed-world reward, dominion, long life, and success over enemies whom he binds
    to avenge murders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's strength and kingly Glory are said to come with the figure being addressed,
    and the kingly Glory is described as sufficient to extinguish all non-Aryan nations
    at once.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kingly Glory is said to help living creatures keep away hunger, death,
    cold, and heat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kingly Glory is described as keeper of the Aryan nations and the five
    kinds of animals, and as made to help the faithful and the Law of Mazda-worshippers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker repeatedly says that a sacrifice will be offered to the kingly
    Glory for its brightness and glory.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The awful kingly Glory made by Mazda is said to have cleaved to a list of
    Kavi figures: Kavata, Aipivohu, Usadha, Arshan, Pisina, Byarshan, and Syavarshan.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The listed Kavi figures are described as brave, strong, healthful, wise, happy
    in their wishes, and powerful kings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kingly Glory is said to have cleaved to Kavi Husravah for strength, victory
    made by Ahura, crushing ascendant power, righteousness and innocence of the law,
    and unconquerable power of the law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage requests or associates with Husravah health, bodily health, virtuous
    offspring, wisdom, a blessed-world portion, splendid dominion, long life, boons,
    and remedies.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Husravah is said to have prevailed over all, put Frangrasyan and Keresavazda
