canonical_text:
  quote: ''
  summary: 'The passage offers repeated sacrifices to the most right A''ista, made
    by Mazda and holy, and to the good Law of the worshippers of Mazda. Zarathu^tra,
    Hvovi^, Athravans, and a king or lord each sacrifice for specific boons: righteousness,
    bodily strength and senses, lawful conduct, memory to preach the law, country
    peace, and long life with a blissful abode. A note identifies the good narcotic
    as Bangha and compares it with legends of visionary transport after drinking from
    a cup.'
  language: English
  quote_policy: summarized
