canonical_text:
  quote: ''
  summary: A fiend named Biishyasta/Bushyasta comes from the north and urges humans
    to sleep and live in sin. A Pahlavi-supplied passage contrasts this with a winged
    caller urging people to arise, clothe themselves ritually, wash, feed cattle,
    and recite the five Gathas. The excerpt then summarizes material in which God
    teaches the Zendavasta to Zartusht, commands him to present it to Shah Gushtasp,
    and Zartusht blesses and admonishes the king with promises of paradise for obedience
    and hell for refusal.
  language: English
  quote_policy: summarized
