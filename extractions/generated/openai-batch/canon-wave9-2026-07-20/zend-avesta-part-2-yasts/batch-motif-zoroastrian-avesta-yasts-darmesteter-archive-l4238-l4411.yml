canonical_text:
  quote: ''
  summary: Ardvi Sura Anahita is described as richly adorned, holding the baresma,
    wearing gold ornaments, a starry crown, and beaver garments. A petitioner asks
    her for conquest, wealth, battle companions, and aid through sacrifice and invocation.
    The passage then introduces and begins the Khorshed Yasht to the undying, shining,
    swift-horsed Sun, whose rising cleanses the earth, waters, and holy creatures,
    and whose absence would allow Daevas to destroy the seven Karshvares. Sacrifice
    to the Sun is said to withstand darkness and hostile beings and to rejoice divine
    powers.
  language: English
  quote_policy: summarized
