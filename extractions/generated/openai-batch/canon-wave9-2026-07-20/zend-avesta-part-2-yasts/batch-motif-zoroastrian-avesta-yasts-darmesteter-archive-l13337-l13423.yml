canonical_text:
  quote: ''
  summary: The passage presents three sacrificial petitions to Ashi Vanguhi. Thraetaona
    offers sacrifice in Varena and asks to overcome A^i Dahaka and deliver two named
    women; Haoma offers sacrifice on Haraiti Bareza and asks to bind Franghrasyan
    and bring him to Husravah for vengeance; Husravah offers sacrifice by the salt-water
    lake and asks to kill Franghrasyan to avenge murdered kin. In each case Ashi Vanguhi
    comes to the petitioner and the boon is obtained.
  language: English
