canonical_text:
  quote: ''
  summary: The passage worships the Fravashis of divine, cosmic, and created beings;
    honors Gaya Maretan as first listener to Ahura Mazda and source of the Aryan nations;
    praises Zarathushtra as the first good thinker, speaker, doer, priest, warrior,
    plougher, teacher, and law-bearer; describes his victory over the Daevas through
    Asha, the Word, and the Law of Ahura; and presents his birth as rejoiced over
    by waters, plants, and all good creatures, with the Mazda-worshipping law spreading
    through the seven Karshvares.
  language: English
  quote_policy: summarized
