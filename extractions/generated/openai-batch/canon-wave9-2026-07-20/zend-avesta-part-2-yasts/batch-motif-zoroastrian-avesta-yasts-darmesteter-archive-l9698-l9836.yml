  confidence: medium
  cautions: The passage gives only a compressed liturgical statement, not a full origin
    narrative.
- id: motif:2
  label: Culture founder with first priestly, martial, agricultural, and teaching
    roles
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Zarathushtra is repeatedly described as first in good thought, speech, deed,
    priesthood, warfare, ploughing, knowledge, and teaching.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The text is hymnic praise, so the motif is expressed through titles and
    firsts rather than through a sequential biographical tale.
- id: motif:3
  label: Sacred word and law defeat demonic powers
  taxonomy_refs:
  - duality
  - wisdom
  basis: Zarathushtra’s praise of Asha brings the Daevas to naught, and he proclaims
    the Daeva-destroying word and Law of Ahura.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents ritual-verbal and doctrinal victory, not physical
    combat.
