canonical_text:
  quote: ''
  summary: The passage praises Drvaspa as a Mazda-made holy power who protects flocks,
    herds, cattle, and the faithful. Haoshyangha offers a large sacrifice to Drvaspa
    on Hara and asks to overcome the Daevas of Mazana; Drvaspa grants the boon. A
    ritual offering formula to Drvaspa follows. Yima Khshaeta then offers a similar
    sacrifice from Hukairya and asks to bring abundance and immortality to Mazda’s
    world while removing hunger, thirst, old age, death, and hostile winds for a thousand
    years; Drvaspa grants this boon.
  language: English
  quote_policy: summarized
