canonical_text:
  quote: ''
  summary: 'In section VIII, the liturgical speaker declares sacrifice to the Waters,
    to the one who divides them, and to Vayu. Aurvasara, lord of the country, offers
    sacrifice to Vayu near the White Forest with golden ritual furnishings, baresma
    bundles, and full-boiling milk. He asks Vayu for a boon: that Husravah, the king
    who unites the Aryan nations, not smite them and that Aurvasara may flee from
    him. A note links the White Forest with other Zoroastrian textual references.'
  language: English
  quote_policy: summarized
