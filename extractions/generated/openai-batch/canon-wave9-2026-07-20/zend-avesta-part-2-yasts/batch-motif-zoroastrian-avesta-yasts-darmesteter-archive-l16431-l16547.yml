canonical_text:
  quote: ''
  summary: 'The passage describes the postmortem progress of a faithful soul after
    the third night: a sweet south wind appears, the soul''s own conscience comes
    to him as a beautiful maiden, she explains that his good thoughts, words, deeds,
    and worship made her more beautiful, and the soul advances by four steps into
    paradises and Endless Light. A previously departed faithful one asks about the
    journey, but Ahura Mazda forbids questioning the newly dead because of the distress
    of bodily separation, and food is assigned to righteous deceased persons. The
    passage ends with Zarathustra addressing young king Vistaspa.'
  language: English
  quote_policy: summarized
