  summary: The passage invokes sacrifice to Verethraghna, made by Ahura/Mazda. It
    says that Verethraghna binds the hands, confounds the eyesight, and removes hearing
    from the ears of the Mithradrujes, so that they can no longer move or withstand.
    The speaker blesses the sacrifice, prayer, strength, and vigour of Verethraghna
    and asks that the worshipper receive brightness, glory, and the blissful abode
    of the holy ones.
