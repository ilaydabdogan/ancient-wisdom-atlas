  summary: The passage repeatedly invokes and blesses holy Rashnu whether he is at
    the angles, boundary, or any place of the earth, and seeks his friendship toward
    a prepared var. It then invokes Rashnu if he is on Hara Berezaiti, described as
    a bright mountain around which the stars revolve, free from night, darkness, winds,
    sickness, Daeva-made uncleanness, and unreachable by clouds.
