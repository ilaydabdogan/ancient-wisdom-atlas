canonical_text:
  quote: ''
  summary: The passage praises and sacrifices to Ashi Vanguhi, describing her as bright,
    powerful, welfare-giving, and a bringer of wisdom and help to invokers. It names
    offerings made to her, honors Haoma, the Mathra, and Zarathushtra, contrasts Haoma
    with other drinks associated with Aeshma, and lists the wealth, kingship, households,
    beds, ornaments, and erotic domestic happiness enjoyed by men whom Ashi attends.
  language: English
  quote_policy: summarized
