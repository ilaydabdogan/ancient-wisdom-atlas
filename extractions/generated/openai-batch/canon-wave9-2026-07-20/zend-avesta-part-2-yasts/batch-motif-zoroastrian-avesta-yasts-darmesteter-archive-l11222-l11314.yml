canonical_text:
  quote: ''
  summary: The passage introduces the Bahram Yasht concerning Verethraghna, the Genius
    of Victory. It outlines ten forms in which Verethraghna appears to Zarathushtra
    and begins the hymn with invocations and offerings. Zarathushtra asks Ahura Mazda
    which heavenly god is best armed; Ahura Mazda names Verethraghna. Verethraghna
    first comes in the shape of a strong, beautiful wind, bearing Mazda-made Glory
    associated with health and strength, and declares his superiority in strength,
    victory, glory, favour, welfare, and healing. He also says he will destroy the
    malice of hostile beings. The passage closes this segment with a sacrificial formula
    naming offerings such as libations, Haoma, meat, baresma, holy spells, speech,
    deeds, and rightly spoken words.
  language: English
