  quote: ''
  summary: The passage introduces the Aban Yasht and Ardvi Sura Anahita, includes
    an editorial note on historical worship and Greek identifications, then gives
    a liturgical opening and the beginning of a hymn in which Ahura Mazda commands
    Zarathustra to sacrifice to Ardvi Sura Anahita. Ardvi is praised as a holy water-spring
    and large river, health-giving, fertile, life- and wealth-increasing, opposed
    to the Daevas, and flowing from Hukairya to the sea Vouru-Kasha.
  language: English
  quote_policy: summarized
