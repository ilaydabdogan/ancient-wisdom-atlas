canonical_text:
  quote: ''
  summary: The passage introduces the Ram Yasht as connected with Rama Hvastra and
    Vayu, gives liturgical invocations and offerings, and narrates Ahura Mazda sacrificing
    to Vayu in Airyana Vaejah, asking for power against Angra Mainyu's creation and
    protection for the Good Spirit's creation. Vayu grants the boon, and further sacrifice
    is directed to Vayu, including the part associated with Spenta Mainyu.
  language: English
  quote_policy: summarized
