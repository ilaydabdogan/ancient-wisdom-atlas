canonical_text:
  quote: ''
  summary: The passage lists ritual invocations at several gahs and at Dai pa Adar,
    naming Apam Napat, the water made by Mazda, Fravashis, female or flock-bringing
    powers, seasonal prosperity, Strength, Verethraghna, the Ascendant, Sraosha, Rashnu,
    Arsidit, Ahura Mazda, and the Amesha-Spentas. Notes explain Apam Napat as the
    Son or Navel of Waters, associated with lightning-fire born in clouds and with
    the source of the waters.
  language: English
