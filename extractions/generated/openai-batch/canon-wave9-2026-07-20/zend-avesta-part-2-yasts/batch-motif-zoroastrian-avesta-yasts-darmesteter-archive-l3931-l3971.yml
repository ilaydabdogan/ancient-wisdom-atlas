canonical_text:
  quote: ''
  summary: A command addresses Spitama Zarathmtra to offer sacrifice to the spring
    identified with Ardvi Sura Anahita. Mazda-worshippers stand before her with baresma.
    The Hvovas and Naotaras worship her and seek riches and swift horses; Hvova is
    blessed with prosperity, and Vii-taspa the Naotaride becomes lord of the swiftest
    horses. Anahita grants the requested boon in response to libations, gifts, sacrifices,
    and entreaties.
  language: English
  quote_policy: summarized
