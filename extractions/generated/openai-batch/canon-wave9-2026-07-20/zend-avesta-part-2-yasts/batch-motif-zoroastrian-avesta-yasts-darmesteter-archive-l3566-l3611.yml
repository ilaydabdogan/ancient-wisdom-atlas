canonical_text:
  quote: ''
  summary: A flying male figure, identified in the note as Thraetaona, cannot descend
    after three days and nights. At dawn he prays to Ardvi Sura Anahita, promising
    libations and offerings by the river Rangha if he reaches earth and home alive.
    Anahita appears in maiden form, seizes him by the arm, and he safely reaches earth
    and his house. A bracketed clause says she granted his boon, but the note marks
    that clause as probably spurious.
