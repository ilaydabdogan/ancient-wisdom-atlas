canonical_text:
  quote: ''
  summary: In repeated liturgical sections, Zarathushtra asks Ahura Mazda which heavenly
    god is best armed, and Ahura Mazda identifies Verethraghna, made by Ahura. Verethraghna
    appears successively as a wild ram, a fighting buck, and a bright man with a decorated
    golden-bladed sword, each time bearing the good Glory made by Mazda. Zarathushtra
    offers sacrifice to Verethraghna and asks for victorious capacities. Translator
    notes compare royal or kingly Glory with a raven form in another Yašt and with
    a wild ram in the Ardashir tradition.
  language: English
  quote_policy: summarized
