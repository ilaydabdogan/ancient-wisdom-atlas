canonical_text:
  quote: ''
  summary: The passage introduces and begins the Ardibehisht Yast. It explains Asha-Vahishta
    as connected with divine order, holiness, and fire, and Airyaman as associated
    with healing diseases made by Angra Mainyu. The liturgical text invokes Asha-Vahishta,
    Airyaman, and Saoka; Ahura Mazda instructs Zarathushtra to increase Asha-Vahishta
    through praise and ritual words. Proclaiming Asha-Vahishta is linked with an easy
    way to the abode of the Amesha-Spentas and to Garo-nmana, which is open to holy
    souls but not to the wicked. The Airyaman prayer is then praised as a powerful
    spell and healing remedy by the Holy Word, before which diseases, death, demonic
    beings, hostile broods, vices, and afflictions flee.
  language: English
  quote_policy: summarized
