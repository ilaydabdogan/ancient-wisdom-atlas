canonical_text:
  quote: When he began to find delight in words of falsehood and untruth, the Glory
    was seen to flee away from him in the shape of a bird.
  summary: The passage invokes sacrifice to the kingly Glory made by Mazda, describes
    that Glory clinging to Yima during an abundant deathless reign, then fleeing from
    him after falsehood. The departed Glory appears in bird form and is seized first
    by Mithra and then by Thraetaona, who is also described as the smiter of Az'i
    Dahaka, a many-headed demonic being made to destroy the good world.
  language: English
