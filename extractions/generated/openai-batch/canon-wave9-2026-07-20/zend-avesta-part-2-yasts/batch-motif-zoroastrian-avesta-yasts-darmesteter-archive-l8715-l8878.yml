canonical_text:
  quote: ''
  summary: The passage closes a Rashnu invocation, then introduces and begins the
    Farvardin Yasht. The introduction defines Fravashis as inner powers in beings
    and as originally resembling deified souls of the dead, then outlines the Yasht’s
    structure. The liturgical opening invokes the Fravashis of the faithful. Ahura
    Mazda instructs Zarathushtra to proclaim their strength and says that through
    their brightness and glory he maintains the sky and Ardvi Sura Anahita, who is
    described as life-, flock-, fold-, wealth-, and country-increasing, as ensuring
    fertility and birth, and as a great river flowing from Mount Hukairya to the sea
    Vouru-Kasha.
  language: English
  quote_policy: summarized
