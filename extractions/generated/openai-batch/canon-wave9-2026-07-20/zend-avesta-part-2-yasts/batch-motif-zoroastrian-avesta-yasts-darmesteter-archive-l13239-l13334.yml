canonical_text:
  quote: ''
  summary: An unnamed speaker says Zarathustra alone can daunt and strike him through
    sacred utterances. Ashi Vanguhi invites Zarathustra to her chariot, caresses him,
    and blesses his body and soul. The hymn then praises Ashi and recounts sacrifices
    made to her by Haoshyangha at Hara and by Yima at Hukairya. Haoshyangha receives
    a boon to overcome the Daevas of Mazana, while Yima receives a boon to bring abundance
    and immortality and remove hunger, thirst, old age, death, and harsh winds for
    a thousand years.
  language: English
  quote_policy: summarized
