canonical_text:
  quote: ''
  summary: The passage introduces the Haptan Yasht as a seven-day liturgical text
    connected with the Amesha-Spentas and the Sirozahs. It contains confessional formulas,
    invocations and sacrifices to Ahura Mazda, the Amesha-Spentas, named divine beings,
    sacred powers, waters, seasons, and abundance, followed by a brief anti-Yatu and
    anti-Druj section whose final sentence is textually uncertain.
  language: English
  quote_policy: summarized
literal_observations:
