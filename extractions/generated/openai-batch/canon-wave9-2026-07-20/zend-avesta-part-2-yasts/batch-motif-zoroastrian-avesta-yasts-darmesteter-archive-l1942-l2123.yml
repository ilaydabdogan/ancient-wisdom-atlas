comparison_claims:
- id: claim:1
  claim: The passage's own introduction identifies Haptan Yasht sections 1-10 as an
    extract from the Sirozahs, made from the first seven formulas in two forms, so
    the liturgical sequence is presented as parallel to Sirozah I, 1-7 and Sirozah
    II, 1-7.
  claim_level: same_function
  target: Sirozah I, 1-7 and Sirozah II, 1-7
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This comparison is based only on the supplied introductory note and
    the repeated formulas in the passage, not on an independent collation of the Sirozah
    text.
