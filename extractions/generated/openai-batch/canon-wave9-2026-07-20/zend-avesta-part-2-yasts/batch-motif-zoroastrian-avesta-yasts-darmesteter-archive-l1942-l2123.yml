  text: The introductory note says the Yasht of the seven Amshaspands is recited on
    the first seven days of the week, days consecrated to the Amesha-Spentas, and
    is mostly an extract from the Sirozahs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker confesses being a worshipper of Mazda, a follower of Zarathustra,
    one who hates the Daevas and obeys the laws of Ahura.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage repeatedly frames worship as sacrifice, prayer, propitiation,
