  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: The litany assigns divine recipients to named Gahs, including Mithra and Rama
    Hvastra, Asha-Vahishta and Atar, Apam Napat and waters, Fravashis and other powers,
    and Sraosha, Rashnu-Razista, and Arshtat.
  category: sequence
