canonical_text:
  quote: This part of the Avesta treats chiefly of the mythical and legendary lore
    of Zoroastrianism.
  summary: The introduction describes the Sirozahs, Yasts, and Nyayis, explaining
    the meaning and function of Yasts, the thirty-day Sirozah prayer, the arrangement
    of Yasts according to the Sirozah, recitation for the dead, and Darmesteter's
    use of Iranian comparative material such as the Shah Namah.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The volume is presented as containing translations of the Sirozahs, Yasts,
    and Nyayis, and the part of the Avesta is said to treat chiefly mythical and legendary
    Zoroastrian lore.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The word Yast is explained as meaning the act of worshipping or performance
    of the yasna, and also as a term for writings in which Izeds are praised and magnified.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Yasts are described as generally more poetical and epical than other parts
    of the Avesta and as records of old mythology and historical legends of Iran.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Parsi tradition is reported to hold that each Amshaspand and Ized formerly
    had a particular Yast, though only twenty Yasts and fragments of another are now
    possessed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sirozah is defined as meaning thirty days and as a prayer of thirty invocations
    to Izeds who preside over the thirty days of the month.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The two Sirozahs are distinguished by shorter or fuller formulas and epithets;
    in the greater Sirozah divine names are introduced with a formula translated as
    'we sacrifice to,' while the lesser Sirozah understands a word translated as 'propitiation.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In India the Sirozah is said to be recited in honour of the dead at calendrical
    intervals after death and yearly thereafter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The order of the Yasts is said to follow the order of the Sirozah, and a table
    aligns Sirozah day names and divine names with corresponding Yasts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The introduction identifies several lost Yasts and states that the second
    Yast, or Yast of the seven Amshaspands, was common to the seven Yasts and recited
    on the first seven days of the month.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some Yasts are described as not being devoted to the Ized whose name they
    bear; examples include Ardibehešt Yast being mostly devoted to Airyaman, Ram-Yast
    to Vayu, and Zemyad-Yast to the I/varenô.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The translator states that comparison with legends in Firdausi's Shah Namah
    can illuminate obscure Yast passages and help restore myths or form more correct
    ideas of them.
  category: other
  evidence_refs:
  - ev:11
