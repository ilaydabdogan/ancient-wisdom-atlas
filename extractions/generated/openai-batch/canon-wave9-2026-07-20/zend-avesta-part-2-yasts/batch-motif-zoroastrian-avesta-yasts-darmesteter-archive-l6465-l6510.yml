canonical_text:
  quote: ''
  summary: The passage describes Mithra, lord of wide pastures, angrily meeting a
    fleeing group. They cry to him that fiery horses are carrying them away and that
    their arms have been cut by the sword. Mithra throws them down and kills them
    in vast numbers. The hymn then offers sacrifice for Mithra’s brightness and glory,
    describes him as sleepless and ever awake with a bright dwelling extending over
    the material world, and says that his eight friends sit as spies on heights and
    watching-places to observe those who lie to Mithra.
