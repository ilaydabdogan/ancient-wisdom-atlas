canonical_text:
  quote: ''
  summary: A note summarizes the legend of Afrasyab of Turan, the Iran-Turan feud,
    the exile and murder of Syavakhsh, the role of Karsivaz's accusations, and the
    revenge by Kai Khosrav. A second note describes Afrasyab's defeated refuge in
    a mountain cave near Barda and an older variant in which the cave is an underground
    iron-walled palace.
