canonical_text:
  quote: ''
  summary: The passage introduces the Nyayis as prayers recited by lay worshippers
    and gives their occasions. It then presents the beginning of the Sun Nyayi, including
    hails to Ahura Mazda, the Amesha-Spentas, the Sun, Mithra, and other holy beings;
    confessions of good thought, word, and deed; rejection of evil; prayers for Angra
    Mainyu’s destruction; offerings and sacrifices to celestial and cosmic powers;
    an aspiration to reach a highest luminous space when the world ends; and a note
    describing Mount Saokanta as having a golden tube through which earthly water
    rises to the heavens and returns as dew.
  language: English
  quote_policy: summarized
