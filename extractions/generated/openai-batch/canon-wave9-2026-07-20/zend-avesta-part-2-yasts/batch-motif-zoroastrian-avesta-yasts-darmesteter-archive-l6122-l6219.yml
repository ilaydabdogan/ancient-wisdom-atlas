canonical_text:
  quote: ''
  summary: The passage depicts Mithra in a golden array taking hold of summits and
    looking over the Aryan abode and the Karshvares with beneficent or health-bringing
    eyes. It describes prosperous mountains, lakes, rivers, and named regions; says
    Mithra moves unseen through all Karshvares, bringing glory, sovereignty, and victory-strength
    to pious libation-givers; invokes him as sleepless and ever awake; and warns that
    those who lie to Mithra are punished, their communities are broken, and their
    hostile spear turns back.
  language: English
  quote_policy: summarized
