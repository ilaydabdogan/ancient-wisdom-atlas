canonical_text:
  quote: ''
  summary: Zarathustra instructs the young king Vistaspa to converse with divine beings
    and kingly Glory, to address heavenly Wisdom through the night, and to care for
    beneficent cattle. The passage describes the holy soul crossing the Chinvat bridge,
    the lawless being placed below to suffer, Angra Mainyu condemning unbelievers
    and offenders, and a blessing in which the king receives an undying house and
    divine boons.
  language: English
