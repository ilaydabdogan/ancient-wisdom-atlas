canonical_text:
  quote: ''
  summary: Ardvi Sura Anahita answers Spitama Zarathustra with instructions for sacrificing
    and offering libations to her from sunrise to sunset. She specifies who may drink
    her libation, rejects offerings from various disqualified persons, and explains
    that libations brought after sunset by wicked Daeva-worshippers are received by
    Daevas. The passage also mentions the Serpent's poisonous injury, waters sent
    upward toward the heavens in a translator note, and the golden height Hukairya
    from which Ardvi Sura Anahita leaps with the glory of all earthly waters.
  language: English
  quote_policy: summarized
