canonical_text:
  quote: ''
  summary: The passage introduces Rashnu Razista as the Genius of Truth and one of
    three judges of the departed, holding an impartial balance for weighing deeds
    after death. It describes the Rashn Yasht as an appeal for Rashnu to attend an
    ordeal as witness and arbiter, summoned from all cosmic regions. The liturgical
    opening confesses Mazda-worship and directs sacrifice, prayer, propitiation, and
    glorification to Havani, Rashnu, Arstat, and true-spoken speech.
  language: English
  quote_policy: summarized
