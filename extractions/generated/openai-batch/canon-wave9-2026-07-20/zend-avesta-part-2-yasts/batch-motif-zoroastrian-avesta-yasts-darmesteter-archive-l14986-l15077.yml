canonical_text:
  quote: ''
  summary: The passage first presents Ahura Mazda’s answers to Zarathustra about the
    value of a recital of the praise of Holiness when waking, at the end of life,
    and in renouncing evil thoughts, words, and deeds. It then introduces Yasht XXII
    as a description of the postmortem fates of righteous and wicked souls, including
    three nights after death, encounter with one’s conscience, staged movement toward
    heaven or hell, and reward or punishment. In the opening section, Zarathustra
    asks where the soul of a faithful person abides on the night after death, and
    Ahura Mazda answers that it sits near the head, sings the Ushtavaiti Gatha, proclaims
    happiness, and experiences great pleasure.
  language: English
  quote_policy: summarized
