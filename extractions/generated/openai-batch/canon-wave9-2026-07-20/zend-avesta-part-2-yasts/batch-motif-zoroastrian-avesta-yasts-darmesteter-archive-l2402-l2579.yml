canonical_text:
  quote: ''
  summary: The passage praises Asha-Vahishta as a divine figure who smites sickness,
    death, Daevas, hostile broods, falsehood, the Evil Eye, and the north wind. Angra
    Mainyu flees and laments that Asha-Vahishta will afflict these powers. The Druj
    is said to perish and vanish to the northern regions. The passage then prescribes
    sacrifice and prayer to Asha-Vahishta with libations, Haoma, meat, baresma, holy
    spells, speech, deeds, and rightly spoken words, and it asks for brightness, glory,
    health, and a blissful abode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine figure repeatedly smites sickness, death, Daevas, the Daeva's counter-work,
    the unholy Ashemaogha, and the oppressor of men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same smiting action is extended to the broods of the Snake, the Wolf,
    and the Two-legged, as well as Pride, Scorn, Hot Fever, Slander, Discord, the
    Evil Eye, falsehood, the Cahi, and the wind from the North.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Angra Mainyu rushes from before the smiting figure and speaks a lament identifying
    him as the god Asha-Vahishta.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Angra Mainyu says Asha-Vahishta will smite and afflict the worst forms of
    sickness, death, fiends, counter-works, oppressive beings, hostile broods, vices,
    and the North wind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Druj is said to perish, rush, vanish, and be driven to the regions of
    the North, so as no longer to give death to the living world of the holy spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sacrifice is offered to Asha-Vahishta, including libations, Haoma and meat,
    baresma, wisdom of the tongue, holy spells, speech, deeds, and rightly spoken
    words.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The closing prayer blesses the sacrifice, prayer, strength, and vigour of
    Asha-Vahishta, Airyaman, and Saoka, and asks that a man receive brightness, glory,
    bodily health, and a blissful abode of the holy Ones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A translator note glosses the North as connected with the country of hell
    and cites Vendidad parallels.
  category: setting
  evidence_refs:
  - ev:7
