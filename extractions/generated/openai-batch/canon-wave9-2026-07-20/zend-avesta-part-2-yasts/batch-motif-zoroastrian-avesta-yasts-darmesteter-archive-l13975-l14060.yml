canonical_text:
  quote: ''
  summary: The passage describes blessed or holy beings associated with good thoughts,
    words, and deeds, who preserve Ahura Mazda's creations and will restore the world.
    In that restoration the dead will rise, creation will become deathless, and the
    Druj with her brood will perish. The hymn repeatedly sacrifices to the awful kingly
    Glory made by Mazda, which belongs to gods, the material world, and restorers
    of the world, and which cleaves to royal figures such as Haoshyangha and Takhma
    Urupa during their rule and victories over hostile beings.
  language: English
  quote_policy: summarized
