canonical_text:
  quote: ''
  summary: 'English translation and notes from the Vistasp Yast: Zarathustra blesses
    the young king Vistaspa with sons, health, long life, radiance, victory, cattle,
    bread, divine glory, and a blissful abode after a thousand years. The passage
    invokes Waters, Ashi, Rata, Sraosha, Ahura Mazda, and the Law of the worshippers
    of Mazda; it instructs Vistaspa to support priests and the Law, warns against
    bad or unfriendly priests, and lists ritual and social groups who come to the
    Law.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A blessing asks that ten sons be born from the recipient''s body: three Athravans,
    three warriors, three tillers of the ground, and one like Gamaspa.'
