  evidence_refs:
  - ev:1
- id: obs:2
  text: The recipient is wished freedom from sickness and death like Peshotanu; a
    note says Peshotanu drank a kind of milk given by Zarathushtra and forgot death.
  category: speech
  evidence_refs:
