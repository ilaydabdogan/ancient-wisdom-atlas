  - ev:2
- id: obs:3
  text: The blessing compares the recipient's rays to Mithra, warmth to the moon,
    resplendence to fire, and life-span to that of an old man; after a thousand years
    he is wished the bright, blissful abode of the holy ones.
  category: speech
  evidence_refs:
  - ev:1
