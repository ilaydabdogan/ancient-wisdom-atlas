canonical_text:
  quote: ''
  summary: 'The passage describes Mithra''s chariot and retinue: A''ista with libations,
    a boar-shaped cursing thought, Atar in flames, and kingly Glory. The chariot bears
    many weapons that pass through heavenly space and strike the Daevas. After Mithra
    smites Daevas and men who lied to him, he drives through named regions, while
    Angra Mainyu and Aeshma flee.'
  language: English
  quote_policy: summarized
