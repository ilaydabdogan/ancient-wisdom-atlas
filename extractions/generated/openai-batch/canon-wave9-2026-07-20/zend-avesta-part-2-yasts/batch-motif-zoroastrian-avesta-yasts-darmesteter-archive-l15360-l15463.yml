canonical_text:
  quote: the dreary way, full of fear and distress, where the body and the soul part
  summary: A fragment describes Angra Mainyu warning not to question one who has just
    passed the fearful way where body and soul separate. It assigns poison and stench
    as postmortem food for wicked persons. Separate fragments worship Fravashis, the
    faculties of Ahura Mazda connected with the Holy Word, and a mountain that gives
    understanding. Ahura Mazda answers a question about how the souls or Fravashis
    of the holy dead manifest. A dawn fragment says a named bird hears the voice of
    Fire, with notes restoring a related fire-ritual context.
  language: English
  quote_policy: quoted
