  summary: The passage praises and invokes Sraosha as a holy, wakeful guardian of
    Mazda’s creation, a fiend-smiting warrior against Daevas and Aeshma, a teacher
    of the Law taught by Ahura Mazda, and an incarnate Word associated with ordered
    sacrifices, protected houses, and allied divine powers.
  language: English
  quote_policy: summarized
