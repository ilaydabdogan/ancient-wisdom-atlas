canonical_text:
  quote: "“I made the Aryan Glory, rich in food, rich in flocks, rich in wealth, rich
    in Glory”"
  summary: The passage introduces the Aštād Yašt with notes on Truthfulness, Rashnu,
    Mount Ushi-darena, and the Hvarenah/Glory. In the liturgical text, Ahura Mazda
    tells Zarathustra that he made the Aryan Glory to provide abundance and withstand
    need and enemies. The Glory destroys hostile demonic powers. Ashi Vanguhi enters
    the household and royal palace of a generous man, bringing flocks, victory, intelligence,
    glory, and multiplying horses, flocks, offspring, mountains, vales, and plants.
    The passage then introduces the Zamyad Yašt as centered on mountains and kingly
    Glory.
  language: English
  quote_policy: quoted
