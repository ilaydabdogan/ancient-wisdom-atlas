canonical_text:
  quote: ''
  summary: The passage describes the third departure of the Glory from Yima in the
    shape of a Varaghna bird, Keresaspa’s seizure of that Glory, the cleaving of Manly
    Courage to Keresaspa, and a catalogue of Keresaspa’s slayings. These include the
    poisonous snake Srvara, Ga;^darewa, several broods and named adversaries, and
    Snavidhaka, whose speech threatens cosmic reversals involving the earth, heavens,
    Good Spirit, and Evil Spirit. A translator’s note compares the cooking-on-the-monster
    episode with the island-whale story cycle.
  language: English
  quote_policy: summarized
