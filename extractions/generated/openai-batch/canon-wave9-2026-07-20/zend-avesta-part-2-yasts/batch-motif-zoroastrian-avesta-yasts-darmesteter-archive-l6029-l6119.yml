canonical_text:
  quote: ''
  summary: A section of the Mihir Vast/Yast invokes Mithra, promises ritual offerings
    to him, describes him as vigilant and truth-speaking, presents chiefs and horsemen
    worshipping him for martial success, and says he reaches over Hara before the
    swift-horsed sun. Translator notes connect good conscience and bliss with afterlife
    blessedness, identify Hara with Mount Alborz, and distinguish this passage's Mithra
    from later solar identification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mithra is invoked to come for good conscience and bliss, and is described
    as awful, overpowering, worthy of sacrifice and prayer, not to be deceived anywhere
    in the material world, and lord of wide pastures.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he will offer libations and a sacrifice to Mithra with Haoma,
    meat, baresma, wisdom of the tongue, holy spells, speech, deeds, libations, and
    rightly spoken words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mithra is described as truth-speaking, a chief in assemblies, with a thousand
    ears and ten thousand eyes, high, full of knowledge, strong, sleepless, and ever
    awake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chiefs of nations offer sacrifices to Mithra when they go to the field against
    ravaging hosts, enemies in battle array, and conflict between nations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mithra turns toward the side that has worshipped him first with devoted faith,
    accompanied by a fiend-smiting wind and the cursing thought of the wise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Horsemen worship Mithra on horseback, asking for team swiftness, bodily health,
    successful watchfulness against haters, and the power to smite or destroy foes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mithra is said to be the first of the heavenly gods to reach over Hara before
    the undying, swift-horsed sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A translator note identifies Hara with Mount Alborz, from which the sun rises,
    and says Mithra is closely connected with the sun but not yet identical with it
    in this passage.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Translator notes gloss good conscience as cheerfulness at the head of a bridge
    and bliss as the condition of the blessed in the next world.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: An abbreviated liturgical formula in the passage names Ahura Mazda.
  category: speech
  evidence_refs:
  - ev:8
