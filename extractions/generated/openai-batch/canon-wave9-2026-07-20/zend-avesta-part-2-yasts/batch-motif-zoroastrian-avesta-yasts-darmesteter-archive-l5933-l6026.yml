canonical_text:
  quote: ''
  summary: The passage introduces the Mihir Yast as a hymn to Mithra and summarizes
    Mithra as a heavenly-light deity who sees everything, witnesses truth, preserves
    oaths, and punishes promise-breakers. It then gives liturgical invocations and
    the opening section in which Ahura Mazda tells Zarathushtra that he created Mithra
    worthy of sacrifice and prayer like himself. The passage warns against lying to
    Mithra or breaking contracts, says Mithra benefits honest persons, and invokes
    Mithra through sacrifice, libations, and requests for aid, joy, mercy, health,
    and victory.
