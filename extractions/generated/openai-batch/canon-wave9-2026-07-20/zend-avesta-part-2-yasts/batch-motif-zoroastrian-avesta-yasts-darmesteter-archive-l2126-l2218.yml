canonical_text:
  quote: We worship the Law of the worshippers of Mazda; we worship the waters coming
    in the shape of a horse made by Mazda.
  summary: The passage worships the Mazdaean Law and Mazda-made waters, describes
    renunciation of trespasses through overthrowing an opponent of Vohu-Mano and recovering
    the Law of Mazda from ungodly hands, recites short prayer formulae, blesses sacrifice
    and prayer addressed to Ahura Mazda, the Amesha-Spentas, and other named divine
    powers, assigns some divine powers to ritual times, and petitions for blessings
    for a man who offers sacrifice.
  language: English
  quote_policy: quoted
