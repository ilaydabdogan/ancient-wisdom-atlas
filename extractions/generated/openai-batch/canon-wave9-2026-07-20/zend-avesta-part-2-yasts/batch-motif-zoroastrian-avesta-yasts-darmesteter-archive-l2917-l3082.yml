canonical_text:
  quote: ''
  summary: The passage praises Ardvi Sura Anahita as a vast descending river or spring
    whose waters spread through the seven Karshvares, purify reproduction and milk,
    and increase settlements, herds, wealth, and country. She is described as a strong
    female figure from Maker Mazda, desiring worship and sacrifice. She drives a chariot
    drawn by four white horses. Ahura Mazda sacrifices to her by the Daitya river
    and receives a boon concerning Zarathustra’s obedience to his law. Haoshyangha
    also offers a large sacrifice and begins a sovereignty request.
  language: English
  quote_policy: summarized
