canonical_text:
  quote: ''
  summary: The passage reports a prior boon granted by Ardvi Sura Anahita to an unnamed
    supplicant after offerings. It then commands Spitama Zarathushtra to sacrifice
    to Anahita’s spring. Yima Khshaeta, called the good shepherd, sacrifices from
    the height Hukairya with large numbers of animals and asks Anahita for sovereignty
    over all countries and over several classes of beings, including Daevas, men,
    Yatus, and Pairikas, and for power to take wealth and Glory from the Daevas. Ardvi
    Sura Anahita grants Yima’s boon.
  language: English
  quote_policy: summarized
