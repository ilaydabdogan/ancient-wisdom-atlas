  quote: ''
  summary: The passage lists many named mountains and states a total of 2,244 mountains.
    It then offers sacrifice to the awful kingly Glory made by Mazda, describes that
    Glory as belonging to Ahura Mazda and connected with creation, and foretells a
    restored, deathless world in which the dead rise and the Druj perishes. It closes
    by describing the seven Amesha-Spentas as unified in thought, speech, and deed
    under Ahura Mazda.
