canonical_text:
  quote: ''
  summary: A ritual sequence blesses sacrifice and prayer to Ahura Mazda, asks Zarathustra
    to protect a friendly sacrificer from foes, names the Amesha-Spentas as Ahura
    Mazda's creatures and rewards for holy ones after bodily death, invokes knowledge
    of the world's beginning and end, worships Strength, Verethraghna, Spenta-Armaiti,
    Gaokerena, the Holy Word, and a wisdom-giving mountain, prays for enemies to be
    bound and smitten, takes Ahura Mazda as lord and master against Angra Mainyu and
    other fiends, and asks blessings for a man.
  language: English translation
  quote_policy: summarized
