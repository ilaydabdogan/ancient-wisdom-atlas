canonical_text:
  quote: ''
  summary: Ahura Mazda speaks to Spitama Zarathushtra about worship and sacrifice
    to Tishtrya, the bright and glorious star. Tishtrya protects the Moon, dwelling,
    and food; gives the fields their share of waters; is offered libations, Haoma,
    meat, baresma, holy spells, speech, deeds, and rightly spoken words; is called
    the seed of the waters; is awaited by flocks, herds, and men for the coming of
    springs; and flies swiftly toward the sea Vouru-Kasha.
