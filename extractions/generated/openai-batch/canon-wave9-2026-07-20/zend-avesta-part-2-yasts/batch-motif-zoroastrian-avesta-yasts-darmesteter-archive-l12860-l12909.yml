  quote: '"We sacrifice to the most right Arista, made by Mazda and holy"'
  summary: The passage presents repeated sacrificial formulas to Arista and the good
    Law of Mazda-worshippers. Zarathustra sacrifices for righteousness of thought,
    speech, and deed, and asks Arista for bodily strength, health, speed, hearing,
    and extraordinary eyesight likened first to the Kara fish beneath the waters of
    the Rangha and then to a male horse able to perceive a hair in darkness and severe
    weather.
