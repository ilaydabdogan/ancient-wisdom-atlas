canonical_text:
  quote: ''
  summary: The passage presents a sequence of sacrifices to Ardvi Sura Anahita. An
    unnamed petitioner asks for the power to depopulate all seven Karshvares and is
    refused. Thraetaona sacrifices and asks to overcome Asi Dahaka and deliver two
    women; Anahita grants the boon. Keresaspa sacrifices and asks to overcome golden-heeled
    Gandarewa amid the sea Vouru-Kasha and reach the fiend's stronghold; Anahita grants
    the boon. Frangrasyan sacrifices in an underground cave and asks to seize Glory
    in the middle of Vouru-Kasha.
  language: English
  quote_policy: summarized
