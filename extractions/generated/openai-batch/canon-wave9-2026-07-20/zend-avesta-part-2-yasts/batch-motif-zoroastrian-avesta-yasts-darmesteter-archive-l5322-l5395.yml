canonical_text:
  quote: ''
  summary: The passage praises and offers sacrifice to Tii^trya/Tutrya, the bright
    and glorious star. Ahura Mazda has established him above the stars and given him
    a thousand senses. Hostile beings cannot bring about his death. Tii^trya is associated
    with stars that contain the seed of waters, travels from the sea Vouru-Kasha to
    lakes, caves, and channels in the shape of a white horse with golden ornaments,
    and causes waters to flow and be distributed among countries when properly worshipped
    and propitiated. The following section begins by saying that all creatures of
    Spenta-Mainyu long for him.
  language: English
