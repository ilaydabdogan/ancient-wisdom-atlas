canonical_text:
  quote: ''
  summary: A Sirozah litany invokes Khshathra-vairya with metals, Mercy, and Charity;
    Spenta-Armaiti and Rata with loving eyes; Haurvatat with seasonal and yearly prosperity;
    Ameretat with abundance, flocks, corn, and Gaokerena. It also assigns invocations
    at the Havan and Rapithwin periods to Mithra with Rama, and to Asha-Vahishta with
    Atar. Notes gloss Gaokerena as the white Hom or plant of immortality, Atar as
    the Genius of Fire, and the loving eye as the reverse of the evil eye.
  language: English
  quote_policy: summarized
