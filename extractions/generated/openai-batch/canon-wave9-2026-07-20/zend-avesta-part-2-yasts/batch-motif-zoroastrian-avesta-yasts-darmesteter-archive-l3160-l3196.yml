  quote: "“Offer up a sacrifice, O Spitama Zarathujtra ! unto this spring of mine,
    Ardvi Sura Anahita”"
  summary: The passage commands Spitama Zarathushtra to offer sacrifice to the spring
    Ardvi Sura Anahita. It then says that Azi Dahaka, described as three-mouthed,
    offered sacrifice to her in Bawri. The accompanying notes describe Azi Dahaka
    as a fiendish snake, a storm-cloud snake, a usurper of Yima after Yima lost Glory,
    an opponent of Atar in the sea Vourukasha, and a later Shah Namah figure with
    two snakes growing from his shoulders.
