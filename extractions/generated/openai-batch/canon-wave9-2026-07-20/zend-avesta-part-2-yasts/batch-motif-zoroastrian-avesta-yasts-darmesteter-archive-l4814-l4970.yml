canonical_text:
  quote: ''
  summary: The passage alludes to Erekhsha, the swift Aryan archer, whose shot from
    one mountain to another is assisted by Ahura Mazda, the waters, the plants, and
    Mithra. It then praises Tishtrya, the bright and glorious star, as an afflicter
    of Pairikas, a horse-shaped mover of waters and winds in the sea Vouru-Kasha,
    a bringer of rains and fertility through Satavaesa, and a deity who asks Ahura
    Mazda for named worship so he may come at the appointed time. The passage also
    lists sacrifices to Tishtrya and other stars against hostile beings and describes
    Tishtrya taking the luminous form of a strong fifteen-year-old man like the first
    man.
  language: English
  quote_policy: summarized
