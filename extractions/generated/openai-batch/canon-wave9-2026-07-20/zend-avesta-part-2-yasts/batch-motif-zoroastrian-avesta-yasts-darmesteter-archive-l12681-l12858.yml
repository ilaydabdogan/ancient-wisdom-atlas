canonical_text:
  quote: ''
  summary: The passage closes a section of the Ram Yast in which Vayu tells Zarathustra
    to invoke his names during attack, robbery, captivity, and imprisonment. Vayu
    is described as fear-striking, anti-Daeva, powerful in deep places, richly adorned
    with golden equipment, and responsive to sacrifice performed with a baresma oriented
    according to time of day. The passage then introduces the Din Yast, explaining
    Daena as the Zoroastrian Law or Religion and Chista as religious knowledge, and
    gives an opening prayer and sacrifice to Chista and the good Law, including a
    request for safe passage along roads, mountains, forests, and rivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zarathustra is told to invoke Vayu's names when a tyrant or an unholy Ashemaogha
    attacks, wounds, uses a chariot, or tries to rob wealth, strength, or health.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same invocation is prescribed for a man in bonds, being put in bonds,
    or being dragged in bonds; the passage says prisoners flee from their captors
    and from prison.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vayu is addressed as one who strikes fear on men and horses, works against
    the Daevas in all creatures, and enters the lowest and very deep places with equal
    power.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vayu is described with bodily and royal attributes including high-up girding,
    firmness, swiftness, high feet, wide breast, wide thighs, untrembling eyes, and
    sovereignty-like power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vayu instructs Zarathustra to take a baresma and turn it upward during full
    day and downward at dawn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vayu says that if he is worshipped with a sacrifice, he will speak health,
    Mazda-made and glorious, so that Angra Mainyu, Yatus, Yatu-workers, Daevas, or
    men may not harm Zarathustra.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A litany sacrifices to Vayu as great, strong, holy, associated with the Good
    Spirit, and bearing golden helm, crown, necklace, chariot, wheel, weapons, garment,
    shoe, and girdle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Din Yast introduction says Daena presides over the twenty-fourth day,
    is invoked with Chista, and is the impersonation of the Zoroastrian Law or Religion;
    Chista is religious knowledge, the knowledge of what leads to bliss.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The opening prayer offers sacrifice, prayer, propitiation, and glorification
    to Chista and to the good Law of the worshippers of Mazda.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chista and the good Law are described as supplying good stores, running quickly
    to the goal, freeing from dangers, bringing libations, cleansing well, and being
    holy, clever, renowned, speedy, and quick of work.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Zarathustra sacrifices to Chista and calls her to rise from her seat and come
    from the Abode, asking her to stay if ahead and overtake him if behind.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The prayer asks that roads be smooth, mountain paths good, forests easy to
    run through, and rivers happily crossed.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sacrifice to Chista includes libations, Haoma and meat, baresma, wisdom
    of the tongue, holy spells, words, and deeds.
  category: object
  evidence_refs:
  - ev:11
