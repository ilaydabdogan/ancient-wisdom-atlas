canonical_text:
  quote: ''
  summary: The passage opens with liturgical offerings to Havani, Savanghi and Visya,
    time-period masters, and Ahura Mazda. It recites a formula about the law of holiness
    and Vohu-Mano's riches. Zarathustra asks Ahura Mazda which Holy Word is strongest,
    most victorious, healing, fiend-smiting, and able to relieve worldly anxiety.
    Ahura Mazda answers that his Name, associated with the Amesha-Spentas, has these
    powers. Zarathustra then asks for the name so that hostile beings cannot afflict
    him, and Ahura Mazda begins listing his names.
  language: English
