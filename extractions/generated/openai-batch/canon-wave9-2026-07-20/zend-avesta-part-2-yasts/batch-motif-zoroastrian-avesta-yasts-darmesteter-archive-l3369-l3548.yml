canonical_text:
  quote: ''
  summary: A sequence of Aban Yast stanzas instructs Zarathushtra to offer sacrifice
    to Ardvi Sura Anahita, then recounts several petitions made to her. Kavi Usa and
    Husravah offer large animal sacrifices and receive boons of sovereignty. Tusa
    worships while on horseback and receives a martial boon against the sons of Vaesaka
    and Turanians. The sons of Vaesaka make a rival sacrifice and ask for victory
    over Tusa and the Aryans, but their boon is denied.
  language: English
  quote_policy: summarized
