canonical_text:
  quote: ''
  summary: The passage describes the Fravashis of the faithful as a powerful, healing,
    victorious host that comes with waters from Vouru-Kasha, seeks and brings water
    for kin and country, fights for its own land, and aids an attacked sovereign who
    invokes them if he has not offended them. Notes in the same line range mention
    Keresaspa sleeping under heavenly glory until he rises to slay Az-i-Dahak, and
    the preservation of Zarathushtra's seed for the future birth of the Saviour and
    his forerunners.
  language: English
  quote_policy: summarized
