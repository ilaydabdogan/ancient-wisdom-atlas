canonical_text:
  quote: ''
  summary: A Farvardin Yast passage repeatedly worships the Fravashis of named holy
    persons, gives several genealogical identifications, adds editorial notes connecting
    some names with later Iranian tradition, and invokes resistance against evil dreams,
    visions, Pairikas, and evil unfaithful Ashemaoghas. Mathravaka, son of Simaeshi,
    is described as a priestly figure able to smite down many Ashemaoghas.
  language: English
  quote_policy: summarized
