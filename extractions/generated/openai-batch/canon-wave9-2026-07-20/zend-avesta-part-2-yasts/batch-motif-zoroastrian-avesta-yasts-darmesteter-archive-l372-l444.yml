  quote: ''
  summary: The passage describes the systematic order of the Sirozah and its relation
    to an enumeration of Izeds in the Yasna. It states that the Sirozah assigns each
    of the thirty days of the month to gods and suggests a Semitic/Assyrian parallel.
    It then begins Sirozah I with dedications to Ahura Mazda and the Amesha-Spentas,
    to Vohu-Mano with Peace and two forms of Wisdom, and to Asha-Vahishta with Airyaman,
    a Mazda-made instrument, and Saoka.
  language: English
  quote_policy: summarized
