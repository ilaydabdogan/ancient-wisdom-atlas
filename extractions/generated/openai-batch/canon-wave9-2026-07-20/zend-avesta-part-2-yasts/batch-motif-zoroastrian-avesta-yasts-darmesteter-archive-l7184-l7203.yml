canonical_text:
  quote: ''
  summary: Mithra, called lord of nations and wide pastures, drives along the right-hand
    side of the wide round earth. Sraosha drives at his right hand, Rashnu at his
    left, and waters, plants, and the Fravashis of the faithful drive around him.
    In might he brings falcon-feathered arrows; when he reaches nations hostile to
    him, he strikes the horse and rider with his club and casts fear upon them. The
    passage closes with a pledge to offer sacrifice to him for his brightness and
    glory.
  language: English
  quote_policy: summarized
