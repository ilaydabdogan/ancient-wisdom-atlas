canonical_text:
  quote: ''
  summary: Mithra is invoked as a powerful, glorious lord who protects nations giving
    good worship and shatters those devoted to havoc. The speaker prays for Mithra’s
    help and repeats a sacrificial formula for his brightness and glory. Mithra is
    described as sleepless and ever awake, as giving Rashnu a dwelling, as protecting
    those who do not lie, and as allied in friendship with Rashnu and Verethraghna.
    Those who lie to Mithra are said to be struck down. Ahura Mazda gives Mithra a
    thousand senses and ten thousand eyes, through which he watches those who injure
    or lie to him and remains undeceivable and all-knowing.
  language: English
  quote_policy: summarized
