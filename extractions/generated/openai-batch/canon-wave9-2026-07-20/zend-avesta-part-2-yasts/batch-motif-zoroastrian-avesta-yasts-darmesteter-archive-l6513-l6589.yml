canonical_text:
  quote: ''
  summary: The passage praises Mithra as a sleepless, all-knowing watcher and protector.
    It describes him disabling those who lie to him, occupying a divine dwelling on
    the bright mountain Hara Berezaiti made by Ahura Mazda and the Amesha-Spentas,
    surveying the material world from there, and yoking his horses and chariot with
    Sraosha and Nairyo-sangha against a wicked worker of evil.
  language: English
  quote_policy: summarized
