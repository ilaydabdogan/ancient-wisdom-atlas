canonical_text:
  quote: ''
  summary: Ahura Mazda answers Zarathustra about what to do when armies meet. He instructs
    him to throw four feathers in the way; whichever side first worships Strength
    and Verethraghna will have victory. He blesses Strength and Victory as two keepers.
    He then warns that the spell should be transmitted only within specified kinship
    or priestly teacher-pupil relations and describes the words as powerful, victorious,
    healing, and protective against a weapon.
