canonical_text:
  quote: ''
  summary: Ahura Mazda lists a sequence of his names and attributes, including holiness,
    understanding, knowledge, welfare, lordship, harmlessness, unconquerability, true
    accounting, all-seeing, healing, creatorship, and Mazda. He tells Zarathustra
    to worship him by day and night with libations, promising help and joy from himself,
    Sraosha, waters, plants, and the Fravashis. He further instructs Zarathustra to
    recite these names daily and nightly to destroy the malice of hostile beings and
    armed hordes.
  language: English
  quote_policy: summarized
