  summary: The passage praises and sacrifices to Tistrya, the bright and glorious
    star. Humans, chiefs, wild beasts, and tame beasts watch his rising in relation
    to a good or bad year and the fertility of the Aryan countries. Tistrya is then
    described as flying swiftly toward the sea Vouru-Kasha, with his motion compared
    to an arrow shot through heavenly space by the swift archer Erekhsha from one
    mountain to another. The excerpt ends by saying that Ahura Mazda assisted him
    and that the Amesha-Spentas and Mithra pointed the way.
