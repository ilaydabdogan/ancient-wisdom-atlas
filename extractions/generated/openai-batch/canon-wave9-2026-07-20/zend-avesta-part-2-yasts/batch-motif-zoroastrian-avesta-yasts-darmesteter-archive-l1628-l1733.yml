canonical_text:
  quote: ''
  summary: The passage says that pronouncing sacred names at rising, lying down, girdling,
    and travel protects a man from weapons and hostile fiends. It describes the names
    as guarding him like many watchers, asks for instruction in ordinances for this
    world and the next with aid from Sraosha and Vohu-Mano, and then gives hails and
    worship to sacred places, waters, prayers, powers, and Ahura Mazda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Pronouncing the names is prescribed for repeated daily and transitional moments:
    rising, lying down, binding or unbinding the sacred girdle, and leaving dwelling,
    town, or country.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man who pronounces the names is promised protection by day and night from
    being wounded by the weapons of a hostile foe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The weapons named are knife, cross-bow, arrow, sword, club, and sling-stone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The names are said to guard the man from behind and in front against unseen
    Druj, a female Varenya fiend, an evil-doer bent on mischiefs, and Angra Mainyu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The protection is compared to a thousand men watching over one man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A speaker asks who will smite the fiend to maintain ordinances and asks to
    be taught rules for this world and the next.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same request links Sraosha and Vohu-Mano with coming to help whomever
    the addressee pleases.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage gives hails to the Glory of the Kavis, Airyanem Vaejah, Saoka
    made by Mazda, the waters of the Daitya, Ardvi the undefiled well, and the whole
    world of the holy Spirit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage worships Ahuna Vairya, Asha-Vahishta, Strength, Prosperity, Might,
    Victory, Glory, Vigour, Ahura Mazda, and beings whose goodness Ahura Mazda knows
    for sacrifice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Translator notes within the passage identify Ardvi as Ardvi Sura Anahita,
    goddess of the waters, and explain the named benefits as impersonated gods.
  category: other
  evidence_refs:
  - ev:7
