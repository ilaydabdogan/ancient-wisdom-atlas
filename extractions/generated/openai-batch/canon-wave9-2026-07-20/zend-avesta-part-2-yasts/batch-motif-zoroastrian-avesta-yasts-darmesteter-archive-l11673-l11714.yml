canonical_text:
  quote: ''
  summary: In Bahrām Yašt XIII.32-33 and the opening of XIV.34, a ritual voice sacrifices
    to Verethraghna, made by Ahura, and attributes to him virility, death, resurrection,
    peace, and free passage. Zarathustra sacrifices to Verethraghna asking for victory
    in thinking, speaking, doing, addressing, and answering. Verethraghna grants him
    virility, bodily strength, health, sturdiness, and the eyesight of a golden-collared
    vulture able to perceive very small flesh from far away. The next section begins
    another sacrifice to Verethraghna and Zarathustra's address to Ahura Mazda. Editorial
    notes comment on the vulture image.
  language: English
  quote_policy: summarized
