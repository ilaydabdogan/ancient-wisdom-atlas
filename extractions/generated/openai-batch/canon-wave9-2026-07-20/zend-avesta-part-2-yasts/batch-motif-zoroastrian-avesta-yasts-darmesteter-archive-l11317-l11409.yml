canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda which heavenly god is best armed, and Ahura
    Mazda identifies Verethraghna. Verethraghna appears successively in the forms
    of a bull, a horse, and a camel. The bull and horse manifestations are accompanied
    by Strength, Victory, and Glory; the text also includes declarations of strength,
    destruction of malice, and sacrificial praise to Verethraghna.
  language: English
  quote_policy: summarized
