canonical_text:
  quote: ''
  summary: The passage is a litany worshipping the Fravashis of named holy women,
    wives, maids, and groups of holy men and women in several countries. It singles
    out Ereda-fedhri, called Vispa-taurvairi, because she will bring forth one who
    destroys the malice of Daevas and men and withstands evil done by the Gahi. Notes
    identify Srutat-fedhri and Vanghu-fedhri with future conceptions involving Lake
    Kasava and the preserved seed of Zarathushtra, and identify Ereda-fedhri as Saoshyant's
    mother.
  language: English
  quote_policy: summarized
