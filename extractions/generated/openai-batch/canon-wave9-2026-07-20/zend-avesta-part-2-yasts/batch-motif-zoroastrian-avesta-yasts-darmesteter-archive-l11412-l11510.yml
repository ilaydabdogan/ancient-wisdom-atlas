canonical_text:
  quote: ''
  summary: 'In repeated hymn sections, Zarathustra asks Ahura Mazda which heavenly
    god is best armed, and Ahura Mazda names Verethraghna, made by Ahura. Verethraghna
    comes in successive forms: a fierce boar, a shining youth of fifteen, and a swift
    raven. Each manifestation is associated with the good Glory made by Mazda. The
    raven form is described as faster than an arrow, rising at dawn, crossing mountain
    and tree heights, and listening to birds.'
  language: English
