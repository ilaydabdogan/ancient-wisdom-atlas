  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker calls himself “All-smiting” because he can smite creatures of
    both worlds, and “Worker of Good” because he works the good of Ahura Mazda and
    the Amesha-Spentas.
  category: attribute
  evidence_refs:
