  summary: A first-person divine speaker addresses holy Zarathustra and lists many
    of his names. The names emphasize power over the creatures of both worlds, service
    to Ahura Mazda and the Amesha-Spentas, movement, violence against hostile beings,
    malice-destruction, uniting and separating, burrows, spears, glory, and battlefield
    invocation.
  language: English
  quote_policy: summarized
