  quote: ''
  summary: The passage offers sacrifice to Mithra, describes him as sleepless, ever
    awake, lord of wide pastures, and an armed warrior. It says his bright ways bring
    benefit to the country by turning plains and vales into pasture where cattle and
    males graze. It closes with a petition that Mithra and Ahura, called high gods,
    come to help when the poniard lifts up its voice.
