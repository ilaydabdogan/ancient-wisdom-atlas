canonical_text:
  quote: ''
  summary: The passage contains liturgical invocations and petitions to Mithra, the
    Moon, the Waters, and Ardvi Sura Anahita. It asks for help, ease, brightness,
    glory, strength, victory, cattle, bread, children, healing, and a blessed abode.
    The Moon is praised as keeping the seed of the Bull and is associated with waxing
    and waning. The Waters and Ardvi Anahita are addressed as Mazda-made, purifying,
    life-giving, and cosmically extensive; Ahura Mazda tells Zarathushtra to sacrifice
    to Ardvi Sura Anahita, who is described as a vast river from which waters flow
    across the seven Karshvares.
  language: English
  quote_policy: summarized
