canonical_text:
  quote: "“For fifteen days does the moon wax; for fifteen days does the moon wane.”"
  summary: The passage invokes Ahura Mazda, the Amesha-Spentas, the Bull, and the
    Moon. It describes the Moon as keeping the seed of the Bull, explains the Moon’s
    waxing and waning in fifteen-day periods, says Ahura makes the Moon wax and wane,
    depicts the Amesha-Spentas holding and pouring lunar glory upon the earth, and
    links warming moonlight with spring plant growth and ritual offerings to lunar
    phases.
