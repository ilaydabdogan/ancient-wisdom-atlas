canonical_text:
  quote: ''
  summary: 'The passage recounts many doings and transformations of Ixue: he changes
    form under sun-marked sequences, becomes a Wgui tree and then a fly while his
    wife mourns and dies, becomes water, lizard, grass, and bird-like forms to catch
    a wood pigeon and evade Ovaherero, and returns to his mother''s country where
    he dies, rises, and later dies again when seen by his father while associated
    with rubbing sticks to make fire.'
  language: English
  quote_policy: summarized
