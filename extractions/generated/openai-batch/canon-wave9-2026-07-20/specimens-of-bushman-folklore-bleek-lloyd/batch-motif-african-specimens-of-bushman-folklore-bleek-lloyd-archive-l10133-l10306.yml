- id: obs:1
  text: The narrator says that Ixue's works or doings are many and attributes knowledge
    of them to his father's father, Kdru.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an early sequence, the rising and setting of the sun accompany Ixue being
    a dui, an Omuherero, himself again, and a shab in another country.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ixue lies alone on the ground, sleeps, wakes at sunrise, sees a little sun,
    and is a Wgui tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ixue's wife sees the Wgui, goes to take hold of its fruit, and the Wgui vanishes
    as Ixue becomes a fly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ixue's wife lies on the earth, cries about the Wgui, and dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ixue is water in the shadow of a tree, is also described as a lizard in dead
    leaves of the kui, sees wood pigeons, and becomes water as the wood pigeons approach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Grass or reeds associated with Ixue seize a wood pigeon, and small grass bites
    the wood pigeon's bill while the other wood pigeons fly away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ixue becomes himself, takes the wood pigeon, plucks its feathers, puts the
    feathers in his head, cooks the body in hot embers, and eats it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When Ovaherero appear, Ixue hides; he is seen as a small nu-erre bird, cries
    out, is described as Bushman's eye water, is not found by searchers, and flies
    away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ixue flies to his mother's country, sees his father, is no longer a nu-erre
    but Ixue, dies, is seen dead by his father, and after his father leaves is not
    dead and rises up.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When his father stealthily approaches, Ixue hears and sees him, dies, becomes
    a lizard, and lies on the ground.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Ixue's father identifies the figure as his child Ixue and says that Ixue had
