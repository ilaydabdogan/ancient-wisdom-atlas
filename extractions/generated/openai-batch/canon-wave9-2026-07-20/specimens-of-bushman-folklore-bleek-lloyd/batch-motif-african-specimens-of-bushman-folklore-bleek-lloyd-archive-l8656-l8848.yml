canonical_text:
  quote: ''
  summary: A procedural account, dictated from personal observation, describes how
    women gather and prepare red clay and grass, mould and smooth clay pots, dry and
    anoint them, treat new pots with gum and springbok blood, and observe precautions
    to keep new pots from splitting. A note also records gendered craft roles and
    female-line instruction in pot-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women dig out pot-making earth, place it in a bag, sling it over the left
    shoulder, and take it home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: On the return journey, they pluck only male grass, bind it together, and take
    it to the hut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The pot earth is described as red, dry, and containing glittering particles;
    the digging place is called a pot's hole.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: The dry earth is pounded and sifted; soft earth is placed on a whole springbok
    skin, while harder earth is set aside to be pounded again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The grass is pounded, added to the earth, and the mixture is wetted and worked
    for moulding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The lower part of the pot is made, clay is rubbed between the hands and laid
    down in a circle, and the pot sides are raised and smoothed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A piece of bone is identified as the tool used for smoothing the clay.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The makers produce a large pot and several little pots, setting them in the
    sun to dry.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Fat is applied to a newly dried but still damp pot because the makers want
    it not to split.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gum is pounded, put into the new pot with water, boiled, and smeared on the
    outside of the pot so that it adheres.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When springbok are available, a man kills one, collects the blood in its stomach,
    and brings the blood home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wife pours springbok blood into the new pot, boils it, removes the cooked
    blood, and leaves remaining blood in the pot to dry.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the blood treatment, water is poured into the pot and meat is boiled
    in it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: People avoid striking bones with a stone while a new pot is on the fire because
    they want the pot not to split.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A note states that a man works at springbok arrows, a woman moulds pots, and
    the wife had been taught to make pots by elder female relatives on the maternal
    side.
  category: relationship
  evidence_refs:
  - ev:10
