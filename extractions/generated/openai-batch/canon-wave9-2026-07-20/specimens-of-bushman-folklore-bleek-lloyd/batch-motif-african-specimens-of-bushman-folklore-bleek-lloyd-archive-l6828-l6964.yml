canonical_text:
  quote: ''
  summary: 'A story framed as formerly told by the narrator''s grandfather, \yugen-ddi:
    a man in rain and darkness seeks a cave as shelter. A lion has made the rain to
    divert him and waits in the cave, but falls asleep. The man enters, hears breathing,
    feels hair, recognizes a sleeping lion, leaves quietly, and runs. The lion wakes
    from the man''s scent and searches for him. At daybreak the man sees a fire, verifies
    that it is a real fire rather than a lion''s eye, goes to the people there, and
    recounts his near escape.'
  language: English
  quote_policy: summarized
