canonical_text:
  quote: The (son of the) Wind was formerly still.
  summary: A child associated with the Wind rolls a ball with another child. The second
    child does not know the Wind-child's name and asks his mother for it. She delays
    revealing the name until the father has strengthened the hut, then instructs the
    child to run home after speaking it. When the name is spoken, the Wind-child falls
    and lies kicking on a vlei, causing violent wind, dust, and damage to huts. The
    Wind-child's mother raises him to his feet, and the wind becomes still. The passage
    ends with a Bushman saying that strong wind is the Wind lying down, while standing
    upright is stillness.
  language: English
  quote_policy: quoted
