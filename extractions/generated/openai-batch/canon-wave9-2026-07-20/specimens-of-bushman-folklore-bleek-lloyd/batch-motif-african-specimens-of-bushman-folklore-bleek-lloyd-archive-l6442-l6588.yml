canonical_text:
  quote: ''
  summary: 'The passage describes springbok mothers grunting while their kids bleat,
    and includes a saying addressed to a beast of prey about springbok movement. It
    then gives an account of bat and porcupine habits: the bat shares the porcupine''s
    hole and indicates the porcupine''s return; the porcupine goes by night, makes
    watchers sleepy against their will, smells for danger at its hole, and steals
    away quietly if a person is lying in wait. The narrator says his mother and father
    taught him to resist sleep while watching for porcupine.'
  language: English
  quote_policy: summarized
