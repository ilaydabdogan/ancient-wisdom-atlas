canonical_text:
  quote: ''
  summary: The passage describes the Mantis in the form of a hartebeest. Children
    or sisters cut up the hartebeest, but the flesh moves, shifts position, and resists
    handling. A child carries the head, which slips, speaks about a thong over its
    eye, winks, and opens and shuts its eyes. When the child drops the head, the Mantis
    complains of pain. The sisters drop the flesh, and the separated parts spring
    or run together and rejoin the Mantis's body.
