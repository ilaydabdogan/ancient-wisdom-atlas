canonical_text:
  quote: ''
  summary: A Bushman kills an ostrich and the meat is eaten, but a bloody feather
    is lifted by a whirlwind, falls into water, becomes conscious, and re-forms into
    a young male ostrich. The ostrich grows, strengthens its body, returns to the
    old house-place where it died, calls its wives, scratches and dries the house,
    and the female ostriches lay eggs there.
