canonical_text:
  quote: ''
  summary: A younger sister carries a child to her elder sister in the reeds so that
    the child may suck. The elder sister repeatedly comes out of the reeds to nurse
    the child and warns that she is losing consciousness, memory, or recognition.
    At a \ku dance or game, Dawn's-Heart approaches the younger sister-in-law, who
    rebukes him by referring to his wives as old she-hyenas. Dawn's-Heart attacks
    the hyena’s sitting place with an assegai; the hyena springs away, burns itself
    in the fire, and leaves ornaments behind. Dawn's-Heart scolds the younger sister-in-law
    for concealing the hyena, and she tells him they will go to his wife in daylight,
    taking goats to the reeds.
  language: English
  quote_policy: summarized
