  summary: The passage describes men dancing standing around while women sit and drum;
    dust from the drum and from the dancers' feet covers faces. After the dancing,
    the tired group sleeps until the place grows dark, and at daybreak children are
    sent to fetch water because the adults are thirsty. A following section describes
    preparing feather brushes for springbok hunting by binding ostrich feathers to
    sticks, painting the sticks red with pounded red stones, and preparing springbok
    chest skin and thongs.
