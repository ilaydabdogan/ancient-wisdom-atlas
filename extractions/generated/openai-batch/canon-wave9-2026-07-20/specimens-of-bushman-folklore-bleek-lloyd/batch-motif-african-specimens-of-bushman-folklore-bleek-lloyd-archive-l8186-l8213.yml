canonical_text:
  quote: ''
  summary: In a passage titled “THE THUNDEESTOKM.”, the first-person speaker says
    an unnamed group sent him to fetch water. While he was at the water after tying
    up his leveret, they killed the leveret. He returned and cried, saying they had
    deceived him and that he had intended the leveret to live in peace. They refused
    to seek another leveret and then calmed him with the story of the lizard so that
    he would listen quietly.
