canonical_text:
  quote: ''
  summary: 'The passage describes warnings about Rain, lightning, and thunderbolts;
    looking toward lightning is said to turn back Rain''s thunderbolts. It then explains
    relations of wind, moon, gall, hair, and clouds to people after death: wind blows
    away footprints, gall sits green in the sky, the hollow moon carries dead people,
    and clouds may be recognized as the hair of a dead person. Some footnotes add
    fragmentary information about water flowers and cloud-making from bodily organs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mother and others do not allow Bushman women to walk about when Rain comes,
    because they fear that Rain intends to kill them by lightning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rain is said to smell human scent, lighten from the place where it rains,
    and kill people by stealth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When people are walking through Rain and see lightning in the sky, they are
    instructed to look quickly toward the place where Rain has lightened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Looking toward the lightning is said to make Rain's thunderbolts turn back,
    because the human eye also shines like the thunderbolts; Rain then fears or respects
    the eye and passes over without killing the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rain's thunderbolts are described in a note as black, pointed, shining stones
    that come from the sky when it lightens and disturb the ground where they fall.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When people die, their own wind blows; human beings are said to possess wind
    and to make clouds when they die.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wind makes dust and blows away the footprints made by people while they were
    alive, so that the footprints will not remain as if the people still lived.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When people die, their gall sits green in the sky.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mother says that when the moon lies hollow or lying down, the moon is carrying
    dead people, and that people may expect to hear that someone has died.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hair of a person's head is said to resemble clouds when that person dies;
    knowledgeable people recognize some clouds as a person's clouds, or the hair of
    the person's head.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note reports that sitting in shade when the place is not truly hot can make
    clouds, because the liver goes out from the place where the person is sitting.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note reports that a mother told of a flower growing in water and warned
    that someone might also become a flower if she did not fear Rain.
  category: speech
  evidence_refs:
  - ev:9
