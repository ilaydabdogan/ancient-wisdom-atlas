canonical_text:
  quote: ''
  summary: The supplied passage contains the end of a preceding tale about a wife
    cutting off her husband's ears after a misunderstanding about shaving and skinning,
    followed by notes on early Bushmen. The main narrative headed “The +Nerru and
    Her Husband” tells of a man of the early race married to a +nerru. The couple
    gathers Bushman rice. The husband repeatedly demands the wife's little kaross
    for earthy Bushman rice, although she says the house of +nerru does not use a
    back-kaross that way. When he snatches the kaross, her entrails pour down. She
    sings the household rule while walking and replacing her entrails. Her mother
    hears a wind-like sound as if someone is singing, sends a daughter to look, and
    the daughter sees the elder sister coming back.
  language: English
  quote_policy: summarized
