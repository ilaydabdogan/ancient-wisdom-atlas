canonical_text:
  quote: ''
  summary: The supplied range contains the end of a Mason Wasp narrative in which
    the Mason Wasp, formerly a man, is asked by his wife to shoot a hare, removes
    his kaross after her prompting, is mocked for his slender body, shoots his wife,
    and laments her death. The range then includes a brief fragment naming mother,
    father, and grandmother's huts and drinking water, followed by the opening of
    a lion narrative in which a young hunter becomes unusually sleepy, sleeps on a
    hill, is taken up by a thirsty lion, remains still because the lion seems to think
    him dead, and is placed partly into a zwart-storm tree while the lion delays eating
    until after drinking.
  language: English
  quote_policy: summarized
