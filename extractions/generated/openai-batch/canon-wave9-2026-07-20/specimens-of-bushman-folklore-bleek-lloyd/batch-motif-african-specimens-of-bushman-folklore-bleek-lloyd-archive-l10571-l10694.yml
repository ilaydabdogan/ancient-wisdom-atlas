canonical_text:
  quote: ''
  summary: The passage contains fragmentary translated material about social exchange
    involving a bull, an elephant tusk, and Indian Hemp; notes on four wooden divining
    pieces called \xu and rules of respect around handling them; a domestic episode
    in which a small boy carries water, spills it, is beaten by his father, and women
    intervene; the father then aims arrows at his wife, who avoids them, while her
    mother and other women cry out; and a heading stating that snakes, lizards, and
    a certain small antelope seen near graves are to be respected.
  language: English
  quote_policy: summarized
