  quote: ''
  summary: A female figure descends from the sky and describes a clear, beautiful
    place where trees and a springbok could be seen. The other people arise and ascend
    into the sky; a note identifies them as Vultures and says they felt they became
    Vultures. They eat springbok in haste when the elder sister's husband approaches,
    fly away, alight elsewhere, and later descend again when they see another springbok,
    with the elder sister following them.
