canonical_text:
  quote: ''
  summary: 'The passage first explains that a particular piece of hare meat was avoided
    because it was understood as human flesh remaining from when the hare was formerly
    a man. It then recounts how the Moon intended humans to rise again after death
    as the Moon does, but the hare contradicted the Moon about whether his mother
    was asleep or dead, leading the Moon to curse humans with complete death and to
    curse the hare to lie in bare places with vermin. A second section gives a hunting
    prohibition: after shooting game, people must not look at the Moon, because the
    Moon''s shining and water may affect the hunted animal, cooling the poison and
    allowing it to live or go away.'
  language: English
  quote_policy: summarized
