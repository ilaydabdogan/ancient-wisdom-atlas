canonical_text:
  quote: ''
  summary: The passage first reports two cases in which the upper joint of a finger
    or little finger was cut off. It then describes Bushman presentiments as bodily
    'letters' or beatings that speak truthfully, in contrast with deceptive dreams.
    Examples explain how tapping or sensations in particular body places warn of people
    or animals coming, guide hunting decisions, and correspond to wounds, animal movements,
    springbok features, a carrying thong, or an ostrich's scratching.
  language: English
  quote_policy: summarized
