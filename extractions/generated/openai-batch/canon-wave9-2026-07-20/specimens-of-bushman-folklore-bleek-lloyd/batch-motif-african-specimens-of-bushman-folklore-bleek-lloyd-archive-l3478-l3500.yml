  quote: ''
  summary: 'In the second version of “The Hyena’s Revenge,” a male Hyena takes a pot
    from the fire and intends to burn the Lion to death with hot soup, deceiving him
    in response to the Lion’s withholding of quagga flesh. The passage also states
    several same-kind animal marriage pairings: Lion with Lioness, Hyena with female
    Hyena, leopard with leopardess, and hunting leopard with hunting leopardess.'
