canonical_text:
  quote: The girl was the one who first went into the spring, and then she became
    a frog.
  summary: An ill girl secretly kills and eats the Water's children instead of food
    given by her mothers. A child is left to watch and reports this. After the killings,
    a whirlwind brings the girl, her mothers, her father, and their possessions to
    the spring; the people become frogs, and their things are associated with the
    spring.
  language: English
  quote_policy: quoted
