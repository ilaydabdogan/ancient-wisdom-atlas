canonical_text:
  quote: ''
  summary: The Lions, jealous that women praise the Ostrich’s fine call, plan a game
    of !gebbi-ggu to test and deceive him. One Lion explains that the Ostrich calls
    well because of his lungs and proposes killing him, taking out the lungs, and
    eating them to sound like him. During the game, women praise the Ostrich rather
    than the Lion. A Lion angrily scratches and kicks the Ostrich’s body part, and
    the Ostrich kicks back. The narrator adds that his grandfather taught boys to
    eat Ostrich lungs raw and whole, not cooked or chewed, so that they might call
    like an ostrich.
  language: English
  quote_policy: summarized
