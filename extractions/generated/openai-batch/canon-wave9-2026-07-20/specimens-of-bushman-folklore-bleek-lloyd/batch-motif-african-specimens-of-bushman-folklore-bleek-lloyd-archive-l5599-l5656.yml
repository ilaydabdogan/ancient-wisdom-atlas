  quote: ''
  summary: A female figure goes home singing. The passage then describes a mother
    meeting her daughter, placing a little kaross and the daughter's entrails together,
    binding the daughter, and taking her into the mother's hut. The mother becomes
    angry when the daughter's husband seeks to come to his wife and sends him back
    to his own people. A following descriptive note identifies the +nerru as bird-like
    beings, with short bills, male black plumage like male ostriches, female white
    plumage like female ostriches, and a diet like that of little birds.
