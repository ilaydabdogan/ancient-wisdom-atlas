canonical_text:
  quote: ''
  summary: 'The passage includes an editorial comparative note on shoulder-blade divination,
    then describes handling springbok bones: upper foreleg bones are taken to the
    person who killed the springbok, shoulder blades are gnawed and stored in hut
    sticks so dogs do not crunch them, and Tsatsi is said to have preserved particular
    springbok bones. The passage links dogs eating certain bones with wounds to the
    hunter’s first finger during shooting. It also describes springbok skin bags softened
    by a wife and exchanged for goods including arrows or poison, and a finger covering
    sewn from softened skin for use when drawing the bowstring while hunting springbok
    from a bush screen.'
  language: English
  quote_policy: summarized
