canonical_text:
  quote: ''
  summary: 'The passage describes responses to theft: returning stolen goods and a
    stealing wife to her parents, demands or refusals to kill her, confiscating stolen
    property for return, killing thieves by arrows or by burning, treating small children
    differently from grown children, avoiding names of executed people because of
    their spirits, and exchanging an elephant tusk for a bull and Indian Hemp after
    a punitive burning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a married woman steals, the speaker describes taking her to her father
    and mother and returning the stolen thing to its owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner of the stolen thing objects and says to kill the wife, while the
    husband refuses because she has gone back to her parents and country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another described sequence, the woman shows her stolen object to her husband;
    he persuades her to hand it over, puts it in his bag, and refuses to return it
    to her because he intends to return it to the owner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A husband who sees that his wife has stolen may kill her; another man identified
    as his father tells him not to quite kill her, but he insists that he objects
    to stealing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A female child whose mother is dead and who lives in another person's hut
    may be given to the person from whom she stole; the receiving people put her into
    a hut and burn her with fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man who steals is killed with arrows and is not put into the fire, while
    a woman is burned by being put into the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A small child who steals is only scolded, but when the child has grown up
    and steals, the child is given to others and killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage notes that people fear the names of those whom they kill and do
    not utter those names because of their spirits.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a visiting woman's child steals or eats household food, the woman and child
    are given to other people, who burn the two with fire and report back.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the burning of the visiting woman and child, the people give a male
    elephant's tusk; the tusk is given to the Makoba, who give a bull with Indian
    Hemp, and the bull is killed and eaten.
  category: sequence
  evidence_refs:
  - ev:10
