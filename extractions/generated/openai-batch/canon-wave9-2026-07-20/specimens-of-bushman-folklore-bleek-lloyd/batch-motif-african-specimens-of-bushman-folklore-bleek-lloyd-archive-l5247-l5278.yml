  summary: The passage gives notes on a bush or buchu term, placing the plant in ravines
    of a red mountain near Kenhardt/Rooiberg, and distinguishes rubbing with dry substances
    from anointing with wet ones. In the narrated fragment, an unnamed female smells
    strongly of buchu and rubs herself to remove the smell. Old women who had been
    seeking food come to burn horns, wanting the smell of the horns to rise so that
    Rain will not be angry with them.
