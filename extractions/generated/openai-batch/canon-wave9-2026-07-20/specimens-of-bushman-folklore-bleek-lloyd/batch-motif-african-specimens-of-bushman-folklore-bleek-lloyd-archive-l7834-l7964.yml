canonical_text:
  quote: ''
  summary: The passage recounts succession in possession of Wkabbo's place, his marriage
    and settlement there, the growth and hut-building of his descendants, and his
    account of fetching and raising Betje after her parents' deaths. Footnotes describe
    the place Wgubo/Blauwputs, pitfalls, the killing of Betje's father, her mother's
    death, the danger from jackals, and Wkabbo's journey to retrieve the child. The
    passage closes with Wkabbo describing himself as a young hunter who fed children
    with hare and bustard during a time when springbok were absent, and with remarks
    on hares, sun, dry bushes, and water.
  language: English
