canonical_text:
  quote: |-
    a thing which looked like
    a little child
  summary: After burying the narrator's wife, the party crosses a salt pan and sees
    a child-like thing seated there. Several women compare it to a child, to a person,
    and to the dead wife's appearance or cap. Later the narrator returns by the same
    place and no longer sees it. He explains this by teachings that, when sorcerers
    or angry people take a person away, the person's visible aspect may appear before
    the living. A second account tells of Mansse seeing a child-like being near a
    bush while hunting; it seems afraid, is partly like a person and partly not, and
    he leaves it alone.
  language: English
  quote_policy: quoted
