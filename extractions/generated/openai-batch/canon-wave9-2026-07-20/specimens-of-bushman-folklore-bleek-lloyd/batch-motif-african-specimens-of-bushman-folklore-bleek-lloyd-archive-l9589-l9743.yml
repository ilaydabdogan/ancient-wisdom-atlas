canonical_text:
  quote: ''
  summary: 'The supplied passage first describes praise of a handsome young man''s
    beautiful dark head by comparison with the \khi tree. It then explains that tto/ttd
    is obtained from a mountainside mine where sorcerers live; collectors fear them,
    rub themselves, throw stones at the mine so the sorcerers will hide, work at the
    tto, also get Whdra, and return home. A following section describes Bushman directional
    signs: foot marks, upright grass, and reversed branches guide an absent returning
    man toward the relocated camp by water, where he sees white huts and fire smoke.
    The supplied range ends with the title of a following item about a faint Bushman
    throwing earth into the air so people at home can see dust and help him.'
  language: English
  quote_policy: summarized
