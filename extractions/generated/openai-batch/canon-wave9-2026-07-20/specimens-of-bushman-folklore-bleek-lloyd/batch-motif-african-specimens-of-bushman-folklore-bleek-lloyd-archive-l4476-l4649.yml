canonical_text:
  quote: ''
  summary: While the Lioness is away at the water, Ddi-yerreten goes to her house,
    addresses the children she has gathered, and directs them to the fires of their
    own people by ravine landmarks. Groups of children leave for their own people.
    The Lioness returns, finds the children gone, recognizes Ddi-yerreten, demands
    the children, and catches at his stone head, hurting her teeth. Ddi-yerreten leaves,
    and the Lioness remains angry because he has taken away the children who had been
    living with her.
  language: English
