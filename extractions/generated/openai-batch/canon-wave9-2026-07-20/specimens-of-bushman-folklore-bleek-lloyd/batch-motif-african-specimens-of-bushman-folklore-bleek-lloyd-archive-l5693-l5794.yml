canonical_text:
  quote: ''
  summary: A Lizard, noted as an early-race man now in lizard form, sings that he
    intends to pass through named passes. While passing through a mountain pass, the
    mountains close on him and break him; his forepart and hind part become named
    entities or places. The narrator comments that he may have been traveling toward
    red sand hills, shallow pools, a vlei, a river, and the pool \kaugen-\ka\ka to
    dwell there. The final lines begin a separate poetry item about the Cat and its
    names.
  language: English
