canonical_text:
  quote: ''
  summary: The passage recounts the capture and treatment of Dawn's-Heart's bewitched
    wife after she runs from reeds toward goats. People seize her, slaughter goats,
    anoint her with stomach contents, and remove animal hair while leaving hair on
    her ear tips so she can hear. Dawn's-Heart returns armed, with eyes compared to
    fires. An embedded extract identifies Dawn's-Heart as Jupiter, describes his daughter
    as a neighboring star whom he swallows and later emits, and summarizes how Jackal
    and Hyena bewitch the wife with poisoned Bushman rice, how Hyena impersonates
    her, and how the wife is restored from a lioness form but becomes a lynx who eats
    meat.
  language: English
  quote_policy: summarized
