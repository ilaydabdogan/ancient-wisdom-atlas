canonical_text:
  quote: ''
  summary: An early-race girl throws wood ashes into the sky and declares that they
    should become the Milky Way. The ashes become the Milky Way, which travels with
    the stars and gives some light at night. The same girl throws \huih roots so that
    they become red and white stars, and a note says she also made locusts from the
    peel of an edible root. Her actions are linked to anger and hunger while she is
    in a little hut and dependent on her mother for food.
  language: English
  quote_policy: summarized
