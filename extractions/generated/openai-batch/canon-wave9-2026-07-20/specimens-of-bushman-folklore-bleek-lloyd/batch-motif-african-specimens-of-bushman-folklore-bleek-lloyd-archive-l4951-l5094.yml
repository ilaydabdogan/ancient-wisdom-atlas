canonical_text:
  quote: ''
  summary: People hide a loved young man from a lion by wrapping and covering him.
    An old Bushman sees the lion approaching and alerts the household. The young man's
    mother urges the people to shoot the lion before it reaches the huts. Weapons
    do not kill the lion. The lion speaks, refuses offered children and a girl, and
    says it wants only the man whose tears it licked and whom it carried off. People
    call the lion a sorcerer, and, after the lion damages huts and threatens them
    into the evening, they conclude that the mother must bring out and give the young
    man to the lion.
  language: English
  quote_policy: summarized
