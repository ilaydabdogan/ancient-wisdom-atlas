canonical_text:
  quote: ''
  summary: In the first version of “The Hyena's Revenge,” Hyena acts against Lion
    after feeling that Lion had been grudging about quagga flesh. Lion comes to Hyena's
    house, where Hyena is boiling ostrich flesh in a pot. Hyena gives Lion soup, asks
    to pour it into Lion's mouth, puts the hot pot over Lion's head, and the hot soup
    burns Lion until he dies. Hyena then beats him with a stick and breaks the pot;
    the narration states that Hyena killed him with hot soup from a pot that had stood
    on the fire.
