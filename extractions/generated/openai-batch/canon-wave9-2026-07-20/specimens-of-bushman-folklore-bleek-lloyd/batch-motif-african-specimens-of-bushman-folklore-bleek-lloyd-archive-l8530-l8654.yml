canonical_text:
  quote: ''
  summary: 'The passage describes hunters sensing approaching game through a bodily
    sensation under the knees, children acting as lookouts and signaling the animals’
    path, and hunters positioning themselves near a hill to intercept game. It then
    describes rites performed when Canopus and Sirius appear: people burn and point
    sticks or fire toward the female stars addressed as grandmother, ask for warmth
    and twinkling, sing about the stars, and connect the appearance of the stars with
    Bushman rice and women seeking food in the sun.'
  language: English
  quote_policy: summarized
