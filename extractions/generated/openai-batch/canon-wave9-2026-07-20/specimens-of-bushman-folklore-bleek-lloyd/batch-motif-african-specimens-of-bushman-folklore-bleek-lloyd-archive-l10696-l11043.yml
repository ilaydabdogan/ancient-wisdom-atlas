canonical_text:
  quote: ''
  summary: The passage describes a practice in which a stone is beaten on the ground
    and a command is spoken for a force, possibly lightning, to fall into water; it
    states that women, not men, perform this action. It then records beliefs that
    snakes, lizards, and a small male antelope found near graves or death places are
    to be respected and not killed because they are associated with the dead person
    or spirit. A Whin serpent that turns its belly upward or lies on its back is described
    as a death announcement and is not killed; if it does not show this posture it
    may be killed and discarded. A woman who lays down her skin necklace causes the
    serpent to turn its belly to the earth and then kills it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person labelled \Jcun and the narrator's father's mother beat a stone upon
    the ground; the grandmother says that the thing should fall into the water, and
    the thing, possibly lightning, falls into the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a man does not beat a stone upon the ground, while
    a woman does.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A snake near a grave is not killed because it is identified as the people's
    other person, dead person, or dead person's snake; it is respected and left alone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An explanatory note says that a man or woman who dies after a snakebite may
    be a snake, while ordinary death can leave a mere spirit; a man's other may be
    a snake near his grave while his mere spirit goes away.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a lizard's spoor leads to the grave or earth of the other person, the lizard
    is respected, not killed, and left alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small antelope near the place where the other person died is respected;
    it is described as not a mere antelope but the dead person, a spirit antelope,
    and male rather than female.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Whin serpent turns its underside or belly upward when struck or approached;
    people fear it, leave it alone, and may report the incident at home, where many
    women hear and cry.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the Whin serpent does not give its belly, people beat it, kill it, throw
    it away, and do not keep it for eating.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the Whin serpent is seen in tree water, it goes out of the water, lies
    on the ground, gives its belly, and the people turn back and leave it lying there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When a woman sees the Whin serpent, she loosens and lays down her skin necklace;
    the serpent turns and places its belly on the earth, after which she kills it
    and throws it away.
  category: sequence
  evidence_refs:
  - ev:9
