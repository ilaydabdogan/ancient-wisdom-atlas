  quote: ''
  summary: In a first-person account, the narrator says he was taken while eating
    springbok, bound with his son and his daughter's husband, brought to a Magistrate,
    confined in jail with legs in stocks, encountered Korannas also in stocks, shared
    sheep as food, travelled toward Victoria with wives also eating sheep on the way,
    and performed road work by rolling and lifting large stones.
