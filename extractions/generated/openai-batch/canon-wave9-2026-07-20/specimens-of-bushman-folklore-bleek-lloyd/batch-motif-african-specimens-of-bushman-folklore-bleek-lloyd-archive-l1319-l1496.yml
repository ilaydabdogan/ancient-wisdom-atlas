canonical_text:
  quote: ''
  summary: A child identified as a son of the Mantis tells baboons that he wants to
    fetch sticks for his father so that his father may aim at people sitting on their
    heels. The baboons call others to hear him. An old baboon says the threatened
    people are themselves and orders the child to be struck. The baboons beat the
    child, break his head, knock out his eye, and use the eye as a ball while the
    child dies. The Mantis waits for the child, lies down at noon, and dreams that
    the baboons have killed him and made a ball of his eye.
  language: English, with transcribed indigenous names and phrases
  quote_policy: summarized
