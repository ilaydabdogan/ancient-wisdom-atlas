canonical_text:
  quote: ''
  summary: The passage gives notes on First Bushmen and the Sun, describes Sun and
    Moon as formerly human speakers, records a prayer to the newly returned Moon asking
    to share its return to life, and narrates how the hare's refusal to accept the
    Moon's assurance of renewed life leads the Moon to curse the hare and declare
    permanent human death. It also explains that the hare was formerly a man and that
    a piece of hare flesh is left uneaten as human flesh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The First Bushmen are described as the first inhabitants of the earth, and
    their children are said to have worked with the Sun to make it ascend and warm
    the earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the First Bushmen passed away, the Flat Bushmen inhabited their ground
    and taught their children stories of the First Bushmen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sun and the Moon are described as having formerly been men who lived on
    the earth and talked; now they live in the sky and do not talk.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Moon has newly returned alive and is shown to people, they look toward
    it and shut their eyes with their hands while speaking to it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prayer asks the Moon to take the speaker's unpleasant face and give the
    Moon's face, so that the speaker may resemble the Moon, which returns alive after
    death or absence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hare said he would not be silent because his mother was altogether dead
    and would not return alive, and he cried greatly for her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Moon told the hare to stop crying because the hare's mother was not altogether
    dead and would return alive.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hare refused to agree with the Moon's statement about the mother's return
    to life.
  category: action
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:9
  text: The Moon became angry, struck the hare's mouth with his fist, and cleaved
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Moon declared that the hare's mouth would remain scarred, that the hare
    would spring away and return, and that dogs would chase, catch, and tear him to
    pieces.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Moon declared that human beings would die and go away without returning
    alive because the hare contradicted the Moon's statement.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator's mothers said the hare was formerly a man and that the Moon
    cursed him to become a hare.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When people kill a hare to eat it, they remove and leave a piece called the
    biltong flesh because it is regarded as human flesh from the hare's former human
    state.
  category: action
  evidence_refs:
  - ev:10
