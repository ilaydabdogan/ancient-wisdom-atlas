canonical_text:
  quote: ''
  summary: An old woman instructs children to wait for a hot, lying figure and, when
    they throw him up, to tell him to become the hot Sun. The children seize and raise
    him into the sky, then report that they addressed him as Sun-armpit, asking him
    to remain above, dry Bushman rice, warm and light the earth, and remove darkness.
    The passage then describes the alternation of Sun, darkness, and moon; the Sun
    pierces the moon with a knife, leaves the moon’s backbone for the children, and
    the moon painfully departs before becoming whole and alive again as a new moon.
  language: English
  quote_policy: summarized
