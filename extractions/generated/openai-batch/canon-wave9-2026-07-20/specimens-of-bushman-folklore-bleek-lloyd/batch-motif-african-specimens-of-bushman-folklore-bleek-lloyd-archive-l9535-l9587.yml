  summary: 'The passage describes the use of two substances, Whdra and ttd: Whdra
    is black, mixed with fat, pounded, and applied to the head; ttd is red, pounded,
    and rubbed on the body. The people apply these substances with the wish that head
    hair grow downward and that heads become black and shimmering. The passage also
    describes reciprocal preparation and transport of Whdra, ttd, and bags between
    people in different households. It ends with old women commenting on a handsome
    young man, but the sentence is incomplete in the supplied excerpt.'
