canonical_text:
  quote: ''
  summary: In the second version of “The Hyena’s Revenge,” Hyena visits Lion’s house
    and is angered by Lion’s grudging conduct. Hyena invites Lion to his own house
    as a deception, says he customarily pours soup into the mouths of household members,
    and uses soup to get Lion’s head into a pot. Hyena intends the soup’s heat to
    kill Lion, then strikes Lion with a stick while Lion’s head is inside the pot.
    The passage also states that both Lion and Hyena kill and eat people, and that
    Hyena carried off an old woman.
