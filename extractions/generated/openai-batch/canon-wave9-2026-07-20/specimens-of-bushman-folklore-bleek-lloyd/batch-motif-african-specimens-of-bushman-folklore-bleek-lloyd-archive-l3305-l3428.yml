canonical_text:
  quote: ''
  summary: 'Fragment from the tale of \kqgdra and Ihaunu: during a journey home with
    \kqgdra''s younger sister, Ihaunu lightens at his brother-in-law after the sister’s
    water-like burden is noticed. The two exchange lightning and defensive fending.
    \kqgdra uses black lightning against Ihaunu, who is carried away and lies dying
    or thundering. \kqgdra returns home, rubs himself and his sister with buchu, and
    lies down. A narrator’s note says the narrator''s grandmothers identified thick,
    mountain-like storm clouds and lightning in the East with \kqgdra and Ihaunu fighting.'
  language: English
  quote_policy: summarized
