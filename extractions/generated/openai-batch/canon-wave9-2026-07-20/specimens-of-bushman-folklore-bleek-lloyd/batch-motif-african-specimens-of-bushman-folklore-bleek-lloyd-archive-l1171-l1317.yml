- id: obs:2
  text: The Mantis moves with shoes and a shoulder blade, then descends to a river
    bed and returns by a different side of his house.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The children report that they saw a dead hartebeest, cut it up with stone
    knives, and saw its flesh quiver, snatch itself away, and place itself on bushes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A child says the hartebeest's head talked to her and asked her to remove a
    thong from in front of its eye.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father asks whether the children cut up the old man, the Mantis, while
    he was pretending to be dead before them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The children say the animal had horns and hair, no arrow wound, and talked
    before chasing them after they put down its flesh.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The children describe the hartebeest's flesh and back as jumping together,
    gathering, mending, and joining on.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After reassembly, the figure runs with a red hairless body and swings his
    arm like a man.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The parents identify the figure as the old man Tinderbox-Owner, who came out
    from behind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The children say the daughter's report of the talking head caused them to
    drop the flesh, put their karosses on their shoulders, and run fast.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The children state that the Mantis completed mending himself, chased them,
    and made them tired.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The children say he had been deceiving, had gone to lie as if dead, opened
    and shut his eyes, talked while mending his body, and rejoined his head to his
    neck.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The children conclude that he feigned death so that they would run, and they
    say their hearts burnt with fatigue and they will remain at home rather than hunt.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The supplied passage then begins another narrative in which Igaunu-tsa^au,
    son of the Mantis, goes to fetch sticks for his father and is questioned by an
    older baboon.
  category: sequence
  evidence_refs:
  - ev:13
