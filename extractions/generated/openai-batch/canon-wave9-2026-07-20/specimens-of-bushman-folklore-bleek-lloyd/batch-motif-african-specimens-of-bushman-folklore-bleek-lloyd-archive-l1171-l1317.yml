canonical_text:
  quote: ''
  summary: The passage gives the end of an episode in which the Mantis, perceived
    by the children as a dead hartebeest, reassembles himself after being cut up,
    chases the children, and is identified by their parents as the old man Mantis
    or Tinderbox-Owner who had pretended to be dead. The supplied text also includes
    the heading and opening lines of the next narrative about Igaunu-tsa^au, son of
    the Mantis, and the baboons.
  language: English
  quote_policy: summarized
