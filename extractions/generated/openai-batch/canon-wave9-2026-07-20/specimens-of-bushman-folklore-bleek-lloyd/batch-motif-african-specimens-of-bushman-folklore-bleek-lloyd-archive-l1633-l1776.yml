canonical_text:
  quote: ''
  summary: The passage label identifies the story as concerning the Mantis in the
    form of a hartebeest, while the supplied narrative segment describes the Mantis
    returning wounded, saying that baboons killed his grandson and played with the
    child’s eye. The Mantis conceals that he put the child’s eye into water, repeatedly
    visits the water where the child now appears and flees, then catches the child,
    anoints him with scent, identifies himself as the child’s father, clothes him,
    and brings him home. The young Ichneumon questions the earlier claim that the
    child was killed; the Mantis explains that the child came out of the water weak
    and must be cared for. An editorial note says Bleek regarded the story as a variation
    of a myth in which the Mantis is tricked by the Great Tortoise. The excerpt also
    includes the beginning of a separate Leopard Tortoise story in which an ill female
    figure asks hunters to rub her neck with fat and the first man’s hands decay.
  language: English
  quote_policy: summarized
