canonical_text:
  quote: ''
  summary: An old woman sings a song about an old she-hyena carrying her off from
    an old hut. The woman springs aside, rises, and beats the hyena. A note explains
    that the hyena kills herself by throwing herself onto the pointed rock intended
    for the woman. Another note explains that the old woman had been left in an old
    deserted hut because she was too weak to travel with her starving sons, who had
    enclosed the hut, left the top open for warmth, and provided fire and dry wood.
  language: English
