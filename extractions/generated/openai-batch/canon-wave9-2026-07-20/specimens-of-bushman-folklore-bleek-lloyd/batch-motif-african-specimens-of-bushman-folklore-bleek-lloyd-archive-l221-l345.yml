canonical_text:
  quote: ''
  summary: The preface lists Bushman narrators and informants, their contributions,
    dialect notes, and periods at Mowbray. It then quotes an 1889 report about |kun
    boys from beyond Damaraland. The report says the two elder |kun lads supplied
    specimens of native traditionary lore whose chief figure is a small magical personage
    able to assume almost any form and said to resemble the Mantis in Bushman mythology.
    It also notes the boys' skill in imitating sounds and animal actions, making visual
    representations, and making differently feathered arrows.
  language: English
  quote_policy: summarized
