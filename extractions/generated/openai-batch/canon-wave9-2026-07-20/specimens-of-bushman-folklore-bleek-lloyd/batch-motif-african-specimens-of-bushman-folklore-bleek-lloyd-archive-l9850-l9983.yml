canonical_text:
  quote: ''
  summary: A falling star is described as occurring when a person dies and as telling
    people of death. A hammerkop bird, after a falling star, flies over and cries
    to announce that a person or relative has died. The bird is associated with water
    in which all things, including stars and distant persons, can be seen. The passage
    also says that Rain carries off girls, kills them with lightning, and that they
    become stars and water-flowers; people are warned not to approach these beautiful
    flowers because they are the water's wives.
  language: English
  quote_policy: summarized
