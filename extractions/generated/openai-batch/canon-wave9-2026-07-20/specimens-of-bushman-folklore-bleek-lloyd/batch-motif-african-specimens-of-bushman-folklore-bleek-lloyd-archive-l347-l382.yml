  quote: ''
  summary: 'The passage reports evidence about Bushman image-making: Dr. Bleek asks
    Dia\hvain whether he can make pictures; the next morning a drawing of an ostrich
    family is found pinned to the porch wall as a reply. Dia\hvain also reports that
    his father, %da-ttin, chipped animal pictures at Miami, a place where animals
    formerly drank before the coming of the Boers. The passage also notes other drawings
    by named Bushman individuals and boys, and gives an ostrich caption.'
