canonical_text:
  quote: ''
  summary: The speaker describes hunting hares by chasing them in the summer heat
    until the sun and fatigue kill them, carrying the dead hares in an arrows' bag,
    relying on household water fetched by children, planning after rain to ambush
    water-seeking ostriches in the Har River bed, and waiting for Sundays, a moon,
    and strong boots before returning along a long hot road to his own place as trees
    and flowers dry and autumn approaches.
  language: English
  quote_policy: summarized
