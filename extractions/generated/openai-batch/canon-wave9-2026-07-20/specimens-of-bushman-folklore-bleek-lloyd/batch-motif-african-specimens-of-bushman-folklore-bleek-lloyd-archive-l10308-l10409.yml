  summary: A speaker describes seeing a child making fire with sticks, eating tshana,
    seeing the speaker, and dying; the speaker fears the dead child, mentions wearing
    wood pigeon feathers, and goes away to a distant mountain country named Wnqd.
    Notes explain the fire sticks, grass, and tshana tree. A separate prayer addresses
    the Young Moon, asking it to speak and tell something so that the speaker may
    eat; a note adds that on seeing the moon people say a lunar name and sound a male
    antelope horn.
