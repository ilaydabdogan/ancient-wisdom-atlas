canonical_text:
  quote: ''
  summary: The passage describes a person interpreting a reversed branch as a sign
    pointing toward water, then finding footprints and a footpath to a house. It then
    describes a man returning home who, weakened by the sun, throws earth into the
    air so those at home will see the dust. A lookout identified in a note as his
    wife sees the dust; people run out with water, cool him, and he sits up. The passage
    adds that these are men's doings and relates them to men chasing springbok in
    the sun.
  language: English
  quote_policy: summarized
