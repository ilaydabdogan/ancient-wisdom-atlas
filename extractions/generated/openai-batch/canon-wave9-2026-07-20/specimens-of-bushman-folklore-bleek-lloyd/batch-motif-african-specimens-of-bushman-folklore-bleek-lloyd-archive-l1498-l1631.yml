canonical_text:
  quote: ''
  summary: The Mantis sees baboons playing at ball with a child's eye. He hides his
    tears, joins the game, snatches the eye, anoints it, and makes it appear to be
    away from him while it is in his quiver bag. When the baboons demand the ball
    and strike him, he escapes to water, takes the eye from the bag, puts it into
    the water, commands it to grow back as it had been, and returns home.
  language: English
  quote_policy: summarized
