canonical_text:
  quote: ''
  summary: 'The passage first continues an episode in which a Leopard Tortoise traps
    a man’s hands in her neck while he rubs her with fat; another man says that he
    now feels what he himself had felt, and people later explain that the Leopard
    Tortoise deceives others by seeming as though she will die. An editorial note
    discusses recurring Bushman Moon traditions. The passage then begins a Sun and
    Moon story: old women instruct children to wait for the sleeping Sun, lift the
    Sun-armpit, and throw it into the sky so that the ground will be bright, people
    will be less cold, and Bushman rice may dry.'
  language: English
