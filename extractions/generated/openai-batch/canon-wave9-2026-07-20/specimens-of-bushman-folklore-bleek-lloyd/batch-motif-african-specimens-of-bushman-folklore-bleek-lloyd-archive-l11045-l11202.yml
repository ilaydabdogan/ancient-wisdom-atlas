  summary: The passage opens with a folklore fragment in which people who have not
    yet heard news of a death see the Whin turning its belly toward them, become afraid,
    and cry. Related notes mention flesh being discarded while skin is kept and given
    to the Makoba, something located in the hollow of a tree, and a woman’s fat-worked
    skin necklace whose powerful scent frightens the Whin. The remainder is an editorial
    report by Dr. Bleek accompanying photographs, classifying South African groups
    and describing Bushmen as worshipping moon, sun, and stars and possessing extensive
    mythological traditional literature, while cautiously discussing possible but
    unproved Bushman-Hottentot relationship.
