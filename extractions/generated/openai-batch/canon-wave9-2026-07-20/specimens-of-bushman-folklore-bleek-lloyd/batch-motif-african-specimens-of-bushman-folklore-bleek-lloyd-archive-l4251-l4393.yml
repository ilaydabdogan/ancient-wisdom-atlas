canonical_text:
  quote: ''
  summary: In this passage, the Vultures live with an elder sister made from a person
    and with her husband. The husband repeatedly brings home springbok, which the
    Vultures eat up; the elder sister cooks the springbok skin and gives them pieces,
    and the husband scolds them. Because the Vultures consume the game, the husband
    decides his wife must accompany him to the hunting ground. When she is gone, the
    Vultures gather outside the house and plan for one of them to ascend and report
    on the place above. A little Vulture girl ascends into the sky, disappears, returns,
    and says another grown-up Vulture girl should ascend to look.
  language: English
