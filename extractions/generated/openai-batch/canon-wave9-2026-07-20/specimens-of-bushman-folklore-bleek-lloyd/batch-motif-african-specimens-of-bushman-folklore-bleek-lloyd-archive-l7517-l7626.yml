canonical_text:
  quote: ''
  summary: 'The passage recounts Iikabbo''s capture and forced journey: carrying earth
    with Korannas, being bound to a wagon chain, confinement in Beaufort jail, travel
    through water to the Breakwater, train travel to Cape Town and prison, and a second
    account of family members being taken, transported by wagon, resting by a fire,
    going to the Magistrate, and being put in stocks in jail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator's group and Korannas carried earth with handbarrows, loaded a
    wagon with earth, pushed it, and poured the earth down before loading again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's group had their arms bound to a wagon chain and walked fastened
    to it on the road to Beaufort in hot sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Beaufort, the group received tobacco from the Magistrate, smoked while
    going along, entered Beaufort jail, and had rain fall on them there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning the group was bound again, crossed water in a river bed,
    followed a wagon, and came bound to the Breakwater, where they ate sheep and worked.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A white man took the group to meet a train at night; they sat in the train
    early, came to the Cape, entered the Cape prison house tired, and slept at noon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the second account, the narrator lists his wife, son, son's wife with a
    little child, daughter with a little child, and daughter's husband as present
    when a police group took them while they were not numerous.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The group sat in a wagon; wives also sat there and later walked. The wagon
    stopped, they made a fire, roasted lamb and springbok, smoked, slept, and made
    a fire again in the morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The men in the wagon ran along the road to the Magistrate while their wives
    walked on foot, and the men left them behind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At night a police group took them to jail, where their legs were put into
    stocks; they slept, sat, ate, smoked, and lay down while their legs were in the
    stocks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Magistrate removed their legs from the stocks so that they could sit comfortably
    and eat his sheep; named men ate with them, and other Korannas later came into
    another jail house.
  category: sequence
  evidence_refs:
  - ev:9
