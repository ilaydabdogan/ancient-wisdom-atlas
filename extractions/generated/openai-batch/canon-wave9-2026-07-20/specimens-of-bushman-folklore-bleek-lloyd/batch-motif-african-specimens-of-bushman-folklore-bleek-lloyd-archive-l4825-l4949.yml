canonical_text:
  quote: ''
  summary: A man lies still after an encounter with a lion, which suspects he may
    still be alive and repeatedly looks back. The lion, hungry and thirsty, goes toward
    water intending to drink and return to eat. The man waits, then escapes by moving
    irregularly so the lion cannot follow his spoor. From the hilltop he warns the
    people at home, using an indirect expression for the lion attack, and asks them
    to wrap him in many hartebeest-skins and mats so the lion will not get him.
  language: English
  quote_policy: summarized
