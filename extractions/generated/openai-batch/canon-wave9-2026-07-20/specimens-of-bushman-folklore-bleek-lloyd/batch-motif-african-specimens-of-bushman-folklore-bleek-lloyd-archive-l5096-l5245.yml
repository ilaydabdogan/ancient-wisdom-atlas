canonical_text:
  quote: ''
  summary: A mother tells the people to give her child to a lion but to kill the lion
    on him; the lion kills the young man and dies beside him. In a second narrated
    episode, the Rain, appearing as or resembling a bull, courts a young woman in
    her hut, approaches with mist and scent, is treated with buchu, carries the woman
    away, and is then put to sleep near a large tree with buchu while the woman escapes
    home; the Rain returns to the water or spring from which it came.
  language: English
  quote_policy: summarized
