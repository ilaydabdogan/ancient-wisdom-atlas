canonical_text:
  quote: ''
  summary: The passage describes a girl in retreat who sits in a hut, looks down,
    avoids walking about, and later, when she becomes a “big girl,” is allowed to
    look around again, first over her mother’s hand, then leaves the small hut and
    walks like other women. During retreat she must not look at springbok, lest they
    become wild. A following note says the girl thinks her saliva, placed in springbok
    meat, would enter a bow and cool it; she fears young men’s game, eats game only
    from her father, and has removed her saliva from her father’s hands. A separate
    star narrative says \gaunu was formerly a great Star who sang and called the names
    of the Stars, so that the Stars possess their names, including the small stars
    called “Wywhai.”
  language: English
  quote_policy: summarized
