canonical_text:
  quote: There is a kind of beating of the flesh, which tells them things.
  summary: The passage gives editorial notes on a second account of cutting off the
    top or joint of the little finger and on Bushman presentiments. It states that
    the joint is cut off with a reed before children suck, with the stated belief
    that this helps children live to grow up. Dr. Bleek's description says Bushmen
    feel coming events in their bodies as a beating of the flesh; those who do not
    understand or obey these bodily teachings may get into trouble, such as being
    killed by a lion.
