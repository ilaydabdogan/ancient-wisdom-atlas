canonical_text:
  quote: ''
  summary: The passage first reports a prayer to a Star or Canopus in which hungry
    people ask the celestial being to exchange hearts, stomachs, and arms with them
    so that they may be full and successful in hunting. It also reports that the Stars
    call out and curse the springboks' eyes. The passage then begins a separate narrative
    in which people dig and sift an edible substance, a female hyena contaminates
    some of it, and \ko-g\nuih-tdra eats it, loses her ornaments and clothing, runs
    to the reeds, and gives instructions concerning her child while still conscious.
  language: English
  quote_policy: summarized
