canonical_text:
  quote: the rain had intended to kill us, on account of my doings.
  summary: A first-person narrator plays the goura during nighttime rain despite his
    mother's rebuke. She compares his conduct to Wkunh, described as a rain sorcerer
    associated with stopping rain. The storm lightens into their eyes, makes their
    eyes feel green, and shatters a stone in front of the hut. The mother cries out,
    says the rain seemed to tear off her skin, and states that their disobedience
    nearly caused death; the narrator concludes that the rain intended to kill them
    because of his actions.
  language: English
  quote_policy: quoted
