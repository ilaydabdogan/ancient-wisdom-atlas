canonical_text:
  quote: ''
  summary: 'A man feels his way in a cave, touches hair, realizes a lion is sleeping
    there, and withdraws. After he tells others, the lion follows his spoor to a house,
    seeks him through the night, threatens the people, and leaves when the sun rises.
    The passage then describes !nanna-sse hunting observances: respect shown to game,
    food choices after shooting game, avoidance of springbok meat after shooting gemsbok,
    restrictions on touching springbok flesh with hands that held bow and arrows,
    and separation of the shooter from springbok handling.'
  language: English
  quote_policy: summarized
