  summary: A didactic account describes how springbok bones and other remains are
    carefully collected and deposited at designated heaps opposite hut entrances.
    It also describes handling stomach contents, blood, marrow bones, and shoulder-blade
    restrictions, with illness linked to springbok-associated powers.
