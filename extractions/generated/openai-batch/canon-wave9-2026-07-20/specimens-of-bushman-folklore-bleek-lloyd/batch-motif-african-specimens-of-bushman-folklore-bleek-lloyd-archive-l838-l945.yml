canonical_text:
  quote: ''
  summary: The passage describes hunger, dispossession, livestock theft, pursuit,
    imprisonment, and the circumstances by which Dr. Bleek and Lucy C. Lloyd obtained
    Bushman narrators, learned and transcribed their language, collected oral material,
    and faced delays in publication. It also states the editor’s view that Bushman
    religious ideas about celestial bodies resemble the thought of children and remote
    European ancestors.
  language: English
  quote_policy: summarized
