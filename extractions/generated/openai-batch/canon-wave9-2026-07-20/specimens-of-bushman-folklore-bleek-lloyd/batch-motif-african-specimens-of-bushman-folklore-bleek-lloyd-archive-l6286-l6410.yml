canonical_text:
  quote: ''
  summary: The passage first presents a song in which a first-person speaker says
    a string has been broken, causing the place to feel changed, open, and unpleasant;
    a note explains that the former ringing sound in the sky is no longer heard. It
    then presents a song attributed to \nu\numma-\kwiten, identified as a beast of
    prey who says he kills crying children. The narrator reports that his grandfather
    used this song to quiet noisy children, and the passage describes the being following
    the sound of a crying child to a hut, seizing the child, carrying it away, and
    going to swallow it. A note explains the being’s name through ideas of a white
    mouth, eating meat, swallowing eggs, and a related early-race figure who swallowed
    ostrich eggs whole.
  language: English
