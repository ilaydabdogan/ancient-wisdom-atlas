canonical_text:
  quote: ''
  summary: 'The passage describes Kwan Yin and Lao Tan as approving a way grounded
    in eternal non-existence, Grand Unity, weakness, humility, and emptiness. Kwan
    Yin portrays an exemplary person as non-self-dwelling, waterlike, mirrorlike,
    echoing, clear, harmonious, and following others. Lao Tan portrays the same kind
    of exemplary person through reversals: knowing masculine power but maintaining
    female weakness, becoming a channel for streams, keeping disgrace despite purity,
    choosing last place and emptiness, not storing yet having abundance, and appearing
    solitary while surrounded by many.'
  language: English
  quote_policy: summarized
