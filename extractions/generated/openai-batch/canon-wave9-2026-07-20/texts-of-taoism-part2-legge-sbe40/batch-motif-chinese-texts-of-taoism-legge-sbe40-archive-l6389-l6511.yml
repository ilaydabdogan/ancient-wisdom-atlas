canonical_text:
  quote: ''
  summary: A sequence of Daoist anecdotes and comments contrasts rulership, territory,
    wealth, and office with preservation of life and cultivation of the person. Prince
    Sau is forced from a cave to mount a royal chariot; 3ze-hwa 3ze persuades a Han
    marquis that body and life are worth more than territory; Yen Ho evades gifts
    and honors from Lu; a simile ridicules using the pearl of Sui to shoot a bird;
    and Lieh-3ze's poverty prompts an order to send grain. A translator note explains
    the pearl of Sui through a story of a healed snake returning with a pearl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People searching for Prince Sau found him in the cave of Tan, smoked him out
    with moxa, and made him mount the royal chariot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As Prince Sau mounted the carriage, he looked to heaven and called out asking
    the Ruler whether he could have been spared this.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narration says Prince Sau did not dislike being ruler, but disliked the
    evil inseparable from being ruler, and would not endanger his life for a kingdom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Han and Wei were contending over a disputed territory.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 3ze-hwa 3ze asked the marquis of Han whether he would seize the territory
    if doing so cost one hand but guaranteed the whole kingdom; the marquis said he
    would not.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: 3ze-hwa 3ze reasoned that the marquis valued his two arms above the whole
    kingdom, his body above his arms, and therefore should not endanger his life over
    the smaller disputed territory.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ruler of Lu sent a messenger with silks after hearing that Yen Ho had
    attained the Tao.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yen Ho was at the door of a mean house, dressed in coarse hempen cloth, and
    feeding a cow when the messenger arrived.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yen Ho warned the messenger that the instructions might have been misunderstood;
    after the messenger returned to verify them, Yen Ho could no longer be found.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The commentary says the true object of the Tao is regulation of the person,
    while managing state, clan, or kingdom is subordinate.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The commentary compares misguided action to using the pearl of the marquis
    of Sui to shoot a distant bird.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The translator note says a lord of Sui healed a wounded snake, and the snake
    later brought him a large pearl in its mouth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lieh Yu-khau, also identified with 3ze Lieh-3ze, is described as extremely
