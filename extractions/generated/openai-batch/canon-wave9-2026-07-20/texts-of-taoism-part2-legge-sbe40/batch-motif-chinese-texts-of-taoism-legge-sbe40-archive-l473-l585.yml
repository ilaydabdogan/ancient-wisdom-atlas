  text: Confucius cites Kwan-tze's saying that a small bag cannot contain what is
    large and a short rope cannot draw water from a deep well.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Confucius says a person's appointed lot and bodily adaptation are definite
    and cannot be augmented or diminished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Confucius fears that Hui will speak to the marquis of Khi about ancient rulers
    and figures, and that the marquis, failing to find correspondence in himself,
    will suspect and execute the speaker.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A sea-bird alights in the suburban country of Lu; the marquis meets it, takes
    it to the ancestral temple, and prepares to banquet it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Music is performed for the sea-bird, and an ox, a sheep, and a pig are killed
    to supply food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sea-bird looks dim-eyed and sad, does not eat flesh or drink, and dies
    after three days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Confucius explains that the marquis nourished the bird with what he used for
    himself rather than with nourishment proper for a bird.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The passage lists bird-appropriate conditions: deep forests, sandy plains,
