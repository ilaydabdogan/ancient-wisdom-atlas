canonical_text:
  quote: ''
  summary: Confucius grieves over Yen Yuan's journey to Khi and explains that teaching
    what a ruler cannot receive may endanger the speaker. He illustrates this with
    a sea-bird that dies after a marquis treats it to human-style music and banquet
    food rather than bird-appropriate conditions. The passage then turns to Lieh-tze,
    who encounters an old skull and reflects on life, death, and a chain of transformations
    among minute seeds and living forms.
  language: English
  quote_policy: summarized
