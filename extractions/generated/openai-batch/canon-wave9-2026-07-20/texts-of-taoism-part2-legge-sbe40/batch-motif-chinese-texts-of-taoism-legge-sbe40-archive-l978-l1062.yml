canonical_text:
  quote: ''
  summary: 'The passage contains three exempla: Duke Hwan recognizes a strange being
    described by Hwang-jze and recovers from illness; Ki Hsing-jze trains a fighting-cock
    for a king until it no longer reacts to rival birds; Confucius sees an old man
    in a dangerous cataract and learns that the man survives by long familiarity with
    the water and by following its movement.'
  language: English
  quote_policy: summarized
