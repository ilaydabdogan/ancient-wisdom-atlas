canonical_text:
  quote: Governing the world is like governing horses.
  summary: The passage analyzes Book IX as arguing that imposed government and artificial
    culture injure beings by opposing their regular nature. It compares rulers to
    horse-trainers and artisans, contrasts natural governance with the Early age of
    Perfect Virtue, and criticizes sages whose benevolence, righteousness, ceremonies,
    and music lead people away from Tao and natural guidance.
  language: English
  quote_policy: quoted
