canonical_text:
  quote: ''
  summary: Two anecdotes are presented. In the first, Lieh-jze refuses a ruler's grain
    gift after bowing to the messenger; his wife protests because the household is
    hungry, but he explains that the ruler's favor is based on hearsay and could easily
    become accusation. The passage then notes that Zze-yang is later killed by the
    people during disorder. In the second, the sheep-butcher Yueh follows King Zhao
    of Chu during exile; after the king recovers his kingdom, Yueh repeatedly refuses
    reward, court audience, and noble office, saying he has performed no service and
    should not cause the ruler to violate law or custom.
  language: English
  quote_policy: summarized
