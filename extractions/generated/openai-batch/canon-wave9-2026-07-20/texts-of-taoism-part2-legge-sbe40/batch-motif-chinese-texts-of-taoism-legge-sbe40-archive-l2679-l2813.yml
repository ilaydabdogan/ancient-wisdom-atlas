canonical_text:
  quote: ''
  summary: The supplied passage contains three linked instructional episodes. Phei-i
    praises an interlocutor who falls asleep and does not seek hidden causes. Shun
    asks whether he can possess the Tao, and Kkkng replies that body, life, nature,
    and descendants are entrusted by Heaven and Earth rather than owned. Confucius
    asks Lao Tan about the Perfect Tao; Lao Tan prescribes mental purification and
    gives an account of Tao as the source and support of cosmic and embodied processes,
    beyond knowledge and reasoning, with human life returning to its original source.
  language: English
  quote_policy: summarized
