canonical_text:
  quote: Life and death are like day and night.
  summary: 'The passage presents several reflections on death as change: a speaker
    restrains mourning for a dead woman by comparing death to the seasons; Mr. Deformed
    and Mr. One-foot encounter a tumor while viewing graves at Khwan-lun and accept
    bodily change; Kwang-tze questions a skull, sleeps with it as a pillow, and hears
    it in a dream describe death as tranquil and preferable to restored life.'
  language: English
  quote_policy: quoted
