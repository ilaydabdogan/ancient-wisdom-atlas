  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kwang-tze takes up the skull and uses it as a pillow when he goes to sleep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At midnight the skull appears to Kwang-tze in a dream and speaks about death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The skull says that after death there are no distinctions of ruler and minister,
    and no phenomena of the four seasons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The skull describes the dead as tranquil and at ease, with years like those
    of heaven and earth, enjoying more than a king in his court.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kwang-tze asks whether the skull would wish the Ruler of Destiny to restore
    its body, family, and village acquaintances.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The skull refuses the proposed restoration, saying it would not cast away
    its royal-court enjoyment to undertake again the toils of human life.
  category: speech
  evidence_refs:
  - ev:7
