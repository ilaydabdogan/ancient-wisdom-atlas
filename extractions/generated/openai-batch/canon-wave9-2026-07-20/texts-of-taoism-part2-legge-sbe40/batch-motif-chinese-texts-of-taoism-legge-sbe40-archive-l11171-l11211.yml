  quote: The spirit is the child of the breath; the breath is the mother of the spirit.
  summary: The passage instructs the addressee to maintain purity, preserve the spirit,
    and nourish the breath without interruption. It describes seven precious organs
    in the body and states that, when refined by the Great Medicine, the myriad spirits
    ascend among the Immortals. The passage then includes editorial remarks on uncertainty
    of interpretation and on later Taoism's focus on breath-preservation and long
    life.
