  quote: ''
  summary: The supplied range contains the close of an anecdote about an unnamed hidden
    disciple of the sages whom A'ung-ni/Confucius understands and whom Zze-lu finds
    absent. It then gives a Border-warden's farming analogy for government and regulation,
    followed by Kwang-jze's application of that analogy to body, mind, nature, feelings,
    and spirit through images of overgrowth and disease. The range ends with the beginning
    of an episode in which Po K'u asks Lao Tan for permission to travel and proposes
    to go to Ch'i to attend to executed criminals.
