canonical_text:
  quote: ''
  summary: The passage reflects on ordinary enjoyment versus perfect enjoyment, identifying
    the latter with doing nothing. It presents Heaven and Earth as inactive yet generative,
    producing all things through the union of their inactivities. It then recounts
    Hui-jze visiting after Awang-jze's wife dies and finding him singing while drumming
    on a basin; Awang-jze explains that, though initially affected by her death, he
    reflected on the stages by which she came from no life, form, or breath, through
    dark chaos, into breath, form, and birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says common people pursue what they call enjoyment as if unable
    to stop, while the speaker is unsure whether it is truly enjoyment.
  category: speech
  evidence_refs:
