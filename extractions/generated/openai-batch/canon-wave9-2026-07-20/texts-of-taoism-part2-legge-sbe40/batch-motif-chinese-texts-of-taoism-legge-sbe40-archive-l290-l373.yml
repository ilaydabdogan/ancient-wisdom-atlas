- id: obs:2
  text: The speaker identifies doing nothing to obtain enjoyment as great enjoyment
    and cites the saying that perfect enjoyment is without enjoyment and highest praise
    is without praise.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
- id: obs:3
  text: Heaven and Earth are described as doing nothing; Heaven thereby has serenity,
    Earth thereby has rest, and the union of their two inactivities produces all things.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:4
  text: The production of all things from Inaction is described as vast, imperceptible,
    and without visible image.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: The text asks what person can attain to the inaction attributed to Heaven
