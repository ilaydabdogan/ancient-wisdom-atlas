  text: The section is headed as concerning actions and their retributions, and it
    instructs that a person should continue in a right way and withdraw from a wrong
    one.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described good man avoids devious by-ways and secret self-deception, and
    amasses virtue and deeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The good man is described as kind toward all creatures, loyal, filial, respectful
    in family hierarchy, and careful not to hurt even insects, grass, or trees.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The good man helps others in distress and danger, regards others' gains and
    losses as his own, refrains from exposing shortcomings or boasting, stops evil,
    displays good, yields much, accepts insult without resentment, and gives without
    seeking return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that all other men respect the good man, Heaven protects
    him, happiness and emolument follow him, evil things stay far from him, spiritual
