    of three hundred.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The beginning of the bad man's description lists movements of the heart contrary
    to righteousness, conduct opposed to reason, pride in wickedness, cruelty, secret
    harm to the honest and good, slighting ruler or parents, disrespecting elders
    and teachers, deception, slander, and hypocrisy.
  category: action
  evidence_refs:
  - ev:7
