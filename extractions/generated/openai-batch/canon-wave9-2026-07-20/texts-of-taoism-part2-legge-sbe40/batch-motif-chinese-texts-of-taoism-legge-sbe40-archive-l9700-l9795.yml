canonical_text:
  quote: ''
  summary: The passage gives ethical instruction under the heading of actions and
    retributions. It describes conduct called that of a good man, the protection and
    prosperity that follow him, the possibility of becoming an immortal through a
    required number of good deeds, and the beginning of a contrasting list of bad
    conduct. A translator note compares the immortals doctrine with Buddhist Rishi/Hsien
    classifications.
  language: English
  quote_policy: summarized
