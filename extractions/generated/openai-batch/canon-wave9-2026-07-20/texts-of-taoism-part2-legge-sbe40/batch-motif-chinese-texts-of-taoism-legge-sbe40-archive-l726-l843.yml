canonical_text:
  quote: ''
  summary: 'The passage presents didactic examples about spirit, concentration, danger,
    and external attachment: a man unaffected in danger while drunk is compared with
    the sage kept in his Heavenly constitution; vengeance is redirected away from
    instruments or accidents; Kung-ni observes a hunchback who catches cicadas through
    disciplined concentration; Yen Yuan asks about a ferryman whose boat-handling
    is explained by swimmers and divers forgetting danger; an archer’s skill is said
    to falter when the prize becomes valuable; the passage ends with the beginning
    of Duke Wei’s inquiry to Thien Khai-chih about a master who studied Life.'
  language: English
  quote_policy: summarized
