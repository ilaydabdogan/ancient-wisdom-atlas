canonical_text:
  quote: ''
  summary: The passage gives a compressed sequence in which one named being comes
    from another; a ying-hsi unites with an old non-sprouting bamboo and produces
    another being, which leads successively to panther, horse, and man. Man then re-enters
    the great Machinery of Evolution, from which all things come forth at birth and
    into which they enter at death. A note relates the paragraph to Lieh-zi and describes
    it as a statement of transrotation of births.
  language: English
  quote_policy: summarized
