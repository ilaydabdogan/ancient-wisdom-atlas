  quote: that which eludes both the ears and eyes is the True Tao
  summary: The appendix introduces the Yu Shu King, or Classic of the Pivot of Jade,
    as a Taoist ritual text concerned with disciplining and refining the spirit. It
    explains the title through the North Star as the Pivot of the Sky and then quotes
    the Heaven-honoured One instructing Heaven-endowed men that the Perfect Tao is
    recondite, not apprehended by ordinary hearing or sight, and approached through
    sincerity, silence, and gentleness. Editorial notes compare Taoist honorific and
    audience terms with Buddhist and broader Chinese religious usages.
  language: English
