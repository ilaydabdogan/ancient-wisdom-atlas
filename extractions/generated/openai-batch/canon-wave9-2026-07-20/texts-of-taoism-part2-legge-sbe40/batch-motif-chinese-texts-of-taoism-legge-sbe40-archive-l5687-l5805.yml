canonical_text:
  quote: ''
  summary: The passage begins with people extracting a pearl from a dead man's mouth.
    It then narrates Lao Lai-tze's rebuke of Chung-ni for conceit, fame, praise, and
    worldly reforming zeal. A later episode tells how ruler Yuan of Sung dreams of
    a dishevelled man who says he has been caught by a fisherman; divination identifies
    this as a marvellous white tortoise, which is killed for divination despite its
    spirit-like capacities. Chung-ni comments that wisdom and spirit-like intelligence
    have limits and dangers. The passage ends with the beginning of a dialogue between
    Hui-tze and Kwang-tze on usefulness and uselessness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead person is said to have a pearl in his mouth, and people pull at his
    facial hair while inserting fine steel at the chin to separate the jaws without
    injuring the pearl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A disciple of Lao Lai-tze, while gathering firewood, meets Chung-ni and reports
    his unusual bodily proportions, slight hump, ears set far back, and appearance
    of being occupied with affairs within the four seas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lao Lai-tze identifies the man as K'iu, summons him, and tells him to put
    away personal conceit and airs of wisdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lao Lai-tze criticizes Chung-ni's wish to lead people through fame, bind them
    by secret art, praise Yao, and condemn Chieh; he advises forgetting both Yao and
    Chieh and says Chung-ni's conduct is affectation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ruler Yuan of Sung dreams at midnight that a dishevelled-haired man peeps
    in at a side door and says he was travelling from the abyss of Tsai-lu, commissioned
    by the Clear Kiang to go to the Earl of the Ho, but has been caught by fisherman
    Yu Ju.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A diviner interprets the dream as concerning a marvellous tortoise, and Yu
    Ju reports that he has caught a white tortoise in his net.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ruler Yuan repeatedly wavers between killing the tortoise and keeping it alive;
    divination says killing it for divining will be fortunate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The tortoise is cut open and its shell is perforated in seventy-two places,
    with no divining slip failing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Chung-ni says the spirit-like tortoise could appear in a dream and respond
    unfailingly through seventy-two perforations, yet could not avoid Yu Ju's net
    or the agony of being opened.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chung-ni states that wisdom has perils, spirit-like intelligence does not
    reach everything, and that small wisdom and skilfulness should be put away so
    that greater or natural wisdom may appear.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hui-tze says Kwang-tze speaks of what is of no use, and Kwang-tze replies
    that knowledge of what is not useful is needed before speaking of what is useful.
  category: speech
  evidence_refs:
  - ev:9
