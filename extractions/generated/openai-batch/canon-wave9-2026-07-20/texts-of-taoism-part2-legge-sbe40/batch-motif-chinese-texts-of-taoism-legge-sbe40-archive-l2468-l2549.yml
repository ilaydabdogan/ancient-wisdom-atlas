canonical_text:
  quote: ''
  summary: Knowledge travels through metaphorically named regions and heights seeking
    to know, rest in, and possess the Tao. Dumb Inaction gives no answer; Heedless
    Blurter intends to answer but forgets; Hwang-Ti answers by negating deliberate
    thought, fixed dwelling, action, starting point, and path, and says true knowing
    does not speak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Knowledge rambles north to the region of the Dark Water and ascends the height
    of Imperceptible Slope, where he meets Dumb Inaction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Knowledge asks Dumb Inaction three questions about the process for knowing
    the Tao, where and how to rest in it, and how to start and what path to pursue
    to make it his own.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dumb Inaction gives no reply and is said not to know how to answer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Knowledge returns south of the Bright Water, ascends the height of the End
    of Doubt, sees Heedless Blurter, and puts the same questions to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heedless Blurter says he knows and will tell Knowledge, but forgets what he
    wanted to say before speaking further.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Knowledge goes to the palace of the Ti, sees Hwang-Ti, and asks him the same
    questions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hwang-Ti answers that no thought and no anxious consideration, dwelling nowhere
    and doing nothing, and starting from nowhere and pursuing no path are the first
    steps toward knowing, resting in, and making the Tao one's own.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hwang-Ti says Dumb Inaction is truly right, Heedless Blurter only appears
    to be right, and that he and Knowledge are not near being right.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hwang-Ti cites sayings that those who know the Tao do not speak of it, those
    who speak of it do not know it, and the sage conveys instructions without speech.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The supplied notes state that the names of persons and places in the passage
    are metaphorical and Taoistic.
  category: attribute
  evidence_refs:
  - ev:5
