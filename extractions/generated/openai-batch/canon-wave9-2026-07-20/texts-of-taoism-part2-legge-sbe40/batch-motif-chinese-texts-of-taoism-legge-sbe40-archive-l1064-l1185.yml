canonical_text:
  quote: ''
  summary: 'The passage gives several anecdotes and aphorisms about skilled action,
    fitness, restraint, and fate: Khing explains how fasting and self-forgetfulness
    led to a bell-stand shaped through meeting the right tree; Tung-ye Ki''s horses
    break down after being overdriven for display; Shui''s craft is described as exact
    without conscious mental effort; an aphorism compares true fitness to a shoe or
    girdle that is not noticed; Sun Hsiu begins a complaint about neglect, rejection,
    and fate before Zze-pien Khing-ze.'
  language: English
  quote_policy: summarized
