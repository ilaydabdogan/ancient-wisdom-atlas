- id: motif:2
  label: quest for the Tao with encounter of a wise child
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Hwang-Ti travels with six attending sages in quest of the Tao and meets a
    wise boy herding horses.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only the episode heading is available; the boy’s exact teaching or function
    is not given in this passage.
- id: motif:3
  label: rejected comparison to exemplary predecessors
  taxonomy_refs:
  - wisdom
  basis: Kang-sang’s disciples liken him to Yao and Shun, and he repudiates the comparison.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage names the repudiation but does not preserve the dialogue or
    its rationale.
- id: motif:4
  label: masterful feat refused on a living subject
