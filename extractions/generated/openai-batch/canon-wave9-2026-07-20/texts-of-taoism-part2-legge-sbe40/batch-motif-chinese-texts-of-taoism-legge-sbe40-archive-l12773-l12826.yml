  cautions: The content of the lesson is not provided in the passage.
- id: motif:7
  label: trance as supreme Taoist attainment
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage states that trance is the highest result of the Tao and that
    a practical lesson is to be drawn from it.
  evidence_refs:
