  quote: ''
  summary: A table-like list of narratives from Books XXIII and XXIV names episodes
    involving Kang-sang, Lao-tze, Nan-yung, Hsu Wu-kwei, Hwang-Ti, Chuang-tze, Hui-tze,
    artisan Shih, Kwan Tung, rulers, attendants, a wise boy herding horses, a crafty
    monkey, trance, Confucius, a physiognomist, and Hsu Yu fleeing Yao’s court.
  language: English
  quote_policy: summarized
