canonical_text:
  quote: ''
  summary: The passage first concludes an argument about rulers and recluses who decline
    wealth or power to avoid injury to life and nature, followed by a dialogue in
    which Dissatisfied criticizes self-denial for reputation and Know-the-Mean describes
    excessive wealth as disorder, suffering, disease, disgrace, sadness, alarm, and
    delusion. The passage then begins Book XXX with King Wan of Zhao delighting in
    sword-fighting spectacles by thousands of swordmasters; many die or are wounded,
    the kingdom declines, and Crown-Prince Khwei offers a reward for someone who can
    persuade the king to end the swordsmen.
  language: English
  quote_policy: summarized
