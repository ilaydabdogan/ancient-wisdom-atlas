canonical_text:
  quote: ''
  summary: Kang-sang Khî, a disciple of Lao Tan, lives at the hill of Wei-lei, rejects
    clever or officious attendants, and after three years the local people prosper
    and wish to venerate him with offerings and an altar. Kang-sang is dissatisfied
    with this, explaining through seasonal, Taoist, and animal analogies that the
    perfected or life-preserving person remains concealed rather than becoming a public
    model. His disciples urge him to accept honor by citing the practice of honoring
    the wise and able, but he rejects praise of Yao and Shun and warns that elevating
    talented people produces disorder.
  language: English
  quote_policy: summarized
