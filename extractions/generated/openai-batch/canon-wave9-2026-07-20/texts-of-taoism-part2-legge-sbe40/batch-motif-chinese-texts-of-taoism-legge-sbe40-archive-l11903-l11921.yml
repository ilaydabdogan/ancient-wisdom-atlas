canonical_text:
  quote: '"Rip your skin from your body, cleanse your heart, and put away your desires"'
  summary: The passage analyzes Book XX as teaching that human afflictions arise from
    shallow attainment in the Tao and Its Attributes. The Tao with Its Attributes
    is called the Author of all things. Following its transformations is contrasted
    with concern for qualities of things and human relations, which bring disaster
    and blame. The seeker must empty himself, remove desires, then enjoy himself in
    the land of Great Vacuity, attain a status represented by an empty vessel, and
    escape the evils associated with the fox and leopard.
  language: English
  quote_policy: quoted
