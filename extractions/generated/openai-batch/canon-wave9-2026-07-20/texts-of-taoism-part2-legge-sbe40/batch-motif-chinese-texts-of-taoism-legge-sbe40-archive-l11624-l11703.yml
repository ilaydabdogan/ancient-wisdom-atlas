canonical_text:
  quote: ''
  summary: The passage analyzes Book VI of Zhuangzi as teaching the difficulty and
    possible ease of attaining the Tao. It summarizes examples of staged inward practice,
    bodily and cosmic transformation imagery, mental unconsciousness, separation of
    body and mind, union with the Great Pervader, acceptance of Destiny, and literary
    praise of the book through images of elixir, jade pestle, feathers, water, granary,
    woods, and leopard spots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that getting the Tao is difficult and describes one account
    as involving sage talent, study, and stages of attainment after three, seven,
    and nine days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The learner is described as moving from banishing worldly matters, to disregarding
    time, to inwardness, to understanding death and life as phenomena.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator is said to have learned from writings and from Lo-sung, searching
    more remote sources.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: 3ze-yu is described as speaking of one arm becoming a fowl, another a cross-bow,
    his rump-bone a wheel, his spirit a horse, and a life-cord being loosened.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 3ze-li asks 3ze-lai about being made the liver of a rat or the arm of an insect,
    and the passage connects this with a remark about a founder's furnace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 3ze-fan and Kkm Kang are said to have got the Tao and to disport in the one
