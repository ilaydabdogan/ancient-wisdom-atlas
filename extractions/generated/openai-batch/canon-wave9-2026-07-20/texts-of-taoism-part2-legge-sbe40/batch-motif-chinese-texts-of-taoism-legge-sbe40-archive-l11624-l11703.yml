candidate_motifs:
- id: motif:1
  label: Staged acquisition of the Tao through inward withdrawal
  taxonomy_refs:
  - mystical_quest
  - initiation
  - wisdom
  basis: The passage describes timed degrees of attainment, rejection of worldly matters,
    disregard of time, inward movement, and comprehension of life and death as phenomena.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is an analytical summary of earlier paragraphs rather than
    a direct narrative scene.
- id: motif:2
  label: Bodily and spiritual transformation into animal, tool, and vehicle forms
  taxonomy_refs:
  - shapeshifter
  basis: 3ze-yu's body parts and spirit are described as becoming a fowl, cross-bow,
    wheel, and horse; 3ze-li and 3ze-lai discuss becoming a rat's liver or insect's
    arm.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The wording is reported as speech and may be figurative within the Taoist
    analysis.
- id: motif:3
  label: Life and death relativized as phenomena
  taxonomy_refs:
  - duality
  - annihilation_union
  basis: The learner comes to understand that neither death nor life is more than
    a phenomenon, and 3ze-yu's imagery includes a cord by which life is suspended.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage treats this as doctrinal understanding, not as a narrated
    death or rebirth event.
- id: motif:4
  label: Forgetting body, mind, and knowledge to unite with a greater reality
  taxonomy_refs:
  - annihilation_union
  - mystical_quest
  - wisdom
  basis: Yen Hui separates body and mind, puts away knowledge, and becomes one with
    the Great Pervader; other examples stress mental unconsciousness and obliviousness.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is expressed through philosophical analysis and named exemplars.
- id: motif:5
  label: Cosmic participation in the one vital ether
  taxonomy_refs:
  - annihilation_union
  basis: 3ze-fan and Kkm Kang are described as disporting in the one vital ether of
    heaven and earth after getting the Tao.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The phrase is brief and embedded in an analytical list of examples.
- id: motif:6
  label: Elixir that confers transformation
  taxonomy_refs:
  - shapeshifter
  basis: The Book is praised as a wonderful Elixir produced by a jade pestle, whose
    touch produces feathers of Transformation.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This appears in a rhetorical praise of the Book and may be metaphorical
    literary imagery rather than a ritual episode.
- id: motif:7
  label: Acceptance of Destiny through obliviousness
  taxonomy_refs:
  - wisdom
  basis: 3ze-sang ascribes his miserable condition to Destiny and is described as
    exhibiting the highest obliviousness and True Knowledge.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives only a compressed analytical description of the episode.
