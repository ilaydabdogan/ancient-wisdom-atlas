canonical_text:
  quote: ''
  summary: In a first-person speech, a speaker lists celebrated rulers, reputed men
    of virtue, and loyal ministers whose conduct or deaths he treats as shameful,
    fame-bound, or life-denying. He then states that human life is short, that the
    senses and will seek gratification, and that one should nourish natural longevity
    rather than follow the addressee's admonitory Way.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the world exalts Hwang-Ti, but that he fought in the wilderness
    of Ao-lu until blood flowed over a hundred li.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yao, Shun, Yu, Thang, King Wu, and King Wan are named with acts or conditions
    including unkindness to a son, lack of filiality, paralysis, banishing a sovereign,
    smiting Aau, and imprisonment in Yu-li.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker concludes that these highly regarded figures disallowed their
    true nature for gain and did violence to its proper qualities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Po-I and Shu-kh declined the rule of Ku-chu and died of starvation on Shau-yang
    hill, leaving their bones and flesh unburied.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pao Jiao died with his arms around a tree, and Shan-thu Ti fastened a stone
    to his back, threw himself into the Ho, and was eaten by fishes and turtles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kieh 3ze-thui cut flesh from his thigh to feed duke Wan and later, after being
    overlooked, went away and was burned to death with a tree in his arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wei Shang waited under a bridge for a girl who did not arrive; when water
    rose, he stayed and died holding a bridge pillar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaker compares these deaths to a torn dog, a pig carried off by a current,
    and a drowned beggar, and says the men were caught by desire for fame rather than
    caring to nourish life to its end.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Prince Pi-kan and Wu 3ze-hsu are called faithful or loyal ministers; Wu 3ze-hsu's
    dead body was cast into the Khiang, and Pi-kan's heart was cut out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says he cannot know anything about the state of the dead, while
    the affairs of living men are exemplified by the cases he has listed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker states that the eyes wish to see beauty, the ears to hear music,
    the mouth to enjoy flavours, and the will to be gratified.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker gives human longevity as one hundred, eighty, or sixty years,
    says laughing days are few, contrasts human death with the unlimited duration
    of heaven and earth, and compares limited life to the passing of one of king Mu's
    horses by a crevice.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The speaker says those who cannot gratify their will and natural aims or nourish
    their appointed longevity are unacquainted with the right Way, and he tells the
    addressee to leave and say no more.
  category: speech
  evidence_refs:
  - ev:7
