canonical_text:
  quote: ''
  summary: A fragment refers to passing through Three Regions and ascending to a Golden
    Gate. Legge comments on the Classic of Purity, its relation to older Taoist texts,
    and terms such as Royal-mother of the West and Divine Ruler. The translated text
    presents Lao the Master teaching that the Great Tao is formless, passionless,
    nameless, and productive of heaven, earth, the sun and moon, and all things. It
    then describes Tao in paired forms and conditions—Pure and Turbid, Motion and
    Rest—correlated with heaven and earth and masculine and feminine, and concludes
    that constant human purity and stillness would make heaven and earth revert to
    non-existence.
  language: English
  quote_policy: summarized
