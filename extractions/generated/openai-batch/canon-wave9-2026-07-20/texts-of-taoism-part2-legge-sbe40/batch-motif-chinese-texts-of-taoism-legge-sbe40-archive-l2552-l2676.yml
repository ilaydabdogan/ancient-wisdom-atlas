canonical_text:
  quote: ''
  summary: The passage presents Daoist reflections on the loss of Tao, the practice
    of diminishing action into non-action, the difficulty of returning a fashioned
    object to its original materials, the mutual transformation of life and death
    through breath, a dialogue in which non-knowing and forgetting are valued over
    knowing, the silent operations of Heaven, Earth, seasons, and things, and instruction
    on seeking Tao through bodily ordering, unified attention, and childlike simplicity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage gives a sequence in which the loss of Tao is followed by Characteristics,
    Benevolence, Righteousness, and Ceremonies; ceremonies are described as flowers
    of Tao and the beginning of disorder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Practising Tao is described as daily diminishing doing until arriving at non-action,
    after which nothing is left undone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A regularly fashioned utensil is used as an example of something difficult
    to return to the original condition of its materials; only the Great Man is said
    to accomplish this easily.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Life and death are said to follow one another; life occurs when breath is
    collected, and death when breath is dispersed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The foetid and putrid are said to transform into the spirit-like and wonderful,
    and the spirit-like and wonderful into the foetid and putrid; the passage then
    speaks of one breath of life under the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Knowledge reports asking Dumb Inaction, Heedless Blurter, and Hwang-Ti; Dumb
    Inaction does not answer, Heedless Blurter forgets the questions, and Hwang-Ti
    knows about them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hwang-Ti says Dumb Inaction was truly right because he did not know, Heedless
    Blurter was nearly right because he forgot, and Hwang-Ti and Knowledge are not
    nearly right because they know.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Heaven and Earth are said to operate admirably without speaking; the four
    seasons observe laws without discussion; all things have constitutions without
    speaking.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sages trace the operations of Heaven and Earth; the Perfect Man is said to
    do nothing and the Greatest Sage to originate nothing, taking Heaven and Earth
    as models.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: All beings, whether dead or living, square or round, are said not to understand
    their root and origin, yet to preserve their being by it from ancient times.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The six cardinal points, an autumn hair, the rising and descending of things,
