canonical_text:
  quote: ''
  summary: The passage opens with an aphoristic statement contrasting personal attraction
    and affection with sympathy and example, and rejecting dependence on external
    forms. It then presents Zwang-3ze in poor clothing before the king of Wei, distinguishing
    poverty from distress and using a monkey among suitable trees and thorny trees
    as an analogy for fitness of situation. A second anecdote shows Confucius in hardship
    between Khan and Khai, without cooked food for seven days, singing while striking
    decayed wood, and instructing Yen Hui on accepting hardships as the doings of
    Heaven and Earth while treating human office and emolument as external appointed
    goods. The passage ends within a swallow analogy about avoiding unsuitable places.
  language: English
  quote_policy: summarized
