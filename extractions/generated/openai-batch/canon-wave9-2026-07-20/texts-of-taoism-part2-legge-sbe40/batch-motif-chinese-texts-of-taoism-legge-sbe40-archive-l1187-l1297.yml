canonical_text:
  quote: ''
  summary: 'Pien-jze describes the perfect man and reproves Sun-jze/Hsiu for displaying
    wisdom and murmuring against Heaven. After the visitor leaves, Pien-jze fears
    that his teaching may have frightened him and explains through parables: a bird
    in Lu is distressed by royal feasting and music because it is nourished as a human
    rather than as a bird; teaching Hsiu about the perfect man is compared to conveying
    a mouse with carriage and horses or delighting a quail with bells and drums. The
    passage then begins Book XX: Zhuangzi sees a great useless tree spared by a woodcutter,
    then at a friend''s house hears that the non-cackling goose is to be killed, prompting
    disciples to ask about the opposing fates of uselessness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pien-jze says the perfect man forgets liver and gall, takes no thought of
    ears and eyes, is beyond worldly dust, acts without relying on action, and does
    not use superiority to control.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pien-jze accuses the listener of displaying wisdom, cultivating himself to
    show others' inferiority, and seeking to shine like someone carrying the sun and
    moon in his hands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pien-jze tells the listener that bodily wholeness and escape from calamities
    such as deafness, blindness, or lameness are fortunate, and asks what leisure
    he has to murmur against Heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Sun-jze leaves, Pien-jze goes inside, sits down, looks up to heaven,
    sighs, and tells his disciples he fears Hsiu will be frightened and perplexed
    by the teaching.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pien-jze's disciples argue that if Pien-jze was right, his words should not
    be blamed for the visitor's perplexity, and if the visitor was already wrong,
    perplexity was why he came.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pien-jze recounts that a bird came to the suburbs of Lu; the ruler of Lu honored
    it with an ox, a sheep, a pig, and music, but the bird became sad, dazed, and
    would not eat or drink.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Pien-jze says a bird should be nourished as a bird: allowed to perch in deep
    forest, float on a river or lake, or find food naturally and undisturbed on level
    dry ground.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Pien-jze compares his instruction of Hsiu to using carriage and horses for
    a mouse or trying to delight a quail with bells and drums.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Zhuangzi, walking on a mountain, sees a large tree with huge branches and
    luxuriant foliage; a wood-cutter rests beside it but will not cut it because it
    is of no use.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Zhuangzi tells his disciples that the useless tree will succeed in living
    out its natural term of years.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: At an old friend's house, a waiting-lad asks whether to kill the goose that
    can cackle or the one that cannot; the host orders the non-cackling goose killed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Zhuangzi's disciples contrast the tree's survival through uselessness with
    the goose's death through lack of ability, and ask which condition the Master
    would prefer.
  category: speech
  evidence_refs:
  - ev:11
