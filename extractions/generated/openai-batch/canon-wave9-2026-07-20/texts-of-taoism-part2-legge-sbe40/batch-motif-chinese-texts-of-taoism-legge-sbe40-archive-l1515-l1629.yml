canonical_text:
  quote: ''
  summary: The passage warns against conspicuous wisdom, merit, fame, and visible
    self-cultivation, contrasting them with the hidden and trace-effacing conduct
    of the perfect person of Tao. Confucius accepts the admonition, leaves associates
    and disciples, retires near a marsh, lives simply, and moves among animals and
    birds without disturbing them. In a later exchange, Confucius asks 3ze-sang Hu
    why repeated calamities and social dispersal have befallen him. 3ze-sang Hu answers
    with the story of Lin Hui, who fled while abandoning a valuable jade rank-token
    and carrying his infant son, explaining that the token was tied to gain while
    the child was tied to Heaven's appointment. The passage then contrasts gain-based
    bonds, which fail under hardship, with Heaven-appointed bonds, which endure, and
    compares superior men's intercourse to tasteless water and mean men's intercourse
    to sweet new wine. Confucius receives the instruction, returns home, stops formal
    study, puts away his books, and his disciples cease formal attendance while their
    affection increases. A fragment begins with Sang Hu citing Shun's deathbed charge
    to Yu.
  language: English
  quote_policy: summarized
