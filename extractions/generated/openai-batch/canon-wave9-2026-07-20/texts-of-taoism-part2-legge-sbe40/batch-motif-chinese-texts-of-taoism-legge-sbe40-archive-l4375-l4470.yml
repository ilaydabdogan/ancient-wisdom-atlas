    on such an occasion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: K'ung-ni says he has heard of speech without words, has never spoken it, and
    will do so now.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: I-liao of Shih-nan quietly handles his little spheres, and the difficulties
