canonical_text:
  quote: ''
  summary: 'The passage contains several didactic anecdotes: a monkey’s artfulness
    and arrogance become a warning to Yen Pu-i, who studies under Tung Wu and abandons
    pride; Nan-po Tzu-kh''i explains his withdrawn condition by recalling former self-display
    and worldly recognition; and K''ung-ni, Sun Shu-ao, and I-liao of Shih-nan appear
    in a ceremonial scene about wine, libation, speech without words, quiet handling
    of spheres, and effects achieved without overt action.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monkey is described as displaying artfulness, trusting in agility, and showing
    arrogance, which is said to have brought it to its fate.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yen Pu-i is warned to take the monkey as a warning and not give himself haughty
    airs by his looks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yen Pu-i returns home, studies under Tung Wu to root up his pride, puts away
    what he delighted in, abjures distinction, and after three years is admired by
    the people of the kingdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nan-po Tzu-kh'i is seated, leaning forward on his stool, sighing gently, and
    looking up to heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yen Chang-tze enters, calls Nan-po Tzu-kh'i master, and asks whether it is
    right to make his body like withered bones and his mind like slaked lime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nan-po Tzu-kh'i says he formerly lived in a grotto on a hill, and that Thien
    Ho once came to see him while the multitudes of Khi congratulated Thien Ho three
    times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nan-po Tzu-kh'i says he must first have shown and sold what he had, otherwise
    Thien Ho would not have known or come to buy him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nan-po Tzu-kh'i says he pities men who lose themselves, men who pity others,
    and men who pity those who pity others.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: K'ung-ni goes to Khü, where the king orders wine to be presented to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sun Shu-ao stands holding a goblet; I-liao of Shih-nan receives a cup, pours
