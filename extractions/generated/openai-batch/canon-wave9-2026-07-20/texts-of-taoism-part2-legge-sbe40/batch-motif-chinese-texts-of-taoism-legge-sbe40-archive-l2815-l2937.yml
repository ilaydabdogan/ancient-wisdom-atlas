canonical_text:
  quote: By a transformation they live, and by another transformation they die.
  summary: The passage describes the sage as responding harmoniously to changing human
    classifications, presents life and death as transformations and a return home
    to incorporeity, warns that the Tao is not grasped by discussion or hearing, and
    then gives a dialogue in which A'wang-jze tells Tung-kwo that the Tao is everywhere,
    including lowly things. A'wang-jze further describes the Tao as one, all-embracing,
    unbounded, and the producer of paired conditions while not being identical with
    them. The passage closes with the beginning of a new note that A-ho Kan and Shan
    Nang studied together.
  language: English
  quote_policy: quoted
