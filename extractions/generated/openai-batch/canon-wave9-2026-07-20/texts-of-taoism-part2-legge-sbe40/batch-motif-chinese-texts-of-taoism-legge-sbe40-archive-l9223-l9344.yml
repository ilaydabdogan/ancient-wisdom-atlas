canonical_text:
  quote: The Great Tao embraces all things, but It does not discriminate between them.
  summary: 'The passage describes several ancient Taoist-associated teachings: impartial
    conduct, non-selection, non-aggression, few desires, the limits of Heaven and
    Earth, the all-embracing non-discrimination of the Tao, Shan Tao''s rejection
    of knowledge and self-assertion, critical remarks on Shan Tao and Thien Phien,
    and the beginning of a further section that treats the root as essential and things
    as coarse embodiments.'
  language: English
  quote_policy: quoted
