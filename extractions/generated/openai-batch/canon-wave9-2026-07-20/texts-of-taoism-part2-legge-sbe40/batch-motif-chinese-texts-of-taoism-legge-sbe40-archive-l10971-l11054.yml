canonical_text:
  quote: ''
  summary: The passage describes progressive knowledge and practice of the Tao, culminating
    in True Forgetfulness and unity with the Tao. The Heaven-honoured One presents
    the treatise for Heaven-endowed men, promises ascent to the seats of the Immortals
    for those who understand it, and explains ether, destiny, heavenly restraints,
    and spontaneous transformation through acquiring the True Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage refers to forgetting bodily form, personality, and the fact of
    forgetting; Li Hsi-yueh calls this vacuity and freedom from purpose characteristic
    of the Tao, and the note directs comparison to a paragraph in the sixth Book of
    Kwang-jze.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A practitioner who begins toward knowledge of the Tao knows where to stop;
    one who maintains the Tao is vigilant; one who employs it knows what is subtle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives a sequence in which subtle knowledge, vigilance, completed
    sage wisdom, restful composure, and growing light of intelligence lead to being
    one with the Tao.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The condition reached is named True Forgetfulness, described as a forgetting
    that does not forget and a forgetting of what cannot be forgotten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The True Tao is said to be in heaven and earth, while heaven and earth are
    not conscious of it; whether it seems to have feelings or not, it remains one
    and the same.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Heaven-honoured One says he is in the world to benefit life and occupies
    himself with the subtle and precious Treatise for Heaven-endowed men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those who understand the treatise are said to be allowed to ascend to the
    happy seats of the Immortals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Students of the Tao are described as believing in influences of ether and
    destiny, with climate, wisdom, stupidity, fineness, coarseness, fate, and Heaven
    used to explain human constitutions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The restraints arising from ether and destiny are called manacles decreed
    by Heaven, but acquiring the True Tao can make the stupid wise and the coarse
    fine if fate decrees it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dark stupidity and dense coarseness are said to be consequences of climate,
    but they can change when Heaven and Earth quicken the motive spring; this is described
    as spontaneous, and the mystery of spontaneity is said to exceed knowledge.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Tao is said not to have come under the influence of what makes stupid
    and coarse, and the Heaven-endowed men and the multitude in all quarters are addressed
    with a call to rejoice.
  category: speech
  evidence_refs:
  - ev:7
