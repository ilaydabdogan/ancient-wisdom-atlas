- id: obs:7
  text: The brothers looked at each other, laughed, and declared that the covenant
    was not what they called the Right Way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The brothers described Shan Nang as a former ruler who sacrificed at proper
    seasons without praying for blessing and governed sincerely without seeking anything
    for himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The brothers criticized the current ruling power for using bribes, troops,
    covenants over victims, public display, killing, and attacks for gain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The brothers chose to abandon the political order, went north to Shiu-yang
    hill, and died of starvation there.
  category: sequence
  evidence_refs:
  - ev:8
