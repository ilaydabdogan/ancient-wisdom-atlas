canonical_text:
  quote: ''
  summary: The passage presents two episodes of refusing political honor or alliance.
    Wla Kwang refuses Thang's offer of the throne and drowns himself with a stone
    in the Lii water. Po-i and Shti-z^/^i, two brothers from Ku-chu, travel toward
    a western ruler said to follow the Right Way, but reject King W6's covenant offer
    of rank and wealth after a victim-blood ritual. They contrast this with Shan Nang's
    older model of rule and sacrifice, criticize the current regime's violence and
    covenants, withdraw north to Shiu-yang hill, and die of starvation.
  language: English
  quote_policy: summarized
