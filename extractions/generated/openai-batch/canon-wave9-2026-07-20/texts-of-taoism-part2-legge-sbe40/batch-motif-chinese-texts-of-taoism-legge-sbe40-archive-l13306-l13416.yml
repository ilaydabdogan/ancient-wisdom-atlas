canonical_text:
  quote: ''
  summary: A hymnic passage from the Stone Tablet to Lao-sze describes disorder in
    the land, the birth and extraordinary attributes of the True Man identified in
    a note as Lao-sze, his wide travel by black oxen and the opening of grottoes to
    him, later traces and ruined cult sites near the Ko, and an emperor whose sage
    rule brings cosmic brightness, reverence from spirits, tribute from distant beings
    and rulers, and social order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening lines describe wine-cups and stands, shields and spears filling
    the country, close-meshed nets scaring fish, and bows alarming birds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The True Man is said to be born while a star shines down beneath the Bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The True Man is described as graced by dragon gifts, with hair compared to
    stork plumage, brightness compared to the sun and moon, and endurance compared
    to heaven and earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the True Man resolved what was complicated, made the sharp
    blunt, rejected the mean, and chose the generous.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The five mountains seem small and the nine regions narrow to the True Man;
    he travels far in a carriage drawn by black oxen amid bright purple air, and grottoes
    open to him as unseen spirit power flows forth.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The village near the stream of Ko is said to retain traces of him, while his
    temple, altar, nine wells, and twin tablets are described as ruined, empty, overgrown,
    or reduced to heaps of stone.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The emperor is described as called to rule, spirit-like and sage; bells reverberate,
    light falls on the heavenly mirror, the universe shines, portents are swept away,
    and spirits come to take law from him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Creatures and people from distant places, including desert sands, great trees,
    phoenix caves, and dragon woods, come sincerely; men of all regions give their
    hearts, and kings present or describe rare things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The emperor's transforming power is said to make the tripods sure and to make
    families polite and courteous.
  category: action
  evidence_refs:
  - ev:9
