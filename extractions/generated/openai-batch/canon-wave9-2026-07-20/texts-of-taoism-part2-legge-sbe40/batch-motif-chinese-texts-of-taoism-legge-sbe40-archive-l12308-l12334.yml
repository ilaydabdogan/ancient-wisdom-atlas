canonical_text:
  quote: ''
  summary: An appendix catalogues narratives, apologues, and stories in Book I of
    the writings of Awang-jze, listing brief topics such as vast creatures enjoying
    the Tao, smaller creatures making foolish judgments, questions about the Tao in
    different men, an attempted resignation of the throne, discussions of the ideal
    Taoist, visits to Perfect ones, and object-centered examples involving calabashes,
    salve, and a great Ailanthus tree.
  language: English
