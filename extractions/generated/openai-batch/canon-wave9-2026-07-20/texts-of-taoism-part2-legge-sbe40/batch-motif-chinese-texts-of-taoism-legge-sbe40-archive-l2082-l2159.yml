canonical_text:
  quote: ''
  summary: In a dialogue involving Confucius and Lao Tan, the passage describes Yin
    and Yang, Heaven and Earth, and paired processes such as decay and growth, darkness
    and light, life and death, and beginning and ending. Lao Tan says that comprehending
    these transformations is admirable and enjoyable and constitutes the Perfect man.
    He uses animals changing pasture or water as examples of small change without
    loss of nature, presents all things as sharing unity, compares death and life
    to day and night, and says those who attain the Tao are not troubled by transformations,
    gains, losses, rank, calamity, or happiness.
  language: English
  quote_policy: summarized
