  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says things enter and take possession of one who tries to know
    them exhaustively, while indifference prevents lodgment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says denying lodgment to other men leaves a person cut off from
