canonical_text:
  quote: The door of Heaven is Non-Existence. All things come from non-existence.
  summary: The passage contrasts inward self-rule with pursuit of name and acquisition,
    warns that will and mind create harmful attachment, and presents a cosmological
    account in which life, death, coming forth, and entering are related to Non-Existence,
    the “door of Heaven.” It closes by describing ancient views about the beginning
    as nothing, or about existence, life as perishing, and death as return.
  language: English
  quote_policy: quoted
