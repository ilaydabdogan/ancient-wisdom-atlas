  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: The commentary compares the book's teaching with the Confucian Analects saying
    that one did nothing and yet governed efficiently.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: The final paragraph describes the book's style through images of musical pauses,
    smoke, clouds, and the author's teeming mind.
  category: attribute
  evidence_refs:
  - ev:5
