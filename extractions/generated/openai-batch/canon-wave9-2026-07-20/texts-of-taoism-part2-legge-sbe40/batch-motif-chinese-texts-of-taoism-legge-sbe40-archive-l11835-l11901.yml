canonical_text:
  quote: ''
  summary: An analytical passage on a book of Zwang-3ze presents Kiang's counsel to
    nourish agreement with the primal ether, allow things to return to their root,
    avoid anxiety over natural disorder, and practice non-interference. It contrasts
    the Superior or Great man with ordinary men who seek to overcome others, describes
    Tao-aligned governance through doing nothing, and comments that this theme is
    not Buddhist Extinction while resembling a saying from the Confucian Analects
    about governing by doing nothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kiang counsels nourishing a great agreement with the primal ether and says
    things return to their root without knowing it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kiang lists night-singing birds, withering vegetation, and insects overtaken
    by disaster as matters that do not require anxiety.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kiang counsels doing nothing, resting in human nature, and not interfering
    with the minds of men; this is described as an influence that attracts and gathers
    all things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Superior man is described as letting the world have its own course in
    a generous way, which ordinary men cannot fathom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ordinary men who speak of governing examine distinctions between others and
    themselves, seek to overcome others, and end by being overcome by others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great man responds to others according to their qualities without selfish
    purpose, and his power becomes nothing in his own view.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the Great man, having and not having make no difference in use.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Great man does nothing, may still be obliged to act, and when he acts
    no one sees that he has acted, making the action equivalent to non-action.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage says Tao includes both Heavenly and Human elements, and that actual
    government has Lord and Minister in accordance with this.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The commentary identifies the thread of the book as 'Doing Nothing' and says
