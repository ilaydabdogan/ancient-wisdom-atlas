canonical_text:
  quote: ''
  summary: 'A translator note frames the preceding Ta-kwei and horseherd-boy passage
    as parabolic. In the narrative continuation, a little lad speaks of roaming beyond
    the spatial confines and answers Hwang-Ti''s question about governing by comparing
    rule to tending horses: one removes what would injure them. Hwang-Ti bows and
    calls the lad his Heavenly Master. The following section criticizes specialists,
    officials, workers, and ambitious people as constrained by external things and
    failing to return to their proper selves. A new saying of A''wang-jze begins with
    an archer who may hit the mark without prior aim.'
  language: English
  quote_policy: summarized
