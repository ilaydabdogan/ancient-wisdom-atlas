canonical_text:
  quote: ''
  summary: A dialogue explains the phrase “The Talk of the Hamlets and Villages” by
    comparing social customs and the Great man to composite wholes formed from diverse
    parts. The speaker uses examples of a horse, hills, rivers, seasons, offices,
    peace and war, marshes, and hills to describe unity, difference, alternation,
    and impartiality. The passage then distinguishes this talk from the Tao, which
    is common to Heaven and Earth, Yin and Yang, and the myriad things, yet is nameless
    and inactive.
  language: English
  quote_policy: summarized
