canonical_text:
  quote: ''
  summary: The passage opens Book XXIX, Part III, Section VII, titled for Tao K'ih,
    the robber. It says Confucius was friendly with Liu-hsia Ki, whose brother Tao
    K'ih led 9,000 followers through the kingdom. The group oppressed princes, broke
    into houses, stole cattle and horses, carried off wives and daughters, disregarded
    kinship and ancestral rites, and caused larger and smaller states to defend themselves.
    Confucius then begins speaking to Liu-hsia Ki about paternal authority. A source
    note identifies Liu-hsia Ki with Liu-hsia Hui and calls the stated friendship
    with Confucius an anachronism.
  language: English
  quote_policy: summarized
