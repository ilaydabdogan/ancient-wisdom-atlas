canonical_text:
  quote: "“That stranger is a Great man. An (ordinary) sage is not equal to him.”"
  summary: A visitor leads a king to view his own kingdom and person as insignificant
    within an illimitable scale and indistinct from a king of Stupidity. After the
    visitor leaves, the king calls him a Great man, and Hui-jze uses a flute and sword-hilt
    analogy to say that even praise of Yao and Shun would sound inadequate before
    him. A new scene begins with Confucius lodging at Ant-hill, where a neighboring
    household appears on a roof.
  language: English
  quote_policy: quoted
