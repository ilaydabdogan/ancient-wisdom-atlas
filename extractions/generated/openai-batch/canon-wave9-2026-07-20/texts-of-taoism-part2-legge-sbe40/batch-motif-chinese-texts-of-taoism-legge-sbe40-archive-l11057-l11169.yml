canonical_text:
  quote: ''
  summary: Appendix IV introduces the Taoist 'Classic of the Directory for a Day,'
    emphasizing continuous purity through all hours. The text instructs a practitioner
    in seated stillness, sensory restraint, breath regulation, and mental purity,
    followed by descriptions of internal fluids rising, spirit and breath uniting,
    elixir-making, visions of spirits and Immortals, renewed youth, longevity, and
    escape from life and death. Translator notes explain the twelve Chinese hours,
    the jade cup/elixir phrase, and a Buddhist chrismal comparison.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note says the author and date are unknown, and that Buddhist
    expressions show the text cannot be very early.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Li Hsi-yueh explains the title as teaching that the Tao should not be left
    for a single instant during the hours of the day, with purity of body and mind
    as central.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner is instructed to sit straight, close the mouth, prevent thoughts
    from arising, forget everything, and keep the spirit settled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practitioner is instructed to keep lips and teeth closed and not look
    with the eyes or listen with the ears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The practitioner is instructed to watch inward feelings, draw long breaths,
    and gradually emit them without a break.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The described result of the practice is that mental excitement disappears,
    water from the kidneys rises, saliva is produced, efficacy attaches to the body,
    and the way of prolonging life is acquired.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: During the twelve hours of the day, thoughts are to be fixed on absolute Purity;
    Purity and the Undefiled are defined by the absence of contrary thought or entry
    into the mind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The body is described as the house of breath and the mind as the lodging of
    spirit; movement or rest of thoughts affects spirit and breath.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The true powers of the five elements are said to unite and form a boat-like
    cup of jade, after which the body feels full of harmony that spreads like chrismal
    unguent on the head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The practitioner is described as feeling flexible as wind, hearing a thunder-like
    sound in the belly, and hearing songs of Immortals without instruments, words,
    or drums.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Spirit and breath unite, the bloom of childhood returns, inner scenes appear,
    Spirits speak to the practitioner, vacuous things are seen, and the practitioner
    dwells with Immortals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The practitioner makes the Great Elixir, the spirit goes out and in at pleasure,
    and the practitioner is said to have the longevity of heaven and earth, the brightness
    of sun and moon, and escape from life and death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A translator note explains that the twelve Chinese hours correspond to twenty-four
    ordinary hours and are named by the twelve branch terms of the cycle.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note cites a story in which Master Lao sends a beautiful young lady with
    a gold tray and a jade cup filled with medicine to Khzxi Hsi, with the message
    that whoever drinks the mysterious elixir will not die; Khzxi Hsi and his wife
    each receive a tao kwei.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note explains the chrismal rite as a Buddhist baptism or holy unction by
    sprinkling that confers goodness.
  category: other
  evidence_refs:
  - ev:8
