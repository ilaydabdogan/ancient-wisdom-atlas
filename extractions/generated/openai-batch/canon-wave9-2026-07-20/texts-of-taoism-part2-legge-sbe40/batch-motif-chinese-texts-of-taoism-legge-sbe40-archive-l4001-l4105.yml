canonical_text:
  quote: The administration of the kingdom is like this (which I am doing)
  summary: 'A visitor, Hsii Wu-kwei, tells a marquis that he has come to comfort the
    ruler''s spirit and body. He diagnoses the ruler''s self-indulgent use of power
    as a disease, rejects attempts to end war through imposed benevolence and righteousness,
    and counsels sincere accord with Heaven and Earth rather than conquest or military
    preparation. A new episode then begins: Hwang-Ti travels with attendants to see
    Ta-kwei at a hill, becomes lost with the seven sages, meets a horse-tending boy
    who knows the way, and asks the boy about governing mankind. The boy begins to
    answer by comparing administration to tending horses, but the excerpt ends before
    the teaching is complete.'
  language: English
  quote_policy: quoted
