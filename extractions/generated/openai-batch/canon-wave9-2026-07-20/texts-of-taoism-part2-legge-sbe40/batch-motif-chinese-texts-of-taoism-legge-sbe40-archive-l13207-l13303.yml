canonical_text:
  quote: ''
  summary: The passage closes a prior discussion with a condolence anecdote and a
    cautious note about a snake reappearing after shedding its skin. It then introduces
    the Sui emperor Wan, his repair of Lao-tze's old temple, and the commissioning
    of a stone tablet. The beginning of the inscription describes primordial time,
    the earth with four sides, heaven sustained by eight pillars, living things, valleys
    and streams, the unseen action of the Perfect Tao, the emergence of elements and
    germs of things, early rulers and written bonds, and a decline from simple harmony
    into artificial talent and law.
  language: English
  quote_policy: summarized
