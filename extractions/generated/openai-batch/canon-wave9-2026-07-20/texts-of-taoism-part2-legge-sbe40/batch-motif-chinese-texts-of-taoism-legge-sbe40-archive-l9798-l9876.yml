  summary: The passage is an admonitory catalogue of wrongful actions, framed under
    the heading “Actions and Their Retributions.” It lists harms against kin, social
    inferiors, public order, legal justice, the vulnerable, sages and the worthy,
    animals and eggs, other people’s property and reputation, crops, marriages, and
    the public good.
