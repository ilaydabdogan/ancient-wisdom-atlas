canonical_text:
  quote: Their recompenses follow good and evil as the shadow follows the substance.
  summary: The passage states that calamity and happiness arise in response to human
    conduct. Various spirits, stars, and household or bodily spirits record or report
    transgressions, subtract from a person's allotted lifespan, and bring misfortune.
    The section ends by saying that one seeking long life must avoid transgressions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The tractate states that calamity and happiness have no special doors, come
    as people call them, and that recompenses follow good and evil like a shadow follows
    a substance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spirits in heaven and earth take account of human transgressions and subtract
    from a person's term of life according to the gravity of the offense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the term of life is curtailed, the passage says people become poor and
    reduced, suffer sorrows and afflictions, are hated, encounter punishments and
    calamities, lose good luck, receive misfortunes from evil stars, and die when
    the term is exhausted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spirit-rulers in the three pairs of Thai stars of the Northern Bushel are
    described as being over men's heads, recording guilt and wickedness, and taking
    away periods of twelve years or one hundred days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three Spirits of the recumbent body reside within a person's body and, on
    each kang-shan day, ascend to the court of Heaven to report deeds of guilt and
    transgression.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the last day of the moon, the spirit of the Hearth is said to do the same
    reporting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For every man's transgressions, great offenses subtract twelve years from
    life, while small offenses subtract one hundred days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says transgressions are found in several hundred things and that
    a person who seeks long life must first avoid them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A translator's note identifies the Northern Bushel with the Great Bear and
    calls it the Chariot of the Supreme Ruler.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A translator's note says part of the first paragraph occurs in the text printed/OCRed
    as '3o ^^wan' and comments that this Taoist treatise uses a source not regarded
    as Taoistic.
  category: relationship
  evidence_refs:
  - ev:8
