canonical_text:
  quote: '"They certainly belong to one chapter!"'
  summary: A frightened person explains that soup was set before him before payment
    in five of ten soup-shops. The narrator compares this with a paragraph about Yang,
    reports a sudden insight, and concludes that the materials belong to one chapter.
    The passage then argues that some other person copied four Books among Kwang-jze's
    words, urges readers to distinguish them, and states that paragraph divisions
    and book titles arose later by custom. A date and an editorial footnote follow.
  language: English
