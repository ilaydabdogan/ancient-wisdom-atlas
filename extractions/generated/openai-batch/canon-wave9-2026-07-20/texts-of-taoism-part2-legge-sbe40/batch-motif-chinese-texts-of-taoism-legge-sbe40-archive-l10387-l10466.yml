canonical_text:
  quote: ''
  summary: The passage describes attainment of the Tao without a sense of possession,
    contrasts higher non-striving scholars with lower striving ones, explains how
    perverted minds and desire lead to disorder and loss of the True Tao, and concludes
    that understanding the Tao brings Purity and Stillness. Commentarial material
    adds that students who keep and chant the Classic will receive heavenly protection,
    jade and gold refinement, and union with the Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who has entered the state described is styled a Possessor of the
    Tao, but does not think he has possessed anything.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The title Possessor of the Tao is linked with accomplishing the transformation
    of all living things.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person able to understand this teaching may transmit the Sacred Tao to others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lao the Master says that scholars of the highest class do not strive, while
    those of the lowest class are fond of striving.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts those who possess the attributes of the Tao in the highest
    degree and do not show them with those who possess them in a low degree and hold
    them fast and display them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage gives a sequence in which perverted minds become perturbed, are
    attracted toward external things, and begin a greedy quest for them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The greedy quest leads to perplexities, annoyances, disordered thoughts, anxiety,
    and trouble to body and mind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The resulting persons meet with foul disgraces, flow through phases of life
    and death, sink in the sea of bitterness, and lose the True Tao.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those who understand the True and Abiding Tao naturally obtain it and abide
    in Purity and Stillness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The commentator Li sums up the practical lesson as attaining Absolute Purity
    through the putting away of Desire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A cited True Man says that students who keep the Classic in their hands and
    croon over it will be protected by good Spirits from the ten heavens.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The same cited statement says that the students' spirits will be preserved
    by the seal of jade, their bodies refined by the elixir of gold, and both body
    and spirit brought into true union with the Tao.
  category: sequence
  evidence_refs:
  - ev:7
