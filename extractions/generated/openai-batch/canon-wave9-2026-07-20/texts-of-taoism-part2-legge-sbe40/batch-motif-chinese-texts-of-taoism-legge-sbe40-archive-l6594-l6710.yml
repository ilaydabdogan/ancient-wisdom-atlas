canonical_text:
  quote: ''
  summary: 'The passage presents several exemplary anecdotes: an unnamed sheep-butcher
    refuses reward; Yuan Hsien lives in poverty yet denies being distressed and rejects
    worldly show; 3ang-5ze lives austerely while singing and remaining unavailable
    to rulers; Yen Hui refuses office because he is content with modest sufficiency
    and study; Prince Mau is divided between retirement near water and desire for
    the Wei court, and receives counsel about valuing life, gain, self-mastery, and
    spirit.'
  language: English
  quote_policy: summarized
