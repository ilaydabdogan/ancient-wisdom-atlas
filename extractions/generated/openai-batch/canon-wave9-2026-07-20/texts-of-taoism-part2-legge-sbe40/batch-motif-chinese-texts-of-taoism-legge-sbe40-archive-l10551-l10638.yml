canonical_text:
  quote: ''
  summary: The passage introduces and begins the Treatise on the Harmony of the Seen
    and Unseen. Editorial notes explain the title through Yin and Yang, the Unseen
    and the Seen, and nearby classical sources. The translated opening says that one
    who observes the Way of Heaven and maintains Heaven’s doings accomplishes what
    must be done. It then describes five mutual foes belonging to Heaven and also
    present in the human mind; when their action follows Heaven’s manner, space, time,
    and transformations are said to be at the person’s disposal. Notes identify these
    foes with the five elements and describe their generating and overcoming cycle.
  language: English
  quote_policy: summarized
