  quote: ''
  summary: The passage gives examples of proper fitness and limits through medicinal
    plants, historical figures, animal body parts, water, and shadows. It warns that
    human faculties can become dangerous and lead to calamity, state ruin, and slaughter.
    It then describes moving beyond limited knowledge toward knowledge of Heaven and
    the Tao, named through several 'Great' attributes, while emphasizing that explanation
    and knowledge of it remain paradoxical and that inquiry can end perplexity.
  language: English
