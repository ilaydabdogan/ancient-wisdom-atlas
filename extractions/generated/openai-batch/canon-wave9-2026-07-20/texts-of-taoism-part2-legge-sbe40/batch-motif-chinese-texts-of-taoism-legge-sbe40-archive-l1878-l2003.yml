canonical_text:
  quote: ''
  summary: In Book XXI, Thien Tze-fang explains to Marquis Wan of Wei why he quotes
    Khii Kung but reveres Tung-kwo Shun-tze as his true preceptor. The marquis is
    stunned by the account of complete virtue. A second episode presents Wan-po Hsueh-tze
    refusing and then meeting visitors in Lu, criticizing their ritual knowledge and
    lack of understanding of human minds. Tung-ni sees Wan-po and remains silent because
    the Tao in him is already apparent. The supplied passage ends with the start of
    Yen Yuan's question about following his master's movements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thien Tze-fang sits in attendance on Marquis Wan of Wei and often quotes Khii
    Kung with approval.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the marquis asks whether Khii Kung is his preceptor, Tze-fang says Khii
    Kung is only from the same neighbourhood and is quoted because his views on the
    Tao are often correct.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tze-fang names Tung-kwo Shun-tze as his preceptor but says he is not fit to
    quote his words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tung-kwo Shun-tze is described as human in appearance, having the mind of
    Heaven, lacking self-regarding thought, accommodating others, pure, forbearing,
    and able to rectify his demeanour for those without the Tao.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Tze-fang leaves, Marquis Wan remains in dumb amazement for the day and
    later says his body is unstrung, his mouth closed, his learning counterfeit, and
    his possession of Wei an entanglement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wan-po Hsueh-tze travels toward Khi, stays in Lu, and at first refuses visitors,
    saying men of the Middle States understand ceremony and righteousness but are
    ignorant of the minds of men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On his return through Lu, Wan-po Hsueh-tze agrees to see the same visitors
    and comes back sighing after the interviews on successive days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wan-po Hsueh-tze describes the visitors' coming and going by the figures of
    a circle and a square, compares their carriage to a dragon and a tiger, and says
    they alternately remonstrated like sons and laid down the way like fathers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tung-ni sees Wan-po Hsueh-tze but does not speak to him; when Ze-lu asks why,
    Tung-ni says the Tao in the man was apparent as soon as he saw him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yen Yuan says that he can follow the master when he paces, goes quickly, or
    gallops, but can only stand and look when the master races and spurns the dust.
  category: speech
  evidence_refs:
  - ev:8
