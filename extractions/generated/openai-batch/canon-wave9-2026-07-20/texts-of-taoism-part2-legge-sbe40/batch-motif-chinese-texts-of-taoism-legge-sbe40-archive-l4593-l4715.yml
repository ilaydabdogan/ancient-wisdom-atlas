canonical_text:
  quote: ''
  summary: Nieh Tsfueh meets Hsii Yu, who says he is fleeing from Yao and criticizes
    benevolence and righteousness when imposed by rulers. The passage then describes
    pliable and weak people, easy and hasty people through the image of lice on a
    pig about to be roasted, and grasping and crooked conduct through Shun attracting
    followers. It contrasts these with the spirit-like or True man, who avoids the
    flocking of multitudes, embraces virtue and harmony, and follows circumstances
    rather than substituting human effort for Heaven.
  language: English
  quote_policy: summarized
