canonical_text:
  quote: ''
  summary: The passage first describes social disorder arising from gain, reputation,
    and rewarded wisdom. Nan-yung Khxi asks Kang-sang 3ze how to become the Perfect
    man. Kang-sang prescribes bodily completeness, holding life close, quieting anxious
    thought for three years, then admits his own capacity is too small to transform
    Nan-yung and sends him south to Lao-jze. Nan-yung journeys for seven days and
    nights, presents dilemmas about wisdom, benevolence, and righteousness, and is
    diagnosed by Lao-jze as frightened, astray, and seeking recovery of his proper
    nature. Nan-yung then enters Lao-jze's establishment, practices self-affliction
    for ten days, and is told to purify himself thoroughly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that employing men for wisdom makes people rob one another
    of reputation, and that such measures do not make people good and honest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people are described as eager for gain, with examples of sons killing
    fathers, ministers killing rulers, robbery in daylight, breaking through walls
    at midday, and future people eating one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The root of the greatest disorder is said to have been planted in the times
    of Yao and Shun, with branches remaining for a thousand ages.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nan-yung Khxi sits up and asks what method an old man can adopt to become
    the Perfect man described by Kang-sang 3ze.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kang-sang 3ze instructs Nan-yung to maintain his body complete, hold his life
    in close embrace, stop anxious mental activity, and continue this for three years.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nan-yung compares eyes, ears, and minds as being outwardly or naturally alike,
    while the blind, deaf, and mad lack corresponding capacities; he says Kang-sang's
    words reach only his ears.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kang-sang says small flies cannot transform the bean caterpillar, Yueh fowls
    cannot hatch goose eggs while Lu fowls can, and explains this as a difference
    of capacity before sending Nan-yung south to Lao-jze.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nan-yung takes rations and reaches Lao-jze's abode after seven days and seven
    nights.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lao-jze asks why Nan-yung has come with a multitude of attendants; Nan-yung
    becomes frightened and turns his head to look behind him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Nan-yung states three perplexities: lacking wisdom, benevolence, or righteousness
    brings blame, while possessing them brings distress to himself.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lao-jze says he understood Nan-yung by looking into his eyes and describes
    him as frightened, amazed, astray, at his wit's end, and wishing to recover his
    proper nature.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lao-jze compares Nan-yung to someone who has lost his parents and is trying
    to find them with a pole at the bottom of the sea.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nan-yung asks to enter Lao-jze's establishment, receives an apartment, seeks
    to realize qualities he loves and put away those he hates, afflicts himself for
    ten days, and is told by Lao-jze to purify himself thoroughly.
  category: sequence
  evidence_refs:
  - ev:8
