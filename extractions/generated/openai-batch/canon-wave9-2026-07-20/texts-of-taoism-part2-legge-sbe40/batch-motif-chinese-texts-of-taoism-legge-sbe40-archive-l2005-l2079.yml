canonical_text:
  quote: Of all causes for sorrow there is none so great as the death of the mind
  summary: The passage continues a dialogue about following another's speech, reasoning,
    and discourse on the Way, and about an influence that works without speech or
    partisanship. K'ung-ni discusses the death of the mind, bodily death, the sun's
    east-west course, beings waiting for their proper times, the completed human frame,
    and forgetting an old self. A later scene describes Confucius visiting Lao Tan
    after Lao Tan has bathed his head; Lao Tan stands motionless with drying dishevelled
    hair, and Confucius compares him to a rotten tree stump and to someone withdrawn
    into solitude. Lao Tan replies that he was enjoying thought about the commencement.
  language: English
  quote_policy: quoted
