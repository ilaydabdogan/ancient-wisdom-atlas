canonical_text:
  quote: ''
  summary: The passage first describes true conduct and greatness as grounded in the
    unity of the Tao, beyond names, rank, and skilled speech. It then narrates how
    a father asks Yan to read the physiognomy of his eight sons. Yan predicts that
    Khwan will be fortunate because he will eat from a ruler's table for life. The
    father weeps, regarding such worldly provision as ominous. Later Khwan is captured
    by robbers, mutilated, sold, and becomes a road inspector, yet has meat to eat
    until death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that when attributes are comprehended in the unity of the
    Tao, speech stops where knowledge cannot reach and conduct is complete.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sea's refusal to reject eastward-flowing streams is presented as an example
    of perfected greatness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage embraces Heaven and Earth, extends beneficent influence to all under
    the sky, and may lack rank, posthumous epithet, acknowledged reality, or established
    name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dog is not counted good because it barks well, and a man is not counted
    wise because he speaks skillfully.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zze-khi has eight sons and asks Yan to inspect their physiognomy to identify
    which one will be fortunate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yan identifies Khwan as fortunate and says he will share the meals of a state
    ruler until the end of his life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father responds with unease and tears, saying that fortune summed up in
    wine and flesh affects only the nose and mouth.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: 'The father reports two household prodigies: a ewe lambed in the south-west
    corner of his house and a quail hatched young in the south-east corner.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The father says he seeks shared enjoyment with his son in Heaven and support
    from Earth, not involvement in worldly affairs, plans, or advantageous conduct.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Khwan is later sent to Yen, captured by robbers, and has a foot cut off so
    he can be sold more easily.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Khwan is sold in Khi, becomes Inspector of roads for Mr. Kim, and nevertheless
    has flesh to eat until he dies.
  category: sequence
  evidence_refs:
  - ev:8
