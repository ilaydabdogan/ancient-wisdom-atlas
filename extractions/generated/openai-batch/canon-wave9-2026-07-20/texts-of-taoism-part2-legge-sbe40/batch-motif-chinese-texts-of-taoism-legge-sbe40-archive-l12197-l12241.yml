canonical_text:
  quote: ''
  summary: A commentary passage contrasts the Perfect man, who passes through the
    human world without leaving traces and enjoys spontaneous harmony with his Heaven-given
    nature, with a person bent on concealment. It uses images of forested heights,
    spring grain laid by rain, fish-baskets and hare-snares, and drowning. It also
    notes later talk about Kan and Li hexagrams, lead, and quicksilver, while doubting
    the genuineness of parts of the book.
  language: English
  quote_policy: summarized
