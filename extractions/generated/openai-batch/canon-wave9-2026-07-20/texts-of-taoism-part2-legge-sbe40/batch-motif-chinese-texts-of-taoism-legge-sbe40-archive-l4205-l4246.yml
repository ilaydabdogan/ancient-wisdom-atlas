canonical_text:
  quote: ''
  summary: In a philosophical exchange, Wang-jze questions Hui-jze about whether differing
    views can all be right, listing several schools and asking which view is truly
    right. Wang-jze then introduces the case of Lti K., whose disciple claims to have
    learned a method for heating a furnace in winter and making ice in summer. Lti
    K. rejects this as merely using Yang to call out Yang and Yin to call out Yin,
    and instead demonstrates his method by tuning two citherns alike and causing the
    same notes to vibrate in both when one is struck.
  language: English
  quote_policy: summarized
