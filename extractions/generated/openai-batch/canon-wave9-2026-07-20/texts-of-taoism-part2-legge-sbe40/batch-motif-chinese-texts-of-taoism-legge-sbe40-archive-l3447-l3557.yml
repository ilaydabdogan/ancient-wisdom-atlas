canonical_text:
  quote: ''
  summary: A dialogue presents Nan-yung Kh\i asking for the regular method of guarding
    life. Lao-jze replies with questions about holding the One, avoiding divination
    and desire, seeking within, maintaining simplicity, and becoming like a little
    child. The passage then describes the Perfect man, the little child as an image
    of unconscious nonattachment, and a fixed mind that emits Heavenly light so that
    the True man is seen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker warns that external fettering influences and internal intertwined
    influences are difficult to control together, and advises barring the inner or
    outer door against them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nan-yung Kh\i compares asking about the Grand Tao to drinking medicine that
    increases his illness and asks instead for the regular method of guarding life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lao-jze asks whether the questioner can hold the One, avoid losing it, know
    lucky and unlucky without divination tools, rest and stop appropriately, seek
    within himself, flee desire, maintain simplicity, and become a little child.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The little child is described as crying all day without hoarseness, keeping
    its fingers closed, keeping its eyes fixed, walking and resting without knowing
    why, remaining indifferent to things, and following their current.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lao-jze identifies the childlike condition as the regular method of guarding
    life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Perfect man is said to get food from the earth and joy from his Heaven-conferred
    nature, while avoiding anxiety over advantage or injury, strange actions, plans,
    undertakings, desire, and loss of simplicity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lao-jze says the previously described characteristics are not yet full perfection,
    but are like the breaking up of ice and the dissolving of cold.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The little child is further described as moving and walking unconsciously,
    with a body like a rotten tree branch and a mind like slaked lime, neither possessing
    misery nor happiness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person whose mind is grandly fixed is said to emit Heavenly light; in such
    a person men see the True man.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that when a person is constant in himself, the merely human
    element leaves him and Heaven helps him; such people are called people of Heaven
    and Sons of Heaven.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A translator note says Lao-jze's long reply contains recognitions of passages
    in the Tao Teh King, chapters 9, 10, 55, and 58.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: A translator note compares the description of body and mind to the description
    of 3ze-Mi's Taoistic trance at the beginning of the second Book.
  category: other
  evidence_refs:
  - ev:9
