canonical_text:
  quote: ''
  summary: The passage analyzes controversy, words, knowledge, and the Tao. It says
    disputants remain trapped in their own standpoints, while sages use the light
    of Heaven and rest in Heaven to arrive at natural union. It discusses ancient
    views on the highest knowledge, the rise of affirmation and denial, the need to
    go back before words and even before the beginning, and the blending of all distinctions
    into the One. It concludes that the sage avoids discussion and distinctions, that
    the displayed Tao is not the Tao, and that ancient knowledge reached its highest
    point by stopping where knowledge went no farther, through the Heavenly Treasure-house
    and the centre of the circle.
  language: English
  quote_policy: summarized
