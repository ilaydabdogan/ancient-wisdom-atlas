  evidence_refs:
  - ev:4
- id: obs:7
  text: A!ung-nt asks Ta Thao, Po KAB.ng-^kien, and A/^ih-wei why Duke Ling of Wei
    received the epithet Ling despite drink, sensuality, neglect of government, hunting,
    and absence from meetings of princes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ta Thao answers that Duke Ling received the epithet on account of the very
    conduct named in the question.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Po KAB.ng-^kien says Duke Ling bathed in one tub with three mistresses, but
    also showed reverence to Shih-^hita when Shih-^hita came with imperial gifts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A/^ih-wei says that burial divination rejected the old family tomb, favoured
    Sha-^/im, and that digging there revealed a washed and inspected stone coffin
