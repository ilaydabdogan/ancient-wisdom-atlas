canonical_text:
  quote: ''
  summary: The passage contains Lao Tan's critique that social distinctions, accumulated
    wealth, and coercive government generate crime and hypocrisy; a notice that Au
    Po-yii changed his views in his sixtieth year, followed by reflections on the
    unseen root and departure-door of life; and a dialogue in which A!ung-nt asks
    historiographers why Duke Ling of Wei received his epithet despite dissolute conduct.
    The answers cite his conduct, his reverence toward a worthy imperial messenger,
    and a burial divination that led to a stone coffin bearing an inscription for
    Duke Ling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lao Tan is presented as saying that injunctions against robbery and killing
    do not remove the causes of those evils when glory, disgrace, property, and wealth
    are set up or accumulated.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speech says that heavy burdens, difficult requirements, and distress imposed
    on people lead to hypocrisy, deception, robbery, and theft.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The superior men and rulers of old are described as blaming themselves if
    even a single person lost his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Present rulers are described as concealing requirements, condemning those
    who fail, imposing heavy burdens, punishing inability, and killing those who cannot
    complete assigned distances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Au Po-yii, in his sixtieth year, changed his views and came to condemn as
    wrong what he had formerly considered right.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that all things have life while their root is unseen, and
    that they have goings forth while the door of departure is unknown.
