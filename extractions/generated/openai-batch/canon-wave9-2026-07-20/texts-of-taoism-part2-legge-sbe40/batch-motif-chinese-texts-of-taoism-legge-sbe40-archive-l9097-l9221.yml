canonical_text:
  quote: ''
  summary: The passage describes Yii/Yü as a sage who labored personally to order
    waterways and mark states, then describes later Mohists who emulate severe toil
    and engage in doctrinal disputes. It evaluates Mo Ti and Khun Hwa-li as well-intentioned
    but excessive, then turns to Sung Hsing and Yin Wan, whose Tao-aligned practice
    emphasizes forbearance, peace, anti-aggression, and service to the world, while
    also criticizing their neglect of self-preservation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yii/Yü is described as dealing with regions, provinces, hills, branch streams,
    and innumerable smaller streams, and as uniting the streams of the country by
    conducting them to the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yii/Yü personally carried a sack and used a spade; his bodily toil is described
    through hairless legs and exposure to violent wind and pelting rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Later Mohists are described as wearing skins, dolychos cloth, and wooden or
    twisted-hemp shoes, not stopping day or night, and treating such toil as their
    highest achievement.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The later Mohists say that inability to perform this toil is contrary to the
    way of Yii and makes one unfit to be a Mohist.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Named Mohist groups and southern Mohists repeat the texts of Mo but differ
    in objections, glosses, and school labels.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mohist disputations concern hard and white, sameness and difference, and
    odd and even.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mohist groups regard their most distinguished member as a sage and wish
    to make him their chief, but the controversies remain undetermined.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mo Ti and Khun Hwa-li are judged to have a good idea but wrong practice, especially
    in making later Mohists feel compelled to toil to the point of bodily depletion.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mo-tze is praised as one of the best men in the world and as an able scholar,
    despite being described as decayed and worn in person.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A scheme associated with the Tao in antiquity includes avoiding entanglement
    in prevailing customs, shunning ornament, avoiding reckless conduct, seeking peace,
    preserving lives, and stopping action when nourishment is sufficient.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sung Hsing and Yin Wan are said to delight in these ways and to make and wear
    the Hwa-shan cap as a distinguishing badge.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Their interpersonal practice begins with indulgence toward others; they name
    forbearance of the mind as action of the mind and seek harmony through affection.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: They endure insult, seek to save people from fighting, forbid aggression,
    hush weapons of strife, and aim to save their age from war.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: They travel everywhere, counseling the high and instructing the low, and persist
    more strongly even when the world does not receive them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage criticizes them for too much regard for others and too little
    for themselves, using the image of five pints of rice, an underfed Master, and
    famishing disciples who still remain mindful of the world.
  category: other
  evidence_refs:
  - ev:8
