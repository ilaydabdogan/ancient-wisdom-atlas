canonical_text:
  quote: ''
  summary: The passage includes a note that a tortoise story appears elsewhere with
    variations, a dialogue about the usefulness of what is not directly used, and
    sayings attributed to A'wang-jze on enjoyment, concealment, the trace-free Perfect
    man, responsiveness to the present age, sense faculties, breath, obstruction,
    inner spaciousness, natural landscapes, social effects of fame and rivalry, and
    spring growth after seasonable rain and sunshine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hypothetical man is said to use only enough ground for his feet; if a rent
    opened beside his feet down to the yellow springs, Hui-jze says he could not use
    it, and A'wang-jze concludes that the usefulness of what is of no use is clear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A'wang-jze speaks of people who aim to conceal themselves and people determined
    that their doings leave no trace, and says both shirk perfect knowledge and great
    virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The relation of ruler and minister is described as temporary; in a changed
    age one would not be able to look down on the other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The saying quoted in the passage states that the Perfect man leaves no traces
    of his conduct.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Learners are described as honouring antiquity and despising the present, while
    even the disciples of Zih-wei have to look at the present age.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Perfect man is described as able to enjoy himself in the world without
    being deflected from the right, to accommodate himself to others without losing
    himself, and to consider others' ideas without discarding them as different.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists eye, ear, nose, mouth, mind, and knowledge as giving clear
    vision, quick hearing, discernment of odours, enjoyment of flavours, acquired
    knowledge, and virtue.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that obstruction of connection with what is outside produces
    stoppage, continued stoppage arrests progress, and injurious effects arise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The knowledge of creatures is said to depend on breathing; Heaven is said
    to try to penetrate them with breath day and night, while men shut their pores
    against it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The womb is said to enclose a large empty space, and the heart is said to
    have spontaneous and enjoyable movements.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A cramped apartment is said to lead wife and mother-in-law to bicker, and
    a heart without spontaneous movement is said to cause the six faculties of perception
    to collide with one another.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Great forests, heights, and hills are described as pleasant to men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage gives a sequence in which virtue overflows into fame, fame into
    violence, schemes arise from urgency, displayed wisdom comes from rivalry, and
    the fuel of strife comes from obstinate maintenance of one’s own views.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In spring, seasonable rain and sunshine are said to make vegetation grow luxuriantly,
    after which sickles and hoes begin to be prepared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the spring growth description, the passage says that more than half
    of what had fallen down becomes straight, and that the cause is not known.
  category: sequence
  evidence_refs:
  - ev:8
