canonical_text:
  quote: ''
  summary: The passage first discusses helpful remedies and a sequence of figures
    who do not inquire into modes of influence outside their own experience. It then
    gives anecdotes about extreme mourning, declined transfers of rulership, withdrawal
    to a river, and self-drowning. It closes one book with analogies in which instruments
    are forgotten after their object is attained, especially words after ideas are
    grasped. The next book opens with an authorial account of metaphorical language,
    valued writers, agreement and dispute, and criteria for genuine venerable predecessors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stillness, silence, rubbing the corners of the eyes, and rest are named as
    helpful for illness, age, and agitation; those who are at ease do not ask about
    these remedies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit-like man, sagely man, man of ability and virtue, and superior man
    are each said not to inquire into another figure’s way of keeping a world, age,
    state, or self in awe or agreement, because each lacks experience of it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After his father’s death, the keeper of the Yen Gate emaciates his body with
    such skill that he receives the rank called Pattern for Officers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Half the people of the keeper’s neighbourhood imitate emaciation to the point
    that they die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yio wishes to resign the throne to Hsli Yu, who runs away; Thang offers his
    throne to Wti Kwang, who becomes angry.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ki Tha hears of the matter, leads his disciples, withdraws to the river Kho,
    receives condolence from feudal princes, and after three years Shan Th<i-tt^ throws
    himself into the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fishing-stakes are used to catch fish and snares are used to catch hares;
    after the fish or hares are obtained, the instruments are forgotten.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Words are described as instruments for conveying ideas; after the ideas are
    apprehended, words are forgotten, and the speaker wishes to talk with a person
    who has forgotten words.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says that nine in ten of his sentences are metaphorical, seven
    in ten of his illustrations come from valued writers, and the rest of his words
    are like daily water filling a cup.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Metaphorical sentences are described as borrowed from extraneous things to
    assist comprehension of the argument.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage gives the example that a father does not act as matchmaker for
    his own son, because another man’s praise of the son is better than the father’s
    own praise.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Men are said to assent to views agreeing with their own and oppose those that
