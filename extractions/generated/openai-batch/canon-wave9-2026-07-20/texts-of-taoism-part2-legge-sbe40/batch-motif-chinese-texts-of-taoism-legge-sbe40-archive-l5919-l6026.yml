candidate_motifs:
- id: motif:1
  label: Forgetting the instrument after attaining the object
  taxonomy_refs:
  - wisdom
  basis: The passage explicitly aligns stakes, snares, and words as means that are
    forgotten after fish, hares, or ideas are obtained.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is an explicit didactic analogy rather than a narrative episode.
- id: motif:2
  label: Indirect or metaphorical teaching for comprehension
  taxonomy_refs:
  - wisdom
  basis: The speaker says most sentences are metaphorical, borrowed from extraneous
    things to aid comprehension, and that illustrations from valued writers end disputes.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames this as rhetorical method, not as a mythic plot.
- id: motif:3
  label: Imitative ritual excess leading to death
  taxonomy_refs: []
  basis: The keeper’s mourning emaciation is rewarded, and half the neighbourhood
    imitates emaciation until they die.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call the deaths sacrificial or religiously
    meritorious; classification beyond imitation and fatal excess requires review.
- id: motif:4
  label: Refusal of transferred rulership through flight or anger
  taxonomy_refs:
  - royal_legitimacy
  - departure
  basis: 'Two throne-transfer episodes are paired: Hsli Yu runs away when Yio wishes
    to resign the throne to him, and Wti Kwang becomes angry when Thang offers his
    throne.'
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives brief exempla and does not fully explain the political
    or ritual rationale for refusal.
- id: motif:5
  label: Withdrawal to water followed by self-drowning
  taxonomy_refs: []
  basis: Ki Tha withdraws with disciples to the river Kho, and after three years Shan
    Th<i-tt^ throws himself into the water.
  evidence_refs:
