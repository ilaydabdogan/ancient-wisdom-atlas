canonical_text:
  quote: ''
  summary: 'The passage lists brief narrative topics: Shun is compared unfavorably
    with the older sovereign Thai in Taoistic attainment; several named or unnamed
    figures are associated with ideals of government, non-action, and nameless rule;
    Hu-jze defeats a wizard; gods of the southern and northern seas bring about the
    end of Chaos; and two shepherd slaves lose sheep in different ways, with corresponding
    cases of Po-1 and Kih.'
  language: English
  quote_policy: summarized
