canonical_text:
  quote: ''
  summary: The passage includes a note identifying the old fisherman with Lü Shang/Thai-kung
    Wang and explaining his fishing as an image of Taoist aimlessness. King Wan reports
    a dream-command to entrust government to the old man of Zang; his officers identify
    the dream figure as the king’s father and advise against further divination. King
    Wan appoints the old man, whose administration changes no statutes yet produces
    order; after being made Grand Preceptor, the old man leaves and is not heard from
    again. Yen Yuan questions Confucius about King Wan’s reliance on a dream, and
    Confucius defends the king. A second episode describes Lieh Yu-khau demonstrating
    archery before Po-hwan Wu-jan, who tests him on a high mountain precipice; Lieh
    becomes terrified, and Po-hwan contrasts him with the Perfect man, whose spirit
    and breath remain unchanged across cosmic extremes.
  language: English
  quote_policy: summarized
