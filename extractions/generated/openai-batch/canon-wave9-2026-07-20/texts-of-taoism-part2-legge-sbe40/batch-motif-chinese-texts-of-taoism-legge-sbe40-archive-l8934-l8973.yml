  quote: ''
  summary: The passage describes unnamed ancient figures whose influence harmonized
    society, whose understanding of fundamental principles was preserved in old laws,
    historians, classical texts, and schools. It assigns functions to several classical
    books, including the Yi as showing the action of Yin and Yang. It then says disorder
    arose, sages and worthies no longer illuminated the world, and the Tao and its
    characteristics were no longer regarded as uniform. A translator note identifies
    the scholars of Zou and Lu as chiefly Confucius and Mencius.
  language: English
