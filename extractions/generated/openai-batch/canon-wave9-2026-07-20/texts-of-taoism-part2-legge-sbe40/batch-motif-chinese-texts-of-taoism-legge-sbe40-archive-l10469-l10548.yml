canonical_text:
  quote: ''
  summary: The passage introduces the Yin Fu A'ing, glossed as the Classic of the
    Harmony of the Seen and the Unseen, and summarizes catalog notices about its alleged
    antiquity, commentators, and disputed authorship. It reports a story that Khau
    K/ilen-kih hid a copy in a mountain cave, where it remained for centuries until
    Li K/iwan found it damaged; Li copied it, failed to understand it until an old
    woman explained it at the foot of Mount Li, then published a text and commentary
    and later died wandering in quest of the Tao. The passage also notes that the
    present classic cannot be traced earlier than the eighth century and that some
    critics considered it forged by Li K/iwan.
  language: English
  quote_policy: summarized
