canonical_text:
  quote: ''
  summary: A commentary on a book of Zhuangzi discusses examples of self-emptying,
    responsiveness to circumstances, relations between Heaven and the human, preservation
    of the body, and avoidance of worldly harm. It refers to Pei-kung She, Confucius,
    Thai-kung Zan, 3ze-sang Hu, a strange bird of Tiao-ling, the Beauty of a lodging-house,
    and a suspected forged paragraph allowed by Kwo 3ze-hsuan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shih-nan is said to help illustrate, and receive illustration from, Zhuangzi's
    statement about preferring a position between being fit for usefulness and lacking
    that fitness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pei-kung She collects taxes for making a peal of bells, puts away all thought
    of self, acts as the time requires, and is likened to a child without knowledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius is described as receiving a great share of the world's afflictions
    and as putting away ideas of merit, fame, and self after Thai-kung Zan speaks
    to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius is said to put away the idea of self in responding to the world
    but not in determining his associations; distant acquaintances do not come, nearer
    friends may cast him off, and followers and friends disperse.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 3ze-sang Hu is said to recognize this difficulty and to speak of a union of
    Heaven's appointment and of superior men's intercourse being tasteless as water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Confucius is reported to distinguish the inflictions of Heaven from the favours
    of men and to perceive a connection between the Heavenly and the Human.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that acting according to the requirements of the time enlarges
    a person, while loving oneself more brings more sorrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A strange bird in the park of Tiao-ling is presented as forgetting the instinct
    of preservation in prospect of gain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Beauty of the lodging-house is presented as making herself contemned through
    attempts to show off superiority.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Book is said to set forth principles for preserving the body, keeping
    harm far off, emptying Self, conforming to the time, and getting through the world.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sixth paragraph is called despicable, unworthy, and evidently a forgery,
    and Kwo 3ze-hsuan is blamed for allowing it to remain as Zhuangzi's production.
  category: other
  evidence_refs:
  - ev:9
