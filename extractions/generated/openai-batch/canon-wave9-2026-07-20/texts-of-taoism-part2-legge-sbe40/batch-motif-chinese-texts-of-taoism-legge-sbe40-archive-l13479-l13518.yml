  quote: ''
  summary: The passage opens Appendix VIII as a record for the sacrificial hall of
    Kwang-jze, attributed to Su Shih. It states that Kwang-jze, a native of Mang and
    an officer in Kih-yuan, had been dead for more than a thousand years without sacrifices
    in Mang until Wang King supervised the erection of a sacrificial hall and requested
    a record from the author. A footnote gives biographical and editorial context
    for Su Shih, his family, his brother’s Tao Teh King commentary, and Jiao Hong’s
    inclusion of the essay.
