  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Po-hwan warns that Lieh may in turn be influenced, that his proper nature
    may be shaken, and that his associates do not admonish him about this.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Po-hwan calls the small words spoken by Lieh's associates poison to a man.
  category: speech
  evidence_refs:
  - ev:6
