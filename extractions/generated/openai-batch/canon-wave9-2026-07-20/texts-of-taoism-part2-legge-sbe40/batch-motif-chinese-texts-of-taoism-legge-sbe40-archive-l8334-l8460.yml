canonical_text:
  quote: ''
  summary: The passage first presents an admonition to Yu about reverence, propriety,
    humanity, and honoring the Tao as possessed by an old fisherman. It then narrates
    Lieh Yu-khau turning back from a journey after being treated with unusual deference
    at soup-shops; Po-hwan Wu-zan warns him that such display will attract followers
    and threaten his inner nature. A later visit confirms that many have flocked to
    Lieh, and Po-hwan uses images of medicine, poison, and a drifting vessel in his
    warning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses Yu, saying he has long been trained in propriety and righteousness
    but remains difficult to change.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that failing to respect elders or honor people of superior
    wisdom and goodness is a failure of propriety and humanity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old fisherman is described as possessing the quality that makes others
    submit to him, and as possessing the Tao.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Tao is described as the course by which all things should proceed; failing
    in it is death, observing it is life, opposing it is ruin, and conforming to it
    is success.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lieh Yu-khau starts for Khi but returns when he is halfway there and says
    that he was frightened.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lieh says he entered ten soup-shops for a meal, and in five the soup was set
    before him before he had paid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lieh interprets the preferential treatment as an outward display that overawes
    people and leads them to treat someone as noble or aged on light grounds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lieh fears that a ruler, described as lord of ten thousand chariots, would
    entrust governmental affairs to him and demand success.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Po-hwan Wu-zan praises Lieh's perception but warns that, if Lieh carries himself
    as he does, people will flock to him for protection.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: When Po-hwan later visits Lieh, he finds the space outside Lieh's door full
    of shoes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Po-hwan stands facing north, holding his staff upright and leaning his chin
    on it, remains silent for some time, and then begins to leave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Lieh takes up his shoes, runs barefoot after Po-hwan, and asks him for 'medicine,'
    glossed in the passage note as good advice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Po-hwan says that people have indeed flocked to Lieh, and that they are made
