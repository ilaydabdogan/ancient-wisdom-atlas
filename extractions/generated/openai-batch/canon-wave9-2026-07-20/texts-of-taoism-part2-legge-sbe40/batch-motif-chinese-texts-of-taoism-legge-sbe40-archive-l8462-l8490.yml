  summary: A man of A'ang named Hwan studies books near Oiu-shih and quickly becomes
    a Confucian scholar. He has his younger brother study the principles of Mo; the
    Confucian scholar and the Mohist dispute, and their father sides with the younger
    brother. After ten years Hwan kills himself and later appears to his father in
    a dream, beginning to speak, though the supplied passage breaks off mid-sentence.
