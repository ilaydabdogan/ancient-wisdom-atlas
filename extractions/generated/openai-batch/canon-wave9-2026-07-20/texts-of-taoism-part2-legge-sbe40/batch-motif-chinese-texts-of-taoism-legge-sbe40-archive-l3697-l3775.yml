canonical_text:
  quote: ''
  summary: The passage contrasts views about non-existence, life, and death, then
    stresses their unity under one keeper and through analogies of family branches,
    soot under a boiler, sacrificial portions, and parts of a house. It criticizes
    a discriminating method that multiplies approval and disapproval, compares its
    followers to the cicada and little dove, gives examples of conduct when one treads
    on another’s foot, and states maxims about the greatest politeness, righteousness,
    wisdom, benevolence, and good faith. It ends by urging the removal of impulses
    and obstructions to the Tao.
  language: English
  quote_policy: summarized
