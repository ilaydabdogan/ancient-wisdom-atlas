canonical_text:
  quote: ''
  summary: The passage frames several sayings as Taoist illustrations of contraries.
    One saying contrasts a stupid man who becomes sage by studying heaven and earth
    with a first-person speaker who becomes intelligent by studying their times and
    productions. Another states that spontaneity proceeds in stillness, producing
    heaven, earth, and all things, while Yin and Yang overcome one another by turns
    and generate change. A final saying describes sages acting in accord with irresistible
    spontaneity and mentions a wonderful machinery by which heavenly bodies, the eight
    diagrams, the sexagenary cycle, spirit-like powers, hidden ghostlinesses, and
    Yin-Yang arts become visible. The surrounding commentary connects these themes
    with Lao-jze, the Yi King, the Tao Teh, and warnings against using the texts as
    manuals for war or government.
  language: English
  quote_policy: summarized
