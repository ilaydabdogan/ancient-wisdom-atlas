  quote: ''
  summary: A speaker admonishes Confucius for overextending himself in regulating
    ceremonies, music, and social relationships, names eight defects and four evils,
    hears Confucius recount prior troubles, and replies with a parable about a man
    fleeing his shadow and footprints before urging self-cultivation rather than the
    reform of others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the addressee lacks the rank of ruler, feudal lord, royal
    minister, or great minister, yet takes on regulating ceremonies, music, and social
    relationships to transform the people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The speaker names eight defects: monopolising, loquacity, sycophancy, flattery,
    calumny, mischievousness, depravity, and being dangerous.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says the eight defects produce disorder among others and injury
    to oneself, and that a superior man or intelligent ruler will not associate closely
    with a person who has them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The speaker names four evils: ambition, greediness, obstinacy, and boastful
    conceit.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says that putting away the eight defects and allowing no course
    to the four evils makes one begin to be capable of being taught.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confucius looks sorrowful, sighs, bows twice, rises, and speaks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius recounts being twice driven from Lu, fleeing from Wei, having the
    tree under which he rested cut down in Sung, and being kept in siege between two
    named places; he says he does not know what errors led to these misrepresentations
    and sufferings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stranger looks grieved and changes countenance before responding to Confucius.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stranger tells of a man frightened by his shadow and displeased by his
    footprints, who runs to escape them; running produces more footprints, the shadow
    remains, and he dies from exhaustion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The stranger says the man did not know that staying in a shady place would
    make the shadow disappear and remaining still would make him lose his footprints.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stranger lists Confucius's attention to benevolence, righteousness, agreement
    and difference, movement and rest, receiving and giving, liking and disliking,
    and joy and anger, and says Confucius has still hardly escaped his troubles.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The stranger advises cultivating one's own person, guarding one's proper truth,
    and rendering to others what is due; he criticizes making the cultivation of others
    one's object as concern with what is external.
  category: speech
