canonical_text:
  quote: ''
  summary: A commentarial opening discusses Tao as both immaterial force and material
    substance and notes the difficulty of explaining creation. The main passage teaches
    that the human spirit loves Purity and the mind loves stillness, but desires disturb
    them. If desires are sent away and the mind is cleansed, the spirit becomes pure,
    the six desires do not arise, and the three poisons disappear. The practitioner
    then regards mind, body, and external things as not belonging to him, passes through
    vacancy, vacuity, and the disappearance of nothingness, and reaches constant stillness.
    In true stillness no desire arises; constant Purity and Rest lead gradually into
    the True Tao. Notes compare related Taoist passages and a trance-like description
    in Kwang-jze/Zhuangzi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening commentary says Tao is discussed as an immaterial power or force
    and as the material substance out of which all things come; it also reports Li
    Hsi-yueh's interpretation of the Unlimited or Infinite producing the Grand or
    Primal Finite, while calling creation in the deepest sense too high for the human
    mind.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the spirit of man loves Purity, but the mind disturbs
    it; the mind loves stillness, but desires draw it away.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:3
  text: If a person always sends desires away, the mind becomes still of itself; if
    the mind is made clean, the spirit becomes pure of itself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the mind is cleansed and the spirit becomes pure, the six desires will
    not arise and the three poisons will be taken away and disappear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note defines the six desires as desires connected with eyes, ears, nostrils,
    tongue, sense of touch or body, and imagination or thought.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note defines the three poisons as greed, anger, and stupidity.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The reason men cannot attain the described state is said to be that their
    minds have not been cleansed and their desires have not been sent away.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: If one sends desires away, inward looking at the mind finds it no longer his;
    outward looking at the body finds it no longer his; looking farther at external
    things finds them to be things with which he has nothing to do.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Understanding mind, body, and external things in this way leaves only vacancy;
    contemplation of vacancy awakens vacuity; the idea of vacuous space vanishes,
    then the idea of nothingness disappears, and constant stillness ensues.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The commentary calls this process the subjection of the mental faculties and
    says it is probably another way of describing a Taoist trance found in Kwang-jze,
    where the body is like a withered tree and the mind like slaked lime.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the condition of rest independent of place, the passage asks how desire
    can arise; when no desire arises, there is True stillness and rest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: True stillness becomes a constant quality that responds to external things
    and holds possession of the nature; in constant response and constant stillness
    there is constant Purity and Rest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The one who has absolute Purity is said to enter gradually into the inspiration
    of the True Tao.
  category: sequence
  evidence_refs:
  - ev:8
