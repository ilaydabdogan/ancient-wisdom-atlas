canonical_text:
  quote: ''
  summary: The passage presents a dialogue about political recommendation, the character
    of intermediaries, and the superior influence of a sagely person. It contrasts
    knowledge without virtue, courtly ambition, and stern rulership with the sage's
    natural, silent, harmonizing influence. It then describes the sage's spontaneous
    unity with others, natural excellence and love, and uses the image of seeing one's
    old country and city to illustrate enduring recognition and joy.
  language: English
  quote_policy: summarized
