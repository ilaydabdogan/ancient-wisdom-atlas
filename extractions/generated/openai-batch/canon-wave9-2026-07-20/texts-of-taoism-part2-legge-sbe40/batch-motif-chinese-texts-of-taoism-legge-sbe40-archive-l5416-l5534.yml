canonical_text:
  quote: ''
  summary: A dialogue explains the production of all things through Yin-Yang interaction,
    seasonal succession, paired processes, and recurring endings and beginnings, while
    limiting what words and knowledge can say about these processes and the Tao. A
    second dialogue considers whether the Tao causes action or allows influence, concluding
    that causation and non-action are inadequate categories and that speech and silence
    cannot fully convey the Tao. The next section begins with examples showing that
    external outcomes cannot be determined beforehand, including harmed or displaced
    figures and Chang Hung's blood becoming green jade after three years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shao Kih asks how the production of all things began within the four cardinal
    points and six boundaries of space.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thai-kung Thiao says Yin and Yang reflected light on each other, covered each
    other, and regulated each other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thai-kung Thiao says the four seasons gave place to one another, produced
    one another, and brought one another to an end.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage lists paired or alternating processes, including liking and disliking,
    movement toward and avoidance, male and female separation and union, security
    and insecurity, misery and happiness, gentleness and urgency, and collection and
    dispersion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage says these names, processes, orders, mutual influences, revivals,
    endings, and beginnings belong to things and can be described up to a limit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men who study the Tao are described as not following these operations after
    they end and not searching out how they began.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Shao Kih asks whether Ki Kang's statement that the Tao forbids all action
    or Kieh-jze's statement that it may allow influence is correct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Thai-kung Thiao uses cocks crowing and dogs barking as familiar phenomena
    whose formation and intentions cannot be fully described by the wisest people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage contrasts the statements that someone caused things and that no
    one did so, connecting them with real being, vacancy, names, and things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Birth is said to be unpreventable before it comes, and death is said to be
    untraceable farther after it has happened.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Tao is described as infinite and unceasing, beyond adequate treatment
    by words, causation, or non-action.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: The name Tao is described as a metaphor used for description, and neither
    speech nor silence is sufficient to convey it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The next section begins by saying that what comes from without cannot be determined
    beforehand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage lists Lung-fang as killed, Pi-kan as immolated, the count of Ki
    as made to feign madness, O-lai as dead, and Nieh and Chou as perished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage says rulers wish ministers to be faithful, but faithfulness may
    not secure confidence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Wu Yun is said to have become a wanderer along the Kiang.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Chang Hung is said to have died in Shu; his blood was preserved for three
    years and became green jade.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Parents are said to wish their sons to be filial, but filial duty may not
    secure their love.
  category: relationship
  evidence_refs:
  - ev:6
