  quote: ''
  summary: The king of Wu travels on the Kiang, lands, and ascends the Hill of monkeys.
    The monkeys flee and hide, except for one that swings on branches and displays
    cleverness. The king shoots at it; the monkey catches the arrow, but attendants
    are ordered forward, and the monkey is seized and killed. The king then turns
    to his friend Yen, but the speech content is not included in this line range.
    A footnote fragment follows and is not clearly connected to the narrative excerpt.
