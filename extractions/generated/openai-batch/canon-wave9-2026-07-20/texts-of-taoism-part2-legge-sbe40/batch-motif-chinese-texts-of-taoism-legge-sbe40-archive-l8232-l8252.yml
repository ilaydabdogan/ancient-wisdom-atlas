canonical_text:
  quote: A man's proper Truth is pure sincerity in its highest degree
  summary: Confucius sadly asks a stranger what is meant by his proper Truth. The
    stranger answers that proper Truth is the highest pure sincerity, without which
    one cannot move others. He contrasts forced displays of grief, anger, and affection
    with true inner states that affect others even without outward display, and says
    inward truth has outward spiritual efficacy in human relationships.
