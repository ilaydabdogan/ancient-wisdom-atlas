  summary: 'A Book XXII list of narratives gives brief headings for items 5-9: Confucius
    and 3ze-sang Hu; Shun''s dying charge to Yii; isTwang-^ze in rags before the king
    of Wei and a climbing-monkey apologue; Confucius and Yen Hui in a perilous situation
    between Khz-n and 3hai; /Twang-jze''s experiences in the park of Tido-ling as
    an apologue; and the innkeeper''s two concubines, where the beautiful one is disliked
    and the ugly one honoured.'
