canonical_text:
  quote: ''
  summary: 'The passage presents ethical and political sayings: a true man escapes
    external and internal punishment; Confucius describes the difficulty of knowing
    human minds and lists tests for revealing character; Khao-fu is contrasted with
    ordinary arrogant officials; supercilious self-regard is criticized; several conditions
    of advancement are enumerated; and Zwang-3ze answers a boastful recipient of royal
    favor with a parable of a poor diver who finds a pearl beneath a sleeping Black
    Dragon, then compares the king of Sung to that dragon.'
  language: English
  quote_policy: summarized
