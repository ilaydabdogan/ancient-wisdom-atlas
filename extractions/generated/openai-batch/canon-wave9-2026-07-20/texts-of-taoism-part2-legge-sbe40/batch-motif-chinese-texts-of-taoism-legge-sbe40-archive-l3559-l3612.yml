canonical_text:
  quote: ''
  summary: The passage teaches that effort and reasoning cannot attain the subject
    in question, and that knowing where knowledge must stop is the highest attainment.
    It then describes maintaining body and mind, inward reverence, evils that come
    from Heaven, the Tower of Intelligence and its Guardian, the danger of insincere
    outward demonstration, and punishment of wrongdoing by men or spirits depending
    on whether the act is open or hidden. Notes identify the Guardian as the Tao and
    call the mention of spirits rare in early Taoism.
  language: English
  quote_policy: summarized
