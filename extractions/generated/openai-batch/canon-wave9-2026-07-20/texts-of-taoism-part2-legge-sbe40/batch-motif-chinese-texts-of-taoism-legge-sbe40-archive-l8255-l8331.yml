canonical_text:
  quote: ''
  summary: A fisherman or stranger teaches Confucius that rites and customs are secondary
    to proper Truth received from Heaven and to the Great Way. Confucius bows and
    asks to become his servant and continue learning; the fisherman gives a saying
    about associating only with one who knows the Tao, leaves by boat among green
    reeds, and 3ze-lu later questions Confucius's unusually reverent conduct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fisherman contrasts loyalty, service to parents, festive drinking, and
    mourning rites with outward appliances or fixed forms, saying that rites are for
    common practice while proper Truth is received from Heaven and operates spontaneously.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says sages take their law from Heaven and prize proper Truth,
    while the stupid are influenced by other people, ordinary things, and surrounding
    customs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius bows twice to the fisherman, says the meeting is like the happiness
    of getting to heaven, and asks to serve him and receive instruction in the Great
    Way at his dwelling.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stranger answers with a saying about walking with one who can go to the
    subtlest mysteries of the Tao and avoiding association with one who does not know
    the Tao.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After speaking, the fisherman shoves off his boat and goes away among green
    reeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confucius remains where he is until the wavelets are stilled and he no longer
    hears the sound of the pole, then returns to take his seat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 3ze-lu says he has never seen Confucius treat anyone with such awe and reverence,
    even in the presence of powerful rulers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 3ze-lu describes the old fisherman standing with a pole while Confucius bends
    from the loins like a sounding-stone and bows twice before answering.
  category: speech
  evidence_refs:
  - ev:5
