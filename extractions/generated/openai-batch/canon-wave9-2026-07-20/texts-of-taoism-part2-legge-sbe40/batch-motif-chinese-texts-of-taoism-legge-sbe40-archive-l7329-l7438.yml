canonical_text:
  quote: Small robbers are put in prison ; a great robber becomes a feudal lord ;
  summary: Confucius departs in physical distress after seeing Tao Kih and tells Liu-hsia
    Ki that he narrowly escaped danger. A dialogue follows in which 3ze-Zang urges
    Man Kau-teh to pursue a righteous course for credibility, office, reputation,
    gain, and inner propriety. Man Kau-teh counters that fame and gain often come
    from shamelessness and being believed in, and later argues through examples that
    social honour and moral conduct are inconsistent, with successful wrongdoers treated
    as rulers and condemned persons served by righteous scholars.
  language: English
  quote_policy: quoted
