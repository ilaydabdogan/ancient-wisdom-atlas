  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 3ze-Zang argues that without a righteous course a scholar will not be believed
    in, employed in office, or gain advantage, and that a scholar should not go a
    single day without such a course.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Man Kau-teh replies that the shameless become rich and the widely believed
