canonical_text:
  quote: "'Abolish sageness and cast away wisdom, and the world will be brought to
    a state of good order.'"
  summary: The passage argues that attempts to govern through deliberate action, moral
    distinctions, rewards, punishments, and valued arts such as ceremonies, music,
    sageness, and knowledge interfere with human minds and produce disorder. It contrasts
    this with the Superior man, who does nothing, rests in natural instincts, values
    his own person, and allows things to transform of themselves. The passage cites
    Lao Tan and Kwang iT/^ang-^ze to support abolishing artificial wisdom, guarding
    the body, maintaining unity and harmony, and avoiding interference with minds.
  language: English
  quote_policy: quoted
