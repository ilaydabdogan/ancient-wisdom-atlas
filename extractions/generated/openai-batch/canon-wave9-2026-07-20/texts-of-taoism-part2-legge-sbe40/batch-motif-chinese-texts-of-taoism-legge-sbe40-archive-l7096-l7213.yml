canonical_text:
  quote: this was the grand time of Perfect virtue
  summary: Tao A'ih angrily rejects Khung Kiu's appeal to rank, wealth, and ancestral
    sacrifice. He contrasts an early age of simple human life and Perfect virtue with
    later rulers, warfare, oppression, and failed instruction, and he accuses Khung
    Kiu of hypocrisy and greater robbery.
  language: English
  quote_policy: quoted
