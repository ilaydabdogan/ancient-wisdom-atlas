canonical_text:
  quote: ''
  summary: The passage discusses Kwang-jze's historical setting, his relation to the
    views of Lao-ze and Khung-jze, and a narrator's interpretation that apparently
    hostile or contradictory language may conceal support. It illustrates this with
    a disguised prince stopped at a city gate, whose servant's abuse enables the prince
    to escape. The passage then discusses the listing of Taoist figures, doubts about
    several books, and the episode in which Lao-ze rebukes Yang Jze-hu for a proud
    manner, after which Yang is abashed and the lodging-house occupants change their
    behavior toward him.
  language: English
  quote_policy: summarized
