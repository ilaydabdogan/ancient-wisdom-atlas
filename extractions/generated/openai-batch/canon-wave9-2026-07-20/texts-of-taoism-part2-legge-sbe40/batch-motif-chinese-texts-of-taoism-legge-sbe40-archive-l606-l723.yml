canonical_text:
  quote: When life comes, it cannot be declined; when it goes, it cannot be detained.
  summary: The passage teaches that bodily nourishment alone cannot preserve life,
    that life and destiny exceed ordinary control, and that abandoning worldly entanglements
    allows restoration of vital power and union with Heaven. It then presents Lieh-3ze
    asking the warden Yin how the perfect man can pass through water, fire, and height
    without obstruction, burning, or fear; Yin attributes this to preservation of
    the pure breath of life rather than skill or daring.
  language: English
  quote_policy: quoted
