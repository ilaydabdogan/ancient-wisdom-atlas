canonical_text:
  quote: ''
  summary: 'A dialogue contrasts the pursuit of honor, riches, pleasures, and power
    with a teaching about proper measure. Know-the-Mean criticizes worldly calculation
    and argues that even royal dignity and wealth do not remove misfortune. Dissatisfied
    replies that riches allow one to command arts, strength, wisdom, virtue, pleasure,
    and awe. Know-the-Mean answers that the wise act for the people according to proper
    rule and degree: they do not strive when they have enough, seek when lacking,
    and decline excess without relying on external compulsion.'
  language: English
  quote_policy: summarized
