canonical_text:
  quote: ''
  summary: The passage describes an unchanging sage sovereign, a king who follows
    a teacher without being hindered, and a political crisis after a violated treaty.
    Counselors debate assassination, war, non-attack, and seeking the Tao; a visitor
    then gives an allegory of two kingdoms warring on a snail's horns and asks the
    king to consider illimitable space.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sovereign 2'an-hsiang is said to possess a central principle around which
    all things revolve, to follow things to completion, and to witness daily changes
    without himself changing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sage is described as not thinking of Heaven, men, taking the initiative,
    or what is external to himself; he moves with his age and is not exhausted by
    his doings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thang appoints Man-yin Tang-hang to hold the reins of government and employs
    him as teacher, following the master without being hampered by him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A'ung-ni is cited with the saying that one should task one's thoughts to the
    utmost, and Yung-khang is cited on the relation between days and year, and internal
    and external.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: King Yung of Wei makes a treaty with the marquis Thien Mau of Khi; the marquis
    violates it, and the king becomes enraged and intends assassination.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Minister of War, Yen, asks for command of 200,000 soldiers and proposes
    a violent military attack, capture of people and officers, seizure of animals,
    storming of the capital, and punishment of the enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ti-jze objects to Yen's counsel, citing the completed eighty-cubit wall, the
    toil of convict builders if it is destroyed, and seven years of mobilized troops.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hwa-jze says that advocating attack, advocating non-attack, and merely criticizing
    both counsels would all produce disorder, and advises the king to seek the Tao.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hui-jze introduces Tii ^m-2a.n^ to the king.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tii ^m-2a.n^ tells the king of a snail whose left horn bears a kingdom called
    Provocation and whose right horn bears a kingdom called Stupidity; the two kingdoms
    continually fight over territory.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the snail allegory, corpses amount to several myriads, and a defeated army
    returns after fifteen days.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The king calls the snail-horn account empty talk; the visitor then asks whether
    space in all directions can be limited, and the king answers that it is illimitable.
  category: speech
  evidence_refs:
  - ev:11
