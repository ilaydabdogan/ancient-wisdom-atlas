  quote: ''
  summary: The passage contrasts human arrogance and contention with the Heavenly/Tao,
    teaches that knowing the Tao without speaking of it accords with the Heavenly,
    gives an anecdote of a man who learns dragon-slaughtering at great cost but never
    uses it, and contrasts trivial human cleverness with the perfect person’s orientation
    toward the Grand Unity and what precedes the Beginning.
  language: English
  quote_policy: summarized
