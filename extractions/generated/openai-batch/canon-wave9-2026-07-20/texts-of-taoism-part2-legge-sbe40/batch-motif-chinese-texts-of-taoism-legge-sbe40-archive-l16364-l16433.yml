  summary: A catalogue passage lists Sacred Books of the East volumes XII-XIX. It
    describes the Śatapatha-Brāhmaṇa volume as treating Vedic sacrificial ceremonies
    and containing an early Indian Deluge account, and describes the Fo-sho-hing-tsan-king
    as a life of Buddha whose legends are said to show some similarity to the Evangelium
    infantiae.
