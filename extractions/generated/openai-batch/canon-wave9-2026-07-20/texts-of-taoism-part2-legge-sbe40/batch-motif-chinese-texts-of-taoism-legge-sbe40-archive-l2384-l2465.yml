canonical_text:
  quote: the getting or losing it did not make me what I was
  summary: An interlocutor asks Sun-shu Ao why repeated appointment and dismissal
    did not elate or grieve him. Sun-shu Ao answers that office, dignity, and honor
    do not determine what he is. Aung-ni then describes the True men of old as unaffected
    by compulsion, death and life, rank, mountain, gulphs, and low positions. A final
    anecdote contrasts the repeated destruction of Fan with the preservation of what
    was most deserving to be preserved, and the preservation of Kh^i with failure
    to preserve what was most deserving.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An interlocutor asks Sun-shu Ao about having been three times chief minister
    without elation and three times dismissed without manifesting sorrow, and observes
    his regular quiet breathing through the nostrils.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sun-shu Ao says that when the position came to him he thought it should not
    be rejected, and when it was taken away he thought it could not be retained.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sun-shu Ao says that getting or losing the position did not make him what
    he was and gave no occasion for sorrow; he also says he did not know whether the
    honor belonged to the dignity or to himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aung-ni says the True men of old could not be fully described by the wisest,
    led into excess by the most beautiful, forced by the most violent robber, or compelled
    by Fii-hsi or Hwang-Ti to be friends.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aung-ni says death and life could make no change in the True men's true self,
    and that rank and emolument could do so still less.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aung-ni says the spirits of such men might pass over the Th^i mountain without
    obstacle, enter the greatest gulphs without being wet, and occupy the lowest and
    smallest positions without distress.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aung-ni says the True men had the fulness of heaven and earth, and that the
    more they gave to others, the more they had.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king of Kh^i and the ruler of Fan sit together; attendants of the king
    say that Fan has been destroyed three times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ruler of Fan replies that the destruction of Fan has not been sufficient
    to destroy what they had that was most deserving to be preserved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator concludes that if Fan's destruction had not destroyed what was
    most deserving to be preserved, then Kh^i's preservation had not preserved what
    was most deserving; from that view, Fan had not begun to be destroyed and Kh^i
    had not begun to be preserved.
  category: speech
  evidence_refs:
  - ev:6
