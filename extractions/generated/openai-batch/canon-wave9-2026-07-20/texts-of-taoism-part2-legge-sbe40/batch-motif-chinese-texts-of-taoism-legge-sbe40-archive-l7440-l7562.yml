canonical_text:
  quote: ''
  summary: A dialogue questions conventional distinctions of kinship, rank, and age,
    then uses exemplary rulers, rival schools, and sufferers from virtue to argue
    that reputation, gain, and rigid moral conduct distort the Heavenly in oneself.
    Wu-yo counsels abandoning striving, returning to the Heavenly within, and holding
    to an inner point where conditions converge. A new exchange begins on reputation,
    gain, wealth, and honor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 3ze-/^ang asks how the fivefold arrangement of virtues and six social parties
    can be separated if distinctions of kinship, rank, and age are not observed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Man Kiu-teh replies by citing rulers and political figures who killed, banished,
    deposed, overthrew, displaced, or killed relatives or rulers, and asks whether
    they observed the stated social distinctions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Man Kiu-teh contrasts the Literati, who make hypocritical speeches, with the
    followers of Mo, who hold that all should be loved equally.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Man Kiu-teh says the other speaker is for reputation while he is for gain,
    and proposes referring the matter to Wu-yo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wu-yo says the small man pursues wealth and the superior man pursues reputation;
    he adds that both would be the same if they abandoned what they do and replaced
    it with doing nothing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wu-yo advises not being a small man or a superior man, but returning to and
    following the Heavenly in oneself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wu-yo instructs the listener to view crooked and straight, right and wrong
    in the light of Heaven, and to hold fast the ring in oneself where all conditions
    converge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wu-yo lists named people whose loyalty, good faith, disinterestedness, or
    righteousness resulted in mutilation, drowning, wasting away, loss, or distress.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mr. Dissatisfied asks Mr. Know-the-Mean about the pursuit of reputation and
    gain, saying that rich men attract others who then honor them as nobler.
  category: speech
  evidence_refs:
  - ev:7
