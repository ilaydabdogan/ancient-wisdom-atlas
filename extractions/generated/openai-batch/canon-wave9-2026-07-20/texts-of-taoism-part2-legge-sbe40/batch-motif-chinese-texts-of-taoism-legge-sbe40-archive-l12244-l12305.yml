  summary: The passage is an editorial and scholarly note on the ordering and authorship
    of books attributed to Kwang-^ze. It reports Lin Hsi-^Ling's omission and reordering
    of several books, cites Su 3ze-/^an's view about joining the Lieh Yii-khau to
    an earlier paragraph, and argues that the last paragraph describing Kwang-^ze
    about to die marks the end of his own writing, compared to the appearance of the
    Lin in the case of Confucius.
  language: English
