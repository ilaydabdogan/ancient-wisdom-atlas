canonical_text:
  quote: ''
  summary: A sequence of anecdotes describes rulers offering or giving up rule, and
    various figures refusing office, withdrawing from power, or leaving territory
    to preserve life and avoid harm. Yao and Shun offer the throne to several people
    who decline; Shan A'lian and a farmer withdraw to remote places. Thai-wang Than-fu
    abandons contested territory rather than let people be killed, is followed by
    his people, and founds a new state at Mount Khi. A final incomplete episode says
    the people of Yueh repeatedly killed rulers, after which prince Sau fled to the
    caves of Tan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yao proposes to resign the throne to Hsii Y<i, who does not accept it, and
    then offers it to 3ze-^au Kih-fiX^.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 3ze-^au Kih-fiX^ refuses the throne, saying he is suffering sorrow and illness
    and has no leisure to govern the kingdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says the throne is the most important position, but this man
    would not occupy it to the injury of his life; the narrator adds that only one
    who does not care to rule the kingdom is fit to be entrusted with it.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Shun proposes to resign the throne to ^ze-Mu A'ih-po, who declines in the
    same terms as the previous refuser; the narrator says this shows how those who
    possess the Tao differ from common men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shan A'lian describes himself as a unit in space and time, living by seasonal
    clothing, ploughing, sowing, harvesting, working at sunrise, resting at sunset,
    and being content between heaven and earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shan A'lian declines Shun's proffered throne and goes away deep among the
    hills, where no one knows his location.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A farmer of Shih-h{i, Shun's friend, doubts his own capacity to govern if
    Shun cannot, then carries his wife, leads his son, and goes to the sea-coast,
    from which he never returns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While Thai-wang Than-fu is dwelling in Pin, wild tribes of the North attack
    him; they are not satisfied with skins and silks, dogs and horses, or pearls and
    jade, because they seek his territory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thai-wang Than-fu says he cannot bear to dwell in a way that causes elder
    and younger brothers, or fathers and sons, to be killed, and says one should not
    use what nourishes the people to injure them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thai-wang Than-fu takes his staff and switch and leaves; the people follow
    him in an unbroken train, and he establishes a new state at the foot of Mount
    Khi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator says Thai-wang Than-fu gave due honour to life and contrasts
    this with people of the present age who expose their persons to ruin for gain.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The people of Yueh kill their ruler three times in succession; prince Sau,
    distressed by this, escapes to the caves of Tan, leaving Yueh without a ruler.
  category: sequence
  evidence_refs:
  - ev:8
