canonical_text:
  quote: The Tao made Its appearance before Heaven and Earth.
  summary: A commentator analyzes Book XXII by describing the Tao as prior to Heaven
    and Earth, the Root and Origin of things, beyond existence and non-existence,
    honored through non-action and returning to the Root. The passage treats life
    and death as collection and dispersion of breath, praises unknowing and wordless
    speech, recounts instructions given by named figures, and rejects attempts to
    limit the Tao to either mystery, positive existence, or divided categories.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Tao is described as appearing before Heaven and Earth, making things what
    they are, being no thing, and being called their Root and Origin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that treating the Tao as existing or non-existing does not
    fully express it, and that knowing or telling adds knowledge or description to
    the idea of it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The one who would embody the Tao is said to use the names Do Nothing and Returning
    to the Root, then proceed toward the Unknown and Indescribable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Tao is said originally to have been a Unity; life is described as collection
    of breath and death as its dispersion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The labels spirit-like and wonderful for life, and foetor and putridity for
    death, are said to be the work of man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Knowledge, Heedless Bluster, and Hwang-Ti are said to have perceived this
    teaching but also reasoned about it, showing that not knowing is better than knowing
    and not talking better than talking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The operations of Heaven and Earth and the constitutions of all things are
    described as continuing without difference from oldest time to the present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Phei-i tells Nieh to keep his body as it should be, look only at the One thing,
    call in knowledge, and make his measures uniform.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Phei-i further tells Nieh to have the simple look of a new-born calf and not
    ask about the cause of his being what he is.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The commentary interprets Phei-i’s instruction as saying that one is to do
    nothing, return to the Tao as Root, know by not knowing, and speak without requiring
    words.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A person who thinks the Tao is his to hold is said not to know the Tao or
    himself, because he is only a thing in the Tao.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Life and death are described as not belonging to the person’s own agency;
    the person is about to return to the original source.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The bodily frame is described as coming from incorporeity and returning to
    it, which is said to be beyond seeing and hearing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Tao’s presence is said to be seen in an ant, a stalk of panic grass, an
    earthenware tile, and excrement.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage lists paired ideas such as fullness and emptiness, withering and
    decay, beginning and end, and accumulation and dispersion, while saying that the
    Tao has no limit belonging to things.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage rejects reducing the Tao either to the name Mystery or to divided
    categories such as noble and mean, compressed and dispersed.
  category: speech
  evidence_refs:
  - ev:7
