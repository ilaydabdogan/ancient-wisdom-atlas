canonical_text:
  quote: ''
  summary: The passage analyzes Book VI by identifying the Tao as the Great and most
    Honoured Master, beyond life and death, present in Heavenly and Human elements.
    It describes the True Man's possession of True Knowledge through nourishing what
    knowledge does not know, forgetting distinctions, and entering a region neither
    life nor death. It contrasts the mortal body with the enduring Tao and states
    that the sage enjoys this Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tao is identified as the Great and most Honoured Master and is described
    as present in Heavenly and Human elements and beyond death and life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that one who wishes to get the Tao must nourish what attained
    knowledge is still ignorant of; when both are forgotten, transformation by the
    Tao leads into a region with neither life nor death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Knowledge is said not to know the time of birth and death, while knowing what
    comes after birth and before death; the True Man with True Knowledge has no anxiety
    about this difficulty.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The True Man undergoes adversities, prosperities, successes, defeats, gains,
    losses, security, unrest, and changes of circumstance, but his mind forgets them
    all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The True Man's bodily conditions, including sleeping, waking, eating, and
    resting, are also forgotten by the mind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that Mind, Tao, Heavenly, and Human are simply One.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The unconsciousness of the mind is carried from mind to body and from body
    to world, allowing the True Man to comprehend the time and requirements of things
    without one-sidedness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Death and life are compared to night and dawn, and no human power is said
    to command or preside over them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The body is said to be born, grow old, and die; this is described as the common
    lot, and the body will disappear however skillfully it is hidden.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says that what might seem like man's body never comes to an end,
    that the Tao itself does not disappear, and that those who have got it have not
    passed away from notice.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The sage is said to enjoy himself in the Tao.
  category: action
  evidence_refs:
  - ev:9
