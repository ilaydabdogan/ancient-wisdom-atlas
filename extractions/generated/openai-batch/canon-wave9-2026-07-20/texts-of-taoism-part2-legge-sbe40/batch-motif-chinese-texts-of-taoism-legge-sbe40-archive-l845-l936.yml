canonical_text:
  quote: ''
  summary: 'A dialogue discusses nourishing life through a shepherding analogy and
    two cautionary examples: Shan Pao, who cultivated inwardly but was eaten by a
    tiger, and A"ang 1, who cultivated outward status but died of fever. Kung-ni then
    advises neither withdrawal nor display and warns against unnoticed dangers in
    ordinary living. A separate episode shows an officer of Prayer addressing pigs
    prepared for ritual death, contrasting his viewpoint with theirs. The passage
    ends with Duke Hwan hunting by a marsh and seeing a ghost.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khdi-/^ih reports his master’s saying that those who skilfully nourish life
    are like shepherds who whip up sheep lagging behind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shan Pao lived among rocks in Lu, drank only water, avoided common toils and
    benefits, retained a childlike complexion in his seventieth year, and was killed
    and eaten by a hungry tiger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A"ang 1 displayed a screen at his lofty door, drew many visitors, became ill
    with fever in his fortieth year, and died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker states that Pao nourished his inner man while a tiger ate his
    outer man, and that A"ang 1 nourished his outer man while disease attacked his
    inner man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kung-ni says a person should neither retire and hide nor push forward and
    display himself, but should be like a decayed tree standing in the centre of the
    ground.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kung-ni contrasts warned dangers on a path with unwarned dangers incurred
    on bed mats and in eating and drinking.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The officer of Prayer, wearing dark square-cut robes, goes to a pig-pen and
    asks the pigs why they should shrink from dying.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The officer says the pigs will be fed grain for three months, followed by
    his fasting and vigil, and then their shoulders and rumps will be placed on white-grass
    mats and a carved stand.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: From the pigs’ standpoint, the better plan would be to receive bran and chaff
    and remain in their pen.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: For himself, the officer would prefer official carriage and cap while alive
    and an ornamented carriage and coffin canopy after death.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Duke Hwan hunts by a marsh with Kwan A'ung driving the carriage and sees a
    ghost.
  category: sequence
  evidence_refs:
  - ev:10
