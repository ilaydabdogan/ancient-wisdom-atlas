canonical_text:
  quote: "“The Tao was produced before heaven and earth.”"
  summary: 'The passage analyzes teachings about the Tao: questions about it should
    not be answered, language and knowledge are inadequate, the Tao precedes heaven
    and earth, is not a thing, is beyond time, and is the source of life and death.
    It also describes figures who embody it as internally unchanged amid external
    change, links non-action with returning to the Root, and reports a commentator’s
    claim that mastering the Book opens the Mahayana of the Tripitaka.'
