canonical_text:
  quote: Perfect speech is to put speech away; perfect action is to put action away
  summary: The speaker says that forests and marshes bring joy, but sadness soon follows,
    and neither the coming nor going of these emotions can be controlled. Human beings
    are described as temporary lodging-places for things and emotions, limited in
    knowledge and power, and unable to avoid what cannot be avoided. The passage concludes
    with aphorisms about putting away speech and action and despising exhaustive mastery
    of known knowledge. An editorial note mentions an unnamed personage previously
    appearing among ancient sovereigns in possession of the Tao and refers to his
    park as a place of moral and intellectual inquiry.
  language: English
  quote_policy: quoted
