canonical_text:
  quote: ''
  summary: The passage presents Confucius enduring hunger, siege, and political danger
    while playing his lute and singing; he explains to his disciples that distress
    does not compromise inner virtue when principles are intact. The narrator generalizes
    this as the happiness of those who have attained the Tao, independent of success
    or extremity. A following section tells of Shun offering the throne to the Northerner
    Wu-cai, who rejects the offer and throws himself into an abyss, and of Thang consulting
    counselors before attacking Kieh, later offering the throne to Pien Sui, who rejects
    it and drowns himself.
  language: English
  quote_policy: summarized
