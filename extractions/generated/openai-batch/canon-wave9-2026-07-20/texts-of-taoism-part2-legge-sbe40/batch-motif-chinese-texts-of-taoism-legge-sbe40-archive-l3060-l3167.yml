canonical_text:
  quote: ''
  summary: The passage includes editorial notes identifying Kwang Yao as personified
    starlight and Non-entity as a personification of the Tao. A skilled sword-forger
    explains that long practice allowed him to work without conscious thought. Zan
    Khiu asks A'ung-ni about the state before heaven and earth, and A'ung-ni answers
    with statements about timelessness, death and life, and a non-thing source of
    things. Yen Yuan asks about not welcoming or moving to meet others, and A'ung-ni
    answers by contrasting inner constancy with external change and by describing
    sages who do not wound others.
  language: English
  quote_policy: summarized
