canonical_text:
  quote: ''
  summary: An officer counsels a ruler to renounce status and wants in order to journey
    toward Great Vacuity and gives the parable of the empty boat. Pei-kung She explains
    tax collection and bell-making through undivided attention, simplicity, and non-interference.
    Thai-kung Zan instructs besieged Confucius with the example of low-flying, mutually
    assisting birds of the eastern sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ruler says the way is distant and difficult, includes rivers and hills,
    and he lacks boat or carriage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The officer from Shih-nan says that abjuring personal state and giving up
    the wish to remain will serve as a carriage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ruler asks who will accompany him on the solitary distant way and how
    he will obtain food without prepared provisions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officer tells the ruler to minimize expenditure and wants, to wade rivers
    and float on the sea, and to enjoy himself with the Tao in the land of Great Vacuity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The officer states that one who owns men as ruler has troubles, one owned
    by men as ruler has sadness, and Yao would do neither.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the empty-vessel parable, a choleric man is not angry when an empty vessel
    collides with his boat, but he shouts and abuses when he thinks a person is in
    the other boat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The officer concludes the parable by saying that a man who can empty himself
    of himself during his time in the world cannot be harmed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pei-kung She collects taxes for duke Ling of Wei for a peal of bells, builds
    an altar outside the suburban wall gate, and completes the bells in three months.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king's son asks what arts were used; Pei-kung She says he used undivided
    attention and no arts, citing a saying about returning to simplicity after carving
    and chiselling.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pei-kung She says he was like a child without knowledge, slow and hesitant,
    and that the work grew of itself like springing plants.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pei-kung She says he did not hinder comers or detain goers, allowed opponents
    and negotiators to take their way, and collected taxes morning and evening without
    trouble.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Confucius is besieged between Khau and Zhai and for seven days has no food
    cooked with fire; Thai-kung Zan comes to condole and asks about death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Thai-kung Zan describes eastern sea birds called i-is that fly low and slowly,
    assist one another, roost pressed together, avoid leading or being last, and avoid
    taking the first mouthful.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Thai-kung Zan says the birds' line has few breaks and people outside them
    cannot harm them, so they escape injury.
  category: speech
  evidence_refs:
  - ev:8
