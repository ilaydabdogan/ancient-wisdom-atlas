canonical_text:
  quote: ''
  summary: The excerpt introduces Appendix VII, a stone-tablet inscription for the
    Temple of Lao-tze attributed to Hsieh Tao-hang. The inscription opens with Primal
    Ether beginning activity, time unfolding, the sky, sun, moon, earth, mountains,
    and streams taking their places, and all things, people, and rulers coming into
    being. It then describes ancient sovereigns living simply in tree nests and caves,
    exercising wisdom, and having ceremonies and music aligned with heaven and earth.
    A later sequence describes the loss of Tao, the replacement by Characteristics
    and then Benevolence, a decline in popular manners, and disputes among Literati
    and Mohists.
  language: English
  quote_policy: summarized
