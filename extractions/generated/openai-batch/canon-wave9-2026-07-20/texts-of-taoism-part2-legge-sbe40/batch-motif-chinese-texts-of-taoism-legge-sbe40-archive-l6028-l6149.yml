canonical_text:
  quote: ''
  summary: The passage reflects on speech without words, the conditions of right and
    wrong, the cyclic succession of things under the Lathe of Heaven, a dialogue about
    Confucius changing his judgments, an attributed saying about the Great Source
    and original intelligence, and an anecdote about Shan/3^ng-jze, filial feeling,
    office, emolument, and entanglement. It ends with the opening of a further instructional
    dialogue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Words are likened to water daily issuing from a cup and harmonized by the
    Heavenly Element.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that without words there is an agreement in principle, and
    that one may speak all life without speaking a right word or be silent all life
    while giving right utterance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage presents paired questions about right and wrong, allowable and
    not allowable, and says things have conditions of rightness and allowability.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: All things are said to be divided into classes, to succeed one another, and
    to begin and end as in an unbroken ring called the Lathe of Heaven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A^wang-jze tells Hui-jze that Confucius changed his views in his sixtieth
    year and reversed earlier judgments about what was right and wrong.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hui-jze characterizes Confucius as pursuing knowledge, while A^wang-jze replies
    that Confucius disowned such a course and speaks of powers received from the Great
    Source and restored to original intelligence.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: An attributed saying states that singing should accord with musical tubes
    and speech should be a model, while fixed rule over all under heaven is said not
    to have been attained.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: '3^ng-jze/Shan took office twice: he was happy with small emolument while
    his parents lived and sad with larger emolument when he could not share it with
    them.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The disciples ask K'ung-ni whether Shan was free from entanglement; K'ung-ni
    replies that Shan was subject to entanglement and would have regarded the emoluments
    like a passing heron or mosquito if free.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Yen Kkkng ^ze-yii begins addressing Tung-kwo 3ze-Mi about stages after hearing
    his instructions; only the first year and the start of the second are included
    in the passage.
  category: speech
  evidence_refs:
  - ev:10
