canonical_text:
  quote: ''
  summary: The passage begins with a description of an unnamed person associated with
    nothingness and compared to unobstructed water expanding into Grand Purity, followed
    by a rebuke of people who attend to trivial matters while ignoring Grand Rest.
    It then recounts 5^ao Shang receiving many carriages after a mission and being
    sharply rebuked by A'wang-jze through a humiliating royal-medical analogy. The
    final section has Duke Ai ask Yen Ho whether employing A'ung-ni would cure the
    state; Yen Ho warns against this, criticizing ornamented speech, departure from
    reality, self-conscious government, improper ranking, and forms of external and
    internal punishment.
  language: English
  quote_policy: summarized
