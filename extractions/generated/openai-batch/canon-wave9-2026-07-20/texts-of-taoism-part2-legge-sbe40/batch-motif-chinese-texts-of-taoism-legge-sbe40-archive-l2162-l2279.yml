canonical_text:
  quote: it does nothing, but it naturally acts so
  summary: The passage contains linked anecdotes about natural virtue, true knowledge,
    and recognition of genuine ability. Lao Tan compares the perfect person's virtue
    to spring water and cosmic bodies that act of themselves; Confucius reports that
    his understanding has been unveiled. Zwang-jze argues with duke Ai that Learned
    dress does not prove knowledge, and a test leaves only one old man able to wear
    it and answer state questions. Pai-li Hsi, Shun, an unconventional draughtsman,
    and an old fisherman seen by King Wan are presented as figures whose lack of concern
    for status, display, or ordinary purpose marks their efficacy.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Lao Tan says spring water rises and overflows without deliberate action, and
    compares the perfect man and his virtue to heaven, earth, the sun, and the moon
    acting or being as they are of themselves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius reports the conversation to Yen Hui and says that, without the Master's
    lifting of the veil, he would not have known the grand perfection of Heaven and
    Earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duke Ai says there are many Learned men in Lu; Zwang-jze replies that there
    are few, distinguishing possession of knowledge from wearing the dress of the
    Learned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Zwang-jze proposes a capital penalty for wearing Learned dress without
    knowledge, the duke issues a notification; within five days no one dares wear
    the dress except one old man, who answers the duke's questions on many affairs
    of state.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pai-li Hsi is described as not having rank and emolument in his mind; he becomes
    a cattle-feeder, his cattle prosper, and duke Mu of Qin gives him the government.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shun, the Lord of Yu, is described as not having life or death enter his mind,
    and therefore as able to influence others.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ruler Yuan of Sung asks for a map; most draughtsmen prepare formally, while
    one late and indifferent man withdraws to his shed, removes his upper garment,
    sits cross-legged, and is declared by the ruler to be the true draughtsman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: King Wan sees an old man fishing in a way described as not ordinary fishing,
    wishes to appoint him, worries about opposition, then tells his officers that
    he dreamed of a good man with a dark complexion; the supplied passage breaks off
    during this dream description.
  category: sequence
  evidence_refs:
  - ev:8
