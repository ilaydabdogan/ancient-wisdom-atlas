canonical_text:
  quote: ''
  summary: A commentary analysis of Book I of Zhuangzi explains the title as mental
    wandering in perfect ease, emphasizes the quality of Greatness, interprets the
    phang's long southward flight, contrasts great and small capacities for knowledge,
    describes the Perfect or Sage Man moving with Yin and Yang and the elements, gives
    examples of greatness and usefulness, and ends with stylistic metaphors.
  language: English
  quote_policy: summarized
