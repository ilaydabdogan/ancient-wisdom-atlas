canonical_text:
  quote: ''
  summary: 'The passage contains several short teachings and narratives: a warning
    that human gifts can diminish heavenly spontaneity; an obscure swallow example
    involving fear of humans and protection near altars; A''ung-ni''s answers about
    beginning and end, continual rise and dissolution, and the relation of the Human
    and the Heavenly; a story in which A''wang Kau sees a strange bird, a cicada,
    and a mantis caught in a chain of predation and then reflects on his own error;
    and a Yang-jze story in which a household honors an ugly concubine over a beautiful
    one, leading to a lesson against priding oneself on virtue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that human gifts are attractive but tend to take away a
    person's heavenly spontaneity, so they should be avoided or accepted cautiously.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A swallow or swallow-like bird is described as fearing humans while nevertheless
    dwelling near them and finding protection in the altars of the Land and Grain;
    the translator notes that the passage is obscure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A'ung-ni says that the change, rise, and dissolution of all things continually
    goes on, while the one who maintains the process is unknown; he says people do
    not know when someone begins or ends and must simply wait.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A'ung-ni says that the Human and the Heavenly are one and the same, that man's
    inability to have Heaven is due to the limitation of his nature, and that the
    sagely man quietly passes away with his body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: While rambling in the park of Tiao-ling, A'wang Kau sees a strange bird from
    the south with very wide wings and large eyes; it brushes his forehead and lands
    in a chestnut grove.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A'wang Kau questions why the strange bird neither continues flying nor sees
    him, then lifts his skirts and hurries with a cross-bow, waiting for an opportunity
    to shoot it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A cicada alights in a shady spot and forgets care for its body; a preying
    mantis pounces on the cicada and also forgets care for its body; the strange bird
    then seizes both while forgetting its own preservation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A'wang Kau says that things bring evil on one another and that each creature
    invited its own calamity; he puts away his cross-bow and hurries away, but the
    forester reproaches him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After returning home, A'wang-jze avoids appearing in his courtyard for three
    months; when Lan Ju asks why, he explains that he guarded his person and forgot
    himself, mistook a clear pool while looking at turbid water, and had been reproached
    by the forester.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yang-jze stays at a lodging-house whose master has two concubines, one beautiful
    and one ugly; the ugly one is honored and the beautiful one contemned.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A little boy explains that the beautiful concubine knows her beauty and the
    household does not recognize it, while the ugly concubine knows her ugliness and
    the household does not recognize it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Yang-jze tells his disciples to act virtuously while putting away the practice
    of priding themselves on their virtue, saying that this will make them loved wherever
    they go.
  category: speech
  evidence_refs:
  - ev:8
