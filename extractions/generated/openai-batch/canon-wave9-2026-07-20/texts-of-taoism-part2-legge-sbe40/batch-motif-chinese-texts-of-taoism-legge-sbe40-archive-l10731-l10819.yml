canonical_text:
  quote: ''
  summary: The passage presents aphorisms on invisible motivating springs, the differing
    use of such a spring by superior and small persons, compensated senses, the mind's
    dependence on external things and the eyes, Heaven's impersonal operation, undesigned
    thunder and wind, breath as a means of control, reciprocal relations between life
    and death and between kindness and injury, and self-destruction through water
    or fire.
  language: English
  quote_policy: summarized
