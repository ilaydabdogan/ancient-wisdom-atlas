canonical_text:
  quote: "“Like seeks to like, and (birds) of the same note respond to one another;—this
    is a rule of Heaven.”"
  summary: A stranger later identified by context as a fisherman questions Confucius's
    disciples about Confucius, critiques Confucius's socially engaged pursuits as
    harmful to his true nature, and departs. Confucius sets aside his lute, seeks
    the fisherman at the lake, bows, and asks for instruction. The fisherman praises
    his love of learning and teaches about like responding to like, the affairs of
    men, the correct duties of social classes, and the troubles of common people,
    officers, feudal lords, and the Son of Heaven and his ministers.
  language: English
  quote_policy: quoted
literal_observations:
