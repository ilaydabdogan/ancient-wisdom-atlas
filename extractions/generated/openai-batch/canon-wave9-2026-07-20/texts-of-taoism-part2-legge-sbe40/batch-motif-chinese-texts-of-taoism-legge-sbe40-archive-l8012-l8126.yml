  evidence_refs:
  - ev:2
- id: obs:4
  text: 3ze-kung describes Confucius as devoted to sincerity, benevolence, righteousness,
    ceremonies, music, social relationships, loyalty to lords, transformation of the
    people, and benefit to the kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stranger asks whether Confucius possesses territory or serves any prince
