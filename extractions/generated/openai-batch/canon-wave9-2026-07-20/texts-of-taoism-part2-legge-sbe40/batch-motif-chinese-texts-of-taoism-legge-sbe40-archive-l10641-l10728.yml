  quote: ''
  summary: The passage presents aphorisms and commentary on harmony between unseen
    and seen orders through Heaven, Earth, and Man. It describes powers of giving
    life, taking life, rest, motion, transformation, human bodily restraint, wise
    cultivation as sagehood, mutual despoiling among Heaven, Earth, all things, and
    Man, and a brief reference to Spirit, sun, and moon.
  language: English
  quote_policy: summarized
