canonical_text:
  quote: ''
  summary: A speaker describes a multi-year process of becoming docile, comprehending
    a teaching, receiving spirit, perfecting Heaven-given nature, ceasing to distinguish
    death and life, and attaining the Great Mystery. The passage then reflects on
    life, death, Yang, Heaven, earth, and possible spirits presiding over conduct.
    A dialogue follows in which penumbrae ask a shadow why its posture and state change;
    the shadow says it appears with light and sun, fades with darkness and night,
    depends on a substance, and is produced with that substance by strong Yang. A
    final anecdote tells of Yang 3ze-ju meeting Lao Tan/Lao-jze, being rebuked for
    lofty eyes and staring, humbling himself, serving Lao-jze with washing items,
    and later being treated less ceremonially by lodging-house people after his arrogance
    gives way to humility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker reports a sequence of yearly attainments, including
    docility, comprehension of teaching, spiritual indwelling, perfection of Heaven-given
    nature, loss of distinction between death and life, and attainment of the Great
    Mystery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that life has work to do and death ensues, and it questions
    whether life from the operation of Yang has a cause.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Heaven has calculable places and spaces and that divisions
    of earth can be assigned by men, while the conditions of the Great Mystery cannot
    be readily searched out.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage raises questions about whether spirits preside over issues of
    conduct deemed appropriate or inappropriate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The penumbrae ask the shadow why it has changed from looking down to looking
    up, from tied-up hair to dishevelled hair, from sitting to rising, and from walking
    to stopping.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The shadow says its changes belong to it, but it does not know how they do
    so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The shadow compares itself to a cicada shell and to the cast-off skin of a
    snake, saying it is like them and yet not like them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The shadow says it appears with light and the sun and fades away with darkness
    and night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The shadow says it depends on the substance from which it is thrown, while
    that substance depends on something else.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The shadow says that when the substance comes or goes, it comes or goes with
    it, and that both shadow and substance are produced by the strong Yang.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Yang 3ze-ju travels south to Phei, while Lao Tan is travelling west in Khm;
    Yang asks Lao-jze to come to the border and meets him at Liang.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Lao-jze stands in the middle of the way, looks up to heaven, sighs, and says
    he now sees Yang cannot be taught.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At the lodging-house, Yang brings water, towel, and comb for Lao-jze, removes
    his shoes outside the door, advances on his knees, and asks why Lao-jze spoke
    as he did.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Lao-jze replies that Yang's eyes are lofty and staring, and says that the
    purest carries himself as if soiled and the most virtuous seems to feel defective.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Yang looks abashed, changes countenance, and says he receives the commands
    with reverence.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: On Yang's arrival at the lodging-house, people precede him, the master carries
    his mat, the mistress brings towel and comb, lodgers leave their mats, and the
    cook leaves his fireplace.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: When Yang departs, others in the house would have contended with him for places
    for their mats; the note explains this as his arrogant superciliousness giving
    place to humility.
  category: sequence
  evidence_refs:
  - ev:17
