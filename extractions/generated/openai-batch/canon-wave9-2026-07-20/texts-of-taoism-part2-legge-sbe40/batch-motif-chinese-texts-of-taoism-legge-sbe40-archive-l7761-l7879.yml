canonical_text:
  quote: ''
  summary: 'The passage introduces a court story in which a crown-prince seeks Kwang-3ze''s
    help in turning the king away from delight in sword-fighting. Kwang-3ze refuses
    an initial silver offer, adopts a swordsman''s dress to gain access to the king,
    speaks in the idiom of sword skill, and then begins a discourse on three swords:
    the sword of the Son of Heaven, the sword of a feudal prince, and the sword of
    a common man. The preserved excerpt ends while describing the cosmic and territorial
    scope of the sword of the Son of Heaven.'
  language: English
  quote_policy: summarized
