canonical_text:
  quote: ''
  summary: The passage presents several anecdotal exchanges. Hui-jze describes disputants
    who cannot prove him wrong, and A'wang-jze answers with analogies about musical
    strings, a man who values ritual objects over his son, and a quarrel with a boatman.
    A'wang-jze then passes Hui-jze's grave and uses the story of artisan Shih's axe-skill
    to say that, since the Master's death, he has no one with whom to talk. The final
    anecdote shows the ill Kwan A'ung advising duke Hwan against Pao Shu-ya and recommending
    Hsi Phang as a successor for administering the state.
  language: English
  quote_policy: summarized
