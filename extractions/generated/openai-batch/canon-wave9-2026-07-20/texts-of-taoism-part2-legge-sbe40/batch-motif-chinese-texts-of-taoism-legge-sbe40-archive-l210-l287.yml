canonical_text:
  quote: ''
  summary: The passage asks whether perfect enjoyment and preservation of life are
    possible. It lists riches, dignities, longevity, bodily ease, rich flavors, fine
    garments, beautiful colors, and pleasant music as things honored or enjoyed by
    the world, then criticizes bodily and status-oriented pursuits as sources of sorrow,
    fear, labor, and anxiety. It says birth brings sorrow and long life increases
    anxiety about death. It also advises a faithful remonstrant not to contend when
    a ruler will not listen, introducing Sze-hsu as an example.
  language: English
  quote_policy: summarized
