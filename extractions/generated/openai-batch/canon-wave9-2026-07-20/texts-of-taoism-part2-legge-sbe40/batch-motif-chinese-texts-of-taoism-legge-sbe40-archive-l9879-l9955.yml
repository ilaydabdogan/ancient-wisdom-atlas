canonical_text:
  quote: ''
  summary: 'A didactic catalogue lists wrongful actions: intimidation by rank, killing
    and wounding, waste of cloth and grain, cooking animals without ritual need, burdening
    living creatures, ruining families, damaging dwellings by water or fire, envy,
    lust, curses, mockery, suppression of ability, sorcery by burying another''s image,
    poisoning trees, disrespect toward teachers and kin, theft, deceit, unfair punishment,
    oppression, complaints against Heaven, reviling spirits and natural phenomena,
    calumny, broken reciprocity, overburdening others, hypocrisy, and giving filthy
    food. The supplied passage ends mid-phrase.'
  language: English
  quote_policy: summarized
