canonical_text:
  quote: ''
  summary: The passage recounts Shan Nang's reaction to the report that Lao-lung is
    dead, followed by dialogues among metaphorically named figures concerning whether
    the Tao can be known, heard, seen, spoken, named, asked about, or answered about.
    It includes an image of those without internal knowledge being unable to cross
    Khwan-lun or roam in the Grand Void, then presents Starlight questioning Non-entity
    and perceiving only a deep void. The passage closes by introducing an aged sword-forger
    whose skill remains intact.
  language: English
  quote_policy: summarized
