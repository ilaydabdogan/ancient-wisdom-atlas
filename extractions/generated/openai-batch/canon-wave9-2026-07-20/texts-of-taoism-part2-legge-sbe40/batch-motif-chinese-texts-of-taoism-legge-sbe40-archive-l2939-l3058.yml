  evidence_refs:
  - ev:1
- id: obs:2
  text: Shan Nang reacts by taking his staff, rising, laying the staff aside, laughing,
    and saying that Heaven has cast him off and that without a Master to correct his
    heedless words it is for him to die.
  category: sequence
  evidence_refs:
  - ev:1
