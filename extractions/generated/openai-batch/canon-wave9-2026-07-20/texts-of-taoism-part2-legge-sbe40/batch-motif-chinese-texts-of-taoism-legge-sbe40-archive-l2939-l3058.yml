  text: Yen Kang, who has come to condole, says that superior men cling to one who
    embodies the Tao and that attempts to discuss the Tao misrepresent it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grand Purity asks Infinitude and Do-nothing whether they know the Tao; Infinitude
    says he does not know it, while Do-nothing says he knows it through marks such
    as noble, mean, compressed, diffused.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: No-beginning judges the statement of not knowing the Tao as profound and internal,
