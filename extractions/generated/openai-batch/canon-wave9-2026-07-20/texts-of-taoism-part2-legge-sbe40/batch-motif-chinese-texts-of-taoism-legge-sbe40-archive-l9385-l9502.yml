canonical_text:
  quote: ''
  summary: The passage praises Kwan Yin and Lao Tan as ancient True men, then describes
    questions about formlessness, transformation, death, life, Heaven and Earth, and
    spiritual intelligence as ancient Tao concerns appreciated by Zwang-3ze. It characterizes
    Zwang-3ze's style as strange, mystical, illustrative, non-partisan, and concerned
    with the operations of heaven and earth, the Root, the Maker, and transformation.
    It then describes Hui Shih as ingenious but contradictory and lists paradoxical
    sayings about great and small, heaven and earth, mountain and marsh, birth and
    death, limits, separation, the world's center, and universal love.
  language: English
  quote_policy: summarized
