canonical_text:
  quote: ''
  summary: Hsu Wu-kwei is introduced by Nii Shang to the marquis Wu of Wei. The marquis
    sympathizes with Hsu's forest hardships, but Hsu replies that the ruler is the
    one needing comfort, warning that indulgence or repression of desires harms the
    ruler's inner condition and senses. After the marquis responds contemptuously,
    Hsu tells him about judging dogs and horses by appearance, especially the superior
    horse whose qualities are complete and who seems to forget himself. The marquis
    laughs. Nii Shang asks why his own canonical and statecraft counsels never produced
    such pleasure. Hsu answers that he only spoke of dogs and horses, then compares
    the ruler's response to the increasing gladness of a wanderer from Yueh at signs
    of home and of isolated valley-dwellers at human footsteps or kin voices, ending
    with the remark that the words of a True man have long not been heard beside the
    ruler.
  language: English
  quote_policy: summarized
