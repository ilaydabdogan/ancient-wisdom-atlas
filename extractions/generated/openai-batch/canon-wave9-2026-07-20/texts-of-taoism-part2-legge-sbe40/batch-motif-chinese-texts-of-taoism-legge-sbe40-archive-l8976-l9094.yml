canonical_text:
  quote: The system of the Tao was about to be torn in fragments all under the sky.
  summary: The passage criticizes later schools for grasping only partial aspects
    of truth and losing the unified ancient Tao. It then discusses Mo Ti and Khwa
    Hwa-li, who valued ancient Taoist restraints against waste and extravagance but
    are said to have applied them excessively. Mo Ti is described as opposing music,
    mourning, fighting, and anger, promoting universal love and common participation,
    and prescribing austere burial practices. The passage contrasts this with ancient
    rulers' music and graded mourning rites, judges Mo Ti's way as contrary to human
    nature, and begins a quotation in which Mo Ti praises Yu for draining flood waters
    and opening river channels.
  language: English
  quote_policy: quoted
