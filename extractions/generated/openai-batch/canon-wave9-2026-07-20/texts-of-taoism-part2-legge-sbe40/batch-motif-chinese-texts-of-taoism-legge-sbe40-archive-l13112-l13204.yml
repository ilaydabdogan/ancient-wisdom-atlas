canonical_text:
  quote: ''
  summary: 'The passage first contrasts ineffective ceremonial and punitive rules
    with the Great Tao as the source and origin of order. It then recounts prodigies
    around Master Lao: star-influenced conception, birth under a plum tree, long concealment
    in the womb, white hair at birth, special bodily marks, appearances across dynasties
    under changed names, and offices in the Zhou period. Hsuan Ni calls him a Dragon;
    Yin Hsi, keeper of the frontier gate, recognizes him as the True Man and obtains
    from him a two-part book that leads human nature back to the Tao and teaches doing
    nothing. The passage describes the book’s effects on self-cultivation, governance,
    bodily refinement, and ascent-like immortal imagery, and ends by declaring the
    Tao too vast for words.'
  language: English
  quote_policy: summarized
