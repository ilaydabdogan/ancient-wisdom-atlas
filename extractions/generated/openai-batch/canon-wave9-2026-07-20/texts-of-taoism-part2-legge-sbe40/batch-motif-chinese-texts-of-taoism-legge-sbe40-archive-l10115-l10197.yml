canonical_text:
  quote: ''
  summary: The passage introduces Appendix I, the Classic of Purity or Purity and
    Rest, describes it as a Taoist mystical canon concerned with subduing the mental
    faculties, and discusses attributed origins. It reports traditions about Ko Yuan/Hsuan
    as an immortal and miracle worker, including survival beneath water, walking on
    water, and ascent to the sky. It also quotes an account in which Ko receives a
    heavenly text through an oral chain of divine transmitters and describes ranked
    spiritual outcomes for scholars who understand, cultivate, or possess it.
  language: English
  quote_policy: summarized
