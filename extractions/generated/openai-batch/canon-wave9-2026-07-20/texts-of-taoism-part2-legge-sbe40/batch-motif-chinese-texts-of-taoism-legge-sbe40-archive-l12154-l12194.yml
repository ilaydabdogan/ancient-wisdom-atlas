canonical_text:
  quote: ''
  summary: An analytical note on Book XXVI says that practitioners of the Tao do not
    rely on external things, control their minds, empty away interference, and follow
    their natural course. It contrasts this with worldly agitation over profit and
    injury, names Yin and Yang and the water and fire of the mind as enemies of serenity,
    and recounts Lao Lai-jze warning Kung-ni against self-conceit because wisdom and
    spirit-like intelligence have limits. It concludes that the sage succeeds through
    anxiety and indecision, while the person of greatest knowledge puts away the idea
    of skill and lets nature take its course.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who practise the Tao are described as knowing that external things cannot
    be relied upon and that what is internal to themselves is not injured; they empty
    their minds of interference and pursue their natural course.
  category: attribute
  evidence_refs:
