- id: obs:2
  text: The passage states that people can control their minds, while external things
    are subject to the requirements and commands of the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Good and evil are said both to come to people, and loyalty and filial duty
    may have difficulty receiving proper recompense.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
