  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Human beings are described as troubled between two pitfalls, unable to escape,
    with minds hung between heaven and earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ideas of profit and injury are described as rubbing against each other
    and producing a great inner fire that consumes mental harmony and causes the proper
    Course to be lost.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A!wang iTau's family is poor, and he goes to ask the Marquis Superintendent
    of the Ho for a loan of rice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Marquis Superintendent of the Ho says he will soon receive tax money from
    the people and will then lend A!wang iTau three hundred ounces of silver.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A!wang iTau becomes angry and tells of hearing a caller on the road and seeing
    a goby in a carriage rut.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The goby identifies itself as Minister of Waves in the Eastern Sea and asks
    for a gallon or pint of water to keep it alive.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In A!wang iTau's parable, he offers to go south to the kings of Wti and Yueh
    and later lead a stream from the Western Kiang to the goby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The goby replies angrily that it has lost its proper element, needs only a
    little water to stay alive, and otherwise should soon be sought in a stall of
    dry fish.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A son of the duke of Z'an prepares a great hook, a powerful black line, and
    fifty steers as bait, squats on Mount Kwai Khi, and casts into the Eastern Sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The son of the duke of Z'an fishes morning after morning for a whole year
    without catching anything.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A great fish swallows the bait, dives with the great hook, rises, flaps its
    fins, raises white waves like hills, lashes the waters into fury, and spreads
    terror for a thousand li.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The prince cuts the great fish into slices and dries them, and people over
    a broad region eat their fill from the fish.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Later storytellers of small abilities repeat the story with astonishment.
  category: action
  evidence_refs:
  - ev:9
