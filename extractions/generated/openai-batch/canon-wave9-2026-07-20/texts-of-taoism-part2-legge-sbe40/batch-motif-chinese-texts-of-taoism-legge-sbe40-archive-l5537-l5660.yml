canonical_text:
  quote: ''
  summary: The passage first compares friction among natural forces and human concerns
    to a consuming fire that destroys inner harmony. It then tells of A!wang iTau,
    poor and asking the Marquis Superintendent of the Ho for rice, answering a delayed
    offer with a parable of a goby stranded in a carriage rut that needs a little
    water immediately rather than a future river. A final anecdote describes a son
    of the duke of Z'an fishing from Mount Kwai Khi into the Eastern Sea with immense
    gear and bait, catching a great fish that feeds a broad region, and drawing a
    lesson about great understanding versus small tales.
  language: English
  quote_policy: summarized
