canonical_text:
  quote: ''
  summary: 'The passage contrasts the person who dwells in the Tao with those bound
    to changing social conditions. It then presents I-liao counseling the sad marquis
    of Lu: foxes and leopards are endangered by their skins despite caution, and the
    marquis is told that the state of Lu is similarly his ''skin.'' He is urged to
    cleanse his heart, reduce desires, leave his state, and go to the southern State
    of Established Virtue, whose people are simple, low in desire, and unconcerned
    with formal righteousness or ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who takes his seat on the Tao and its Attributes is described as
    at ease, not exposed to trouble, and above praise and detraction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tao-grounded person is described as mounting like a dragon, keeping beneath
    like a snake, changing with the time, and moving between high and low positions
    in harmony with surroundings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The method just described is attributed to Shan Nang and Hwang-Ti.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those occupied with the qualities of things and human relations are said to
    face reversals such as union followed by separation and success followed by overthrow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: I-liao, an officer of Shih-nan, meets the marquis of Lu, who is sad because
    calamity still occurs despite his study of former kings, reverence for departed
    spirits, and honoring of worthy men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: I-liao tells the marquis that the arts by which he tries to remove calamity
    are shallow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: I-liao describes foxes and leopards as lodging in forests and rock holes,
    moving at night, staying in lairs by day, keeping away from people, and seeking
    food near the Kîang and the Ho.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The foxes and leopards are still unable to escape nets and traps, and their
    skins are named as the cause of their calamity.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: I-liao says that the state of Lu is the marquis's skin and urges him to rip
    off that skin, cleanse his heart, put away desires, and enjoy himself where no
    one is present.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The State of Established Virtue in southern Yüeh is described as inhabited
    by simple people who minimize self, have few desires, labor without storing gains,
    give without seeking return, and do not know prescribed righteousness or ceremonies.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The inhabitants of the State of Established Virtue treat birth as an occasion
    for joy and death with burial rites, and the marquis is urged to leave his state
    and proceed there directly.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
