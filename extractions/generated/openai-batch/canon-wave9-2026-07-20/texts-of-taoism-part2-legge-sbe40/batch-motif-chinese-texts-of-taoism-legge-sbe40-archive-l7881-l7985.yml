canonical_text:
  quote: ''
  summary: 'Kwang-jze answers King Wan’s questions about three kinds of swords: the
    sword of the Son of Heaven, the sword of a feudal lord, and the sword of the common
    man. The first two are described through cosmic, political, and administrative
    images; the third is associated with violent duelists who are useless to the state.
    Kwang-jze admonishes the king for favoring common swordsmanship. The king is disturbed,
    withdraws for three months, and the swordsmen kill themselves. The passage then
    begins a new section in which Confucius sits by the Apricot altar in a forest
    while his disciples read, he plays the lute and sings, and an old fisherman appears.'
  language: English
  quote_policy: summarized
