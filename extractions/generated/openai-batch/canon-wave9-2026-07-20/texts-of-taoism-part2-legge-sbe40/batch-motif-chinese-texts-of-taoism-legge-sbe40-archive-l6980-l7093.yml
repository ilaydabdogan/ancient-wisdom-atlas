canonical_text:
  quote: Confucius, however, did not attend to this advice.
  summary: Confucius insists that Liti-hsia Ki should instruct his younger brother,
    the robber Tao Kih, and offers to counsel him. Liti-hsia Ki warns that Tao Kih
    is violent, clever, abusive, and not receptive to correction. Confucius nevertheless
    travels with Yen Hui and 3ze-kung to Tao Kih's encampment south of Thai-shan,
    where Tao Kih's followers are preparing men's livers as food. Tao Kih angrily
    denounces Confucius, threatens to take his liver, then admits him. Confucius bows,
    faces Tao Kih's threat of death, praises his qualities, and offers to seek political
    power and a city for him.
  language: English
  quote_policy: quoted
