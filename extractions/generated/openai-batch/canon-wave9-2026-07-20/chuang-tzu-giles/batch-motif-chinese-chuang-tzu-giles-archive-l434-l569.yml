  summary: The introduction discusses the textual history of the Tao-Te-Ching and
    Chuang Tzu, including claims about the Burning of the Books, later Han forgery,
    pseudonymous attribution, spurious and interpolated chapters, competing commentarial
    editions, Kuo Hsiang and Hsiang Hsiu, the translator’s editorial method, and the
    classification of Chuang Tzu chapters as inside, outside, and miscellaneous.
