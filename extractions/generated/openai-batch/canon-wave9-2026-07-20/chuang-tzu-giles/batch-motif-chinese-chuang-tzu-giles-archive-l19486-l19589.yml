  summary: The passage catalogs paradoxical propositions associated with dialecticians
    and Hui Tzu, includes an editorial comparison to Achilles and the Tortoise and
    Greek sophisms, criticizes Huan T'uan, Kung Sun Lung, and especially Hui Tzu as
    sophistical disputants, recounts Hui Tzu's answers to Huang Liao's questions about
    sky, earth, wind, rain, and thunder, and ends by judging Hui Tzu's efforts as
    narrow, noisy, and futile from the standpoint of Tao.
