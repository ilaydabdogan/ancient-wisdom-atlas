canonical_text:
  quote: ''
  summary: The passage questions whether victory in argument can establish truth,
    rejects partial arbiters, and turns to an all-embracing Infinite in which contraries
    are merged. It then gives a dialogue between the Penumbra and the Umbra about
    dependent motion, followed by Chuang Tzu's dream of being a butterfly and his
    uncertainty over whether he is a man who dreamed he was a butterfly or a butterfly
    dreaming he is a man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two disputants are imagined arguing; the passage asks whether one person's
    victory necessarily proves that person right and the other wrong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the disputants cannot know the truth of the matter,
    and that the world will consequently be ignorant of the truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several hypothetical arbiters are considered, including one who takes one
    side, one who takes the other side, and one who either differs from or agrees
    with both; each is said to be unable to decide between the disputants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage asks whether, since the disputants and people cannot decide, they
    must depend upon Another.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies this dependence with God or the Infinite Absolute,
    in whose infinity contraries blend into One.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage instructs the hearer to take no heed of time, right, or wrong,
    and to pass into the realm of the Infinite for final rest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Penumbra asks the Umbra why it alternates between moving and resting,
    sitting down and getting up.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Umbra replies that it depends upon something that causes it to act, and
    that this cause depends in turn upon something else.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Umbra compares its dependence to a snake's scales or a cicada's wings,
    which do not move of their own accord.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chuang Tzu dreams that he is a butterfly fluttering about and conscious only
    of following his fancies as a butterfly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After waking, Chuang Tzu says he does not know whether he was a man dreaming
    he was a butterfly or is now a butterfly dreaming he is a man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that there is necessarily a barrier between a man and a
    butterfly, and calls the transition Metempsychosis.
  category: relationship
  evidence_refs:
  - ev:5
