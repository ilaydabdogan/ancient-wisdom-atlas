canonical_text:
  quote: ''
  summary: A sequence of anecdotes and teachings on government contrasts artificial
    rule and coercive laws with Tao-pattern governance through non-action, self-perfection,
    natural order, and absence of self. Figures discuss non-answer as knowledge, compare
    Shun with T'ai Huang, criticize princely laws, use animal and natural analogies,
    describe a Sage who soars to Nowhere and Nothingness, and introduce the magician
    Chi Han whose predictions impress Lieh Tzu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yeh Ch'ueh asks Wang I four questions, Wang I cannot answer them, and Yeh
    Ch'ueh is delighted; the accompanying comment says this reveals ignorance as true
    knowledge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: P'u I Tzu says Emperor Shun was not equal to T'ai Huang; Shun succeeded in
    government but remained at the level of artificiality.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: T'ai Huang is described as peaceful when asleep, inactive when awake, at times
    thinking himself a horse or an ox, with substantial wisdom and genuine virtue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chien Wu reports that Jih Chung Shih taught laws and regulations evolved by
    princes and requiring obedience; Chieh Yii calls this false teaching.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Chieh Yii compares coercive government to impossible tasks: wading through
    the sea, hewing a passage through a river, and making a mosquito fly away with
    a mountain.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chieh Yii says the government of the truly wise man has no concern with externals;
    the wise man perfects himself and accomplishes passively.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Chieh Yii gives animal examples: a bird flies high to avoid snare and dart,
    and a mouse burrows below the hill to avoid smoke or being cut from its nest.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: T'ien K^n travels south of the Yin mountain, reaches the river Liao, meets
    a Sage, and asks about governing the empire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sage says God has just turned him out a man, and says he can soar on light
    pinions beyond the cardinal points to the land of nowhere and the domain of nothingness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When asked again, the Sage instructs T'ien K^n to resolve mental energy into
    abstraction, physical energy into inaction, follow the natural order, admit no
    element of self, and the empire will be governed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yang Tzu Chii asks Lao Tzu whether an ardent, courageous, knowledgeable, untiring
    pursuer of Tao would be a wise ruler; Lao Tzu replies that such a person is like
    a handicraftsman wearing out body and mind.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lao Tzu says the tiger and pard suffer because of their skins, and the monkey
    and ox are brought to the tether by cleverness or tractability.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Lao Tzu describes the wise ruler's goodness as covering the empire, influencing
    all creation without consciousness, appearing under countless forms, and travelling
    through Nowhere.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In Cheng, the magician Chi Han knows and predicts birth, death, gain, loss,
    misfortune, happiness, and lifespan with supernatural accuracy; the people flee
    from him, while Lieh Tzu visits him and becomes infatuated.
  category: sequence
  evidence_refs:
  - ev:9
