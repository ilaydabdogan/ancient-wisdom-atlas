canonical_text:
  quote: I, and everything therein, are One.
  summary: The passage presents paradoxes about existence and non-existence, greatness
    and smallness, age and youth, speech and silence, and knowing and not knowing.
    It describes the true Sage as withholding knowledge from argumentative display,
    links perfect Tao and highest knowledge with non-declaration, recounts Yao asking
    Shun about attacking three states, and has Shun answer with an image of ten suns
    and superior virtue. It ends with Yeh Ch'iieh and Wang I questioning whether anything
    can be known with certainty.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A speaker says that if existence is present there must have been non-existence,
    and then a time before even nothing existed; the speaker also says he cannot determine
    whether his words have really been uttered.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the tip of an autumn spikelet is not exceeded in greatness,
    that a vast mountain is small, that no age exceeds that of an infant cut off in
    infancy, and that P'eng Tsu died young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says the universe and the speaker came into being together, and
    that the speaker and everything in the universe are One.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage argues that if all things are One, the presence of Speech produces
    numerical progression from one to two to three.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Tao existed before conditions and Speech before definitions,
    and it lists paired delimitations called the Eight Predicables.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The true Sage is said to recognize or assign distinctions without justifying
    them by argument, and to classify without classifying and argue without arguing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tzu Yu asks how that can be; Tzu Ch'i answers that the true Sage keeps knowledge
    within while other people set theirs forth in argument to convince one another.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Perfect Tao, perfect argument, perfect charity, perfect honesty, and perfect
    courage are each described through limits on visible or absolute expression.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Highest knowledge is described as knowledge that stops at what it does not
    know.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage describes wordless argument, Tao that does not declare itself,
    and a capacity to pour in without making full and pour out without making empty;
    this is called Light.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Emperor Yao tells Shun that he wants to smite the Tsungs, the Kueis, and the
