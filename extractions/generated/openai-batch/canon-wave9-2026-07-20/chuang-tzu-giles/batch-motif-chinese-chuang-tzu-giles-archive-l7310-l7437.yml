canonical_text:
  quote: ''
  summary: The passage describes a Golden Age of unselfconscious virtue and minimal
    rule, criticizes flattery and conformity to public opinion, presents analogies
    about travelers in error, grand music drowned by vulgar taste, an ugly father
    checking his newborn by lamplight, a tree turned into sacrificial vessels, and
    the confusion of original nature by sensory and emotional attachments. It ends
    by rejecting Yang and Mih’s valuation of such fetters and comparing that false
    attainment to caged birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Golden Age, good men were not specially appreciated, ability was not
    conspicuous, rulers were described as mere beacons, and the people were free like
    wild deer while acting uprightly, lovingly, truly, honestly, and freely without
    conscious moral labels or obligations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that a filial son does not humour his parents and a loyal
    minister does not flatter his prince; it criticizes uncritical assent and praise
    toward parents, princes, and the world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: The passage describes people as disliking the labels wheedler and flatterer
    while arranging dress, making displays, shaping expression, and conforming to
    others’ approvals and disapprovals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: An example of three travelers states that if one makes a mistake they may
    still arrive, but if two make a mistake they will not; this is applied to a world
    in error and to a speaker who knows the true path but cannot guide it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Grand music is said not to appeal to vulgar ears, and two earthen instruments
    are said to drown one metal instrument, paralleling the failure of great truths
    to take hold among the masses.
  category: object
  evidence_refs:
  - ev:6
- id: obs:6
  text: The speaker says that trying to force success when success is impossible would
    add another error, yet asks who will act if the speaker does not strive.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: An ugly man with a son born in the middle of the night hurries with a light
    because he fears the child may resemble him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: An old tree is cut down to make ornamented sacrificial vessels, while the
    stump remains in a ditch; the passage says the vessels and stump differ in honor
    and dishonor but equally involve destruction of the wood’s original nature.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage compares the acts of Robber Che with those of Tseng and Shih as
    socially different but alike in loss of original nature.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Five causes of loss of original nature are listed: colors confusing the eye,
    sounds confusing the ear, scents obstructing smell, tastes cloying the palate,
    and likes and dislikes clouding understanding.'
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Yang and Mih are said to regard the five banes as a summum bonum, while the
    speaker rejects this and compares such attainment to pigeons and owls in a cage.
  category: speech
  evidence_refs:
  - ev:11
