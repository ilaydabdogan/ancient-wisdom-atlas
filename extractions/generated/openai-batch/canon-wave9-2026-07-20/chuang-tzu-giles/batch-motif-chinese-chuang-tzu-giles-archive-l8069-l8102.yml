canonical_text:
  quote: ''
  summary: A wheelwright explains from his trade that successful wheel-making depends
    on the right pace and on coordination of mind and hand, a skill words cannot explain
    and which he cannot pass to his son. He says that if the ancients and what they
    could not transmit are gone, the Highness's studies are only the dregs. An editorial
    note connects the episode with Huai Nan Tzu, the Tao-Te-Ching, and a disputed
    attribution to Chuang Tzu.
  language: English
  quote_policy: summarized
