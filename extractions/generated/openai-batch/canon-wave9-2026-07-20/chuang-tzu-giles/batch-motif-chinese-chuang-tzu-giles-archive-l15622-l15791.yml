  summary: 'The passage presents several dialogues and exempla: Lao Lai Tzu admonishes
    Confucius to abandon dogmatism and specious knowledge; a divine white tortoise
    appears in Prince Yuan''s dream but is caught, killed, and used for accurate divination;
    Confucius comments on the limits of wisdom; Chuang Tzu explains the use of the
    useless and describes the perfect man who transcends human limits without withdrawing
    from the world.'
