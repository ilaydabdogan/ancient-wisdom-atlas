canonical_text:
  quote: ''
  summary: The passage first condemns obsessive pursuit and hoarding of wealth as
    shame, unhappiness, fear, and a cause of bodily and mental exhaustion. It then
    narrates how Wen Wang of Chao’s love of sword-play fills his halls with swordsmen,
    causes casualties, weakens the state, and alarms the Heir Apparent Li. Li seeks
    someone to persuade the prince to dismiss the swordsmen; his officers name Chuang
    Tzu. Chuang Tzu refuses the offered silver but agrees to go, notes the risks and
    possible rewards, adopts the appearance expected of swordsmen, enters the prince’s
    audience chamber, claims great sword skill, and is summoned to a trial where he
    says he has three swords from which the prince may choose.
  language: English
  quote_policy: summarized
