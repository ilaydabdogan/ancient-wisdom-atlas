canonical_text:
  quote: ''
  summary: The passage criticizes people who abandon innate disposition and are dominated
    by the senses. Poh Chii, studying under Lao Tzu, proposes wandering the world
    and beginning in Ch'i by mourning the executed dead, using their fate to criticize
    honor, wealth, rulers, and social blame. A reflection on Chu Poh Yu questions
    fixed judgments of right and wrong and contrasts known knowledge with the unknown
    source of things. Confucius asks historiographers why Duke Ling received his name;
    they answer with paradoxical accounts of his conduct and with a divinatory burial
    story involving a pre-existing stone coffin inscription.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People of the present are said to put their Godhead out of sight, abandon
    natural dispositions, get rid of feeling, and part with their souls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those lacking thoroughness in natural dispositions are said to allow an evil
    tribe, identified in a note as the physical senses, to take their place.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The physical senses are described as growing rank like reeds and rushes and
    later breaking out like sores and ulcers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Poh Chii is studying under Lao Tzu and asks to go wander over the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lao Tzu refuses, saying the world is just as it is seen there, and asks where
    Poh Chii would begin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Poh Chii says he would begin in the Ch'i State, view the dead bodies of malefactors,
    push them to rise, cover them with his robes, cry to God, and lament their lot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Poh Chii says honor and disgrace were set up, evil followed, wealth was accumulated,
    and contentions began.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rulers of old are described as crediting the people for success and right
    conduct while attributing failure and wrong to themselves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rulers of the present are described as concealing things, imposing dangerous
    tasks, heavy burdens, and long marches, and punishing those unable to comply.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people are said to resort to fraud, deceit, and theft when their powers,
    knowledge, or means are insufficient; the passage asks who is really responsible
    for such theft.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Chu Poh Yu reached sixty, he changed his opinions; what he formerly regarded
    as right he then regarded as wrong.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says things are produced around us without anyone knowing their
    source, and that they issue forth without anyone seeing the portal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Confucius asks three historiographers why Duke Ling, described as fond of
    wine, pleasure, hunting, and neglectful of government, came to be called Ling.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ta T'ao answers that Duke Ling was called Ling for those very reasons.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Poh Chang Ch'ien says Duke Ling had three wives, bathed with them, and covered
    himself and the ladies when Shih Ch'iu entered, showing respect toward a virtuous
    man despite outrageous behavior.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Hsi Wei says divination found the old family burial ground inauspicious and
    Sha-ch'iu auspicious; digging there revealed a stone coffin with an inscription
    about Duke Ling taking it for his tomb.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Hsi Wei concludes that Duke Ling had been named Ling long before and questions
    what the two other speakers could know about it.
  category: speech
  evidence_refs:
  - ev:11
