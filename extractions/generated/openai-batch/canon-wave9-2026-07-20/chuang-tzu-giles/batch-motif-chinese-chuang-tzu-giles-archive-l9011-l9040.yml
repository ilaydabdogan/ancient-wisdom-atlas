  quote: ''
  summary: Chapter XVI introduces the exercise of faculties by rejecting worldly studies
    and mundane thoughts as routes to original condition or enlightenment. It describes
    ancient Tao cultivation as generating knowledge from repose and repose from knowledge,
    yielding harmony and order. It then derives charity, duty, loyalty, music, and
    ceremonial expression from Virtue and Tao, while beginning a warning about ill-regulated
    music and ceremonial.
