canonical_text:
  quote: ''
  summary: The passage describes Tao as an original, pervasive principle from which
    sagehood, spirituality, intellectuality, government, the classics, and ancient
    institutions proceed. It contrasts ideal types such as the true Sage, superior
    man, officials, specialists, and later followers such as Mih Tzu, then describes
    fragmentation of Tao into divergent schools and discusses ancient music and mourning
    rites.
  language: English
