canonical_text:
  quote: ''
  summary: The passage criticizes affected reclusion, moralizing, political ambition,
    empty inaction, and bodily hygiene practices. It contrasts these with the true
    Sage, who is passive, tranquil, unconditioned, free from emotional disturbance,
    aligned with Yin and Yang, resigned to divine law, and partakes in divine virtue.
    Pure water is presented as an emblem of this virtue and of spirituality nourished
    according to Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Self-conceit, withdrawal from society, tall talk, and abuse of others are
    described as personal over-estimation and affected reclusiveness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Preaching charity, duty, loyalty, truth, respect, economy, and humility is
    described as moral culture associated with would-be pacificators, teachers, and
