- id: obs:3
  text: Preaching meritorious services, fame, ceremonial relations, and class relations
    is described as government associated with courtiers or patriots seeking territorial
    expansion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Living in marshes or wildernesses and fishing is described as mere inaction
    associated with wanderers who have turned away from the world.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Exhaling and inhaling, expelling the old and taking in the new, and stretching
    like a bear or craning like a bird are described as hygiene practices aimed at
    preserving the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The positive ideal is described through negated forms of self-esteem, moral
    culture, government, retirement, and health, culminating in absolute oblivion,
    possession of all things, and infinite calm.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tranquillity, stillness, the unconditioned, and inaction are named as levels
    of the universe and the constitution of Tao.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sage is described as passive and at rest; in that condition, sorrow, anxiety,
    and foul influences do not enter.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Sage’s birth is described as the will of God and his death as a modification
    of existence; in repose he shares Yin passivity and in action Yang energy.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Sage is said to be free from calamity, injury, opposition, and spirit
    punishment, and to float through life to rest in death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sorrow and happiness, joy and anger, love and hate are described as leading
    away from virtue or Tao, while absence of such disturbance is linked to perfect
    virtue and repose.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Unresting bodily toil is said to result in death, and ceaseless mental employment
    is said to produce weariness and loss of power.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Pure water is described as naturally clear and smooth when untouched, but
