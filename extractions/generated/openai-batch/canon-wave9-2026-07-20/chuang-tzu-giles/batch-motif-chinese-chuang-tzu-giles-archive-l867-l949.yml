  text: War is described as father and lord of all, while people are said to hear
    without understanding.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says people trust the senses, calls the senses false witnesses,
    and contrasts visible harmony with a greater hidden harmony.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: People are described as living in the external, commonplace, and relative,
