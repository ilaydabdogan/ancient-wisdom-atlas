canonical_text:
  quote: ''
  summary: The passage, in translator-commentary form, presents Heracleitean doctrines
    of unity among opposites and distrust of sensory judgment, then contrasts them
    with Chuang Tzu's more practical teaching about moving from seeming to truth.
    Examples include the carver guided by natural joints, heart-fasting, the survival
    of useless trees, and the elevation of outwardly afflicted persons when virtue
    is valued over appearance.
  language: English
  quote_policy: summarized
