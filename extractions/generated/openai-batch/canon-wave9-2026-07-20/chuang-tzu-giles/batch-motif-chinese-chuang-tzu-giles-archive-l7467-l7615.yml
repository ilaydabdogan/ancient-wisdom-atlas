canonical_text:
  quote: ''
  summary: The passage presents Tao as ceaseless operation expressed through God,
    sovereign, and Sage; it identifies repose, stillness, and inaction as the source
    of cosmic order, wise rule, and spontaneous action. Still water and the Sage's
    mind serve as mirror images. The passage also describes the happiness of God,
    death as physical change, and the paired powers of Negative and Positive in repose
    and motion.
  language: English
  quote_policy: summarized
