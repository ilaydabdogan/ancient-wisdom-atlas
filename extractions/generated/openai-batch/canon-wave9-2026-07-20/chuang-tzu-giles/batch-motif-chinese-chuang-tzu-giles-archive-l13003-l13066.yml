canonical_text:
  quote: ''
  summary: The passage instructs the hearer to adapt only outwardly while remaining
    inwardly constant and resolving divergence by refusing division. It contrasts
    ancient perfect men and later disputatious schools, describes the perfect sage
    as non-harming and unharmed, reflects on joy and sorrow arising before landscapes,
    compares human life to a temporary stay at an inn, and states that the best language
    is unspoken, the best action deedless, and expanded knowledge shallow.
  language: English
  quote_policy: summarized
