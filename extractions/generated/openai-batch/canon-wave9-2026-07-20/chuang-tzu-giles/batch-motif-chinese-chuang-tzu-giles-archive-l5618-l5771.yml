canonical_text:
  quote: One man steals a purse, and is punished. Another steals a State, and becomes
    a Prince.
  summary: The passage argues that sage-wisdom, moral categories, and instruments
    of government can be appropriated by powerful thieves. It gives examples of a
    usurper, sages who died violently, Robber Che explaining a Way in thieving, a
    wine-gift dispute leading to siege, and maxims about water, fish, and government
    instruments.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: T'ien Ch eng Tzu is said to have killed the Prince of Ch'i, stolen the kingdom,
    and also stolen wisdom-tricks obtained from the Sages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: T'ien Ch eng Tzu gained the reputation of a thief, lived comfortably, was
    not blamed or punished by other states, and his descendants ruled Ch'i for twelve
    generations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four named sages are listed as suffering violent deaths, and the passage states
    that their wisdom did not preserve them from death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An apprentice asks Robber Che whether there is Tao in thieving; Che replies
    that there is Tao in everything and identifies wisdom, courage, heroism, shrewdness,
    and justice as traits of great robbers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the doctrine of the Sages is indispensable both to
    good men and to Che, and argues that because bad men are more plentiful, the Sages
    produce more evil than good.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage uses the saying about lips and teeth and recounts an anecdote
    in which a cellar official switches wine gifts, leading the prince of Ch'u to
    lay siege to Han Tan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the appearance of Sages caused the appearance of great robbers,
    and compares the extinction of Sages to a stream ceasing, a gully drying, a hill
    being levelled, and a chasm being filled.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says measures, scales, tallies, signets, charity, and duty can
    all be stolen when used for ordering society.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage contrasts a person who steals a purse and is punished with a person
    who steals a State and becomes a Prince.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that rewards of official regalia and fear of sharp punishments
