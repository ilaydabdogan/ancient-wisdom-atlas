canonical_text:
  quote: ''
  summary: Confucius rejects Yen Hui's proposed approaches and teaches him the “fasting
    of the heart,” a discipline of unity, passivity, and loss of individuality through
    which Tao may abide. Confucius illustrates the teaching with paradoxes of acting
    without ordinary means and with the image of an empty room lit through a window.
    The method is attributed to ancient exemplars. A second exchange begins with Tzu
    Kao, Duke of She, asking Confucius about an alarming mission to Ch'i and citing
    Tao as the only route to a happy outcome.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yen Hui's earlier proposals include acting according to ordinary ministerial
    ceremony and speaking as a mouthpiece for the Sages of old; Confucius rejects
    the plans as too numerous and imprudent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yen Hui asks for a method; Confucius answers with the instruction to fast
    and says the method is difficult to practise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yen Hui identifies his family poverty and long abstention from wine and flesh
    as fasting; Confucius distinguishes this religious observance from the fasting
    of the heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Confucius defines the fasting of the heart as cultivating unity and describes
    hearing not merely with ears or mind but with the whole self, while letting the
    ears and mind stop at their own functions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Confucius says that in the negative, passively responsive state, only Tao
    can abide.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yen Hui says that use of the method would make his individuality disappear;
    Confucius confirms that this is the negative state.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius advises entering an unnamed man's domain without offending his self-regard,
    responding cheerfully if heard and passively if not, and living there in complete
    indifference.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confucius uses paradoxical images of walking without touching the ground,
    flying without wings, and being wise without wisdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Confucius compares the senses to a window through which an empty room becomes
    bright with scenery while the landscape remains outside.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Confucius says the method is an instrument for regenerating all creation and
    was employed by Yii, Shun, Fu Hsi, and Chi Chii.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tzu Kao, Duke of She, is about to go on a mission to the Ch'i State, is alarmed
    about the undertaking, and asks Confucius about it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tzu Kao reports Confucius's teaching that Tao alone leads undertakings to
    a happy issue, while punishment may arise from either failure or success unless
    one possesses the required virtue.
  category: speech
  evidence_refs:
  - ev:7
