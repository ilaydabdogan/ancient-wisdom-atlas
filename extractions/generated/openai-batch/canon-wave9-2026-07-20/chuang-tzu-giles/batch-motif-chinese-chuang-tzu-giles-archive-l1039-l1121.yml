- id: obs:3
  text: The passage presents Lao Tzu as older than Confucius and says he is reported
    to have had an interview with Confucius in 517 B.C.; it places Chuang Tzu centuries
    later and possibly contemporary with Mencius.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Confucianism became established in China between Lao Tzu
    and Chuang Tzu, while Taoism became an opposition movement and its antagonism
    with Confucian representatives increased.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts the sceptic, who declares the rational problem insoluble
    and accepts things as they are, with the mystic, who retires inward and dreams
    of a state opposed to the world of fact.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Confucius is sometimes represented in Taoist writings as
