canonical_text:
  quote: I do these things, but I do not know why.
  summary: The passage reflects on life, death, destiny, and unknowable causes; presents
    a dialogue in which Penumbrae question the changing Umbra, who explains dependence
    on light and unknown life-giving agency; and narrates Yang Tzu Chii’s humbling
    encounter with Lao Tzu, after which his demeanor and social reception change.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening reflection asks about distinctions in life, equality in death,
    the origin of death and life, and the source of the speaker’s own being.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reflection says heaven has a fixed visible order and earth has yielded
    secrets to man, but the speaker still asks where to seek the source of the self.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The reflection questions whether destiny or supernatural agency can be affirmed
    or denied when the hereafter and what preceded birth are unknown.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The various Penumbrae ask the Umbra why it has changed orientation, hair arrangement,
    posture, motion, and stillness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Umbra replies that it does what it does without knowing why and compares
    itself to the scaly back of the cicada and the shell of the locust.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Umbra says it is seen by firelight or daylight and is gone in darkness
    or at night.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Umbra says it comes, goes, and lives with the things on which it depends,
    but does not know who gives life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Yang Tzu Chii travels southward to P'ei and goes to receive Lao Tzu, who is
    travelling westward to Ch'in, meeting him at a bridge outside the city.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lao Tzu stands in the middle of the road, looks up to heaven, sighs, and tells
    Yang Tzu Chii that he no longer thinks Yang can be taught.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the inn, Yang Tzu Chii gives Lao Tzu water for washing and rinsing, a towel,
    and a comb, removes his own boots outside the door, crawls on his knees, and asks
    for instruction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lao Tzu tells Yang Tzu Chii that he has an overbearing look and says that
    the truly pure behave as though sullied and those with abundant virtue behave
    as though it were insufficient.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Yang Tzu Chii changes countenance and says that he hears and obeys.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Before Yang Tzu Chii’s interview, inn visitors and hosts defer to him; after
    the interview, other visitors struggle to obtain the best seats for themselves.
  category: sequence
  evidence_refs:
  - ev:6
