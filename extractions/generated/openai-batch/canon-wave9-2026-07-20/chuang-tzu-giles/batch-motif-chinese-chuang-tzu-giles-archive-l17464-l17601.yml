canonical_text:
  quote: ''
  summary: A dialogue between Discontent and Complacency debates wealth, reputation,
    pleasure, contentment, sagehood, and rulership. Discontent praises wealth and
    reputation as sources of power and pleasure. Complacency replies that the wise
    seek sufficiency, reject surplus and exploitative power, and find happiness in
    contentment; exemplary rulers and throne-refusers are cited, and excess wealth
    is described as producing confusion, misery, and disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Discontent asks Complacency why he has no desire for reputation or wealth,
    after stating that rich people attract followers who take subordinate positions
    and pay court.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Complacency replies that Discontent and his friends regard others as scholars
    separated from humanity and the world, concerned with records and verbal disputes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Complacency says that living mundane lives would sacrifice the conditions
    of existence, and that even imperial power and possession of the empire would
    not free a person from care.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Discontent says wealth lets a man borrow the courage, strength, wisdom, counsel,
    and virtue of others, making him formidable and allowing him to wield authority
    without a throne.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Discontent says pleasures such as music, beauty, rich food, and power require
    no study or teacher because such likes and dislikes are instinctive in humans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Complacency says the wise man acts for the common good, seeks more only when
    there is insufficiency, declines surplus, and does not treat honesty and greed
    as products of outward circumstance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Complacency says the wise man may wield imperial power or possess the empire
    but will not use power to degrade others or wealth to take advantage of them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yao and Shun are said to have occupied the throne during a time of peace,
    not by trying to be beneficent rulers but by being natural.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shan Ch'uan and Hsii Yu are said to have declined a proffered throne because
    they would not injure themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Complacency says the world calls these figures virtuous and gives them reputation,
    although they did not aim at reputation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Discontent argues that reputation must be clung to and that denying bodily
    pleasures for the sake of prolonged life would make life like a prolonged illness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Complacency says happiness is found in contentment and that too much, especially
    too much wealth, is a curse.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Complacency describes the wealthy man as surrounded by sweet music, rich meats,
    and wine, forgetting business in pleasure, eating and drinking to excess, and
    suffering from illness.
  category: sequence
  evidence_refs:
  - ev:7
