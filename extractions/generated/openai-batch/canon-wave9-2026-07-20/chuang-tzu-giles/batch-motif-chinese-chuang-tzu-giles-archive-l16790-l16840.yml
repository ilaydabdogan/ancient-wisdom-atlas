canonical_text:
  quote: ''
  summary: Two philosophers judge the present political order to be unlike Tao, contrast
    Shen Nung's disinterested rule with the corrupt rule of the Chous after the Yins,
    decide that in dark and troubled times they should flee to keep their actions
    pure, and go north to Mount Shou-yang, where they starve themselves to death.
    The narrator identifies men like Poh I and Shu Ch'i as pure scholars whose heroic
    measures would not have been needed if wealth and honour could have been properly
    accepted.
  language: English
