  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confucius is hemmed in between Ch'en and Ts'ai and passes seven days without
    food; when Jen visits, Confucius acknowledges he was near death and fears death.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jen describes eastern sea birds called i-erh as modest, unassuming, flying
