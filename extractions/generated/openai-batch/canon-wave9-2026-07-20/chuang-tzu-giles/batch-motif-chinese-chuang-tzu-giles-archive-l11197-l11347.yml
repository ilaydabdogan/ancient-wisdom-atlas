canonical_text:
  quote: ''
  summary: Several didactic anecdotes advise diminishing desire and self-assertion.
    An unnamed philosopher counsels travel with Tao through boundless space and uses
    the empty boat as a figure for harmless emptiness. Pei Kung She explains how non-coercive
    conduct completed a bell project without injury. Jen instructs Confucius, through
    eastern sea birds and natural images of straight trees and sweet wells, to avoid
    display, merit, fame, and censure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed philosopher answers an unnamed Highness by advising decreased expenditure
    of energy and lessened desires, saying that even without provisions there will
    be enough.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The philosopher describes travel through river and over sea into shoreless,
    illimitable space, after which escorts return and the Highness travels farther
    onward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The philosopher says the human element in oneself is a hindrance and the human
    element in others causes sorrow, and urges the Highness to put off the hindrance
    and roam with Tao alone through Infinite Nought.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A parable contrasts an empty boat, which does not provoke anger when it collides,
    with an occupied boat, which provokes shouting and abuse if it does not respond.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The parable concludes that a person who could roam empty through life would
    not be injured by others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pei Kung She, minister to Duke Ling of Wei, levies contributions for making
