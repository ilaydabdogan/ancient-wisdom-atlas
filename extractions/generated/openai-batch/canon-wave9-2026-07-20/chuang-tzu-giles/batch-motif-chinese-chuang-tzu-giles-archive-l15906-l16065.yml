canonical_text:
  quote: ''
  summary: 'Chapter XXVII discusses forms of language: speech attributed to others,
    speech based on authority, and speech that naturally overflows in accord with
    God. It treats right and wrong as dependent on opinion and language, describes
    contraries as identical apart from language, and presents all things as arising
    from germs in cyclical reproduction under divine equilibrium. The passage then
    gives anecdotes about Confucius changing his views, Tseng Tzu’s grief in relation
    to salary and parents, and Yen Ch''eng Tzu Yu’s nine-year progress under instruction
    toward knowledge of God, transcendence of life and death, and perfection.'
  language: English
  quote_policy: summarized
