canonical_text:
  quote: ''
  summary: The passage opens with a maxim on true greatness as self-sufficiency and
    accord with nature. It then tells of Tzu Chi asking Chiu Fang Yin to read the
    fortune of his eight sons; K'un is predicted to eat at a prince's table, which
    Tzu Chi treats as uncanny and ominous. K'un is later captured by brigands, mutilated,
    sold into Ch'i, and becomes a duke's doorkeeper with meat for life. A second dialogue
    has Hsü Yu leaving Yao and criticizing moralistic charity, public benefit, dogmatic
    rule, and social types, using images of sportsman's gear, lice on a pig, butcher's
    fire, mutton, ants, and Shun as an enthusiast who attracts followers and refuses
    retirement.
  language: English
  quote_policy: summarized
