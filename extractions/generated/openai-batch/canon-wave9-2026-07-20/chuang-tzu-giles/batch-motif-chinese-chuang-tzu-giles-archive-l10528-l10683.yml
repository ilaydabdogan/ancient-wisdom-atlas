  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius asks a hunchback about his method, and the hunchback says he practices
    balancing balls on the top of his pole during the fifth and sixth moons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunchback says that as he can balance more balls, he misses fewer cicadas,
    until catching them is as easy as taking them by hand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunchback describes his body as motionless like a tree stump, his arms
    like dead branches, and his awareness as fixed only on cicada wings.
  category: attribute
  evidence_refs:
