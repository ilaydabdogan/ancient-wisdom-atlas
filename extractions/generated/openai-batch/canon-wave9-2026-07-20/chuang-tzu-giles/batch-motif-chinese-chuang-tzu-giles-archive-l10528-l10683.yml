candidate_motifs:
- id: motif:1
  label: skill through single-minded concentration
  taxonomy_refs:
  - wisdom
  basis: The hunchback’s success comes from practice, bodily stillness, and awareness
    only of cicada wings; Confucius explicitly states that singleness of purpose induces
    concentration of the faculties.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a didactic wisdom pattern rather than a narrative mythic event.
- id: motif:2
  label: mastery through forgetfulness of danger and instrument
  taxonomy_refs:
  - wisdom
  basis: The boatman rows as if the boat were not present, is described as oblivious
    of the water, treats the rapid as dry land, and treats an upset as an ordinary
    cart accident.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents a practical-philosophical teaching rather than a
    supernatural feat.
- id: motif:3
  label: external attachment disrupts inner capacity
  taxonomy_refs:
  - wisdom
  basis: The gaming example states that the same skill fails as the stake becomes
    more valuable, and concludes that valuing the external leaves one internally without
    resource.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is abstracted from a short analogy.
- id: motif:4
  label: care of life requires attention to neglected parts
  taxonomy_refs:
  - wisdom
  basis: Keeping life is compared to tending sheep by finding laggards; Shan Pao and
    Chang I each neglect a different aspect and die through external or internal harm.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage’s formulation is ethical and physiological rather than mythic.
- id: motif:5
  label: middle way between obscurity and prominence
  taxonomy_refs:
  - wisdom
  basis: Confucius says one should neither affect obscurity nor court prominence,
    but unconsciously occupy the happy mean.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a maxim within the passage and only lightly narrativized.
- id: motif:6
  label: unseen moral danger compared to visible travel danger
  taxonomy_refs:
  - wisdom
  basis: Confucius compares precautions in deadly travel regions with warnings needed
    for dangers in passion and banqueting.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The motif is expressed as analogy, not as a full narrative episode.
- id: motif:7
  label: sacrificial victim’s perspective challenged by sacrificer’s values
  taxonomy_refs:
  - sacrifice
  basis: The Grand Augur describes ceremonial preparations for pigs, voices the pigs’
    preference for survival, then adopts his own perspective that honour can justify
    death.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage critiques viewpoint and valuation; it does not narrate the
    actual completion of the sacrifice.
- id: motif:8
  label: fame valued as much as appetite
  taxonomy_refs:
  - wisdom
  basis: The concluding sentence compares the pig’s fixation on eating with the Grand
    Augur’s willingness to sacrifice life for fame.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: This is an explicit moral comparison in the passage, not an independent
    mythic motif.
