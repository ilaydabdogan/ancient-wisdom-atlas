canonical_text:
  quote: ''
  summary: 'A series of didactic anecdotes concerns skill, attention, danger, and
    the care of life: a hunchback explains focused cicada catching; Yen Yüan reports
    a boatman’s skill in a rapid; Confucius comments on distraction caused by valuable
    stakes; T’ien K’ai Chih explains the art of life through the image of tending
    sheep and through the contrasting deaths of Shan Pao and Chang I; Confucius warns
    about visible and moral dangers; and the Grand Augur addresses pigs destined for
    sacrifice, contrasting the pigs’ wish to live with his own valuation of honour
    and fame.'
  language: English
  quote_policy: summarized
literal_observations:
