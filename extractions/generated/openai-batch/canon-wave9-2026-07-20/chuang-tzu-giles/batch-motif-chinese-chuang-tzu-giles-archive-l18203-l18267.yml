  quote: Tao is the source of all creation.
  summary: An old fisherman departs by boat after speaking about suitable companionship
    and Tao. Confucius remains respectfully still, then explains to Tzu Lu that respect
    is due to elders and sages, and that Tao is the source of life, success, and true
    reverence.
