canonical_text:
  quote: ''
  summary: The passage contains footnote material on translation, followed by Aubrey
    Moore's note on the philosophy of Chuang Tzŭ chapters i-vii. Moore discusses difficulties
    in comparing Chinese and Western philosophy, argues for cautious attention to
    East-West parallelisms without assuming derivation, compares the Aristotelian
    and Confucian doctrines of the mean, and summarizes Chuang Tzŭ's first chapter
    as teaching the relativity of size, space, time, and sense knowledge through examples
    such as the Rukh, cicada, dove, mushroom, P'eng Tsu, a long-lived tree, wind-riding,
    and roaming through For-Ever.
  language: English
  quote_policy: summarized
