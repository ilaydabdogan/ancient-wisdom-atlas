  quote: ''
  summary: The passage presents didactic sayings and anecdotes about concealed virtue,
    the danger of displaying skill, self-effacement, contemplative withdrawal, wordless
    utterance, silent efficacy, and the greatness of the sage compared with the sea
    and universe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says sharing virtue is true wisdom, sharing wealth is meritorious,
    and displaying inferior rather than superior merit wins people's hearts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince of Wu travels by boat to Monkey Mountain and ascends it; the monkeys
    flee and hide, except one monkey that openly displays its skill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince shoots at the monkey; the monkey catches the flying arrow, but
    the prince's guards shoot and kill it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince tells Yen Pu I that the monkey came to ruin because it flaunted
    its skill and dexterity, and warns him not to flaunt superiority before others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yen Pu I studies under Tung Wu to remove superiority, puts aside pleasures,
    avoids reputation, and after three years is widely praised.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tzu Chi sits leaning on a table, looks to heaven, and sighs; Yen Ch'eng Tzu
    asks how his body can be like dry wood and his mind like dead ashes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tzu Chi says he once lived in a cave on the hills, and that after T'ien Ho
    saw him once, the people of Ch'i congratulated T'ien Ho three times.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tzu Chi says he must have manifested himself in order to be recognized, describes
    this as selling for another to buy, and grieves over human self-destruction and
    successive layers of grief.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: At a banquet in Ch'u for Confucius, Sun Shu Ao stands with a goblet of wine,
    I Liao pours a libation, and Confucius replies with the doctrine of wordless utterances.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Confucius cites I Liao playing with his ball and Sun Shu Ao remaining quietly
    in repose as acts associated with settling political or military trouble.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Confucius describes this as the Tao of inaction and the argument of silence,
    and says perfection is for Te to rest in undivided Tao and for speech to stop
    at the unknowable.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Confucius says the sea is immeasurably great because it does not reject eastward-flowing
    streams, and the true Sage folds the universe in his bosom and benefits all without
    taking rank, title, credit, or name.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Confucius says a dog is not good merely because it barks well, and a man is
    not good merely because he talks well; he adds that nothing compares with the
    universe in greatness.
  category: speech
  evidence_refs:
  - ev:13
