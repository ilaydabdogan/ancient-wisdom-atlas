candidate_motifs:
- id: motif:1
  label: tests reveal hidden character
  taxonomy_refs:
  - wisdom
  basis: The passage lists nine tests and states that the inferior man is revealed
    by them.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an ethical teaching rather than a narrative episode with supernatural
    action.
- id: motif:2
  label: humility increases with rank
  taxonomy_refs:
  - wisdom
  basis: Cheng K'ao Fu lowers himself more deeply with each appointment, contrasted
    with ordinary men's increasing arrogance.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives this as exemplary conduct; it does not narrate a full
    quest or ordeal.
- id: motif:3
  label: outward deliberate virtue damages inward virtue
  taxonomy_refs:
  - wisdom
  basis: The text says intentional virtue directed outward destroys introspection
    and identifies sources of injury to virtue.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The motif is abstract and aphoristic, not imagistic.
- id: motif:4
  label: treasure taken from a sleeping dragon brings danger
  taxonomy_refs: []
  basis: A pearl obtained from deep under a sleeping dragon's nose is treated as dangerous
    once the dragon wakes; Chuang Tzu applies this to royal reward.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The dragon-pearl narrative functions as a parable within the passage;
    no separate quest is described.
- id: motif:5
  label: court reward as perilous gain
  taxonomy_refs:
  - wisdom
  basis: The man proud of chariots is warned that acquiring favors from the prince
    of Sung resembles taking treasure from a dragon and may end in destruction.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The danger is presented through Chuang Tzu's analogy rather than through
    an observed outcome.
- id: motif:6
  label: honored sacrificial victim would prefer neglected freedom
  taxonomy_refs:
  - sacrifice
  - wisdom
  basis: Chuang Tzu's reply presents a decorated, well-fed sacrificial ox that would
    exchange places with a neglected calf before slaughter.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage uses the animal image as a response to official service; it
    does not depict an actual sacrifice taking place.
- id: motif:7
  label: cosmic funeral and nonattachment to corpse
  taxonomy_refs:
  - wisdom
  basis: At death, Chuang Tzu treats Heaven, Earth, celestial bodies, and all creation
    as sufficient funeral apparatus and accepts his body feeding creatures.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: high
  cautions: No afterlife journey or resurrection is described; the motif is about
    burial, cosmic scale, and bodily nonattachment.
comparison_claims:
- id: claim:1
  claim: The passage's editorial quotation from The Burial of Moses creates a cautious
    literary or visual comparison with Chuang Tzu's cosmic funeral imagery, especially
    natural landscape and stars as funeral paraphernalia.
  claim_level: visual_similarity
  target: The Burial of Moses, attributed in the passage to Mrs. Alexander
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the translator/editorial apparatus; it
    does not demonstrate historical contact or shared origin.
- id: claim:2
  claim: The passage explicitly notes that Chuang Tzu's reply about his body feeding
    creatures may be compared with a reply of Diogenes.
  claim_level: same_function
  target: Diogenes, as named in the passage's final editorial note
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: low
  limitations: The quoted passage cuts off after the mention of Diogenes and does
    not provide the comparison text, so only the existence of an editorial comparison
    is recoverable.
