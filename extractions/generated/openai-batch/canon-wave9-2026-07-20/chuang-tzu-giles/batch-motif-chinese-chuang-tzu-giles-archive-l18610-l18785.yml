canonical_text:
  quote: ''
  summary: The passage gives aphorisms and anecdotes about testing character, humility
    under appointment, dangers to virtue, causes of failure and success, wisdom and
    destiny. It then presents Chuang Tzu warning a man proud of princely chariots
    through a parable of a pearl taken from under a sleeping dragon, refusing official
    service through the image of a decorated sacrificial ox, and rejecting elaborate
    burial by invoking Heaven, Earth, celestial bodies, and creatures that consume
    the body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A set of nine situations is described as testing loyalty, respectfulness,
    ability, knowledge, trustworthiness, integrity, fidelity, decorum, and morality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inferior man is said to stand revealed under the application of the nine
    tests.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Cheng K''ao Fu lowers himself progressively with each appointment: bowing
    his head, hunching his back, and falling on his face while walking at the side
    of the path.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ordinary men are described as becoming self-important, putting on airs in
    chariots, and using their fathers' personal names as appointments increase.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Intentional virtue directed outward is described as fatal to virtue because
    it destroys introspection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eyes, nose, mouth, ears, and thought are listed as five sources of injury
