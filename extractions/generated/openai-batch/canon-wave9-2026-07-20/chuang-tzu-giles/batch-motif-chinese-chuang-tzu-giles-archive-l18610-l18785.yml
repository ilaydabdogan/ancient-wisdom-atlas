- id: obs:7
  text: Beauty, beard, size, height, robustness, grace, courage, and daring are listed
    as causes of failure, while modesty, compliance, and humility are called roads
    to success.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that penetrating the mystery of life reveals all things,
    and distinguishes comprehension of Greater Destiny from resignation to Lesser
    Destiny.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man who received ten chariots from the prince of Sung puts on airs before
    Chuang Tzu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Chuang Tzu's parable, a poor man's son dives into a river and obtains a
    valuable pearl from near a sleeping dragon; the father orders him to smash it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Chuang Tzu compares the State of Sung to a deep river and the prince of Sung
    to a fiercer dragon, warning that the man will be destroyed when the prince wakes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When invited into service, Chuang Tzu replies with the image of a sacrificial
    ox decorated and well-fed before slaughter, asking whether it would prefer to
    be a neglected calf.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When his disciples wish to give him a splendid funeral, Chuang Tzu says Heaven
