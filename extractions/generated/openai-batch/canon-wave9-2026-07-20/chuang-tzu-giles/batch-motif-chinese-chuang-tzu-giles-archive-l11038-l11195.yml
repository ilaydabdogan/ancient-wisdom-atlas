canonical_text:
  quote: ''
  summary: Chuang Tzu observes a useless tree spared by a woodsman, then faces a disciple's
    question when a useless goose is killed. He answers by pointing beyond fixed usefulness
    and uselessness toward Tao. A later dialogue has I Liao of Shih-nan counsel the
    prince of Lu that ordinary methods cannot avoid misfortune, using fox and leopard
    imagery and urging him to discard power, body, and passion and trust in Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chuang Tzu travels over a mountain and sees a huge leafy tree that a nearby
    woodsman does not cut because it is of no use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chuang Tzu states that the tree completes its allotted span by being good
    for nothing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At an old friend's house, a servant is ordered to kill and cook a goose; the
    master chooses the goose that does not cackle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A disciple asks Chuang Tzu how the useless tree can survive while the useless
    goose dies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chuang Tzu replies that he rests halfway between the two and describes being
    charioted upon Tao and floating above mortality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chuang Tzu contrasts pairs such as union and separation, completion and destruction,
    purity and oppression, honour and disparagement, and says a fixed point is found
    only in the domain of Tao.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: I Liao of Shih-nan visits the prince of Lu, who is melancholy despite studying
    ancient sages, continuing predecessors' work, respecting religion, and honouring
    the good.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: I Liao says that foxes and leopards hide in mountain forests and act cautiously,
    yet still fall into nets and traps because of their skins.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: I Liao compares the State of Lu to the prince's skin and urges him to put
    away body and skin, cleanse the heart, purge passion, and go to the land where
    mortality is not.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: I Liao describes Established-Virtue in Nan-yüeh as inhabited by simple, honest,
    unselfish people who give without seeking return and act without conscious etiquette.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: I Liao advises the prince to discard power, leave the world behind, and trust
    in Tao.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: When the prince objects that the road is long and dangerous and that he lacks
    boat or chariot, I Liao says that unhindered by body and unfettered in mind he
    will be a chariot to himself.
  category: speech
  evidence_refs:
  - ev:12
