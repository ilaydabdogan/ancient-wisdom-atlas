  summary: The passage describes a pre-birth spiritual existence that pervades heaven
    and earth, teaches preservation of spirituality through the Tao of the pure and
    simple, says unity with spirituality brings relation with God, and states that
    the spirit returns from mortal life to its eternal source. It also cites a saying
    about differing human values and defines the pure and simple as marks of the divine
    man, followed by a translator/editorial note questioning the chapter's authenticity.
