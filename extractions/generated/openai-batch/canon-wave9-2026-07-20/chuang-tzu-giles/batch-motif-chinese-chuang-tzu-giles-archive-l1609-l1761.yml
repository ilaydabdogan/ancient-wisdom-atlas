canonical_text:
  quote: ''
  summary: The passage begins with a residual note on the advantage of being useless,
    then opens Chapter II, framed as the identity of contraries. Tzu Ch'i sits in
    an absent state as if soul and body had parted. Tzu Yu asks about this condition,
    and Tzu Ch'i replies that he has buried himself, then distinguishes the music
    of Man, Earth, and Heaven. He describes wind as the breath of the universe sounding
    through caves, dells, tree hollows, and other apertures. The discourse then turns
    to great and small knowledge, the limitations of speech, mental perturbations,
    alternating emotions, an unseen formless power or soul, and the pitiful course
    of mortal life.
  language: English
  quote_policy: summarized
