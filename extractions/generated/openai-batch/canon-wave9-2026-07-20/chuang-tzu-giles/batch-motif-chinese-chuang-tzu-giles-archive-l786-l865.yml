canonical_text:
  quote: "“From the standpoint of Tao” all things are one."
  summary: The passage is an editorial-philosophical discussion of Chuang Tzu. It
    describes Chuang Tzu as an idealist and mystic, contrasts the sage with ordinary
    concerns for self, action, and reputation, recounts Yao’s proposed abdication
    to a hermit, and presents a divine being dwelling on a mysterious mountain. It
    then summarizes the doctrine that distinctions and contraries disappear in unity,
    depicts the sage as unshaken by cosmic upheaval, and compares this doctrine especially
    with Heracleitus and, more cautiously, with Eleatic and Parmenidean themes of
    the One and the Many.
  language: English
  quote_policy: quoted
