canonical_text:
  quote: '"I was wandering," replied Lao Tzu, "in the unborn."'
  summary: The passage reflects on mind, body, death, and what changes or does not
    change. Confucius visits Lao Tzu, who appears like a lifeless body and says he
    has been wandering in the unborn. Lao Tzu explains cosmic interaction between
    Negative and Positive principles, the unseen possibility of a First Cause, the
    alternation of life and death, the perfect man’s peace, rejection of rank, and
    virtue as natural rather than cultivated. Confucius later tells Yen Hui that Lao
    Tzu opened his eyes to the vastness of the universe. A following scene begins
    with Chuang Tzu and Duke Ai of Lu discussing scholars in Lu.
  language: English
  quote_policy: quoted
