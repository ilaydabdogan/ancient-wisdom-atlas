canonical_text:
  quote: ''
  summary: 'The passage presents linked examples arguing that what is materially,
    ritually, or socially useless can preserve life: an unusable tree grows large,
    useful trees are cut down, blemished beings are excluded from sacrifice, the hunchback
    Su avoids state labor and receives aid, and Chieh Yü warns Confucius that in an
    age without Tao one should preserve oneself rather than seek influence.'
  language: English
  quote_policy: summarized
