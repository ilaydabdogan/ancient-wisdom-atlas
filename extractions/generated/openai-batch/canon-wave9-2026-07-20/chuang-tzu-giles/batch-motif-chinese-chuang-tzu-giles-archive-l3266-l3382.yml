- id: obs:3
  text: At Ching-shih, beech, cedar, and mulberry trees of increasing size are cut
    down for monkey-cages, house beams, and coffin sides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage generalizes that valuable trees fail to complete their allotted
