canonical_text:
  quote: ''
  summary: 'A series of Chuang Tzu anecdotes and dialogues: Chuang Tzu questions Hui
    Tzu about standards of right and contending schools; Lu Chu distinguishes a disciple''s
    heat-and-cold feats from Tao through a two-lute demonstration; Chuang Tzu answers
    Hui with cautionary parables; at Hui Tzu''s grave he compares his loss to a stone-mason
    deprived of the material needed for his skill; and Kuan Chung, near death, advises
    Duke Huan on whom not to appoint and whom to appoint in state administration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chuang Tzu asks Hui Tzu whether, without a general standard of right, each
    person could have his own standard and everybody could be a Yao; Hui Tzu replies
    that this could be so.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chuang Tzu names Confucianists, Mihists, followers of Yang and Ping, and Hui
    Tzu's own position as five competing standpoints, and asks which is right.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A disciple of Lu Chu claims to have attained Lu Chu's Tao, saying he can do
    without fire in winter and make ice in summer; Lu Chu answers that this uses latent
    heat and latent cold, not Tao.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lu Chu tunes two lutes, places one in a hall and one in an adjoining room,
    and when he strikes a note on one lute the same note sounds on the other because
    both are tuned to the same pitch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When one string's interval is changed so that it no longer keeps its place
    in the octave, striking it causes all twenty-five strings to jangle and the influence
    of the key-note is gone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hui Tzu says the Confucianists, Mihists, and followers of Yang and Ping try
    to overwhelm him with argument or noise but have not proved him wrong.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chuang Tzu tells of a man of Ch'i who sends his son to Sung to be a maimed
    doorkeeper while carefully preserving a valued vase.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chuang Tzu says that someone seeking a stray child but refusing to leave home
    is likely to lose the child.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Chuang Tzu says that a man of Ch'u sent away to be a doorkeeper, who fights
    with a boatman before the boat leaves shore, would already have brought himself
    into trouble.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Hui Tzu's grave, Chuang Tzu tells his attendants about a man of Ying who
    allowed a stone-mason to chip a thin scab from his nose without injuring him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Prince Yuan of Sung asks the stone-mason to repeat the feat, the stone-mason
    says he used to be able to do it but that his material has long since perished.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chuang Tzu says that since Hui Tzu perished, he has been without his material
    and has no one with whom he can speak.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kuan Chung, being near death, is visited by Duke Huan, who asks whom he should
    entrust with the administration of the state if Kuan Chung worsens.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kuan Chung rejects Pao Yu as administrator because Pao Yu is pure, incorruptible,
    and good, but would not associate with unlike people and would not forget others'
    wrong-doing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Kuan Chung recommends Hsi P'eng, describing him as one who makes superiors
    and inferiors forget authority and who is ashamed not to equal the Yellow Emperor
    in virtue.
  category: speech
  evidence_refs:
  - ev:9
