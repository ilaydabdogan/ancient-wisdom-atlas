canonical_text:
  quote: ''
  summary: The passage criticizes self-differentiation, ambition to govern, and managing
    people as things. It praises non-management, the perfect man’s unobtrusive spiritual
    freedom, and the true Sage’s action through inaction. It closes by distinguishing
    the Tao of God, linked with inaction and compliance, from the Tao of man, linked
    with action and entanglement.
