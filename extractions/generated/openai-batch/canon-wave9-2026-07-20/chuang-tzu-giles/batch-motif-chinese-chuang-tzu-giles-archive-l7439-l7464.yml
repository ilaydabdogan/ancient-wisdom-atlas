  summary: The passage criticizes a person who fills the inside with preferences and
    sensory attachments while surrounding the outside with ceremonial or status objects,
    yet still claims attainment. It compares this claim to a bound prisoner or a caged
    tiger or leopard making the same claim. A note then quotes Rousseau on humans
    being born free yet in chains and comments that the chapter is likely not by Chuang
    Tzu.
