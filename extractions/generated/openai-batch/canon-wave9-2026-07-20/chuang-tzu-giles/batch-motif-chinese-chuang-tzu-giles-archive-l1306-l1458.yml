  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lieh Tzu is said to ride upon the wind, travel wherever he wished, and stay
    away up to fifteen days, but he remains dependent on the wind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A hypothetical condition is described in which one is charioted upon the eternal
