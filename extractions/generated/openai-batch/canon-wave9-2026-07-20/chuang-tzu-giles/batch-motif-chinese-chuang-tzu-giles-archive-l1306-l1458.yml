    and sages who transcend ordinary dependence and reputation, narrates Hsii Yu's
    refusal of Emperor Yao's throne, and reports a fabulous mountain-dwelling divine
    man who lives on air and dew and benefits the world while inert.
  language: English
  quote_policy: quoted
literal_observations:
