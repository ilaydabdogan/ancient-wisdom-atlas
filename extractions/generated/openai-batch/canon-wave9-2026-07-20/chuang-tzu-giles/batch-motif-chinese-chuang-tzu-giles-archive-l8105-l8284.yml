canonical_text:
  quote: ''
  summary: The passage opens Chapter XIV with questions about the cause of celestial
    movement, clouds, rain, and wind. Wu Han Chao answers with the Six Influences,
    Five Virtues, and the Lo book as principles for rulership. Chuang Tzu then discusses
    charity, filial piety, invisible virtue, and the indivisibility of Tao with Tang.
    The passage ends with Pei Men Ch'eng describing his reactions to the Yellow Emperor's
    performance of the Han-ch'ih, and the Yellow Emperor saying he played as a man
    drawing inspiration from God.
  language: English
  quote_policy: summarized
