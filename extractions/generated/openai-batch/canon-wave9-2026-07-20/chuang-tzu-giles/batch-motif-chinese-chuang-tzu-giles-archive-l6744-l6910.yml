canonical_text:
  quote: ''
  summary: 'The passage describes an unnamed abstract figure who perceives light in
    darkness, harmony in stillness, spans material and spiritual extremes, and brings
    things to rest. It then narrates the Yellow Emperor''s journey to the Red Lake
    and K''un-lun Mountains, his loss of a magic pearl glossed as his spiritual part
    or soul, and the recovery of the pearl by Nothing after Intelligence, Sight, and
    Speech fail. A series of episodes follows: Yao consults Hsü Yu about Yeh Chüeh''s
    fitness for rule; Yao visits Hua and debates with its border-warden about long
    life, wealth, sons, virtue, and the true Sage; and Poh Cheng Tzu Kao resigns his
    fief after the transfer of empire from Yao to Shun and the Great Yü, becoming
    a farmer whom Yü visits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening figure is said to see where all is dark, detect light in darkness,
    hear where all is still, and detect harmony in stillness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening figure is said to sink to the lowest depths of materialism and
    soar to the highest heights of spirituality because he stands in due relation
    to all things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The opening figure can minister to the wants of all things, receive them into
    rest, and is described as a law of compensation to all things.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Yellow Emperor travels north of the Red Lake, ascends the K'un-lun Mountains,
    returns south, and loses his magic pearl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note in the passage glosses the magic pearl as the Yellow Emperor's spiritual
    part or soul.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Intelligence, Sight, and Speech are each employed to find the pearl and fail;
    Nothing is then employed and gets it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yellow Emperor remarks that it is strange that Nothing was able to get
    the pearl.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A commentary note states that knowledge, sight, and speech obscure rather
    than illuminate spiritual nature, and that true spirituality is found in a state
    of negation.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage gives a tutor lineage: Yao''s tutor is Hsü Yu; Hsü Yu''s tutor
    is Yeh Chüeh; Yeh Chüeh''s tutor is Wang I; Wang I''s tutor is Pei I.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yao asks Hsü Yu whether Yeh Chüeh would do to be emperor and says he plans
    to get Wang I to ask him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hsü Yu says Yeh Chüeh is clever and capable but unfit for empire because he
    seeks the divine by human means, uses the artificial while neglecting the natural,
    lacks inner unity, worships intelligence, and responds to circumstances.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The border-warden of Hua offers Yao wishes for long life, much money, and
    many sons; Yao declines each wish.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Yao explains that many sons bring anxieties, much money brings trouble, and
    long life brings unpleasant endurance, and says these do not advance virtue.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The border-warden replies that God gives each person a proper function and
    that sons and wealth need not create anxiety or trouble if properly ordered and
    shared.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The border-warden describes the true Sage as dwelling like a quail, feeding
    like a fledgling, travelling like a bird without leaving traces, harmonizing with
    things when Tao is present, cultivating virtue in retirement when Tao is absent,
    and after a thousand years riding white clouds to the kingdom of God where three
    evils do not reach.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: After the border-warden leaves, Yao follows and asks to inquire further, but
    the warden tells him to begone.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: A note states that the style of the Hua episode differs enough from Chuang
    Tzŭ's standard to make its authorship doubtful.
  category: other
  evidence_refs:
  - ev:12
- id: obs:18
  text: Poh Cheng Tzu Kao is described as one of Yao's vassals who resigns his fief
    and turns to agriculture after the empire passes from Yao to Shun and from Shun
    to the Great Yü.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:19
  text: The Great Yü visits Poh Cheng Tzu Kao while he is working in the fields and
    asks why he resigned his fief and took up agriculture.
  category: action
  evidence_refs:
  - ev:14
