candidate_motifs:
- id: motif:1
  label: Nonordinary perception in darkness and stillness
  taxonomy_refs:
  - wisdom
  basis: The opening figure perceives light in darkness and harmony in stillness and
    is related to all things.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The antecedent of the opening figure is not supplied within this excerpt,
    so the motif is limited to the capacities described here.
- id: motif:2
  label: Lost spiritual pearl recovered through Nothing
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The Yellow Emperor loses a magic pearl glossed as his spiritual part or soul;
    ordinary faculties fail to find it, while Nothing gets it.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The identification of the pearl with the soul comes from the passage's
    explanatory note rather than the narrative sentence alone.
- id: motif:3
  label: Mountain ascent connected with loss of sacred object
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The Yellow Emperor ascends the K'un-lun Mountains and, on returning south,
    loses the magic pearl.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not state that the ascent causes the loss; it only places
    the ascent and loss in sequence.
- id: motif:4
  label: Rulership judged by naturalness rather than cleverness
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: Hsü Yu rejects Yeh Chüeh for emperorship despite his cleverness and capability,
    contrasting the artificial with the natural and saying he is not fit to lead leaders.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage presents a philosophical judgment about fitness for rule rather
    than a formal enthronement myth.
- id: motif:5
  label: Refusal and reinterpretation of worldly blessings
  taxonomy_refs:
  - wisdom
  basis: Yao refuses long life, wealth, and sons because they bring burdens and do
    not advance virtue; the warden counters by reinterpreting proper function and
    shared wealth.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: 'The passage includes opposing evaluations: Yao rejects the blessings,
    while the warden criticizes Yao''s reasoning.'
- id: motif:6
  label: Sage's withdrawal and cloud ascent to secure divine realm
  taxonomy_refs:
  - ascent
  - afterlife_journey_map
  - wisdom
  basis: The true Sage is described as cultivating virtue in retirement when Tao is
    absent and, after a thousand years, riding white clouds to the kingdom of God,
    where the three evils do not reach and he rests in eternity.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The episode is followed by a note questioning authorship, and the destination
    is described briefly rather than mapped in detail.
- id: motif:7
  label: Renunciation of office for agriculture
  taxonomy_refs:
  - departure
  - wisdom
  basis: Poh Cheng Tzu Kao resigns his fief after the imperial succession and takes
    up agriculture; the Great Yü visits him to ask why.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The excerpt ends as Poh Cheng Tzu Kao begins his reply, so the stated
    rationale is incomplete within this passage.
