canonical_text:
  quote: ''
  summary: 'Chuang Tzu distinguishes his meaning of being without passions from Hui
    Tzu''s understanding: such a person is not disturbed internally by good and evil,
    accepts what happens, and does not add to mortality. Hui Tzu asks how man then
    obtains a body. Chuang Tzu answers that Tao gives expression and God gives form,
    then criticizes Hui Tzu for exhausting his mind on external distinctions, depicted
    through tree, table, and the phrase “hard and white.” Editorial notes identify
    Hui Tzu''s question as a gibe and the closing lines as doggerel ridiculing his
    paradoxical theories.'
  language: English
  quote_policy: summarized
