canonical_text:
  quote: ''
  summary: Chapter XII, titled “The Universe,” presents a discourse on Tao as the
    ordering principle of the universe, the ideal of inaction in ancient rule, the
    attributes of the person of complete virtue, the unity of all things, and analogies
    for the responsiveness of creation to Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the universe is vast, its phenomena are regular, its
    laws are uniform, and sovereignty begins in virtue and ends in God.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes an old order in which the empire was under the sovereignty
    of inaction and possessed only the virtue of God.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Words, delimitations, abilities, and point of view are said to accord with
    Tao, producing correct sovereignty, clear duties, government by officials, and
    responsive things.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Virtue is described as the connecting link between God and man, while Tao
    spreads throughout all creation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A cited saying states that ancient nourishers of the empire had no desires,
    did nothing, preserved repose, and the people rested in peace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Record says that by converging to One all things may be accomplished,
    and that virtue without intention can subdue the supernatural.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Master says that Tao covers and supports all things and that each man
    should prepare his heart accordingly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master lists qualities including acting and speaking by inaction, loving
    men and caring for things, recognizing unlike as like, making no distinctions,
    holding to virtue, following Tao, and not opposing the natural bias of things.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The person who realizes these points buries gold on a hillside, casts pearls
    into the sea, does not struggle for wealth or fame, is not disturbed by age, death,
    success, failure, throne, or empire, and regards all things as One.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Metal and stone are said to possess sound but not emit it unless struck, and
    this principle is applied to all creation.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man of complete virtue remains passive toward surrounding events, stays
    as he is by nature, has knowledge extending to the supernatural, and his heart
    becomes a refuge for those who come to it.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that without Tao form cannot have life, and without virtue
    life cannot have intelligence.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The man of complete virtue issues forth spontaneously, moves without premeditation,
    and all things follow in his wake.
  category: sequence
  evidence_refs:
  - ev:13
