canonical_text:
  quote: Abandon wisdom and discard knowledge, and the empire will be at peace.
  summary: Lao Tzu tells Ts'ui Chii that governing interference damages the natural
    goodness of the human heart and recounts disorder caused by moralizing rule, punishment,
    and rivalry. The Yellow Emperor later seeks Kuang Ch'eng Tzu on Mount K'ung-t'ung
    for perfect Tao, is rebuked, renounces the throne, enters seclusion, and returns
    humbly.
  language: English
  quote_policy: quoted
