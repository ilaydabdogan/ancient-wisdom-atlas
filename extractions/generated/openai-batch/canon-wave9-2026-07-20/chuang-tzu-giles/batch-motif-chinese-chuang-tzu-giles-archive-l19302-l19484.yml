canonical_text:
  quote: ''
  summary: The passage praises an ideal of non-possession, depth, moderation, sympathy
    with creation, and non-aggression; names Kuan Yin and Lao Tzu as true ancient
    sages; describes the ancient Tao in terms of silence, formlessness, impermanence,
    life and death, and the unknown departure of the soul; characterizes Chuang Tzu
    as a follower of Tao who uses unusual language and lives at peace with creation;
    and presents Hui Tzu as a prolific, paradoxical dialectician whose sayings relativize
    size, direction, world-center, categories, and perception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed exemplary subject is described as contenting himself with the unsubstantial,
