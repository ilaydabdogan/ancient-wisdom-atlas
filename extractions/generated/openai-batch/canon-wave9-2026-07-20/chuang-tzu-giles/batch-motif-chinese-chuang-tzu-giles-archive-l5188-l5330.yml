canonical_text:
  quote: ''
  summary: The passage criticizes additions to or deviations from natural conditions.
    It gives examples of exceptional sight and hearing, reputational charity, argumentative
    refinement, bodily alterations such as dividing joined toes or shortening and
    lengthening animal legs, and artificial tools such as arcs, compasses, glue, and
    cords. It argues that imposed charity, duty, ceremonies, and music alter human
    nature, and it closes with examples of people losing flocks or lives through differing
    pursuits such as reading, feats of strength, fame, and gain.
  language: English
  quote_policy: summarized
