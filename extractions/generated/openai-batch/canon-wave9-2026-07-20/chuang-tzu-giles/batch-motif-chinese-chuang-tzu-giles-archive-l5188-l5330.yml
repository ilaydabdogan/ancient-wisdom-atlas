- id: obs:2
  text: People with extra keenness of hearing are said to muddle themselves over musical
    notes, pitch-pipes, and timbres; Shih K'uang is given as an example.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: People who graft on charity are said to display virtue for reputation and
    public applause; Tseng and Shih are given as examples.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: People who refine in argument are said to wear themselves out over terms such
    as hard and white, like and unlike; Yang and Mih are given as examples.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that every addition to or deviation from nature does not
    belong to ultimate perfection, and that one seeking perfection does not lose sight
    of natural conditions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A duck's short legs cannot be lengthened without pain, and a crane's long
    legs cannot be shortened without misery.
  category: relationship
  evidence_refs:
  - ev:6
