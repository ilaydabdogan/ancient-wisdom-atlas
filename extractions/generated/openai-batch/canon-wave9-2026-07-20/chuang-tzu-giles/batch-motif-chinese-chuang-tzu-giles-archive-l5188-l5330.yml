  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Shun is said to have pursued charity and duty to one's neighbour in order
    to secure the empire, after which people devoted their lives to those pursuits.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says that mean men die for gain, superior men for fame, men of
    rank for ancestral honours, and Sages for the world; their pursuits differ but
