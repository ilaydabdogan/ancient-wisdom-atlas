canonical_text:
  quote: ''
  summary: 'Lien Shu rebukes an interlocutor for mental blindness toward a divine
    man whose influence fills creation and who is unharmed by flood or drought. Several
    illustrative episodes follow: a Sung trader brings sacrificial caps to Yueh where
    they are useless; Yao visits sages on Miao-ku-she mountain and loses concern for
    empire; Hui Tzu complains about an oversized gourd and a worthless tree; Chuang
    Tzu replies with parables of a hand-salve used differently, a gourd made into
    a boat, animals caught or spared by their abilities, and a useless tree safe in
    non-existence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lien Shu says that blindness and deafness can be diseases of the mind, and
    applies this criticism to the person he addresses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lien Shu says the good influence of the man under discussion fills all creation
    and questions why he should attend to the details of an empire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage says objective existences cannot harm the divine man: he would
    not drown in a sky-high flood and would not be hot in a drought that liquefied
    metals and scorched mountains.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man of Sung carries sacrificial caps to the Yueh State, but the men of Yueh
    cut off their hair and paint their bodies, so they have no use for the caps.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Emperor Yao, described as ruler of all under heaven, visits four sages of
    Miao-ku-she mountain and, after returning to Fen-yang, the empire exists for him
    no more.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The commentary says Yao had his eyes opened to the hollowness and uselessness
    of mortal possessions and ceased to think of himself and of the empire.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hui Tzu says the Prince of Wei gave him a large gourd seed; the fruit became
    as large as a five-bushel measure, but he found it unsuitable for holding liquids
    or making ladles and broke it up.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chuang Tzu replies that Hui Tzu did not know how to use large things.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Chuang Tzu tells of a Sung family with a salve for chapped hands, a stranger
    who buys the recipe, and the Prince of Wu using it in a winter naval battle against
    Yueh.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The salve has the same efficacy in both cases, but one use supports silk-washing
    while another use secures territory and a title.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Chuang Tzu says Hui Tzu could have made the large gourd into a boat and floated
    over river and lake.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hui Tzu compares Chuang Tzu's words to a large, knotty, twisted roadside tree
    that no carpenter wants.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Chuang Tzu contrasts a wild cat that springs about and may be caught in a
    trap or snare with a large yak that cannot catch mice.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Chuang Tzu advises placing the big tree in the domain of non-existence and
    resting in inaction beneath its shade, where it would be safe from axe and injury
    because it is of no use to others.
  category: speech
  evidence_refs:
  - ev:12
