candidate_motifs:
- id: motif:1
  label: mental blindness before wisdom
  taxonomy_refs:
  - wisdom
  basis: Lien Shu says the addressed person suffers from blindness and deafness of
    the mind when failing to understand the divine man's scope.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a philosophical metaphor within dialogue, not a narrative of literal
    blindness.
- id: motif:2
  label: divine man unharmed by cosmic extremes
  taxonomy_refs: []
  basis: The divine man is said to be unaffected by a sky-high flood and by drought
    severe enough to liquefy metals and scorch mountains.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents the image as an illustration of transcendence or
    inaction; it does not narrate an actual flood episode.
- id: motif:3
  label: encounter with mountain sages changes relation to rulership
  taxonomy_refs:
  - wisdom
  basis: Yao visits four sages on Miao-ku-she mountain and returns to find the empire
    no longer matters to him; commentary frames this as rejection of self and mortal
    possessions.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage is brief and didactic; the exact nature of Yao's encounter
    with the sages is not narrated.
- id: motif:4
  label: large or useless object redeemed by changed application
  taxonomy_refs:
  - wisdom
  basis: The gourd, rejected as too large for ordinary use, is reimagined as a boat;
    the salve has different outcomes depending on its application.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The motif is practical-philosophical rather than mythic in a narrow sense.
- id: motif:5
  label: same power, different scale of use
  taxonomy_refs:
  - wisdom
  basis: The salve's efficacy is the same, but in one context it supports silk-washing
    and in another it wins military reward and rank.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: This is explicitly stated in the passage as a contrast in application.
- id: motif:6
  label: protective uselessness
  taxonomy_refs:
  - wisdom
  basis: The yak's inability spares it from the wild cat's danger, and the useless
    tree is safe from axe and injury because it is of no use to others.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage uses animal and tree images as teaching examples; it does
    not claim literal invulnerability for all useless things.
- id: motif:7
  label: withdrawal to non-existence and inaction
  taxonomy_refs: []
  basis: Chuang Tzu says the big tree may be planted in the domain of non-existence,
    where one may rest in inaction beneath its shade.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The 'domain of non-existence' is explained in the supplied commentary
    as mental abstraction, so the image should not be treated as a mapped mythical
    geography without review.
