  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Yeh Ch'iieh asks P'i I about Tao, and P'i I tells him to control the body,
    concentrate the gaze and thoughts upon One, and keep back knowledge.
  category: speech
  evidence_refs:
  - ev:2
