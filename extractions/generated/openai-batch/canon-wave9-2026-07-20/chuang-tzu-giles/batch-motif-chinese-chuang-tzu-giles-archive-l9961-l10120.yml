canonical_text:
  quote: ''
  summary: The excerpt moves from a phoenix-and-owl image to a dialogue between Chuang
    Tzu and Hui Tzu on a bridge over the Hao about knowing the pleasure of fishes.
    It then begins Chapter XVIII, asking whether perfect happiness exists, surveying
    conventional goods and pleasures, questioning whether wealth, rank, old age, and
    patriotic goodness produce real happiness, and concluding that true pleasure and
    preservation of life are found in inaction, with perfect happiness described as
    the absence of happiness.
