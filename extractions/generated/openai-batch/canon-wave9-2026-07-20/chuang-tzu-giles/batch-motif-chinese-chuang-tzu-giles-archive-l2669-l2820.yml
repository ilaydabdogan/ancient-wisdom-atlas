canonical_text:
  quote: ''
  summary: Yen Hui tells Confucius he intends to go to Wei to advise its misgoverned
    prince and help the suffering people. Confucius warns that active moral intervention
    before inner possession of Tao will endanger Yen Hui, that virtue and wisdom can
    produce fame-seeking and contention, and that preaching to wicked rulers can provoke
    hatred. He uses fire, water, and oil-on-flames images, cites old examples of slain
    virtuous men and destructive campaigns, rejects Yen Hui's first proposed strategy,
    and then hears Yen Hui describe being inwardly straight and outwardly crooked,
    with reference to being a servant and child of God.
  language: English
  quote_policy: summarized
