canonical_text:
  quote: I will never take office. Thus I shall remain free to follow my own inclinations.
  summary: The passage gives title and contents material, then introduces Chuang Tzu
    through Ssu-ma Ch'ien's notice, describing his life, writings, relationship to
    Lao Tzu's doctrines, criticisms of Confucian and Mihist schools, and refusal of
    Prince Wei's invitation to become Prime Minister. It ends by introducing Lao Tzu
    as an earlier prophet whose teaching is presented as morally and verbally elusive.
  language: English
