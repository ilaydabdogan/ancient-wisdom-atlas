canonical_text:
  quote: ''
  summary: The passage moves through notes on order, social relationships, mortality,
    and the ineffability of Tao. Chuang Tzu tells Tung Kuo Tzu that Tao is present
    everywhere, including lowly things such as an ant, a tare, a potsherd, and ordure.
    He invites the interlocutor toward the palace of Nowhere and inaction, and describes
    Tao as causing paired conditions without being any of them. A later anecdote presents
    O Ho Kan announcing Lao Lung's death to Shen Nung, whose reaction prompts Yen
    Kang Tiao to praise withholding vain talk and to say that discussing Tao makes
    it not Tao.
  language: English
  quote_policy: summarized
