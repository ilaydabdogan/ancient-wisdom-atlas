canonical_text:
  quote: ''
  summary: A dialogue contrasts rulers, thieves, learned men, wealth, reputation,
    social ranks, and moral distinctions. Tzu Chang argues that worthiness depends
    on acts rather than rank or poverty. Man Kou Te counters with examples of successful
    violence and service under violent rulers. Wu Yoh arbitrates by advising abandonment
    of wealth and reputation, return to the natural self, non-action, and walking
    in the way of Tao, then lists calamities suffered by loyal, faithful, honest,
    and upright figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tzu Chang says Chieh and Chou possessed imperial power but are despised, while
    Confucius and Mih Tzu were poor and simple yet are treated as honorable models.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tzu Chang concludes that monarchical power does not necessarily make a man
    worthy, poverty does not necessarily make a man unworthy, and worthiness is differentiated
    by acts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Man Kou Te replies that a petty thief is imprisoned while a great brigand
    becomes ruler of a state, and virtuous men may be found among that ruler's retainers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Man Kou Te cites examples of rulers or powerful men who killed, seized, or
    usurped, while respected figures nevertheless served or accepted pay from them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tzu Chang asks how the Five Bonds and Six Ranks can be distinguished if virtue,
    kinship distinctions, duties of worthy and unworthy, and precedence of young and
    old are not maintained.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Man Kou Te answers by listing ancient cases of killing, banishment, deposition,
    and fratricide to challenge claims about kinship, duties, and precedence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Man Kou Te contrasts Tzu Chang's pursuit of reputation with his own pursuit
    of wealth and asks Wu Yoh to arbitrate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wu Yoh says the mean man devotes himself to wealth and the superior man to
    reputation, but both would reach the same result if they set aside activity and
    devoted themselves to doing nothing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wu Yoh instructs the hearer to revert to the natural self, abide by the laws
    of heaven, view straight and crooked from the standpoint of the infinite, hold
    to a magic circle, and walk in the way of Tao.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wu Yoh lists named figures who suffered disembowelment, blinding, drowning,
    drying up, refusal of self-justification, or failures of family visitation, and
    says learned men who carried precepts into practice paid penalties and fell into
    calamities.
  category: sequence
  evidence_refs:
  - ev:7
