canonical_text:
  quote: ''
  summary: A sequence of anecdotes contrasts worldly danger, office, conquest, and
    reputation with attainment of Tao. Confucius answers disciples who question his
    music amid persecution by saying success and failure are measured by Tao, not
    circumstance. The passage then gives examples of ancient figures happy apart from
    success or failure, rulers offering empire to others, and recipients who reject
    such offers, some by drowning themselves. The excerpt ends with Po I and Shu Ch'i
    seeking western men said to possess Tao and receiving a blood-sealed, buried treaty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yen Hui is picking over herbs while Tzu Lu and Tzu Kung talk together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tzu Lu and Tzu Kung describe repeated dangers and rejections faced by their
    Master, including expulsion, rejection, a tree cut down, encirclement, and threats
    of death or capture.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The disciples question whether it is right for a superior man to keep playing
    and singing without cease under such conditions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yen Hui reports the conversation to Confucius, who lays aside his guitar and
    summons Yu and Tz'ii.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Confucius says that success and failure should be judged by success or failure
    in Tao, and that falling into the troubles of a disordered age is not itself failure.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Confucius says cultivation of the inner man prevents failure in Tao and that
    danger need not cause loss of virtue.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Confucius compares winter, frost, and snow with the luxuriance of pine and
    fir, then calls his present situation a blessing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Confucius resumes playing and singing; Tzu Lu dances with a shield to the
    music; Tzu Kung speaks of not knowing the height of heaven or depth of earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator states that ancient people who attained Tao were equally happy
    in success and failure, and names Hsü Yu and Kung Poh as examples.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: Shun offers to resign the empire to Pei Jen Wu Tse; Pei Jen Wu Tse rebukes
    him and drowns himself in the waters of Ch'ing-ling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: T'ang consults Pien Sui and Wu Kuang before attacking Chieh; both decline
    to help, and T'ang later takes I Yin into his counsels, attacks Chieh, and vanquishes
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: T'ang offers the empire to Pien Sui; Pien Sui refuses, interprets the actions
    as insults, and drowns himself in the river Chou.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: T'ang offers the throne to Wu Kuang; Wu Kuang refuses on ethical grounds,
    takes a stone on his back, and jumps into the river Lu.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Po I and Shu Ch'i live in Ku-tu, go west to see men apparently in possession
    of Tao, and at Ch'i-yang are approached through Shu Tan for a blood-sealed and
    buried treaty.
  category: sequence
  evidence_refs:
  - ev:9
