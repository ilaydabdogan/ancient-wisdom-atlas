candidate_motifs:
- id: motif:1
  label: Equanimity of the Tao-attainer in adversity
  taxonomy_refs:
  - wisdom
  basis: Confucius continues music despite danger, defines failure by Tao rather than
    circumstance, and the narrator generalizes that ancient Tao-attainers were happy
    under both success and failure.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The motif is framed specifically by this passage's Tao vocabulary and
    should not be generalized beyond that without comparison.
- id: motif:2
  label: Adversity reveals inner virtue
  taxonomy_refs:
  - wisdom
  basis: Confucius says danger brings no loss of virtue when the inner man is cultivated
    and compares winter, frost, and snow to the revealed luxuriance of pine and fir.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an ethical image within a philosophical anecdote rather than a
    developed mythic episode.
- id: motif:3
  label: Refusal of sovereign power
  taxonomy_refs:
  - royal_legitimacy
  basis: Shun offers the empire to Pei Jen Wu Tse, and T'ang offers empire or throne
    to Pien Sui and Wu Kuang; all refuse or repudiate the offer.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The royal_legitimacy taxonomy reference is approximate, since the passage
    emphasizes rejecting power rather than legitimating rule.
- id: motif:4
  label: Self-drowning after rejecting dishonorable power
  taxonomy_refs: []
  basis: Pei Jen Wu Tse, Pien Sui, and Wu Kuang each enter water to die after rejecting
    an imperial offer or the moral implications of political power.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not present the deaths as ritual sacrifice; the label
    is descriptive.
- id: motif:5
  label: Refusal to counsel violent regime change
  taxonomy_refs:
  - wisdom
  basis: Pien Sui and Wu Kuang decline to help T'ang's attack on Chieh, and Wu Kuang
    later says deposing a ruler and slaying people are not righteous or charitable
    acts.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage also reports T'ang's successful attack, so the ethical stance
    is concentrated in the refusal speeches rather than in the whole narrative voice.
- id: motif:6
  label: Blood-sealed and buried treaty
  taxonomy_refs:
  - covenant
  basis: Po I and Shu Ch'i are offered rank and emoluments through a treaty that is
    to be sealed with blood and buried.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The excerpt ends soon after the treaty is described, so the later function
    of the covenant is not available here.
- id: motif:7
  label: Quest for men in possession of Tao
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Po I and Shu Ch'i decide to go west after hearing that men there are apparently
    in possession of Tao.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Only the beginning of the journey is present in this excerpt.
comparison_claims:
- id: claim:1
  claim: 'Within the passage, Confucius''s composure, the named ancient Tao-attainers,
    and the later refusers of empire serve a shared function: they subordinate worldly
    success, danger, or rulership to Tao-centered judgment.'
  claim_level: same_function
  target: intra-passage pattern of Tao-centered success and failure
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The episodes differ in setting and action; this claim is limited to
    their shared function in the excerpt and does not imply historical contact or
    a single external source.
- id: claim:2
  claim: The Pei Jen Wu Tse, Pien Sui, and Wu Kuang anecdotes share the same descriptive
    pattern of rejecting imperial power or its moral implications and then dying by
    entering water.
  claim_level: same_motif
  target: self-drowning after refusal of empire pattern within this passage
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison covers only these three anecdotes in the supplied passage;
    motivations and speeches differ among the three figures.
- id: claim:3
  claim: The blood-sealed and buried treaty can be cautiously compared to the covenant
    motif family at the level of literal treaty-making marked by blood.
  claim_level: same_motif
  target: covenant motif family
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only a brief treaty description and does not explain
    the ritual meaning or later consequences in this excerpt.
