canonical_text:
  quote: ''
  summary: Chii Poh Yii advises guarded self-reformation and outward adaptation without
    inner compromise, then illustrates caution through stories of a praying mantis
    opposing a chariot, keepers managing tigers, and a groom startling a horse. The
    passage then gives the story of an artisan who ignores a huge sacred li tree because
    its timber is useless; in a dream the tree explains that uselessness preserved
    it from harm. The artisan later explains that sacred status protected the tree
    from being cut down. The passage ends with Tzu Ch'i of Nan-poh encountering another
    very large tree on Shang mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chii Poh Yii tells the addressee to begin with self-reformation and to separate
    outward adaptation from an inward standard.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chii Poh Yii warns that letting outward adaptation enter within leads to falling,
    obliteration, collapse, and prostration; letting the inward standard appear outwardly
    makes one a sound, name, bogie, or uncanny thing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chii Poh Yii tells the addressee to mirror the conduct of the person approached,
    including childishness or lack of decorum, in order to reach him without offending
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A praying mantis, in rage, stretches out its arms to stop a passing chariot,
    although the task is beyond its strength.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tiger keepers avoid giving tigers live or whole animals and watch periods
    of hunger and fullness to prevent furious outbursts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A groom may brush flies or mosquitoes from a horse unexpectedly, causing the
    horse to break its bridle and injure its head and chest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An artisan traveling to the Ch'i State reaches Ch'ü-yuan, sees a very large
    sacred li tree, and continues without looking back, while his apprentice gazes
    at it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The artisan says the sacred tree is good for nothing as a boat, coffin, furniture,
    door, or pillar, and says its lack of use explains its great age.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the artisan's dream, the tree says fruit-bearing trees are damaged because
    of their value and says it deliberately aimed for uselessness, thereby becoming
    useful in its present state.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the dream, the artisan explains that the tree became sacred to escape
    enemies and avoid being cut down, and says ordinary standards miss the point.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Tzu Ch'i of Nan-poh travels on Shang mountain and sees a large tree whose
    shade could shelter a thousand chariot teams.
  category: sequence
  evidence_refs:
  - ev:10
