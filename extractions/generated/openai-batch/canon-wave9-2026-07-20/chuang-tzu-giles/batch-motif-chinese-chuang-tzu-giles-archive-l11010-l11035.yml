canonical_text:
  quote: ''
  summary: 'A disciple argues that Pien Tzu is not responsible for another man''s
    doubt. Pien Tzu rejects this and tells a parable: a prince honors a bird with
    ox-meat and court music, but the bird is frightened because it is not being treated
    according to its own nature. He applies the parable to Sun Hsiu, saying that speaking
    of the perfect man to a person of small understanding is like putting a mouse
    in a coach or playing music to a quail. An editorial note says the episode has
    appeared earlier in chapter xviii.'
  language: English
  quote_policy: summarized
