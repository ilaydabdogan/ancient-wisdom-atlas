canonical_text:
  quote: ''
  summary: In a dialogue about three swords, Chuang Tzu contrasts the cosmic sword
    of the Son of Heaven and the virtuous sword of Princes with the violent sword
    of the People. He rebukes the prince for favoring the latter; the prince honors
    him, withdraws for three months, and the swordsmen die at home under the new order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince asks about three swords, and Chuang Tzu names the sword of the
    Son of Heaven, the sword of the Princes, and the sword of the People.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sword of the Son of Heaven is described as having geographic and cosmic
    parts, including named regions, barbarians, seasons, the great ocean, the five
    elements, and Yin and Yang.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sword of the Son of Heaven does not respond to ordinary pushing, raising,
    lowering, or whirling; it cuts clouds above and earth below, and one flash makes
    the princes submit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The sword of the Princes is described through human qualities: wise and brave,
    incorruptible, virtuous, loyal, and heroic qualities form its parts.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sword of the Princes models itself on round heaven, square earth, celestial
    bodies, seasons, and the wishes of the people in order to diffuse peace.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sword of the People is personified with dishevelled hair, a slouching
    cap, coarse tassel, short-tailed coat, glaring eyes, and fierce speech.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sword of the People violently cuts and wounds bodies in conflict and is
    compared to a game-cock whose life is soon cut short.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chuang Tzu tells the prince that he has sovereign power but devotes himself
    to the sword of the People, and says he is ashamed of it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prince draws Chuang Tzu onto the dais, attendants serve food, and the
    prince repeatedly assists with his own hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chuang Tzu tells the prince to be seated and compose his mind, saying he has
    finished speaking about swords.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Afterward the prince does not leave his palace for three months, while the
    swordsmen, submitting to the new order, die in their own homes; a commentator
    offers the variant that they killed themselves.
  category: sequence
  evidence_refs:
  - ev:7
