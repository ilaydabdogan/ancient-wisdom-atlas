  quote: Do nothing, and all things will be done.
  summary: The passage presents Tao as a metaphorical “Way,” lists selected sayings
    attributed to Lao Tzu, emphasizes the doctrine of Inaction, contrasts Confucius’
    practical ethics with Taoist idealism, describes Chuang Tzu as responding to that
    materialism while extending Lao Tzu’s principles, and discusses claims about a
    Lao Tzu volume and the Tao-Te-Ching.
  language: English
  quote_policy: quoted
