- id: obs:2
  text: A note describes the listed figures as ancient worthies whose careers were
    more or less unsuccessful; little is said of the first two except that the second
    had ears seven inches long.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Poh I and Shu Ch'i are described as brothers and types of moral purity; each
    refused the throne because he considered his brother more entitled, and they died
    of starvation on mountains rather than submit to a dynastic change.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fifth listed worthy smeared his body with lacquer so that no one would
    come near him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The seventh listed worthy tied a stone around his neck and jumped into a river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pure men of old did their duty to their neighbours but did not associate
    with them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pure men are described as seeming to belong to the world while treading
    beyond its limits, and as seeming to desire silence while having dispensed with
    language.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says the pure men saw penal laws as a trunk, social ceremonies
    as wings, wisdom as an accessory, and morality as a guide.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that what the pure men cared for and what they did not care
    for could both be reduced to one; in what was one they were of God, and in what
    was not one they were of Man, so no conflict arose between the human and the divine.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Life and death are said to belong to Destiny, and their sequence is compared
    to day and night as a divine law beyond human interference.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage compares a person's love for God as father and a person's willingness
    to die for a ruler with devotion to something greater, identified in notes as
    Tao and the Supreme Ruler of Creation.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: When a pond dries and fish are left on dry ground, the passage says moistening
    them with breath or spittle is inferior to leaving them in their native rivers
    and lakes; it then says attending to the development of Tao is better than praising
    Yao and blaming Chieh.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tao is said to give the speaker form, toil in manhood, repose in old age,
    and rest in death, and is called the best arbiter of life and death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A boat hidden in a creek or bog can still be carried away at midnight by a
    strong man; the passage says that concealing smaller things within larger ones
    still leaves a chance of loss.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage says that if the whole universe is concealed in the whole universe
    there is no place for it to be lost; it then describes attaining human form as
    joyful and undergoing countless transitions with the infinite ahead as blissful.
  category: other
  evidence_refs:
