canonical_text:
  quote: ''
  summary: The passage lists ancient worthies who served rulers and then comments
    on particular careers, including brothers who refused a throne and died on mountains,
    a man who covered himself with lacquer, and a man who jumped into a river with
    a stone tied to him. It describes the conduct of the pure men of old, their relation
    to society, language, law, ceremony, wisdom, morality, unity, God, Man, Destiny,
    and Tao. It uses images of fish in a dried pond, a hidden boat, and the universe
    concealed in the universe to discuss proper conditions, loss, death, transformation,
    and the development of Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The listed ancient worthies are described as servants of rulers who carried
    out the commands of others rather than their own.
  category: relationship
  evidence_refs:
