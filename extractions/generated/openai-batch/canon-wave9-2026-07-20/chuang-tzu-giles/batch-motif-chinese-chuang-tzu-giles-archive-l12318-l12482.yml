canonical_text:
  quote: ''
  summary: Personified Knowledge travels through watery and mountainous regions seeking
    how Tao may be known, approached, and attained. Do-nothing Say-nothing gives no
    answer; All-in-extremes is about to answer but forgets; the Yellow Emperor gives
    an apophatic answer and then says the silent and forgetful figures are closer
    to right than those who speak. The passage continues with teaching on wordless
    wisdom, inaction, life and death as transformations of vital fluid, the oneness
    of all things, and the silent model of the universe and seasons for the Sage.
  language: English
  quote_policy: summarized
