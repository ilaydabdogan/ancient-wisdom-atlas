canonical_text:
  quote: They all exaggerated reputation and disregarded death.
  summary: The passage lists celebrated examples of virtue or loyalty that ended in
    starvation, drowning, burning, or disembowelment, then presents a rebuke of reputation-seeking
    moral doctrine. Confucius leaves shaken after visiting Che, and a later exchange
    contrasts virtue, confidence, wealth, reputation, and shamelessness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Poh I and Shu Ch'i declined the sovereignty of Ku-chu, died of starvation
    on Mount Shou-yang, and their corpses were not buried.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pao Chiao is described as making a show of virtue, abusing the world, grasping
    a tree, and dying; an editorial note says Tzu Kung scolded him so vigorously that
    he withered into dead wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shen T'u Ti, after his counsels were ignored, jumped into a river with a stone
    on his back and became food for fishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chieh Tzu T'ui cut flesh from his thigh to feed Wen Wang, later retired in
    anger, grasped a tree, and was burnt to death after Wen Wang tried to smoke him
    out of a forest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wei Sheng waited beneath a bridge for a girl; when she did not come and the
    water rose, he stayed, grasped a buttress, and died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says the listed figures exaggerated reputation, disregarded death,
    failed to reflect on their original nature, and failed to preserve life into old
    age.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wang Tzii, Pi Kan, and Wu Tzu Hsii are named as ministers called loyal; Wu
    Tzu Hsii drowned himself, and Pi Kan was disembowelled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker tells Ch'iu that ghostly subjects would not be understood and
    human affairs are already known, then describes desires of eye, ear, palate, and
    ambition, the brevity of life, and the need to preserve original purity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Confucius makes two obeisances, leaves hurriedly, misses the reins three times
    when mounting his chariot, appears dazed and pale, and grasps the chariot bar
    with downcast head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Liu Hsia Chi asks Confucius whether he visited Che and was rebuffed; Confucius
    confirms this and compares his act to smoothing a tiger's head and nearly entering
    its mouth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tzu Chang argues that practising virtue inspires confidence, confidence leads
    to place, place leads to wealth, and duty toward one's neighbour is key to reputation
    or wealth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Man Kou Te replies that shameless people grow rich, confidence makes people
    conspicuous, and reputation and wealth are mostly gained from shamelessness and
    inspired confidence.
  category: speech
  evidence_refs:
  - ev:7
