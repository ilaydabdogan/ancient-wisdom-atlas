canonical_text:
  quote: ''
  summary: A sequence of sayings contrasts obstruction and free passage in senses,
    mind, Tao, and breath; describes mental spaciousness, hermitage, natural timing,
    remedies, and graded spiritual attention; gives exempla of self-mortification,
    refusal of empire, and river death; and ends with analogies of fish-trap, rabbit-snare,
    and language as means to an attained end.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unobstructed nose, mouth, mind, and wisdom are each said to produce smell,
    taste, wisdom, and Te respectively.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tao is said not to be obstructed; obstruction is described as strangling and
    as giving rise to evils.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sentient beings are said to depend on breath; God supplies it continually,
    but man stops its passage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Man is described as having a spacious domain, and the mind may roam to heaven;
    when the mind lacks room, faculties become antagonistic.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those who would benefit mankind from deep forests or lofty mountains are said
    to become hermits because they are unequal to a strain on their higher natures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists consequences of ill-regulated virtue, reputation, scheming,
    knowledge, obstinacy, and organized government.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Spring rains arrive in season, and plants and shrubs grow before weeding and
    tending begin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Repose, rubbing the eyelids, and quiet are named as remedies for those who
    need them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Divine man, true Sage, truly virtuous man, superior man, and mean man are
    distinguished by what does or does not claim their attention.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The keeper of the Yen gate maltreated himself after his parents' death, received
    a high official post, and his relatives imitated the maltreatment, with about
    half dying.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Yao offered the empire to Hsü Yu, who fled; T'ang offered it to Wu Kuang,
    who declined angrily.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Chi T'o took all his disciples and jumped into the river K'uan; feudal princes
    mourned for three years, and Shen T'u Ti had the river filled up.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A fish-trap, rabbit-snare, and language are presented as means whose function
