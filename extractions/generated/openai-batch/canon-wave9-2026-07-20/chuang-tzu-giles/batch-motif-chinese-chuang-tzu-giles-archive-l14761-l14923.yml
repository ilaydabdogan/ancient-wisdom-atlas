canonical_text:
  quote: ''
  summary: The excerpt opens with Tse Yang seeking access to the prince of Ch'u. Wang
    Kuo recommends the hermit Kung Yüeh Hsiu and contrasts worldly knowledge without
    virtue with the influence of the true Sage. The passage describes the Sage as
    silently producing peace, treating all things as One, and acting without self-conscious
    knowledge. It then uses analogies of beauty, mankind, the wanderer returning home,
    and Jen Hsiang Shih reaching the centre where infinities converge. Later examples
    concern T'ang and his tutor, Confucius as tutor, Yung Cheng Shih's aphorism on
    days and years, and a broken treaty that leads Prince Hui of Wei to consider assassination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tse Yang visits Ch'u; I Chieh speaks of him to the prince, but the prince
    refuses him an audience.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After I Chieh returns, Tse Yang asks Wang Kuo to obtain an interview with
    the prince; Wang Kuo says Kung Yüeh Hsiu is better fitted for that task.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kung Yüeh Hsiu is described as catching turtles on the river in winter, resting
    in a mountain copse in summer, and calling that place his home.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wang Kuo describes I Chieh as knowledgeable but without virtue, and says help
    without virtue becomes a hindrance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prince of Ch'u is described as dignified and severe, and as merciless
    as a tiger when punishing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The true Sage is said to make nearby people forget poverty when obscure, and
    to make princes forget rank and emoluments when in power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tao is described as a constant quantity that may be shared but not divided.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The true Sage is said to instil peace while silent, and by mere presence to
    make people relate as father and son.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The true Sage is described as free from embarrassments, seeing all things
    as One without knowing this as a self-conscious fact, and remaining the same in
    action.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'A beauty is used as an analogy: mankind is the mirror in which she sees herself,
    yet her joy continues whether or not she knows she is beautiful.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The love of a Sage for fellow humans is said to continue without end whether
    or not the Sage knows or hears of it, and mankind reposes in it.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A wanderer is said to be gladdened by the old country and old home even if
    most of it is wilderness; the gloss compares this joy to the mind returning to
    itself.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: Jen Hsiang Shih is said to have reached the centre and attained; the note
    identifies this centre as the place where all infinities converge.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Jen Hsiang Shih is described as recognizing no beginning, end, quantity, or
    time, and as being modified with his environment while knowing no modification
    as part of One.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: The true Sage is said to ignore God, man, beginning, and matter, to move in
    harmony with his generation, and to take things as they come.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: T'ang appoints his equerry Men Yin Teng Heng as tutor, listens to his counsels
    without being restricted by them, and gains Tao; the tutor gains reputation, which
    is described as a violation of principle.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Yung Cheng Shih says that if days are taken away there would be no years,
    and adds that there is no inside and no outside.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:18
  text: Prince Hui of Wei becomes angry after prince Wei of Ch'i breaks a treaty and
    is about to send someone to assassinate him; the Captain-General hears and cries
    out in shame.
  category: sequence
  evidence_refs:
  - ev:18
