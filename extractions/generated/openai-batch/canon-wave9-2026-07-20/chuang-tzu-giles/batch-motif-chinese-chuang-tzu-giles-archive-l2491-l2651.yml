canonical_text:
  quote: ''
  summary: The passage opens Chapter III, “Nourishment of the Soul,” with aphorisms
    on limited life, limitless knowledge, and a middle course. It then presents Prince
    Hui’s cook, who cuts up a bullock by following Tao and the animal’s natural openings
    rather than forcing the blade. Hsien observes a one-footed official and reflects
    on divine and human causation, followed by an analogy of wild fowl preferring
    freedom to a cage. The passage ends with Ch’in Shih’s restrained mourning for
    Lao Tzu and his criticism of excessive grief as a violation of eternal principles.
  language: English
  quote_policy: summarized
