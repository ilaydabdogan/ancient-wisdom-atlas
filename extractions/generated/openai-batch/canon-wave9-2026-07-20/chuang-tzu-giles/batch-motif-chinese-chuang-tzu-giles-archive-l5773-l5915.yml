canonical_text:
  quote: ''
  summary: The passage argues that wisdom, knowledge, artificial standards, valuables,
    measures, expert models, and moral-doctrinal disputation generate robbery, contention,
    doubt, and social-cosmic confusion. It contrasts this with an ancient Golden Age
    of simple local life, knotted-cord communication, and non-interference, and concludes
    that love of knowledge has disturbed natural order since the Three Dynasties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker calls for discarding wisdom and knowledge, jade and pearls, tallies
    and signets, measures and scales, and restrictions attributed to Sages; these
    actions are linked to the disappearance of robbers, thieves, quantity disputes,
    and to people reverting to natural integrity and becoming fit to receive Tao.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Musical instruments, colour categories, and measuring or drafting tools are
    to be confused, broken, dispersed, or thrown away; named specialists in hearing,
    sight, and craft are to be disabled so that each person keeps personal hearing,
    sight, and natural skill.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:3
  text: Tseng, Shih, Yang, Mih, Shih K'uang, Kung Ch'ui, and Li Chu are said to set
    up their virtue outside themselves and to involve the world in angry discussions
    without definite result.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Golden Age is described as the days of named ancient rulers, when people
    used knotted cords, were content with available food and clothing, lived simple
    peaceful lives, and did not exchange visits even with nearby districts.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the present condition described by the passage, a report that a Sage exists
    in some place makes people gather provisions, hurry away, neglect parents and
    masters' business, and form long lines of carts and carriages.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says rulers' exaggerated desire for knowledge and neglect of Tao
    overwhelm the empire in confusion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bows, cross-bows, nets, hooks, bait, traps, fences, and snares are said to
    require knowledge and to bring confusion among birds, fishes, and beasts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Schoolmen's arguments about hard and white, like and unlike, are said to require
    knowledge of argument and to overwhelm the world in doubt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Love of knowledge is identified as the source of great confusion, dimming
    heavenly bodies, disturbing land and water, destroying the influence of the four
    seasons, and making creatures other than they should be by nature.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says the simple and guileless have been set aside, the specious
    and false exalted, and tranquil inaction replaced by disputation.
  category: sequence
  evidence_refs:
  - ev:7
