canonical_text:
  quote: The virtue of the wise ruler makes him the peer of heaven and earth.
  summary: 'The passage presents a Daoist account of rulership and order: the wise
    ruler is guided by Tao and governs through inaction; rulers and ruled have distinct
    functions; heaven, earth, seasons, social ranks, forms, names, and rewards are
    arranged in an order that the Sage follows; ancient exemplars did not give precedence
    to accidentals over essentials.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The wise ruler's virtue is described as modeled on the universe, guided by
    Tao, and occupied in inaction; through inaction he administers the empire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage contrasts rulers and ruled: if both practice inaction or both
    practice action, their proper relation is lost; rulers must practice inaction,
    while the ruled must practice action for the empire.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men of old are described as having broad knowledge, powers, and abilities,
    yet they were not troubled, did not rejoice, and did not act.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Heaven is said to have no parturitions while all things are evolved, and Earth
    no increment while all things are nourished.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wise ruler is described as the peer of heaven and earth and as charioted
    upon the universe with all creation as his team on the highway of mortality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the essential is in the ruler and the accidental in
    the ruled, glossed as the root and the tip of a branch.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Appeal to arms, rewards and punishments, ceremonies and laws, music and fine
    clothes, and weeping and mourning are each called the lowest form of a corresponding
    domain and are said to follow movements of the mind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ancients studied accidentals but did not allow them to precede essentials.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage lists precedence pairs: prince before minister, father before
    son, elder brother before younger, seniors before juniors, men before women, and
    husbands before wives.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rank and precedence are said to be part of the scheme of the universe, and
    the Sage adopts them accordingly.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Heaven is called honourable and earth lowly; spring and summer precede autumn
    and winter; existence includes maturity, decay, and a perpetual tide of change.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the ancestral temple, court, village, and practical affairs, different
    persons are said to rank first according to context; this order is said to appertain
    to Tao.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Those of old who apprehended Tao are said first to have apprehended God, then
    Tao, then charity and duty, public functions, forms and names, capacity-based
    employment, good and bad, right and wrong, and rewards and punishments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Perfect peace and good government are associated with falling back upon the
    natural where knowledge and plans are of no avail.
  category: attribute
  evidence_refs:
  - ev:8
