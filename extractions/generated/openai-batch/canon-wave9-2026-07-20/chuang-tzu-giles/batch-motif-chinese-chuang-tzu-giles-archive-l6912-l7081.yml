  summary: The passage moves from a rebuke of rewards and punishments, to a cosmogonic
    account of Nothing, the Nameless, One, virtue, destiny, life, form, nature, and
    return to unconditioned unity. It then presents dialogues in which Lao Tzu criticizes
    rule-bound cultivation of Tao, Chi Che criticizes conventional princely advice
    and describes unconscious sage-government, and Tzu Kung observes an old man laboriously
    drawing water for a garden.
