canonical_text:
  quote: "“Then man goes back into the great Scheme, from which all things come and
    to which all things return.”"
  summary: A parable tells how a sea-bird is harmed by being treated according to
    human courtly preferences rather than its own nature. The passage then states
    that beings differ in what sustains or harms them. A second scene has Lieh Tzu
    address an old skull and question the distinction between life and death, followed
    by a catalogue of transformations among life forms ending with man returning to
    the great Scheme.
