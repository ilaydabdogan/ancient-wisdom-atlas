canonical_text:
  quote: ''
  summary: A sequence of anecdotes describes Duke Huan seeing a bogy and recovering
    after Huang explains the illness as internally caused; Chi Hsing Tzu training
    fighting cocks until their composure is complete; Confucius questioning an old
    man who survives a dangerous cataract by accommodating himself to water; and Ch'ing
    the carpenter producing a wooden instrument stand that appears supernatural.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duke Huan sees a bogy while hunting with Kuan Chung, but Kuan Chung says he
    sees nothing; after returning home, the Duke becomes delirious and cannot go out
    for many days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huang Tzu Kao Ngao tells Duke Huan that he is self-injured and explains disease
    as arising from conditions of vital strength rather than from the bogy itself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Huang affirms the existence of bogies and lists named spirits associated with
    mud, fire, dust-bin, directions, water, hills, mountain, moor, and marsh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Huang describes the Wei I as broad as a cart-wheel, long as a shaft, dressed
    in purple clothes and a red cap, sentient, and respectful when hearing thunder.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Duke Huan identifies the being he saw as the Wei I; after laughing, dressing,
    and sitting up, his sickness leaves him by the end of the day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chi Hsing Tzu trains fighting cocks through stages in which they first seek
    enemies fiercely, then remain excited by sounds and shadows, and then are still
    enraged by the sight of an enemy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After further training, the cocks ignore the crowing of other cocks, appear
    as if made of wood, and cause strange cocks to run away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Confucius observes a high and violent cataract at Lü-liang where no scaly
    or finny creature can enter, yet an old man goes into the water.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The old man emerges downstream with flowing hair and singing, and Confucius
    says he had thought the old man was a spirit before recognizing him as human.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The old man explains his survival by saying he has no special way: he follows
    original condition, habit becoming nature, acquiescence in destiny, and accommodates
    himself to the water.'
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Ch'ing the chief carpenter carves a wooden stand for musical instruments that
    appears to observers as though made by supernatural execution; the prince of Lu
    asks about the mystery of his art.
  category: action
  evidence_refs:
  - ev:12
