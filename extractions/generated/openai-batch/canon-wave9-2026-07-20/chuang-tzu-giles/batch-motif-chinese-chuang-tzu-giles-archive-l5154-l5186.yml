  quote: ''
  summary: The passage opens Chapter VIII, “Joined Toes,” with the stated argument
    that virtues should be natural rather than artificial. It compares joined toes,
    extra fingers, wens, and tumours to artificial additions to human moral life,
    saying such additions are not true Tao and are harmful to real charity, duty,
    and the right use of intelligence. It also notes that people with excessive keenness
    of vision become confused over colours and shades.
