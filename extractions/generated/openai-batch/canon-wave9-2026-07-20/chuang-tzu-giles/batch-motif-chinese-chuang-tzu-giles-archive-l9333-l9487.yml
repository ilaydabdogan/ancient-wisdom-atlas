canonical_text:
  quote: Life and death are but links in an endless chain.
  summary: A dialogue between the Spirit of the River and the Spirit of the Ocean
    treats limits of knowledge, relative scale, and the instability of judgments about
    value, existence, direction, and good and evil. It also describes the self-effacing
    man of Tao and gives paired examples of abdication that succeed or fail according
    to circumstances.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Life and death are described as links in an endless chain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human knowledge and the span of existence are contrasted with what is unknown
    and with non-existence; trying to use the small to exhaust the great is said to
    produce confusion.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Spirit of the River asks whether dialecticians are correct that the infinitesimally
    small has no form and the infinitesimally great is beyond measurement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Spirit of the Ocean answers that relative greatness has no limit, relative
    smallness eludes sight, and both small and great things must possess form.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The truly great man is described as not injuring others, not seeking gain,
    not taking credit for self-reliance or exceptionality, and not despising those
    who act differently.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man of Tao is said to have no reputation, perfect virtue to acquire nothing,
    and the truly great man to ignore self.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: From the point of view of Tao, there are said to be no extremes of value or
    worthlessness; relative scale makes everything both great and small.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that if existence is judged by function, nothing both exists
    and does not exist; east and west are described as convertible yet necessary terms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Good and evil are presented as dependent on point of view; Yao and Chieh are
    said to be both good and evil from opposite points of view.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yao abdicates in favor of Shun and Shun rules, while Kuei abdicates in favor
