  quote: ''
  summary: The passage opens Chapter V, describing virtue as an inward completeness
    that produces outward influence. It presents Wang T'ai, a man with cut-off toes
    whose silent teaching attracts disciples, and Confucius explains his influence
    through the endurance of mind or soul, the unity of things, and the image of still
    water. The excerpt then begins a second episode in which Shen T'u Chia, another
    man with cut-off toes, studies with Tzu Ch'an under Poh Hun Wu Jen, and Tzu Ch'an
    insists on social separation and ministerial respect.
  language: English
