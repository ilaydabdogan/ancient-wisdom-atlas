canonical_text:
  quote: ''
  summary: The passage describes a Tao-oriented person of perfect virtue, Confucius's
    reply about internal cultivation and ante-mundane knowledge, Chun Mang's eastward
    trip to the ocean and dialogue with Yüan Feng about sage government, perfect virtue,
    and the divine man, and a later dialogue comparing Wu Wang and Great Yü as rulers
    responding to disorder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A described person aims at Tao, perfects virtue, body, and spiritual part,
    is pure, gives no place to success, profit, or skill, and is unaffected by public
    praise or blame.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says the person discussed knows something but not much of the science
    of the ante-mundane, has government that is internal rather than external, reverts
    to original integrity through inaction, and passes through the common world with
    nature and spiritual part wrapped in a body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chun Mang starts eastward toward the ocean and meets Yüan Feng on the shore
    of the eastern sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chun Mang says the ocean cannot be filled by pouring in or emptied by taking
    out, and says he is simply on a trip.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yüan Feng asks Chun Mang about the straight-browed people and how the Sage
    governs.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Chun Mang describes sage government as officials keeping to their functions,
    ability being employed, the people's voice being heard, action being taken accordingly,
    and the empire being at peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chun Mang describes the man of perfect virtue as having no thoughts in repose,
    no anxiety in action, and recognizing no right, wrong, good, or bad.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men cling to the man of perfect virtue like children who have lost their mothers
    and rally around him like wayfarers who have missed their road.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man of virtue is said to have wealth, food, and drink more than sufficient,
    while not knowing their source or provider.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The divine man rides upon the glory of the sky, where his form can no longer
    be discerned; this is called absorption into light.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The divine man fulfills his destiny, acts according to his nature, is at one
    with God and man, and is associated with affairs ceasing and things reverting
    to their original state; this is called envelopment in darkness.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Men Wu Kuei and Ch'ih Chang Man Chi look at Wu Wang's troops, and Ch'ih Chang
    Man Chi says Wu Wang is not equal to the Great Yü, resulting in troubles.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Great Yü is discussed as a ruler who had to deal with disorder; he is compared
    to ointment for a sore, while wigs, doctors, and medicine are used as analogies
    for remedial action.
  category: speech
  evidence_refs:
  - ev:9
