canonical_text:
  quote: ''
  summary: Chapter XIX, “The Secret of Life,” presents teachings on life, destiny,
    bodily nourishment, vitality, renunciation, rebirth, and nearness to Tao or God.
    It includes Kuan Yin’s answer to Lieh Tzu about the perfect man’s ability to pass
    through solid bodies, fire, and heights through absolute purity rather than cunning.
    The passage also uses analogies of a drunken man falling from a cart, an avenger
    not blaming a weapon or tile, and closes with Confucius seeing a hunchback catching
    cicadas.
  language: English
  quote_policy: summarized
