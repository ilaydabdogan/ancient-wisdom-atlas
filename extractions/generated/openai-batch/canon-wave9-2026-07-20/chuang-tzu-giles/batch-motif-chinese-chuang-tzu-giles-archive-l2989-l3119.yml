canonical_text:
  quote: ''
  summary: An anxious speaker tells Confucius that he has received orders and fears
    punishment both within himself and from outside. Confucius replies with counsel
    about Destiny, Duty, filial and political obligation, self-forgetful service,
    careful transmission of messages, avoiding excess, and leaving the outcome to
    Destiny. Editorial commentary identifies the counsel as Taoist laissez-aller or
    inaction doctrine placed in Confucius' mouth. The passage then begins a new anecdote
    in which Yen Ho, about to tutor Prince Ling's eldest son, asks Chü Poh Yu how
    to handle a dangerous pupil whose conduct threatens the state and whose restraint
    threatens the tutor.
  language: English
  quote_policy: summarized
