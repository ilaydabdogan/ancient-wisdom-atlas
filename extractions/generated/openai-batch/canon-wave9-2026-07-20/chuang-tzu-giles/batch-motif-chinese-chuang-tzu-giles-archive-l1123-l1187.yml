canonical_text:
  quote: ''
  summary: A scholarly note describes a growing opposition between practical/established
    and mystical/heterodox tendencies in Chinese thought, relates Taoism and Confucianism
    to a Western analogy involving Platonism and Aristotelianism, states an intended
    parallel between Chuang Tzu and Heracleitus, and warns against overreading cross-cultural
    parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes an increasing divergence between ideal/mystical and
    actual/practical views, with the practical view gaining security while the mystical
    view becomes suspected, heterodox, or persecuted.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Mencius regards Lao Tzu as a heresiarch and that Chuang Tzu
    often treats Confucius with contempt and ridicule.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Confucianism is established while Taoists become dissenters,
    grow more mystical, and adopt a policy of protest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage presents a Western parallel in which Plato and Aristotle were
    represented as typical opposites, despite Aristotle being Plato's pupil and both
    following Socrates.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Aristotelianism became established as Christian philosophy,
    while Platonism survived among more mystical schoolmen, fell under suspicion,
    and sometimes developed toward Pantheism.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says a later appeal from Platonists and Aristotelians to Plato
    and Aristotle discovered that divergent streams flowed from neighbouring springs;
    it adds that a similar appeal is difficult for Lao Tzu and Confucius because of
    controversy over the Tao-Te-Ching's authenticity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the note's object is to point out a remarkable parallel
    between the teaching of Chuang Tzu and Heracleitus.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage warns that Western preconceptions may bias judgment and that comparisons
    such as those between Gautama and Christ can find parallelisms where they do not
    exist.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
