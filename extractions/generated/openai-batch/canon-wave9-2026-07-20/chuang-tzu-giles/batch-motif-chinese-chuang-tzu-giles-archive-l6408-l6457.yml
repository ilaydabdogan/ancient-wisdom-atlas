canonical_text:
  quote: Rest in inaction, and the world will be good of itself.
  summary: The Vital Principle warns that poison lurks and directs a return to the
    root or natural state. The Spirit of the Clouds asks for advice. The Vital Principle
    counsels feeding the people with the heart, resting in inaction, casting off slough
    and intelligence, ignoring differences, becoming one with the infinite, and letting
    all things return to their original constitution without knowledge. The Spirit
    of the Clouds prostrates, takes leave, and says he has found what he long sought.
    The passage then turns to a reflection on worldly preference for likeness and
    disapproval of unlikeness, with cited remarks from Emerson and Mill.
  language: English
  quote_policy: quoted
