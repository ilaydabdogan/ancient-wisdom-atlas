canonical_text:
  quote: ''
  summary: The passage criticizes Mih Tzu's funerary and ascetic rules, presents Great
    Yu's draining of the flood as the model used by Mihists for self-mortifying labor,
    notes later Mihist disputes, summarizes the ancient Tao as tranquility and sufficiency,
    and describes Sung Hsing and Yin Wen as peace-oriented teachers who endured insult,
    opposed aggression, and practiced severe self-denial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts ranked multi-layer coffins for rulers and officials
    with Mih Tzu's rule of no singing in life, no mourning after death, and a single
    coffin three inches thick for all alike.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says that prohibiting singing, weeping, and rejoicing in due
    season is unreasonable and opposed to human passions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mih Tzu is described as teaching people to toil through life and hold death
    in contempt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Great Yu is said to have drained the floodwaters, set rivers and streams flowing
    through the nine divisions of the empire, and used a bucket and dredger with his
    own hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Great Yu's labor is described with images of hairless calves and shins, wind
    bathing him, and rain combing him; the passage says he marked out the nations
    and was a Sage.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Later Mihists are said to wear short serge jackets and straw sandals, toil
    day and night, and make self-mortification their aim in order to follow the Tao
    of Yu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Groups of Mihists studied Mih Tzu's canon, disagreed with one another, called
    one another schismatics, and argued over paired categories such as hard and white,
    like and unlike, and odd and even.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mih Tzu and Ch'in Hua Li are judged right in theory but wrong in practice;
    Mih Tzu is also called well-meaning and a man of genius, but not a true Sage.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Tao of the ancients is described as avoiding the mundane and the specious,
    seeking world tranquility and longer life, taking only what is sufficient, and
    purifying the heart.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sung Hsing and Yin Wen are described as followers of Tao who wore a cap shaped
    like Hua Mountain as a badge and valued joy among people and peace within the
    girdle of ocean.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sung Hsing and Yin Wen are said to endure insult, preserve people from strife,
