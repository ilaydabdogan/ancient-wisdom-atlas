canonical_text:
  quote: ''
  summary: Composite passage containing episodes in which Confucius withdraws to the
    wilds, asks Tzu Sang Hu about social failure, hears the Lin Hui child-and-regalia
    parable and maxims on friendship, abandons formal studies, receives a reported
    command of Shun to Yu, and later appears fasting and singing while speaking to
    Yen Hui. It also includes Chuang Tzu’s visit to the prince of Wei, his distinction
    between poverty and misery, and his climbing-ape analogy for disadvantage under
    corrupt rule.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius takes leave of friends, dismisses disciples, retires to the wilds,
    wears skins and serge, and eats acorns and chestnuts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beasts and birds take no heed of Confucius as he passes among them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius tells Tzu Sang Hu that he has been expelled, tabooed, surrounded,
    separated from friends, and abandoned by disciples.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sang Hu recounts that Lin Hui, while fleeing with the men of Kuo, left valuable
    regalia behind and carried his child on his back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lin Hui explains that the regalia involved money, while the child was from
    God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sang Hu says that in calamity people neglect money questions and cling to
    what is from God; he contrasts superior friendship like water with mean friendship
    like wine.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius goes home, ends his studies, casts aside his books, and his disciples
    no longer salute him as teacher while his love for them deepens.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sang Hu reports that dying Shun instructed Great Yu to act according to the
    physical body and speak according to feelings, thereby needing no outward embellishment.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Chuang Tzu wears patched cotton clothes, adjusts his girdle, ties on his shoes,
    and visits the prince of Wei.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The prince calls Chuang Tzu miserable, and Chuang Tzu replies that he is poor,
    not miserable, because a man with Tao cannot be miserable.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Chuang Tzu describes a climbing ape moving freely in a large tree but trembling
    cautiously in a bramble bush because of disadvantageous position.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chuang Tzu links misery under foolish sovereigns and wicked ministers with
    the example of Pi Kan being disembowelled.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Confucius, hemmed in between Chen and Ts'ai and without food for seven days,
    holds dry wood and a dry stick and sings a ballad of Piao Shih.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage describes the wood-and-voice sound as harsh and untuned but suited
