candidate_motifs:
- id: motif:1
  label: Withdrawal from society into the wilds
  taxonomy_refs:
  - departure
  basis: Confucius leaves friends and disciples and retires to the wilds with rough
    clothing and wild food.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage itself includes an editorial note calling this episode spurious.
- id: motif:2
  label: Choosing divinely valued kin over wealth during flight
  taxonomy_refs:
  - wisdom
  basis: Lin Hui abandons valuable regalia and carries his child, explaining that
    the regalia concern money while the child is from God.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The episode functions as a parable within philosophical instruction rather
    than as an independent mythic narrative.
- id: motif:3
  label: Plain friendship over rich but unstable attachment
  taxonomy_refs:
  - wisdom
  basis: Sang Hu contrasts superior friendship, likened to water, with mean friendship,
    likened to wine.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an explicit aphoristic comparison, not a developed narrative motif.
- id: motif:4
  label: Wisdom through unlearning and relinquishing books
  taxonomy_refs:
  - wisdom
  basis: Confucius hears and obeys, returns home, ends his studies, and casts aside
    his books while love for disciples deepens.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not state a full doctrinal interpretation; the motif
    is inferred from the sequence of action.
- id: motif:5
  label: Embodied sincerity rather than outward embellishment
  taxonomy_refs:
  - wisdom
  basis: Shun’s reported command tells Yu to act according to the body and speak according
    to feelings, so that outward embellishment is unnecessary.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage includes an editorial note calling the episode doubtful in
    authorship.
- id: motif:6
  label: Sage in poverty distinguished from misery
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzu says ragged clothes and old boots make poverty, not misery, and
    that a person with Tao cannot be miserable.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage later includes an editorial note condemning the episode; this
    affects textual status, not the literal motif.
- id: motif:7
  label: Skill depends on fitting environment
  taxonomy_refs:
  - wisdom
  basis: The climbing ape is secure and uncatchable in a large tree but fearful in
    a bramble bush because it is at a positional disadvantage.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a parabolic animal analogy rather than an animal myth episode.
- id: motif:8
  label: Teacher in extremity uses rough song as expression
  taxonomy_refs:
  - wisdom
  basis: Confucius, fasting for seven days while hemmed in, sings a ballad with dry
    wood and a stick; the harsh sound matches the audience’s feelings.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents a brief episode and does not elaborate a ritual or
    mythic song pattern.
- id: motif:9
  label: Human and divine unity
  taxonomy_refs:
  - annihilation_union
  basis: Confucius says there is no beginning and no end, and that man and God are
    one.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage supports union language but does not describe annihilation,
    transformation, or a full mystical journey.
