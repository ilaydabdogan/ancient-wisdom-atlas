canonical_text:
  quote: ''
  summary: Confucius rests with disciples in the Black Forest at Apricot Altar, playing
    the lute and singing. An old fisherman emerges from a boat, listens, questions
    the disciples about Confucius, criticizes Confucius for reforming society outside
    official position, and is recognized by Confucius as a sage. Confucius follows
    him, prostrates himself, asks for the true doctrine, and receives instruction
    on like responding to like, proper social functions, public disorder, and moral
    blemishes.
  language: English
  quote_policy: summarized
