canonical_text:
  quote: ''
  summary: 'The passage describes stages of perfect or divine music: it harmonizes
    human and divine patterns, Yin and Yang, the seasons, and cosmic order; it overwhelms
    the listener with fear, amazement, confusion, and finally absorption in Tao. A
    second section reports Yen Yuan asking Shih Chin about Confucius; Shih Chin criticizes
    Confucius by comparing his treatment of the ancients to re-enshrining a straw
    dog after sacrifice, then adds an analogy about using boats for water and carts
    for land.'
  language: English
  quote_policy: summarized
