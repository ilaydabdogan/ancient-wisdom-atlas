canonical_text:
  quote: '"I should be ashamed to use them."'
  summary: Tzu Kung proposes a wooden well-sweep to help a gardener draw irrigation
    water more efficiently. The gardener refuses, saying his teacher taught that cunning
    implements lead to cunning hearts, restlessness of spirit, and unfitness for Tao.
    After learning that Tzu Kung is a disciple of Confucius, the gardener rebukes
    him for ambition and reputation-seeking, urges self-forgetting and self-governance,
    and sends him away. Tzu Kung is shaken and later says he had not known there was
    another such man besides Confucius.
  language: English
  quote_policy: quoted
