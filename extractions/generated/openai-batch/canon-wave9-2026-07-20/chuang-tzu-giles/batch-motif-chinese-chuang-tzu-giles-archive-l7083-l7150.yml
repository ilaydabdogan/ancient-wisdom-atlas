- id: obs:3
  text: The gardener says he has heard from his teacher that cunning implements lead
    to cunning dealings, cunning hearts, impurity, restlessness of spirit, and unfitness
    as vehicles for Tao.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gardener says he knows of such things but would be ashamed to use them.
  category: speech
  evidence_refs:
