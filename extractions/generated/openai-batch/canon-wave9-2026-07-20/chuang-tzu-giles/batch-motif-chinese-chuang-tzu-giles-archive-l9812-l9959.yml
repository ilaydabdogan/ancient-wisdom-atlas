canonical_text:
  quote: ''
  summary: 'A disputant, identified later as Kung Sun Lung, tells Mou of Wei that
    he once mastered many doctrines and arguments but is astonished by Chuang Tzu
    and asks for the secret. Kung Tzu Mou answers with parables: a frog in an old
    well boasts to a turtle of the eastern sea, but the turtle describes the sea''s
    immeasurable breadth and depth; limited understanding is compared to small creatures
    attempting impossible tasks and to viewing the sky through a tube. Mou says Chuang
    Tzu transcends directions and has gone back through chaos to Tao, then warns with
    the example of youths who failed at Han-tan and forgot what they already knew.
    Kung Sun Lung is silenced. In another episode, Chuang Tzu refuses an administrative
    appointment from Ch''u by comparing himself to a living tortoise wagging its tail
    in mud rather than a dead sacred tortoise venerated in a temple. A final episode
    begins with Hui Tzu, prime minister of Liang, fearing Chuang Tzu as a rival and
    searching for him; Chuang Tzu begins a parable about a phoenix-like bird flying
    from the south sea to the north sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A philosopher of the Chao State, later named Kung Sun Lung, says he studied
    ancient Tao, moral duties, dialectical distinctions, and arguments, and then became
    astonished by Chuang Tzu.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kung Tzu Mou leans over a table, sighs, looks up to heaven, smiles, and replies
    with the story of the frog in the old well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The frog in the old well describes its pleasures in the well and says that
    cockles, crabs, and tadpoles around it are not its match.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The turtle of the eastern sea cannot fit into the old well and withdraws before
    describing the breadth and depth of the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The turtle says the eastern sea is not enlarged by years of flood or narrowed
    by years of drought.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The well-frog is astonished and unable to continue speaking after hearing
    the turtle's description.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kung Tzu Mou compares limited attempts to understand Chuang Tzu to a mosquito
    carrying a mountain, an ant swimming a river, looking at the sky through a tube,
    and pointing at the earth with an awl.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kung Tzu Mou says Chuang Tzu moves in lower realms while soaring to heaven,
    lacks north, south, east, and west as boundaries, and has gone back from chaos
    to Tao.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kung Tzu Mou recounts that youths of Shou-ling went to Han-tan, failed to
    learn what they wanted, forgot what they knew before, and returned home in disgrace.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kung Sun Lung's jaw drops, his tongue cleaves to his palate, and he goes away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An editorial note in the passage calls the preceding episode spurious and
    mentions weakness, repetitions, and allusions from other chapters.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Chuang Tzu is fishing in the P'u when the prince of Ch'u sends two high officials
    asking him to administer the Ch'u State.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Chuang Tzu continues fishing without turning his head and asks about a sacred
    tortoise in Ch'u that has been dead for about three thousand years and is kept
    in a chest on an ancestral temple altar.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Chuang Tzu asks whether the tortoise would rather be dead and venerated or
    alive and wagging its tail in the mud.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The two officials answer that the tortoise would rather be alive and wagging
    its tail in the mud; Chuang Tzu says that he too will wag his tail in the mud.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Hui Tzu is prime minister in Liang, and Chuang Tzu goes there to visit him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: An unnamed person tells Hui Tzu that Chuang Tzu has come because he wants
    to replace him as minister.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: Hui Tzu becomes afraid and searches all over the state for three days and
