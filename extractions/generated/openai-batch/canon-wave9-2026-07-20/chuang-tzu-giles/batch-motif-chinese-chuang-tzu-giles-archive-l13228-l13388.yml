canonical_text:
  quote: ''
  summary: Nan Yung travels to Lao Tzu for advice about dilemmas involving knowledge,
    charity, and duty. Lao Tzu diagnoses him as confused and astray, instructs him
    about cleansing, internal and external disturbances, and the art of preserving
    life. This art is described as keeping all in One, knowing when to stop, attending
    to oneself, becoming like a child, and cultivating repose that gives divine radiance
    and constancy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nan Yung takes provisions and reaches Lao Tzu's abode after a seven days'
    journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lao Tzu asks whether Nan Yung has come from Keng Sang Ch'u and why he has
    brought “all these people”; the passage glosses the people as the questions Nan
    Yung intended to ask.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nan Yung is alarmed and abashed, then says he has forgotten how to answer
    because he missed what he came to ask.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nan Yung describes three dilemmas involving knowing, charity, and duty to
    one's neighbour, each framed as injuring either himself or others, and asks Lao
    Tzu for advice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lao Tzu says he already recognized Nan Yung's condition and describes him
    as confused, like a child who has lost its parents, trying to fathom the sea with
    a pole, astray, and unable to return to his natural self.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nan Yung asks to remain, works to cultivate the good and eliminate the evil
    within him, and returns to Lao Tzu after ten days with sorrow in his heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lao Tzu says Nan Yung has not fully cleansed himself and still has an evil
    obstruction.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lao Tzu advises that external disturbances should be met by closing the channels
    to the mind, internal disturbances by closing entrance from without, and combined
    disturbances prevent holding fast to Tao.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nan Yung compares his search after Tao to swallowing drugs that increase the
    malady and asks only for the art of preserving life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lao Tzu defines the art of preserving life as keeping all in One, losing nothing,
    knowing limits and sufficiency, leaving others alone, attending to oneself, being
    without cares and knowledge, and being as a child.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The child is described as crying without becoming hoarse, keeping its fist
    closed, gazing without distraction, moving and resting without self-consciousness,
    and adapting to the environment.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The perfect man is described as sharing the food of earth and the happiness
    of God, avoiding trouble from men or things, not joining in censuring, plotting,
    or toadying, and coming and going free from care and unconscious.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lao Tzu says a child acts and moves without knowing, with body like a dry
    branch and heart like dead ashes, so that good and evil fortune find no lodgment
    there.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Lao Tzu says hearts in repose give forth divine radiance, allowing people
    to see themselves as they are, and that constant people are sought by men and
    assisted by God.
  category: speech
  evidence_refs:
  - ev:10
