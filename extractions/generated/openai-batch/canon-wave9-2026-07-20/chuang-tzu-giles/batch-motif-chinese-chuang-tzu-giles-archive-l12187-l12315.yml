canonical_text:
  quote: ''
  summary: A sequence of anecdotes contrasts ordinary skill with composure under danger,
    describes Sun Shu Ao's indifference to office and dismissal, praises perfect sages
    as unmoved by seduction, danger, death, rank, and power, and ends with a political
    dialogue in which the destruction or preservation of a state is said not to determine
    true existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An archer balances a cup of water on his elbow while shooting arrows continuously
    and standing statue-like.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Po Hun Wu Jen distinguishes ordinary shooting from shooting under extraordinary
    conditions and proposes ascending a high mountain to stand on the edge of a thousand-foot
    precipice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wu Jen stands at the precipice with part of his feet over the chasm and beckons
    Lieh Tzu, while Lieh Tzu lies prostrate with sweat pouring down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wu Jen says the perfect man can soar to the blue sky, dive to the yellow springs,
    or fly to an extreme point of the compass without change of countenance, and he
    says Lieh Tzu is terrified and dazed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chien Wu says Sun Shu Ao has been three times called to office and three times
    dismissed without elation or chagrin, and that his breathing is regular.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sun Shu Ao says office, when it comes, may not be declined, and when it goes,
    cannot be kept; he treats getting and losing as outside his own self.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sun Shu Ao says he is not conscious of office as being either in others' hands
    or his own, and asks what leisure there is to trouble about rank amid deliberation
    and investigation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Confucius says the perfect sages of old could not be defeated by cunning men,
    seduced by beautiful women, or stolen from by robbers; life and death gave them
    no pang, and rank and power mattered still less.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius says the souls of such men pierced huge mountains, descended into
    the abyss without getting wet, occupied low stations without chagrin, filled the
    universe, and gained more by giving more to others.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note says the final words of Confucius's speech occur in chapter 81 of the
    Tao-Te-Ching and comments on their placement in Confucius's mouth.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Prince of Fan says the destruction of Fan did not injure his existence,
    and that preservation of Ch'u will not be enough to preserve the Prince of Ch'u.
  category: speech
  evidence_refs:
  - ev:10
