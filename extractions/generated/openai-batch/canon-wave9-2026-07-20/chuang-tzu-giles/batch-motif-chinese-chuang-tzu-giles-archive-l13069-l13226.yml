canonical_text:
  quote: ''
  summary: Keng Sang Ch'u, a disciple of Lao Tzu who has attained his master's Tao,
    lives on the Wei-lei Mountains and dismisses clever or conventionally charitable
    attendants. The district benefits from his presence, and the inhabitants propose
    honoring him as a sage or tutelary god. Keng Sang Ch'u is ashamed, explains that
    Tao operates without visible agency, and teaches that those who care for themselves
    hide and love the occult. He criticizes the honoring of virtue and knowledge as
    roots of competition, theft, and social disorder. Nan Yung Ch'u asks how to attain
    Tao; Keng Sang Ch'u instructs him to preserve form, vitality, and freedom from
    anxious thoughts, but finally says his own talents are limited and sends Nan Yung
    Ch'u south to Lao Tzu.
  language: English
  quote_policy: summarized
