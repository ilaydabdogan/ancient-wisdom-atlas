  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chii Ch'iao reports a saying attributed to Confucius about the true sage,
    says Confucius called the words wild, and asks Chang Wu Tzu for his opinion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chang Wu Tzu says the Sage blends everything into one harmonious whole, rejects
