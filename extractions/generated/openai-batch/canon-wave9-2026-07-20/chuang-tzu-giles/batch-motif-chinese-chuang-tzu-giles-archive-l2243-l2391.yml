- id: obs:3
  text: The passage contrasts animal mating patterns with human admiration for Mao
    Ch'iang and Li Chi, and says fish, birds, and deer react by fleeing from those
    human beauties.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A speaker concludes that standards of beauty, human virtue, and positive and
