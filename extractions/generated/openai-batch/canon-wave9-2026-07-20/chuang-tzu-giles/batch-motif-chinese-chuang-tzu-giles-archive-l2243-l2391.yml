canonical_text:
  quote: ''
  summary: The passage argues that standards of habitat, food, beauty, virtue, life,
    death, waking, and dreaming vary by standpoint and are not absolutely knowable.
    It describes the Perfect Man and the Sage as transcending ordinary harm, rank,
    distinction, and even life and death. It uses Li Chi’s changed feelings after
    entering the Duke of Chin’s residence and a series of dream examples to question
    attachment to life and ordinary claims of knowledge.
  language: English
  quote_policy: summarized
