canonical_text:
  quote: He who knows what God is, and who knows what Man is, has attained.
  summary: The passage defines attainment as knowing God and Man, describes God as
    a spontaneous self-existing principle expressed in humanity, defines the pure
    men of old through freedom from calculation and passion, acceptance of death,
    and harmony with creation, and uses images of heights, water, fire, breath, seasons,
    and a veil lifted by death.
