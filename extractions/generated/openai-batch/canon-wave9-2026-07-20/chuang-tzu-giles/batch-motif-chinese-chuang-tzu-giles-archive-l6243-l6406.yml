canonical_text:
  quote: ''
  summary: A seeker, identified in the passage as the Yellow Emperor, asks Kuang Ch'eng
    Tzu how the self may be preserved. Kuang Ch'eng Tzu teaches quiet, purity, withdrawal
    from sensory and external disturbance, preservation of the original One, and an
    eternal self associated with Tao, Great Light, Profound Mystery, Eternity, and
    Infinity. A second dialogue follows in which the Spirit of the Clouds asks the
    Vital Principle how to restore cosmic and seasonal harmony; the Vital Principle
    repeatedly claims not to know, wanders without aim, and later attributes disorders
    in the empire and nature to government.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A petitioner asks Kuang Ch'eng Tzu, who is said to possess perfect Tao, how
    the self may be preserved so as to last.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuang Ch'eng Tzu responds that the question is good and says he will speak
    of perfect Tao.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kuang Ch'eng Tzu instructs the petitioner to see nothing, hear nothing, let
    the soul be quiet, keep repose and purity, and avoid wearying the body or disturbing
    vitality.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kuang Ch'eng Tzu says that if eye, ear, and mind are quiet, the soul will
    preserve the body and the body will live forever.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kuang Ch'eng Tzu tells the petitioner to cherish what is within, shut off
