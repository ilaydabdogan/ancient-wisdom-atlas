canonical_text:
  quote: ''
  summary: Lieh Tzu turns back from a journey after restaurant keepers refuse his
    payment, fearing that visible inner brightness will attract rulers and responsibility.
    Poh Hun Wu Jen warns him that people will gather around him; later he finds Lieh
    Tzu's courtyard filled with visitors' boots and says undue influence over others
    disturbs natural constitution. A second anecdote tells of Huan of Cheng, who becomes
    a Confucianist, influences his families, causes his younger brother to become
    a Mihist, then commits suicide after their father sides with the Mihist. In a
    dream Huan claims credit for the brother's Mihism, and the passage concludes that
    reward concerns what a person is naturally, not what a person artificially does.
  language: English
  quote_policy: summarized
