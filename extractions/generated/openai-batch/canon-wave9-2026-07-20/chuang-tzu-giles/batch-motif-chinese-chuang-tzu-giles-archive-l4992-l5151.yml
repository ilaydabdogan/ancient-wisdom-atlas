- id: motif:2
  label: discipline after recognizing false knowledge
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Lieh Tzu recognizes he has no real knowledge and undertakes three years of
    domestic, humble practice, discarding artificiality and reverting to the natural.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: No formal rite of initiation is described; the motif is inferred from
    the sequence of recognition and disciplined transformation.
- id: motif:3
  label: passive sage as mirror
  taxonomy_refs:
  - wisdom
  basis: The perfect man is said to employ his mind as a mirror that receives without
    grasping, refusing, or keeping.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: This is stated as philosophical teaching rather than narrative action.
- id: motif:4
  label: primordial undifferentiation destroyed by imposed differentiation
  taxonomy_refs:
  - chaos
  basis: Hun Tun is glossed as pre-separation matter, has no seven holes, and dies
    when Shu and Hu bore openings into him.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The identification with the chaos motif relies partly on the passage's
    explanatory note for Hun Tun.
- id: motif:5
  label: perils of benevolent intervention
  taxonomy_refs: []
  basis: Shu and Hu act to repay Hun Tun's kindness by giving him human openings,
    but their intervention causes his death; the passage says this illustrates the
    perils of action.
  evidence_refs:
  - ev:14
