canonical_text:
  quote: ''
  summary: Hu Tzu stages repeated encounters with Chi Han to show different states
    beyond ordinary physiognomic judgment, leading Lieh Tzu to recognize his lack
    of real knowledge and undertake humble practice. The passage then states teachings
    on Inaction, passivity, and the perfect man's mind as a mirror. It ends with the
    story of Shu and Hu boring seven holes in Hun Tun, whose death illustrates the
    peril of action imposed on undifferentiated being.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hu Tzu tells Lieh Tzu that he has taught only the ornamentals, not the essentials,
    of Tao, and asks him to bring his friend.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first visit, Chi Han says Hu Tzu is doomed, cannot live, and is
    like wet ashes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hu Tzu explains that in the first visit he showed an outward, earth-like stillness
    while preventing Chi Han from seeing his inner pent-up energy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the second visit, Chi Han says Hu Tzu is better and will recover because
    he has recuperative power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hu Tzu explains that in the second visit he showed heaven-like grandeur and
    allowed a little energy to run out of his heels.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the third visit, Chi Han says Hu Tzu is not one day like another and
    that he can tell nothing from his physiognomy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hu Tzu explains that in the third visit he showed a state of harmonious equilibrium
    and then speaks of the abyss, the whale, and water at rest and in motion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the fourth visit, Chi Han becomes unable to stand still, turns in confusion,
    and flees.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hu Tzu says he showed himself as Tao appeared before time was, as a great
    blank existing of itself.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Lieh Tzu becomes convinced that he has not acquired real knowledge and spends
    three years without leaving the house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Lieh Tzu helps his wife cook, feeds pigs like human beings, discards the artificial,
    and reverts to the natural.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage states that by Inaction one can become a centre of thought, focus
    of responsibility, and arbiter of wisdom while remaining unmoved.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: 'The perfect man is described as using his mind as a mirror: it receives but
    does not keep, grasps nothing, and refuses nothing.'
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: Shu is named ruler of the southern sea, Hu ruler of the northern sea, and
    Hun Tun ruler of the central zone.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
