candidate_motifs:
- id: motif:1
  label: sage beyond external diagnosis
  taxonomy_refs:
  - wisdom
  basis: Hu Tzu deliberately presents multiple states to Chi Han, whose diagnoses
    shift from death to recovery to unreadability and flight.
  evidence_refs:
