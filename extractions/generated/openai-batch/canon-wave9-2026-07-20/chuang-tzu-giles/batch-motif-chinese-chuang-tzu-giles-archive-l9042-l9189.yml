canonical_text:
  quote: ''
  summary: The passage contrasts a primordial condition of tranquil unity with later
    decline under named ancient rulers, the rise of government, moral reform, intellect,
    art, and learning, and consequent confusion. It then describes sages and retired
    scholars preserving themselves through hidden virtue, self-effacement, waiting,
    self-reformation, and detachment from office and external conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that attempting to correct others while one's own virtue
    is clouded can harm the natural constitution of the object corrected.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Primeval man is described as living in perfect tranquillity, with Positive
    and Negative principles peacefully united, spiritual beings causing no trouble,
    seasons in order, no injury, no death, and knowledge unused.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage calls the primordial condition a perfection of unity and says
    all things and all conditions were One; nothing was made so, but everything was
    so.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Under Sui Jen and Fu Hsi, virtue declined; natural adaptation remained, but
    unity was gone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Under Shen Nung and Huang Ti, virtue declined further; peace remained, but
    natural adaptation was gone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Under Yao and Shun, systems of government and moral reform were introduced;
    man's original integrity was scattered, and goodness and action are said to imperil
    relation to Tao and virtue.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After natural instinct was discarded for intellect, art and learning were
    added; the passage says confusion set in and man could not revert to the condition
    in which he first existed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the world and Tao mutually destroy one another, and that
    the virtue of sages would remain hidden even if they did not dwell on mountain
    and in forest.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Retired scholars of old are described as not merely hiding bodies, words,
    or wisdom; when the age was suitable they effaced themselves in unity, and when
    unsuitable they relied on themselves and waited.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Those who preserved themselves did not ornament knowledge with rhetoric, did
    not exhaust the empire or virtue with knowledge, kept to their own spheres, and
    reverted to natural instincts.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says Tao does not deal with detail, virtue does not take cognizance
    of trifles, self-reformation is enough, and complete happiness means attainment
    of desire.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage rejects treating office as attainment of desire, describes office
    as external, and says equal happiness under all conditions is freedom from sorrow.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: People who over-estimate the external and lose natural instincts in worldliness
    are called people of topsy-turvydom.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: A final editorial note states that this and the preceding chapter have no
    claim to be regarded as genuine work of Chuang Tzŭ.
  category: other
  evidence_refs:
  - ev:14
