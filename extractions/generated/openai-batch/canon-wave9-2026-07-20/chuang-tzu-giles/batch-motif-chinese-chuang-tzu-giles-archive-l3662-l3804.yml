literal_observations:
- id: obs:1
  text: Confucius says that, while on a mission to the Ch'u State, he saw young pigs
    suckling their dead mother and then leaving the body after looking at her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius states that the young pigs loved their mother, not the body that
    contained her, but that which made the body what it was.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius gives examples of a man killed in battle whose arms are not buried
    with him and a man without toes who does not value boots, saying the function
    of such things is gone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Confucius says the Son of Heaven's concubines avoid cutting nails or piercing
    ears, and that a marriageable daughter is kept from menial work to preserve her
    beauty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ai T'ai To is described as saying nothing yet being trusted, doing nothing
