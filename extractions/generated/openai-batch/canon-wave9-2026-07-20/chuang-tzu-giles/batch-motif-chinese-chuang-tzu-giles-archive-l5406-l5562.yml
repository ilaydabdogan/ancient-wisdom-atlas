canonical_text:
  quote: ''
  summary: The passage contrasts the natural capacities of horses, materials, and
    people with artificial management, craft, ritual, moral doctrine, and government.
    It depicts horse training, artisan shaping, and sage-led ritualization as damaging
    innate integrity, while describing an earlier age of simple human-animal coexistence
    and self-provisioning life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Horses are described as naturally equipped with hoofs and hair, eating grass,
    drinking water, and moving freely outdoors; palatial dwellings are said to be
    useless to them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Poh Loh appears claiming to understand horse management and then brands, clips,
    pares, halters, shackles, stables, hungers, exercises, grooms, trims, bridles,
    and whips horses, with deaths reported among them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The potter and carpenter claim they can shape clay and wood according to will
    by using compasses, square, arc, and line.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator questions whether clay and wood desire such shaping and says
    governors of the empire make the same kind of mistake.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: People are described as having natural instincts to weave and clothe themselves
    and to till and feed themselves; these instincts are called Heaven-sent.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the age when natural instincts prevailed, the passage says there were no
    roads over mountains, no boats, and no bridges over water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: That same earlier age is described as one in which birds and beasts multiplied,
    trees and shrubs grew, people dwelt with birds and beasts, and all creation was
    one.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the earlier state, the passage says there were no distinctions of good
    and bad people, no knowledge, no evil desires, and a condition of natural integrity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Sages appear, the passage says they trip people with charity, fetter
    them with duty to a neighbour, gush over music, fuss over ceremony, and divide
    the empire against itself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage asks who could make sacrificial vessels if natural integrity were
    unharmed, who could make court regalia if white jade were unbroken, and what need
    there would be for music and ceremonies if natural instincts guided people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage attributes destruction of natural integrity to the artisan and
    the annihilation of the named principle rendered as 'Tag' in the OCR text to the
    Sage.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A second horse example says horses naturally rub necks when pleased and kick
    when angry, but after bridling, bitting, and metal headgear they learn biting,
    resistance, and other vicious behaviors; this is blamed on Poh Loh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the days of Ho Hsii, people are described as resting and moving without
    particular aims, rejoicing in food, and strolling after full bellies; later Sages
    introduce ceremonies, music, charity, and duty, after which people pursue knowledge
    and contend for gain.
  category: sequence
  evidence_refs:
  - ev:9
