canonical_text:
  quote: "“See that no harm comes to the horses, that is all!”"
  summary: 'The passage counsels an unnamed ruler against aggressive or artificial
    efforts to end war, then narrates the Yellow Emperor’s journey to seek Tao at
    Chu-tz''u Mountain. Lost in the wilds, the Emperor and his party meet a horse-grazing
    boy who knows both the mountain and where Tao abides. The boy explains government
    by analogy with caring for horses: prevent harm. The Emperor prostrates and addresses
    him as Divine Teacher. The passage then reflects on people driven by schemes,
    argument, reputation, labor, money, power, and action, and closes with Chuang
    Tzu’s archer analogy answered by Hui Tzu.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed speaker tells a ruler that cultivating duty toward one’s neighbor
    in order to end war is itself the origin of fighting, and warns that starting
    from that basis will be disastrous.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker urges abstention and non-aggression, saying that if the ruler
    cultivates inward sincerity and is responsive to circumstances, the people will
    escape death and there will be no need to end war.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Yellow Emperor goes to see Tao upon Chu-tz'u Mountain with a named party
    including a charioteer, a companion seated on his right, outriders, and rear attendants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emperor’s party reaches the wilds of Hsiang-cheng, loses the way, and
    has no one from whom to ask the road.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party meets a boy grazing horses and asks whether he knows Chu-tz'u Mountain
    and where Tao abides; the boy answers that he does.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Yellow Emperor calls the boy strange because he knows the mountain and
