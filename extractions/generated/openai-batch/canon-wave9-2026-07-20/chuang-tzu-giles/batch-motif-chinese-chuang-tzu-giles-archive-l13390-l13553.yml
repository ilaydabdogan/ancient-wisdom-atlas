canonical_text:
  quote: Birth is not a beginning; death is not an end.
  summary: The passage presents teachings on unknowable knowledge, will, sincerity,
    punishment by humans and God, internal cultivation, Tao as source, separation
    from Tao, death and annihilation, the Portal of God as Non-Existence, ancient
    knowledge before existence, and human life as a fragile image like soot on a kettle.
  language: English
  quote_policy: quoted
