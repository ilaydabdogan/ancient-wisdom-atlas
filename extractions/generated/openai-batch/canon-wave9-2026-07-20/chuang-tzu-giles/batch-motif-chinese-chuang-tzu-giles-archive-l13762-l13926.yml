canonical_text:
  quote: ''
  summary: Hsii Wu Kuei, introduced by Nu Shang, visits Wu Hou of Wei. He tells the
    Prince that the Prince is the one deserving sympathy because passions, loves,
    hates, and bodily-soul disorder harm him. Hsii uses examples of judging dogs and
    horses, which makes the Prince smile. He explains the smile through analogies
    of exile, wilderness, and longing for a familiar or pure voice. On a later visit
    he says he came to sympathize with the Prince's soul and body, criticizes oppression
    for sensuality, and rejects the Prince's proposal that love and duty can end war.
  language: English
  quote_policy: summarized
