canonical_text:
  quote: ''
  summary: The passage recounts an anecdote in which Diogenes, asked about being left
    unburied and torn by animals, answers that if he is unconscious it will not matter.
    It then states that relative standards cannot produce absolute results, contrasts
    sense reliance with intuition, and closes with editorial comments comparing the
    ending of the Spring and Autumn with the ending of the genuine Chuang Tzu at the
    master's death-bed, followed by a note that the final chapter is an editorial
    summary.
