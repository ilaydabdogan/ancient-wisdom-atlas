canonical_text:
  quote: ''
  summary: The passage argues that deaths judged noble or low may equally injure life
    and nature, questions the distinction between Robber Che and Poh I, rejects external
    standards of virtue and sensory expertise as perfection, defines perfection as
    cultivation of Tao and yielding to natural conditions, and presents true hearing
    and vision as inward self-knowledge. It ends with the speaker refusing both forced
    charity and the fatal error of losing oneself in others.
  language: English
  quote_policy: summarized
