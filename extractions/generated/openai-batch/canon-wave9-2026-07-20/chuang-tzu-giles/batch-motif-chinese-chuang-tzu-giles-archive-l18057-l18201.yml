canonical_text:
  quote: ''
  summary: A quoted teaching classifies moral blemishes and obstructions. Confucius
    responds with distress, prostrates himself, and lists persecutions he has suffered.
    An old man, later identified as a fisherman, rebukes him through a parable about
    a man who tries to flee his own shadow and footsteps, then teaches that Confucius
    should care for his own body, preserve original purity, and leave externals alone.
    The fisherman defines original purity as unalloyed truth, contrasts real emotion
    with feigned expression, distinguishes human ceremony from what is given by God,
    and says the true Sage models himself on God. Confucius prostrates again and asks
    to follow the fisherman as a servant in order to learn the great doctrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage classifies false praise intended to injure as malice, ready assent
    intended to discover others' wishes as hypocrisy, and names ambition, greed, obstinacy,
    and bigotry as four things that obstruct business.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius sighs in distress, prostrates himself twice, and says he was driven
    from Lu, tabooed in Wei, had his tree cut down in Sung, and was surrounded by
    the Ch'ens and the Ts'ais.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man tells Confucius that he is slow of perception.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man narrates a parable in which a man fears his shadow and dislikes
    his footsteps, runs away from them, makes more footsteps, cannot escape his shadow,
    exhausts himself, and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old man says the man in the parable could have got rid of his shadow by
    going into shade and ended his footsteps by keeping still.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man says Confucius occupies himself with charity, duty to neighbours,
    distinctions, motion and rest, giving and receiving, emotions, and restraint,
    yet has not avoided calamities.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man advises Confucius to care for his body, preserve natural purity,
    leave externals to others, and stop trying to improve other people instead of
    himself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Confucius asks what original purity is, and the fisherman replies that it
    is the perfection of truth unalloyed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fisherman contrasts ordered or affected mourning, anger, and friendship
    with real mourning, anger, and friendship.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The fisherman says ceremonial is invented by man, original purity is given
    from God, the true Sage models himself upon God, and fools reverse this pattern.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Confucius prostrates himself twice again, says the meeting is a godsend, and
    asks to follow the fisherman as a servant in order to benefit from his teaching
    and learn the great doctrine.
  category: action
  evidence_refs:
  - ev:7
