canonical_text:
  quote: ''
  summary: A sequence of didactic anecdotes contrasts bodily life and self-cultivation
    with rulers' power, wealth, gifts, food, reward, and rank. Tzu Hua Tzu distinguishes
    what is important from what is not. Yen Ho, reputed to have attained Tao, lives
    humbly and avoids gifts from the prince of Lu. A reflection states that governing
    is inferior to self-culture and illustrates misplaced value with the image of
    using a precious pearl to shoot a distant bird. Lieh Tzu refuses food sent by
    Tzu Yang because it is based on hearsay. Yueh the butcher, who followed Prince
    Chao into exile, refuses extra reward and an audience after the prince's restoration,
    arguing from law, custom, and lack of merit.
  language: English
  quote_policy: summarized
