- id: obs:2
  text: The Empyrean asks Inaction whether he knows Tao; Inaction says that he does
    and describes a method involving Tao's power to honour, dishonour, bind, and loose.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: No-beginning says that not knowing is profound and internal, while knowing
    is shallow and external.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
