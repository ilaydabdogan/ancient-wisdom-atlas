canonical_text:
  quote: ''
  summary: A sequence of dialogues and anecdotes discusses Tao as unknowable, formless,
    nameless, prior to the universe, and present in all things. Personified figures
    debate knowing and not knowing; Light questions Nothing; an aged swordsmith explains
    mastery through concentration; Confucius answers disciples about time, life and
    death, and adaptation.
  language: English
  quote_policy: summarized
