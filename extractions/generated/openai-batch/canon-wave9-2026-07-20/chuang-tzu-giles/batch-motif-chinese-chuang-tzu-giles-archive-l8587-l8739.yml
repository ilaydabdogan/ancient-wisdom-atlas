canonical_text:
  quote: ''
  summary: Lao Tzu rejects strenuous moralizing and praises original simplicity through
    natural images. After visiting him, Confucius remains silent and describes Lao
    Tzu as a Dragon-like being connected with clouds, creation principles, and cosmic
    movement. Tzu Kung then questions Lao Tzu about the reputed sage-rulers; Lao Tzu
    answers that their governments produced increasing social division, force, confusion,
    and harmful wisdom rather than true order. Editorial notes mark portions as repetitions
    from earlier chapters and call the episode a forgery.
  language: English
  quote_policy: summarized
