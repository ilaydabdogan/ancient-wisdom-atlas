canonical_text:
  quote: ''
  summary: 'The passage presents linked anecdotes of counsel and scale correction:
    advisers debate whether a prince should seek vengeance through war; Hua Tzu directs
    the prince to Tao; Tai Chin Jen teaches with a parable of warring kingdoms on
    a snail''s horns and a reflection on boundless space; Hui Tzu praises Tai by comparison
    with revered sages; Confucius recognizes a hidden sage in a menial on Mount I
    who then disappears; and a border-warden uses ploughing and weeding as an analogy
    for administrative thoroughness.'
  language: English
  quote_policy: summarized
