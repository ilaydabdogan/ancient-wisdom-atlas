canonical_text:
  quote: ''
  summary: The passage presents a teaching on Heaven and Earth accomplishing all through
    inaction, followed by anecdotes about Chuang Tzu’s response to his wife’s death,
    two impaired men contemplating mortality at K'un-lun, Chuang Tzu’s dream-dialogue
    with a skull about the happiness of death, and Confucius’ concern that Yen Yuan’s
    advice may lead a ruler to doubt and kill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heaven and Earth are described as doing nothing, yet from their inaction all
    modifications and varieties of things proceed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Chuang Tzu’s wife dies, Hui Tzu finds Chuang Tzu sitting on the ground,
    singing, spreading his legs, and beating time on a bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hui Tzu rebukes Chuang Tzu for not weeping and for drumming on a bowl and
    singing over his wife’s corpse.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chuang Tzu says he was initially affected by his wife’s death but then reflected
    on stages before birth, the addition of substance to spirit, form, birth, and
    death as another change.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chuang Tzu compares his wife’s death to the sequence of spring, summer, autumn,
    and winter, and says she lies asleep in Eternity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hunchback and a one-legged man look at the tombs of departed heroes on the
    K'un-lun Mountains, where the Yellow Emperor rests.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Loathsome ulcers suddenly break out on the left elbows of the hunchback and
    the one-legged man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The one-legged man says he does not loathe the condition, describing life
    as a loan and life and death as day and night.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Chuang Tzu sees a bleached empty skull, strikes it with his riding whip, and
    asks what former life or cause brought it to that state.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chuang Tzu uses the skull as a pillow and dreams that the skull appears and
    speaks to him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The skull says that in death there are no mortal troubles, no sovereign above
    or subject below, and existences are bounded only by eternity.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Chuang Tzu asks whether the skull would accept being born again with renewed
    bones and flesh and returning to parents, wife, and friends.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The skull rejects returning to mortality, saying it would not cast aside happiness
    greater than that of a king.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: An editorial note says the skull episode strangely reminds the editor or translator
    of Hamlet.
  category: other
  evidence_refs:
  - ev:13
- id: obs:15
  text: Confucius is sad when Yen Yuan goes east to the Ch'i State, and Tzu Kung asks
    whether this journey is the reason for his sadness.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: Confucius quotes Kuan Chung’s sayings about small bags, big things, short
    ropes, and deep wells to illustrate limits of destiny and form.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: Confucius fears that Yen Yuan will preach the Tao of ancient sages to the
    prince of Ch'i; if the prince searches within himself and does not find it, he
    will doubt and kill.
  category: speech
  evidence_refs:
  - ev:16
