candidate_motifs:
- id: motif:1
  label: cosmic efficacy through non-action
  taxonomy_refs:
  - wisdom
  basis: Heaven and Earth are said to do nothing, yet all things proceed from their
    inaction and nothing remains unaccomplished.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents a philosophical
    principle rather than a narrative mythic action.
- id: motif:2
  label: death as natural transformation in a seasonal cycle
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: Chuang Tzu treats death as one phase in a sequence of transformations and
    compares it to spring, summer, autumn, and winter.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage emphasizes transformation and acceptance, not a literal return
    from death in the same body.
- id: motif:3
  label: mourning inverted into song
  taxonomy_refs:
  - wisdom
  basis: Instead of weeping over his wife’s corpse, Chuang Tzu sings and beats a bowl,
    then explains that lamentation would show ignorance of natural laws.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The motif label interprets the scene’s contrast with expected mourning;
    the passage itself frames the act through philosophical explanation.
- id: motif:4
  label: acceptance of bodily decay and mortality
  taxonomy_refs:
  - wisdom
  basis: At tombs of the departed, the one-legged man does not loathe sudden ulcers
    and describes life and death as day and night.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is primarily a philosophical exemplum rather than an elaborate mythic
    episode.
- id: motif:5
  label: speaking skull reveals the state of death
  taxonomy_refs:
  - afterlife_journey_map
  - wisdom
  basis: A skull appears in a dream and describes death as free from mortal troubles,
    hierarchy, and seasonal workings, with existence bounded by eternity.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: There is no journey through an afterlife landscape; the taxonomy reference
    is limited to afterlife description.
- id: motif:6
  label: refusal of rebirth or return to mortal life
  taxonomy_refs:
  - resurrection
  - return
  basis: When Chuang Tzu proposes renewed body, bones, flesh, and return to family
    and friends, the skull refuses to exchange death’s happiness for mortal troubles.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The rebirth is hypothetical and rejected; the passage does not narrate
    an accomplished resurrection.
- id: motif:7
  label: teaching beyond the listener’s capacity brings danger
  taxonomy_refs:
  - wisdom
  basis: Confucius warns that if the prince cannot find the teaching within himself,
    he will doubt and kill, after quoting sayings about the limits of small bags and
    short ropes.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: This is a political-philosophical warning rather than a supernatural motif.
