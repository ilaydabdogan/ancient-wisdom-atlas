  summary: Chapter X, “Opening Trunks,” opens with an argument that artificial restrictions
    are deceptive and that people should revert to the natural. It describes anti-theft
    fastenings on trunks, bags, and tills, then says a strong thief carries away the
    secured containers and benefits from the fastenings. The passage then introduces
    the State of Ch'i as prosperous, closely settled, cultivated, and governed according
    to rules laid down by the Sages, before ending mid-transition.
