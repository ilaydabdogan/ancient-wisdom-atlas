canonical_text:
  quote: ''
  summary: 'The passage presents several anecdotes about rulers, scholars, sages,
    administrators, artists, and teachers: Chuang Tzu distinguishes true possession
    of Tao from scholar''s clothing; humble or unconventional figures are recognized
    for administration or artistry; Wen Wang uses a dream narrative to justify appointing
    the old man of Tsang, whose government succeeds before he disappears; Confucius
    comments that the dream satisfied the vulgar mind; a new archery episode begins
    at the end.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duke Ai asks how scholars can be called few when many wear scholars' robes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chuang Tzu says round hats, square shoes, and loose girdles correspond to
    kinds of scholar knowledge or readiness, but scholars with Tao do not necessarily
    wear robes and robe-wearing does not necessarily show possession of Tao.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duke Ai circulates a mandate for five days, after which no one in Lu dares
    wear scholars' robes except one old man who stands at the duke's gate in that
    attire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The duke summons the old man, asks many political questions to entangle him,
    and fails.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chuang Tzu concludes that if Lu has only one scholar, that is not many.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Po Li Ch'i is described as having no attraction to rank and power, feeding
    cattle, keeping them fat, and being entrusted by Duke Mu of Ch'in with administration.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shun is described as caring nothing for life or death and as being able to
    influence men's hearts; his parents are said to have tried to kill him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Prince Yuan of Sung desires to draw a map, and officials present themselves
    with brushes and ink ready.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: One official arrives late, enters without hurry, makes obeisance, leaves for
    home, removes his clothes, and squats bare-backed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Prince Yuan calls the late-arriving, bare-backed official a true artist.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wen Wang sees an old man fishing in Tsang, but the narration says the old
    man fishes for amusement rather than to catch fish.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wen Wang wishes to employ the old man of Tsang in government but fears objections
    from ministers and kin, and also fears depriving the people of the old man's influence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Wen Wang tells his ministers of a dream in which a black sage with a large
    beard, riding a parti-coloured horse with red stockings on one side, tells him
    to put the old gentleman of Tsang in charge of administration.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The ministers interpret the dream as a command from Wen Wang's father and
    say divination is unnecessary.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The old man of Tsang is entrusted with administration; he changes no existing
    statutes and issues no unjust regulations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After three years, Wen Wang finds dangerous organizations broken up, officials
    acting properly, grain measures unused within the state, and public and official
    unity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Wen Wang appoints the old man Grand Tutor, faces north in respect, and asks
    whether such government can be extended over the empire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The old man of Tsang remains silent, takes leave abruptly, disappears by evening,
    and is never heard of again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: Yen Yuan asks Confucius how Wen Wang could accomplish through a dream what
    he could not do by himself.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:20
  text: Confucius tells Yen Yuan not to criticize Wen Wang and says the dream merely
    satisfied the vulgar mind.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:21
  text: At the end of the supplied range, a new episode begins in which Lieh Yu K'ou
    instructs Po Hun Wu Jen in archery and draws the bow fully; the action is incomplete
    in the excerpt.
  category: sequence
  evidence_refs:
  - ev:11
