  quote_or_summary: Duke Ai summons the old man in robes and asks political questions
    to entangle him, without success; Chuang Tzu says that if there is only one scholar
    in Lu, that is not many.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
