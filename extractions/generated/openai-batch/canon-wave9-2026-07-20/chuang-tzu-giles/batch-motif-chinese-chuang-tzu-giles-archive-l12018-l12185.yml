candidate_motifs:
- id: motif:1
  label: External signs do not prove true wisdom or Tao
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzu explicitly states that possessing Tao does not require wearing
    robes and that wearing robes does not prove possession of Tao; the mandate leaves
    only one tested figure still wearing the robes.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage uses scholar's dress and Tao in a didactic anecdote; no wider
    comparative claim is required.
- id: motif:2
  label: Hidden or humble worthy elevated to office
  taxonomy_refs:
  - wisdom
  basis: Po Li Ch'i is elevated from cattle-feeding to administration, and the old
    man of Tsang is elevated from fishing to administration and then Grand Tutor.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The examples are adjacent anecdotes rather than one continuous narrative.
- id: motif:3
  label: Unforced or non-instrumental action reveals capacity
  taxonomy_refs:
  - wisdom
  basis: The old man of Tsang fishes for amusement rather than to catch fish, and
    the late official's unhurried, unconventional conduct causes Prince Yuan to identify
    him as a true artist.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The motif label interprets the juxtaposed anecdotes; the text does not
    supply a single abstract label for this pattern.
- id: motif:4
  label: Dream used to authorize political appointment
  taxonomy_refs:
  - royal_legitimacy
  basis: Wen Wang tells ministers of a dream commanding him to appoint the old man
    of Tsang; the ministers identify it as a command from his late father and reject
    divination; Confucius later says the dream satisfied the vulgar mind.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The appointment is administrative rather than accession to kingship, and
    Confucius frames the dream pragmatically rather than as necessarily supernatural.
- id: motif:5
  label: Sage administrator withdraws and disappears
  taxonomy_refs:
  - departure
  - wisdom
  basis: After successful government and appointment as Grand Tutor, the old man of
    Tsang gives no answer about extending the government over the empire, leaves abruptly,
    and is never heard of again.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The disappearance is literal in the narrative but is not elaborated as
    death, ascent, or transformation.
- id: motif:6
  label: Indifference to life and death grants influence
  taxonomy_refs:
  - wisdom
  basis: Shun is said to care nothing for life or death and therefore to be able to
    influence men's hearts, despite his parents' attempt to kill him.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is a brief statement rather than a developed episode in the supplied
    range.
comparison_claims:
- id: claim:1
  claim: 'The Wen Wang dream episode serves the same function as a royal-legitimation
    pattern: a visionary or ancestral command authorizes a political act before ministers.'
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:7
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The political act is the appointment of an administrator, not the enthronement
    of a ruler; Confucius' explanation treats the dream as a device to satisfy the
    vulgar mind.
- id: claim:2
  claim: Several anecdotes in the passage share a wisdom-pattern function in which
    true capacity appears in humble, unadorned, or nonconforming figures rather than
    in formal markers.
  claim_level: same_function
  target: wisdom motif family / hidden worthy pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself juxtaposes these anecdotes, but it does not explicitly
    name a comparative motif family or connect them to traditions beyond the supplied
    text.
