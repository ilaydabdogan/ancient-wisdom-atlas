  locator: lines 12018-12185; Po Li Ch'i anecdote
  quote_or_summary: Po Li Ch'i has no attraction to rank and power, feeds cattle,
    keeps them fat, and is entrusted with administration by Duke Mu of Ch'in despite
    low condition.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:4
  type: summary
  locator: lines 12018-12185; Shun anecdote
  quote_or_summary: Shun is described as caring nothing for life or death and thereby
    influencing men's hearts; his parents are said to have tried to kill him.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:5
  type: summary
  locator: lines 12018-12185; Prince Yuan of Sung and the map
  quote_or_summary: Prince Yuan wants a map; officials stand ready with brushes and
    ink. One official arrives late, does not hurry, makes obeisance, leaves, removes
    his clothes, and squats bare-backed. The prince says he will do and calls him
    a true artist.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:6
  type: summary
  locator: lines 12018-12185; Wen Wang sees old man fishing in Tsang
  quote_or_summary: Wen Wang sees an old man fishing in Tsang; the narration says
    he fishes not to catch fish but to amuse himself. Wen Wang wants to employ him
    in government but fears objections and also fears depriving the people of his
    influence.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:7
  type: summary
  locator: lines 12018-12185; Wen Wang's dream and ministerial response
  quote_or_summary: Wen Wang tells ministers that he dreamed of a black sage with
    a large beard on a parti-coloured horse with red stockings on one side, instructing
    him to put the old man of Tsang in charge. The ministers identify it as a command
    from his late father and say divination is unnecessary.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: lines 12018-12185; old man of Tsang administers
  quote_or_summary: The old man of Tsang is entrusted with administration, changes
    no existing statutes, and issues no unjust regulations. After three years Wen
    Wang finds disorderly groups broken up, officials acting as a matter of course,
    grain measures unknown within the state, and unity in public voice and interests.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:9
  type: summary
  locator: lines 12018-12185; Grand Tutor and disappearance
  quote_or_summary: Wen Wang appoints the old man Grand Tutor, faces north in respect,
    and asks whether such government can be extended over the empire. The old man
    is silent, leaves abruptly, disappears by evening, and is never heard of again.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
- id: ev:10
  type: summary
  locator: lines 12018-12185; Yen Yuan and Confucius on the dream
  quote_or_summary: Yen Yuan asks Confucius how Wen Wang could do through a dream
    what he could not do himself. Confucius tells him not to criticize Wen Wang and
    says the dream was merely to satisfy the vulgar mind.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
