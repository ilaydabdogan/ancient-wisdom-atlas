  locator: lines 12018-12185; Duke Ai and Chuang Tzu on scholars' robes
  quote_or_summary: Duke Ai points to many people wearing scholars' robes; Chuang
    Tzu describes round hats, square shoes, and loose girdles, then says Tao is not
    guaranteed by robes and proposes a death-penalty mandate for robe-wearing without
    Tao. After five days only one old man in Lu wears the robes.
  source_text_path: texts/public-domain/taoist/internet-archive/chuang-tzu-giles.md
  rights_note: Public domain source metadata; summarized.
