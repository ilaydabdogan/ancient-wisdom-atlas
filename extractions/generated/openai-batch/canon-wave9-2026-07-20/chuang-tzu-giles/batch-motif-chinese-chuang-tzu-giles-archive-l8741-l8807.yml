canonical_text:
  quote: ''
  summary: Confucius tells Lao Tzu that he mastered and used the Six Canons to admonish
    rulers, but none adopted his suggestions. Lao Tzu replies that the canons are
    only traces of ancient sages, like footprints rather than the shoe itself, and
    teaches through examples of natural reproduction and development that nature,
    destiny, time, and Tao cannot be forced. Confucius withdraws for three months,
    returns saying he has attained, recognizes that one who is not enlightened cannot
    enlighten others, and Lao Tzu confirms his attainment. The passage ends with a
    quoted literary comment by Lin Hsi Chung.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says he arranged the Six Canons of Poetry, History, Rites, Music,
    Changes, and Spring and Autumn, spent much time on them, and knew their purport.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says he used the canons to admonish seventy-two rulers with discourse
    on ancient sovereigns and examples from Chou and Shao, but no ruler adopted his
    suggestions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lao Tzu replies that the Six Canons are worn-out footprints of ancient sages
    and compares spoken words to footprints made by a shoe but not identical with
    the shoe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lao Tzu gives examples of offspring arising from fish-hawks gazing at one
    another, paired insect chirping with and against the wind, and an hermaphroditic
    animal producing its own offspring.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lao Tzu states that nature cannot be changed, destiny cannot be altered, time
    cannot stop, Tao cannot be obstructed, and attainment of Tao determines what can
    be accomplished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Lao Tzu's instruction, Confucius does not leave his house for three
    months and then visits Lao Tzu again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On returning, Confucius says he has attained and lists birds laying eggs,
    fish spawning, insects undergoing metamorphosis, and mammals suckling their young.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Confucius says that for a long time he had not been enlightened and asks how
