canonical_text:
  quote: ''
  summary: The passage states that the dead cannot be tracked and that the secret
    from birth to death is unknowable. It rejects Chance and Predestination as limited
    explanations for beginnings within material existence, describes past and future
    time as infinite, and says Tao is beyond material existence, language, and silence.
    A commentator, Lin Hsi Chung, remarks that this essay makes it unnecessary to
    seek Buddhist books from the West.
