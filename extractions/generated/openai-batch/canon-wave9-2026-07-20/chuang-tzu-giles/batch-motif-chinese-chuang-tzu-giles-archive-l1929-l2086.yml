canonical_text:
  quote: ''
  summary: The passage expounds the identity of contraries from the standpoint of
    Tao, illustrates adaptive reframing through the parable of the monkey keeper and
    the chestnut rations, describes the true Sage as one who adapts while recognizing
    unity, sketches stages before and after the emergence of contraries, and reflects
    on speech and beginnings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, from the standpoint of Tao, paired contrasts such
    as beam and pillar, horizontal and vertical, and ugliness and beauty are identical.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that separation, construction, and destruction are brought
    together into One rather than remaining separate conditions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the truly intelligent transfer themselves into the position
    of the things viewed rather than viewing things only subjectively.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tzu Yu asks what Three in the Morning means, and Tzu Ch'i replies with a story
    about a keeper of monkeys and chestnut rations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the story, the keeper first allocates three chestnuts in the morning and
    four at night; after the monkeys become angry, he changes the order to four in
    the morning and three at night, which pleases them although the total remains
    the same.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The true Sage is described as regarding contraries as identical and adapting
    himself to the laws of Heaven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes older knowledge as reaching back to a period when matter
    did not exist, followed by matter unconditioned, then matter conditioned before
    contraries appeared; with contraries, Tao declined and individual bias arose.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chao Wen is said to have played the guitar, Shih K'uang to have wielded the
    baton, and Hui Tzu to have argued; the passage says these three excelled in such
    arts and passed their lives practicing them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hui Tzu's views are described as different from those of the world; he tried
    to enlighten people, ended in the obscurity of hard and white, and his son searched
    his works without establishing the principle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage questions whether Speech belongs under categories of contraries
    and states that if there was a beginning, there was a time before that beginning.
  category: speech
  evidence_refs:
  - ev:10
