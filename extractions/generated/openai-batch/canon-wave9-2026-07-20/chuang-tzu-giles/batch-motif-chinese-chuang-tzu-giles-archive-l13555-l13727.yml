canonical_text:
  quote: ''
  summary: The passage argues that individual standards and subjective viewpoints
    are fallacious or partial. It uses examples from sacrifice, a house, social relations,
    animals, skill, rulers obtaining ministers, and altered bodily or legal status
    to explain relativity of judgment, spontaneous virtue, removal of mental obstructions,
    Tao and Te, effortless action, and the distinction between the natural and the
    artificial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that individual standards are fallacious and that what
    is subjective from one point of view may be objective from another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a winter sacrifice, tripe and the great toe may be separated, yet the passage
    says they cannot be separated because each carries characteristics of the whole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who looks at a house is said to visit the ancestral hall and the
    latrines; otherwise he has seen only part of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the subjective point of view originates with life and, with
    knowledge as tutor, drifts into admitting right and wrong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: People are described as treating their own standard of right as the standard
    to which others must adapt.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says people often treat usefulness as wisdom, uselessness as folly,
    success as honourable, and failure as dishonourable.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The present generation is compared to the cicada and the young dove, which
    see things only from their own standpoint.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: If a man treads on a stranger's toe in the market-place, he apologizes because
    he was in a hurry; if an elder brother does it, sympathy suffices; if a parent
    does it, nothing is done.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage gives sayings that perfect politeness is not artificial, perfect
    duty is not calculation, perfect wisdom takes no thought, perfect charity recognizes
    no ties, and perfect trust needs no pledges.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker instructs the hearer to discard stimuli of purpose, free the mind
    from disturbances, get rid of entanglements to virtue, and pierce obstructions
    to Tao.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Four groups of six items are listed as stimuli, disturbances, entanglements,
    and obstructions; if these twenty-four do not run riot, the mind becomes ordered,
    restful, clear, unconditioned, and capable of inaction through which nothing cannot
    be accomplished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tao is called the sovereign lord of Te; life is called the glorifier of Te;
    nature is called the substance of life; the operation of nature is action, and
    the perversion of action is error.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: People who know are said to use physical power and mental effort, but not
    to know how to be like the eye, which sees without looking.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Spontaneous emotion is called virtue passive, and emotion not evoked by the
    external is called virtue active; their names are antagonistic, but essentially
    they agree.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Yi is described as skilled at hitting the bull's-eye but unable to prevent
    people from praising him for it.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Sage is said to devote himself to the natural and neglect the artificial,
    while only the Perfect Man can profitably devote himself to both natural and artificial.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Insects are said to influence insects because insects are natural.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: If a bird falls in with Yi, Yi will get it; if the world were a cage, birds
    would have no place of escape.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: T'ang is said to have got I Yin by cookery, and Duke Mu of Ch'in is said to
    have got Po Li Ch'i by five rams' skins.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: A one-legged man discards ornament because his exterior is not open to commendation.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: Condemned criminals are said to go up to great heights without fear because
    they no longer regard life and death from their former point of view.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: The passage refers to moral clothing and glosses it as artificial virtues.
  category: object
  evidence_refs:
  - ev:10
