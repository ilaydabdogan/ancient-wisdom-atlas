canonical_text:
  quote: ''
  summary: The passage argues that mankind should be left alone rather than governed
    coercively. It contrasts rulers who produce emotional excess, describes cosmic
    imbalance through positive and negative poles, criticizes over-refinement of social
    and sensory faculties, and presents the perfect person as governing, if required,
    through Inaction while natural processes mature without interference.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there has been such a thing as letting mankind alone,
    but never successful governing of mankind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Letting alone is said to arise from concern that human natural dispositions
    may be perverted and virtue laid aside.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yao is described as governing by producing excessive happiness, after which
    the people were not satisfied; Chieh is described as producing excessive sorrow,
    after which the people were not contented.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Great rejoicing is said to move a person toward the positive pole, and deep
    sorrow toward the negative pole.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Disturbing the equilibrium of positive and negative is said to interrupt the
    four seasons, destroy the balance of heat and cold, and cause physical suffering
    to humans.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that making people rejoice and sorrow causes loss of steadiness
    and leads to competition, named figures, and a system of rewards and punishments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eight forms of over-refinement are listed, and the passage says they become
    hindrances and spoilers when people do not adapt to natural conditions of existence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the perfect man who is summoned to power, the passage recommends Inaction
    as the means of adapting to natural conditions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says that one who respects or loves the State as his own body
    is fit to support or govern it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The closing image presents the speaker refraining from internal and sensory
    injury, sitting like a corpse, while dragon-power, thunder-voice, heavenly response,
    and the maturation of all things accompany inaction.
  category: sequence
  evidence_refs:
  - ev:7
