canonical_text:
  quote: ''
  summary: A sequence of political, animal, and natural analogies leads into a dialogue
    between the Spirit of the River and the Spirit of the Ocean. The Ocean spirit
    teaches that value and worthlessness, right and wrong, and other opposites shift
    according to circumstance when viewed from Tao. Tao is presented as without beginning
    or end, while other things are born, die, and continually change. The passage
    ends with an ideal of the person of perfect virtue who is not harmed by external
    forces because he understands conditions and lets things take their course, followed
    by a translator's note comparing this ideal to Plato's wise man.
  language: English
  quote_policy: summarized
