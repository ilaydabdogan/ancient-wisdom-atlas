canonical_text:
  quote: "“With such men as these, you have only to look, and Tao abides. There is
    no room for speech.”"
  summary: The passage gives a series of anecdotes about Tao as wordless and not reducible
    to formal morality. Tzu Fang praises a neighbor who speaks well on Tao but describes
    his own tutor as a perfected being whose mere look corrects others. Prince Wen
    falls into silence and judges his previous learning superficial. Wen Po Hsiieh
    Tzu distrusts formal ceremonial expertise, meets a formal visitor from Lu, and
    sighs over him. Confucius meets Wen Po without speaking and says Tao abides by
    a look. Yen Yuan asks why he can imitate Confucius in ordinary ways but cannot
    follow him beyond mortal bounds; Confucius answers with remarks on the death of
    the mind and the image of the sun’s rising and setting.
  language: English
  quote_policy: quoted
