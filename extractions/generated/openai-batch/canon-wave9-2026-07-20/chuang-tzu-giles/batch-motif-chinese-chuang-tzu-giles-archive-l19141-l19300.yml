canonical_text:
  quote: ''
  summary: A section of Chapter XXXIII describes several teachings associated with
    the ancient Tao, then discusses P'eng Meng, T'ien P'ien, Shen Tao, Kuan Yin, and
    Lao Tzu. It contrasts public-spirited nonpartisanship, passivity, identity of
    all things, non-assertion, gentleness, humility, and following rather than preceding
    others.
  language: English
  quote_policy: summarized
