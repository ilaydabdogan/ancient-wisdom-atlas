canonical_text:
  quote: ''
  summary: 'The passage contrasts administrative categories such as forms, names,
    rewards, and punishments with Tao as the deeper principle of government. It then
    presents two didactic dialogues: Shun corrects Yao by urging passive accord with
    the cosmic pattern, and Lao Tzu criticizes Confucius’s doctrines of charity and
    duty by urging him to follow Tao and the regularity of nature.'
  language: English
  quote_policy: summarized
