  quote: I have become One with the Infinite.
  summary: 'The passage presents three linked dialogues or episodes: I Erh Tzu asks
    about approaching a boundary and Hsii Yu directs him toward a sustaining Master
    identified in the supplied text as “Tag”; Yen Hui tells Confucius of successive
    renunciations culminating in release from body and reasoning and union with the
    Infinite; Tzu Yu visits the ill Tzu Sang after ten days of rain, and Tzu Sang
