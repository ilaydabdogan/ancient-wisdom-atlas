  text: I Erh Tzu asks whether God might remove his brands, give him a new nose, and
    make him fit to become Hsii Yu’s disciple.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hsii Yu describes the Master he serves as succouring all things, continuing
