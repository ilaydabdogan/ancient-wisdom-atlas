canonical_text:
  quote: ''
  summary: 'The passage presents didactic dialogues and exempla: Confucius answers
    Yen Hui on bodily hardship, adaptation to external conditions, unknowable beginnings
    and endings, and the relation of man and God; Chuang Tzu observes a predation
    chain in a park and reflects on loss following pursuit of gain; he later explains
    his withdrawal as a loss of his real self; Yang Tzu interprets an innkeeper''s
    unequal love for beautiful and ugly concubines as a lesson in virtue without self-consciousness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius describes hunger, thirst, cold, and heat as fetters in the path
    of life and as belonging to natural laws governing the universe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says rank and power may follow adaptation to surroundings, but such
    advantages are external and are to be taken as they come rather than stolen or
    pilfered.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Confucius uses the swallow as an example: it avoids an unfit dwelling, leaves
    dropped food behind, and yet dwells among men because it finds its natural abode
    there.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius says that the work goes on without anyone knowing the cause, beginning,
    or end, leaving people only to wait.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Confucius says that man is from God, God is from God, and man is not God by
    nature; an editorial note says the Sage waits for death as the end that unites
    him again with God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chuang Tzu wanders in the park at Tiao-ling and sees a strange southern bird
    with wings seven feet across and eyes an inch in circumference, flying close past
    his head to a chestnut grove.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Chuang Tzu approaches the strange bird with a cross-bow, wanting a shot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A cicada enjoys itself in the shade; a mantis seizes the cicada while forgetting
    its own body; the strange bird then pounces on the mantis and makes it prey.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the episode was popularized in Chinese everyday life and
    depicted in a woodcut with an added tiger, an added well, and the legend "All
    is Destiny!"
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chuang Tzu says creatures injure one another and that loss follows the pursuit
    of gain; he lays aside his bow and is driven away by the park-keeper.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the park incident, Chuang Tzu does not leave the house for three months
    and tells Lin Chü that while keeping his physical frame he lost sight of his real
    self.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Yang Tzu stays at an inn where the innkeeper loves the ugly concubine and
    hates the beautiful one; a servant explains this by their self-consciousness,
    and Yang Tzu teaches his disciples to be virtuous without being consciously so.
  category: sequence
  evidence_refs:
  - ev:11
