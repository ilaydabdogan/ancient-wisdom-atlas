canonical_text:
  quote: ''
  summary: The passage introduces Robber Che as Liu Hsia Chi’s younger brother and
    a violent outlaw leader. Confucius proposes to admonish him despite Liu’s warning,
    travels with attendants to Robber Che’s camp near T’ai-shan, and gains audience
    through a doorkeeper. Robber Che angrily denounces and threatens Confucius, who
    begins by praising Che’s beauty, wisdom, and courage while saying he blushes for
    him.
  language: English
