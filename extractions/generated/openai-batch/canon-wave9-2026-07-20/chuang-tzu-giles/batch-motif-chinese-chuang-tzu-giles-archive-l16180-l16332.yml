  quote: ''
  summary: The passage presents a sequence of anecdotes in which rulership, territory,
    or imperial gain is treated as less valuable than preserving life, bodily integrity,
    contentment, or withdrawal from danger. Several figures decline an offered empire,
    flee from office, leave territory, or refuse bodily harm even for imperial rule.
  language: English
  quote_policy: summarized
