- id: obs:1
  text: Yao offers the empire to Hsii Yu, who declines, and then to Tzu Chou Chih
    Fu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tzu Chou Chih Fu says he is occupied with curing a troublesome disease and
    has no leisure to look after the empire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the empire is important, but the man in the anecdote
    would not allow it to injure his chance of life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shun offers the empire to Tzu Chou Chih Poh, who gives the same reason of
    illness and treatment for declining.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shan Chüan describes a seasonal, self-sufficient life of clothing, farming,
    harvesting, work, rest, and contentment, then declines the empire and hides among
    mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A labourer of Shih Hu tells Shun that he exerts himself too much; the labourer
    and his family leave with household gods and children, go to the sea, and do not
    return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: T'ai Wang Shan Fu is attacked at Pin; he offers valuables and animals to the
    attackers, but they refuse because they want territory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: T'ai Wang Shan Fu says he cannot bear to cause deaths over territory, leaves
    with his staff, is followed by his people, and founds a new State at the foot
    of Mount Ch'i.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator says T'ai Wang Shan Fu respected life and contrasts this with
    people who risk their bodies for gain or power.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: After three Yue princes are killed, Shou flees to Tan Hsüeh; he is found,
