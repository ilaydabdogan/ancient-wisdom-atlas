canonical_text:
  quote: ''
  summary: The passage contrasts the natural and the artificial through dialogue between
    the Spirit of the River and the Spirit of the Ocean. It then presents a chain
    of beings—walrus, centipede, snake, wind, eye, and mind—each envying another's
    capacity, with explanations emphasizing natural mechanism and differing strengths.
    A later episode shows Confucius surrounded by troops, remaining cheerful with
    music, and teaching Tzu Lu that sage courage consists in accepting fate, opportunity,
    and danger without fear; the troops then apologize for mistaking him for Yang
    Hu.
  language: English
  quote_policy: summarized
