canonical_text:
  quote: ''
  summary: The passage presents dialogues and anecdotes about people judged by outward
    rank, mutilation, disease, or social status. Shen T'u Chia rebukes Tzu Chan for
    focusing on his missing toes rather than inner study. Shu Shan No-toes visits
    Confucius, then Lao Tzu, and criticizes Confucius as bound by reputation and categories.
    Duke Ai describes the leper Ai T'ai T'o, whose repulsive appearance does not prevent
    men, women, and the duke himself from becoming attached to him and trusting him.
  language: English
  quote_policy: summarized
