- id: obs:3
  text: The passage says parents desire filial sons, but filial piety does not necessarily
    inspire love; Hsiao Chi and Tseng Shen are given as examples of grief.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Natural and cosmic images include wood producing fire by friction, metal liquefying
    in fire, inharmonious Positive and Negative principles, thunder, rain, lightning,
    scorched trees, and fear of sky and land collapsing.
  category: setting
  evidence_refs:
  - ev:4
