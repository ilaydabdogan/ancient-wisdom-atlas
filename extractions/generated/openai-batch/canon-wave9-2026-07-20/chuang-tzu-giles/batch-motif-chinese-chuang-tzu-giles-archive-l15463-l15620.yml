  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jen Kung Tzu uses a huge hook, a big line, and fifty oxen as bait while fishing
    from Kuei-chi into the eastern ocean; he fishes daily for a year without catching
