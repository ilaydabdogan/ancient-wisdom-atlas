  text: The chapter argument says external conditions are uncertain, the internal
    alone is without harm, life and death are external, and only the soul is under
    a person’s control.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists named political figures whose loyalty or public service
    did not prevent death, disgrace, exile, or other misfortune.
  category: sequence
