  quote: ''
  summary: The passage presents contingencies as uncertain and illustrates the point
    through harmed loyal ministers, disappointed filial sons, images of fire and cosmic
    disturbance, Chuang Tzu’s parable of a fish needing immediate water, Jen Kung
    Tzu’s capture of a giant fish, and a critique of grave-opening Confucianists seeking
    a pearl from a corpse’s mouth.
  language: English
  quote_policy: summarized
