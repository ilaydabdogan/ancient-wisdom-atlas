  quote: ''
  summary: A sequence of anecdotes and interpretive comments presents skilled craft,
    charioteering, ease, and sage instruction as examples of quiescence, natural spontaneity,
    respect for limits, and the ideal of the perfect man beyond worldly display and
    complaint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ch'ing says that before making a stand he guards his vital power and reduces
    his mind to absolute quiescence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ch'ing describes a three-, five-, and seven-day sequence in which he becomes
    oblivious of reward, fame, and then his limbs and physical frame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ch'ing enters a mountain forest, searches for a suitable tree, sees the required
    stand in his mind, and works by relating his natural capacity to that of the wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tung Yeh Chi displays charioteering before Duke Chuang, driving in ruled-looking
    lines and compass-like curves; after being ordered to circle repeatedly, his horses
    break down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yen Ho says he knew the horses would break down because Chi was trying to
    make them perform a task beyond their capacity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ch'ui the artisan can draw circles with his hand better than with compasses,
    and his fingers naturally accommodate themselves to the work without fixed attention.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that unconsciousness of shoes or girdle shows ease, and
    that intelligence unconscious of positive and negative shows the heart at ease.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sun Hsiu reports that despite propriety in peace and courage in trouble, his
    crops fail, his official career fails, and he is socially and politically rejected.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sun Hsiu asks how he has offended God that he should receive such a fate.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pien Tzu describes the perfect man as oblivious of physical organization,
    beyond sight and hearing, outside the dusty world, and rambling in the domain
    of no-affairs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pien Tzu rebukes Sun Hsiu for displaying knowledge, contrasting his cultivation
    with others' degradation, and complaining despite having an intact body and a
    place among men.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After Sun Hsiu leaves, Pien Tzu sighs and tells a disciple he fears that speaking
    of the perfect man's virtue may startle Sun into doubt.
  category: sequence
  evidence_refs:
  - ev:9
