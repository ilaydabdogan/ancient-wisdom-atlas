canonical_text:
  quote: ''
  summary: The passage describes Tao as prior to heaven and earth, unseen, formless,
    and beyond temporal or spatial measures. It lists legendary rulers, celestial
    bodies, spirits, and sages who obtained Tao and thereby established order, governed
    domains, ascended to heaven, lived long, or were enrolled among stars. It then
    narrates Nu Yu explaining Tao to Nan Po Tzu K'uei and describing Pu Liang I's
    staged transformation through instruction until distinctions of world, self, time,
    life, and death cease.
  language: English
  quote_policy: summarized
