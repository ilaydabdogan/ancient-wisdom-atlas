canonical_text:
  quote: '"Ch''iu! come here," cried Robber Che in a great rage.'
  summary: A speaker offers Robber Che political dominion and social reintegration,
    but Robber Che angrily rejects the offer, attacks Ch'iu/Confucius and Confucian
    teaching, contrasts ancient simple ages with later rulers and wars, and argues
    that famed worthies were corrupted by desire for advantage.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening speaker offers to travel in every direction, build a large walled
    state, make the addressee ruler over many inhabitants, have him disband his men,
    gather his brothers, and join in ancestor worship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Robber Che angrily addresses Ch'iu and says that offers and corrective words
    only influence the vulgar masses; he rejects praise and the promise of a great
    state.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Robber Che says that the empire is the largest state, yet Yao and Shun's descendants
    lacked territory, while the posterity of Tang and Wu Wang was obliterated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Robber Che recounts that in old times birds and animals outnumbered people,
    so people built dwellings in trees, gathered acorns and chestnuts by day, and
    slept on branches at night; he says this produced the name Nest-builders.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Robber Che recounts that old-time people did not know how to make clothes,
    collected fuel in summer, and warmed themselves by fire in winter; he says this
    produced the name Provident.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Robber Che describes the days of Shen Nung as a time when people moved and
    rested without concern, knew their mothers but not their fathers, lived among
    wild deer, tilled for food, wove cloth, and had no thought of injuring others.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Robber Che says the Yellow Emperor fought Ch'ih Yu at Cho-lu and that blood
    flowed for a hundred li; he then lists later rulers and says the strong oppressed
    the weak and the many coerced the few.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Robber Che accuses Ch'iu of preaching Wen Wang's old dogmas, wearing patched
    clothes and a narrow girdle, speaking grandly but acting falsely, deceiving rulers,
    seeking wealth and power, and deserving the name Robber Ch'iu.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Robber Che says Ch'iu enticed Tzu Lu to follow him, made him remove his martial
    cap and long sword, and failed to instruct him properly before Tzu Lu was hacked
    to pieces and exposed at the eastern gate of Wei.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Robber Che lists Ch'iu's failures in Lu, Wei, Ch'i, and among the Chens and
    Ts'ais, and says Ch'iu cannot take care of himself or others.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Robber Che criticizes renowned figures including the Yellow Emperor, Yao,
    Shun, the great Yu, Tang, Wu Wang, and Wen Wang, then says that desire for advantage
    disturbed their original purity.
  category: speech
  evidence_refs:
  - ev:11
