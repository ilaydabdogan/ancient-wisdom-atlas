  quote: The end introduces a new beginning.
  summary: A philosophical dialogue presents society as a unity formed from many parts,
    distinguishes society from Tao, describes the vitality of things through alternating
    principles and seasons, and rejects both Chance and Predestination as inadequate
    accounts of what lies beyond named and embodied existence.
