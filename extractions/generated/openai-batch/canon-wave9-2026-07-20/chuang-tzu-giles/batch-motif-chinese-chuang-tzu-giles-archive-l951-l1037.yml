canonical_text:
  quote: "“The sage seeks for the Absolute, the Infinite, the Eternal. He seeks to
    attain to Tao.”"
  summary: The passage is a philosophical commentary on Chuang Tzu’s mysticism. It
    contrasts Taoist inwardness and the quest for Tao with Confucian practical finitude,
    describes the sage’s self-abstraction, indifference, spontaneity, and mirror-like
    mind, presents Tao as prior to heaven and earth and as cosmic order, and cautiously
    compares Tao with Heracleitus’s Logos while warning against exact equivalence.
  language: English
  quote_policy: quoted
