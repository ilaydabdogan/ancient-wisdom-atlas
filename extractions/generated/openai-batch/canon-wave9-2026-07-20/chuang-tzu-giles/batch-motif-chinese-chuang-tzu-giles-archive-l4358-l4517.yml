canonical_text:
  quote: ''
  summary: The passage presents several linked dialogues on knowledge, inaction, friendship,
    illness, death, decomposition, transformation, and mourning. Speakers trace knowledge
    back to the void and infinity, form friendships around acceptance of life and
    death, confront illness without fear, imagine bodily decomposition into new forms,
    compare Nature and Tao to parental or crafting powers, and sing beside a corpse
    while rejecting conventional mourning decorum.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nan Po Tzu K'uei asks Nii Yu how he obtained the teaching; Nii Yu answers
    with a sequence from books through learning, investigation, coordination, application,
    desire to know, the unknown, the great void, and infinity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four men accept a proposed condition for friendship: making Inaction the
    head, Life the backbone, and Death the tail of existence.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tzu Yu falls ill, is visited by Tzu Ssu, describes his body as severely bent
    and disordered, and says his mental equilibrium is not disturbed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tzu Yu painfully drags himself to a well to see himself and remarks that God
    has doubled him up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tzu Yu says he is not afraid of decomposition and imagines his left shoulder
    becoming a cock, his right shoulder a cross-bow, his buttocks wheels, and his
    soul a horse for a chariot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tzu Yu says he obtained life when it was his time and parts with it under
    the same law; he says joy and sorrow do not touch him when he is content with
    the natural sequence of states.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tzu Lai falls ill and gasps for breath while his family weeps around him;
    Tzu Li tells the wife and children to leave because they obstruct his decomposition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tzu Li wonders what God will make of Tzu Lai and suggests a rat's liver or
    the shoulders of a snake.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tzu Lai says a son must go wherever his parents command and identifies Nature
    with a man's parents; he says resisting a command to die would be unfilial.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tzu Lai says Tao gives form, manhood toil, old-age repose, and death rest,
    and compares the universe to a smelting-pot and God to a caster.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tzu Sang Hu, Meng Tzu Fan, and Tzu Ch'in Chang ask who can be and not be,
    do and not do, and mount to heaven, roam through clouds, pass beyond space, and
    be oblivious of existence.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After Tzu Sang Hu dies, Confucius sends Tzu Kung to take part in mourning;
    Tzu Kung finds the remaining companions singing and playing a lute beside the
    corpse, objects to the behavior, and is laughed at by them.
  category: sequence
  evidence_refs:
  - ev:9
