canonical_text:
  quote: ''
  summary: Chapter XVII opens with autumn floods swelling the river. The Spirit of
    the River rejoices, travels east to the ocean, and becomes humbled by the ocean’s
    apparent limitlessness. The Spirit of the Ocean teaches him through analogies
    of restricted perspective, the relative scale of beings and places, and the non-finality
    of dimensions, time, conditions, life, and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is set during autumn floods, when streams pour into a swollen,
    turbid river and the banks are so far apart that animals on either side cannot
    be distinguished.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Spirit of the River laughs for joy, believing that all the beauty of the
    earth has gathered to himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Spirit of the River journeys downstream eastward until he reaches the
    ocean, where his expression changes after seeing waves with no visible limit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Spirit of the River says that someone who has heard only part of the truth
    may think no one is equal to himself, and identifies himself as such a person.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Spirit of the Ocean says one cannot speak of ocean to a well-frog, of
    ice to a summer insect, or of Tao to a pedagogue, because each has a restricted
    scope.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Spirit of the Ocean describes the ocean as receiving all streams without
    overflowing, being drained without becoming empty, and being unaffected by spring,
    autumn, floods, or droughts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Spirit of the Ocean says he receives his shape from the universe and his
    vital power from Yin and Yang, and compares himself to a small stone or tree on
    a vast mountain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Spirit of the Ocean compares the Four Seas to puddles, the Middle Kingdom
    to a tare-seed in a granary, and an individual person to the tip of a hair on
    a horse’s skin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Spirit of the Ocean cites Poh I and Confucius as examples in a criticism
    of over-estimation of self.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Spirit of the Ocean states that dimensions are limitless, time is endless,
    conditions are not invariable, and terms are not final.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Spirit of the Ocean says the wise person does not treat small as too little,
    great as too much, distant as cause for grief, near as cause for joy, success
    as cause for rejoicing, failure as cause for lament, life as cause for rejoicing,
    or death as cause for repining.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
