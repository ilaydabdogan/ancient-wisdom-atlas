canonical_text:
  quote: ''
  summary: The passage presents Taoist sayings on true virtue, the difficulty of knowing
    Tao without speech, the uselessness of an acquired dragon-killing skill, the contrast
    between the sage and ordinary people, and the perfect person's return to the time
    before beginning. It then gives an anecdote in which Ts'ao Shang boasts of courtly
    success and Chuang Tzu rebukes him by comparing large rewards to degrading service.
    A further dialogue has Duke Ai ask Yen Ho about employing Confucius, and Yen Ho
    criticizes outward show, false learning, and failure of self-effacement in governing.
    The passage ends with reflections on external and internal punishments and Confucius'
    statement that the human heart is more dangerous and harder to understand than
    mountains, rivers, or Heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men of true virtue are described as unconscious of possessing virtue, and
    the man of Tao is associated with escaping the vengeance of God incurred by imitating
    divine goodness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The true Sage is said to rest in what gives rest, while the world rests in
    what does not give rest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chuang Tzu says that knowing Tao is easy, while the difficulty is eliminating
    speech; knowing Tao without speech is called natural, and knowing it with speech
    is called artificial.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chu P'ing Man spends a large patrimony learning from Chih Li I how to kill
    dragons; after three years he is perfect in the skill, but has no occasion to
    show it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The true Sage treats certainties as uncertainties and is not up in arms; people
    in general treat uncertainties as certainties, grow accustomed to arms, and perish
    by trusting them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mean man is described as preoccupied with bribes, letters of recommendation,
    and trivialities, yet attempting to penetrate Tao, creation, and the One; he is
    confounded by time, space, and objective existences.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The perfect man carries his mind back before the beginning, rests in the oblivion
    of nowhere, passes away like flowing water, and is merged in the clear depths
    of the infinite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ts'ao Shang acts as political agent for the prince of Sung at the court of
    Ch'in and receives one hundred additional carriages from the prince of Ch'in.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ts'ao Shang visits Chuang Tzu and contrasts Chuang Tzu's poor living with
    his own success in interviewing a powerful ruler with a retinue of one hundred
    carriages.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chuang Tzu replies with an analogy in which more degrading medical service
    earns more carriages, concluding that Ts'ao Shang must have performed degrading
    service to receive so many carriages.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Duke Ai asks Yen Ho whether making Confucius a pillar of the realm would benefit
    the state; Yen Ho calls it perilous and says Confucius mistakes branch for root
    and outward show for fundamentals.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Yen Ho says it is better not to have Confucius, and that the difficulty of
    governing lies in the inability to practise self-effacement.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: External punishments are described as inflicted by metal and wood, while internal
    punishments are inflicted by anxiety, remorse, and conflict of emotions; only
    the pure and perfect man avoids both.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: Confucius says the heart of man is more dangerous than mountains and rivers
    and harder to understand than Heaven; human exteriors and motives are described
    as inscrutable.
  category: speech
  evidence_refs:
  - ev:12
