canonical_text:
  quote: ''
  summary: The passage gives analogies for adapting practices to circumstances, criticizes
    merely copying old forms, and narrates Confucius visiting Lao Tzu after failing
    to find Tao through numbers and Yin-Yang. Lao Tzu teaches that Tao cannot be presented,
    imparted, or given unless inward and outward conditions are fitting; reputation
    and ethical duties are temporary stopping places; the perfect men of old move
    through them toward transcendental inaction and non-obligation. He warns against
    attachment to wealth, fame, and power, and says only one who adapts to fortune
    is fit to use the instruments of right.
  language: English
  quote_policy: summarized
