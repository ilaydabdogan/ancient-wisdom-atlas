canonical_text:
  quote: ''
  summary: The passage describes post-ceremonial handling of tehl'nawe staves and
    prayer plumes by the 'Hle'wekwe, including deposition at shrines of the Gods of
    War, transformation of worn items into prayer plumes, field offerings for rain
    and fertility, and post-initiation actions involving a feast, plume offering,
    corn planting, yucca-suds bathing, and communal eating.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the morning feast, tehl'nawe are carried by fraternity members belonging
    to the A'pi"lflshiwanni to their homes and later to shrines of the Gods of War
    at the four cardinal points.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names north, west, south, and east shrines and says they are on
    elevated ground.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shrines are built of rock with openings on the east side covered by stone
    slabs; the south shrine is described as superior, horseshoe-shaped, built of flat
    stones, and dome-like on top.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prayer plumes are seen planted inside the south shrine; the tehl'nawe for
    the Zenith and Nadir are deposited at the east shrine, and taller tehl'nawe are
    placed outside against shrine walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hle'wekwe deposit prayer plumes in January and February within the shrine
    walls, where the plumes remain until moved aside to make room for new ones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: La'showawe worn by specified participants are made into prayer plumes after
    the closing ceremonies; paternal parents or brothers prepare those belonging to
    women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One set of plumes is planted in fields with prayers to rain-maker warriors
    and deceased members of the How priesthood; another set is offered in the field
    to A'wan 'Si'ta, the Great Mother, associated here with rains and fructification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Four days later, each fraternity father dresses sheep for a feast for his
    newly initiated child, while household women bake meal and flour, and novice families
    prepare meal and other gifts for the fraternity father's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The newly initiated member accompanies the fraternity father a short distance
    east of the village and deposits initiation prayer plumes to the rain-makers of
    the 'Hle'wekwe for snows, winter rains, abundant crops, health, and happiness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The four ears of corn given to novices at initiation are kept until planting
    time and then planted in the field with other corn.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After returning from plume planting, the novice's head is bathed in yucca
    suds by the wife or female relative of the fraternity father, and a feast is held
    at the fraternity father's house.
  category: sequence
  evidence_refs:
  - ev:7
