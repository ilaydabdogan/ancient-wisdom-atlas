canonical_text:
  quote: ''
  summary: 'The passage describes Zuni Sword order and Great Fire fraternity ceremonial
    actions: sword swallowing before an altar, use of medicine water, smoke, healing,
    first-night preparations for a novice, treatment of juniper splinters with yarrow,
    meal distribution, sword preparation, procession around the altar, and ritual
    actions in which a novice receives sacred life breath and attempts sword swallowing
    under a fraternity father’s direction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man of the Pi'sinni'hle/Sword order appears with a war pouch, a wand
    on the back of his head, and an eagle plume tied to the forelock.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man dips feather ends of eagle-wing plumes into medicine water,
    places them to his lips, and rubs them over his nude body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man takes a sword from behind the altar and dances before the altar
    with twisting, turning, beast-like motions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man faces east, drops to one knee, swallows the sword, and repeats
    the rite three times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A flutist seated behind the altar puffs smoke on each side of it at intervals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Healing of the sick begins soon after the sword swallowing, and the sword
    swallower and two girls conclude the dance at midnight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: On the first night of the Sword division rite, the tablet altar is erected
    in the ceremonial chamber, and the floor is covered with medicine boxes and prayer
    plumes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: The novice's father calls for the novice and conducts him to a seat on the
    north side of the ceremonial chamber.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: Eight officers of different orders of the Fire division sit behind the altar,
    each with a bundle of juniper splinters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: After one song by the choir, each officer puts yarrow root and blossom into
    his mouth, expectorates on the splinters six times alternately, and deposits the
    bundle behind the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: The novice hands a husk of meal to a member, who gives it to the chosen fraternity
    father with the statement that the child wishes to join the order.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The chosen fraternity father receives the meal, wishes for the good heart
    and health of his son, and distributes the meal to each person present into the
    left palm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: The 'Hlem'mosona spreads a blanket, removes sword blades wrapped in buckskin
    from a box, and places them in the center of the blanket for members to select
    and fit with feathered handles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Members sprinkle the altar with meal received from the novice, while the novice
    alone takes meal from the meal basket to sprinkle the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: A file procession passes around the altar, led by a female member carrying
    her mi'li and meal basket, followed by the 'Hlem'mosona, officers, the order at
    large, and the novice behind his fraternity father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The 'Hlem'mosona addresses the assembly as grandfathers, uncles, sons, elder
    brothers, and younger brothers, asking whether any are sorry and saying he wants
    everybody to be happy that night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:17
  text: A woman of the order leads the novice to the middle of the room, faces him
    east, and stands behind him with her hands on his shoulders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: The woman leading the dancers places her mi'li to the novice's right shoulder,
    head, left shoulder, and mouth so that he may draw in the sacred life breath of
    A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: The 'Hlem'mosona swallows his sword and draws it before the novice's right
    shoulder, head, left shoulder, and lips; each member repeats the ceremony with
    his sword over the novice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: The fraternity father swallows his sword, hands it to the novice, and the
    novice attempts to pass the sword down his throat; the novice is supposed to swallow
    it four times, and each time the fraternity father breathes four times upon it.
  category: sequence
  evidence_refs:
  - ev:7
