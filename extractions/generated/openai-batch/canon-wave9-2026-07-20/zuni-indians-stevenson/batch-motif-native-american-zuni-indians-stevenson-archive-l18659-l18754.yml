candidate_motifs:
- id: motif:1
  label: Offerings and prayers exchanged for game success, rain, and crops
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes offerings, prayers, smoke, beads, meal,
    and bundles directed to deceased players, the Council of the Gods, the wood rat,
    the younger God of War, and plants while requesting victory, rain, crops, food,
    and other goods.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is ethnographic ritual description rather than a mythic narrative,
    so the motif is functional rather than plot-based.
- id: motif:2
  label: Contact with the dead as a source of game advantage
  taxonomy_refs: []
  basis: The leader visits the graveyard, deposits offerings for deceased players,
    is questioned about what he heard while visiting the dead, and the passage states
    that being touched by the dead ensures winning.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The text gives no detailed journey through an afterlife realm and does
    not describe the dead speaking directly.
- id: motif:3
  label: Six-region address representing the whole world
  taxonomy_refs: []
  basis: The cigarette and smoke are directed to the six regions in a circle explicitly
    described as symbolic of the whole world.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not identify a full cosmological map beyond the six-region
    circular gesture.
- id: motif:4
  label: Mountain ascent to obtain ritual success
  taxonomy_refs:
  - ascent
  basis: The four men go to the summit of Corn mountain after prayer, and the rat
    man later goes to the younger God of War's shrine on the summit to make offerings
    and pray for game success.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The mountain visit is brief and embedded in game preparation, not a standalone
    ascent narrative.
- id: motif:5
  label: Empowered and concealed game-related objects
  taxonomy_refs: []
  basis: The gaming ball is kept unseen, the plant bundle is kept from view and ritually
    bound with precious materials, and watchers conceal arrows beneath their moccasins.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly explain the intended power of every concealed
    object.
- id: motif:6
  label: Rain and agricultural fertility embedded in game ritual
  taxonomy_refs:
  - seasonal_cycle
  basis: Rain-priest songs and prayers are for rain and fructification, the game rite
    includes hopes for rain and crops, and plant prayers ask for rain, food, and things
    to wear.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage emphasizes rain and crops, but it does not present a complete
    seasonal-cycle myth.
comparison_claims:
- id: claim:1
  claim: 'The passage functionally matches a sacred-exchange pattern: offerings and
    prayers are given to dead, divine, animal, and plant recipients while requesting
    victory, rain, crops, food, and other benefits.'
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The evidence is a ritual procedure, not a narrative of bargain or covenant;
    the term 'exchange' is inferred from offerings paired with requests.
- id: claim:2
  claim: The Corn mountain visits are comparable in function to an ascent or mountain-shrine
    pattern for seeking ritual success and blessing.
  claim_level: same_function
  target: ascent motif family / mountain-shrine ritual pattern
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The ascent is only briefly described and is not presented as an arduous
    quest or transformation.
- id: claim:3
  claim: The leader's graveyard visit and reported knowledge from the dead resemble
    a contact-with-the-dead-for-advantage pattern.
  claim_level: same_function
  target: contact with the dead for knowledge or victory
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide a detailed afterlife journey, map, or
    direct speech by the dead.
- id: claim:4
  claim: The six-region smoking gesture is comparable to a whole-world address pattern
    in ritual action.
  claim_level: same_function
  target: six-direction or whole-world ritual address pattern
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison rests on the passage's explicit statement that the circular
    six-region gesture is symbolic of the whole world; no external parallel is supplied
    in the passage.
