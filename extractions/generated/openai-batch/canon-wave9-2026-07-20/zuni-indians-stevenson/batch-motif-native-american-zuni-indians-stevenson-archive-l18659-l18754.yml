canonical_text:
  quote: ''
  summary: 'The passage describes Zuni ritual preparations connected with a game:
    rain-priest prayers and applications to players, offerings to deceased players
    in a ruined church graveyard, a smoking rite addressed to the six regions, prayers
    for rain and crops, visits to Corn mountain and shrines, preparation of stone,
    pollen, feather, and plant bundles, appeals to a rat and to plants for game success
    and rain, hidden ritual objects, arrows bound under watchers'' moccasins, and
    a meal served by the leader''s household.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The songs and prayers in this passage are associated with rain priests and
    are described as being for rain and fructification of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rain priest prays over a basket tray, raises it to his face, and applies
    te'nas'sali mixed with water to the ears and across the faces of four stooping
    players.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four players receive wafer bread, husk packages, and a cigarette from
    the rain priest, while the gaming ball remains unseen in an inner room.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: At midnight the players leave silently for a ruined Spanish-built church,
    where the leader excavates a place and deposits offerings to deceased players
    of i'yttnkolo'we.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the graveyard offerings, the players pass south of the cross, and the
    leader removes earth, carries it to the rain priest's house, and deposits it outside
    the door.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A rain priest asks the leader what he knows from Moon Mother, the stars, or
    A'wonawil'ona and what he heard while visiting the dead; the rain priest then
    expresses hopes for winning, rain, and crops.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that if one is touched by the dead, he is sure to win the
    game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A shi'wanni lights a native-tobacco corn-husk cigarette with a cottonwood-root
    rod lit in the fire, not with a match, and directs smoke and the cigarette to
    the six regions in a circle described as symbolic of the whole world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cigarette is passed among the leader, other men, and some friends who
    will bet on the game; the remaining bit is kept overnight in a basket tray and
    then cast into the river for the Council of the Gods' abiding place.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: After further prayer for rain and food, four men go to the summit of Corn
    mountain, return, and prepare a mixture of stones, corn meal, corn pollen, and
    feathers in a corn husk for later use in the plaza.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rat man deposits offerings and prayers at the house of the wood rat, asking
    the rat to aid his side in winning by collecting twigs and stems.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rat man also makes offerings at the shrine of the younger God of War on
    Corn mountain and prays for success in the game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The rat man gathers cactus, flat-leaf cactus, yucca, and kiapuli while praying
    for good luck in the game, rain, food, things to wear, and protection from being
    touched in the plaza.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The plant bundle is received by the leader, kept from view, arranged with
    the other players, and bound with turquoise, ko'hakwa, abalone, meal, corn pollen,
    a feather, cotton string, an archaic bead, and buckskin.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: Four watchers bind arrows to the soles of their feet under their moccasins,
    and a meal is served by the leader's wife, family, and assisting female members.
  category: action
  evidence_refs:
  - ev:10
