canonical_text:
  quote: ''
  summary: The passage describes a ceremonial sequence in which order members dance
    with trees in the plaza, return to a ceremonial chamber, sprinkle meal on trees
    and altar, position the trees, swallow tree swords, receive medicine water and
    seeds from the 'Hlem'mosona, and handle two small trees and an arrow in time with
    song. Footnotes mention the danger of sword swallowing and the spectators' belief
    that only those of wicked heart can be injured.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plaza ceremonies are stated to be identical with those described for the
    Sword order, and include three dances with trees in the plaza.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the close of each dance the party returns to the ceremonial chamber; the
    leader places her meal basket near two trees by the hatchway, and all sprinkle
    the trees with meal before descending.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each participant pulls his tree after him and lays it in the middle of the
    floor, with the knife pointing east and the tree's “eyes” looking upward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After resting, the dancers sprinkle meal over the altar and return to the
    plaza to dance and swallow the tree sword.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the third dance the trees are returned to an elevated position near
    the ceiling, and swords with feathered handles are used in the closing dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the final return to the ceremonial chamber, members take meal in their
    left hands and stand close to the wall, while the drummer stands west of the fireplace.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The 'Hlem'mosona gives each person a draft of medicine water while all sing
    to rattle and drum accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The 'Hlem'mosona sprays each participant's throat with medicine water from
    his mouth so that the larynx may not suffer from sword swallowing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The 'Hlem'mosona places one small, slightly sweet black seed in each person's
    mouth from a corn husk and returns the husk to the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The 'Hlem'mosona brings in two small trees and an arrow from the hatchway,
    stands in the middle of the chamber facing east, moves them up and down with the
    song, and passes to each person beginning with the officers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A footnote states that swallowing the sword carved from the trees is dangerous,
    but Indian spectators are enthusiastic and are said to believe that only those
    of wicked heart can be injured.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: A footnote states that a woman of an order customarily asks the director for
    this position, because choosing one woman directly might aggrieve others.
  category: relationship
  evidence_refs:
  - ev:6
