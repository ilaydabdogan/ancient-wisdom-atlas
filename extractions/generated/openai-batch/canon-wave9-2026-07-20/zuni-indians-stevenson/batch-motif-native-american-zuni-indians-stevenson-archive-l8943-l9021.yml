canonical_text:
  quote: "“The summer solstice ceremonies, strictly speaking, are now over…”"
  summary: The passage describes repeated Kor'kokshi dances in four plazas, rest periods
    in the ki'wi'sine, feasts at the Mu'he'wa ki'wi'sine and the Ko'pekwin's house,
    instruction for persons who will personate gods at the Sha'lako festival, ritual
    drinking of spring water, service by Deer and Badger clan women, head washing
    with yucca suds, and the transition from summer solstice ceremonies to Kor'kokshi
    rain dances for crop growth.
  language: English
  quote_policy: quoted
