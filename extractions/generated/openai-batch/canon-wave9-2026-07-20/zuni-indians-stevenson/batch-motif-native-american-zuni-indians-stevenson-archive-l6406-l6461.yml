canonical_text:
  quote: The Gods of War are thus honored that they may intercede with the rain-makers
    for rains to fructify the earth.
  summary: The passage describes a ritual procession into the ki'wi'sine with fetishes,
    shells, et'tone, and idols of the elder and younger Gods of War; night ceremonies,
    songs, prayers, meal sprinkling, food deposition, and bead offerings are performed
    so the War Gods may intercede with rain-makers for rain. Notes describe the elder
    God of War idol, its cloud-and-rain-cloud coloring, associated paraphernalia,
    and Nai'uchi's healing practice during the idol's stay in the house.
  language: English
  quote_policy: quoted
literal_observations:
