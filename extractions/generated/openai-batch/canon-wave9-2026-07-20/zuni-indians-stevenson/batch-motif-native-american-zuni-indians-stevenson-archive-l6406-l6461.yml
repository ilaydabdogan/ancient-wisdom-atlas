  text: A procession enters the ki'wi'sine carrying named fetishes, a great shell,
    an et'tone, idols of the elder and younger Gods of War, and the paraphernalia
    of those gods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder and younger brother Bow priests walk at specified positions in the
    procession and whirl rhombi as they proceed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After entry into the ki'wi'sine, the fetishes and idols are placed on a meal
    painting, with idols and paraphernalia deposited by the pe'kwin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The A'pi'liishiwanni are present as a group and sing a song associated with
    the closing scene of the scalp ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ceremonies in the ki'wi'sine continue throughout the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The War Gods are honored so that they may intercede with rain-makers for rains
    to fructify the earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: At sunrise the elder and younger brother Bow priests carry the idols to their
