candidate_motifs:
- id: motif:1
  label: Offerings and prayers to divine figures for rain intercession
  taxonomy_refs:
  - sacred_exchange
  basis: The War Gods are honored to intercede with rain-makers for rain, while family
    and visitors pray, sprinkle sacred meal, and offer precious beads before the idols.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is ethnographic ritual description rather than a mythic narrative;
    the exchange is ritualized rather than expressed as a negotiated bargain.
- id: motif:2
  label: Seasonal and liminal timing of night-to-sunrise idol rites
  taxonomy_refs:
  - seasonal_cycle
  basis: The ceremonies continue throughout the night and at sunrise the idols are
    carried to their homes; a note ties the facsimile and observed idol display to
    the winter solstice.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:14
  confidence: medium
  cautions: The main passage gives night and sunrise timing, while the winter-solstice
    association appears in a note about the observed idol and facsimile.
- id: motif:3
  label: Sacred objects used for protection and divine presence
  taxonomy_refs: []
  basis: Pa'ettone are described as protective sacred fetishes of the Bow priesthood,
    and the War Gods are represented through idols carried, placed, housed, and honored
    with offerings.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
  - ev:12
  confidence: high
  cautions: No specific available taxonomy reference directly covers protective fetishes
    or idol embodiment.
- id: motif:4
  label: Cloud and rain imagery attached to a deity's idol
  taxonomy_refs: []
  basis: The elder God of War idol's white top with black rectangles signifies a white
    cloud cap with black rain clouds, called the house of the clouds, matching the
    ritual aim of obtaining rain.
  evidence_refs:
  - ev:6
  - ev:13
  confidence: medium
  cautions: The symbolism is explicitly explained in a note, but the broader interpretive
    linkage to the rain-seeking rite remains contextual.
- id: motif:5
  label: Ritual extraction of disease-causing material
  taxonomy_refs: []
  basis: Nai'uchi treats sufferers by pretending to extract the cause of disease from
    the body, wrapping the ejected material in a husk, and carrying it out of the
    house.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The note states that Nai'uchi's medical practice comes from other esoteric
    fraternities, not from his Bow priesthood association; it is peripheral to the
    War God idol rite.
