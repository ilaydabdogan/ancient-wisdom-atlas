canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Zuñi boy''s Ko''tikili initiation: masked
    gods enter the ki''wi''sine, perform movements around mounds, transmit sacred
    breath through plume wands, present the Su''ti''ki bird fetish as announcer of
    Ko''loowisi, distribute water, corn, and long grass through the serpent Ko''loowisi,
    return masks and offerings after the ceremony, and complete further godfather-led
    rites the next morning. The closing note identifies the event as an involuntary
    initiation for which the godfather is chiefly responsible until the boy is old
    enough to take vows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The west end of the room is arranged with a sacred embroidered blanket, another
    blanket below it, strings of precious beads, and an old red, black, and green
    yarn belt.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: U'poyona is described as the first god to enter the ki'wi'sine; he descends
    the ladder rather than going headfirst and sits before the blanket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods enter with somersaults, hop like frogs around the mounds, and U'poyona
    follows 'Hle'lashoktipona on all fours when that god passes him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gods jump onto their appropriate mounds, remove plume wands, jump down,
    and go to children seated between the extended knees of their godfathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each god blows four times on the plume wand he carries and passes it before
    the child's lips; the passage describes this as giving the sacred breath of the
    god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the breath ceremony most gods depart by the western road, while Shu'laawi'si,
    lSi"sikia, and Great Father Ko'yemshi go to O'he'wa ki'wi'sine for similar ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Su'ti'ki bird fetish is moved along a pole by cord while a hidden whistle
    is used; the bird is said to notify those in the ki'wi'sine of Ko'loowisi's coming,
    and participants inhale breath from the fetish.
  category: action
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:8
  text: Ko'loowisi is carried to the hatchway; water is secretly poured into its body
    and then pours from its mouth into bowls held by named ritual officers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mixed grains of differently colored corn are placed in Ko'loowisi and received
    from its mouth in baskets; long grass from the spring is thrown through the hatchway
    while the children's eyes are covered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Children receive sacred water, mixed corn, and long grass; the water is drunk
    and used to sprinkle stacked corn, the grass is placed with the stacked corn,
    and the seeds are planted separately in spring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the ki'wi'sine ceremonies, the gods deposit plume wands and food in
    an excavation west of Zuñi, return masks to keepers with prayers, are bathed by
    women, and are served a feast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the morning after initiation, the child visits his godfather's house, has
    the hair plume removed and replaced, receives corn and te'likinawe, eats there,
    and is carried to Ku'shilowa where the plume is planted and te'likinawe deposited.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage explicitly closes by identifying the ceremony as an involuntary
    initiation of the Zuñi boy into the Ko'tikili, with the godfather mainly responsible
    until the boy is old enough to take vows.
  category: relationship
  evidence_refs:
  - ev:8
