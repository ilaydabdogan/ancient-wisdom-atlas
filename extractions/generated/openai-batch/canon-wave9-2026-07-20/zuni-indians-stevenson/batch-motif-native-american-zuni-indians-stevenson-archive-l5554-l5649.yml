candidate_motifs:
- id: motif:1
  label: Involuntary initiation into a ceremonial fraternity
  taxonomy_refs:
  - initiation
  basis: The passage explicitly identifies the ceremony as an involuntary initiation
    of a Zuñi boy into the Ko'tikili, with future vows required when the boy is old
    enough.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic ceremonial description rather than a self-contained
    myth narrative.
- id: motif:2
  label: Transmission of sacred breath through ritual objects
  taxonomy_refs:
  - initiation
  basis: Gods blow four times on plume wands before children's lips as sacred breath;
    participants also inhale breath from the Su'ti'ki bird fetish while the whistle-blower
    exhales four times.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives ritual actions and local explanations, but does not
    explicitly classify this as a broader motif.
- id: motif:3
  label: Serpent as conduit for sacred water and seeds
  taxonomy_refs:
  - serpent
  - sacred_exchange
  basis: Ko'loowisi is used so that sacred water and mixed corn issue from the serpent's
    mouth and are received by officers and children; children receive sacred water
    from Ko'loowisi.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text also describes hidden handling of water and grass; the extraction
    should preserve the distinction between ritual presentation and concealed mechanism.
- id: motif:4
  label: Ritual gifts carried into household and agricultural renewal
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: Children receive water, corn, and long grass; the water is consumed and sprinkled
    on stacked corn, grass is stored with corn, and seeds are planted in the coming
    spring.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The agricultural use is explicit, but any broader fertility interpretation
    should be reviewed.
- id: motif:5
  label: Masked deity personation and return of sacred masks
  taxonomy_refs:
  - initiation
  basis: The gods perform initiation rites and later the personators return their
    masks to keepers with prayers, then are bathed and feasted.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif label describes ceremonial personation evident in the passage;
    it should not be generalized beyond this local ritual without comparison.
- id: motif:6
  label: Fourfold ritual action
  taxonomy_refs: []
  basis: 'The passage repeatedly specifies fourfold acts: gods blow four times on
    plume wands, the whistle-blower blows out breath four times, and the godfather
    gives four ears of corn.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage does not explain the meaning of the number four; only the
    recurrence is extracted.
comparison_claims: []
