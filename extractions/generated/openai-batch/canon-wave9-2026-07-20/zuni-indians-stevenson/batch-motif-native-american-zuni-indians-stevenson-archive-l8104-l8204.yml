canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi Kor''kokshi and later winter dances: dancers
    circulate among ki''wi''siwe, present and deposit ritual objects, distribute seeds,
    administer medicine water, use masks and meal, arrange dances through wor''li
    and Ko''yemshi, perform dawn rites at the river and plazas, and then introduces
    summer solstice observations involving the pe''kwin, prayers to the sun, and a
    mesa alignment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After prayers, dancers go to the ki'wi'sine furnishing the Kor'kokshi, move
    around in an ellipse, form a single file facing north, and dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Sha'liiko personator carrying a kia'etchine gives the kia'etchine and a
    reed cigarette to the chief wor'li, stoops and prays while the chief holds his
    hands, and then returns to the dancers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kia'etchiwe are kept in selected homes until after the morning meal, when
    each holder deposits his object in a place associated with the region of his ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The listed deposit places include a spring, an arroyo or small canyon, a cornfield,
    the western road at two distances, and the bed of the river west of the village.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The director may choose whether dancers wear masks, but Ko'yemshi must wear
    masks; the note adds that Ko'yemshi masks worn by others must be returned to their
    keeper after the dances.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:6
  text: The dancers continue to other ki'wi'siwe and give one reed cigarette to each
    wor'li of a ki'wi'sine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After visiting dancers leave a ki'wi'sine, a wor'li distributes seeds from
    a sack to those present, including women and children, and the seeds are later
    planted separately with seeds given by the Ko'loowisi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Medicine water is administered to unmasked dancers and others present; masks
    are sprinkled with water using two eagle plumes, and dancers are sprinkled with
    meal at the end of each dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each ki'wi'sine is expected to present the Kor'kokshi in regular succession,
    but the order may be delayed or changed if a head wor'li is occupied with fraternity
    duties.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Kor'kokshi dances are among the most sacred observances
    because the rain-makers are personated and spiritually present, while also serving
    as public entertainment in a dance court described as both temple and theater.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: From the end of the Kor'kokshi dances to late March, ki'wi'siwe hold varied
    dances; a wor'li or prominent member requests a dance, songs are made, four te'likinawe
    are planted to all the gods, and the dance occurs on the fourth night.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the fourth afternoon the wor'li makes a reed cigarette and presents it
    to the Great Father Ko'yemshi or a fraternity director with a request that Ko'yemshi
    be furnished for the dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: For a later dance, dancers assemble in the ki'wi'sine at night, visit and
    dance at the house of the Great Father Ko'yemshi or a director, go at dawn to
    the river bank to deposit tortoise-shell rattles, put on masks, sprinkle meal
    and pray, return to dance in four plazas, and later bathe, wash hair if appropriate,
    and carry paraphernalia to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The summer solstice section says the pe'kwin continues daily visits to a petrified
    stump to offer meal and prayers to the rising sun, observes Great Mountain from
    a shrine at Ma'sakia, and identifies summer solstice by the setting sun striking
    a point on a mesa northwest of Zuñi.
  category: sequence
  evidence_refs:
  - ev:9
