candidate_motifs:
- id: motif:1
  label: world set on fire before renewed sacred events
  taxonomy_refs:
  - world_destroying_fire
  basis: The passage opens by dating the events four years after U'yuyewi and Ma'sai'lema
    set fire to the world.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The excerpt only mentions the world fire as background and does not narrate
    the burning itself.
- id: motif:2
  label: sacred being leaves place where it is undervalued
  taxonomy_refs:
  - departure
  basis: Turquoise says he left because he was of no value at Wehl'hlulwalla, and
    Ma'we similarly says she is too near her people to be of value and will go far
    away.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage frames this as movement for increased value, but does not
    explain the later destination within the excerpt.
- id: motif:3
  label: punitive confinement followed by serpent transformation
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: The Bow priests and women are struck by stones, sealed inside a home by a
    rock, die after four days, and are found transformed into rattlesnakes.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The transformation occurs after death; the passage does not describe voluntary
    shapeshifting by these figures.
- id: motif:4
  label: divine mother escorted by war gods
  taxonomy_refs:
  - mother_goddess
  basis: The Gods of War address Ma'we as Mother and accompany her when she leaves
    Kia'nanaknana.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports a mother role title but does not provide a broader
    theology of Ma'we in this excerpt.
- id: motif:5
  label: clan obligation established by ancestral instruction
  taxonomy_refs:
  - covenant
  basis: Ma'we tells a Frog clan youth that his people should come in four years to
    put her house in order, and the passage states that the Frog clan has cared for
    the spring since then.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The instruction functions like an obligation, but no formal covenant language
    appears in the passage.
- id: motif:6
  label: ritual exchange with water powers for rain and crops
  taxonomy_refs:
  - sacred_exchange
  - water
  basis: Participants offer la'showawe and te'likinawe, deposit bowls and plume bundles
    in the spring, and the pe'kwin prays that the u'wannami will water crops and bring
    wellbeing.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage describes a ritual offering and prayer; it does not narrate
    a direct response from the u'wannami.
- id: motif:7
  label: bird-form transformation and landscape marking
  taxonomy_refs:
  - shapeshifter
  basis: Ma'we and Turquoise assume bird form; Ma'we passes through rock, leaves an
    opening, and her eagle plume petrifies as a visible monument.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: Only Ma'we's rock opening and plume monument are explained here; the stated
    title of Salt Lake origin is not fully narrated in this excerpt.
- id: motif:8
  label: death as sleep followed by awakening in a named place
  taxonomy_refs:
  - death_rebirth
  basis: The pe'kwin's prayer asks that the people may not die but sleep to awake
    in Ko'thluwala'wa.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: This is part of a ritual prayer rather than a narrative account of an
    actual death and rebirth.
