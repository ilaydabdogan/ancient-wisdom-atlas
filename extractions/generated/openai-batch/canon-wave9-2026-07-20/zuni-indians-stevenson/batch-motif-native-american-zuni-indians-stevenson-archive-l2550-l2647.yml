canonical_text:
  quote: ''
  summary: The passage recounts events after U'yuyewi and Ma'sai'lema set fire to
    the world; Turquoise leaves Santo Domingo after mistreatment and describes the
    death and transformation of Bow priests and women into rattlesnakes. Ma'we, accompanied
    by Turquoise and the Gods of War, leaves the spring at the black rocks, instructs
    the Frog clan to care for her house, and the passage describes the Frog clan's
    ritual cleaning of Kia'nanaknana with bowls, plumes, prayers for rain and crops,
    and offerings to the water beings. Finally Ma'we and Turquoise become birds; Ma'we
    passes through a rock, leaves an opening, and drops an eagle plume that petrifies
    into a monument.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: U'yuyewi and Ma'sai'lema are said to have set fire to the world four years
    before the main events at Kia'nanaknana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kia'nanaknana is identified as a spring at the black rocks, about five miles
    east of present Zuni, and as the home of Ma'we'sita.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: "'Hli'akwa, Turquoise, comes to the black rocks from Wehl'hlulwalla and says
    he left because he was treated as of no value there."
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Turquoise reports that the elder and younger brother Bow priests gave him
    to women as payment for granting their evil desires.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A bird shoots small stones from its mouth at the Bow priests and women as
    they enter Turquoise's home, and another bird causes a rock to fall over the entrance,
    leaving only a crevice for bread and water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After four days of confinement, the Bow priests and women die; when the rock
    is removed, they have become large, short, thick-bodied rattlesnakes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ma'we says she is too near her people to be of value and declares that she
    will go far away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Gods of War address Ma'we as Mother and say that if she goes far away
    she will be of much greater value; they leave Kia'nanaknana with Ma'we and Turquoise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before leaving, Ma'we tells a youth of the Frog clan that in four years his
    people should come and put her house in good order.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people of the Frog clan have since taken great care of the spring.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kia'nanaknana is described as sacred to the A'shiwanni and as a basin with
    terraced ledges beneath the water.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The spring is cleaned after installation of a new pe'kwin and at other necessary
    times by members of the Frog clan and their immediate families under the pe'kwin's
    order.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Each participant carries a bowl with four la'showawe and four te'likinawe
    wrapped in corn husks; the la'showawe are offered to deceased A'shiwanni and the
    te'likinawe to the u'wannami of the four regions.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the spring the pe'kwin offers a prayer for rain and crops and directs the
    men to enter the water and clean the spring by filling vessels passed to the women.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After cleaning, participants attach la'showawe to bowl openings, and the pe'kwin
    deposits the bowls on underwater terraces already covered with bowls from earlier
    times.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The pe'kwin bunches the te'likinawe, attaches a heavy stone, casts the bundle
    into the center of the shallow water, and prays for the u'wannami to bring water,
    plentiful crops, happiness, and awakening in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: On leaving Kia'nanaknana, Ma'we and Turquoise assume the form of birds.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: In flight, Ma'we strikes a projecting rock, passes through it, and leaves
    an opening.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: Ma'we drops the eagle plume tied to her hair; it petrifies upright in the
    ground and becomes a monument many feet high.
  category: action
  evidence_refs:
  - ev:13
