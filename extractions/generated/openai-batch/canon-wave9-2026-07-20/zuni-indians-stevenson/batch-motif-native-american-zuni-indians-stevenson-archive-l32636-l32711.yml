canonical_text:
  quote: ''
  summary: The passage describes closing-day ceremonial dancing around the scalp pole,
    arrow gestures before a cloud symbol, gift distribution, a procession of women
    bringing food, prayers and a transfer of sacred breath, food offerings near the
    scalp pole and meal painting, removal of arrows from the mouths of the victor
    and his elder brother, communal feasting, and renewed dancing with the arrival
    of the pu'moklaklanawe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nightly dancing around the scalp pole arouses the people, and the closing-day
    dances intensify the excitement; infants observe without fear while mothers show
    intense interest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ha'shiya continue dancing during the described sequence.
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: A warrior waves one or more arrows four times from right to left over the
    cloud symbol and throws them toward the pu'panakwe on the west side; a choir member
    retrieves the arrows, waves them four times from left to right over the cloud
    symbol, and carries them to his seat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Warriors, their relatives, and friends throw gifts including calico and other
    items; each caught gift is waved over the meal painting from left to right and
    later divided among the ha'shiya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before sunset two files of sixteen women each enter the plaza carrying bowls
    or baskets of food on their heads and wearing ceremonial clothing and ornaments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One file of women is led by the elder brother to the victor through the northeast
    entrance and deposits food near the pu'panakwe on the east side; the other is
    led by the victor through the southwest way and deposits food near the pu'panakwe
    on the west side.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The drummers pray with the elder brother and the victor, then clasp each woman’s
    hands and move their hands before her lips so she may draw sacred breath or what
    is good from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some bowls of food are placed near the meal painting for the A'shiwanni and
    warriors, while remaining food is eaten by the pu'panakwe and associated officers
    on the east and west sides.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before the pu'panakwe eat, a drummer puffs cigarette smoke over a hooped drumstick
    lying on the drum and prays.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pa'mosona places food in a basket containing the red he'we north of the
    scalp pole, and the vice pa'mosona places food in a corresponding basket to the
    south; additional food from east-side and west-side vessels is placed in the north
    and south baskets respectively.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After returning to the plaza, the victor and the elder brother stand west
    of the meal painting facing east, and the pe'kwin removes arrows from their mouths.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The victor and elder brother, who have not eaten or drunk during the day,
    eat the feast; afterward the A'shiwanni, warriors, populace, and pu'panakwe partake
    of or distribute remaining food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the repast, the ha'shiya resume dancing and the pu'moklaklanawe enter;
    many women carry an arrow and take and eat leftover food as they proceed.
  category: sequence
  evidence_refs:
  - ev:6
