canonical_text:
  quote: ''
  summary: The passage first notes household fear of the fraternity's powerful medicine
    during an observer's attempt to photograph and enter ceremonial spaces. It then
    describes a Hle'wekwe ceremony in which a sacred et'tone is placed in a maiden's
    hands, carried with bow-and-arrow escorts from the ceremonial chamber to the plaza,
    joined by four clan-associated et'tone bearers, and accompanied by prayer-plume
    offerings for snow. In the plaza, decorated boxes, notched sticks with deerleg
    bones, a spruce twig, meal, corn pollen, an eagle plume, and a purple wicker basket
    are arranged. Three O'he'wa ki'wi'sine musicians play notched sticks, their music
    said to be controlled by Beast Gods, while the sacred objects and weapons are
    moved in time with song from dawn until sunrise.
  language: English
  quote_policy: summarized
