canonical_text:
  quote: ''
  summary: The passage explains how the A'shiwi received clan names at Han"lipinkia,
    how clan totems were selected from visible objects or animals and carved on rock
    walls, how fraternity offices became associated with particular clans, how the
    Dogwood clan first prepared prayer plumes, and how the Dogwood clan was divided
    after two eggs in a sacred basket hatched into a raven and a macaw.
  language: English
  quote_policy: summarized
