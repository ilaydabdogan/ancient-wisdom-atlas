canonical_text:
  quote: ''
  summary: The passage describes a rock and cave shrine with hand impressions, masks,
    animal and deity figures, a Plumed Serpent image, pits linked to springs, and
    ceremonial seats. It then lists monthly spring visits, identifies a cave shrine
    as symbolizing the Middle of the world, and describes a forty-nine-day countdown
    before the coming of the Sha'lako, with cords, prayers, offerings, rehearsals,
    a timing dispute, and a disciplinary council concerning a ritual officeholder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cave rock above Water-cress spring is described as a shrine with a projecting
    ledge, roofed arch, and hand impressions made with brownish-red paint.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rock bears masks of anthropic gods, a central Ko'yemshi mask, a long Ko'loowisi
    Plumed Serpent image, cougars, game animals, and O'lolowishkia with conspicuous
    generative organs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pits near each end of the rock indicate different springs of the Council of
    the Gods, and stone seats are described for Sa'vatasha, others, and the Sha'lako.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: From March through October, named springs and shrine places are visited, many
    associated with named mountains or mesa locations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cave in the rocky wall above Hal'on kwa'ton is said to have symbolized the
    Middle of the world to the A'shiwi when they lived on To'wa yallanë.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Forty-nine days before the coming of the Sha'lako, ritual leaders assemble
    at sunrise in the ceremonial chamber of the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pe'kwin and Ko'pekwin each tie forty-nine knots in a white cotton cord
    to denote that the gods will come in forty-nine days; a turquoise or ko'hakwa
    bead is placed near the first knot.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: One cord is given to the personator of Sa'yatiisha and the other to Great
    Father Ko'yemshi; they go to Ku'shilowa and pray.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The Council of the Gods, Ko'yemshi, and the Sha'lako visit Hal'on kwa'ton
    in the evening and deposit te'likinawe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Until the coming of the Sha'lako, there are continual meetings and rehearsals
    of songs and prayers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A disagreement occurs over whether the proper time for the coming of the Sha'lako
    has been counted correctly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man chosen to personate Shu'laawi'si is accused, tried by a council, found
    guilty, expelled from office, and replaced.
  category: action
  evidence_refs:
  - ev:8
