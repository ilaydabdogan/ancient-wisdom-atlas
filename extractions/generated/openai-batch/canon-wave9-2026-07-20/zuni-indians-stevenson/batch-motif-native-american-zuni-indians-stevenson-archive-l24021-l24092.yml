canonical_text:
  quote: ''
  summary: The passage describes a Zuñi Kabkit rabbit hunt ordered by the governor
    and treated as religious. It occurs after harvest as thanksgiving for crops. Preparations
    include yucca hair washing, feast preparation, and rabbits hung for hunters' luck.
    Hunters assemble with rabbit sticks, stop at a knoll for prayers led by Ko'yemshi
    officiants, and proceed on foot to a fire in a cedar tree, where prayers and bread
    offerings are directed to the dead, ancestors, fire, the Council of the Gods,
    and rain-makers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kabkit hunt is described as governor-ordered and religious, in contrast
    to another rabbit hunt ordered by certain priests.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunt occurs in the Pescado, Nutria, and Ojo Caliente farming districts
    immediately after the corn and wheat harvest as thanksgiving for abundant crops.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men preparing for the ceremony had washed their hair in yucca suds, and the
    passage states that no one can take part in any ceremony without first washing
    the hair in yucca.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A jack rabbit and a cottontail were suspended from house beams, reportedly
    by order of the Ko'yemshi for hunters' good luck, and were not to be removed until
    after the hunt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the command to begin, village men mounted horses with rabbit sticks, many
    carrying two.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Zuñi women generally did not accompany the party, but a young bride rode behind
    her husband after persuasion.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a knoll, the Great Father Ko'yemshi, his deputy, and a man of the San'iaklakwe
    fraternity sat at the base of a piñon tree; the Great Father and deputy faced
    opposite directions and clasped hands.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Great Father whispered a long prayer; at the end of each stanza the deputy
    and fraternity man repeated Athlu, and a breath-inhalation gesture was performed
    before the deputy repeated the prayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prayers are described as thanksgiving for crops and health and as petitions
    that the ancients bless future crops, preserve the people, and allow them to awaken
    as little children in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The knoll ceremony closed with a smoke in which all joined.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two Ko'yemshi and the fraternity man led the way on foot to a fire burning
    in a cedar tree; the text explains that they walked because the A'shiwi had no
    horses when the world was new.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Near the fire, the three men prayed to the dead and sought ancestral intercession
    with the Council of the Gods so that rain-makers would water the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Bread was thrown into the flames while the fire was called to eat and convey
    the spiritual essence of the food to the dead; hunters also received bits of bread
    and threw them into the fire with prayers.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
