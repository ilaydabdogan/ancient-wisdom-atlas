candidate_motifs:
- id: motif:1
  label: ritual extraction of illness material
  taxonomy_refs: []
  basis: The theurgist handles material supposed to have been extracted from the girl's
    heart and removes it in a corn husk.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage reports the material as supposed to have been extracted; it
    does not provide a mythic explanation for the substance.
- id: motif:2
  label: four-direction ritual action
  taxonomy_refs: []
  basis: Ashes are sprinkled toward the four regions, and the patient is made to drink
    four times from the medicine bowl.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The meaning of the number and directions is not explained in the passage.
- id: motif:3
  label: witchcraft accusation after harmful touch
  taxonomy_refs: []
  basis: The girl says the accused boy grabbed her hand and that she began trembling
    after he touched her; the family and warriors treat this as an accusation of witchcraft.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The narrator notes that the child was rational and later doubts the boy's
    narrative, so the passage does not verify the efficacy of the alleged witchcraft.
- id: motif:4
  label: secret initiation into forbidden medicines
  taxonomy_refs:
  - initiation
  - forbidden_knowledge
  basis: The boy says a fraternity director asked whether he wished to learn secrets
    of witchcraft, led him at midnight to an inner room, and taught hidden root-medicine
    procedures.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: This is embedded in the accused boy's testimony, which the narrator treats
    skeptically.
- id: motif:5
  label: love philter used for erotic control
  taxonomy_refs: []
  basis: The boy says he requested love philters to captivate girls and was taught
    to chew root medicine and transfer it through hand contact.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage records the claimed procedure but does not independently confirm
    that it works.
- id: motif:6
  label: counter-medicine that reverses harmful magic
  taxonomy_refs: []
  basis: The director is said to give a root medicine to counteract the other, and
    the accused later produces a three-piece root said to reverse the insanity-producing
    root.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: The claimed counter-effect is asserted by the accused boy and not completed
    in the truncated passage.
- id: motif:7
  label: ritual offering with directional orientation
  taxonomy_refs:
  - sacred_exchange
  basis: The director prepares plume offerings and instructs that they be planted
    under a rock ledge with the plume-stick eyes looking west and not toward the sun
    to avoid offending Sun Father.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage describes the offering action but does not explain its recipient
    or exchange logic in detail.
- id: motif:8
  label: ordeal or demanded manifestation of claimed power
  taxonomy_refs: []
  basis: The warriors demand proof and a manifestation, after which the boy produces
    roots and begins a demonstration with sacred meal.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage ends while the boy is beginning the demonstration, so the
    outcome is not included.
comparison_claims:
- id: claim:1
  claim: 'Within the passage, the reported Santo Domingo instruction and the Zuñi
    trial narrative are connected through the same alleged technique: medicated hand
    contact causing disorder in girls.'
  claim_level: same_function
  target: internal pattern of love-medicine or witchcraft touch causing physical and
    mental disturbance
  evidence_refs:
  - ev:4
  - ev:7
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The comparison is internal to the passage, and the narrator explicitly
    suggests that the boy may have shaped his story from observing the sick girl.
- id: claim:2
  claim: The boy's testimony supports only a cautious inter-pueblo contact claim,
    since he says the secret medicine knowledge came from a Santo Domingo Galaxy fraternity
    director.
  claim_level: historical_contact
  target: Santo Domingo Galaxy fraternity secret medicine instruction as reported
    in the boy's testimony
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:11
  confidence: low
  limitations: The account is attributed to the accused boy under pressure and is
    questioned by the narrator; it should not be treated as independent evidence of
    actual Santo Domingo practice without corroboration.
