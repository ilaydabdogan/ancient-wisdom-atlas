canonical_text:
  quote: ''
  summary: A theurgist completes a treatment for an ill girl using ashes, a medicine
    bowl, eagle plumes, and a corn husk. A trial of an accused boy follows. The girl's
    grandfather and parents accuse the boy of causing her trembling and mental disturbance
    by touch. After long silence, the boy narrates that a Santo Domingo Galaxy fraternity
    director taught him and a companion secret root medicines for captivating girls,
    including a counteracting root, plume offerings, medicine suds, and a hand-contact
    method. He describes two maidens becoming violently disordered and dying after
    the medicine was used. The warriors demand proof, and the boy produces two kinds
    of roots and begins a demonstration with sacred meal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashes are taken from the fireplace, deposited by a meal line, and sprinkled
    toward the four regions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl is compelled to drink four times from a medicine bowl, while her
    mother also gives her water mouth-to-mouth to relieve thirst.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theurgist lifts material said to have been extracted from the girl's heart
    with two eagle plumes, places it in a corn husk, and carries it from the room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the treatment, the accused boy is seated closer to the warriors and
    questioned in a trial setting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grandfather says the boy accosted the girl near her house and that she
    returned in a demented condition.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy denies knowing anything of witchcraft before later giving a detailed
    account.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: The girl says the boy wanted her to go with him, grabbed her hand when she
    refused, and that she began to tremble after he touched her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The court repeatedly threatens or urges the boy to speak; he remains silent
    for about half an hour with his head bowed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy says that in Santo Domingo a director of the Galaxy fraternity offered
    to teach him and a companion secrets of witchcraft.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy says the director used two round hide cases containing many medicines
    and prepared root medicines in two bowls for the two learners.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The instructed use of the root medicine is to bite a small quantity, chew
    it, spit it into the hands, rub the hands together, and shake hands with the desired
    girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A second root medicine is described as counteracting the effect of the first.
  category: object
  evidence_refs:
  - ev:7
  - ev:12
- id: obs:13
  text: The director prepares plume offerings and later directs the learners to plant
    them under a rock ledge with the eyes of the plume sticks looking west, not toward
    the sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At daybreak, root medicine is placed in water and stirred with a reed until
    suds rise high, described as like a mountain, and the learners are bathed in the
    suds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Two maidens carrying water vases are approached after the boys chew the medicine
    and rub their hands; the boys shake hands with them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The maidens are described as feeling their hearts flying around, turning like
    tops, briefly sleeping, throwing their arms about, running through the streets,
    and later dying.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The narrator states that the boy seemed to have incorporated observations
    of the sick girl into his story and to have strategically claimed a counteracting
    medicine.
  category: other
  evidence_refs:
  - ev:11
- id: obs:18
  text: The warriors demand to see the medicine; the boy returns with two kinds of
    roots, one in a single piece and one in three pieces.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: The boy claims that he can make himself crazy and well again at will depending
    on which root he uses.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:20
  text: For a demanded manifestation, the boy removes most clothing, asks for sacred
    meal, sprinkles it on the floor, and examines the roots.
  category: action
  evidence_refs:
  - ev:13
