canonical_text:
  quote: ''
  summary: The passage surveys Zuni medical practice, including plant medicines, theurgists,
    witchcraft explanations of disease, crystal diagnosis, the use of jimson weed/a'neglakya
    in healing and rain rites, and a legend in which a brother and sister are banished
    into the earth and become the a'neglakya plant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zuni therapeutics are described as including both fetishistic/theurgic practice
    and practical plant medicines, sometimes administered without prayers or incantations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some medicines are associated with the doctrine of signatures, the Beast Gods
    of the six regions, snake medicine, ant medicine, medicine of the feathered kingdom,
    and a mythical plant with blossoms of six-region colors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For complicated or mysterious illness, the passage says a higher power is
    called on to remove disease described as having been shot into a person by witchcraft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Theurgists are described as agents through whom the Beast Gods act, and accusations
    of witchcraft may be directed at a selected man or woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Zuni theurgists explain disease as foreign life shot into
    the body by witches and use a crystal held in light to look into the flesh and
    locate disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports ceremonial peyote use among the Kiowa and other southern
    plains groups, while saying the Zunis do not know peyote but use jimson weed/a'neglakya.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Jimson weed/a'neglakya is described as used by the Zunis as a narcotic and
    externally for wounds and bruises, with blossoms and root ground to powder.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rain priests put powdered a'neglakya root into their eyes, ears, and mouth
    to commune with the feathered kingdom and pray that birds sing for rain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A small piece of a'neglakya root is chewed when someone wishes to commune
    with spirits of the dead so that rains may come.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the associated legend, a brother and sister named A'neglakya and A'neglakya'si'sa
    walk about, look everywhere, see everything, and tell their mother what they saw.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The brother and sister displease Kow'wituma and Wats'usi, the Divine Ones,
    are banished into the earth, and become the plant bearing their name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The plant is said to have many plant children, with blossoms described as
    white, blue-tinted, or edged with yellow, blue, or red.
  category: attribute
  evidence_refs:
  - ev:8
