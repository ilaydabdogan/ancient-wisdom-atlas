canonical_text:
  quote: ''
  summary: The passage describes the ritual status and collection of A'neglakya, its
    use as a narcotic in medical treatment, its administration by a rain priest for
    identifying a thief through intoxicated speech, subsequent purging and washing
    rites, gift-giving and communal food, and brief notes on Zuñi medical practice
    including a pneumonia treatment involving a cougar fetish and medicine bags.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A'neglakya is described as belonging to rain priests and to directors of the
    Little Fire and Cimex fraternities, and only those to whom it belongs may collect
    it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four prayer plumes are made before gathering the plant: one for A''neglakya,
    one for A''neglakya''si''sa, and two for ancestors.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer plumes are planted at daylight in an excavation made with an ancient
    bean planter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nai'uchi, a theurgist of the Little Fire fraternity, administered the narcotic
    before operating on a woman's breast abscess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The surgical patient slept through the painful operation and showed no evidence
    afterward that she had been under a drug's influence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: For recovering stolen property, a rain priest is received at night in a dark
    inner room without fire or light.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man who lost property wears new white cotton clothing and new blue knitted
    leggings, with no head-kerchief or moccasins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The rain priest places a bit of A'neglakya root in the man's mouth so that
    he may become intoxicated and see the one who robbed him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the night, the rain priest listens from another room and treats the
    name called by the intoxicated man as the thief's name.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: At daylight, the rain priest wakes the man, leads him to the front room, sits
    with him facing east, and reports what he heard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man denies recollection of what occurred during the night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The rain priest makes a fire, heats water, and has the man drink warm water
    four times to induce vomiting and expel the A'neglakya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Female family members prepare yucca suds and wash the man's head while he
    kneels on a blanket and the rain priest sits behind him with hands on his shoulders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The rain priest gives four tied ears of corn, calico, and other presents,
    and the corn is planted separately the next season.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: Food prepared during the night is eaten by all present after the washing and
    gift-giving.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The property loser goes to the named person and demands his property, saying
    he saw the person while drunk with A'neglakya.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: If guilty, the accused returns the property from fear of offending A'neglakya.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: A Zuñi doctor treating outside the ceremonial chamber is paid according to
    reputation, but no charge is made when treatment occurs during an esoteric fraternity
    meeting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: The passage states that a Zuñi doctor generally does not practice in his own
    family except in rare instances.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: In a pneumonia case, the theurgist held the patient's hand, placed a cougar
    fetish and medicine bags in a basket tray, and held the fetish near his lips.
  category: action
  evidence_refs:
  - ev:8
