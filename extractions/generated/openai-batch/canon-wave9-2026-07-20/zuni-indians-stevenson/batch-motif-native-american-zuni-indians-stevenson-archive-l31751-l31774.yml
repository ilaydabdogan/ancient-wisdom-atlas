canonical_text:
  quote: ''
  summary: After an arrow is shot as a sign of the enemy's destruction, bits of scalp
    are attached to a pole and the pole is planted in the plaza center. The pole,
    the victor, and the elder brother are subject to touch restrictions, and the victor
    and elder brother guard it in turns. Bow priesthood members and others circle
    the village four times in coil fashion, feast in a ceremonial chamber, and later
    the populace dances around the scalp pole through the night for twelve nights.
    A note says the coil, sometimes squared by the Zunis, is a concealed-significance
    seal of the A'shiwi and marks their former passage and land ownership.
  language: English
  quote_policy: summarized
