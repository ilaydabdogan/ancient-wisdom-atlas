  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1879 seven albino individuals were reported among the Zuñi.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mr Stevenson gathered six albino individuals for a photograph, while the mother
