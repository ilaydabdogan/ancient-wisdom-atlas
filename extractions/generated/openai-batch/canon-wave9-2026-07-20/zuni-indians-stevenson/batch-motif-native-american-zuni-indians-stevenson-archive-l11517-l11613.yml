canonical_text:
  quote: O'WIXAHAI'YE. THANKSGIVING FESTIVAL FOR CROPS
  summary: The passage describes a Zuñi post-harvest ceremony organized by the Bow
    priesthood with participation by other ritual offices. It details cigarette preparation
    and distribution, notification of young women for dancing, song composition for
    harvest thanksgiving and war prayers, the preparation of warrior wands, and the
    Great Mother grinding meal in the ceremonial chamber.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The plate caption identifies idols removed from a cave shrine of Pa'yatamu
    for photography.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony has no fixed time, depends on the harvest, and occurs after the
    crops are gathered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony is described as an annual occurrence of the Bow priesthood, with
    the Ant fraternity also taking part because of its relation to the Bow priesthood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother Bow priest decides the festival time and requests a meeting
    of the first body of A'shiwanni with the scalp custodian and his deputy in the
    house of the Priestess of fecundity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each A'shiwanni makes a reed cigarette of specified length, fills it with
    native tobacco, paints it the color of the region assigned to him, and wraps it
    in a corn husk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The elder and younger brother Bow priests make two additional cigarettes and
    give them to the scalp custodian and his deputy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kia'kwemosi collects the A'shiwanni cigarettes and tells the scalp custodian
    to find one good man from each ki'wi'sine to notify people of the festival and
    select girls for the dance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The scalp custodian and his assistant distribute selection duties across ki'wi'siwe
    associated with South, East, Nadir, North, West, and Zenith.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The scalp custodian and assistant keep their cigarettes in their homes for
    seven nights; on the eighth night they take them to their ki'wi'siwe, light them,
    and those present take a whiff.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Selected men notify young women to assemble in the south and west ki'wi'siwe;
    the young women gather for four nights, dance each night, and do not sing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Song-makers from several ki'wi'siwe gather in dwellings for four nights to
    compose songs, and the best songs are adopted.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The songs for the occasion are described as thanksgiving for the harvest and
    thanks for respite from the Navaho, with prayers to the Gods of War that the enemy
    may be destroyed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Members of the Bow priesthood gather in their ceremonial chamber, each bringing
    a warrior wand; the wands are placed in an Apache basket with feather ends radiating.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The warrior wand foundation is a blue-green zigzag slat said to symbolize
    lightning, with medicine applied and eagle plumes and other feathers added until
    the lightning stick is hidden.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Some wands have red or black cloth and cotton cord at the base, and specific
    wands are distinguished by additional feathers, abalone shell, or crystal.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The wands are usually worn on top of the head extending outward from the back
    and are stated to symbolize the heart or seat of life.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: The elder brother Bow priest places a package of commercial tobacco in the
    center of the basket containing the plumes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: A'wan Si'ta, called Great Mother and mistress of the ceremonial chamber, grinds
    meal for the warriors at a mill at the east end of the room.
  category: action
  evidence_refs:
  - ev:12
