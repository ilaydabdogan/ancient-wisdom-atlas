candidate_motifs:
- id: motif:1
  label: post-harvest thanksgiving ceremony
  taxonomy_refs:
  - seasonal_cycle
  basis: The ceremony occurs after crops are gathered and includes songs of thanksgiving
    for the harvest.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage describes this specific Zuñi ceremonial context; broader seasonal-cycle
    classification should not imply identity with unrelated harvest rites.
- id: motif:2
  label: ritual tobacco distribution and communal smoking
  taxonomy_refs:
  - sacred_exchange
  basis: Cigarettes are ritually prepared, transferred among officials, retained,
    carried to ki'wi'siwe, lit, shared by whiffing, and then distributed.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents procedural transfer and shared use of tobacco but
    does not explicitly interpret it as exchange.
- id: motif:3
  label: directional ritual organization
  taxonomy_refs: []
  basis: Selection and cigarette distribution are organized through ki'wi'siwe associated
    with South, East, Nadir, North, West, and Zenith.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage lists directional assignments but gives limited explanation
    of their doctrinal meaning.
- id: motif:4
  label: warrior life-symbol object
  taxonomy_refs: []
  basis: Warrior wands are assembled from lightning-form slats and feathers, worn
    on the head, and explicitly said to symbolize the heart or seat of life.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a passage-level ritual-object motif; no broader taxonomy reference
    is asserted.
- id: motif:5
  label: thanksgiving joined with war prayer
  taxonomy_refs: []
  basis: The adopted songs thank the harvest and respite from the Navaho, while prayers
    are addressed to the Gods of War for enemy destruction.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage reports the juxtaposition of crop thanksgiving and war prayer
    but does not generalize it beyond this ceremony.
