canonical_text:
  quote: "“what of her being she rubbed off she left with the shi'wanni whom she accompanied”"
  summary: The passage describes ritual actions in a ki'wi'sine involving Pau'tiwa,
    the pe'kwin, the A'shiwanni, Bi'sisi, and the Corn maidens. The Corn maidens are
    turned at the roof corners for rain from the cardinal directions, sprinkled with
    medicine water, sent with directional ritual authorities, and leave part of themselves
    so that different colors of corn are possessed by those authorities. Meal from
    a cloud symbol is later sent by river as an offering to the Council of the Gods,
    and the Corn maidens are invited again to dance for corn growth.
  language: English
  quote_policy: quoted
