canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial installation of an associate shi'wanni
    of the north, including assembly in the Kla'kwemosi's ceremonial chamber, ordered
    greetings and seating, removal of moccasins and head coverings, preparation of
    a buckskin with corn pollen and beads as a symbolic road, a variant sun-symbol
    arrangement for installation of a pe'kwin, prayers for blessing, rain, food, health,
    and preservation from death, and positioning of the novice on the prepared skin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An elaborate ceremonial occurs when an appointee is received as an associate
    shi'wanni; later passage from associate shi'wanni to shi'wanni is said to require
    no further special ceremonial of importance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described ceremony began about midday on December 13, 1896, in the ceremonial
    chamber of the Kla'kwemosi, where ceremonies connected with the first body of
    A'shiwanni take place.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man to be installed is described as a nephew of the Kla'kwemosi, a member
    of the Dogwood clan, married, and apparently not over twenty years old.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each shi'wanni was accompanied by male associates, and fraternity directors
    arrived with fellow officers after notification by the elder brother Bow priest;
    the Shi'wanokia and the writer were the only women present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first body of A'shiwanni, including the first associate of the Kla'kwemosi,
    the elder brother Bow priest, and the Shi'wanokia, had seats in the south end
    of the room east of the doorway; later arrivals sat on the ledge or floor.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Entering groups greeted those already present in sequence, and moccasins were
    removed after entering the chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kla'kwemosi acted as master of ceremonies until the younger brother Bow
    priest arrived; the younger brother Bow priest was responsible for seating and
    preventing sleep during the long ritual.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The associate shi'wanni to the Kla'kwemosi spread a blanket, placed a large
    fine white buckskin on it with the head to the east, received a sack of corn pollen,
    and sprinkled a straight pollen line along the skin ending at the mouth portion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Necklaces of coral, turquoise, and ko'hakwa beads were laid over the pollen
    line, forming a slight ridge; the passage states that this line symbolized the
    road of life and truth, to be followed to win the favor of A'wonawil'ona.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'For installation of a pe''kwin, a different decoration is described: a blue-green
    disk with three black dots, a surrounding black-and-white cloud-house pattern,
    and four pollen lines from the disk''s periphery.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the pe'kwin installation description, a meal line extended from the deerskin
    to the chamber entrance and was crossed near the skin; the novice stood on the
    deerskin, while the A'shiwanni and others stood on the cross line of meal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The novice was exhorted to do his duty as deputy of the Sun Father, to follow
    the straight road of the Sun Father, to remove evil or discontent from his heart,
    and to keep the path of truth and virtue.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The sun priest prayed for continued blessings from A'wonawil'ona, for the
    Sun Father not to send the rainbow to call the rain-makers elsewhere, and for
    all peoples to have food, clothing, freedom from great sickness, and preservation
    from death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The novice later sat west of the deerskin; each person removed the head-kerchief
    before taking part, and the pe'kwin took the novice's hand as the novice stood
    in the center of the skin facing east with a foot on each side of the pollen-and-bead
    line.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A footnote states that the pe'kwin to the Sun Father was supposed to practice
    celibacy and purity of heart and to keep the calendar correctly, with communal
    misfortune expected if he failed.
  category: attribute
  evidence_refs:
  - ev:8
