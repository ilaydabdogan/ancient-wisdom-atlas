candidate_motifs:
- id: motif:1
  label: novice initiation through adornment, gifts, prayers, and repeated ritual
    gestures
  taxonomy_refs:
  - initiation
  basis: The passage repeatedly identifies male and female novices, describes fraternity
    fathers and catchers presenting them with ceremonial gifts and objects, and records
    prayers and repeated object-passing rites performed over them.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is ethnographic description of a specific Zuñi fraternity
    ceremony; broader comparative use should preserve the local ceremonial context.
- id: motif:2
  label: ritual gift transfer between fraternity elders and novices
  taxonomy_refs:
  - sacred_exchange
  basis: Fraternity fathers give clothing gifts to fraternity children, catchers give
    prayer plumes and corn, and guests participate with mi'li and prayers over the
    novices.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text does not frame the exchange as reciprocal or transactional beyond
    ritual presentation; the taxonomy link is therefore cautious.
- id: motif:3
  label: ritual repetition by fixed numbers and orientations
  taxonomy_refs: []
  basis: The ceremony includes fourfold passing of the hle'et'tone, four plaza dances,
    prescribed west/northwest/northeast placements, and thirty-two outward and inward
    movements of deer-leg bones over notched sticks.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No external numerological explanation is supplied in the passage.
- id: motif:4
  label: mythic or traditional precedent enacted through object orientation
  taxonomy_refs: []
  basis: The boxes are turned bottom up so the painted heads face upward, explicitly
    in accordance with a tradition about beast god warriors looking upward to the
    heavens while people passed around them.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage reports the tradition but does not narrate the full myth or
    identify all ritual implications.
- id: motif:5
  label: animal-material implements in ceremonial performance
  taxonomy_refs: []
  basis: Two Bear clan members use deer-leg bones with notched sticks, baskets, meal,
    rattles, and repeated motions in a formal plaza arrangement.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: This is a local ritual action; no comparative animal-bone motif family
