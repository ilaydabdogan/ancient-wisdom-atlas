canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi Hle''wekwe ceremony involving male and female
    novices: gifts and feathers are presented, ritual objects are passed over their
    bodies with prayers, swords and mi''li are used in repeated gestures, a feast
    follows, and related plaza dances and sunset arrangements with meal crosses, boxes,
    baskets, notched sticks, deer-leg bones, rattles, and directional facing are performed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gifts for the novices lie folded on the hle'et'tone, with a red-dyed fluffy
    eagle plume protruding from each gift; the man's gift is a white cotton embroidered
    kilt, and the woman's is a white embroidered blanket.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The retired and active Hlem'mosona remove la'showawe from the gifts, dance
    between the fraternity lines, and tie feathers to the novices' forelocks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each fraternity father ties his gift around his fraternity child's neck, and
    the catchers present each novice with prayer plumes and four ears of corn tied
    with yucca ribbon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hlem'mosona prays and passes the hle'et'tone four times before named parts
    of the male novice's body, repeats the action over the female novice, and then
    passes his sword in the same way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each fraternity member repeats the sword ceremony over the novices, swallows
    his own sword before leaving the line, and gives the sword to the hle'pekwin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Guests and people of the house, each with a mi'li, repeat a prayer and pass
    the mi'li over each novice in the same manner as the swords.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After a feast, the novices carry their gifts home, return with the corn and
    prayer plumes, and sit on the north ledge toward the west end, with the woman
    to the right of the man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sword order of the Great Fire fraternity dances four times in the plaza
    during indoor ceremonies, while circle dancers dance during their absences.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tehl'nawe are carried from the plaza by the a'mosi, with the a'mosonokia
    walking to their right, and are returned to the roof of the ceremonial chamber
    overnight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At sunset, a fraternity member forms two meal crosses with disks near the
    northwest corner of the plaza, and boxes used by musicians are turned bottom up
    so the painted heads face upward.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A stated tradition explains the upturned paintings by saying that beast god
    warriors who accompanied the Hle'wekwe to Itiwanna looked upward to the heavens
    while people passed around them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two Bear clan fraternity members sprinkle meal, take notched sticks and deer-leg
    bones, face northeast, and place inverted baskets on disks of meal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Twelve male members, the novices, and the catchers stand behind the Bear clan
    men, facing northeast; they wear blankets and carry rattles, and the novices carry
    their corn and prayer plumes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Bear clan men rest notched sticks on the baskets and move deer-leg bones
    outward over the sticks thirty-two times and inward thirty-two times, repeating
    the movement until the music stops.
  category: sequence
  evidence_refs:
  - ev:9
