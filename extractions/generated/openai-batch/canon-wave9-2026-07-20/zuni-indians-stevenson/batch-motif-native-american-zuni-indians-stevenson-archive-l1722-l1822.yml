canonical_text:
  quote: ''
  summary: The A'shiwi continue eastward in search of the Middle of the world, accompanied
    by divine beings and war gods. A Ne'wekwe fraternity director disappears through
    a sacred spring to serve the Sun Father and establishes annual ritual personation.
    Two Kia'nakwe siblings who survived destruction by hiding in a cave leave isolation,
    identify themselves with corn and et'towe, and are received and adopted by the
    Kia'kwemosi through a Corn-clan woman. An alternate version gives a shorter account
    of the same approach and kind reception. The passage ends with the A'shiwi reaching
    He'shota'yalla, where most inhabitants have fled or died from the A'shiwi effluvium
    and the A'shiwi claim ancestral connection to the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After obstacles are removed, the main body of the A'shiwi continues eastward
    in a quest for the Middle of the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'shiwi are accompanied by the Divine Ones and by the Gods of War, described
    as born of Laughing Water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At 'Kiap'kwena, the director of the Ne'wekwe fraternity disappears through
    Lu'kiana 'kiai'a and becomes musician and jester to the Sun Father, accompanying
    him on daily travels over this world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before disappearing, the Ne'wekwe director instructs his people that he should
    be personated annually by a fraternity member, when he would be present in spirit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A footnote describes several sacred springs at Ojo Caliente, including a spring
    dedicated to Ko'loowisi, a Rainbow spring dedicated to the Sha'liiko gods, and
    Lu'kiana 'kiai'a, where a shrine appears to have been erected.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The footnote states that the Zunis claim all sacred springs are used by the
    gods to look through.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two Kia'nakwe, a brother and sister, escaped death from A'shiwi conquerors
    by hiding in a cave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The siblings subsisted for a long time on meal ground from corn left by their
    people and on rats caught by the brother and prepared by the sister.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The brother grows weary of isolation and proposes seeking kind people; the
    sister fears he will be killed, while he says it is better for both to die than
    to live alone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A youth from 'Kiap'kwena sees the brother and sister and asks who they are.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy identifies them as the last of the Kia'nakwe while holding two et'towe
    to his breast; the girl shows two ears of white corn and identifies them as Mi'kianakwe,
    Corn people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The youth tells the village about the siblings, and the Kia'kwemosi, moved
    by compassion, sends for them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Kia'kwemosi says the siblings are the same as his people, the To'wakwe,
    tells them to live with the community as children, and speaks of their future
    marriages and children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Kia'kwemosi selects a woman of the Corn clan to adopt the brother and
    sister.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: An alternate version says the boy discovers a town, the sister fears they
    will be killed, they go to the village the next morning, and the boy is kindly
    received by the Kia'kwemosi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Leaving 'Kiap'kwena, the A'shiwi migrate to He'shota'yalla and find all inhabitants
    but four either fled or dead from the A'shiwi effluvium.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: At He'shota'yalla, houses are described as made of reeds and earth, and the
    A'shiwi declare that their people built the village.
  category: speech
  evidence_refs:
  - ev:9
