canonical_text:
  quote: ''
  summary: 'The passage describes preparation of several Zuñi foods: two varieties
    of mush, he''pachiwe bread baked on stone slabs, a skinless-corn form of he''pachiwe,
    and mu''loowe light bread made for feasts. It gives procedures involving boiling
    water, slaked lime or lye, hand shaping, baking over fire or in ovens, mutton
    grease, retained leaven, and distribution of he''pachiwe cakes as gifts to the
    populace.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mu"klapawe is prepared from meal mixed with boiling water, colored with water
    from slaked lime, adjusted with cold water, shaped into large oval balls, boiled,
    and eaten cold.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mu''kialiwe is made by rolling mush into rope-like strips, breaking off bits,
    forming balls, cooking them in a small amount of boiling water, and eating the
    thickened mixture with a ladle or spoon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He'pachiwe is described as a favorite bread baked one cake at a time on a
    small stone slab supported over a low fire and rubbed with mutton grease while
    heating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman sits beside the fireplace, tends the fire, shapes dough by hand into
    round cakes, makes ridges with her fingernails, pricks air bubbles with a wooden
    pin, and places baked cakes in a flat basket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: He'pachiwe is made in large quantities when gifts are to be thrown to the
    populace, and many people show dexterity in sending cakes through the air.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chu"sikwanawe he'pachiwe is made by treating corn with diluted lye until the
    hull is shed, washing and drying the corn, grinding it, mixing the meal with water
    without salt, forming cakes, and baking them on he'pachiwe slabs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mu'loowe light bread is made at feasts, seldom otherwise, and is baked in
    ovens outside the house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: For mu'loowe, a piece of dough from one baking is reserved as leaven for the
    next, sometimes for a month or longer, then soaked, mixed into batter, covered,
    and left to rise overnight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mu'loowe bread-maker kneads dough in a large bowl, works portions on a
    wooden slab, shapes common turnover rolls, adds melted mutton grease, and lays
    rolls on a cotton cloth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Notes in the passage associate he'pachiwe with tortillas and state that Mexicans
    use a diminutive rolling-pin.
  category: relationship
  evidence_refs:
  - ev:8
