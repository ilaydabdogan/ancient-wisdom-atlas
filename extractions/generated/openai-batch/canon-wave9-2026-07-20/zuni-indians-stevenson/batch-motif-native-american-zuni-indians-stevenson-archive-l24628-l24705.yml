canonical_text:
  quote: ''
  summary: The passage describes a multi-day Hle'wekwe fraternity ceremonial sequence
    involving dawn rooftop prayers with meal, dancing with drum and rattle, sword
    swallowing, cold bathing, emetic drinking, food and contact restrictions, preparation
    and deposition of prayer plumes, ceremonial chamber wall imagery, ha'kwani cotton-loop
    objects, and a plume transfer involving the Shi'wanni of the West.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At dawn, fraternity members ascend to the housetop in small groups, offer
    short prayers, and cover a foot-sized spot with meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the last group descends, drum, rattle, song, and dance begin, and a
    sword is repeatedly swallowed during indoor dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After one dance and rooftop song, men go to the river to bathe, breaking ice
    if necessary; a note describes dancers plunging into icy water and moving barefoot
    through frozen streets.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Women and children bathe from large bowls on the chamber roof, and songs continue
    at night until the morning star rises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When male bathers return, they drink an emetic, vomit, and then take the morning
    meal brought to the hatchway by relatives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Continence, abstention from specified foods and coffee, and avoidance of touch
    by nonmembers are required for the stated ceremonial period.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:7
  text: On the first morning, male members make six te'likinawe each, assigned to
    the hle'et'tone, mu'et'tone, deceased fraternity members, and Kok'ko A'wan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two fraternity men deposit these offerings in the spring at the black rocks,
    where the original Hlem'mosona is said to have disappeared, with prayers for snows
    and cold rains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The west wall of the ceremonial chamber is decorated with sun and moon symbols,
    A'chiyala'topa, Beast and Snake Gods, the Pleiades, Orion, snakes, stars, and
    a meal cloud symbol on the floor.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the second and third days, time is spent making te'likinawe or prayer plumes,
    dancing, eating, smoking, and chanting; the Hle'wekwe also dance in the house
    where the Mu'waiye rehearse.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the fourth morning, male members again make prayer plumes, and a woman
    of the fraternity makes a ha'kwani of cotton loops symbolizing a sacred white
    blanket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Later, the Hlem'mosona, the warrior, and six Ko'loktakwe clan members go to
    the hle'et'tone's house, where men make prayer plumes to the rain-makers and women
    make ha'kwani.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Dogwood clan member visits the Shi'wanni of the West, receives a prayer
    plume, and carries it to the Hle'wekwe chamber.
  category: action
  evidence_refs:
  - ev:7
