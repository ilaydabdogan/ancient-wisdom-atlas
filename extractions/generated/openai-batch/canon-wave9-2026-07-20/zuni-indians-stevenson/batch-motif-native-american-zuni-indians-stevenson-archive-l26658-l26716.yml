canonical_text:
  quote: ''
  summary: The passage describes preparation of the Great Fire Fraternity altar and
    sand painting, the making of pigments and prayer plumes, placement of fetishes
    and ritual objects, an offering of food before the altar, evening reassembly for
    the first night, seating of members, novices, invalids, and officers, and bodily
    adornment with white paint.
  language: English
  quote_policy: summarized
