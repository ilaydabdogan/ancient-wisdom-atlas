canonical_text:
  quote: ''
  summary: On the eleventh day, several ceremonial dances occur in chambers, streets,
    courts, and plazas. Dancers wear elaborate regalia, carry weapons, sing for the
    enemy to be destroyed, move through the village, dance around a scalp pole, stage
    flight from Navaho fire, and continue a public dance until dawn. A'shiwanni and
    Bow priests also prepare prayer plumes and offerings to the Gods of War, using
    feathers, paint, cotton cord, shells, corn husks, and yucca thread.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the eleventh day the ha'shiya dance first in a chamber on the west side
    of the plaza and then in the plaza, wearing elaborate dress and spread-eagle tails
    on their heads for the first time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The o'tulasho'nakwe is repeated on the eleventh day; men are elaborately dressed,
    the dance leader carries a spear decorated with raven plumes and an eagle tail
    feather, and participants carry guns, pistols, hatchets, or hammers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Girls in the o'tulasho'nakwe wear black gowns, white blankets bordered in
    red and blue, white buckskin moccasins, leggings, and bead necklaces; both men
    and women wear many bead necklaces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The o'tulasho'nakwe dance begins before 5 o'clock in the afternoon at the
    house of the elder brother Bow priest, where the dancers form a square and perform
    a meander figure with hop steps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the o'tulasho'nakwe, only the men sing; women move their arms outward and
    upward with a shaking motion, and the men extend the right arm while singing for
    the enemy to be destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The o'tulasho'nakwe dancers proceed through village streets, covered ways,
    the sacred dance court, a house associated with the Shi'wanni of the East, and
    plazas, sometimes moving in single file and repeating the meander figure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At dusk the pu'mokiaklanawe enter the plaza from the northeast and southwest,
    advance facing each other in two lines of fifty, and then dance sidewise across
    the plaza.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pu'mokiaklanawe party includes men, women, and children of both sexes
    and all ages; men carry bows and arrows, guns, or pistols, and there is continuous
    firing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After crossing the plaza, the pu'mokiaklanawe pass around the scalp pole,
    form two broken opposing circles with the drummer in the inner circle, and dance
    around the pole while firearms and clubs are brandished.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some dancers leave by the western covered way; one fires a gun, and all run
    up the street, saying that they flee from the fire of the Navaho, while spectators
    deride them as cowards.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the dance, a crier calls the populace close around the pole to dance;
    children and elders scramble for places, the circle grows large, and the dance
    continues until dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the eleventh day the first body of A'shiwanni prepare prayer plumes in
    the ceremonial chamber of the Kia'kwemosi, each making four.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Shi'wanni of the Nadir, acting as elder brother Bow priest, and the younger
    brother Bow priest each make four additional offerings to the Gods of War.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The prayer plumes use tapered sticks, attached feathers, softened quills,
    cotton cord, black paint from an archaic wooden cup, red paint from a paint stone,
    olive shells, eagle tail feathers, and plumes from male birds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: After completion, each shi'wanni wraps his prayer plumes in a corn husk and
    ties it with a yucca thread.
  category: action
  evidence_refs:
  - ev:6
