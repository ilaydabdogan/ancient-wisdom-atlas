canonical_text:
  quote: ''
  summary: The passage describes how religious dances are entered in file under a
    leader, the dress and carried objects of female and male leaders, and the He'mishiikwe
    being received by a host, equipped with distinctive dress, rattles, spruce twigs,
    masks or masked attendants, and performing a choreographed dance sequence with
    rattles, turns, hand waves, and stamping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Religious dances enter the plaza or chamber in file, led by a man or woman
    identified as the leader of the dancers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman leader wears conventional best dress, white deerskin moccasins and
    leggings, a white blanket bordered in red and blue, an eagle plume on the forelock,
    and carries her mi'li and meal basket.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women add ko'hakwa, turquoise, and coral beads to silver ornaments for ceremonials;
    finery may be borrowed, and men also secretly borrow adornments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male leader's dress permits variety but avoids apparel directly associated
    with the dress of the anthropic gods.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The male leader may wear a blanket in cold weather; a line of micaceous hematite
    crosses his face below the eyes and denotes office; he has an eagle plume and
    carries his mi'li and meal basket.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A leader serving in ceremonials is not counted among the dancers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The host of the house meets the He'mishiikwe at the entrance, carries a meal
    basket, throws a line of meal before him, and leads the dancers down the room.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each He'mishiikwe has body and limbs colored purple and wears a white embroidered
    kilt, white sash, woman's red belt, fox skin, tortoise-shell rattle, blue yarn
    with sleigh bells, and dance moccasins.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The He'mishiikwe dancing in line wear no masks on this occasion, although
    a few maskers appear with each party of dancers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each He'mishiikwe carries a spruce twig in the left hand and a pink gourd
    rattle in the right; a rectangular rope-wrapped hide drum is present.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dancers enter in single file and proceed with a raised-right-foot balancing
    step described as common in dances where anthropic gods are personated.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Four masked boys accompany the He'mishiikwe, sit on the west ledge, and two
    play notched sticks during certain parts of the dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dance sequence includes rattle shaking, hand waves to left and right,
    turning to face east and north, quick stamping four times, and a later repetition
    with eight stamps.
  category: sequence
  evidence_refs:
  - ev:8
