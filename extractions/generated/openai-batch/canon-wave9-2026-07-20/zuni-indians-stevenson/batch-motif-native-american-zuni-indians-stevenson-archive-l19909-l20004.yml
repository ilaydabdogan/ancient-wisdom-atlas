canonical_text:
  quote: ''
  summary: The passage describes Zuñi bread making, especially he'we wafer bread and
    he'vahoniwe. It details quarrying and preparing sandstone baking slabs, the whisper-only
    rule during slab dressing, the grinding, toasting, mixing, coloring, baking, folding,
    and storage of corn breads, and the reuse of leftover bread bits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zuñi women are described as taking special pride in good bread, with he'we
    wafer bread named as a household staple.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gray sandstone slabs for baking are cut from a quarry at the base of To'wa
    yal'lanne, identified in the passage as Corn mountain, and are brought home by
    men or boys before women take charge of them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The baking slab is smoothed, supported over a hearth structure, and heated
    first by a small cedar-wood fire and then by a greater fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During dressing of the slab, chewed squash seeds, piñon gum, pine twigs, and
    juniper twigs are applied until the slab appears like polished black lava.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: From the beginning to the completion of slab dressing, no word may be spoken
    above a whisper; the passage states that a raised voice would crack the stone,
    and a cracked stone without loud speech was attributed to the worker having a
    bad heart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Corn for he'we is crushed, toasted, ground through progressively finer mills,
    mixed with water, cooked into mush, and combined with uncooked meal batter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Slaked lime water may be added to produce a bluish-green bread color, and
    amaranthus may be used to color he'we red.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The maker spreads the mixture thinly over the heated slab by hand, moving
    from right to left, and the baked sheet is lifted, cooled, rewarmed, and rolled
    or folded.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Variants of he'we include bread made with bean paste or untoasted meal, with
    salt added in some cases.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Leftover bits of he'we are carefully saved, toasted, crushed, and later warmed
    in grease or moistened with water before being eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: He'vahoniwe is described as a common Zuñi bread made from corn mush, salt,
    slaked lime water, and batter, baked two cakes at a time on a stone and made thicker
    than he'we.
  category: sequence
  evidence_refs:
  - ev:8
