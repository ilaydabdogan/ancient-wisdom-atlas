canonical_text:
  quote: ''
  summary: Plate captions identify a basket of meal and corn pollen as symbolic of
    the four regions and the whole world and identify ritual fetishes. The passage
    then describes the Mu'waiye procession, choirs, bearers of et'towe and ancient
    'hla'we, repeated fourfold circling, sprinkling of meal, deposit of sacred objects
    in a Badger clan house, prayers for rain and welfare, physical purification, attachment
    of feather ornaments to ancient sticks, and final placement of objects in the
    room.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies a basket with meal crossed and encircled with corn
    pollen as symbolic of the four regions and the whole world.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maidens hold a 'hlu'sipone in each hand, and the youth holds his mi'li
    between his hands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mu'waiye advance in measured time and are followed by choir-related participants
    and a large male choir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The et'towe and 'hla'we bearers slowly circle the boxes four times and frequently
    sprinkle meal into them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a Badger clan house, the et'towe are received by four aged women, placed
    in flat baskets partly filled with meal, and arranged north-to-south in the center
    of a room; ancient 'hla'we are laid across the baskets north of the et'towe with
    tips pointing east.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mu'chailiha'nona and each fetish bearer carry a pinch of meal around the head
    four times and sprinkle it over the et'towe; meal is then sprinkled over the fetishes
    with a prayer for rains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note states that one who failed to sprinkle the meal would be troubled with
    excrescences and swellings.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the fourth circuit, the Mu'waiye leave the plaza by a street route while
    spectators stand in lines; the dancers continue dancing to the house where the
    et'towe are deposited.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When each girl is relieved of her 'hlu'sipone, it is placed with an ancient
    'hla'we, and both are passed before her lips while she inhales what the passage
    calls all that is good from them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Mu'waiye and choir take meal in the left hand, carry it around the head
    four times, and throw it over the fetishes for physical purification; afterward
    they sprinkle meal from the right hand over the et'towe with prayers for food,
    raiment, and good health.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Old women remove feather ornaments from the hair of the Mu'waiye and tie them
    to ancient 'hla'we; the choir and gathered people pray or repeat the meal actions,
    after which the et'towe, 'hla'we, and 'hlu'sipowe are placed or stood in the room.
  category: sequence
  evidence_refs:
  - ev:9
