canonical_text:
  quote: ''
  summary: The passage lists ritual participants and offices for two ceremonial sides,
    states how participants are selected and notified, gives lineage, clan, virginity,
    and fasting requirements, describes preparation and presentation of feather cords
    made from mountain bluebird feathers, and notes choir rehearsals and placement.
    Several actions are connected explicitly with rain and corn fertility.
  language: English with Zuñi ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The table organizes participants across two ceremonial sides and includes
    directors, dancers, water-sprinklers, Corn Maiden personators, a corn symbolizer,
    choirs, a drummer, and flutists.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first body of A'shiwanni are described as women who officiate with mi'waclii,
    and later as a group that feasts, retires at midnight, and gathers again at dawn.
  category: action
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: The pe'kwin, elder brother Bow priest, and A'wan mo'sona are named as selecting
    or notifying different offices and performers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sunset-dancing virgins are described as children or grandchildren of the
    first body of A'shiwanni; they must abstain for eight days from animal food and
    salt, and the passage states that if they are not virgins the green corn would
    be destroyed by worms.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sho'lipsimonthle'ona must be a son or grandson of one of the first body
    of A'shiwanni and must abstain eight days from animal food and salt.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 'kla'punakwe have clan requirements by side and must abstain from animal
    food and salt for four days beginning when they go to the pavilion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: At dawn in the Shi'wano'kia's house the A'shiwanni prepare hi'showawe or la'showane
    from mountain bluebird tail and wing feathers attached to cotton cord.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The feather pieces are joined at their quill ends to form a V; feathers for
    men are from male birds and feathers for women are from female birds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder brother Bow priest brings appointed participants, and the pe'kwin
    presents each with a la'showanne while speaking a wish for good heart, good thoughts,
    one tongue, and rain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The la'showanne is attached to the recipient's left side of the head with
    cotton cord and hair, and the passage states that these objects are later planted
    in fields with te'likinawe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The two choirs practice in separate houses after notification; on the following
    day they assemble at dawn in the Shi'waho'kla's house and take positions in different
    corners of the room.
  category: sequence
  evidence_refs:
  - ev:8
