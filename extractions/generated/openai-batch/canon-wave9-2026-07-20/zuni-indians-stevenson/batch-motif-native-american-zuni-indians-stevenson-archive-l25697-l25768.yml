canonical_text:
  quote: ''
  summary: 'An ethnographic description of a Zuñi ceremonial sequence: singers, Bear
    clan men, a fraternity warrior, object bearers, Mu''chailiha''nona, eight maidens,
    and the Mu''waiye appear in procession or dance. The passage describes ritual
    objects including rattles, notched sticks, deer-leg bones, baskets, meal, a pollen-marked
    mound, ancient hla''we, and mu''et''tone, with some objects linked to the undermost
    or lower world and one pollen design explicitly identified as symbolic of the
    four regions.'
  language: English
  quote_policy: summarized
