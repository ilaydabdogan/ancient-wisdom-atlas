canonical_text:
  quote: ''
  summary: The passage gives a ritual-mythic invocation of multiple gods and masked
    figures, including directional deer-scapula gods, gods with mask and costume attributes,
    Plumed Serpent, Suti'ki, Si'sikla, Ko'yemshi, and Kiaklo. It includes instructions
    from Pau'tiwa about travel to the Middle place, Kiaklo’s emergence and call to
    the six regions, notes on Ko'loowisi’s flood-associated origin, Kiaklo’s ascent
    to this world from the Council of the Gods, and a narrated journey along roads
    toward the Middle of the world.
  language: English with Zuni ritual terms and interlinear translations
  quote_policy: summarized
