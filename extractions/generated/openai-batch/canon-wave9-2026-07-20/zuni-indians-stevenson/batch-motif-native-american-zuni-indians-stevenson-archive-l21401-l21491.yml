canonical_text:
  quote: ''
  summary: 'The passage describes several medical cases and treatments observed among
    the Zuñi: infant illness treated by manipulation and, in another case, by an emetic;
    rheumatism treated by massage and heated sheep chips; a spinal abscess case involving
    a Zuñi medicine man, a doctress, family members, the writer, and an American doctor;
    and the beginning of a case involving jaw surgery on a Hopi man married to a Zuñi
    woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first infant case, no medicine was used; the infant was reported restored
    to normal health within an hour and was seen the next morning on its mother's
    back eating green watermelon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another infant case, Xa'iuchi manipulated the child, left for his fraternity,
    returned with an emetic mixed in warm water, administered it with a reed, instructed
    the mother to repeat the dose, and the infant improved after vomiting and nursed
    from the mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Massage is described as treatment for rheumatism, and heated sheep chips sprinkled
    with water are described as an external heat treatment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A girl injured by a ladder fall developed spinal curvature and later a large
    lumbar abscess; her wound had been packed with piñon gum, squash seed kernels,
    and mutton grease, and wrapped in a thick cotton bandage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer sought help from Doctor Wood of the Indian Service after observing
    the girl's condition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl's parents were distressed and willing to obey instructions, while
    other family members feared offending the doctor already treating her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The attending medicine man initially objected to interference by the American
    doctor but later participated in positioning the girl and removing the wound packing
    while a doctress heated water.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Doctor Wood treated the cleaned wound with boracic acid and aseptic gauze;
    the girl later reported reduced pain, remained in relative comfort for two days,
    and died.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The writer states in a note that she had never known a family member to interfere
    with a theurgist's treatment and that no precautions were taken to prevent cholera
    infantum among Zuñi children.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Hopi man who had long been married to a Zuñi woman fell from a wagon, broke
    his left jaw, and had the inferior maxillary bone removed, leaving a cicatrized
    fistular opening in the cheek.
  category: sequence
  evidence_refs:
  - ev:9
