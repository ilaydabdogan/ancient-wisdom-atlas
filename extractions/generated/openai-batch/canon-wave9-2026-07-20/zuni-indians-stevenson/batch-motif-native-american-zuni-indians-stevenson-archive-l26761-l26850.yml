canonical_text:
  quote: ''
  summary: The passage describes a Zuñi fraternity ceremony in which novices dance,
    ritual specialists practice healing and extraction rites before an altar, ashes
    and eagle-wing plumes are used in a procession, material from a dry painting is
    applied to novices' hearts, and theurgists ritually remove evil from the heart
    and deposit it in a bowl. The novices later pray at the altar, and an ash purification
    rite is repeated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three novices dance in line before their seats, facing east and then west.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two men leave the choir, move in a skipping and hopping manner, make beast-like
    gestures before the altar, and are described as becoming abiding places of the
    Beast Gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During healing, theurgists suck at exposed parts of invalids' bodies, eject
    material into their hands, and appear to deposit the material in a large bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After completing disease-drawing, each theurgist coughs, gargles water from
    a gourd, and expectorates into the bowl.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Mother gives ashes to officers and choir members, and she and two
    fraternity fathers hold eagle-wing plumes and ashes while forming a line near
    the novices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each novice catches the tips of the eagle-wing plumes held by her fraternity
    parent; the youngest child is raised and secured to the fraternity father's back
    with cotton cloth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fraternity parents seat the novices before the altar, place their feet on
    either side of the child, draw the novice's head back to the bosom, and cover
    the novice's eyes with their hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A warrior wearing a war pouch and plume wand dances before the novices, uses
    eagle-wing plumes, slips a bear's foot skin on his left hand, and takes small
    mounds from the sand painting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The warrior applies material from the dry painting to the hearts of the three
    novices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The warrior and then other theurgists suck at the novices' hearts, wave the
    supposed extracted material, and deposit it in a bowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that this heart-sucking rite is for purification of the
    heart and that every theurgist draws evil from the heart of the novice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the end, each novice is led to the altar to pray, the bowl of supposed
    extracted material is carried out, and an ash-sprinkling purification is repeated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Those present wave meal in their left hands four times around their heads
    when dancers strike ashes from their plumes.
  category: action
  evidence_refs:
  - ev:6
