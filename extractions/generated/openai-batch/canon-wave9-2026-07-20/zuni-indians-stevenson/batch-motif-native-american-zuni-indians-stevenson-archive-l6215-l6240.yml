canonical_text:
  quote: The visiting of one fraternity with another at this time is common.
  summary: The passage describes inter-fraternity ceremonial visits, invitations marked
    by meal wrapped in a corn husk, healing assistance, the making of images of the
    A'hayuta Gods of War, examples of Shu'maakwe and Great Fire fraternity exchanges,
    and an initiation before solstice so a new Ko'mosona could possess a sacred fetish
    for a ceremonial visit.
  language: English
  quote_policy: quoted
