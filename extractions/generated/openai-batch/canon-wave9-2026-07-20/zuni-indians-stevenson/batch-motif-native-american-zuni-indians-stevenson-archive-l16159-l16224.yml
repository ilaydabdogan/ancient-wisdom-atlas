  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The governor may be reelected and may lose office for proper cause; members
    of his staff may also lose office.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The governor and staff handle secular matters that do not require judgment
