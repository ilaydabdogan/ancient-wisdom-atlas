canonical_text:
  quote: ''
  summary: The passage describes Zuñi governmental hierarchy, the relation between
    religious authorities and civic officers, the appointment token of the governor's
    cane, and an 1891 proceeding in which a governor was accused, defended himself,
    and was deposed by the first body of rain priests after public deliberation.
  language: English
  quote_policy: summarized
