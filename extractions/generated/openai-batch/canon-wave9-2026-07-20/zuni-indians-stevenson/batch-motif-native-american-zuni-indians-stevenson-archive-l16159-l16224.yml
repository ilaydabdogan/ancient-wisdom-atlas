  text: The government is described as hierarchical and involving fundamental religious
    groups, with the first body of A'shiwanni identified as the dominant authority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The civic branch consists of a governor with four assistants and a lieutenant-governor
    with four deputies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Civic officers are nominated by the first body of rain priests.
  category: action
  evidence_refs:
