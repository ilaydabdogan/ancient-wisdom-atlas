canonical_text:
  quote: ''
  summary: 'The passage describes an evening Zuñi ceremonial gathering: quiet war
    narratives and smoking precede the arrival and seating of five novices near an
    altar. A choir begins with drum and rattles as medicine water is prepared. A woman
    brings water; the a''kwamosi prepares it before the altar while invoking Beast
    Gods. A flute sounds behind the altar, and the chief warrior whirls a rhombus
    and rotates a cloud symbol while calling for rain. An invocation asks directional
    and vertical animal beings, Sun Father, Moon Mother, and ancient ones for power
    to see disease. A note explains three Beast God medicines from two mountains,
    color-coded prayer plumes, propitiatory offerings, and the drinking of medicine
    in water when ill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants speak quietly; men recount war feats and ridicule enemies while
    listeners respond with low laughter, and commercial-tobacco cigarettes are smoked
    continuously.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After 9 o'clock the room becomes crowded, and the choir groups on the south
    side toward the west end of the room.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Five novices are present: one young woman, two young men, a small boy, and
    an old man; they are seated near the altar or among fraternity members.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The choir leader beats a te'pehan pottery drum, other choir members use gourd
    rattles, and the ceremonial opens with the making of medicine water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman brings a large vase of water and places it opposite the medicine bowl
    before the altar, beside the a'kwamosi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The a'kwamosi prepares the medicine water while offering low-toned prayers
    invoking the Beast Gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A young man plays a flute behind the altar, while the chief warrior whirls
    a rhombus and keeps a cloud symbol suspended above the altar in rotary motion.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The chief warrior calls on rain-makers to gather and send rain; the a'kwamosi
    prays for power to see disease and for disease to be carried off by the four winds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The invocation names Lion of the North, Bear of the West, Badger of the South,
    White Wolf of the East, Eagle of the Zenith, Shrew of the Earth, Sun Father, Moon
    Mother, and ancient ones, asking them for power.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Three medicines associated with Beast Gods are said to come only from two
    mountains, and six color-coded prayer plumes are prepared for directional animal
    beings.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Prayer plumes are offered to propitiate the animal beings; after prayers and
