canonical_text:
  quote: ''
  summary: A victorious warrior and an elder-brother Bow priest are received by a
    crowd. The scalp custodian proclaims the enemy destroyed, directs war whoops,
    and performs a cedar-bark gesture toward the six regions. The custodian later
    divides a scalp, places the pieces with rainwater vessels at a secluded northern
    place, builds a small fire, and marks a meal circle representing an enemy camp.
    The victor and elder brother reconnoiter the site, cut juniper twigs, move around
    the meal circle in opposite directions, shoot arrows into the scalp pieces, and
    carry the scalp, arrows, twigs, water vessels, and gourds back in prescribed ways.
    A pe'kwin also prepares an excavation north of the village for a later scalp-hoisting
    action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The victor and elder brother stand side by side, each with a fellow beside
    him, as a crowd gathers to receive the arriving party.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pa'mosona, identified as scalp custodian, addresses the pa'sewikia and
    states that they have met the enemy and that the enemy will no longer breathe
    the sacred breath of day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The war whoop is repeated four times by all, with repeated cries after the
    first three whoops and a different cry after the fourth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pa'mosona asks who will be the great father Bow priest, who will become
    a Bow priest, who will kick the scalp, and who will wash the scalp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The pa'mosona expectorates on a bit of cedar bark, waves it toward the six
    regions, throws it on the ground, and the pa'sewikia retire to their homes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The victor and the warrior acting as elder brother each give the pa'mosona
    a tiny vase filled with rainwater and a small gourd dipper, objects that had been
    given to them by the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pa'mosona takes a hairless piece of scalp from a black pottery vase kept
    permanently in the scalp house; the vase is said to have been captured from the
    Navahos long ago.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pa'mosona divides the scalp into two pieces and deposits the pieces at
    a secluded spot north of the village, placing a rainwater vase and gourd beside
    each.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the secluded spot the pa'mosona makes a small fire between the scalp pieces
    and sprinkles a wide circle of meal around the ridges; the text says the meal
    circle symbolizes the enemy sitting around a campfire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The victor and elder brother go to the prepared place with bows and arrows,
    identify the campfire as suggesting an enemy, cut juniper twigs with an archaic
    stone knife, move around the meal circle in opposite directions, and shoot arrows
    into the scalp pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each arrow remains in its scalp piece, and the scalp and arrow are carried
    in the toga with the shaft over the heart and the feathered ends touching the
    chin; the juniper twig is also carried in the toga, while the water vessel and
    gourd are carried in the blanket.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During their absence the pe'kwin makes a square, deep excavation on the plain
    north of the village and raises a small mound of loose earth on each side.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Explanatory notes state that the Gods of War are associated with six regions
    and colors, and that their homes are imagined as roofed with mountain tops, with
    a permanent home in the crater of an extinct volcano.
  category: setting
  evidence_refs:
  - ev:8
