canonical_text:
  quote: ''
  summary: The passage describes ceremonial arrangements for the Corn maidens, distribution
    of prayer sticks, collection and use of water from shrines and springs, dances
    in the ki'wi'sine, an overnight protective encampment under a bower with meal
    paintings and ritual objects, and the Gods of War seeking Pa'yatamu's aid at daylight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Corn maidens sit in two lines, north and south of a meal line, with named
    maidens placed at the eastern ends.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: U'yuyewi and Ma'sai'lema give te'likinane to the maidens, clasp the maidens'
    hands, and wave them toward the six regions while praying for rain from the six
    quarters of the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Corn maidens, with attendants, retrieve water vases from He'putina and
    collect water from two named springs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pe'kwin sprinkles the Corn maidens with plumes dipped in water from the
    vases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Corn maidens dance in the ki'wi'sine to music from two choirs positioned
    in the southeast and northeast corners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At midnight the A'shiwanni, Gods of War, maidens, and choir members leave
    the ki'wi'sine for si'aa' te'wita and sit under a constructed hiim'pone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A meal painting of clouds is made near the west side of the hiim'pone, and
    ritual objects are placed on or near it, including mi'wachi, a folded white embroidered
    kilt, and te'likinawe.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: A fire made by a man of the Badger clan burns before the hiim'pone so that
    all present can be seen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Youths are barred from the hiim'pone, and the Corn maidens are protected through
    the night while they sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At daylight the Gods of War go to Pa'yatamu's house under the rainbow to seek
    his aid, and Pa'yatamu returns with them to I'tiwanna.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pa'yatamu is joined by eight members of the Little Fire fraternity, and flutes
    are laid across a large medicine bowl and covered with a white embroidered cotton
    kilt.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
