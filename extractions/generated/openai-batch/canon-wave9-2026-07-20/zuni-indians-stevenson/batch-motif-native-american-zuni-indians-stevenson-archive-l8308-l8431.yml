canonical_text:
  quote: ''
  summary: The passage describes Zuñi ceremonial retreat, prayer, offerings, rain-invocations,
    masked personation preparations, a water-pouring procession of Ko'yemshi/Du'michimchi,
    meal paintings, tobacco reeds, and songs by the Great Fire fraternity addressed
    to divine beings for rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A jug of water is placed by a ritual painting and later emptied into a medicine
    bowl and drunk on the closing night by those present.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party in retreat rarely speaks, sings little until the last night, and
    sits quietly directing thoughts toward the desired watering of the earth by the
    u'wannami.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Shi'wano'kia is nursing an infant, the infant is brought, fed, returned,
    and carried away in silence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the eighth day, named A'shiwanni, Bow priests, Kia'kwemosi and associates,
    Ko'mosona, Ko'pekwin, Sha'liiko personators, other personators, and mask-preparers
    gather to prepare te'likinawe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Participants make offerings to the Council of the Gods, and those who will
    personate a god make additional offerings to the god they will represent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Ko'yemshi personators make plume offerings and te'likinawe to the Ko'yemshi
    and to the Council of the Gods, to be finished and placed in basket trays by noon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After noon the Ko'yemshi, now called Du'michimchi, move through the streets
    in file while women on house tops pour water mixed with sacred meal over them
    with a prayer for rain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the procession the Du'michimchi dry themselves, put on masks, visit
    house tops, tour the village, return to the ceremonial chamber, resume their dress,
    and return home, renouncing the name Du'michimchi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Near sunset Ko'mosona makes a meal painting, places sacred objects by it,
    and prays at length for rain to fructify the earth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ko'mosona and Ko'pekwin make black-colored reeds filled with native tobacco,
    wrap each in corn husk, and place them in an Apache basket by the meal painting.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Members of the Great Fire fraternity visit with rattles, sit south of the
    meal painting, and sing invocations to named beings for intercession with the
    u'wannami for rain.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At midnight the song closes with the drawing of the sacred breath of A'wonawil'ona,
    followed by prayers by Ko'mosona and the director of the Great Fire fraternity.
  category: sequence
  evidence_refs:
  - ev:12
