canonical_text:
  quote: ''
  summary: The passage describes a Thlewekwe ceremony in which a bearer and four animal-directional
    warriors carry a kia'etchine, prayer plumes, and a gourd jug to a spring. They
    pray for cold rains and snows, place offerings at the spring, sink the kia'etchine,
    and return with spring water. In the ceremonial chamber, selected members and
    Bow priests present tehl'nawe with prayers, while the Bow priests also deposit
    prayer plumes at a shrine to the Gods of War. The returned spring water is placed
    near the meal painting with sacred objects overnight and consecrated in the morning.
  language: English
  quote_policy: summarized
