  summary: 'The passage classifies Zuñi higher powers into seven categories: a universal
    supreme bisexual life power; celestial and stellar anthropic powers; terrestrial
    and subterranean anthropic powers, including named deities and a culture hero;
    and zoic gods acting through esoteric fraternities.'
