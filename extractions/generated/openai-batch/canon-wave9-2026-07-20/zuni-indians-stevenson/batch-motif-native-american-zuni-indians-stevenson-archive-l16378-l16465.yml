  summary: The passage describes Zuni house interiors, fireplaces, cooking, ceremonial
    lighting, domestic family life, child behavior and play, gendered household training,
    dances and games, masks copied from Navaho forms, the dog dance, and courtship
    customs centered partly at the well.
