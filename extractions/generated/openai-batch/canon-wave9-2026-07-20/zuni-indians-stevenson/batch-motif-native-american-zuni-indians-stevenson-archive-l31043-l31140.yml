canonical_text:
  quote: ''
  summary: The passage describes post-sunrise dances involving cactus, a novice’s
    dawn rite at a floor painting with corn grains and medicine water, the collection
    and burial of ritual materials with prayer plumes, the novice’s declaration as
    a cactus man, wound care with seeds and medicinal roots, and a following note
    on the Bow priesthood’s founding by the Gods of War.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the sunrise dance, four dances occur in the plaza; cactus is carried
    by officers in the first three dances, and in the fourth dance all carry large
    cactus pieces while a squash-blossom-and-seed mixture is placed in each member’s
    mouth before leaving the chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the cactus dances, dancers sometimes leave the circle and strike with
    cactus; two warriors return with large pieces of the plant and compete in bouts
    displaying indifference to the pain inflicted.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Dancing and fighting with cactus continue in the plaza until after sunset,
    and later continue inside the ceremonial chamber until sunrise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If broken cactus strikes a man or boy in the outdoor dance, he may be caught,
    led to the ceremonial chamber, painted and dressed like the others, and allowed
    to join the next dance with switches, though he may not use cactus until fully
    initiated.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:5
  text: At sunrise the fraternity father gives the novice a corn husk and leads him
    to a floor painting; the novice steps on it, faces the altar, turns east, turns
    around four times, then gathers corn grains from the painting into the husk while
    the deputy administers medicine water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The floor painting is made of powdered kaolin on sand and contains figures
    of the Ku'pishtaya of the six regions in a circle, a diagonal line identified
    as the galaxy, different-colored corn grains representing stars, and cloud symbols
    extending toward the altar.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The director collects the sands of the painting with eagle-wing feathers and
    the hand, places them in cloth, and the cloth is carried with cactus and switches
    to the place beyond the village where the novice was first struck with cactus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the excavation, willows and cactus are deposited first, then yucca wreaths,
    then the sands from the painting; all plant prayer plumes and the excavation is
    covered with earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Back in the ceremonial chamber, the fraternity father tells the novice that
    he is now a cactus man and instructs him to refrain from action after one, two,
    and three Kok'ko blows, but after four blows to take the Kok'ko’s yucca and whip
    him, damaging the mask’s beak and feathers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the ceremony, participants return home and sleep alone on sheepskins
    with the wool side down while cactus needles continue to emerge from the flesh;
    squash seeds are chewed and rubbed over wounds, and no complaint is heard.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cougar medicine is described as a root obtained largely from high valleys
    near the Jemez mountains and traded to the Zunis by Cochiti Indians; members of
    the 'Ko'shi'kwe chew the root with burr seeds and apply it to wounds.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Bow priesthood is said to have been organized by U'yuyewi and Ma'sai'lema,
    Gods of War, after the A'shiwi reached Itiwanna, and the elder and younger brother
    Bow priests are said to represent those divine predecessors in direct succession.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note states that Kok'ko personators are afraid to use switches on members
    of the 'Ko'shi'kwe because refusal to continue after a challenge is regarded as
    cowardice and the mask may soon be damaged.
  category: relationship
  evidence_refs:
  - ev:9
