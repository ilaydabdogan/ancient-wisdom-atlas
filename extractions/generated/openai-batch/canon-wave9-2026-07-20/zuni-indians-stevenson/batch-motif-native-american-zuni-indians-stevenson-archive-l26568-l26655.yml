canonical_text:
  quote: ''
  summary: The passage describes a ritual treatment in which named gods and Kwe'lele
    attend an invalid, use fire-making implements and bread strung on yucca, lay the
    bread over the patient's heart, and then depart. The invalid eats part of the
    bread and gives one piece to a dog, whose eating is said to absorb the disease.
    Washing with yucca suds, gifts, prayer plumes, a feast, and food gifts follow,
    and the invalid becomes a member of the order of Kok'ko 'hlan'na. The passage
    then begins a new section on initiation into the order of O'xaya'nakia.
  language: English
  quote_policy: summarized
