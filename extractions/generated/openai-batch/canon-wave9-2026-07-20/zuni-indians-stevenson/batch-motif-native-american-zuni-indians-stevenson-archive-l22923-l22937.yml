canonical_text:
  quote: ''
  summary: 'The passage describes requirements and procedures for making an ear of
    corn suitable for a fetish: the ear must be perfect, straightened if irregular,
    repaired if grains are missing, and cleansed with water. A fragment then identifies
    a son as an associate shi''wanni and Little Fire fraternity theurgist, and a note
    states that a fetish was deposited in the United States National Museum.'
