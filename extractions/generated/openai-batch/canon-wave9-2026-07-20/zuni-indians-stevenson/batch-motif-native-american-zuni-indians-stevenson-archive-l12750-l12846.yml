canonical_text:
  quote: ''
  summary: The passage describes food preparation, communal labor, household inspections
    by A'toshle and Ko'yemshi, disciplinary judgments, bathing and prayer, exchange
    of peaches, removal and concealment of masks, requirements for hosting the Sha'lako
    festival, harvest-time field labor, and a rooftop feast involving future personators,
    wives, babies, and workers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women, maidens, aged women, and girls prepare food by grinding, toasting meal,
    husking corn, baking he'we, and cooking meat, corn, and chili for those working
    on the ancestral house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two meals are served to the workers, one at midday and one at sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The A'toshle and Ko'yemshi visit houses to learn whether household members
    are performing their duties and to inquire about family behavior.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wife accuses her husband of laziness; he is brought for judgment, pleads
    his case, and the gods accept his statement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mother complains that her daughter will not grind; the female A'toshle commands
    the girl to kneel at the mills and be taught to grind without tiring her arms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The gods lecture a four-year-old boy, wave stone knives above him, and threaten
    to cut off his head if he is naughty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A father complains that his boys are unclean; the gods command the boys to
    go to the river, where the Ko'yemshi join them in bathing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After bathing, the group returns, stands in line, repeats a long prayer, and
    the family sprinkles the gods with meal and prays.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The gods stop a man returning from his peach orchard with a burro and try
    him for working in the orchard instead of assisting with the Kla'kwemosi house;
    he is allowed to go after supplying peaches.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gods return to the ki'wi'sine, remove masks and apparel, and young men
    carry the concealed masks and paraphernalia to their proper places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Those who host the Sha'lako festival must make house improvements; richer
    households do so more often, but poor households may also aspire to the honor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: One 1896 Sha'lako entertainer was condemned as a wizard during house improvements,
    was released after intervention, and continued building.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At harvest time, a corps of men is detailed by the chief wor'li of the relevant
    ki'wi'sine to work in the host family's fields and then eat at the household.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The household, related clans, and women prepare for the harvest labor meal;
    grinding is performed with ceremony and song.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: On August 16, 1896, the wor'li of the East ki'wi'sine tells the matron of
    the future Sha'lako house that his people will work the fields; the produce will
    go to household use.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After workers return at sunset, future personators of a Sha'lako, his fellow,
    and the Ko'mosona are among those served a rooftop feast with food placed in a
    line and twenty-one people seated on each side.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: Wives and babies assemble on the roof to receive husbands and help serve;
    fathers play with babies before tasting the meal.
  category: action
  evidence_refs:
  - ev:8
