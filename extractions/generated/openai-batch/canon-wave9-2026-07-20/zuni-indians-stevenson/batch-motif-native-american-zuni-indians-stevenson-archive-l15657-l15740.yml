canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi ceremonial sequence in the ki''wi''sine following
    the Sha''lako festival: Bi''si''si uses and transfers a small whistle; priests
    and associates sprinkle meal on offerings and along a meal line; ritual silence
    is maintained; Bi''si''si''s ceremonial father prays for rain and fruits of the
    earth; consecrated water is administered in an ordered sequence; te''likinawe
    are deposited for the Corn Maidens and ancestral gods; and large donations are
    removed to the Ko''yemshi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A whistle used by Bi'si'si is described as made of vegetable matter, less
    than an inch long, and deposited in the United States National Museum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bi'si'si blows his whistle, stands west of the hatchway facing east, offers
    a short prayer, and follows the mo'lawa into the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kia'kwemosi and an associate with a basket of fruit and seeds stand east
    of the ladder; the pe'kwin sprinkles meal on the gift and along the meal line;
    the associate deposits the basket near the mi'li; and the Kia'kwemosi throws meal
    over the offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bi'si'si resumes a place immediately behind the meal painting, remains silent,
    and looks on those present with folded arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the ceremonial no one in the ki'wi'sine speaks; if someone sleeps or
    dozes while Bi'si'si is present, he must remain seated until the sleeper awakens.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a cigarette is to be lit, the younger brother Bow priest ignites cedar
    fiber at the fire altar and hands it to the smoker.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After all the mo'la'we enter, Bi'si'si joins his ceremonial father, deposits
    the whistle from his mouth into the father's right palm, and the father prays
    for rain and fruits of the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ceremonial father waves his hand in a circle described as symbolic of
    all the world, and those present draw the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bi'si'si speaks a greeting for the first time, and others answer with a reply
    glossed as wishing that all good come to or be with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pe'kwin removes each offering from the basket and returns it to its owner.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ko'mosona administers consecrated water with a shell to the mo'lawe and
    then to named ceremonial participants in a stated order; recipients address him
    as father, and Bow priests receive a different reply.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After everyone has received the consecrated water, the Ko'mosona takes a mouthful,
    sprays it through his teeth over those present, and then drinks himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Bi'si'si prays at the west end of the room, leads the mo'lawe out to deposit
    te'likinawe, and his own offerings are made to the Corn Maidens, with each stick
    colored for one of the six regions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage note states that the scenes in the ki'wi'sine dramatize the rediscovery
    of the Corn Maidens and the re-creation of corn.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: After Bi'si'si and the mo'lawe disappear from the plaza, offerings for the
    Ko'yemshi are removed, carried by members of the clans of the Ko'yemshi's paternal
    parents, and the work continues far into the night.
  category: sequence
  evidence_refs:
  - ev:8
