candidate_motifs:
- id: motif:1
  label: Sacred exchange through offerings, consecrated water, and redistribution
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes offerings blessed with meal, offerings returned to
    owners, consecrated water distributed in a ritual order, te'likinawe offered to
    Corn Maidens and ancestral gods, and large donations carried to the Ko'yemshi.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage is ethnographic description; the motif label abstracts from
    ritual actions rather than from an explicit mythic narrative.
- id: motif:2
  label: Agricultural renewal and rain-fruit blessing
  taxonomy_refs:
  - seasonal_cycle
  basis: The ceremonial father prays for rain and fruits of the earth; te'likinawe
    are offered to the Corn Maidens; and the passage note says the ki'wi'sine scenes
    dramatize rediscovery of the Corn Maidens and re-creation of corn.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not describe a full seasonal calendar, but it explicitly
    links the ceremony to rain, fruits, Corn Maidens, and corn re-creation.
- id: motif:3
  label: Ritual silence followed by authorized speech
  taxonomy_refs: []
  basis: No one speaks during the ceremony, Bi'si'si remains silent, and only after
    he gives the formal greeting is the general silence broken.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: This is a ritual pattern in the passage; no broader taxonomy reference
    is assigned.
- id: motif:4
  label: Cosmic totality and directional ordering in ritual gesture and offerings
  taxonomy_refs: []
  basis: The ceremonial father makes a circular hand gesture described as symbolic
    of all the world, and Bi'si'si's te'likinawe sticks are colored for one of the
    six regions.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage gives only two details, so the motif is kept general and not
    assigned to a world-center taxonomy.
