    tied around the base of the mask.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The drama begins with the Ko'yemshi carrying 'Kiaklo on their backs to the
    village, representing the god's travel from Ko'thluwala'wa to I'tiwarina, with
    a song said to be the same as that sung by the gods at that time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Ko'yemshi song says they come out from the fourth world, carry their grandchild
