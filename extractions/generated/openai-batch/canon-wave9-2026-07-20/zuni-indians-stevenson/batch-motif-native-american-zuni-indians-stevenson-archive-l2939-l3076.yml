canonical_text:
  quote: We come out from the fourth world; we carry our grandchild on our backs.
  summary: Pau'tiwa sends 'Kii'klo, carried by ten Ko'yemshi, to I'tiwanna to tell
    the people their history after leaving the undermost world and to prepare blessings
    for male children. The passage then describes the custodianship and quadrennial
    ritual reenactment of this myth, including shrine offerings, costumes, masks,
    a seed-filled duck-skin rattle, and a Ko'yemshi song calling for rains and seeds.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Pau'tiwa decides that one of the gods must go to I'tiwanna to relate the people's
    history after leaving the undermost world and prepare them for the coming of the
    gods to bless male children with the sacred breath of life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: "'Kii'klo is chosen as a sagacious god for this service."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the mission, Pau'tiwa gives 'Kii'klo a duck skin filled with seeds
    and with shells about its neck, to be used as a rattle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ten Ko'yemshi carry 'Kii'klo to I'tiwanna, sing to him as they proceed,
    and take turns bearing him on their backs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A body of four men keeps the history myth, with stated Dogwood clan and child-of-Dogwood-clan
    requirements.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Death is stated as the punishment for betrayal of the trust placed in the
    keepers of the history myth.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The custodial organization meets four consecutive nights until midnight in
    February and March to rehearse the history and prepare plume offerings and et'towe,
    while the first body of A'shiwanni holds simultaneous meetings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The drama occurs every four years beginning in April, and a member of the
    organization personates 'Kii'klo in what is described as an exact representation
    of the visit of 'Kii'klo and the other gods to I'tiwanna.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ceremony begins with the ten Ko'yemshi and the personator of 'Kii'klo
    visiting shrines near the shrines of the Council of the Gods; at the morning star
    the Ko'yemshi deposit te'likinawe, make a fire, and feast, and 'Kii'klo later
    deposits plumes and joins them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the shrine-feast opening, ordinary dress is replaced by religious paraphernalia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The personator of 'Kii'klo is painted with pinkish clay, wears buckskin trousers,
    a white cotton shirt, a white embroidered Hopi kilt with a blue-green band, an
    embroidered sash, a red belt, a fox skin, a folded sacred blanket, and dance moccasins.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The blue-green band on the kilt is explicitly said to symbolize the vegetation
    of the world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The hide mask of the personator of 'Kii'klo is painted white, has a frog or
    toad and tadpoles on the back, a rainbow on the front, circular eye and mouth
    holes, and three rain-symbolic lines from each eyehole.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The personator of 'Kii'klo carries the duck skin filled with seeds and shells
    and uses it as a rattle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Ko'yemshi personators are painted with pinkish clay, have masks freshly
