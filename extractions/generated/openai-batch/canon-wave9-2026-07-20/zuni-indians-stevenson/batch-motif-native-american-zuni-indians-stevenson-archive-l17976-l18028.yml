- id: obs:3
  text: The rain priest instructs the man on the course he is to follow to ensure
    success as a runner or at the stakes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: One of two mesas with rock markings must be ascended, and the runner starts
