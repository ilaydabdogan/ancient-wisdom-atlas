canonical_text:
  quote: The course has six loops, symbolizing cumulus clouds of the six regions.
  summary: The passage describes a Zuñi pre-race or gambling-success rite in which
    a man receives a prayer plume, yucca-suds prayers, hair washing, and instruction
    from the rain priest; ascends a mesa with rock markings; performs stone actions
    at stone heaps and over a marked “luck line”; then runs to a shrine and offers
    prayers and sprinkled meal to the Gods of War for good luck.
  language: English
  quote_policy: quoted
