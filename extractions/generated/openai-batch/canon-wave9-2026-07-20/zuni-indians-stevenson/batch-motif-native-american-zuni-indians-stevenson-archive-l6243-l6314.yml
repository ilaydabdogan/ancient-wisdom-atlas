canonical_text:
  quote: ''
  summary: The passage describes Zuñi ceremonial preparation of images and paraphernalia
    for elder and younger Gods of War, explaining Deer and Bear clan participation
    through a brief account of two gods identifying deer and bear as fathers. It also
    describes materials, plume and meal offerings, sentinels over the idols, and the
    selection of the new-year sacred fire maker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Preparation of the idols and their games is confined to the Deer and Bear
    clans, with an explanation attributed to the elder brother Bow priest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the explanatory account, two gods travel about the country; the elder refers
    to the deer as his father, and the younger says the bear is his father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger god in the explanatory account is described as more venturesome
    and braver than the elder.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Seasonal images are carved from po'la, while images for the scalp ceremonial
    must be made from ii'shekia that has been struck by lightning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seven members of the A'pi"lashiwanni are appointed by the elder brother Bow
    priest to make paraphernalia for the elder God of War, and seven are appointed
    by the younger brother Bow priest for the younger God of War.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The paraphernalia include a tablet, staff, shield, serrated projection with
    plumes, small bow and arrow, shield, war club, and a plumed stick.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: All varieties of seeds are deposited in the cavity before the serrated projection
    is inserted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage explicitly says the serrated projection with plumes is symbolic
    of clouds and lightning, and that the attached plumes carry prayers to the gods
    for rain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: After modeling, the idols are decorated with yucca fiber, yucca cord, raw
    cotton, fine cotton cord, and a pendent abalone shell.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Completed idols are stood facing east near the north end of the room where
    they were fashioned.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Deer clan man and a Bear clan man serve as sentinels or special watchers
    over the idols until the idols are taken to the He'iwa ki'wi'sine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: People come to offer prayers and sprinkle the gods with meal; each A'pial;ishiwanni
    member leaves a te'likinane in the belt of each idol.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The maker of the sacred fire of the new year is chosen by the Kia'-kwemosi
    and notified by the Ko'pekwln, who brings prayer meal wrapped in corn husks, clasps
    the selected person's hands, delivers the message, and prays.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The fire-maker office alternates between a member of the Badger clan and a
    child of that clan, and the office holder often but not always becomes the personator
    of Shu'laawi'si in the following autumn Sha'liiko ceremonial.
  category: relationship
  evidence_refs:
  - ev:7
