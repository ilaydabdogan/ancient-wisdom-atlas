canonical_text:
  quote: ''
  summary: A chronological summary records seventeenth- and early eighteenth-century
    events involving Zuni communities, Spanish colonial authorities, missionaries,
    neighboring groups, mesa refuge and resettlement, the Pueblo revolt, renewed allegiances,
    a knotted cord interpreted as a rebellion calendar, and conflicts and diplomacy
    involving Hopis and others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Spanish party traveling to Zuni was admitted to the summit of the mesa,
    and the Zunis promised to be peaceful thereafter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Zunis left the mesa and began resettling villages in the valley.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Apaches or Navahos raided Hawikuh and killed the Zuni missionary Fray Pedro
    de Avila y Ayala with a bell while he was clinging to a cross.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the general Pueblo revolt, the Zunis killed their missionary, burned
    the church, and fled to Toaiyalone, where they remained for more than twelve years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Diego de Vargas found the Zunis on the mesa; they submitted, and about 300
    children were baptized.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After harsh treatment by a Spanish garrison and lack of redress, Zunis killed
    three Spanish exiles; some fled to the Hopis and others took refuge on Toaiyalone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: Padre Garaicoehea induced the Zunis to come down from Toaiyalone, settle on
    the plains, and renew allegiance to Captain Roque Madrid.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Spaniards found a knotted cord, described as probably a quipu or calendar
    string, and compared it to a similar device used in 1680 to notify revolutionists
    and set the day of rebellion.
  category: object
  evidence_refs:
  - ev:9
- id: obs:9
  text: Hopis raided the Zunis; the Zunis later made an expedition against the Hopis,
    killed two, and recovered seventy animals.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: A Zuni embassy was sent to the Hopis to exhort peace and submission, but refugee
    Tanos and Tewas living among the Hopis responded by raiding Zuni.
  category: action
  evidence_refs:
  - ev:12
- id: obs:11
  text: Several entries note dated inscriptions on El Morro by Spanish officers or
    officials passing toward Zuni or Hopi.
  category: setting
  evidence_refs:
  - ev:13
