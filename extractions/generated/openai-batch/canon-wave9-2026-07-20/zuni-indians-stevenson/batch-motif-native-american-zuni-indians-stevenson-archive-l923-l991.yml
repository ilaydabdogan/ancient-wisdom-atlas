canonical_text:
  quote: ''
  summary: At A'wisho, the Divine Ones organize four esoteric fraternities while other
    people continue emerging from the underworlds. The last emergents are a husband-and-wife
    pair of witches who hold seeds and demand permission to accompany the A'shiwi
    to the Middle place of the world. They offer corn and other seeds to the Kia'kwemosi
    in exchange for his son and daughter, whom they kill so rain may come. After burial
    and rains, the youth and maiden each emerge from the earth. The witches plant
    the seeds in wet earth; the crops grow and mature rapidly but are first too hot
    to eat. Raven, owl, and coyote eat the crops, making them soft and sweet for the
    A'shiwi, and the passage ends with instruction in 'tire making' and cooking.
  language: English
  quote_policy: summarized
