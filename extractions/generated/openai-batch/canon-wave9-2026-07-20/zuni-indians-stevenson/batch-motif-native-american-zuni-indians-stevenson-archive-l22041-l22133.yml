  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy deposited the supposedly extracted material on meal, made the girl
    swallow three bits of root medicine, prayed, sprinkled meal, gathered the meal
    into a corn husk, and left with the grandfather.
  category: sequence
  evidence_refs:
  - ev:3
