canonical_text:
  quote: ''
  summary: An accused boy performs a coercive healing rite over an ill girl, claims
    to extract disease from her heart, buries the collected material west of the village,
    escapes, is recaptured, and is interrogated by Bow priests and warriors. Under
    renewed questioning, he confesses to a fabricated witch lineage, describes ancestral
    plume offerings, winter-solstice gatherings to prevent rain and snow, transformation
    into animals by use of plumes, yucca strings, and a hoop, and lethal witchcraft
    using cactus needles. The party then goes to his mother’s house to look for the
    alleged prayer plumes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy placed one medicine south of meal and three bits of good medicine
    north of the meal before singing in a low voice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy chewed a root, ejected it on his hands, rubbed his body, distorted
    his face, spun, jumped, shook violently, and rushed to the invalid.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The invalid girl was held by her father and brother while she tried to scream
    and release herself.
