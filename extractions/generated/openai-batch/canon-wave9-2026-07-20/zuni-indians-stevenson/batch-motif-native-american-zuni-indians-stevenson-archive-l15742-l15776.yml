canonical_text:
  quote: symbolic of the opening through which the A'shiwi came to this world from
    interior worlds
  summary: After the te'likinawe are planted, the mo'lawe separate and their heads
    are washed with yucca suds by clan women. Bi^si'si returns to the ki'wi'sine and
    sits by his ceremonial father. The pe'kwin distributes mo'lawe offerings, and
    corn collected from personators of the gods is distributed in the same order.
    The ceremonial father takes down Bi'sitsi's hair and removes husks. The mi'wachi
    are returned to owners, the Ko'mosona gathers meal from the meal painting and
    deposits it in a small circular floor opening said to symbolize the emergence
    opening of the A'shiwi from interior worlds. The A'shiwanni and others carry gifts
    home and may eat after the fast, except named persons not required to observe
    it.
  language: English
  quote_policy: quoted
