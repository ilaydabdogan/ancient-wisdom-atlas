canonical_text:
  quote: ''
  summary: The passage describes spectators punished for speaking Spanish before personators
    of anthropic gods; a Hopi-associated dance; the arrival of masked Ko'yemshi with
    ritual objects; an Ant fraternity procession; the formation of an open ellipse
    identified with roads of life, rain, and sun; a six-region meal placement; and
    a divinatory act in which a small sun disk placed at a warrior's heart falls,
    leading the host to believe his wife is unfaithful in her heart.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four spectators are severely whipped across the ankles and arms for speaking
    Spanish in the presence of personators of anthropic gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nan'nahe is identified as a Hopi Indian married to a Zuñi woman and is described
    as trying to prevent failure in the dance because his associates are partly drilled
    in the song.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hopi-associated dancers wear a Hopi kilt, silk scarf, dance moccasins,
    and porcupine-quill anklets; two persons outside the line wear improvised Hopi
    masks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi arrive masked, blanketed, with goatskins on their feet, fawn
    skin, te'likinawe, gourd rattles, and masks heavily covered with meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sixteen male members of the Ant fraternity precede the Ko'yemshi, led by the
    female head of the dedicated house, who carries a mi'li and meal basket and sprinkles
    meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ant fraternity director, a member of the Sun clan, carries eagle plumes
    and a basket with six painted disks described as symbolic of the house of the
    clouds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The procession forms an ellipse with an opening; the passage states that such
    circles must not be closed and that the opening is symbolic of the road of life,
    rain, and sun.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The director drops six pinches of meal, forms a meal disk and southward meal
    line, waves the mi'li to the six regions, raises it six times, and places it on
    the meal disk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The director gives the host a disk called a small sun and tells him to place
    it next to the heart of the warrior of the Ant fraternity.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The director states that if the disk remains at the warrior's heart the host
    and wife's hearts are good and prosperity will follow; if it falls, the wife's
    heart desires another.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the host places the disk to the warrior's heart, it drops to the floor;
    the director retrieves it, and the host leaves believing his wife is unfaithful
    in her heart.
  category: sequence
  evidence_refs:
  - ev:10
