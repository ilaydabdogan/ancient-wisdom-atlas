canonical_text:
  quote: ''
  summary: The passage describes efforts by doctresses and grandmothers to revive
    a newborn after birth, followed by umbilical dressing, bodily manipulation, wrapping,
    postpartum care for the mother, preparation of a heated sand bed, use of corn
    ears with stated fecundity and gender associations, placement of prayer meal,
    and a prayer by a doctress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the birth, doctresses and the paternal grandmother attempted to produce
    the infant's respiration by pressing the nostrils, blowing into the mouth, manipulating
    the chest, moving the arms, and keeping the body warm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports rejoicing at faint signs of life and states that respiration
    improved enough to give hope after about another hour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A doctress prepared boiled piñon gum with mutton grease, and the paternal
    grandmother rolled it before it was used around the umbilicus with wool and cloth
    as a dressing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The paternal grandmother dropped water on the infant's scrotum, and the doctress
    rubbed the parts, manipulated the penis, and also manipulated the nose, mouth,
    and eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The infant was wrapped in cotton cloth and a small blanket, secured with yucca
    strings, and laid on a folded blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young mother used a belt to hold a heated stone in place, sat on a ledge,
    and later drank unsweetened commercial tea.
  category: action
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:7
  text: Two women removed a sheepskin with lochial discharge, and the maternal grandmother
    covered the discharge with sand before it was swept into a cloth and carried out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father-in-law and mother-in-law brought damp sand, which a doctress heated
    and shaped into a circular mound with depressions for the child's body and head
    and a ridge for the neck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother-in-law brought two ears of corn; the text notes disappointment
    that neither was a perfect ear.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: One ear of corn had three plumules, which the passage explicitly says symbolized
    fecundity; the other was a single ear held upward behind the child's head.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note states that for a boy a single ear of corn, called the father, is used,
    while a divided one, called the mother, is placed with a girl.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A basket of prayer meal was placed at the head of the sand bed, and the doctress
    who received the child offered a long prayer to a named recipient whose name is
    truncated in the passage.
  category: action
  evidence_refs:
  - ev:7
