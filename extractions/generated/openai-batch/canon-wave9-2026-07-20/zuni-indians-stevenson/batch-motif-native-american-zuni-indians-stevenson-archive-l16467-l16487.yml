canonical_text:
  quote: ''
  summary: The passage describes Zuñi natal customs in which a couple seeking a daughter
    visits the Mother rock on Corn mountain, where the pregnant woman scrapes rock
    into a small vase, deposits it in a cavity, and the party prays for the daughter's
    virtues and domestic arts. A couple seeking a son visits a higher shrine in a
    fissure of the same rock, offers meal and te'likinawe, and prays for a son who
    will be distinguished in war and honored among ancestral gods after death. A note
    describes vulva symbols and small excavations on the rock base.
  language: English
  quote_policy: summarized
