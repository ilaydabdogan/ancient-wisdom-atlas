canonical_text:
  quote: ''
  summary: The passage describes synchronous ceremonies of the 'Hle'wekwe and the
    Sword order of the Great Fire fraternity, including dance and sword swallowing,
    the carrying and installation of the 'hle'et'tone sacred fetish with meal and
    associated objects, an inventory of ritual items shown in a plate, and the wrapping,
    blessing, and intended spring deposition of a kia'etchine made from prayer plumes
    and associated offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonials of the 'Hle'wekwe and of the Sword order of the Great Fire
    fraternity are described as synchronous and combined in elaborate dances.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An hour before sunset on the third day, five members of the Great Fire fraternity
    in regalia precede a warrior of the 'Hle'wekwe to the chamber of the 'Hle'wekwe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the chamber, the participating Great Fire fraternity members dance and
    swallow swords.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the dance, visiting 'Hle'wekwe return from the house of the 'hle'et'tone
    carrying prayer plumes and ha'kwawe that they have made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hlem'mosona carries the 'hle'et'tone in a flat basket partly filled with
    meal, together with two stone fetishes and two ancient small bows and arrows covered
    with the blanket of the 'hle'et'tone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The 'Hlem'mosona sprinkles meal before him with his right hand while proceeding
    between houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Inside the ceremonial chamber, the 'Hlem'mosona removes the et'tone from the
    basket, makes a thick bed of meal on the west ledge under the wall decoration,
    and deposits the sacred fetish on the meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The plate inventory includes dry paintings and ritual objects such as the
    et'tone, corn husks with eagle plumes, skins of bears' feet, feather objects,
    ancient bows and arrows, stone fetishes, medicine bowls, a prayermeal basket,
    and water vessels.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Since 1902, the 'Hle'wekwe have added a tablet altar similar to those used
    by other fraternities.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each person wraps his own prayer plumes, and the 'Hlem'mosona groups these
    with the offering of the Shi'wanni of the West into a kia'etchine; ha'kwawe are
    wrapped around its base and held by a cotton cord.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The kia'etchine is sprinkled with meal and prayed over by all members of the
    fraternity before a bearer, accompanied by four men, takes it toward the spring
    where it is to be deposited.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A note says the 'hle'et'tone is covered with native cloth, has an ear of corn
    placed on it, and is obscured by prayer plumes, bead necklaces, white cloth, and
    te'likinawe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note defines the kia'etchine as a number of prayer plumes wrapped together
    at the base.
  category: object
  evidence_refs:
  - ev:8
