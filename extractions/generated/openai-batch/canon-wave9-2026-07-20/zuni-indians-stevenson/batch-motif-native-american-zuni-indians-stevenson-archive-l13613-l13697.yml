canonical_text:
  quote: ''
  summary: 'The passage describes a segment of the annual Sha''lako/Mixok ceremonies:
    ritual figures ascend a ladder, officials receive Sha''liiko and the Council of
    the Gods at the Kla''kwemosi''s house, meal is sprinkled upon the gods, outsiders
    are kept from a restricted ceremonial chamber and then seated by the altar, and
    the Uhuhukwe altar is inventoried with animal figures, medicine objects, eagle
    plumes, cloud, lightning, rainbow, moon, star, and firmament imagery, plus a meal
    line and seating arrangements.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lower doors are barred during the occasion; plume planting and other ceremonies
    are repeated by Sa'yatasha, Hu'tutu, and the Yii'muhakto, after which they ascend
    a ladder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group of A'shiwanni and named officials remains at He'patina to receive
    Sha'liiko, who follows after the Council of the Gods; the group then goes to the
    Kla'kwemosi's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Crowds gather to see the gods before they retire from the streets; on the
    roof, the Council is met by the Kla'kwemosi, his wife and daughters, and the mo'sona
    of the Uhuhukwe fraternity.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kla'kwemosi's family and the mo'sona pray and sprinkle meal upon the gods,
    including sprinkling meal through a small roof opening, and then precede the gods
    to the chamber below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: White visitors trying to enter a side room are ordered away; the Kla'kwemosi
    reproves an intruding man for entering forbidden ground, escorts the guests to
    the chamber, and seats them by the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The altar at the west end of the room contains stone animal figures, medicine
    objects, bear feet, eagle-wing plumes, a flute, a sacred meal basket, a medicine
    bowl, food, a human stone image, and an Apache basket of te'likinawe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The altar is made of wooden slabs and tablets with faces of lightning-makers,
    cloud designs, birds, north and south cougars, lightning symbols, sun and star
    designs, rainbow, moon, A'chiyala'topa, and a star of the four winds; its blue-green
    color is said to symbolize the firmament.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A meal line extends from the altar to the ladder and then to the east end
    of the room; it is crossed in three places, and deerskins, robes, and blankets
    are arranged near the altar and on a ledge where the gods sit.
  category: setting
  evidence_refs:
  - ev:8
