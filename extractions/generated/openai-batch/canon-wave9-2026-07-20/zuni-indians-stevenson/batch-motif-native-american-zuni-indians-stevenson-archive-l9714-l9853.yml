canonical_text:
  quote: Great waters, rains, cover the earth.
  summary: 'The passage gives a rain-priesthood invocation and ritual account: rain-makers
    are summoned to bring clouds, thunder, waters, and seed growth; earth, sun, children,
    and ancestral or parental beings are addressed; the A''shiwanni use meal lines,
    thunder stones, prayer objects, spring water, and offerings of corn and other
    objects in songs and prayers of thanksgiving.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The invocation asks beings to come, give showers and great rains, and make
    seeds and seed plants come up strong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earth mother is addressed, and the prayer asks that she be covered with
    flowers, clouds, fog, rains, great waters, lightning, and thunder over the six
    regions of the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rain-makers are summoned from all roads; rivers and torrents are described
    as covering the earth, moving stones, uprooting trees, carrying sands, and enabling
    seeds to develop.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prayer names children, growing children, outlying villages, and people
    as beneficiaries who should have food, happiness, life, and happy days.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
- id: obs:5
  text: The A'shiwanni sprinkle meal up a line of fetishes; the note states that this
    is symbolic of the rain-makers passing over the meal line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the retreat prayer, the Sun Father is said to arise, ascend a ladder, and
    come forth from his place; the prayer asks that all complete the road of life
    and inhale the sacred breath through prayer plumes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Thunder stones are rolled down a line of meal and pollen to a disk of corn
    pollen; the shi'wanni rolls first, and associates take turns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The thunder stones are described as sacred objects believed to have been dropped
    to earth by the rain-makers while playing their games.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the rising of the morning star, the first associate shi'wanni carries a
    kia'etchine to a field, while another person whirls a rhombus; both carry decorated
    long-necked gourd jugs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Meal and prayer meal are sprinkled into an excavation, te'likinawe are placed
    with their eyes toward the east, a prayer is repeated, the jugs are filled from
    a spring, and the water is deposited in bowls near a cloud symbol and painting.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Women briefly join the song, and offerings made by women are distributed among
    the shi'wanni and associates.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The offerings include ears of corn, bowls of corn grains of various colors,
    bead necklaces, meal bangles imitating silver, and peach shoots with artificial
    fruit made from dried he'palokia and sweet corn.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: All participants move the objects up and down in time with thanksgiving songs;
    after about fifty minutes, Nai'uchi makes a low prayer and the offerings are removed.
  category: sequence
  evidence_refs:
  - ev:10
