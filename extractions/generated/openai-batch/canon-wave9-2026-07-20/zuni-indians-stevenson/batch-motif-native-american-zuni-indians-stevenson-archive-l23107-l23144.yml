  summary: The passage describes meeting schedules, initiation timing, notification
    procedures, prayer-plume preparation, offerings, and the replacement of a deceased
    fraternity father among several Zuñi fraternities and ritual offices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ko'shi'kwe hold three annual meetings, and novices must wait for a regular
    meeting to join.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'pi"l;ishiwanni hold a scalp ceremonial for initiation every three or
    four years at the will of the elder brother Bow priest; the ceremonial is depended
    on to bring rains during severe drought, and the fraternity also has an annual
    Harvest dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'Hle'wekwe hold two regular meetings in January and February, and a proposed
    member's name is held over for a year before reception; the Wood order of the
    Great Fire meets at the same time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most fraternities are notified of meetings by one of their warriors, who goes
    house to house with the director's message; the 'Hle'wekwe are notified through
    the Kia'kwemosi, and the Shu'maakwe through the sun priest.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: Members of all fraternities gather semimonthly in the ceremonial chamber to
    prepare prayer plumes, which they offer to their gods; tablet altars are often
    placed for these occasions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Men prepare offerings for fraternity children of the opposite sex and for
    boys not old enough for voluntary initiation into the Ko'tikili.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a woman loses a fraternity father, she must choose another, because women
    cannot prepare prayer plumes unless they are members of the Ko'tikili.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A male member of the deceased fraternity father's clan presents meal wrapped
    in corn husk, lays it in a man's palm, prays, and announces that the man has been
    chosen to replace the deceased fraternity father.
  category: action
  evidence_refs:
  - ev:5
