canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Zuñi rain ceremony: processional dances,
    a song petitioning the Great Mother of corn, a communal feast, the dressing and
    face painting of two he''kupowanhak''tona and the sho''lipsimonthle''ona, preparation
    of he''kupowanne head bundles containing corn and offerings, a procession with
    a blue hoop identified as a world symbol, and east-facing prayer with meal sprinkling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A procession moves to the plaza led by an A'wan mosono'kla; the Sho'ko'we
    choir is joined by flutists for the dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the dance, the 'hla'we are moved downward, and the song asks the Great
    Mother of corn to give many children during the coming year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After sets of girls dance, a feast is served in the ham'pone with many bowls
    of food and coffee, and remaining food is distributed among spectators.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The he'kupowanhak'tona and sho'lipsimonthle'ona appear before the sunset dancers
    and are dressed by ritual officers; the girls' hair is arranged over wooden forms
    and wrapped with blue yarn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pe'kwin paints the lower part of the face black and applies corn pollen
    to the upper face; the passage states that the black signifies rain clouds and
    the pollen signifies fruits of the earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A he'kupowanne is prepared from an ear of corn and eight te'likinawe offerings
    to the Sun Father, Moon Mother, and Corn Mother, secured in a folded mi'ha.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two he'kupowanne are placed on the heads of the he'kupowanhak'tona and loaded
    with white shell beads, turquoise, and coral necklaces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The two girls carry 'hla'we, while the youth carries te'likinawe, a blue hoop
    called a world symbol, a folded kilt, and the Kla'kwemosi's mi'li.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The three dancers must keep their faces toward the east until reentering the
    ham'pone; later two men carry the he'kupowanne to the plaza, face east, pray,
    and sprinkle meal.
  category: action
  evidence_refs:
  - ev:7
