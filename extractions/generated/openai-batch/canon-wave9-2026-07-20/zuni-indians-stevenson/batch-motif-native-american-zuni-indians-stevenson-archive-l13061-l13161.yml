canonical_text:
  quote: ''
  summary: The passage describes a timed sequence of shrine visits and plume deposits,
    the annual selection and roles of the Ko'vemshi, their night appearance in the
    village from a shrine symbolizing the Middle of the world, speeches announcing
    the coming of the Council of the Gods, Sha'liiko, and ancestors, and an explanation
    that former bodily visits from the ghost world caused mortality, so spirits now
    come invisibly and abide temporarily in masked personators.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After ten-day intervals, the same party visits several shrines and deposits
    te'likinawe; the sequence includes Pa'nitonin'kwl, A'ne 'hlawa an te' kiapoakwi,
    Sus'ki a'shoktakwi, and A'kohanna ti'nakwi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Council of the Gods proceeds quietly ahead of the others, and songs of
    the Ko'yemshi and Sha'liiko personators are heard before the men are visible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A'kohanna ti'nakwi is described as a group of white sandstone pinnacles on
    a knoll and as sacred to the Council of the Gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two rocks bear perpendicular cut lines, one with twenty-nine and one with
    twenty-eight; the passage reports, with caution, a statement that these lines
    denote years of office held by two late officeholders.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ko'vemshi are chosen annually in alternation from named fraternities;
    the Great Father is designated at the winter-solstice ceremonial and then chooses
    his fellows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'vemshi appear in the village on the night when plumes are planted at
    A'kohanna ti'nakwi; they are said to come from Ko'thluwala'wa, but their ritual
    starting point is He'patina, a shrine symbolic of the Middle of the world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ko'vemshi cross the river at the southwest corner of the town and announce
    that the Council of the Gods will come in four days and the Sha'liiko in eight
    days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The village is illuminated by fires in houses and by outdoor ovens whose flames
    issue through the doors.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the large plaza, named Ko'vemshi speakers make announcements and jokes
    concerning fighting, the arrival of their people, a coming dance, food, wives,
    and sexual license.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The pe'kwin says that in eight days ancestors from Ko'thluwala'wa and A'witen
    te'hula will come, including old people, mothers, children, infants, and unborn
    children, and that they will see the Zunis while remaining unseen in ghost form.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage explains that former bodily appearances from Ko'thluwala'wa and
    A'witen te'hula caused mortality among the A'shiwi, after which those of the ghost
    world decided to come only in spirit and to abide temporarily in masked personators.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that some Zuni mediums have superior sight and see ghosts.
  category: attribute
  evidence_refs:
  - ev:6
