canonical_text:
  quote: ''
  summary: English and Zuni-interlinear route-song material recounts Kiiiklo looking
    to the six regions, seeing roads, directing the use of the middle road, and recounting
    the travels of the ancients. The passage lists many named stopping places where
    the travelers get up and move on, especially springs and water places. Notes explain
    Ko'yemshi singing during the gods' journey to I'tiwana, a theft of rain-deposited
    plume wands by a witch and their recovery by a rain priest, sacred springs, Sha'lako
    gods appearing through a spring, and the A'shiwi quest for the Middle place.
  language: English with Zuni terms and interlinear Zuni glosses
  quote_policy: summarized
