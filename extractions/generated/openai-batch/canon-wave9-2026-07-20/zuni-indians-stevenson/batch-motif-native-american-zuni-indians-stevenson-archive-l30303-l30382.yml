  quote: ''
  summary: The passage describes ritual medicine, decoration and painting of novices
    and fraternity members, preparation and drinking of medicine water, positioning
    of altar attendants, and an ash-sprinkling purification performed by two chaparral-cock
    personators during a Shu'maakwe initiation ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medicine is placed in the mouth and ejected, usually onto the palm, then rubbed
    over the afflicted body part; it may also be mixed with water and drunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Flower medicine is sprinkled on personators of the gods for aid in having
    a brave heart, and a traveler may spit it out to follow the right road and avoid
    enemies, accidents, and ill health.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yucca adornments are completed, carried by the men who prepared them, and
    placed on the seated novices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Five novices are painted with red paint, white painted markings, and hawk
    breast down attached to white paint on the face and head; the passage states that
    the down decoration is symbolic of clouds.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: After the hawk down feathers are put on, the novices do not touch their faces
    despite the described tickling discomfort.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Male members don black woven breechcloths and decorate themselves with white
    designs representing animals including eagle, chaparral cock, bear, cougar, badger,
    white wolf, and coyote.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two little boys represent the heavens, and a red Zuñi coil or seal is painted
    on their palms.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women paint their hands and arms to the elbow and their feet and legs to the
    knee; the choir includes both sexes, with women holding eagle wing plumes and
    gourd rattles and men also holding rattles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The a'kwamosi and pe'kwin sit on either side of the altar, the warriors resume
    positions as protectors of the altar, and the flute player stands behind the altar.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Medicine water is prepared, and each choir member drinks from a shell dipped
    into the bowl.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Members of the fraternity with ailments use this ceremonial occasion as an
    opportunity to be cured.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Two chaparral-cock characters leave the choir holding eagle-wing feathers,
    move birdlike to the altar and fireplace, lift ashes with their plumes, and sprinkle
    the altar.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The chaparral-cock characters throw ashes out the south door and toward the
    north, west, south, and east, then place ashes in a heap before the altar; the
    passage identifies the ash-throwing as physical purification.
  category: action
  evidence_refs:
  - ev:12
