canonical_text:
  quote: Before the drama of the 'Hle'wekwe is enacted the Mu'waiye dance must be
    rehearsed.
  summary: The passage describes rehearsal and performance of the Mu'waiye dance before
    the Hle'wekwe drama, including the mythic-prototype frame, room arrangement, decorated
    boxes, costume details, dance movements, a note linking hair over the eyes with
    snow, and preparations for the arrival of Hle'wekwe members led by a woman sprinkling
    sacred meal.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Mu'waiye dance is rehearsed before the Hle'wekwe drama, and two maidens
    and a youth personate Mu'waiye in relation to prototypes said to have acted at
    the Hle'wekwe return after separation from the A'shiwi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kia'kwemosi selects the ki'wi'sine that will furnish the choir; rehearsals
    occupy six nights before the plaza drama at sunset.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the large room, the three Mu'waiye sit on the north ledge, the choir assembles
    on the south side, circle-dance girls sit west of the choir, and youths sit at
    the west end.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two white-painted boxes stand toward the west end of the room and are decorated
    with figures including animals, A'chiyala'topa, and stars.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the beginning of the dance the performers wear ordinary dress; the boy
    is given a black woven kilt, and all three are given ribboned and curled corn
    husks while their eyes are obscured by bangs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dance is performed to pottery drum and song, without a rattle, and includes
    lowering the body, bending forward, extending the arms, beating the hands toward
    the earth, raising the heels, and stamping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note reports an instructor's statement that hair must cover the eyes for
    the snows to come.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the close of the dance, the smaller box is placed west of the larger one,
    notched sticks and deer-leg bones are laid on it, and four musicians sit west
    of the box.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Members of the Hle'wekwe fraternity enter led by a woman who carries sacred
    meal and a mi'li insignia, sprinkles meal with her right hand, and wears ordinary
    dress with a bordered white cotton blanket.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A footnote states that women at initiation and new women members practice
    sword swallowing, while men and elder boys of the Hle'wekwe seldom fail in their
    first effort.
  category: other
  evidence_refs:
  - ev:10
