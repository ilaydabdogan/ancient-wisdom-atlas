canonical_text:
  quote: ''
  summary: The passage recounts an expedition route through Pecos, Fort Wingate, and
    Zuñi; observations of ruins, reservoirs, drought-related water carrying, welcome
    by Zuñi priests and officials, collection of ceremonial and church objects, local
    concern over photographing masks and rituals, and military assistance in transporting
    the collection during regional unrest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Pecos, the party visited a pueblo ruin on a knoll above the Rio Pecos and
    saw the standing walls of an old church associated with Spanish fathers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party opened one chamber at night by moonlight using knives and stilettos.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An impression of a hand and arm in color, thought probably to be from a maiden,
    was found on a wall.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two circular walls near one end of Pecos had been described by some writers
    as estufas or fire houses, but the observer judged them likely to be reservoirs
    for storing snow during droughts.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Laguna women had worn a deep path in sandstone while carrying water from distant
    springs after reservoirs were exhausted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The journey from Santa Fe to Fort Wingate took ten days and passed many traces
    of former settlement, including walls, stone implements, and pottery fragments.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Zuñi, native priests and other pueblo officials welcomed the party and
    promised Mr. Stevenson aid after hearing the purpose of his visit.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Six months were spent studying Zuñi religion and sociology, surveying, photographing
    daily life, and collecting ceremonial objects, fetishes, implements, fabrics,
    foodstuffs, and pottery.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two saint images and altar portions from the old Catholic church were obtained
    after a council of religious and civil officers decided they could go to the National
    Museum in Washington for preservation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Priests and high officials favored photographing ceremonials, while the populace
    opposed having masks and rituals carried away on paper.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Because of popular opposition, only a few ceremonial camera pictures were
    made, and altars and masks were sketched in color without the people’s knowledge.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A large collection, especially of fetishes and sacred vessels, was secured
