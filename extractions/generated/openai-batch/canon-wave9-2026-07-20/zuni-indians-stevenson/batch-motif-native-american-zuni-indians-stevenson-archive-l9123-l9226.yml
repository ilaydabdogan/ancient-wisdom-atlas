canonical_text:
  quote: ''
  summary: The passage describes Zuni A'shiwanni rain-priesthood offices, sacred et'towe
    kept in sealed vases, female preparation of prayer meal, clan-based succession
    rules, appointment procedures involving the Kia'kwemosi and Bow priests, the authority
    of the Shi'wanokia in impeachment matters, and an episode in which the Shi'wanni
    of the Zenith is removed after drought and crop failure are attributed to his
    impure heart and suspected sorcery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two et'towe are described as resting undisturbed in sealed vases in their
    chambers after their priesthood divisions ceased to exist.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shi'wanni of the Zenith is identified as pe'kwin, deputy to the Sun Father.
  category: relationship
  evidence_refs:
