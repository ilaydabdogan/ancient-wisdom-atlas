- id: obs:3
  text: Most shi'wanni have associates including a woman; the shi'wanni possessing
    the Kia'nakwe et'towe is said to have no female associate because no woman with
    a sufficiently good heart has been found for the role.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women associated with the A'shiwanni grind white corn into coarse prayer meal,
