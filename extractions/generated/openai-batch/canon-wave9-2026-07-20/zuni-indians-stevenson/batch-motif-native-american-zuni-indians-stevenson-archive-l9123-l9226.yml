  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Shi'wanokia, Priestess of fecundity, is present at priesthood meetings;
    she remains silent during appointments but may speak when impeachment is proposed.
  category: action
  evidence_refs:
  - ev:4
