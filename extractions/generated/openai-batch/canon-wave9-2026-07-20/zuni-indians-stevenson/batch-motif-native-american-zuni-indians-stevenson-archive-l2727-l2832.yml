canonical_text:
  quote: ''
  summary: The passage describes Zuñi ki'wi'siwe as above-ground stone ceremonial
    chambers for anthropic worship, explains their offices and dance leadership, lists
    six chambers dedicated to the six regions, notes their east-west orientation as
    symbolic of the Sun Father's daily course, and describes paired elder-younger
    relationships among chambers in Kor'kokshi rain-making dances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ki'wi'siwe are above-ground rectangular stone chambers dedicated to anthropic
    worship, with finished interior walls, special hatchways, front wall light openings,
    an interior door, and a stone-slab fire altar beneath the hatchway.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A'wan tii^chu Ko'vemshi appointed a Deer clan man as Ko'mosona and director-general
    of the ki'wi'siwe, a Deer clan warrior, a Badger clan man as Ko'pekwin, and a
    Badger clan warrior to the Ko'pekwin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain anthropic gods are allied to particular ki'wi'siwe, and their dances
    are directed by the dance director of the relevant ki'wi'sine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'There are six ki''wi''siwe, each dedicated to one of six regions: north,
    west, south, east, zenith, and nadir.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When possible, the ceremonial chambers extend east and west, described as
    symbolic of the daily course of the Sun Father.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each ki'wi'sine has a dance director who leads songs and dances, and has managers
    appointed for life unless impeached for cause.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Kor'kokshi are described in a note as dancers for good and as rain-makers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage explicitly says that the Zuñi dual system is expressed in the
    coupling of the ki'wi'siwe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For Kor'kokshi dances, paired ki'wi'siwe are classified as elder and younger
    brothers, with younger brothers supplying the goddesses; the order is reversed
    when the other chambers take up the dances.
  category: sequence
  evidence_refs:
  - ev:7
