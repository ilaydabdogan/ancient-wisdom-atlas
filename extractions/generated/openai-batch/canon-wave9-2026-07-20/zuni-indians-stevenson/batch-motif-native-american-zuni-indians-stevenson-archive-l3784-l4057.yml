canonical_text:
  quote: ''
  summary: In this Zuni history myth passage, the two brothers and the A'shiwi emerge
    through a water-filled place and successive inner worlds while carrying rain and
    crop fetishes. They seek the Middle of the world, follow a route marked by named
    springs and places, see Sun Father and daylight, and the passage also names an
    old dance man and old dance woman as knowledgeable makers of rivers and a mountain.
  language: English with Zuni transliteration and interlinear glosses
  quote_policy: summarized
