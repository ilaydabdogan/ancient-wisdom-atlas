  summary: The passage describes Zuñi crop varieties, spring-fed irrigation districts,
    the To'seluna spring at Ojo Caliente, ditch management and water distribution,
    field guarding, seasonal residence at farms, corn husking and storage, grain reserves
    against famine, and women's small gardens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists many colors of corn and beans and states that corn and wheat
    are raised in several farming districts and in fields near Zuñi.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corn is grown in clusters in arid land, and the three named farming districts
    are each irrigated from a spring.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: To'seluna spring at Ojo Caliente is described as a deep, clear body of water
    at the base of a low limestone mountain, with water rising from the earth strongly
    enough to prevent a person from touching bottom.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A reported incident says that a burro loaded with milling stones entered the
    spring to drink, sank, and disappeared from sight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two ditches extend from the spring for irrigation, and water can be redirected
    by damming a ditch with earth banked between tree boles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The master of the ditch performs damming at the request of people who want
    water from the higher ditch; the governor of Zuni settles rare water disputes
    and is responsible for fair distribution.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1904, men under the master of the ditch made a temporary ditch so that
    water could reach a woman's elevated garden above the spring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When corn and melons ripen, fields are guarded with rude shelters, and scarecrows
    are used because of ravens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many Zuñis leave the village for summer houses in the farming districts and
    remain there as late as possible in autumn, while still attending ceremonials
    in Zuñi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After harvest, corn is brought home, spread on roofs, husked, and stacked
    carefully in storage rooms; corn husking is described as a frolic.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wheat is threshed in the farming districts, winnowed in baskets, and stored
    in stone-slab bins or large pottery jars; a Zuñi storage room may contain objects
    from sacred to low-value materials.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Zuñis aim to keep a year's supply of grain untouched in case of crop failure,
    and both Zuñis and neighboring tribes have sought relief during starvation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Women raise onions, chillis, amaranthus for red coloring, and condiment herbs
    in small gardens in the farming districts and at Zuñi; the Zuñi gardens are protected
    by adobe walls.
  category: action
  evidence_refs:
  - ev:9
