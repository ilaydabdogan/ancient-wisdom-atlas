canonical_text:
  quote: ''
  summary: 'The passage recounts origins and transmissions of Zuñi/A''shiwi fraternities:
    gods from Chi''pia visit Hal''ona, wear masks, initiate men into medicines and
    songs, and leave masks that enable further initiation; three named gods similarly
    initiate members of the Great Fire fraternity. It then describes the Little Fire
    fraternity and It''sepcho order as adopted or transmitted from the Hopi/Mu"kwe
    Corn clan to two A''shiwi visitors, later extended to more members and performed
    at Shun''te''kiaya.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Six Shiiinai'koli, with their warriors, accepted an invitation to Hal'ona;
    on a second visit the gods wore masks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods initiated a man of the Po'vi'kwe clan into a medicine described as
    a panacea for convulsions and limb cramps, and taught him songs said to have been
    given to them by the Sun Father.
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The gods left their masks with the initiated man; he initiated others and
    formed a fraternity named Shu'maakwe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the Great Fire fraternity was assembled in its ceremonial chamber, Kok'ko'hlan'na,
    Shits'ukia, and Kwe'lele appeared from Chi'pia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each of the three gods initiated a man of the Great Fire fraternity into a
    medicine for swellings, left masks with the initiated men, and those men later
    initiated others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ma"ke "San'nakwe, or Little Fire fraternity, is described as an important
    fraternity generally believed by Zuñi sages to have been adopted from the Hopi
    Indians.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The main body of Mu"kwe/Hopis left the Corn clan and settled on three mesas;
    the Corn clan was later visited by two A'shiwi, one from the Badger clan and one
    from the Frog clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that members of the Frog clan could kill deer and antelope
    by throwing medicine of the 'San'iakiakwe fraternity upon the game.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two A'shiwi observed feats of Little Fire fraternity members, asked to
    be initiated, and were received by the mo'sona into the order of It'sepcho, or
    Jugglery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The fraternity is described as divulging only one order and receiving no payment
    from the two A'shiwi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: On returning to Han'lipinkia, the two A'shiwi initiated eight others, making
    ten members in all; the order is said to have been transmitted from the Hopi Indians
    and to have existed among the A'shiwi before the organization of fraternities
    at Hal'ona.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A note reports an investigation supporting the sages' view that members of
    this fraternity were among Zuñis who had separated from their people and lived
    with the Hopis.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: After certain A'shiwi moved from To'wa yal'lanne, or Corn mountain, to Shun'te'kiaya,
    those initiated into It'sepcho danced in the plaza there.
  category: action
  evidence_refs:
  - ev:8
