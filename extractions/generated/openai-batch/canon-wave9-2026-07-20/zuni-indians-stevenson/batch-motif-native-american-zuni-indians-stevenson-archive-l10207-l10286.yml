  summary: The passage describes a Zuñi ceremonial sequence involving A'shiwanni,
    Corn Maiden personators, baskets of yellow and blue corn, dancers who carry and
    return the corn, a ritual passing of corn before dancers' lips, repeated dances
    over alternate days, and construction of a spruce-and-cedar ham'pone in the sacred
    dance court on the seventh morning.
