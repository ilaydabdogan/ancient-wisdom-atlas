canonical_text:
  quote: ''
  summary: The passage describes mortuary actions after We'wha's death, including
    dressing the body, viewing, grief, burial, food offerings to fire, prayer plumes,
    deposition of clothing and mask, and destruction or retention of possessions.
    It then recounts the death of Nai'uchi, a rain priest and Bow priest, including
    deathbed attendance, ritual healing explanations involving witchcraft and lightning-struck
    wood, and conflict with an American physician's treatment.
  language: English
  quote_policy: summarized
