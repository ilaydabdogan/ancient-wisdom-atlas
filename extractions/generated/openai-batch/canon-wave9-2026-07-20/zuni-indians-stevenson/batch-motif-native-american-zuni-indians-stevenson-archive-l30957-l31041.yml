literal_observations:
- id: obs:1
  text: At early dawn most of the fraternity goes to a well, makes a small fire, heats
    water, washes heads in yucca suds, and bathes their bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice accompanies the fraternity father to the father's house, where
    the father washes both his own and the novice's head and body; the wife may heat
    water, but the man and wife do not speak or look at each other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The leader of the song and his alternate remain in the ceremonial chamber
    to prepare medicine and later bathe in the chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The participants chew native squash seeds and burr seeds, eject the mixture
    into their palms, and rub their bodies to prevent injury from cactus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first dance dress includes black woven breechcloths, yucca wreaths around
    the head, fluffy eagle plumes tied to the forelock, and bare feet.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Most participants carry bunches of willows; the director carries a po'nepoyanne,
    leads the file, and the procession moves with slow measured steps while chanting
    prayers to the new day and a drummer beats lightly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At sunrise in the plaza, the dancers form an ellipse, dance around twice,
    turn inward at the director's signal, and the director asks for health, pure hearts,
    divine favor, and good for all peoples.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before a second visit to the plaza, bodies are painted white with kaolin containing
    the chewed squash-and-burr mixture, described in the passage as medicine belonging
    to the Gods of War.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder brother Bow priest has the upper face painted black, the lower portion
    painted white and dotted with hawk down that the passage says symbolizes clouds,
    with down also placed on the nose.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Additional costume elements include belts with goat's-wool fringe, eagle plumes,
    fox skin, leather armlets, necklaces, blue yarn with sleigh bells below the knee,
    moccasins, flowing hair tied at the nape, yucca wreaths, and red-colored eagle
    plumes; the two warriors wear war pouches.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The leader of the dances and his fellow prepare pieces of cactus by applying
