  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the second plaza dance, after dancing around twice and standing in an ellipse,
    participants enact a sequence involving West, South, East, Zenith, and Nadir,
    with runners followed and struck over the left shoulder by specified counterparts.
  category: sequence
  evidence_refs:
  - ev:6
