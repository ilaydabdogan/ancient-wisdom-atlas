canonical_text:
  quote: ''
  summary: 'The passage describes large-scale household preparations for the Sha''lako
    festival: corn is brought in, women and maidens prepare food and meal, grinders
    and dancers perform to grinding songs with drum and rattles, corn ears are handled
    with prayers and sacred breath, a prayer is offered at sunset, a feast follows,
    and departing guests bless a newborn with fireplace ashes and a prayer for health
    and long life. A note states that two original grinding songs were given to the
    Zuni by Corn maidens, while other grinding songs were borrowed from neighboring
    Pueblos during crop failures.'
  language: English
  quote_policy: summarized
