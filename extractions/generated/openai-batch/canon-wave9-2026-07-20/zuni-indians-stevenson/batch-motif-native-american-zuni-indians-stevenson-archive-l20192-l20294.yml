canonical_text:
  quote: ''
  summary: The passage describes Zuni food preparation and diet, including fried doughnuts
    adopted from Mexicans, hominy, roasted and popped corn, squash, fruits, nuts,
    meat, and game. It also records ceremonial corn distribution, a practice in which
    some men eat whole eggs to bring larger families, a reported Navaho parallel to
    that superstition, and the use of game as an offering to Beast Gods so they may
    mediate between the Zunis and anthropic gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doughnuts are described as adopted from Mexicans and made from salted wheat
    flour dough fried in beef or mutton grease or lard.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hominy is described as a staple food prepared by boiling corn with wet ashes,
    stirring it for several hours, washing it at the river, and using it fresh rather
    than storing it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sweet corn is roasted overnight in an excavation with cedar, live coals, stones,
    and husks; uneaten ears are dried for storage, and corn for ceremonials is boiled
    with husks left on and thrown to the populace by the pulled-back husks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Popped corn is made by toasting grains in bowls balanced over coals and stirring
    them with slender cottonwood sticks until they become white.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Squash is prepared by roasting it whole in ashes, stewing it fresh, or boiling
    dried pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Native fruits, including cactus fruit, yucca fruit conserve, and piñon nuts,
    are described as widely used foods.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Animal flesh is a major part of the diet; chickens are kept for eggs, egg
    whites are used in paint, and whole eggs are sometimes eaten by men to bring larger
    families.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that Navahos have the same superstition concerning whole
    eggs and larger families.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Meat is usually stewed or sometimes fried or roasted, and many parts of cattle
    and sheep are eaten, including organs, brains, chitterlings, and blood made into
    pudding.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Game is described as increasingly scarce but still prepared as food, and as
    a necessary offering to the Beast Gods to induce them to mediate between the Zunis
    and the anthropic gods.
  category: relationship
  evidence_refs:
  - ev:8
