canonical_text:
  quote: "“Fire is therefore a goddess, second in importance only to the sun.”"
  summary: The passage describes a Zuni ritual concern about taking firelight outside
    at night, the duties and restrictions of a fire-tender during a festival, an explanation
    of former central fire use and fire’s divine status, preparation and deposition
    of te'likinawe offerings, initiation rules governing who may make them, and a
    household scene in which Zuni and Hopi participants prepare offerings while children
    begin learning ritual practices.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A shi'wanni says that a woman went outside at night with a light from his
    house, and he fears crop loss for four years; he distinguishes between an exposed
    candle and a more housed lantern.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth day, the fire-tender covers coals with ashes, eats at home, deposits
    his individual te'likinawe, and returns to the ki'wi'sine where a fire burns through
    the day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fire-tender rekindles the fire from coals, gathers cedar for the fire
    altar, leaves only to eat and gather wood, and must keep food out of the ki'wi'sine
    for ten days; breaking the food rule is said to risk crop destruction and death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The account states that no perpetual fire is kept in the ki'wi'siwe of any
    pueblo since matches were introduced and journeys to wood became safer; formerly
    a central village fire conserved fuel and supplied coals for other fires.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that fire gives warmth and light, cooks food, conveys the
    spiritual essence of food to the gods, and is a goddess second in importance only
    to the sun.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: From the fifth to eighth day the pueblo is active with grinding and songs,
    and on the eighth day households prepare foods before the fraternities adjourn
    and meat may be eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the eighth day, people prepare many te'likinawe; fashioning sticks or attaching
    plumes is restricted to those who have received voluntary initiation into the
    Ko'tikili, with a stated exception for a woman formerly connected with the U'huhukwe
    fraternity who has been instructed by her fraternity father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the ninth day, Ko'tikili members deposit te'likinawe to the sun, moon,
    Kok'ko A'wan, game animals, birds of the six regions, birds of summer and winter,
    and to Po'shaiyiinki for domestic animals; certain women and young uninitiated
    male children are exempt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Hopi man married to a Zuni woman and Hopi visitors sit in Jose Palle's room
    preparing te'likinawe described as different from those offered by the Zuni; other
    family members in the room also prepare te'likinawe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jose Palle's wife makes U'huhukwe te'likinawe after resigning from that fraternity;
    children play with plumes, and a young mother ties a plume to her infant's hair,
    gives him a ceremonial rattle, and teaches him to dance.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
