canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Zuñi Great Fire Fraternity ceremony:
    prayer and medicine-water distribution; preparation of novice objects; second-night
    body painting, meal sprinkling, altar rites, dances by warrior and theurgists,
    asserted temporary presence of Beast Gods in the theurgists, fire handling by
    a Sia Fire fraternity guest and others, healing of the sick, and closing distribution
    of medicine water. It also notes a delay on the third night caused by attempted
    flash-light photography and objections by the fraternity.'
  language: English
  quote_policy: summarized
