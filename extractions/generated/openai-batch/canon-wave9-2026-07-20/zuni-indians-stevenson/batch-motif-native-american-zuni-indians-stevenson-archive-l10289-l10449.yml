    ritual objects in the ceremony space.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men assemble in the ki'wi'sine and prepare te'likinawe by attaching plumes
    to sticks, coloring them black, binding a diminutive crook and la'showawe with
    cotton cord, wrapping them in corn husk, and placing them in baskets of corn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The te'likinawe offerings are described as being made to rain-makers to induce
    intercession with the Sun Father so that rains will embrace the earth and corn
    will grow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kia'kwemosi sits by the medicine bowl while a woman places a water vase
    and gourd by him; he pours six gourdfuls of water into the bowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kia'kwemosi drops six a'thlashi separately into the medicine bowl, raising
    each stone and praying before depositing it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The a'thlashi are identified as concretions sacred to the mother of corn of
    the six regions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A blanket is spread in front of the cloud symbol; the pe'kwin sits west of
