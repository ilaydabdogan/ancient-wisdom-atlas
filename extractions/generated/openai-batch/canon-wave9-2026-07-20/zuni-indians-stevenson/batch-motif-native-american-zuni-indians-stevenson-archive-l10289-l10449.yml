canonical_text:
  quote: ''
  summary: 'The passage describes preparations and ritual actions for the Thla''hewe
    rain ceremony in a ki''wi''sine: a cloud symbol and meal lines are prepared, te''likinawe
    offerings are made and placed in baskets of corn, water is consecrated in a medicine
    bowl with six sacred stones, participants take arranged positions, decorated tablets
    and stems are displayed, and ears of corn are prayed over, seeded, sealed, and
    returned.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cloud symbol of meal is made on the floor, with a meal line extending eastward;
    four concentric circles of meal are formed for a medicine bowl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The diagram identifies named participants, choirs, baskets, water vessels,
