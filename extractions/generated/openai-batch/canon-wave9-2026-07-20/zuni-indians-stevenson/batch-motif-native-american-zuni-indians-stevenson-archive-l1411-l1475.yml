canonical_text:
  quote: ''
  summary: The passage recounts the A'shiwi opening Cha'kwena's game corral after
    conquest, describes the ruin Kla'makla and offerings near its springs, narrates
    a post-conquest thanksgiving ceremony involving a drum, summoned earth beings,
    and scalps, and tells how drought threatened when a witch stole prayer plumes
    before the Sun Father received the prayers, until the Divine Ones recovered and
    replanted them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After capturing the village, the A'shiwi opened the gates of the corral where
    all game had been kept and addressed the game as free to roam the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that since the release from the corral, game has roamed
    over the face of the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kla'makla is described as a large ruin south of Zuñi, near the trail to the
    Zuñi salt lake, on a black-rock canyon wall with many cold clear springs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Zuñis identify an enclosure at Kla'makla as the corral where Cha'kwena
    kept all game and where young animals waited in wall niches while mothers grazed
    outside.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hundreds of te'likinawe offerings to the departed Kla'nakwe are described
    as dotting the canyon walls near the springs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Zuñis are said to visit the ruin only with special permission from ritual
    directors associated with the ki'wi'siwe or with personators of the Kla'nakwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the conquest, the A'shiwi formed around a drum at Hiin'lipinkia, called
    seven beings from the earth, divided Ku'vapiili'sa's scalp, and repeated a ceremony
    formerly held before battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The post-conquest songs are described as thanksgiving songs for scalps, not
    songs for destroying the enemy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The songs are said to bring good fellowship between the deceased enemy's ghost
    self and the A'shiwi and therefore much rain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: U'yuyewi and ^la'sai'lema declared that the ceremony must always occur after
    an enemy is scalped.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The beings who came from the earth instructed that, in future repetitions,
    the pottery drum must be struck first with enough force that they would hear and
    attend invisibly to ensure correct singing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A second danger at Hiin'lipinkia is attributed to the wrath of the A'shiwi
    gods, with unanswered rain prayers and drought threatening starvation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The A'shiwi began to fear that their A'shiwanni were not pure of heart.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says a witch stole te'likinawe deposited by the Kia'kwemosi and
    others before the Sun Father had received the prayers breathed into the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Divine Ones recovered the stolen te'likinawe; the plumes were planted
    again, and the threatened calamity was averted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A note explains Hiin'lipinkia as a 'place of stealing' named from this occurrence
