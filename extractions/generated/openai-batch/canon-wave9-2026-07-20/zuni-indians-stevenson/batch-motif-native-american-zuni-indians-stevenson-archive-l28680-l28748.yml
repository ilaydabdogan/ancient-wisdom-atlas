canonical_text:
  quote: ''
  summary: 'The passage describes Ha''lo''kwe ant-fraternity initiation and healing
    practices: prayer plumes are offered at ant-hills for rain and curing power, ant
    gods are said to cause disease by sending pebbles into offenders, and theurgists
    ritually remove those pebbles through four-night invocations of directional ant
    powers. It also notes a fourth-morning novice rite at a deserted ant-hill and
    a brief statement about A''chiyala''topa, a Zenith being associated with knives
    who gave the knife to the Ha''lo''kwe.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate heading identifies an altar of the Ha'lo'kwe, or Ant Fraternity,
    before fetishes are placed on it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Initiation into the Hii'lo'kwe order sometimes occurs on the first night of
    a fraternity meeting for initiation into Mystery medicine, whose initiation occurs
    on the last night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity father prepares prayer plumes for the ants of the six regions
    and at sunset takes the novice by the southern road to an ant-hill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the ant-hill the fraternity father and novice face east; the father prays,
    deposits some prayer plumes separately on the ant-hill, and the novice plants
    his portion one by one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayers during plume planting ask for rains to fructify the earth and
    for the ant gods to give power to cure disease.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ha'lo'kwe are described as agents of the ant gods and as healers of disease
    caused by those gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ant gods are said to shoot pebbles from ant-hills into people who micturate
    or step upon them; the pebbles cause cutaneous troubles and sore throat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Relief is obtained when theurgists bring the pebbles to the surface through
    prayers and incantations and brush them from the body with broom straws.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: When treated in the ceremonial chamber, the patient sits on a low stool in
    the center of a white embroidered blanket, and meal lines are drawn from the blanket
    toward the altar, ladder, north ledge, and south ledge so that the ants or their
    spirits may come over the meal road.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The patient is present for four nights while theurgists surround him, holding
    eagle-wing plumes, broom straws, and gourd rattles, and use incantations to invoke
    the ant gods to give power to see the disease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The first night especially appeals to the Yellow Ant of the North, the second
    to the Blue Ant of the West, the third to the Red Ant of the South, and the fourth
    to the White Ant of the East.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A wild animal-like cry may occur when one of the Beast Gods is invoked to
    influence the ant gods to give theurgists power to see disease.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After a time, pebbles are brushed off in showers from the patient's nude body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that the Zuñis and the Sia observe the same method in curing
    disease caused by angry ants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: On the fourth morning, the novice and fraternity father go to a deserted ant-hill;
    the novice extends his right foot over the hill, holds the tips of the father's
    eagle-wing plumes, stoops over the ant-hill, and remains holding the plumes while
    the father prays.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Prayer plumes for novices of the A'chiya order are yellow-painted sticks with
    eagle plumes and feathers of birds of the six regions; these offerings are to
    A'chiyala'topa, described as the being of the Zenith with wings and tail of knives,
    who gave the knife to the Ha'lo'kwe.
  category: relationship
  evidence_refs:
  - ev:7
