canonical_text:
  quote: ''
  summary: An accused youth is made to help search for prayer plumes and medicines
    associated with witchcraft. He describes a plume stick that can anger rain-makers
    or convert a person into animal form. The writer intervenes to prevent his hanging.
    In a public nighttime assembly, the youth declares that his inherited witchcraft
    power has permanently left him after visiting his mother's camp and speaking with
    her. Na'iuchi and the crowd thank the writer, and Na'iuchi later gives her the
    objects as evidence for officials that witches exist in Zuñi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warriors gather around two packages and listen to the accused youth's marvelous
    tales.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The accused youth removes plaster, and an old prayer plume appears among it;
    he declares it to be one of the plumes he was seeking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth asserts that a plume stick planted top downward in the ground, or
    worn in the belt in the same position, offends rain-makers so that they refuse
    to water the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth asserts that the plume stick must be worn over the heart to convert
    a person into animal form.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer takes the accused youth to her camp under guard, talks to him,
