canonical_text:
  quote: "“The songs and prayers are to bring rains to fructify the mother earth”"
  summary: A Zuñi ritual leader receives and arranges fetishes, baskets, plumes, meal,
    and tobacco smoke offerings. Prayers and songs address beings of the six regions,
    including directional women and animals. The rite seeks rain for mother earth
    and closes at dawn with prayer, inhalation of sacred breath, return of ritual
    objects, and later planting of te'likinawe in fields.
  language: English
  quote_policy: quoted
