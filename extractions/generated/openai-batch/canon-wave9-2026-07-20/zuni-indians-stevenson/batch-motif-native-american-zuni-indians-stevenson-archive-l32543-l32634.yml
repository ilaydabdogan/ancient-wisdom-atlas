  summary: The passage describes a Zuñi plaza ceremony involving placement around
    a cloud symbol and a meal painting, guarded ritual objects, music and dances by
    named groups, grass wands deposited at a War Gods shrine, armed dances with prayers,
    Sha'liiko personators dancing for rain and bounty, a hidden priest sounding a
    shell while Bow priests whirl rhombi for clouds, and a dramatized encounter with
    a Navaho foe using baskets of red wafer bread placed by the scalp pole.
