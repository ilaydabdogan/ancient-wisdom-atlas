canonical_text:
  quote: ''
  summary: The passage describes the Zuñi rain priesthood, its regional organization
    around a ceremonial house marking the world’s middle, and the sacred et'tone objects
    held by most rain priests. The et'tone are dual sets of hollow reeds containing
    water, a toad, and seeds, said to descend from objects brought from the undermost
    world to the outer world. The passage also describes their clan custody, storage
    in sealed chambers, restricted handling, and an observed opening of one chamber
    for photography.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rain priesthood is described as consisting of fourteen A'shiwanni, the
