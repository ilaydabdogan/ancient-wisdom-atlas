    reeds containing pellets of epidermis from body rubbing, closed with raw cotton,
    wrapped with cotton cord, and surrounded by wild eagle feathers found by members
    and attached by the director; the fetish grows as feathers are added.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 22900-22913
  quote_or_summary: On the fourth morning after a Mystery medicine member dies, the
    director takes the mi'li apart. Members make prayer plumes, pray to Beast Gods
    for rain through the rain-makers, draw the breath of A'wonawil'ona, pray for happiness,
    long life, and awakening in Ko'thluwala'wa, and the director deposits a bundled
    group of plumes in the river to carry spiritual essence and prayers to the gods.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 22913-22915
  quote_or_summary: The same process is observed with the mi'li of a deceased Shu'maakwe,
    with prayers offered to the Shumai'koli gods for rain, happiness, and long life.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 22917-22920
  quote_or_summary: When a mi'li is disintegrated, seeds from the corn-cob cavity
    and grains from the cob are distributed to order members, who plant them in their
    fields the coming year.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 22922-22929
  quote_or_summary: The Shi'wannakwe do not destroy their mi'wachi. A deceased member's
    mi'li is kept in his house until his son can join; if there is no son or the son
    does not join, the director gives it to someone chosen by him.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 22929-22939
  quote_or_summary: The writer says several fraternities presented sacred objects
    to her, including a Mystery medicine mi'li prepared by Nai'uchi, elder brother
    Bow priest and warrior of the Little Fire fraternity, with the same prayer and
    ceremony as over a novice; Nai'uchi also lent his own mi'li briefly under a promise
    that no one, except perhaps his son, would see it.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
