candidate_motifs:
- id: motif:1
  label: initiation through receipt of a sacred ritual object
  taxonomy_refs:
  - initiation
  basis: The novice receives a mi'li after it is made in a ceremonial chamber with
    songs addressed to sacred beings and placed by the altar.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes a ritual procedure rather than a narrative initiation
    myth.
- id: motif:2
  label: sacred healing object dependent on life-giving divine power
  taxonomy_refs: []
  basis: The passage states that Beast Gods' medicine has value only if blessed by
    A'wonawil'ona and that initiated persons possess a mi'li of Mystery medicine.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: No listed taxonomy family precisely matches a healing fetish empowered
    by a supreme life-giving force.
- id: motif:3
  label: fire-play mystery as fraternity initiation
  taxonomy_refs:
  - initiation
  basis: The 'San'iakiakwe is said to have been initiated into the mystery of playing
    with fire.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only a brief statement and no details of the fire rite.
- id: motif:4
  label: death rite transforming a sacred object into prayer offering
  taxonomy_refs:
  - sacred_exchange
  - death_rebirth
  basis: After a member's death, the mi'li is taken apart; prayer plumes are made,
    prayed over for rain and life, and deposited in the river to carry spiritual essence
    and prayers to the gods.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The death_rebirth taxonomy is only cautiously applicable; the passage
    speaks of death, prayers for life, and awakening in Ko'thluwala'wa, not an explicit
    resurrection narrative.
- id: motif:5
  label: sacred corn recycled into future planting
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: Seeds and grains from the corn-cob of a disintegrated mi'li are distributed
    to members and planted in the coming year.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage reports ritual redistribution and planting; it does not explicitly
    interpret this as rebirth.
- id: motif:6
  label: lineal or controlled transfer of a sacred object
  taxonomy_refs:
  - sacred_exchange
  - initiation
  basis: The Shi'wannakwe keep a deceased member's mi'li for his son or transfer it
    by the director's choice; Nai'uchi also presents a mi'li with novice-like ceremony
    and restricts viewing of his own.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage gives transfer rules and examples but not a full mythic inheritance
    narrative.
comparison_claims:
- id: claim:1
  claim: Within the passage, multiple fraternities share the use of mi'li objects
    while differing in order structure, composition, and associated rites.
  claim_level: same_function
  target: mi'li use in Mystery medicine, 'Hle'wekwe, 'San'iakiakwe, and Shu'maakwe
    contexts
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explicitly distinguishes fraternities and does not state
    that all mi'li have identical ritual meaning.
- id: claim:2
  claim: The postmortem treatment of a deceased Shu'maakwe member's mi'li is described
    as following the same process as the Mystery medicine death rite, with prayers
    directed to different gods.
  claim_level: same_function
  target: Mystery medicine and Shu'maakwe deceased-member mi'li rites
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the process described in this passage
    and does not include unquoted details of either fraternity's wider ceremony.
- id: claim:3
  claim: The passage contrasts destruction/disintegration of a deceased person's mi'li
    in some contexts with preservation and transfer among the Shi'wannakwe, showing
    different handling patterns for the same class of sacred object after death.
  claim_level: same_function
  target: postmortem handling of mi'li across described orders and the Shi'wannakwe
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explain why the Shi'wannakwe rule differs, so
    functional equivalence should remain cautious.
