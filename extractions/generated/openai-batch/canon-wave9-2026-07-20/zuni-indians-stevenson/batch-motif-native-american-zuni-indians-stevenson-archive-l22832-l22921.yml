  summary: The passage describes Zuñi fraternity mi'li objects, their construction
    and variant forms, their association with A'wonawil'ona and other sacred beings,
    and rites surrounding initiation, death, prayer plumes, river deposition, planting
    of corn from disintegrated mi'li, inheritance, and restricted handling.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Healing through the Beast Gods is said to require blessing by the mysterious
    life-giving power of A'wonawil'ona.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person initiated into Mystery medicine possesses a mi'li made by the fraternity
    father in the ceremonial chamber while five songs are sung before members of the
    order.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The songs used in making the Mystery medicine mi'li are addressed to A'wonawil'ona,
    the Sun Father, the Moon Mother, the Beast Gods of the six regions, and A'chiyala'topa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When completed, the mi'li is placed by the altar until it is given to the
    novice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The 'Hle'wekwe is described as having a Sword order, no Mystery medicine order,
    one mi'li, a po'nepoyanne, and an et'tone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The 'San'iakiakwe is described as having no Mystery medicine order, while
    each member has a corn-and-turkey-tail-plume mi'li; it was organized for the chase
    and initiated into playing with fire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Shu'maakwe mi'li described for nose-pierced members is built over an ear
    of corn, covered with plumes, includes prayer-plume sticks, a central zigzag-marked
    lightning stick, cotton cord wrapping, and shell adornments called necklaces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The po'nepoyanne is described as a bundle around an ear of corn, containing
    reeds filled with body epidermis pellets, raw cotton closures, cotton cord wrapping,
    and eagle feathers found by fraternity members.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fourth morning after the death of a Mystery medicine member, the director
    takes apart the deceased person's mi'li and members make prayer plumes from it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Prayer-plume makers pray for rain, happiness, long life, and awakening in
    Ko'thluwala'wa, and the director deposits a bundled group of plumes in the river
    so the spiritual essence of plumes and prayers may go to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a mi'li is disintegrated, seeds and grains from the corn-cob are distributed
    to order members, who plant them the following year.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Shi'wannakwe do not destroy their mi'wachi; a deceased person's mi'li
    may be kept for his son or given by the director to someone else.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Nai'uchi prepared and presented a Mystery medicine mi'li to the writer with
