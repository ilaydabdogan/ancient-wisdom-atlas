canonical_text:
  quote: ''
  summary: The passage describes Kla'nakwe markings and a corn blessing by the A'wan
    Si'ta; recounts the survival, rain-making, adoption, and et'tone custody of the
    Black Corn people; notes a Plumed Serpent fetish and chamber painting; and explains
    the Zuni Middle of the world through the actions of 'Kian'astepi, the placement
    of the Kia'kwemosi et'tone, and the He'patina shrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kla'nakwe are described as having one half of the face red and the other
    white, divided by a diagonal line.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'wan Si'ta, identified as a direct descendant of the Kla'nakwe, bathes
    each dance participant's head and draws an ear of corn four times over the head
    while speaking a ritual formula.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A boy and girl were found by a meal symbol of clouds with raw cotton closing
    their ears and nostrils while they inhaled medicine fumes from a vessel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man states that they had been Yellow Corn people, that the A'shiwi
    had destroyed or driven off the others, and that his medicine made their belt-corn
    black, giving rise to the Black Corn people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some A'shiwi wished to kill the survivors, but the Kia'kwemosi allowed that
    they might have an et'tone, and the old shi'wanni claimed protection through great
    things associated with his et'tone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old Black Corn shi'wanni and the Kia'kwemosi each spent four days in retreat
    singing rain songs, and both produced much rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the rain songs, the two ritual leaders became friends, and the old priest
    and his family were adopted into the A'shiwi tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old priest's et'tone remained in the possession of his Black Corn descendants
    and, after the death of a later keeper in 1902, stayed permanently in its resting
    place.
  category: object
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: A priestly keeper of the fetish Ko'loowi'si, the Plumed Serpent, had the privilege
    of painting an elaborate serpent on the wall of the et'tone chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The A'shiwi left the area of Ma"sakia because they judged it too far east
    for the center of the world and then built Hal'ona.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: "'Kian'astepi came from the south, spread his legs, and declared the Middle
    of the world to be beneath his heart; I'tiwanna was then built at that indicated
    place."
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The et'tone of the Kia'kwemosi rests at the place understood as beneath 'Kian'astepi's
    heart and therefore as the Middle of the world.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: He'patina is a shrine symbolizing the Middle of the world, while the Middle
    place where the Kia'kwemosi et'tone rests is considered too sacred to be mentioned
    except by the Kiakwe amosi.
  category: relationship
  evidence_refs:
  - ev:9
