canonical_text:
  quote: ''
  summary: 'The passage describes parts of fraternity initiation rites: washing novices
    with suds, use of mi''li with sacred breath, gifts and food preparation, special
    rules for the Shi''wannakwe fraternity, a celestial dry painting used at initiation,
    offerings at a shrine, and a Fire order rite involving coals and yarrow medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women prepare suds; fraternity parents and then members of the order of Mystery
    medicine dip plumes into bowls and put suds on the novices' heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The head and hands of each candidate are washed by those who prepared the
    suds, and the hair is wiped by the mother or sister of the fraternity parent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each fraternity parent removes his mi'li from the altar, passes it four times
    downward before each novice's mouth while sacred breath is drawn, and applies
    it to the left side of the face, crown of the head, and right side of the face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bowl used for bathing the head is given to the novice.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Women from the fraternity father's family and the candidate's family exchange
    gifts of flour, cornmeal, and similar items; women of the fraternity and families
    of male members furnish and prepare ceremonial food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Shi'wannakwe and San'iaklakwe do not observe the winter solstice fast
    from animal food because they received direct instructions from the Divine Ones;
    the Shi'wannakwe must not eat jack rabbit at any time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'The Shi''wannakwe fraternity has three orders: O''naya''nakla, It''sepcho,
    and Ma''ke, identified respectively as Mystery medicine, Jugglery, and Fire.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: A Shi'wannakwe novice usually appears before the fraternity on the fourth
    night, escorted from home to the ceremonial chamber by the fraternity father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The dry painting made at Shi'wannakwe initiation is described as associated
    with celestial worship rather than directly with worship of beasts of prey.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The dry painting includes an outline of a tablet altar, a mi'wachi of the
    O'naya'nakla order, a line of meal, the Galaxy formed of meal and outlined in
    charred corncob, and sun and moon symbols.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: The sun and moon symbols are made of corn pollen, burnt corncob, crushed turquoise,
    and other mineral colors; lines extending from the disks denote the sun's rays.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: At Shi'wannakwe initiation, meal from the Galaxy symbol is rubbed on the novice,
    then gathered in corn husks and carried with prayer plumes to the Shi'wannakwe
    shrine southeast of Zuñi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The novice, accompanied by the fraternity father, plants prayer plumes at
    the shrine as offerings to rain priest rain-makers, sun priest rain-makers, the
    Galaxy, and the Beast Gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The Shi'wannakwe shrine is on a knoll southeast of Zuñi and includes a stone
    slab with etched sun and moon figures; the plumes are planted southwest of the
    slab.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:15
  text: In initiation into the Fire order, the novice sits in the center of the floor,
    rises when the fraternity father is ready to place coals in his mouth, and receives
    yarrow medicine mouth-to-mouth from the fraternity father to prevent burning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Shi'wannakwe possess a rude stone carving of a female.
  category: object
  evidence_refs:
  - ev:6
