  summary: The passage describes a journey to sacred ruins associated with the Kia'nakwe
    and then to a salt lake. A Zuni guide fears divine danger from visiting the ruin
    without proper permission, identifies sacred springs and other sites there, speaks
    of the Salt Mother calling him, prays and sprinkles meal when the volcanic peak
    called the home of the Gods of War comes into view, and the text describes the
    lake as a salt source, sacred mother, and neutral ground for multiple tribes.
