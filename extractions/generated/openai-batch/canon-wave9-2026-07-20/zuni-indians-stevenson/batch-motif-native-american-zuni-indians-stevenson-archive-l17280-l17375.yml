  quote: ''
  summary: The passage describes the washing, meal-covering, dressing, wrapping, and
    burial of a deceased woman, including cutting two locks of hair and a belief about
    burning hair and passing to Ko'thluwala'wa. It also describes post-burial bathing
    and cleaning, and then introduces We'wha as an especially notable Zuñi person
    who wore woman's dress and was referred to by feminine pronouns.
  language: English
