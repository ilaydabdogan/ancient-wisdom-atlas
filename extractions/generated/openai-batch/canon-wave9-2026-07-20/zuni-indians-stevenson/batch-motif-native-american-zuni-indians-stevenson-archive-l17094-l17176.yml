canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi mortuary customs: burial rather than cremation
    because the dead are identified with rain-makers; postmortem ear-piercing of infants;
    preparation of the corpse with eastward head placement, yucca suds, corn meal,
    clothing, and blankets; death announcement, mourning, prayer, and meal sprinkling;
    churchyard burial with gendered placement and eastward orientation; older and
    current grave-good practices; and bathing of a surviving spouse after burial.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Zuñi are said to claim that they always buried their dead and that cremation
    would prevent rain because the dead are rain-makers; incineration is said to annihilate
    the being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Infants buried with unpierced ears are believed not to help water the earth,
    but to carry baskets of toads and tadpoles and to wear toads at their ears instead
    of turquoise earrings; unpierced infant ears are therefore pierced after death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Immediately after death the body is placed with its head to the east, bathed
    in yucca suds, and rubbed with corn meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body is dressed in the best available clothing, with a gash cut in each
    garment so that the garment's spirit may escape to serve the spirit of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The body is wrapped in one or more blankets and usually buried soon after
    death; deceased rain priests and other officials receive more elaborate preparations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A death is usually announced by a woman of the immediate family to clan representatives
    of the deceased and spouse, who then spread the news; if present, the fraternity
    father notifies the fraternity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women mourners enter, look at the corpse, and begin a continuous howling lament,
    while immediate family and close friends are described as remaining quiet and
    showing intense grief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Prayers are offered by those present, and meal is sprinkled over the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The body is seldom accompanied to the grave by mourners; bearers often go
    alone, and interment is treated as an unpleasant duty completed quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The churchyard became sacred to the Zuñi after enforced churchyard burial
    during the Spanish conquest, and it continued to be used so the dead would not
    be separated from their own.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Men are placed on the south side of the burial ground and women on the north,
    with heads to the east.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Immediate male family members, excluding the husband or father, dig a grave
    about 5 or 6 feet deep and bury the dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says valued possessions were formerly buried with the dead, but
    at present this is not done except occasionally for one or two trifling articles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After burial of a spouse, female relatives bathe the surviving spouse; only
    a small fire is kept, the head is washed with yucca suds first, and the body is
    then bathed in cold water under a ladder leading through the hatchway.
  category: action
  evidence_refs:
  - ev:7
