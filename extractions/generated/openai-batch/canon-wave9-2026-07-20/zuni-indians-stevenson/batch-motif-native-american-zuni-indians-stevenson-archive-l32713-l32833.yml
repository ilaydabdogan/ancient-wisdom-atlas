canonical_text:
  quote: ''
  summary: 'The passage describes sunset phases of an A''pi''tlashiwanni ceremonial
    sequence: deposit of water and prayer plumes, continued dancing, meal sprinkling,
    handling and rocking of idols and fetishes, cedar-bark purification, formation
    of a circle around a pottery drum and water-and-seed vessel, rules for scalp custody,
    clan-paired circle participants, and a quiet circle dance using songs connected
    to Han"lipinkia and divine beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: As sunset approaches, the pe'kwin, the elder brother Bow priest, and two 'kia'punakwe
    visit He'patina to deposit jugs of water and prayer plumes taken from a cloud
    symbol.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother Bow priest whirls a rhombus while accompanying the party
    to He'patina.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ha'shiya continue dancing; the dance begins with bent knees to slow soft
    music, then becomes louder, more rapid, and more active.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pa'mosono'kia and her vice wear mi'ha instead of blanket wraps, have white
    fluffy eagle plumes tied to the forelock, and receive bits of cedar bark from
    the pa'mosona and his vice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first body of A'shiwanni sprinkle the meal painting and nearby objects
    with meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder and younger brother Bow priests stoop behind the images of U'yuyewi
    and Ma'sai'lema, place their hands on the images, and the idols and fetishes are
    gently rocked from right to left without being lifted from the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Two guardsmen move their spears in the same right-to-left manner until sunset.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: At sunset, the pa'mosono'kia, her vice, and others expectorate on cedar bark
    and wave it with their left hands around their heads for physical purification.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The idols and their paraphernalia are removed from the painting and returned
    to the parties who brought them to the plaza.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A group forms in the plaza center by an ancient pottery drum containing a
    cream-colored decorated archaic vase filled with water and seeds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: A circle is formed around the central group; the women do not hold hands but
    catch hold of the men's blankets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The scalp holder in the dramatization is described as either of the Coyote
    clan or a child of that clan, continuing a precedent from the original ceremonial
    at Han"lipinkia.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The songs accompanying the dance are said to be the same as those sung when
    seven beings appeared from the earth at Han"lipinkia by command of the Gods of
    War.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Each listed male circle participant has his paternal aunt, or nearest female
    relative on the paternal side, to his left; the aunt is referred to as elder sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The circle dance continues into the gloaming until all songs given by the
    Divine Ones at Han"lipinkia are sung; the step is slow from left to right, and
    all disperse silently when the dance ends.
  category: sequence
  evidence_refs:
  - ev:8
