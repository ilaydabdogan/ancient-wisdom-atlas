canonical_text:
  quote: ''
  summary: The passage describes economic and social changes in Zuni life, including
    livestock losses and later increases, fencing and a government dam, changes in
    the village, and the sale or manufacture of masks, fetishes, and altars for collectors.
    It also describes continuing secrecy around religion and rituals, limited Christianization,
    the destruction of Nina's Christian marriage certificate, and Nina's English-language
    education and self-talk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Zuni livestock supply declined from the level observed in 1879 because
    of depredations by Navahos, Mexicans, and some white settlers; sheep and goats
    were less affected because herders watched them closely.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wheat fields are described as largely protected by barbed-wire fencing, and
    a government dam is under construction.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that Zuni living conditions are improving while also judging
    that intimate contact with 'civilized man' has degraded the Zuni as a man and
    citizen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1879, the author says no money could purchase a genuine Zuni mask, and
    the people would not have made a bogus specimen because they feared offending
    their gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1896 the writer obtained nine masks through acquaintance with priests,
    while later less orthodox men are said to manufacture objects desired by collectors,
    including spurious fetishes, masks, and altars.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The village changed physically: corrals were moved away from the village,
    the old Spanish church walls were nearly gone, bells were kept by a Zuni theurgist,
    the lone cottonwood disappeared, and streets improved.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author associates adopted foreign ways with intoxication and trickery
    in dealings with white people, while stating that Zunis remain honest among themselves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says the Zunis remain secretive concerning religion and rituals
    and are as far from Christianization as before Spanish arrival.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Protestant minister solemnized one marriage involving Nina, and her marriage
    certificate was later destroyed so that Nina and her husband would be rid of Christianity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writer named Nina at age four, started her at school, and obtained Nai'uchi's
    promise to compel regular attendance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nina learned and retained English, explaining that she made two people of
    herself and talked to herself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says few other Zunis spoke English in 1896, aside from men with
    limited knowledge from outside communication and an adopted child of a teacher.
  category: attribute
  evidence_refs:
  - ev:7
