canonical_text:
  quote: ''
  summary: The passage describes a ritual sequence involving an elder brother Bow
    priest, warriors, dancers, novices, medicine grinders, water-bearers, prayers
    to the Sun Father, baptism with consecrated water, a food offering before an altar,
    a feast, and a later chamber scene with masks of the 'Chu'kweim prepared for a
    forthcoming dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother Bow priest orders the old woman guarding the fire area to
    stir the embers, removes his war pouch and beads, and places plumes in front of
    the altar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the coals are alive, the elder brother Bow priest puts his right arm
    into the coals up to the elbow and lights bunches of corn husks from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother Bow priest scatters sparks over men, women, and babies,
    and men and women are struck on faces and bodies with burning husks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the firebrand performance, the elder brother Bow priest asks others
    to whip him with burning husks and later puts burning husks into his mouth and
    chews them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A rod first wetted with medicine water is used in a striking sequence; those
    expecting strokes have their bodies bathed with the water, and a rod breaks into
    three pieces when the elder brother Bow priest is struck across the chest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second warrior brings yucca baccata and strikes several men; the elder
    brother Bow priest receives blows across both extended arms and across the chest,
    while the man holding the yucca gives an animal-like call after each blow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elder brother Bow priest takes a bear's foot skin from the altar, draws
    it over his right hand, and runs the claws up and down his brother warrior's body
    before returning it to the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the elder brother Bow priest and his associate warrior cease dancing
    and dress, the dance continues with other participants, including two young men,
    two women, and a little girl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Male and female novices leave the chamber, guided by an officer, to offer
    prayers to the Sun Father as he disappears for the night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Girls who ground the medicine are seated on the north side of the room near
    the east end, and women or girls who retire from the dance put on their pi'toni.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: At sunset, two women, one described as an albino, bring large bowls of water
    into the chamber; a third woman stands between them, and the water is consecrated
    by two warriors repeating a long prayer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'The medicine grinders approach in pairs and are baptized: the warrior holds
    the recipient by the shoulders while the woman opposite bathes the forelock, and
    the hands and wrists are washed.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After baptism, the elder brother Bow priest recites a litany answered by the
    second warrior, food is brought in, grace is offered, bits of food from each vessel
    are placed before the altar, the assembly feasts, and then separates.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: On the third night, sixteen members of the Ko'tikili gather in a white chamber
    where freshly painted masks of the 'Chu'kweim hang from a cord, covered with calico
    while their long beards show below.
  category: setting
  evidence_refs:
  - ev:7
