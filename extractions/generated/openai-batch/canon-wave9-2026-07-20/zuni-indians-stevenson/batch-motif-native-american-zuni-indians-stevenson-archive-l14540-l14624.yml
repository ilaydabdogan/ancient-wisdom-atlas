canonical_text:
  quote: ''
  summary: 'Ethnographic description of ceremonies following the Sha''lako festival
    of 1891: five-night ritual displays ordered by the gods; masked and personated
    ''Cha''kwena and He''mishikwe; Laguna and Acoma song-prayer instruction; spectators
    in Koman Luna''s house; a greenroom where personators prepare and are washed after
    dancing; social drinking and removal of intoxicated men; and the single-file entry
    of twenty-one He''mishikwe personators led by a man carrying a ni''li and meal
    basket.'
  language: English
  quote_policy: summarized
