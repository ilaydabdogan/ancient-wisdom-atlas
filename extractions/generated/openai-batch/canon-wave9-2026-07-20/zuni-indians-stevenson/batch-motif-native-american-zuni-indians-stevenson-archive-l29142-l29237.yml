    the shared function is producing ritual suds or clouds, while the technique differs.
  claim_level: same_function
  target: Sia reed technique for producing suds in a comparable cloud-making rite
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to a technical note in the passage; it does
