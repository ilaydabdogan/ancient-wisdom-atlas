canonical_text:
  quote: ''
  summary: 'The passage describes preparations and ritual actions in a Zuñi Shu''maakwe
    initiation ceremony: body painting and adornment, chewing and rubbing root against
    fatigue, music with drum and rattles, placement of pebble fetishes, prayers and
    water rites directed to the six regions and the whole world, preparation of suds
    in a cloud bowl, smoke and sprinkling rites, circular dancing with Sai''apa personators,
    masked personation of Shumai''koli of the North, and later silent attendance and
    hand-chain formation by novices and women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members assist one another in applying paint; female members paint lower arms,
    hands, lower legs, and feet white.
  category: action
  evidence_refs:
