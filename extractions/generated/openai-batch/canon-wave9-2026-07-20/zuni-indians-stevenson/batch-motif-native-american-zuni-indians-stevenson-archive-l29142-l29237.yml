  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: 'The a''kwamosi places six pebble fetishes for fructification in relation
    to the medicine bowl: four for the sides and two for Zenith and Nadir, with prayer
    for each.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The deputy a'kwamosi waves water to the six regions with prayers for rain,
    then waves it in a circle said to symbolize the whole world, and empties water
    into the medicine bowl and cloud bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
