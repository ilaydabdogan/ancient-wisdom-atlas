- id: obs:2
  text: The Sai'apa personators, described as two men and a boy, are painted white
    from neck to toe and are expected to appear without ordinary apparel because the
    Sai'apa are said to have lived before raiment was known.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After adornment, each participant receives root from the a'kwamosi, chews
    it, ejects it into the hands, and rubs the body to avoid fatigue in dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A pottery drum covered with hide, rattles, choir singing, fluting, and whirling
    of the rhombus accompany parts of the ceremony.
