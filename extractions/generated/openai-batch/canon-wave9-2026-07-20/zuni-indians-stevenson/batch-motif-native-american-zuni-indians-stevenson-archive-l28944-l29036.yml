canonical_text:
  quote: There is always a break in the circle, symbolic of the road or passageway
    of life.
  summary: 'The passage describes two evenings of a Shu''maakwe initiation ceremonial:
    offerings and food are taken to the gods, choir music begins with rattles and
    drum, Sai''apa god personators dance before the altar, participants sprinkle meal
    and inhale the sacred breath of fetishes, masks and altar objects are arranged,
    and on the second night a ritual dance circle forms with a deliberate break identified
    as a passageway of life.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Members gather in the ceremonial chamber by the light of a low fire, with
    men and women seated on ledges in different parts of the room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deputy a'kwamosi and another officer leave with corn husks containing
    offerings, while a warrior carries food from near the altar to offer it in the
    river to the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A youth distributes gourd rattles to the choir, which begins singing with
    rattle and pottery drum accompaniment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young man personating one of the Sai'apa gods dances in the center of the
    room, spinning and balancing on one foot while carrying a rattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sai'apa personator stands before the altar and inhales the sacred breath
    of the fetishes during the dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the first dance, women sprinkle meal and inhale the sacred breath, and
    men sprinkle the altar and pray.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the second day masks and other paraphernalia are completed and objects
    are added to the altar; three masks are placed before it and others are covered
    with a white embroidered blanket.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the second night, officers, four novices, women, girls, the Great Mother,
    and the choir take specified seats around the altar area.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the first stanza on the second night, two men carry away food placed
    before the altar to offer it to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An absent woman of the fraternity receives meal from each novice, wraps it
    in husk, receives a prayer plume, and goes with her fraternity father to Ku'shilowa
    to plant plumes and sprinkle meal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the second song, women, girls, and choir members form a dance circle
    of twenty, moving from left to right with a break in the circle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage explicitly states that the break in the dance circle is symbolic
    of the road or passageway of life.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Two young men who are to personate Sai'apa gods stand in the center of the
    circle, remove clothing, put on buckskin fringes tipped with conical tin, and
    dance back and forth while the circle moves.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: After the circle dance, all dancers go to the altar and inhale the sacred
    breath of life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Later, two Sai'apa dancers jump, hop, and cry out; one is replaced by a warrior,
    and an aged woman and two girls attempt to imitate the springing figure.
  category: sequence
  evidence_refs:
  - ev:10
