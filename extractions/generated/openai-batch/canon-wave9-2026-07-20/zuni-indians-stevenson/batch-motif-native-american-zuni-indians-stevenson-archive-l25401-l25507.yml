canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Zuñi ceremonial sequence: offerings of
    root medicine and plumes are deposited in a spring; a Hlem''mosona performs sword
    swallowing at directional points and prays to the Sun Father; musicians, Bow priests,
    staff bearers, directors, circle dancers, the Ille''wekwe, and the Great Fire
    fraternity participate in successive plaza rites. A prayer asks named beings to
    intercede with the Council of the Gods for cold rains, snows, long life, and awakening
    in Ko''thluwala''wa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boiled root medicine, a plume cord with a shell bead, and sand are deposited
    in a spring at the black rocks where the original Hlem'mosona is said to have
    disappeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The words spoken over the spring deposit include an instruction to go home
    and refer to I'amakwi, the Zenith, and the home of A'chiyalii'topa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a feast and rest, the Hlem'mosona goes alone to the plaza while musicians
    play and sing at boxes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hlem'mosona faces north, west, south, and east and swallows his sword;
    at the east he swallows it three times for East, Zenith, and Nadir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before sword swallowing in each circuit, the Hlem'mosona stops at cardinal
    points and stamps several times; after the six-region sword swallowing he faces
    east, prays to the Sun Father, and sprinkles meal eastward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Hlem'mosona leaves the plaza, the musicians pray aloud, wave deer-leg
    bones over the boxes, and draw a breath from them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman of the fraternity brings the tehl'nawe from the roof to the outside
    ladder; an elder brother Bow priest then leads six Bow priesthood members, each
    with a tehl'nane, while he carries an ancient staff.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tehl'nane bearers and others form a circle that must not be entirely closed;
    they move slowly from left to right while the tehl'nawe are waved up and down,
    and more men, women, youths, and maidens join the dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two a'mosi and two a'mosono'kla directresses gather dancers and carry green
    yarn with needles to fasten girls' blanket wraps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Ille'wekwe enter from the western street, pass six times around the boxes,
    and swallow swords after the first circuit; several swallow swords simultaneously
    before the boxes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Hlem'mosona waves swords over the boxes and prays to named beings for
    intercession with the Council of the Gods for cold rains, snows, long life, and
    awakening in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: During the prayer all hold swords with points upward, and at the close each
    draws a breath, described as all that is good, from his sword.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rattles and a drum of the Sword order of the Great Fire fraternity are heard,
    and the Great Fire fraternity arrives and follows after the Ille'wekwe.
  category: sequence
  evidence_refs:
  - ev:10
