  quote: ''
  summary: Ethnographic description and figure caption for the Zuñi 'Hla'hewe ceremony
    for rain, including positions of participants and ritual objects, decorated cups
    and flutes, a medicine bowl associated with Pa'yatamu, clothing and face markings,
    and personation of Yellow and Blue Corn maidens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is headed as a 'Hla'hewe ceremony for rain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure caption lists ordered positions for priests, children, choirs, flutists,
    women, baskets, water vessels, trees, bowls, coals, and excavations in the ceremonial
    arrangement.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The described cups have outer cloud symbols in yellow, blue, red, black, and
    white; their inner sides have butterflies and dragonflies painted on a white or
    blue-green ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: The scalloped edges of the cups are tipped with fluffy white eagle plumes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Flutes are laid across a serrated bowl decorated with rain symbols and containing
    medicine associated with Pa'yatamu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The medicine is said to be composed of flowers of the mythical te'nas'sali
    plant, hearts of butterflies, and dragonflies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The flutes are partly covered by a white cotton embroidered kilt with the
    same decoration as that carried by the elder brother Bow priest.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A'shiwanni wear white cotton clothing and red silk headbands; the elder and
    younger brother Bow priests add war pouches.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The two choirs wear varied cotton or calico clothing, silk headscarves, beads,
    and borrowed beads when available.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The mo'sona of the 'Hla'hewe choir has a micaceous hematite line across his
    face below the eyes, described as indicating the prominence of his office.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The mo'sona of the Sho'ko'we choir has corn pollen under the right eye and
    micaceous hematite under the left; the corn pollen is explained as signifying
    fasting, prayer, and continency for one night.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Flutists wear elaborate clothing and beads, with pollen under the right eye
    and micaceous hematite under the left.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The pollen line of the te'nas'sali on flutists is said to indicate that they
    sing the songs of Pa'yatamu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A'wan a'mosi and their fellows are dressed similarly to the flutists, with
    ordinary hair arrangement, silk bandas, and micaceous hematite streaks under the
    eyes after a morning meal.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A'wan a'mosono'kia personate Yellow and Blue Corn maidens, wear blankets,
    sashes, beads, and carry a hidden plumule ear of corn symbolic of A'wan 'Sita.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: Other mi'laiuliapo'na wear black embroidered dresses, blanket wraps, and white
    moccasins with black soles.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The figure caption identifies excavations in which corn and te'likinawe are
    deposited.
  category: action
  evidence_refs:
  - ev:3
