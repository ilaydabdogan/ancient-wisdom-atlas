canonical_text:
  quote: ''
  summary: The passage describes Ne'wekwe ceremonial dosing with offal and urine,
    regalia and markings of participants, administration by the Kok'ko 'hlan'na through
    Ko'yemshi attendants, subsequent revelry and buffoonery, mimicry of Catholic and
    military figures, and a brief transition noting the Hunters Fraternity and its
    Fire order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child identified as the daughter of the Kia'kwemosi receives a noxious dose
    without flinching, though the passage says she takes it with aversion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that participants must eat offal and drink urine so that
    their intestines will not be destroyed by the hot medicine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares the seriousness with which the dose is given and received
    to Christian churches observing their most sacred sacraments.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the Si'aa' te'wita, the Kok'ko 'hlan'na administers another dose while
    wearing described ceremonial clothing and carrying giant yucca bunches and a feather
    wand wrapped with corn husks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The assembled group is described as thirty men and five boys, mostly painted
    ash color, with one painted black with white bands; women and girls wear conventional
    dress with Hopi blankets and moccasins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each male participant carries a cord-wrapped baton colored in circles and
    topped with turkey plumes; a single grain of corn is attached at the other end
    and identified as symbolic of the heart of the baton.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kok'ko 'hlan'na moves in a peculiar dancing motion, whips a man with yucca
    switches, and hands the dose to a Ko'yemshi god, who gives it to the designated
    person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some recipients share the morsel by placing lips to another person's lips
    and forcing it into that person's mouth; children accept it as a religious duty
    while not relishing it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the god leaves the plaza at intervals, revelry includes a wool-bag game
    between Ne'wekwe and Ko'yemshi and the emptying of urine vessels over one another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the Kok'ko 'hlan'na's final departure, the performances are described
    as intended solely for amusement, and the women and girls of the fraternity leave
    the plaza and do not take part in the later debauchery.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports competition among men in buffoonery and consumption of
    repulsive things, including urine, bits of old blankets, splinters of wood, and
    violent treatment and eating of animals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ne'wekwe are described as great mimics who ridicule strangers, especially
    the Catholic priest and the army officer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A youthful member is declared a "Catolico santo," carried in procession, and
    seated between torches at a mock altar made with blankets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The following section states that the 'San'iakiakwe, or Hunters Fraternity,
    has Hunters and Fire orders, and that members of the Fire order play with live
    coals and rub them on their bodies.
  category: other
  evidence_refs:
  - ev:7
