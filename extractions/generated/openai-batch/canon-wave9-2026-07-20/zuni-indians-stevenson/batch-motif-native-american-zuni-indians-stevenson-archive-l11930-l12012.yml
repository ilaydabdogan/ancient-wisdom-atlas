canonical_text:
  quote: ''
  summary: 'The passage describes a second-day ceremonial sequence: four warriors
    are prepared with arrow points, bows, arrows, medicine, tobacco, and feather wands;
    paired groups go to two kiwisine associated with elder and younger War Gods; young
    girls are adorned for dancing with elaborate regalia and arrows; a smoking exchange
    and plaza dance occur; finally a buffalo impersonator enters, dances among the
    girls, clasps one of them, and exits amid audience enthusiasm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Ant fraternity officiant places an arrow point in each warrior's mouth
    with a prayer, and the arrow point is to remain there until the warriors return
    to the chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four warriors sit on the west ledge; a bow and arrow are laid before each
    after kaolin paste lines and hawk down have been applied to the bows.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two A'pi'Tlāshiwanni stand before the seated warriors chanting a low ritual
    while the choir sings in the chamber.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The A'kwamosi of the Ant fraternity gives each warrior a draft from a medicine
    bowl using a shell and gives each a reed filled with tobacco.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each warrior takes a bow, arrow, and feather wand and leaves the chamber in
    pairs for two different kiwisine, each pair preceded by a Bow priesthood member.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Up"sannawa ki'wi'sine is said to represent the side of the elder God of
    War, and the Chu'pawa ki'wi'sine the younger God of War.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Young men in the kiwisiwe adorn girls about ten years old for the dance, dressing
    them with moccasins, woven gowns, kilts, head ornaments, skins, beads, necklaces,
    and turkey tails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Feather wands received by members are attached upright to the girls' heads,
    with the girls' loose wavy hair hiding the fastening.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each girl carries an arrow in her right hand during the dance; the passage
    states that this signifies that Zuñi arrows may destroy the hated Navahos.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Reed cigarettes are handed to the scalp custodian and another warrior, lighted,
    returned to the donors for smoking and waving, then waved around the donors' heads
    and thrown on the floor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Warriors, choirs, and girls proceed to the plaza; the girls dance before the
    warriors, and the author compares their motions to hummingbirds hovering over
    blossoms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A second group from the other ki'wi'sine takes similar positions in the plaza,
    and the ceremony is repeated until all the warriors have participated, ending
    at sunset.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A figure representing the buffalo appears in the plaza with black-colored
    face and body, a black sheepskin wig, a deerskin kilt with bells, a Hopi sash,
    and a rattle.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Four little girls form two lines, the buffalo man dances between them, then
    darts away and clasps one girl in an obscene manner before leaving amid spectator
    enthusiasm.
  category: action
  evidence_refs:
  - ev:7
