  summary: At the end of a meal, food wrapped in corn husks is given to the man who
    will personate the Sha'lako and to his companion, then carried to the river and
    deposited for the Kok'ko A'wan, the Council of the Gods. The passage then describes
    the Sha'lako festival as a major autumn celebration marked by extensive feasting
    and hospitality, including toward unwelcome visitors such as Navahos.
