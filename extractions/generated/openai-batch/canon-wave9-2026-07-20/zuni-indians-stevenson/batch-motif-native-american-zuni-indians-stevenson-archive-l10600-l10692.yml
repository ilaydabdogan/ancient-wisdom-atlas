canonical_text:
  quote: ''
  summary: The passage describes the order of participants in a Thla'hewe rain ceremony
    procession, the ritual objects they carry, their movement into the ham'pone, and
    the placement of jugs, rain vases, a mi'li, a folded kilt, and other objects around
    a meal-painted cloud symbol.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The procession includes youth-and-maiden pairs, mi'laiilapo'na of the 'Hla'hewe
    and Sho'ko'we sides, A'shiwanni, a shi'wanni, the Shi'wano"kia, Bow priests, a
    Badger clan man, choirs, drummers, and flutists.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: Each mi'laiilapo'na carries a head basket containing corn, other seeds, two
    'hla'we, two 'hle'we, and te'likinawe, covered with a white embroidered kilt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shi'wano"kia carries a head basket described as containing all kinds of
    seeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man of the Badger clan carries a pottery bowl hidden by a red blanket; the
    bowl contains coals from the fire altar in the ki'wi'sine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The drummers carry vase-shaped pottery drums and hooped drumsticks, while
    the flutists hold flutes to their lips but do not play.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The procession passes under the eastern covered way to the ham'pone in the
    Si'aa' te'wita and proceeds by the south side of the ham'pone to assigned places.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A meal painting called the cloud symbol has been made in the ham'pone; the
    elder brother Bow priest deposits his mi'li at its northwest corner and lays a
    folded kilt on the symbol.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pe'kwin places his meal basket by the cloud symbol and receives jugs and
    rain vases from the 'kia'punakwe, depositing them on the south and north sides
    of the cloud symbol.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mi'laiilapo'na face east, A'shiwanni stand along the west side, choirs
    group at southeast and northeast corners, and flutists stand outside the ham'pone
    near the Sho'ko'we choir.
  category: setting
  evidence_refs:
  - ev:6
