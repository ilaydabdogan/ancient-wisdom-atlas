comparison_claims:
- id: claim:1
  claim: 'The passage compares Hopi and Keres names for places of nativity with Zuni
    Shi''papolima, noting linguistic resemblance while distinguishing function: Shi''papolima
    is not the Zuni nativity place but Po''shaiyanki''s chosen home.'
  claim_level: linguistic_similarity
  target: Hopi Si'papu and Keres shi'papu / Shi'papo emergence-place names compared
    with Zuni Shi'papolima
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to names and stated ritual-geographic function
    as reported in the note; it does not establish historical contact or common inheritance.
- id: claim:2
  claim: The passage states that Sia war gods associated with Sandia mountain bear
    the same names as Zuni gods, supporting a cautious same-name and same-function
    comparison for U'yuyewi and Ma'sai'lema.
  claim_level: same_function
  target: Sia and Zuni war gods U'yuyewi and Ma'sai'lema
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides shared names and a war-god function but no detailed
    parallel myth or ceremony.
