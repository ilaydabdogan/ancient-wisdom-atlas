canonical_text:
  quote: ''
  summary: The passage recounts Zuni traditions of earlier divine beings and Po'shaiyanki
    emerging through Ji'mi'klanapklatea, migrating to Shi'papolima and Chi'pia, and
    associating sacred mountain places with gods, Beast Gods, and stone cougar guardians.
    It then describes the A'shiwi emergence, the organization of fraternities by the
    Divine Ones, the ritual creation of Bi'sisi from rubbed-off body epidermis, and
    initiation into fraternity secrets and rain songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the A'shiwi came to this world, others appeared through Ji'mi'klanapklatea
    and, by direction of the Sun Father, traveled eastward by a northern route to
    Shi'papolima.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After four years at Shi'papolima, the party of gods moved to Chi'pia in Sandia
    mountain, which the Sia identify as the home of war gods bearing the same names
    as Zuni gods.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods of Chi'pia are identified as the group called Kok'ko'hlan'na and
    include Shbits'ukia, Kwe'lele, six Shumai'koli for the six regions, and Sai'apa
    warriors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four years later, Po'shaiyanki, his associates, and possessors of the secret
    of O'naya'nakia appeared through Ji'mi'klanapkiatea; Po'shaiyanki is named as
    leader and Zuni culture hero.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shi'papolima is held sacred as the home of Po'shaiyanki and the Beast Gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The entrance to Shi'papolima is believed to be on a mountain summit near Cochiti
    and is guarded by two crouching stone lions or cougars, with associated stone
    walls and an east-facing entrance.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports that nearby Indians had no history for the carvings except
    that the lions were converted into stone when a great fire spread over the earth;
    Zunis regard them as guardians of Po'shaiyanki's chosen place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Four years after Po'shaiyanki's nativity, the A'shiwi came through Ji'mi'klanapkiatea,
    and the Divine Ones organized four fraternities.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: In the undermost world, two married couples rubbed epidermis from their bodies,
    rolled it into a ball, placed it on the ground, sat around it, sang, and shook
    rattles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: After the singing and rattling, a youth named Bi'sisi appeared dancing in
    place of the ball and was highly regarded by the people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: One of the creator couples became the original members of the Shi'wannakwe
    fraternity; the original male member selected a deputy, warrior, and others, and
    initiated them into secrets entrusted by Kow'wituma and Wats'usi.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Songs for rain given to the Shi'wannakwe are said to have special influence
    upon the Council of the Gods, who direct the rain-makers.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The second fraternity, Ne'wekwe, had as original members the other couple
    who helped create Bi'sisi; Bi'sisi was chosen as musician and entertainer, or
    harlequin, for the fraternity.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: A note compares Hopi and Keres names for a place of nativity with Zuni Shi'papolima,
    while stating that Shi'papolima is not the Zuni place of nativity but the home
    chosen by Po'shaiyanki and his followers.
  category: relationship
  evidence_refs:
  - ev:6
