  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: No available symbol taxonomy covers feline guardian animals.
- id: motif:4
  label: Animal petrification during a world-spreading fire
  taxonomy_refs:
  - world_destroying_fire
  basis: The passage states that the only history associated with the lion carvings
    is that they were converted into stone at the time a great fire spread over the
    earth.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a brief explanatory note attached to the carvings, not a full
    fire-destruction narrative in the passage.
- id: motif:5
  label: Miraculous creation of a youth from body substance
  taxonomy_refs:
  - miraculous_child
  basis: Two married couples make a ball from rubbed-off epidermis, sing and shake
