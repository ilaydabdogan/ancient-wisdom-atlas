candidate_motifs:
- id: motif:1
  label: Emergence and ascent from the underworld to this world
  taxonomy_refs:
  - ascent
  basis: Multiple parties come through Ji'mi'klanapklatea, and the account of Bi'sisi
    states that the A'shiwi began their ascent to the outer world soon after his creation.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:9
  - ev:10
  confidence: high
  cautions: The taxonomy label captures ascent/emergence; the passage does not describe
    a hero descent.
- id: motif:2
  label: Culture hero establishes or inhabits a sacred home
  taxonomy_refs:
  - culture_hero
  basis: Po'shaiyanki is explicitly identified as the Zuni culture hero and leader,
    and Shi'papolima is described as the home chosen by him and his followers.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage focuses on location and status rather than a full culture-hero
    narrative.
