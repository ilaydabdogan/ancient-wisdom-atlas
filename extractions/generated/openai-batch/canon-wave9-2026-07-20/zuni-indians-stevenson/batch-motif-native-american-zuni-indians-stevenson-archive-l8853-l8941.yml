canonical_text:
  quote: ''
  summary: 'The passage describes phases of a Kor''kokshi ceremonial dance sequence:
    evening and night dances, dawn anointing and fasting, body-painting with materials
    from Ko''thluwala''wa, distribution of tortoises and rattles, morning presentation
    and ritual handling of cat-tails, plaza dances, flute-playing, meal-sprinkling,
    prayer, and a footnoted post-ceremonial treatment of tortoises and river offerings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Officers of the Great Fire fraternity remain in a house where the wife, family,
    and clan relations serve food; others go home to eat and all gather later.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kor'kokshi prepare in the ki'wi'sine for night dancing, with masks discarded
    for the night dances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ko'mosona leads the Kor'kokshi to the Ko'pekwm's house while carrying
    a mi'li and meal basket in his left hand and sprinkling meal with his right hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kor'kokshi dance alternately four times in the Ko'pekwm's house and the
    ki'wi'sine; the Great Fire fraternity and Ant fraternity furnish music in different
    locations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At daylight the Ko'mosona anoints the breast, right palm, and right sole of
    each Kor'kokshi with mud from Ko'thluwala'wa and states that he does not wish
    them to eat or drink; a fast follows until noon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'mosona prepares pinkish clay paint and yellow paint from the Ko'thluwala'wa
    area, daubs selected spots on personators, and directs the god and goddess personators
    to paint their bodies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ceremonial dress is put on; tortoises are distributed as far as available,
    while others carry only gourd rattles; the tortoises are returned to a bowl when
    the Kor'kokshi come to the ki'wi'sine.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ko'yemshi visit Si'aa' te'wita in the early morning, led by the Ko'pekwin,
    carrying cat-tails and rattles; they present the cat-tails to the Priestess of
    fecundity, who passes them to the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kor'kokshi procession includes thirty gods, including twenty-eight Kor'kokshi
    and two younger brothers of Pau'tiwa, and eight goddesses; they dance in He'kiapa
    and Ko'china plazas before going to Si'aa'.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The arrival of the Kor'kokshi at Si'aa' te'wita signals the Kia'kwemosi to
    play his flute; after a dance he descends, sprinkles goddesses, gods, and their
    cat-tails with meal, receives cat-tails, and offers a prayer before the Ko'mosona.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Kia'kwemosi deposits the cat-tails by the cloud symbol on the floor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A footnote states that after the ceremonial the tortoises are taken home by
    those who caught them, killed in boiling water, used for eggs and medicine, and
    partly deposited in the river with shell and turquoise beads as offerings to the
    Council of the Gods.
  category: sequence
  evidence_refs:
  - ev:10
