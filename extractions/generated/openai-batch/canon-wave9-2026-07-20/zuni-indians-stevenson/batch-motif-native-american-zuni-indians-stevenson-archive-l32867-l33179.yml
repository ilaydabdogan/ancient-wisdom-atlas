canonical_text:
  quote: ''
  summary: The passage lists a “Road of Day” sequence of named mountain shrines and
    describes post-scalp-ceremonial shrine use, placement of elder and younger Gods
    of War idols, rows of prayer plumes, and meal offerings. It explains winter-solstice
    placement rules connected with rain and cold, describes U'yuyewi images with carved
    symbols, and gives explanatory notes about a hanging sack of meal, Ko'loowisi
    the Plumed Serpent seen during a great flood, a wool-covered mountain, cave shrines,
    and the Salt Lake crater as a home of the Gods of War.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a Road of Day or road of the sun associated with the
    south, day, whiteness, and a descending road, followed by a list of named mountain
    shrines.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a scalp ceremonial, the named shrines are taken in rotation, beginning
    with Te'wan ko'han o'nan pii'nina and Shi'akia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the described arrangement, the elder God of War idol is placed north of
    the road of day and the younger God of War idol south of it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The image is set up, prayer plumes are planted in rows on each side at right
    angles to it, paraphernalia are arranged, and meal is sprinkled outward from the
    idol between the rows of prayer plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Both gods bear the name A'havuta at the winter solstice and at other times
    when only rain and good things are considered and hearts are peaceful.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: For winter-solstice rain purposes, the elder god is deposited on U'hana yal'lanne
    and the younger on To'wa yal'lanne; placing an idol of U'yuyewi north of the road
    of the sun at this time is said to anger rains and winds and bring too much cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The plate description identifies U'yuyewi idols and carved elements representing
    the hands of the gods, a war club, an earthly arrow, cloud forms, crescent, full
    moon, star, lightning arrow, and umbilicus projections.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: One plate shows the shrine on Kwil'li yal'lanne with latest idols in place
    and displaced images with their paraphernalia heaped about.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another plate shows idols of the God of War removed from an ancient cave shrine
    in the west wall of To'wa yal'lanne.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The A'pi'l;ishiwanni are said to have many shrines dedicated to the Gods of
    War, with the crater in the volcanic cone at the Zuñi Salt Lake described as perhaps
    the most sacred spot and the present home of these gods.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: An explanatory note recounts two girls from Shun'te'klaya meeting the elder
    God of War, seeing a small sack of flour hanging from a tree, and watching the
    grandmother of the gods make a large basket of bread from a very small amount
    of flour.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note explains that a place was named because the face and head of Ko'loowisi,
    the Plumed Serpent, were seen above the waters by the A'shiwi while they were
    on To'wa yal'lanne escaping the great flood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note explains that the Gods of War killed many mountain sheep on one mountain,
    and the grandmother swept the sheep wool from the house down the mountainside
    until it was covered with wool.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The author summarizes Zuñi religious thought as adoration toward a supreme
    mysterious power and toward gods visible in the heavens, earth, and waters under
    the earth, who bless good and punish wicked.
  category: attribute
  evidence_refs:
  - ev:10
