canonical_text:
  quote: ''
  summary: The Corn maidens come unseen with the A'shiwi from the undermost world
    and are later discovered by two witches at Shi'pololo kwi. The witches question
    them, give them corn ears and other seeds, assign crop identities and sisterly
    ranks, and the elder sister organizes an all-night dance facing east toward the
    Sun Father. The witches then continue migrating with the A'shiwi without telling
    them of the Corn maidens, who remain at Fog Place and bathe in dew or mist without
    drinking it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Corn maidens came unseen and unknown with the A'shiwi from the undermost
    world and remained with them for four years at Shi'pololo kwi, Fog Place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two witches discovered the Corn maidens sitting under an out-of-door covered
    place or pine-bough pavilion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The witches asked who the maidens were; the maidens identified themselves
    as Corn maidens and said they had no corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The witches said that Corn maidens should have corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The witches gave seven maidens ears of yellow, blue, red, white, multicolored,
    black, and sweet corn, and gave three maidens squash, watermelon, and muskmelon
    seeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden receiving yellow corn was named the Yellow Corn maiden and greater
    elder sister; the maiden receiving blue corn was named the Blue Corn maiden and
    younger sister, and these two were made directors or leaders of the others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The remaining crop maidens were each designated younger sisters according
    to the crop or corn type handed to them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After receiving the corn, the elder sister said she and her sisters would
    dance with their corn and formed the sisters into two lines facing east to see
    the coming forth of the Sun Father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The maidens danced all night under a bower walled with cedar, roofed with
    cumulus clouds, and fringed with spruce of the west, while the witches observed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the morning the witches continued their migrations with the A'shiwi without
    telling them of the Corn maidens, while the Corn maidens remained at Shi'pololo
    kwi and bathed in dew or mist but did not drink it.
  category: sequence
  evidence_refs:
  - ev:5
