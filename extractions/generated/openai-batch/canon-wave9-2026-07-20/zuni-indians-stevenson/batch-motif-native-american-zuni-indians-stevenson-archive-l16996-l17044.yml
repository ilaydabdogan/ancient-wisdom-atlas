canonical_text:
  quote: ''
  summary: 'Ethnographic account of Zuñi puberty and menstrual customs: an unmarried
    girl reaching womanhood is taken to a paternal female elder, works hard grinding
    corn, and returns with food; the passage also describes ordinary menstrual practices,
    heat treatments, nonsegregation, and guarded knowledge of a root tea said to suspend
    menses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls are described as often marrying before puberty; if a girl is unmarried
    when she reaches womanhood, her mother notifies the paternal grandmother or, if
    needed, the paternal aunt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The paternal grandmother returns with the mother, and the girl accompanies
    the grandmother to her dwelling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the grandmother's dwelling, the girl works hard all day grinding corn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the evening the girl returns home carrying a bowl of meat stew prepared
    and presented by the paternal grandmother, who returns with her.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated belief is that hard work at the dawn of womanhood prevents pain
    at that period, while idleness on the first day leads to future dysmenorrhea.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women generally walk little during menstruation, are not expected to bring
    water from the well, and occupy themselves with indoor work such as weaving or
    grinding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women sit or kneel over heated sand spread on the floor, with robes and blankets
    arranged around them and over the sand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A heated stone is worn in the belt, and hot juniper tea is frequently drunk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The menses are said usually to continue four days, sometimes two or three,
    and Zuñi women are not segregated during this period.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A certain hot root tea is said to suspend the menses permanently after four
    months, with described changes in the flow over those months.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The root is kept by certain old medicine men and women, who guard the secret
    so young women will not obtain it and render themselves incapable of becoming
    mothers.
  category: relationship
  evidence_refs:
  - ev:6
