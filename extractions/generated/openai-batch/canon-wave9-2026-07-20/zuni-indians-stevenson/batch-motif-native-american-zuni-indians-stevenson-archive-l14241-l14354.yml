canonical_text:
  quote: ''
  summary: 'The passage describes the morning Sha''lako ceremonies of 1891: visitors
    crowd the village, public disorder occurs, Sha''lako processions emerge with musicians,
    officers, alternates, effigies, singers, and managers, meal is sprinkled or thrown
    onto the Sha''lako, the parties cross the river to a ceremonial ground, and the
    participants are arranged according to a diagram including six regional ki''wi''sine
    groups, officials, blankets, and square excavations for te''likinawe deposits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Morning brings many visitors; nearly every pueblo is represented, many Navahos
    are present, house tops are crowded, and streets contain pedestrians and equestrians.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports intoxication, fighting, weapons being drawn, people falling
    or lying in streets, and native police clearing streets for the processions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before midday the first Sha'lako and his retinue come out from the house where
    he spent the night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first procession includes members of the order of Pa'yatamu, members of
    the Little Fire fraternity, flute playing, an officer with a mi'li and meal basket,
    an alternate carrying te'likinawe, the Sha'lako, singing ki'wi'sine members, and
    Sha'lako managers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: People on housetops throw meal on the effigy, and men crowd forward to sprinkle
    the gods with meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first Sha'lako procession crosses the river to the south bank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other Sha'lako parties follow in close succession; the second is attended
    by a Pa'yatamu order of the Pe'sha'silo'kwe fraternity, while the others are described
    as similar except lacking Pa'yatamu music.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The diagram labels personators of Sha'lako with effigies, alternates, six
    ki'wi'sine groups, Ko'mosona, Ko'pekwin, two Ko'pialiishiwanni, a first body of
    A'shiwanni, Sha'lako managers, and square excavations for te'likinawe deposits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ki'wi'sine are paired as elder and younger brother, and the named ki'wi'sine
    are associated with North, West, South, East, Zenith, and Nadir.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the ceremonial ground, bearers of the effigies stoop on blanket rugs facing
    the village; six blankets are spread in an east-to-west line, with fellows and
    ki'wi'sine groups behind them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Ko'mosona, Ko'pekwin, two Ko'pialiishiwanni, and first body of A'shiwanni
    stand in lines west of the Sha'lako.
  category: setting
  evidence_refs:
  - ev:7
