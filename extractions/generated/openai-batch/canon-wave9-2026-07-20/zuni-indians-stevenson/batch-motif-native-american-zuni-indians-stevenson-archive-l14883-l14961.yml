canonical_text:
  quote: ''
  summary: The passage describes Ko'yemshi and fraternity ritual actions involving
    a disk placed at a warrior's heart, the mi'li, prayer and directional waving,
    preparations in a Ko'yemshi-dedicated house, gift-giving to a Ko'yemshi, visiting
    dancers, masking behind an altar, and a later scene with Galaxy fraternity members,
    Ko'yemshi, an altar, ritual objects, fire coals, a lamp, and aged men participating
    vigorously.
  language: English
