literal_observations:
- id: obs:1
  text: A Ko'yemshi is led into a circle by the director and hands his rattle to a
    companion at his side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'yemshi manipulates a disk before the mi'li and puts it to the heart
    of the warrior, after which he makes a joking statement about his wife and running
    off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director selects a fraternity member, gives him a disk, and the man moves
    wildly with bent knees while keeping his eyes fixed on the mi'li.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The selected man places the disk to the warrior's heart; the warrior dances
    more violently, and the disk remains in place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The director removes and replaces the disk, later returns it to the basket,
    raises the mi'li, prays over it, waves it to the six regions while facing south,
    and returns it to its owner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The warrior joins the circle, all dance around twice, and they leave the house
    in file.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the 1879 Ko'yemshi-dedicated house, fraternity members paint one another
    with kaolin while the Ko'yemshi rub their bodies with pinkish clay paint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The altar stands at the west end of the room, with Ko'yemshi masks on dressed
    deerskins behind it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A bowl of medicine water, a basket tray containing grains of corn, and another
    basket containing white fluffy eagle plumes are placed in front of the altar.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writer gives a silk head-kerchief to a youth and then gives another to
