canonical_text:
  quote: ''
  summary: On the second day, A'shiwanni gather for tobacco prayers, clasp-hand prayer
    exchanges, smoking, and a meal whose food is offered to ancestors through fire.
    The scalp custodian visits the A'kwamosi of the Ant fraternity; prayers and reciprocal
    hand-and-breath gestures are performed with visitors. In a large chamber, ceremonial
    groups assemble with baskets, feather wands, arrow points, medicine water, pigments,
    hawk parts, and grease. A choir sings of the Gods of War and ancestral conflict,
    while Bow priests are prepared by Ant fraternity members with hair treatment,
    war pouch, pigments, kaolin, and hawk down.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first body of A'shiwanni meet in the Shi'wano"kia's house on the morning
    after the first evening's festivities, gather around a small bowl of native tobacco,
    and pray and smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two reeds are filled with tobacco and placed by the bowl with corn husks for
    cigarettes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kia'kwemosi clasps the hands of the scalp custodian during a prayer; afterward
    their hands are reversed and the scalp custodian repeats a prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prayer asks the Sun Father to give food, raiment, prosperity, rain for
    crops, and power against enemies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two reed cigarettes are lighted and passed around, and each shi'wanni takes
    a whiff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a meal, each participant gathers bits of food on bread, which is thrown
    into the fire with a prayer to ancestors and a call for them to eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The scalp custodian and the A'kwamosi of the Ant fraternity clasp hands, pray,
    reverse hands, and pray again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The A'kwamosi and scalp custodian perform hand movements and breath-drawing
    gestures with Dr Tylor and the writer so that good may be drawn from one to the
    other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The A'kwamosi of the Ant fraternity is described as a very old man of the
    Sun clan who goes to a large chamber opening on the large plaza where the A'pi'Mashiwanni
    are assembled.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Baskets, feather wands, arrow points, reed cigarettes, bowls of medicine water,
    hawk breast portions, kaolin, red pigment, and bear's grease are placed in the
    chamber.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A choir begins a song while members brandish pistols, a bayonet, or war clubs
    in time with the song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The song recounts valorous deeds of the Gods of War and earlier people, conflict
    with Navahos, and instructions for battle routes and means of mastering enemies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The elder brother Bow priest and three other Bow priests are prepared by four
    members of the Ant fraternity with hair knots, clothing, war pouch, bear's grease,
    pigments, kaolin, and hawk down.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hawk down is explicitly said to be symbolic of the clouds of the world when
    applied to kaolin paste on the prepared men.
  category: attribute
  evidence_refs:
  - ev:8
