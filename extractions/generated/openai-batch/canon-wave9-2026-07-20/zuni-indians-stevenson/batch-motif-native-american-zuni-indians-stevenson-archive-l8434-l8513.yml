canonical_text:
  quote: ''
  summary: The passage describes the distribution of ritual cigarettes, preparations
    for a pilgrimage to Ko'thluwala'wa, the carrying of te'likinawe offerings and
    ritual implements, the procession from the village, an overnight mountain camp,
    and the entry of Ko'mosona and Ko'pekwin with attendants into a summit cave where
    offerings are deposited. An editorial note reports and disputes a priestly claim
    that the cave connects by an underground passage to the Council of the Gods in
    the depths of a lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cigarettes are distributed to Sha'liiko representatives of the ki'wi'siwe,
    and each carries a cigarette home in a corn husk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those making or aiding the pilgrimage gather in the morning; Ko'yemshi collect
    te'likinawe, and Ko'mosona divides the kia'etchine and portions of te'likinawe
    with Ko'pekwin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ko'mosona has offerings made by men of his Deer clan, while Ko'pekwin has
    offerings made by a man of his Bear clan; each places te'likinawe in a deep carrying
    basket.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A long-necked gourd jug is fitted with a black sprinkling stick, cotton netting,
    four white eagle plumes, and a cord handle; a crooked stick is explicitly described
    as symbolic of longevity.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prayer meal is carried in the belt and thrown in a line before the travelers
    as they proceed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two Ko'pi'lashiwanni whirl rhonibi, described as calling the clouds to gather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Great Father Ko'yemshi, his nine fellows, the ceremonial father and personator
    of Shu'laawi'si, and personators of several named beings each carry four te'likinawe
    to the Council of the Gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The party leaves the village in the morning, barefoot and in new ordinary
    dress, with Ko'mosona leading and specified ritual figures following in order.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After sunset the party fills canteens at a spring, ascends a mountain, camps,
    eats, and dances; the next morning the road divides, with Ko'yemshi taking one
    trail and Ko'mosona and others taking another to Kor'kokshi mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ko'mosona and Ko'pekwin, each with an attendant, enter a cave on the summit
    of the mountain; one attendant precedes Ko'mosona carrying a torch, and te'likinawe
    are deposited inside.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports a claim that the cave has an inner passage to the depths
    of Ko'thluwala'wa and to the Council of the Gods in a lake, but the editorial
    note says an 1881 examination found only a shallow passage with te'likinawe present.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
