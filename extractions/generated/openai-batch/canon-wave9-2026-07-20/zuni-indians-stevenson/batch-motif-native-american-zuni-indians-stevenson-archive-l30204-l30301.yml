canonical_text:
  quote: ''
  summary: 'The passage describes events in a Zuñi ceremonial room during an initiation
    sequence: pre-ceremonial storytelling, smoking, floor sprinkling with water, a
    Ko''tikili dance with rattles, yucca, and offerings, midnight smoking and meal-sprinkling
    prayers at the altar, distribution of holy or medicine water, participation by
    men, women, children, an infant, and novices, cleanup of altar meal and mi''wachi
    feathers, preparation of a dry painting whose wall symbolizes the galaxy, and
    later preparation of yucca ornaments and distribution of medicine and sunflower
    powder by the elder brother Bow priest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the fraternity convenes, men in the Little Fire fraternity house tell
    stories and smoke; a man sprinkles the floor by taking water in his mouth and
    ejecting it over the floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: Sixteen Ko'tikili members enter in single file, advance toward the altar,
    face south, and dance from west to east and east to west while making hoots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: Twelve dancers carry gourd rattles, other dancers carry food wrapped in corn
    husks for the Kok'ko awa, and all carry yucca and wear yucca head ribbons, deerskins,
    moccasins, and tortoise-shell rattles on the right leg.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: The dancers sing and dance to rattles and a skin drum while the Little Fire
    fraternity remains as quiet spectators.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: At midnight the dancers sit on the north side of the room and receive cigarettes
    that have been lit and first smoked by members of the Little Fire fraternity;
    the cigarettes are passed back and forth before the dancers continue smoking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: The dancers take meal from a basket in front of the altar, sprinkle the altar,
    pray, and return to their seats.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: The a'kwamosi carries a bowl of medicine water and gives holy water from a
    shell to the dancers and then to members of the Little Fire fraternity, including
    women and children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the visiting dancers leave, men gather before the altar to pray and
    sprinkle sacred meal; then women advance together, pray, and sprinkle meal on
    the altar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: One mother holds a naked infant and guides the infant's hand to take meal
    from the pottery basket and sprinkle it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women return home, while men and novices sleep in the ceremonial room; meal
    near the altar is swept away, and mi'wachi are removed so meal can be blown from
    their feathers before they are replaced.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the fourth day, several men prepare a dry painting south of the altar;
    it includes a disk with a raised basin-like edge, and the wall is said to symbolize
    the galaxy.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Before the evening ceremony, the room is lit by firelight; men, women, novices,
    another young girl, a flute player behind the altar, and the elder brother Bow
    priest are present.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: Men split yucca and make wreaths, wristlets, armlets, and garters; the elder
    brother Bow priest distributes prepared medicine in corn husks and deerskin pouches
    and gives sunflower powder to male members only.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
