candidate_motifs:
- id: motif:1
  label: winter-solstice solar return
  taxonomy_refs:
  - seasonal_cycle
  basis: The pe'kwin announces the winter solstice, and the passage describes the
    rising sun striking the Middle place and returning over its road.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage is ethnographic description of ritual timing, not a narrative
    myth of seasonal death or rebirth.
- id: motif:2
  label: ritual offerings as sacred exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe and related offerings are made to the Sun Father, Moon Mother,
    deceased sun priests, deceased A'shiwanni, rain-makers, lightning-makers, and
    Gods of War.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage states recipients and offering actions but does not describe
    an explicit reciprocal gift from those powers.
- id: motif:3
  label: preparatory abstinence and fasting
  taxonomy_refs: []
  basis: The pe'kwin observes continency over a defined ritual period and fasts from
    animal food after offerings to the sun.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No broader purification doctrine is explained in this passage.
- id: motif:4
  label: world-center ceremonial geography
  taxonomy_refs:
  - world_center
  basis: A note states that the sacred fetish rests over the center of the world,
    and the ceremony repeatedly refers to the six regions and the whole world.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The center-of-world statement occurs in an explanatory note rather than
    in the narrated sequence of offerings.
- id: motif:5
  label: fourfold ritual repetition
  taxonomy_refs: []
  basis: The passage repeatedly specifies four te'likinawe, fourth mornings, four-day
    continency boundaries, four-day fasts, and a four-day preparatory period.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not explicitly interpret the number four.
- id: motif:6
  label: offerings to deceased ritual predecessors
  taxonomy_refs: []
  basis: Offerings are made to deceased sun-priest predecessors, deceased A'shiwanni,
    and deceased Bow priests associated with lightning-makers.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies deceased recipients but does not narrate an afterlife
