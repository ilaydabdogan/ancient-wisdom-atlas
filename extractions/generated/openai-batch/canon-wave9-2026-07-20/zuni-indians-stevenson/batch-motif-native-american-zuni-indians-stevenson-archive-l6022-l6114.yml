canonical_text:
  quote: ''
  summary: The passage describes the Sun Priest's observations of sunrise before the
    winter solstice, repeated offerings of te'likinawe to solar, lunar, ancestral,
    and directional powers, restrictions of continency and fasting, the announcement
    of the solstice, and the first four days of winter-solstice ceremonial preparation
    by the first body of A'shiwanni and Bow priests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun Priest makes daily sunrise observations at a petrified stump east
    of the village, sprinkles it with meal, and offers matins to the rising sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the sun rises over a specified point of To'wa yaTIaime, the Sun Priest
    informs the elder brother Bow priest, who notifies the first body of A'shiwanni;
    they meet the same night in the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The following morning the pe'kwin prepares four te'likinawe for the Sun Father
    and Moon Mother, carries them up a steep acclivity, and deposits them at a shrine
    on To'wa yal'liinne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The four te'likinawe are tied in pairs; each pair includes a blue stick for
    the sun and a yellow stick for the moon, with black-tipped lower ends, black dots
    for face features, eagle feathers, and plumes of birds of the six regions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: On successive fourth mornings the pe'kwin alternates deposits of four te'likinawe
    at the sun shrine and plantings of four te'likinawe in a field for deceased sun-priest
    predecessors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The te'likinawe for deceased sun priests are black sticks with turkey plumes
    attached.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pe'kwin must observe continency from four days before the first planting
    until four days after the last deposition, and must fast from animal food for
    four days after offerings made to the sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the final planting, the pe'kwin announces from the house top that the
    winter solstice will occur in ten days.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that at the solstice the rising sun will strike the point
    called the Middle place and then return over the road it has traveled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For the described 1891 festival, the actual ceremonial lasted eleven days,
    but the account enumerates fifteen days by including four preceding days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the first four days, the first body of A'shiwanni, excluding the Priestess
    of Fecundity, assemble in the houses of the Kia'kwe amosi to prepare te'likinawe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Each shi'wanni makes individual prayer plumes to the sun and ancestors, one
    te'likinane to the sun, one to the moon, and four to each of the six regions for
    deceased A'shiwanni.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Priestess of Fecundity's te'likinawe are made by the first body of A'shiwanni,
    while she prepares a ha'kwani of cotton-cord loops symbolizing a sacred white
    blanket.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Kia'kwemosi makes a long te'likinane for the rain-makers of the six regions
    or whole world, and the Shi'wanni of the Nadir makes a long te'likinane for the
    lightning-makers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The elder and younger brother Bow priests prepare offerings to the Gods of
    War and to the lightning-makers of each of the six regions.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The nonindividual offerings are grouped as a kia'etchine, with two longer
    te'likinawe in the center; the Shi'wanni of the Nadir holds them while the younger
    brother Bow priest wraps the base with yucca thread.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The kia'etchine is placed on a meal painting in the He'iwa, or North, ki'wi'sine
    on the fourth evening.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:18
  text: A note says the sacred fetish associated with the Shi'wanni of the North rests
    in a room immediately over the center of the world.
  category: setting
  evidence_refs:
  - ev:12
