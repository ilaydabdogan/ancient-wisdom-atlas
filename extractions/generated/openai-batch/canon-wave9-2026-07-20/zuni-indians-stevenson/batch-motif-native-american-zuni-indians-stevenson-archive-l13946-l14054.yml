canonical_text:
  quote: ''
  summary: 'The passage describes Sha''liiko ceremonial movements on a prepared ground
    and then within houses: offerings are deposited, meal and seeds are used ritually,
    an effigy is placed by an altar, a ladder rite attaches offerings to a symbolic
    cloud house, medicine water is sprinkled to the six regions, and the personated
    giant god dances while visitors pray and sprinkle meal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prepared ground is described as a former camping place from Zuni migrations
    in quest of the Middle of the world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Six Sha''liiko are present at the ground: four stand at the sides while two
    run back and forth, and each takes a turn running.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dark the Sha'liiko proceed to the village, each with attendants, to
    the house where he will remain overnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the house, the personator and his alternate deposit te'likinawe under the
    ladder and sprinkle meal while attendants sing with rattle accompaniment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The master of the house, his wife and daughters, and the mo'sona lead the
