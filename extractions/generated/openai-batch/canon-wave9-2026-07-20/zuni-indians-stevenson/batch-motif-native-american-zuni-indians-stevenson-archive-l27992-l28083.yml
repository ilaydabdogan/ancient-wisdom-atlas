    that the swords are fashioned like those of the Sword order and that the novice
    receives the same medicine used in initiation into the Sword order.
  claim_level: same_function
  target: Sword order initiation named in the passage
  evidence_refs:
  - ev:4
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The provided passage gives only brief references to the Sword order
    and does not include a full account of that order’s initiation, so the comparison
    is limited to shared objects and medicine explicitly named here.
