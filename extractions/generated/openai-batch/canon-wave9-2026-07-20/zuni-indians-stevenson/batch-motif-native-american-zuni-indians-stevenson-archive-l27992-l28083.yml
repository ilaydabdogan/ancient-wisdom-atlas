canonical_text:
  quote: ''
  summary: The passage describes ritual actions of the Ma/tke Thlan'nakwe involving
    rhombus and flute music to bring snow and rain, meal sprinkling at an altar and
    trees, wakefulness enforced during the night, food offerings in a river to deceased
    fraternity members, preparation of medicine water for protection during sword
    swallowing, making and polishing ritual swords, and an initiation sequence in
    which officers and members swallow swords before a novice attempts the act and
    the ceremony ends with song and feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rhombus and flute are used at this time to bring snows and rains quickly,
    and they are placed near the heads of the warrior and flutist when they lie down.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If someone coughs, the flutist plays and the warrior whirls the rhombus; those
    present rise, then sprinkle meal on the altar and trees after the music ceases.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After such a cough-triggered action, no more sleep is permitted during the
    night; a nodding member is awakened with lighted husks or sticks, and the group
    sings and dances until sunrise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The 'Hlem'mosona expresses hope that all will be happy and not sad or ill,
    and tells the flutist and warrior to remain and make rains and snows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Five appointed men carry five heaps of food and offer them in the river to
    deceased members of the fraternity while the warrior and flutist continue their
    instruments until the men return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The 'Hlem'mosona gives spruce and piñon buds to the a'kwamosi, who prepares
    medicine water intended to protect the throat from injury by the sword, placing
    six pinches of buds and six stone fetishes in the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Swords are made on the fourth morning; a novice makes his own under instruction
    from his fraternity father, while a woman initiate’s sword is made by her fraternity
    father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The swords are fashioned at the butt of a slender tree, rubbed with cougar
    grease and red hematite, and the passage states that this order does not fashion
    serpentiform swords.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Six stone knives, each colored for one of the six regions, are used to polish
    the swords; the maker attaches a turkey-feather la'showanne to the tree, which
    is placed at the east end of the room with the sword pointing east.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The 'Hlem'mosona leads officers to the altar, which officers and members sprinkle
    with meal before members pass around it and return to their positions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The 'Hlem'mosona gives the novice a sprig of medicine, runs the tree through
    the hatchway, swallows the sword at the end of the tree, and afterward passes
    the sword before the novice’s lips and shoulders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The deputy, six officers, members, and fraternity father repeat the sword-swallowing
    performance; the novice attempts to swallow the sword several times but fails,
    and the ceremony closes with a song and feast.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
