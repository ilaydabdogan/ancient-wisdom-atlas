candidate_motifs:
- id: motif:1
  label: Ritual production of rain and snow through sound instruments
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage explicitly states that the rhombus and flute are used to bring
    snows and rains quickly, and the 'Hlem'mosona tells the flutist and warrior to
    make rains and snows.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The available taxonomy has no specific weather-making category; seasonal_cycle
    is a broad fit because the passage concerns precipitation rather than a full seasonal
    cycle.
- id: motif:2
  label: Initiation through guided sword-swallowing ordeal
  taxonomy_refs:
  - initiation
  basis: The novice makes or receives a sword under the fraternity father’s guidance,
    receives medicine, watches repeated performances by officers and members, and
    attempts unsuccessfully to swallow the sword.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic ritual description; the novice’s failure
    is described literally and should not be expanded into an unstated narrative outcome.
- id: motif:3
  label: Ritual protection from bodily injury
  taxonomy_refs:
  - initiation
  basis: Medicine water is prepared specifically to protect the throat from being
    injured by the sword, and medicine is given to the novice before the sword act.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The protective efficacy is reported as part of the ritual description;
    no external explanation is supplied in the passage.
- id: motif:4
  label: Food offering to deceased group members in water
  taxonomy_refs:
  - sacred_exchange
  basis: Five men carry five heaps of food and offer them in the river to deceased
    members of the fraternity.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states an offering but does not describe a reciprocal return;
    sacred_exchange is therefore a broad candidate rather than a precise claim.
- id: motif:5
  label: Six-region ritual structuring
  taxonomy_refs: []
  basis: Medicine water receives six pinches of buds and six stone fetishes, and six
    stone knives colored for the six regions are used to polish the swords.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage names the six regions but does not explain their cosmological
    meaning here.
- id: motif:6
  label: Ritual wakefulness enforced by fire and dance
  taxonomy_refs: []
  basis: After cough-triggered music there is no more sleep; nodding members are awakened
    with lighted husks or sticks, and singing and dancing continue until sunrise.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not state a doctrinal meaning for the enforced wakefulness.
- id: motif:7
  label: Tree-sword orientation and roof-hatch passage
  taxonomy_refs: []
  basis: The sword is made from a tree, placed at the east end with the sword pointing
    east, then run through the hatchway during the sword-swallowing performance and
    placed near the ceiling.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: Although the tree and vertical hatchway imagery is prominent, the passage
    does not explicitly identify it as an axis or world-center symbol.
