- id: obs:1
  text: The Zuñis are described as agricultural and pastoral people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fields are said not to be owned by clans, and a man may cultivate unappropriated
    land and transfer it within the tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Land and houses may be obtained from an owner by trade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An old woman owning two houses sold the front house, and her female children
    objected because a later upper story could obstruct their street view.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Landed property of a married man or woman is said to go after death to daughters,
    with sons as next heirs if there are no girls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children who inherit property may give part of it, or some benefit from it,
    to the deceased person's poor sisters or brothers, especially sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Property disputes are usually settled by civil authorities, and sometimes
    by the first body of A'shiwanni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After marriage, a man's field products are carried to the house of his wife's
    parents, described as his home after marriage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An unwritten rule restricts removal of each man's stored property to the man
    and his wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A wife's grain from fields given by her father or mother is placed with her
    husband's grain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the owner's death, horses, cattle, sheep, and blankets are divided among
    girls and boys of the family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The mother's silver beads and turquoise earrings go to daughters, while the
    father's coral, white shell, and turquoise necklaces and earrings go to the eldest
    son.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Small village gardens tended exclusively by women are inherited by daughters.
  category: relationship
  evidence_refs:
  - ev:5
