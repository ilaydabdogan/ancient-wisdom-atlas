canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi property practices: fields and houses are not
    clan-owned but may be individually cultivated, traded, or transferred within the
    tribe; an observed house sale is mentioned; inherited land tends to pass to daughters,
    with sons next if there are no girls; household produce after marriage is stored
    at the wife''s parents'' house; access to stored produce is regulated by an unwritten
    rule; movable goods and ornaments are distributed by gender and family relation;
    and women''s gardens pass to daughters.'
  language: English
  quote_policy: summarized
