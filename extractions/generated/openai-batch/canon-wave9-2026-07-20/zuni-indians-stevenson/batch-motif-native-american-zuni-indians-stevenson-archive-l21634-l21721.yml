canonical_text:
  quote: ''
  summary: A narrated ethnographic passage gives several accounts of illness, shamanic
    or theurgic diagnosis, witchcraft accusations, wizards using whirlwind or bird-plume
    powers, theft of rain-priest plume offerings, punishment by the Bow priesthood,
    a sorcerer who summons Apaches and is killed by mistake, and crop destruction
    attributed to a buried witchcraft bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator stayed in the missionary wife's house, received bedding and blankets,
    later became very ill, and returned to the mother's home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman placed pinches of sacred meal on the narrator and, through the power
    of the Beast Gods, was said to see into the body and discover disease.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shaman declared that the narrator had been bewitched and commanded bits
    of blanket, yarn, and calico to come up through the mouth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator suspected an old one-eyed woman of bewitching the narrator because
    of jealousy about the time spent at the mission.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In a throat illness account, a theurgist said that a witch had shot a stone
    into the throat, prayed to the Beast Gods, extracted the foreign matter, and cast
    it into the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A wizard painted his body red, marked a white scalp-knot design on his breasts
    and knees, wore yucca wreaths, entered a whirlwind headfirst, and traveled to
    the great river of the west and back to Zuni in one day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wizard went to the great river to steal plume offerings deposited by rain
    priests; the passage states that butterfly spirits carry the spirit of the plume
    offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the whirlwind became weary and dropped the wizard near Zuni, a passing
    youth accused him of being a sorcerer and followed him to the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Dogwood clan wizard was tried by the Bow priesthood, convicted, suspended
    by the arms, denied food, and died after one night and a day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Another wizard attached crow and owl plumes to his head to gain quick sight
    and night travel, flapped his arms, and left Zuni after the people slept.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The crow-and-owl-plumed wizard visited the Apaches and told them to come in
    four days and destroy the Zunis.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Zuni wood-gatherer found the plumed sorcerer, refused his offer of blankets
    and beads, and agreed not to betray him if the Apaches were allowed to take his
    life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the fourth morning the wood-gatherer heard the witch's signal, found that
    Apaches had killed the sorcerer, and saw the body lying on crossed arrows; a Navajo
    explained this as a sign for a friend killed by mistake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: One year all crops in the Zuni farming district of Pescado were destroyed
    by grasshoppers so thick that they darkened the air.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: A man digging in the field discovered a buried packet of blue and red beans,
    a grasshopper, ground corn meal, wheat, other seeds, white cotton cloth, red calico,
    and buckskin; the crop disaster was attributed to a witch or wizard.
  category: object
  evidence_refs:
  - ev:7
