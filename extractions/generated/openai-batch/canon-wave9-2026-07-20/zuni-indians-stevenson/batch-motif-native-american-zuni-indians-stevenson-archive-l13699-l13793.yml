canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi ceremonial sequence in a room with an altar:
    fraternity members sing and play instruments; ritual figures use baskets, meal,
    seeds, yucca, plumes, and a rhombus; offerings are made to the six regions, to
    a cloud-house device, and through a floor opening symbolizing the entrance to
    the fourth world; prayers request rain, crops, health, long life, and the growth
    of children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of the U'huhukwe fraternity form a choir on the south side of the
    room near the west end, while the fraternity flutist sits behind the altar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'shiwanni stand in line and sprinkle the gods as they pass toward the
    altar along a line of meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kia'kwemosi and pe'kwin each hold a flat basket; Shu'laawi'si empties
    his fawn-skin contents into the pe'kwin's basket and lays rabbits and rats over
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other gods remove seeds from their belts and place them in the basket held
    by the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two A'shiwanni wave baskets to the six regions and place the baskets before
    the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sa'yatasha marks four downward meal lines on each wall, and Ya'niuhakto passes
    a bunch of yucca downward over the lines.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sa'yatasha attaches two te'likinawe, one blue for the Sun Father and one yellow
    for the Moon Mother, to a multicolored carved wooden device fixed to a rafter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wooden device is described in the passage as symbolic of the house of
    the clouds and as present in every house blessed at the Sha'lako festival.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the placement of the te'likinawe, the choir sings with rattle and drum,
