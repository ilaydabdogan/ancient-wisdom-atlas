  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The plumes are placed with prayers for rain, good crops, health, long life,
    and benefits associated with the breath of life and A'wonawil'ona.
  category: speech
  evidence_refs:
  - ev:7
