  summary: A practitioner places fetishes and medicine bags in a basket tray, prays
    over them, and applies powder to the patient’s arm, shoulders, head, and affected
    parts. Carbolic acid and powder treatments continue over several days, alongside
    treatment by Nai'uchi and the writer. The patient’s pulse and symptoms are recorded
    as improving, and she returns to work and ordinary activity, though pallor remains.
