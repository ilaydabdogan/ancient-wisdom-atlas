canonical_text:
  quote: ''
  summary: Women and children of the paternal clans of the Ko'yemshi bring meal offerings
    to the house where the masks are kept. Members of the Little Fire fraternity lead
    the Ko'yemshi to the Si'aa' te'wita, where the Kia'kwemosi forms meal crosses
    associated in the passage with the four regions, seats the Ko'yemshi, prays, and
    applies meal. The Ko'yemshi carry canvas rolls, te'likinawe, and seed-filled fawn
    skins; the te'likinawe are placed in an opening and later planted west of the
    village. The Kia'kwemosi then leads the Ko'yemshi into a ceremonial chamber while
    townspeople bring food offerings to the plaza.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women and children of the paternal clans of the Ko'yemshi carry baskets of
    meal to the house where the Ko'yemshi masks are kept and where the Ko'yemshi are
    to be entertained at a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the meal is transferred, the bearer takes a pinch from the apex of
    the meal and reserves it to sprinkle upon the Ko'yemshi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fourteen members of the Little Fire fraternity, led by a woman of the fraternity,
    precede the Ko'yemshi in file to the Si'aa' te'wita.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Little Fire fraternity members carry mi'li and eagle-wing plumes; the
    Ko'yemshi wear heavy blankets and moccasins, carry canvas rolls, te'likinawe,
    and fawn skins filled with seeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The te'likinane connected with the male head of the house visited by the Council
    of the Gods is carried home by the personator of Sa'vatasha and later planted
    by him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The procession passes four times around in a circle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kia'kwemosi forms a cross of meal on the west side of the plaza; the passage
    explicitly describes it as symbolic of the four regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kia'kwemosi places his hands on the Great Father Ko'yemshi, motions him
    to the four regions, and seats him on the meal cross; the forming of the cross
    is repeated for each Ko'yemshi to be seated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Kia'kwemosi draws a line of meal upward over each mask and prays; members
    of the Little Fire fraternity sprinkle each mask with meal and leave the plaza.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each Ko'yemshi stands his te'likinawe in an opening in the ledge in front
    of the ki'wi'sine; late in the night the Ko'yemshi remove them and later plant
    them in an excavation west of the village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The excavation west of the village is described as reaching from the breast
    to the feet of the man who makes it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kia'kwemosi sprinkles meal on the Ko'yemshi, throws a line of meal up
    the ladder, and leads the Great Father and the other Ko'yemshi into the ceremonial
    chamber.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Men and women crowd the plaza bringing offerings to the retiring Ko'yemshi;
    women bring corn, wheat flour, and light bread, while men later bring dressed
    sheep, watermelons, and other food.
  category: action
  evidence_refs:
  - ev:8
