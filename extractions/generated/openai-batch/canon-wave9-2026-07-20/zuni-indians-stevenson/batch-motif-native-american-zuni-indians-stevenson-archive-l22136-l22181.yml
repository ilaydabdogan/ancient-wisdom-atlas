canonical_text:
  quote: ''
  summary: In a dim room, warriors compel an accused youth to break wall plaster and
    search for hidden prayer plumes. After failing to find them there, he leads the
    group through cramped hatchways into deeper rooms, where old prayer-plume packages
    are found beside a corn fetish that he says witches placed to destroy crops. The
    warriors then demand the plumes allegedly used to transform a witch into beast
    form; a lower chamber is searched without success.
