canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial return procession involving a sacred
    firebrand, rain-invoking rhombi, smoke and cloud imagery, water vessels from springs,
    masked dancers, plaza dances, and the installation of objects before fraternity
    altars. The procession includes Shu'laawi'si, Ko'mosona, Ko'pekwin, Ko'pi'Mashiwanni,
    Kor'kokshi, Ko'yemshi, personators of Sha'lako, the Council of the Gods, and fraternity
    groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire bearer called Shu'laawi'si lays a brand on the ground with the burning
    end toward the east as a signal for the return to Zuñi, and extra brands are kept
    ready so the sacred fire does not die out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'pi'Mashiwanni whirl rhombi while imploring the u'wannami, described
    as rain makers, to water the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pinkish clay used by personators of the gods is collected near Ko'thluwala'wa
    by the Ko'mosona and others.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Shu'laawi'si runs about setting fire to grass, trees, or whatever is in his
    way so that smoke rises in clouds compared to breath clouds from the gods of Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Council of the Gods hold ghostselves of plumes between their hands and
    blow them to the heavens, where they form clouds as they ascend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the camp, Shu'laawi'si builds a fire apart from the others, lays the firebrand
    nearby with the end pointing east, and the Ko'mosona and Ko'pekwin place gourd
    jugs of spring water beside it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The returning party visits springs of Ko'loowisi, identified as Plumed Serpent,
    and Kok'ko 'hlan'na of the Ne'wekwe fraternity while passing through Ojo Caliente.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kor'kokshi meet the party, don masks and paraphernalia, and dance; the
    Ko'yemshi are also described as masked and ceremonially dressed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The procession enters Zuñi at dusk and gives dances in several plazas, including
    He'kiapa plaza, Ko'china plaza, Si'aa te'wita, and te'wita 'hlanna.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Ant fraternity altar and the Great Fire fraternity altar are furnished
    with mi'wachi, other fetishes, medicine water, tortoises in water, and cat-tails.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: After entering the house, Shu'laawi'si knocks off the burning end of his brand
    at the fireplace and lays it before the altar of the Great Fire fraternity.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the evening meal, the actors are said to take nothing by mouth except
    drafts administered by theurgists until the following afternoon.
  category: sequence
  evidence_refs:
  - ev:9
