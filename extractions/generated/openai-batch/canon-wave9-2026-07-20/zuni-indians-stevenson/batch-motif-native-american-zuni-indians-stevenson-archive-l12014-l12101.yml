canonical_text:
  quote: ''
  summary: 'The passage describes preparations and performances during the second
    night of a Zuñi crop-thanksgiving festival: Ant fraternity dancers paint and dress
    themselves, dancers form lines and ellipses, groups sing and dance in ki''wi''siwe
    and dwellings, performers personate anthropic gods, Navahos, old Zuñi from Corn
    Mountain, and warriors, while music, jokes, prayers, and house-to-house dances
    continue through the night.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: By 9 o'clock participants are preparing for night ceremonies, with warriors
    assembling only in the Chu'pawa and Mu'he'wa ki'wi'siwe, while members of other
    ki'wi'siwe dance in dwellings wearing the dress of anthropic gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ant fraternity chamber and two other rooms contain people preparing for
    dances, with paints, robes, and ornaments scattered around.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men of the Ant fraternity paint their bodies white to represent animals, snakes,
    and the heavens, and paint one another's backs and shoulders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women paint their lower legs and arms white; all wear yucca wreaths and a
    fluffy eagle plume, and men place wreaths and feathers on the women's heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dancers form two parallel lines in a north-south room, then an ellipse
    with a woman to the left of each man, dance from left to right, and later repeat
    formations in the Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: The choir sings on the east side to rattle and drum accompaniment; men sing
    while women are silent during the dance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After entering the Chu'pawa ki'wi'sine, the dancers form an ellipse and pray
    aloud before continuing to dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men and one five-year-old child representing Navahos appear on the roof; all
    but the child carry rattles, and the child personates a Navaho girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Navaho personators call through the hatchway to the dancers below, who
    reply, before the group leaves for the roof of the Mu'he'wa ki'wi'sine.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Young women with heads covered by blankets are present in the Chu'pawa ki'wi'sine,
    and several are compelled to lay aside their wraps and dance between the Ant fraternity
    lines.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Three youths personate decrepit old Zuñi from To'wa yal'lanne, or Corn Mountain,
    and hobble with staffs while wearing ragged clothing and unkempt long hair.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The old-men personators carry objects including a stone ax, large tin tweezers,
    bows, and arrows.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Navaho dancers descend a ladder one by one, form double file, repeat the
    previous evening's dance, and perform a song described as a prolonged burlesque
    of the Navahos.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The trio of old men from To'wa yal'lanne make difficult, stiff-jointed efforts
    to dance and utter comical jokes.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The A'pi'lashiwanni, led by the elder brother Bow priest, appear with bared
    limbs painted white and wear kilts; some wear feather wands or buckskin skullcaps
    with hawk-feather aigrettes.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: After the warriors dance, one girl present has her blanket taken from her
    and is made to join the dance.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: After the warriors leave, the choir sings, previous-night scenes between young
    men and women are repeated, and musicians, dancers, and god-personators move through
    covered ways and streets from house to house throughout the night.
  category: sequence
  evidence_refs:
  - ev:15
