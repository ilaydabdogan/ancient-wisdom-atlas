canonical_text:
  quote: ''
  summary: The passage describes annotated route-map symbols for the 'Hle'wekwe, then
    narrates how the fraternity expels an offensive man and wife, visits Po'shaiyanki
    at Shi'papolima, receives instruction in sword swallowing from A'chiyalatopa,
    gains Beast Gods as warriors, journeys in search of the Middle place, prays with
    sacred objects and meal-cloud symbols causing snow, and is eventually directed
    toward the A'shiwi by smoke seen from a mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The map description identifies dots around a figure as hail, a straight east-west
    line as a road to the Salt Mother, a cross near the east end as the morning star,
    groups of seven and four dots as Ursa Major and the Pleiades, and a short heavy
    line as the road of the Kla'nakwe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man and wife who offended the 'Hle'wekwe were lifted in their grass blanket
    while asleep and tossed to the far north.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man and wife remained in the far north, multiplied, and became giants
    called the Su'ni-a'shiwanni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The 'Hle'wekwe proceeded eastward to Shi'papolima, identified as the home
    of Po'shaiyanki.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two chief officers conducted the fraternity to Po'shaiyanki, through whom
    they became known to people of medicine and craft.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A'chiyalatopa, described as a being with wings and a tail of knives, taught
    the fraternity the art or secret of sword swallowing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On their return journey, the 'Hle'wekwe were provided with Beast Gods as warriors,
    including cougar, bear, badger, wolf, shrew, and six snakes for the six regions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says Divine Ones had transformed medicine men into Beast Gods
    as guardians of the world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The 'Hle'wekwe journeyed for a long time with many stops before finding the
    Middle place and their people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At To'vakwi they built a village and placed their et'towe with sacred prayer
    plumes on cloud symbols made of meal, then prayed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the prayer, the earth was soon covered with snow and the people proposed
    hunting rabbit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two officers went to the mountains for deer instead of hunting rabbit and
    saw smoke to the west from a mountaintop.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The two officers entered a village, identified themselves as A'shiwi of the
    'Hle'wekwe fraternity, and were welcomed by the Kla'kwemosi, rain priest of the
    North.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Kla'kwemosi told the officers to bring their people after ten time periods,
    and the 'Hle'wekwe moved nearer to rejoin their people.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
