  summary: The passage introduces Zuñi ceremonial games as rain-bringing practices
    with religious and social importance, lists games and reported origins, and begins
    describing the annual religious ti'kwawe racing-stick ceremonies, including prayer-plume
    offerings by the Bow priesthood to deities and deceased members before a scheduled
    race.
