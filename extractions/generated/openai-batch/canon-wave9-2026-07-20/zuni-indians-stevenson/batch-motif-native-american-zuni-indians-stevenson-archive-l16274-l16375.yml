canonical_text:
  quote: ''
  summary: The passage describes Zuñi clan organization, including maternal descent,
    paternal clan affiliation, and clan-based ceremonial offices. It lists existing
    and extinct clans, then describes household rooms, the general living room, fraternity
    use of domestic space, storage of ceremonial objects, meal-grinding mills, and
    fireplaces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Zuñi tribe is described as divided into clans called a'notiwe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Descent is through the maternal side, while the offspring is also closely
    allied to the father's clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A child is referred to as belonging to the mother's clan and as the child
    of the father's clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Within the family, the child is under the control of both parents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Clans play an important part in ceremonials, and many ceremonial offices are
    filled according to membership in, or child-relationship to, a specified clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some ceremonial offices are filled annually in rotation between a clan member
    and a child of the specified clan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says that knowledge of any additional past clans is lost to present
    sages.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage lists existing clans named for plants, crops, animals, birds,
    a celestial body, and other natural categories.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage lists extinct clans named Wood, Sky, Cottontail-rabbit, and Black
    corn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Zuñi houses are described as usually having four to six rooms, though some
    have eight and a few have two.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ledges built with the house extend around rooms and serve as seats and shelves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The largest room is the general living room where the whole household works,
    eats, sleeps, and entertains guests.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the general living room is needed by a fraternity, the family moves to
    other quarters and moves its belongings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The family wardrobe hangs on a pole suspended from the rafters.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: More valuable things, especially ceremonial paraphernalia, are wrapped carefully
    and placed in storage rooms.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Meal-grinding mills are usually set up in the general living room and consist
    of stone slabs of different fineness set at an angle with separators and enclosures.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: Most rooms are provided with fireplaces, and the passage notes several varieties
    before the excerpt breaks off.
  category: object
  evidence_refs:
  - ev:9
