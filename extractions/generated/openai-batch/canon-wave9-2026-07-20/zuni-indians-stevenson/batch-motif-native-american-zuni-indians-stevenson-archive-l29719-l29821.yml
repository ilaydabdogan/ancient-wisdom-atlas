canonical_text:
  quote: ''
  summary: The passage describes the Little Fire fraternity, its membership, fire
    ceremonies, a schism that produced the Cimex fraternity, altar and dry-painting
    features of the Cimex fraternity, and the opening preparation and night ceremony
    of an elaborate four-day Little Fire initiation. It also lists figures, symbols,
    and ritual objects on the fully embellished altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Little Fire fraternity is described as having a large membership, wealthy
    members, and prominent theurgists; Nai'uchi is identified as the fraternity's
    warrior and a leading medicine man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the Little Fire fraternity play with fire at gatherings, with an
    elaborate fire display occurring once in four years and participation in a great
    fire dance once in eight years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fire display is connected in the passage with the lighting of the first
    fire by the Sun Father, described as a Hopi belief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A division in the Little Fire fraternity is attributed to a dispute involving
    a man and a woman during a time when continence was required; one faction became
    the Cimex fraternity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The new branch fraternity was named Pe'shii'silo'kwe, translated in the passage
    as Cimex, after its meeting chamber was found to be infested with cimex.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Cimex altar includes medicine bowls, a prayer-meal basket, a large shell,
    a meal line, and a dry painting depicting bears of the four regions, including
    the Bear of the West followed by her cub.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Cimex dry-painting description assigns the green ground to the vegetation
    of the world and blocked borders or circles to cloud houses of the four regions
    or the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Little Fire and Cimex fraternities are said to have the same rituals,
    with variations in their altars and dry paintings, and they alternate in the quadrennial
    ceremonial.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The described initiation is a four-day ceremonial of the Little Fire fraternity,
    with the first day spent decorating the chamber and altar and preparing prayer
    plumes for Beast Gods and deceased fraternity members.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: A small covered vase associated with Nai'uchi is deposited before the altar
    with animal fetishes; it is said to contain blossoms, a root, and the hearts of
    butterflies and dragon-flies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the night ceremony, each arriving member is greeted, removes moccasins,
    advances to the altar, sprinkles meal, and Mystery medicine members give their
    mi'li to an officer to place by the altar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fully embellished altar has cloud-symbol tablets, faces of the Sun Father
    and Moon Mother, Whiyala'topa, Ku'pishtaya lightning-makers, a dragonfly called
    an important rain symbol, stars, painted cougars, and a carved rattlesnake.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The principal objects listed for the altar include an ear of corn, giant yucca,
    an eagle dry painting, medicine bowls, prayer-meal baskets, ground-medicine bowls,
    food offerings, arrow points, crystals, plume offerings, a warrior's pouch, bear's-foot
    skin, animal fetish, cut-stone fetish, and flutes on the wall.
  category: object
  evidence_refs:
  - ev:8
