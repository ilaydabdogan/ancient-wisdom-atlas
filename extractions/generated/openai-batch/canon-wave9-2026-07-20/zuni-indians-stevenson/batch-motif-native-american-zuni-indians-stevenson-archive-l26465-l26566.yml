canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial cure for a sore, swollen throat.
    Personated gods arrive at sunset, descend from the roof, circle and treat the
    patient with meal lines, yucca, a mask, all-night dancing, dawn fire-making, medicine
    water, and medicine drunk by the invalid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a ceremonial cure for a sore and badly swollen throat,
    observed in 1891.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kok'ko 'hlan'na, Shits'ukia, and Kwe'lele arrive near sunset and ascend to
    the roof of the invalid's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The patient is placed on a pallet in the middle of the floor, facing east,
    and is supported by a chosen fraternity father.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Only the patient and members of the order of Kok'ko 'hlan'na may be present.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A curtained dressing area for the personators is arranged at the east end
    of the room, and the gods stamp and dance on the roof before descending through
    the hatchway.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shits'ukia carries yucca and a rhombus, Kwe'lele carries yucca, fire sticks,
    and an unlighted cedar brand, and Kok'ko 'hlan'na carries giant yucca in both
    hands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A female member with mi'li and a sacred meal basket sprinkles meal and leads
    the gods from the roof to the room.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The gods encircle the patient four times while the choir sings with rattle
    and pottery drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Shits'ukia draws meal lines across parts of the patient's body, and Kok'ko
    'hlan'na follows those meal lines with yucca.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The body crossing is repeated over the shoulders, waist, knees, back, arms,
    and upward-turned palms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kok'ko 'hlan'na removes his mask, the fraternity father places it over the
    invalid's head, and Kok'ko 'hlan'na expectorates through the mask's small mouth
    hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the initial treatment, the personators remove their masks, selected
    participants remain, and the invalid's female relatives serve an evening meal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: During the night, different male members personate Kok'ko 'hlan'na, Shits'ukia,
    and Kwe'lele, and members dance in divine costumes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At dawn, three members make fire with Kwe'lele's fire sticks while personators
    of Kok'ko 'hlan'na and Shits'ukia stamp nearby.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The director bathes Kwe'lele under each knee with medicine from a bowl, and
    a cedar brand lit from the new fire is dipped in medicine water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The director gives the invalid several drinks from the medicine bowl, and
