canonical_text:
  quote: ''
  summary: The passage describes a Zuñi Sha'liiko/Sha'lako ceremonial sequence on
    a prepared ground with excavations. Named personators and ritual groups deposit
    te'likinawe or te'likinane, sprinkle prayer meal, cross between east and west
    lines, face the village, call out ritual cries, and process with the Council of
    the Gods. Later the Council deposits offerings in a cornfield and removes masks
    and paraphernalia, while Sha'liiko personators with effigies make offerings to
    directional Sha'lako.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Excavations are made after the Sha'liiko take positions on rugs; twelve are
    made by Sha'liiko wor'we and two at the south end by a wor'li associated with
    the Sa'yatiisha personator's ki'wi'sine.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The personator of Shu'laawi'si moves along the excavation lines, deposits
    te'likinawe in excavations 1 and 2, sprinkles meal over the offerings, and then
    retires from the ceremonial ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sa'yatiisha and Hu'tutu, each with a Ya'muhakto, deposit te'likinawe in excavations
    1 and 2 and later sprinkle meal into those excavations while crossing before the
    Sha'liiko.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The four participants meet in the line of Sha'lako facing the village; Sa'yatiisha
    cries out and Hu'tutu later exclaims his own name-formula.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two Sāl'imobiya join at the north side of the ground and run back and forth
    over the north end during the ceremony of the Council of the Gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: As the Council of the Gods passes by the Sha'liiko, Ko'mosona, Ko'pe-kwm,
    Ko'pr'lashiwanni, and A'shiwanni, each shi'wanni sprinkles the gods with prayer
    meal from a basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Council of the Gods deposits te'likinawe in a cornfield south of the village
    and near a larger excavation, then proceeds to a cabin where masks and paraphernalia
    are removed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sha'liiko personators rise with effigies and, in turn, run to assigned excavations
    to deposit or plant te'likinane to named directional Sha'lako.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The Sha'lako personator from He'iwa ki'wi'sine deposits te'likinane to the
    Sha'lako of the North in two excavations, returns to the line, is sprinkled with
    meal by his group, and exchanges place with his alternate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Sha'lako from O'he'wa deposits to the Sha'lako of the East, and the Sha'lako
    from Mu'he'wa deposits to the Sha'lako of the West; the passage also names further
    excavations for another Sha'lako from He'kiapawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:8
