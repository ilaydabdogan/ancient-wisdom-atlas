canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi rain-priest ritual materials and procedures:
    plume sticks and breath prayers offered to gods, preparation and coloring of te''likinawe,
    seasonal use of paints, and the winter retreat of Nai''uchi, Shi''wanni of the
    Nadir, including a meal-and-pollen cloud painting, sacred fetishes, mi''wachi,
    stone objects, a reed flute, obsidian knives, and arrow points arranged around
    the painting.'
  language: English
  quote_policy: summarized
