canonical_text:
  quote: ''
  summary: The passage describes the return of Zuñi salt-gatherers, the reception
    and household handling of salt and personified corn ears, prayers and bodily use
    of salt, later storage, and a ceremonial appearance involving Ma'lokat'si, Ko'hakwa,
    the Sun, and the Morning and Evening stars with detailed mask iconography and
    directional movement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the salt-gatherers came sufficiently near home, they made signal fires;
    smoke from the first fire prompted villagers to begin watching.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several fires were lit nearer to the village before the salt-gatherers' voices
    and song were heard; the party was warmly greeted and helped with unloading.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three pedestrians carried two ears of corn called Father Corn and Mother Corn,
    in mud-covered husks, together with a slab of salt crystal wrapped in cloth in
    deep baskets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that salt is necessary for physical comfort and has sacred
    value beyond price.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the elder brother Bow priest's home, salt was placed on canvas and formed
    into an oval mound with a lengthwise depression; a salt slab and corn ears were
    placed in the center.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Additional old ears of corn were named Great Mother, Great Grandmother, and
    the child; they were placed around the slab with the ear tips pointing east.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Those present stood around and prayed, and a blind grandson of Nai'uchi was
    led forward so his hand could be directed to the prayer-meal basket; all present
    sprinkled the sacred objects with meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Infants in houses where salt had been brought were carried to salt heaps;
    mothers spat on their limbs and rubbed them with salt so the children might be
    strong, and adults rubbed salt on their own hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each salt-gatherer's head was washed in yucca suds and his body bathed by
    a female family member; the salt was later packed in jars and the corn ears placed
    with stored corn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ma'lokat'si is identified as sister to the Sun Father; Ko'hakwa is called
    white-shell bead and Mother of the Sun, with a home in the great waters of the
    West where the Sun journeys to rest at night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes masks for Ma'lokat'si, Ko'hakwa, the Sun, and the Sun's
    heralds, with materials and designs including salt crystals, corn, beads, colors,
    a sun symbol, rainbow, cloud-home design, and star-tipped tablet crosses.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Ma'lokat'si approaches from the south and is carried across the river by a
    Ko'yemshi; Ko'hakwa comes from the west, while the Sun with the Morning and Evening
    stars comes from the east; at sunset Ma'lokat'si returns south and the others
    go west.
  category: sequence
  evidence_refs:
  - ev:9
