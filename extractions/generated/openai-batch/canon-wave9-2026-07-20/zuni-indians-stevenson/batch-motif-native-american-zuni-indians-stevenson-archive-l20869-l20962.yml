canonical_text:
  quote: ''
  summary: The passage describes late nineteenth- and early twentieth-century changes
    in Zuni houses, furnishings, cooking, laundering, textiles, clothing, pottery,
    basketry, and food habits, emphasizing introduced materials and practices and
    the decline or alteration of several older crafts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During his first Zuni visit in 1879, Mr Stevenson introduced window panes,
    candles, lamps, silversmiths' implements, and larger doors, and Indians who helped
    make packing boxes received lumber and instruction for doors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Newer or renovated houses are described as having higher ceilings, stone construction,
    shingles replacing willow boughs across ceiling beams, and larger rooms; women
    still do much house-construction work.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some houses have large or double windows with curtains, locked doors, china
    closets, bedsteads, chairs, tables, stoves, and stove-baked yeast-powder bread,
    though meals are usually still served on the floor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Soap was introduced in 1879 so that Zunis would wash cotton clothes, and the
    writer undertook to teach the work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The selected laundry pupil was a man who wore woman's dress and was described
    as strong, active, and progressive; he initially resisted, criticized the teacher's
    method, later earned silver dollars, and became a well-known laundryman for officers'
    families and settlers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Laundering is described as extensive and not confined to either sex; men wash
    their own clothes, women launder for themselves and children, and men wearing
    female attire are preferred by some white customers because of their strength
    and endurance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Zunis sell wool and buy blankets and quilts, so that formerly woven bed
    blankets are no longer seen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Needles made from tin cans are used instead of earlier bone needles, dyeing
    is virtually lost, gussets have been introduced, and European dress including
    hats and shoes has spread among men.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Women are described as slower than men to adopt new styles, but by 1902 many
    Zuni women wore cotton skirts and blouse waists like those worn by Navaho women;
    women do much sewing and some possess sewing machines.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Artistic pottery has been largely supplanted by stone china washbowls, cheap
    china, and glass dishes, and pottery currently made is described as inferior and
    produced in quantity for traders.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Zunis are making baskets colored with diamond dyes in imitation of Hopi Oraibi
    basketwork, and the passage states that Hopi basket coloring has also been supplanted
    by diamond dyes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Where flour can be bought, wheat grinding has ceased, and lard, yeast powder,
    coffee, and white sugar have become staple articles.
  category: action
  evidence_refs:
  - ev:8
