canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi mortuary customs: burial or destruction of
    the dead person''s belongings, planting of prayer plumes, purification with warm
    water, beliefs about a ghost remaining near the village for four nights before
    beginning an afterlife journey, precautions around the household and surviving
    spouse, offerings of food into fire, an afterlife route to Ko''thluwala''wa and
    the undermost world, and observed mourning and body-preparation scenes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Family members go west of the village near the river bank and make excavations
    in which belongings of the deceased, and in some cases a fraternity mask, are
    buried with meal and prayers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prepared tc'likinawe are planted in a separate excavation; participants sprinkle
    meal over them, and adults later drink warm water as an emetic for purification.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ghost is said to remain around the village for four nights after death
    and to begin its journey to Ko'thluwala'wa on the fifth morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the ghost's four-night stay, the door and hatchway are left ajar so
    the ghost may pass in and out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rain priest recounts that after a sword-swallower woman died in his house,
    rapping attributed to her spirit stopped after live coals and piñon gum smoke
    filled the room.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Relatives sleep beside a surviving spouse during the four nights of the spirit's
    presumed stay, and black corn with charcoal is placed under the mourner's head
    to prevent dreaming of the deceased.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For a deceased spouse belonging to the Ant fraternity, the survivor goes to
    an ant-hill by the southern road, faces west, sprinkles prayer meal, steps over
    the ant-hill left foot first, and a relative obliterates the ant-hill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spirit is fed by food thrown into the fire each day, and on the fifth
    morning a large bowl of food is cast into the fire for the journey of two days
    and nights.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spirit's route is described as reaching a lake, descending a mystic ladder
    to meet the Council of the Gods, and then passing to the undermost world, the
    place of Zuñi nativity.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: An observed mourning scene shows a dead young wife wrapped on the floor with
    head to the east while her husband and parents grieve beside the body.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: In another body-preparation scene, relatives prepare a grave and place bread,
    corn, dried peaches, and wheat on a fire or pyre; the corpse's head and face are
    washed with yucca suds.
  category: sequence
  evidence_refs:
  - ev:8
