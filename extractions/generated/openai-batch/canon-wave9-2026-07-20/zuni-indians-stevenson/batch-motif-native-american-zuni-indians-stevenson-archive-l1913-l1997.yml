  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: A note states that the gods in this passage are the children of the A'shiwi.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: A note states that since the organization of the Ko'tikili, every male child
