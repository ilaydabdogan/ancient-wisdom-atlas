canonical_text:
  quote: ''
  summary: Pau'tiwa directs that the A'shiwi be instructed about their gods, their
    arrival in this world, migrations, and quest for the Middle place. 'Kiaklo is
    sent as narrator and instructs the people to build six chambers for the six regions
    before the ancestral gods arrive. The gods come masked; masks are examined and
    copied; officials are appointed for the Ko'tikili; the people and gods are distributed
    among six regional chambers. A note says every male child must become a member
    of this fraternity, and that a quadrennial dramatization initiates children into
    it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pau'tiwa, director-general of the Kok'ko, wants the A'shiwi to become personally
    acquainted with their gods and to learn about the gods' coming to this world and
    migrations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pau'tiwa chooses 'Kiaklo as narrator, and 'Kiaklo travels from Ko'thluwala'wa
    to I'tiwanna on the backs of the Kd'yemshi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: "'Kiaklo tells the A'shiwi about their coming to this world and their quest
    for the Middle place, then announces that the ancestral gods will come in eight
    days."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: "'Kiaklo instructs the A'shiwi to build six chambers, one for each of the
    six regions, dedicated to the Kok'ko."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The A'shiwi build the six chambers, called ki'wi'siwe; 'Kiaklo visits each
    one and then departs by the western road to Ko'thluwala'wa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man of the Dogwood clan examines 'Kiaklo's mask and later makes one like
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The first body of A'shiwanni and others gather in the north ki'wi'sine to
    greet the gods, who wear masks to I'tiwanna and remove them when entering the
    chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A'wan ta'chu Ko'yemshi tells the A'shiwi to look carefully at the masks, and
    Pau'tiwa's mask is examined and copied by Kia'kwemosi of the Dogwood clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The director of the Ne'wekwe fraternity examines and copies the mask of A'wan
    ta'chu Ko'yemshi, while others of the fraternity copy the remaining Ko'yemshi
    masks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A'wan ta'chu Ko'yemshi calls for a Ko'mosona, a Ko'pekwin, and two Ko'pi'lashiwanni
    for a fraternity by whom the gods should be personated.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kia'kwemosi appoints Deer-clan and Badger-clan men to the offices of Ko'mosona,
    Ko'pekwin, and warriors attached to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The newly appointed Ko'mosona divides the A'shiwi, regardless of clan, among
    the six ki'wi'siwe as permanent affiliations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A'wan ta'chu Ko'yemshi directs gods whose masks have not yet been examined
    to separate and go to the other five chambers for their masks to be copied.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Six Sha'lako are named as giant couriers to the rain-makers, with one Sha'lako
    designated for each ki'wi'siwe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage distributes the Council of the Gods, Sha'lako, Kor'kokshi, 'Cha'kwena,
