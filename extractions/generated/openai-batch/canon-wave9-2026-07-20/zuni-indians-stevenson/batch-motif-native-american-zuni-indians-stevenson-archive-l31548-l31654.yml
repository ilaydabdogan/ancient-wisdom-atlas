canonical_text:
  quote: The idea is that the scalp is symbolic of the A'shiwanni because it brings
    rains.
  summary: The passage describes part of a Zuni ceremonial sequence involving a victor,
    his elder brother, priests, warriors, Ant fraternity members, sacred objects,
    a processed scalp, prayer plumes, cigarettes, a procession to meal-covered mounds,
    rain-priest symbolism, and the arrival of scalp-kickers with chaparral cock feathers
    and offerings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Pieces of a divided scalp are removed from arrows, attached to a pole planted
    by the pa'mosona, and placed near where the victor and elder brother sit facing
    the village while trimming juniper twigs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: Warriors and members of the Ant fraternity gather nearby; each warrior prepares
    two prayer plumes for the Gods of War and plants them on an ant-hill before joining
    the group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The victor and elder brother pierce their scalp portions, attach buckskin
    thongs and smaller scalp bits, tie the scalp pieces to juniper twigs with eagle
    plumes, bare part of the twig, and rub red pigment on the bared place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The pa'mosona and his vice twirl juniper bark in the faces of the victor and
