canonical_text:
  quote: ''
  summary: 'The passage describes a sequence in a Zuñi crop thanksgiving festival:
    Kia''nakwe dancers perform in the plaza, Ko''yemshi entertain during intervals,
    ritual gifts and baskets of corn and feathers are transferred to A''shiwanni authorities,
    prayers and rattle gestures accompany offerings, gifts are carried to a ceremonial
    chamber, te''likinawe baskets are designated for deceased predecessors and Kia''nakwe
    priests, and a buck is allotted and flayed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kia'nakwe dance four times in the plaza, return to the ki'wi'sine for
    about twenty minutes, then return to dance four more times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the Kia'nakwe absence, Ko'yemshi entertain the audience by joking,
    mimicking dancers, making fun of masks or faces, pretending fright, and playing
    games.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At 4 o'clock the Kia'nakwe return with gifts on their backs and form a broken
    ellipse whose apex is on the east side of the plaza.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kia'nakwe priest carries a basket of loose corn of various colors, and
    his deputy carries a basket tray of feathers arranged on raw cotton.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The A'shiwanni form a line facing east at the west side of the plaza, with
    named ritual officers placed in order.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ko'yemshi and members of the Chu'pawa ki'wi'sine remove burdens from dancers,
    while designated Ko'yemshi hold the corn and feather baskets because they must
    not touch the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The A'shiwanni stand motionless during the dance, which begins after the dancers'
    loads are removed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the dance, burdens and baskets are returned or transferred among ritual
    officers; offerings are deposited, and four personators repeat long prayers, with
    priestly speakers using the Sia tongue and warriors using the modern tongue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dancers deposit burdens on two blankets, and Ko'yemshi bring watermelons from
    the house of the keeper of the great shell to a heap near the ladder to the Kia'kwemosi's
    ceremonial chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancers, priest, and deputy grasp rattles with both hands; after a prayer
    they wave the rattle in a right-to-left circle, inhale, then shake it as song
    and dance begin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the dancers leave, the A'shiwanni carry gifts up the ladder to the ceremonial
    chamber, spread offerings on the floor, collect birds and plumes, smoke together,
    and have baskets of te'likinawe intended for deceased predecessors and Kia'nakwe
    priests.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The buck is agreed to belong to the Kia'kwemosi; the Shi'wanni of the Nadir
    flays it while others hold legs of the animal.
  category: action
  evidence_refs:
  - ev:7
