canonical_text:
  quote: ''
  summary: The passage describes the annual Zuni ceremonial journey to the salt lake,
    including priestly planning, offerings to the Salt Mother and other deities, bodily
    washing, public prayers for safe return, ritual carrying of rhombi and war-god
    offerings, meal sprinkling by a Ko'yemshi personator, travel to the lake across
    mountains and dry country, shrine offerings along the route, and an anecdote about
    avoiding sacred springs associated with white gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The annual journey to the Zuni salt lake for gathering salt is described as
    an important event accompanied by elaborate ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rain priests assemble in the ancestral chamber of the Kia'kwemosi to arrange
    the journey, and the elder brother Bow priest announces from a housetop that those
    needing salt must be ready to go to the home of the Salt Mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women do not go on the salt-gathering journey.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men wishing to visit the lake prepare plume offerings to Ma'lokat'si, described
    as the spiritual name for salt, and present them to the rain priest with a request
    to go to the Salt Mother and ask her for a part of herself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Salt-gatherers and priests prepare plume offerings to the Salt Mother, Sun
    Father, Moon Mother, Corn Mother, Gods of War, and Council of the Gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At sunrise on the departure day, the heads of the pilgrims are washed in yucca
    suds and their bodies are bathed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women of the household provide the men with food, and people in Zuni watch
    the departure from streets and housetops while praying for success and safe return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The elder and younger brother Bow priests carry rhombi and offerings, while
    a Great Father Ko'yemshi sprinkles meal during the procession.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rhombi are whirled for the rain-makers to gather over Zuni.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The party travels to the salt lake with burros, crosses several mountain ranges,
    lacks water along the route, and deposits plume offerings at shrines to the Sun
    Father and Moon Mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The salt lake is described as lying in a crater-like depression with volcanic
    cinder cones and salt-saturated water that deposits salt by evaporation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: A guide avoids nearby springs because they are said to be at the house of
    the Kok'ko ko'han, or white gods, and should not be desecrated by camping nearby.
  category: action
  evidence_refs:
  - ev:7
