passage_locator:
  label: TWENTY-THIRD ANNUAL REPORT PL. CXXII / ALTAR OF HA'LO'KWE (ANT FRATERNITY)
    BEFORE FETISHES ARE PLACED ON IT / SHU'MAAKWE / CEREMONIAL OF INITIATION INTO
    THE SHU'MAAKWE; lines 29913-30006
  start: '29913'
  end: '30006'
  translation: 'The Zuñi Indians: Their Mythology, Esoteric Fraternities, and Ceremonies'
  notes: Generated from OpenAI Batch run canon-wave9-2026-07-20; human review required.
canonical_text:
  quote: ''
  summary: 'The passage describes part of a Shu''maakwe ceremonial sequence: consecration
    of medicine water with sixfold actions and directional animal fetishes; midnight
    smoking, escorting women home, and ritual sleeping arrangements for novices and
    men; second-day preparation and grinding of medicines associated with animal powers;
    and the beginning of dancing after the grinding.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The a'kwamosi dips water from a vase six times, holds each gourd of water
    over the medicine bowl while praying, and empties it into the bowl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six animal fetishes, one for each of the six regions, are placed around the
    medicine bowl and dropped into it; the named positions include north, south, east,
    west, Zenith, and Nadir.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacred meal is sprinkled into the water six times, and eagle plumes are dipped
    into the medicine water and raised and lowered six times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the consecration of the medicine water, the flute and rhombus cease;
    the flute is returned before the altar and the rhombus is replaced in a wall niche.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The a'kwamosi sprinkles the altar with the feather ends of eagle-wing plumes
    and strikes one plume against the underside of the other at right angles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Song, rattle, and drum continue until midnight, when a funnel-shaped corn
    husk filled with tobacco is passed to all present, and each person takes a whiff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: All women except the female novice return home escorted by fraternity members,
    with the stated reason that women must not walk the streets alone at night.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The female novice sleeps covered with a blanket on a single sheepskin in front
    of her seat; the other novices sleep similarly, and the remaining men sleep around
    the sides of the room.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Food is brought by women of the fraternity and of their clans; men do not
    eat at home during this period, though they may leave the ceremonial house temporarily
    for crops and herds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the second day, the morning is spent preparing prayer plumes, chatting,
    and smoking; in the afternoon, medicine grinding begins while the large room is
    filled with fraternity members and women, some with infants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A girl at the east end of the room pounds a mineral described as medicine
    of the cougar and bear with a stone hatchet, then grinds it and deposits it in
    an eating bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sheepskins, blankets, buckskins, canvas, cotton cloths, and three stone mills
    are arranged on the north side of the room for the grinding.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Two grinders are dressed in a white embroidered blanket, jewelry, bead necklaces,
    a red garter at the hair, and an eagle plume on the forelock, and each is led
    to a mill by a warrior holding eagle-wing plumes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the mills, the guide sits before the grinder and mill, holds the grinder's
    clasped hands, and waves them to the six regions with a prayer; male attendants
    take seats before the mills.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Attendants place bowls of ground medicine, grayish root medicine of the Badger
    and Wolf, and crushed sunflowers by the mills.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Shell beads and te'nas'sali root are crushed in each mill; Cougar of the North
    medicine is added, and Bear, Badger, and Wolf medicines are ground in turn while
    grinders move with song, rattle, and drum.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: After grinding ceases, dancing begins; a choir man dances an infant on his
    knee, and one man, three women, and two young girls open the dance.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: A footnote reports the fraternity director's assertion that six additional
    plant medicines belong to beast gods of the six regions and are found in a crater
    of a mountain north of Laguna.
  category: speech
  evidence_refs:
  - ev:13
