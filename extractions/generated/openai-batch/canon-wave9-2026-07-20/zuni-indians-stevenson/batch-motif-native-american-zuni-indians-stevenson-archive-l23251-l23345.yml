canonical_text:
  quote: ''
  summary: Ethnographic description of bathing, clothing rules, etiquette, continence,
    novice plume deposition, pre-initiation head washing and feast, bodily adornment
    for Mystery medicine, feather and kaolin markings, and sunrise closing rites in
    which novices receive ritual gifts and inhale the sacred breath of A'wonawil'ona.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women bathe in a corner of the general living room while managing their cotton
    garments to avoid exposure; men present are described as showing no concern for
    the ablutions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For ceremonials, women discard the high-necked, long-sleeved cotton garment;
    men wear cotton shirts and trousers in the chamber but later usually dance in
    a woven breechcloth; both sexes remove moccasins when entering the chamber.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ceremonial chamber etiquette requires greeting and welcome on entry, with
    the newcomer asked to be seated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sleeping in the ceremonial chamber is prohibited except for extremely aged
    members; offenders, including pregnant women and young children, are corrected
    by touch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the ceremonial, each member's head is washed in yucca suds, and continence
    is observed during the ceremonies and for four days afterward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A novice wears a plume for four days while observing continence and abstaining
    from animal food and grease; the fast continues for four days after initiation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the morning before initiation, the fraternity father removes the novice's
    plume at Ku'shilowa, ties it to a yucca blade, sprinkles it with meal, prays for
    long life and a true heart for the novice, and deposits it on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After returning, the member elect goes to the fraternity father's house, where
    the wife or daughter bathes his head; afterward he is entertained at a feast without
    animal food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Novices sit in line on the north side of the room near the altar until fraternity
    fathers prepare them; they then cross to the south side, usually near the fireplace,
    where each fraternity father adorns his fraternity child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: For Mystery medicine, male novices are colored brownish red on the face, body,
    upper arms, and legs, with kaolin on lower limbs and hands; female novices receive
    kaolin paint on feet, lower legs, hands, and lower arms and wear the usual woven
    dress.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Owl and raven feathers, held by yucca ribbons, are crossed on wrists and below
    knees; the passage states this is so the child of Mystery medicine may be up early
    with the raven and go about at night without fear like the owl.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kaolin paste covers the chin and upper lip, and a kaolin circle is put around
    the top of the head; hawk or eagle down is dotted over the kaolin and is stated
    to be symbolic of the clouds of the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: After adornment, novices return to their seats and their hands are held in
    turn by invited female guests; in some cases the wife of the fraternity father
    sits on the novice's left and the elder sister on the right.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: At sunrise, novices are seated on blanket-covered boxes or low stools facing
    east, with a wife or sister of each fraternity parent standing behind the novice
    and resting hands on the novice's shoulders.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: A vase of water and a bowl with yucca root are placed before each novice,
    and makers of suds stand beside them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Each novice receives a mi'li, prayer plumes, and two eagle-wing plumes; before
    each gift is presented it is drawn four times across parts of the head and before
    the mouth, after which the candidate inhales the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:8
