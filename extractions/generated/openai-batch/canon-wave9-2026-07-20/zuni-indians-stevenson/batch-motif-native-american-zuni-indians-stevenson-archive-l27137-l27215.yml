canonical_text:
  quote: ''
  summary: The passage describes a crowded ritual healing performance in which male
    and female theurgists work on patients, suck or draw out disease materials such
    as stones, yarn, cloth, and string, use crystals and eagle plumes, display and
    dispose of extracted substances before the altar, and later form a novice line
    in which novices hold plumes behind fraternity parents and receive consecrated
    water from the a'kwamosi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five male and two female theurgists begin working on patients; later about
    twenty move among the sick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Mother is described as one of the experts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage includes many people suffering from real or imaginary ills, with
    a few seriously afflicted.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Theurgists appear to extract materials from the writer's forehead, including
    pebbles and yarn; a Sia guest appears to extract a large stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sleeping during the event is described as disrespectful to the Beast Gods,
    except for young infants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The theurgists dance in groups and in parallel lines, facing south and north
    while moving back and forth from west to east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A theurgist from the Little Fire fraternity enters with three followers in
    a semicrawling position and uses a crystal and eagle plumes on an invalid.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The crystal is said to show the seat of disease, and eagle plumes and sucking
    are used at the indicated spot.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Disease extraction is mostly done by sucking, though plumes may draw disease
    to the surface so that the material is caught by hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Theurgists exhibit stones, bits of old cloth, and strings, wave the hand toward
    the invalid, and make an exclamation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Extracted material is usually waved before the altar and deposited in a large
    bowl; the first material is often thrown into the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After disposing of the material, a theurgist takes meal from a basket before
    the altar and goes outside to sprinkle it with a prayer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some theurgists wear bear-foot skins on one or both hands and personate animals
    while growling and wrangling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At half past 3, the healing performances pause and novices form a line behind
    their fraternity parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Fraternity parents extend eagle plumes over their shoulders for novices to
    hold, while a wife or sister stands behind with hands on the novice's shoulders.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The novice line moves and turns by directions, and the novices receive consecrated
    water from the a'kwamosi, administered from a shell.
  category: sequence
  evidence_refs:
  - ev:6
