canonical_text:
  quote: ''
  summary: 'The passage describes an observed Zuñi auction in the great plaza in 1896:
    an auctioneer secretly covers yellow blossoms with a conical cooking vessel, women
    bring food wares in bowls and baskets, the auctioneer proposes exchanges and quickly
    finds purchasers, payments are made immediately, and the aged auctioneer receives
    invitations to eat rather than payment.'
