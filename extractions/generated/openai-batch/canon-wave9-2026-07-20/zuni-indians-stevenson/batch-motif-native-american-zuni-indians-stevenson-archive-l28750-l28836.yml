canonical_text:
  quote: ''
  summary: The passage describes the Shu'maakwe fraternity, its treatment for convulsive
    twisting illness, its altar and yucca-square rite, its patron Shumai'koli gods
    and origin legend, dangerous requirements for wearing Shumai'koli masks, and a
    reported Zuni-Sia exchange of masks, rites, initiation, prayers, and prayer-plume
    knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shu'maakwe is named from shu'minne, a spiral shell, and is said to treat
    ku'sukiayakia, described as a severe twisting of the body with convulsions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated remedy includes sprinkling urine on a heated stone over which crushed
    medicine is sprinkled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An adult invalid is carried by four men in a blanket to the fraternity chamber,
    where principal fraternity men are assembled, an altar is erected, and a meal
    painting is made before it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fraternity director makes a square from four central stalks of yucca,
    described as symbolic of the four winds, and lays the square on the painting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the patient is rubbed with medicine from the hot stone, the director
    moves the yucca square over the patient's body while four songs are sung, rolls
    the square between his hands, and the yucca drops back into four original pieces.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says that if the director fails to undo the four knots during
    the yucca rubbing, the patient would surely die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Shu'maakwe has the Shumai'koli of the six regions as patron gods, with
    Sai'apa warriors as attendants.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Shumai'koli are said to live in Chi'pia in the east, near Shi'papolima,
    identified as the home of Po'shaiyiinki.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The fraternity is said to comprise two orders, Shumai'koli and Fire, and to
    have been organized by the Shumai'koli after they visited Hal'ona at the invitation
    of the pe'kwin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the origin legend, the Shumai'koli came to this world through a place in
    the northwest and the Sun Father commanded them to go to his house in the east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Sun Father gave the Shumai'koli medicine, one kind to drink and another
    for external use, which cured their foot soreness from travel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Shumai'koli later visited Hal'ona and initiated a man of the Chaparral
    cock clan into the secrets of the medicine and songs given by the Sun Father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After going west, the Shumai'koli descended into a body of water that flowed
    in no cardinal direction; since then they are said to live in the waters and at
    Chi'pia, with representatives of the six regions at each place.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: The passage says Shumai'koli masks are found in Hopi and Sia villages and
    that other Rio Grande Indians probably personate these gods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: A man must remain four days in his home before wearing a Shumai'koli mask;
    otherwise the mask is said to stick to his face, break the skin, cause madness,
    and lead to death in four days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Zuni are said to possess their own Shumai'koli masks and also those of
    the Sia Indians because of friendship between the Shu'maakwe director and the
    Sia people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Shu'maakwe director proposed that the Sia bring a young man to Zuni to
    be initiated into the Ko'tikili and taught prayers and prayer-plume preparation
    for the Ko'yemshi.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:18
  text: In winter 1891, Sia priests who were also theurgists came to Zuni with a young
    man; the youth was initiated into Ko'tikili, instructed in offerings to the A'wan
    Kok'ko, and returned to Sia able to impersonate the Ko'yemshi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The passage states that interchange of rites and masks exists to a considerable
    extent among the Pueblo tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: A note states that gods may be personated only by people who know the prayers
    addressed to them and how to make prayer plumes for the special gods to be personated.
  category: attribute
  evidence_refs:
  - ev:8
