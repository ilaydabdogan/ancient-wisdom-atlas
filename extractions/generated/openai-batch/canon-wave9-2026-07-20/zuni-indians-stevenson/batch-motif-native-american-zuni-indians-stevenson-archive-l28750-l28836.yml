candidate_motifs:
- id: motif:1
  label: Ritual healing through fourfold symbolic manipulation
  taxonomy_refs: []
  basis: The healing rite uses four carriers, a square of four yucca stalks symbolic
    of four winds, four songs, and successful release of four knots as part of the
    treatment.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a passage-level ritual pattern rather than a mapped taxonomy motif
    in the supplied list.
- id: motif:2
  label: Divine gift and transmission of curative knowledge
  taxonomy_refs:
  - wisdom
  basis: The Sun Father gives medicine and songs, and the Shumai'koli later initiate
    a human recipient into the secrets of the medicine and songs.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage emphasizes ritual
    medicine and songs rather than abstract wisdom.
- id: motif:3
  label: Initiation into esoteric ritual knowledge
  taxonomy_refs:
  - initiation
  basis: The legend includes initiation into medicine and song secrets, and the historical
    account describes initiation of a Sia youth into Ko'tikili with instruction in
    prayers and prayer plumes.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage reports multiple initiatory events in different contexts.
- id: motif:4
  label: Dangerous sacred mask requiring prior observance
  taxonomy_refs: []
  basis: A man must remain four days at home before wearing the Shumai'koli mask;
    failure is said to cause the mask to adhere to the face, injury, madness, and
    death.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No supplied motif-family taxonomy directly matches this mask-observance
    pattern.
- id: motif:5
  label: Sacred exchange of masks and rites between communities
  taxonomy_refs:
  - sacred_exchange
  basis: Sia Shumai'koli masks are given to the Zuni Shu'maakwe, and Zuni ritual specialists
    provide initiation and instruction so the Sia can again personate Ko'yemshi.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives a specific ethnographic account of exchange; wider generalization
    should be reviewed.
- id: motif:6
  label: Sacred migration under divine command
  taxonomy_refs:
  - departure
  basis: The Shumai'koli come into this world, are commanded by the Sun Father to
    travel east, and later move to Chi'pia and the waters.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The supplied taxonomy term departure only partly captures the origin travel
    described here.
comparison_claims:
- id: claim:1
  claim: The passage presents Shumai'koli masks and personation as shared or parallel
    practices among Zuni, Hopi, Sia, and probably other Rio Grande Pueblo peoples.
  claim_level: same_function
  target: Hopi, Sia, and Rio Grande Pueblo Shumai'koli personation traditions
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself raises the question of tribal origin and uses cautious
    language for Rio Grande Indians.
- id: claim:2
  claim: The reported transfer of Sia Shumai'koli masks to the Zuni Shu'maakwe is
    a direct case of historical ritual contact between Sia and Zuni communities.
  claim_level: historical_contact
  target: Zuni-Sia Pueblo mask exchange
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is based on the account in the passage and should be checked against
    wider ethnographic context.
- id: claim:3
  claim: The Zuni initiation and instruction of a Sia youth into Ko'tikili knowledge
    is presented as a historical transfer of ritual competence for Ko'yemshi personation.
  claim_level: historical_contact
  target: Zuni-Sia Ko'yemshi personation and prayer-plume instruction
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the described 1891 event and the passage's
    explanation of required knowledge.
- id: claim:4
  claim: The passage's final statement supports a cautious pattern-level comparison
    that rites and masks circulate among Pueblo tribes.
  claim_level: same_function
  target: Pueblo intercommunity exchange of rites and masks
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is general and not documented in detail within this passage
    beyond the Zuni-Sia example.
