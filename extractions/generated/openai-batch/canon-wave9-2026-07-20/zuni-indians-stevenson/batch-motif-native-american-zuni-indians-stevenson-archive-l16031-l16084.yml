canonical_text:
  quote: ''
  summary: The passage gives two Native accounts of the 1680 Zuni revolt. In one,
    the Zunis withdraw to Corn mountain, poison springs, prepare stones, repel Spaniards
    with missiles and shell medicine, and avert further attack through a written message
    from the Spanish priest. In Tu'maka's fuller account, Zunis plan a church attack,
    the keeper of the great shell leads with medicine, the priest is made to wear
    Zuni dress, the group returns to Corn mountain, Laguna Indians warn of an approaching
    attack, and protective measures against poisoned springs and shells are described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer says accounts of the 1680 revolt were obtained from a shi'wanni,
    or rain priest, and from Tu'maka, a theurgist of an esoteric fraternity.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the rain priest's account, the Zunis went to the mesa called To'wa yal'liinne,
    Corn mountain, and prepared for defense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the way to the mesa, the Zunis poisoned several springs and placed stones
    near the brink of the mesa for use as missiles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Spanish priest who was with the Zunis accompanied them to the mesa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Spaniards came to avenge the priest's supposed death, they were met by
    missiles from the mesa and by small shells containing magic medicine ejected from
    the mouths of the keeper of the great shell and his deputy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rain priests had the foreign priest write on buckskin that he was safe and
    beloved by the Zunis; the rolled skin was weighted with a large stone and thrown
    into the valley, after which the Spaniards retired.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tu'maka's account says that after the old church was built in I'ti wanna,
    a Spanish priest resided permanently at the village, and the Zunis came to believe
    the Spaniards would destroy them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Zunis planned a revolt by telling women and children not to attend services
    on a certain day, while men went to the church with bows and arrows hidden under
    blankets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tu'maka identifies the keeper of the great shell as the leader of the revolt,
    saying that he declared he was unafraid because he had medicine to destroy the
    enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the church, the Zunis found only a few Spaniards, locked the doors, killed
    all except the priest and one other who escaped through the roof, and made the
    priest wear Zuni dress after stripping him of vestments.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The keeper of the great shell said it would be best to return to To'wa yal'liinne
    for better protection from the enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: While on To'wa yal'lanne, the Zunis saw a distant fire at night and sent several
    men to find out what it meant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A party of Laguna Indians had made the fire; they warned that many Spaniards
    and many Indians would soon attack and later joined the Zuni party.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Lagunas said they had been compelled to accompany the Spaniards against
    the Zunis but had escaped.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Zunis instructed the Lagunas to fill hides with water, avoid Zuni-country
    springs because they would be poisoned, and hold cedar twig in their mouths as
    protection from poisoned shells shot by the keeper of the shell.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: When the enemy was discovered approaching, the keeper of the great shell and
    his deputy were in their house; they were called three times to help the people
    but did not come out.
  category: sequence
  evidence_refs:
  - ev:9
