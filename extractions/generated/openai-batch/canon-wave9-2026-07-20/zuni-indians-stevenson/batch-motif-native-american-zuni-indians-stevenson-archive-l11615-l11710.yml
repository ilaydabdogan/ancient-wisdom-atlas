canonical_text:
  quote: ''
  summary: 'The passage describes part of a Zuñi crop thanksgiving festival: Bow priests
    and warriors gather, sing, drum, dance with weapons, adorn girl dancers, make
    a fire, appeal to the Gods of War for enemy lives so that rain and crops may come,
    proceed through plaza dances, and later continue with Ant fraternity singing,
    bear personation, lightning-marked warriors, ordeal-like performances with a live
    coal and arrow, and a party personating Navahos.'
  language: English
  quote_policy: summarized
