canonical_text:
  quote: ''
  summary: A Zuni account describes ritual specialists using shell-held medicine from
    a mesa to incapacitate an attacking force; a later message from a Spanish priest
    averts another attack; an episode of sorcery against a sick associate leads to
    the burial of dangerous medicine and tiny shells; the great shell remains but
    is only blown ceremonially. The passage then summarizes Zuni descent from Corn
    Mountain, construction of a defensible village after raids, and limited accommodation
    of Catholic ritual through use of Zuni symbols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The keeper and his deputy came forward after a fourth call when the enemy
    was already well up the mesa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The keeper and deputy wore only breechcloths, had red-painted bodies and limbs,
    black-painted faces, eagle down on forehead and chin, red eagle plumes on their
    scalp locks, and yucca wreaths at wrists and ankles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each theurgist filled a tiny shell with medicine, placed the shell in his
    mouth, and approached the mesa edge unarmed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people warned the theurgists not to advance, and the theurgists answered
    that they were not afraid.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The theurgists blew the shell-held medicine toward the enemy, after which
    enemy members appeared intoxicated, staggered, fell, and nearly the whole army
    was destroyed; survivors retreated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that all Rio Grande pueblos except the Lagunas fought the
    Zunis, and that Lagunas accompanying the Spaniards did not shoot arrows.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: About six months later the Lagunas appeared again and made a fire, and the
    Zunis were told another attack was expected.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The keeper of the shell prepared medicine again, but the Spanish priest wrote
    a charcoal message on deerskin saying he was safe, loved the Zunis, and wished
    to remain with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the Spaniards read the priest’s message, they did not attack and instead
    sent clothing and other things to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A sorcerer placed medicine around the roof of the sick associate’s house at
    night, but when trying to descend through the hatchway he lost his strength and
    could not move.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sick man questioned the sorcerer, who admitted he had put medicine there
    because he wanted the sick man to die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The sick man warned the sorcerer not to try again, saying he could find him
    out and destroy him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: The sister of the sick man put away his medicine, including all the tiny shells,
    placed them in a water vase, and buried the vase in a hole on a knoll at the base
    of the mesa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that only the great shell remains for the Navahos; it would
    be used with medicine in case of attack, but in ceremonies it is only blown because
    the medicine would kill all the people.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: After living a long time on To'wa yallanne, identified as Corn Mountain, the
    Zunis descended and scattered over the valley.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Raids by Navahos and Apaches forced the Zunis to build the present village
    on the remains of old I'tiwana, on an elevated knoll north of the Rio Zuni.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The village houses are described as compact, multi-story groups in which roofs
    of lower houses serve as front yards for houses above, and interiors allow inhabitants
    to communicate readily.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:18
  text: The compact structures served as fortifications, with ladders to roofs drawn
    up in case of attack.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: A church was built in the new village, and the Zunis became interested in
    Catholic ritual especially because they were allowed to use their own symbols
    in church decoration.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: The writer says Zuni religious and social institutions were only slightly
