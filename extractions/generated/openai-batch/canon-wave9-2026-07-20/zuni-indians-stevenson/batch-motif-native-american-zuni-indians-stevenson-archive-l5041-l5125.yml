candidate_motifs:
- id: motif:1
  label: food-for-divine-aid exchange in the hunt
  taxonomy_refs:
  - sacred_exchange
  basis: Bread, meal, rabbit fur, food, and rabbit meat are offered in connection
    with prayers for game, rain, future hunting success, and feeding the gods.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage describes ceremonial reciprocity rather than a narrated bargain
    or contract.
- id: motif:2
  label: animal offering and fire-feeding of gods
  taxonomy_refs:
  - sacrifice
  basis: Rabbits are ritually killed and handled, and rabbit meat is cast into the
    fire at sunrise with a prayer asking the gods to eat; bread is also cast into
    flames as food for gods.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage is ethnographic ritual description; it does not explicitly
    present the act as a mythic origin story.
- id: motif:3
  label: game animals as children of a divine mother
  taxonomy_refs:
  - divine_parent_child
  basis: The goddess or mother of game is asked to send her children, and the passage
    identifies those children as rabbits sent to the Zuñis.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The exact relation between the named goddess personated by 'Cha'kwena
    and the mother of game is not fully clarified in the passage.
- id: motif:4
  label: first-killed animal blood used for human fertility
  taxonomy_refs: []
  basis: The first rabbit's bleeding nose is rubbed down the 'Cha'kwena's legs so
    that Zuñi girls may reach puberty and be prolific in childbearing.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly names this fertility-blood pattern.
- id: motif:5
  label: ritual washing before sacred participation
  taxonomy_refs: []
  basis: The passage states that no one can take part in a religious ceremonial without
    first having the hair washed, here in yucca suds.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a ritual prerequisite in the passage, not a developed narrative
    motif.
