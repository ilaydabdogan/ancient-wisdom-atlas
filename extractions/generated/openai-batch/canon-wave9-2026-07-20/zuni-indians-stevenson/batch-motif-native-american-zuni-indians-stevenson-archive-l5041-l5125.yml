canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial rabbit hunt involving personated
    gods, ritual preparation, processions, prayers, offerings into fire, a rabbit
    drive and hunt, fertility actions with the first rabbit, ceremonial handling and
    presentation of slain rabbits, fire offerings to the gods, preparation of a rabbit
    skin, return of the gods, night dancing, and an unfinished account of further
    food offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sa'3'a'hlia deposits a reed cigarette in a deep place in the river bed,
    returns to associates, and with other gods notifies the people that the hunt has
    arrived and calls them to prepare.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Giant yucca is used on those who do not get out of the way; people hasten
    to have their hair done up after washing it in yucca suds, and hair washing is
    stated as required before taking part in a religious ceremonial.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants go mounted or on foot; a god personator who wishes to mount may
    exchange mask and saddle with a member of his ki'wi'sine, and maidens ride behind
    fathers or brothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sa'ya'hlia parties are chased successively by directional Sal'imobiya
    gods, and the gods advance until all reach the 'San'iakiakwe waiting in timbered
    country.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A low tree is fired near its base, and the fraternity, gods, and others cast
    bread into the flames with prayers as food for the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prayers ask deceased fraternity members to aid the hunt, ask the goddess or
    mother of game to send her children, identified as rabbits, and ask the rain-makers
    to water the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: All except the gods pass rabbit sticks through the flames for success in the
    hunt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A large circle is formed around the preserve; the 'Cha'kwena and 'Siini'akiakwe
    remain inside and use firebrands to drive rabbits from hiding places among the
    trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rabbits are killed with rabbit sticks by gods and others; gods do not pick
    up the rabbits they kill, while women collect them and return to the circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Rules of striking or whipping apply when a god or man succeeds or fails in
    killing a rabbit, and women who fail to catch passing rabbits receive four strokes
    across the back from the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The first killed rabbit has its nose cut, is handed by a maiden to the 'Cha'kwena,
    and the 'Cha'kwena rubs the bleeding nose down the inner sides of her legs for
    Zuñi girls' puberty and prolific childbearing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the first hunt, women carry slain rabbits to the director and deputy
    of the 'San'iakiakwe, who face east holding firebrands; tail-tip fur from each
    rabbit is placed in the firebrands for future hunt success.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The rabbits are laid on their sides with heads to the east and facing south;
    participants draw near, pray, and sprinkle them with meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Most rabbits are conveyed to the ceremonial chamber of the first body of A'shiwanni,
    laid with heads to the east, and given an ear of corn between the forepaws; those
    present pray and sprinkle meal before a feast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The rabbits presented to the first body of A'shiwanni are stewed in ceremonial
    vessels, and at sunrise the meat is cast into the fire with a prayer asking the
    gods to eat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: "'Si'sikia flays his rabbit and fills the skin with cedar bark; meal is placed
    as a symbolic heart, a hollow reed runs from the mouth through the filling, and
    gypsum is placed in the eye sockets."
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the hunt the gods pass through the village before entering He'kiapawa
    ki'wi'sine; dancing continues through the night in six ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: During the evening the 'Cha'kwena, led by the Ko'mosona, encircles the village
    and then goes north of the village to deposit food offerings; the sentence ends
    before the object or place is completed.
  category: sequence
  evidence_refs:
  - ev:8
