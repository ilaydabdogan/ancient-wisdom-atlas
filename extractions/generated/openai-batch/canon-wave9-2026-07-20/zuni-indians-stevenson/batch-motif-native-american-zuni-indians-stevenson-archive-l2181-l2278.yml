canonical_text:
  quote: ''
  summary: The passage recounts the A'shiwi distress after witches destroy their corn
    and food, the failed searches for the Corn Maidens by birds sent by the Gods of
    War, Bi'si'si's successful discovery of a Corn Maiden, his travel by the Galaxy
    to Pau'tiwa, the Corn Maidens' return toward I'tiwanna, and a ritual sequence
    involving meal symbols, six colored directional te'likinawe, circling, and procession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After four time periods at I'tiwanna, the A'shiwi suffer because witches destroy
    their corn and other food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'shiwi call on the Gods of War for aid, and the Gods of War send the
    raven, owl, and hawk to search for the Corn Maidens; each search fails.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Gods of War go to the spring Lu'klana'kiai'a and ask Bi'si'si to find
    the Corn Maidens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bi'si'si agrees to search and goes with the Gods of War to the ki'wi'sine
    where the A'shiwanni are assembled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The exchange between the Kia'kwemosi and Bi'si'si is described as speech from
    the heart rather than from the lips.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The A'shiwanni sit all night and all day in the ki'wi'sine without fire, spoken
    words, eating, drinking, or smoking, with their thoughts directed to the Corn
    Maidens and rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bi'si'si ascends a tall cottonwood tree and sees one of the maidens in the
    far south through the separated plumes of a duck's wing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yu'pia'hlan'na, the Galaxy, bows to the earth to receive Bi'si'si and carries
    him to Ke'yatiwa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Ke'yatiwa, Bi'si'si tells Pau'tiwa that the A'shiwanni want the Corn Maidens
    to come to them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Corn Maidens say they are afraid to go, but Pau'tiwa tells them that their
    Great Fathers want them and that they must go.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bi'si'si returns to I'tiwanna followed by A'wan ta'chu Ko'yemshi, Pau'tiwa,
    and the Corn Maidens, who remain at Ku'shilowa while he goes to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the ki'wi'sine, the A'shiwanni sit at the west end behind a cloud symbol
    made of meal, with miwachi on the meal painting and a line of meal extending toward
    the ladder.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'A basket contains six te''likinawe, each color corresponding to a Corn Maiden
    and a direction: yellow north, blue west, red south, white east, white dotted
    in all colors zenith, and black nadir.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Bi'si'si carries out and plants the six te'likinawe in sequence, ending with
    the black one near Pau'tiwa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The gods are described as being in human form; they sit south of the Corn
    Maidens, who stand in an east-west line.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: Bi'si'si and then A'wan ta'chu Ko'yemshi circle from left to right around
    Pau'tiwa and the Corn Maidens.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:17
  text: The final procession toward I'tiwanna has the pe'kwin before Bi'si'si, Bi'si'si
    before Pau'tiwa, and the Corn Maidens following.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: A note reports a minority version in which Bi'si'si does not ascend the cottonwood
    tree but instead travels by the Galaxy until he is over Ke'yatiwa.
  category: other
  evidence_refs:
  - ev:10
