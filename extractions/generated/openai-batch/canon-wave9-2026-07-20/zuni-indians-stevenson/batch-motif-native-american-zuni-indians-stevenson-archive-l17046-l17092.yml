canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi marriage process: a man asks a girl for permission
    to visit her home; if her parents consent, he is received and fed, instructed
    by her parents in the duties of a husband, remains five nights while working for
    the family, then visits his own parents. His mother sends a dress to the intended
    bride; the bride grinds corn meal and brings it to her mother-in-law, receives
    food, deerskin, and wheat, and then returns with the groom to her mother''s house,
    where the couple make their permanent home. The passage also notes monogamy, frequent
    divorce, and preference for separation over disharmony.'
  language: English
  quote_policy: summarized
