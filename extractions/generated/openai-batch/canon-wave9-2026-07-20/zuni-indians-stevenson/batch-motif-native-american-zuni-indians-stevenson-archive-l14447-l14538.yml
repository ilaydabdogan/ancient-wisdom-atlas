canonical_text:
  quote: ''
  summary: The passage describes Sha'lako personators and alternates depositing plume
    offerings in excavations, sprinkling them with meal, running on the ceremonial
    field, and being pursued as effigies called deer. It explains the ceremony as
    a rain-bringing drama representing Sha'lako courier service among priest rain-makers
    of the six regions. After the gods leave, Navahos and Zunis race on the field,
    and Ko'yemshi personators emerge to perform comic, meal-sprinkling visits on village
    housetops.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sha'lako personators and alternates deposit te'likinawe or te'likinane in
    numbered excavations in an ordered sequence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Sha'lako personator sprinkles the deposited plume offerings with meal, and
    the sprinkling follows the same pattern as the depositing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: All the Sha'lako appear on the field, run rapidly, leave in single file, and
    each is accompanied by a wor'li and an alternate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men pursue the Sha'lako effigies; when an effigy is caught, it is thrown
    on the ground, the catcher says that he has killed the deer, and he sprinkles
    it with meal while praying for hunting success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that catching the effigy indicates success in the coming
    hunt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sha'lako wor'we fill the openings, take the effigies apart in a nearby
    cabin, and bring masks and paraphernalia back to the village under blankets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage explains the elaborate ceremonial as a rite to bring rain to fructify
    the earth and as a dramatization of Sha'lako courier service for priest rain-makers
    of the six regions.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: After the gods leave the field, Navahos enter the formerly forbidden ground,
    and Navahos and Zunis take part in mounted and foot races.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the Sha'lako have disappeared, the ten Ko'yemshi personators appear,
