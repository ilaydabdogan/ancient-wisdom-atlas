canonical_text:
  quote: On the cradle, just where the head of the infant should rest, was a perfectly
    round turquoise of excellent color.
  summary: 'The passage describes several observed birth and postpartum cases: a doctress
    bathes a young mother with water after infant bathing preparations; a grandfather
    completes a decorated cradle gifted by a paternal uncle and the infant is strapped
    into it; the infant later takes the mother''s milk. A second case notes that an
    unmarried sixteen-year-old mother receives the same attentions as if married,
    with kind treatment from relatives and her brother, a rain priest. A third case
    describes a severe birth injury after an infant is strangled by the umbilical
    cord, the young mother being brought to Zuñi during a rainstorm, examined by Nai''uchi,
    and treated with washing and dressings.'
  language: English
  quote_policy: quoted
