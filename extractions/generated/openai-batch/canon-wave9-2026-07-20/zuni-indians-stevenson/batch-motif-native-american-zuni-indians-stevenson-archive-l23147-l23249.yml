  end: '23249'
  translation: 'The Zuñi Indians: Their Mythology, Esoteric Fraternities, and Ceremonies'
  notes: Generated from OpenAI Batch run canon-wave9-2026-07-20; human review required.
canonical_text:
  quote: ''
  summary: The passage describes Zuñi fraternity prayer-plume offerings, monthly and
    seasonal deposits, a rattlesnake shrine rite for rain, ceremonial chamber orientation,
    altar and drum furnishings, multilingual ritual songs and an associated A'pachu
    legend, officer positions, and bathing and hair-washing requirements for ceremonies.
  language: English with Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who has severed connection with the U'liuhukwo fraternity must prepare
    and deposit plume offerings as though still a member after instruction by her
    fraternity father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of all fraternities except the 'Hle'wekwe make and deposit prayer
    plumes at new and full moon, at winter and summer solstices, upon a member's death,
    and at fraternity meetings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prayer plumes are deposited in fields, at fraternity shrines, and in other
    places.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five named fraternities plant prayer plumes in April at a shrine south of
    Zuñi dedicated to the rattlesnake and invoke snakes to intercede with rain-makers
    for rain upon Zuñi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sticks of the rattlesnake-shrine offerings are colored red with black
    lines at one end to indicate a rattle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Semimonthly prayer plumes are deposited in cornfields or melon patches, and
    autumn fruits and edible seeds are buried in fields as thanksgiving offerings
    with requests for abundance in the coming year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the full moon of October, an altar is erected in the ceremonial chamber
    and members sing until midnight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fraternity ceremonials, except those of the Ko'tikili, are held in large ground-floor
    chambers ordinarily used as family living rooms.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ceremonial rooms are preferably oriented east-west so that the altar faces
    east and first daylight enters through the eastern window.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before a fraternity occupies a room, the household moves out and the room
    is cleaned; non-member household occupants may still be present for rehearsals,
    but songs are not begun until non-members are supposed to be asleep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Several fraternities sing in Zuñi and also in other named languages, and a
    legend says the Mu"kwc learned A'pachu songs from A'pachu people soon after they
    came to this world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A legend says the A'pachu were initially friendly with the Zunis and Mu"kwe
    when they came through Ji'ini'kianapkiatea, but conflict followed after the A'pachu
    slighted the Zuñi a'mosi, and the Zunis drove the A'pachu north.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Fraternity pottery drums are vase-shaped, curled at the mouth, covered with
    deerskin, usually white or cream-colored, and decorated with cougars, bears, and
    snakes, often shown in combat.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tablet altars are made in sections, stored when not in use, freshly decorated
    for ceremonials, and, along with dry paintings, called tfsh'kwi, meaning not to
    be touched.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: The a'kwamosi sits north of the altar, the pe'kwin sits south of it, and the
    flutist usually sits behind the altar while playing.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Hair washing in yucca suds and bathing are carefully performed for ceremonials
    because an unclean person is offensive to the tutelary gods; bathing is repeated
    morning and evening during meetings.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Men may bathe in the river or in the living room, and women of the family
    wash the men's hair and one another's hair.
  category: action
  evidence_refs:
  - ev:11
