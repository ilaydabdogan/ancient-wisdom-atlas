- id: obs:2
  text: Cotton clothing is worn by both poorer and better-class people until it falls
    apart; fresh garments used for ceremonial occasions are later put on again and
    worn until their service is complete.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that no one dresses his or her own hair; women comb men’s
    hair and one another’s, with an occasional exception for an enamored lover or
    bridegroom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A favorite pastime is to sit outside the house and search hair for vermin;
