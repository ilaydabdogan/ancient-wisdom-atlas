canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi clothing care and hairdressing practices: woolen
    garments are sometimes washed with yucca-root suds, cotton clothing is worn until
    it decays, fresh garments may be used for ceremonies and then worn again, and
    hair is dressed by others using combing, brushing, string, red wrapping, and arranged
    bangs. It distinguishes men’s hair bows from women’s queues and notes that women’s
    bangs cover the face in ceremonies because the face should not be exposed to men’s
    gaze.'
  language: English
  quote_policy: summarized
