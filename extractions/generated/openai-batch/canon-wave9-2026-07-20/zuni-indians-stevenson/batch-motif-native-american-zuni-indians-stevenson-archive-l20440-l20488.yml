  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The tongue is used to smooth hair into place; the hair bow is wrapped with
    a red woven garter or red yarn, and the man ties a head-kerchief or silk band
    around his head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women’s hair is arranged similarly in the back, but as a queue wrapped with
    garter or yarn; in certain ceremonies previously braided hair falls down the back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A woman or girl separates bangs that fall to the lower lip and catches hair
