canonical_text:
  quote: ''
  summary: During the A'shiwi journey, scouts kill two women from a nearby village,
    provoking a battle the A'shiwi cannot win. Kow'wituma and Wats'usi ask the Sun
    Father for replacement warriors. Heavy rain animates a cascade, which is embraced
    by the sun and bears twin diminutive children from foam. The children identify
    the Sun as father and Laughing water as mother, accept a war role, and are named
    as U'yuyewi and Ma'sai'lema in war and A'hayuta in peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The A'shiwi are traveling from Ko'thlu wala'wa toward a place later called
    Han'lipinkia when smoke is seen in the distance and interpreted as indicating
    a village.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Divine Ones order two members of the Ne'wekwe ti'kili to go ahead and
    look for a trail, despite the two men's stated concern that they are fighting
    men who might kill someone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two scouts see two women washing buckskin on a stream bank and kill them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People from the village associated with the smoke attack the A'shiwi after
    learning of the killings, and the A'shiwi fight for two days without success.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kow'wituma and Wats'usi become weary from repeated fighting and ask their
    Sun Father to send two others to replace them as warriors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sun Father causes heavy rain; the cascade on the mountain side becomes
    lively, is embraced by the sun, and bears twin children who issue from foam.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kow'wituma and Wats'usi see two small beings on the basin water and recognize
    them as divine in origin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The firstborn child, U'yuyewi, states that the Sun is their father and Laughing
    water is their mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wats'usi asks the newborn beings to fight for him; the firstborn initially
    says he is very small and does not know how to fight, but the brothers later agree
    to fight.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wats'usi says the opposing leader Cha'kwena continues moving before her army
    and shaking her rattle although many arrows have pierced her heart.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wats'usi states that the A'shiwi cannot continue their quest for the Middle
    place of the world until the opposing people are conquered or destroyed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The newborn gods say they will join the A'shiwi and may or may not destroy
