candidate_motifs:
- id: motif:1
  label: divine founding and naming of ritual fraternities
  taxonomy_refs:
  - initiation
  basis: The passage repeatedly presents divine or named supernatural agents as organizing,
    naming, and equipping fraternities with songs, medicines, and initiations.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic account of ritual institutions, not a single
    narrative myth episode.
- id: motif:2
  label: initiatory transmission of esoteric medicine
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Po'shaiyanki and others initiate selected persons and fraternity officers
    into Mystery medicine and specialized healing knowledge.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:10
  confidence: high
  cautions: The content of the medicine secrets is not explained in detail in this
    passage.
- id: motif:3
  label: humans transformed into animal guardians of cosmic regions
  taxonomy_refs:
  - shapeshifter
  basis: Men possessing Mystery medicine secrets are transformed into animals and
    assigned to the North, West, South, East, Zenith, Nadir, or broader earth-related
    functions.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The transformation is performed by the Divine Ones; the passage does not
    describe voluntary shape-changing by the men.
- id: motif:4
  label: serpent beings associated with wisdom and regional oversight
  taxonomy_refs:
  - serpent
  - wisdom
  basis: Some transformed men become rattlesnakes so that they may preside with wisdom
    over the six regions.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage names rattlesnakes only briefly and does not narrate further
    serpent actions.
- id: motif:5
  label: fire-handling and fire-eating as initiatory specialization
  taxonomy_refs:
  - initiation
  basis: The Great Fire fraternity receives the practice of eating large coals of
    fire, another fraternity receives playing with fire but not eating it, and another
    does not receive fire secrets.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The ritual procedures are only summarized.
- id: motif:6
  label: dangerous-object initiation with sword or knife
  taxonomy_refs:
  - initiation
  basis: The passage describes sword-swallowing initiation from A'chiyala'topa and
    a Stone Knife order in which a knife is passed before the lips at initiation.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: Sword swallowing and Stone Knife rites are related by proximity and function
    here, but the passage distinguishes their procedures.
- id: motif:7
  label: sacred object descends from gods to authorize an order
  taxonomy_refs: []
  basis: One account says a stone knife descended from the gods above into a ceremonial
    chamber, indicating that the Stone Knife order should be created.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage attributes this account only to some officers of the fraternity.
- id: motif:8
  label: underworld-origin divine visitors disclose migration route
  taxonomy_refs: []
  basis: The Shumai'koli god and warrior state that they originally came from the
    undermost world and describe their travel route to Chi'pia.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives only a brief report of the apparition and route.
comparison_claims:
- id: claim:1
  claim: Within the passage, the Great Fire fraternity's wood sword-swallowing order
    and the 'Hle'wekwe are presented as parallel recipients of sword-swallowing knowledge
    associated with A'chiyala'topa at Shi'papolima.
  claim_level: same_function
  target: Great Fire fraternity wood order and 'Hle'wekwe sword-swallowing initiation
    traditions
  evidence_refs:
  - ev:5
  - ev:6
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the passage; the footnote notes
    a disagreement about which group received the sword-swallowing initiation first.
