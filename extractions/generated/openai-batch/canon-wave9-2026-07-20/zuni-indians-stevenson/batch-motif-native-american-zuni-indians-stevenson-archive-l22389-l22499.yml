canonical_text:
  quote: ''
  summary: The passage recounts the founding and naming of several Zuñi fraternities,
    the giving of medicines and songs, initiations into Mystery medicine and fire
    or sword-related rites, the transformation of medicine-holding men into animal
    guardians of the world regions, a Stone Knife origin account, and an apparition
    by Shumai'koli gods who describe their home and underworld origin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shi'wannakwe and Ne'wekwe are described as allied because of the close
    relation of two original couples, with Shi'wannakwe regarded as elder brother
    of Ne'wekwe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Divine Ones named additional fraternities, including 'San'iakiakwe/Sus'kikwe
    and 'Hle'wekwe, and gave medicines and songs to each fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the A'shiwi settled at Hal'ona, the Divine Ones visited Shi'papolima
    and met Po'shaiyanki, his associates, and men holding the secrets of Mystery medicine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Divine Ones stated that guardians were needed for the six regions and
    for the whole world, and that these guardians required cunning of scent and sight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Men possessing the secrets of Mystery medicine were changed into beasts and
    assigned as guardians: cougar to North, bear to West, badger to South, white or
    gray wolf to East, eagle to Zenith, and shrew to Nadir.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other men were converted into rattlesnakes to preside with wisdom over the
    six regions, and others into ants that scattered their houses over the earth and
    became zoic gods of the A'shiwi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Divine Ones asked Po'shaiyanki, Na'ke'e, and others to go to Hal'ona and
    initiate the A'shiwi into Mystery medicine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Hal'ona, the makers of medicine water of the Shi'wannakwe and Ne'wekwe
    were initiated into Mystery medicine and afterward initiated others of their fraternities.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A fraternity formed around Na'ke'e, his wife, and another man was initiated
    into Mystery medicine and eating large coals of fire, and was named the Great
    Fire fraternity, with Na'ke'e as original director.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Na'ke'e received sword-swallowing knowledge from A'chiyala'topa, described
    as a being with wings and a tail of knives, and initiated fraternity members into
    sword swallowing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The 'Hle'wekwe traveled northward and eastward to the home of Po'shaiyanki
    and were initiated into sword swallowing by A'chiyala'topa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another man was initiated into Mystery medicine and playing with fire, but
    not eating fire, and he formed the U'huhukwe fraternity by initiating others.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Kow'wituma and Wats'usi chose two men, whom Po'shaiyanki initiated into medicine
    for disease caused by witchcraft of man and disease caused by angry ants; this
    fraternity was named Hii'lo'kwe and also A'chiya or Stone Knife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Hii'lo'kwe did not receive the secrets of fire.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A Stone Knife order origin account says a stone knife descended from gods
    above into the ceremonial chamber through the hatchway and indicated that such
    an order should be created.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the Stone Knife order, the knife is passed before the lips at initiation
    rather than swallowed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Po'shaiyanki distributed beast god medicines, tablet altars, and sand or dry
    paintings to the fraternities.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: One night, a Shumai'koli god and his warrior appeared without masks to a man
    of the Po'yi'kwe clan and told him about their present home, original underworld
    origin, and travel route.
  category: action
  evidence_refs:
  - ev:11
