canonical_text:
  quote: ''
  summary: The passage explains a Zuni-interpreted rock etching associated with the
    'Hle'wekwe fraternity. Its pictographic elements are read as a migration route,
    a medicinal-plant detour, landscape features, a water basin, Ursa Minor, elapsed
    years, and an ancient Shi'wi figure. A note adds that Zuni tradition locates nativity
    in the far northwest and that 'Hle'wekwe belief credits their et'towe with bringing
    previously unknown snows during a northern journey.
  language: English
  quote_policy: summarized
