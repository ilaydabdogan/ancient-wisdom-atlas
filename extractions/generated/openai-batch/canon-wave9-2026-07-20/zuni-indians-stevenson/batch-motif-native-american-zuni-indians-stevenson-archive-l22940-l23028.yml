canonical_text:
  quote: To prepare a mi'li without the appropriate ceremony is sacrilege.
  summary: The passage describes the secret disassembly and reconstruction of sacred
    mi'li or mi'wachi objects made from ears of corn, seeds, cloth, buckskin, and
    carefully ordered plumes. The theurgist prays to A'wonawil'ona and the Beast Gods
    before the work, uses earth paste and other materials, restores the corn object
    with seeds and coverings, and arranges feathers that are explicitly linked to
    the four regions, eyes, and the adornment of the Corn Mother.
  language: English
  quote_policy: quoted
