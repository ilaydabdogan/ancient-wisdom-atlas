canonical_text:
  quote: ''
  summary: The passage assigns clan affiliations for paired ceremonial youths and
    maidens, then describes the return of ritual parties with spring water and young
    cornstalks, their placement around a cloud symbol, smoke, flute, rhombi, song
    for abundant watering of the earth, water sprinkling over objects, corn, and people,
    and a procession led by Bow priests and the pe'kwin. It also explains symbolic
    colors and designs on a ceremonial kilt.
  language: English
  quote_policy: summarized
