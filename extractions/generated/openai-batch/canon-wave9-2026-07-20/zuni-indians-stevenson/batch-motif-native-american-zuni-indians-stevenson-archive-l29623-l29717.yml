comparison_claims:
- id: claim:1
  claim: The passage itself supports a cautious comparison between Zuni Shu'maakwe
    descriptions and Hopi/Mopi Shumai'koli performances, because the writer says the
    Zuni descriptions accord with scenes observed in Hopi villages and notes the shared
    name Ya'ya for male characters.
  claim_level: same_motif
  target: Hopi/Mopi Shumai'koli performances involving Ya'ya male characters
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is based on this ethnographic author's report within
    the passage; the exact range of shared features is limited to those described
    here.
- id: claim:2
  claim: The passage supports a direct Laguna-Zuni ritual-object contact claim for
    Shumai'koli masks, since the Zuni Shu'maakwe director receives six Laguna masks
    for Zuni keeping and later brings them out ceremonially.
  claim_level: historical_contact
  target: Laguna Shumai'koli masks and Zuni Shu'maakwe ceremonial use
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This establishes a reported transfer of masks, not the origin, full
    history, or complete equivalence of Laguna and Zuni ritual systems.
