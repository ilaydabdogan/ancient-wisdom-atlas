canonical_text:
  quote: ''
  summary: 'The passage describes Shu''maakwe ceremonial variations: a comparison
    with Hopi/Mopi Shumai''koli performances involving Ya''ya figures; the transfer
    of Laguna Shumai''koli masks to Zuni; preparation for the initiation of a woman
    and a girl; a procession of masked gods from Ku''shilowa/east led by a woman scattering
    meal and a charm-bearer; doorway striking with burning brands; dancing, entry
    into the ceremonial chamber with a tree, mask removal, and a feast. It ends with
    a heading identifying the Ma''ke ''San''nakwe fraternity and its four orders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that some Shu'maakwe ceremonial features she had not observed
    in Zuni were described by Zuni informants in terms matching Hopi/Mopi Shumai'koli
    performances, and that both groups use the name Ya'ya for introduced male characters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Ya'ya scene, the figures appear at sunset, separate a circle
    of dancers by grabbing men's wrists, and are later put in blankets and dropped
    through a hatchway into the ceremonial chamber after women have gone home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shu'maakwe director and an associate received six Shumai'koli masks from
    Laguna because all those privileged to use the masks there had died; the wrapped
    masks were brought to Zuni on burros.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The ceremonial occasion is stated to have two purposes: initiation of a woman
    and a young girl into the fraternity, and the first bringing out in Zuni of the
    Laguna Shumai''koli masks.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the ceremonial chamber, six Shumai'koli and three Sai'apa masks lie
    on a large blanket north of the chamber and before the altar while finishing touches
    and regalia arrangements are made.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men not preparing the masks and regalia are grouped on the south side of the
    room and sing with rattle accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A woman of the fraternity sits facing east and then, followed by the charm-bearer,
    goes to Ku'shilowa to return with the gods; two Shumai'koli and two Sai'apa masks
    are taken there under blankets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two pairs consisting of fraternity fathers and novices stand west of the ceremonial-house
    entrance; the men look east while the woman and girl look downward.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: As the gods enter the village, the female leader carries a mi'li and meal
    basket in her left hand and scatters meal with her right, while the following
    man carries and manipulates a charm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The procession includes Shumai'koli of the North and West, followed by two
    Sai'apa attendants; one Sai'apa mask is yellow for the North and the other is
    blue for the West.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the ceremonial house, the charm-bearer holds the charm above his face with
    his left hand, shakes a small gourd rattle with his right, and sings a low chant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sai'apa strike the top, left, base, and right of the door frame with burning
    brands, then join the Shumai'koli in a dance that changes from slow to rapid.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The tree attendant directs the Shumai'koli into the ceremonial chamber, the
    Sai'apa soon join them, the tree is carried in, the gods dance violently for a
    time, the masks are removed, and a feast follows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'The Ma''ke ''San''nakwe fraternity is described as comprising four orders:
    Mystery medicine, Jugglery, Fire, and Pa''yatamu.'
  category: other
  evidence_refs:
  - ev:8
