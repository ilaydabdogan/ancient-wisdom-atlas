canonical_text:
  quote: ''
  summary: An old Zuñi guide reluctantly leads Stevenson and the writer toward the
    sacred lake Ko'thluwala'wa, fearing divine punishment for unauthorized approach
    and sight of its waters. He prays near the lake, scatters prayer meal, speaks
    of the waters as the house of his departed fathers, offers saved bread in the
    fire to the dead, and later conceals the visit from other Zuñi travelers. The
    passage also describes prized pinkish clay associated with the Council of the
    Gods in the lake depths and states punishments for visiting without Ko'mosona
    permission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr. Stevenson and the writer set out to visit the lake, and their Indian guide
    initially declared that they must not go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The guide became alarmed during the approach, interpreted marshy ground as
    made by gods to prevent approach, and said he would offend the gods and die if
    he guided them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Mexican youth said he had seen and looked into the lake, and the guide remarked
    that the youth had looked into the waters and did not die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief that anyone looking on the lake waters without
    special permission of the Ko'mosona will die in four days.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: The party camped half a mile from Ko'thluwala'wa; the guide refused to accompany
    them to the lake but was later found near the water praying.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During prayer, the guide removed his headkerchief, stood erect, extended his
    right hand toward the setting sun, and scattered prayer meal toward the lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After prayer, the guide said he was happy and content to die because he had
    looked upon the waters of the house of his departed fathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The guide approached the lake on foot because the sacred ground was not to
    be desecrated by the tread of beasts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The guide burned bread he had saved and prayed to the dead to intercede with
    the Sun Father and the Kok'ko A'wan for his people and all the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The guide had fasted during the camp stay so that his food could be offered
    to the departed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Pinkish clay collected from a low mountain near the lake was described as
    prized by the Zuñi, connected with rain, and said by priests to come from the
    house of the Council of the Gods in the lake depths.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The guide refused to touch the clay and asked that it not be seen in Zuñi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When two Zuñi travelers appeared, the guide created a fictitious account about
    a visit to St. John, pottery, turquoise, and beads to prevent suspicion that the
    party had visited Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that unauthorized visiting of the lake brings death within
    four days by divine anger and may also bring corporal punishment or death by order
    of the Ko'mosona.
  category: relationship
  evidence_refs:
  - ev:7
