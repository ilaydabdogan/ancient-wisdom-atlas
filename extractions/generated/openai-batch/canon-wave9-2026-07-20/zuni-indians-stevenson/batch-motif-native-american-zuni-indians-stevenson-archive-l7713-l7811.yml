canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence involving Pau'tiwa, Shits'ukia,
    Kwe'lele, the pe'kwin, 'Cha'kwena, Sa'ya'hlia, A'toshle, 'Hle'lele, Salimobiya,
    and Ko'tikili. Actions include meal sprinkling, a fourfold kicking of a twig,
    procession with a whirled rhombus, presentation of cotton loops with prayer, departures
    by the western road, a visit by 'Cha'kwena observed by pregnant women, scolding
    and whipping by ritual beings, a fire-centered encounter with the 'Hle'lele, seed
    distribution, repeated fourth-night visits, and food offerings emptied into the
    river with prayers for rain and fertility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pau'tiwa sprinkles meal through a hatchway, kicks a twig four times with his
    left foot, lifts it, descends the ladder, and departs toward Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shits'ukia leads a procession while whirling a rhombus; the pe'kwin and Kwe'lele
    follow, and meal is sprinkled on a ladder before Pau'tiwa ascends and deposits
    te'likinawe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the northwest corner of the village, Pau'tiwa receives ha'kwani from a
    woman of the Dogwood clan, who recites a long prayer for food and raiment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three gods leave by the western road, are said to go to Ko'thluwala'wa,
    and in practical terms go to a river bend used as a greenroom; plumes are deposited
    and masks and paraphernalia are carried back under blankets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The personator of 'Cha'kwena must be a man of the Badgei clan, and pregnant
    women hasten to look upon her for safe and painless parturition.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: "'Cha'kwena descends into the He'iwa ki'wi'sine, sits by the Sa'ya'hlia, is
    visited by Kia'nakwe personators, leaves by a prescribed route, and prays for
    health, increase, game, and crops."
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The A'toshle remain in town, announce that the gods will come four times,
    scold adults, and frighten children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sa'ya'hlia whip people who seek cures for headaches and bad dreams, using
    large bunches of yucca.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At about 11 o'clock the 'Hle'lele arrive; fires and bonfires burn, people
    throw coals at them, and the 'Hle'lele call for more fire, calling the coals beautiful
    flowers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Before the gods depart after midnight, the Salimobiya bring baskets of seeds
    into each ki'wi'sine and distribute seeds that are later planted; the visits,
    dances, and seed distributions recur every fourth night until four visits have
    occurred.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Members of the Ko'tikili carry bowls of food to the road to Ko'thluwala'wa,
    pray for rain to fructify the earth, and empty the food into the river as offerings
    to Kok'ko A'wa.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the whipping, the Sa'ya'hlia leave, return at midnight, are sprinkled
    with meal by the Ko'pi"lashiwanni, and depart westward with the 'Hle'lele.
  category: sequence
  evidence_refs:
  - ev:12
