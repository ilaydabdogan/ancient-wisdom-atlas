    in practice they go to a river bend, the pe'kwin gives Pau'tiwa plumes to deposit,
    and masks and paraphernalia are brought back hidden under blankets.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:5
  type: summary
  locator: lines 7713-7811, arrival of 'Cha'kwena
  quote_or_summary: The 'Cha'kwena personator must be a man of the Badgei clan; pregnant
    women look upon her for safe painless parturition, and she descends into He'iwa
    ki'wi'sine, where accompanying gods tramp on the roof and Kia'nakwe personators
    visit her.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:6
  type: summary
  locator: lines 7713-7811, 'Cha'kwena's route and prayer
  quote_or_summary: "'Cha'kwena leaves by a prescribed route through the sacred dance
    plaza and prays for the people's good health, increase, more game, and bountiful
    crops."
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:7
  type: summary
  locator: lines 7713-7811, A'toshle and whipping
  quote_or_summary: The A'toshle, called angry gods, announce that the gods will come
    four times, scold men and women, frighten children, and the Sa'ya'hlia whip people
    seeking cures for headaches and bad dreams with large yucca bunches.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:8
  type: quote
  locator: lines 7713-7811, arrival of 'Hle'lele
  quote_or_summary: Large fires and bonfires burn when the 'Hle'lele arrive; people
    pelt them with coals, and they call, "More fire. Give us more beautiful flowers,"
    referring to coals of fire.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; short quotation from public domain text.
- id: ev:9
  type: summary
  locator: lines 7713-7811, seed distribution before departure
  quote_or_summary: Dancing continues until after midnight, the gods depart by the
    western road, and before departure the Salimobiya bring baskets of seeds into
    each ki'wi'sine and give a portion to each person; the seeds are later planted
    and are expected to yield bountifully if recipients have good hearts.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:10
  type: summary
  locator: lines 7713-7811, repeated fourth-night visits
  quote_or_summary: The Salimobiya visits, dances, and seed distributions are repeated
    at each ki'wi'sine every fourth night until four visits have been made.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:11
  type: summary
  locator: lines 7713-7811, Ko'tikili food offerings
  quote_or_summary: Each Ko'tikili member carries a bowl of food toward the road to
    Ko'thluwala'wa, prays that the gods bless the A'shiwi with rain to fructify the
    earth, and empties the food into the river as offerings to Kok'ko A'wa, all the
    gods.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary used.
- id: ev:12
  type: summary
  locator: lines 7713-7811, final Sa'ya'hlia departure
  quote_or_summary: After the whipping, the Sa'ya'hlia leave, return at midnight,
    are sprinkled with meal by the Ko'pi"lashiwanni, and depart over the western road
    with the 'Hle'lele.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
