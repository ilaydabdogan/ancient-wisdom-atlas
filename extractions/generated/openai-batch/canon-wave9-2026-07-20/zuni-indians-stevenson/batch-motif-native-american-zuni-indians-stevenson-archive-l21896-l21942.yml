canonical_text:
  quote: "“a cross, signifying the four regions, and a circle, the world symbol”"
  summary: A witchcraft accusation is being tried in a room where the accused youth
    is guarded and the afflicted girl lies on a pallet. A Galaxy fraternity theurgist
    prepares sacred meal, a mi'li, a crystal, water, medicine, fetishes, and symbolic
    forms on the medicine water; he invokes gods of the six regions, performs directional
    purification with ashes and eagle plumes, applies medicine water to the patient,
    and pretends to draw material from her heart before covering it with meal.
  language: English
  quote_policy: quoted
