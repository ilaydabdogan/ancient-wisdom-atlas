canonical_text:
  quote: ''
  summary: 'The passage describes closing actions in a Zuñi rain ceremony: a Badger
    clan man carries fire, corn, and plume offerings to a spring; ritual participants
    dance, play flutes, whirl rhombi, handle baskets, receive medicine water, and
    pray for rain; meal and offerings are deposited in river and fields; and flutists
    make offerings at a remote shrine dedicated to Pa''yatiimu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A single log remains from the fire that burned through the night, and a Badger
    clan man lights a cedar stick from it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Badger clan man carries the burning cedar, four tied ears of corn, and
    te'likinawe to a spring north of the ruin Ma'sakia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sho'ko'we choir sings an instruction to go with the fire and plant the
    plume offerings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Badger clan man excavates a hole, deposits te'likinawe, prays to gods
    and clan ancients for rain for Earth Mother, and returns with the corn and remaining
    cedar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: When sunlight falls on the cloud symbol, the mi'wachi and lines of te'likinawe
    fall over at the command of the man of the Frog clan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants place baskets on their heads, the Shi'wanni of the West sprinkles
    them with meal, and dancers and musicians continue coordinated movement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Flutists form a line facing east, elder and younger brother Bow priests stand
    at the line ends and whirl rhombi, and the flutists pray aloud.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kla'kwemosi administers medicine water from a medicine bowl with a shell
    to officials, participants, women, and spectators.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Recipients eject the medicine water on their hands and rub it over their bodies
    for physical purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pe'kwin stands west of the cloud symbol facing east and closes the ritual
    with long prayers for rain to fructify the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man of the Frog clan gathers meal from the cloud symbol in his blanket
    and deposits it in the river to be carried to Ko'thlmvala'wa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ritual corn is kept separate from other household corn for planting in the
    coming year, and each woman plants her te'likinawe in the field.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The pe'kwin and named companions deposit te'likinawe in fields north, west,
