    of each direction to water the fields.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: At this season the flutists make offerings at a seldom-visited shrine dedicated
    to Pa'yatiimu in the south wall of a mesa east of Zuni.
  category: action
  evidence_refs:
  - ev:7
