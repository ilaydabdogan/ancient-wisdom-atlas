canonical_text:
  quote: ''
  summary: The passage describes the Kok'ko 'hlan'na order, its associated gods and
    eastern dwelling place, the illness condition under which the order is joined,
    a Zuni story about a contest of medicines between Kok'ko 'hlan'na and Shumai'koli,
    and the procedure by which a person accepts invitation into the order with a meal
    gift unless already a member of another order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The order is known as Kok''ko ''hlan''na, glossed in the passage as Great
    God, and has three gods associated with it: Kok''ko ''hlan''na, Shits''ukia, and
    Kwe''lele.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The associated gods are said to live in the east near Shi'papolima, described
    as the home of Po'shaiyiiuki, the Zuni culture hero.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The order can be joined only when the gods are summoned to the village by
    an illness that produces swelling of a body part, and they are called only after
    other attempts at cure have failed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage introduces the following narrative as a story implicitly believed
    by the Zunis.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the story, Shumai'koli travels from west to east and meets Kok'ko 'hlan'na.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kok'ko 'hlan'na says he has medicine that will quickly kill a man if put on
    him, and Shumai'koli tells him to try it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kok'ko 'hlan'na rubs his medicine over Shumai'koli, whose body swells all
    over; after four or five days Shumai'koli says he is almost dead and asks that
    the medicine be removed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shumai'koli then covers Kok'ko 'hlan'na with his medicine, causing his legs,
    arms, and body to twist like ropes until he asks for the medicine to be removed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the medicines are removed, Kok'ko 'hlan'na shakes hands with Shumai'koli,
    says Shumai'koli's medicine is better, calls him elder brother, and invites him
    to his house.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a member wishes another person to join the order, acceptance is marked
    by the invited person carrying meal wrapped in a corn husk to the member, who
    becomes the novice's fraternity father; the meal gift is unnecessary if the novice
    already belongs to another order of the fraternity.
  category: action
  evidence_refs:
  - ev:7
