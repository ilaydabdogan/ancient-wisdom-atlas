canonical_text:
  quote: ''
  summary: 'The passage describes part of a Shúmaakwe ceremonial sequence: a firebrand
    melee, prayers before an altar, planting and dancing around a feather-adorned
    tree, plaza appearances of Shumai''koli and Sai''apa with charm-bearers, and the
    collection and chamber arrangement of medicinal plants and ritual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants engage in a fire display in which husks and cedar brands are
    ignited, sparks are showered among male and female members, clubs are thrown upward,
    and the dancers' cries drown other sounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An aged woman reacts to the fire display by touching the writer and exclaiming
    approval.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shumai'koli of the Nadir leaves the floor soon after the fire display
    begins, while the Sai'apa remain on the floor until the end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tree is removed through the lower door, prayers are offered before the altar
    after the fire fight, and the feather-adorned tree is planted in the center of
    Si'aa' te'wita before dances around it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Youths and maidens are appointed to procure dancers from the town, with youths
    choosing women and girls choosing men; the youths are designated a'mosi or directors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dancers usually form two concentric circles; the drummer sits east of the
    tree and uses a hide-covered wooden drum.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Six Shumai'koli appear in the plaza and dance, attended by two Sai'apa; each
    Shumai'koli is accompanied by a charm-bearer who waves and manipulates a charm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sai'apa climb the tree, run up ladders to houses, beg for melons and bread,
    deposit the food beside the tree, and return at intervals to the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At sunset, two Shumai'koli gods and the Sai'apa depart over the eastern road,
    with one Sai'apa whirling a rhombus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The day before the ceremony is spent collecting medicinal plants, including
    a pungent water-cress-like plant gathered at the base of the mesa north of Twin
    Mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the ceremonial chamber, a tablet altar is erected; six mi'wachi stand on
    a cloud symbol of white meal, with a mi'li, meal baskets, medicine bowls, plant
    heaps, and squash blossoms also present.
  category: setting
  evidence_refs:
  - ev:6
