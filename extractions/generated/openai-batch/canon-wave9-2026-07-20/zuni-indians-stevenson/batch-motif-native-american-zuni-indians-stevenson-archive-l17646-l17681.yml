canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi mortuary procedures for preparing remains:
    wrapping the body in a blanket, placing clothing beside it, washing and decorating
    the face, adding a cotton hood, family prayer and meal sprinkling, carrying the
    body to the grave, cutting blanket knots so the spirit may pass out, post-removal
    washing of family members, and delayed burial of belongings and prayer plumes
    because of the lateness of the hour and the Sun Father''s passage over the road
    of day.'
  language: English
  quote_policy: summarized
