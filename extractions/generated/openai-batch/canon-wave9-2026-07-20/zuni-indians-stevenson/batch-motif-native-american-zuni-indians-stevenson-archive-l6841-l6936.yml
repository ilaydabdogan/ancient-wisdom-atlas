canonical_text:
  quote: ''
  summary: 'The passage describes household and fraternity preparations during a Zuñi
    ceremonial context: a Hopi resident prepares feather-and-pine prayer offerings;
    household offerings are set aside; women perform required ablutions before attending
    fraternity rites; members of the Chu''pawa ki''wit''sine assemble; and at midnight
    a calendar-related rite is conducted around baskets of te''likinawe, sacred meal
    crosses, medicine plants, and stone animal fetishes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Hopi resident makes a la'showanne for each person present from two fluffy
    eagle plumes and two pine needles, presents it with prayers for rain, crops, health,
    and long life, and it is tied to hair on the left side near the crown.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baskets containing prepared offerings are deposited on a north ledge, and
    the passage states that children never touch or disturb such objects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The household supper contains no animal food before the mother and elder daughter
    begin ablutions for their fraternity attendance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each woman bathes the whole body before a large bowl of water; the passage
    states that failure to bathe during a ceremonial would offend the Beast Gods,
    who would punish the offender.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pe'kwin arrives with members of the Chu'pawa ki'wit'sine and arranges
    te'likinawe into groups, wrapping their bases with corn husks and placing them
    in a flat basket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The elder daughter dresses for her fraternity with necklaces and carries her
    infant nephew on her back; the younger sister fills a pottery basket with sacred
    meal and returns it to a niche in the south wall.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At midnight the assembled members hold a ceremonial related to the calendar;
    chairs are removed, the floor is swept, and the participants sit in a broken circle
    near the fireplace.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shi'wanni of the Kia'nakwe is the central figure, sits raised on a wadded
    blanket over a low box, faces east, and has baskets, medicine plants, and medicine
    bags placed before him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The shi'wanni transfers te'likinawe into a larger basket and arranges them
    so that feather ends radiate and attached la'showawe fringe the basket edge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The shi'wanni makes crosses of meal south of the basket and in its center,
    then places a yellow stone cougar with black mouth, tail, and feet on the southern
    cross.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The shi'wanni removes stone fetishes from medicine bags one by one; prey-animal
    fetishes are placed with heads to the east, and animal fetishes carry arrow points
    tied on with strings of precious beads.
  category: object
  evidence_refs:
  - ev:10
