canonical_text:
  quote: ''
  summary: The passage describes how Zuñi field labor is organized through fraternity,
    household, and clan relationships; how laborers are fed after field work; when
    ki'wi'sine people are called upon for labor connected with hosting a Sha'lako;
    and how corn and bean colors are cultivated to correspond with six regions. An
    inserted note mentions a surviving stone doorway owned by an aged theurgist and
    laments the loss of ancient architectural objects.
  language: English
  quote_policy: summarized
