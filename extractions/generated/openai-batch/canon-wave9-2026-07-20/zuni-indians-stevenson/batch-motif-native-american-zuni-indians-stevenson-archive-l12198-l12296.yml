  quote: ''
  summary: The passage describes preparations for a Kia'nakwe ceremonial, including
    secret mask preparation, archaic Sia-language songs, assembly south of Zuñi, body
    painting, dressing in sacred blankets and masks, and a procession toward the village.
    It details the clothing, masks, rattles, corn, bows, arrows, feathers, colors,
    and regional distinctions of leaders, warriors, and captive figures such as Ko'thlama,
    Sa'ya'hlia, and It'sepasha.
  language: English
  quote_policy: summarized
