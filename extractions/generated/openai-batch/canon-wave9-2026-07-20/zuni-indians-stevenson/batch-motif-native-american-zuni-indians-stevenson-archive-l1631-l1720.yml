canonical_text:
  quote: '"There is the altar of my fraternity."'
  summary: The passage identifies pictographs on an inner chamber wall at Han"lipinkia.
    A rain priest who belongs to the Shi'wannakwe fraternity recognizes one altar
    etching as belonging to his fraternity. The text states that the etchings support
    the pre-Spanish existence of Zuni tablet altars and reject derivation from Roman
    Catholic altars. It also reports Zuni belief that water markings are footprints
    of dancers at Han"lipinkia, and describes the discovery, documentation, removal,
    and museum deposition of a sun shrine with many fetishes.
