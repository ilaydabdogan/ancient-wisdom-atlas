canonical_text:
  quote: ''
  summary: The passage describes several Zuñi games, including a circle-catching game
    played by Ko'yemshi and the Galaxy fraternity, a jumping game accompanied by songs
    about youths, birth, hunting, and rain, and several stone, stave, and disk games
    with circular or geometric boards and killing or winning rules.
  language: English with Zuñi terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ya'chuni sa'wanni is described as a game played in the sacred dance court
    by the Ko'yemshi and the Galaxy fraternity between dances.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Ya'chuni sa'wanni, a circle of men with clasped hands surrounds one person
    in the middle, who tries to catch one of the others as they jump around.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a player is caught in Ya'chuni sa'wanni, he takes the middle position
    and the previous middle player leaves the game.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The last two players in Ya'chuni sa'wanni hop on one foot; the remaining player
    must hop to the group before putting the other foot down in order to win.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The song accompanying Ya'chuni sa'wanni consists of repeated words that the
    Zuñi are said not to understand and believe came from the Ko'yemshi gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: In Kiash'tuwiwi, two files of men hold each other around the waist while the
    leaders clasp hands, and the group jumps about the plaza.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At times in Kiash'tuwiwi the men separate into opposing lines, clasp hands,
    and jump back and forth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The leaders' songs in Kiash'tuwiwi tell stories of youths of old and include
    how their fathers fell in love with their mothers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: One sung youth receives a bow and arrow reeds from his grandfather, hunts
    deer near a cornfield, and is delayed from cooking meat by heavy rains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Another sung youth describes seeing light and a road out of his mother's womb,
    after which his family rejoices over his birth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The second sung youth also receives a bow and arrows from his grandfather,
    kills deer near a cornfield, and torrential rain waters the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: The chorus of Kiash'tuwiwi is said to compare the rupture of the membranes
    to violent rains that cause springs to flow through holes in rocks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Ta'sholwe uses three staves colored red or black on one side and white or
    uncolored on the other, forty small stones, a stone disk, and straws or slender
    strips of wood.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: In Ta'sholwe, the stones are arranged in a circle broken into four segments
    with a disk in the center, and thrown staves determine how far markers move.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: In Ta'sholwe, markers move in opposite directions; when markers meet, the
    last player is said to be killed and must restart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The first Ta'sholwe player to go around the circle wins only if the count
    reaches the doorway, or spring, rather than going beyond the starting point.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Tan'kalawe is described as similar to quoits, played by boys and elders, with
    stakes placed on a corncob or planted stone and a stone disk thrown by the players.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Awef'jaknawe uses small flat stones with differently colored sides and a slab
    or ground board with geometrical markings.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: In Awef'jaknawe, stones are placed on intersections except the center; the
    first player moves to the center and is jumped by the opponent.
  category: action
  evidence_refs:
  - ev:7
