canonical_text:
  quote: ''
  summary: 'The passage describes ritual materials and hunting-related practices of
    the ''San''iakiakwe or Hunters fraternity: an initiation painting, altars, songs,
    chamber wall images of predators and game, hunting fetishes, sacred shooting targets,
    and a procedure for trapping and smothering deer for ceremonial masks or fetishes
    with prayer offerings and thanksgiving.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The initiation painting for the order is a white disk bordered by two black
    concentric circles blocked in white, identified as symbolic of the house of the
    clouds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disk painting has a spread eagle in the center, is surrounded by game,
    and has groups of corn grains scattered over its surface.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity has a tablet altar similar to those of other fraternities and
    a second altar capped with eagle tail plumes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Songs of the order ask gods for power over game in hunting, give thanks after
    game is captured, and address animals and birds that prey on game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremonial chamber extends north and south, and during a ceremony the
    tablet altar is set up at the north end of the room.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Permanent wall pictures show cougar, gray wolf, lynx, and coyote chasing elk,
    mountain sheep, deer, jack rabbits, and cottontail rabbits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bear is stated to have no part in the 'San'iakiakwe because it lives principally
    on vegetable food, although it will eat flesh.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Several birds are represented as killing deer or other game by pecking, striking
    with the beak, or similar predatory action.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The hunting fetish belongs to an individual hunter and passes from father
    to son rather than belonging to a clan or fraternity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Hunters carry fetishes of larger animals for large game, an eagle fetish for
    rabbits and other small game, and a shrew as protection from rodents destructive
    to corn and vegetation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: For large game, the hunter carries an owl wing feather, takes it into his
    mouth when game is found, spits toward the game, and advances slowly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: To ensure hunting success, arrows are shot into a vertical fissure on Corn
    Mountain, and passing hunters shoot at a sacred deer pictograph on a mesa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The deer pictograph is said by the Zuñis to have been made by their ancestors
    during migrations from the far northwest when the world was new.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: When skins are needed for ceremonial masks or fetishes, game must be smothered
    rather than shot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: 'A deer drive and pit traps are constructed, and each huntsman deposits five
    prayer plumes in each trap: three for Kok''ko A''wan and two for ancestors.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Two huntsmen wear painted shirts and deer head skins and imitate deer as closely
    as possible, including browsing.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:17
  text: If a trapped deer is not killed by the fall, men smother it by pressing its
    nostrils while offering a prayer to A'wohawil'ona.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The translated prayer gives thanks for rains, seeds, and the mysteries of
    life, described as inhaling the sacred breath of life.
  category: speech
  evidence_refs:
  - ev:8
