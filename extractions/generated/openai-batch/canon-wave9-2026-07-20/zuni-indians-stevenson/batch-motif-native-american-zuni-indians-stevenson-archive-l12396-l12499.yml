canonical_text:
  quote: ''
  summary: The passage describes a Zuñi crop-thanksgiving ceremonial sequence involving
    priestly calls and responses, masked dancers moving between the ki'wi'sine, houses,
    plaza, and other ritual locations, head washing by twelve Corn clan women, communal
    feasting after a fast, food packages carried in an outdoor dance and later deposited
    in the river, distribution of corn for planting, a priestly litany, and the collection
    and preparation of game, corn, melons, birds, plumes, and other offerings for
    ritual authorities and later use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The priest and pe'kwin exchange repeated ritual cries, bend their knees, and
    coordinate with the dancers' voices and rattles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dancers form in file, change orientation between north and east, and the
    priest and pe'kwin walk stiff-kneed back and forth, bowing when they meet midway.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After dancing in the ki'wi'sine, the Kia'nakwe visit the house of Awan ta"chu
    Ko'yemshi and dance there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At daylight the masks are brought from an inner room and placed on a prepared
    hanging shelf.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sunrise the Kia'nakwe don paraphernalia and dance before the priest's dwelling
    and in the west-side plaza, then return to the ki'wi'sine, remove masks, and smoke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The circuit of dancing at different points and around the village is repeated
    four times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Twelve Corn clan women assemble in the ki'wi'sine and wash the priest's and
    other Kia'nakwe heads with yucca suds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An ear of corn is rubbed on the top of the priest's head four times during
    the washing ceremony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wives and daughters of the personators carry bowls of food and coffee to the
    ki'wi'sine entrance after first washing their heads.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The feast follows a fast maintained by the personators of the gods since the
    previous evening.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After eating, each man gathers portions from each bowl onto wafer bread, folds
    and ties the package with yucca, carries it in the left hand during the outdoor
    dance, and later deposits it in the river for the Kia'nakwe.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A Chu'pakwe fills an Apache basket with multicolored corn and gives each of
    the twelve Corn clan women about a pint of corn for planting the coming year.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Before the Corn clan women leave, the priest stands in the middle of the room
    holding te'likinane and recites a litany, while others make responses.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: During dancing at Si'aa' te'wita, contributions for the first body of A'shiwanni
    are brought into the ki'wi'sine in blankets and through the hatchway.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Offerings include deer, antelope, corn, watermelons, birds, light bread, dried
    deer meat, seeds, skins, feathers, and pieces of calico.
  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: Bird plumes are identified as materials used by the A'shiwanni for te'likinawe
    deposited at the winter solstice so that food may be abundant the coming year.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:17
  text: Unflayed game and skins are sewn with yucca threads, and completed packages
    are carried to the ceremonial house of the keeper of the Whlan'na.
  category: action
  evidence_refs:
  - ev:17
