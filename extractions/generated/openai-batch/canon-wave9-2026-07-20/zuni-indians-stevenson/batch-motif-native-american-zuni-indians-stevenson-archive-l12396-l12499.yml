candidate_motifs:
- id: motif:1
  label: thanksgiving rite for crops through procession, dance, feast, and offerings
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The passage identifies a crop-thanksgiving context and describes repeated
    village dances, fasting followed by feasting, offerings, corn for next year's
    planting, and winter-solstice deposits intended for future food abundance.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:12
  - ev:14
  - ev:16
  confidence: high
  cautions: The passage is ethnographic description of a specific ceremony; broader
    comparative placement should not be assumed beyond the explicit agricultural and
    offering cycle.
- id: motif:2
  label: ritual washing and corn contact before renewal of planting
  taxonomy_refs:
  - seasonal_cycle
  basis: Twelve Corn clan women wash the ritual participants, rub corn on the priest's
    head, and later receive corn to plant the coming year.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  confidence: medium
  cautions: The passage does not explain the meaning of the washing or corn rubbing;
    the renewal reading is limited to the observed sequence and planting reference.
- id: motif:3
  label: ritual deposit of prepared food in water for sacred recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Each man prepares a food package from the feast, carries it during the outdoor
