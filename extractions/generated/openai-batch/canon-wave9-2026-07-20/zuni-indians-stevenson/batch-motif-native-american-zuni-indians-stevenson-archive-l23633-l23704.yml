canonical_text:
  quote: ''
  summary: The passage describes a Ne'wekwe ritual sequence involving preparation
    of plume offerings with grass, a white-meal and black-pigment floor design for
    an initiation, tobacco smoke blown through feathers, consecration and sprinkling
    of medicine water, joking interludes during the rite, ritual song terms naming
    fish, and all-night healing ceremonies ending at sunrise when Kok'ko 'hlan'na
    administers medicine to novices.
  language: English
  quote_policy: summarized
