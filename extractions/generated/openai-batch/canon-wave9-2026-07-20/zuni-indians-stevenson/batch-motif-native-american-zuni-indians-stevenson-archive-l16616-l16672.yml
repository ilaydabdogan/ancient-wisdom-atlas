canonical_text:
  quote: ''
  summary: The passage describes observed Zuni childbirth and postpartum medical conditions,
    practitioners, and treatments, including perineal laceration, breast abscess treatment
    with Datura and surgery, uterine trouble treated by male theurgists or surgeons,
    nursing soon after birth, teas made from juniper or corn smut for labor and hemorrhage,
    and a brief comparison stating that Sia childbirth ceremonies are more elaborate
    than Zuni ones. It ends with the start of a typical labor case involving a young
    wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perineal laceration is described as frequent and as a natural result of the
    childbirth method practiced by the Zunis; three labor cases observed in 1896-97
    included laceration.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: High fever is said to be apt at such times, while milk leg is rare and breast
    abscess is not uncommon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When doctresses fail to bring relief, a surgeon is called.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the only breast operation observed by the writer, Nai'uchi administered
    Datura stramonium before using a lancet, removed pus, applied powdered medicine,
    and bound a cloth over the wound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The patient returned to consciousness gradually, later reported knowing nothing
    of the operation, reported beautiful dreams, and the breast was healed in a week.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The writer reports not discovering blindness after confinement among any Indian
    tribe and not knowing a woman to suffer convulsions before or after confinement.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Zuni women sometimes suffer uterine trouble after bearing children; in some
    observed cases the uterus had protruded and a surgeon was called to replace it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Only two or three theurgists, described as men, undertake uterine replacement
    cases; Nai'uchi is named as the principal practitioner for such troubles.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The child is placed to the breast within ten hours after birth, with efforts
    made to make it draw milk.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A hot tea made from toasted juniper twigs and berries steeped in boiling water
    is drunk during labor to relax the system and afterward to induce lochial discharge.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: It is believed that if the juniper tea is drunk earlier in pregnancy, the
    child would be very dark.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hemorrhage is treated with a tea made by pouring boiling water over corn smut
    fungus, which the passage compares in effect to ergot.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that childbirth ceremonies of the Sia tribe are much more
    elaborate than those of the Zunis.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A typical labor case began at midnight on October 20, 1896, involving a child
    wife not more than fifteen years old who showed signs of approaching parturition
    and labored until six o'clock the following evening, where the excerpt breaks
    off.
  category: sequence
  evidence_refs:
  - ev:11
