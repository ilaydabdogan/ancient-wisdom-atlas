canonical_text:
  quote: ''
  summary: 'The passage describes parts of the Shu''maa''kwe ceremonial sequence:
    songs identified as Pima rather than Zuni; plume dancing with an acting Great
    Mother; ash sprinkling, sacred breath, bodily rubbing, yucca-suds washing, repeated
    grinding, feasting, medicine distribution and administration; a plaza dance around
    a planted tree where Sai''apa place bread and compel participation; and a final
    scene in which Sai''apa with flaming cedar brands awaken sleeping Shumai''koli
    and carry them toward Chi''pia.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer reports that the Shu'maa'kwe songs were not in the Zuni tongue
    but in Pima, and that fraternity officers were annoyed by the discovery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A passage note links the fraternity's origin question with an association
    with the Pimas and cites Friar Marcos de Niza's report of an old Cibolan Indian
    among the Pimas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women dance in paired formation using plumes; an acting Great Mother
    follows alone with an eagle plume.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dancers move around the room in an ellipse from west to east, with arms
    extended in time with song, drum, and rattles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunset the a'kwamosi sprinkles dancers four times with ashes taken from
    the altar, throws ashes out of the door, and all inhale a sacred breath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explicitly states that the sprinkling of ashes is for physical
    purification.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Male dancers rub perspiration from their own bodies over the faces, arms,
    lower legs, and backs of their female partners, while avoiding touching their
    breasts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At sunset grinders stand in a north-south line facing east; women facing them
    wash each grinder's forelock and hands with yucca suds while the a'kwamosi stands
    behind each grinder with hands on her shoulders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The grinding ceremonies are repeated on later days, and after field work the
    male fraternity members are feasted by the director's wife and family, with female
    fraternity members assisting and then eating with the women of the household.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the seventh day, cornhusk packages containing sun-dried cakes of freshly
    prepared medicine are given to invited participating grinders and dancers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: During night dances, men rub medicine on partners' arms and legs to relieve
    fatigue and give strength; at midnight medicine water is administered to all.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The following morning a tree is planted in the center of Si'aa' te'wita, gods
    appear in the plaza, and dancers form concentric circles around the tree.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Sai'apa compel rooftop spectators to join the dance and collect loaves
    of bread that they place in the tree, including its upper forks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At sunset the dance circles stop while all inhale the sacred breath of A'wonawil'ona;
    the dance continues until dusk and the ceremonial ends.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Shumai'koli precede the Sai'apa over the eastern road and sleep at Shu'minkla;
    the Sai'apa follow with flaming cedar brands, wake them, and carry them to Chi'pia,
    described as the place from which they came.
  category: sequence
  evidence_refs:
  - ev:10
