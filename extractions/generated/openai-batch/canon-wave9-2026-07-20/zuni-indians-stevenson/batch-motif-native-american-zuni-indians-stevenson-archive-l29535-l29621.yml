comparison_claims:
- id: claim:1
  claim: The passage supports a cautious linguistic and traditional linkage between
    the Shu'maa'kwe ceremonial songs and Pima contexts, because it reports that the
    songs are in Pima rather than Zuni and notes the fraternity's association with
    the Pimas.
  claim_level: linguistic_similarity
  target: Pima language/tradition in relation to the Shu'maa'kwe fraternity
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide song texts, explain the fraternity's origin,
    or demonstrate a specific historical transmission route; the Niza/Cibola/Zuni
    connection is explicitly conditional.
