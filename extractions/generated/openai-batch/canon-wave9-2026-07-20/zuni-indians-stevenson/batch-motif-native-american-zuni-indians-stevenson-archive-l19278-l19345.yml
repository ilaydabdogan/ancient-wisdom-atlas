canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi pueblo house building: terraced stone-and-adobe
    houses clustered around plazas, social placement of residents by house level,
    gendered construction work, roof-making, water carrying for mortar, entrances
    through doors and roof hatchways, older round stone doorways, interior connections,
    selenite light openings, chimneys made from reused cooking vessels, and plastering
    and whitewashing methods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pueblo is described as a terraced mass of houses built one upon another,
    with one roof forming the floor or yard of the dwelling above; some cases reach
    five tiers, though few houses are over two stories.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage associates lower houses with wealth and official position, intermediate
    houses with more modest means, and uppermost stories with poorer families.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The houses are said to be built of stone and adobe and clustered around three
    plazas, with a fourth plaza on the west side, three covered ways, and several
    streets.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women are described as especially delighting in house building through plastering,
    which they regard as their prerogative; men lay foundations, build walls, and
    place roof beams.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Roof construction is described as a sequence of large logs, cross-laid willow
    boughs, brush, and an earth covering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Little girls assist by carrying water from the river in small water vases
    on their heads for mixing mortar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The houses have outer doors and roof hatchways through which ladders pass,
    serving as additional entrances.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some older entrances are described as circular openings in thick round stone
    slabs, just large enough for a person to pass through horizontally, closed with
    round stone slabs held by strong pole props.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Interior doors allow much of the older village to communicate internally without
    passing outside the communal structure.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Small wall openings admit light and are filled with irregular pieces of selenite.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chimneys are made from perforated cooking utensils stacked and cemented together;
    worn-out cooking pots are stored for later chimney use.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Exterior and interior walls are covered with reddish-brown earth-and-water
    plaster applied by hand in semicircles; inner walls are whitened with boiled white
    clay applied using a rabbit-skin glove.
  category: action
  evidence_refs:
  - ev:11
