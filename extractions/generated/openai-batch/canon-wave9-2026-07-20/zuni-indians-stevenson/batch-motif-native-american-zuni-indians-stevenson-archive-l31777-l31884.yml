canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi war-related ceremonial sequence after scalping:
    a dance of rejoicing, prayers to the Gods of War, fasting and behavioral restrictions
    for the victor and associated men, nightly songs with war clubs, preparation and
    deposition of prayer plumes, fifth-day actions involving the scalp pole and the
    making of war regalia, the ritual bathing of the victor, and the organization
    of ancient choir songs with drums for the two Gods of War.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young children are brought by their mothers to a dance and song of rejoicing
    connected with destruction of the enemy, and prayers are offered to the Gods of
    War to give enemy lives to the Zuñis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victor is required to avoid animal food, grease, salt, hot food, sexual
    relations, smoking, touch by others, and receiving things directly from others
    for specified periods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The victor, his elder brother, and the scalp-kickers avoid the fireplace,
    keep their clothing on through four nights, and remain under rules whose violation
    is said to result in death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the first four nights, the victor, elder brother, and two scalp-kickers
    stay in the ceremonial chamber, apart from women and without speaking to them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warriors assemble nightly, sing, and brandish the war club, with the victor
    joining in the songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some informants say the original war clubs were thrown from the heavens by
    Mo'yiichun 'hlan'na, described as Great Star and warrior of the heavens.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The victor and members of the Bow priesthood prepare eight prayer plumes as
    offerings to the Gods of War; the plumes are paired and deposited on ant-hills
    at the four cardinal points, with similar offerings repeated later.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the fifth day, the elder brother stands by the scalp pole for six consecutive
    hours and later brings meat and melons to the plaza.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder brother makes a buckskin war pouch from material said originally
    to come from enemy apparel; added braids and arrow points mark further scalps
    until eight arrow points represent the highest honors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A twisted wristlet of buckskin thongs with olive shells and a perforated buckskin
    skullcap with hawk plumes are described as badges of office.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the fifth morning the scalp-kicker and his aid bathe the victor’s entire
    body and wash his blood-stained hands for the first time since the scalping, using
    cold water and keeping him away from fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At noon on the fifth day, eight singers form two choirs in the Bow ceremonial
    chamber, one for the elder God of War at the east end and one for the younger
    God of War at the west end.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each choir has an archaic pottery drum and hooped drumstick; one drumstick
    bears a zigzag line denoting lightning, and the songs are described as ancient
    and not to be changed.
  category: object
  evidence_refs:
  - ev:7
