canonical_text:
  quote: ''
  summary: The passage gives an origin account and ceremonial description for the
    Arrow order of the Great Fire fraternity. A white arrow point falls into the ceremonial
    chamber and is interpreted as a gift from A'chiyala'topa, leading the director
    to swallow an arrow and initiate others. It then describes reed offerings, prayers
    for rain and food, placement of the reed in a tree on O'pompia mountain, and the
    washing, painting, adornment, and arrow-handling of male participants and a novice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white arrow point falls through the hatchway into the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The director of the Great Fire fraternity examines the arrow point, gives
    thanks for it, and states that A'chiyala'topa must have dropped it to prompt the
    institution of an arrow order.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director attaches the arrow point to a reed shaft and succeeds on the
    fourth attempt in running the arrow down his throat to his heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The director initiates others into arrow swallowing, and the passage states
    that only men belong to the order.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The Arrow ceremony occurs every fourth year in February and is connected with
    either the spruce tree ceremony or the Navaho dance; it is combined with sword
    swallowing and is synchronous with the sword or tree ceremonial of the 'Hle'wekwe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the fourth day of the winter solstice festival, the warrior prepares a
    reed with raw cotton, corn pollen, red coloring, white cotton ends, plumes, a
    bead, and a corn husk wrapping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Hlem'mosona and then other officers and male participants hold the reed
    and repeat prayers requesting rain, corn, horses, animal food, other food, and
    clothing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The warrior takes the reed to O'pompia mountain, reaches a shrine dedicated
    to the younger God of War, climbs a tall tree, and attaches the reed to its topmost
    limb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the tree, the warrior prays to the spirit of the tree to intercede with
    the rain-makers for cold rains and snows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each member of the Arrow order makes three prayer plumes to Na'ke'e, retaining
    two and giving one to a director appointed to collect young piñon and spruce trees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At sunrise on the fifth morning, the men and the novice wash their heads;
    the men arrange one another's hair because no woman can come in or touch them.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Participants wear yucca, eagle plumes, body paint, serpentine lightning lines,
    face paint, hawk down, micaceous hematite, a breechcloth, and rattles.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Each participant receives an arrow from the Hlem'mosona, sprinkles the altar
    with meal, passes around the altar by the south side, and takes position on the
    north side of the room.
  category: sequence
  evidence_refs:
  - ev:9
