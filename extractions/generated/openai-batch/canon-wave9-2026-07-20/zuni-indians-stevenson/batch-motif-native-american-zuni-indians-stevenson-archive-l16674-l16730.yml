canonical_text:
  quote: ''
  summary: 'Ethnographic account of a difficult childbirth in a mother-in-law''s house:
    relatives observe anxiously, doctresses use manual and breath-related treatments,
    officers of the Great Fire fraternity are sought to sing songs to the Beast Gods
    for delayed delivery, a male child is born, the umbilical cord and placenta are
    handled ritually, the placenta is placed in the river with a fertility prayer,
    and the mother bites a white pebble so the child''s teeth will be strong and white.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The laboring girl was confined in her mother-in-law's house, wore a cainis
    and heavy blanket, and lay on sheepskins near the south end of the room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother-in-law was a doctress but did not take a professional part in the
    treatment; she sat beside the girl without assisting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two grandmothers were present and concerned; the father, father-in-law, and
    paternal uncle were in an interior room, anxious and whispering; the husband was
    absent at his farm.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the pains increased, two summoned doctresses kneaded the abdomen, pressed
    the patient's back, and the patient grasped a doctress's belt while pressing her
    feet against a ledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During prolonged labor, a doctress held the patient's nostrils and blew into
    her mouth; the passage says this treatment was supposed to force the child into
    the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Juniper tea was frequently drunk, and the patient sometimes stood over the
    urinal earlier in the day.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: For delayed delivery, the Great Fire fraternity is described as having four
    songs addressed to the Beast Gods; singing stops if the child is born after a
    song, and the songs are not repeated if birth does not follow the fourth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mother-in-law supplied mutton, cotton, and calico as advance payment to
    the theurgists, who returned just as a male child was being delivered and then
    departed with the medicine of the Beast Gods and their rattles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the child's head appeared, the girl was turned onto her back; two women
    held her knees while a doctress assisted the birth by pressing the sides of the
    infant's head, shaking it slightly, and pulling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Another doctress cut the umbilical cord with a steel knife, and cotton cord
    was wrapped around the cord near the umbilicus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The abdomen was manipulated until the placenta passed; it was placed in a
    bowl and carried out by the girl's maternal grandmother.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: The maternal grandmother deposited the placenta in the river with a prayer
    that the young mother might have many children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: While the placenta rite occurred, the mother bit a white pebble so that the
    child's teeth might be strong and white.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A footnote states that each doctress present at childbirth aims to bring the
    child into the world so that, if the child is a boy, he will enter the kiwisin
    of her husband.
  category: relationship
  evidence_refs:
  - ev:6
