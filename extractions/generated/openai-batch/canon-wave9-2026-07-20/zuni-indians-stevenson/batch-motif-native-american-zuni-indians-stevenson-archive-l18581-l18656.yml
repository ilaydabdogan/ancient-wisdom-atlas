canonical_text:
  quote: ''
  summary: A ritual sequence before a game is described. The leader prays to war gods,
    rain-makers, celestial powers, and A'wonawil'ona for success, long life, rain,
    crops, food, and livestock, and for the opposing side to have bad luck. A mixture
    of water and powdered te'na'sali is prepared and applied to ears and under eyes
    to enable perception of unusual sights and sounds. Watchers carry corn-husk offerings
    to a shrine of A'hayuta and to places outside the village, where they deposit
    offerings to deceased players and listen for omens. Later the leader distributes
    packages and wafer bread, sends offerings to the rat man, and visits the rain
    priest, who receives offerings and sings to rain priests of the four regions for
    rain, seeds, good things, and long life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The leader's prayer addresses the Gods of War, rain-makers, the sun, moon,
    stars, and A'wonawil'ona, asking for success in the game, long life, bad luck
    for the other side, rain, crops, food, horses, and sheep.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buckskin sack of te'na'sali is opened, a corn husk is placed beside it,
    and the leader mixes water with powdered plant material in the husk using the
    tip of banded gypsum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a rain priest is present, he applies the mixture with a stone to the leader's
    left ear, across the face under the eyes, and to the right ear; the leader repeats
    the act with the rain priest and the rest of the group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The application of te'na'sali to ears and under eyes is explicitly said to
    ensure seeing and hearing unusual or mysterious things and sounds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The leader gives a corn-husk package containing a cigarette to the first watcher
    and instructs him to go to the eastern shrine of the elder God of War and ask
    him to come.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the shrine the watcher opens the husk, deposits offerings, prays to A'hayuta
    to come to the plaza for the next day's game, sprinkles a line of meal as a road
    for the god, and tells A'hayuta to wait there until the players come.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The other three watchers may choose a cardinal point but must keep together;
    they carry corn-husk packages, go about two miles from the village, make an arm-deep
    excavation, deposit offerings, and pray to deceased i'vankolo'we players for success,
    rain, and good things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After covering the excavation, the watchers sit and listen, then move farther
    and repeat the listening four times, each time farther from the excavation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A watcher must not turn around or look back if he hears steps and knows that
    something unusual is present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A moving star, lightning, mysterious fire, or bright light on the earth is
    interpreted as a sign that the watcher's side will win the game.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sound of an owl or coyote is interpreted as a sign that the other side
    will win; a summer bird indicates success for the watcher's side; a mocking bird
    or snow bird indicates trouble, possibly a fight and injury with the game ball.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The leader distributes corn-husk packages and wafer bread to three other players,
    keeps the remaining bread, carries the sack of te'na'sali and the cigarette, and
    gives one package to a man with instructions to take offerings to the rat man
    for help collecting straws to win counters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The leader and three associates visit the rain priest, remove their moccasins
    and head-kerchiefs on entering, deposit wafer bread and husk packages in a basket
    tray, and return the te'na'sali sack to the rain priest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The rain priest sings four songs to named rain priests of the four regions,
    asking them to accept offerings and give much rain, seeds, good things, and long
    life, with a formula about not dying but sleeping to awake in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:7
