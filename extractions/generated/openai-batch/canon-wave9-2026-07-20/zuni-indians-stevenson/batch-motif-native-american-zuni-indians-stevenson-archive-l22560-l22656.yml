canonical_text:
  quote: ''
  summary: The passage recounts ritual actions of a fraternity director who summons
    four directional animal beings, gives them plumes, and asks them to intercede
    with rain-makers. He then lights a torch by medicine breath and kindles distant
    fires in four regions, leading observers to accuse him and his fellows of sorcery.
    The passage continues with accounts of A'shiwi association with the Mu'kwe Corn
    clan, initiation into Little Fire rites, an alternate account of Mu'kwe searching
    for Le'lentu/Pa'yatamu near a spring and mountain, and brief notices on several
    Zuni fraternities, including Bow priesthood origins and the recent Struck-by-lightning
    fraternity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The director held an unlighted torch and four red-colored fluffy eagle plumes
    while dancing and calling for the Cougar of the North.
  category: action
