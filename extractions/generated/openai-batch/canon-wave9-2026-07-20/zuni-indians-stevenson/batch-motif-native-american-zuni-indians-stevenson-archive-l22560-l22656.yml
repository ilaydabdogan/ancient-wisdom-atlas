comparison_claims:
- id: claim:1
  claim: The passage explicitly equates Hopi Le'lentu with Zuni Pa'yatamu and says
    the description of the god of music, butterflies, and flowers is the same in both
    peoples' accounts.
  claim_level: same_function
  target: Hopi Le'lentu and Zuni Pa'yatamu
  evidence_refs:
  - ev:5
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This comparison relies on the ethnographic note in the passage; no
    independent Hopi narrative is included here.
- id: claim:2
  claim: The passage reports that the Ko'shi'kwe Cactus fraternity was adopted from
    the Hopi Indians, supporting a cautious claim of reported ritual-institution transmission
    between neighboring traditions.
  claim_level: historical_contact
  target: Ko'shi'kwe Cactus fraternity and Hopi Indians
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports a declaration by theurgists and others but gives
    no detailed adoption narrative in this excerpt.
