  - ev:1
- id: obs:2
  text: The director called the Cougar of the North, Bear of the West, Badger of the
    South, and White Wolf of the East; each appeared and received a plume tied to
    the back of the neck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director asked each summoned animal being to intercede with the rain-makers
    for rain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the animal beings returned home, the director chewed Corn clan medicine,
    lit his torch by blowing medicine breath on it, and kindled fires at a great distance
    in the four regions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The observing people were annoyed and decided that the man and his followers
    were sorcerers.
  category: speech
  evidence_refs:
