  quote: ''
  summary: A chronological historical summary records visits by Spanish civil and
    ecclesiastical officials to Zuni, reports of priests and missionaries serving
    there, and several population counts between 1736 and 1799, with a parenthetical
    comparison to 1820-1821.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1736-1738, Juan Paez Hurtado, Bishop Elizaecochea of Durango, and Governor
    Enrique de Olavide y Michelena are each recorded as visiting the pueblo in successive
    years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For 1744-1748, Zuni is reported by different authorities as having either
    150 families or 2,000 people, and as having two priests, one named Padre Toledo
    with an uncertain given name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: For 1760, Bishop Tamaron reported Zuni's population as 664, and the passage
    notes that this is nearly 1,000 fewer than Ilzarbe's 1788 report.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fray Silvestre Velez Escalantj is listed as missionary at Zuni for 1774-1778,
    and Fray Andres Garcia for 1779-1780.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: For 1788, Fray Rafael Benavides and Fray Manuel Vega are listed as missionaries
    at Zuni, and Ilzarbe reports the population as 1,617.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: For 1793, Fray Daniel Martinez is said to have been missionary at Zuni before
    that date, and Revilla Gigedo reports the population as 1,935.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:7
  text: For 1798-1799, Zuni's population is reported as 2,716, with a parenthetical
    note that by 1820-1821 it had apparently declined to 1,597.
  category: attribute
  evidence_refs:
  - ev:9
