canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparations and dances connected with the
    Kor''kokshi: seeds are divided into five sacks, food is offered in the river to
    grandfathers and grandmothers, personators prepare masks and rattles at the river
    bank, prayers invite rain-makers and address divine powers, dancers move through
    plazas and ki''wi''siwe, meal and cigarettes are offered, an underworld door is
    ritually opened, and elders and women participate with prayers, smoking, food,
    and meal-sprinkling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seed-gatherers pool the contents of their blankets; corn is removed from cobs,
    seeds are mixed, equally measured into five parts, put in five sacks, and placed
    before a fraternity altar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the Ko'tikili, including women, deposit food made in their homes
    into the river to na'nakwe and ho'takwe, glossed as grandfathers and grandmothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Mu'lukt&kla announce that the gods will come that night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kor'kokshi personators go to the river bank covered with blankets that hide
    their masks; each places a tortoise-shell rattle and mask on the ground, sprinkles
    sacred objects with meal, and prays.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Female Kor'kokshi are described as representing women who belonged to the
    Ko'tikili when alive and as symbolizing fecundity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kor'kokshi address rain-makers with an invitation to go to the people,
    dance, and make rain, and then address the Sun Father and Council of the Gods
    with requests for life, a good heart, corn, sheep, clothing, and happiness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Masked Kor'kokshi come to the village, dance in four plazas, retire to the
    He'iwa ki'wi'sine, and dance there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After Kor'kokshi songs and dances, five goddesses each take a sack of seeds,
    and the Sha'ltiko personating a Kor'kokshi receives reed cigarettes wrapped in
    a corn husk and meal before leading dancers to five other ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In other ki'wi'siwe there are gods but no Kor'kokshi; these gods must complete
    their dances before the Kor'kokshi dance, so the Kor'kokshi may wait outside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the roof of each ki'wi'sine, the leader waves meal to the four regions
    and throws it through the hatchway toward a small excavation before the fire altar,
    which is said to symbolize the entrance to the undermost world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the hatchway the leader says, “Water moss, open the door,” and the passage
    states that if the door opens, rain-makers may come from the water-moss world
    into the ki'wi'sine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Kor'kokshi descend the ladder, circle the room, form a single file facing
    east, turn north, and begin dancing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The cigarette bearer gives the chief wor'li meal and a cigarette, takes the
    wor'li's hands, waves them to the six regions, and prays that Great Fathers bring
    much rain and many seeds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A goddess deposits a sack of seeds by the second wor'li; wor'we and aged men
    hold the sack close to their faces and pray, and a lit cigarette is passed down
    the line for each to smoke.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: Women of the house adjoining the ki'wi'sine and their friends give food to
    dancers when the Kor'kokshi are absent, and the women sprinkle the gods with meal.
  category: action
  evidence_refs:
  - ev:8
