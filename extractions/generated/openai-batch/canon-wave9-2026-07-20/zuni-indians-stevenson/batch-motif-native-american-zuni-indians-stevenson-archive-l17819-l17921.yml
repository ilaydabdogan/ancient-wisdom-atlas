canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ritual race organized by ki'wi'sine affiliation
    and divided between the sides of the elder and younger Gods of War. Rain priests
    and Bow priests set feather plumes south of the village, prepare and pray over
    marked gaming sticks, and start the race by silent meal-sprinkling. Runners follow
    the road of the Gods of War, pass between the plumes, draw breath from them to
    run like the tireless sho'kiapiso bird, return by circuit, and kick the sticks
    into the river so they may go to Ko'thluwala'wa. The plumes are later buried with
    prayers to the rain-makers for rain, and a clan race is announced for four days
    later.
  language: English
  quote_policy: summarized
