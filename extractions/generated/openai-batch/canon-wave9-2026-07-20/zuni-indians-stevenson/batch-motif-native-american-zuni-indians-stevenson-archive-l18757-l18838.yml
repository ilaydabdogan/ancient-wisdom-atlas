canonical_text:
  quote: '"We sing with our hearts, not with our lips."'
  summary: 'The passage describes preparations and ritual actions for a Zuñi game:
    eating before required abstinence, eye markings with grease and hematite, plaza
    arrangement, divinatory use of a ball from the rain priest, a black-or-white disk
    choice, buried plant and precious offerings, silent prayer, songs to crow, owl,
    and the Gods of War, and handling of two balls with breath drawn from them.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The leader tells players, watchers, and the rat man to eat much because they
    must not eat or drink while the game is played.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the meal, four players and four watchers apply bear or cougar grease
    around each eye and place red hematite over the grease.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first leader and his party take the west side of the plaza, while the
    opposing players sit on the east side by the old Spanish church.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The game implements are placed on the west side of the plaza, with cup openings
    toward the east and the stone disk, ball, and straw counters laid on the cups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first leader goes to the rain priest's house to retrieve a gaming ball
    left on a west line of meal; if it has moved to the most eastern line, he takes
    this as a sign that his side will win.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leader lifts the stone beside the rain priest, draws a breath from it,
    places it inside his shirt, says goodbye, and returns to the plaza.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A watcher asks the opposing head player to choose the black or white side
    of the stone disk and then throws the disk to decide which side receives the game.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the game is held by the first leader's side, three players each receive
    a cup, the leader keeps one, and each player faces a cardinal point.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The four players sit by a sand pile under a large blanket while a central
    hole is dug and a bunch of plants is deposited with the tops even with the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each player makes a small excavation before himself and deposits a small corn-husk
    package of precious offerings, including a la'showanne.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The leader deposits an ancient ko'hakwa bead, a piece of fine turquoise, and
    a black stone bead in separate holes; the bead and turquoise are specified as
    upright rather than flat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each player holds his cup to his mouth and offers a silent prayer; the explanation
    given is that they sing with their hearts and not with their lips.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Songs are addressed to the crow, the owl, and the Gods of War; the crow is
    described as hiding corn in the mountains and finding it months later, and the
    owl as carrying the ball in its claw without others knowing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the songs, the leader rubs the ball from the rain priest together with
    the game ball, draws a breath from the two balls, returns the rain-priest ball
    to his breast, and places the other ball over an unspecified point where the excerpt
    breaks off.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note states that some Zuñi balls are said to be marked with the owl's foot
    because the owl had stolen a ball and hidden it in its claws.
  category: other
  evidence_refs:
  - ev:8
