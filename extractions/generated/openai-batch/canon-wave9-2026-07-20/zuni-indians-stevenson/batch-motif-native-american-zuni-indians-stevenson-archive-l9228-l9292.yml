- id: obs:2
  text: The Shi'wanni of the South is affiliated with the Badger clan; four associates
    are also listed as Badger clan, and the fourth associate is female.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shi'wanni of the East is affiliated with the Eagle clan; four associates
    are also listed as Eagle clan, and the fourth associate is female.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Shi'wanni of the Zenith is affiliated with the Dogwood clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shi'wanni of the Nadir is affiliated with the Eagle clan; the first associate
    is a Sand hill crane clan son of the Shi'wanni, the second associate is an Eagle
    clan younger brother, the third associate is Eagle clan, and the fourth associate
    is a female Eagle clan member.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ninth Shi'wanni is of the Black Corn clan; listed associates include Black
    Corn clan, Ai'yaho'kwe described as a plant, Corn clan, and a female Corn clan
    associate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The tenth Shi'wanni is of the Chaparral Cock clan and is director of the Shu'maakwe
    fraternity; his associates include a deputy to the director, a maker of medicine
    water, a warrior to the fraternity, and a female Ai'yaho'kwe called great mother
    of the fraternity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The eleventh Shi'wanni and associates are listed as Sun clan; the twelfth,
    thirteenth, and fourteenth Shi'wanni and associates are listed as Corn clan; the
    fifteenth is Coyote clan; the sixteenth is Frog clan.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:14
- id: obs:9
  text: A note says one man was too young at his father's death to be associated with
    the A'shiwanni.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A vacancy after the death of Lai'wa'silun'kla, Shi'wanni of the West, was
    delayed because the A'shiwanni doubted whether the first associate had a sufficiently
    pure heart; after discussion, the former Shi'wanni's son was advanced to his father's
    position.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The death of a female associate was followed by replacement by her mother's
    sister's daughter; N'ai'uchi judged the woman pure of heart but opposed succession
    by other immediate family members because her brother was a sorcerer and he suspected
    her father, who held the position of scalp custodian in the Bow priesthood.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: N'ai'uchi, as Shi'wanni of the Nadir, is preparing his grandchild, the daughter
    of his first associate, to fill a future female associate position.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A note says the ninth Shi'wanni possesses the ot'tone, which was secured according
    to Zuni legend through an aged Shi'wanni of the Black Corn clan found with his
    wife and two grandchildren in the village He'shotiyalla, west of Utiwanna, and
    who became allied with the A'shiwi.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: A note identifies a Pe'kwlu as deputy to the Sun Father and says he has no
    associate.
  category: relationship
  evidence_refs:
  - ev:11
