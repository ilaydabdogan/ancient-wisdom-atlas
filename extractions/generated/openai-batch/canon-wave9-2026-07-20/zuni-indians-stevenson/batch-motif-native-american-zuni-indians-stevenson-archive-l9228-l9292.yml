canonical_text:
  quote: ''
  summary: The passage enumerates Shi'wanni offices and associates by clan, direction,
    number, and ritual function; it also records notes on succession, purity of heart,
    sorcery suspicion, a deputy to the Sun Father, preparation of a future female
    associate, and the ninth Shi'wanni's possession of an ot'tone linked to a Zuni
    legend.
  language: English
  quote_policy: summarized
