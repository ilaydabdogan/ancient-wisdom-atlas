  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The pe'kwin places an arrow point in each mouth, not to be removed until sunset.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The victor and his elder brother wear a deerskin hood with a plume wand, war
