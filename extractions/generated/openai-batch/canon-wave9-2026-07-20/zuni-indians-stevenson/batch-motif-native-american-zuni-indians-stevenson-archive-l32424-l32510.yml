  summary: The passage describes sacred objects and ritual custody associated with
    the Bow priesthood and the great shell, then gives a detailed account of ceremonial
    attire, meal transfer, face painting, eagle-down decoration, stated rain-cloud
    and vegetation symbolism, weapons, arrows for the six regions, and prayer plumes
    used by the victor and his elder brother.
  language: English
