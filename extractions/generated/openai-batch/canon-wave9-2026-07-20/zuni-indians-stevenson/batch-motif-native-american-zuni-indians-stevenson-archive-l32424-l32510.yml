literal_observations:
- id: obs:1
  text: The po'nepoyanne of the Bow priesthood is described as a corn object surrounded
    by reeds; six reeds are colored for regions and filled with grains and seeds,
    while other reeds contain native tobacco.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pyramid of eagle plumes obscures the reeds, and the base is covered with
    cotton cloth, cotton cord, shells, and precious beads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Of the two po'nepoyanne belonging to the A'pi'tlashiwanni, one is carried
    to battle and the other remains at home.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The su'hlanna is described as a large shell especially precious to the Zunis;
    its keeper and vice must be of the Badger clan, and its old songs are known only
    to four Badger clan men.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The victor and his elder brother are ceremonially dressed and receive meal
    in their belts from the elder brother Bow priest, then carry it to two idol makers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder brother Bow priest anoints the faces of the victor and his elder
    brother with a paste made from fat of prey animals of the six regions and the
    rattlesnake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kia'punakwe apply red pigment and micaceous hematite to the warriors'
    faces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pe'kwin uses a black polished archaic pottery vase said to contain black
    paint from the undermost world and an old medicine bag containing corn pollen.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pe'kwin paints the lower portion of the face black and stipples corn pollen
    on the upper portion for both the victor and his elder brother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A warrior of the Ant fraternity applies eagle down to the chin, upper lip,
    nose, forehead, and crown of the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explicitly states that the decoration symbolizes a pure heart,
    prayer plumes directed to deceased A'shiwanni, rain, rain clouds, vegetation,
