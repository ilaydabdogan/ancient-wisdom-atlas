  summary: The passage describes social viewing arrangements during the Sha'liiko
    festival, liquor trading around the dances, post-dance administration of medicine
    water, the appearance of the Sha'liiko, and a midnight feast with food deposited
    outside under a ladder before dancing continues until daylight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The largest house has a private hallway and inner rooms where selected observers
    watch ceremonies through large wall openings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Observers in the inner rooms are principally women and children, with young
    men and other men also present during intervals of the dances.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the night advances, drinking occurs, but whisky is not served in the ceremonial
    chamber and its sources are concealed from non-Indians.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Whisky is carried to Zuñi before the Sha'liiko festival and sold or traded
    in connection with the dances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Navaho visitors trade valuable goods or animals for small quantities
    of whisky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Liquor trading occurs in the inner rooms, and emissaries are sent to bring
    in people who want liquor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After each dance, participants receive medicine water from a bowl by means
    of a shell, administered by the maker of medicine water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the dancers leave the house, the Sha'liiko appears on the floor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dancing is suspended at midnight for an elaborate feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Food is deposited under the ladder outside the house by the personator of
    the Sha'liiko and that personator's alternate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the feast, the dance continues until daylight, when the ceremonies close
    and are to resume later in the morning.
  category: sequence
  evidence_refs:
  - ev:5
