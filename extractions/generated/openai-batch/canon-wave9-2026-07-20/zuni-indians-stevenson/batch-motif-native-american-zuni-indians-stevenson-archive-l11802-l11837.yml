canonical_text:
  quote: ''
  summary: The passage describes a sequence in the ki'wi'sine in which three young
    men bring selected youths to girls, each girl accepts or refuses them, an accepted
    youth passes water to the girl for washing, and a girl may leave with two youths.
    The narrator then comments on the social disgrace attached to leaving and gives
    an example of a young woman rejected and punished by her family despite denying
    guilt.
