canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence involving Hle'wekwe and
    Great Fire fraternity participants, ritual boxes, a meal basket, male and female
    novices, sword swallowing, directional running, a masked warrior, willow switches,
    pursuit and whipping of novices, and final assembly in a ceremonial chamber. It
    also states that animal warriors work for the Sun Father on earth while the Pleiades
    and Orion are his celestial warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animal warriors are said to labor for the Sun Father on earth, while the Pleiades
    and Orion are described as his important celestial warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the plaza, parties turn toward boxes, the female Hle'wekwe leader proceeds
    through the western covered way, and the Sword order of the Great Fire fraternity
    forms a circle around the boxes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two Hle'wekwe women return to the plaza; musicians tip the larger box, one
    woman removes a basket of meal, and the musicians leave the plaza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A male novice, a female novice, and their catchers, also called fathers, appear;
    the male novice wears white buckskin and the female novice wears a black dress
    and blanket.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The novices stand near the wall of the He'iwa, or North, ki'wi'sine, while
    the catchers stand by the west-side house wall of the plaza.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The 'Hlem'mosona enters with two swords, and a Hle'wekwe warrior enters carrying
    a sword and six additional swords in a cougar-skin quiver.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The 'Hlem'mosona and the warrior pass inside the dancers' circle and pray;
    the 'Hlem'mosona swallows swords in several positions and directions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The 'Hlem'mosona runs to six regions, with the east also representing zenith
    and nadir, stamping and hooting or crying at cardinal points.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the six quiver swords have been swallowed, the 'Hlem'mosona and warrior
    stand before the boxes, face west, swallow their swords, wave them over the boxes,
    pray, and inhale near the swords.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Great Fire sword swallowers complete their dance and leave; a circle dance
    forms and singers at the boxes resume their music.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the ceremonial chamber, the aged warrior puts on a mask unlike the god-personator
    masks and similar to a common falseface, then returns to the plaza and causes
    amusement.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Six Hle'wekwe, including two women, enter carrying long slender willows; this
    signals the novices to run through the western street.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Before running, the novices pass the right hand around the head three times
    and throw down a la'showanne made of four fluffy eagle plumes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Catchers and willow carriers pursue the novices; some switch spectators, and
    the whipping of novices stops at the ladder to the ceremonial chamber hatchway.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The clans of the two fraternity fathers, Dogwood and Badger, and their paternal
    Turkey clans crowd the chamber ledges while the fraternity forms facing lines
    at the west end of the room.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: A footnote states that the meal basket is later carried by a male Hle'wekwe
    member to Ma'sakla, a ruin east of Zuñi, and deposited in an arm-depth excavation
    at the mound base.
  category: action
  evidence_refs:
  - ev:14
