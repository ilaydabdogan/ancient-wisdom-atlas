canonical_text:
  quote: ''
  summary: The passage describes the A'shiwi fleeing a great flood to the mesa To'wa
    Yal'lanne, where a cave temporarily symbolizes the Middle of the world. When flood
    waters nearly reach the summit, a son and daughter of the Kla'kwemosi are sacrificed
    to appease the waters; the waters recede and the two are transformed into the
    columnar Mother rock. The A'shiwi later return to the valley, rebuild villages,
    and face attacks by Navahos and Apaches, including one episode in which Navahos
    are lured to a dance and killed.
  language: English
  quote_policy: summarized
