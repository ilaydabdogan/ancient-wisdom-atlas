canonical_text:
  quote: ''
  summary: 'A Zuni rain-ceremony sequence is described: sacred objects are handled
    and prayed over; dancers and musicians repeat ritual actions; a hawk-associated
    dancer performs with plumes and a hawk song; eagle plumes are tied to trees to
    convey breath-prayers to rain-makers; an all-night fire protects Corn maidens;
    at dawn a Frog clan man prays for rain behind a cloud symbol; and girls dance
    with meal and ritual objects until the cloud symbol is in sunlight.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After prayers, the party returns to the ham'pone/hiim'pone, and the elder
    brother Bow priest relieves bearers of the sacred objects and hands them to the
    pe'kwin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin stands in the center of the plaza and prays to the Sun Father
    for health, happiness, long life, and blessing with the life of A'wonawilona.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pe'kwin moves two he'kupowanne in a circle, draws sacred breath from them,
    places them in a serrated bowl, and covers them with an embroidered kilt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ushan'ashute are dressed and painted like the he'kupowanhak'tona, carry
    specially prepared he'kupowanne, and repeat the ceremony in detail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Flutists accompany the Sho'ko'we choir when the ushan'ashute dance; Shiwano'kia
    and other mi'wachi bearers bless the ushan'ashute with life-givers and leave by
    the eastern covered way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A'shuwahanona appears dressed like sho'lipsimonthle'ona except for differences
    in plumes and moccasins; he has hawk medicine in his mouth and carries a hawk
    plume in each hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The 'Hla'hewe choir sings the hawk song as an invocation to the hawk so those
    who dance and sing may not become tired.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A'wan mosono'kia from the 'Hla'hewe and Sho'ko'we sides escort A'shuwahanona
    to the plaza, one preceding and one following him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A'shuwahanona dances with strong arm and leg motion, strikes one plume with
    the other, and later waves and strikes plumes over ritual groups; at that moment
    all expectorate for good hearts and strength.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The elder brother Bow priest ties a white fluffy eagle plume to each tree
    with cotton cord so the plumes may convey breath-prayers to the u'wannami, the
    rain-makers, to water the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the plumes are attached to the trees, ten dances by the 'Hla'he o'tikwe
    and Sho'ko o'tikwe continue for most of the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At dark, the pottery bowl is removed from the coals and a large fire is lit;
    the passage says a light must be kept so the Corn maidens may be watched and protected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At earliest dawn, the pe'kwin leads a man of the Frog clan to sit behind the
    cloud symbol facing east; he holds corn, a feathered miniature crook, and te'likinawe,
    and prays for rain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: When the plaza is bathed in sunlight, the te'likinawe of the mi'laiilapo'na
    and mi'wachi fall over in response to the Frog clan man's command.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Before sunrise, kia'potiikwe girls are led to the plaza; the leader throws
    a line of meal, each girl carries the hle'we and moves it toward the earth, and
    the dance continues until the cloud symbol is in sunlight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: A note says women leaving the ham'pone at night are attended, and that sleeping
    during the drama would offend the gods addressed.
  category: other
  evidence_refs:
  - ev:8
