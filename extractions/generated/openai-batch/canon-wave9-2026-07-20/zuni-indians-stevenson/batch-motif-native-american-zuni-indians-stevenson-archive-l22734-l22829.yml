canonical_text:
  quote: ''
  summary: The passage describes procedures for joining Zuñi esoteric fraternities,
    especially after healing through Mystery medicine. A restored patient prepares
    a sacred meal offering in a corn husk for the theurgist, who deposits it at night
    at a compass point as an offering to the Beast Gods. It lists admission rules,
    prerequisite orders, gifts, compulsory initiation triggers involving plumes and
    meal lines, and symbolic meanings of ritual objects including the et'tone and
    mi'li. The et'tone is said to symbolize Earth Mother, rains, vegetation, and physical
    nourishment; the mi'li is said to symbolize life-giving or soul power from A'wonawil'ona.
    Footnotes compare curative sucking and sand-painting practices with wider ethnographic
    examples.
  language: English
  quote_policy: summarized
