canonical_text:
  quote: ''
  summary: 'The passage describes a portion of a Zuñi rain ceremony: blessed corn
    is distributed and plumes are buried for deceased A''shiwanni; Mu''luktiikia bring
    and plant spruce trees, then withdraw and remove regalia; dancers, including ya''pota
    as the Great Father of corn, process and dance with ritual objects while meal
    is scattered; songs ask the Sun Father to embrace the Earth Mother so she may
    provide fruits; women pass a mi''li before each dancer''s mouth so the dancer
    draws breath from it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn described as blessed by the gods is distributed to several ritual groups
    before plume deposits are made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kla'kwemosi deposits four tc'likinawe in a northern excavation, and the
    Shi'wanni of the Nadir deposits four in a southern excavation to the deceased
    A'shiwanni; the plumes are covered with earth and the excavations are erased.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mu'luktiikia reappear through the eastern covered way with four spruce
    trees, each carried by two of the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One spruce tree is posted midway in front of the ham'pone, and three are posted
    at the south end while the Mu'luktiikia dance about during the planting.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After leaving the plaza by the west entrance, the Mu'luktiikia go toward Ko'thluwala'wa;
    the passage adds that in reality they go to a river bend to remove the regalia
    of the gods they personate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two men follow the Mu'luktiikia at a distance and bring back masks and other
    paraphernalia hidden under their blankets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Female dancers are led from the house of the Shi'wano'kia through the eastern
    covered way, four for the 'Hla'hewe side and four for the Sho'ko'we side, and
    are dressed in matching regalia including the 'hlelh'ponne.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ya'pota personifies A'wan tii'thu, called the Great Father of corn, and
    wears a concealed perfect ear of corn along with spruce twigs, white paint, plumes,
    shells, beads, and other dress items.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each dancer, including ya'pota, holds a 'hla'we in each hand received from
    the mi'laiulapona.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancers process in file to the plaza with ya'pota in the middle, led by
    an A'wan mosonokkla of the 'Hla'hewe side who throws meal in a line before her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The dancers form facing east, dance, then form facing south and dance again,
    repeating the movement during the dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: During the dance the participants extend their arms and keep time with songs
    that ask the Sun Father to embrace the Earth Mother so she may give them the fruits
    of her being.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Five women in black dresses and blanket wraps pass a mi'li before the mouth
    of each dancer, and each dancer draws a breath from it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After about fifteen minutes the dancers return to the ham'pone; the 'hla'we
    are received by the mi'laiulapona, and the A'wan mosonokkla lingers briefly, dancing
    slowly while facing east before depositing her 'hla'we in a basket.
  category: sequence
  evidence_refs:
  - ev:8
