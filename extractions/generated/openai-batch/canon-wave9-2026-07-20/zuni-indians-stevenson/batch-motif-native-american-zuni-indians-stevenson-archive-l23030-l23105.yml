canonical_text:
  quote: ''
  summary: The passage describes the rebuilding and transfer of a mi'li fetish, including
    prayer, breath drawn from the fetish, and kinship language addressed to the recipient.
    It then summarizes membership rules and initiation customs for several Zuñi fraternities,
    including warrior/scalp qualifications, solstice meetings, healing rites, fire
    and sword performances, symbolic suds for snow clouds, calendrical meetings for
    initiation and plant medicines, and the roles of directors, the sun priest, Beast
    Gods, rain-makers, warriors, and altar guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mi'li was completed by wrapping plumes, straw, shell, beads, cotton cord,
    and other materials, then securing the wrapping.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The theurgist repeated a long prayer while holding the mi'li and passed it
    four times over the writer's mouth so she might draw in sacred breath from the
    fetish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The theurgist handed the mi'li to the writer with the words, "Receive your
    father"; the passage says a male recipient would be told, "Receive your mother."
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father's mi'li was rebuilt with the same procedure except that its buckskin
    cup was not disturbed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After completing the father's fetish, the young theurgist cried and said that
    he had pleased his mother but offended his gods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'shi'kwe and A'pi'lashiwanni are described as not being divided into
    orders like the other fraternities.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Membership in the Ko'shi'kwe was associated with valorous deeds such as killing
    an enemy, while membership in the A'pi'lashiwanni required killing an enemy and
    bringing in the scalp, at least formerly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Because intertribal wars had ceased and scalps were unavailable, men without
    battle experience could be received into the A'pi'lashiwanni using an old scalp
    from the scalp house in place of a fresh scalp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Most fraternities held synchronal eight-day-and-night meetings at the winter
    solstice, when the sick were healed, swords were swallowed, and fire play and
    jugglery were practiced.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Suds symbolizing snow clouds were made by a deputy a'kwamosi in a bowl of
    water with a reed and broken root while he prayed for cold rains and snows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'When a meeting included initiation, the fraternities had to convene for four
    days: three nights until midnight and the fourth until sunrise.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the summer solstice, synchronous meetings invoked the Beast Gods to intercede
    with the rain-makers for rain, and the A'pi'lashiwanni acted as warriors and guardians
    of altars.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Fraternities met in August and September to prepare plant medicines and in
    October and November for initiation, healing, fire eating, and jugglery.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Meeting dates were generally fixed by the fraternity director, but the Shu'maakwe
    director was under the jurisdiction of the pe'kwin or sun priest and could convene
    only at his command.
  category: relationship
  evidence_refs:
  - ev:11
