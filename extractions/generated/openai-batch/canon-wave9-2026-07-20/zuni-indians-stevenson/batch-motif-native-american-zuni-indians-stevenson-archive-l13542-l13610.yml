canonical_text:
  quote: ''
  summary: The passage describes a turquoise-set shell specimen and compares Hopi
    and Zuñi ceremonial turquoise earrings. It then describes ceremonial attire and
    body painting for Sal'imobiya figures representing Zenith and Nadir and for Hle'lashoktipona.
    The gods proceed to excavations, where Sa'yatasha deposits te'likinawe, Hu'tutu
    plants plumes, meal is sprinkled and stamped, a cry is repeated at each of six
    excavations, and the group proceeds to a house for the night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shell specimen is described as smoothed, reset with many newer turquoises,
    and cemented in older work with a preparation said to be piñon gum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hopi turquoise earrings are described as thin wooden slabs with turquoise
    settings, while Zuñi earrings are strings of turquoises; both are worn only for
    ceremonial and dance occasions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two Sal'imobiya are described as nude except for breechcloths and as representing
    Zenith and Nadir.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Zenith Sal'imobiya has the upper body blocked in six colors outlined in
    black, with additional colored decoration on limbs; the Nadir Sal'imobiya has
    a yellow upper half and black lower half, with yellow and black limb coloring.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sal'imobiya wear spruce at wrists and ankles, war pouches, and strings
    of black and white corn, and each carries bunches of yucca baccata in both hands
    with points held backward.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hle'lashoktipona is described with a white embroidered kilt, sash, woman's
    belt, fox skin, and a mask with wood projections, black goat wool, white wool,
    spruce, and white popcorn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gods proceed to the excavations in an order associated with Shu'laawi'si.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sa'yatasha tramps near an excavation, deposits te'likinawe in it, and resumes
    his step.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hu'tutu plants plumes and resumes his stride; Sa'yatasha and Hu'tutu sprinkle
    meal over the plumes and around the excavation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two Ya'imihakto stamp meal that has been sprinkled in the street.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sa'yatasha and Hu'tutu pass each other, stop, stamp, and cry a repeated Hu'tutu
    formula at each of six excavations where plumes are planted.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: After the sixth excavation, the group proceeds to the house where they are
    to spend the night; Shu'laawi'si and his chosen father precede the others, and
    Shu'laawi'si plants plumes under the ladder before entering by the roof.
  category: sequence
  evidence_refs:
  - ev:9
