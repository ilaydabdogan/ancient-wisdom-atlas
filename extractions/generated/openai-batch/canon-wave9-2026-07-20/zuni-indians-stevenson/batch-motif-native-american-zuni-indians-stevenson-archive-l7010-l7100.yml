canonical_text:
  quote: ''
  summary: The passage describes Zuñi ceremonial actions involving a flayed bear presented
    to the Ha'lo'kwe fraternity, the consecration and decorated deposition of the
    bear skull, preparation and planting of te'likinawe prayer plumes, selection of
    a personator for Pau'tiwa, and prayers for rain associated with offerings placed
    in water-related locations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flayed bear was brought to the pueblo by Navahos and presented to the mo'sona,
    director of the Ha'lo'kwe fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The altar was erected, medicine water was consecrated, the bear was butchered
    and cooked, and fraternity members spent the night singing and dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mo'sona placed the bear skull in a flat basket containing a meal cross
    described as symbolic of the four regions, with the top of the head oriented east.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yucca suds, ceremonial eagle plumes, black and yellow paint, micaceous hematite,
    fluffy eagle plumes, medicine water, and meal were used in decorating or consecrating
    the bear skull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The decorated skull was carried to To'mapa, a shrine in the west wall of To'wa
    yaK-lannfi, with te'likinawe arranged around it and officers singing with a rattle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first body of A'shiwanni prepared te'likinawe, some of which were deposited
    at sunset in a spring or water pocket through which the Kok'ko are said to view
    the earth from the undermost world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the ninth day, ritual officials prepared te'likinawe for Pau'tiwa, and
    the Corn clan gathered to choose a man to personate Pau'tiwa as Kom'ha'likwi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A prayer was offered for a good heart for the chosen personator and for rains
    to fructify the earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pau'tiwa is described as appearing three times annually in Zuñi, with personators
    drawn from specified clans depending on the occasion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Five Sun clan men and five Corn clan men, with the personator, took offerings
    west of the village; an excavation was made on the river bank until water was
    reached, the te'likinawe were deposited, meal was sprinkled, prayers for rain
    were made, and the opening was filled.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
