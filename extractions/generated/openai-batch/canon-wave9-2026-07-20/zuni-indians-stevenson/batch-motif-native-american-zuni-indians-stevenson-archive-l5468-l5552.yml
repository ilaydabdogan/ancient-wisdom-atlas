  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ordered line of gods includes regional Sal'imobiya, other named gods,
    and Great Father Ko'yemshi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Other Ko'yemshi mark a place with their feet for each god to set an extended
    foot while striking the children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each child is carried on the back of a godfather and covered with a cotton
    shirt, blankets, and canvas replacing older bison robes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: As godfathers pass before the gods, children are struck four times by each
    god with bunches of giant yucca, while the Ko'mosona and Ko'pekwin do not participate
    in the whipping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After passing the gods, the godfather enters the meal circle, ascends the
    ladder, and brings the child into or toward the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The la'showanne is removed from the proper sand figure and tied to the child's
    head; the director of the Great Fire fraternity gives the child water from the
    spring using an old shell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Children step upon the sand painting, and their breasts and other body parts
    are touched with sand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Children are seated around the plaza with godfathers behind them, while the
    wife and daughter of each godfather stand beside the child and hold canvas that
    conceals the child.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:12
  text: The director of the Great Fire fraternity gives sacred water to people assembled
    on the roof of the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: The Ko'mosona makes a square in the plaza from four meal crosses, with each
    cross and its four points said to symbolize the four regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Four Sa'ya'hlia stand on the crosses, each facing a different direction, and
    later rotate to make a circuit of the four regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The four Sa'ya'hlia pass the children in sequence, striking each child once,
    twice, three times, and four times according to their starting cross.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The four Sa'ya'hlia then form a north-facing line, and each child is again
    carried past them and struck four times by each.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: After passing the Sa'ya'hlia, each godfather takes the child home for a feast
    and then goes to either the O'he'wa or Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: The gods go to He'kiapawa, have a light repast, arrange corn for delivery
    by Ko'loowisi, and then divide into two bodies for two ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: Most gods enter the hatchway headfirst facing north, descend the ladder by
    foot and knee to the fire altar, and somersault into the room.
  category: action
  evidence_refs:
  - ev:7
