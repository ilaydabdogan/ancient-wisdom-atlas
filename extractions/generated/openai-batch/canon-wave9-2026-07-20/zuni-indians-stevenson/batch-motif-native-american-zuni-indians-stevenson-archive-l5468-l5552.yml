canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence in which the pe'kwin leads
    and positions gods in a plaza using meal lines and regional color markings. Children
    carried by godfathers are struck with yucca by gods, taken through a ladder and
    kiva sequence, given plumes, sacred water, and contact with sand figures, then
    returned to the plaza. Four Sa'ya'hlia stand on meal crosses representing the
    four regions, rotate through the directions, and strike the children in graded
    counts. The ceremony concludes with children and godfathers going to a feast,
    while the gods gather, arrange corn for delivery, divide into two groups, and
    enter kivas headfirst through hatchways toward fire altars.
  language: English
  quote_policy: summarized
