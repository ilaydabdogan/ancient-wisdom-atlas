canonical_text:
  quote: ''
  summary: The passage describes Zuni racing practices and the lot game Sho'liwe.
    Six sacred stone heaps direct runners and are associated with the Gods of War
    and buried medicine vases. Foot races involve stakes and wagers, including races
    by young boys and informal races with Navajos. Sho'liwe is described as a major
    indoor gambling game and as a game of the Gods of War, with implements including
    split reeds and counters. A legend says it was played for rain by the Gods of
    War and rain priesthood; rain priests organized the Sho'wekwe fraternity to play
    it for rain. The passage also describes a gathering at I'tiwanna where Ko'yemshi
    gave songs and prayers to fraternities, followed by annual personation of Ko'yemshi
    by named fraternities.
  language: English
  quote_policy: summarized
