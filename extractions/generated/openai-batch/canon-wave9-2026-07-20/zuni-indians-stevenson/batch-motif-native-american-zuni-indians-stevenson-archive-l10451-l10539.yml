candidate_motifs:
- id: motif:1
  label: Offerings and prayers exchanged for rain and fertility
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: The passage repeatedly states that te'likinawe, corn grains, and prayers
    are offered to divine or deceased recipients so that rains may come and the earth
    may be fruitful.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage is ritual description rather than a narrative myth; the taxonomy
    labels describe function, not a demonstrated historical motif connection.
- id: motif:2
  label: Great Mother corn asked to multiply her children
  taxonomy_refs:
  - mother_goddess
  - seasonal_cycle
  basis: The song addresses A'wan Sita as Great Mother corn, calls the corn her children,
    describes dressing them, and asks that she send many children another year.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The broad 'mother_goddess' category is used only because the passage names
    a Great Mother corn figure; it does not provide a separate mythic biography.
- id: motif:3
  label: Offering through an entrance to the undermost world
  taxonomy_refs: []
  basis: A'shiwanni deposit offerings beneath the floor through a circular opening
    explicitly described as symbolic of the entrance to the undermost world.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No journey to the underworld is described, only a ritual deposit through
    a symbolic opening.
- id: motif:4
  label: Sun Father embraces Earth for fruitfulness
  taxonomy_refs:
  - sacred_marriage
  basis: The passage says offerings or prayers seek that the sun or Sun Father may
    embrace the earth so that she becomes fruitful and gives fruits to the people.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The passage uses an embrace image but does not explicitly call it marriage;
    the taxonomy label is therefore approximate.
- id: motif:5
  label: Ritual collection of spring water for rain ceremony
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: The kia'punakwe receive vessels and sprinklers, travel to named springs,
    deposit te'likinawe with prayers, and bring water back during a ceremony whose
    stated purpose includes rain.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives ritual procedure and stated prayers; it does not explain
    all symbolic meanings of the vessels or routes.
