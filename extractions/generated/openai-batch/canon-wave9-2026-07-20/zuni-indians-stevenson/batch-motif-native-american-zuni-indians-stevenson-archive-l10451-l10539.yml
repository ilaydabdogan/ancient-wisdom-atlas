canonical_text:
  quote: ''
  summary: The passage describes a Zuni rain ceremony in which choirs prepare corn-based
    ritual objects, offerings are deposited through a floor opening identified as
    an entrance to the undermost world, selected youths and maidens are equipped to
    collect spring water, and alternating dances continue until midnight. The stated
    prayers concern rain, corn increase, and the fruitfulness of the earth under the
    Sun Father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hla'hewe mo'sona quietly instructs mi'laiilapo'na to ask the Sho'ko'we
    choir to work for the Hla'hewe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sho'ko'we choir prepares hla'we by surrounding and hiding ears of corn
    with attached stems, feathers, plumes from birds of the six regions, white sage
    blossoms, cotton cloth, cotton cord, and a small crook.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hla'hewe choir sings to A'wan Sita, Great Mother corn, saying that they
    dress her children and asking her to send many children another year.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the hla'we are completed, a reciprocal request is made for the Hla'hewe
    choir to work for the Sho'ko'we, and the Hla'hewe choir prepares hle'we with corn,
    feathers, and white sage blossoms attached to tablets.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At sunset members of the first body of A'shiwanni deposit te'likinawe and
    colored corn grains beneath the ki'wi'sine floor through a circular opening identified
    as symbolic of the entrance to the undermost world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The offerings are stated to be for the Council of the Gods and deceased A'shiwanni
    of the six regions for rains, and to Pau'tiwa so that the sun may embrace the
    earth and make her fruitful.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four kia'punakwe, in two couples and accompanied by men of the Dogwood and
    Corn clans, enter the ki'wi'sine and are led by the pe'kwin to seats at the west
    end.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youths and maidens wear ceremonial clothing and jewelry, and each carries
    a perfect ear of corn concealed in a sash.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pe'kwin gives each kia'punona six te'likinawe, one for each of the six
    regions, with region-colored butterflies attached; maidens receive cloud vessels
    and corn sprinklers, and youths receive gourd jugs and reed sprinklers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two kia'punakwe of the Hla'hewe side collect water from a spring in the
    foothills of Corn mountain, and the two of the Sho'ko'we side collect water from
    a spring north of Zuni, after depositing te'likinawe with prayers for rain and
    fruitfulness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the kia'punakwe leave, the mi'laiilapo'na of the two sides dance alternately,
    one side holding hla'we and the other hle'we, to choir music with rattle and drum
    until midnight.
  category: action
  evidence_refs:
  - ev:9
