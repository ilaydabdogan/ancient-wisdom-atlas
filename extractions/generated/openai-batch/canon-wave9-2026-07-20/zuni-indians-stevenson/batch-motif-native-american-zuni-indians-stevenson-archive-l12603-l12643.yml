canonical_text:
  quote: ''
  summary: 'The passage describes late festival events: Ko''yemshi jesters burlesque
    dancers, present dolls and corn to a child and mother, play a prank on a dog,
    and accompany dancers who distribute gifts to spectators. The dancers and Ko''yemshi
    leave the plaza, disrobe outside the village, and masks and paraphernalia are
    carried back concealed. The festival closes, to recur in four years, with gifts
    carried to the A''shiwanni and portions of cooked game deposited in the river
    as offerings to the deceased Kia''nakwe, described as angry gods needing appeasement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the dancers retire from the plaza, the Ko'vemshi burlesque them and
    are described as having a jester's privilege.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the afternoon, with spectators on house tops and in the plaza, two Ko'yemshi
    approach a little girl; one carries a doll and the other carries a basket containing
    a doll and ears of boiled corn tied with yucca ribbons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl's mother places her arms around the child as the Ko'yemshi approach;
    the Ko'yemshi converse with the child and ask questions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One Ko'yemshi gives the child a doll, and the other gives the mother the basket
    containing a doll and corn; the mother and child then leave the plaza.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ko'yemshi throw blankets over a dog until its howling is drowned and it
    cannot move; the covered bundle is then lifted by one of them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The returning dancers are covered with gifts for the populace, including fancifully
    shaped bread strung with yucca ribbons and calico tied into balls with long tails.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: People of all ages try to catch articles thrown through the air, and the passage
    notes that no controversy or ill feeling is shown at these times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One dancer asks a Ko'yemshi to help remove a white shirt, waves it, and tosses
    it into the air before excited male spectators.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The dancers and Ko'yemshi leave the plaza by the western road, travel about
    a mile, and disrobe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Members of the Chu'pawa ki'wi'sine follow on the south side of the river with
    ordinary apparel hidden under blankets and return with masks and other paraphernalia
    covered from view.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The festival closes with this act and is said to be repeated in four years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Gifts to the A'shiwanni are carried to their homes at night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each shi'wanni deposits small portions of cooked game in the river as offerings
