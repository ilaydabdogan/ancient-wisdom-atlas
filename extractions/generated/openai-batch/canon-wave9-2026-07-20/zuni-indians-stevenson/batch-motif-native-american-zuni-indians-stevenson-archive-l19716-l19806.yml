canonical_text:
  quote: ''
  summary: The passage describes Zuni ritual restrictions and offerings at a sacred
    crater lake associated with the Gods of War and Salt Mother. Bow priests descend
    by a sacred path, offerings are placed at shrines and in the lake, prayers are
    made to several divine beings, salt is gathered, and Father corn and Mother corn
    are treated as necessary ritual objects for corn heaps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crater lake is described as a highly sacred spot, with unusual waters
    and reported therapeutic value.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Entry into the crater is restricted by Bow priesthood status and by a graded
    count of scalps taken; four scalps permit descent into the crater and offerings
    in the lake.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bow priests descend by a path said to have been traveled by the Gods of War,
    and the elder and younger Bow priests are described as living representatives
    of those gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An east-side shrine near the lake contains prayer plumes and miniature martial
    objects, and other offerings are placed around the shore for the Gods of War.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A guide initially fears descending because he is not a Bow priest, but after
    descending he gives meal to the visitors, asks them to pray and scatter it on
    the water, and sings a low chant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The guide's prayer addresses the Sun Father, the Gods of War, the Salt Mother,
    and ancestral warrior gods, asking that divine anger be averted and that health
    and prosperity be granted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At sunrise, Bow priests and warriors deposit offerings to the Gods of War,
    while the rain priest and Great Father Ko'vemshi plant or deposit prayer plumes
    for Salt Mother and the Council of the Gods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After plume planting and prayers, the party enters the lake and gathers salt
    crystals from the lake bed using blankets or cloth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Each man has Father corn and Mother corn, covers them with salt-bearing clay,
    and later keeps them with plume offerings among stacked corn.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old parent corn is eventually deposited in the river to go to Ko'thluwala'wa
    and replaced; the passage says no corn heap should lack Father and Mother corn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that people fear parting with parent corn because of the
    Salt Mother's wrath and says an ear with a direct line of grains symbolizes the
    straight path of life.
  category: attribute
  evidence_refs:
  - ev:8
