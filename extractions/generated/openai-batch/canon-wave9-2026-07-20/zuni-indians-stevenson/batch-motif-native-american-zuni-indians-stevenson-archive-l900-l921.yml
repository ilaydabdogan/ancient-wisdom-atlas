canonical_text:
  quote: ''
  summary: After the A'shiwi arrive, several peoples remain with or separate from
    them. The Coconino Pimas teach songs that later belong to the Shu'maakwe fraternity,
    then leave, follow fox tracks to water, enter a deep canyon, and settle there;
    some A'shiwi accompany them and become separated. The Coconinos meet a rain priest
    in the canyon. A Mu'kwe discovers a village of A'shiwi who say they are seeking
    the Middle place. The Mu'kwe later move west and east, struggle with enemies,
    and settle on mesas.
  language: English
  quote_policy: summarized
