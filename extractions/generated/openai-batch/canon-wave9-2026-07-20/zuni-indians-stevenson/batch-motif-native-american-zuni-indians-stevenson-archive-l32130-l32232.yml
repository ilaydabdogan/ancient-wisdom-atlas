canonical_text:
  quote: ''
  summary: The passage describes a Zuñi plaza ceremony in which two groups of girls
    and dancers are positioned at northeast and southwest entrances, associated with
    U'yuyewi and Ma'sai'lema. Ritual leaders pray for rain with meal, tobacco smoke,
    a drum, and cigarettes. Warriors and pu'mokiakianawe dance with war clubs, hatchets,
    symbolic scalps, and alternating hand gestures that refer to Navahos fleeing and
    Zuñis having no fear. The dance figures are repeated four times, include a comic
    appearance of two men dressed as United States troops, and culminate in a communal
    night dance around the scalp pole.
  language: English
  quote_policy: summarized
