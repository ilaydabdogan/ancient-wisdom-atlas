  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The choir is placed in its designated location, the a'kwamosi sits by the
    medicine bowl at the altar, and medicine water is prepared.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A warrior moves eagle-wing plumes before the altar, and the director dances
    before the altar before beginning to heal sick persons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The director treats a woman by sucking, throws supposed extracted material
    into the fire, draws an object from the a'kwamosi's side, throws it into the fire,
    and later places extracted material in a bowl presided over by an aged woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A second theurgist dips plumes in medicine water, sprinkles the choir, dances
    before the altar, and works on patients.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two female theurgists join the performance, and the number of theurgists on
    the floor increases while enough participants remain to continue the song.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Sia guest touches a woman with two eagle-wing plumes, receives a stone that
