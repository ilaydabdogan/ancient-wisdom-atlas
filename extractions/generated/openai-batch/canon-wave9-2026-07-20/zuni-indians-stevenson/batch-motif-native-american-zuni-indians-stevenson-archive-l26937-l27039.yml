  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence involving an altar, medicine
    bowl and medicine water, eagle plumes, theurgic healing by extraction, fire-handling
    by a Sia guest, meal sprinkling, prayer, burial of extracted matter, and fourth-night
    wall paintings and body adornment.
  language: English
  quote_policy: summarized
