  text: For the clan race, a member of each clan makes the stick used by that clan’s
    racers, and the stick may be selected from either one of the Gods of War.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Runners wear clan symbols on their breasts and paternal clan symbols on their
    backs; the gaming stick is also decorated with the totem.
