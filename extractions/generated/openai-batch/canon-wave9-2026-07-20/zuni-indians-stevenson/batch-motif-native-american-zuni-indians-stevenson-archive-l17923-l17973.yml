canonical_text:
  quote: ''
  summary: The passage describes Zuñi clan races associated with rain, including clan
    sticks and painted clan symbols, a Bow priest’s directional starting rite with
    meal thrown four times, a distinction between religious rain races and betting
    races, and a private all-night rite in which a man seeking speed or race success
    consults a rain priest, offers corn, joins song prayers to the rain-makers, and
    receives a prayer plume at sunrise.
  language: English
  quote_policy: summarized
