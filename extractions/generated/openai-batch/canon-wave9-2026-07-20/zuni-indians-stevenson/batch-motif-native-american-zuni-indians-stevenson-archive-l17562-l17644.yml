literal_observations:
- id: obs:1
  text: As Nai'uchi's approaching death became evident, several doctresses arrived
    and sat by the pallet, determined that ancient customs should not be interfered
    with.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A doctress crossed Nai'uchi's hands under the blankets and held them firmly
    while he showed signs of restlessness and suffering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hii'lian prepared white corn-meal mush, and a doctress fed it to Nai'uchi
    by spoonfuls while saying it would feed him on the road.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the feeding, doctresses used breath, stomach kneading, and pressing
    of lips and eyelids; the passage says the kneading was to help the spirit free
    itself from the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer summoned a physician, and together they forced the attendants away
    so Nai'uchi's last moments could pass quietly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nai'uchi's special crockery was broken and put on coals, the coals were carried
    outside, a fresh fire was made, and his war club was thrown into the flames.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Boiled piñon gum was lit in the fireplace, and Ha'lian held his hands over
    the smoke and rubbed his face and breast so he would not be touched by the spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The body was stripped, bathed, rubbed with meal, dressed in new clothing,
    and a lock of hair was cut from the head and laid away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Four blankets were layered for the body, one corner pointed east, the corpse
    was laid on them, and a rope was used to measure the corpse for the grave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Me'she tied Nai'uchi's warrior's wristlet on his right wrist and arranged
    beads around his neck.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Associate rain priests sat around Nai'uchi's head while men, women, and children
    sprinkled meal on the remains and prayed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage describes grief or emotional response among the daughter, blind
    grandson, stepdaughter, Hii'lian, and Nina.
  category: attribute
  evidence_refs:
  - ev:10
