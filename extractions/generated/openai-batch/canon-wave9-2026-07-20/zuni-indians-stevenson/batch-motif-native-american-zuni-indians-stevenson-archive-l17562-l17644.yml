canonical_text:
  quote: '"Father, take this; it will feed you on the road."'
  summary: The passage describes the deathbed treatment of Nai'uchi, including feeding
    him corn-meal mush for a road, actions said to help release the spirit, intervention
    by the writer and physician, breaking or burning household and personal items,
    smoke used against spirit contact, preparation of the body, grave measurement,
    priestly attendance, meal sprinkling, prayers, and family mourning.
  language: English
