canonical_text:
  quote: ''
  summary: An English ethnographic passage describes part of a Shu'maakwe initiation
    in which novices are led by fraternity fathers and theurgists embodying Beast
    Gods, instructed in healing, and shown ritual healing by sucking disease from
    invalids. The passage also describes a bowl receiving extracted matter, its burial,
    a visit to another fraternity chamber, a White Wolf performance by the elder brother
    Bow priest, child dancers, and sprinkling of the altar and cardinal points with
    medicine water.
  language: English
