canonical_text:
  quote: ''
  summary: 'The passage describes preparations for the annual Sha''lako festival:
    selection of personators and hosts, blessing of new or reconstructed houses, custody
    and later collection or planting of te''likinane, repair and decoration of ceremonial
    houses, the rebuilding of the Kia''kwemosi ceremonial house after lightning damage,
    and the appearance and conduct of Sa''ya''hlia, A''toshle, Ko''yemshi, and Ne''wekwe
    during the work.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Personators of the Council of the Gods, the Sha'liko, and the Ko'yemshi, as
    well as hosts for these gods, are decided during winter solstice ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among eight new or reconstructed houses, one is blessed by the Council of
    the Gods, six by Sha'liko, and one by the Ko'yemshi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A large te'likinane is given to each man who will entertain the Sha'liko,
    kept in his house, brought out during clan gatherings, and held while he prays
    for life, health, and happiness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the close of the Sha'liko festival the Ko'yemshi collect te'likinawe from
    houses and deposit them, except the one for the host of the Council of the Gods,
    which Sa'yatsisha carries home and later plants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the ceremonial house of the Kia'kwemosi is repaired, people of his clan
    do the work; the pe'kwin appoints workmen, and a member of the governor's staff
    calls selected names from a rooftop each morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several gods are present during repair work to see that all hands keep working.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ceremonial chambers are whitened by women of the house and decorated by fraternity
    members; some decorations remain permanently.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Houses to be constructed or remodeled must be ready before the coming of the
    Sha'liko.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kia'kwemosi ceremonial house had been occupied by his sister until lightning
    destroyed it and caused her death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports a Zuñi statement that the sister had no love in her heart
    for her brother and that lightning never destroys the good of heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The A'shiwanni rejoiced that the room of the et'tone of the Kia'kwemosi, located
    immediately over the center of the world, was not disturbed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two Sa'ya'hlia, three A'toshle, four Ko'yemshi, and three Ne'wekwe are present
    on the described occasion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sa'ya'hlia and some A'toshle wear described ceremonial dress and carry bows,
    arrows, tortoise-shell rattles, and bunches of giant yucca; the female A'toshle
    wears ordinary woman's dress with a bordered cotton blanket.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ko'yemshi have nude bodies and masks colored with pinkish clay, wear ragged
    kilts, and have cloth tied to the base of the mask.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ne'wekwe wear cast-off United States Army uniforms, are supposed to assist
    the laborers, but are described as eating filth and playing the fool.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ko'yemshi scamper over housetops and engage in jokes and nonsense.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Sa'ya'hlia and A'toshle carry giant yucca and use it to drive delinquents
    to work; A'toshle also threaten naughty and disobedient children with large stone
    knives.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: House building is accompanied by social pleasure, including gossip, jokes,
    and laughter among women, men, youths, and maidens.
  category: setting
  evidence_refs:
  - ev:9
