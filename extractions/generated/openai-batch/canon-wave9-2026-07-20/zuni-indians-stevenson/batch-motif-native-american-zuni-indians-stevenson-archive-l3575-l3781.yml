canonical_text:
  quote: ''
  summary: In History Myth 75, the elder and younger brothers deliberate in a sequence
    of named lower worlds. The beings there are unhappy in darkness and seek light
    above. Notes identify four regional trees as a means of ascent from the lower
    worlds and explain the wing or sunbeam world as the first glimpse of sunlight
    through an opening in the earth. The brothers wish for rain-priest fathers of
    the cardinal directions, and a male figure repeatedly hastens while carrying precious
    rain and crop fetishes at his breast.
  language: English with Zuñi terms and interlinear glosses
  quote_policy: summarized
