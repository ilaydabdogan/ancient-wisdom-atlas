canonical_text:
  quote: ''
  summary: 'The passage describes the implements and preliminary ritual procedure
    for the Zuñi game I''yankolo''we: cups, ball, disk, straws, paints, medicines,
    seasonal timing, consultation with a rain priest, preparation of prayer-meal lines,
    public announcement, selection of players and watchers, and the making of offering
    bundles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rain priests and theurgists are described as propitiating their gods for their
    own good, for their people, and for all the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The game implements include four hollowed quaking-aspen wooden cups, a stone
    ball, a two-sided stone disk painted white and black, and 106 straws.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cups are painted white with kaolin, and their bottoms are covered with
    black paint said to have come from the undermost world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The black paint is mixed with water, medicine, and powdered micaceous hematite;
    the hematite is called star medicine and has the same name as the fixed stars.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gaming ball is touched with white paint or entirely painted white.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Zuñi say the game originally used four carved wooden deer, each with an
    opening large enough to contain the ball, instead of the cups.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: I'yankolo'we is played only in January, February, and March, mostly in February,
    and must continue without interruption once begun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man wishing to play the game calls upon a rain priest of the West, East,
    Zenith, or Nadir at sunset and is told to return at night with wafer bread, precious
    beads, and prayer meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The rain priest brings out an ancient gaming ball.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a female member of the priest's household sweeps the inner room, the
    rain priest makes four north-south parallel lines with prayer meal by the north
    wall.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rain priest places the ball midway on the westernmost prayer-meal line
    and tells it that it will remain there through the night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The rain priest gives the man wafer bread in cloth, a corn-husk cigarette
    of native tobacco, a sack of powdered mythical medicine plant, and a piece of
    banded gypsum.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A member of the governor's staff announces from the housetop that the game
    will be played the following night and names the leader.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The players are not limited to particular clans, ceremonial groups, or sections
    of the village.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The leader selects three associate players and four watchers, described as
    seers who choose the hidden cups.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The leader and head watcher each place four corn husks on the floor, and those
    present put turquoise, white shell beads, micaceous hematite, red hematite, and
    corn pollen in each husk before folding them into rectangular packages.
  category: action
  evidence_refs:
  - ev:9
