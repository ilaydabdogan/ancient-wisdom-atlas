canonical_text:
  quote: ''
  summary: The passage describes the February ceremonial of the 'Hle'wekwe, noting
    its close repetition of the January ceremonial with variations in initiation,
    wall decoration, dress, plaza dances, sword-swallowing, ritual handling of boxes
    and objects, prayers to the six regions, sacred breath, fraternity father-child
    acts, annual variations caused by death, and a connected Kia'la'silo initiation
    ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The February ceremonial is described as a repetition of the January ceremonial
    with slight variation; if no members are received, initiation ceremonies and west-wall
    decorations are omitted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated dress variation includes a white embroidered kilt, white embroidered
    sash, woman's red belt, and fox skin instead of the black breechcloth used in
    January.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At noon two a'mosi of the circle dance enter the plaza by the western street;
    one carries a small purple wicker basket of meal and the other carries the tehl'nawe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leader places the basket in the other bearer's hand, removes notched sticks
    and bones from the boxes, reverses the boxes, deposits the meal basket under the
    larger box, and leaves by the same route.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hlem'mosona appears with the original sword and a sword with a feathered
    handle, repeats sword-swallowing, makes circuits, and performs the swallowing
    at six points or regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the sword-swallowing at the six regions, the 'Hlem'mosona waves the
    swords over the boxes toward the six regions, prays, circles the swords over the
    boxes, brings them to his lips, and inhales what is good in them while musicians
    pray aloud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before 2 o'clock the 'Hle'wekwe assemble in the plaza to dance; women carry
    two eagle-wing feathers in the right hand and a sword in the left, except an expert
    female sword-swallower who carries a sword in each hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the third plaza dance, the leader takes swords from his three fraternity
    children and swallows them successively, then places four swords down his throat
    at once for several seconds before withdrawing them together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the plaza dance, each fraternity father places the end of a sword from
    his own mouth into the mouth of his fraternity child so that the child may live
    to old age and later awake as a little child in Ko'thluwala'wa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The closing outdoor ceremony follows the January form except for noted changes,
    including two men of the Bear clan wearing white buckskins rather than sacred
    embroidered blankets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In January 1897, because of deaths connected to the fraternity and its meeting
    house, there was no plaza dancing, and outdoor sword-swallowing was limited to
    the 'Hlem'mosona and his warrior.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The 1897 indoor arrangement included a man acting as catcher seated in the
    east end of the room with a young girl novice seated on a blanket at his feet,
    while the fraternity stood in two opposing lines.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The ceremony of the order of Kia'la'silo, identified parenthetically as Spruce
    Tree, occurs in February in connection with the described ceremony and for the
    purpose of initiating a member.
  category: sequence
  evidence_refs:
  - ev:8
