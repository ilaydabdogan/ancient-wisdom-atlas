canonical_text:
  quote: ''
  summary: A sequence of Zuñi ritual song stanzas describes emergence from a fourth
    world, carrying a grandchild or great-grandchild on backs, looking to the six
    regions, reaching springs on a road, seeing prairie-dog girls and women enter
    a place below, calling for rains and seeds, invoking a great-grandfather duck
    from an old dance village by mountains, and directing entry and ascent into the
    ki'wi'sine where fathers or rain priests sit calling for rains and seeds.
  language: English with Zuñi-language lines and interlinear glosses
  quote_policy: summarized
