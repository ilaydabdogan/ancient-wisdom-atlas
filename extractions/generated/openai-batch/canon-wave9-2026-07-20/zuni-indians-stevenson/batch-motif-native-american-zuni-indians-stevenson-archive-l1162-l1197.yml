canonical_text:
  quote: '"we are not dead; we live and sing and dance in this beautiful place."'
  summary: The Divine Ones instruct women during a water crossing, restore children's
    webbed fingers and toes, descend toward the lake to look after lost children,
    visit newly created masked gods in Ko'thluwala'wa, hear a message for grieving
    mothers, learn the masks, report back, and the A'shiwi continue their journey
    toward the Middle of the world.
