canonical_text:
  quote: ''
  summary: The passage describes preparation of a Hunters Fraternity altar before
    sunset, including a meal cloud design, mi'wachi, a meal line, and consecrated
    medicine water. It then describes the construction and clothing of Sha'liiko effigy
    personators and attendants. Six Sha'liiko, accompanied by attendants, stop at
    Ant place, where A'shiwanni pray and sprinkle meal over them before the procession
    continues toward the ceremonial ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before sunset, the altar of the Hunters Fraternity is erected at the west
    end of a large room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mo'sona prays over a bowl of meal and forms a cloud design of meal before
    the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The meal cloud design is made with two scallops filled with meal, a line extending
    from between them, and six mi'wachi placed between the two front tablets of the
    altar.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A line of meal is continued down the floor to the ladder and crossed eleven
    times with meal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The maker of medicine water consecrates water with the usual ritual, after
    which the chamber is described as ready to receive the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Sha'liiko effigy is arranged so the wearer steps under a hoop-skirt structure
    and carries it by a slender pole attached to the belt by leather support.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The base of the mask includes a fox skin and a collarette of raven plumes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The personator of the Sha'liiko and his fellow wear deerskin hoods, layered
    shirts, black woven kilts, deerskins, a sash, a woman's belt, yellow-painted bare
    legs, blue-yarn tassels, and dance moccasins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: An ancient stone hatchet with handle and a quantity of prayer meal are carried
    in the belt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: When the Sha'liiko gods come to the village in the evening, the effigies are
    carried by Sha'liiko wor'we rather than by the personators.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Each Sha'liiko personator, his fellow, and other members of the relevant ki'wi'sine
    accompany each effigy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The six Sha'liiko and their attendants stop at Hiil'ona kwi, identified in
    the passage as Ant place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At Ant place they are met by the first body of A'shiwanni, who pray and sprinkle
    meal over the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After the A'shiwanni return to the village, the Sha'liiko run back and forth
    for a time and proceed to the ceremonial ground on the south bank of the river.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The writer notes that she was unable to observe the indoor ceremonies of the
    Sha'liiko gods in 1879.
  category: other
  evidence_refs:
  - ev:6
