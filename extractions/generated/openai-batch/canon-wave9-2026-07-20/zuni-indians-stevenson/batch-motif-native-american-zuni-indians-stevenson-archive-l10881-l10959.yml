canonical_text:
  quote: ''
  summary: 'The passage describes a sequence within the Thla''hewe rain ceremony:
    choral singing and prayers, prescribed seating and clan affiliations, an overnight
    vigil, dawn dressing of eight girls as dancers, paired dances led by women who
    sprinkle meal, removal of the girls'' regalia, the appearance of eight Mu''luktiikia
    who dance and drop six-colored corn, and the A''shiwanni depositing the corn in
    two square excavations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hla'hewe and Sho'ko'we choirs each sing, and after each song a prayer
    is repeated aloud; the Sho'ko'we choir is accompanied by flutists.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mi'laiilapo'na remain in their places and sit on robe- or blanket-covered
    boxes or chairs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The A'wan mosono"kia of the 'Hla'hewe side must belong to the Dogwood clan,
    while the A'wan mosono"kia of the Sho'ko'we side must belong to the Corn clan;
    each has a deputy or younger sister behind her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The 'Hla'hewe side places baskets and te'likinawe on the left, while the Sho'ko'we
    side places them on the right; other baskets and te'likinawe are placed in front
    of the ham'pone and midway.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the songs, the participants remain quiet until morning and are watched
    by elder and younger brother Bow priests so that they do not sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At sunrise eight 'kia'potiikwe come to the ham'pone after having slept two
    nights in the house of the Shi'wano"kia.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four of the eight 'kia'potiikwe are dressed by members of the 'Hla'hewe choir
    and four by members of the Sho'ko'we choir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dancers' attire includes mi'ha coverings, a white cotton fringed sash,
    white buckskin moccasins with black soles, necklaces, dark blue yarn wrist tassels
    tied with red yarn, loose hair with bangs over the face, and a 'hlelh'ponc on
    the head.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each dancer receives two 'hla'we from the mi'laiilapo'na and is led to the
    plaza by the A'wan mosono"kia of the 'Hla'hewe side, who throws meal before her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The 'kia'potiikwe face east while dancing to the accompaniment of the 'Hla'hewe
    choir.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the first dance, each dancer gives her 'hla'we to a mi'laiilapo'na and
    receives two 'hle'we before proceeding to the Sho'ko'we side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Sho'ko'we-side A'wan mosono"kia leads the dancers into the plaza while
    sprinkling meal, and the Sho'ko'we dance includes flute music.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the dances, the girls are stripped of their regalia and return to their
    homes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Eight Mu'luktiikia, described in the passage as certain anthropic gods, arrive
    by the eastern covered way and dance in the center of the plaza.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Mu'luktiikia turn first one way and then another while dropping grains
    of corn in the colors of the six regions from a white embroidered sash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Mu'luktiikia leave by the western covered way after their short appearance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The A'shiwanni gather up the corn dropped by the Mu'luktiikia.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Each shi'wanni drops six grains, one of each six-region color, into each of
    two square excavations.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The northern square excavation was made in the early morning by the Kia'kwemosi,
    and the southern one was made by the pe'kwin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: A note identifies the foremost woman on the north side as representing the
