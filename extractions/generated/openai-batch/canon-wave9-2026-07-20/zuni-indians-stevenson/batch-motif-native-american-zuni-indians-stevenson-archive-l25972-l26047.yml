canonical_text:
  quote: ''
  summary: An ethnographic passage describes a Zuñi ceremonial night and sunrise rite
    involving the Hle'wekwe, novices, et'towe fetishes, music, prayers for cold rains
    and snows, a personified Earth Mother and Sun Father, medicine water with pollen,
    meal offerings for purification and health, and a prayer that the dead may wake
    as little children in Ko'thluwala'wa. A note also mentions the danger sometimes
    associated with sword swallowing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hle'wekwe and dancers leave for the house where the et'towe were placed;
    some intoxicated guests enter the ceremonial chamber and revel, while those associated
    with the fetishes perform their duties seriously.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four et'towe remain side by side in baskets of meal on a ledge on the north
    side of the room, with older women in charge, et'towe-bearers, thlu'sipowe-bearers,
    and Mu'waiye arranged around or opposite them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note states that accidents from swallowing the sword seldom happen, but
    death sometimes results and is attributed to a bad heart or to the person having
    been touched by another.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Hlem'mosona arrives bearing the hle'et'tone, eight Hle'wekwe sit
    east of two boxes and play notched sticks while others group near the boxes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old women lift the four et'towe from baskets and hand them to the et'towe-bearers,
    while the Hlem'mosona hands the hle'et'tone to a woman of the fraternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Et'towe-bearers and two men with bows and arrows form a line facing east;
    two novices stand before the line, also facing east, while wives of fraternity
    fathers stand behind them with hands on their shoulders and keep the shoulders
    in slight motion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Notched sticks and deer-leg bones accompany song and rattle; the et'towe are
    waved downward and not upward because the prayers ask cold rains and snows to
    fall and prepare the Earth Mother for the embrace of the Sun Father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At sunrise the singing ceases; the hle'et'tone, bows and arrows, et'towe,
    and hla'we are returned or carried to their keeping places, and the hle'et'tone
    is laid on a meal-sprinkled ledge in the Hle'wekwe chamber.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Hlem'mosona retrieves eight eagle plumes, shakes pollen from them into
    medicine water, and administers the water from a shell to each household member,
    including infants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each drinker addresses the Hlem'mosona as father, and the Hlem'mosona replies
    by addressing the drinker as child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each person takes meal in the left hand, waves it around the head from left
    to right four times, and throws it on the et'tone for physical purification and
    good health.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Meal is then taken with the right hand and sprinkled on the et'tone so that
    one may not die prematurely but grow old, sleep, and wake as a little child in
    Ko'thluwala'wa, where Zuñis go temporarily after death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Women of the paternal and maternal clans of the novices bring large bowls
    of food, preparing for a feast; at the conclusion of prayers, We'wha addresses
    the assemblage.
  category: sequence
  evidence_refs:
  - ev:6
