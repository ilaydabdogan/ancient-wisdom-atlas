canonical_text:
  quote: ''
  summary: 'The passage describes the closing dawn sequence of a Shu''maakwe initiation
    ritual: two performers sprinkle the altar and four regions, dance with plumes,
    and produce a moment of mirth; women sprinkle meal to the rising sun; men and
    women pray before the altar to the approaching Sun Father; novices enter the sand-painting
    circle, are bathed with sand, and the painting is destroyed; medicine water and
    ritual objects are distributed; novices later plant prayer plumes away from the
    village with their fraternity fathers.'
  language: English
  quote_policy: summarized
