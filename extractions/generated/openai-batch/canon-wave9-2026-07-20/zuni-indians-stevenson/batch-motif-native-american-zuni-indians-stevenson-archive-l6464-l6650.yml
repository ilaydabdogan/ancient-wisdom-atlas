canonical_text:
  quote: ''
  summary: The passage describes ritual handling and transport of an idol of Ahayuta,
    the elder God of War, with associated paraphernalia and offerings; replacement
    of old shrine images; deposition of prayer plumes and other offerings at shrines
    and fields; descriptions of a sun shrine and concretion fetishes; fraternity offerings
    accompanied by flute-playing; and household participation in planting plumes,
    including children and proxy deposits for absent or ill family members.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother Bow priest removes a corn-grain game piece, prepares ritual
    objects, prays before the idol, and places the idol with its adornments and offerings
    into a deep basket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The associate warrior wraps the corn-grain game piece, binds game objects,
    gathers remaining paraphernalia, and later follows the elder brother Bow priest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Both the elder brother Bow priest and his associate leave the house while
    whirling rhombi with their right hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the village procession, people stop the carriers to pray before the
    idol and sprinkle meal upon it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the shrine on U'hana yallanne, the previous year's idol is removed and
    the new one is substituted with its paraphernalia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The idol of the younger God of War is carried similarly to a shrine on To'wa
    yallanne; it is distinguished by a zigzag stick described as symbolic of lightning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A'shiwanni and fraternity officers deposit their te'likinawe at appropriate
    shrines on the fifth day, while others plant theirs in fields.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kia'kwemosi carries the kia'etchine and ha'kwani to the base of Ma'sakia,
    where the kia'etchine is deposited as an offering to the u'wannami A'shiwanni.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pe'kwin alone visits the shrine on the summit of Ma'sakia, and no plume
    offerings are deposited there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sun shrine at Ma'sakia includes a semicircular stone wall, an eastward
    opening, a sandstone slab etched with a sun symbol, side stones with cut lines,
    and arranged concretions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Members of the order of Pa'yatamu of the Little Fire and Cimex fraternities
    play flutes while ascending To'wa yallanne to the To'mapa shrine and depositing
    offerings to the god.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Household members deposit plume offerings in a field excavation, with father,
