canonical_text:
  quote: ''
  summary: After reaching a lake south of present Zuñi, the Gods of War and Ma'we
    stop, while 'Hli'akwa goes farther southwest and makes a home in a high mountain
    guarded by white and black bears. Ma'we makes a home in the lake, and the Gods
    of War choose a mountain rising from the lake. Footnotes mention submerged sacred
    objects, secrecy around 'Hli'akwa's home, and Zuñi pilgrimages for turquoise with
    offerings to the guardian bears.
  language: English
