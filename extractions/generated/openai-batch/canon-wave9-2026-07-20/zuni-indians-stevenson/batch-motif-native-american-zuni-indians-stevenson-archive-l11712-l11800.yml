canonical_text:
  quote: ''
  summary: A ritual-festival passage describes performers representing Navahos entering
    and dancing in two files, a principal pair dancing between the lines, and a comic
    masked figure with American clothing and a pistol. The dancers proceed to a crowded
    ki'wi'sine where girls conceal their faces, a circular opening in the floor is
    exposed as symbolic of the entrance to the innermost world, and food and plumes
    are later deposited there. The masked figure jokes, trades objects, burlesques
    the dancers, and prompts laughter. A young men's choir later selects girls to
    dance, requiring their face wraps to be thrown aside during the dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A party representing Navahos appears after the warriors leave and forms into
    two files.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The principal dancers are two boys, one of whom personates a girl; the girl-impersonator
    wears a black velvet waist, red skirt, red-painted moccasin tips, Navaho-style
    hair, and red cheek spots, while the boy's body is spotted in white.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ant fraternity choir remains quiet during the presence of the parties
    personating Navahos.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy and girl stand opposite one another, run until they almost meet, pass
    one another, turn, and repeat the dance figure between the two lines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The principal pair carry triangular pieces made of slender sticks ornamented
    with white fluffy eagle plumes while dancing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Other members of the party sing in Navaho while the principal pair dances
    between the lines.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Men in the party wear artificial mustaches of black goat's wool; a note states
    that the mustache is worn in ridicule of Navahos.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:8
  text: A ridiculous character appears with the dancers wearing old American trousers
    and coat, an ash-colored mask with a prominent nose, a bushy wig, and carrying
    an old pistol.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: The dancers proceed from the chamber of the Ant fraternity to the Chu'pawa
    ki'wi'sine, which is crowded with girls wearing black wraps over their heads and
    shoulders to conceal their faces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The circular opening in the floor of the ki'wi'sine is exposed and is explicitly
    described as symbolic of the entrance to the innermost world; food and plumes
    are later deposited within it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: In the Chu'pawa ki'wi'sine the dancers again form two files lengthwise down
    the room facing west and dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The masked creature crouches west of the fire altar, moves the pistol violently,
    moves his head in time with his hand, makes jokes, and is joked with by the men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Men of the ki'wi'sine pass lighted cigarettes to the dancers, who smoke socially.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: In dialogue with Nan'nahe, the masked figure says he came from the east, has
    no parents or siblings, knows no work, claims to have killed a sleeping American
    and taken his pistol, trades a ribbon for watermelons, explains a wristlet through
    a comic story, and fails to discharge the pistol correctly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: After the Navaho dancers leave, the masked person is asked to dance, falls,
    burlesques the departed dancers, receives encores, feigns lameness, speaks a few
    words in Hopi, and creates laughter with a ladder mishap and more ridiculous dancing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: A choir of young men sings from the west end of the room; selected girls protest
    being chosen to dance, must throw aside the wrap covering the face during the
    dance, and quickly conceal the face again afterward.
  category: sequence
  evidence_refs:
  - ev:8
