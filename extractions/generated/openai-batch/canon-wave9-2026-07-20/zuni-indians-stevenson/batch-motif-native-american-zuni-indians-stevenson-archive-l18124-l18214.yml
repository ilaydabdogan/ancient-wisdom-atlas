canonical_text:
  quote: ''
  summary: The passage describes formal and informal Zuñi ti'kwane races, including
    bodily preparation with medicines, hair arrangement, ashes, race sticks associated
    with elder and younger Gods of War, betting, the race route, victory gestures
    involving breath, offerings in prayer meal, post-race cleansing, and deposition
    of race sticks and offerings at mountain shrines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Runners remove clothing, put on a light kilt, take Shu'maakwe medicine into
    the mouth, eject it into the hands, and rub it over the body so they will not
    tire while running.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A root called hummingbird medicine is passed around; each runner chews it,
    ejects it into the hands, and rubs the body to be swift like a hummingbird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bow priest folds and wraps the runner's hair into a long knob, places an
    arrow point in the knot, and uses eagle-wing plumes to pass ashes down the sides
    of each racer and sprinkle ashes to the six regions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Medicine may be mixed into the paint used on the race stick, which is red
    for betting races rather than black; some paint may be placed under the right
    index fingernail.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When observers notice a runner keeping his thumb pressed to his finger, they
    infer that medicine is under the nail and may bet heavily on that side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wives of two rain priests go to houses visited by their husbands, and
    parcels including blankets are placed beside each woman for good luck to the runners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Runners are accompanied to the base by managers and bow priests, while crowds
    gather and women remain in the village.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two sticks designate the sides of the elder and younger Gods of War; they
    are made by bow priests, carried to the base, and selected by the opposing side.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each leader places a stick across the foot near the toes, sprinkles it with
    meal, calls readiness, and must manage the stick with the foot rather than the
    hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The race proceeds southward over the road of the Gods of War, turns east,
    crosses the river, goes north along the foothills, recrosses the river west of
    Zuñi, and returns by the southern road to the base.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A member of the successful party who first circles the heap of wagered articles
    is described as the hero of the hour.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: As successful runners circle the wager heap, they extend their hands toward
    it, bring their hands to the mouth, draw in a breath, and go to the manager's
    house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the manager's house, the victor deposits the stick in a basket of prayer
    meal, and those present add offerings of bits of precious beads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The wife of the rain priest takes the victor's hands and brings her clasped
    hands four times before his mouth; each runner receives the repeated hand movement
    and draws breaths.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After prayers, the victor empties the basket contents, including meal, bead
    offerings, and the stick, into a corn husk and carries it home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Each runner drinks warm water as an emetic, rests for the night, and the next
    morning has his head washed in yucca suds and bathes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The stick of the elder God of War and the corn-husk contents are deposited
    at a shrine on Wool mountain, while the stick of the younger God of War and offerings
    are deposited on Corn mountain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Prominent religious positions do not prevent participation in betting races,
    and a Ko'mosonu is named as one of the fleetest and most enthusiastic runners.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: Informal ti'kwane games may involve quickly assembled young men and stakes,
    but little or no ceremony is associated with them.
  category: relationship
  evidence_refs:
  - ev:12
