literal_observations:
- id: obs:1
  text: Members of the A'pialishiwanni and invited guests from other fraternities
    are allowed to be present; guests are formally greeted and seated near the choir
    or on the south ledge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacred meal is placed from corn husks into the left palm, sprinkled on the
    altar, and medicine is taken into the mouth, expectorated on the body, and rubbed
    over the body with the right hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A warrior and another male member carry food from before the altar, each taking
    a pinch of meal from a basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The a'kwamosi makes a cross of meal for the medicine bowl and raises the bowl
    to signal the choir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two attendants who had left the chamber to offer food to the Beast Gods return
    before the medicine water consecration is finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The a'kwamosi sprinkles medicine water on the altar with plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
