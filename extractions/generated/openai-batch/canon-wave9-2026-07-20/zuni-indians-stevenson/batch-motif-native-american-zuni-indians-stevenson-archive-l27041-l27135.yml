  summary: The passage describes invited participants at a Zuñi fraternity ceremony,
    distribution of sacred meal and medicine, preparation of medicine water, offering
    food to Beast Gods, ash sprinkling for people and the six regions, dancing and
    healing, and the departure, decoration, return, and dance of novices.
  language: English
