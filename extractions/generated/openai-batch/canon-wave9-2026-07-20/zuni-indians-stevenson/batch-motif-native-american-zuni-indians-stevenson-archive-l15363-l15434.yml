canonical_text:
  quote: ''
  summary: The passage describes masked and costumed Zuñi ceremonial dancers and gods
    appearing in the plaza, including rain-makers, Na'tashku, O'lolowishkia, Mu'luktakia,
    and He'mishiikwe. It notes mask and tablet imagery associated with rain, clouds,
    lightning, sun, squash blossoms, corn, and rainbow. Ritual officials sprinkle
    sacred meal, collect ears of corn, receive corn from dancers, and offer prayers.
    A note states that Na'tashku was asserted by the Zuñis to have been adopted from
    the Hopi and that the Hopi had an identical mask.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wa'tem'la are described as the first dancers to appear in the plaza, coming
    from a newly dedicated east-facing house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods in the Wa'tem'la group include the u'wannami, Na'tashku, and Na'wisho,
    also called O'lolowishkia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: O'lolowishkia is described as a god supposed to sweeten bread by micturating
    on meal; his penis is represented by a gourd with pendent white fluffy eagle plumes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the Wa'tem'la dance, Ko'mosona approaches O'lolowishkia, prays, and
    sprinkles the mask and artificial penis with sacred meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mu'luktakia wear embroidered kilts, fox skins, bells, corn strings, necklaces,
    and carry a plumed staff and a gourd rattle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The He'mishiikwe follow the Mu'luktakia to the plaza; their dress is similar,
    but their masks are different and surmounted by tablets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The He'mishiikwe tablet imagery is explained as sun disk, squash blossoms,
    corn of different colors, and rainbow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each party of dancers brings ears of corn to the plaza; the A'shiwanni collect
    the corn and carry it into the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A mask note explains bear claws, lightning, cloud houses, eagle down, and
    dragonflies as signs connected with rain, clouds, and the wish for well-watered
    earth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note reports that the Zuñis assert Na'tashku was adopted from the Hopi and
    that a Hopi sketch showed an identical mask.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Kia'kwemosi, his associate, and the Shi'wanni of the West sprinkle the
    Wa'tem'la with meal and pray before returning to the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The pe'kwin, the younger brother Bow priest, and the Ko'pekwin receive ears
    of corn from dancers and repeat long prayers to donors; the Ko'pekwin also receives
    corn from O'lolowishkia.
  category: action
  evidence_refs:
  - ev:9
