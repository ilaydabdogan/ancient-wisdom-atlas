canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence in which a novice joins
    an order through the collection of spruce trees, the selection of a fraternity
    father, the making and medicating of tree-swords, an attempted and demonstrated
    sword-swallowing act, public dances, offerings and prayers for snow, rain, and
    health, and a brief classification of the Great Fire fraternity and its orders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man requested by the 'Hlem'mosona may consent to join the order, after which
    the 'Hlem'mosona selects a director and gives him meal in the left hand for the
    tree-collecting task.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six men of the fraternity accompany the director south of the village to cut
    and bring spruce trees to the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director ascends a tall tree, attaches a single fluffy eagle plume to
    the top branch, and speaks a request concerning the kia'lii'silo, the coming dance,
    and protection from illness when swallowing it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men sprinkle meal at the base of the tree, choose a suitable nearby tree,
    and are supposed to cut it with an ancient stone ax.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One tree is cut for each member of the order and one for the novice; the trees
    are about 3 inches in diameter and 12 to 15 feet high and are carried crosswise
    on the men's backs by forehead ropes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the tree collectors' absence, the 'Hlem'mosona asks the novice whom
    he wants as fraternity father; the novice answers that he does not know, and the
    'Hlem'mosona chooses one.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chosen fraternity father receives a meal package in a corn husk with prayer,
    then distributes pinches of the meal to women of his clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At sunrise the first chip from each tree is cut with the stone ax, and the
    man who will use the tree in the dance fashions the sword at the butt of the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each maker attaches a la'showanne made of turkey feather, eagle plume, and
    feathers from birds of the six regions to the top branch of the tree.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tree director gives root medicine to each maker; they chew it and draw
    their swords through the mouth four times to cover the swords with the medicine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Most of the trees are hung from the rafters; the tree made for the novice
    is laid in the middle of the floor with its sword end pointing west.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: At sunset the fraternity sings, including a song for snows and rains, and
    the fraternity father receives root medicine before leading the novice near the
    ladder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The novice attempts to swallow the sword but fails; the fraternity father
    then swallows the sword.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: On the fifth day the trees are carried to the plaza and the sword ends are
    swallowed during dances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After later ceremonies the trees are carried to a mesa north of the village,
    laid with the sword ends pointing west, sprinkled with meal, and accompanied by
    prayers for snows, rains, and the general health of the people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: When the novice's head is bathed on the fifth morning, the fraternity father
    gives him a small gift such as calico.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Great Fire fraternity is described as having three orders and several
    named divisions, including Sword and Spruce divisions.
  category: relationship
  evidence_refs:
  - ev:7
