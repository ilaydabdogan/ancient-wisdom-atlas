canonical_text:
  quote: ''
  summary: The passage gives plate captions for a Shi'wannakwe altar dry painting
    and masks, then describes a small revered A'wan 'Si'ta or Great Mother image,
    its theft history, guarded custody, ritual manipulation with eagle-wing plumes,
    and bead offerings. It also describes a sacred deerskin with colored pictorial
    writings about the A'shiwi coming to this world and migrating to the Middle place,
    the loss of a second document, and a Shi'wannakwe rainmaking episode during a
    witch-caused drought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plate captions identify a dry painting in front of the altar of the Shi'wannakwe
    and masks of Kok'ko Thlan'na and Mi'toi Asha.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small image, about 10 inches high, is reverenced as A'wan 'Si'ta, translated
    in the passage as Great Mother, and is said to have been held since the organization
    of the fraternity.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fraternity says it once had two such images, but one was stolen and believed
    to have been carried to another pueblo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The remaining Great Mother image is guarded by an old woman of the Eagle clan
    and is normally kept from daylight except when placed by the altar or when offerings
    are made.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A theurgist near the altar moves two eagle-wing plumes with incantations;
    the image appears to catch the plume tips and be raised with their assistance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Offerings to the Great Mother image are strings of precious beads large enough
    to encircle the donor's thumb.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The text reports that the image's guardian brought it out for the writer's
    inspection only after threats from her husband.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The director of the Shi'wannakwe holds in sacred trust a dressed deerskin
    with colored pictorial writings describing the A'shiwi coming to this world, their
    tails and webbed hands and feet, and their migrations from the far northwest to
    the Middle place, identified with present Zuni.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old theurgist claims the fraternity once possessed two such documents,
    but one was carried off by a student from the East; the remaining document is
    kept in a sealed vase except during an annual ceremony when it is shown to fraternity
    members.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Shi'wannakwe is especially revered for bringing rains to Zuni after other
    efforts failed, during a drought said to have been caused by the elder brother
    Bow priest, who was identified as a witch; the calamity was averted by Shi'wannakwe
    songs.
  category: sequence
  evidence_refs:
  - ev:7
