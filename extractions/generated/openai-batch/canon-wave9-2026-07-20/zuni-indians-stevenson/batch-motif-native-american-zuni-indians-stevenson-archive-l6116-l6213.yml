canonical_text:
  quote: ''
  summary: The passage describes Zuñi winter-season ritual preparation of te'likinawe
    or prayer-plume offerings by fraternities, orders, households, and proxy ritual
    parents. Offerings are addressed to gods, celestial bodies, deceased predecessors
    and ancestors, Po'shaiyanki, Beast Gods of the six regions, patron gods, and other
    recipients. The passage records ritual markings and objects such as crosses, serrated
    tops, miniature crooks, corn planters, altars, medicine boxes, and plumes; it
    also describes eight nights of fraternity meetings, healing of the sick, and the
    absence of initiation during this season.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of te'likinawe is offered to the gods with prayers for pure hearts,
    clouds, lightning, rains, and much water in rivers and lakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that impure hearts would make it unreasonable to expect
    the Sun Father to combine with the Council of the Gods in directing the u'wannami
    to favor Zuñi-land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ko'mosona and associates prepare prayer plumes in a room adjoining the
    west ki'wi'sine; the Ko'mosona also has one long te'likinane offered to the Council
    of the Gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of fraternities, except the 'Hle'wekwe in the first-day description,
    gather in ceremonial chambers to prepare te'likinawe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremonial chambers are described as having groups of men, medicine boxes
    beside them, and plumes of many colors lying about.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some Zuñi men belong to more than one fraternity or order and move between
    ceremonial chambers to prepare appropriate offerings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The A'pi'Mashiwanni prepare te'likinawe to the Gods of War and to their predecessors,
    and also prepare offerings for fraternities in which they hold membership.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Members of a mystery medicine order make offerings to the sun, the moon, deceased
    fraternity members, Po'shaiyanki, and Po'shaiyanki's fellow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Offerings to Po'shaiyanki and his fellow have ends cut square across with
    a Greek cross on top, while offerings of the A'shiwanni to Po'shaiyanki are serrated
    on top and described as symbolic of cumulus clouds.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:10
  text: A miniature crook and corn planter, each with la'showanne attached, are grouped
    with offerings to Po'shaiyanki.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: The crook is said to symbolize longevity and is deposited with a prayer to
    grow old, not to die, but to sleep and awake as a little child with the ancients.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: Officers of the mystery medicine order make te'likinawe to the Beast Gods
    of the six regions, to deceased predecessors of the order, and to deceased members
    at large.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Offerings for boys with only involuntary Ko'tikili initiation, and for women
    and girls, are made by fraternity fathers; further rules are given for cases involving
    a woman fraternity parent.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Men make individual offerings to the sun and to ancestors; husbands make offerings
    for wives and children, and gender and age distinctions determine offerings to
    the moon or ancestors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: On the evening of the second day, most fraternities convene with tablet altars
    erected; A'pi'Mashiwanni members go to their respective fraternities as guardians
    of altars and fetishes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The synchronous meetings continue for eight nights, with repeated cycles of
    midnight closings and all-night ceremonies; women and children return home to
    sleep while men sleep in the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The sick are healed during this season, but there is no initiation.
  category: action
  evidence_refs:
  - ev:9
