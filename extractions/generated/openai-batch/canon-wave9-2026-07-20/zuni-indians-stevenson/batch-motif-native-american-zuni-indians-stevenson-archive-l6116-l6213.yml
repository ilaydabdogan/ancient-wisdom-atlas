comparison_claims:
- id: claim:1
  claim: The Greek cross on offerings to Po'shaiyanki is reported by some aged theurgists
    as symbolic of Catholicism, and the note links this to the statement that the
    culture hero was Catholic.
  claim_level: historical_contact
  target: Catholic symbolism in relation to Zuñi ritual marking
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The passage reports an internal or ethnographic explanation and also
    notes avoidance of Mexican speech in the presence of a te'likinane; it does not
    independently establish origin, chronology, or the full history of the symbol.
