candidate_motifs:
- id: motif:1
  label: Prayer-plume offering for rainfall and communal purity
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes te'likinawe offered to the gods with prayers for pure
    hearts, clouds, lightning, rain, and abundant water, and links divine favor to
    moral purity.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is ethnographic description rather than mythic narrative;
    the exchange is inferred from offerings and prayers explicitly described.
- id: motif:2
  label: Seasonal fraternity ritual cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage frames the rites as a busy ceremonial season with multi-day preparation
    and eight nights of synchronized fraternity meetings.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: medium
  cautions: The supplied locator identifies the broader context as winter solstice
    ceremonies; the passage itself emphasizes the season and schedule without restating
    the solstice in the excerpt.
- id: motif:3
  label: Initiatory status governs ritual participation and proxy offerings
  taxonomy_refs:
  - initiation
  basis: Boys with only involuntary Ko'tikili initiation receive offerings through
    fraternity fathers, household offerings vary by status, and the passage notes
    that no initiation occurs during the season.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage describes ritual administration of initiatory status, not
    an initiation ordeal.
- id: motif:4
  label: Offerings to deceased predecessors and ancestors
  taxonomy_refs: []
  basis: Fraternity members, mystery medicine officers, A'pi'Mashiwanni, men, women,
