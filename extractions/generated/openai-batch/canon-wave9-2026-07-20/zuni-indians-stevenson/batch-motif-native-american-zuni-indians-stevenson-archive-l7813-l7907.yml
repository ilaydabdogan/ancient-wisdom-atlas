canonical_text:
  quote: ''
  summary: 'The passage describes the closing act of winter solstice ceremonies, followed
    by arrangements for winter Kok''kokshi/Sha''lako dances: ritual leaders transfer
    wands, appoint Sha''lako personators and Mo''lawe, circulate a plume wand with
    breath and prayers, organize household and inter-ki''wi''sine participation, prepare
    and borrow masks, and make offerings to deceased wor''we for removal of disease.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Sa'ya'hlia leave the ki'wi'sine, objects are removed from the meal
    painting, and the Ko'pekwin gathers the meal and deposits it in a circular hole
    in the floor with a prayer for corn and fruits of the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explicitly identifies the circular floor hole as symbolic of the
    entrance to the undermost, or fourth, world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the day after the winter solstice ceremonies, the chief Sha'lako wor'li
    calls older and important members of his ki'wi'sine to meet at night in his house
    and asks who will take the te'likinano and entertain the Sha'lako.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A volunteer receives the wand, and the wor'li prays for rain, corn, food,
    family health, continued life, and awakening in Ko'thluwala'wa rather than death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wor'li selects a man to serve as elder brother Sha'lako, gives him a feathered
    plume wand, blows breath on it four times, and draws it before the chosen man's
    mouth while praying for right speech, gentleness, goodness, provisions, long life,
    and awakening in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four smaller te'likinawe left by Pau'tiwa are given to the chosen Sha'lako
    personator, who then selects a younger brother Sha'lako and repeats the breath,
    wand, and prayer action for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elder brother Sha'lako passes the wand before the mouths of all men present,
    and at sunrise visits members' houses with the younger brother and passes the
    wand before the mouths of members, including children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the house visits, the elder brother Sha'lako selects four men to act
    as Mo'lawe, described as fruit and seed bearers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife and daughters of the man hosting the Sha'lako dance notify relatives
    by blood, close neighbors, and clan people to come to the house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man of the house breathes four times upon his wand before each guest's
    lips, and the guest inhales what the passage calls the sacred breath or better
    part of the man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the fourth day after Pau'tiwa leaves plumes at the hatchways, the people
    of each ki'wi'sine meet in the house of their chief Sha'lako wor'li to decide
    what dances they will have and what masks they can prepare.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Companion ki'wi'siwe may dance together; guests prepare masks and te'likinawe
    and may choose masks belonging to the ki'wi'sine in which they will dance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ko'yemshi masks are obtained from a man of Eagle clan; seven may be borrowed,
    but the masks of the three officers, Great Father, deputy, and warrior, may not
    be borrowed for this occasion.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Guests carry two eagle-wing feathers and four te'likinawe to be offered to
    deceased wor'we of the ki'wi'siwe with a prayer asking them to take disease from
    the people; the head wor'li receives the te'likinawe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note states that one of the selected men can be expelled and replaced if
    caught fighting, quarreling, or being intimate with any woman except his wife.
  category: other
  evidence_refs:
  - ev:8
