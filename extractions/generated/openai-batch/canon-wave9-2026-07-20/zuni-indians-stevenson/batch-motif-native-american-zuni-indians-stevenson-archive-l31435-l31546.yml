canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence in which the pe'kwin prepares
    meal-covered mounds, a meal line, yucca crosses, and stones as symbolic tracks
    and homes connected with the Gods of War and ants at Shi'papolima. The victor
    and elder brother handle divided scalp pieces, juniper, red pigment, plumes, cigarettes,
    and smoke in the presence of priests, warriors, and the Ant fraternity, followed
    by deposition of cigarette remnants and a public procession with song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An excavation or mound area is covered with white meal; a meal line extends
    eastward and is crossed four times, with X-shaped yucca pieces and flat stones
    placed at the cross lines.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the crossed yucca indicates tracks of the chaparral
    cock to the house of the ant, and explains that the bird can convey messages while
    its footprints obscure direction.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mounds are identified as symbolic homes of the Gods of War, and the square
    is identified with the home of ants at Shi'papolima; ants are said to destroy
    Zuñi footprints from enemy sight.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The victor and the elder brother approach over the plain carrying divided
    scalp pieces, remove the pieces from arrows, attach them to a planted pole, sit
    facing the village, and trim juniper twigs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warriors and members of the Ant fraternity gather nearby; each warrior plants
    two prepared prayer plumes to the Gods of War on an ant-hill before joining the
    group.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The victor and elder brother bore holes through scalp portions, use buckskin
    thongs, attach smaller scalp pieces to larger ones, tie the pieces to juniper
    twigs with eagle plumes, and rub red pigment on stripped twig ends.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pa'mosona and his vice twirl juniper bark in the faces of the victor and
    elder brother, then go north and throw the bark away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A social smoke is held; the arrival of the pe'kwin, the Shi'wanni of the West,
    and the elder brother Bow priest closes the gathering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder brother Bow priest gives feather-surrounded red reed cigarettes
    to the victor and elder brother, and the passage states that these cigarettes
    and plumes are afterward offered to the Gods of War.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Shi'wanni of the West lights rolled cotton by striking flint; the pe'kwin
    lights cigarettes from the burning cotton, the group smokes, and remaining cigarette
    bits are later deposited in a ceremonial chamber basket tray for eight days before
    attachment to images of U'j'uyewi and Ma'sai'lema.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mounted men and pedestrians gather around the meal-covered mounds; the A'pi'lâshiwanni
    and the Ant fraternity, preceded by the victor, elder brother, and elder brother
    Bow priest, advance with measured steps while singing a refrain about rain priests
    coming.
  category: sequence
  evidence_refs:
  - ev:7
