canonical_text:
  quote: Mother, I am going to the other world.
  summary: The passage describes We'wha's illness and death after preparations for
    a Sha'lako ceremonial. It includes family attendance at the deathbed, a theurgist's
    treatment, preparation and use of prayer plumes, We'wha's final speech about going
    to the other world and speaking to the gods, her death while holding the plumes,
    and the initial bathing, meal-rubbing, and dressing of the body.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: We'wha is described as a Badger clan member, adopted by her father's sister,
    known for memory, prayer recitation, graces over feasts, physical strength, and
    strict expectations of household labor.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the fall of 1896 a Sha'lako god was entertained at We'wha's home, and We'wha
    did much of the preparatory work despite heart disease, including laying a stone
    floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the Sha'lako ceremonial, We'wha was found crouching by the fireplace;
    death was described as approaching, and she said she could not breathe if she
    lay down.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: We'wha's family remained with her and attended to her; children stopped playing
    and asked her to speak.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nai'uchi came three times and was said to draw bits of mutton from the region
    of We'wha's heart, declaring them to have been shot there by an angry witch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After Nai'uchi's last visit, We'wha's foster brother prepared te'likinawe,
    or prayer plumes, for the dying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: We'wha said she was going to the other world, would tell the gods of named
    friends, and asked the writer to love and protect her people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the usual custom is for a family member to hold prayer
    plumes near the mouth of the dying and repeat the prayer, but We'wha instead held
    the plumes herself and attempted to speak.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: We'wha died while clasping the prayer plumes, as the setting sun lit the western
    windows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After death, blankets were spread on the floor, the body was laid on them,
    bathed, rubbed with meal, and dressed with white cotton trousers.
  category: action
  evidence_refs:
  - ev:7
