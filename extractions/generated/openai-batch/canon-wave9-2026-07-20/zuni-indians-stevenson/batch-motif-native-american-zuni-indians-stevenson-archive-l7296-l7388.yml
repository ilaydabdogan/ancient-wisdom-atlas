canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi ceremonial sequence: participants arrange
    firebrands and a meal line at Ku''shilowa, bury te''likinawe/plume offerings,
    pray for rain, snow, warmth, crops, seeds, and raiment, clean houses and deposit
    sweepings and ashes in fields with spoken return formulas, sing and dance in the
    ki''wi''sine, purify the fire tender with yucca suds, and distribute te''likinawe
    to persons selected for ritual offices and god-personation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party goes to Ku'shilowa, where the fire tender and Kwe'lele place burning
    brands, the Ko'pekwin draws a meal line between them, and named participants take
    positions while facing east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants grouped at the back sprinkle meal on the gods and draw in sacred
    breath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The te'likinawe are placed in a circular excavation made by Pau'tiwa's ceremonial
    father, who later covers the offerings with earth and leaves no trace of the excavation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Plume offerings are made to named divine or ceremonial recipients, and prayers
    ask for rain, snow, warmth, abundance of seeds and fruits, and raiment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Families begin house cleaning; female family members deposit sweepings and
    ashes with live coals in fields, address them with return-in-one-year formulas,
    sprinkle meal, and later deposit te'likinawe in the fields.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the party returns to the ki'wi'sine, the Great Fire fraternity sings
    with rattle and drum while four Sa'ya'hlia, Shits'ukia, and Kwe'lele dance until
    after sunrise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kwe'lele extinguishes his firebrand at Ku'shilowa, brings it back to the ki'wi'sine,
    and after sunset deposits it on the road to Ko'thluwala'wa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A paternal aunt or woman of the father's clan washes the fire tender's head
    with yucca suds and bathes his body for purification and longevity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pe'kwin selects te'likinawe and presents each separately to the elder
    brother Bow priest with a repeated kinship-address formula.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each offering corresponds to the god a chosen person is to personate; receipt
    of te'likinawe indicates selection for an office and requires the person to repair
    to the ki'wi'sine.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
