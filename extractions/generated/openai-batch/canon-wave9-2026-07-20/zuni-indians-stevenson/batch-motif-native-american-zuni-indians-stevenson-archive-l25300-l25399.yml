canonical_text:
  quote: ''
  summary: 'The passage describes sequential ceremonial actions in a Zuñi plaza and
    ceremonial chamber: et''towe-bearers depart and return; musicians pray and draw
    breath from bones, notched sticks, and meal; the Hle''wekwe appear in ritual paint
    and regalia; a drummer, female leader, officers, and dancers process around the
    plaza; fraternity members swallow swords during the dance, including repeated
    and multiple sword-swallowing; after an early morning dance they gather around
    a sand painting of A''chiyula''topa, draw breath near it, and a female member
    erases the figure from the four cardinal points toward the center.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the music ceases, the party leaves the plaza in single file by the western
    way; the bearer of 'hle'ettone and two men with bows and arrows return to the
    ceremonial chamber of the 'Hle'wekwe, while others go back to the house from which
    they came.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the et'towe-bearers leave the plaza, musicians draw bones lightly over
    notched sticks, bring the bones to their mouths, draw a breath from them, repeat
    a prayer aloud, and return the bones to the box.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small basket of meal is removed from under the larger box; each man offers
    or repeats a prayer and draws breath from the basket, described as inhaling all
    that is good from the meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The et'towe and bows and arrows are brought again to the plaza; the 'hle'et'tone
    is carried by another girl, the bows and arrows are held by others, and one additional
    musician is at the boxes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the et'towe-bearers leave, the 'Hle'wekwe appear with nude bodies, yellow
    paint on scapulae, breasts, forearms, hands, feet, and lower legs, black wool
    kilts embroidered in blue, yucca wreaths, and hair tied at the back with a red
    garter.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The 'Hlem'mosona wears white clothing and distinctive feathers; members of
    the order of Mystery medicine from other fraternities wear a reddish eagle plume,
    others wear only a white plume, and males wear bow wristlets.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The drummer of the 'Hle'wekwe, identified as a warrior to the fraternity,
    precedes the female leader and takes a position on the east side of the plaza.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The female leader carries the mi'li of the fraternity and a basket of meal
    in her left hand and sprinkles meal before her with her right hand as she advances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The procession enters the plaza from the western street; the dancers pass
    south of the boxes and continue around by east, north, and west, making a complete
    circle before sword swallowing begins.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Dancers carry rattles in the right hand and swords with feathered handles
    upward in the left hand, while musicians play notched sticks and fraternity members
    sing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The 'Hlem'mosona steps from the line south of the boxes, dances before them,
    faces east, and runs a sword once down his throat while the dance continues.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Other dancers repeat the sword swallowing; some men place two, three, or four
    swords in their throats at the same time, and one woman swallows two swords at
    once.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each fraternity father is followed by his children; if a child does not put
    the sword down the throat until only the handle is exposed, the fraternity father
    takes and swallows the sword, and he also swallows swords for juvenile members.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the third circuit the sword-swallowing form changes so that two or three
    participants step from the circle in close succession and swallow their swords.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the early morning dance, the 'Hle'wekwe return to the ceremonial chamber,
    group themselves around the painting of A'chiyula'topa, place their hands near
    the figure without touching it, bring their hands to their lips, and draw breath.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A female member erases the A'chiyula'topa figure by brushing sand from the
    four cardinal points to the center with a tepi, then brushes the sand into her
    left hand and deposits it in a blanket on a male member's left arm.
  category: action
  evidence_refs:
  - ev:8
