canonical_text:
  quote: '"We will open the gates that you may pass over the earth and eat the grass
    of the earth."'
  summary: 'The passage recounts Shits''ukla making a night fire and feeding assembled
    gods, then summoning cougar, bear, lynx, and coyote to choose and pursue food
    from an enclosed game house. The outcomes explain animal diets and fetish feeding:
    cougar takes deer, lynx takes rabbit, bear is assigned medicine, and coyote is
    assigned blood. Pau''tiwa and Shits''ukla release the game animals over the earth,
    while the Kwal''ashi are transformed into ravens. The passage then describes ceremonial
    corn distribution and a water-drinking rite with named abstainers whose drinking
    would cause the Council of the Gods to withhold water from the earth.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Shits'ukla made a great fire at night, threw corn into it, and gods from Ko'thluwala'wa
    came and ate corn and meat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shits'ukla summoned cougar, bear, lynx, and coyote, and asked each what food
    he wanted; cougar, bear, and coyote wanted deer, while lynx wanted rabbit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The group went to a deer house surrounded by a great stone fence, and Shits'ukla
    told them not to speak loudly near the gate.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Shits'ukla addressed the deer as his children, asked whom he should kill,
    and a deer replied that he should kill it and came out through the gate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cougar caught the deer on his second attempt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bear failed to catch a deer because he could hardly see; Shits'ukla told
    him he would remain a warrior but would no longer eat deer and would eat only
    medicine.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: The lynx caught and ate the rabbit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The coyote had fallen asleep, failed to catch the deer, and was told he would
    eat only blood; the passage connects this with the coyote fetish being dipped
    in deer blood and with cougar and bear fetishes also eating deer blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pau'tiwa and Shits'ukla told the game animals they would leave the stone house,
    pass over the earth, eat grass, have young, and be killed and eaten when food
    was needed, while their other selves would live in Pau'tiwa's house.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the Kwal'ashi noticed the released game, Shits'ukla spat medicine over
    them, and they all turned into ravens and flew away croaking.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: During the ceremony, corn was collected and thrown to the people; Kwe'lele
    held yucca in his left hand, and Shits'ukla and his associate hooted over the
    roof of the ki'wi'sine before distribution.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Water collected on the fourteenth day was drunk the following afternoon, dipped
    with a shell, and accompanied by the exchange of the words rendered as father
    and brother.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Pau'tiwa, Shits'ukla, Kwe'lele, and the four Sa'ya'hlia did not drink the
    water because, if they did, the Council of the Gods would refuse to water the
    earth.
  category: relationship
  evidence_refs:
  - ev:10
