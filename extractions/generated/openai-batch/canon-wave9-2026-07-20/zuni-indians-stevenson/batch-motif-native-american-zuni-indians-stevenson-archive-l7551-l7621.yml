candidate_motifs:
- id: motif:1
  label: etiology of animal diets and fetish feeding
  taxonomy_refs: []
  basis: The passage explains why cougar takes deer, lynx takes rabbit, bear eats
    medicine, coyote eats blood, and why certain animal fetishes are fed or dipped
    in deer blood.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a passage-level motif label; no exact supplied taxonomy family
    matches the detailed dietary etiology.
- id: motif:2
  label: release of game animals from enclosure to populate the earth
  taxonomy_refs: []
  basis: Pau'tiwa and Shits'ukla open the gates of the game enclosure so game can
    pass over the earth, eat grass, and have young.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames the release in relation to game animals and food, not
    as a general world-creation episode.
- id: motif:3
  label: reciprocal relation between released game, human food, and animal other selves
  taxonomy_refs:
  - sacred_exchange
  basis: The released game will have young and, when food is needed, will be killed
    and eaten, while their other selves will come to live in Pau'tiwa's house.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage describes a ritualized
    relationship of food and return but does not use a formal exchange term.
- id: motif:4
  label: transformation of objecting people into ravens
  taxonomy_refs:
  - shapeshifter
  basis: After the Kwal'ashi ask who let out the game, Shits'ukla spits medicine over
    them and they become ravens.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The transformation is imposed on a group; the available taxonomy term
    'shapeshifter' may imply voluntary or recurrent transformation, which is not stated
    here.
- id: motif:5
  label: ritual fire-feeding of gods
  taxonomy_refs:
  - sacred_exchange
  basis: Shits'ukla makes a great fire, throws corn into it, and gods come from Ko'thluwala'wa
    to eat corn and meat.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The sacred-exchange classification is cautious because the passage states
    divine feeding but does not explicitly state a return gift in this scene.
- id: motif:6
  label: ritual water abstention linked to divine watering of earth
  taxonomy_refs: []
  basis: Named figures do not drink the ritual water because their drinking would
    make the Council of the Gods refuse to water the earth.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is extracted as a local ritual pattern rather than matched to a supplied
