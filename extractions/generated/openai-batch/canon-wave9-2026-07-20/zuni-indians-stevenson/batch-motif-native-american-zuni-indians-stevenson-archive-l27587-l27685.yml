canonical_text:
  quote: ''
  summary: 'The passage describes a Great Fire fraternity ceremony: male and female
    members are dressed and adorned for ritual dancing, a woman with a meal basket
    leads them to the plaza, they circle boxes associated with the Hle''wekwe fraternity,
    dance and sing, swallow swords in ordered groups facing directions, and the ''Hlem''mosona
    prays, collects the swords, motions them to the six regions, and redistributes
    them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremony is stated to be the same as one described at the close of the
    initiatory ceremonies of the order of O'naya'nakia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male members receive black, white, and yellow body paint; the chin painting
    is described as symbolic of rain clouds with falling rain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Male members wear dance moccasins, bead necklaces, hair bindings, a yucca
    head wreath, eagle-tail feathers, and other feather ornaments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male dancers carry rattles in the right hand and swords in the left, with
    specified exceptions for office-holders.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hlem'mosona, Ko'mosona, and pa'mosona each have a serpentiform sword
    that is said to denote lightning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Female members wear ordinary dress with moccasins, a folded mi'ha, turquoise
    earrings, necklaces, an eagle plume on the forelock, a sword in the left hand,
    and two eagle-wing plumes in the right hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A woman carrying a meal basket leads the dancers in single file through the
    southeastern covered way to the plaza and around the place where prayer plumes
    had been deposited the previous night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Great Fire fraternity joins the line of the Hle'wekwe fraternity, whose
    members have completed their dance and are retiring from the plaza.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Great Fire fraternity members pass once around the Hle'wekwe boxes before
    dancing; musicians on notched sticks sit with bowed heads and do not play.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each dance begins with a shout and continues with song while dancers encircle
    the boxes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The 'Hlem'mosona steps out first, the dancers stop and begin again together,
    the swords are reversed, and the 'Hlem'mosona waves his serpentiform sword over
    the boxes and prays.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After praying, the 'Hlem'mosona swallows his sword; other groups then leave
    the circle and swallow swords, including some who swallow two swords and one who
    swallows three.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: Groups of sword-swallowers face north, west, south, east, and eastward for
    the zenith and nadir.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Great Mother of the fraternity swallows two swords at once.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The dancers circle the boxes five times, swallowing swords each time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The 'Hlem'mosona collects the swords, stands in the center facing east, prays,
