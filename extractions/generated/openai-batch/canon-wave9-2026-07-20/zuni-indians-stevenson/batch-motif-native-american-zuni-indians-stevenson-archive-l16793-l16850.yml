canonical_text:
  quote: ''
  summary: 'An ethnographic account describes Zuñi childbirth and immediate postnatal
    care: prayers for the infant’s long life and health, a line of meal symbolizing
    a straight life path toward divine blessings, ritual placement on sand beds with
    corn and coverings, the mother’s postpartum bed and meal, the infant’s first vigorous
    cry, sunrise bathing with water and ashes, wrapping in warmed cloths and blankets,
    treatment of the mother, and attempts to nurse the infant.'
  language: English
  quote_policy: summarized
literal_observations:
