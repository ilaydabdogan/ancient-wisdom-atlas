  text: The east-to-west line of meal is explicitly described as symbolic of the straight
    path the child must follow to receive blessings from A'wonawil'ona and the Sun
    Father.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child was laid on the sand bed, with a single ear of corn placed at its
