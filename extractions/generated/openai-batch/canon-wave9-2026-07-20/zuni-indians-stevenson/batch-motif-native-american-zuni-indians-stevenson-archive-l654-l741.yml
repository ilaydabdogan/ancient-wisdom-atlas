canonical_text:
  quote: ''
  summary: The passage recounts the creation of the A'shiwi in the undermost world,
    the creation of two sons of Sun Father from foam and rays, their commission to
    descend with sacred implements, their production of fire and light in the dark
    lower world, and the ascent of the A'shiwi through successive underworlds by means
    of directional trees into the outer world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shi'wanni and Shi'wano"kia are named as parents of the A'shiwi, who are said
    to have been created in the undermost world and born as infants in rapid succession.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yatokia, identified as Sun Father, creates two sons, Kow'wituma and Wats'usi,
    by impregnating two bits of foam with his rays.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kow'wituma and Wats'usi ascend to their Sun Father over a road of meal made
    by throwing meal upward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sun Father gives each Divine One a rainbow, lightning arrows, and a cloud
    shield, then directs them to go to the undermost world and bring his children
    to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Divine Ones rend the earth with lightning arrows and descend into the
    fourth world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The undermost world is described as dark; the people cannot see one another,
    step on one another's toes, live in holes in the earth, and eat seed grass.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kow'wituma makes fire by rubbing an arrow on a bow over dry grass, lights
    the grass as a torch, and carries it among the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some people cannot look at the fire, and others fall back in fear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Divine Ones throw out lines of meal that produce light and guide them
    to the north, west, south, and east.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
- id: obs:10
  text: At each direction the Divine Ones cut a named tree with stone knives and plant
    it so the people may ascend to a higher world.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
- id: obs:11
  text: The A'shiwi first see the faintest light of day in the first world, then ascend
    to the outer world, called the light-of-day place.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The place of coming through is described as an opening in the earth that had
    been filled with water; the water disappears and leaves a clear passage.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: During the ascent, the Divine Ones and A'shiwi spend time in each world; some
    A'shiwi are left behind and struggle after the others, and constant rainfall occurs.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The outer world is reached just as the Evening Star rises above the horizon.
  category: sequence
  evidence_refs:
  - ev:11
