canonical_text:
  quote: ''
  summary: 'The passage describes a sequence after a scalp ceremonial: idols are taken
    to a ceremonial chamber while warriors sing overnight; the scalp is removed from
    a pole and placed in a pottery vase in the scalp house with offerings; red bread
    is prepared under special restrictions; other offerings are deposited at a named
    place; at daylight the victor and his elder brother deposit the idols of U''yuyewi
    and Ma''sai''lema at their respective shrines, in accordance with a remembered
    designation by the Sun Father of northern and southern territories divided by
    the road of day.'
  language: English
  quote_policy: summarized
