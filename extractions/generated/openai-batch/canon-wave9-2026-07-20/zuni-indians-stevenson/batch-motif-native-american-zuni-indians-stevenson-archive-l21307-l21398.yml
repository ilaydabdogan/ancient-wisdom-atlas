canonical_text:
  quote: ''
  summary: The passage describes several Zuñi medical cases involving prayer, fetish
    medicines, bodily application of medicine, appeals to Beast Gods of the four regions,
    fraternity curing ceremonies, a witchcraft accusation and trial connected to a
    girl's illness, and Na'iuchi being summoned to treat a comatose infant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A theurgist prayed quietly, placed a fetish in a basket, mixed small quantities
    of medicine from two bags into cold water with a hollow reed, and gave the patient
    six swallows through the reed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine was applied in four perpendicular lines over the patient's chest
    and down the lymphatics, and both ears were touched with the medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The theurgist continued praying while touching the fetish and medicine bags
    to the patient's right shoulder, head, and left shoulder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the first four days the patient's diet was restricted, the Beast Gods
    of the four regions were appealed to, and fetish medicines were used.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sick man's body was often exposed to the waist and he was sometimes left
    without fire in rainy and cold weather.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The patient was carried through snow to his mother's house, where Na'iuchi
    and others of the Little Fire fraternity were called to cure him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the fourth and last night of Little Fire fraternity ceremonies, the
    patient reported improvement and later began to recover, though his cough remained.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A young girl's family attributed her illness to witchcraft, summoned a prominent
    theurgist, and brought an accused wizard to trial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The girl rolled, tossed, pulled at her hair and throat, moved her arms and
    legs violently, and was gently held on the pallet by family members.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The writer prepared liquid nourishment, which was given to the girl from her
    mother's mouth in small quantities; the girl's condition improved after the menses
    appeared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The writer could not discover that any medicines other than fetishistic medicines
    were administered to the girl.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: An elderly woman summoned Na'iuchi to the bedside of her dying grandchild,
    an eighteen-month-old infant lying comatose on a pallet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Na'iuchi sat at the left of the infant, manipulated the whole body with special
    attention to the stomach and abdomen, kept the child covered, and the child soon
    wailed and groaned.
  category: action
  evidence_refs:
  - ev:10
