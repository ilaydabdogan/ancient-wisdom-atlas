candidate_motifs:
- id: motif:1
  label: Fraternity initiation sequence for a novice
  taxonomy_refs:
  - initiation
  basis: The passage includes a novice being served first, seated on a blanket-covered
    box, and receiving a gift blanket with a sun emblem from the fraternity father
    while an attendant stands behind him.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage is a ritual description and does not provide a full initiation
    myth; the motif is identified from ceremonial actions involving the novice.
- id: motif:2
  label: Ritual map with central homeland as world center
  taxonomy_refs:
  - world_center
  basis: The dry painting assigns surrounding regions to the four sides and places
    the Zuñi country on the central corn-pollen line, explicitly described as the
    heart and center of all.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives an internal symbolic gloss; broader cosmological interpretation
    should be reviewed by a specialist.
- id: motif:3
  label: Sacred breath drawn from ritual trees
  taxonomy_refs:
  - sacred_tree_axis
  basis: The 'Hlem'mosona draws the two trees before each dancer's face so that each
    dancer draws sacred breath, or all that is best, from them.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage supports sacred trees and breath-transfer, but it does not
    explicitly identify the trees as an axis.
- id: motif:4
  label: Blemish on sacred image as omen of death
  taxonomy_refs: []
  basis: A defect in the dry painting is interpreted as foretelling death for the
    people associated with the line near the blemish.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The omen is described within this specific ceremonial context; no external
    comparison is made.
- id: motif:5
  label: Fertility power collected from ritual image materials
  taxonomy_refs: []
  basis: Participants collect pollen from the hearts of the painted figures as medicine
    for fecundity and collect corn grains for special planting.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage explicitly states fecundity for the heart pollen, but does
    not explain the full theology of the practice.
- id: motif:6
  label: Offering at the sacred place of a founder's disappearance into earth
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer plumes and meal are deposited with prayers to Na'ke'e at a concealed
    sacred excavation where he is supposed to have disappeared into the earth.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage supports offering and prayer at a sacred site; the taxonomy
    link to sacred exchange is cautious.
- id: motif:7
  label: Ritual fire-handling display
  taxonomy_refs: []
  basis: The ceremony includes an elaborate display of playing with fire on the third
    night in the Great Fire fraternity context.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not support the separate motif family of world-destroying
