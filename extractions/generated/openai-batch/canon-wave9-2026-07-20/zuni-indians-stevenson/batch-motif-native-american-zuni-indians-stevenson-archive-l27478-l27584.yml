canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Great Fire fraternity ceremonial sequence:
    placement of two small trees, dancing, sword swallowing, fire play, creation and
    inspection of a dry painting, ritual use of the trees for sacred breath, offerings
    at a sacred excavation associated with Na''ke''e, collection and disposal of painting
    materials, and a novice''s reception of a blanket bearing a sun emblem.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two small trees are placed on the roof at midnight, one west and one east
    of the hatchway crossbar, with face symbols turned east until the close of the
    fifth day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the trees are positioned, eight officers stand around them while the
    Hutist plays, the warrior whirls the rhombus, and the 'Hlem'mosona prays and sprinkles
    meal on the trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremonial includes continuous dancing and sword swallowing on the second
    and third days and an elaborate display of playing with fire on the third night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth afternoon, a square dry painting is made on the floor near the
    altar using yellow sand and hand measurements.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The four sides of the painted square are said to symbolize surrounding regions,
    and the central corn-pollen line is said to symbolize the Zuñi country as the
    heart and center of all.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two human figures in the painting represent Na'ke'e, the original director
    of the Great Fire fraternity, and his fellow or younger brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The painting includes zigzag lightning lines, war-pouch markings, corn-pollen
    hearts, eagle-wing feathers, garter lines, and crosses with corn grains indicating
    stars.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When completed, the painting is protected with stones, crossed wood, and a
    white embroidered blanket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night the 'Hlem'mosona uncovers the painting; a blemish near the central
    pollen line is interpreted as danger of death for his people, while a blemish
    near another line is interpreted as danger for the people of that indicated country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sword order forms in line, and the 'Hlem'mosona draws the two trees before
    each dancer's face so that the dancer draws sacred breath, or all that is best,
    from them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the tree-breathing rite, the Sword division dances and swallows swords,
    the novice is served food, and all present then partake of food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At midnight the 'Hlem'mosona deposits prayer plumes and sprinkles meal in
    a concealed excavation with prayers to Na'ke'e.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The excavation site is described as especially sacred because Na'ke'e is supposed
    to have disappeared into the earth there, and restrictions are placed on sitting
    near the ladder and roof above it when the fraternity is in the plaza.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the fifth day, pollen from the central line and pollen from the hearts
    of the painted figures are collected; the heart pollen is considered good medicine
    for fecundity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Corn grains from the painting are sought, planted apart from other corn, and
    the resulting corn is kept for planting the following year.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After altar objects are removed, meal and sand from the painting are gathered
    into a bowl and deposited in the river.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the 'Hlem'mosona leaves the chamber, the novice sits on a blanket-covered
    box while the fraternity father places a gift blanket with a sun emblem over his
    shoulders and the wife stands behind him with hands on his shoulders.
  category: action
  evidence_refs:
  - ev:10
