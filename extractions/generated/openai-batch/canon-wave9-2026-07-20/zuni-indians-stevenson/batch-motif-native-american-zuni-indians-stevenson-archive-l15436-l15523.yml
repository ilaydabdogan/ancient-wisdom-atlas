  summary: The passage describes plaza performances involving the Galaxy/Ne'wekwe
    fraternity, Ko'yemshi, willow switching, a Bow priest's directional gesture, returning
    dancers carrying food, and the arrival of Bi'"si'si to announce the mo'lawe, with
    a ki'wi'sine altar containing fire, meal, medicine water, and field fetishes.
  language: English
