  summary: The passage describes a ceremonial installation of elder and younger brother
    Bow priests. A meal painting is made at sunrise, participants stand in prescribed
    positions, the Kia'kwemosi and others instruct and pray over the novice, breath
    is placed on clasped hands, the novice prays to the Sun Father and Gods of War
    for rain and communal welfare, and the text notes that no prayer is directed toward
    enemies.
