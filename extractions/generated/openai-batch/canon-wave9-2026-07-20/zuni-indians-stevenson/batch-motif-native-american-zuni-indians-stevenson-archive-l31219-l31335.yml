canonical_text:
  quote: ''
  summary: 'English ethnographic description of a Zuñi ceremonial initiation into
    the Bow priesthood/A''pi"lashiwanni: eligibility through war trophies, continued
    use of stored scalps after scalping ceased, appointment of ritual personnel, an
    ant-hill shell offering with prayers to the Sun Father, War Gods, ants, and named
    powers, followed by a staged rifle-firing return toward the pueblo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage identifies two festivals of the organization: a scalp ceremonial/initiation
    of a victor into the A''pi"lashiwanni and an annual harvest dance described as
    thanksgiving for crops.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Killing an enemy alone is described as insufficient for membership; the victor
    must bring a scalp and at least part of buckskin apparel as proof of prowess.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After scalping had virtually ceased, the scalp ceremonial was still held every
    three or four years by command of the elder brother Bow priest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated reasons for continuing the ceremonial are to please the Gods of
    War so they will intercede for rain and to prevent the organization from becoming
    extinct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When regular procedure is no longer possible, the elder brother Bow priest
    selects a desirable man and initiates him into the A'pi"lashiwanni using scalps
    kept in a scalp vase.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each victor has a member of the A'pi"lashiwanni appointed to accompany him
    throughout the ceremonial as elder brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder brother Bow priest chooses two warriors and two men of the Coyote
    clan to personate warriors preceding the victor; these men are called pa'sewikla.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Scalp-washers and scalp-kickers are appointed, with numbers depending on the
    number of scalps; an odd number leads to division of a scalp with an archaic stone
    knife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the ritual organization uses a complete dual system
    when an odd number occurs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Scalp-washers must be paternal uncles or nearest paternal male relatives,
    while scalp-kickers must be paternal aunts or nearest paternal female relatives,
    with grandparents excluded.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the evening after selection, the pa'sewikla leave the pueblo on horseback
    with rifles, spend the night north of the village, return at sunrise, and dismount
    at the first ant-hill.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At the ant-hill, two warriors hold eight olive shells each, while the other
    two hold strings of shell beads; shells are held near the mouth before the prayer
    and deposit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A whispered prayer invokes the Sun Father, the War Gods of the six regions,
    and the ants, and repeatedly states that shells are given.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The prayer names color categories of ants and A'hayuta, refers to homes covered
    with mountain tops, and asks for war powers in an encounter with an enemy.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: After the prayer sequence, the men fire rifles in repeated stages, stopping
    after short advances while a spokesman utters set words, then proceed toward the
    north side of the pueblo.
  category: sequence
  evidence_refs:
  - ev:13
