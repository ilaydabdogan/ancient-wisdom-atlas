canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi ceremonial actions at caves, mountain shrines,
    a lake, and a spring: offerings of te''likinawe, beads, plume offerings, kia''etchine,
    food, fire sticks, prayers for rain, tortoise gathering, references to tortoises
    as otherselves, sacred water connections, and a wood-friction sacred fire rite
    governed by a rain-related taboo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the Ko'mosona and party are in a cave, personators of the Council of
    the Gods and Sha'lako deposit te'likinawe at a shrine on a mountain summit to
    the west.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mountain shrine is described as containing many precious beads, many te'likinawe,
    and scattered plume offerings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ko'yemshi make offerings at a shrine on their mountain and come over the
    trail singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both parties gather on a hill east of the lake; the Ko'mosona and Ko'pekwin
    remove clothing, tie their hair, secure necklaces, and hang sacks from their necks
    for tortoises.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Great Father Ko'yemshi gives a kia'etchine to the Ko'pekwin, and the director
    of the Hunters fraternity gives one to the Ko'mosona.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the ground is marshy, the Ko'mosona and Ko'pekwin approach the lake
    on hands and feet and deposit weighted kia'etchine in the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kia'etchiwe are offered to the Council of the Gods with prayers for rain
    and for tortoises, called otherselves, to come out through their doors.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Four holes in the walls of the lake are said to be the home of the tortoises.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ko'pekwin deposits old mud-coated, notched fire sticks made from broken
    giant yucca stalks into the lake and prays for much rain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Members of the party plant four te'likinawe to their ancestors and later deposit
    food near the lake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who will personate the Council of the Gods and Sha'lako in the coming
    autumn offer prayers at the lake that they will repeat at the Sha'lako festival,
    then dance on the south side of the lake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the morning the Ko'mosona, Ko'pekwin, and two Ko'pi'lashiwanfli return
    nude to the lake, gather cat-tails, and distribute them; the pe'kwin also retrieves
    the fire sticks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before departure for the lake, the Ko'mosona sends most of the party for tortoises
    with the words, “Go, look for our otherselves.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Only members of the Hunters fraternity may strike the tortoise with the rabbit
    stick; others pat the tortoises until the head is projected and then tie a string
    around the neck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A spring called the house of the deer is associated with tortoises and deer
    and is said to have an underground passage to the lake.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ko'thluwala'wa is said to be connected with all sacred springs and lakes by
    underground roads.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: After returning from the lake, participants make sacred fire by wood friction
    using cedar fiber and fire sticks while arranged in a broken circle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Breath must not be blown on the ignited fiber, because this would offend the
    Council of the Gods and there would be no rain; the burning fiber is thrown into
    the spring with a prayer for rain.
  category: speech
  evidence_refs:
  - ev:10
