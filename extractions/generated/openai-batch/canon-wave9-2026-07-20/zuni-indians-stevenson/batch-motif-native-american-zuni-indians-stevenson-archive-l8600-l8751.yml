candidate_motifs:
- id: motif:1
  label: Offerings to sacred recipients for rain
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes depositing te'likinawe, kia'etchine, fire
    sticks, and food, with prayers for rain directed to the Council of the Gods or
    to ancestors.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage supports ritual offering and requested rain; it does not by
    itself establish a broader theory of exchange beyond these described actions.
- id: motif:2
  label: Ritual fire making linked to rain efficacy
  taxonomy_refs: []
  basis: Sacred fire is made by wood friction, must not be blown upon, and its correct
    handling is explicitly linked to rain; the burning fiber is thrown into the spring
    with a rain prayer.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage describes a specific ceremonial rule; comparative parallels
    are not stated in the source passage.
- id: motif:3
  label: Sacred water network with underwater animal homes
  taxonomy_refs: []
  basis: The lake has four holes identified as tortoise homes, a nearby spring is
    said to connect underground to the lake, and Ko'thluwala'wa is said to connect
    with sacred springs and lakes by underground roads.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage gives a sacred geography but does not explain its full mythic
    structure.
- id: motif:4
  label: Animal otherselves sought in ritual context
  taxonomy_refs: []
  basis: Tortoises are called otherselves and are sought by the party after lake offerings
    and prayers asking them to emerge from underwater homes.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The term otherselves is present, but the passage does not explicitly describe
    transformation or identity mechanics.
- id: motif:5
  label: Fourfold ritual patterning
  taxonomy_refs: []
  basis: The passage mentions four holes as tortoise homes in the lake walls and each
    participant planting four te'likinawe to ancestors.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The recurrence of four is explicit, but the passage does not provide an
    interpretation of the number.
- id: motif:6
  label: Seasonally anticipated festival prayer repetition
  taxonomy_refs:
  - seasonal_cycle
  basis: Those who will personate the Council of the Gods and Sha'lako in the coming
    autumn recite prayers at the lake that they will repeat at the Sha'lako festival.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Only the link to the coming autumn festival is stated; the broader seasonal
    cycle is not elaborated in this passage.
- id: motif:7
  label: Ritual taboo and divine withholding of rain
  taxonomy_refs:
  - divine_judgment
  basis: The passage says blowing breath on the ignited fiber would offend the Council
    of the Gods and result in no rain, and that failure of rain would show the hearts
    of the fire makers are not good.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The divine response is specific to rain efficacy in this rite; broader
    divine judgment is a cautious taxonomy fit.
