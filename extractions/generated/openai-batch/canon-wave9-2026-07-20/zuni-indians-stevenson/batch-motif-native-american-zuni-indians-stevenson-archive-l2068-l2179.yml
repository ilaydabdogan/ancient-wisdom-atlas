candidate_motifs:
- id: motif:1
  label: Creation of animal guardians for cosmic regions
  taxonomy_refs: []
  basis: The Divine Ones transform medicine men into animal beings assigned to north,
    west, south, east, zenith, nadir or earth, and earth-presiding functions.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a directional guardian structure but does not explicitly
    name a broader comparative taxonomy.
- id: motif:2
  label: Culture hero associated with origin of guardian beings
  taxonomy_refs:
  - culture_hero
  basis: Po'shaiyanki is identified as a Zuñi culture hero, and the transformed medicine
    men are those who came to this world with him.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The culture hero is backgrounded in this passage and does not perform
    the transformations directly.
- id: motif:3
  label: Deceptive journey to a cave leading to killing and trophy taking
  taxonomy_refs: []
  basis: The brothers journey, deceive a woman into a cave, kill her with clubs, and
    take her scalp.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a passage-level narrative pattern; no external comparison is asserted.
- id: motif:4
  label: Murdered woman returns as ghost seeking husbands
  taxonomy_refs: []
  basis: A voice asks for her husbands, and the Gods of War identify it as the woman
    they had killed before striking her again.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage calls her a ghost woman through the narrators' report, but
    does not elaborate a full afterlife doctrine here.
- id: motif:5
  label: Bird sign establishes a ritual abstinence period
  taxonomy_refs: []
  basis: The chaparral cock's ten tail feathers are counted, and U'yuyewi declares
