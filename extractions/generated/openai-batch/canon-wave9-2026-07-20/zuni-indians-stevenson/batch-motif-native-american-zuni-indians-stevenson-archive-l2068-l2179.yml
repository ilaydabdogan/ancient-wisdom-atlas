canonical_text:
  quote: ''
  summary: The passage describes the Divine Ones converting medicine men into animal
    Beast Gods assigned to cosmic regions. It then narrates how U'yuyewi and Ma'sai'lema
    deceive and kill a woman, take her scalp, are condemned by several Beast Gods,
    are received by the ants, repel the woman's ghost, derive a ten-day fast from
    a chaparral cock's tail feathers, return to Hal'ona with the scalp, perform village-circling
    and rejoicing rites, and become first directors of the Bow priesthood after Kow'wituma
    and Wats'usi disappear into the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Divine Ones wish the world to be guarded by beings keen of sight and scent
    and visit Shi'papolima, associated with Po'shaiyanki and his followers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine men who came with Po'shaiyanki are converted into animal Beast Gods
    assigned to the north, west, south, east, zenith, nadir or earth, and over the
    earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: U'yuyewi and Ma'sai'lema begin a journey, encounter a woman, question her,
    and U'yuyewi invites her to come to his house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: U'yuyewi falsely describes his house as beautiful, then identifies a cave
    in the rocks as his house; the woman sleeps between the two brothers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning U'yuyewi signals Ma'sai'lema, and the two strike the woman
    on opposite sides of the head with clubs; she falls dead and they take her scalp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cougar of the North, Bear of the West, Badger of the South, and Wolf of
    the East react angrily or denounce the killing when told of it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ants at Shi'papolima receive the two kindly and seat them in a ceremonial
    chamber with an altar at the west end.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A voice asks for her husbands; the Gods of War identify it as the killed woman's
    voice, and after she enters they strike her again and throw her outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After returning to the ants' chamber, the two find chaparral cock tracks;
    the bird is found behind the altar and its ten tail feathers are counted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: U'yuyewi declares that after taking a scalp a man must observe continency
    and fast from animal food, grease, and salt for ten days.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: U'yuyewi and Ma'sai'lema leave Shi'papolima at sunset and return toward Hal'ona
    carrying the Navaho woman's scalp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Hal'ona they encircle the village four times, enter the large plaza, hoist
    the divided scalp on a pole, and spend thirteen days rejoicing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: On the last evening a group forms around a pottery drum, songs are sung, and
    Kow'wituma and Wats'usi disappear into the earth to dwell in the crater at the
    Zuñi salt lake.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: The priesthood of the Bow is organized with U'yuyewi and Ma'sai'lema as first
    directors, and the scene is dramatized at the initiation of a victor into that
    priesthood.
  category: sequence
  evidence_refs:
  - ev:12
