canonical_text:
  quote: ''
  summary: 'The passage describes parts of Great Fire fraternity and Spruce Tree division
    ceremonies: plaza dances, handling of swords, novice gifts and washing, preparation
    and placement of prayer plumes, songs to Na''ke''e and the Beast Gods of the six
    regions, a stated tree-swallowing rite, collection and ritual treatment of pine
    and piñon trees, meal sprinkling, a flint arrow placed between roof-planted trees,
    posture restrictions tied to corn growth, whispering to instruments, anthropomorphic
    marking and installation of trees, smoke blown through boughs, and food offerings
    before an altar.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Arrow order leaves the plaza, the musicians change their song, and the
    Great Fire fraternity and circle dancers alternate dancing in the plaza through
    the day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Great Fire fraternity returns to the ceremonial chamber for the last
    time, swords are handed to the Hlem'mosona and placed by the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity father gives the novice four prayer plumes, four ears of corn,
    and calico for a shirt; the wife of the fraternity father bathes the novice's
    head and hands and later carries food and the washing bowl as gifts to the novice's
    house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Spruce Tree division currently has two female members, and the trees handled
    by them are smaller than the others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that tree swallowing occurs only at initiation in the Hle'wekwe
    fraternity, but is not dependent on initiation in the Great Fire fraternity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Members and novices each make three prayer plumes to Na'ke'e, while officers
    also make prayer plumes to each Beast God of the six regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The deputy director gathers one plume from each man into a kia'etchine and
    places it in a basket; other plumes are also placed in baskets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Eight a'mosi sit around baskets of plumes while the order, including women,
    sings to Na'ke'e with a wooden drum and no rattles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The singers say that they are to swallow the tree and ask that their throats
    not be made ill.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: On the following morning six songs are sung, one to the Beast God of each
    of the six regions, to intercede with rain-makers for cold rains and snows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A deputy Hlem'mosona leaves with the kia'etchine, followed by a warrior whirling
    a rhombus, while female members sprinkle meal on the group of plumes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A party proceeds north of the village to collect two small trees, one pine
    and one piñon, which are brought back and deposited for the rite.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: An undertail banded turkey feather is used as the la'showanne for each tree,
    and a flint arrow attached to a shaft is placed between the trees when they are
    planted on the roof by the hatchway.
  category: object
  evidence_refs:
  - ev:4
- id: obs:14
  text: The trees on the roof receive a ceremony by the directors and are sprinkled
    with meal each morning by members of the order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: During ceremonies in the fraternity chamber, feet must be kept close together
    and arms must not be extended outward or upward except when using the sword or
    sprinkling meal; violation is said to stunt corn growth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: A flutist and a warrior sit on sheepskins in the middle of the floor and speak
    in whispers to a flute and a rhombus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: On the third morning the Hlem'mosona selects a director and five others to
    collect pine trees south of the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Each tree is marked before cutting with three dots denoting eyes and mouth,
    then brought on the backs of men and slid through the hatchway into the ceremonial
    room while animal-like yells are given.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The trees remain in the middle of the room while the choir sings and the director
    blows smoke from a reed cigarette through the boughs; afterward they are suspended
    at the east end with eyes and mouth sides upward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: Before a feast is eaten, food is taken from bowls, placed before the altar
    by a warrior, and divided by him into five heaps.
  category: action
  evidence_refs:
  - ev:8
