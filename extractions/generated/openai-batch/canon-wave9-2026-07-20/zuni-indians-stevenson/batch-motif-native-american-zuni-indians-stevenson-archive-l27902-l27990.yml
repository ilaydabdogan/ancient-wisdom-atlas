evidence:
- id: ev:1
  type: summary
  locator: 27902-27914
  quote_or_summary: The Arrow order leaves the plaza; songs and dances change; the
    Great Fire fraternity and circle dancers alternate. On the final return, swords
    are placed by the altar. A novice receives four prayer plumes, four ears of corn,
    and calico, is bathed by the fraternity father's wife, and receives food and a
    bowl as gifts.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 27915-27922
  quote_or_summary: The Spruce Tree division is introduced. It currently has two female
    members, whose trees are smaller. Tree swallowing is said to occur only at initiation
    in the Hle'wekwe fraternity, but not to depend on that rite in the Great Fire
    fraternity; the festival is synchronous with the two fraternities.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: quote
  locator: 27923-27939
  quote_or_summary: 'Members and novices make prayer plumes to Na''ke''e; officers
    also make plumes to the Beast Gods of the six regions. The deputy director gathers
    plumes into a kia''etchine. The group sings to Na''ke''e with a wooden drum: "We
    are to swallow the tree; we ask that our throats may not be made ill."'
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; short quotation used for exact ritual speech.
- id: ev:4
  type: summary
  locator: 27940-27958
  quote_or_summary: The next morning six songs are sung to the Beast Gods of the six
    regions for intercession with rain-makers for cold rains and snows. The deputy
    Hlem'mosona carries out the kia'etchine, a warrior whirls a rhombus, women sprinkle
    meal, and a party goes north to collect one pine and one piñon. Undertail banded
    turkey feathers are used for each tree, and a flint arrow on a shaft is placed
    between roof-planted trees.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 27959-27968
  quote_or_summary: Directors perform a ceremony over the roof trees, which are sprinkled
    with meal each morning. Night singing ceases unless someone coughs. In the chamber,
    feet must be close together and arms must not be extended except when using the
    sword or sprinkling meal; otherwise corn would be stunted.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 27969-27972
  quote_or_summary: The flutist and a warrior sit on sheepskins in the middle of the
    floor; the warrior whispers to his rhombus and the flutist to his flute.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 27973-27986
  quote_or_summary: On the third morning the Hlem'mosona selects a director and five
    others to get pine trees south of the village. Each tree is marked with three
    dots for eyes and mouth before cutting, carried back, slid down through the hatchway
    amid animal-like yells, sung over, smoked through the boughs with a reed cigarette,
    and suspended at the east end with the marked sides upward.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 27987-27990
  quote_or_summary: Before a feast is eaten, food is taken from all bowls, placed
    before the altar by a warrior, and divided by him into five heaps.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summarized.
