  text: After the writer asks for a delay and promises not to send for soldiers or
    inform anyone, Nai'uchi agrees to wait until the next night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The accused man is found sitting in despair in an upper room with his ill
    wife and pregnant young daughter weeping beside him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer tells the accused man that she will save him, but he answers that
    she cannot because Nai'uchi has spoken.
  category: speech
  evidence_refs:
  - ev:2
