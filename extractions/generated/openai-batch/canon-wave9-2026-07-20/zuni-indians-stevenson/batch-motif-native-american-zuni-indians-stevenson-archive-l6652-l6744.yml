canonical_text:
  quote: ''
  summary: On the fifth day, a household group led by an associate shi'wanni goes
    to a melon patch to plant prayer plumes. Men, women, children, infants, fraternity
    members, and the writer make specified plume offerings to the Sun Father, Moon
    Mother, ancestors, culture hero figures, patron gods, and other beings. The plumes,
    prayer meal, breath prayers, miniature attachments, and feather cords are used
    to request health, long life, clouds, rain, food, clothing, and agricultural abundance.
    Afterward, participants observe restrictions on animal food, grease, trading,
    household refuse, and artificial light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described events occur on the morning of the fifth day in a snowy valley
    and mesa landscape, while devotees travel to and from a sacred mission.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The participating party is a household and kin group led by an associate shi'wanni
    and includes his wife, relatives, children, infants, a girl related to a Bow priest,
    and the writer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The associate shi'wanni gives the writer te'likinawe made for her and says
    she must make offerings such as men make.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party goes to the associate shi'wanni's melon patch, where he makes a
    square excavation using an old saber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Participants remove corn husk wrappings from the te'likinawe, sprinkle prayer
    meal in the excavation, and plant the te'likinawe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each man deposits one blue-sticked te'likinane for the Sun Father and four
    black-sticked offerings for his ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife's younger brother, as a Great Fire fraternity member, plants offerings
    to Po'shaiyilnki, to the younger brother or fellow of Po'shaiyilnki, to the Cougar
    of the North, and to the Sun Father and Moon Mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One offering to Po'shaiyilnki has a miniature crook described as symbolic
    of longevity, and another has a miniature corn planter intended to bring much
    corn in the coming year.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some te'likinawe have pendent la'showawe; those with la'showawe carry prayers
    for rain, while those without are for clouds and other things.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Each female, including a four-year-old child, plants one yellow-sticked te'likinane
    for the Moon Mother and three black-sticked offerings for her ancestors; infants
    offer one or two black-sticked te'likinawe for ancestors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The writer deposits one offering to the Sun Father and four to ancestors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The associate shi'wanni's wife and elder daughter, as Shu'maakwe fraternity
    members, deposit offerings to Shumai'koli, Sai'apa, the ettone, and deceased fraternity
    members.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the te'likinawe stand in the ground, each person holds meal near the
    lips, recites a prayer for health, long life, clouds, rain, food, and clothing,
    and sprinkles meal over the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The little child is said to understand her duties and prayers, while babies
    have their hands dipped in meal and held over the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The plumes remain uncovered until sunset the following day so the Sun Father
    may receive prayers breathed upon the meal and into the plumes, whose spiritual
    essence conveys the breath prayers to him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the plume deposition, animal food and grease are forbidden for four
    days for most participants, with named fraternity and nursing-child exceptions;
    the first body of A'shiwanni has a ten-day fast and continence requirement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: For the same period, trading is forbidden, ashes and sweepings may not be
    removed from the house, and artificial light, burning cigarettes, or firearm flashes
    may not appear outside the house.
  category: action
  evidence_refs:
  - ev:8
