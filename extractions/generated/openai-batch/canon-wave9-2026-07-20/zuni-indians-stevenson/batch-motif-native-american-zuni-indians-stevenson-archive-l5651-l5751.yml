canonical_text:
  quote: ''
  summary: The passage describes a witnessed voluntary initiation into the Ko'tikili.
    Boys sit with godfathers in the He'iwa k'iwi'sine while masked Sa'ya'hlia and
    Ko'yemshi participate. A Sia youth receives an extended ceremony involving covering,
    repeated yucca strikes, meal sprinkling, and a plume. Other novices receive yucca
    blows, then have their eyes covered while masks are removed and learn that the
    supposed gods are men. Initiates receive masks, briefly wear masks and strike
    the Sa'ya'hlia, and are warned not to divulge initiatory secrets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Voluntary initiation is said to occur when a boy is about 12 or 13, with the
    boy deciding for himself and elders stressing the importance of the step.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: People gather in the He'iwa k'iwi'sine; boys sit beside godfathers, ritual
    officials sit on ledges, four Sa'ya'hlia stand on the north side, and Ko'yemshi
    hand giant yucca bunches to the Sa'ya'hlia.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sia youth is included so that the Sia Indians may use Ko'yemshi masks, and
    because he has not received prior Zuni involuntary initiation he is the first
    to undergo a longer ceremony.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For the Sia youth, folded blankets and canvas are placed over him while he
    bends forward; his godfather leads him before the Sa'ya'hlia.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sa'ya'hlia strike the Sia youth on the back with yucca in repeated series
    while the Ko'yemshi count aloud and provide fresh yucca bunches.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One woman attendant is led before the Sa'ya'hlia, bends forward, and receives
    one yucca stroke from each.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the third whipping, the Sia youth and godfather sprinkle meal on the
    Sa'ya'hlia, and the godfather attaches an eagle plume to the boy's hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In ordinary voluntary initiation, novices use a blanket and deerskin, pass
    once before four Sa'ya'hlia, and receive four forceful yucca strokes from each.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After whipping, godfathers cover the boys' eyes while the Sa'ya'hlia remove
    their masks; the boys then discover that the supposed gods are men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each initiate receives a rain-maker's mask from his godfather; it becomes
    personal property and is buried after his death.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Four boys stand before four Sa'ya'hlia, receive masks and yucca, and strike
    each god on arms and ankles before the masks are removed from the boys.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the boys' initiation, the masked gods strike godfathers and shi'wanni
    over the limbs, and the Ko'mosona warns the boys not to divulge initiatory secrets,
    especially those concerning masks.
  category: speech
  evidence_refs:
  - ev:9
