canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions in a Shu''maakwe initiation
    setting: plant materials are sorted into bowls, old grinding stones are set near
    an altar, female grinders receive meal and prayers, are dressed and led to the
    mills, grind wet plants, roots, turquoise, and shell beads into medicine cakes,
    while songs and instruments accompany the work. The a''kwamosi gestures to the
    six regions, uses eagle plumes with medicine water, sprinkles the altar, fetishes,
    and crossbar, keeps the crossbar whirling, and leads dancers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several kinds of plant material are sorted, broken or cut, and placed in bowls;
    one plant is placed with a small quantity of water to keep it fresh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six old grinding stones or mills are placed on the north side of the room
    near the altar, with space for grinders to kneel.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The a'kwamosi gives each female a pinch of meal, prays over each, and the
    women later go to the altar to pray and sprinkle the meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Six grinders are dressed with specified garments, sash, loosened hair, an
    eagle plume, jewelry, turquoise, and coral, and each is led separately to a mill
    by holding the tips of eagle-wing plumes carried by the a'kwamosi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After each girl is positioned at a mill, the a'kwamosi places hands on her
    shoulders and motions her to the six regions, including forward and back movements
    for Zenith and Nadir.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An aged woman and an aged man sit before the mills with bowls of mixed plants
    and bowls containing turquoise and ko'hakwa, and they supply materials to the
    grinders while caring for ornaments.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Turquoise, ko'hakwa, roots, wet plants, and sometimes additional water are
    placed on the mills and ground by the girls into crushed medicine that is later
    formed into cakes.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The song begins with a rattle; later, when a second party takes the mills,
    drum is added and the songs are described as more rapid and martial in character.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: A youth in the choir listens attentively because he wishes to learn the songs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The a'kwamosi stands before the altar, keeps time with his feet, dips eagle
    plumes into medicine water, touches the bowl's four serrated points, gestures
    for Zenith and Nadir, sprinkles the altar, fetishes, and crossbar, and keeps the
    crossbar whirling.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Five men and ten women begin a dance in groups of three, with a man between
    two women, and the a'kwamosi leads the dancers while holding a corn husk horizontally.
  category: action
  evidence_refs:
  - ev:9
