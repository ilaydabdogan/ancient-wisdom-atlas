canonical_text:
  quote: ''
  summary: The passage recounts a lightning-strike aftermath in which Catalina and
    a Xavaho guest remain seriously affected, a previously lightning-struck man treats
    the afflicted, Catalina is restored with powdered charred wood from a lightning-struck
    tree and an arrow point, and the group fasts, washes, makes prayer plumes, deposits
    them to the lightning-makers, and organizes the Struck-by-lightning fraternity.
    It then gives an ethnographic account of Zuni medicine and religion in which persistent
    illness is attributed to a foreign object in the body, animal powers and Beast
    Gods empower theurgists, theurgists use altar performance, animal fetishes, quartz
    crystal, and sucking extraction, and initiation into Mystery medicine includes
    dry paintings used in medicine practices among several Indigenous groups.
  language: English
  quote_policy: summarized
