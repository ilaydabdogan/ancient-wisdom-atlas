canonical_text:
  quote: ''
  summary: 'The passage describes part of a Zuñi A''shiwanni rain-priesthood ceremony:
    meal crosses and circles are made as directional and world symbols; sacred objects
    including the dual et''tone are arranged on a cloud symbol; a newly ordained associate
    is ritually prayed over; water is placed in medicine bowls, consecrated, frothed
    into cloud-like suds, and sprinkled with eagle plumes; instruments, meal offerings,
    and an invocation call the rain-makers to come and bring rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nai'uchi and an associate make small meal crosses on opposite sides of a meal
    line, with four lines running inward to a center; the passage states that these
    represent the four regions and that the encircling meal circle represents the
    whole world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Strings of precious beads are placed over the meal circle to form a pad, and
    two men place medicine bowls on it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eight mi'wachi are arranged in a line across the back of a cloud symbol, with
    tortoise shells placed at both ends of the line.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shi'wanni washes his hands in prayer meal, removes the dual et'tone from
    a vase, opens its two wrapped packages reverently, and places the two parts midway
    on the cloud symbol, with the kia'et'tone east of the chu'et'tone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes the placement of the et'tone as an exceptionally solemn
    moment, connected with hopes that its dual influence will move the gods to water
    the earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A recently ordained associate is raised, placed near the mi'wachi and cloud
    symbol, and has the two parts of the et'tone held with his clasped hands while
    prayers are made for his right conduct and purity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The other two associates repeat the prayer over the newly ordained associate,
    each washing his hands in meal before handling the et'tone; the two parts are
    then returned to the meal symbol.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A female associate brings a vase of water; six gourdfuls are poured into one
    medicine bowl and six gourdfuls into the opposite bowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shi'wanni sprinkles meal into the water and drops six concretion fetishes
    for fructification into it separately while praying to the rain-makers of the
    six regions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An associate forms a cross of powdered root, encircles it with the root, and
    sprinkles the root over the water's surface.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After consecrating the water, Nai'uchi whirls a rhombus while an associate
    whips the mixture in a bowl into frothy suds, which the passage identifies as
    symbolic of clouds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: An associate on the east side plays the flute during the water and cloud-suds
    rite.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The shi'wanni dips two eagle plumes into the consecrated water and sprinkles
    the offerings; this dipping and sprinkling is repeated six times.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The rite continues with rhombus whirling, flute playing, shell-rattle shaking
    by the recently ordained member, and repeated sprinkling of meal along the meal
    line with prayers to the rain-makers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says the appeal to the gods continues all night in low musical
    tones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The invocation calls for the addressed beings to ascend a ladder, come in,
    sit down, bring showers and great rains, and receive sacred meal thrown out to
    them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: A note in the passage identifies the rain-makers as deceased A'shiwi.
  category: relationship
  evidence_refs:
  - ev:10
