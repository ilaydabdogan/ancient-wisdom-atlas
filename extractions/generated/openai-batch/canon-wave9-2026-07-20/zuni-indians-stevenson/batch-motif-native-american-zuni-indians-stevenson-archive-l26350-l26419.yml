- id: obs:3
  text: The Great Fire fraternity has named functionaries including a director, deputy,
    maker of medicine water, deputy to the maker of medicine water, wood or sword
    director, flutist, warrior, walking-about functionary, general managers, and couriers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tradition says that two Great Fire fraternity members, one from the Eagle
    clan and one from the Badger clan, went to the northeast and met the Ke'pachu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ke'pachu are said to have had a language similar to that of the two A'shiwi
    and to have understood mystery medicine, sword swallowing, and arrow swallowing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two A'shiwi returned to their village with songs from the Ke'pachu, and
    the Great Fire fraternity is said to have sung only Ke'pachu songs since then.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: The a'kwamosi office and its deputy are associated with the Eagle clan or
    children of that clan, while the sword director and its deputy are associated
    with the Badger clan or children of that clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage presents stanzas in the Ke'pachu tongue, including songs associated
