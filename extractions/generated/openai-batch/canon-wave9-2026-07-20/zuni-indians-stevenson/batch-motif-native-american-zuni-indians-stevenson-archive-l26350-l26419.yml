canonical_text:
  quote: ''
  summary: The passage identifies Po'sikishi as a bird mime and describes a wooden
    sword associated with a klii'lii'silo tree. It lists offices of the Great Fire
    fraternity, recounts a tradition in which two A'shiwi members met the Ke'pachu
    to the northeast and returned with their songs, and gives Ke'pachu-language song
    stanzas used for mystery medicine and the sword-swallowing ceremony.
  language: English with Zuni and Ke'pachu terms and song text
  quote_policy: summarized
