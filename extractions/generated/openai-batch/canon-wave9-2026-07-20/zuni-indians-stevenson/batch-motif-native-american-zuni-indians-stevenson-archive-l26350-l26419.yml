- id: obs:1
  text: Po'sikishi is described as the mime of a bird that frequents the klii'lii'silo,
    identified in the passage as Pseudotsuga douglassii.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sword swallowed in the Po'sikishi ceremony is made at the base of a klii'lii'silo.
  category: object
  evidence_refs:
