- id: obs:3
  text: The elder brother Bow priest whirls the rhombus and calls for rains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the whirling of the rhombus ceases, the pe'kwin returns the mi'wachi
    that had embellished the painting to their individual owners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The et'tone of the Kia'kwemosi and the large shell are placed in two baskets
