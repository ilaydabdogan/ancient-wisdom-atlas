  text: When the two makers of the idols enter the chamber, the warriors stop chatting
    and laughing, and no word is spoken afterward.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Participants take fixed positions: warriors stand on the north side of the
    room, the Ah''shiwanni remain at the west end, and the elder brother Bow priest
    stands south of and before the painting.'
  category: setting
  evidence_refs:
  - ev:1
