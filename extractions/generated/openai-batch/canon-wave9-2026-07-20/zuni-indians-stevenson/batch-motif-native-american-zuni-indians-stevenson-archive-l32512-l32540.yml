canonical_text:
  quote: whirling the rhombus and calling for rains
  summary: The passage describes a ritual sequence in which idol makers enter a chamber,
    participants become silent and take set positions, a Bow priest whirls a rhombus
    and calls for rain, ritual objects are returned or redistributed, images and paraphernalia
    are carried in an ordered procession to a plaza, participants dance, and objects
    are placed on a meal painting.
  language: English
  quote_policy: quoted
