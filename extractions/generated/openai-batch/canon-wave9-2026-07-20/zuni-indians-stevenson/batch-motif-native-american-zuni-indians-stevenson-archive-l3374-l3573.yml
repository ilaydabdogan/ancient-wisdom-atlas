canonical_text:
  quote: ''
  summary: The passage describes a ritual entry of 'Kiiiklo into the Chu'pawa ki'wi'sine,
    including dialogue with Ko'yemshi, meal lines, repeated song stanzas, and the
    beginning of a sacred history myth. The myth narrates the A'shiwi coming through
    a water-cleared opening, receiving the sacred breath of A'wonawil'ona, being in
    the fourth blackness-of-soot world, and the elder and younger Bow-priest brothers
    conferring and cutting down four directional trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ko'yemshi carry 'Kiiiklo to the roof of the Chu'pawa ki'wi'sine and seat him
    on a blanket before his entry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A brief dialogue occurs in which 'Kiiiklo says he enters, Ko'yemshi say good-by,
    'Kiiiklo says they will dance and that he will come out in the morning, and Ko'yemshi
    answer that they will dance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first body of A'shiwanni, the Ko'mosona, the Ko'pekwin, and people of
    the Chu'pawa ki'wi'sine assemble to receive 'Kiiiklo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A line of meal extends from the ladder base to the north ledge of the ki'wi'sine
    and is crossed by four equidistant lines of meal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: "'Kiiiklo descends into the ki'wi'sine, stands at the ladder base, then stands
    on each cross line while Ko'yemshi on the roof repeat the twelfth stanza four
    times at each position."
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After reaching the end of the meal line, 'Kiiiklo sits and repeats the history
    myth, which begins at sunrise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage lists principal characters and objects of the history myth, including
    elder and younger Bow priests, Pau'tiwa, 'Kiiiklo, A'wan M'ehu Ko'yemshi, Pe'kwin,
    and Et'towe fetishes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the myth, the Zuñis come through a hole that is emptied of water for their
    passage and afterward fills with water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The myth states that the people inhale the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The people are described as being in the fourth world, the blackness-of-soot
    world, while great father Bow priests work for them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The elder brother points above to the light of day and says he wants his younger
    brother of the place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The younger brother hastens to the elder brother and asks what the elder brother
    wishes to say or discuss.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The elder brother says he has concentrated his thoughts on one thing and is
