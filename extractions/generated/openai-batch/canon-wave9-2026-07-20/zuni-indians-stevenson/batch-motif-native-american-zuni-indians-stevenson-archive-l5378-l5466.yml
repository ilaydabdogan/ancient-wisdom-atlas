canonical_text:
  quote: ''
  summary: 'The passage describes ceremonial preparations for child initiation: sand
    mounds and a sand painting for personated gods, a water-drinking sequence that
    authorizes ritual striking, destruction of pottery and baskets with anti-Navaho
    cries, a stuffed rabbit skin voiced by ''Si"sikia requesting food, Ko''yemshi
    collecting food from initiates'' homes, redistribution of the food, and godfathers''
    plumes placed on color-region figures before initiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes the man personating Hii'shi from the man representing
    'Kiaklo, even though the same mask and regalia are worn, and says future personators
    of gods are present only as spectators at this point.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The director of the Great Fire fraternity remains by the sand painting while
    members of the fraternity make sand mounds in two ki'wi'siwe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fifteen sand mounds are made in each ki'wi'sine for fifteen personated gods,
    and the passage lists named gods associated with the mounds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shu'laawi'si, led by his ceremonial father and joined by two An'nahoho, goes
    to He'iwa ki'wi'sine, where the Great Fire fraternity director gives each a drink
    of water from the “spring” using an ancient shell attached to a cottonwood stick.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The water is said to be drunk to make the gods angry, and the pe'kwin states
    that those who drink it may strike men and women they meet, except for named protected
    categories.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Gods break pottery and baskets, burn baskets with Shu'laawi'si's lighted brand,
    and utter cries about death to the Navaho and burning the Navaho camp; the populace
    and Sal'imobiya give the war whoop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ko'yemshi go onto the roof of He'iwa ki'wi'sine and listen while 'Si"sikia,
    positioned on the ladder through the hatchway, holds a stuffed rabbit skin with
    gypsum eyes near his mouth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stuffed rabbit skin is presented as saying that the “little grandfather”
    is hungry and wants food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ko'yemshi visit homes of children to be initiated and collect bowls of
    yellow, blue, red, white, all-colored, and black beans, along with other foods
    from other children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Food is carried to He'iwa ki'wi'sine, distributed to other ki'wi'siwe by managers,
    and eaten after the gods finish their destructive tour.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Godfathers bring la'showanne to the Great Fire fraternity director, who places
    them on heads of figures in the sand painting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: For boys who donated beans, the la'showanne are placed on Sal'imobiya of the
    six regions according to the color of the beans; afterward each father prepares
    for the involuntary initiation of his godchild.
  category: sequence
  evidence_refs:
  - ev:9
