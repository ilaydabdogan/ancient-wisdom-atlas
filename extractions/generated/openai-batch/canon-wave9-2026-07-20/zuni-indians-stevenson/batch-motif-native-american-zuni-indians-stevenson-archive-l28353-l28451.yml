canonical_text:
  quote: ''
  summary: A ritual sequence describes consecration of medicine water with eagle plumes,
    invocations to prey animals and Beast Gods, altar sprinkling, offerings sent to
    the river, dancing for healing, animal-associated performances, ash distribution,
    administration of medicine water, communal prayers, and the closing of an initiation
    ceremony at daylight with gifts to novices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The a'kwamosi dips eagle plume quill ends into water six times, stirs the
    water, growls, and invokes prey animals of the six regions to give spirits to
    the bodies of his people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After consecrating the water, the a'kwamosi sprinkles the altar four times
    with plumes and throws meal six times over the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Choir music, whirling of the rhombus, and flute music continue while two choir
    members collect food in front of the altar and throw it into the river for the
    Beast Gods; the dance then begins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The room becomes crowded with people suffering from real or imaginary maladies
    who wish to be cured.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: White-painted male choir members dip eagle plumes into medicine water, sprinkle
    the altar and the four directions, cry out, and are followed by other dancers
    who repeat the sprinkling and call upon the Beast Gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women do not dance during the water sprinkling, but afterward three women
    in white cotton gowns and red sashes, each holding eagle-wing plumes, enter the
    dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A choir member dances wildly, invokes the Beast Gods, pulls the a'kwamosi
    from his seat, slips a hand holding eagle plumes into a bear's foot, growls, draws
    bear claws over men's backs, and threatens the dancing women with the same action.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A juggler moves eagle plumes over a human image until the image appears to
    catch the plume tips and be raised by them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman takes ashes from the fireplace, sprinkles the altar, and places ashes
    in the right palm of everyone present; each person passes the ashes from right
    to left around the head three times and throws them onto the altar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two young men representing the Chapparral cock use plumes to take ashes from
    the fireplace, throw ashes on the altar, sprinkle all present, and throw ashes
    to the six regions beginning with the North.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The a'kwamosi gives medicine water to all present with a shell, recites a
    litany, joins the people in prayer to the Beast Gods, and the dance closes at
    daylight when novices receive gifts.
  category: sequence
  evidence_refs:
  - ev:9
