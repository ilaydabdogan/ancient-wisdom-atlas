literal_observations:
- id: obs:1
  text: The director of the Shu'maakwe fraternity must be of the Po'yi'kwe clan, and
    the director's pe'kwm must be a child of that clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other officers must be from, or children of, Ko''loktakwe, Pi'ehikwe, and
    Ta'kiakwe clans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The officers have the septum of the nose pierced in an early-morning ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the piercing, members at large hasten to lap blood as it flows from
    the wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The piercing is done with a splinter of archaic wood, and a bundle of this
    wood is kept by the director.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pierced aperture is plugged with a small piece of wood; for ceremonials
    the plug is removed and an eagle plume quill is put through the opening.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Sometimes two plumes are worn on opposite sides.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man with a pierced septum must observe continence for one year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the end of the year of continence, the man captures a wood rat, roasts
    it, and eats it, with the stated purpose that his blood may not be made impure
    by ending continence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The director of the Shu'maakwe is also described as a shi'wanni, or rain priest,
    and has an et'tone.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The deputy and warrior of the fraternity are present at ceremonies over the
    director's et'tone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Shu'maakwe are described as possessing remedies for convulsions and medicine
    for rheumatic affections and cramps of the limbs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Several plants are ground, compounded into small cakes, sun-dried, and used
