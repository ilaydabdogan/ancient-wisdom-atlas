canonical_text:
  quote: ''
  summary: The passage describes preparatory announcements for the coming Council
    of the Gods and Sha'lako, the eight-day retreat and wood-gathering duties of the
    Ko'yemshi, shrine offerings and song rehearsals, symbolic sand and meal arrangements
    at A'kohanna ti'nakwi, a night fire procession led by named personators, a four-day
    retreat by the Council personators, and household food offerings to the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin instructs the people to work, complete houses, bring wood, make
    moccasins and clothes, and have women whiten walls for the coming gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin announces that the Council of the Gods will come in four days
    and the Sha'liiko in eight days.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group repeats the same speeches in several plazas after forming into a
    circle with two in the ring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi disappear on the western road, return carrying masks and other
    items under blankets, and enter a ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ko'yemshi remain in the ceremonial chamber for eight days except for night
    announcements about the coming gods and wood gathering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each morning nine Ko'yemshi go for wood while one remains in the chamber;
    the wood is deposited before a new house to be dedicated and is stacked by women
    of the house and clan members.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the Ko'yemshi retreat no altar is erected and no dance is performed;
    there are evening prayers and songs, food is served by women, and the men must
    observe continence and not touch a woman's hand.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief wor'li of each ki'wi'sine meets participants, fraternity members
    rehearse songs and prepare te'likinawe, and the wor'we deposit offerings at the
    Sha'lako shrine at sunset.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sha'lako shrine is described as a low-walled rectangular enclosure southwest
    of Zuni at the base of A'kohanna ti'nakwi, with stones placed for seats.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Personators of the Council of the Gods and Sha'lako hold a council at the
    Sha'lako shrine before the ceremonial.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Separate shrines are identified for Sa'yatasha and Shu'laawi'si, and quantities
    of te'likinawe are present at Sa'yatasha's shrine and nearby rock crevices.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chosen father of Shu'laawi'si deposits heaps of pinon wood at designated
    places between I'shana an te'kiapoa and A'kohanna ti'nakwi and at Shu'laawi'si's
    shrine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ko'mosona and Ko'pekwin make two sand mounds beside Sa'yatasha's seat or shrine,
    with the mounds symbolizing two mountains and the seat symbolizing Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The sand mounds are covered with prayer meal; Ko'mosona extends a line of
    meal eastward from the shrine and crosses it four times to denote the four regions.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: At night a party proceeds to A'kohanna ti'nakwi in a specified order including
    the ceremonial father of Shu'laawi'si, Shu'laawi'si, Sa'yatasha, Ya'muhakto, Hu'tutu,
    Ko'mosona, Ko'pekwin, and Bow priests.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The father of Shu'laawi'si carries live coals from Sa'yatasha's house; Shu'laawi'si
    lights wood at his shrine and ignites his cedar brand.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The party crosses the plain while Shu'laawi'si lights six wood heaps and two
    piles at I'shana an te'kiapoa, then reaches He'patina where prayers are sung.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: After announcing that the Sha'lako will come in four days, the Council personators
    and the ceremonial father of Shu'laawi'si retreat for four days, gathering wood
    each morning and observing continence and avoidance of women's faces.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: A governor's staff member calls from a house top that all must offer food
    to the dead; each family member places food in fireplace flames.
  category: action
  evidence_refs:
  - ev:13
