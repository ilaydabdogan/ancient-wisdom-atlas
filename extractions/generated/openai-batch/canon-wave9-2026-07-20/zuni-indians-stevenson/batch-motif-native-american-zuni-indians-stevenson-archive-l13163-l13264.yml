candidate_motifs:
- id: motif:1
  label: Preparation for divine visitation through house renewal and public announcement
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage announces the coming Council of the Gods and Sha'liiko on fixed
    future days and orders practical preparation of houses, wood, clothing, and whitened
    walls for the gods' arrival.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The annual character is supplied by the passage locator and ceremony context;
    the excerpt itself emphasizes timed preparation rather than a full seasonal myth.
- id: motif:2
  label: Ritual retreat with continence before ceremonial performance
  taxonomy_refs:
  - initiation
  basis: Both the Ko'yemshi and later the Council personators enter multi-day retreats,
    gather wood under controlled conditions, and observe sexual or gender-contact
    restrictions.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:12
  confidence: medium
  cautions: The passage describes retreat and restrictions but does not explicitly
    call the process an initiation.
- id: motif:3
  label: Sacred offerings at shrines and to the dead
  taxonomy_refs:
  - sacred_exchange
  basis: Offerings are deposited at the Sha'lako shrine, te'likinawe are prepared
    and present at shrines, and food is placed in fireplace flames for the dead.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:13
  confidence: high
  cautions: The passage reports ritual offerings but does not elaborate reciprocal
    expectations.
- id: motif:4
  label: Ritual mapping of sacred landscape with mountains and four regions
  taxonomy_refs:
  - cosmic_mountain
  basis: Sand mounds are explicitly said to symbolize two mountains near Ko'thluwala'wa,
    Sa'yatasha's seat symbolizes Ko'thluwala'wa, and meal lines are crossed four times
    to denote the four regions.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The taxonomy reference to cosmic mountain is approximate; the passage
    specifies symbolic mountains but does not use the word cosmic.
- id: motif:5
  label: Fire-bearing procession lighting prepared stations
  taxonomy_refs: []
  basis: Live coals are carried from Sa'yatasha's house; Shu'laawi'si lights shrine
    wood, ignites a cedar brand, and lights prepared wood heaps and piles while the
    party proceeds across the plain.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: No available motif-family taxonomy exactly matches this fire procession
    pattern.
- id: motif:6
  label: Food offering to the dead through household fire
  taxonomy_refs:
  - sacred_exchange
  basis: A public call instructs all to offer food to the dead, and each family member
    deposits food in the fireplace flames.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not describe the dead's response or a journey of the
    dead.
