canonical_text:
  quote: ''
  summary: The passage describes the Hla'hewe drama performed in connection with corn
    growth, rain, and the Corn maidens. It explains its quadrennial timing, its relation
    to a sacred prior appearance of the Corn maidens, a special 1890 performance connected
    with drought and a new sun priest, the division of performers into two ritual
    parties, and the preparatory assembly of A'shiwanni at the house of the Shi'wanokia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hla'hewe drama is said to be enacted every four years in August when the
    corn is about a foot high.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drama is described as a reproduction of ceremonies held at the time of
    the third appearance of the Corn maidens before the A'shiwi and as one of their
    most sacred festivals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Corn maidens were expected to dance so that rains would come, the earth
    would be watered, new corn would be made beautiful, and the earth would provide
    food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A special 1890 performance occurred after a former pe'kwin, or sun priest,
    was impeached for having caused a drought, and the new incumbent needed to learn
    the drama in which he had an important part.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Zuni people are reported to have said that the 1890 celebration brought so
    much rain that they danced all night in mud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kia'kwemosi initially said the ceremony could not be repeated for the
    writer because people would suspect it was being held for notes and pictures.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After consultation, the Kia'kwemosi and elder brother Bow priest decided the
    Hla'hewe drama could be included among additional ceremonies because prisoners
    from Oraibi, thought to be sorcerers, had threatened drought if not liberated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dancers and choirs form two parties, one called Hla'hewe and the other
    Isho'kowe, the latter connected with the word for flute and with Pa'yatamu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first body of A'shiwanni assemble in the house of the Shi'wanokia eight
    days before the drama to arrange it and choose nonpermanent actors, while the
    Shi'wanokia is present but silent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A note explains Hla'ha as a rabbit-skin blanket and says the name signifies
    fecundity; another note says the drama had not been performed since 1891 because
    the Indians wished to keep the sacred ceremony from the eyes of Americans.
  category: attribute
  evidence_refs:
  - ev:6
