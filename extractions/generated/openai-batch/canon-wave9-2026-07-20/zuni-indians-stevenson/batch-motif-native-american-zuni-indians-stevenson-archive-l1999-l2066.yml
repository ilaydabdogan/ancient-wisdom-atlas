canonical_text:
  quote: ''
  summary: Kow'wituma and Wats'usi discover the Corn maidens dancing near Shi'pololo.
    The maidens are brought to I'tiwanna to dance for rain and corn growth. During
    a midnight dance in a sacred court, Pa'yatamu sees them and desires the Yellow
    Corn maiden. The maidens, afraid, flee at dawn to Ke'yatiwa. The Black Corn maiden
    is sent to inform the gods of their fears, and two gods return in duck form to
    conceal and protect the maidens in a spring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kow'wituma and Wats'usi went on a deer hunt and, near Shi'pololo, discovered
    beautiful maidens dancing under a ham'pone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each maiden held a 'hla'we in both hands, described as stalks of a white plant
    from the underworld with delicate white plume-like baves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the discovery was reported, the pe'kwin to the Sun Father was delegated
    to bring the Corn maidens so they might dance for rains and the growth of corn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Yellow Corn maiden and four sisters accompanied Kow'wituma, while the
    Blue Corn maiden and four sisters accompanied Wats'usi to the O'he'wa ki'wi'sine,
    where they sang and danced briefly without rattles, drums, or singers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At midnight the Corn maidens were led to a ham'pone of waving corn in the
    sacred dance court, where a meal painting of cloud symbols had been made on the
    ground.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the dancing, the A'shiwanni and Divine Ones fell asleep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pa'yatamu, described as god of music, butterflies, and flowers, approached
    the ham'pone, sat at the northeast corner, judged the Yellow Corn maiden most
    beautiful, and wished to embrace her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Corn maidens understood Pa'yatamu's thoughts, became afraid, stopped dancing,
    drew close together, and planned to run away after he slept.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Pa'yatamu slept, the Corn maidens ran away by the first light of the
    morning star to Ke'yatiwa shipololo' a'wehlwia'klai'a.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After waking, Pa'yatamu, the A'shiwanni, and the Divine Ones found the Corn
    maidens gone; the A'shiwanni and Divine Ones searched but did not know the cause
    of the flight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Ke'yatiwa, the Yellow Corn maiden sent the Black Corn maiden to tell the
    gods of their fears.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A'wan ta'chu Ko'yemshi and Pau'tiwa accompanied the Black Corn maiden back,
    both assuming the form of ducks, and protected the Corn maidens in the spring
    by spreading their wings over the waters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A passage note describes Pa'yatamu as diminutive, crowned with flowers, and
    possessing a flute that causes flowers to bloom and draws butterflies to him.
  category: attribute
  evidence_refs:
  - ev:6
