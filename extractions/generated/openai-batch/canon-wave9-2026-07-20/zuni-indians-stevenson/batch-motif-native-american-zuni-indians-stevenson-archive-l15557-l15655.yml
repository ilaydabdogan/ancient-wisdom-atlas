canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Zuñi ceremonial actions following
    the Sha''lako festival: women deposit offering baskets at Ku''shilowa; Bi''si''si,
    the pe''kwin, Pau''tiwa, Ko''yemshi, mo''lawe, and other ritual officers move
    through plaza, roof, ki''wi''sine, and shrine spaces; meal, smoke, water, masks,
    baskets, plumes, whistles, a rhombus, and directional movements are used in repeated
    rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man of the Ai'vaho'kwe clan throws a line of meal toward Ku'shilowa and
    commands selected women to run.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women run to Ku'shilowa and place baskets containing offerings in a line
    where the Corn maidens are said to have taken their places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bi'si'si descends from the He'iwa ki'wi'sine, passes out by the eastern covered
    way with the pe'kwin, and the two return at sunset with Pau'tiwa and mo'lawe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pau'tiwa is described as wearing white embroidered blankets and a mask and
    carrying a gourd jug of water whose neck is filled with grass.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mo'lawe carry baskets containing watermelon and seeds and hold te'likinawe
    and mi'li while wearing white ceremonial clothing and plumes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Father Ko'yemshi meets the procession at the eastern covered way
    and the group advances across the plaza.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the ki'wi'sine, Pau'tiwa prays at the hatchway while Bi'si'si stands behind
    him and pats him with eagle-wing feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pe'kwin lights a cigarette at the fire altar, takes six whiffs, blows
    smoke over Pau'tiwa's mask and over the water jug six times, and those present
    sprinkle meal over the mask and jug.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After Pau'tiwa exits by the western way, Bi'si'si stands before the place
    Pau'tiwa had occupied.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The pe'kwin places his hands on Bi'si'si's shoulders, turns him to the six
    regions, seats him, and prays over him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Shi'wanni of the Nadir leads a party to He'patina with the water jug,
    a lighted cedar brand, and a whirled rhombus; the water is emptied into a rain
    vase and te'likinawe are deposited at the shrine enclosure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Great Father Ko'yemshi leads fourteen mo'lawe in a circle, stopping four
    times, and prepares meal crosses at the four corners of the ki'wi'sine roof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the roof corners, Bi'si'si stands behind a mo'lawa, blows a hidden whistle,
    taps him with eagle plumes, and the mo'lawa turns and faces specified directions
    while throwing meal lines.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the fourth cross, the Kia'kwemosi sprinkles the plumes, receives the
    basket through an associate, throws meal on the ladder, and descends.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The mo'lawa retains the te'likinawe and mi'li, bends toward the ladder, jumps
    onto it, and is whipped on both sides.
  category: action
  evidence_refs:
  - ev:9
