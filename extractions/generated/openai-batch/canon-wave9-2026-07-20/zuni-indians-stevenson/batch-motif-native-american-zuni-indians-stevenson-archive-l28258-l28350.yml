canonical_text:
  quote: ''
  summary: The passage describes a fourth-night initiation ceremonial into O'naya'nakia,
    including preparation of prayer plumes, altar and fetishes, body painting and
    adornment, presentation and decoration of novices, seating of ritual participants,
    tobacco-smoking over the altar, division of food offerings, and preparation of
    medicine water with prayers and fetishes associated with six directions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members prepare prayer plumes in the ceremonial chamber on the first morning,
    and before sunset a tablet altar is erected with fetishes placed around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fraternity possesses stone animal fetishes, including a bison image and
    a bear fetish, and also a rare human female figure.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described rites are specifically the fourth-night ceremonies, when novices
    appear for the first time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men and women are painted and adorned with white paint, micaceous hematite,
    red-colored eagle plumes, yucca ribbon, bow guards, and necklaces, with some differences
    by gender.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women and men occupy specified ledges and positions in the room before the
    singing begins; women do not use the rattle.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each fraternity father brings one or more fraternity children to the ceremonial
    chamber, and each child carries a large buckskin payment for initiation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Novices are decorated with yucca ribbons and a fluffy eagle plume, and the
    plume is not to be removed for four days, during which animal food and grease
    are forbidden.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After decoration, novices sit in line with female relatives of the fraternity
    father seated on either side, while ritual officers occupy assigned positions
    around the altar.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two rolls of corn husks containing native tobacco and prayer plumes are placed
    in opposite wall niches, then opened by the a'kwamosi to make cigarettes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The a'kwamosi, deputy, and flutist smoke cigarettes while blowing smoke over
    the altar and mi'wachi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The warrior divides a mound of food deposited to the gods into two heaps with
    a space between them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A woman brings a vase of water; the a'kwamosi raises and lowers the empty
    medicine bowl six times and begins a prayer song.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Six gourdfuls of water are poured into the medicine bowl with prayers to the
    Cougar of the North, Bear of the West, Badger of the South, White Wolf of the
    East, A'chiyala'topa of the Zenith, and Shrew of the Nadir.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Six fetishes are raised six times, deposited at directional points, then separately
    raised and lowered over the bowl and dropped into it; six pinches of meal are
    also sprinkled into the bowl.
  category: sequence
  evidence_refs:
  - ev:14
