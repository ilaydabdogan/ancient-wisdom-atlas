candidate_motifs:
- id: motif:1
  label: Masked divine visitation and announcement
  taxonomy_refs: []
  basis: The passage repeatedly describes gods being announced for specific nights,
    appearing or visiting ceremonial rooms, and being received by ritual officers.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic ritual description; it does not narrate
    an independent myth of divine visitation.
- id: motif:2
  label: Ritual shooting, death display, and deer/game identification
  taxonomy_refs:
  - death_rebirth
  basis: A'toshle figures are shot at, fall as if dead, may rise and walk away, or
    are treated as game and identified as deer after ritual handling.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The text presents this as symbolic performance; the death_rebirth taxonomy
    is approximate and should not be read as literal resurrection.
- id: motif:3
  label: Buried or planted offerings to divine rain powers
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe and meal are planted or deposited in excavations, cornfields,
    and river banks to the Council of the Gods and rain-makers.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage describes ritual procedure rather than an explicit transactional
    theology.
- id: motif:4
  label: Corn, food, children, happiness, and rain petition
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: The gods state that they come so the people may raise corn and food, have
    children, and be happy; cigarettes and offerings are directed toward rain, and
    corn and seeds are collected.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The seasonal-cycle tag is supported by the wider ritual timing in the
    passage but the immediate petition is primarily fertility and rain-oriented.
- id: motif:5
  label: Midyear cycle of the great gods
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage links winter Kok'kokshi ceremonies with the summer solstice dancers
    and names a night as the time when the great gods come in the middle of the year.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The exact calendrical meaning of 'middle of the year' should be checked
    against the surrounding source context.
- id: motif:6
  label: Sha'liiko and younger-brother ritual pair
  taxonomy_refs:
  - sibling_pair
  basis: Sha'liiko is repeatedly paired with a younger brother in planting offerings
    and in the selection of actors for the later ceremony.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage describes ritual offices and actors; it does not provide a
    full mythic sibling-pair narrative.
