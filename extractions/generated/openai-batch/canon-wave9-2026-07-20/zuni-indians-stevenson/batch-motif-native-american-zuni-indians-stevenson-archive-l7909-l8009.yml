canonical_text:
  quote: ''
  summary: 'The passage describes winter Kok''kokshi-related ceremonies: A''toshle
    and Ko''yemshi movements through the village, ritual shooting scenes interpreted
    in the text as warding enemies or killing game, masked personators returning and
    disrobing, prayer-plume planting, visits by two Mu''luktakia gods to ceremonial
    rooms, tobacco smoking toward the six regions, announcements of the coming gods,
    prayers for corn, food, children, happiness, and rain, dancer recruitment, seed
    collection, and preparation of offerings to the Council of the Gods and rain-makers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dances are described as occurring in the ki'wi'siwe on the fourth night,
    with gods appearing in the plaza on the fifth morning after Pau'tiwa announces
    their coming.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'toshle do not dance in the plazas; they go about the village and are
    later joined by some Ko'yemshi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At houses, a man of the house sometimes fires blank cartridges at the A'toshle;
    the passage says this symbolizes frightening away or killing Navaho so they will
    not enter Zuñi homes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When an A'toshle falls as if dead, the house door is closed upon him, and
    he soon rises and walks away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In another shooting action, A'toshle and Ko'yemshi are shot as a representation
    of killing game; the shooter is said to be assured hunting success, and the fallen
    figure is carried into the house, laid on a blanket, covered with a sacred blanket,
    sprinkled with meal, and identified to children as a deer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At dusk, all personators of the gods return to the ki'wi'sine, remove their
    masks, put on ordinary clothing, and return home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each chosen Sha'liiko, with his younger brother, goes over the western road
    and plants four te'likinawe in an arm-depth excavation; later the Ko'pekwin makes
    four te'likinawe and plants them in his cornfield to the Council of the Gods and
    the rain-makers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two Mu'luktakia gods from the He'iwa ki'wi'sine visit other ki'wi'siwe and
    announce that the gods, identified in context as Kor'kokshi, will come on the
    fourth night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wor'li lights a reed cigarette of native tobacco, waves it to the six
    regions while puffing, and passes it to each of the two gods, who repeat the action
    with their masks pushed back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When asked why they are present, the gods answer that they come so the people
    may raise much corn and food, have many children, be happy, and prepare for the
    gods' arrival; they also repeat a long prayer in an archaic tongue recounting
    their coming to this world, migrations, and springs passed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Sha'lako wor'we and the two men who will act as Sha'liiko and younger
    brother give te'likinawe to the gods; the elder brother god draws four east-west
    meal lines and places a cigarette and corn-husk meal package on the south line.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the gods leave, the wor'li takes the meal package and cigarette, and
    those present smoke the cigarette and wave it to the six regions for rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The two gods who announce the coming gods deposit received te'likinawe on
    the river banks in an arm-depth excavation to the Council of the Gods and the
    rain-makers, after meal has been sprinkled in and the excavation covered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Two men in each ki'wi'sine, called dance talkers, collect dancers; the selected
    men may decline but later yield to persuasion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: On the fourth afternoon after the announcement, the two gods repeat their
    circuit and say the gods will come at night; the night is called Kok'ko A'wan
    i'tiwannan, explained as the great gods coming in the middle of the year.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: While the two gods notify other ki'wi'siwe, two men from He'iwa collect corn
    and cultivated seeds in blankets, and members of other ki'wi'siwe prepare te'likinawe
    for the Council of the Gods, made into a kia'etchine by each head wor'li.
  category: action
  evidence_refs:
  - ev:9
