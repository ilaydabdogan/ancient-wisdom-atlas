canonical_text:
  quote: ''
  summary: 'The passage describes part of a Shu''maakwe initiation ceremony: an officiant
    passes a ritual object before novices so they draw sacred breath; Shumai''koli
    figures dance and participate in placing medicine-water-dipped corn to novices''
    lips; dancers perform, use plumes and hand gestures over novices, and successive
    directionally colored Shumai''koli appear. Near the morning star''s rising, participants
    watch through the hatchway, a fire is made, and burning corn husks are used in
    a vigorous pelting rite.'
  language: English
  quote_policy: summarized
