canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic accounts of Zuñi witchcraft allegations:
    animal-like nocturnal intruders linked to illness or death, trials and coerced
    disclosures of harmful medicine, the idea that witches shoot substances into bodies,
    theurgic extraction of such objects, and the continued ritual participation of
    some accused persons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker says a cat-like creature entered at night, looked at
    the speaker’s child, left through a broken window pane, and the baby died shortly
    afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man with a sick wife reported seeing a queer-looking burro near his
    house; others later reported that a large cat had entered the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man identified a wrapped man as a wizard and threatened to report
    him to the elder brother Bow priest if the wife died; the wife recovered.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A vice pa'mosono'wikia, described as a female assistant to the scalp custodian,
    was removed from office after the elder brother Bow priest declared her a witch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman’s son was tried as a wizard, hung by the arms from a beam in the
    old church, and said his mother knew more than he did and that he acted under
    her influence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Under threat, the woman described a theft of a buckskin sack, cutting the
    heart or seeds of a mi'li, and depositing excrement in a house to strengthen her
    medicine and bring death to the household.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman said she combined the heart of the mi'li with the hearts of the
    rattlesnake and toad and shot the mixture into children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The warriors released the woman after her promise not to destroy another life,
    but the son was killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The writer reports repeatedly observing theurgists who claimed to extract
    substances that witches had shot into patients’ bodies, producing objects such
    as yarn and a charred goat horn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In one observed treatment for sore eyes, Nai'uchi pretended to extract pebbles
    from a patient’s eyes, but the writer saw that he carried the pebbles in his mouth
    and dropped them into his hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that accused persons could remain conspicuous in religious
    entertainments and sometimes aid in religious festivals.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man of the Hle'wekwe or Sword swallowers, regarded by many as a wizard,
    was not removed from the fraternity and entertained a Sha'luko during the annual
    ceremonial.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A dying patient implicated the Sword swallower; the Bow priesthood tried him
    in the patient’s presence, and he eventually claimed he injured the patient by
    touching the patient’s throat with his fingertips.
  category: sequence
  evidence_refs:
  - ev:9
