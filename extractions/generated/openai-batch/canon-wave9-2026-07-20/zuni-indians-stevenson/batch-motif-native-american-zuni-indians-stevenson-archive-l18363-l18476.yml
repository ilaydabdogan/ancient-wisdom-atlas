canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparation and play of the Zuñi game sho''liwe:
    hair washing, gifts of colored corn and cloth, planting prayer plumes to the Gods
    of War, four split reeds assigned to the elder and younger Gods of War, reed markings
    and throwing rules, scoring, and a ceremonial form played by rain priests for
    rain without personal gain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl prepares suds, and the participant's hair is washed with suds and plumes;
    the uncle's wife also washes the hair while the participant remains seated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle gives four ears of corn, colored yellow, blue, red, and white, tied
    together, along with calico for a shirt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The uncle instructs the participant to carry prayer plumes to an arroyo where
    running water has collected debris and to plant them to the Gods of War; the participant
    whirls a rhombus near the chosen place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each player takes the side of one of the Gods of War; four split reeds are
    used, two assigned to the elder God of War and two to the younger God of War.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The reeds have black paint and markings that denote the whole day, morning,
    noon, sunset, sunrise and sunset, or, in some cases, eyes and mouth of a face.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Representatives of the elder and younger Gods of War arrange the reeds differently;
    the crossing reed is called the thrower, and the reeds are thrown upward against
    a suspended inverted basket covered with cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The trick is won or lost according to which reeds land concave or convex side
    up and which reeds cross; silver buttons are used as favored chips.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sho'liwe is identified as a favorite lot game and a game of professional gamblers,
    but when rain priests play it for rain there is no personal-gain purpose.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the rain-priest form, buckskins replace the cloth and floor blanket; the
    skin on the floor has the head to the east, and part of a circle, quadrant, or
    octant is drawn on it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note states that play must begin on the same day of the month as the loss,
    may continue until the summer solstice, must stop while rain priests are in retreat
    for rains, and may be tried another year while purifying the heart.
  category: sequence
  evidence_refs:
  - ev:7
