canonical_text:
  quote: ''
  summary: 'The passage describes night and morning ceremonies of a Zuñi fraternity:
    sword swallowing with tree portions, visits to another fraternity, administration
    of spruce and piñon buds, prayer-plume deposition, morning preparation of medicine
    water with plumes, buds, fetishes, flute, rhombus, singing, a procession to the
    altar, appeals for rain, meal sprinkling, head washing, black face paint, and
    an outdoor festival ascent with trees and meal scattering.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The night ceremonial is described as a repetition of an earlier ceremony,
    with personal decorations similar to those used in the Sword division ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each member swallows the sword portion of the tree in the ceremonial chamber,
    later takes a sword with a feathered handle, visits a house where another fraternity
    group rehearses, dances, and swallows the sword.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning to their chamber, young spruce and piñon buds are administered
    to the fraternity by the deputy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eight officers go to Si'aa' te'wita to deposit prayer plumes to Na'ke'e; the
    flutist plays, the warrior whirls the rhombus, four keep watch, and two deposit
    the plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning, the 'Hlem'mosona sits near the room center and fireplace holding
    six couples of eagle-wing plumes that represent the six regions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The deputy places a medicine bowl before the a'kwamosi, and a female fraternity
    member places a water vase and gourd near him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The deputy pours six gourdfuls of water into the medicine bowl, motioning
    each time to the six regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The a'kwamosi gives pinches of spruce and piñon buds to the deputy, who motions
    to the six regions and drops them into the medicine bowl; this is repeated six
    times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Six stone fetishes are dropped separately into the medicine bowl.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The deputy uses eagle plumes to draw the water from the four regions to the
    center, from the zenith to the center, and stirs the water for the nadir.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Flute, rhombus, choir, rattle, and drum accompany the consecration of the
    water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The 'Hlem'mosona, flutist, warrior, deputy, a'kwamosi, another officer, and
    other members advance toward the altar in stages marked by four songs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the altar, animal-like calls are made upon the Beast Gods to intercede
    with the Council of the Gods for rain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The deputy places the medicine bowl near the altar, and all sprinkle the altar
    with meal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After departing and returning, the men have their heads washed by female members
    of the fraternity, and the women then wash their own heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: During preparation for the outdoor festival, black paint is applied to the
