  locator: 28172-28178
  quote_or_summary: After departing and returning to the ceremonial chamber, the men
    have their heads washed by female fraternity members, who afterward wash their
    own heads; after the morning meal, preparations begin for the outdoor festival.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
