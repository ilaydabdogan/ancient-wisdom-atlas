canonical_text:
  quote: ''
  summary: The passage describes a Zuñi A'pi'tlashiwanni ritual sequence involving
    feathered gourd sprinklers, wood images of the elder and younger Gods of War,
    prayer plumes, color-coded plume wands, meal paintings, cloud symbolism, an all-night
    song ceremonial, a sunrise plaza action with a divided scalp on a pole, and the
    assembly and adornment of priests and water-bearers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kia'kwemosi prepares two long-necked gourds with reed sprinklers and feather
    attachments; the gourds are later placed on a meal painting and carried by water-bearers
    or sprinklers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wood images of U'yuyewi and Ma'sai'lema, the elder and younger Gods of War,
    are completed on the eleventh day by members of the Deer and Bear clans, and warriors
    deposit prayer plumes in the yucca belts around each image.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sunset the image of the younger God of War is carried hidden under a blanket
    to the house where U'yuyewi is located; the two images are placed facing east
    and become almost obscured by added plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The images are guarded until midnight and then taken with their belongings
    to the ceremonial chamber of the warriors, where the sun priest receives them
    separately and stands them beside the meal painting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder war-god image is placed at the northwest corner of the meal painting
    and the younger at the southwest corner; six plume wands in clay holders are set
    before each image with different color associations and stated offering purposes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Other ritual items, including po'nepoyanne, the Whlan'na, the Kia'kwemosi's
    et'tone, gourd jugs, and mi'wachi, are placed on or near the meal painting and
    cloud symbol.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: An all-night ceremonial is held in the chamber and epic songs of the Gods
    of War are sung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At sunrise the pa'mosona removes a divided scalp from an elevated position
    in the plaza, attaches it to a pole, and plants it in the northwest corner of
    the plaza; a similar meal painting is supposed to be made on the north side of
    the plaza.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: By nine o'clock the first body of A'shiwanni, except specified priests, is
    assembled in the ceremonial chamber; the A'shiwanni sit behind the meal painting
    between two elaborately dressed 'kia'punakwe who are said to be supposed virgins.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that the images are made only at initiation and at the winter
    solstice, with pine struck by lightning selected for the former occasion and cottonwood
    used on the latter to bring rain.
  category: other
  evidence_refs:
  - ev:8
