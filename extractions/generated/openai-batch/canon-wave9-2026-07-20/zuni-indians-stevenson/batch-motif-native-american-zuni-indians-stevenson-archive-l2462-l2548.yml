canonical_text:
  quote: ''
  summary: The passage describes Corn maidens dancing and later disappearing because
    of a great fire. It then recounts how the war-god brothers U'yuyewi and Ma'sai'lema
    use turquoise rabbit sticks in games, revive one another after being struck, kill
    A'shiwi youths, are punished by their grandmother, and then burn the world by
    shooting lightning arrows with rainbow bows into the Sun Father's burning crystal
    shield. The A'shiwi survive because of their iron-like bodies, but the Corn maidens
    and many animals and birds are burned; some animals become stone and are identified
    as the origin of animal fetishes.
  language: English
  quote_policy: summarized
