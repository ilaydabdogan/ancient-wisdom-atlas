candidate_motifs:
- id: motif:1
  label: World-burning catastrophe
  taxonomy_refs:
  - world_destroying_fire
  basis: The passage says the war-god brothers cause the world to become ablaze and
    that a great fire sweeps over the earth, destroying the Corn maidens and burning
    animals and birds.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage also includes survivors and transformed beings, so the fire
    is not absolute annihilation of all beings.
- id: motif:2
  label: Divine brother pair as dangerous agents
  taxonomy_refs:
  - sibling_pair
  basis: U'yuyewi and Ma'sai'lema are explicitly brothers, act together as diminutive
    Gods of War, kill youths, and jointly set the world ablaze.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage calls them brothers but does not call them twins in the provided
    text.
- id: motif:3
  label: Deathlike wounding followed by restoration
  taxonomy_refs:
  - resurrection
  basis: Each brother falls as if dead after being cut by the other's rabbit stick
    and then rises unharmed after the war whoop and hand pressure.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents this as restoration after apparent or severe injury;
    it does not frame the event with a doctrinal resurrection concept.
- id: motif:4
  label: Origin of stone animal fetishes from transformed living creatures
  taxonomy_refs: []
  basis: The passage explicitly explains animal fetishes as animals that were originally
    living creatures and were burned and converted into stone, some becoming diminutive.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No matching taxonomy reference is supplied for an etiological origin of
    fetishes or petrified animals.
- id: motif:5
  label: Survival through preexisting iron-like body condition
  taxonomy_refs: []
  basis: The A'shiwi survive the fire because their bodies retain the hardness of
    iron from the condition they had when they came from the underworlds.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The underworld emergence itself is mentioned only as background in this
    passage, not narrated here.
- id: motif:6
  label: Sacred or guarded game implements with lethal power
  taxonomy_refs: []
  basis: The war-god brothers' turquoise rabbit sticks are envied by youths, refused
    as being only for the brothers, and become lethal when used against the youths.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage identifies the sticks as part of the brothers' games but does
    not explicitly label them sacred.
