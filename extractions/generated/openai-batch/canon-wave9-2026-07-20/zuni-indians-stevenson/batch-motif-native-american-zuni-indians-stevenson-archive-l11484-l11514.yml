- id: obs:1
  text: Directors of the Little Fire and Cimex fraternities delegated two members
    of the Flute order, including an officer, to accompany the writer to a sacred
    spot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The delegated escorts were charged to maintain secrecy so that others would
    not know of the visit.
  category: speech
  evidence_refs:
