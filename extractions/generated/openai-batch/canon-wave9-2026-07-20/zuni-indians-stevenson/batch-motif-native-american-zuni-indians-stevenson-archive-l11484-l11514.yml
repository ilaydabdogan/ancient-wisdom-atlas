  text: The party took an indirect route, described as outwardly resembling a pleasure
    ride, instead of going directly to the locality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The shrine was associated with a cave on a mountain; reaching it involved
    a long and tedious climb.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the cave had become too shaded for photography, objects from the shrine
    were removed and placed in sunlight.
  category: action
  evidence_refs:
