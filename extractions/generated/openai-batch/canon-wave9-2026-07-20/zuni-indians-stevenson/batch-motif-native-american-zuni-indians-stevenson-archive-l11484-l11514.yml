canonical_text:
  quote: ''
  summary: The passage describes a secret visit by the writer and Zuni escorts to
    a mountain cave shrine. Sacred images of Pa'yatamu and te'likinawe with plumes
    are found there. Because the cave is shaded, objects are temporarily removed for
    photography despite an aged officer's distress, then returned. The party is discovered
    while descending, causing excitement in the village and concern that broader knowledge
    of the removal would provoke anger.
  language: English
  quote_policy: summarized
