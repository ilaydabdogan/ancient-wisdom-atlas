canonical_text:
  quote: ''
  summary: 'The passage describes a Cactus fraternity shrine and cactus bed at Corn
    mountain, then gives the sequence for admitting and initiating a novice: cure-related
    request, sacred meal, prayer-plume offerings to deceased members, continence restrictions,
    preparation and collection of cactus and willow with prayers for rain, ceremonial-chamber
    conduct, a procession and meeting of parties, medicine applied to the novice''s
    cactus, and the novice''s prescribed posture.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cactus fraternity shrine is located in an arched cave in the western wall
    of Corn mountain, where many prayer plumes are deposited.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cactus bed below the shrine belongs to the Cactus fraternity and is not
    touched except by the director's order; a separate symmetrical cactus plant receives
    offerings when cactus is to be collected.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Admission is connected with restoration to health by a fraternity member:
    the father of a healed boy presents sacred meal to the curing man, while a healed
    adult may personally ask to join.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four prayer plumes are prepared for deceased members and given to the novice
    to deposit toward the north, west, south, and east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Continence is required from the time the plumes are given until the fifth
    day after the closing ceremonies; violation is said to cause the offender's flesh
    to fill with cactus needles and result in death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fraternity prepares prayer plumes for the Gods of War and the lightning-makers
    so that they will intercede with the rain-makers to send rain on Zuñi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The director prepares additional prayer plumes and a la'showanne with cotton
    cord and turquoise.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The deputy winds the la'showanne cord around the isolated cactus plant like
    a web, plants plumes at its base, deposits food for deceased officers, cuts a
    small cactus, and brings it to the director.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the ceremonial chamber the tablet altar is erected; members tell stories,
    chat, and smoke until midnight, with singing and dancing beginning only later.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the ceremony no woman is to be touched, spoken to, or looked upon;
    a woman bringing food stamps on the roof and leaves before anyone ascends to receive
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Willow switches are collected only after prayers and meal sprinkling; yucca
    pieces are distributed to determine cactus collection tasks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Corn mountain the collecting party attaches a la'showanne to the large
    cactus, sprinkles it with meal, prays for rain, cuts cactus pieces, covers them
    with cedar branches, wraps them, and carries them home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Near Zuñi, willow and cactus bearers meet the director's party; the two groups
    sing different songs, advance slowly, sit in a wash, and medicine is ejected from
    the mouth over the novice's cactus piece.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The novice stands with left foot on a deserted anthill, right foot on the
    ground, head turned south, and left shoulder bared and raised, while the warrior
    stands before him.
  category: action
  evidence_refs:
  - ev:10
