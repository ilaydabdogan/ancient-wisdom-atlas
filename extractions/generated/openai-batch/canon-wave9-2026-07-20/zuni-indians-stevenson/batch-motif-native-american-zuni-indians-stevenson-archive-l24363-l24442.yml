canonical_text:
  quote: ''
  summary: 'The passage describes notes on ceremonial propriety and directors, then
    gives a detailed account of an ''Hle''wekwe healing rite for an invalid: kin present
    meal to a doctor, fraternity members sing, touch the patient with meal, pray eastward
    to the Pleiades and Orion, administer plant medicines that induce vomiting, dispose
    of the ejected material away from the house, later give red-root tea, and deposit
    prayer plumes to deceased fraternity members. It also describes how a restored
    patient may request membership, the winter timing of initiation, clan-linked offices,
    and child members participating in ceremonies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that, among the Zunis and other studied tribes, rites do
    not involve conditions of unchastity, though some ceremonies include suggestions
    of improper conduct.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the last observed indoor ceremonial, the fraternity had an active director
    and an aged retired director who presided ex officio and performed some duties.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A parent or relative of an invalid presents a corn husk of meal to a chosen
    doctor associated with the 'Hle'wekwe; the doctor notifies the warrior, who notifies
    the fraternity members to attend at night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fraternity members go with rattles to the invalid's house and sing; the
    invalid's relatives may be present, and a basket containing the corn husk of meal
    is placed on the floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each fraternity member, including the youngest child, takes meal, runs the
    meal-holding hand up the invalid's larynx to the chin, leaves the house, faces
    east, prays to the Pleiades and Orion for restoration of the invalid, and throws
    the meal eastward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After additional songs, all return home except the chosen doctor and one selected
    woman of the fraternity; the family also withdraws, leaving the two alone with
    the invalid.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A freshly gathered white-blossomed medicine plant is brought in the morning;
    a woman brings the pot and prepares the medicine, and the invalid drinks three
    large gourdfuls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The doctor tickles the invalid's throat with a feather, causing copious vomiting;
    the woman who prepared the medicine carries the ejected material away from the
    house, and the treatment is repeated for four mornings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fifth morning and the three succeeding mornings, a warm tea made from
    a red root is administered; after the tea, the doctor and woman each deposit two
    prayer plumes to deceased members of the fraternity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A person restored to health by the 'Hle'wekwe may request to join the fraternity
    by giving the doctor meal wrapped in a corn husk with an eagle plume pendent from
    the wrapping cord.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the request to join is made in summer, initiation waits until a winter
    has passed, because the 'Hle'wekwe holds only winter ceremonials.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage assigns some fraternity offices to particular clans, including
    the sword director, deputy, other offices, and warrior.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Two children were brought into the fraternity because the warrior's clan had
    few representatives; the boy asked to be excused, but his mother insisted.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy member had not learned to swallow the sword, but he shook a small
    rattle, kept time in the dance, and endured cold midnight walks in snow during
    January and February.
  category: action
  evidence_refs:
  - ev:10
