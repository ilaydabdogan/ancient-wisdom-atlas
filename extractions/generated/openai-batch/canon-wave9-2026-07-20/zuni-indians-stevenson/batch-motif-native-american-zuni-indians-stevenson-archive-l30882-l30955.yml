canonical_text:
  quote: ''
  summary: A novice is ritually encircled with cactus while Ku'pishtaya of the directions
    are invoked. After a shoulder strike and procession to the village ceremonial
    chamber, ritual objects are arranged, medicine water is consecrated with song
    and instruments, and officers use cactus and willow switches in prayers for rain,
    purity of heart, health, and safe use of cactus. The novice then dances alone
    with cactus before the day's ceremonies end with a meal and smoke.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An older brother How priest, described as one of the fraternity warriors,
    takes cactus in his right hand and circles the novice, stopping to call on Ku'pishtaya
    at directional stations.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The novice does not change position during the encircling; the warrior strikes
    him across the left shoulder and throws the remaining cactus on the ground to
    his left.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: The group proceeds in file to the village, led by the director and followed
    by named officers and the novice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: Six archaic stone knives belonging to the Shi'wanni of the West are placed
    in couples before the altar of the 'Ko'shi'kwe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fraternity father gives the novice a prayer plume made by himself; the
    passage identifies it as an offering to the Gods of War.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cactus pieces, extra cactus, and long willows are placed in designated parts
    of the chamber, and all but the novice change into black woven breechcloths.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The novice sits on the north side with his fraternity father to his right;
    the choir is on the south side with rattles and a wooden hide-covered drum.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The pe'kwin consecrates medicine water using a vase, gourd, and medicine bowl
    while the choir sings, a drum and rattles sound, and a warrior whirls a rhombus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Songs are addressed to Ku'pishtaya, his pe'kwin Si'kiahaya, and the deceased
    A'pr'liishiwanni so that the fraternity may use cactus without injury; six small
    stones are dropped into the water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Officers dance holding long willows and cactus, while the novice changes into
    a black woven breechcloth and moves his prayer plume up and down before his fraternity
    father.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Officers and members place switches and cactus before the novice's mouth,
    shoulders, head, and heart while praying for rain, a good heart, health, and purity
    of heart.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The novice receives two pieces of cactus, dances alone with them for about
    half an hour, then resumes his seat; the fraternity eats and smokes, ending the
    day's ceremonies.
  category: sequence
  evidence_refs:
  - ev:10
