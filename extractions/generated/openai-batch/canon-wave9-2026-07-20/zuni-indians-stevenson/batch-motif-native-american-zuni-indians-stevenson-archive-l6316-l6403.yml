canonical_text:
  quote: ''
  summary: 'The passage describes fourth-day ceremonial preparation: an eagle is brought
    from its cage, plucked, and ritually treated with corn and kaolin so its white
    plumes will regrow; plume sticks are prepared with breath and prayer; bread is
    prepared for feasts; the new-year fire-maker gathers cedar wood and coals for
    a sacred fire; the pe''kwin makes a meal painting and later leads offerings to
    paired War God idols with Bow priests who whirl rhombi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plucking of an eagle takes place in the house of a prominent shi'wanni
    on the fourth day.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male family members arrange plumes, the shi'wanni's stepson brings a caged
    eagle under a heavy blanket, and men restrain the bird's feet and head on the
    blanket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An ear of white corn is placed east of the eagle while the eagle's head is
    oriented west.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: After plucking, the feathers are deposited in an Apache basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder daughter washes eagle plumes in water, dries them near the fire,
    and rubs them with kaolin; the younger daughter mixes kaolin with water in a small
    bowl and places it north of the eagle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the plucking, the stepson bites grains from the white corn, takes a
    mouthful of kaolin mixture, and the mixture of kaolin and chewed corn is put into
    the eagle's mouth and rubbed on places where plumes should grow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that corn is used so the plumes may grow as corn comes
    up, and kaolin is used so the plumes may be white.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old shi'wanni sits near the fire with plumes and plume sticks, attaches
    sorted plumes to sticks, breathes upon each completed te'likinane, and offers
    a prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The eagle is carried back under the blanket to its cage, where it remains
    until another plucking is required.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wheat and corn bread are prepared for feasts, and light bread in fanciful
    shapes is baked in ovens that illuminate the town on the fourth night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At noon on the fourth day, the new-year fire-maker collects a cedar fagot
    from each house, and the donor prays for bountiful crops in the coming year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fire-maker deposits collected wood in the He'ivva ki'wi'sine through the
    roof hatchway and continues until every house in Zuñi has donated wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the last wood load, the fire-maker collects coals from a fireplace in
    the house directly east, deposits them at the fire altar, and arranges wood in
    a square, log-cabin fashion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The fire lit at sunset is called ma'ke tesh'kwi, glossed in the passage as
    fire not to be touched or sacred fire.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: At sunset the pe'kwin makes a meal painting at the west end of the ki'wi'sine
    and later places on it the kia'etchine composed of te'likinawe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: At midnight the first body of A'shiwanni assembles, and the idols of the Gods
    of War are brought from the house where they had stood in state.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The pe'kwin leads with a meal basket and sprinkles meal first on the elder
    War God idol and afterward on the younger.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The elder and younger brother Bow priests each place a te'likinane in the
    idols' belts, sprinkle the idols with meal, stand north and south of the pe'kwin
    or sun priest, and whirl rhombi.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: After prayers, the procession begins with the pe'kwin leading and sprinkling
    meal.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:20
  text: A note defines the rhombus as two slender wooden slats attached by a string
    and says that among Pueblo tribes it is whirled to create enthusiasm among the
    u'wannami, or rain-makers.
  category: attribute
  evidence_refs:
  - ev:13
