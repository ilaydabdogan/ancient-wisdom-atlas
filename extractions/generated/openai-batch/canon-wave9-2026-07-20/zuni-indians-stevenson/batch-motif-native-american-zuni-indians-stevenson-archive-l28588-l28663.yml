canonical_text:
  quote: ''
  summary: The passage describes a Zuñi healing ceremony performed over a young man
    with smallpox. The Kia'kwemosi directs assistant theurgists using medicine water,
    eagle plumes, sacred meal, incantations, and appeals to Beast Gods and directional
    winds over four nights. The prayers are restricted to a small audience. The passage
    then gives an origin account for the Rattlesnake fraternity as a division arising
    after a medicine bowl was broken, medicine-water spilled, and a rattlesnake carving
    overturned before an altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ceremonial is witnessed over a sick young man with smallpox after other
    theurgists had failed to cure him and the Kia'kwemosi was appealed to.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr Stevenson and the writer enter despite a sleeping guard, and one officiating
    theurgist says their presence would be fatal to the invalid.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The room is dimly lit; the Kia'kwemosi sits in the center facing east, dressed
    in white cotton, with medicine water, eagle plumes, and sacred meal before him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The patient partially reclines on a blanket on the north side of the room
    and is supported by his mother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two theurgists act under the Kia'kwemosi's direction; one holds eagle-wing
    plumes, and the other holds plumes and a bowl of medicine water.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Medicine water is taken into the mouth, sprinkled on the patient's nude body,
    and accompanied by waving eagle plumes and incantations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kia'kwemosi places pinches of sacred meal in spots over the patient's
    body and calls on the Beast Gods for power to draw the disease to one of the meal
    spots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kia'kwemosi states that if the prayer is not answered and the disease
    does not show itself, the patient's heart is not good.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The patient is visited for four nights, with a different Beast God appealed
    to each night for a wind from one of the four quarters of the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Only the mother, doorkeeper, and officiants are present, and the Kia'kwemosi's
    prayers must not be heard by any other person.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Kia'kwemosi officiates as a member of the order of Mystery medicine of
    an esoteric fraternity, while his high priestly position is said to add power.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Rattlesnake fraternity is said to have arisen after a member broke a medicine
    bowl, spilled medicine, and overturned a rattlesnake carving before the altar,
    leading to a quarrel and division.
  category: sequence
  evidence_refs:
  - ev:6
