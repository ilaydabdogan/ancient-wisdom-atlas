canonical_text:
  quote: "“But two escaped this tragic death, a youth and a maiden, brother and sister...”"
  summary: 'The passage describes a Zuni ritual dramatization in which the Kor''kokshi
    is personated by a ko''thlama wearing woman''s dress, then turns to a battle narrative:
    after A''shiwi prayers and rain, Kow''wituma learns from the Sun Father that Ku''yapali''sa''s
    heart is in her rattle and kills her by striking it. An alternate version has
    solar aid given through turquoise rabbit sticks. The A''shiwi release three gods,
    the Kia''nakwe are driven into waters sealed with stone slabs, their ghost selves
    go to Ko''thluwala''wa, and only a brother and sister survive by hiding in a cave.'
  language: English
  quote_policy: quoted
