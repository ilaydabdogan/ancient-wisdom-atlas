canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of the order of Pa'yatamu within
    the Little Fire fraternity. Gods of War discover Pa'yatamu playing flute at a
    spring by Shun'te'klaya while maidens grind corn and sing. Pa'yatamu is later
    summoned for Little Fire ceremonies, plays while maidens grind medicine, passes
    his flute to participants so they may draw sacred breath, attends the Corn Maidens
    dance, gives his flute to a fraternity member, and initiates him into its secret
    use. That member initiates nine others and forms the order named after Pa'yatamu.
    The passage also describes novices receiving a flute and te'na'sali mixture, offerings
    and medicine associated with Pa'yatamu, ritual preparation and restricted use
    of te'na'sali, and a short note on male membership rules for the Cactus fraternity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that present Zunis commonly believe the Little Fire fraternity
    originated with the Hopis, but do not credit the order of Pa'yatamu as Hopi; it
    also states that Zuni and Hopi ideas of the god of music are similar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gods of War hear sweet music east of Zuni, approach the mesa Shun'te'klaya,
    and find that the music comes from a spring at the base of the mountain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the spring, Pa'yatamu is found playing a flute while eight maidens grind
    corn and sing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Little Fire fraternity prepares a ceremonial, its director sends
    a member to request Pa'yatamu to play his flute while the fraternity maidens grind
    medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pa'yatamu remains four days and nights, accompanies the maidens' songs on
    his flute, then on the fifth morning passes the flute to the lips of those present
    so that sacred breath may be drawn from it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a Corn Maidens dance, Pa'yatamu arrives the previous night, stays in the
    fraternity chamber, takes a seat near the dancers' pavilion at sunrise, and plays
    for part of the dances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before leaving I'tiwanna, Pa'yatamu presents his flute to a fraternity member
    and initiates him into the secret of playing it; that member later initiates nine
    others, names the order Pa'yatamu, and becomes its director.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A flute is made for each member of the new order after the flute presented
    by Pa'yatamu.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A novice receives a flute and the te'na'sali mixture from his fraternity father;
    the order plays during the Hla'hewe ceremonial, and prayer plumes offered to Pa'yatamu
    may be longer than common offerings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A note says Pa'yatamu causes flowers to bloom with flute music and calls together
    butterflies of the world with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The te'na'sali plant is described as bearing blossoms of the colors of the
    six regions and is collected once every four years with prayer-plume offerings
    to the sun, moon, Pa'yatamu, and te'na'sali.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Directors of Pa'yatamu orders in the Little Fire and Cimex fraternities claim
    to combine te'na'sali flowers with hearts of butterflies and dragonflies; the
    preparation is called sun medicine.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The te'na'sali is ground ceremonially in a fraternity chamber while all order
    flutes are played before the altar; it is placed in a large shell on a cloud symbol
    of meal and crushed with a smaller shell.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The powdered te'na'sali flowers and root are administered in small quantities
    to male fraternity members, are forbidden to women, and are also taken into the
    mouth and spit on the body for psychic purification or spit out while traveling
    to help follow the right course.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Membership in the Cactus fraternity is confined to males; eligibility includes
    killing an enemy without taking the scalp, being cured of certain wounds or a
    dog bite, or being struck by a flying bit of cactus during an outdoor ceremony
    and caught while running off.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: A Cactus fraternity member cannot join the Bow priesthood until he has taken
    four scalps.
  category: relationship
  evidence_refs:
  - ev:8
