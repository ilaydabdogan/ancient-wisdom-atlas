  summary: The passage recounts fieldwork by the Stevensons among Zuñi, Rio Grande
    pueblos, Hopi villages, and ruins in New Mexico and Arizona; describes collecting
    photographs, ritual objects, pottery, and archaeological materials; notes the
    discovery and documentation of ruins in canyon del Muerto; explains the urgency
    of preserving objects for the National Museum; and states the writer’s intention
    to present Zuñi esoteric beliefs, rituals, habits, and customs while reserving
    some material for future publication.
