canonical_text:
  quote: ''
  summary: 'The passage describes second-day and second-night Zuñi ceremonial actions:
    dawn prayers to the rising sun, white-painted warriors in ritual dress, plaza
    spectators and gift scrambling, kin and clan women bringing baskets and sprinkling
    sacred meal, warriors distributing gifts, evening east-west movement by warriors
    and choirs, disease-removal rites with eagle-wing feathers and cedar bark, and
    washing with yucca suds. It then introduces the quadrennial dance of the Kok''ko
    ko''han, or white gods, connected with the Kia''nakwe, white blankets, ghost people
    angered by destruction, and a propitiatory ceremony.'
  language: English
  quote_policy: summarized
