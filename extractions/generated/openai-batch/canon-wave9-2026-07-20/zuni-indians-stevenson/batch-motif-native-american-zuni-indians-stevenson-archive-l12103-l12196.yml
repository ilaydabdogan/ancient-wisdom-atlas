comparison_claims:
- id: claim:1
  claim: The gift-distribution sequence can be cautiously compared at the functional
    level to a sacred-exchange motif family because ritual food and valuables move
    through kin and clan networks to warriors and then to the public crowd, with sacred
    meal marking the ceremonial action.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe a divine recipient or a stated return
    gift, so the comparison is functional rather than a claim of identical mythic
    structure.
- id: claim:2
  claim: 'The Kia''nakwe explanation supports a cautious same-function comparison
    to propitiation patterns for offended dead or ghost beings: a recurring ceremony
    is performed because ghost people are angry over their destruction.'
  claim_level: same_function
  target: propitiation of offended ghost people pattern
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt does not provide the full myth of the destruction or the
    details of the propitiatory offerings.
- id: claim:3
  claim: The warriors' snake body painting supports only a visual-similarity comparison
    to serpent motif material, since snakes are represented as painted forms rather
    than acting as narrative figures in this passage.
  claim_level: visual_similarity
  target: serpent motif family
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: The passage mentions snake representation but gives no serpent episode,
    speech, agency, or mythic role.
