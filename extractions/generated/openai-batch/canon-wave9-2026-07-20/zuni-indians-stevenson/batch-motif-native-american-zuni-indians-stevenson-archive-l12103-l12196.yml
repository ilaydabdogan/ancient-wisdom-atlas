- id: motif:1
  label: Thanksgiving for crops as calendrical ritual cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage locator identifies the section as a Thanksgiving Festival for
    Crops, and the passage describes repeated day and evening ceremonial sequences;
    it also introduces a separate quadrennial ceremonial cycle.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:10
  confidence: medium
  cautions: The excerpt is ethnographic description rather than a myth narrative;
    the crop-thanksgiving label comes from the supplied passage locator.
- id: motif:2
  label: Sacred exchange through food and gift redistribution
  taxonomy_refs:
  - sacred_exchange
  basis: Kin and clan women bring baskets and sprinkle sacred meal, after which warriors
    distribute basket contents, cloth, ribbon, food, clothing, and other goods to
    the crowd.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage records ritual redistribution but does not state an explicit
    reciprocal transaction with divine beings.
- id: motif:3
  label: Ritual purification and removal of disease
  taxonomy_refs: []
  basis: A theurgist uses eagle-wing feathers to carry off disease, rooftop participants
    perform cedar-bark prayer actions, and individuals undergo washing in yucca suds
    with prayers for health and prosperity.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No broader mythic origin for these purification actions is supplied in
    this excerpt.
- id: motif:4
  label: Propitiation of angered ghost people
  taxonomy_refs: []
  basis: The Kia'nakwe are described as ghost people angered by their destruction,
