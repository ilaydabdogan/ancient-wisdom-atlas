canonical_text:
  quote: ''
  summary: The passage describes mortuary handling of Nai'uchi's belongings and ritual
    objects, including bundles, prayer plumes, meal sprinkling, and burial excavations.
    It then explains why his mask was not buried and describes In'nocita's fear that
    witches or a spirit might approach the household at night, leading to precautions
    around stones, doors, windows, and a night watch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In'nocita gathered the old priest's belongings into two bundles, which were
    left on the roof overnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next morning Nina and In'nocita each carried one bundle, along with prayer
    plumes, to the burial place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Associate rain priests and the writer also carried prayer plumes to the burial
    place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One excavation was dug for the articles, and a smaller excavation was made
    for the prayer plumes and the war pouch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party prayed and sprinkled meal over the prayer plumes before returning
    to the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: No mask was buried for Nai'uchi because he had not worn his mask or danced
    with the personators of anthropic gods since his hair had been cut while he was
    a prisoner in a Territorial jail.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nai'uchi's mask was to go to a male member of his family, and he would not
