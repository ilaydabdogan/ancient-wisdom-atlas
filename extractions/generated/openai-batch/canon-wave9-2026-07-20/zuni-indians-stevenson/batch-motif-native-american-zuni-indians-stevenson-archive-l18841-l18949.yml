canonical_text:
  quote: ''
  summary: The passage describes Zuni games with ritualized hiding, guessing, wagers,
    offerings, prayer meal, smoke directed to six regions for rain, deposits at Corn
    Mountain, association with the Gods of War, a rain priest's gaming ball, and later
    descriptions of Ho'kiamonne and Le't-pochiwe implements and rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A leader places cups and a ball under a blanket, brings sand around them,
    lights a husk cigarette, and puffs smoke over the cups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cigarette is waved toward North, West, South, East, Zenith, and Nadir
    so that rain-makers of the six regions and all the world will send rain upon Zuni.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A head watcher from the opposite side touches cups to find the hidden ball,
    and straws are paid or lost according to which cup is touched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corn-husk offerings are moved closer to the plant bunch, which remains
    at the center, and the ball is always immediately over that spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The game continues until one side possesses all the straws.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When placing the ball, the leader addresses it and tells it to go to its mother
    Ko'hakwa, the nearby planted bead, and not to its father 'Hli'akwa, Turquoise,
    if it wishes to move about.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The game may continue four or five days, and participants must not sleep,
    eat, or drink during it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the game, the first leader removes all deposits except the black archaic
    bead, which remains permanently in the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Prayer meal is sprinkled over the basket containing the game, offerings, money,
