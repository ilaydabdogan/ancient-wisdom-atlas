    A'wonawil'ona, and deceased gamesters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The leader carries offerings from his side to Corn Mountain and deposits them
    at the shrine of the younger God of War.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The leader returns the rain priest's gaming ball and presents the rain priest
    with a string of precious beads, which the rain priest adds to those wrapping
    his et'tone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ho'kiamonne uses a yucca-ribbon ball and two slender sticks with corncob pieces
