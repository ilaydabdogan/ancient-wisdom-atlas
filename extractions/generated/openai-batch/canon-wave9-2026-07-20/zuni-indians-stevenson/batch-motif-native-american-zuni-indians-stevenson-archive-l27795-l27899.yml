canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial sequence involving the Arrow order,
    the Great Fire fraternity context, a novice, the 'Hlem'mosona, dancers, musicians,
    and ritual objects. Participants dance around an altar and later around boxes
    of the 'Hle'wekwe, swallow arrows and swords while facing prescribed directions,
    and conclude with prayer for cold rains and snows followed by a circle dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hlem'mosona stands near the east wall; the novice moves to the middle
    of the floor facing east; the drummer stands near the south wall west of the fireplace.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants dance once in an ellipse around the altar; the 'Hlem'mosona swallows
    an arrow; others repeat the arrow swallowing; the fraternity father draws his
    arrow before the novice's shoulders, mouth, and head; the novice makes four unsuccessful
    attempts to swallow the arrow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party goes to the Si'aa'te'wita or plaza, preceded by the drummer; the
    leader sprinkles meal and carries a pottery meal basket and a po'nepovanne; dancers
    carry bows, arrows, a swallowing arrow, and rattles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boxes of the 'Hle'wekwe are encircled four times; the group shouts; the
    arrow director waves an arrow over the boxes and swallows it while facing east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arrows and swords are placed horizontally to the mouth while the head is erect,
    then pushed down as the head moves gradually backward; the feat is performed with
    care, and only three men dance while swallowing the arrow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each participant in turn steps before the boxes, faces east, and swallows
    an arrow; one man who first fails succeeds after waving the arrow over the boxes;
    groups of two face the cardinal points as they swallow arrows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note states that the arrows belong to the order rather than to individuals
    and vary in coating, size, and form.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the third dance, the 'Hlem'mosona receives the arrows and dancers are
    provided with swords for the closing dances.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When swords are first carried, the 'Hlem'mosona steps before the boxes, faces
    west, prays, and he and two others swallow swords; groups then follow in succession.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The 'Hlem'mosona later steps before the boxes, prays, and swallows a serpentiform
    sword.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Arrow order is joined by women of the Sword order for another dance; the
    'Hlem'mosona and a warrior of the 'Hle'wekwe appear from the western way, stand
    before the boxes, and pray.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the last dance in the plaza, groups of men, women, and a girl swallow
    swords while facing north, east, south, or west; the 'Hlem'mosona is listed facing
    east.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the close of sword swallowing, the 'Hlem'mosona collects the swords and
    prays that A'uhiyala'topa and the Beast Gods will intercede with the rain-makers
    for cold rains and snows.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the prayer, most participants clasp hands in a broken circle while musicians
    play notched sticks and sing; dancers shake rattles, sing, jump toward the center,
    and hold swords with feathered handles inward.
  category: action
  evidence_refs:
  - ev:10
