canonical_text:
  quote: ''
  summary: The passage describes altar prayers and dismantling, then a February U'huhukwe
    ceremonial involving initiation into a Mystery medicine order, public and chamber
    displays with fire, appearances by He'hea and Na'wisho gods, ritual jugglery,
    prayers for snow to the six regions, and a closing enforcement of attendance by
    an aged member carrying a flaming brand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men assemble before the altar and pray after daylight comes through the eastern
    window; women pray outside to the Sun Father, then return to sprinkle meal on
    the altar and pray.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kia'kwemosi, rain priest of the North and member of the U'huhukwe, removes
    animal fetishes from before the altar, and owners of the mi'wachi collect their
    objects before the altar is taken apart and stored.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The February ceremonial includes initiation into the Mystery medicine order,
    playing with fire, and a greater display of jugglery than the December meeting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the third and fourth days, members appear in the street and on housetops
    with blazing cedar-fiber brands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three He'hea and six Na'wisho, described as anthropic gods, appear; only the
    He'hea go to the U'huhukwe ceremonial house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The He'hea have nude bodies covered with white kaolin, with lines drawn through
    the paint and a yellow crescent painted on each back.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The He'hea are pelted with fire from cedar brands, flee to the street, and
    are chased with flaming brands up ladders to roofs, where they are pelted again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gods climb a pole and perform gymnastics on ladders and a suspended horizontal
    pole; fraternity men and women also pelt one another with fire.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Two men of the fraternity run about a thousand yards in a meandering course
    while carrying flaming masses of cedar fiber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night in the ceremonial chamber, one trick makes a yucca rope appear to
    pass through another person's body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another trick presents balls of blue mush that are pliable, then hard as stones
    after prayers for snow to the six regions, then pliable again after further prayers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The U'huhukwe and Ha'lo'kwe are described as the most expert jugglers in Zuni.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the closing evening an aged white-haired member with a flaming brand enters
    the house of a tardy woman of the fraternity and starts her out before the brand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The tardy woman is expecting to become a mother, but the passage says she
    is not allowed freedom of action and must not omit her duty to the fraternity.
  category: relationship
  evidence_refs:
  - ev:8
