canonical_text:
  quote: ''
  summary: The passage describes ritual performances involving Ko'yemshi and Little
    Fire fraternity members. Eagle feathers or plumes are passed through flame, become
    charred, are pressed to the body during dancing, and reappear as plumes. A later
    1896 performance occurs in a Ko'yemshi-dedicated house with an altar, medicine
    water, corn, masked Ko'yemshi, painted fraternity members, a procession to Sha'lako-blessed
    houses, a meal disk and cross, a gourd with plumes, animal-like movement, and
    a second fire-and-plume reappearance sequence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The A'kwamosi, identified as maker of medicine water, carries a basket of
    eagle feathers tied in twos to the fraternity director, who takes one bunch, holds
    it up, sings, and dances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Ko'yemshi passes the feathers through a lit lamp flame and brings back
    charred bits; later another fraternity member passes the charred bits through
    flame, presses them to his breast, and white plumes appear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 1896 Little Fire fraternity performance occurs in a house dedicated by
    the Ko'yemshi, where an altar remains with mi'wachi, two bowls of medicine water,
    two baskets of multicolored corn, and a small flute.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Twenty-four members prepare for the dance and reappear with bodies decorated
    in white kaolin representing the heavens, prey animals, and lightning; use of
    the lightning symbol is limited to specified members with other priesthood or
    order affiliations.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ko'yemshi remove their moccasins, put on masks, throw off blankets, expose
    ragged black kilts, and carry gourd rattles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dance file is led by a woman carrying a meal basket and mi'li; the rear
    member is the pe'kwin of Shu'maakwe, carrying a mi'li and meal basket and wearing
    an eagle plume through the septum as a badge of office.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nai'uchi carries a small basket tray with a white hemispherical gourd capped
    with red cotton and white fluffy eagle plumes, and he also carries two eagle-wing
    plumes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: After circling the room and forming an ellipse, the fraternity and Ko'yemshi
    visit six houses blessed by the Sha'lako.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the first house, the host leads the dancers, meal is sprinkled, the Great
    Father Ko'yemshi spreads a blanket, and Nai'uchi makes a meal disk with four outward
    lines forming a cross before placing the basket tray on the disk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a whisper from the pe'kwin, he moves about like an animal while others
    give warning cries; he plucks plumes from the gourd, passes them through fireplace
    flames, returns with charred bits, dances in a cowering posture, and the plumes
    reappear.
  category: action
  evidence_refs:
  - ev:6
