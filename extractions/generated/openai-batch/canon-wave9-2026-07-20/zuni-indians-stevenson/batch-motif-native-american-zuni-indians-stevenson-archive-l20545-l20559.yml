  summary: 'The passage describes Zuñi basketry: ordinary coarse baskets made from
    local plant materials, their carrying and storage uses, specialized receptacles,
    and the purchase of finer bread baskets and ceremonial trays from Apache, Hopi,
    and other neighboring Indians, with Apache products especially prized.'
