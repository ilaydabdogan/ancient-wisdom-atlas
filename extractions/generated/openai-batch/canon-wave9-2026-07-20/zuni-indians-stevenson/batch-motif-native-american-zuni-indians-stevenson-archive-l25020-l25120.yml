canonical_text:
  quote: ''
  summary: The passage describes a ceremonial entrance and performance by the Hle'wekwe,
    including dress, musical accompaniment, carrying and swallowing swords before
    boxes, circling the boxes three times, and a prayer gesture to the six regions.
    It also reports an accidental contact incident requiring a musician to consent
    to membership, then describes a similar Sword order of the Great Fire fraternity
    performance and a subsequent circle-dance preparation in which girls sprinkle
    meal over the boxes and pray.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hlem'mosona follows a woman leader, wears white garments with plumes,
    carries swords, and precedes other officers and the fraternity at large.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male Hle'wekwe participants wear black woven kilts, bow wristlets, necklaces,
    leg yarn with bells, carry gourd rattles and swords, and some carry multiple swords.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The swords are described as juniper implements measured from fingertip to
    elbow; the aged warrior has a serpentiform sword tipped with an arrow point and
    swallows it cautiously.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and girls carry eagle-wing feathers and swords, make hooting or animal-like
    sounds, shake rattles, sing briefly, and move in single file with slow even steps
    to music.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the boxes, the Hlem'mosona waves a sword before and over them, faces east,
    swallows it, and then other participants swallow swords in succession; fraternity
    fathers swallow for women who fail and for very young children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After all Hle'wekwe enter, they form an ellipse, pass around the boxes three
    times, swallow swords each time, and the Hlem'mosona prays while moving the sword
    to the six regions and again over the boxes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A musician accidentally touches a dancer; after discussion, the musician is
    pressed to consent to become a fraternity member, which is said to save the touched
    member from possible ills or death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sword order of the Great Fire fraternity arrives in a similar order with
    a woman leading, holds swords in the left hand, uses a similar step, and has groups
    of two or three swallow swords together before the boxes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the Great Fire fraternity leaves, the smaller box is placed north of
    the larger one; eight men from the East ki'wi'sine play notched sticks, and girls
    sprinkle meal over the boxes, pray, and begin a circle dance.
  category: sequence
  evidence_refs:
  - ev:8
