- id: obs:1
  text: After an initiation, a feast is served in the ki'wi'sine, with food brought
    to the roof hatchway by families of the Sa'ya'hlia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the feast, boys leave one by one with their godfathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sa'ya'hlia go to the plaza while the Kor'kokshi are dancing and use yucca;
