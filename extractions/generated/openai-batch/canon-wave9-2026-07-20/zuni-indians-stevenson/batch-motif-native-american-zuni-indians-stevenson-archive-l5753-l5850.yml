canonical_text:
  quote: They retire to the He'iwa ki'wi'sine, where they, with two Ko'yemshi, pass
    the boys assembled there through voluntary initiation into the Ko'tikili.
  summary: The passage describes a post-initiation feast, a Kor'kokshi rain-maker
    dance with masked god and goddess personators, ritual meal sprinkling, Sa'ya'hlia
    use of yucca, and the voluntary initiation of assembled boys into the Ko'tikili.
  language: English
  quote_policy: quoted
