canonical_text:
  quote: ''
  summary: 'The passage describes several days of the A''pi''tlashiwanni ceremonial
    sequence: a procession from the ceremonial chamber to the large plaza, the raising
    of a pole with a scalp attached, prayers and communal dances around the pole,
    later dances by named ritual groups and girls representing opposing sides, preparation
    and distribution of ceremonial food by Eagle clan members, a serpent-like meander
    dance said to be for destruction of the enemy, and offerings of ground shell and
    turquoise beads to the Gods of War.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'si'hakoshona'kwe and their fellows leave the chamber abreast, remove
    cedar twigs from over the doorway, and carry the twigs with bows and arrows in
    their left hands while each holds a single arrow in the right hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The procession order includes the elder brother Bow priest after the scalp-washers,
    then the victor and his elder brother, other warriors in couples, the vice pa'mosona,
    two o'tailasho'nakwe, and the ha'shiya.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: As participants emerge from the chamber, couples separate to form two lines,
    and the o'tailasho'nakwe dance back and forth between the lines to song and drum.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Several girls aged about six to ten join the procession as it advances to
    the plaza, having been placed there by their mothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the plaza, the pa'mosona and his vice raise a pole with a scalp attached.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: While the scalp is being tied to the pole, the elder brother Bow priest calls
    to people on housetops and in the plaza to join the dance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the pole is placed, the pa'mosona and his aid stand close by it and
    pray.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The party from the ceremonial chamber dances around the pole for an hour in
    two facing concentric circles; later a circle around the pole grows as people
    of both sexes and all ages join through the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: On the seventh day, ha'shiya dance in the ceremonial house, then all go to
    the plaza led by the elder brother Bow priest; pu'panakwe with pottery drums group
    on east and west sides, representing Vyuyewi and Ma'sai'lema.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The pu'mokiakianawe, glossed as hatchet-bearers, also dance in the plaza,
    and the ha'shiya repeat their dancing on the eighth day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Members of the Eagle clan assemble to prepare corn meal and flour; girls and
    younger women grind and remove corn from the cob, while crones toast the corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The corn and wheat used by the A'pi'tlashiwanni during the ceremonial are
    the gift of the victor's father, who belongs to the Eagle clan, while the victor
    belongs to the Turkey clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the grinding work, a feast is served to the workers, and at sunset the
    meal and flour are carried to the victor's house, where each grinder receives
    stew or bread from the hostess.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The o'tailasho'nakwe dance in single file before the elder brother Bow priest's
    house, around the village, and in the large plaza, proceeding like a great serpent;
    the writer designates it the meander dance and says it is for destruction of the
    enemy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: On the ninth day, the elder brother Bow priest grinds bits of shell and turquoise
    beads to be offered to the Gods of War.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The pa'mosona and vice pray over drums; one drum is opened and placed in the
    northeast corner, while the other is carried to the plaza, where pu'panakwe wait
    and smoke before the dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Eight girls, four for each side of the pu'mokiakianawe dance, gather in two
    houses, where necklaces and other ornaments are added to their apparel, including
    white blankets bordered in red and blue.
  category: attribute
  evidence_refs:
  - ev:6
