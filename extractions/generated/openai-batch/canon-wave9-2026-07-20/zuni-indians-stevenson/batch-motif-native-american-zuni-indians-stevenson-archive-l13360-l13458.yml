canonical_text:
  quote: ''
  summary: The passage describes preparations for the Zuñi Sha'lako festival, including
    swept streets, ritual excavations, house fires, crowds of observers, and the preparation
    of masks by initiated persons. It records rules and punishments connected with
    seeing masks in preparation and with a Sha'lako representative speaking to women.
    It then describes November night ceremonies in which Shu'laawi'si and his ceremonial
    father proceed to He'patina, a shrine described as symbolic of the Middle of the
    world, deposit prayer plumes, sprinkle meal, and meet priestly groups and personators
    of the Council of the Gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the day of the festival, the streets are swept, six excavations are made
    in different sections of town, and an excavation is also made under the ladderway
    of each house to be consecrated; earth mounds and stone slabs are placed beside
    the openings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fires blaze in every house, and the passage states that this denotes an occasion
    of importance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: House tops are crowded with Zuñi people and visitors from other pueblos, while
    groups of Navahos on horseback wait south of the village for a first glimpse of
    the gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Personators of the Council of the Gods and the Sha'lako leave Zuñi at the
    rising of the morning star, light a fire at A'kohanna ti'nawki, rehearse prayers
    and songs, and later go to a dressing cabin where masks and paraphernalia are
    conveyed under blankets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Masks not in use are stripped of plumes and repainted before being worn; their
    preparation is described as solemn and attended only by initiated persons.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person who enters during mask preparation must be struck with bunches of
    giant yucca on the ankles and arms; the passage says that if Sha'lako masks are
    seen during preparation and the offender is not punished, the Sha'lako would fall
    while running.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Sha'lako representative must not speak to a woman from the time he enters
    Zuñi until he leaves; if he does, four Sa'va'hlia whip him with giant yucca.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The festival occurs in November on different days, and its ritual is said
    to vary little from year to year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shu'laawi'si and his ceremonial father go to He'patina, described as the shrine
    symbolic of the Middle of the world, where Shu'laawi'si deposits prayer plumes
    in the lower chamber before proceeding to the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ceremonial father wears white clothing, a deerskin, and a streak of micaceous
    hematite, and carries a tray of prayer plumes, a mi'li, and a sacred meal basket
    from which he sprinkles meal.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Shu'laawi'si is described as nude except for a small breechcloth, with a black
    body spotted in colors and a similarly decorated mask; he carries prayer plumes
    and an unlighted cedar-fiber firebrand and wears or bears animal skins, seeds,
    rabbits, rats, and necklaces.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shu'laawi'si sprinkles meal into the six excavations, rejoins the Council
    of the Gods at He'patina, and the personators of the gods deposit prayer plumes
    in the shrine after being met with prayer and meal sprinkling by priestly groups.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
