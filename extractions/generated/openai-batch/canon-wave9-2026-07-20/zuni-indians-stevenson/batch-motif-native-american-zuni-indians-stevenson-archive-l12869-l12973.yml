canonical_text:
  quote: ''
  summary: 'The passage describes Mixok ceremonies connected with the Sha''lako festival:
    monthly post-solstice rites, appointment and rehearsal of god personators, gathering
    of cottonwood, preparation of plume offerings, repetition of prior winter-solstice
    ceremonies, deposition of offerings at springs or shrines with meal and shell
    materials, ritual head washing, continence, nightly meetings, and a note on a
    secluded February spring associated with the Ko''tikili.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Minor ceremonies occur each month after the winter solstice, while the great
    festival is in autumn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Personators of the gods represented in the festival are appointed, meet twice
    each month to rehearse songs, and deposit te'likinawe at shrines in the last quarter
    of the moon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In January the chosen personator of Sa'yatasha visits the house of the new
    A'wan ta"chu Ko'yemshi and remains there until late at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The personator of Sa'yatasha travels on horseback to Nutria to gather cottonwood
    and later carries a small bundle to the house where Ko'yemshi masks are kept.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The six personators of the Sha'lako also gather cottonwood for their te'likinawe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Father Ko'yemshi selects nine fellows and asks them to assemble
    at his house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Shu'laawi'si names a ceremonial father, who may belong to any clan; the passage
    notes that in 1896 the father belonged to the Corn clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shu'laawi'si and his chosen father repeat a ceremony previously said by the
    pe'kwin over Shu'laawi'si with a te'likinane.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Great Father Ko'yemshi repeats with each of his nine fellows the ceremony
    that the pe'kwin had held with him and his plume offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Each man makes four te'likinawe except A'wan ta"chu Ko'yemshi, who makes three
    because he already has one given by the pe'kwin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ko'yemshi te'likinawe have black sticks, three eagle plumes, and feathers
    from birds of the six regions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Te'likinawe made by the personators of the Council of the Gods have black
    sticks, while the one given to Sa'yatasha by the pe'kwin is painted yellow.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the offerings are placed in basket trays, each man's head is washed
    by his wife or another female member of the family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: At U'hana 'kianakwi, identified in the passage as Moss spring, Sa'yatasha
    makes an arm-depth excavation with an ancient corn planter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Meal mixed with turquoise, white shell beads, and abalone shell is sprinkled
    into the excavation before the men deposit te'likinawe, sprinkle meal, and pray.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Sa'yatasha carefully covers the excavation with earth after the deposits are
    made.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: Continence is required for the following four days, and the personators of
    the Council of the Gods spend each night until midnight in Sa'yatasha's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: The Ko'yemshi deposit their te'likinawe in an excavation by a spring where
    many concretion fetishes are present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: The Ko'yemshi spend four nights until midnight in the house of the Great Father,
    while each alternate of a Sha'lako goes similarly to the house of his Sha'lako.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:20
  text: The spring visited in February is described as secluded and located 6 or 7
    miles south of Zuñi.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:21
  text: The elder brother Bow priest states that no one outside the Ko'tikili had
    previously visited the February spring.
  category: speech
  evidence_refs:
  - ev:7
