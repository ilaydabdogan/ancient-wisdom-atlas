  summary: The passage describes Zuñi weaving materials, tools, dyed and natural wool
    colors, blanket and clothing production, the author's opinion on Pueblo and Navajo
    weaving relations, two examples of Zuñi individuals demonstrating blanket-weaving
    skill, and a plate showing We'wha weaving while wearing ceremonial dress.
  language: English
