literal_observations:
- id: obs:1
  text: The Zuñis use native blankets for bedding and, to a large extent, as wraps;
    Navajo blankets are worn by men and boys and used as saddle blankets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zuñis use commercial wool cards and spin with a spindle described as a
    slender stick passed through a wood or stone disk.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zuñi blankets are usually made of naturally colored wool in stripes, with
    additional dyed colors including two blues, mahogany red, yellow, and green.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author states an opinion that Pueblo blankets were formerly more elaborate,
    that Navajos learned weaving from Pueblos, and that Zuñi blanket weaving later
    declined relative to Navajo work.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1881 a boy about twelve years old, responding to the author's admiration
    for Navajo blankets, made a saddle blanket with elaborate colored figures on a
    red ground without using a design placed before him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 1902 a Zuñi priest gave the author a blanket of his own weaving to show
    that Zuñis could weave blankets in the Navajo style even though they did not usually
    do so.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men's shirts, ceremonial kilts, breechcloths, women's dresses, and wraps are
    woven of black or dark blue native wool in diagonal style and have dark blue embroidered
    borders.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman's belt is generally woven of red yarn bordered in green with white
