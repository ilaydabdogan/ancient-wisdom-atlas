  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Commercial needles are described as replacing bone needles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Plate xciv shows We'wha, described as an important Zuñi figure, engaged in
