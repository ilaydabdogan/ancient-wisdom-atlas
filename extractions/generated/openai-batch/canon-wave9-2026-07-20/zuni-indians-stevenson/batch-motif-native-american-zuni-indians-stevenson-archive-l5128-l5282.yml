canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ritual sequence involving Cha'kwena, prayers
    for safe childbirth and fertility, house-to-house collection of food and offerings,
    deposition of offerings in a river-bank excavation, and preparations for the coming
    of Ko'loowisi, the Plumed Serpent, including ritual gathering of spring water
    and a detailed description of the serpent fetish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prayers are made so A'shiwi women may pass safely through childbirth, children
    may live and mature, and women may be prolific; Cha'kwena repeats prayers at the
    other cardinal points on successive evenings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gods appear in the village streets for three successive evenings and dance
    at night in He'kiapawa ki'wi'sine and in the ceremonial chamber of the Siin'iakiakwe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cha'kwena spends four days after the last food deposition lying on her bed
    in a manner compared in the passage to a woman after childbirth; women who have
    lost children may remain in the ki'wi'sine, where a sand bed is prepared for them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman bathes the goddess, dresses her in new clothing, moccasins, beads,
    wrist items, mask, rattle, te'likinawe, and fawn skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cha'kwena leaves the ki'wi'sine in procession with Ko'mosona, four Sa'ya'hlia,
    Ko'pekwin, and two Ko'pi'lashiwanni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At houses, Cha'kwena extends te'likinawe into the room four times while the
    four Sa'ya'hlia extend their bows in the same manner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: House matrons give bread to Cha'kwena; larger pieces are put in a blanket
    and smaller pats are placed in the fawn skin, and families sprinkle Cha'kwena
    and the Sa'ya'hlia with meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hunters of large game give te'likinawe to Cha'kwena for success in the hunt
    because Ku'yapali'sa is described as the original owner of all game.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A'shiwanni and women wishing to become mothers make offerings of te'likinawe
    to Ku'yapali'sa, with prayers repeated at each presentation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Food collected in the fawn skin is deposited with te'likinawe and prayer meal
    in an excavation in the river bank; prayers are offered, the opening is covered,
    and Cha'kwena removes her mask.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Those who will personate the gods at the coming of Ko'loowisi spend much of
    the eight preceding days in He'kiapawa ki'wi'sine and collect wood on the first
    seven mornings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sa'limobiya from other ki'wi'siwe meet with younger brothers or fellows to
    decide which fraternities will be invited; the Great Fire fraternity must always
    be in He'kiapawa for this occasion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each god-personator selects a young man and gives him a gourd jug to fetch
    water and tall grass from the sacred spring To'seluna at Ojo Caliente.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ko'loowisi has been taken to a point west of the village and kept entirely
    secreted by its priest or keeper before the party returns to join the personators.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Ko'loowisi figure is made of deerskin, about five feet long, painted white
    underneath and black on the back, with yellow and blue-green duplicate curves
    for serpent scales.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Ko'loowisi fetish includes a cottonwood rod as spinal column, a miniature
    plumed stick as heart, cottonwood hoops as ribs, a red deerskin tongue, teeth,
    plumes on the head, and fox skin around the throat.
  category: object
  evidence_refs:
  - ev:8
