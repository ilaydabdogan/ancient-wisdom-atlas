canonical_text:
  quote: ''
  summary: Ethnographic description of the fifth morning and night ceremonial of the
    'Hle'wekwe, including opening the ceremonial chamber, seating novices and guests,
    masked comic performances, clan women dancing with eagle-wing plumes, fraternity
    members swallowing swords during violent dancing, endurance of the novices through
    the night, ritual and alcoholic drinking, and the cessation of the ceremony at
    the appearance of the morning star.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fifth morning, plastering and stone slabs are removed from doors, windows,
    and wall openings so adjoining rooms and spectators can connect visually with
    the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A room behind the ceremonial chamber is prepared for special guests, and a
    smaller room beyond it is used for preparing costumes or toggery.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At 9 p.m., two novices sit on the north ledge toward the west end, with the
    woman to the right of the man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male fraternity members form a choir on the south side, female members sit
    west of the choir, and clan women occupy specified positions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Guests and privileged observers watch the ceremony through interior openings
    into the ceremonial chamber.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Five masked characters enter, wear ridiculous dress, caricature anthropic
    gods and a scene of the day, receive applause, and then visit the house containing
    the four et'towe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shortly before 11 p.m., the ceremonies begin; men wear breechcloths, women
    wear black wool dresses with red belts, uncovered necks and arms, flowing hair,
    necklaces, bangles, and rings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the choir begins, the novices rise; catchers stand behind them with hands
    on their shoulders, and women stand between and beside the novices clasping and
    moving their hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women who replace the first attendants dance according to clan position, holding
    eagle-wing plumes, and no one can dance until she has stood beside the novices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Female dancers usually form two lines and move sidewise east and west while
    members of the 'Hle'wekwe dance between the lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The 'Hlem'mosona is first among the 'Hle'wekwe dancers and swallows his sword
    several times while dancing; the aged warrior follows and runs an arrow-point
    sword down his throat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Other fraternity members swallow swords during violent dancing, with stated
    durations; one man holds two swords in his throat, and on three occasions swords
    are run down another person's throat during the dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The novices remain standing from the beginning to the close of the night ceremonial,
    and the male novice becomes so exhausted that a blanket is placed under his feet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Popcorn water and red medicine are drunk frequently during the night; whisky
    is also consumed by choir members and in the back room.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The morning star is watched for, and its appearance above the horizon signals
    the end of the chamber ceremonies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The aged warrior closes the dance while holding the po'nepoyanne in his right
    hand and a bow and arrows in his left.
  category: action
  evidence_refs:
  - ev:8
