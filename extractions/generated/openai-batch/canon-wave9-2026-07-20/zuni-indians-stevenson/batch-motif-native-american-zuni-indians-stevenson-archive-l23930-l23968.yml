  evidence_refs:
  - ev:5
- id: obs:9
  text: After new plumes are deposited, the hole is plastered over, illustrating concealment
    of sacred objects in dwelling cavities.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The 'Siin'iakiakwe possess blossoms and roots of te'nas'siili because it is
