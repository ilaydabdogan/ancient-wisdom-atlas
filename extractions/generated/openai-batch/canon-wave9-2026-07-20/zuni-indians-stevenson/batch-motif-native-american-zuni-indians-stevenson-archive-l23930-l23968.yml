canonical_text:
  quote: ''
  summary: The passage describes Zuni post-hunt treatment of deer or antelope with
    sacred meal, sheepskins, eastward placement near a floor hole symbolizing an entrance
    to the undermost world, renewal of buried prayer-plume offerings for the te'nas'siili
    plant, and a Hopi-adopted masked game-animal dance ending with the shooting of
    a cottontail.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter bringing deer or antelope from the hunt is announced by villagers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The matron of the hunter's home meets him with sacred meal, sprinkles some
    on the game, and throws a line of meal before herself as she returns, with the
    hunter following.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the house, the game is first placed on a sheepskin until the ceremonial
    participants arrive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The named participants include household members, the order of the 'Siin'iakiakwe,
    and members of the Coyote clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The game is transferred to another sheepskin with its head toward the east,
    near a small circular hole in the stone floor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The small circular hole is stated to be symbolic of the entrance to the undermost
    world, and prayer plumes to the te'nas'siili are buried there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prayer plumes can be offered only when household members belong either to
