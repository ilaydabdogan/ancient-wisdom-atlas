canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi ceremonial treatment of hunted game: a medicine
    bag and hunting fetish are placed beside the animal; the fetish is dipped in blood
    and addressed as eating blood; the animal is ornamented, covered with cloths,
    sung over, sprinkled with sacred meal, cut and flayed with prayer meal and corn
    pollen placed in its mouth, and partly offered to Beast Gods. It also reports
    a remembered act in which a warrior threw live coals to the six regions to bring
    various game animals near.'
  language: English
  quote_policy: summarized
