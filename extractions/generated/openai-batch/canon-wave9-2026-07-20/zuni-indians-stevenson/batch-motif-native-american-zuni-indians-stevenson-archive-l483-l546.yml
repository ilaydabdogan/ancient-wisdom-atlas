canonical_text:
  quote: ''
  summary: The passage describes Zuñi accounts of lightning-makers, rain-makers, cloud
    and wind phenomena, thunder, rain-related prayer and ritual symbolism, seed distribution
    by personators of ancestral gods, and a Sun Father cosmology with the Moon as
    his sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ku'pishtaya are described as lightning-makers and mighty warriors who
    control lightning arrows, and each has a deputy and a courier.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kianil'ona sits in state in Ko'thluwala'wa, where the Council of the Gods
    appeals to him for water so that the u'wannami may water the earth.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Male gods sprinkle with plume sticks dipped in gourd jugs of water, female
    gods use vases, and heavy rains are produced by pouring water directly from vases.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The u'wannami are sent by the Council of the Gods to designated points to
    water the earth according to the supplications of the Zunis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cloud forms are said to indicate the movements or rain-bringing activity of
    the u'wannami, and smoke offerings are associated with producing clouds and possibly
    bringing rain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The daily life of the A'shiwanni must not offend the Council of the Gods;
    otherwise the Council withholds power and the Su'ni-a'shiwanni send cold winds
    that drive away cloud masks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Summer winds from the southwest and southeast are described as the breath
    of the u'wannami, who breathe directly from the heart rather than the mouth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people rarely look upward without invoking the rain-makers, and rain is
    described as the prime object of prayer in their arid land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Water vases are covered with cloud and rain emblems, and the water in the
    vase symbolizes the life or soul of the vase.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ku'pishtaya of the six regions communicate by couriers, with the passage describing
    a message relayed from the North to the West and then to the South.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says the Zunis do not fear lightning because the Ku'pishtaya never
    destroy the good in heart; a person struck by lightning is said to have had a
    bad heart.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Thunder is said to be produced when rain-makers play a stone-rolling game
    while the Ku'pishtaya shoot their missiles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Seeds distributed by personators of ancestral gods are recognized as symbols
    of desired blessings, yet each recipient receives and plants them reverently as
    if they came from the god of seeds in the undermost world.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The sun is called father and ancient one; the moon is his sister; the Sun
    Father has no wife; all peoples are children of the sun.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: Whatever the Zunis do not otherwise account for is attributed to the agency
    of the Sun Father, and the passage says they place faith in an all-powerful first
    great cause without beginning or end.
  category: relationship
  evidence_refs:
  - ev:12
