canonical_text:
  quote: ''
  summary: 'The passage describes preliminary distribution of feather objects for
    an Ille-/Hle''wekwe ceremonial, including office insignia, notification of sword
    removal, and selection of women to hold et''towe. It then describes an 1892 initiation
    of a youth and maiden: members gather and stack wood, a dangerous medicine plant
    is collected and the room is sealed against its fumes, swords are deposited in
    the ceremonial chamber, sheep are prepared for a feast, a novice''s plume package
    is placed with a sword, an emetic white-blossomed plant is boiled and drunk on
    the first four mornings to prepare for sword reception, and a reddish root medicine
    is drunk in the evenings. Footnotes describe tehl''nane staffs and wooden sword
    blades.'
  language: English
  quote_policy: summarized
