canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial dance with girls, choirs, drums,
    cedar bark gestures, and prayers to War Gods, followed by handling of ritual drum
    objects and a scalp-washing rite in which scalps are removed from a pole, taken
    to a secluded riverbank, washed in yucca suds, rubbed with kaolin for rain, and
    touched to the mouth for brave hearts and war empowerment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four girls remove the pi'toni and stand before the choirs in two pairs; they
    may be married or single and wear black woven dresses, red belts, silver ornaments,
    and customary hair arrangement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dancers at each end stand on rectangular wooden slabs, facing the choirs
    with feet close together, arms hanging, and hands clasped.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: During prayer, the east drummer gives one loud stroke that is answered by
    the west drummer so that beings who appeared from below the earth may hear and
    be present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The east drummer begins a low, slow accompaniment; after another exchanged
    drum stroke, the song and dance begin in earnest and the dancers repeatedly reverse
    their arm positions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pa'mosona, vice pa'mosona, vice pa'mosono"kla, and each choir member hold
    a bit of cedar bark in the left hand.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At portions of the song appealing to the Gods of War to destroy the enemy,
    the cedar bark is spit upon, carried around the head four times from left to right,
    and followed by expectoration.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dance sets remain on the floor no longer than ten minutes; retiring dancers
    put on pi'toni and moccasins, other girls replace them, and the choirs pray at
    each change.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the dance, the pa'mosona and his vice place the drums in the chamber
    center, remove the hides, and take crossed chaparral cock feathers and crossed
    yucca leaves from inside each drum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The crossed feathers and yucca leaves are said to indicate bird footprints;
    after prayer they are returned to the drums, which are placed in the northeast
    corner behind the grinding mills.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the fifth day, the 'si'hakoshona'kwe receive the scalps from the pa'mosona,
    who removes them from an uprooted pole; the scalps remain attached to cedar twigs
    with fluffy eagle feathers in place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The scalp-washers and their fellows are elaborately attired, and the 'si'hakoshona'kwe
    have a streak of micaceous hematite across the right eyelid and under the eye
    indicating officership.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The 'si'hakoshona'kwe and their fellows go to a secluded riverbank, make a
    cavity in the earth as a basin, and bathe the scalps in yucca suds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The scalps are rubbed with kaolin for rain, and a bit of scalp is taken into
    the mouth so the Zuñis may have brave hearts and so the Gods of War may empower
    them to destroy the enemy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that if the victor has a good heart, killing the enemy
    brings much rain.
  category: speech
  evidence_refs:
  - ev:8
