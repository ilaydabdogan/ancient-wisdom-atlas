canonical_text:
  quote: ''
  summary: The passage describes a ritual sequence in which participants bathe with
    suds, drink consecrated water, clean and rewrap fetishes, return ritual objects
    to containers or rooms, cast meal and pollen into river waters for Ko'thluwala'wa,
    receive head bathing, share a feast, and cast food into the fire for the ancestral
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maker of the suds pushes a cloud bowl toward women, who take suds and
    rub them on their chests, arms, and legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bowl of suds is carried around the room so that all present may bathe
    with the suds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The third associate carries consecrated water and gives a draft from a shell
    to all present, beginning at the west end of the room and serving the shi'wanni
    and associates last.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the consecrated water is taken, the shi'wanni removes the mi'wachi one
    by one from the painting, blows meal from the feathers, and returns them to a
    basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shi'wanni removes the chu'ettone while an associate takes the 'kia'ettone;
    meal is blown from the fetishes, and each fetish is wrapped in cotton cloth and
    deerskin, tied, and placed in a vase.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Associates opposite the shi'wanni return stone fetishes to the medicine box
    and sacks from which they were taken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second associate sweeps meal and pollen into a heap, carries it to the
    river, and casts it into the waters so that it may go to Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Owners of four mi'wachi, related to the shi'wanni or associates, leave the
    chamber with their fetishes; fetishes directly associated with the et'tone are
    returned with it to its room.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The female associate bathes the heads of the shi'wanni and associates.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A feast is served, but first the shi'wanni and associates gather a portion
    of food and cast it into the fire to be conveyed to the ancestral gods.
  category: sequence
  evidence_refs:
  - ev:5
