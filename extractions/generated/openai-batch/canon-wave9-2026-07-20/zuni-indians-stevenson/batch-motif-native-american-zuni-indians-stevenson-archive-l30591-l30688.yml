candidate_motifs:
- id: motif:1
  label: fire ordeal protected by ritual medicine
  taxonomy_refs:
  - initiation
  basis: Dancers are repeatedly bathed with medicine to prevent burning before dancing
    in the plaza, and earlier performances included contact with glowing coals.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage describes ceremonial practice, not a narrative myth; the link
    to initiation comes from the passage heading and ritual context.
- id: motif:2
  label: apparent dismemberment followed by restoration
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The passage reports remembered feats in which a man is apparently butchered,
    cast into fire, dropped through a hatchway, and rises in perfect condition.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The author presents these as reported exhibitions of jugglery rather than
    a cosmological myth; the degree of literal belief is not established in this passage.
- id: motif:3
  label: ordeal conferring nonordinary survival and final awakening in a divine abode
  taxonomy_refs:
  - afterlife_journey_map
  - death_rebirth
  basis: The passage quotes a statement that one passing through the ordeal never
    dies but lives to old age and awakakes in Ko'thluwala'wa, the abiding place of
    the Council of the Gods.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives only a brief statement and does not describe an extended
    afterlife journey map.
- id: motif:4
  label: restricted transmission of esoteric medicine lineage
  taxonomy_refs:
  - initiation
  - wisdom
  basis: A Hopi director transmits secrets, medicine bags, and fetishes to his nephew,
    instructing him to form a small order at Zuñi; the nephew later initiates four
    members and restricts further membership.
  evidence_refs:
