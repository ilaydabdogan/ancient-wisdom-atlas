comparison_claims:
- id: claim:1
  claim: The passage explicitly contrasts Zuñi Mystery medicine and the Hopi-derived
    order as performing the same general function of extracting disease, but by different
    techniques.
  claim_level: same_function
  target: Zuñi Mystery medicine practices and Hopi-derived healing order within the
    Little Fire fraternity
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the healing procedures described in this
    passage.
- id: claim:2
  claim: The passage supports a cautious comparison between Zuñi fire performances
    and Hopi fire feats because it reports similar fire and dismemberment scenes in
    Hopi contexts and notes Zuñi jealousy over Hopi feats.
  claim_level: same_motif
  target: Zuñi and Hopi fire/jugglery ordeal performances
  evidence_refs:
  - ev:3
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports memories and statements rather than giving full
    parallel ritual texts; details may differ by community and performance context.
- id: claim:3
  claim: The passage indicates direct ritual transmission from a Hopi Snake fraternity
    order to a small Zuñi order through kinship instruction and transfer of paraphernalia.
  claim_level: historical_contact
  target: Hopi Snake fraternity medicine order and Zuñi Little Fire fraternity special
    order
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The claim rests on the passage's reported account of transmission and
    does not independently verify events outside the passage.
