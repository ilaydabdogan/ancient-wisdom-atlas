canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial fire dance and medicinal bathing,
    reports remembered fire and dismemberment feats, explains a Hopi-derived medicine
    order within a Zuñi fraternity, and contrasts Zuñi and Hopi healing procedures
    and lineage control.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eight bowls of medicine prepared from yarrow stand in line before the altar
    in the ceremonial chamber.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dancers are bathed in the yarrow medicine before going to the plaza, and the
    bathing is repeated before each visit to prevent burning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the present ceremony appeared less intense than earlier
    occasions, when men placed their arms into glowing coals in addition to dancing
    in them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports remembered exhibitions in which men were apparently cut
    apart, their members cast into the fire, and the body gathered in a mi'ha and
    dropped through a hatchway at He'iwa ki'wi'sine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After being dropped through the hatchway, the man is said to have risen in
    perfect condition.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A statement in the passage says that one who passes through the ordeal never
    dies, but lives to old age and later awakes in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Five members of the fraternity have an additional form of medicine practice
    said to come from the Snake fraternity of the Hopi Indians.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Hopi director, before death, instructed his elder nephew in the medicine
    secrets and gave him medicine bags, fetishes, and related materials to carry to
    Zuñi and form a small fraternity or order.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder nephew returned to Zuñi, waited two years, invited four fellows
    to his home, initiated them, and became director of the special body of medicine
    men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hopi-derived order extracts disease attributed to witchcraft and uses
    touch, meal spots, and the doctor's hands in drawing material from the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage contrasts this method with Zuñi Mystery medicine practices that
    draw out disease by sucking after locating the cause by eye or meal spots.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The director refuses to increase membership, saying the secrets should remain
    confined to a few.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: An invalid requests a Hopi-order shaman by wrapping meal in a corn husk and
    sending it with a family member.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says doctors are usually compensated with calico, cotton, or food
    according to the family's wealth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Reports that a Snake fraternity man at Murshong'nuvi intended to reestablish
    such an order led the Zuñi director to visit, but the old man denied the intention.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that Zuñis felt jealousy over feats performed by the Hopi,
    and a Little Fire fraternity theurgist called Hopi jugglers great.
  category: relationship
  evidence_refs:
  - ev:10
