canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi ceremonial sequence: masked gods or Kia''nakwe
    personators process through the village, Ko''yemshi greet and entertain, masks
    are removed, the Kia''nakwe gather in the ki''wi''sine for songs, prayers, he''we
    bread offerings, protective yucca whipping, midnight food offerings deposited
    in the river for departed Kia''nakwe, preparation of green paint, repainting of
    dance moccasins, rehearsal with rattles, and the beginning of a dance led by the
    priest and deputy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each god crosses a bridge over the river south of the village, halts, and
    is greeted with the others by nine Ko'yemshi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group follows a route through village streets to the Chu'pawa ki'wi'sine;
    Ko'yemshi also go house to house entertaining the populace with comedy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After prayers, masks with spruce wreaths are removed and laid on a sheepskin
    in an adjoining room north of the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the evening the priest sits in the northwest corner, warrior directors
    sit at his left, others group on the north side, and he'we is placed in basket
    trays by the priest, nearby warriors, and the deputy.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Twelve songs are sung with brief intervals; after each song all repeat a prayer
    aloud and inhale the sacred breath of A'wonawil'ona.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At their own request, two members are whipped with yucca across each arm and
    ankle for protection against bad dreams.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A bunch of deer scapulae, thirty-five tortoise-shell rattles, and wrapped
    packages of plumes lie near the priest and basket trays.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two hours before midnight the priest combines the basket-tray contents, prays,
    blows native-tobacco smoke over the food, divides it into three parts, and distributes
    the food and corn-husk packages to officers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Three officers go to the river and deposit the contents of their packages
    in the water as food for the departed Kia'nakwe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the officers' absence, green paint made from copper ore and boiled
    pifion gum is ground on a paint stone with water and squash seed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Singers retrieve dance moccasins, which are handed to the paint-grinders;
    two grinders and a third man repaint thirty-six pairs using paint put in the mouth,
    expelled through the teeth, and spread with the tongue, and one man becomes sick
    from the paint.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Kia'nakwe rehearse for the next day's dance, adjust their clothing, hold
    tortoise-shell rattles except for the Ko'thlama, who holds a deer-scapula rattle,
    and form an elongated horseshoe with warrior directors at each end.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the rattle attachments are checked, the dance begins with the priest
    and pe'kwin walking abreast toward the west and then facing each other near the
    apex of the formation.
  category: action
  evidence_refs:
  - ev:10
