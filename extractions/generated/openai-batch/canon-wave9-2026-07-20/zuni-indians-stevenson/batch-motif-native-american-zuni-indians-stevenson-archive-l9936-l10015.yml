  quote: ''
  summary: The passage describes the summer retreat of a shi'wanni associated with
    the Black Corn clan et'tone. It details the sacred rooms, cloud and plumed-serpent
    decoration, sprinkling of meal, repeated invocations, planting and deposition
    of te'likinawe, closing washing and feast, food offered to fire with prayers for
    the earth to be watered, and the 1891 sequence of A'shiwanni retreats.
  language: English
