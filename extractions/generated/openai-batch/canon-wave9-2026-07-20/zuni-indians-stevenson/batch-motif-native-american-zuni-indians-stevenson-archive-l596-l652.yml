canonical_text:
  quote: All was shi'pololo (fog), rising like steam.
  summary: The passage presents a Zuñi cosmogony in which A'wonawil'ona, Sun Father,
    and Moon Mother exist above, while Shi'wanni and Shi'wano'kia exist below. A'wonawil'ona
    creates clouds and the waters of the world by breath from the heart and is identified
    with the firmament, air, clouds, and the source of vegetation. Ritual cloud, plume,
    corn, and fetish symbols are described as means of life and prayer. Shi'wanni
    creates the fixed stars and constellations from foaming spittle, and Shi'wano'kia
    creates Earth Mother from foaming saliva.
  language: English
  quote_policy: quoted
