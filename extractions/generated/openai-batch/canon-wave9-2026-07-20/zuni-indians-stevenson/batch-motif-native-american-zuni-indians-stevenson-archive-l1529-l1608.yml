canonical_text:
  quote: ''
  summary: The passage begins with a fragment about seeking the Middle place, then
    describes a guarded Zuni sacred location identified with Han"lipinkia/Hiin'liplnkla.
    The writer and Zuni companions make difficult journeys through desert, mesas,
    springs, ruins, and water shortages to reach a fissure and canyon. The canyon
    contains water pockets, pictographs, potholes, and an arched niche where the Gods
    of War U'yuyewi and Ma'sai'lema are said to have been created. A figure caption
    identifies an ancient sun shrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragmentary speech says that if the Middle place is found, the group will
    go there, while others will go eastward to look for it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zunis are said to keep the location of Han"lipinkia/Hiin'liplnkla from
    the knowledge of white people, and the writer is described as the first American
    to visit the sacred spot.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first approach passes through desert country, ruins, and a dry camp; attempts
    to locate water fail, and the party turns back toward Zuni after sharing stored
    water with thirsty animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second approach follows a more southern route and avoids Ojo Caliente to
    prevent questions about the party's destination.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The party encounters a difficult ascent requiring the wagon to be unpacked
    and material carried, and later a road must be built for descent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One Indian companion drives the writer's team down the hill without asking,
    explaining that he feared the writer might be killed and that it was better for
    him to die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Kia'napiilto, described as the last of a series of springs, the passage
    notes a connection with the Kiaklo myth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A scout returns from the valley with a ceremonial stone knife, a red pottery
    bowl, pottery fragments, news of extensive ruins, and news that the animals can
    be watered.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The party reaches the fissure where Han"lipinkia/Hiin'liplnkla is to be found
    and camps near water pockets, the only drinkable water within miles.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The canyon approach involves descent into a narrow canyon through tall grass,
    weeds, and willows; the walls are completely covered with pictographs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The canyon contains large and deep potholes, some forming arched niches; one
    such niche is identified as the place where U'yuyewi and Ma'sai'lema, the Gods
    of War, are supposed to have been created.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A caption in the passage identifies a figure as an ancient sun shrine.
  category: object
  evidence_refs:
  - ev:10
