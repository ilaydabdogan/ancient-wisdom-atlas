canonical_text:
  quote: ''
  summary: The passage describes a Zuñi ceremonial rabbit hunt, post-hunt household
    rites for arranging, offering food to, cooking, and ritually washing after handling
    rabbits, and then begins an account of the 'Hle'wekwe Wood Fraternity separating
    from the people in search of the Middle of the world, carrying rain and crop fetishes
    that unexpectedly bring snow, followed by a route dispute and a stone map of the
    fraternity’s route.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before proceeding with the hunt, rabbit sticks are passed through flames while
    success is requested from the gods; the party is then led onward and divided into
    squads.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rabbits are pursued and killed with rabbit sticks; Mr. Stevenson kills the
    second rabbit, which the Indians treat as evidence of his sympathy with them and
    their people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Great Father Ko'yemshi dips his fetish into the blood of the first rabbit;
    the passage says this action is not repeated by the other hunters and that fetishes
    are not generally carried on such hunts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the hunt, household members lay rabbits on their sides with heads east
    and facing south, place an ear of corn between each rabbit’s fore paws, sprinkle
    meal, and pray for the beings of the rabbits to return home and send more rabbits.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rabbits are skinned in a prescribed way, their limbs are arranged, food
    such as wafer bread is placed under the left foreleg, and the rabbits are put
    on coals breast-down with heads east until the first crackling sound.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the spiritual essence of the bread goes to feed the
    rabbits, and that if this rite is not performed the rabbits will not appear and
    cannot be secured.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The person dressing the rabbits washes blood from the hands over the fire
    by pouring water from the mouth onto the hands; washing blood away from the fire
    is said to make rabbits go off and become uncatchable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The 'Hle'wekwe separate from their people at Han'lipinkia and travel northward
    in search of the Middle of the world, carrying two rain and crop fetishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The et'towe fetishes are placed on cloud forms of meal with prayer plumes
    while prayers for rain are offered; snow comes instead, and the passage says the
    fetishes thereafter bring cold rains and winter snows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man and wife dispute with the fraternity over whether the northern route
    should continue or whether the course should turn southward and eastward.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Markings on a sandstone rock southwest of Zuñi are declared by the Zuñis to
    be a map of the route followed by the 'Hle'wekwe, together with other roads, mesas,
    and constellations.
  category: object
  evidence_refs:
  - ev:9
