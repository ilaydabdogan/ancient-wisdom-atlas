canonical_text:
  quote: ''
  summary: The passage describes Ko'yemshi and Little Fire fraternity ceremonies involving
    prayer, baskets, a gourd feat, eagle plumes, rattles, a mi'li fetish, meal designs,
    and a public wheat-producing feat. It then describes masked god-personators dancing
    for five days during severe windstorms, a rain priest's explanation that the winds
    express divine anger over improper Ko'yemshi personation and language, and subsequent
    preparation and deposit of te'likinawe offerings grouped as kia'etchine on meal
    symbols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The director of the fraternity and the Great Father Ko'yemshi stand side by
    side before a basket, face east, and pray.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a second house, a gourd is placed concave side upward in a basket; Ko'yemshi
    make unsuccessful attempts to raise it with eagle-wing plumes before a fraternity
    member raises it with the quill ends of his plumes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gourd-raising feat elicits strong applause from spectators, and the observing
    writer reports that she cannot discover the trick.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Little Fire fraternity appears in the plaza the next day, followed by
    Ko'yemshi with rattles and led by a woman carrying the mi'li and a meal basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two members, identified as the director of the Shu'maakwe fraternity and his
    pe'kwin, have eagle plumes passed through the septum of the nose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A blanket is placed on the ground and weighted with stones; Nai'uchi makes
    a small cross of meal on it, places the mi'li on the cross, secures it with stones,
    and lays a large white gourd rattle beside it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Selected men from the spectators handle the mi'li and the white rattle after
    Nai'uchi whispers to them; one taps the mi'li with eagle plumes while the other
    shakes the rattle in time with the dancers.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: When a fraternity member taps the mi'li with eagle plumes, grains of wheat
    pour out from the plumes until about a quart is deposited on the blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Personators of the gods from different ki'wi'siwe appear in full ceremonial
    attire, including masks, in the Si'aa' te'wita for five consecutive days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Despite severe wind and dust, the dances continue; because the windstorms
    are considered unfavorable, the dances and songs are intensified in hopes of appeasing
    the gods' wrath.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A rain priest explains the 1891 windstorms by saying that the Kok'ko A'wan
    are angry and send winds because the Ko'yemshi are being personated by the Ne'wekwe
    fraternity, who do not speak the old language; he contrasts this with other personators
    who bring rain and good crops by speaking prayers in the old tongue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the following day, A'shiwanni and named associates prepare te'likinawe;
    the offerings are grouped into kia'etchine and deposited in the He'iwa ki'wi'sine
    on a cloud symbol of meal or on a meal painting.
  category: sequence
  evidence_refs:
  - ev:6
