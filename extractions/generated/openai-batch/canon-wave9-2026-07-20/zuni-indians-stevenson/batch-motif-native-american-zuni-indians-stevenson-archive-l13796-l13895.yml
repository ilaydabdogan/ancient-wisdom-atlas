candidate_motifs:
- id: motif:1
  label: ritual feeding and reciprocal divine abundance
  taxonomy_refs:
  - sacred_exchange
  basis: The gods ask for food and say that next year they will bring all kinds of
    seeds; the ceremony includes food offerings, feast foods, meal-sprinkling, and
    a concealed deposit.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes ceremonial exchange functionally; it does not present
    a formal bargain doctrine beyond the quoted ritual speech.
- id: motif:2
  label: annual agricultural renewal through rain and seed prayers
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage belongs to an annual Sha'lako festival and includes prayers for
    rain and seeds, a promise of seeds next year, and rites timed through the night
    to the morning star.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:9
  - ev:12
  confidence: medium
  cautions: The excerpt gives one festival sequence, not a full mythic account of
    the seasonal year.
- id: motif:3
  label: ritual offering deposit
  taxonomy_refs:
  - sacrifice
  basis: Rats and rabbits are called offerings to the host, and a portion of feast
    food is taken away and deposited in a covered excavation with plumes and meal.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage uses 'offerings' and describes deposit actions, but it does
    not explicitly frame the deposit as sacrifice in theological terms.
- id: motif:4
  label: announced divine departure and return
  taxonomy_refs:
  - departure
  - return
  basis: The gods state that they will go to Ko'thluwala'wa, that their children will
    remain temporarily and then go east, leave te'likinawe, and return to Ko'thluwala'wa.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The departure-return sequence is reported within ritual speech; the excerpt
    does not provide a broader narrative journey.
- id: motif:5
  label: house dedication by visiting god figures
