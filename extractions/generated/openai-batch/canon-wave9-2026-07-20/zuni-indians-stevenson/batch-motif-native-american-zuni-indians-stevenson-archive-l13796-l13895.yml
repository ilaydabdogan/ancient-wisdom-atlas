canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Sha''lako night ceremonies: baskets
    are passed among ritual officials during rain and abundance prayers; gods announce
    a departure, a temporary stay of their children, and a future return with seeds
    in exchange for food; fire, reed cigarettes, litany, rhombi, masks, feasting,
    meal-sprinkling, roof and altar prayers, and a concealed food-plume deposit under
    a ladder are performed before the all-night ceremonial concludes and morning rites
    resume.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two baskets are removed from the altar, held by the Kia'kwemosi and pe'kwin,
    and passed along the line of shi'wanni without one basket passing over the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As each shi'wanni receives a basket, he draws a breath of its contents and
    prays for rain, seeds, rats, rabbits, and other game.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods say that they will go to Ko'thluwala'wa, leave their children for
    five days to dance in the new houses, and later have them go east, leave te'likinawe,
    and return to Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods ask for food to eat and state that next year they will bring all
    kinds of seeds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pe'kwin receives baskets containing the gifts of Shu'laawi'si and Sa'yatasha
    and places them before the altar; rats and rabbits are described as offerings
    to the host and are later cooked and eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A young man dressed in pure white with a red silk scarf sits by a large fire
    holding a cottonwood-root rod used to light ceremonial reed cigarettes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For about two hours the gods intone a low litany, the A'shiwanni respond,
    and two Bow priesthood members whirl rhombi before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the prayer, the six A'shiwanni sit near the fire, and the personators
    of the gods remove their masks and place them on dressed deerskins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women bring many bowls and foods into the room; the wife of the Kia'kwemosi
    and a male family member sprinkle meal on the altar, offer grace over the food,
    and invite the people to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Shu'laawi'si places food from each vessel on a large piece of he'we and leaves
    through the roof hatchway, followed by Sa'yatasha and Hu'tutu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Outside, Shu'laawi'si deposits food in an excavation under the ladder; Sa'yatasha
    plants plumes and scatters meal; Hu'tutu stamps on the meal; then the opening
    is covered with a slab and earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The three gods return to the chamber and join the feast; later, after masks
    are donned, Sa'yatasha and Hu'tutu stride until the morning star rises.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the rising of the morning star, Sa'yatasha and the pe'kwin go to the
    roof and chant a prayer for about half an hour.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sa'yatasha and the pe'kwin return side by side to the room; the pe'kwin throws
    meal before them, and Sa'yatasha carries bow and arrows and a deer-scapula rattle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the altar they sprinkle meal, retrace their steps while repeating the rooftop
    prayer, and Sa'yatasha makes an east-facing gesture while sprinkling meal from
    both hands; the pe'kwin repeats the motion.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The mask is removed by an attendant and placed on deerskins by the altar;
    after a morning meal the god personators rest until ceremonies resume.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The passage states that the Sha'lako are met across the river by A'shiwanni,
    Ko'mosona, and Ko'pekwin, who pray and sprinkle meal on the gods before each Sha'lako
    goes to the house he is to dedicate.
  category: sequence
  evidence_refs:
  - ev:12
