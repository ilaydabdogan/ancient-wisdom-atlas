canonical_text:
  quote: ''
  summary: 'The passage describes the writer entering a Ne''wekwe ceremonial chamber,
    the welcome she receives, and the ritual arrangement inside: a tablet altar, a
    bar representing the Galaxy with figures of Pa''yatamu, star, sun, cloud, bird,
    lightning, eagle-plume, animal, flute, medicine bowl, and prayer-meal basket elements.
    It also recounts the fraternity''s alarm when a large stone animal fetish is exposed
    to the visitor; members later identify it as their great father of Mystery medicine
    and say it was changed into stone when a great fire spread over the earth.'
  language: English
  quote_policy: summarized
