- id: obs:3
  text: Dancers in the plaza appear in several lines, wearing brilliant dress and
    swaying rhythmically.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each time the dancers come, they bring corn, which officiating priests receive
    and carry to the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When the dancers leave the plaza for the last time, they are supposed to go
    to Chi pia' in the east, visit anthropic gods there, and return to Ko'thluwala'wa
    by a northern route.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narration states that the dancers in fact visit Ku'shilowa, just beyond
    the eastern side of the town, where they deposit te'likinawe.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
