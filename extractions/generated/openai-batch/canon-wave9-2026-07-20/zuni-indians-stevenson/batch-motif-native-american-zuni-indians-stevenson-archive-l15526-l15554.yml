- id: obs:1
  text: Bi^si'si goes to the ki'wi'sine before the Ko'mosona and Ko'-pekwm leave the
    plaza and return to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'mosona and Ko'-pekwm have received corn from the Mu'luktakia gods in
    the plaza.
  category: relationship
  evidence_refs:
