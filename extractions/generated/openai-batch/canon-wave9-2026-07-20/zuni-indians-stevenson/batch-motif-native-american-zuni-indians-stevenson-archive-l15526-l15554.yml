canonical_text:
  quote: ''
  summary: 'The passage describes ceremonial movements after Bi^si''si goes to the
    ki''wi''sine: named groups leave the plaza after receiving corn from Mu''luktakia
    gods; dancers bring corn to priests, who carry it to the ki''wi''sine; the dancers
    are said to go east to visit gods and return by a northern route, though the observed
    action is a visit to Ku''shilowa to deposit te''likinawe. Ko''tikili members carry
    masks and prayer-plume offerings, some planted to Kok''ko A''wa and some to Ko''yemshi.
    Personators of the mo''lawe gather at Ku''shilowa while chosen women carry watermelon
    and seed offerings at the southeast point of the village.'
  language: English
  quote_policy: summarized
