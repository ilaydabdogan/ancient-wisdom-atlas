canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Zuñi Great Fire fraternity ceremony:
    a novice fails to swallow a sword and the fraternity father does it instead; swords
    are placed near the altar; yarrow medicine is distributed; fire from juniper splinters
    is put into the novice''s mouth and ritually passed over his body; burned splinters
    are deposited east of town. On the second day, songs are sung to the six regions
    for snow, two young trees are collected, marked, smoked over, plumed, and associated
    buds are made into or distributed as medicine, especially for pregnant women.'
  language: English
  quote_policy: summarized
