  claim: The passage explicitly contrasts the Great Fire fraternity with the 'Hle'wekwe
    fraternity regarding a novice's likelihood of succeeding at sword swallowing on
    the first night, indicating a comparable sword-swallowing initiation function
    but different expected success.
  claim_level: same_function
  target: "'Hle'wekwe fraternity sword-swallowing initiation practice"
  evidence_refs:
