canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi betting race: two managers arrange runners
    on sides representing elder and younger Gods of War; a rain priest prepares offerings
    and prays; runners deposit offerings to divine and ancestral beings, listen for
    omens from the dead, birds, and wind, make sunrise offerings to lightning makers,
    observe diet and exercise practices, and bettors place goods in the plaza as stakes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A betting race may be arranged when one man proposes it to another, and a
    civil officer announces the race from a housetop.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two managers select equal numbers of runners, varying from three to six
    on a side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One side represents the elder God of War and the other side represents the
    younger God of War.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each manager summons a rain priest, and runners and friends gather at the
    managers' houses.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The rain priest prepares corn-husk packages with prayer meal, white shell,
    and turquoise beads, prays over a tray, draws four breaths from its contents,
    and gives bread and a package to each runner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Runners go north or south of the village, place the package contents and bread
    in excavations, and identify them as offerings to the Gods of War and ancestral
    gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the offerings are covered, the runners sit still and listen for sounds
    from the departed, thanking the 'grandfathers' if they hear a noise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mockingbird notes, an owl hoot, and the whistling of wind are treated as signs
    bearing on the expected success of the race.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: At sunrise each runner sprinkles a corn-husk offering of precious beads and
    meal to the lightning makers of the six regions for success.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before the race, runners exercise, eat breakfast, avoid coffee, and afterward
    take only small amounts of wafer bread and water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Bettors place possessions in the plaza; the managers arrange matching articles
    from two heaps into one consolidated heap of stakes.
  category: action
  evidence_refs:
  - ev:9
