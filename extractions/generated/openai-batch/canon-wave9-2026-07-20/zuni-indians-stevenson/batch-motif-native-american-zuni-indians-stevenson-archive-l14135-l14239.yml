comparison_claims:
- id: claim:1
  claim: The deposition of plumes and seeds, meal sprinkling, and associated prayers
    are explicitly described as repeated with similar prayers in other house dedications.
  claim_level: same_function
  target: Other houses dedicated in the same Sha'liiko/Ko'yemshi ceremonial context
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage says the actions and prayers are similar but does not provide
    the full text or details of the other house ceremonies here.
- id: claim:2
  claim: The Great Father's prayer is presented as part of a local set of differing
    versions associated with Sa'yatasha, Sha'lako, and Ko'yemshi accounts of A'shiwi
    migrations from Ko'thluwala'wa.
  claim_level: same_motif
  target: Sa'yatasha, Sha'lako, and Ko'yemshi migration recitations concerning Ko'thluwala'wa
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports similarity and difference among versions but does
    not include the compared versions themselves.
