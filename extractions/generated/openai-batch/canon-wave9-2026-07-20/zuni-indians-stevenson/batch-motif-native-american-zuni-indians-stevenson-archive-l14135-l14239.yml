candidate_motifs:
- id: motif:1
  label: Ritual visitation for house dedication
  taxonomy_refs: []
  basis: The Ko'yemshi visit houses associated with Sha'liiko, enter the house to
    be dedicated, deposit te'likinawe, receive ritual seating, and perform prayer
    and dance.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: This is an ethnographic ritual sequence, not a mythic narrative episode
    in the passage.
- id: motif:2
  label: Sacred exchange of food, seeds, and ritual presence
  taxonomy_refs:
  - sacred_exchange
  basis: The Ko'yemshi give seed at the altar, ask for food, are fed after prayer,
    and say they will bring all kinds of seeds next year.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not explicitly theorize the exchange; the label is inferred
    from described reciprocal acts and speech.
- id: motif:3
  label: Orientation to six regions
  taxonomy_refs: []
  basis: The master motions each Ko'yemshi to the six regions before seating him,
    and the cigarette is waved to the six regions during the smoking exchange.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No broader cosmological explanation of the six regions is supplied in
    this passage.
- id: motif:4
  label: Agricultural renewal through seeds
  taxonomy_refs:
  - seasonal_cycle
  basis: The Ko'yemshi carry and give seeds and state that next year they will bring
    all kinds of seeds.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  confidence: medium
  cautions: The seasonal-cycle taxonomy is suggested by the 'next year' seed promise,
    but the passage does not explicitly describe a calendar cycle.
- id: motif:5
  label: Departure to divine eastern home and return to Ko'thluwala'wa
  taxonomy_refs:
  - departure
  - return
  basis: The Ko'yemshi speech says their children will go to the home of the gods
    in the east, leave te'likinawe, and return to Ko'thluwala'wa.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is a liturgical statement within the ceremony rather than a narrated
    journey.
- id: motif:6
  label: Paired Sun Father and Moon Mother colors
  taxonomy_refs:
  - duality
  basis: Each dancing Ko'yemshi holds two te'likinawe, one blue for the Sun Father
