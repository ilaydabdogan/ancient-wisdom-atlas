canonical_text:
  quote: ''
  summary: 'The passage describes Ko''yemshi night ceremonies associated with the
    arrival of the Sha''liiko and the dedication of a house: ritual entry, deposits
    of plumes and seeds, meal sprinkling, seating by six-region orientation, reciprocal
    smoking, litany, feast, and dancing with paired blue and yellow te''likinawe.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten Ko'yemshi closely follow the Sha'liiko when the Sha'liiko arrive at the
    village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'yemshi wear white garments or dressed deer skins and ordinary moccasins.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each Ko'yemshi carries a sewn fawn skin containing seed and a pink gourd rattle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A miniature gaming ring with a la'showanne is attached to the fawn skin carried
    by the Great Father Ko'yemshi, the pe'kwin, and Pi'lashiwanni.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Ko'yemshi gather at the base of the outer ladder of each house entertaining
    a Sha'liiko, sing, and sometimes exchange jokes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the house to be dedicated, the Great Father deposits te'likinawe in an
    excavation under the ladder, and the pe'kwin sprinkles meal over them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The master of the house, his wife and daughters, and the director of the Little
    Fire fraternity meet the Ko'yemshi and precede them to the ritual room.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The ritual room has an elaborate altar at the north end and the Little Fire
    fraternity grouped on the east side.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each Ko'yemshi empties the seed from his fawn skin into a basket by the altar
    as a gift to the host of the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Great Father marks each wall with meal, and the pe'kwin follows by striking
    the meal lines with a bunch of Yucca baccata.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A ladder is held by six men while the Great Father attaches two te'likinawe
    to the symbol of the house of the clouds; the pe'kwin then sprinkles meal over
    it and the plumes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The master of the house places his hands on the shoulders of each Ko'yemshi,
    motions him to the six regions, and seats him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Ko'yemshi sit on the west side of the room opposite ten men from the Dogwood
    and Frog clans.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:12
- id: obs:14
  text: Fire sticks made from giant yucca hold live coals used to light reed cigarettes
    filled with native tobacco.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Each participant takes six whiffs from a cigarette, waves it to the six regions,
    circles it, and passes it to the person seated opposite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The masks of the Ko'yemshi are put back so their faces are exposed during
    the smoking sequence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Great Father recites a two-hour litany, while the others respond with
    the word rendered as amen.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Ko'yemshi state that their children will remain for five days, dance in
    the houses, go to the home of the gods in the east, leave te'likinawe, and return
    to Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: The Ko'yemshi ask for food and say that next year they will bring all kinds
    of seeds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: After the prayer a feast is served, commercial tobacco is smoked, and the
    Ko'yemshi dance while holding paired te'likinawe colored blue for the Sun Father
    and yellow for the Moon Mother.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: After some dancing, most of the Ko'yemshi visit the Sha'liiko houses and dance
    there, while Little Fire fraternity members continue dancing with bodies decorated
    in white kaolin.
  category: sequence
  evidence_refs:
  - ev:11
