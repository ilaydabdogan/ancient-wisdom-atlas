canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of ritual dances: a concluding directional
    rattle dance; the appearance of the Mu''luktiikia with staffs and rattles, accompanied
    by a bear-costumed boy; the appearance of the Cha''kwena with meal sprinkling,
    lightning body markings, masks, rattles, bows, arrows, and yucca; a child dancer
    and a masked man representing a bear; the Wa''tom''la dance with rattles, yucca,
    stamping, and a leader carrying ritual items; and the beginning of an introduced
    Hopi dance.'
  language: English
  quote_policy: summarized
