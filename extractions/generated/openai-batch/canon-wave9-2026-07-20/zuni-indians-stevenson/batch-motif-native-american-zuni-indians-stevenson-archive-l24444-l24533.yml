canonical_text:
  quote: ''
  summary: The passage describes a Zuñi fraternity admission procedure involving invitation,
    corn meal, a corn-husk packet, an eagle feather, prayer toward the six regions,
    and the formation of a fraternity-father relationship. It continues with later
    redistribution of meal among female kin, dawn sprinkling toward the rising sun,
    rehearsal gatherings, and winter-solstice plume and staff practices involving
    la'showawe, Mu'waiye, Bow priesthood members, and tehl'nawe staffs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fraternity member may invite a desired person to join; adults are addressed
    directly, while a solicited child's parents are addressed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the invitation is accepted, the invited person gives the solicitor meal
    wrapped in a corn husk with a single white fluffy eagle feather attached by white
    cotton cord, and the solicitor becomes the fraternity father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity father and novice stoop with bent knees while holding the meal-and-feather
    package, and the father moves the novice's hands toward the six regions with a
    prayer before receiving the package.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the day before the following year's ceremonial opening, the fraternity
    father removes the eagle feather from the meal package, places it in another husk,
    sprinkles meal on it, folds and ties the husk, and leaves it temporarily in his
    home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fraternity father later visits female members of his clan and of his paternal
    parent's clan, carrying the husk of meal from which the feather was removed and
    giving a pinch of meal to each female.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the meal distribution, the father and recipient stoop facing one another;
    the recipient receives meal in the left palm and covers it with the right hand
    while the man holds her hands and prays for the fraternity members, the recipient,
    and the child to be received.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each meal recipient wraps her pinch of meal in a bit of corn husk and keeps
    it until the next morning, when it is sprinkled outdoors at daylight toward the
    rising sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Recipients of the meal are expected to attend and participate in an all-night
    dance on the fifth night of the ceremonial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before the actual ceremony, the fraternity gathers in the ceremonial chamber
    to practice songs, beginning near midnight; the passage contrasts earlier tale-telling
    with present discussion of grievances.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: At rehearsal gatherings, household sleeping arrangements continue, elder household
    members may join discussion, and the first drum stroke signals the choir to begin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Feathers are described as a conspicuous feature in Zuñi worship.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The 'Hle'wekwe make la'showawe from short wing feathers of the lilai'aluko,
    and the 'Hlem'mosona carries them to the North ki'wisine on the tenth morning
    of the winter solstice ceremonies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Kia'kwemosi chooses young men and girls as directors and directresses
    for the Mu'waiye and for six members of the A'pi'lashiwanni, who make tehl'nawe
    to be carried in the i'kwinnakia circle dance and who lead the dance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The pe'kwin gives la'showawe to the four amosi, and each gives a single-plume
    la'showanne to an associate directress.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note identifies the Mu'waiye as two girls and one youth and states that,
    if they were not virgins, the snows for which they dance would not come.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: A note describes the tehl'nawe as a slender staff the length of the extended
    arms, with ends painted for the six regions, seeds secured near the lower end
    by corn husk and yucca ribbons, and feathers attached near the middle.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: The tehl'nawe also bears a la'showanne, a miniature war club, a bow and arrows
    with a shell, a cotton-network shield, red coloring, and additional eagle plumes.
  category: object
  evidence_refs:
  - ev:13
