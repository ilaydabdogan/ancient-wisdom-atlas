candidate_motifs:
- id: motif:1
  label: Coming to or finding the Middle of the world
  taxonomy_refs:
  - world_center
  basis: The Hle'wekwe officers say they wish to come to the Middle of the world,
    and their interlocutors are told that they have found the Middle.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a ceremonial-legendary reference to the Middle but does
    not describe a full cosmographic map.
- id: motif:2
  label: Ritual weather-making through planted prayer plumes
  taxonomy_refs:
  - seasonal_cycle
  basis: Prayer plumes are made and planted before rain and snow events lasting four
    days and nights; later rites are explicitly tied to cold rains and snows.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage presents ritual causation within ethnographic narrative; extraction
    does not assess historicity.
- id: motif:3
  label: Agricultural balance of snow, warm rain, and corn
  taxonomy_refs:
  - seasonal_cycle
  - duality
  basis: The Hle'wekwe director explains that snow cools the earth and strengthens
    corn when warm rains arrive, while summer performance of snow rites would freeze
    corn.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The duality label is limited to the explicit contrast between warm rains
    and cold snows; no broader metaphysical dualism is stated.
- id: motif:4
  label: Sacred underworld roads and underworld-provenance ritual objects
  taxonomy_refs: []
  basis: The spring is linked by underground roads to the fourth or undermost world,
    and hla'we and a sacred meal basket are said to have come from the undermost world.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: medium
  cautions: The passage gives brief locative and provenance statements, not a full
    journey narrative.
- id: motif:5
  label: Sacred exchange through offerings and deposited payments
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer-plume offerings are made and planted, a plume is given by the Shi'wanni
    of the West, and bead strings are given to women and then deposited with the et'towe.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:10
  confidence: medium
  cautions: The bead-payment episode is described tersely and should not be generalized
    beyond the stated one-night arrangement.
