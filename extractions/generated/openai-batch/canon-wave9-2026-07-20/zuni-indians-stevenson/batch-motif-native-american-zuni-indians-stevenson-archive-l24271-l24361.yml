canonical_text:
  quote: ''
  summary: 'The passage describes Hle''wekwe-related traditions and ceremonies at
    I''tiwanna and Top''apkwinna: a sacred spring where a director disappears, claims
    about underground roads to other worlds, negotiations with rain priests over prayer
    plumes, ritual production of rain and snow, explanation of snow''s value for corn,
    selection of et''towe and ritual participants, ceremonial reception with Beast
    Gods and beast warriors, prayers over et''towe for snows and cold rains, a temporary
    bead-payment license associated with the et''towe, and the fraternity''s orders,
    meetings, seasonal restrictions, and medicine use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Top'apkwinna, described as black rocks, the original director disappeared
    in a spring that became a sacred spot to the Hle'wekwe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hle'wekwe asserted that underground roads from the spring led to Ko'thluwala'wa
    and to A'witen te'hula, identified as the fourth or undermost world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Hle'wekwe officers told the rain priests that they wished to come to the
    Middle of the world, and each side initially insisted that the other prepare prayer-plume
    offerings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the A'shiwanni made and planted prayer plumes, clouds gathered from
    the four quarters, rain fell for four days and four nights, and rivers and lakes
    became full.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the two Hle'wekwe officers made and planted prayer plumes, many small
    white clouds appeared and snow fell for four days and nights, reaching halfway
    up the house ladders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Kia'kwemosi objected that if the Hle'wekwe brought their et'towe and snow
    songs nearby, the people would have no corn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Hle'wekwe director replied that snow cools the earth, melts under the
    sun, sinks into the earth, and helps corn become strong when warm rains come.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Shi'wanni of the West gave a prayer plume to the Hle'wekwe director, who
    made another, planted both at the spring, then disappeared into it, after which
    rain fell for four days and nights and stream beds filled with water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kia'kwemosi selected additional et'towe from Corn, Badger, and Ai'yaho'kwe
    clan sources and designated them mu'et'towe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Kia'kwemosi chose maidens to bear et'towe and hla'we, chose a Dogwood-clan
    man carrying a sacred meal basket, and chose two maidens and a youth to dance
    with singers accompanying them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Beast Gods accompanied the Hle'wekwe to I'tiwanna, and beast warriors performed
    in the sacred dance plaza with notched sticks, deer leg bones, inverted baskets,
    and meal crosses, while other beast warriors sat looking upward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the plaza ceremony, the et'towe were placed in meal-filled baskets in
    the O'he'wa ki'wi'sine, where ritual officials prayed over them to bring snows
    and cold rains.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Hle'wekwe director announced that for one night the et'towe would permit
    licentiousness, with each man's bead string given to a chosen woman and then deposited
    with the et'towe.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Hle'wekwe fraternity is described as having two orders, Sword and Spruce,
    and two regular annual meetings, one in January and one in February.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage states that if the Hle'wekwe dance or make prayer plumes in summer,
    the corn would freeze, because their songs and dances are for cold rains and snows.
  category: attribute
  evidence_refs:
  - ev:11
