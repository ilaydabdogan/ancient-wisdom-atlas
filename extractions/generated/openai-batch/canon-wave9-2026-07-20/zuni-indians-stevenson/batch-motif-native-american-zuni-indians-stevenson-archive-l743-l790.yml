canonical_text:
  quote: ''
  summary: The passage describes A'shiwi rain priests in the lower world, their sacred
    et'towe, a cloud meal painting made by the Divine Ones, ordered seating around
    a road, communal night singing and prayer for rain and grass seed, the dawn appearance
    of the Morning Star and Sun Father, and Kia'kwemosi's offering of prayer plumes
    to Sun Father and Moon Mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The A'shiwi are said to have rain priests in the lower world, and six rain
    priests were assigned to six regions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each shi'wanni possessed an et'tone, described as the most sacred of their
    fetishes, and brought it to this world wrapped in straw in a crude basket and
    pressed to his breast.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kow'wituma and Wats'usi, called the Divine Ones, made a meal painting of cumulus
    clouds on the ground and road, and the A'shiwanni placed their et'towe on the
    painting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rain priests and Divine Ones sat in a specified order on and near the
    road, which is described as a dividing line.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ya'nowwuluha, described as a man of great heart and wisdom, sat before the
    meal painting, and the A'shiwi gathered around it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gathered participants sang songs of the Divine Ones for rain and for the
    earth to abound in kia"sanna, the grass seed described as the only food then known
    to the A'shiwi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Divine Ones and A'shiwanni left the et'towe on the painting while they
    retired a short distance, ate, slept awhile, and then returned to resume prayers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mo'yftchun*hlan'na, Great Star or the morning star, appeared faintly through
    delicate showers; the people thought it was their Father, but the Divine Ones
    said it was the Sun Father's warrior who comes before.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the sun appeared, the people fell on their faces in fear, and the Divine
    Ones told them not to be afraid and identified it as their Sun Father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kia'kwemosi went over the eastern road, planted prayer plumes sent by the
    Sun Father through the Divine Ones, and offered them in prayer to Sun Father and
    Moon Mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An editorial note reports that an earlier publication said the A'shiwi ascended
    to the outer world through a huge hollow reed, while cautioning about distinguishing
    tribal cosmogony from winter tales of individual narrators.
  category: other
  evidence_refs:
  - ev:5
