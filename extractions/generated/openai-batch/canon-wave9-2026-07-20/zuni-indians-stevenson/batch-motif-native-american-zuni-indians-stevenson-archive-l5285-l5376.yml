candidate_motifs:
- id: motif:1
  label: Serpent fetish procession and manifestation
  taxonomy_refs:
  - serpent
  basis: Ko'loowisi is explicitly treated as a serpent fetish, hidden by trees except
    for its head, made to appear roaring by a shell, and later made to protrude from
    an opening to touch dancers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage is an ethnographic ritual description; it does not narrate
    an independent serpent episode beyond the described fetish and ceremony.
- id: motif:2
  label: Directional seed and corn offerings
  taxonomy_refs:
  - sacred_exchange
  basis: At morning star, gods from the six regions present differentiated corn and
    seed offerings with plume wands to Great Fire fraternity officials.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The offering action is explicit, but reciprocal exchange or mythic transaction
    is not stated in the passage.
- id: motif:3
  label: Ritual departure and return along ordered roads
  taxonomy_refs:
  - departure
  - return
  basis: Gods visit ceremonial chambers in order, leave by the eastern road, return
    to their ki'wi'siwe, and Hii'shi later enters by the eastern road and departs
    by the western road.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: medium
  cautions: This is a ceremonial movement pattern, not a narrative hero departure-and-return
    sequence.
- id: motif:4
  label: Centered spring bowl with sacred water and aquatic life
  taxonomy_refs: []
  basis: A bowl referred to as the spring is placed at the center of a sand disk and
    filled with water from a spring sacred to rain priests, including mosses, fish,
    frogs, and possibly a water snake.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No broader cosmological meaning is stated beyond the bowl's central placement
    and identification as a spring.
- id: motif:5
  label: Ascent and descent sign of the woodpecker feather
  taxonomy_refs:
  - ascent
  basis: The passage explains that the woodpecker feather is used because the woodpecker
    ascends and descends trees headforemost and can peck into hard wood.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The explanation is explicit, but the passage does not fully state how
    this capacity functions within the wider ritual.
- id: motif:6
  label: Sand or dry painting of gods
  taxonomy_refs: []
  basis: Great Fire fraternity members prepare a sand disk with a white ground on
    which an artist delineates the Sali'imobiya, 'Kiaklo, and other gods.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The supplied passage ends while the description of the represented gods
    is still incomplete.
