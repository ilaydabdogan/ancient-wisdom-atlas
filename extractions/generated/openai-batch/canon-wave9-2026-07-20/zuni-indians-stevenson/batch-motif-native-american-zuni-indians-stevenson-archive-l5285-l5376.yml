canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence involving the Ko''loowisi
    serpent fetish: its procession, installation in a kiva, accompanying gods and
    dancers, directional seed and corn offerings, a later visit by ''Kiaklo/Hii''shi,
    and preparations for a sand or dry painting with a spring bowl and sacred water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ko'loowisi fetish enters with its head passing through a cloud-symbol
    tablet, while spruce trees cover most of the fetish and the priest or keeper holds
    its tail and blows a hidden great shell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ko'loowisi is accompanied by Pau'tiwa, the Sali'imobiya from the six regions,
    other gods, men from Chu'pawa ki'wi'sine, and the bird fetish Su'ti'ki.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ko'loowisi is carried to each ki'wi'sine in the order visited by 'Kiaklo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In He'kiapawa, Ko'loowisi is placed north of the altar with its head to the
    east; water jugs from To'seluna spring and grass from the spring are set before
    it, and pictures of Ko'loowisi decorate the north and south walls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ko'loowisi priest continually blows the shell, making it appear that the
    serpent keeps up a continuous roaring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The gods dance through the night, visiting one ki'wi'sine after another in
    the order North, West, South, East, Zenith, and Nadir.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the rising of the morning star, gods who accompanied Ko'loowisi gather
    in He'kiapawa and make offerings of corn grains and other seeds, received by the
    director and deputy of the Great Fire fraternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The Sali''imobiya offerings are differentiated by region and corn color:
    North yellow, West blue, South red, East white, Zenith multicolored, and Nadir
    black.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each offerer presents a plume wand, and the wands are afterward planted at
    the apexes of sand mounds in the Chu'pawa and O'he'wa ki'wi'siwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The gods go eastward toward Pescado, remove their masks, attach a woodpecker-feather
    plume cord to coyote weed, replace their masks, and return to their ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: "'Kiaklo, here called Hii'shi, comes over the eastern road with attendants;
    Hii'shi sprinkles a line of meal and calls others to follow."
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Mu'luktiikia dance before the opening through which Ko'loowisi's head
    is thrust; the serpent head protrudes at intervals and touches them while they
    dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Later, directors and others go to He'iwa ki'wi'sine, where Great Fire fraternity
    members have brought materials for a sand or dry painting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A sand disk is made, and an archaic bowl decorated with toads, tadpoles, and
    dragonflies is placed in its center and referred to as the spring.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The bowl's water must come from a spring sacred to the rain priests and must
    contain mosses, fish if present, frogs, and, if obtainable, a water snake.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: A Frog clan member dips the water, and a Great Fire fraternity artist delineates
    figures of the Sali'imobiya, 'Kiaklo, and other gods on a white ground.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
