canonical_text:
  quote: ''
  summary: 'The passage describes fourth- and fifth-day ceremonial activities: women
    grind grain and prepare feast food; a spring is described as connected with deceased
    Hle''wekwe, beast warriors, and plume offerings; novices undergo an emetic rite,
    feather-and-meal offering, ordered seating and singing, sword-swallowing with
    root medicine, and a following-morning head washing, restricted meal, and bowl
    gift.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Grinding of wheat and corn begins on the fourth morning in houses of fraternity
    fathers and novices; elder women remove corn from the cob, crones toast meal,
    and girls take turns at eight or ten mills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grinders sing under an aged woman’s direction; some alternate grinders
    dance, and household women stew meat and peaches and make he'we for the workers’
    feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hle'wekwe claim that a deep spring has a large place below for deceased
    Hle'wekwe and beast warriors, who receive plume offerings and convey them to Ko'tliluwala'wa.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fifth day the grinders do comparatively little work because they go
    to witness dances of the Hle'wekwe and Great Fire fraternities in Si'aa'. te'wita.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After sunset on the fourth evening, novices are taken by fraternity fathers
    to the ceremonial chamber, given emetic in bowls, seated facing east, and made
    to vomit after the throat is tickled with a feather.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After vomiting stops, a fraternity father breaks an eagle plume into the bowl,
    adds meal, prays for health, a pure heart, and long life for the novice, waves
    the bowl to the six regions, prays for snows and winter rains, and deposits the
    contents in the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Male members sit on the south side and female members and the two novices
    on the north; during the first song, rattles are used and the women and novices
    keep time with interlocked fingers and hands held downward.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A fraternity father asks the Hlem'mosona for the ancient sword of the original
    Hlem'mosona and asks for medicine; a young man of the Corn clan takes a bit of
    root from a sack among fetishes and places it in the fraternity father’s mouth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fraternity father takes the novice by the hand, says “My child, come with
    me,” leads him to the middle of the room, and both face north while the fraternity
    members sing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the song and dance, the fraternity father swallows the sword with root
    medicine in his mouth, then transfers the medicine mouth-to-mouth to the novice,
    who swallows and withdraws the sword and hands it back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ceremony is repeated for the other novice, a woman; she only puts the
    sword into her mouth while the fraternity father runs it down his own throat in
    her stead, and the song continues during the initiation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The following morning the candidate’s head is bathed in yucca suds at the
    fraternity father’s house; the candidate eats alone with specified dietary limits,
    and the bathing bowl is carried home and given to the novice.
  category: sequence
  evidence_refs:
  - ev:10
