canonical_text:
  quote: '"a line of meal, symbolic of the path of life"'
  summary: The passage describes postpartum care for a mother and infant, difficulty
    with nursing, and a first-light ritual in which the newborn is carried with an
    ear of corn, oriented eastward toward the Sun Father, prayed over, washed with
    juniper water and yucca suds, rubbed with ashes, and fed condensed milk. A related
    washing is then performed for the young mother.
  language: English
  quote_policy: quoted
