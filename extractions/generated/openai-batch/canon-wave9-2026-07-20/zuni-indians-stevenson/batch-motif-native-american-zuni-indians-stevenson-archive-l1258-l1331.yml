  type: summary
  locator: lines 1305-1315
  quote_or_summary: The A'shiwi prayers bring heavy rains on the third morning; the
    A'shiwi meet the enemy again, and their forces are strengthened by the Kok'ko
    at the request of U'yuyewi and Ma'sai'lema, now recognized as Gods of War.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
