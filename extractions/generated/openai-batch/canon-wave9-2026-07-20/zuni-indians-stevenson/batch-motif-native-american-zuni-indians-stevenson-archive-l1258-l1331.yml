    To'na O"si to gather around a pottery drum and dance; the Coyote-clan man receives
    a drumstick like those used at the present time, and participants form a broken
    circle.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
- id: ev:2
  type: summary
  locator: lines 1267-1278
  quote_or_summary: At Kow'wituma's command, four drum strokes and rapid beating summon
    seven beings from the earth; the circle sings under Kow'wituma, and the Turkey
    man later strikes the drum four times, frightening the enemy, before the A'shiwi
    advance with the Divine Ones.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
- id: ev:3
  type: summary
  locator: lines 1278-1282 and mi'ha note
  quote_or_summary: The enemy are identified as the Kia'nakwe, whom the A'shiwi call
    white people because they wear mi'has, white cotton embroidered blankets; the
    note states the Zunis later wove the mi'ha and that modern mi'has are ceremonial
    fabrics.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
- id: ev:4
  type: summary
  locator: lines 1283-1289
  quote_or_summary: The fighting lasts four days; the Kia'nakwe stop their nostrils
    with raw cotton against sulphurous odors from the A'shiwi bodies; at night the
    two sides fall back, and the A'shiwi dance and pray for rain at Han'tlipinkia.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
- id: ev:5
  type: summary
  locator: lines 1290-1296
  quote_or_summary: On the second night, the Kia'kwemosi sends the Divine Ones to
    Ko'thluwala'wa to consult A'wan ta'Vjhu Ko'yemshi and ask the Council of the Gods
    for rain that will strengthen yucca bowstrings and weaken deer-sinew bowstrings.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
