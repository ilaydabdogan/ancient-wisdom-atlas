  locator: lines 1297-1304 and Ko'yemshi mountain note
  quote_or_summary: The A'shiwi secure arrows for the engagement on Ko'yemshi mountain;
    the note says Ko'yemshi mountain was found to have been a central place for arrow
    making.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; concise summary used.
