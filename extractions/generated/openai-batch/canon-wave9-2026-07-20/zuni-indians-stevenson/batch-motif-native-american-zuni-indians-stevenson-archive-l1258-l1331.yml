canonical_text:
  quote: ''
  summary: A ritual dance around a pottery drum summons seven beings from the earth.
    The A'shiwi and Divine Ones confront the Kia'nakwe, fight for four days, pray
    for rain, and receive rain that affects the battle. Divine war allies join them.
    Ku'yapali'sa captures four gods from Ko'thluwala'wa; the captives escape, but
    all except Sha'lako are recaptured. The Kia'nakwe hold a dance displaying prisoner
    gods, and Kor'kokshi is dressed in female attire to reduce his anger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named figures are requested to gather around a pottery drum and dance;
    a Coyote-clan man is given a drumstick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A broken circle forms around the drum group, with each man in the circle accompanied
    by a woman of his paternal clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Kow'wituma's command, the Coyote-clan man strikes the drum four times,
    then rapidly; seven beings come from the depths of the earth and join the group.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The circle moves slowly and sings, with Kow'wituma leading; four songs or
    stanzas are completed before the Turkey man strikes the drum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Turkey man strikes the drum four times with his claws, and each stroke
    makes the enemy's hearts tremble and jump with fear.
  category: action
  evidence_refs:
  - ev:2
  - ev:11
- id: obs:6
  text: The A'shiwi, accompanied by the Divine Ones U'yuyewi and Ma'sai'lema, advance
    toward the enemy, identified as the Kia'nakwe.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The A'shiwi call the Kia'nakwe the white people because they wear white cotton
    embroidered blankets called mi'has.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The fighting lasts four days; the Kia'nakwe stop their nostrils with raw cotton
    to avoid sulphurous odors from the bodies of the A'shiwi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night, the Kia'nakwe return to their village and the A'shiwi return to
    Han'tlipinkia, where they dance and pray through the night for rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Kia'kwemosi sends the Divine Ones to Ko'thluwala'wa to ask about the enemy
    and to implore the Council of the Gods to cause rainfall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The requested rain is expected to strengthen A'shiwi bowstrings made of yucca
    fiber and weaken enemy bowstrings made of deer sinew.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The A'shiwi secure arrows for the engagement on Ko'yemshi mountain, which
    is noted as a central place for arrow making.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Heavy rain comes on the third morning after the A'shiwi prayers, and the A'shiwi
    meet the enemy again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Kok'ko strengthen the A'shiwi forces at the request of U'yuyewi and Ma'sai'lema,
    who are now recognized as Gods of War.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ku'yapali'sa, the Cha'kwena, walks before her army shaking a rattle and captures
    four gods from Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The captured gods escape; all are captured again except Sha'lako, who runs
    so swiftly that he is not caught.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Kia'nakwe hold a dance in celebration of the capture of prisoner gods.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Kor'kokshi is angry and unmanageable, and Ku'yapali'sa has him dressed in
    female attire before the dance.
  category: action
  evidence_refs:
  - ev:10
