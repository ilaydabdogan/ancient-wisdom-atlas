- id: ev:8
  type: summary
  locator: lines 1315-1324
  quote_or_summary: 'Ku''yapali''sa, the Cha''kwena, walks in front of her army shaking
    her rattle and captures four gods from Ko''thluwala''wa: Kor''kokshi, If''sepasha,
    Sa''ya''hlia, and Sha''lako.'
