candidate_motifs:
- id: motif:1
  label: Ritual drumming summons beings from beneath the earth
  taxonomy_refs:
  - ascent
  basis: Four drum strokes and rapid beating call forth seven beings from the depths
    of the earth to join the ritual group.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term 'ascent' only approximately fits the literal
    upward emergence from the earth; the passage does not use that abstract category.
- id: motif:2
  label: Fourfold ritual patterning before and during battle
  taxonomy_refs: []
  basis: The passage repeats fourfold structure in drum strokes, songs or stanzas,
    and the four-day battle.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: This is a structural pattern in the passage rather than a named taxonomy
    motif.
- id: motif:3
  label: Prayer-caused rain alters battle conditions
  taxonomy_refs: []
  basis: The A'shiwi pray for rain, the Council of the Gods is implored to cause rainfall,
    and heavy rains arrive on the third morning; the desired effect is to strengthen
    A'shiwi bowstrings and weaken enemy bowstrings.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage supports a direct ritual-weather-battle sequence, but it does
    not state a formal motif name.
- id: motif:4
  label: Divine war allies reinforce a human war party
  taxonomy_refs: []
  basis: The A'shiwi fight with the Divine Ones, whose status as Gods of War is recognized,
    and their forces are strengthened by the Kok'ko.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage does not explicitly frame this as divine judgment or a culture-hero
    episode.
- id: motif:5
  label: Capture, escape, and recapture of gods
  taxonomy_refs: []
  basis: Four gods from Ko'thluwala'wa are captured, escape, and are recaptured except
    for Sha'lako, who evades capture through speed.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The excerpt ends before any larger consequence of the capture episode
    is given.
- id: motif:6
  label: Prisoner-god display and ritual humiliation
  taxonomy_refs: []
  basis: The Kia'nakwe include prisoner gods in a celebratory dance, and angry Kor'kokshi
    is dressed in female attire before the dance.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The meaning of the female attire is not explained beyond Ku'yapali'sa's
    stated hope that it may make Kor'kokshi less angry.
- id: motif:7
  label: Origin link for ceremonial white embroidered blankets
  taxonomy_refs: []
  basis: The footnote states that the Zunis had not seen the mi'ha before meeting
    the Kia'nakwe, later wove it of native cotton, and that the modern mi'ha is ceremonial.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is mainly supported by the ethnographic note rather than by narrative
    action in the mythic scene.
comparison_claims:
- id: claim:1
  claim: The passage explicitly links the mythic pottery drumstick to drumsticks used
    at the author's present time for such drums.
  claim_level: same_function
  target: Present-time pottery drum practice mentioned in the passage note.
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states continuity of the drumstick type but gives no extended
    comparison of full ritual practice.
- id: claim:2
  claim: The passage note cautiously connects the Kia'nakwe mi'ha blankets with later
    Zuni weaving and modern ceremonial mi'ha fabrics made by Hopi priests.
  claim_level: same_function
  target: Later Zuni and Hopi ceremonial mi'ha tradition as described in the passage
    note.
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The note reports later ceremonial use and material changes, but the
    narrative itself only describes the Kia'nakwe wearing the blankets.
- id: claim:3
  claim: The passage note aligns the mythic arrow preparation at Ko'yemshi mountain
    with a local tradition identifying that mountain as a central arrow-making place.
  claim_level: same_function
  target: Ko'yemshi mountain arrow-making association described in the passage note.
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The evidence is a brief place note and does not provide a detailed
    independent tradition for comparison.
