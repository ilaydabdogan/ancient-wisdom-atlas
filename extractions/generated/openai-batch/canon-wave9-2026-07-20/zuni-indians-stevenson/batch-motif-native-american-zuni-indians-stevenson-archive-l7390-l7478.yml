canonical_text:
  quote: ''
  summary: 'The passage describes a Zuñi winter solstice ceremonial sequence: offerings
    are presented to selected personators of gods, prayers are made for rain, corn,
    water, long life, and good things, two costumed figures perform on the roof of
    the ki''wi''sine, a ladder bar is described as symbolic of a bow, songs of the
    Great Fire fraternity are heard, and cooked sweet corn is thrown to the gathered
    populace. The passage also notes a prohibition on eating meals inside the ki''wi''sine
    during this season because of its association with rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men enter the ki'wi'sine and sit on a plank extending from one box to another;
    the personator of Shu'laawi'si is addressed first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin presents offerings from a basket containing te'likinawe; the stick
    for Shu'laawi'si is black with yellow, blue-green, red, and white spots and has
    feathers attached.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest places the te'likinane in the selected personator's hands, clasps
    those hands, and prays for rain, corn, much water over the earth, long life, and
    all good things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The te'likinane is passed several times before the selected personator's face
    so that he may draw sacred breath from the plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The same ceremony is repeated with Sa'yatasha, Hu'tutu, the two Ya'muhakto,
    A'wan ta"chu Ko'yemshi, and Bi'"si'si; most of their sticks are yellow, while
    the Ko'yemshi stick is black.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: After the offerings are presented, the chosen personators leave the ki'wi'sine,
    and the personator of Sa'yatasha takes home all the te'likinawe except those of
    the Ko'yemshi and Bi'"si'si.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: Shits'ukia and Kwe'lele perform during the day on the roof of the ki'wi'sine
    while crowds gather in the plaza and on housetops.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: Shits'ukia is described with white body paint, costume elements, beads, mask
    designs including lightning and a cornstalk, deer tails, colored wheels symbolizing
    corn and squash blossoms, plumes, spruce, a rhombus in the right hand, and yucca
    in the left hand.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: Kwe'lele is described with black body coloring except for white upper legs,
    costume elements, green armlets with spruce twigs, a black mask, yucca in the
    right hand, and fire sticks in the left hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The ladder leading into the ki'wi'sine has a horizontal bar described as symbolic
    of the bow of the Sa'ya'hlia; the bar has black goat's wool fringe, a squirrel
    skin at the middle, and eagle plumes at the ends.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Songs of the Great Fire fraternity are heard inside while the two gods are
    on the roof.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Near the close of the afternoon, Shits'ukia and Kwe'lele descend into the
    ki'wi'sine and then reappear with ears of cooked sweet corn strung horizontally
    with yucca strings, which they throw to the populace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that no meals are served in the ki'wi'sine during the winter
    solstice ceremonial and that no rains would come if food were eaten there at that
    season.
  category: relationship
  evidence_refs:
  - ev:5
