canonical_text:
  quote: ''
  summary: The passage describes a ritual sequence in which trees are sprinkled, passed,
    breathed upon or through associated elements, and used with feathers and buds.
    The leader addresses the participants with hopes for health, rain, snow, and crops.
    Members of the Sword order perform purification actions with swords, which are
    then stored. The next morning the novice's head is washed and gifts are given;
    the ritual trees are carried north to a mesa and dropped into a deep fissure with
    sword ends pointing east.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meal is held in the left hand for physical purification, and the trees are
    passed four times to be sprinkled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants catch the la'showawe or la'showanne of each tree in the left
    hand, draw a quick breath, and do not release it until a neighbor has caught it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'Hlem'mosona returns to the middle of the floor between actions, prays,
    and passes the trees before the order.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Participants catch the la'showawe and pass feathers through the mouth so that
    medicine left in the mouth from the swords may adhere to the plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Participants pick buds from the trees, especially spruce or piñon buds, according
    to an individual wish for a male or female child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The 'Hlem'mosona says there will be no more of this until another year or
    four years hence, hopes the people will be happy and well, and hopes the dance
