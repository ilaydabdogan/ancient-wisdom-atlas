  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the leader's command, all participants throw up their arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Members of the Sword order take swords with feathered handles in the left
    hand, expectorate four times upon them, and wave them around the head four times
    from left to right for physical purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sword is separated from the handle, and the 'Hlem'mosona places the swords
    in a skin, wraps it carefully, and lays it in a box.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The following morning the novice's head is washed by the wife or daughter
