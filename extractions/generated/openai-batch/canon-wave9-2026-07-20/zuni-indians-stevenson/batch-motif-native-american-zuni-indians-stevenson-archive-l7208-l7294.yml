canonical_text:
  quote: ''
  summary: 'The passage describes masked personators in the ki''wi''sine during a
    night ceremony: Sa''ya''hlia, Shits''ukia, Kwe''lele, and Pau''tiwa appear with
    masks and ritual placements; initiated male spectators remain through the night
    under prohibitions against sleeping or leaving; singing, dancing, smoking, and
    popcorn water accompany the vigil; at the appearance of the Morning Star, Kwe''lele
    and a Great Fire fraternity director make fire by friction, and an ordered party
    leaves carrying meal, corn, firebrands, te''likinawe, weapons, yucca, and other
    ritual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sa'ya'hlia masks that had been deposited by the meal painting are removed
    and worn by personators, who appear briefly as warriors in the village streets
    before returning to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The personators of Shits'ukia and Kwe'lele wear masks through the night and
    continue moving without taking seats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The personator of Pau'tiwa appears after dark; his mask is removed and placed
    by the meal painting while he sits behind it between the lines of Dogwood and
    Sun clan men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male spectators who have passed voluntary initiation may enter the ki'wi'sine;
    after entry, no one is to sleep or leave before morning, and Sa'ya'hlia, Shits'ukia,
    and Kwe'lele whip those found dozing or attempting to depart.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Members of the Great Fire fraternity and the He'iwa ki'wi'sine alternate singing
    with rattle and drum accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Smoking is constant, popcorn water is drunk, and objects that have touched
    grease must not be used to dip the popcorn water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Songs and dancing by Shits'ukia and Kwe'lele continue until the Morning Star
    is seen by men watching from the hatchway ladder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kwe'lele and the director of the order of Kok'ko 'hlan'na make fire by friction
    using fire sticks and crushed cedar fiber; the passage states that breath must
    not be blown on the fiber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After fire is produced, participants leave the ki'wi'sine in a fixed order,
    carrying ritual objects including meal, corn, firebrands, te'likinawe, bows, arrows,
    yucca, cedar fiber, and fire sticks.
  category: sequence
  evidence_refs:
  - ev:6
