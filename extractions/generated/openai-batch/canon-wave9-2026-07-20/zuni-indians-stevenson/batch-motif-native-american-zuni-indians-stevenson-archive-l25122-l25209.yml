canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi ceremonial rehearsals and rites: a circular
    dance involving girls and young men; repeated dances, sword-swallowing, fire feats,
    and distribution of la''showawe; the making of a dry-color figure of Achiyala''topa
    with meal, arrows, pollen, and crystal; oracles attributed to the figure, including
    a warning about a railroad disturbing et''towe and affecting rain and snow; a
    meal line drawn around the ceremonial chamber roof; washing before an outdoor
    dance; and a medicine-bowl rite with fetishes, medicines, water, eagle plumes,
    pollen, and prayers for winter rain and snow.'
  language: English
  quote_policy: summarized
