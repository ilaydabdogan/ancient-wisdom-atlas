canonical_text:
  quote: ''
  summary: The passage describes Zuñi pottery manufacture, sources of clay, and associated
    restrictions and rites. It notes that many pottery and rock-carving symbols are
    no longer understood, describes clay as obtained from customary places such as
    Corn Mountain, recounts We'wha's actions while collecting clay, and explains hand-building
    and decorating pottery without a wheel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pottery manufacture is described as a major Zuñi industry; most women are
    potters, and children learn by working clay beside their mothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Few people are said to fully understand symbols on modern pottery, and even
    the wisest are unable to decipher many symbols on ancient pottery and nearby rock
    carvings.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Black clay for pottery is obtained from Corn Mountain and, when needed, from
    mesas near Ojo Caliente and Pescado; custom prevents using clay from other localities.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people say Mother Earth will continue supplying clay as long as they remain
    pure of heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a stone heap, We'wha picks up a small stone in her left hand, spits on
    it, carries the hand around her head, and throws the stone over her shoulder onto
    the heap so her strength will not leave her while carrying clay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: We'wha visits a shrine at the base of the mother rock and deposits a torn
    bit of her blanket in a small pit as an offering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: We'wha tells Mr Stevenson to remain behind because men never approach the
    clay bed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: We'wha asks the writer to stay quiet and not talk, saying that talking would
    make her pottery crack in baking and that constant prayer is needed for the clay
    to appear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: While digging, We'wha murmurs prayers to Mother Earth, rejects most of the
    clay after testing its texture, and carries about 150 pounds in a blanket on her
    back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The only implements named for making pottery are the bottom of a discarded
    water vase and a gourd or pottery-fragment trowel; no wheel, lathe, or revolving
    support is used.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Clay is powdered, mixed with pulverized pottery and water, kneaded, tested
    for grit, shaped first into a hollowed ball, and then built up with successive
    strips of paste.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Finished utensils are dried in the sun before decoration; white clay, a rabbit-skin
    mop, polishing stones, yucca-needle brushes, pigments, yucca fruit syrup, water
    from boiled Cleome serrulata, and ferruginous clays are used in finishing and
    decoration.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note states that the men who collect clay are few men who adopt woman's
    dress and do woman's work, and that they are always referred to as women.
  category: attribute
  evidence_refs:
  - ev:9
