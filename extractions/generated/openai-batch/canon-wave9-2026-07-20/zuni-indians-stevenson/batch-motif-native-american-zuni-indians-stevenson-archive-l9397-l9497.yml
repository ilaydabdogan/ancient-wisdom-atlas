canonical_text:
  quote: ''
  summary: The passage describes part of the installation of a new associate shi'wanni,
    including hand-clasping, prayers, transmission of sacred breath, handling of pollen,
    beads, deerskin, and later contact with a dual fetish. It then describes preparation
    and planting of te'likinawe plume offerings at directional locations, with meal,
    prayer meal, offerings to deities, lightning-makers, deceased predecessors, Earth
    Mother, and Sun Father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin clasps the novice's hands, prays four times, receives the novice's
    repeated assent, breathes on the novice's hands, and moves them before the novice's
    mouth so the novice may receive sacred breath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin does not release the novice's hands until the next officiant has
    taken them; this continuity is said to be strictly observed throughout the ceremonial.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shi'wanni, associates, officers, and named fraternities take turns appearing
    before the novice, praying with him, and participating in a fixed order.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the last participating warrior completes his part, the pe'kwin conducts
    the novice to his place and keeps hold until the new associate shi'wanni is seated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An associate removes beads from the buckskin arrangement, gathers pollen into
    a corn husk, gives it to the Kia'kwemosi, and removes the deerskin and blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kia'kwemosi offers a long prayer, those present respond at points, and
    the younger brother Bow priest offers a similar prayer that also appeals to the
    Gods of War associated with lightning-makers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The prayers ask that the incoming shi'wanni be pure of heart, live the straight
    life indicated by the pollen and bead line, please A'wonawil'ona, bring rain for
    seeds, and attain long life followed by renewed youth in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator reports that no further special instruction to the novice was
    discovered and that the symbolic lines over the deerskin seemed full enough of
    meaning to make spoken explanation unnecessary.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the long ritual, people waiting their turn speak jokes quietly and
    smoke commercial tobacco; the Shi'wanokia supply corn husks from another room
    for the smokers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ceremony lasts six hours; the new associate shi'wanni remains in position
    four hours and is afterward escorted to his dwelling, identified as the wife's
    house, by the elder and younger brother Bow priests.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At a later winter retreat, the dual fetish kia'et'tone and chu'et'tone is
    placed in the new associate shi'wanni's hands so that he may draw sacred breath
    from it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The preparation and planting of te'likinawe plume offerings are described
    as principal features of Zuñi worship and ritual; many are made annually, and
    each god and goddess receives particular offerings.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The first body of A'shiwanni make monthly offerings at points of the compass
    by excavating an arm-length pit and depositing toasted sweet corn meal, prayer
    meal, and te'likinawe; the stick's face is oriented east.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Bow priests make additional offerings to lightning-makers of the six regions,
    and prayers are offered to Earth Mother, Sun Father, and deceased predecessors.
  category: speech
  evidence_refs:
  - ev:9
