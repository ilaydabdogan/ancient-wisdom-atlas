  label: WINTER DANCES OF THK KOK'KOKSHI / A'SHIWANNI (RAIN PRIESTHOOD) / RAIN PRIKSTHOOD
    / INSTALLATION OF AN ASSOCIATE SHI'WANNI OF THE NORTH; lines 9397-9497
