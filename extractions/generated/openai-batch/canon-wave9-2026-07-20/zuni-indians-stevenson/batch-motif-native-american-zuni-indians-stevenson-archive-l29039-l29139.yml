canonical_text:
  quote: ''
  summary: 'The passage describes part of a multi-day Shu''maakwe ceremonial: dancers
    pray at an altar, inhale sacred breath, and sprinkle meal; members prepare masks,
    paraphernalia, and prayer plumes; a Shumai''koli god arrives from Chi''pia with
    two Sai''apa attendants, a choir, and a female sacred-meal carrier; the masked
    beings'' regalia and symbolic items are described; they proceed to the ceremonial
    house, ascend to the roof because a cedar tree bars the lower doorway, then descend
    into the chamber; the fourth night includes body painting of fraternity members.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dancers stop before the altar to inhale sacred breath, dance in successive
    groups, and leave the floor after periods of dancing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As each dancer leaves the floor, the dancer prays before the altar and sprinkles
    meal; the members sleep in the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the third day, members decorate masks and prepare paraphernalia; the third
    night ceremony is described as similar to the second night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth day, members complete paraphernalia and prepare prayer plumes,
    which they plant during the afternoon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sunset, a Shumai'koli god arrives from Chi'pia with two Sai'apa, accompanied
    by fraternity members grouped as a choir and led by a female member carrying a
    pottery basket of sacred meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Shumai'koli wears a face-covering yellow mask with protruding eyes, turkey-tail
    and eagle plumes, a wool sash, white clothing, sashes, fringe, moccasins, bells,
    eagle-wing plumes, a bow guard, fox skin, staff, mi'li, prayer plume, and blue
    crook.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The passage explicitly identifies the small blue crook on the Shumai'koli
    prayer plume as symbolic of longevity, and says the blue color symbolizes A'wonawil'ona
    and the Sun Father.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sai'apa masks cover the head; one face is blue and the other yellow, described
    as symbolic of the sun and moon; the masks also have white backs with tadpoles,
    cylinders, projecting feathers, padded horns, and fox skins.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sai'apa bodies are painted white; one wears yucca, the other a war pouch,
    and both carry a burning cedar brand in the right hand and giant yucca in the
    left.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Sai'apa speak and act the reverse of what they mean, including asking
    for food when not hungry and denying desire for tobacco when wishing to smoke.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the ceremonial house, the Sai'apa move burning torches; because a tall
    cedar tree bars the lower doorway, the group ascends an outer ladder to the roof
    before the three gods descend into the chamber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before descending through the hatchway, the Sai'apa extinguish their burning
    brands by striking them against it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the fourth night, blankets form a dressing room, and some men are painted
    solid white, some with white serpentine lines, and others with white spots representing
    the heavens.
  category: attribute
  evidence_refs:
  - ev:8
