canonical_text:
  quote: ''
  summary: 'The passage describes tenth- and fourteenth-day ritual actions: a midnight
    visit by Kom''ha''likwi, meal markings that count down the close of the fast,
    preparation of plume offerings, ritual water collection from springs by fraternity
    and clan representatives, prayers for water, crops, storms, and old age, selection
    of personators and hosts for divine visitation, making of a meal painting, and
    maintenance of a fire on the altar.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the tenth day, the dance director of each ki'wi'sine waits with associates
    for Kom'ha'likwi, who arrives at midnight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kom'ha'likwi avoids light and public view, climbs to the roof, throws meal
    through the hatchway, marks four meal lines on the hatchway crossbar, and later
    disappears by the western road.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four meal lines indicate that after four days ashes may be carried outside
    or the fast closes; one line is rubbed off each day by the dance director.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the fourteenth day, named ritual officers prepare te'likinawe offerings
    for the Council of the Gods, Sha'lako, Sa'ya'hlia, Bi'si'si, and, in quadrennial
    contexts, Kiaklo and the Kla'nakwe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder brother Bow priest chooses the A'wan ta"chu Ko'yemshi, who customarily
    selects nine associates from his fraternity, though associates may also be chosen
    more broadly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Fire fraternity sends two members to a spring east of Zuñi with
    a gourd jug, plume offerings, a rhombus, and meal; offerings are deposited and
    the jug is filled with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ko'mosona selects one Deer clan man and one Corn clan man to go to the
    Ojo Caliente spring with jugs, te'likinawe, and rhombi; they deposit the offerings,
    fill the jugs, and may sprinkle meal while praying for strength if weary.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Returned spring water is poured into medicine bowls with a prayer asking rain
    priests and rain makers for water, seeds, rains, lightning, thunder, and white-haired
    old age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the unexpressed thought of the prayer is to be happy
    with the fruits of the earth, live to old age, sleep rather than die, and awaken
    in Ko'thluwala'wa, the abiding place of the Council of the Gods.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The A'shiwanni, Ko'mosona, and Ko'pekwin consult about who will personate
    certain gods and who will entertain the Council of the Gods and Sha'liko in autumn;
    the elder brother Bow priest makes the decision, and eight new houses are to be
    blessed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before sunset on the fourteenth day, the Ko'pekwin makes a meal painting distinguished
    from the cloud painting belonging to the Gods of War and from cloud symbols of
    other fraternities.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A large fire burns on the fire altar day and night during the fourteenth day.
  category: object
  evidence_refs:
  - ev:9
