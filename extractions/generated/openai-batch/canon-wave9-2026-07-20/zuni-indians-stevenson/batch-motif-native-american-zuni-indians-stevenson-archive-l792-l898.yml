passage_locator:
  label: CREATION OF THE A'SHIWI AND THEIR COMING TO THE OUTER / WORLD / KOW'WITUMA
    APPOINTS YA'NUWWULUHA DKPUTV TO THK SUN / FATHEE; lines 792-898
  start: '792'
  end: '898'
  translation: 'The Zuñi Indians: Their Mythology, Esoteric Fraternities, and Ceremonies'
