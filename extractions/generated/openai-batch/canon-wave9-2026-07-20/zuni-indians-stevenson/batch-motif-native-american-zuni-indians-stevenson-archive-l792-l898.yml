- id: motif:8
  label: Differential possession of ritual knowledge among neighboring peoples
  taxonomy_refs: []
  basis: The Mu'kwe share an emergence route with the A'shiwi but do not make a cloud
    symbol or sing because the Divine Ones did not teach them.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives this as a Zuni explanation and does not present Mu'kwe
    self-description.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the Mu'kwe, Coconino Pimas, and A'pachu as
    sharing with the A'shiwi a pattern of emergence from the undermost world through
    three worlds to this world.
  claim_level: same_motif
  target: A'shiwi emergence pattern compared with Mu'kwe, Coconino Pimas, and A'pachu
    emergence
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal Zuni account in the supplied text; it is not independent
    evidence for those other peoples' own traditions.
- id: claim:2
  claim: 'The passage contrasts A''shiwi and Mu''kwe emergence practices: both are
    linked to ascent to the outer world, but the Mu''kwe cut their own ascent trees
    and lack the cloud symbol and songs attributed to Divine Ones'' teaching.'
  claim_level: same_function
  target: A'shiwi and Mu'kwe outer-world emergence practices
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The line range only summarizes the A'shiwi side of the comparison and
    gives more detail about differences in Mu'kwe ritual actions.
