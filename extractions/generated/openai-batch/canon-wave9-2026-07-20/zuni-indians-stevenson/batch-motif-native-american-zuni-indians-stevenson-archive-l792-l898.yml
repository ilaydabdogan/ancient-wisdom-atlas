candidate_motifs:
- id: motif:1
  label: Ritual appointment of a deputy through recognition of sacred items
  taxonomy_refs: []
  basis: Ya'nowwuluha's ability to identify the concealed et'towe is followed by Kow'wituma's
    appointment of him as pe'kwin to the Sun Father and Shi'wanni of the Zenith.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage does not provide a full explanation of the et'towe within
    this line range.
- id: motif:2
  label: Six-directional bird assembly for rain and lightning
  taxonomy_refs: []
  basis: Birds of North, West, South, East, Zenith, and Nadir are called in order,
    stand on the meal line, sing for rains and lightning, and become Ya'nowwuluha's
    et'towe.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No external taxonomy reference for this specific directional bird pattern
    is supplied.
- id: motif:3
  label: Ascent through layered worlds to the outer world
  taxonomy_refs:
  - ascent
  basis: The passage states that several peoples come from the undermost world, pass
    through three worlds, and reach this world, like the A'shiwi.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Details of the A'shiwi ascent itself are mostly outside the supplied line
    range.
- id: motif:4
  label: Tree-assisted ascent
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: The Mu'kwe are said to cut the trees by which they ascend to this world.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage names trees as the means of ascent but does not explicitly
    call them sacred or describe an axis in detail.
- id: motif:5
  label: Finding the Middle place
  taxonomy_refs:
  - world_center
  basis: The Divine Ones are said to travel with the A'shiwi until the A'shiwi find
    the Middle place.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The Middle place is mentioned briefly in this passage, with fuller context
    likely elsewhere.
- id: motif:6
  label: Divine bodily alteration after emergence
  taxonomy_refs: []
  basis: After arrival and movement to A'wisho, the Divine Ones remove tails, ears,
    and webbing from the A'shiwi; a similar alteration is later performed for the
    Mu'kwe.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage states these alterations literally; symbolic meaning is not
    supplied here.
- id: motif:7
  label: Divine guidance of migration and settlement
  taxonomy_refs:
  - culture_hero
  basis: The Divine Ones direct house-building, alter bodies, instruct the Mu'kwe,
    and are said to have traveled with the A'shiwi until the Middle place was found.
  evidence_refs:
