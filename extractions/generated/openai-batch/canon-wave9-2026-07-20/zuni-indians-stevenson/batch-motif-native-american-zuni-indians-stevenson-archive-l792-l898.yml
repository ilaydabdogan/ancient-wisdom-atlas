canonical_text:
  quote: ''
  summary: Kow'wituma appoints Ya'nowwuluha as deputy to the Sun Father and Shi'wanni
    of the Zenith after testing his knowledge of concealed et'towe. Six directional
    birds sing for rains and lightning and are assigned as Ya'nowwuluha's et'towe.
    The priestly order is rearranged, prayers continue for eight days and nights,
    and houses are later built. The passage then describes the early condition and
    alteration of the A'shiwi, followed by the sequential arrival of the Mu'kwe, Coconino
    Pimas, and A'pachu from lower worlds, with special comparison between A'shiwi
    and Mu'kwe emergence practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kow'wituma asks Ya'nowwuluha to identify concealed et'towe and, after his
    answer, says he will make him pe'kwin, deputy to the Sun Father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ya'nowwuluha stands on the meal line near the meal painting while birds of
    the six regions arrive in succession and sing.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Kow'wituma calls six birds in the order North, West, South, East, Zenith,
    and Nadir.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each called bird takes a place on the meal line and sings for rains and lightning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kow'wituma tells Ya'nowwuluha that the birds will be his et'towe, after which
    the birds fly away to their homes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ya'nowwuluha is placed in the line as Shi'wanni of the Zenith and pe'kwin
    to the Sun Father, while other A'shiwanni positions are rearranged.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Prayers and songs over the et'towe continue for eight days and nights, with
    the A'shiwanni retiring each evening for refreshment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before houses exist, each shi'wanni makes a place for his et'tone using four
    stone slabs; on the ninth day the A'shiwanni begin building houses of large reeds
    and earth under direction of the Divine Ones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The A'shiwi are described on arrival in this world as having short hairless
    tails, long ears, webbed feet and hands, moss-covered bodies and heads, and a
    horn-like tuft at the front of the head; the passage states that Zunis regard
    them as always human.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the A'shiwi move to a spring named A'wisho, the Divine Ones cut off
    their tails and ears, cut their webbed feet and hands with stone knives, and the
    people bathe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Mu'kwe, Coconino Pimas, and A'pachu follow the A'shiwi to this world at
    intervals of four time periods, coming from the undermost world through three
    worlds as the A'shiwi did.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the undermost world the villages of the A'shiwi and Mu'kwe are described
    as near each other, friendly, not related, and speaking different languages.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Divine Ones visit the Mu'kwe, deliver a message from the Sun Father, give
    them prepared tc'likinawc, and instruct them how to proceed to the outer world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Mu'kwe cut the trees by which they ascend to this world, and when they
    arrive they do not make a cloud symbol or sing because the Divine Ones did not
    teach them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the Mu'kwe move near A'wisho, the Divine Ones cut their webbed fingers
    and toes and amputate their tails.
  category: action
  evidence_refs:
  - ev:10
