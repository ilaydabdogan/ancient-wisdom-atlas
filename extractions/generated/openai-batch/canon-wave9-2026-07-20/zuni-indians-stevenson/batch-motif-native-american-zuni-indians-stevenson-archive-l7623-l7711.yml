  text: The purpose of the offerings is stated as the increase and perpetuation of
    vegetable and animal life, especially that of the Zuñis.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: Pau'tiwa deposits plumes with prayers and sprinkles them with meal carried
    in his belt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The depositing ceremony is repeated at houses on the north, west, and south
    sides, and at two houses in the inner streets for zenith and nadir.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: At the He'iwa ki'wi'sine, Pau'tiwa is received at the outer ladder by Shits'ukia,
    Kwe'lele, and the pe'kwin, and the ladder is sprinkled with meal as he ascends.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: Upon reaching the roof, Pau'tiwa throws the symbol of the Navaho scalp into
    the ki'wi'sine, which indicates that the song must cease.
  category: action
  evidence_refs:
  - ev:13
- id: obs:13
  text: Pau'tiwa separates two plume wands for men connected with a future Sha'lako
