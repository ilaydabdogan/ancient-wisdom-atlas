canonical_text:
  quote: ''
  summary: A ritual appearance of Pau'tiwa is described. Men of the Sun clan and Pau'tiwa
    approach the village from the south; Pau'tiwa carries plume wands, te'likinawe,
    a small game implement, and a twig associated in the text with a Navaho scalp.
    He circles the village four times, deposits te'likinawe offerings to the sun and
    moon in wall recesses at houses corresponding to directions, and later ascends
    the He'iwa ki'wi'sine ladder, throwing the scalp symbol inside and placing plume
    wands with prayer and meal marks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five men of the Sun clan are seen coming over the plain south of the village,
    and Pau'tiwa is later seen coming from the south alone and east of the group.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pau'tiwa carries plume wands strung with yucca thread, te'likinawe in each
    hand, a small blue-hooped game implement in the right hand, and a twig with crow
    feather and owl plume in the left hand.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Pau'tiwa proceeds slowly and circles the village four times in a coil-like
    pattern, with the final circuit through the streets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: At a house on the east side, a matron removes a stone slab concealing a wall
    recess before Pau'tiwa arrives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: A Sun clan man and two Dogwood clan men stand by the house, described as personating
    Pau'tiwa's father and his elder and younger brothers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: The younger brother helps Pau'tiwa detach te'likinawe for deposit in the wall
