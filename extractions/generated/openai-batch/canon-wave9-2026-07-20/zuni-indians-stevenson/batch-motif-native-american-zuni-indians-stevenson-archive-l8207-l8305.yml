canonical_text:
  quote: ''
  summary: 'The passage describes Zuñi observations and ceremonies around the summer
    solstice: a five-day sunset alignment on a mesa, notification among ritual officers,
    repeated preparation and deposition of te''likinawe offerings to the Sun Father,
    Moon Mother, deceased sun priests, rain-makers, and other beings, public announcement
    by the pe''kwin, fraternity preparations, altars, medicine water, cloud-symbolic
    suds, prayer songs, pottery making and firing, offerings sunk in a spring, gathering
    of spring water, retreat, and a final cloud symbol on the night pilgrims return
    from Ko''thluwalawa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At sunset for five consecutive days the sun strikes a particular point on
    a mesa, and the Zuñis say the Sun Father rests there during his daily journey.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first observation of the sun at this point, the pe'kwin informs
    the elder brother Bow priest, who notifies the first body of A'shiwanni; they
    gather that evening in the Kia'kwemosi's ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pe'kwin makes four te'likinawe tied in pairs for the Sun Father and Moon
    Mother; sticks for the sun are blue and those for the moon are yellow, and the
    offerings are planted at a shrine on Yiil'lan 'hlan'na.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In repeated four-day intervals the pe'kwin plants offerings to deceased a'pekwin
    in his field and offerings to the sun and moon on Yiil'lan 'hlan'na, while observing
    the same fast associated with plume deposition before the winter solstice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At early dawn on the last day of plume deposition, the pe'kwin announces from
    the roof that the summer solstice will occur eight days later; while facing the
    rising sun, he is believed to repeat words given by the Sun Father.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pe'kwin asks the people to make te'likinawe to the Sun Father, Moon Mother,
    and rain-makers, and asks the Bow priesthood to make te'likinawe to Ku'pishtaya
    and the rain-makers of the Bow priesthood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two days before the solstice, the first body of A'shiwanni assemble in the
    Kia'kwemosi's ceremonial chamber and prepare te'likinawe, while the Ko'mosona
    and Ko'pekwin prepare offerings in their own houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the day before the solstice, most fraternities remain in session day and
    night; altars are erected with mi'wachi and other fetishes, medicine water is
    consecrated, and root suds are made as symbols of clouds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Prayer songs are offered to the Beast Gods to influence the rain-makers; the
    Bow priesthood offers special prayers to Ku'pishtaya and rain-makers, and prayers
    are also offered to Pa'yatamu, with songs accompanied by rattle and a closing
    flute song to the rising sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: For three days after the solstice pottery is made and decorated; on the fourth
    day it is fired, and a bit of wafer bread is placed in each piece so that its
    spiritual essence may feed the pottery's spirit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the fifth day after the solstice, the first body of A'shiwanni prepare
    offerings for the Shi'wano'kia; each shi'wanni makes offerings to the sun, moon,
    rain-makers of the six regions, and deceased predecessors, forming a kia'etchine
    that is carried to a spring and sunk in its waters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Kia'kwemosi carries a gourd water jug covered with cotton network and
    white fluffy eagle plumes, fills it from the spring while his associate whirls
    a rhombus, and then returns to an eight-night retreat with his et'tone, associates,
    and the Shi'wano'kia.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: On the last night of the Kia'kwemosi's retreat, which coincides with the return
    of pilgrims from Ko'thluwalawa, he makes a cloud symbol of meal.
  category: action
  evidence_refs:
  - ev:10
