  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:2
  type: summary
  locator: 8216-8234
  quote_or_summary: The pe'kwin makes paired te'likinawe for the Sun Father and Moon
    Mother, with blue sticks for the sun and yellow for the moon; he repeatedly plants
    offerings to the sun, moon, and deceased a'pekwin in four-day intervals and observes
    the same fast as before the winter solstice.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:3
  type: summary
  locator: 8235-8247
  quote_or_summary: At dawn the pe'kwin announces the summer solstice from the roof
    while facing the rising sun; he is believed to repeat words from the Sun Father
    and asks the people and Bow priesthood to prepare te'likinawe for the Sun Father,
    Moon Mother, rain-makers, Ku'pishtaya, and related rain-makers.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:4
  type: summary
  locator: 8248-8264
  quote_or_summary: Two days before the solstice the first body of A'shiwanni assemble
    and prepare offerings; Ko'mosona and Ko'pekwin prepare offerings in their houses;
    most fraternities convene, erect altars with mi'wachi and fetishes, consecrate
    medicine water, make cloud-symbolic suds, and prepare offerings to Kok'ko A'wan.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:5
  type: summary
  locator: 8264-8274
  quote_or_summary: At night prayer songs are offered to the Beast Gods to influence
    the rain-makers; the Bow priesthood prays to Ku'pishtaya and rain-makers; prayers
    are also offered to Pa'yatamu, with rattle accompaniment and a closing flute song
    to the rising sun; offerings are deposited on the solstice.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
