  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:7
  type: summary
  locator: 8275-8284
  quote_or_summary: Pottery is made and decorated for three days after the solstice,
    fired on the fourth day, and each piece receives wafer bread whose spiritual essence
