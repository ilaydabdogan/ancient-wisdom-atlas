  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:8
  type: summary
  locator: 8285-8295
  quote_or_summary: On the fifth day after the solstice the first body of A'shiwanni
    prepare offerings for the Shi'wano'kia; each shi'wanni makes offerings to the
    sun, moon, rain-makers of the six regions, and deceased predecessors; the combined
    offering is carried by the Kia'kwemosi and associate to 'Kia'nanaknana spring
    and sunk in its waters.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Public domain source; summary generated from supplied passage.
