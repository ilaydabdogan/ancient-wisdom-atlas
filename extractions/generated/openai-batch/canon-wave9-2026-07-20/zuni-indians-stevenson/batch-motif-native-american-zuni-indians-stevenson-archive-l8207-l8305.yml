candidate_motifs:
- id: motif:1
  label: Solstice calendar marked by solar station and ritual sequence
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage links a repeated sunset alignment, announcement of the summer
    solstice, pre-solstice rites, and post-solstice activities into a calendrical
    ritual sequence.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic description of one annual cycle and does
    not provide a myth narrative for the solstice itself.
- id: motif:2
  label: Ordered sacred offerings to celestial, rain-making, divine, and ancestral
    recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe are repeatedly prepared and deposited for the Sun Father, Moon
    Mother, deceased a'pekwin, rain-makers, Ku'pishtaya, the Council of the Gods,
    the Shi'wano'kia, and deceased predecessors.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage describes ritual offerings but does not state a transactional
    outcome beyond prayer and invocation.
- id: motif:3
  label: Priest as mediator of celestial speech
  taxonomy_refs: []
  basis: The pe'kwin announces the solstice while facing the rising sun and is believed
    to repeat words given by the Sun Father; the passage also states that he is supposed
    to have direct communication with the Sun Father at this season.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The content of the Sun Father's words is not independently given beyond
    the pe'kwin's announcement and request.
- id: motif:4
  label: Rain-making and cloud-formation ritual complex
  taxonomy_refs: []
  basis: The rite includes offerings to rain-makers, prayers to beings that influence
    rain-makers, root suds symbolic of clouds, a spring offering, water collection,
    and a meal cloud symbol.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  - ev:9
