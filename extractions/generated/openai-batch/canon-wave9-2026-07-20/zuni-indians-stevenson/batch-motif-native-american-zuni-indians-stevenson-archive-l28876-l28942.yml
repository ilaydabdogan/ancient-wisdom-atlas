canonical_text:
  quote: CEREMONIAL OF INITIATION INTO THE SHU'MAAKWE
  summary: 'The passage describes preparations and a sequence of ritual actions for
    initiating four male novices into the Shu''maakwe: altar preparation, placement
    of fetishes and prayer plumes, medicine consecration, prayers over meal held by
    novices, drawing sacred breath, distribution of meal to members, and departure
    to Ku''shiloa to plant prayer plumes and sprinkle meal.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The early part of the day is spent repainting and erecting a tablet altar,
    working on masks, and preparing prayer plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The a'kwamosi draws a cloud symbol with meal at the base of the altar, and
    members gather in the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members who possess a mi'li of the fraternity hand them to an officer, who
    places them temporarily in a basket tray; the fetishes have zigzag sticks symbolic
    of lightning standing in the plumes and are later placed before the altar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother Bow priest, described as a warrior to the fraternity,
    leaves after the meal painting and returns with a formal exchange of greetings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: An aged woman of the fraternity places two boxes and two home-manufactured
    stools in a north-south line before the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The warrior sits south of the altar facing east and is joined by three other
    officers; after he is seated, those present remove their moccasins except for
    one injured woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The a'kwamosi consecrates the medicine with concretion fetishes sacred to
    the field and sprinkles the altar while a choir sings with rattle and pottery
    drum accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The director sits near the altar on the north ledge; a female member beside
    him deposits a basket of prayer plumes in the northwest corner and remains seated
    there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four male novices sit near the director; men, women, boys, girls, and elder
    women of the fraternity are present, including the A'wan 'si'ta, or Great Mother,
    who is too aged to participate.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The novices sit on the boxes and stools; four officers sit before them, place
    corn-husk packages of meal in their right hands, clasp the hands, pray, and hold
    the hands to the novices' mouths so they may draw breath from the meal while praying.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The a'kwamosi repeats a litany to which all respond; sacred breath is drawn,
    the novices give each person a pinch of meal, and the meal is wrapped in corn
    husk and tied.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each member goes to Ku'shiloa, identified as red earth east of the village,
    to plant prayer plumes and sprinkle meal.
  category: action
  evidence_refs:
  - ev:7
