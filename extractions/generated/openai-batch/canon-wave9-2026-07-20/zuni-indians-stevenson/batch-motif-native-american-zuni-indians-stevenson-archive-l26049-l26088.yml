canonical_text:
  quote: ''
  summary: A quoted ritual account instructs prospective members of the 'Hle'weke
    fraternity to prepare corn meal and choose a father, then recounts dark and unclean
    lower worlds, emergence to the Sun Father, the earlier aquatic forms of the 'Hle'wekwe,
    staged travel through named places, the decision of Illem'mosona to remain at
    Black rocks, the transfer of an ancient sword, and a rite for snow and cold rain
    involving te'likinawe carried to the Council of the Gods. The passage then describes
    thanks for food, an offering to the dead, a feast, closure of ceremonies, and
    the storage or concealment of ritual objects including fetishes, sword parts,
    animal skins, and a stone cougar used in severe illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prospective members of the 'Hle'weke fraternity are addressed as children
    and told to prepare corn meal and choose a father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The account says that five worlds below were dark and five worlds below were
    unclean.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'kia'et'tone, chu'et'tone, mu'et'tone, and 'hle'et'tone came up to the
    light of the Sun Father and passed to the land of the creation of the gods, where
    the children become gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before the later journey, those of the 'Hle'wekwe are described as water snakes,
    tortoises, frogs, and tadpoles.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'hle'et'tone and mu'et'tone traveled with the 'Hle'wekwe by the far north
    road to Shi'papolima and the house of Po'shaiyiinki, then west to Nutria spring
    place, and then west to Black rocks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Black rocks, Illem'mosona says he is old, will go no farther, and will
    make his home there for all time.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Illem'mosona gives his deputy the pok'et'tone, glossed in the passage as the
    ancient sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Illem'mosona tells others to make te'likinawe when they wish snows and cold
    rains, bring them to the spring, and he will carry them to the Kok'ko A'wan, the
    Council of the Gods, at Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: After thanks are given for food and an offering is made to the dead of the
    fraternity, the feast is enjoyed and the ceremonies close.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The 'Hlem'mosona returns the 'hle'et'tone with associated fetishes, including
    bows and arrows, to a chamber in a house of the 'Ko"loktakwe clan, and carries
    sword blades in a cougar-skin sack to his home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A basket with slender stick, an ancient bowl, bear's feet skins, stone fetishes,
    and sword handles are kept in a back storage room of the ceremonial house.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A large stone cougar is brought out only in cases of severe illness and is
    hidden beneath plastering in a niche in the ceremonial chamber wall.
  category: object
  evidence_refs:
  - ev:6
