canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni sun dance of the Cimex fraternity: its quadrennial
    timing, a belief that original fire came from the Sun Father, preparation of a
    coal bed over a ritual excavation, a procession of adorned dancers and novices,
    sprinkling with medicine water and meal, dancing through burning coals, and return
    to the ceremonial chamber.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonial is said to be celebrated once every four years in March by
    the Little Fire and Cimex fraternities alternately.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a belief that the original fire was a gift of the Sun
    Father, with wood stacked over an excavation by Hopi Indians and lit by the sun's
    rays.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ten men bring juniper wood from woods south of Zuni; a circular excavation
    and smaller central excavation are made, and prayer plumes and medicine are deposited
    before the wood is piled over them.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the wood burns down, two Cimex fraternity members rake, scatter, beat,
    gather, brush, and mound the coals before the plaza is swept.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dancers arrive from the ceremonial chamber in single file, led by a woman
    immediately before a male sprinkler.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:6
  text: The female leader, sprinkler, male dancers, novices, and women dancers are
    described with distinct clothing, ornaments, plumes, rattles, meal packages, blankets,
    or other carried objects.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:7
  text: The men sing and shake rattles while the dancers circle the coal bed; the
    sprinkler sprinkles the coals with medicine water using a feather wand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: After being sprinkled, each dancer leaves the line, performs animal-like antics,
    sprinkles meal over the coals, jumps into the coals, and dances there briefly
    or longer.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The two novices are described as especially ready to jump into the coals;
    women remain in the fire for less time than men; after all pass through the fire,
    the dancers retire to the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:10
