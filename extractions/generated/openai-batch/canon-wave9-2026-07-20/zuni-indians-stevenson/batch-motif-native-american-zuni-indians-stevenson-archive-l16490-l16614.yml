canonical_text:
  quote: ''
  summary: 'The passage describes Zuni pregnancy, childbirth, fertility practices,
    and related beliefs: shrines or enclosures visited by parents desiring sons or
    daughters; powdered stone bits drunk in water for a desired daughter; theurgic
    diagnoses of bewitchment involving worms or serpent pregnancy; beliefs about anthropic
    gods causing parturition with yucca switches; shells, pebbles, and other objects
    used for desired child sex or dental strength; and reported practices or beliefs
    concerning gestation, twins, triplets, abortion, and childbirth conditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred shrine for parents desiring sons is described as a stone slab on
    a low mound, with three stones placed on it, two round and one long, the long
    one pointing east.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A separate stone-walled enclosure by a trail is visited when a daughter is
    desired; the woman breaks bits from two projecting rocks, powders them, mixes
    them with water, and drinks the mixture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The success of the daughter-seeking practice is said to depend on whether
    the heart is good.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A doctor called Nai'uchi was summoned for a pregnant woman believed by her
    family to have been bewitched, and he claimed to draw out two objects identified
    as mother and child worms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The worms were said to have been cast into the pregnant woman after a witch's
    sister touched her abdomen while grinding.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A pregnant woman who had drunk from the sacred spring of the Ko'loowisi was
    told by Nai'uchi that she carried a serpent rather than a child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After another examination and reassurance, the woman recovered, and a healthy
    boy was born less than six weeks later; the child received the nickname Little
    Ko'loowisi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: It is believed that if Sa'ya'hlia or Sal'imobiya strike a pregnant woman with
    yucca switches, parturition will immediately result.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pregnant women avoid the reach of the yucca switches when those gods appear
    in the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A spiral shell is worn in a woman's belt when a boy is desired, and another
    variety of shell is worn when a girl is desired.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: After childbirth, a white pebble is placed in the mother's mouth and pressed
    with the teeth so that the child's teeth may be white and strong.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Zuni theurgists are reported as saying that gestation takes ten months for
    a male child and nine months for a female child.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Triplets are said to be very rare and attributed to embraces in immediate
    succession.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: A theurgist told a pregnant woman that she carried three children and would
    die if they reached full development, and he produced premature birth.
  category: sequence
  evidence_refs:
  - ev:10
