canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Zuñi Shu''maakwe initiation ceremony:
    dancing, choir performance, sharing a lighted cigarette, animal-like cries by
    beast-god representatives, sprinkling the altar with medicine water, night chanting
    and dancing, third-day preparation and grinding of directional animal medicines,
    handling of plumes, stone knives, adornments, and a final dance in which the elder
    brother Bow priest makes bear-like gestures.'
  language: English
  quote_policy: summarized
