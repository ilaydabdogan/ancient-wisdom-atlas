canonical_text:
  quote: ''
  summary: The passage lists successive places reached on a ritual/mythic road, repeatedly
    saying to get up and move on. The route includes springs, mountains, salt place,
    sulfur-smelling place, ant place, and the Middle place. At the Middle place, 'Klal'lo
    addresses the A'shiwi and says his fathers will meet them on the road and give
    their children more of the great breath, identified with A'wonawil'ona and the
    light of day. Notes explain that the Middle place is a shrine symbolizing the
    middle of the world, that masked impersonation makes the wearer’s body the abode
    of the god impersonated, and that sacred breath is blown onto plumes or the hand
    and inhaled. The passage also describes the masked narrator’s recitation and movements
    among six ki'wi'sine before departing westward to Ko'thluwala'wa.
  language: English with Zuni terms and interlinear glosses
  quote_policy: summarized
