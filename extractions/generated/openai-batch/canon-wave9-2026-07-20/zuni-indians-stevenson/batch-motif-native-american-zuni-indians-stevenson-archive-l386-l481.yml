canonical_text:
  quote: ''
  summary: The passage first gives acknowledgments, then introduces Zuni general conceptions
    of the universe. It describes natural objects as spiritually alive in the ethnographer's
    account, explains Earth Mother as a symbol of sustenance, and summarizes beliefs
    about the dead, Ko'thluwala'wa, the Council of the Gods, rain-makers, breath plumes,
    cloud masks, smoke offerings, and a summer-solstice fire practice connected with
    rain clouds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that many life-nourishing things are symbolized by the
    Zunis as mother, and that the earth is spoken of as Earth Mother.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth Mother is described as the source of vegetal matter and game, and as
    the being or entity to whom all are indebted for sustenance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Zunis are said to believe that the earth is supplied with water by their
    dead of both sexes and all ages above infancy, while infants mature after going
    to the undermost world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased go first to Ko'thluwala'wa, Dance village, the abiding place
    of the Council of the Gods; they may return there to dance in the great dance
    house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Deceased members of the A'pi''lashiwanni, the Bow priesthood, are described
    as an exception because they join the Ku'pishtaya and become lightning-makers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The u'wannami, or rain-makers, are controlled and directed by the Council
    of the Gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rain-makers collect water in vases and gourd jugs from the six great waters
    of the world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The rain-makers are carried by steam from springs to the upper plane if they
    have breath plumes, and each rain-maker holds a group of these plumes in order
    to ascend.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Every individual in Zuni is said to make breath-plume offerings each month
    at the full moon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rain-makers pass over the upper plane hidden from people below by cloud
    masks, and rain occurs when they pour water through those cloud masks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Clouds are described as produced by the breath of the gods and by smoke; greater
    smoke offerings are said to induce more work by the rain-makers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the summer solstice, a torchbearer is said to set fire to everything in
    his way from Ko'thluwala'wa to Zuni, with greater smoke offerings associated with
    heavier cloud masks.
  category: sequence
  evidence_refs:
  - ev:6
