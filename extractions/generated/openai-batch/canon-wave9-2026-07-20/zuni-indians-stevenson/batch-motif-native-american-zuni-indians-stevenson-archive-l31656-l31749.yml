candidate_motifs:
- id: motif:1
  label: ritual initiation through passage, embrace, and public incorporation
  taxonomy_refs:
  - initiation
  basis: The passage describes structured passage under clasped hands, prayer and
    embrace by ritual authorities, public procession, and plaza actions within a section
    identified as an initiation into the Bow priesthood.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is an ethnographic description of ceremony rather than a mythic
    narrative; the extraction treats the ritual sequence as a motif candidate.
- id: motif:2
  label: sacred exchange through offerings to named nonhuman recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer plumes, prayer meal, black and red sticks, and wafer bread are offered
    to rain-makers, Gods of War, and ants.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives ritual recipients and offerings but does not explain
    the full theology behind them.
- id: motif:3
  label: ritual purification through cedar bark, expectoration, and directional arrow
    movement
  taxonomy_refs: []
  basis: The arrow with a bit of scalp is moved around the circle at four body levels
    for pure hearts and fearlessness, while participants spit on cedar bark and move
    it around the head for physical purification.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family directly matches purification, so no taxonomy
