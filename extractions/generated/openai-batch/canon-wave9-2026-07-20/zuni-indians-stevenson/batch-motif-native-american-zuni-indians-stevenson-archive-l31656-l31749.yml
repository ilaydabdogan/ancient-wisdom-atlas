canonical_text:
  quote: '"They step over the sacred road of meal to the home of the ants..."'
  summary: A Zuñi Bow priesthood ceremony is described in which the victor, elder
    brother, officiants, women, warriors, and populace pass along a meal line and
    under clasped hands, make offerings at ant-hills, process to the village, encircle
    it four times, form concentric circles in the plaza, and perform purification
    actions with cedar bark, an arrow, and a bit of scalp.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The elder brother Bow priest directs two youths to stand north and south of
    the mounds and clasp each other's left hand over the excavation; one youth is
    of the Deer clan and the other of the Bear clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victor and the elder brother step on crossed yucca, pass up the line of
    meal and under the clasped hands, and each carries a cedar twig with pieces of
    scalp and a fluffy eagle plume attached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the passage under the hands, the twigs are received by the pa'mosona
    and the aid and later laid on the ground southwest of the mounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The priest of the pa'ettowe clasps the victor, the Kia'kwemosi embraces the
    elder brother, the pairs reverse places, and long prayers and further embraces
    by the remaining A'shiwanni follow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two i'tatononakwe place their left arms through the right arms of the
    victor and the elder brother; the two pairs go to nearby ant-hills and plant prayer
    plumes at the apexes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Black sticks carried by women are offered to the rain-makers, while red sticks
    carried by men are offered to the Gods of War for the destruction of the enemy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each woman divides prayer meal with her companion and sprinkles it over the
    plumes and ant-hills; the women do not speak, while the men pray aloud and deposit
    prayer plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Warriors and then the populace pass over the meal line and under the hands;
    the stated purpose is to preserve their lives during travel or conflict with the
    enemy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pa'mosona deposits wafer bread as a food offering to the ants in the excavation
    and destroys the mounds by running his left foot over them and drawing earth into
    the opening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the return to the village, the i'tatononakwe keep the scalps before them
    using the left foot only and must not look right or left.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In procession, the victor and elder brother follow the i'tatononakwe; the
    elder brother Bow priest precedes the Ant fraternity and the A'pr'lashiwanni;
    the scalp custodian, aid, vice pa'mosono'kia, and populace follow, with shots
    and war whoops.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each person except the scalp-kickers carries a bit of cedar bark in the left
    hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The village is encircled four times from right to left in coil fashion, and
    in the large plaza the participants are joined by women and children and form
    four concentric circles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the plaza, a bit of scalp is attached to the elder brother Bow priest's
    arrow; he passes around the inner circle four times and draws the arrow at the
    ankles, knees, waist, and over the head of those present.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The stated effect of the four arrow movements is that the hearts of those
    present may be pure and know no fear.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: At each return to the starting point, those present expectorate on cedar bark
    and carry it around the head four times from left to right for physical purification.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the fourth movement, males give the war whoop and the elder brother
    Bow priest shoots the arrow containing the bit of scalp to the north, identified
    as the home of the Navaho.
  category: action
  evidence_refs:
  - ev:7
