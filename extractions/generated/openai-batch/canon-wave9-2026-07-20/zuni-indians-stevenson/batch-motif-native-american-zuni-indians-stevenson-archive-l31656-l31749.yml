  label: 'ORDER OK PA''YATAMU OF THE LITTLE FIRE FRATERNITY / INSTALLATION OK TIIK
    KI.DKK BKOTIIKI: HOW I''KIKST / CEREMONIAL OF INITIATION INTO THE BOW PRIESTHOOD
