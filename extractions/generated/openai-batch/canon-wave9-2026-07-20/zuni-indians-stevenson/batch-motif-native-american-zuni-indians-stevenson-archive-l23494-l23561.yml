canonical_text:
  quote: ''
  summary: The passage describes the Ne'wekwe fraternity, its patron Kok'ko 'hlan'na,
    its early association with Hik"si'si, and a visit to Ashes Spring where Kok'ko
    'hlan'na gives instructions about medicine. It also describes initiatory administration
    of excrement, Hik"si'si's disappearance into the spring waters and later name
    Pa'yatamu, the spring setting, and public plaza fooling by Ne'wekwe members with
    the Ko'\'emshi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ne'wekwe fraternity is said to embrace the orders O'naya'nakia and It'sSpcho
    and to have Kok'ko 'hlan'na as patron god; two other gods are said to appear at
    times, with their relation uncertain to the writer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Ne'wekwe was reported to be one of four original
    fraternities organized soon after the A'shiwi came to this world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hik"si'si is said to have had special qualifications and to have been appointed
    musician and jester to the fraternity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hik"si'si is described as remaining with the Ne'wekwe during the migrations
    of the A'shiwi until they reached Kiap'kwena, where the Ne'wekwe visited Ashes
    Spring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Ashes Spring, Kok'ko 'hlan'na appeared to the Ne'wekwe and asked the mo'sona
    what medicine they had.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kok'ko 'hlan'na said the fraternity's medicine was good but too hot by itself
    and would harm the intestines if given alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kok'ko 'hlan'na said he would give medicine to allay the burning qualities
    of the other medicine and instructed the Ne'wekwe to use human excrement in conjunction
    with their medicine.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: Since that time, Kok'ko 'hlan'na is said to be personated at initiatory ceremonials
    of the Ne'wekwe and to administer excrement to initiates and others of the fraternity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the excrement is not given to invalids, but is administered
    at initiation when every member of the fraternity must receive it so their bodies
    are kept in condition for the other medicine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kok'ko 'hlan'na invited Hik"si'si to live with him and become musician and
    jester to the Sun Father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before disappearing in the waters of the spring, Hik"si'si told his fraternity
    to notify him with te'likinawe whenever they needed him, and the passage says
    he has since borne the name Pa'yatamu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The spring is described as marshy, with little dark water, low walls on three
    sides, a roof of poles, brush, and soil, and soil used by the Ne'wekwe to decorate
    their persons and skull caps.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The writer reports that members of the Ne'wekwe often appear in the plaza
    with the Ko'\'emshi between dances of the gods and play the fool.
  category: action
  evidence_refs:
  - ev:8
