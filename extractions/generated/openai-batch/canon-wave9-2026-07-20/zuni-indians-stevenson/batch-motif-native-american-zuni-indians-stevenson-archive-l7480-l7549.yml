canonical_text:
  quote: ''
  summary: The passage recounts Shits'ukla leaving hungry gods to seek deer in the
    west, meeting two Kwal'ashi sisters, marrying the elder daughter, gaining access
    to responsive game animals, taking meat to Ko'thluwala'wa, planning to steal all
    the game for hungry people, and tending rapidly growing corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods of Chi'pia lack meat and are hungry; there has been no rain for a
    long time, though there has been a little lightning.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shits'ukla tells Kwe'lele he will look for deer, travels west toward the lightning,
    and carries only a little sweet-corn meal and a few seeds after eating his moccasins
    and deer-tail earrings from hunger.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the afternoon of the fourth day, Shits'ukla reaches tall green grass and
    sees two sisters washing a buckskin, which they cover with a large pottery bowl
    when they notice him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sisters are identified as Kwal'ashi kwin'na, or Black raven people, whose
    people live in a high mountain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kwal'ashi father invites Shits'ukla to eat meat, takes him as a son, offers
    him one daughter as wife, and Shits'ukla chooses the elder daughter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shits'ukla sleeps with his wife in an upper room on a bed made of deerskins.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning the father shows Shits'ukla game animals; the animals answer
    the father's greeting, and an elk tells Shits'ukla to kill it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shits'ukla kills and flays the elk, then kills deer and dries meat for four
    days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Shits'ukla asks where to plant his corn, plants it, wraps meat in a skin at
    night, and takes it to Ko'thluwala'wa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Ko'thluwala'wa, Shits'ukla tells Tau'tiwa how he found the deer and says
    that he will steal all the game.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pau'tiwa says Shits'ukla's corn will be ripe in four days, approves his stealing
    the game because the people are hungry for meat, and promises him a beautiful
    girl as wife when he brings the deer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pau'tiwa says he had sent the eagle and the hawk for game, but both returned
    without seeing any.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: When Shits'ukla returns to the cornfield, the corn is already over a foot
    high; he hoes and sings, continues visiting the field, kills more deer, and later
    says the corn is ripe and he will roast some.
  category: sequence
  evidence_refs:
  - ev:7
