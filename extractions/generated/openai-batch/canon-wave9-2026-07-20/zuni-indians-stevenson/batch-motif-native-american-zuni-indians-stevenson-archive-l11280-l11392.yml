canonical_text:
  quote: ''
  summary: A sequence in the 'Hla'hewe rain ceremonial describes the handling of corn,
    te'likinawe, crooks, mi'wachi fetishes, water vessels, reeds, tobacco, rhombi,
    and the procession to He'patina, a shrine identified as symbolic of the Middle
    of the world. Participants sprinkle corn and dancers, pass fetishes before mouths
    for breath and life from A'wonawil'ona, whirl rhombi so rain-makers may water
    the earth, circle the shrine four times, deposit water-filled vessels in the lower
    chamber, and leave ears of corn with emptied vessels in the upper chamber as an
    explicit sign of rain impregnating the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ear of corn is placed in stacked corn in a house, two te'likinawe are deposited
    south of the village on the road to the Snake fraternity shrine, and a crook is
    returned to the elder brother Bow priest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of the Frog clan lacks a crook, must borrow one, and is called by the
    pe'kwin to participate because he has valuable rain songs that command mi'wachi
    and te'likinawe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mi'wachi bearers pass mi'wachi before the lips or mouths of dancers so the
    dancers may inhale the breath of life, identified as the breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The 'kia'punakwe, led by the pe'kwin, sprinkle baskets of corn with reeds
    dipped in water and with ears of corn dipped into cloud vessels, then form a line
    facing east behind the 'kia'potiikwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder brother Bow priest passes a lighted reed filled with native tobacco
    to the flutists, who stop playing one after another to smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ten mi'wachi bearers pass their mi'wachi before the mouths of dancers, flutists,
    the Sho'ko'we choir, and each person in the ham'pone, with prayers for a pure
    heart, health, and long life from A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the flutists smoke the reed, the elder and younger brother Bow priests
    whirl rhombi so that rain-makers may gather together and water the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The 'kia'punakwe sprinkle the dancers again and then, preceded by the pe'kwin
    and elder brother Bow priest and followed by the younger brother Bow priest, leave
    the plaza by the eastern covered way to visit He'patina.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: He'patina is described as a shrine symbolic of the Middle of the world, with
    a lower stone chamber, roof hatchway, upper chamber, slabs, shaped stones, and
    a north enclosure where the A'shiwanni deposit te'likinawe.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: At He'patina the party circles the shrine four times toward the left while
    the Bow priests whirl rhombi, then stops before it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The 'kia'punakwe empty water from their vessels into cloud vases in the shrine;
    after prayers, the pe'kwin deposits the water-containing vases in the lower chamber.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The ears of corn carried by maidens are left with emptied vessels in the upper
    chamber; the passage states that this symbolizes the rains impregnating the earth
    so that she sends forth fruits.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ancient jugs belonging to the Kia'kwemosi are carried away, while two cloud
    vessels made for the occasion are attributed to women of the Dogwood and Corn
    clans.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: On returning to the plaza, the 'kia'punakwe take places in the dancers' line,
    alternating with the 'kia'potiikwe; mi'wachi bearers again pass fetishes before
    dancers and persons in the ham'pone, and the Bow priests leave by the eastern
    covered way.
  category: sequence
  evidence_refs:
  - ev:10
