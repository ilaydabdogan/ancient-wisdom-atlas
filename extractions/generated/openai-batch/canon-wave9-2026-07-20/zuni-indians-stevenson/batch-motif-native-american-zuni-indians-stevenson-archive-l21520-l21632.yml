  summary: 'The passage describes beliefs and practices concerning witchcraft: fear
    of being conjured, special concern for infants, social vulnerability to accusation,
    witches associated with night and animal forms, accusation procedures during illness
    or death, an anecdote of a woman killed as an alleged witch, and the theurgist’s
    role in healing or assigning blame.'
