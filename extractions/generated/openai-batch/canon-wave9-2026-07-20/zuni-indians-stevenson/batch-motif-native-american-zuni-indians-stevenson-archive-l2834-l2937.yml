canonical_text:
  quote: ''
  summary: The passage describes rules for Zuñi Kor'kokshi seasonal dances, assemblies
    of ritual personators and fraternities, rain and harvest dances, initiation into
    the Ko'tikili, rare female initiation, birth-linked affiliation to a ki'wi'sine,
    and a mythic authorization in which Pau'tiwa sends Kiaklo to announce that the
    gods will give children the sacred breath of life so they may enter the dance
    house at Ko'thluwala'wa after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kor'kokshi dances are connected with the return of the Ko'mosona party from
    Ko'thluwala'wa or Kiap'kwena at the summer solstice and with winter dance observances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kor'kokshi dances are limited to no more than four days in winter and to one
    night and day in summer, because the gods are said to have commanded this.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Personators of the Council of the Gods, Ko'yemshi, and Sha'liiko assemble
    in specified houses or ki'wi'siwe during the summer solstice ceremonies.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Great Fire fraternity assembles in the Ko'pekwin's house for the summer
    solstice ceremonies, and no other dances are allowed during the summer dances
    of the Kor'kokshi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kor'kokshi remove masks in summer while in the ki'wi'sine; in winter they
    go over the western road to remove masks and disrobe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rain dances may occur at farming districts, and each ki'wi'sine has a dance
    of thanksgiving and for rain at the gathering of crops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: All male children must be received into the Ko'tikili in order to enter the
    sacred dance house of Ko'thluwala'wa after death, and initiation allies the child
    to one of the ki'wi'siwe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A girl may be initiated when illness is attributed to fright caused by a personator
    of the gods; that personator appears in divine regalia, instructs her, and becomes
    her ceremonial father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Female Ko'tikili members described in 1902 take part in masked dances by personating
    goddesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A child's ki'wi'sine affiliation is decided at birth by the doctoress who
    receives him; her husband, son, or brother may serve as godfather.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The initiatory ceremonies are said to be performed by command of Pau'tiwa,
    who sends Kiaklo to notify the A'shiwi that the gods will come in eight days to
    give the sacred breath of life.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sacred breath of life is given so that after death the children may enter
    the dance house at Ko'thluwala'wa before proceeding to the undermost world whence
    they came.
  category: sequence
  evidence_refs:
  - ev:9
