canonical_text:
  quote: ''
  summary: 'A chronological historical synopsis of events connected with Zuni from
    Spanish contact through missionary activity: visits to Cibola and Hawikuh, conflict
    and capture, Zuni retreat to Toaiyalone, discovery of crosses and Christian Mexican
    Indians, establishment of a mission at Hawikuh, and later killings of missionaries
    followed by flight to Toaiyalone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a chronological synopsis of historical events connected
    with Zuni, using Spanish and other records as its frame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the 1539 entry, Fray Marcos of Niza is said to have visited Cibola, viewed
    Hawikuh from a neighboring height, and taken possession of the province in the
    name of the king of Spain; his companion Estevan is said to have been killed by
    Zunis.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the 1540 July 7 entry, Coronado captured Hawikuh after a conflict and named
    it Granada; the Indians then retired to Toaiyalone, identified as a mesa used
    as a place of refuge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The 1540 entries describe Spanish expeditions sent from Cibola and the arrival
    of Coronado's army with sheep and cattle, which the passage connects with the
    beginning of livestock and horse use among Southwestern tribes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The 1583 entry reports a visit to six pueblos, including Aquico or Hawikuh,
    where crosses were found near the pueblos and three Christian Mexican Indians
    left by Coronado were present.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The 1598 entries describe Zuni becoming a parochial district, a visit by Juan
    de Dilate as rendered in the passage, vows of obedience and vassalage by the natives,
    named villages, and the finding of crosses and descendants of Mexican Indians
    left by Coronado.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The 1619 entry states that missionaries reached Zuni, several remained with
    soldiers, and a house was bought at Hawikuh for religious purposes, becoming the
    first mission in the Zuni country.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: In the entry rendered as 1682, the Zunis killed Fray Francisco Letrado at
    Hawikuh and fled to Toaiyalone, where they remained about three years.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: In the entry rendered as 16S3, some Zunis followed Fray Martin de Arvide and
    murdered him and his two-soldier escort on the way from the Zuni villages toward
    the west.
  category: action
  evidence_refs:
  - ev:10
