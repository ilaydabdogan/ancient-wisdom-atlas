canonical_text:
  quote: ''
  summary: 'The passage describes several Zuñi games and their implements: archery
    games using arrows and corn-husk rolls, a horn-striking game with a rabbit stick,
    an arrow-feather contact game, a corn-husk shuttlecock game, a ritual game ordered
    by the Great Father Ko''yemshi to bring rain using a lightning-marked rod, yucca
    ring, and racing stick, a wool-bag striking game played by Ko''yemshi and Ne''wekwe
    members in the sacred dance court, and a buckskin-ball game compared to shinny
    or bandy.'
  language: English
  quote_policy: summarized
