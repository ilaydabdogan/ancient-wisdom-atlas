canonical_text:
  quote: ''
  summary: The passage describes Ko'yemshi and Ne'wekwe ritual clowning during Kor'kokshi
    dances in the plaza, including costume details, attendance on dancers, rain-maker
    invocation, consumption of urine and other deliberately disgusting acts, and a
    later change in dance formation. It then describes rules and an example concerning
    voluntary initiation and transfer among Ko'tikili-related ki'wi'sine memberships.
    The closing section summarizes Zuñi calendrical divisions and solstice calculations
    using mountain horizon points.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eight Ko'yemshi remain in the plaza and are joined by members of the Ne'wekwe
    fraternity.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ne'wekwe participants are described with ash-colored body paint, black
    facial curves, ash-colored skullcaps with corn-husk rosettes, black-wool breechcloths,
    black yarn, blankets, and batons identified as harlequin baubles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: During intervals in the Kor'kokshi dancing, the Ko'yemshi and Ne'wekwe entertain
    spectators with buffoonery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women observe the ceremonials from inside houses, elevated galleries, rooftops,
    and blankets on the south side of the plaza.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the dancers return, the clowning stops, and the clowns seriously attend
    to the needs of the Kor'kokshi dancers; the Ko'yemshi warrior whirls a rhombus
    while calling on rain-makers to gather.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the fifth dance, food is brought and eaten by the Ne'wekwe; one Ne'wekwe
    drinks and gargles urine from a bowl and places it in the northwest corner of
    the plaza until later drinking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the sixth dance, Ne'wekwe participants lay aside batons, beat a drum,
    burlesque the absent dancers, bring a filled urinal to the plaza, drink from it,
    invert the emptied vessel on a head, lick drops from the ground, smash the bowl,
    and play at intoxication.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the seventh dance, the Kor'kokshi briefly form in file facing west before
    forming a line facing north; their leader stands west of them, and they leave
    by the western street after the dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A boy voluntarily initiated into the Ko'tikili joins the ki'wi'sine of his
    godfather, while an adult man may sometimes leave one ki'wi'sine for another and
    later return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A man accused of improper conduct with the wife of a fellow member may be
    expelled and seek admission to another ki'wi'sine, though attempted expulsion
    may fail.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: In the example given, a director and the Ko'mosona demanded dismissal of a
    member, were overruled, and then left with three others to join the Chu'pawa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The year is divided into two seasons of six months, and each month is divided
    into three ten-day parts.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Winter and summer solstice calculations are described through the sun's relation
    to named mountain horizon points, including Corn mountain and Great mountain.
  category: setting
  evidence_refs:
  - ev:10
