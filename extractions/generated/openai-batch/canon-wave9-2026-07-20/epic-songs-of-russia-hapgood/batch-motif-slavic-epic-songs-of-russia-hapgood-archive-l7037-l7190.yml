canonical_text:
  quote: ''
  summary: 'Ilya defeats and questions Falcon, learns he is his son by Zlatigorka,
    blesses him, and sends him away. Falcon rejects the revelation, kills or wounds
    his mother, attacks the sleeping Ilya with a burning shaft, and is killed by Ilya
    after the shaft is turned aside by Ilya''s golden cross. A new song begins: Prince
    Vladimir feasts his heroes, assigns missions to Ilya, Dobrynya, and Mikailo, and
    the three swear brotherhood at an oak. Mikailo collects tribute by force in Podolia
    and later sees a remarkable white swan with golden features on the blue sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilya says that it is written on his right hand that he will not die in battle,
    and asks Falcon to identify his land, horde, father, and mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Falcon curses Ilya as an old dog and initially refuses to answer in a respectful
    way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ilya strikes Falcon on the breast, throws him high, and sits on his breast
    after he falls back to earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Falcon says that if their positions were reversed, he would pierce Ilya's
    breast, examine his heart, and scatter his body for wolves and crows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Ilya draws his dagger, Falcon says he comes from the blue sea and gray-stone
    palaces of Zlatigorka; he says he does not know his father, and that his mother
    told him to honor Ilya if he met him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ilya recognizes Falcon as his own son by Zlatigorka, whom he had overcome
    in single combat and to whom he had given an inscribed golden ring with a jewel.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ilya takes Falcon by the hands, kisses him, calls him his son, weeps, blesses
    him, and tells him to avoid causeless bloodshed and greet his mother.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Falcon is overwhelmed by the secret of his birth and rides to his mother at
    the blue sea and gray-stone palaces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Falcon calls Zlatigorka a bold and evil warrior-maid and strikes her with
    his sharp sword so that she falls on the porch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Falcon says he will also give Ilya over to speedy death because he will not
    live dishonored.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Falcon shoots a burning shaft at Ilya while Ilya sleeps, but the shaft glances
    aside from Ilya's heavy golden cross.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ilya awakens, seizes Falcon by the curls, throws him down, cuts out his heart,
    and scatters his four quarters over the plain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage closes the Falcon episode by saying Falcon's praise is sung and
