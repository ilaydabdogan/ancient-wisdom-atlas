canonical_text:
  quote: ''
  summary: 'The passage closes the Kasyan pilgrim episode: Kasyan is absent from the
    pit where he had been slain, returns from Jerusalem with the pilgrim-heroes, forgives
    Princess Apraxia through holy breath and touch, blesses the feast, and later builds
    a cathedral and repents. A new episode begins with Ilya visiting Kief in disguise;
    after being offered a low seat at Vladimir''s feast, he insults the court, kills
    the heroes sent against him, strips golden spires and crosses from temples by
    means of an arrow, sells them at the pot-house, drinks the proceeds, and boasts
    that he will rule Kief.'
  language: English
  quote_policy: summarized
