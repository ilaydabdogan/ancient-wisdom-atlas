canonical_text:
  quote: ''
  summary: Sadko builds richly adorned ships, trades with the Golden Horde, and returns
    with treasure. His fleet halts at sea until he recognizes that tribute is owed
    to the Sea-King. Material offerings fail, and lots repeatedly identify Sadko as
    the living person demanded. He writes away his possessions, takes an icon and
    harp, descends on an oaken plank, and awakens at the bottom of the sea before
    the Sea-King, who questions him and commands him to play. Sadko plays, and the
    sea court begins to dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sadko has thirty great dark-red ships built, decorated with animal-like prows
    and dragon-like sides, and his people load them with Novgorod wares.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sadko sails by river and sea toward the Golden Horde, sells wares there, and
    receives gold, silver, and pearls before departing in the Falcon ship.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the blue sea the ships halt; waves and wind continue, but the ships cannot
    move, and sounding finds no reefs, rocks, or sand-bars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sadko says they have sailed twelve years without paying tribute to the Sea-King
    and orders a cask of red gold cast into the waves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Casks of silver and seed pearls are also cast into the sea, but the ships
    still do not move.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sadko says the Sea-King calls for a living man; lots are made, and all lots
    float except Sadko’s, which sinks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Repeated lots of different materials and weights continue to sink for Sadko
