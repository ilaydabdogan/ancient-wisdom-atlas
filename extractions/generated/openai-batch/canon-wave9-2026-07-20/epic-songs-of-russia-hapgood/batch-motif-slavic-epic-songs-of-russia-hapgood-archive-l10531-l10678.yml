  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sadko concludes that the Sea-King demands him personally, asks for writing
    materials, and writes away his possessions to churches, the poor, his wife, and
    his body-guard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sadko asks for an oaken plank and bowls of silver, gold, and pearls; he takes
    an icon of St. Mikola in his right hand and a maple-wood harp in his left, bids
    farewell, and descends onto the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Sadko is set adrift, the dark-red ships resume movement and speed away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sadko floats, falls asleep, and awakens at the bottom of the ocean-sea beside
    a white stone palace where the Sea-King sits on a throne.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sea-King welcomes Sadko as a gift, says Sadko gave no tribute to the lord
