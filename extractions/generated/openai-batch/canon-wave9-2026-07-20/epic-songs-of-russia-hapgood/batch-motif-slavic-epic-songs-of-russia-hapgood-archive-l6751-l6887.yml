canonical_text:
  quote: ''
  summary: At a feast in Kief, Prince Vladimir boasts of his swift horses and challenges
    others to match their speed to Chernigof. Ivan the Merchant's Son wagers his own
    head that his shaggy brown steed can do so. The horse speaks, prescribes special
    feeding and a public display, then terrifies and kills Vladimir's horses by roaring
    and hissing. Ivan wins the wager, yields the horse to Vladimir, but the horse
    refuses food, kills more horses, and is ordered out of the prince's court.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Vladimir holds a feast in Kief for nobles, Russian heroes, and merchants,
    where guests are making boasts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vladimir boasts of three hundred stallions and three exceptional horses, including
    a coal-black horse captured from the Dragon's Son, Tugarin, and claims one can
    travel from Kief to Chernigof between mass and matins.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ivan the Merchant's Son says he has such a horse and wagers his own head that
    it will run against Vladimir's horse; nobles and merchants stake money for the
    prince, and contracts are written.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ivan goes to a white-oak stall, falls before his shaggy brown steed's left
    hoof, weeps, asks for help, and tells the horse about the wager.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shaggy brown horse answers in human Russian speech, says it does not fear
    the iron-gray, and instructs Ivan to water it with mead and feed it Sorochinsky
    wheat for three dawns.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The horse tells Ivan not to saddle it, but to lead it by a silken bridle while
    wearing an expensive sable mantle; it says it will paw and nip the mantle, make
    the court marvel, redeem Ivan's head, and shame Vladimir and its elder brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The horse's predicted behavior takes place in the royal courtyard, where it
    plucks and tramples Ivan's sable mantle while the assembled nobles and merchants
    marvel and warn Ivan about the damage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shaggy brown horse roars like an aurochs and hisses like a dragon; the
    royal stallions are terrified, the iron-gray breaks two legs, the long-maned steed
    breaks its neck, and the captive black horse flees toward the Golden Horde over
    the Dniepr.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Stable-men report that all three hundred stallions are dead because of Ivan's
    steed's terrible cry, leaving Vladimir without a horse to ride.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ivan asks Vladimir to pay the hundred-thousand-ruble wager; Vladimir pays
    sorrowfully and asks Ivan to yield him the shaggy brown steed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ivan says his steed was bought in the Great Horde from under its mother and
    was costly, but he nevertheless yields it to Vladimir.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the horse is taken to Vladimir's stable and offered fine wheat and sweet
    mead, stable-men report that it will neither eat nor drink, hisses and shrieks
    like a dragon, and kills the horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Vladimir becomes angry and orders Ivan to lead the horse away from his court.
  category: speech
  evidence_refs:
  - ev:7
