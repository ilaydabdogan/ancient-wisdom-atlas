candidate_motifs:
- id: motif:1
  label: Incalculable heroic wealth
  taxonomy_refs: []
  basis: Diuk's goods, especially the jeweled saddle, cannot be counted or valued
    even after prolonged reckoning, and the reckoners propose using whole cities for
    paper and ink.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage presents the wealth hyperbolically; no external motif index
    is invoked.
- id: motif:2
  label: Hospitality withheld from a stranger corrected by later humiliation
  taxonomy_refs: []
  basis: Vladimir offers hospitality only after Diuk's wealth is proven; Diuk refuses
    because he was treated without courtesy and tells Vladimir not to offend unknown
    men and strangers in the future.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage frames this as social instruction, not explicitly as divine
    or supernatural judgment.
- id: motif:3
  label: Ruler humbled before another lord's marvelous palace
  taxonomy_refs: []
  basis: Vladimir and his court fear to enter Diuk's palace, Diuk leads him across
    the crystal floor, and Vladimir acknowledges himself Diuk's vassal according to
    their agreement.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The exact terms of the prior agreement lie outside the supplied excerpt.
- id: motif:4
  label: Animal witnesses report an omen to an elder interpreter
  taxonomy_refs: []
  basis: The aurochs see a wondrous weeping figure near Kief and report it to mother
    aurochs, who interprets it as the city wall's lament.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not explain why the aurochs can speak.
- id: motif:5
  label: Personified city foresees its own calamity
  taxonomy_refs: []
  basis: Mother aurochs says the apparent damsel is the city wall lamenting because
    it has foreseen ill fortune for Kief.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The city wall's appearance as a damsel is reported through animal perception
    and interpretation.
- id: motif:6
  label: Threatened city with principal champions absent
  taxonomy_refs: []
  basis: Batyg demands single combat at Kief when Ilya, Dobrynya, and Alyosha are
    away on errands.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives only the opening of the conflict and not its resolution.
- id: motif:7
  label: Disreputable hero summoned from drink in a crisis
  taxonomy_refs: []
  basis: Vasily is a hero living in the pot-house, impoverished by drinking, yet Vladimir
    summons him when Batyg threatens Kief.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: Within this excerpt Vasily has not yet confronted Batyg; he only attacks
    the noble messengers.
- id: motif:8
  label: Invader threatens sacred and civic destruction
  taxonomy_refs: []
  basis: The nobles report Batyg's boast that he will burn and raze Kief, dissolve
    God's churches in smoke, capture the prince and princess, and boil the elites.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: These threats are reported speech, not actions performed in the excerpt.
