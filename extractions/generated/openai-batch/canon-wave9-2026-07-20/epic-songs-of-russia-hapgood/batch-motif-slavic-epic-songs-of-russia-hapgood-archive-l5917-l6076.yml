canonical_text:
  quote: ''
  summary: 'The passage concludes the Diuk Stepanovich episode with Diuk''s possessions
    proving impossible to count, Vladimir being humbled before Diuk''s palace and
    wealth, and Diuk admonishing him not to offend strangers. A new episode begins:
    aurochs witness what appears to be a weeping Gospel-bearing damsel, which their
    mother interprets as the lamenting city wall of Kief foreseeing Batyg''s attack.
    Batyg demands single combat while the chief heroes are absent, and Vasily the
    Drunkard, summoned from the pot-house, violently dishonors the noble messengers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men answer that Lord Diuk sent them to take rate of his cattle and goods;
    the honorable widow says they cannot do this and first invites them to eat bread
    and salt and feast.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feast includes white swans, choice viands, green wine, sweet liquors,
    and wheaten cakes; afterward the widow shows Diuk's horses and foot-gear, which
    the visitors cannot count or reckon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitors are shown deep vaults, casks, horse trappings, and Diuk's jeweled
    saddle of state; they spend three years attempting to reckon its value without
    beginning to compute it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reckoners send word to Vladimir that Kief would need to be sold for paper
    and Chernigof for ink before a reckoning of Diuk's possessions could begin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prince Vladimir invites Diuk to be his guest, share bread and salt, carve
    the white swan, and trade in Kief without tax; Diuk refuses, saying Vladimir showed
    him no courtesy when he came.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vladimir, Churilo Fop, and the princes, nobles, and scribes go to Volhynia
    town in India the Rich to view and compute Diuk's possessions; they marvel at
    Diuk's palace and fear to enter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Diuk takes Vladimir by the hand and leads him into a palace where one half
    of the floor is crystal, with limpid water and many-colored fish beneath it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At golden tables the guests eat and drink unfamiliar viands and liquors; Vladimir
    sees the withered talesmen, judges that only the saddle-maker can compute the
    saddle's worth, and acknowledges himself Diuk's vassal.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Diuk says he does not need Vladimir's service and tells him to ensure that
    unknown men and strangers suffer no offense in his house.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two or three aurochs come forth from beneath the cross Levankidof and a white
    birch, roam past Kief, and see a weeping damsel carrying the Holy Gospel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The aurochs tell their mother what they saw; she says the figure was not a
    damsel but the city wall lamenting because it foresaw ill fortune for Kief.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Mother aurochs reports that Tzar Batyg has come with his son, son-in-law,
    learned scribe, and large hosts.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Batyg marches to Kief, pitches white pavilions, and demands from Prince Vladimir
    an adversary for single combat.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'The best heroes are absent from Kief: Ilya has been sent for heroic steeds,
    Dobrynya for saddles, and Alyosha for wheat.'
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: Vasily Ignatievich is described as a hero and good youth who lives in the
    imperial pot-house and has squandered his wife's dowry and possessions in drink.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: The nobles call Vasily naked on the oven and tell him that Batyg threatens
    to burn and raze Kief, dissolve God's churches in smoke, capture the prince and
    princess, and boil the princes and nobles in a kettle.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Vasily comes down from the oven, bars the pot-house, strips the princes and
    nobles of their apparel, tears out a door-post, and beats them to the royal court.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Vladimir asks the beaten nobles whether they have drunk or gamed; they answer
    that Vasily the Drunkard has dishonored them.
  category: speech
  evidence_refs:
  - ev:13
