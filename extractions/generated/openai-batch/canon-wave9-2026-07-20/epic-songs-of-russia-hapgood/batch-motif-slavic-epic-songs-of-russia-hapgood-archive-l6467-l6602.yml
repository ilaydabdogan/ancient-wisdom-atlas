- id: motif:6
  label: Heavenly voice gives battle instructions
  taxonomy_refs:
  - wisdom
  basis: A voice from heaven tells Dobrynya to fight longer and later instructs him
    to command the earth to absorb the Dragon's blood.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The speaker is not otherwise identified.
- id: motif:7
  label: Monster blood must be absorbed by the earth
  taxonomy_refs: []
  basis: Dobrynya cannot endure the flood of Dragon's blood until the voice tells
