canonical_text:
  quote: ''
  summary: Prince Vladimir commands the rescue of his abducted royal niece from a
    dragon in the Tugy mountains. Dobrynya, advised and equipped by his mother with
    a magic kerchief and silk whip, travels to the dragon's cavern, destroys the dragon
    brood, battles the serpent, receives heavenly instruction, and kills and dismembers
    the dragon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vladimir tells the heroes to go to the Tugy mountains to the fierce Dragon
    that carried off his royal niece, Beauty the Fair.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembled heroes do not answer Vladimir's command.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Semyon reports that he saw Dobrynya in conflict with the Dragon by the Puchai
    river and says the Dragon beguiled him by calling him her elder brother and herself
    his younger sister.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vladimir lays the command on Dobrynya, who becomes sad, stamps in the palace,
    then rides to his own dwelling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dobrynya tells his mother that Vladimir has ordered him to free the royal
    niece from the fierce Dragon of the Cave.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dobrynya's mother says his father went to the Tugy mountains and slew an accursed
    serpent, and she tells Dobrynya not to take his usual weapons.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dobrynya's mother gives him a magic kerchief and a whip of seven silks, explaining
    how the kerchief will restore his strength and how the whip will help his horse
    destroy the dragon brood and subdue the Dragon.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dobrynya rides twelve days and reaches the Dragon's cavern on the thirteenth
    day, but he does not find the Dragon or the royal niece there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The little dragons coil around the horse's fetlocks; Dobrynya uses the silk
    whip, and the horse shakes off and crushes the dragon brood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Dragon flies toward Dobrynya, drops the dead body of a hero, and asks
    why he broke his oath and crushed her little dragons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dobrynya demands that the Dragon yield Beauty Putyatichna without battle or
    bloodshed, and the Dragon refuses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dobrynya and the serpent fight over multiple days; when the serpent prevails,
    Dobrynya wipes his face and eyes with the kerchief and becomes stronger.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A voice from heaven tells Dobrynya to fight three hours longer, and later
    instructs him to strike the damp earth with his spear and command it to suck up
    the Dragon's blood.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: After following the heavenly instruction, Dobrynya overcomes the beast, uses
    the silk whip, cuts off the Dragon's twelve tails, cuts the body into pieces,
    and scatters them on the plain.
  category: action
  evidence_refs:
  - ev:10
