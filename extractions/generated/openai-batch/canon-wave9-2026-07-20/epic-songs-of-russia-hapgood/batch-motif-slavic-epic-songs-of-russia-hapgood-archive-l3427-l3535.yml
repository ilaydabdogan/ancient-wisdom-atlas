- id: obs:2
  text: Prince Vladimir dismounts, greets the pilgrims, and asks them to sing the
    spiritual song or psalm of Elena.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pilgrims thrust staves into the damp earth, hang their pouches on them,
    stand in a circle, and sing in a half voice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the psalm, the earth trembles, lake water surges, forests shake, oaks
    on mountains bow, and Vladimir cannot stand, sit, or lie until he asks them to
    stop.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vladimir says he has no bread, salt, or treasure with him and sends the pilgrims
    to Princess Apraxia in Kiev for food, drink, and lodging.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Kiev, the pilgrims seek the palace courtyard and ask alms for Christ's
    sake; their cry makes domes and tree-crowns fall, the earth quake, and liquors
    thicken in cellars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Princess Apraxia hears the shout, is terrified at the lattice window, and
    sends stewards and cupbearers to greet Kasyan Mikailovich and his companions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The pilgrims mount the porch, bend the steps, sag the ante-chamber, cross
    themselves, pray to the Saviour's picture, and make reverence to Apraxia.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Apraxia orders a feast; Kasyan Mikailovich sits in the place of honor, and
    rays stream from his face as from the red sun.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the feast, the pilgrims are led to chambers, while Apraxia herself leads
    Kasyan to a separate chamber with a rich bed and sable coverlet.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the palace is asleep and Kasyan is praying, Apraxia comes to him and
    declares her love.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kasyan tells Apraxia of his great vow and asks her not to tempt him; after
