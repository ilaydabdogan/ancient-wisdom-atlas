canonical_text:
  quote: ''
  summary: Prince Vladimir encounters wandering psalm-singers, asks for the psalm
    of Elena, and the performance shakes earth, water, forests, and mountains. He
    sends the pilgrims to Kiev to Princess Apraxia for hospitality. Their alms-cry
    at the palace causes further disturbance; Apraxia hosts them, honors young Kasyan
    Mikailovich, and lodges him apart. At night she declares love to Kasyan, who refuses
    because of his vow. After repeated approaches and his threat with a cudgel, she
    secretly opens his velvet pouch and places a silver bratina in it.
  language: English
  quote_policy: summarized
