canonical_text:
  quote: ''
  summary: Ivan Godinovich, a hero and nephew of Prince Vladimir, is unhappy because
    he is unmarried. Vladimir authorizes a wooing letter to Dmitry of Chernigov, whose
    daughter Avdotya is betrothed to Tzar Koschei. Dmitry rejects Ivan and insults
    him. Vladimir later gives Ivan armed support and tells him to take the maiden
    by force if she is not given willingly. On the road Ivan sends his men after three
    beasts and proceeds alone. At Dmitry's house he finds Koschei's attendants with
    a costly garment for Avdotya, then enters Avdotya's hall, where she is weaving
    and adorned with bird and animal imagery. She greets Ivan affectionately, and
    he leads her out while she laments that her father has not married her without
    bloodshed.
  language: English
  quote_policy: summarized
