canonical_text:
  quote: ''
  summary: On the road to Kiev, Ilya of Murom and other heroes maintain a powerful
    barrier. Falcon the Hunter crosses it without permission. Ilya sends Dobrynya
    to pursue him; Dobrynya sees Falcon's fiery horse, radiant gear, and animal companions,
    but Falcon's cry knocks him into a long swoon. Ilya then pursues Falcon, and the
    two heroes fight for three days with weapons and hand-to-hand. Falcon overcomes
    Ilya and tries to kill him, but his arm stiffens and he cannot strike.
  language: English
  quote_policy: summarized
