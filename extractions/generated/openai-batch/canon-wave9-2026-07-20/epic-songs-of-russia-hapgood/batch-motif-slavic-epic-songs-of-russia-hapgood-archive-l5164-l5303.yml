canonical_text:
  quote: There stand three great barriers on the straight road.
  summary: Diuk Stepanovich seeks his mother's leave to go to Kiev, is warned of three
    deadly road barriers, prepares his marvelous steed Shaggy, receives instruction
    and blessing, crosses the barriers safely, and encounters a speaking raven of
    omen on an oak.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: On a broad highway, Diuk meets thirty-one wandering psalm-singers, who say
    they are pilgrims traveling from Kiev to Volhynia in broad India.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The pilgrims tell Diuk that the road between India and Kiev is very long:
    a year on foot or three months riding.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On Easter Even, Diuk bows before his mother, Amalfya Timofeevna, and asks
    her leave and blessing to journey to Kiev to see Prince Vladimir and Princess
    Apraxia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Amalfya says Diuk has not been on the open plain, has not heard wild beasts
    or Tatars, and has attempted no heroic quests.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Amalfya names three barriers on the straight road: clashing mountains, pecking
    birds, and the Dragon of the Mountain with twelve tails.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Diuk disregards his mother's warning and prepares Shaggy with ornate tack,
    multiple saddle layers, twelve girths and a thirteenth, silk girths, gold buckles,
    silver tongues, and steel stirrups.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Shaggy is described with a mane that sweeps the earth and a tail that wipes
    out hoof-traces.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The horse answers Diuk with a human voice and tells him not to spur, whip,
    or tighten the bridle, but to cling to his mane and bind handfuls of damp mother
    earth under his arms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The horse says he will leap from mountain to mountain and clear lakes and
    rivers at a bound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Diuk changes into garments for a journey, takes a stout bow and a quiver of
    burning arrows, and touches the earth with his brow before his mother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Amalfya instructs Diuk not to boast of his possessions, wealth, or mother
    when Prince Vladimir makes a banquet for him; then she gives leave and blessing,
    kisses him, and he rides away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Diuk mounts, he is no longer seen riding, only a distant pillar of dust
    and a darkening of the heavens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Shaggy carries Diuk safely past the clashing rocks, the pecking birds of prey,
    and the mountain dragon before they can harm him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Diuk comes to a damp ring-barked oak where a black raven is cawing and calls
    it a bird of omen.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Diuk threatens to shoot the raven with a fiery arrow, spill its blood on the
    oak, and kill it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The raven speaks with a human tongue, asks Diuk not to shed its blood, and
    tells him to ride onward to find a fitting adversary.
  category: speech
  evidence_refs:
  - ev:8
