canonical_text:
  quote: ''
  summary: Zenira the Fair brings Ilya of Murom to a chamber with a false bed and
    urges him to lie near the wall. Ilya instead throws her onto the bed, which turns
    and casts her into deep dungeons. He forces open the dungeon doors and frees many
    captive rulers and heroes, including Dobrynya Nikitich and Alyosha Popovich. When
    Zenira emerges, Ilya has her killed by three untamed horses, distributes her estates
    and treasure among the heroes, and burns her white-stone palace. He rewrites an
    inscription, rides on to find treasure marked for him, uses it to build a monastery
    and cathedral church, then returns to Kiev and recounts the adventure to Prince
    Vladimir.
  language: English
  quote_policy: summarized
