canonical_text:
  quote: ''
  summary: Dunai Ivanovich violently compels the Lithuanian king to give Princess
    Apraxia for Prince Vladimir, escorts her away with Dobrynya, and then confronts
    a pursuing Tatar knight. After a destructive roar and duel, the opponent is revealed
    as Princess Nastasya, Apraxia's sister. Dunai recognizes her, brings her to Kiev,
    where Nastasya is baptized and two marriages are celebrated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dunai strikes the table in the Lithuanian court, upsetting liquors, dishes,
    tables, and balconies; the Tatars are frightened and the king flees to a tower.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dunai begins killing Tatars by using one Tatar as a weapon, and Dobrynya kills
    five hundred Tatars with his right hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king's servants report that a bold youth has entered the court with bridles
    for two steeds and a lead-filled elmwood club, and that Tatars fall wherever he
    waves it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King of Lithuania appeals to Dunai's memory of former hospitality and
    offers first his elder daughter and then Princess Apraxia.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dunai forces open locks and doors, enters Apraxia's chamber, and asks whether
    she will marry Prince Vladimir.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Apraxia answers that she has prayed for three years that Prince Vladimir might
    be her husband.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king gives Apraxia's dowry, loaded on thirty carts with gold, silver,
    pearls, and jewels; the party rides away over the plain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At night the youths pitch a linen pavilion, sleep with steeds at their feet
    and weapons placed around them, and do not notice the Tatar crossing the plain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the Tatar pursues, Dunai sends Dobrynya and Apraxia onward to Kiev and
    remains on the open plain to meet the adversary.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Tatar roars like a wild beast and whistles like a serpent; pebbles scatter,
    grass withers, flowers droop, and Dunai falls from his horse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Dunai and the Tatar knight fight with mace, spear, and sword until the weapons
    are broken or dulled, after which Dunai overcomes the adversary.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Dunai sits on the foe's breast to stab, he realizes the breast is a woman's
    and the adversary identifies herself as Princess Nastasya.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Nastasya says she and Dunai once shared one path, bower, and cup, and that
    men from Holy Russia stole away her sister while she was absent.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Dunai recognizes Nastasya, raises her from the ground, kisses her, and proposes
