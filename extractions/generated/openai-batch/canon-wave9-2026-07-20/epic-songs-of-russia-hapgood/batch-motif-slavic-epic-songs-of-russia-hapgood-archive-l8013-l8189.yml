canonical_text:
  quote: ''
  summary: At Prince Vladimir's feast in Kief, Putyatin advises Vladimir to take Vasilisa
    Mikulichna, the wife of Danilo the Huntsman. After first objecting that she has
    a living husband, Vladimir accepts Putyatin's scheme to send Danilo on a dangerous
    quest to Buyan and other remote places. Ilya objects and is imprisoned. Danilo
    departs, aided by Vasilisa with extra darts, kills the fierce beast, and defeats
    a Russian host sent against him. When he sees his own brother Nikita and his brother-in-arms
    Dobrynya riding against him, he kills himself with a spear. Vladimir then goes
    to Vasilisa and orders her to dress in wedding robes; she asks to see Danilo's
    body, requests that her body be laid with his, and kills herself with a knife.
  language: English
  quote_policy: summarized
