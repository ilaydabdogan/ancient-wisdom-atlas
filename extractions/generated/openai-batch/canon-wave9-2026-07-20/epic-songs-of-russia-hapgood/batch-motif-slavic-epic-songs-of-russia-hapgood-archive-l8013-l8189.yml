  text: Ilya of Murom objects in proverbial language and is placed by Vladimir in
    a deep dungeon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vladimir calls Danilo and commands him to undertake the quest; Danilo leaves
    the feast and rides home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vasilisa sees that Danilo is sorrowful; when he asks for a quiver with one
    hundred and fifty darts, she gives him a larger quiver with three hundred darts
    and says a spare dart may be useful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Danilo travels to Buyan, shoots the fierce beast with bow and arrow, and takes
    out its heart and liver.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Danilo sees a Russian host coming toward him from the direction of Kief and
    says that he is out of Prince Vladimir's favor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Danilo cuts down the Russian host, then sees Nikita, his brother, and Dobrynya,
    his brother-in-arms, riding toward him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Danilo says it is unheard of for brother to be sent against brother, plants
    the butt-end of his spear in the earth, falls on the point, and dies.
  category: action
  evidence_refs:
