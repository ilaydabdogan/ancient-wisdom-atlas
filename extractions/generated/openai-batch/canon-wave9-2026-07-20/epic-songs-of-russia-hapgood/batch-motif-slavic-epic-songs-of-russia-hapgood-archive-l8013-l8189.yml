  text: Prince Vladimir says he alone is unmarried and asks where he may find a bride
    suitable for honor in hall and bower.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Putyatin Putyatovich proposes Vasilisa Mikulichna, the wife of Danilo the
    Huntsman, praising her beauty, understanding, literacy, knowledge of saints' legends,
    and church-singing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vladimir initially says it is unheard of to take a woman from a living husband
    and orders Putyatin executed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
