candidate_motifs:
- id: motif:1
  label: Ruler seeks another man's wife and removes the husband by a dangerous errand
  taxonomy_refs:
  - stolen_beloved
  basis: Vladimir seeks a bride, Putyatin proposes Danilo's wife, and the plan is
    to send Danilo on a distant service from which there is no return; Vladimir later
    comes to Vasilisa after Danilo's death.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:10
  - ev:11
  confidence: high
  cautions: Vasilisa is targeted as a bride, but the attempted acquisition is not
    completed because she refuses and dies.
- id: motif:2
  label: No-return quest with fantastic quarry
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: Danilo is ordered to leave the feast for Buyan and other remote places to
    kill a strange beast, take its heart, capture a bird, and kill a lion.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The quest is politically motivated rather than explicitly sacred or initiatory
    in the passage.
- id: motif:3
  label: Helpful wife provides extra equipment before the hero's journey
  taxonomy_refs: []
  basis: Before Danilo leaves, Vasilisa gives him a quiver with three hundred darts
    instead of the requested one hundred and fifty, saying a spare dart may help.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not show whether the extra darts change the outcome.
- id: motif:4
  label: Slaying of a strange beast and removal of its heart
  taxonomy_refs: []
  basis: Danilo shoots the fierce beast with bow and arrow and removes its heart and
    liver, matching the commanded task.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The beast is not identified with any supplied taxonomy creature such as
    serpent.
- id: motif:5
  label: Brother sent against brother leading to self-inflicted death
  taxonomy_refs: []
  basis: After defeating the host, Danilo sees his brother Nikita and brother-in-arms
    Dobrynya riding toward him, laments that brother is sent against brother, and
    falls on his spear.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents Danilo's interpretation of the encounter; it does
    not narrate an actual fight with Nikita or Dobrynya.
- id: motif:6
  label: Wife chooses death and burial with her husband
  taxonomy_refs:
  - annihilation_union
  basis: Vasilisa asks that her body be laid with Danilo's and then kills herself
    with a knife.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage supports union in death at the burial level; it does not state
    a metaphysical reunion.
