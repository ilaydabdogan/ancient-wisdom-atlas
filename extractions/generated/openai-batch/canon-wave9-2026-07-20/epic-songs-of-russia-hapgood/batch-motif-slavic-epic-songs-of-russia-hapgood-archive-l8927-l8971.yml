canonical_text:
  quote: '"not he that sitteth beside me is my husband, but he that sitteth over against
    me, that Httle minstrel, young Dobrynya Nikitich."'
  summary: At a feast, Dobrynya's wife publicly identifies Dobrynya, not the man beside
    her, as her husband. She crosses the table and kisses him, then asks him to punish
    her. Dobrynya rebukes Prince Vladimir for arranging the remarriage of a living
    man's wife and rebukes Alyosha for taking the wife of his brother-in-arms. Dobrynya
    beats Alyosha, the guests flee, and Dobrynya leads his wife home. He remains in
    Kiev, while Alyosha leaves in shame and grief; the fame of Dobrynya and the feast
    is said to be sung forever.
  language: English
  quote_policy: quoted
