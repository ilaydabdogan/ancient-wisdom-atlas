canonical_text:
  quote: ''
  summary: Marya the Swan fails to recognize a Tatar in the dungeon as not her husband.
    Anna heals the wounded Mikailo in her tower, helps him recover exceptional heroic
    armor, sword, and steed by a ruse involving feigned illness and disguise. Marya
    and Tzar Vakramey attempt to drug Mikailo with green wine mixed with sleep herb,
    but Anna warns him from a lattice window. Mikailo rejects the cup, beheads Marya,
    spares Vakramey after an intercession, goes to Kief with Anna, marries her, and
    builds a church to Saint Mikola of Mozhaisk.
  language: English
  quote_policy: summarized
