canonical_text:
  quote: ''
  summary: Dobrynya goes to the Puchai river despite his mother's warnings, bathes
    there, encounters the Dragon of the Cavern, wounds it with an improvised sand-filled
    cap, and releases it after its promise not to harm people in Holy Russia. The
    Dragon then abducts Beauty, Prince Vladimir's niece, and carries her to a cavern;
    the passage ends with Dobrynya attending Vladimir's feast.
  language: English
  quote_policy: summarized
