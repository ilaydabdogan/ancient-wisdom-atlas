  - hero_descent
  basis: The passage places Mikailo and his richly trapped steed in a deep mound for
    three months before later emergence.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: medium
  cautions: The passage describes burial or enclosure rather than an explicitly voluntary
    descent journey.
- id: motif:2
  label: Dragon compelled to obtain waters of life and death
  taxonomy_refs:
  - serpent
  - resurrection
  - sacred_exchange
  basis: An under-world Dragon is beaten into fetching waters that can revive Mikailo's
    wife and her own crushed offspring.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The exchange is coercive and involves hostage-taking, so the sacred-exchange
    label should be reviewed.
- id: motif:3
  label: Resurrection by triple sprinkling
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The little dragon and Marya are restored by applications of the waters; the
    little dragon's revival is explicitly staged through first, second, and third
    sprinklings.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The wife's revival has three stages but the passage does not explicitly
    number three sprinklings for Marya.
