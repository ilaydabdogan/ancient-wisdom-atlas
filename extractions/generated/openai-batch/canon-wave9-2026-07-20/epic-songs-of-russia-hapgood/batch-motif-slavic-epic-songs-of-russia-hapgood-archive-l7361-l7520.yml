canonical_text:
  quote: ''
  summary: Mikailo the Rover is buried in a mound with his richly trapped steed and
    remains there for three months. An under-world Dragon with her brood opens the
    white oak coffin; Mikailo seizes and beats her until she promises to fetch the
    waters of life and death. He takes one of her young as hostage, crushes it, and
    promises to revive it when the waters arrive. The waters revive the little dragon
    and Marya the White Swan. Mikailo shouts from underground, shaking earth, water,
    and Prince Vladimir's palace; Ilya of Murom identifies the sound as the buried
    hero, and others dig Mikailo and Marya out. Marya's fame draws forty royal suitors
    who threaten Kief unless Vladimir gives her up. Mikailo refuses, disguises himself
    as Marya, lures the suitors with an arrow contest, and kills them. On his return
    he learns Tzar Vakramoy Vakrameevich has carried Marya to Volhynia. Mikailo pursues;
    Marya greets him with a drink described as forgetfulness or oblivion, says Vladimir
    gave her away against her will, and Mikailo drinks and falls unconscious.
  language: English
  quote_policy: summarized
