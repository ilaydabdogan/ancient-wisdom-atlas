canonical_text:
  quote: ''
  summary: The passage introduces young Lord Diuk Stepanovich, who rides from lands
    beyond the blue sea on his horse Shaggy with costly armor, bow, and arrows. While
    hunting beside the Ocean-sea, he shoots 303 arrows, recovers 300, and discovers
    that three priceless arrows are missing. He explains that the lost arrows were
    made from a reed tree, gilded, set with jacinths, and feathered with plumes from
    an eagle associated with the blue sea and the white Alatyr stone; sailors once
    gathered three of those feathers and brought them as gifts to rulers and to Diuk.
  language: English
  quote_policy: summarized
