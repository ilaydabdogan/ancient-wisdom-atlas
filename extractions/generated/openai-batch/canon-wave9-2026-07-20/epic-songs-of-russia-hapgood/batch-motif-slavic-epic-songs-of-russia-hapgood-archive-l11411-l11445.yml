  summary: The passage discusses Diuk's criticism of Kief's elegance, relates it to
    an account of Saint Vladimir's feast where guests complain about wooden spoons
    and receive silver ones, notes later testimony about treasures at Svyatoslav's
    court, and quotes an epistle in which Tzar Ivan the Indian boasts that the wonders
    of his realm cannot be fully recorded. It ends by saying that the direction of
    derivation between the epic poem and the epistle is impossible to determine.
