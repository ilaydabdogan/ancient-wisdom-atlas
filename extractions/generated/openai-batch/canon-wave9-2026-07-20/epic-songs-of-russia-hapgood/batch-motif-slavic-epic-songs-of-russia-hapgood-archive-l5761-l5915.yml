canonical_text:
  quote: ''
  summary: Diuk and Churilo dispute who should leap a flood first. Churilo fails,
    while Diuk crosses, returns, and drags Churilo to Prince Vladimir. After intercession
    by the women of Kiev and Vladimir, Diuk spares and humiliates Churilo. Churilo
    then demands that envoys be sent to India to verify Diuk's possessions. Diuk rejects
    Alyosha as envoy, sends an arrow-borne billet to Ilya, and accepts Dobrynya. Vladimir
    appoints Dobrynya and two others to list the possessions under a wager of vassalage.
    The envoys travel to India, see its brilliance from a mountain, inspect Diuk's
    opulent city and palace, repeatedly mistake rich female servants for Diuk's mother,
    and finally meet Amalfya Timofeevna in a ceremonial procession with celestial
    imagery.
  language: English
  quote_policy: summarized
