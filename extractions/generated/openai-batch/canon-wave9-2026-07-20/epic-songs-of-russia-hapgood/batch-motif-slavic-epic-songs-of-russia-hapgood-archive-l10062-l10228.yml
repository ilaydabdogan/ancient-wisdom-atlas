canonical_text:
  quote: ''
  summary: Vasily Buslaevich kills the Ancient Pilgrim and continues slaughtering
    men of Novgorod until his mother approaches from behind and persuades him to stop.
    Novgorod’s leaders plead with him, and he orders the slain to be buried. Later
    he sails with his troop, obtains his mother’s blessing for a journey to Jerusalem,
    and rejects warnings about dangers on the route. On Sorochinsky mountain he encounters
    a speaking skull that foretells his head will lie there, then sees a stone inscription
    warning that whoever leaps along the stone will break his head; he disbelieves
    the warning and begins leaping with his guards.
  language: English
  quote_policy: summarized
