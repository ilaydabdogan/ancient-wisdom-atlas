- id: obs:11
  text: Vasily asks his mother for a blessing to go with his band to Jerusalem, pray,
    worship at holy places, visit the grave of the Lord, and bathe in the Jordan.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Vasily’s mother says she will bless him if he goes for a good purpose, but
