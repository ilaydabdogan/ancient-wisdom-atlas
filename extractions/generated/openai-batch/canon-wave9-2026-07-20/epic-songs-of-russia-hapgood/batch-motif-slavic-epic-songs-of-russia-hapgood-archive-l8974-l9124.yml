  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cartel demands that crosses be removed from God's temples and that horse-stalls
    be built in churches.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Vladimir asks Kalin for a three-month truce, then weeps and laments that Ilya
