  text: Ilya drags the cloak on the kitchen floor and says he will treat Tzar Kalin
    in a similar way, including pouring out his heart and blood as wine is poured
    on the cloak.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A black-visaged maid reports Ilya's words to Vladimir as if Ilya had threatened
    Vladimir rather than Kalin.
  category: speech
  evidence_refs:
