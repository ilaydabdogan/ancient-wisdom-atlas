canonical_text:
  quote: ''
  summary: At Prince Vladimir's feast in Kief, Ilya receives a rich cloak but dishonors
    it while declaring hostility toward Tzar Kalin. A maid reports the speech as a
    threat against Vladimir, and Vladimir has Ilya imprisoned in a sealed dungeon.
    Princess Apraxia secretly feeds Ilya through a passage for three years. Tzar Kalin
    gathers a vast Golden Horde host against Kief, threatens to take Apraxia as wife,
    and sends a cartel demanding submission and desecration of churches. Vladimir
    laments the loss of Ilya, finds him alive in the dungeon, begs him to defend the
    city, and restores him to honor. Ilya rides out on Cloudfall, ascends a mountain
    to survey the plain, and sees Alyosha Popovich's guarded camp and heroic signal.
  language: English
  quote_policy: summarized
