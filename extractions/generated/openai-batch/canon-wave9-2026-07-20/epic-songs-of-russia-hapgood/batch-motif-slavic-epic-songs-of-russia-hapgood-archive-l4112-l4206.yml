canonical_text:
  quote: "“That aurochs of the golden horns is my wellbeloved nephew, young Dobrynya,
    whom Marina the Vile hath transformed.”"
  summary: Avdotya Ivanovna learns that a golden-horned aurochs has ravaged animals
    and identifies it as Dobrynya transformed by Marina. Avdotya changes into a magpie
    and threatens Marina, who then changes into a swallow and offers to restore Dobrynya
    if he swears to marry her. Dobrynya agrees, is restored, performs a marriage-like
    circling around a willow bush, and goes with Marina to Kiev. At Marina’s palace
    she again transforms him into animal forms, but he obtains a sword through his
    servant and beheads her. He later tells the court that he killed Marina for her
    ruthless deeds and many killings.
  language: English
  quote_policy: quoted
