canonical_text:
  quote: ''
  summary: The passage includes notes on the meaning of Duna'i and on boasting in
    northern ballad traditions. Dunai boasts of his wanderings, royal favor, and Princess
    Nastasya's affection; the King of Lithuania orders his beheading. Dunai calls
    to Nastasya, who wakes, offers treasure to the headsmen, and tells them to substitute
    the head of a drunken Tatar. Dunai is released, goes to Kief, and drinks away
    his possessions in a royal pot-house. At Prince Vladimir's feast, guests boast
    until Vladimir asks for a princess equal to himself. Dobrynya Nikitich names a
    fitting princess known through Dunai's report and tells Vladimir that Dunai lacks
    the means to attend. Vladimir provides treasure; Dobrynya ransoms Dunai's clothing,
    and Dunai drinks an enormous cup of wine before he and Dobrynya pass through Kief.
  language: English
