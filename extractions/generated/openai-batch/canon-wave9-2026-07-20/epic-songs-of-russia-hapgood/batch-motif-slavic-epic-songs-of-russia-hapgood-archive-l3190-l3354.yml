canonical_text:
  quote: ''
  summary: At Prince Vladimir's feast, Alyosha Popovich challenges the dragon-associated
    Tugarin, who behaves dishonorably at table with Princess Apraxia. After a wager
    for single combat, Tugarin flies away on paper wings. Alyosha prays for a storm;
    God sends rain and hail that wet the wings and make Tugarin fall. Alyosha kills
    him, returns his head to Kief, and then enters Vladimir's service.
  language: English
  quote_policy: summarized
