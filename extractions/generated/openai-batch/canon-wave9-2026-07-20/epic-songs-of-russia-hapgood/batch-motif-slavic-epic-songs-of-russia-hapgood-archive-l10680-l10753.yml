canonical_text:
  quote: ''
  summary: Sadko's playing in the sea realm is linked to the sea ruler's destructive
    dancing, which wrecks ships and drowns innocent men. The Tzaritza tells Sadko
    to break his harp and later instructs him how to choose a sea bride and avoid
    kissing or embracing her so that he may return to Holy Russia. Sadko chooses Chernava,
    falls into a heavy sleep after a feast, awakens by the Chernava river, rejoins
    his ships and guards, builds churches, prays for forgiveness, and no longer sails
    on the blue sea.
  language: English
  quote_policy: summarized
