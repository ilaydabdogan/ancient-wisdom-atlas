- id: obs:2
  text: The Tzaritza tells Sadko to break his maple-wood harp and says the Tzar's
    dancing is on the shore, where many innocent men drown and perish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sadko breaks the harp and snaps its golden strings; when ordered to keep playing,
    he says the harp is broken and can only be mended in Holy Russia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tzar Morskoi asks Sadko whether he will take a wife in the blue sea, and
    Sadko answers that he obeys the Tzar's will there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tzaritza tells Sadko to let the first two groups of three hundred maidens
    pass and to choose the last princess of the third group, who is smaller and darker
    than the others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tzaritza warns Sadko not to kiss or embrace the wife he chooses; if he
    obeys, he will return to Holy Russia and see the white world and sun, but if he
    kisses her, he will remain forever in the blue sea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sadko follows the instruction by letting the first and second groups of three
    hundred maidens pass and choosing the last maiden of the third group, called Chernava.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Tzar Morskoi gives Sadko a great feast, Sadko lies down, falls into
    a heavy sleep, and awakens on the steep banks of the Chernava river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sadko sees his ships coming up the Volkof; his body-guard, who had been thinking
    of him under the blue sea, marvel when they see him on the bank because he has
    returned to the city before them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sadko and his companions rejoice, go to his palace, and Sadko greets his young
    wife, unloads his ships, builds churches to St. Mikola and the Mother of God,
    and prays for forgiveness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After these events Sadko sails no more upon the blue sea and lives in his
    own town.
  category: sequence
  evidence_refs:
