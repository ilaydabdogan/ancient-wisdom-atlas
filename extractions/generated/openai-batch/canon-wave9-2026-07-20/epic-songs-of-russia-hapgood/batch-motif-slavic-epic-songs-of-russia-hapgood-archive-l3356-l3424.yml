canonical_text:
  quote: ''
  summary: 'A princess rebukes Aly6sha for separating her from young Tugdrin the Dragon''s
    Son, and Aly6sha answers her. A new song begins: forty-one heroes led by young
    Kasydn Mikailovich assemble on the open plain, recount violent exploits, and hear
    Kasydn propose penitential pilgrimage to Jerusalem and the Jordan under a severe
    vow. The heroes accept, put on pilgrim clothing, carry ornate objects and light-giving
    stones, wander toward Kief, and meet Prince Vladimir hunting.'
  language: English
  quote_policy: summarized
