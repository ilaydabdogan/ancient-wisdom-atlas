canonical_text:
  quote: ''
  summary: Avdotya Vasilievna warns her son Vasily not to attend a feast unbidden.
    Vasily ignores her, enters with his body-guard, disturbs the seating, and drunkenly
    wagers his head that he and his guard can face all Novgorod at the Volkof bridge.
    Avdotya tries to secure pardon with treasure, but the men of Novgorod refuse.
    She gives Vasily a cup of forgetfulness, locks him in a dungeon, and hides his
    arms. His guard fights for days at the river. A black-visaged handmaiden sees
    their plight while fetching water, kills many men with her yoke, warns Vasily,
    and breaks him out. Vasily arms himself with a heavy cart axle, relieves his guard,
    and routs the men of Novgorod. Novgorod leaders ask Avdotya to restrain him; she
    says she wronged him and directs them to his powerful godfather, the Ancient Pilgrim.
  language: English
  quote_policy: summarized
