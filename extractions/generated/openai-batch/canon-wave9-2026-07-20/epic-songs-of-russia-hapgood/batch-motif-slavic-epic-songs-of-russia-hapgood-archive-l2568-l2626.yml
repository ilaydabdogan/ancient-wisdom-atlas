canonical_text:
  quote: ''
  summary: Vasily, acting as a stern ambassador, demands Prince Vladimir's daughter
    in marriage and threatens dishonor and violence if refused. Vladimir betroths
    Beauty to him and prepares a banquet and wedding feast. As the church marriage
    approaches, Vasily becomes sorrowful and asks for musicians. Ordinary harp-players
    cannot cheer him; he asks for Stavr Godinovich, described as the only master harp-player
    able to gladden him. Vladimir hesitates but summons Stavr. Stavr plays a maple-wood
    harp with strings described as reaching from Kief, Tzargrad, and Jerusalem, after
    which Vasily begins to sleep and dream.
  language: English
  quote_policy: summarized
