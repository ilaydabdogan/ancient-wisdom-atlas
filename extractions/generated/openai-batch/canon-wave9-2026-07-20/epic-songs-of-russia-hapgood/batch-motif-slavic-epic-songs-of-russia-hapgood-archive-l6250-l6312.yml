canonical_text:
  quote: ''
  summary: A Russian pilgrim-singer's shout shakes Tzar Constantine's palace and terrifies
    Idol. The pilgrim is received, fed, and questioned about Russian heroes, especially
    Ilya of Murom. The pilgrim answers with restrained claims about Ilya, while Idol
    boasts of enormous size and appetite and threatens to crush Ilya. After Ilya taunts
    Idol with a greedy cow anecdote, Idol throws a poniard. Ilya evades and redirects
    it, then throws his nine-pood cap at Idol, drives him through the wall into the
    open plain, kills the Tatars, clears Tzargrad, and delivers Tzar Constantine.
  language: English
  quote_policy: summarized
