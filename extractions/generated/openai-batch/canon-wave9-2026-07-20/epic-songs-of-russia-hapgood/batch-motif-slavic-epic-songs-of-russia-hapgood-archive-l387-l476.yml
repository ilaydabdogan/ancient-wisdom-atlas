canonical_text:
  quote: ''
  summary: The passage recounts Rybnikof’s search for northern Russian epic singers,
    his disguised journey and chance hearing of old Leonty Bogdanovich, the later
    collecting work of Rybnikof and Hilferding, and the environmental and economic
    conditions under which epic songs were preserved or newly adopted among peasant
    artisans.
  language: English
