canonical_text:
  quote: ''
  summary: At Dobrynya Nikitich's birth, beasts and serpents flee and the landscape
    is disturbed. As a young man at Vladimir's court, Dobrynya seeks leave to wander
    through Kief. His mother warns him not to visit Princess Marina Ignatievna, described
    as a witch who has killed many rulers, heroes, and common people. Dobrynya nevertheless
    comes to Marina's lane, shoots at paired doves, and accidentally kills Tugarin
    Dragon's Son inside Marina's palace. Marina asks for Dobrynya's love; he refuses.
    She then performs a charm on his footsteps, causing him heart-pain and longing.
    When he returns to her, Marina declares her power to transform him and changes
    him into an aurochs, sending him to the plain among nine other aurochs who are
    her bridegrooms. In that form Dobrynya tramples the geese of his aunt Avdotya
    Ivanovna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the day Dobrynya Nikitich is born, a herd of beasts, wild beasts, and serpents
    flees; the Skiper-beast leads them to the Dniepr, whose waters are troubled while
    banks quake and tree-tops fall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reaching manhood, Dobrynya spends three years feasting, three years
    serving as steward, and three more as gatekeeper, receiving from Vladimir no fair
    word or soft bread, only a good steed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a feast in royal Kief attended by heroes and warrior-maidens, Dobrynya
    asks Prince Vladimir for leave to wander through Kief's lanes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prince Vladimir tells Dobrynya not to gallop away; the assembled Russian heroes
    advise Dobrynya to ask permission from his mother.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Dobrynya's mother warns him not to go to Princess Marina Ignatievna, calling
    her a witch and saying she has murdered princes, kings, crown princes, nine Russian
    heroes, and many common people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dobrynya rises early, washes in spring water, takes a bow and a quiver of
    fiery arrows, wanders through Kief, and shoots birds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Marina's palace window Dobrynya sees a dark-blue dove and its mate; he
    shoots at them, but the arrow misses and instead enters the palace and kills Tugarin
    Dragon's Son, Marina's dear friend.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Dobrynya sends his page to retrieve the arrow, Marina says the shooter
    must come himself; Dobrynya enters the palace and takes the arrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marina lies on a couch with a fiery dragon in her right hand and two little
    serpents on her left.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Marina takes Dobrynya by the hand and ring, kisses him, and asks for his love;
