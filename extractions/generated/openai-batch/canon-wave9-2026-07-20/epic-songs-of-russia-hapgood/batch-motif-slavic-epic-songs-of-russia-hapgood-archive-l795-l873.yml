canonical_text:
  quote: ''
  summary: The passage is a scholarly discussion of the origin, dating, transmission,
    and comparative status of Russian epic songs of the Vladimir, Kief, Novgorod,
    and Elder Hero cycles. It reports a theory of Turko-Mongolian derivation, argues
    for a historical migration explanation, dates the lays of Vladimir to the tenth
    through twelfth centuries, compares the hylinas with The Word of Igor's Troop,
    and characterizes the epic songs as collective folk poetry with mythicized heroes.
  language: English
  quote_policy: summarized
