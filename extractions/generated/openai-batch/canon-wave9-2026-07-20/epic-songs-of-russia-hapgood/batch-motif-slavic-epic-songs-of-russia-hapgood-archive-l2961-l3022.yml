canonical_text:
  quote: '"Whistle, thou Nightingale, roar like an aurochs, hiss like a dragon."'
  summary: Prince Vladimir asks Nightingale to perform his animal-like cry. After
    drinking wine and mead, Nightingale maliciously cries at full force, damaging
    Kief and killing listeners. Ilya protects Vladimir and the Princess, condemns
    Nightingale, rejects his plea to build a monastery, executes him on the open plain,
    and receives honor and a new epithet from Vladimir. A footnote gives a Little
    Russian variant in which Nightingale is chopped into poppy seeds that become harmless
    nightingales.
  language: English
  quote_policy: quoted
