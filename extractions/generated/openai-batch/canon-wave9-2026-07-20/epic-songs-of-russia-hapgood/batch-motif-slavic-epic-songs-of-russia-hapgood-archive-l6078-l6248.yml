canonical_text:
  quote: ''
  summary: 'The passage closes a Vasily episode: Vladimir attempts to appease Vasily,
    Vasily drinks enormous cups associated with Ilya, Dobrynya, and Alyosha, shoots
    Batyg''s elite men, deceives Batyg into giving him armies, destroys those armies,
    and causes Batyg to abandon the siege of Kiev. It then begins an Ilya and Idol
    episode: Ivaniusho returns from Jerusalem, finds Tzargrad desecrated by the Idol,
    reports this to Ilya, and Ilya exchanges gear with him and approaches Tzargrad
    disguised as a wandering psalm-singer.'
  language: English
  quote_policy: summarized
