canonical_text:
  quote: ''
  summary: Prince Vladimir, in old Plenko's hall, sees the splendid arrival of Churilo
    Plenkovich and his guard. Churilo is described as extraordinarily beautiful, finely
    dressed, and skilled on horseback. Vladimir first fears that he may be a hostile
    king or ambassador seeking his niece, but Plenko identifies him as his son. Churilo
    gives lavish gifts, and Vladimir refuses to judge complaints against him, instead
    taking him to Kief as a court servant. Churilo's beauty unsettles Princess Apraxia
    and attracts women in the city. Vladimir then dismisses him, and Churilo leaves
    Kief to dwell by the Puchai river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vladimir asks whether the approaching company is Churilo and his guard; Plenko
    first identifies an arriving troop as Churilo's stewards, and then a larger company
    arrives with a fair young man in its midst.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is described with golden-silver hair, a white neck, red cheeks,
    falcon-like eyes, sable-like brows, tiny feet, a sable mantle, green samite, and
    red-gold buttons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Churilo's host rides so lightly that the grass does not bend and the blue
    flowers do not break beneath them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Churilo leaps from horse to horse, tosses his spear upward, catches it, and
    removes young men's hats from their heads to place them on others.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vladimir fears that the approaching figure may be a king from the horde or
    a threatening ambassador who has come to sue for his niece Beauty; Plenko reassures
    him that it is only his son Churilo.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before Churilo arrives, a canopy is borne in front of him so that the sun
    will not scorch his white face.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Plenko asks Churilo what gifts he will set before Vladimir, and Churilo opens
    iron-bound coffers with golden keys and distributes costly furs, cloth, and gold
    to Vladimir, Apraxia, nobles, merchants, and common people.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Vladimir accepts Churilo's gifts, says that the offerings are greater than
    the complaints against him, refuses to give judgment against him, and invites
    him to serve in Kief as seneschal and cupbearer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator states that Churilo purchased ill-luck at great cost; Churilo
    does not rebel, has his horse saddled, and rides to Kief with the others while
    women gaze at him in the streets.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Vladimir's feast, Churilo lays the tables and shakes back his curls; while
    Princess Apraxia is carving a swan, she cuts her right hand and says that her
    eyes are troubled by Churilo's beauty, curls, and ring.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Apraxia asks Vladimir to make Churilo groom of the chambers, with duties of
    arranging the bed and cushion and playing a maple-wood gusly by the pillow.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Churilo later goes through the streets to invite princes and nobles to
    a feast, nuns turn in their cells to look at him and young maids tear off their
    kokoshniks in admiration.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After Apraxia says that this service does not befit Churilo, Vladimir perceives
    misfortune and orders Churilo either to dwell in a cell or depart to his own house.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Churilo bows, leaves the palace and Kief, comes to the Puchai river, and again
