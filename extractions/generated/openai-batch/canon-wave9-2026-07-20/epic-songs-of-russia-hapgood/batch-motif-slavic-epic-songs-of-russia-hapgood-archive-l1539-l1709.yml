canonical_text:
  quote: ''
  summary: The passage completes an episode in which Ilya is hidden by Svyatogor's
    wife, exposed by a speaking horse, and accepted by Svyatogor as a younger brother
    after an exchange of crosses. Svyatogor explains that the earth cannot bear him,
    brings Ilya to the Holy Mountains, tests him before his blind father, and then
    encounters a destined coffin that traps him. He strengthens Ilya by breath, bequeaths
    his sword, orders his horse bound to the coffin, and dies. The passage then begins
    the tale of Dunai Ivanovich, who serves the Lithuanian king, is favored by Princess
    Nastasya, and ignores her warning about drunken boasting at a feast.
  language: English
  quote_policy: summarized
