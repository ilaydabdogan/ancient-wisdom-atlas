- id: motif:6
  label: Destined coffin fits only its fated occupant
  taxonomy_refs: []
  basis: The coffin's inscription says it will fit the destined occupant; it is too
    large for Ilya but fits Svyatogor and traps him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No resurrection or return follows in the passage.
- id: motif:7
  label: Transfer of heroic power by breath
  taxonomy_refs:
  - sacred_exchange
  - initiation
  basis: Svyatogor breathes through the coffin rift, and Ilya gains threefold strength;
    Svyatogor later offers all his strength by another breath.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The power transfer is explicit, but its sacred or initiatory character
    is inferred from function rather than stated terminology.
- id: motif:8
  label: Refusal of excessive power averts death
  taxonomy_refs:
  - wisdom
  basis: Ilya refuses Svyatogor's final offer of strength, and Svyatogor says this
    refusal saved him from receiving the breath of death.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The wisdom classification is interpretive; the passage states the prudent
    refusal and its consequence.
- id: motif:9
  label: Inheritance of the dying hero's weapon
  taxonomy_refs:
  - sacred_exchange
  basis: As he dies, Svyatogor tells Ilya to possess his great battle sword, and Ilya
