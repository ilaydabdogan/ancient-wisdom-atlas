  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents teaching and travel, but does not explicitly call
    this an initiation.
- id: motif:5
  label: Strength test by substituted heated iron
  taxonomy_refs: []
  basis: Ilya is told not to give his hand to the blind father, offers heated iron
    instead, and is praised for mighty hands when the old man grasps it.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not state what would have happened if Ilya had given
