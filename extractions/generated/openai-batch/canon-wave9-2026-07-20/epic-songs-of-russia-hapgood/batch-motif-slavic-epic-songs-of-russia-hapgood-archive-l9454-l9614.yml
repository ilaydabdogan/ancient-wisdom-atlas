canonical_text:
  quote: ''
  summary: Guest Tarakashko tells Tzar Vasily of Solomonida in Jerusalem and proposes
    to take her from her living husband by means of ornate ships, intoxicating drink,
    music, and cunning. After Solomon leaves to collect tribute, Tarakashko arrives
    as a trader, drugs officials and Solomonida, carries her across the sea to Tzargrad,
    and presents her to Vasily, who takes crowns with her in the cathedral. Solomon
    returns, finds her absent, gathers an army, and approaches the palace alone as
    a wandering psalm-singer asking alms.
  language: English
  quote_policy: summarized
