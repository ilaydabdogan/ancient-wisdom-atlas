canonical_text:
  quote: ''
  summary: 'Vasily Buslaevich travels by sea with his band, receives hospitality,
    gifts, and a guide from Cossack chieftains, reaches Jerusalem and the Jordan,
    performs Christian rites, and returns. An aged crone warns the guards about naked
    bathing in the Jordan and foretells the loss of Vasily. On the return journey
    Vasily revisits Sorochinsky mountain, ignores an inscribed stone, attempts a leap,
    dies on the stone, and is buried there. His bodyguard returns to his mother in
    Novgorod and disperses after receiving treasure and wine. The passage then begins
    the Sadko episode: Sadko, a poor gusly-player excluded from feasts, plays by Lake
    Ilmen, where the water becomes disturbed and frightens him.'
  language: English
  quote_policy: summarized
