canonical_text:
  quote: ''
  summary: At Prince Vladimir’s feast in Kief, Diuk Stepanovich remains silent while
    others boast. Challenged by Vladimir and criticized by the nobles for discourtesy,
    Diuk claims greater wealth in India, rejects the wine and cakes as inferior, and
    describes his mother’s magnificent churches, palace goods, caverns of liquor,
    garments, horses, and treasure vaults. Vladimir calls for Churilo Plenkovich,
    who enters and challenges Diuk to a wager based on daily changes of apparel and
    horses over three years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a feast where others make brags, Diuk sits sad and silent, neither eating,
    drinking, nor carving the white swan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Vladimir asks Diuk whether the feast is not to his liking or whether
    he is poor and has nothing to boast of.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Diuk says he has greater possessions than Vladimir, that his father left him
    rich as a child, and that he is not used to black bread.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When wine, liquors, and wheaten cakes are brought, Diuk drinks only half his
    wine, pours the rest under the table, eats the middle of the cakes, and throws
    the lower crusts to the dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vladimir’s princes and nobles call Diuk discourteous and accuse him of being
    no lord, but a possible herdsman, fugitive serf, murderer, thief of garments,
    and stealer of a horse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Diuk says he does not want Vladimir’s treasure because he has inexhaustible
    golden treasure and abundant bread and salt; he says he came after hearing marvels
    of Kief but that things differ in India.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Diuk contrasts Kief unfavorably with India by comparing churches, clothing,
    streets, palace steps, banquet-hall floors, tables, cloths, icons, and pavements.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Diuk explains that Vladimir’s cakes taste of pine and clay, and contrasts
    them with his mother’s cakes made with glazed-tile ovens and silk oven-brooms
    dipped in honey-dew.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Diuk says his mother’s liquors are kept in silver casks with gold hoops and
    brazen chains in deep caverns, where wind through pipes makes the casks rock and
    murmur like swans.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Diuk describes his mother’s inexhaustible store of garments, her precious
    clothing and jewels, his daily change of dress, fine-fed horses, and twelve vaults
    filled with gold, silver, and pearls.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Vladimir, displeased, says he wishes Churilo Plenkovich were present to answer
    Diuk.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Churilo enters the banquet-hall, crosses himself, and bows to everyone except
    Diuk.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Diuk acknowledges Churilo’s beauty but says his courtesy is lacking.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Churilo challenges Diuk to a wager of thirty thousand rubles, proposing that
    for three years each will wear fresh apparel daily and ride a horse of different
    color, with the fairest judged victor.
  category: speech
  evidence_refs:
  - ev:11
