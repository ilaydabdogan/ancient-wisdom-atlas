canonical_text:
  quote: ''
  summary: Mikailo aims at a speaking white swan but does not shoot. The swan becomes
    Marya, Princess of Podolia, who asks to be taken to Holy Russia and baptized before
    marriage. Mikailo brings Marya rather than treasure to Kief, receives a drinking
    privilege from Vladimir, marries Marya after an oath that the survivor will enter
    the grave with the dead for three months, and later goes to the overseas king
    Bukar concerning tribute. While gaming with Bukar for high stakes, Mikailo learns
    that Marya has died. He returns to Kief, prepares an oak coffin for two, food,
    wine, iron rods, and pincers, and enters the burial beside Marya to guard against
    under-world dragons.
  language: English
  quote_policy: summarized
