canonical_text:
  quote: ''
  summary: 'The passage closes Stavr and Vasilisa''s episode with pardon and their
    return to Chernigof. It then begins the tale of Ilya of Murom and Nightingale
    the Robber: Ilya makes Easter vows to reach Kiev by the straight road without
    using bloodshed or darts, arms and saddles Cloudfall, rides with supernatural
    speed, marks his first heroic quest with a cross, defeats a vast Tatar host besieging
    Chernigof using uprooted oaks and his steed, refuses rule and treasure from the
    saved city, and is warned that the straight road to Kiev is blocked by mountains,
    the Smorodina river and Black Morass, and Nightingale the Robber, a magic bird
    whose whistle devastates forest, horse, and rider.'
  language: English
  quote_policy: summarized
