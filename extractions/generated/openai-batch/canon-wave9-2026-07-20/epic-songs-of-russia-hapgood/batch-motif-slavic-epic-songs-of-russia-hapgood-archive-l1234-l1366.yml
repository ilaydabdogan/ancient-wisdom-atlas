canonical_text:
  quote: ''
  summary: The passage moves from Mikula's agricultural self-description to the tale
    of Hero Svyatogor. Svyatogor boasts of cosmic strength, meets an uncatchable wayfarer
    whose pouch contains the weight of the earth, and is directed to a smith in the
    Northern Mountains to learn his fate. The smith says Svyatogor is fated to marry
    a woman who has lain thirty years on a dungheap in a kingdom by the sea. Svyatogor
    tries to kill her, but his blow leaves a scar and she awakens transformed. She
    becomes wealthy through trade, Svyatogor later marries her, and he recognizes
    that he has not escaped the fate decreed by God.
  language: English
  quote_policy: summarized
