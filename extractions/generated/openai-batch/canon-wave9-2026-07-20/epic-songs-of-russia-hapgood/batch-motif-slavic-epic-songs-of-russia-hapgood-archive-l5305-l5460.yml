candidate_motifs:
- id: motif:1
  label: animal behavior used as a threshold sign
  taxonomy_refs: []
  basis: Diuk explicitly decides that peaceful feeding by the two horses means he
    may enter the pavilion, while fighting would mean he should leave.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the horse behavior as Diuk's practical test; it does
    not name it as divination.
- id: motif:2
  label: encounter with a sleeping heroic champion
  taxonomy_refs: []
  basis: Diuk finds Ilya asleep inside the pavilion, identifies him by inscription,
    and must wake him before their exchange can proceed.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader mythic sleep cycle is stated in the passage.
- id: motif:3
  label: sworn brotherhood through sacred exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Ilya and Diuk swear brotherhood and exchange crosses after Diuk praises Ilya
    and refuses combat.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives the ritual exchange but does not elaborate its legal
    or ecclesiastical status.
- id: motif:4
  label: elder hero grants protection to younger companion
  taxonomy_refs: []
  basis: After swearing brotherhood, Ilya tells Diuk to send word if anyone in Kiev
    offends him and promises to defend him.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The promise is conditional and is not fulfilled within this passage.
- id: motif:5
  label: marvelously swift journey by exceptional steed
  taxonomy_refs: []
  basis: Diuk says he traveled from India after Holy Saturday vespers and reached
    Kiev at early mass on Easter Day, and he calls his own steed priceless; the court
    disputes the plausibility of the journey.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage reports Diuk's claim and the nobles' denial, without resolving
    whether the journey was factual within the story world.
- id: motif:6
  label: outsider hero at royal court with contested boasting
  taxonomy_refs: []
  basis: Diuk arrives as a stranger at Vladimir's court, offends Apraxia, receives
    a feast invitation, makes superior claims about his country and steed, and is
    contradicted by Vladimir's heroes and nobles.
  evidence_refs:
  - ev:9
  - ev:11
  - ev:14
  - ev:15
  - ev:16
  confidence: medium
  cautions: Ilya's warning not to boast frames the court behavior, but the passage
    ends before consequences are shown.
- id: motif:7
  label: incomparable national hero
  taxonomy_refs: []
  basis: Diuk says there is only one Ilya of Murom in Holy Russia, likening him to
    the single sun and single moon in heaven.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is a praise formula within dialogue, not an independent cosmological
    claim.
