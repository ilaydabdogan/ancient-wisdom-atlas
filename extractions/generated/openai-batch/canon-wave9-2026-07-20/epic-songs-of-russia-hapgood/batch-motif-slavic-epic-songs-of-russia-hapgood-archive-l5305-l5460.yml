canonical_text:
  quote: ''
  summary: Diuk follows traces of a mighty horse to a white pavilion where Ilya of
    Murom sleeps. Diuk uses the peaceful feeding of the horses as a sign that he may
    enter, wakes Ilya, humbles himself before him, and becomes his sworn brother through
    an exchange of crosses. Ilya sends Diuk on to Kiev with a promise of protection
    and a warning not to boast. Diuk arrives at Prince Vladimir's court during Easter,
    offends Princess Apraxia, draws attention with his horse Shaggy, and makes claims
    about his swift journey from India and the value of his steed, which Vladimir's
    heroes and nobles dispute.
  language: English
  quote_policy: summarized
