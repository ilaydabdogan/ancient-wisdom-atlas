comparison_claims:
- id: claim:1
  claim: Mikailo's petrification followed by emergence from the broken stone is functionally
    comparable to a resurrection or death-rebirth motif family, while remaining textually
    distinct because he is described as stone-bound and sleeping rather than dead.
  claim_level: same_function
  target: resurrection / death_rebirth motif family
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not call the release a resurrection, and Mikailo himself
    describes the interval as sleep.
- id: claim:2
  claim: 'The aged pilgrim has the same narrative function as a disguised miraculous
    or saintly helper in Russian epic-style narrative: he appears on the road, protects
    the heroes, performs the impossible task, invokes Mikola, and vanishes.'
  claim_level: same_function
  target: disguised saintly helper pattern in Russian epic tradition
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly identify the aged pilgrim as Saint
    Mikola or any other supernatural figure.
- id: claim:3
  claim: Marya's wine trap and Anna's cloak rescue support comparison to recurrent
    captivity-and-liberation patterns, in which seduction or hospitality leads to
    confinement and a later helper frees the hero through deception.
  claim_level: same_function
  target: captivity, deceptive hospitality, and helper-liberation pattern
