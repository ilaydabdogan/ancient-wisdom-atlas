candidate_motifs:
- id: motif:1
  label: hero imprisoned in stone and released by breaking the stone
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Mikailo is turned into a stone and later emerges when the aged pilgrim breaks
    it, describing the interval as a long sleep.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: The passage presents petrification and sleep-like confinement, not explicit
    biological death.
- id: motif:2
  label: disguised rescuers as wandering psalm-singers
  taxonomy_refs: []
  basis: Mikailo's brothers put on the guise of wandering psalm-singers to enter Volhynia
    and inquire about him.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly names this disguise pattern.
- id: motif:3
  label: aged stranger as miraculous helper
  taxonomy_refs: []
  basis: The aged pilgrim joins the party, resists the banquet trap, defeats attackers,
    performs the stone-lifting task, releases Mikailo, invokes Mikola, and vanishes.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly identify the aged pilgrim as Saint Mikola
    or as a supernatural being, although his actions and disappearance are extraordinary.
- id: motif:4
  label: strength test at a stone
  taxonomy_refs:
  - initiation
  basis: The fourth share of alms is reserved for whoever can raise and shatter the
