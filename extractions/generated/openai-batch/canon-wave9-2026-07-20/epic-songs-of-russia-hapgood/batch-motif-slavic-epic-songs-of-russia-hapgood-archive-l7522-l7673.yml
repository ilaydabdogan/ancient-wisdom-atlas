canonical_text:
  quote: ''
  summary: Marya the White Swan turns Mikailo the Rover into a white stone. His comrades,
    disguised as wandering psalm-singers and accompanied by an aged pilgrim, travel
    to Volhynia. Marya attempts to destroy them, but the aged pilgrim defeats her
    knights and later breaks the stone, releasing Mikailo. The pilgrim invokes Saint
    Mikola and vanishes. Mikailo returns to Volhynia, is tricked again by Marya with
    wine, and is nailed in a dungeon. Anna the Fair falls in love with him, frees
    him, substitutes a Tatar prisoner, and hides Mikailo beneath her cloak.
  language: English
  quote_policy: summarized
