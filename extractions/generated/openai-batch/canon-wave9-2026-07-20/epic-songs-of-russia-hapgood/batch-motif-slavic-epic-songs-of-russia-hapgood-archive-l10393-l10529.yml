canonical_text:
  quote: ''
  summary: Sadko continues playing until Tzar Vodyanoi emerges from the lake and rewards
    him with instructions for winning a wager about golden-finned fish in Lake Ilmen.
    Sadko follows the instructions, wins merchants' shops, becomes a rich merchant,
    builds a splendid palace, and later boasts that he can buy all the goods in Novgorod.
    After repeated market purchases are overwhelmed by replenished goods from elsewhere,
    he recognizes that Novgorod is richer than he is and chooses to yield the wager.
  language: English
  quote_policy: summarized
