  summary: Ilya of Murom rides the straight way through mountains, morass, and the
    Smorodina River, confronts Nightingale the Robber in his seven-oak nest, wounds
    and captures him with an improvised willow dart, overcomes resistance from Nightingale's
    family, refuses ransom, and brings the bound captive to Prince Vladimir's court
    in Kiev, where the feat is verified.
