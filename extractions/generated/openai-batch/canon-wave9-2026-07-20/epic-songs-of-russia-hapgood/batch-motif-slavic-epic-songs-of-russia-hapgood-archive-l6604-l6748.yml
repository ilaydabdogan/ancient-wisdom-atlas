canonical_text:
  quote: ''
  summary: Dobrynya frees many prisoners and Princess Beauty from the Dragon's deep
    den, refuses Beauty's lover-language on grounds of unequal birth, and sends her
    with Alyosha Popovich to Prince Vladimir in Kief. He then encounters a warrior-maiden,
    Nastasya Mikulichna, whose strength resists his mace blows; she seizes him, places
    him in a leather pouch, and is warned by her speaking horse that the burden of
    two heroes is too great. Nastasya spares Dobrynya on condition that he swear to
    marry her. They go to Kief, where she receives Christian faith, they take golden
    crowns, and Vladimir gives a feast.
  language: English
  quote_policy: summarized
