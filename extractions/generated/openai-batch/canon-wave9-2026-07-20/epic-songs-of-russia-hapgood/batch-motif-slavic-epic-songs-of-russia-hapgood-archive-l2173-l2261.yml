canonical_text:
  quote: ''
  summary: Quiet Dunai boasts, is challenged by Princess Nastasya to an exacting archery
    test, and fails after she succeeds. Angered, he kills her despite her plea to
    spare her so she may bear a wondrous son marked with precious metals and celestial
    signs. Remorseful, Dunai kills himself; two rivers flow from the place, and entwined
    cypress trees arise where the rivers meet. The passage closes by saying the Song
    of Dunai will continue to be sung.
  language: English
  quote_policy: summarized
