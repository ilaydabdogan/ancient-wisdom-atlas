canonical_text:
  quote: Whoso rideth to the right shall gain great wealth, whoso goeth to the left
    a wife, he that fareth straight on, his death.
  summary: 'The passage first closes a court episode in which Prince Vladimir releases
    and rewards Ilya and gives Putyatin pitch. It then begins an adventure of Ilya
    of Murom: as an aged rider on the open plain, he reaches three roads marked by
    a burning white Alatyr stone. The inscription assigns wealth, a wife, or death
    to the three ways. Ilya chooses the road of death, meets a huge robber band, overawes
    them with a fiery dart, returns to rewrite the stone, and then rides onward to
    a white-stone palace where Princess Zenira receives him with a feast.'
  language: English
  quote_policy: quoted
