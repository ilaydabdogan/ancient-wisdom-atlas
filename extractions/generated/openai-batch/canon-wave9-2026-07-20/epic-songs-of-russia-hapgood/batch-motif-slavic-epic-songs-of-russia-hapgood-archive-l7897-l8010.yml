canonical_text:
  quote: ''
  summary: Nightingale Budimirovich commands his guards to build three golden-crowned
    towers in Love's garden overnight. Love discovers the marvel, hears treasure-counting,
    prayer, and Nightingale's harp-singing in the towers, and asks him to marry her.
    He reproves her for wooing for herself, then formally asks Prince Vladimir for
    Love, receives the betrothal, goes with her to church for the crowns, removes
    the towers, and sails home with his mother, guards, and wife.
  language: English
