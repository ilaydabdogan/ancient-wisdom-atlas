canonical_text:
  quote: ''
  summary: The passage is an interpretive note on Prince Vladimir in Russian epic
    songs. It presents him as a composite of two historical Vladimirs, links his name
    and title to a solar or heavenly divinity, describes him as a passive host who
    delegates action to heroes, gives an example of oppressive treatment of Sukmdn
    Odikmd,ntievich, and closes with a comparative statement about heroic marriages
    as unions of opposed male and female principles.
  language: English
  quote_policy: summarized
