canonical_text:
  quote: ''
  summary: A messenger reports that Stavr's palace is to be sealed and his young wife
    brought to Kief, but the guard says she has gone away. Vasilisa, under the name
    Vasily Mikulich and presented as a threatening foreign ambassador, arrives at
    Kief, leaps the city walls, enters Prince Vladimir's hall, and demands Vladimir's
    daughter Beauty in marriage. Beauty suspects the ambassador is a woman and lists
    signs. Vladimir tests the visitor with a steam bath, then archery, then wrestling.
    Vasilisa avoids exposure in the bath by entering and leaving quickly, shatters
    a distant damp oak with her own great bow, and kills several of Vladimir's wrestlers
    until Vladimir begs her to stop.
  language: English
  quote_policy: summarized
