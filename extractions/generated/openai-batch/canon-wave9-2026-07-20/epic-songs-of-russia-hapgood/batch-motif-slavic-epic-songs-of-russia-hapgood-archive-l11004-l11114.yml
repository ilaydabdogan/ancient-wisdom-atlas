canonical_text:
  quote: ''
  summary: A commentary passage on Ilya of Murom summarizes local cult traditions,
    Kyiv relic traditions, and comparative mythological interpretations. It presents
    Ilya as a peasant hero, a saint-like figure, and a mythic thunder figure associated
    with lightning, rain, clouds, a heroic horse, healing psalm-singers, Nightingale
    the Robber, Falcon the Hunter, and a father-child conflict pattern.
  language: English
  quote_policy: summarized
