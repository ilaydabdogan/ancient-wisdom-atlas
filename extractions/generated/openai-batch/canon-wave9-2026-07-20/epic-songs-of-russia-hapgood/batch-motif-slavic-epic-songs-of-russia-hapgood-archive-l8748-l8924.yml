canonical_text:
  quote: '"There is feasting to-day in Kief town, for Dobrynya''s young wife is wedded
    to Alyosha Popovich."'
  summary: Dobrynya hears that his wife is being wedded to Alyosha in Kief. He rides
    home swiftly on his steed, is first unrecognized and then recognized by his mother
    through a birthmark, learns of Alyosha's treachery, disguises himself as a minstrel,
    enters the wedding feast, sings, and places his marriage ring in a cup of wine
    that Nastasya drinks and recognizes.
