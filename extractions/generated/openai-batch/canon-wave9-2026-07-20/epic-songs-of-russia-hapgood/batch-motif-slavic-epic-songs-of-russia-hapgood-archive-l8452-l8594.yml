canonical_text:
  quote: ''
  summary: The passage opens with a geographical praise of Mother Volga, then begins
    Dobrynya’s tale. At Prince Vladimir’s feast in Kiev, Ilya of Murom arrives. Vladimir
    asks for a champion to defend the Christian faith and his household, fight the
    Discourteous Knight who is coming in raven form, collect overdue tribute, and
    subdue hostile groups. The assembled heroes stay silent; Ilya, who has defended
    the frontier ditch for twelve years, proposes Dobrynya. Dobrynya leaves sadly,
    laments to his mother that he lacks heroic gifts, and says he should have been
    cast into the sea. His mother says God gave him courtesy alone, then reveals that
    a heroic steed and trappings are hidden in a deep vault. Dobrynya searches the
    stables, descends to the vault, sees the steed, and falls before its right fore-foot.
  language: English
  quote_policy: summarized
