  summary: A commentarial passage on Churilo Plenkovich says his name is absent from
    old chronicles, explains an epithet applied to old Plenko as referring to silk
    trade on the Surozh Sea, notes an alternative mythological etymology involving
    Svarg, comments that Prince Vladimir's numerous attendants belong to the Moscow
    epoch rather than the simpler court of Kiev, and states that Churilo died at the
    hands of an enraged husband, Bermyag.
