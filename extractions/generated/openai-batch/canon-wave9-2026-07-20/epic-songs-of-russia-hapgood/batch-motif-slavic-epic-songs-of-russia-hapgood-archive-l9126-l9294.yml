canonical_text:
  quote: ''
  summary: Dobrynya and other heroes gather near an oak, cross, and stone, where Ilya
    appeals to the heroes to defend Kief. Samson refuses on behalf of the heroes.
    Vladimir anxiously awaits aid, and young Yermak asks for a steed, armor, and mace
    so he can fight. Yermak scouts the enemy from an oak and then fights the Tatars
    alone while Ilya sleeps. After waking, Ilya sends heroes to restrain Yermak and
    then attacks the host himself. His horse Cloudfall warns him about three trenches,
    but Ilya ignores the warning, escapes two trenches, falls in the third, and is
    captured and brought before Tzar Kalin.
  language: English
  quote_policy: summarized
