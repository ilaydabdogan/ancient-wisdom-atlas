canonical_text:
  quote: ''
  summary: Dmitry offers Ivan bread and salt after threatening that Koschei will behead
    him. Ivan takes Avdotya onto his steed, travels across streams, and camps in a
    white damask pavilion. Koschei arms himself, pursues, and fights Ivan. Ivan overcomes
    Koschei but lacks his dagger; Avdotya, tempted by Koschei's promise to make her
    a tsaritsa, pulls Ivan away, allowing Koschei to overpower him. Avdotya then prevents
    Ivan's killing and has him bound to a damp ringbarked oak. When Koschei tries
    to shoot two blue doves on the oak, Ivan conjures the arrow to rebound and kill
    Koschei. Avdotya then threatens to kill Ivan unless he swears to take her as wife,
    but her trembling sword cuts his bonds instead.
  language: English
  quote_policy: summarized
