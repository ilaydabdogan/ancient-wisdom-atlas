canonical_text:
  quote: ''
  summary: 'Diuk accepts a long wager with Churilo over clothing and display, sends
    his horse to his mother for aid, and receives concealed splendid garments. After
    a three-year rivalry in Kief, Diuk reveals dazzling apparel and animated ornaments
    that surpass Churilo''s devices. Churilo then proposes a second wager: the horses
    must leap the Dniepr, with their riders'' heads as stakes. Diuk laments to his
    horse Shaggy, who speaks and promises to leap the river and beyond, naming its
    kin among the horses of Ilya of Murom and Dobrynya Nikitich. The rivals and spectators
    proceed to the Dniepr.'
  language: English
  quote_policy: summarized
