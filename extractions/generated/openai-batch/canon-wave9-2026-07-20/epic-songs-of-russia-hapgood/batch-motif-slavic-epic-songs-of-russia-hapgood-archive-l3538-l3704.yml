canonical_text:
  quote: ''
  summary: After the one and forty pilgrims leave Kiev for Jerusalem, Prince Vladimir
    discovers that his royal cup is missing. Princess Apraxia accuses the pilgrims.
    Alyosha confronts them rudely and retreats; Dobrynya approaches courteously, and
    the cup is found in Kasyan Mikailovich's pouch. Kasyan denies stealing it and
    says Apraxia contrived the matter. His companions fulfill their vow by mutilating
    and burying him, but Mikola of Mozhaisk, identified in a note as St. Nicholas,
    restores him by divine commission and sends him onward to Jerusalem. Kasyan rejoins
    his companions, who rejoice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The one and forty pilgrims wash, put on shoes, pray, eat and drink at tables
    served by order of Princess Apraxia, thank her, and set out for Jerusalem.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the pilgrims depart, Prince Vladimir returns, the cupbearers search
    for the royal bratina, and Princess Apraxia says the recently departed forty psalm-singers
    and one may have carried off the royal cup.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ilya of Murom warns Vladimir that the travelers are not wandering psalm-singers
    but one and forty bold heroes; Vladimir sends Alyosha Popovich after them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Alyosha calls the travelers thieves and robbers and demands the royal cup;
    Kasyan Mikailovich rises, grasps his travelling cudgel, and responds to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Alyosha returns to Kiev and reports that brigands attacked him; the Old Cossack
    says Alyosha was a daring fool and recommends sending Dobrynya Nikitich because
    he knows how to petition courteously.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dobrynya greets the forty and one courteously, is invited to share bread and
    salt, explains that the royal cup is lost, and asks them to search their pouches
    in case it entered one through error.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pilgrims open their pouches; the royal cup is not in the others' pouches
    but is found in Kasyan Mikailovich's pouch.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The companions say Kasyan had imposed the great vow; Kasyan denies stealing
    the cup, says Princess Apraxia contrived the matter because he would not yield
    to her, and tells them to do what was commanded by their vows.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The companions weep, take leave of Kasyan, cut off his feet to the knee and
    arms to the elbow, remove his eyes and tongue, bury him to the breast in damp
    mother earth, and continue toward Jerusalem.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Dobrynya takes the royal cup back to Vladimir, reports the marvel he saw,
    says the cup was found upon the pilgrims by mistake and was not stolen, and does
    not tell what Apraxia had done; Apraxia then falls ill with grief.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mikola of Mozhaisk comes before Vladimir and his heroes, restores Kasyan's
    feet, hands, eyes, tongue, and breath, and says the Lord sent him because Kasyan
    was wrongfully slain.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mikola commands Kasyan to go to Jerusalem, pray in the sanctuary, kiss the
    Lord's grave, bathe in the Jordan river, and later build a cathedral church to
    Mikola of Mozhaisk.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: Kasyan overtakes his companions at night; they marvel because they had executed
    him, see him fairer than before, recognize that the Lord had helped him, and rejoice.
  category: sequence
  evidence_refs:
  - ev:13
