canonical_text:
  quote: ''
  summary: Dobrynya meets a speaking raven at an oak, is directed toward a mountain
    and three wondrous damsels, enters a locked pavilion with a fatal warning, eats
    and wastes the food inside, and falls asleep. Alyosha, the pavilion owner, finds
    the waste, refuses to kill Dobrynya while he sleeps, wakes him, and fights him
    for days. Ilya of Murom detects the battle through thunder and trembling earth,
    separates the heroes, hears both explanations, and persuades them to swear brotherhood
    by exchanging crosses. The passage then begins another scene in Kiev where wounded
    young men interrupt Prince Vladimir's feast to complain.
  language: English
  quote_policy: summarized
