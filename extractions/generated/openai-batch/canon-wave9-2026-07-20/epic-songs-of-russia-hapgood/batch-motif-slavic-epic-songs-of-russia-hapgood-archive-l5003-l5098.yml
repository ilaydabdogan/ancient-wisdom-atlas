  quote: ''
  summary: An aged wandering pilgrim of immense strength enters Kief, asks for wine,
    is refused by the vintners, and receives help from poor companions and peasants.
    He rewards them the next morning by breaking into the wine cellars, carrying and
    rolling casks to the marketplace, and giving a free feast. After the vintners
    complain to Prince Vladimir, the pilgrim reveals that payment comes from Ilya
    of Murom and departs toward the open plain, the heroic barriers, and the damp
    oak.
