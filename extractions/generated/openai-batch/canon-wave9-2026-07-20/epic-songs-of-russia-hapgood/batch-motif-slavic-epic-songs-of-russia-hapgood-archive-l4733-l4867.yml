canonical_text:
  quote: ''
  summary: Several injured groups petition Prince Vladimir, saying armed youths and
    Churilo's guards have taken over hunting, fishing, and falconry grounds and damaged
    gardens. Vladimir ignores earlier complaints while feasting, but reacts when told
    of insults to the young people of Kiev. Bermyata describes Churilo's wealthy court
    in Little Kiev. Vladimir travels there with his princess, nobles, heroes, and
    men. Old Plenko receives them through ranked gates and ornate chambers into a
    celestial-looking tower, where they feast and see richly equipped mounted youths
    identified as Churilo's cooks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first injured company reports finding no animals or birds, but encountering
    three hundred youths hunting and trapping in the prince's pine forests and being
    beaten and wounded by them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Vladimir eats, drinks, and makes merry, and does not heed the first
    petition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second injured company of fishermen reports that five hundred youths are
    catching fish in the lakes, rivers, and royal ponds, leaving the prince without
    catch and the fishermen without payment except blows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vladimir pays no more heed to the fishermen's complaint than to the first
    and continues feasting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Falconers and hawkers arrive with broken heads and report that a thousand
    men are catching sparrow-hawks and falcons; these men are called Churilo's body-guard.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Merchants and gardeners report that Churilo's wild guards have uprooted garlic
    and onions, broken cabbages, and insulted young women and young men of Kiev.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The report about insults in Kiev prompts Vladimir to ask who Churilo is, and
    old Bermyata Vasilievich answers.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Bermyata says Churilo lives in Little Kiev and describes a palace seven versts
    across, with an iron fence, pearl knobs, rich halls, silver flooring, gold fittings,
    multiple gates, fish-tooth thresholds, and tiled ovens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Vladimir arrays himself and travels to Churilo Plenkovich's court with Princess
    Apraxia, nobles, heroes including Dobrynya Nikitich, Bermyata, and five hundred
    men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old Plenko meets Vladimir's party and opens different gates for the prince
    and princess, the princes and nobles, and the common people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Old Plenko leads Vladimir and Princess Apraxia through richly patterned, crystal,
    and lattice-work chambers to a golden-domed tower decorated with sun, moon, stars,
    and white dawns.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The guests are seated at richly decked tables, served sweet foods, mead, and
    overseas liquors, and spend the day in cheerful conversation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Vladimir looks from a lattice window and sees a hundred matched, richly dressed
    mounted youths riding from the direction of the Soroga river.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When Vladimir asks whether the arriving riders are Plenko's son, Plenko says
    they are Churilo's cooks who make green wine; another group of five hundred mounted
    riders then arrives.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
