canonical_text:
  quote: ''
  summary: Alyosha Popovich and Akim Ivanovich ride from Kostof/Rostof and choose
    the road to Kiev after Akim reads an inscription on a burning stone at a three-road
    junction. After camping near the Safat river, they meet a richly equipped wandering
    psalm-singer who reports the monstrous Tugarin Dragon's Son. Alyosha exchanges
    clothing with the pilgrim, approaches Tugarin in disguise, kills him, and takes
    his garments. Akim mistakes Alyosha for Tugarin because of the garments and wounds
    him, but recognizes him by a gold cross; Alyosha is restored with liquor from
    beyond the sea. The party then rides to Kiev and enters Prince Vladimir's court.
  language: English
  quote_policy: summarized
