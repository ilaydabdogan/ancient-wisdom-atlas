canonical_text:
  quote: ''
  summary: 'The passage opens the Novgorod cycle tale of Vasily Buslaevich. Old Buslai
    dies, leaving wealth, a widow, and his son Vasily. As a child, Vasily learns reading,
    writing, and church singing, but then roams Novgorod and injures other children
    with prodigious strength. His mother reprimands him and says he lacks brothers
    or a guard. Vasily sends arrow-bound scrolls inviting men to his court with promises
    of food, wine, and clothing. He sets a test: lift and drink a heavy cup of green
    wine and withstand a blow from his red-elm cudgel. After killing many hostile
    Novgorod men, he accepts Kostya New-trader, Lame Potanyshka, and Komushka the
    Hunchback into his bodyguard. He then gives a feast but honors only his guards,
    leading the men of Novgorod to curse him and plan a feast without him.'
  language: English
  quote_policy: summarized
