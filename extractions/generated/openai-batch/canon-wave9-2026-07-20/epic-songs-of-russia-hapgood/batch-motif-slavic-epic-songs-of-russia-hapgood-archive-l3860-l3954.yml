canonical_text:
  quote: ''
  summary: Prince Vladimir learns that the threatening visitor is Ilya of Murom, whom
    he had failed to honor properly. Vladimir sends Dobrynya Nikitich to apologize
    and invite Ilya to a feast with a better place. Dobrynya approaches Ilya cautiously
    in the pot-house. Ilya demands that drinking places be opened freely for three
    days and that a banquet be prepared, threatening Vladimir's reign if this is not
    done. The orders are issued, Ilya comes to the palace, is honored by Vladimir,
    chooses a lesser place among his drinking companions, and is reconciled with the
    prince.
  language: English
  quote_policy: summarized
