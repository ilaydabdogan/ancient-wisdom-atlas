canonical_text:
  quote: "“Stavr must be saved by woman's wiles.”"
  summary: 'At a feast in royal Kief, Prince Vladimir notices that Stavr Godinovich
    is not eating, drinking, or boasting. Stavr responds with boasts about his wealth,
    estate, servants, horses, and especially his wife Vasilisa Mikulichna, saying
    she could deceive the princes and nobles and unsettle Vladimir himself. Vladimir,
    angered, orders Stavr fettered and imprisoned in a deep dungeon. Stavr’s serving-man
    rides to Chernigof and tells Vasilisa. She dismisses her guests, reflects on how
    to rescue her husband, decides that treasure and strength will not free him, and
    prepares a deceptive embassy: she writes a letter presenting herself as an ambassador
    from a distant island land seeking Vladimir’s daughter, has her braid cut and
    is dressed in male ambassadorial clothing, summons forty youths as a bodyguard,
    and rides toward Kief. On the road she meets a messenger from Kief, who asks where
    the bold youth is from and where he is going; she begins to answer as the ambassador
    she claims to be.'
  language: English
  quote_policy: quoted
