canonical_text:
  quote: ''
  summary: Dobrynya prepares his ancestral heroic horse, arms himself, receives his
    mother's blessing, and tells his wife Nastasya to wait up to twelve years but
    never to marry Alyosha Popovich. After Dobrynya's extraordinary departure and
    long absence, Alyosha repeatedly woos Nastasya, reports Dobrynya dead, and later
    comes with Prince Vladimir, who coerces Nastasya into betrothal. Meanwhile Dobrynya
    is abroad fighting for Kiev and unaware of the forced marriage; a dove and its
    mate perch on an oak near him and coo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dobrynya addresses a heroic steed that had served his father and grandfather,
    releases it, saddles it, and fastens twelve silk girths and a thirteenth for heroic
    strength.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dobrynya dresses in ornate shoes and cap, puts on a coat of mail, mounts by
    a damascened steel stirrup, and seats himself in a Cherkessian saddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dobrynya comes to the white-stone palace and asks his mother for leave to
    ride on a heroic quest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dobrynya's mother gives him a cross-blessing, brings Nastasya to his left
    stirrup, bids farewell, weeps, and laments that her red sun has set while the
    bright moon remains with her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nastasya asks when to expect Dobrynya back from the open field, and Dobrynya
    instructs her to wait in repeated three-year periods up to twelve years.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dobrynya says that if he has not returned after twelve years he will not be
    living, and Nastasya may remain a widow or marry, but not Alyosha Popovich.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dobrynya's horse leaves without using the gates or highway; its first leap
    goes over the city walls, the second covers three versts, and no trace of the
    third remains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After three years pass without Dobrynya's return, Alyosha rides out and comes
    back to Nastasya.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Alyosha tells Nastasya he saw Dobrynya dead in the open plain, describing
    a body amid a willow bush, plume-grass, birds, ravens, grass, and flowers, with
    weapons scattered and the horse roaming.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nastasya refuses Alyosha and says he has not been on the open plain but only
    near the town.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After six years have passed, Alyosha again comes to the white-stone palace
    to woo Nastasya, and she says she has kept a man's oath and will keep a woman's
    oath, but will never wed Alyosha.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the full term of years, Alyosha comes with Fair Sun Prince Vladimir;
    Nastasya refuses to marry him.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Prince Vladimir threatens Nastasya with a nunnery, marriage to Murza the Tatar
    in Lithuania, or service as his cowherd if she will not wed Alyosha.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Nastasya is taken by the hands, led to the cathedral, and betrothed to Alyosha;
    Vladimir then leads them to his palace and gives a feast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The widow Afimya Alexandrevna laments that her bright moon has also set.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Dobrynya has spent the years at the Golden Horde and in many countries, fighting
