canonical_text:
  quote: ''
  summary: The passage summarizes variants and mythological commentary on S'wtjet
    Mikailo Ivanovich. In some versions Mdrya the White Swan is an under-world dragon
    in the coffin, while Mikailo dismembers and cleanses his bride, sprinkles her
    with living water, and marries her. The commentary interprets the swan, dragon,
    living water, grave-roaring, coffin-bursting, candles, rods, and pincers as storm-cloud,
    rain, thunder, lightning, and heavenly-smith imagery, and notes parallels with
    Ilya of Murom, Dunai, a German tale in Grimm, and the One and Forty Pilgrims.
  language: English
  quote_policy: summarized
