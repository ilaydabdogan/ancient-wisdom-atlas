canonical_text:
  quote: ''
  summary: Ilya is freed by Tzar Kalin, refuses Kalin's offer of food, clothing, marriage,
    and vassalage, and declares loyalty to God’s temples, Princess Apraxia, Prince
    Vladimir, and Kiev. A heavenly voice tells Ilya to lift his hands; he beheads
    Kalin, attacks the Tatars, summons his horse and allies, and the Russian heroes
    fight the Tatar horde. After the heroes boast that they would climb a ladder to
    heaven and destroy the heavenly host, slain enemies multiply and the heroes turn
    their weapons on one another, leaving Yermak alive. Notes cite variant endings
    involving petrification or military conscription. Yermak receives a drinking privilege
    from Vladimir; Ilya and his horse Cloudfall are turned to stone, and Ilya’s bones
    become relics. A new tale begins with Tzar Vasily Okulovich hosting a feast in
    Tzargrad and asking for an incomparable wife; Tarakashko rises to respond.
  language: English
  quote_policy: summarized
