candidate_motifs:
- id: motif:1
  label: Enemy ruler offers marriage, hospitality, and vassalage to incorporate the
    hero
  taxonomy_refs: []
  basis: Kalin releases Ilya and offers table fellowship, mead, apparel, his daughter,
    and service to Kalin; Ilya refuses.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the offer politically and personally; no sacred-marriage
    or ritual interpretation is stated.
- id: motif:2
  label: Heavenly voice precedes the overthrow of an enemy ruler
  taxonomy_refs:
  - divine_judgment
  basis: A voice from heaven commands Ilya to lift his hands, after which Kalin's
    head is struck off.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not identify the heavenly speaker or explicitly call
    the act a judgment.
- id: motif:3
  label: Projectile used as a messenger to awaken a distant ally
  taxonomy_refs: []
  basis: Ilya shoots a fiery arrow into Samson's pavilion to scratch and awaken him;
    Samson calls it an unwelcome messenger from his brother-in-arms.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No broader taxonomy reference is supplied for this specific communication
    pattern.
- id: motif:4
  label: Boast of climbing to heaven followed by destructive reversal
  taxonomy_refs:
  - ascent
  basis: The heroes say they would climb a ladder to heaven and destroy the heavenly
    host; immediately afterward, enemies multiply and the Russian heroes turn on one
    another.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage juxtaposes the boast and reversal but does not explicitly
    state a causal divine punishment.
- id: motif:5
  label: Multiplying enemy horde after slaughter
  taxonomy_refs: []
  basis: After renewed killing, two or three Tatars rise up for each man slain.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The mechanism of multiplication is not explained in the passage.
- id: motif:6
  label: End of the heroic race through mutual destruction and petrification
  taxonomy_refs: []
  basis: The heroes turn their weapons against one another, only Yermak survives,
    Ilya and Cloudfall are turned to stone, and the narrator says the race of Russian
    heroes ends forever.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage combines several ending elements; their relationship is not
    fully explained.
- id: motif:7
  label: Petrified heroes in mountains and caverns as a variant ending
  taxonomy_refs: []
  basis: The note reports a Siberian version in which heroes flee to stone mountains
    and dusky caverns and turn to stone.
  evidence_refs:
  - ev:8
  confidence: uncertain
  cautions: The same note says this part of the Siberian version is much decayed and
    may not have belonged to the original ancient shape.
- id: motif:8
  label: Royal search for an incomparable bride at a feast
  taxonomy_refs: []
  basis: At a great feast, Tzar Vasily asks the gathered people to name a wife of
    unequaled form, understanding, speech, face, and gait.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage begins the motif but does not include Tarakashko's answer
    within this line range.
comparison_claims:
- id: claim:1
  claim: The cited Siberian Cossack version preserves a related aftermath pattern
    for the battle but replaces the heroes' mutual killing with flight to stone mountains
    and caverns followed by petrification.
  claim_level: same_function
  target: Siberian Cossack version collected by Mey, as cited in the note
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The note itself says the Siberian passage is decayed and uncertain
    as part of the original ancient form.
- id: claim:2
  claim: The Little Russian legend cited in the note shares the broad function of
    explaining the disappearance or transformation of the last bogatyr, though by
    conscription rather than petrification or mutual slaughter.
  claim_level: same_function
  target: Little Russian legend of the last bogatyr caught by a recruiting officer
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only a one-sentence summary of the Little Russian
    legend.
- id: claim:3
  claim: The main ending in which Ilya and Cloudfall turn to stone is comparable within
    the passage to the cited Siberian variant where heroes turn to stone in mountains
    and caverns.
  claim_level: same_motif
  target: Petrified hero ending in the main text and the Siberian variant note
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The main text names Ilya and Cloudfall, while the cited variant describes
    each hero reaching mountains and turning to stone; the textual note questions
    the variant's antiquity.
