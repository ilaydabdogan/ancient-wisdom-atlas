canonical_text:
  quote: ''
  summary: The passage recounts Ilya of Murom's thirty-year immobility, his healing
    and empowerment by three holy wayfarers, his commission to defend the Christian
    faith and go to Kief, his proof of strength, his preparation of the horse Cloudfall,
    and his encounter with Svyatogor's pavilion, speaking horse warning, and Svyatogor's
    crystal casket containing his heroic wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilya is described as dwelling on an oven for thirty years without arms or
    legs because of his grandfather's sin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilya's father and mother leave him alone in the cottage while they go to clear
    forest-girdled meadows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Three wayfarers, identified as Christ and two apostles in the guise of poor
    brethren and psalm-singers, come to Ilya and ask him for drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilya says he would gladly give them drink but cannot rise and has no one else
    in the cottage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wayfarers tell Ilya to arise, wash, walk, and fetch drink; he rises, walks,
    fills a cup with kvas, and brings it to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the wayfarers drink and give the cup back to Ilya, he drinks and reports
    feeling such great strength that he could move the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a second round of drinking, Ilya reports that his strength is about
    half the former strength, and the wayfarers say this is necessary because mother
    earth could not bear more.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wayfarers say God has blessed Ilya with strength, instruct him to defend
    the Christian faith, warn him not to contend with Volga, Svyatogor, or Mikula
    Selyaninovich, and tell him to go to royal Kief; then they vanish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ilya goes to his father in the clearing, takes the axes, fells in one hour
    what others could not have done in three days, drives the axes into a stump, and
    later draws them out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ilya buys a shaggy brown foal, feeds it fine white Turkish wheat, waters it
    from a pure spring, binds it for three nights in the garden, anoints it with three
    dews, and the foal becomes a heroic steed able to bear him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ilya saddles the steed Cloudfall, prostrates himself, receives his parents'
    farewell blessing, and rides out over the open plain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ilya comes to a white linen pavilion under a damp oak, finds a very large
    heroic bed, ties Cloudfall to the oak, and sleeps for three days and nights.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Cloudfall hears a mighty clamor from the north while the earth rocks, forests
    stagger, and rivers overflow, and the horse speaks with a human voice to warn
    Ilya that Svyatogor is coming.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ilya wakes, releases his horse, and climbs into the damp oak.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Svyatogor arrives taller than standing woods with his head among the clouds,
    carrying a crystal casket on his shoulder, and opens it with a golden key.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Svyatogor's heroic wife steps out of the crystal casket, sets a table, lays
    a cloth, provides sugar viands and mead, and feasts with Svyatogor before he sleeps
    in the pavilion.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:17
  text: Svyatogor's wife roams the open plain and sees Ilya in the damp oak.
  category: action
  evidence_refs:
  - ev:12
