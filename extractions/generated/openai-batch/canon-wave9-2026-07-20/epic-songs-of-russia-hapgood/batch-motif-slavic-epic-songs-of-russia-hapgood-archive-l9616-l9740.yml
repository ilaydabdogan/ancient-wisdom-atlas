canonical_text:
  quote: ''
  summary: The Tzaritza admits Solomon into the palace, hides him in an iron-bound
    chest when Tzar Vasily arrives, and urges Vasily to kill him. Solomon persuades
    Vasily to build a scaffold with three nooses and obtains permission to blow his
    horn three times. The horn calls his forces, who rescue him, hang Vasily, the
    Tzaritza, and Guest Tarakashko, seize Tzargrad, and return with Solomon to Jerusalem.
  language: English
  quote_policy: summarized
