canonical_text:
  quote: ''
  summary: Volga Vseslavich is born in Holy Mother Russia as the son of Marfa Vseslavievna
    and a Dragon. His birth disturbs earth, beasts, birds, and fish; as an infant
    he asks to be armed rather than swaddled. Later he learns wisdom, cunning, and
    languages, gathers a band of heroes, repeatedly changes shape to capture animals
    when his men cannot, scouts the Turkish ruler in bird form, hears a dream omen
    and invasion plan, sabotages the enemy armory and horses in animal forms, returns
    to Kief, and leads his body-guard to capture the Turkish host.
  language: English
  quote_policy: summarized
