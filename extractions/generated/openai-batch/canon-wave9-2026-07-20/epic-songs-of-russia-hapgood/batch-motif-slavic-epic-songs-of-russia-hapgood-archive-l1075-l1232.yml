canonical_text:
  quote: ''
  summary: Prince Vladimir grants Volga three towns. Volga rides with his guard to
    take possession of them, meets an extraordinary husbandman with a powerful mare
    and ornate plough, recruits him as a companion, and with him subdues rebellious
    townspeople who had refused tribute and attempted a treacherous bridge trap. On
    the return journey, the husbandman's mare easily outpaces Volga's horse.
  language: English
  quote_policy: summarized
