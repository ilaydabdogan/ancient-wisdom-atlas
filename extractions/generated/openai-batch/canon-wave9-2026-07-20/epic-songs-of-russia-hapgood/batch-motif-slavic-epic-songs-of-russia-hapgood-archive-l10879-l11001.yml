canonical_text:
  quote: ''
  summary: Appendix commentary interprets Mikula as a peasant, thunder, and agricultural
    figure; discusses heavenly agricultural implements and Slavic ideas of princely
    power from tillers of the soil; identifies St. Nicholas/Mikola as a Christian
    successor in agricultural devotion; and interprets Svyatogor as an Elder Hero,
    giant, cloud-mountain, and seasonal figure whose winter sleep and related episodes
    are compared with several other mythic and legendary traditions.
  language: English
  quote_policy: summarized
