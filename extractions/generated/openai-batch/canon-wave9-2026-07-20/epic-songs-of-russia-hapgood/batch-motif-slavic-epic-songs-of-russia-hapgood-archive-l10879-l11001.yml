candidate_motifs:
- id: motif:1
  label: thunder deity as agricultural benefactor
  taxonomy_refs:
  - culture_hero
  basis: The passage links thunder, rain, ploughing, and agriculture through Mikula
    and a Thunder-deity who assists agriculture.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is commentary and explicitly says the mare interpretation
    is probable, so the motif should be reviewed against the underlying song tradition.
- id: motif:2
  label: heavenly agricultural implements confer rulership
  taxonomy_refs:
  - royal_legitimacy
  basis: The Scythian tradition summarized in the passage connects possession of a
    heavenly plough and golden implements with imperial power.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This motif is introduced as a comparative tradition, not as an episode
    directly narrated in the Russian epic passage.
- id: motif:3
  label: plough raised to the heavens as constellation
  taxonomy_refs:
  - ascent
  basis: The passage says Russian peasants see the plough Mikula hurled heavenward
    in Orion.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage concerns a tool's celestial
    placement rather than a hero's ascent.
- id: motif:4
  label: peasant origin of princely power
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage states that Slavic traditions derive princely powers from simple
    tillers of the soil.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents this as a broad Slavic traditional pattern rather
    than a single narrated episode.
- id: motif:5
  label: Christian saint replaces older agricultural figure
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says St. Nicholas/Mikola has taken Mikula's place as Christian
    deity of agriculture.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact Christianization or syncretism category;
    sacred_exchange is only an approximate fit.
- id: motif:6
  label: giant of the Holy Mountains as cloud-mountain
  taxonomy_refs:
  - cosmic_mountain
  basis: Svyatogor's name is linked to dwelling in the Holy Mountains, which the passage
    interprets mythologically as clouds, and he is later called a giant cloud-mountain.
  evidence_refs:
  - ev:10
  - ev:14
  confidence: medium
  cautions: The passage says the earthly referent of the Holy Mountains is unknown,
    and the cloud interpretation is editorial/mythological commentary.
- id: motif:7
  label: mythic succession of elder giants by younger heroes
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage says Elder Heroes make way for Younger Heroes and connects this
    with recurring conflict between light/darkness and summer/winter.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: Seasonal_cycle fits the passage's explanation but the direct motif is
    heroic succession.
- id: motif:8
  label: winter death or sleep of a cloud giant
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: The passage says Svyatogor dies, becomes fettered with cold, and falls into
