    and that rain associated with a thunder-deity led to agricultural divine functions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says traditions in several countries preserve the idea that gods
    set the example of ploughing.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage summarizes a Scythian tradition reported by Herodotus in which
