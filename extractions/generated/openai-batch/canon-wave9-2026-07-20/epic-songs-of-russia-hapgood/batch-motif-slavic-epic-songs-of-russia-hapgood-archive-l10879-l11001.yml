comparison_claims:
- id: claim:1
  claim: The passage compares Mikula-related plough imagery with traditions in which
    agricultural implements descend from heaven.
  claim_level: same_motif
  target: Herodotus' Scythian tradition of a heavenly plough, golden axe, yoke, and
    cup
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made in editorial commentary and the Scythian material
    is reported at a high level, not quoted in full.
- id: claim:2
  claim: The passage links possession of heavenly agricultural implements with imperial
    or princely power.
  claim_level: same_function
  target: heavenly agricultural implements as signs of rulership in Scythian and Slavic
    interpretive contexts
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Scythian imperial-power claim and the Slavic tiller-origin claim
    are adjacent but not identical traditions.
- id: claim:3
  claim: The bridge episode in the epic commentary is said to strongly resemble a
    Chronicle episode at the bridge of Ovruch.
  claim_level: same_motif
  target: Chronicle episode at the bridge of Ovruch where Oleg Svyatoslavich perished
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief comparison and does not narrate the
    bridge event in detail.
- id: claim:4
  claim: The passage reports a possible identification of Svyatogor with Svyatopolk
    of Great Moravia.
  claim_level: historical_contact
  target: Svyatopolk, legendary hero of Great Moravia in the Chronicle of Kosma of
    Prague
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The passage presents this as Hilferding's suggestion, prompted by a
    rhapsodist's naming, not as established identity.
- id: claim:5
  claim: The Elder Heroes yielding to Younger Heroes are compared with Titans yielding
    to Gods and Jotuns yielding to the Asa.
  claim_level: same_function
  target: Greek Titans and Gods; Norse Jotuns and Asa
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The claim concerns structural analogy in mythic generations, not evidence
    of contact or inheritance.
- id: claim:6
  claim: The passage compares Svyatogor's father with Polyphemus as an easily tricked
    giant.
  claim_level: same_function
  target: Polyphemus
  evidence_refs:
