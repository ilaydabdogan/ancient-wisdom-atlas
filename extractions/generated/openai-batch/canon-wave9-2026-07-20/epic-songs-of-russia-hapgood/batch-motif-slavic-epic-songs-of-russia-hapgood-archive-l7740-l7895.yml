canonical_text:
  quote: ''
  summary: The passage opens with a broad geographic panorama and describes Mother
    Volga flowing from beneath trees and a jacinth stone into the sea. A fleet of
    thirty-three dark-red ships sails from Kaders/Kadol Isle toward the Dnieper. The
    leading ship is richly decorated with animal and dragon imagery and carries Nightingale
    Budimirovich, his mother Ulyana Vasilievna, and three hundred youths. Nightingale
    plays the gusly, commands navigation past reefs to Kiev, lands with metal landing
    stages, presents treasures to Prince Vladimir and Princess Apraxia, and receives
    hospitality. When Vladimir offers reward, Nightingale asks instead for a small
    plot in the royal gardens to build three golden-crowned towers, and Vladimir grants
    permission.
  language: English
  quote_policy: summarized
