canonical_text:
  quote: ''
  summary: The introductory prose argues that the Gathas should be read in relation
    to their remote historical period and comparatively rude civilization. It sketches
    Zarathiutra/Zarathuj-tra as devoted, courageous, violent when necessary, persistent
    under misfortune, and respected in family life though otherwise little is known.
    It describes his sphere as including political leaders, social orders, religiously
    minded men, a priesthood, and a population amid disturbed times in which Vistaspa's
    throne was insecure.
  language: English
  quote_policy: summarized
