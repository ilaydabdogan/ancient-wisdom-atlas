canonical_text:
  quote: ''
  summary: The passage invokes sanctity, Ahura's lore, and the Fravashis of the saints;
    asks that Sraosha, peace, generosity, reverence, truthful speech, and Righteous
    Order prevail over their opposites; describes the Bountiful Immortals seeking
    worship, praise, sacrifice, and homage; asks that glory, abundance, offspring,
    and companionship remain in the house; prays for glorified bodies to go to Heaven
    and approach Mazda; and sends liturgical prayers between heaven and earth against
    Angra Mainyu and other evil beings.
  language: English
  quote_policy: summarized
