canonical_text:
  quote: ''
  summary: The passage presents a Yasna liturgical section addressed to the Bountiful
    Immortals and religious institutions. The speaker worships Ahura Mazda, Zarathustra,
    and other sacred beings with sacrifice; declares institutions associated with
    divine qualities, the Kine, Fire, Sraosha, Rashnu, Mithra, Wind, Religion, and
    prayers; seeks true religious speech, prophetic usefulness, good thoughts, good
    words, and good deeds; praises the good waters and Apam-napat; and sacrifices
    to Sraosha.
  language: English
  quote_policy: summarized
