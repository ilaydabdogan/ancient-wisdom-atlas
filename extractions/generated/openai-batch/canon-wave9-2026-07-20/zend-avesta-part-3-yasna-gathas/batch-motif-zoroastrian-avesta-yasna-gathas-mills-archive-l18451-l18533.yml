canonical_text:
  quote: ''
  summary: 'The passage closes an invocation to Asha Vahishta and Fire, then presents
    the Uzayeirina Gah: the ritual speaker professes Mazdayasnian allegiance, hostility
    to the Daevas, and devotion to the Lord''s lore; offerings of sacrifice, homage,
    propitiation, and praise are directed to Ahura Mazda, Apam-napat, Mazda-created
    waters, ritual lords and functionaries, celestial bodies, truth, lore, creation,
    and Fire. The next Aiwisruthrima Gah begins with a similar confession and dedication
    to named ritual lords.'
  language: English
  quote_policy: summarized
