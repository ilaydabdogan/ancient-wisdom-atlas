canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction on editing and interpreting the
    Gathas. It argues for cautious textual emendation where readings are corrupt,
    warns against forcing either excessively subtle or shallow meanings, characterizes
    the Gathas as religiously profound though difficult in expression, and recommends
    comparing the Avesta with the Veda while warning that analogous words in the two
    traditions need not have identical meanings.
  language: English
  quote_policy: summarized
