canonical_text:
  quote: ''
  summary: 'A first-person ritual speaker repeatedly offers complete and sacred offerings:
    Haoma, Haoma-juice, wood-billets, perfume, Haoma-water, fresh milk, Hadhanaepata,
    Baresman, spoken prayers, Gathas, Mathras, and other ritual elements. The offerings
    are directed toward the Fravashi of Zarathushtra, Ahura Mazda''s Fire, Mazda-made
    waters, the Bountiful Immortals, heavenly and earthly Yazads, the individual soul,
    named ritual lords, Mithra, Asha Vahishta, Sraosha, Rashnu, moon phases, and yearly
    festivals.'
  language: English
  quote_policy: summarized
