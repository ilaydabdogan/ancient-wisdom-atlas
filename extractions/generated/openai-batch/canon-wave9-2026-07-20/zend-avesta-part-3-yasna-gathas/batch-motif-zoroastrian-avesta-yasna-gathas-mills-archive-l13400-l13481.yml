  summary: A Yasna ritual passage calls for proper ritual speech and expands the sacrifice
    through repeated worship of Ahura Mazda, Zarathushtra, Yazads, righteous religions,
    named divine qualities, Fire, waters, heavenly lights, the soul of the Kine, Mithra,
    Sraosha, Rashnu, Fravashis, wind, heaven and earth, the Mathra, stars, and righteous
    works in which dead souls find satisfaction.
