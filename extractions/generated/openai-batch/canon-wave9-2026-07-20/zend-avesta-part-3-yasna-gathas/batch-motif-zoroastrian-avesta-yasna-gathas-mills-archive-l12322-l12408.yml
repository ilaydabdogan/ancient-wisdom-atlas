canonical_text:
  quote: ''
  summary: An editorial introduction discusses the relative date and revival of H(a)oma
    worship and compares it cautiously with Indian Soma practices. In the hymn, H(a)oma
    comes to Zarathustra at the Havani hour while Zarathustra serves the sacred Fire
    and sings the Gathas. Zarathustra asks the beautiful man who he is. H(a)oma identifies
    himself as holy and death-driving, asks to be prayed to, prepared, and praised.
    Zarathustra asks who first prepared H(a)oma and what reward followed. H(a)oma
    says Vivanghvant first prepared him and gained the birth of Yima, whose rule brought
    freedom from death, drought, age, cold, heat, and envy.
  language: English
  quote_policy: summarized
