canonical_text:
  quote: ''
  summary: A hymn-section repeatedly worships Sraosha, called Obedience, as a blessed,
    stately, victorious ritual chief. The passage attributes to Sraosha the first
    spreading of the Baresman bundles, the first chanting of the Gathas of Zarathustra,
    the building of a mighty house for poor men and women, victory over hostile beings,
    and sleepless guardianship of Ahura's creatures, Asha's homes, and the corporeal
    world after sunset. It also describes Sraosha as welcomed in a dwelling from which
    destructive terrors depart, and as a companion among the Bountiful Immortals.
  language: English
  quote_policy: summarized
