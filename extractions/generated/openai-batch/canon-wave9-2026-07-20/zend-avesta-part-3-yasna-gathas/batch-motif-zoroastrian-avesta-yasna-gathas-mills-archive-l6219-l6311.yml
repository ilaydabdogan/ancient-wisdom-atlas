canonical_text:
  quote: ''
  summary: The passage presents commentary and translation around Yasna XLIII. Zarathustra
    or the speaker contemplates accepting Ahura's call, knowing it will bring suffering.
    He asks to be inwardly ready before going forth with new truths, seeks long life
    and divine aid, asks for Sraosha and abundant grace as allies, and intends to
    rouse chiefs and gather believing priests. The passage ends with rejection of
    pleasing the wicked and a communal prayer that Order, Piety, and Good Mind grant
    rewards and strengthen the faithful community.
  language: English
  quote_policy: summarized
