canonical_text:
  quote: ''
  summary: A scholarly introduction argues about the chronological development of
    Zarathustrianism, the later Avesta, and the Gathas. It discusses Media, Persia,
    Bactria and the East, Greek knowledge around Herodotus, Darius's inscriptions,
    the Magi at Cyrus's time, and a footnote about the false Bardiya and temples permitted
    by old Mazda-worship.
  language: English
  quote_policy: summarized
