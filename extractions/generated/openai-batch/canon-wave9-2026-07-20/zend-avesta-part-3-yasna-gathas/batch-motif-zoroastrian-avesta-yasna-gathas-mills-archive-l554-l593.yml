  summary: The passage summarizes part of the Gathas as beginning with a feminine
    wail to Ahura and Asha, followed by Zarathujtra's appointment for her redemption
    and his prophetic work. It describes subsequent lamentations, prayers, praises,
    and exhortations by Zarathujtra and associates, then contextualizes the hymns
    among agriculturists and herdsmen for whom land, cattle, raids, and rapine were
    central concerns. It also notes an organized Daeva-party struggle against the
    Zarathiutrians, including battle and violence.
