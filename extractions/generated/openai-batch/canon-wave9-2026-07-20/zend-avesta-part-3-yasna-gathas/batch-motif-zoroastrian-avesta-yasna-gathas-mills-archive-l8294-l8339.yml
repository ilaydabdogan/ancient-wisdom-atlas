canonical_text:
  quote: in the Lie's abode for ever shall their habitation be.
  summary: The passage contrasts an enduring habitation in the Lie's abode and a fall
    from the A'inva Bridge to woe with hope for penitent former foes. It describes
    some among Turanian and Fryana groups arising to further settlements of Piety,
    with Ahura dwelling with them through Good Mind and delivering commands. It also
    says that one who propitiates Zarathustra Spitama with gifts is fit for proclamation,
    receives life from Ahura Mazda, and helps settlements thrive in mental goodness.
    A translator's note interprets the passage as evidence for conversion and alliance
    of a border tribe.
