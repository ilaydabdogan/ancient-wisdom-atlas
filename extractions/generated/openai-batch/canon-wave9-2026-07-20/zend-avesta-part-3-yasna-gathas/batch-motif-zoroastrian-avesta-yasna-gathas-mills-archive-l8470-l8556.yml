  summary: Introductory and exegetical material for Yasna XLVII describes Spenta Mainyu
    as Ahura's spirit, the grouping of divine powers, Ahura's gift of happiness and
    immortality, the mediation of divine attributes such as Best Mind, Order, Royal
    Power, and Piety, the symbolic Kine provided with meadows, and the punishment
    of the wicked.
