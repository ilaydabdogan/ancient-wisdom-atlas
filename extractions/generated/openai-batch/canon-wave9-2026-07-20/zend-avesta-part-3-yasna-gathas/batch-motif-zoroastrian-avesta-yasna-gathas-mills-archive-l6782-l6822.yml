  quote: ''
  summary: Commentary on Yasna XLIV describes a questioning speaker who asks Ahura
    about the alternation of day and night, moral duty, Piety, Good Mind, the purified
    Realm, the kine, the origin of Piety and the Realm, the prosperity of the soul,
    the sanctification of Religion, the revelation of Daena or Insight, and the realization
    of Aramaiti among those who receive the holy Insight.
  language: English
  quote_policy: summarized
