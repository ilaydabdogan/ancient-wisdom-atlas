canonical_text:
  quote: ''
  summary: The passage comments on and paraphrases Yasna XXXIV 6-15. The speaker distinguishes
    Ahura's kingdom from the Daevas, asks for a sign and helpers, interprets the checking
    of enemies and the withdrawal of personified moral powers from sinners as divine
    favor, prays for guidance in worship and the paths of the Good Mind, recalls the
    Kine, and asks for sovereign power to relieve distress and bring Frashakanf, a
    completed condition of human progress.
  language: English
  quote_policy: summarized
