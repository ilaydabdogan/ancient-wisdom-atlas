canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction arguing that Pahlavi translations,
    glosses, Sanskrit and Persian successor translations, and Vedic comparison are
    necessary for interpreting and restoring the Gathic Avesta. It also sketches a
    history of manuscript transmission, script reform, and collection of surviving
    Zend-Avesta writings under several historical rulers and traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage treats rendering the Pahlavi as a necessary prelude to rendering
    the Avesta and recommends using Asiatic translations of the Pahlavi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Neryosangh's Sanskrit translations and later Parsi and Persian translations
    are said to require reading in light of their Pahlavi originals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that original translations compared with an improved Gathic
    rendering studied in light of the Veda coincide to a considerable degree, while
    Pahlavi indications may sometimes be more correct than Vedic-derived surmises.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pahlavi is described as less highly inflected and therefore unable to render
    the Avesta literally; its translators are said not always to follow the Gathic
    or Zend order, though they often follow outward word forms.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage argues that rejecting Pahlavi translations because they contain
    errors is defective, using Sayawa and the Rig-veda as an analogy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Text restoration and translation are presented as interdependent, and Pahlavi
    translations are described as evidence for determining which words stood in older
    manuscripts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The oldest named manuscript in the passage is the Copenhagen manuscript numbered
    5, dated to 1323 CE.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Aiv/a Viraf is cited for the report that Alexander's servants found skins
    at Persepolis on which the Avesta had been traced in gilded letters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that it is not positively proved that Herodotus' informants
    heard Magian priests singing theogonies from written books.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: A sixth-century period is described in which Zend characters were modified
    from Pahlavi into a more lucid form, short vowels replaced unknown signs, and
    manuscripts were collected, copied, and re-edited.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Earlier collection stages are attributed to Adarbad Mahraspend under Shapur
    II, to servants of Artaxerxes the Sasanian when Zarathiutrianism was made the
    state religion, and to Arsacid direction to gather extant documents.
  category: sequence
  evidence_refs:
  - ev:6
