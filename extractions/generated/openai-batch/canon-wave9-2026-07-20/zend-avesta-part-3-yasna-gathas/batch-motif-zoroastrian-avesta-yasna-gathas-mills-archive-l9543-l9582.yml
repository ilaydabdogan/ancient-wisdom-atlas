  summary: An editorial discussion considers whether the Gathas should be attributed
    chiefly to Zarathmtra or to a hypothetical unnamed prime mover. It argues that
    the Gathas are substantially one person's work, compares named figures such as
    Vutaspa, Frashaortra, and Gamaspa, and weighs Zarathmtra's prominence as a leading
    religious figure, possible composer, and person described through the idea of
    being chosen by God.
