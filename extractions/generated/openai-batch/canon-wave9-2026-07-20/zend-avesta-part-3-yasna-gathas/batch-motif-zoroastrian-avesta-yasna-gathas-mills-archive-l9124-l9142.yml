  quote: ''
  summary: A petition asks when Righteousness will come with home-like amenities and
    pastures, who will grant quiet from cruel evil men, and to whom Good Mind's sacred
    wisdom will come. The answer names the Saviours of the Provinces, who act through
    Good Mind's grace, mental keenness, Ahura's commandment, and Holy Order, and who
    are set as foes of hate.
