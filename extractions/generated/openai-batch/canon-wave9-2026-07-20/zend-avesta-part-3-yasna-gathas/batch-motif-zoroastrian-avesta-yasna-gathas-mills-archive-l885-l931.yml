  summary: A scholarly introduction weighs eastern and western locations for Zarathustra's
    activity. It notes a late tradition placing Vlrtaspa in Bactria, arguments based
    on analogies between Avestan and Vedic language and myth, counterarguments from
    West Iranian inscriptions and western transmission of sacred books, and a general
    statement that myths and religions migrate.
