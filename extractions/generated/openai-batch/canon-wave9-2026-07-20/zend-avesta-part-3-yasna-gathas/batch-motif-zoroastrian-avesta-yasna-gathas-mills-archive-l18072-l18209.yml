canonical_text:
  quote: ''
  summary: The passage gives rules for expelling a disciple who fails to provide required
    Myazda offerings, followed by blessings for royal province-chiefs, prayers for
    victory over evil and Daeva-worshipping foes, invocations of temporal and seasonal
    ritual lords, and a Gatha-related confession and worship of Ahura Mazda, the Amesha
    Spenta, the Gathas, and the Fravashis of the saints.
  language: English
  quote_policy: summarized
