- id: obs:3
  text: After the expulsion rule, the passage instructs the Ratu to decry and drive
    out the offender and to lay expiating deeds upon him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states a blessing formula identifying Righteousness as the Best
    and as weal.
  category: speech
  evidence_refs:
