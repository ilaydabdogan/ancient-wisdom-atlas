canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction arguing that an early Mazda-worship
    existed in primeval Iran before Zarathushtrianism, that Asura/Ahura worship moved
    with Indians from Iran into India, and that Iranian worship later differentiated
    into older Mazda-worship and Zarathushtrian forms. It discusses Darius as possibly
    adhering to an older or modified form and locates Zarathushtra's personal labors
    in the North-east with the Gathic dialect.
  language: English
  quote_policy: summarized
