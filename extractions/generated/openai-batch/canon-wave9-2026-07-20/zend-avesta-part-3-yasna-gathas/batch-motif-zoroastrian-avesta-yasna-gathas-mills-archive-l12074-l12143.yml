canonical_text:
  quote: ''
  summary: A Yasna liturgical passage enumerates complete and sacred offerings or
    blessings to seasonal and ritual lords, Ahura Mazda, Mithra, celestial bodies,
    fire, waters, plants, sacred utterance and law, mountains, personified blessings
    and curses, lands and cosmic regions, calendar lords, and finally the Myazda meat-offering
    for the propitiation of Sraosha.
  language: English
  quote_policy: summarized
