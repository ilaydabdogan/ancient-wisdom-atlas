  summary: The preface explains the author's comparative philological method for rendering
    the Gathas and related Avesta materials, including consultation of Pahlavi, Sanskrit,
    Persian, Zend, and Vedic materials. The author anticipates criticism from opposed
    scholarly schools, emphasizes the difficulty of a perfect translation, hopes to
    aid scholarly agreement about Gathic and Zend writings, and states that the Yasna
    and Avesta are clear in creed.
