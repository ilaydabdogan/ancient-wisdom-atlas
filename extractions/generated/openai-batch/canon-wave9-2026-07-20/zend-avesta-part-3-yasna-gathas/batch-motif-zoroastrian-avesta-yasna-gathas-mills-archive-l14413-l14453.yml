canonical_text:
  quote: ''
  summary: The passage repeatedly invokes and worships the Fravashis, souls, and other
    spiritual aspects of holy persons, including next of kin, dead and living saints,
    unborn future prophets, departed household members, teachers, disciples, holy
    children, and all saints. It extends this worship from Gaya Maretan, called the
    first created, to the victorious Saoshya/2t, and includes notes on the relation
    between Fravashi and departed soul and a comparison to Adam and Christ of the
    resurrection.
  language: English
  quote_policy: summarized
