canonical_text:
  quote: Counsel well then (together), with the mind of Armaiti ... and act with just
    action.
  summary: 'The passage praises Ahura’s founding of the Faith of the Saoshyant, then
    presents a wedding-related exchange: the master of the feast addresses Pouruista,
    daughter of Zarathustra, saying that a male partner is given to her as a helper
    in sacred service and urging the pair to counsel together and act justly. She
    answers that she will love and vie with him because he gained her from her father.'
  language: English
