canonical_text:
  quote: ''
  summary: A Visparad liturgical sequence summons Mazdayasnian leaders, holy beings,
    and ritual officiants; exchanges priestly formulae; offers worship, confession,
    and sacrifice to divine and sacred powers; invokes the Chinvat Bridge, Heaven/Best
    World, a better path, primordial created elements, Fire, ritual implements, and
    Apam-napat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chiefs of the Mazdayasnians, Bounteous Immortals, pious Saoshyants, Fire-priests,
    warriors, and the husbandman of the Mazdayasnian Faith are summoned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ritual speakers identified as Atarevakhsha, Ratu, and Zaotar exchange formulae
    about speaking forth, and the Zaotar says he will recite the Staota Yesnya with
    memorised intoning, chanting, and praise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sacrifice is directed to thoughts, wisdom, sanctity, religious knowledge,
    health, and the entire holy creation; confession is made for the Kine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker approaches the Bountiful Immortals as a praising priest, invoker,
    memoriser, reciter, and chanter for sacrifice, homage, propitiation, and praise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker offers the flesh of his body and the blessings of his life to
    the Bountiful Immortals, then confesses belief in Ahura Mazda as a Mazdayasnian
    of Zarathustra's order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Amesha Spenta or Bountiful Immortals are called and worshipped by names
    of beauty with ritual order and righteousness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Correct sacrificial words, Sraosha, Ashi, Nairya-sangha, Peace, the Fravashis
    of the saints, the Chinvat Bridge, and the Garo Nmana of Ahura are worshipped.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A better path leading to the Best World is sacrificed to, and Arstat, Rashnu,
    Mithra, and Parendi are worshipped.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Heroism and Mazda-made Sleep are worshipped.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ancient institutions are described as formed before the sky, water, land,
    plants, and Kine; the sea Vouru-kasha, stormy wind, and shining heaven are worshipped.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Fire is worshipped as Ahura Mazda's son, together with the Baresman bearing
    the Zaothra and girdle, and Apam-napat is worshipped as son of waters.
  category: action
  evidence_refs:
  - ev:11
