canonical_text:
  quote: The word Yasna means worship including sacrifice.
  summary: The passage introduces the Yasna as the chief liturgy of the Zarathiutrians,
    combining confession, invocation, prayer, exhortation, and praise. It describes
    the Yasna as a composite arrangement of fragments from different ages, with the
    Gathas sung in its middle and the Visparad interpolated within it in the Vendidad
    Sadah. It notes uncertainty about the Yasna's earliest form while affirming the
    antiquity of its present arrangement, and defines the word Yasna as worship including
    sacrifice.
  language: English
  quote_policy: quoted
