  summary: The passage is a scholarly introduction arguing that metre can aid the
    division of Avesta texts into original text and gloss, but warning against dogmatic
    attempts to force exact syllable counts. It discusses ancient poetic composition,
    possible later regularization by priests or reciters, comparison with Vedic hymn
    metre, Haug’s changed attitude toward Pahlavi translators, and the need for balanced
    study of opposed interpretive schools.
