canonical_text:
  quote: ''
  summary: The passage describes a wished-for divine destination where Piety, Righteous
    Order, Good Mind, and Mazda are present. The speaker, identified with Zarathustra,
    announces measured praise and homage, addresses Gamaspa Hvogva, invokes Mazda
    as discerner of lawful and unlawful things, and states that those who offer sanctity
    or righteous help receive gifts and rewards, while oppressors receive anguish.
  language: English
  quote_policy: summarized
