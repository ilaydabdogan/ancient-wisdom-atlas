canonical_text:
  quote: Teach Thou us the paths through Righteousness
  summary: The speaker asks Ahura Mazda to teach the paths through Righteousness,
    described as the path of Good Mind and associated with religious precepts and
    laws of the Saviours. The passage says the welldoer thrives through Righteousness
    and that the path marks a reward for the good, bestowed by Ahura. It connects
    bodily life, deeds of Good Mind, labor for the mother Kine, merciful care, understanding,
    and the word of Order. The speaker asks Mazda to reveal best truths, words, actions,
    and confessing prayer, and to make life progressive through Sovereign Power and
    grace.
  language: English
  quote_policy: quoted
