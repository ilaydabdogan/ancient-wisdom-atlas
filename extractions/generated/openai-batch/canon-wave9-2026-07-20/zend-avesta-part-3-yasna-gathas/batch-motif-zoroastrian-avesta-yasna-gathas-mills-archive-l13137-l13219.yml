canonical_text:
  quote: ''
  summary: The speaker denounces the Daevas as evil and abjures them, their adherents,
    their thoughts, words, actions, seed, shelter, and headship. The speaker presents
    Zarathustra's abjuration in consultation with Ahura Mazda as a model, declares
    belonging to the sanctity associated with waters, plants, the Kine, Ahura Mazda,
    and the Zarathustrian creed, identifies as a Mazda-worshipper, praises good thought,
    good speech, and good deed, and praises the Faith of Mazda. The passage closes
    with the beginning of an invocation to Ahura Mazda.
  language: English
  quote_policy: summarized
