canonical_text:
  quote: ''
  summary: The passage praises Ardvi Sura Anahita as a holy, Ahura-aligned water power
    effective against Daevas, worshipped with sacrifice, beneficial to living things
    and settlements, and purifying male seed, female wombs, childbirth, and milk.
    It describes her immense waters flowing from high Hukairya to the sea Vouru-kasha,
    stirring its gulfs, with many tributaries and outlets, including one dividing
    toward the seven Karshvars. The saints' Fravashis are invited to draw near in
    relation to these waters. The waters are denied to various evildoers and are invoked
    as torment against them. The closing section concerns proper priestly offering
    and ritual words for the good waters, as taught by the Aethrapaiti and shown by
    Ahura Mazda to Zarathustra.
  language: English
  quote_policy: summarized
