canonical_text:
  quote: ''
  summary: The passage contrasts two spirits and says that the Demon-gods cannot make
    a righteous choice. While they question and debate in council, the Worst Mind
    approaches to be chosen; afterward they rush to the Demon of Fury to pollute or
    disease mortal life. Aramaiti then approaches with Sovereign Power, Good Mind,
    and Righteous Order, and gives a body to the spiritual creations of good and evil.
    A preceding sentence describes Righteousness clothing himself with the firm stones
    of heaven and those who content Ahura through faithful actions.
