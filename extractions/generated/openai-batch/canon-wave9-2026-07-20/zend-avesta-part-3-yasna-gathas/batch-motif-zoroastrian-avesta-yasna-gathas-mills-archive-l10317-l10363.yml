canonical_text:
  quote: ''
  summary: The passage speaks of gifts and blessings from the Good Mind for the cause
    of Righteous Order. Kavi Vistaspa is said to have attained a wisdom conceived
    by Ahura in accordance with Asha to teach salvation. Frashaostra presents a blessed
    and beloved child or form, whom Ahura Mazda is asked to grant, and the people
    are urged to receive her for the good Religion and the gaining of Asha. Gamaspa
    is addressed as holy wisdom is being chosen by pious throngs, though the sentence
    is interrupted by notes.
