canonical_text:
  quote: ''
  summary: Editorial introduction to Yasna XLV describes the hymn as a doctrine of
    dualism and homage to Ahura. It says an assembly from near and far is summoned
    to hear and ponder; an adversarial evil teacher and his creed have been defeated
    and silenced; and the hymn reiterates that social evils are not originated or
    tolerated by Ahura but are attributed to the personified Anger of the Daevas,
    the evil Mainyu or Angra Spirit, separated from Ahura by a fixed gulf.
  language: English
  quote_policy: summarized
