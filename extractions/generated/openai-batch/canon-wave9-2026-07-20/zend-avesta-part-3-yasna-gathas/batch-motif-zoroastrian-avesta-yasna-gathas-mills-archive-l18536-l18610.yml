  quote: ''
  summary: 'A liturgical passage from Gah IV names recipients of propitiation and
    sacrifice: saintly Fravashis, women with many sons, enduring prosperity, Strength,
    the Ahura-given victorious Blow, ritual lords, Ahura Mazda''s Fire, ritual implements,
    waters and plants, vows for the soul, Zarathustra, the Mathra Spenta, the Kine''s
    soul, the Zarathustrotema, priests, warriors, tillers, chiefs, youths, household
    figures, holy women and men. It repeatedly frames these recipients as holy or
    ruling within the ritual order.'
  language: English
  quote_policy: summarized
