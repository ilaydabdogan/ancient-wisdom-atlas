canonical_text:
  quote: ''
  summary: The passage condemns an unnamed woman who wrongly eats Haoma's offering,
    gives a declaration of allegiance to good thought, word, deed, obedience, and
    the saint over their opposites, and presents Zarathustra praising Mazda-made Haoma.
    Haoma plants are praised in mountain and valley settings; sacred liquor is poured
    from a silver cup to a golden chalice. Haoma's songs, teachings, and ritual words
    are described as health-imparting, victory-giving, and healing. The Kine is praised
    and asked to receive food and pasture. Haoma is worshipped as a yellow lofty one
    who advances settlements and drives death afar, along with the Haoma plants, their
    blessedness, and the Fravashi of Zarathustra Spitama.
  language: English
  quote_policy: summarized
