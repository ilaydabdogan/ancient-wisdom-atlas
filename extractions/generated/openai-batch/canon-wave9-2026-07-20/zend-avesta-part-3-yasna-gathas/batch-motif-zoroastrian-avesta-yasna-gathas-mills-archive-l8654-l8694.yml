  quote: ''
  summary: The passage addresses Mazda about the bestowal of joyful meadows connected
    with Aramaiti’s peace and counsel with Good Mind. It then contrasts rewards and
    blessings for the good with harm to the wicked, and contrasts a feeble man’s freedom
    to give kindly obligation to a saint with the wealthy/ruling evil man’s service
    to the wicked. Translator notes discuss Aramaiti’s relation to piety, meadows,
    Kine, earth, pasture care, and a comparison to Y. XXXIII, 6 and the Vendidad.
