canonical_text:
  quote: In the Gathas all is sober and real.
  summary: 'The passage argues that the Gathas are earlier than the later Avesta and,
    more importantly, differ from it in atmosphere. It characterizes the Gathas as
    practical and realistic, with only rhetorical or poetic divine exceptions: the
    Kine''s soul wails, and the Deity with His Immortals speaks, hears, and sees.
    It denies monsters, dragons, fabulous defenders, and miracles except inspiration,
    presents named figures as historical-like, and contrasts the Gathas with the Yashts
    or Vendidad as reality versus fable. It then begins to classify sections of the
    hymns by tones of struggle, suffering, fear, anger, and confidence in Zarathustra''s
    career.'
  language: English
  quote_policy: quoted
