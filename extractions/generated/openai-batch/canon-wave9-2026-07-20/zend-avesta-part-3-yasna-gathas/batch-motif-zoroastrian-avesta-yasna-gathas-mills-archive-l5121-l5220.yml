canonical_text:
  quote: ''
  summary: The speaker petitions Ahura for an exemplary righteous person who cares
    energetically for cattle and belongs in the fields and pastures of Righteous Order
    and Good Mind. The speaker renounces disobedience, Evil Mind, arrogance, falsehood,
    and neglect of the Kine’s meadows; invokes Ahura’s Obedience for help, long life,
    and straight paths where Ahura Mazda dwells; and seeks to know from the Best Spirit
    what is fitting for the working of fields.
  language: English
  quote_policy: summarized
