canonical_text:
  quote: ''
  summary: In this excerpt of Yasna XXIX, the Kine asks Righteousness/Asha how her
    guardian was appointed and who was chosen as a skilled, energetic cattle-chief
    able to protect her from the wicked. Asha answers that such a hate-free and capable
    chieftain was not obtainable and speaks of hidden influences related to lofty
    fires and of invocation toward the mightiest being. Zarathuitra then intervenes,
    describing the Great Creator/Ahura as mindful of past and future deeds of demongods
    and men and as the discerning arbiter whose will determines the outcome. The excerpt
    closes with the speaker’s soul and the soul of the mother Kine beginning a supplication.
  language: English
  quote_policy: summarized
