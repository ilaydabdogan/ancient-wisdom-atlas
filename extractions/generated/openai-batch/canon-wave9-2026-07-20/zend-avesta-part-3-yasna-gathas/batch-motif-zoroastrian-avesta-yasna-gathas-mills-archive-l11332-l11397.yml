canonical_text:
  quote: ''
  summary: The passage presents a Yasna ritual sequence in which the speaker approaches
    named offerings, ritual implements, sacred substances, prayers, and divine or
    sacred recipients with praise for propitiation and contentment. Offerings include
    Baresman, Zaothra, Myazda, Haoma, Parahaoma, sacred wood, perfume, Haoma-water,
    fresh milk, and Hadhanaepata. Recipients include Ahura Mazda, the Bountiful Immortals,
    Sraosha, the Fravashi of Spitama Zarathustra, Fire as Ahura Mazda's son, and the
    Mazda-made waters.
  language: English
  quote_policy: summarized
