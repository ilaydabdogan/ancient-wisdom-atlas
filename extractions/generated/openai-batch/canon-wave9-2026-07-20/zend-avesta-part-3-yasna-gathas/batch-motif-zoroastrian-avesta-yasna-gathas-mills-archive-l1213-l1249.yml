canonical_text:
  quote: ''
  summary: The passage is a scholarly introductory argument about the relative dating
    of the Gathas, the later Avesta, and the Vedic Hymns. It notes similarities of
    metre, grammar, word structure, and related gods, demons, heroes, and myths between
    Vedic and Avestan materials, while arguing that the Gathas' absence of Aryan gods,
    including Mithra and Haoma, and their abstract conceptions help place them later
    than the oldest Riks. Zarathustra is treated as historically present in the Gathas,
    and the passage rejects an explanation based on a sudden dismissal of older gods
    or a religious schism causing Indian migration south.
  language: English
