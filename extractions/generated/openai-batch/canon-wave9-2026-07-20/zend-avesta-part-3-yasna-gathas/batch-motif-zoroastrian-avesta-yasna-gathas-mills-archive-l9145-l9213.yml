  summary: The provided extract is Mills's English heading and commentary for Yasna
    XLIX, with preceding notes. It frames the chapter as dealing with reverses and
    hopes, honor to Frashaostra and other chiefs, a setback for the party of Asha,
    conflict with the border chief B^wdva/B^zdva and Druj/Drug-worshippers, the role
    of Ahura's weapons, a rival priestly-judicial system, and a dualistic opposition
    between Righteous Order and the Lie-demon.
