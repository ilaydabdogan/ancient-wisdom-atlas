  text: The passage addresses an Ahurian daughter of Ahura and offers her a Zaothra
    with Haoma, milk, and Hadhanaepata, including as satisfaction if she has been
    offended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zaothra is asked to approach for milk and libation as health, healing,
    progress, growth, ceremonial merit, renown, equanimity, and victory that advances
    settlements.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The worship uses sacrifice and Zaothras associated with good thought, good
    word, and good deed for enlightenment, preparation of the soul, settlement advancement,
    and preparation of meritorious saints.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker asks the Ahurian One for Heaven and for manly, legitimate offspring
    who will promote house, village, tribe, province, and their authority.
