  text: Milk and libation are also described as opposing a Daeva-made Dragon, arresting
    the Pairika, and contradicting hostile or unholy figures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ahurian daughter of Ahura is asked to hear sacrificial chants, be propitiated
    by the Yasna, be present, and come to help during the offering of Zaothras.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Good waters are said to give a pious sacrificer splendour, glory, health,
