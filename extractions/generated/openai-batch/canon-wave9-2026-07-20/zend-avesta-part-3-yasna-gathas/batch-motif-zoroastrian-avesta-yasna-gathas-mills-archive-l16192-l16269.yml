canonical_text:
  quote: ''
  summary: A ritual address offers Zaothra with Haoma, milk, and Hadhanaepata to the
    Ahurian daughter of Ahura and to the waters. The speaker asks for acceptance,
    healing, growth, ritual merit, settlement advancement, Heaven, and legitimate
    offspring. The passage sacrifices to the sea Vouru-kasha and all earthly waters,
    names the good waters created by Mazda, and says milk and libation make waters
    flow and plants sprout while opposing hostile beings including a Daeva-made Dragon.
    It concludes that good waters reward a pious sacrificer with glory, health, possessions,
    a legitimate scion, long life, and the best heavenly life of the saints.
  language: English
  quote_policy: summarized
