  quote: ''
  summary: The passage calls listeners to hear Ahura Mazda, described as all-wise,
    as conceiver of Righteous Order and ruler of truthful speech. A shining flame
    is associated with guidance and signs of decision or grace. The deceiver of a
    saint is assigned destruction, darkness, foul food, and lowest speech, while Ahura
    Mazda gives Universal Weal, Immortality, and the Good Mind's might to one who
    is His friend in spirit and deeds.
