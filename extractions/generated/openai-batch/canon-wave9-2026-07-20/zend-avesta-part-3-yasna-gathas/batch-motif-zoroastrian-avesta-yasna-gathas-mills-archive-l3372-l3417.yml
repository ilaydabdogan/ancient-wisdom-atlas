  summary: The passage introduces Yasna XXXI as a composition on the progress and
    struggles of the cause. It frames the section as a hymn chanted by a sage before
    a multitude, summarizes a division of addresses to the congregation, the faithful,
    and Ahura, and describes early verses in which sacred truths are resisted by a
    hostile party but valued by Mazda-devotees. It also summarizes a regulation prepared
    by Ahura Mazda in response to the lament of the soul of the Kine, concerning the
    struggle of two parties and the success of Righteous Order.
