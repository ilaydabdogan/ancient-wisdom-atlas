canonical_text:
  quote: ''
  summary: The passage summarizes Yasna XXXII.55 as a denunciation of delinquents
    and opposing leaders who threaten the composer’s teachings, the sacred Kine, the
    Sun, productive land, saints, and inheritances. It names Yima, Gndima, the Kavis,
    Ahura, Asha, the Lie-demon’s kingdom, Divine Khshathra, a fire-priest, and Weal
    and Immortality. It announces divine judgment, describes a two-party doctrinal
    conflict, and expresses hope that the righteous will be borne to heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The composer says the delinquents do not know the destruction awaiting them,
    while Ahura is aware of it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The composer names Yima as an apostate connected with the first introduction
    of cattle-flesh consumption and disavows community with him and the other opponents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An opposing leader is said to impair the composer’s teachings and damage property
    described as sacred to the holy cause.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The opposing leader is said to threaten the teachings, blaspheme the Sun and
    sacred Kine, injure productive land, and bring murder among the saints.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The composer laments attempted slaughter, spiritual opposition, plots among
    the powerful, confiscation of inheritances of women and men, and efforts to injure
    his adherents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage announces divine judgment and reproaches treachery against the
    mystical Kine, while contrasting preference for GrAma and the Kingdom of the Lie-demon
    with Asha and Divine Khshathra.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gndima is described as desiring an evil kingdom in the abode of personified
    Hell, and the messenger of God will keep him away from the sight of Divine Righteousness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary describes a bitter conflict between two parties, waged with
    speech and weapons, and says the Daeva-party could not understand the dualism.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Kavis are described as approaching with stratagems and false teachings
    to aid the opposing party and as saying that the Kine is to be injured instead
    of blessed by the fire-priest at the altar-flame.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The composer hopes that he and his fellow-labourers will be borne to heaven
    by Weal and Immortality, described as the eternal two.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The composer entrusts events to Ahura, who is described as able to control
