  summary: The speaker seeks to discern and proclaim the truths and pure Daena/Faith
    of Ahura Mazda. He calls for attentive hearing according to Good Mind and Holy
    Order, asks who will serve as ally and kinsman-lord for instituting worthy praise,
    identifies Frashaostra as given guardian headship of Holy Order, and contrasts
    truthful or believing participants in recompense with the wicked.
