  summary: Editorial introduction to Yasna XLIII and the U-stavaiti Gatha. It explains
    the Gatha’s name, metre, and liturgical grouping; discusses the limited value
    of manuscript sequence and metre for relative dating; and argues that some passages,
    especially Yasna XLVI, portray Zarathustra amid early conflict, addressing adherents,
    chiefs, family connections, opponents, divine rewards, and condemnations.
