canonical_text:
  quote: ''
  summary: Liturgical passage from the Srosh Yast invoking and praising Sraosha/Obedience.
    Sraosha is described as victorious, mighty, Mathra-bodied, and lord of ritual
    order; he is said to have first adored Ahura Mazda in creation. The passage also
    honors good waters, the Bountiful Immortals, Blessedness, Nairya-sangha, Ahura
    Mazda, and the words and deeds of Zarathustra, and asks Sraosha to draw near and
    aid the worshippers.
