canonical_text:
  quote: ''
  summary: 'The passage states that Zarathustra Spitama''s prayer has been answered:
    Ahura Mazda may grant him desired boons from the good Order, including prosperous
    life of eternal duration, and may make those who deceived him disciples of the
    good Faith in word and deed. It then asks that Kavi Viitaspa, a Zarathustrian
    Spitama, and Frashaostra offer propitiation to Mazda in thought, word, and deed.
    Notes discuss the phrasing of the answered prayer, the interpretation of former
    deceivers, and the uncertain identity of the Zarathustrian Spitama.'
