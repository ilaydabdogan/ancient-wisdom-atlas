  summary: The passage asks to utter supplications for the Kine, contrasts a saint
    who recognizes a good and fruitful chant with a sinner who does not know it, worships
    Ahura Mazda, the Amesha Spewta, Asha Vahirta/Asha Vahista, prayers, and Heaven,
    and sacrifices to rewards of health, healing, increase, and victory through memorized
    recital of named prayers and good thoughts, words, and deeds.
