  quote: ''
  summary: Yasna LIII.7-9 addresses righteous women, speaks of recompense and a champion
    who helps the cause, calls for sinners and deceivers to be foiled, consumed, captured,
    and charged, and appeals to the righteous Lord/Mazda, whose power and kingdom
    bestow blessing on the right-living poor.
