  summary: The speaker declares through Ahura Mazda's flaming Fire a steel sword of
    justice made for both worlds, asks Ahura Mazda to bless an avenging saint against
    the wicked, identifies a life-threatening adversary as belonging to the Lie's
    creation, calls on Asha/Righteous Order for help, and addresses an assembly with
    questions about loyalty to Spitama/Zarathustra and inquiry of divine Righteousness.
    Notes in the passage mention alternative readings involving fire ordeal, molten
    metal, and related metal imagery.
