canonical_text:
  quote: Be Righteousness life-strong, and clothed with body.
  summary: The passage says that Ahura Mazda's saints have brought many sinners to
    him. In a prayer, Zarathuitra loves the Spirit and prays with bounteous men that
    Righteousness be strong and embodied, that Piety be present in a radiant holy
    realm, and that through Ahura Mazda's Good Mind she grant blessings as recompense
    for deeds. The included notes discuss alternative renderings and grammatical issues.
