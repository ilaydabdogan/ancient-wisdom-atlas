canonical_text:
  quote: ''
  summary: Mills’s introduction describes the Gathas as teaching internal or subjective
    future reward and punishment, then summarizes a sequence in which souls are created,
    Aramaiti gives bodies, a Mathra guides the well-disposed, the faithful learn from
    the Immortals, and the infidel ally with the Worst Mind and Daevas. The Kine,
    representing the holy people, laments oppression by Daeva-worshipping tribes.
    A note frames Zarathushtrian philosophy as centered on dualism and compares it
    to later Hegelian dualism through intermediate traditions.
  language: English
  quote_policy: summarized
