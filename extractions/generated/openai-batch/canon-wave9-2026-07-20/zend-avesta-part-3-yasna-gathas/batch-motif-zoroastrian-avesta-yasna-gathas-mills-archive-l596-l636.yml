canonical_text:
  quote: ''
  summary: A scholarly introduction summarizes the Gathic period as one of ongoing
    conflict in which Zarathustra and companions sought to establish a divinely governed
    kingdom that would relieve suffering, shelter the honest poor, follow holy Order,
    and aim at Weal and Immortality. It notes a restricted but present ritual hierarchy
    centered on sacramental fire, contrasts the human Zarathustra of the Gathas with
    later mythic portrayals in the Yajts, and includes a footnote on later protection
    of lower classes under the Sasanids.
  language: English
  quote_policy: summarized
