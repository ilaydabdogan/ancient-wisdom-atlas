canonical_text:
  quote: ''
  summary: The passage introduces Yasna XXX as a teaching hymn on the origin of good
    and evil. It describes listeners being urged to make an individual religious choice,
    two original spirits or principles called better and worse, their production of
    opposed conditions such as life and its absence, Heaven and Hell, and the separate
    choices of Ahura and the evil spirit. It also summarizes a scene in which Daeva-worshippers
    are influenced by the Worst Mind to choose the evil realm, and the commentary
    compares this with a temptation-and-fall pattern.
  language: English
  quote_policy: summarized
