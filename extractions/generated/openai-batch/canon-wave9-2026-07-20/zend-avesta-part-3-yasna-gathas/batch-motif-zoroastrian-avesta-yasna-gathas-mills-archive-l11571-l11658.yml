canonical_text:
  quote: ''
  summary: A ritual exchange of speech between Ratu and Zaotar introduces an offering.
    The passage lists good thoughts, words, deeds, Haoma, meat-offerings, Zaothras,
    Baresman, flesh, Haoma-juice, wood-billets, perfume, prayers, Gathas, and Mathras
    as offerings. These are presented to Ahura Mazda, Sraosha, the Bountiful Immortals,
    the Fravashis and souls of the saints, and the Fire of Ahura Mazda for sacrifice,
    homage, propitiation, and praise. The offerings are announced for the benefit
    and furtherance of a house, its herds, its men, those born, and those yet to be
    born.
  language: English
  quote_policy: summarized
