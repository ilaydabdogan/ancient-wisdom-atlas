  text: Ahura is described as all-bountiful and mighty, nurturing aids of grace that
    are given to wicked persons in hope of penitence and to the devout disciple.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The means of grace are associated with moral sanctity in thought, word, and
    deed, and with the flame of the holy Fire connected to national worship and holy
    order.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Good Mind of Ahura is said to approach the composer within these means
    of grace and give him strength.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The composer is said to conceive himself as beholding Ahura as chief of the
    two spirits and sovereign over other powers when the world was born.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ahura is described as establishing rewards and punishments whose issue extends
