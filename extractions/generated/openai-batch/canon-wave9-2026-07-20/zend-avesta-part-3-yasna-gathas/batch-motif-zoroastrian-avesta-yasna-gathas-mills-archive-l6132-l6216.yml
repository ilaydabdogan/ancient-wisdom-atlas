canonical_text:
  quote: ''
  summary: A commentarial passage on Yasna XLIII describes praise of Ahura as bountiful
    giver, source of grace, sovereign over powers, and establisher of rewards and
    punishments. It presents the speaker or seer as called by God, questioned by Sraosha/Obedience
    or personified conscience, fixed on the ideal Sacred Kingdom and Frashakard, and
    seeking religious knowledge, especially concerning the holy Fire and its offering.
  language: English
  quote_policy: summarized
