  summary: The passage addresses men who are learning religious incitations given
    by Ahura in happiness and sorrow. It contrasts the long wounding of the wicked
    with blessings for the righteous and says salvation will be their portion. A Pahlavi
    note interprets the passage in terms of the overthrow of the Drug and movement
    toward reward, Auharmazd, and Ashavahijt.
