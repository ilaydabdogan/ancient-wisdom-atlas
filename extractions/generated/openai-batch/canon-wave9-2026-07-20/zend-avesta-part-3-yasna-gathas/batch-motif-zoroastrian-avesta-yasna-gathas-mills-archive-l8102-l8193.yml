canonical_text:
  quote: Whom (had I) then but Thee, Thy Fire and Mind, Ahura!
  summary: The passage describes a righteous ruler or judge who lives by sacred duty
    and covenant, discerns the wicked, and is asked to pronounce vengeance against
    a hostile lord. It curses one who has power but fails to reprove guilt, placing
    him in the abode of the Lie. The speaker asks Mazda/Ahura who was set as guard
    when a wicked one hated him, naming Ahura, Fire, and Mind. The passage also asks
    that hostile harm against the speaker’s settlements not reach him but return to
    the aggressor.
  language: English
  quote_policy: quoted
