canonical_text:
  quote: ''
  summary: The passage worships the shining heavenly world of the saints, the milk-offering
    and libation that make waters flow and plants flourish, all waters, plants, good
    people, and beneficent Yazads. It describes the offerings as opponents of demonic
    and hostile beings, worships the earth or dwelling-place as bounteous Aramaiti
    together with Ahura Mazda as lord of the abode, and includes an individual prayer
    for helpful preserving influences to remain in the house through summer and winter.
  language: English
  quote_policy: summarized
