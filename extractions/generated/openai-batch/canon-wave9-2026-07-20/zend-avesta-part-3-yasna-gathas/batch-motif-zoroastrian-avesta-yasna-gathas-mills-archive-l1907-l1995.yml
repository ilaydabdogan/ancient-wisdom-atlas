canonical_text:
  quote: ''
  summary: In Yasna XXIX, the Soul of the Kine, identified in the passage with sacred
    herds, folk, and suffering provinces or masses, cries to Ahura and Asha about
    violence and asks for pasture or tillage. The commentary describes Ahura announcing
    Zarathustra as the selected guardian and teacher; the Kine's Soul questions his
    adequacy and expected a kingly helper, while the Bountiful Immortals or attending
    chieftains ask when an effective helper will come. Zarathustra accepts his office
    as priest and prophet, prays to Ahura for Sovereign Authority, Divine Order, Good
    Mind, quiet, happiness, and immediate help, and avows confidence in Ahura rather
    than the Daevas.
  language: English
  quote_policy: summarized
