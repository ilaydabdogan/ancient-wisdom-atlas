  quote: ''
  summary: The passage invokes the departure of Demon-gods and Goddesses and the dwelling
    of good Sraosha and Blessedness in a house sanctified by Haoma. The speaker praises
    Haoma during ritual pressures, grasps its shoots, crushes it, and praises the
    clouds, rains, mountains, earth, and lands associated with its growth. Haoma is
    described as a holy plant growing on mountains and as a source of righteousness
    and ritual fountains.
