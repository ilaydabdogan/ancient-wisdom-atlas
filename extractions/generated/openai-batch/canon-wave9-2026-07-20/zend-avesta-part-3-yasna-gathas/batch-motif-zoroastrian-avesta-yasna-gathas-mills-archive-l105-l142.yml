canonical_text:
  quote: ''
  summary: 'The preface explains the translator''s approach to the Gathas: avoiding
    a full commentary, using summaries and paraphrase to make the difficult material
    readable, and emphasizing that serious work on the Gathas and Avesta requires
    study of Vedic Sanskrit and Pahlavi commentaries. A cited authority describes
    the five metrical Gathas as extremely difficult within Indo-Germanic philology.'
