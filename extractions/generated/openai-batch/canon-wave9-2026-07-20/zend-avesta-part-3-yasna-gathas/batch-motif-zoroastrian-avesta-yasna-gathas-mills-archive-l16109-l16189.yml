canonical_text:
  quote: ''
  summary: A liturgical passage instructs Zarathustra to petition the waters and offer
    Zaothras, then prays to waters, lands, plants, divine beings, and Ahura Mazda
    for wealth, blessed offspring, Immortality, and Welfare/Weal. A following section
    offers a Zaothra with Haoma, flesh, and Hadhanaepata to the Ahurian One for propitiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An instruction addresses Zarathustra to pray the first petition to the waters
    and afterward offer sanctified Zaothras to the waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The waters are addressed as granting favor and flowing down for the bettering
    of the petitioner’s state with never-failing truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The petition asks for wealth of many kinds and for self-dependent offspring
    whom multitudes will bless and against whom no one prays for harm.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The petition extends to waters, lands, plants, Bountiful Immortals, Fravashis,
    Mithra, Sraosha, Rashnu, Fire, Apam-napat, and all Yazads.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bountiful Immortals are described as ruling and disposing aright, and
    as good beings, male and female, who give good things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Fire is called Ahura Mazda’s son, while Apam-napat is called a lofty lord,
    royal, and of fleet horses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The petitioner asks the holy waters and lands to grant the requested gifts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: A greater and better gift, identified as Immortality and Welfare, is requested
    from the holy Yazads.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ahura Mazda is invoked as maker of the Kine, plants, and waters, and is asked
    to grant Immortality and Weal through Good Mind in the doctrine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A Zaothra is offered with sanctity, together with Haoma, flesh, and Hadhanaepata,
    to the Ahurian One.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The offering to the Ahurian One is made for the propitiation of Ahura Mazda,
    the Bountiful Immortals, Sraosha, and the Fire of Ahura Mazda.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A translator note tentatively identifies the Ahurian One with Ardvi Sura Anahita
    and connects this with good waters addressed as Ahurian Ones.
  category: other
  evidence_refs:
  - ev:5
