canonical_text:
  quote: ''
  summary: Commentary identifies saving Saoshyants and named religious princes, including
    Zarathustra Spitama, as human combatants or vicegerents of the Immortals opposed
    to demonic rapine. The translation petitions Ahura/Mazda for knowledge of future
    conflicts and asks whether the champion of holy Order will smite the Demon-of-the-Lie
    or evil heretic. It links righteous offering, immortal life, blessing for men,
    affliction for Daevas, praise of the Lord, and enlightened teaching proclaimed
    through holy Order and Good Mind.
