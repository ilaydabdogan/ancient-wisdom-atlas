canonical_text:
  quote: ''
  summary: The passage presents a speaker addressing Ahura while also confronting
    the gathered people. He asks who is righteous, who is sceptical, and who is governed
    by Angra Mainyu. He condemns an opposing chief and the adherents of a Lie-demon
    or Lying Goddess, asks how she may be driven to Hell beneath or delivered to Holy
    Order and the saints, and then turns to a coming collision between hosts, asking
    which side Ahura will reward and who will be the champion leading the victors
    with weapon and Mathra for both worlds.
  language: English
  quote_policy: summarized
