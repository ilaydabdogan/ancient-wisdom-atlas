canonical_text:
  quote: ''
  summary: The passage comments on Yasna XXXI, describing a ritual decision mediated
    by Sacred Fire and holy ritual, a doctrine to be proclaimed for conversion, prayer
    to the Bountiful Immortals for a mighty kingdom against falsehood, requests for
    prophetic and judicial knowledge, praise of the Mathra or Word of God, Mazda as
    creator, father, controller, and judge, the Kine's path and free choice, struggle
    with Daeva-worshippers, inquiry into good and evil Spirits, and Ahura's omniscient
    observation of injustice and future events.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A satisfying decision is said to be given through the Sacred Fire and holy
    ritual, giving mental keenness to two contending parties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctrine is described as something to be proclaimed for the conversion
    of mankind, while the passage says the Gathas show only an effort to convert rather
    than a necessary restoration of all men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker addresses the Bountiful Immortals, called the Ahuras of Mazda,
    and prays for a mighty kingdom by which he might overcome personified falsehood
    among opposing Daeva-worshippers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker asks for prophetic and judicial knowledge about what ought to
    be done or what is about to happen soon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mathra is praised alongside the Word of God and the Sovereign Authority
    of Ahura.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The heavenly bodies are taken as evidence of the wisdom of the one who created
    Asha and the Good Mind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mazda is described as the supreme object of devotion, father of the Good Mind,
    creator of Righteous Order, and controller and judge of human actions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Piety is ascribed to Mazda, and Mazda is also said to be the creator of the
    Kine and Understanding.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ahura makes a path for the Kine, and the Kine's free choice is said not to
    be abolished by that path.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Kine selects the guardian appointed by Ahura, identified as a diligent
    and pious husbandman, and rejects the idle, free-booting nomad.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A struggle follows the establishment of the means of deliverance, and an ignorant
    Daeva-worshipper is heard beside God's spokesman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The pious mind is said to search and question both the evil Spirit and the
    good Spirit rather than judging them superficially.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ahura is said to gaze into all questions and to see the cruel injustice of
