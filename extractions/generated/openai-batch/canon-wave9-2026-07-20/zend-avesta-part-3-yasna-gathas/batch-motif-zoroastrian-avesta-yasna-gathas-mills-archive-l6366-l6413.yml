  quote: ''
  summary: 'The speaker addresses Ahura Mazda as mighty, bountiful, and supreme in
    the generation of life. Divine aids or awards are described as guarded by Ahura
    for both the wicked and the righteous. The passage links Ahura’s Fire, Holy Order,
    and the Good Mind’s power with moral recompense. It states that deeds and words
    receive rewards: evil is established for the evil and happy blessings for the
    good in the creation’s final change. The excerpt ends as a future divine coming
    in the last changing is introduced.'
