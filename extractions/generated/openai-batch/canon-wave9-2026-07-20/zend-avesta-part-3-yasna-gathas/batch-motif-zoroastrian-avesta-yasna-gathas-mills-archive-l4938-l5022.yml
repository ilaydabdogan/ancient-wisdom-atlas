canonical_text:
  quote: ''
  summary: 'Commentary on a Gathic prayer: the reciter asks for an enlightened, useful
    friend who will support believers and cultivate cattle; the speaker rejects disobedience
    and lying, invokes Obedience, seeks straight moral paths and knowledge from the
    Best Spirit about restoring fields, and summons Ahura, Asha, and Vohu Manah to
    attend an instructive royal listener.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reciter is described as praying for a sincere and useful friend to the believer,
    regardless of whether the believer is a chief, allied peer, or villager.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The requested friend is spiritually enlightened and should be keen, persevering,
    and brave in the cultivation of cattle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The requested friend is prayed to be supported in holy toil and to till and
    tend both ordinary valley pastures and spiritual pastures of Divine Benevolence
    where the mystic kine grazes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary says the composition returns to a first-person speaker and
    treats Zarathustra as the probable speaker, while noting possible textual uncertainty.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker rejects disobedience to God and arrogance, discontent, dishonesty,
    lying, and neglect of duties toward cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker invokes the personified Obedience and seeks long life in the kingdom
    of Divine Benevolence and straight paths of moral purity where Ahura dwells.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker seeks knowledge from the Best Spirit, with the best mind, concerning
    what should be done for the recovery and perfection of fields.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage connects the kine's need with good cultivation and identifies
    the sacred agriculturist or diligent tiller of the earth as a typical saint.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Reclaiming, irrigating, and cultivating land are ranked among primary human
    services; preparing gathered grain is said to make the Daevas start, shriek, and
    fly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ahura's Righteous Order, Benevolence, Power, and Piety are grouped as energizing
    Immortals, while Welfare and Immortality are described as rewarding personifications.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker asks Ahura, Asha, and Vohu Manah to come and behold an attentive
    monarch, the leading Magavan, as he listens to the speaker's instructions.
  category: speech
  evidence_refs:
  - ev:7
