  text: The speaker turns to sacramental Fire and symbolic flames as an outward emblem
    and also names Good Mind and Order.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker calls for ruin and lack of prosperity for the one who would destroy
