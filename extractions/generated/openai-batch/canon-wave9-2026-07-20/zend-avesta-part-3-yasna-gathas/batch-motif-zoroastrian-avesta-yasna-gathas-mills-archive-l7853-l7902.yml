  summary: The passage describes officials charged to warn Daeva-worshippers and oppose
    an evil chief, a penalty involving the Lie-demon for failing to act, an explicit
    moral opposition between good and evil, devotion to Ahura with sacramental Fire,
    a curse against a settlement-destroyer, a request for a helper, and final judgment
    imagery involving the faithful, the wicked, conscience, and the Judgment Bridge.
  language: English
