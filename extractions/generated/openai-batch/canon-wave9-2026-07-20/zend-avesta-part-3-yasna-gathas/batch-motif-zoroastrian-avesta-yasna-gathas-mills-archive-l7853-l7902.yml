literal_observations:
- id: obs:1
  text: Recognition for service against a heretical tyrant is described as supporting
    the people and sacred agricultural civilization, and prestige is to be returned
    to God as an offering for further service.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A righteous official is urged to repeat a proclamation as a warning to Daeva-worshippers
    and to secret adherents who may need encouragement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The charged official is instructed to assail the destructive opponent only
    after careful discrimination and to address the evil chief or hostile blood-kinsman
    distinctly from lesser nobles or peasant clansmen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A superintendent with the power to carry out the instructions but who fails
    to do so is said to be delivered to the bonds of the Lie-demon served by the evil
    kinsman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage states that there is no compromise in the dualistic moral creed:
