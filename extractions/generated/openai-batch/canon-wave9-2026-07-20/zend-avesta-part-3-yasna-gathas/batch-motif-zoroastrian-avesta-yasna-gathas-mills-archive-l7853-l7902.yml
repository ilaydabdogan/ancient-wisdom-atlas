- id: obs:8
  text: The speaker calls for a leading helper who can help magnify Ahura and advance
    the sacred cause.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker declares that he will not leave the faithful few who follow him
