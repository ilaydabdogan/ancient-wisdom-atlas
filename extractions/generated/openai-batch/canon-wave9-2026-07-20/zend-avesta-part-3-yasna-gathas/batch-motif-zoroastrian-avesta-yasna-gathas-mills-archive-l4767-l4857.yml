canonical_text:
  quote: ''
  summary: The passage condemns deceitful deeds that aid the wicked, mentions a false
    claim about conquering the Kine and a death-removing saving flame, declares that
    the Karpans' and Kavis' disciples will be driven away, and says righteous aiding
    saints will be borne by the immortal two to the heavenly home of Good Mind. It
    then describes the entire reward of the righteous as coming from the Best One,
    Mazda Ahura, who teaches in the wide mental light of the pious and rules supreme.
