canonical_text:
  quote: ''
  summary: The passage describes Zarathustra in discouragement and displacement, seeking
    how to satisfy Ahura/Mazda. It attributes his poverty in means and troops to the
    dregvawt/drugvawt, an enemy of the Holy Order who obstructs righteous livelihood
    and threatens ruin. Zarathustra cries to Ahura like the Kine, asks Mazda for grace
    and teaching, seeks the salvation-schemes of the Saviours, and turns toward action
    by urging a reward for the chief who expels the worlddestroyer.
  language: English
  quote_policy: summarized
