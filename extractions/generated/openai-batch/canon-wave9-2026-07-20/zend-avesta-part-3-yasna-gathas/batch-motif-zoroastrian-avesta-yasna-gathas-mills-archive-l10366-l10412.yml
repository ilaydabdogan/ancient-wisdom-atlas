canonical_text:
  quote: ''
  summary: A prayer asks Mazda to grant grace like that received by pious men who
    gain a kingdom governed by Good Mind. Kavi Vistaspa is described as heroic, wise
    through Religion, connected with established Sovereign Power, and as one who declares
    Ahura's laws for right living. The Bountiful Immortals are invoked to grant blessedness,
    strengthen Holy Order through Good Mind, reveal Piety's words, receive sacrifice
    and homage, and seek Ahura Mazda's grace.
