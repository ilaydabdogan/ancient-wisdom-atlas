canonical_text:
  quote: ''
  summary: The passage explains a sharp separation between Ahura/Mazda and the Daeva
    side, presents the two spirits as opposed principles connected with life and its
    negation, describes Mazda as revealer, father, rewarder, and judge, and portrays
    Zarathmtra or his substitute as proclaiming, praising, and serving Ahura. It also
    links faithful reception of the Mathra with Happiness and Immortality, and disobedience
    or wickedness with woe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A self-styled or recreant Mazda-worshipper is described as possibly using
    the sacred tenets of the religion to support a nefarious warfare and as being
    treated like a Daeva-worshipper by genuine adherents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prophet declares an utter severance between good and evil, God and Demon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two spirits are said to have come together at first to make life and its
    negation, while remaining in irreconcilable opposition and separate forever in
    attributes and interests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sage says he is proclaiming the first Mathra of this life, which all-wise
    Mazda revealed to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who do not act according to what the sage speaks and thinks are said
    to have this life end in woe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mazda is called the father of the Good Mind within His people when that Good
    Mind is active in good works, and practical piety is described as His daughter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Happiness and Immortality are described as the portion of those who listen
    to and ponder the revelation, and Ahura is said to approach them with rewarding
    actions of His Good Mind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Praise is presented as a greatest element that includes prayer and doctrinal
    confession, and Ahura is called on to listen and teach.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Living offerers, future people, and spirits of the just are said to seek spiritual
    blessings in eternal Immortality, while woe to the wicked includes outward discipline
    and inward grief.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Zarathmtra or his substitute professes eagerness to serve Ahura, says he has
    seen Him with his eyes in the sense of knowing Him through Righteous Order in
    his soul, and hopes to pronounce praises in the assembly and in the Home of sublimity
    or song.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ahura is described as approaching with the power of divine authority in weal
    or woe and blessing men and herds under the influences of Piety.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ahura is said to contemn the Daevas and their party, while the Saoshyawt/Saoshya^t
