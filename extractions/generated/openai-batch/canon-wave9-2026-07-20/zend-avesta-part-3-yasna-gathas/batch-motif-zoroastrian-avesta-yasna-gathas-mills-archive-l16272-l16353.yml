canonical_text:
  quote: ''
  summary: A ritual response asks that Mazdayasnian sacrificers and their communities
    receive knowledge of the correct and righteous path, protection from oppression
    and hostile raids, safe and joyful settlement, healing, blessings from Fire and
    the waters, and prosperity toward salvation. It closes with praise to Ahura Mazda
    and other sacred beings or cosmic entities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers identify the beneficiaries as Mazdayasnians offering sacrifice,
    including colleagues, disciples, Aethrapaitis, Aethryas, men, women, children,
    and maidens of the field who think good only.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A request is made for the desire and knowledge of the correct and straightest
    path, associated with Righteousness and the best life of the Saints.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer seeks the overwhelming of oppression and malice in raids of the
    invader and before foes who hate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Zaotar speaks a benediction for a safe, joyful, quiet, and long abode
    for the dwellers of the village from which the offerings come and for every Mazdayasnian
    village.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker asks for succour with wants, salutations of salvation, praises,
    and the fullest Yašt for Fire, called an Ahurian one of Ahura.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prayer asks for Raman Z/^astra for the province, for healthfulness and
    healing, and for a thousand and ten thousand healing remedies for the saintly
    person between heaven and earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Religious zeal, capability, and the waters are invoked through the Yasna;
    the waters are asked to grant splendour, glory, and an old helpful blessing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Praise is offered to Ahura Mazda, the Bountiful Immortals, Mithra, the fleet-horsed
    sun, a star described with the sun as Ahura Mazda's eyes, the Kine, Gaya Maretan,
    the Fravashi of Zarathustra, and the holy creation across present and future life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ahura is asked to cause the worshippers to prosper to salvation through Good
    Mind, Sovereign Power, and Righteous Order.
  category: speech
  evidence_refs:
  - ev:7
