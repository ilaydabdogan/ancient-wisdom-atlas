canonical_text:
  quote: ''
  summary: The passage addresses Mazda/Ahura with thanksgiving for blessings named
    as Immortality, Righteous Order, and the Kingdom of Welfare. Worshippers offer
    return-gifts, praise, and a meat-offering; the bountiful man gives back gifts
    of the Good Spirit by mind and deed, and his soul goes hand in hand with Righteous
    Order. The speakers also pray for Ahura's Fire, which helps the joyful house that
    receives it and harms the hater.
