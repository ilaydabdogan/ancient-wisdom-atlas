canonical_text:
  quote: ''
  summary: The passage contrasts oppressors and those ignorant of Righteous Order
    with Mazda’s Good Mind and Aramaiti/Piety. Piety departs from evil-doers, Good
    Mind brings a declared result, and Aramaiti increases Weal, Immortality, and Righteous
    Order. The speaker asks Mazda to declare his regulations, desired praise or offering,
    and the way to establish blessed rewards.
  language: English
  quote_policy: summarized
