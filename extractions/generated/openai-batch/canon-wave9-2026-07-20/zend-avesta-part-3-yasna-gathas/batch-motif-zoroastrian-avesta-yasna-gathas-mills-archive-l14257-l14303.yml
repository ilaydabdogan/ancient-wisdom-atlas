canonical_text:
  quote: ''
  summary: A liturgical passage presents offerings for sacrifice, homage, propitiation,
    and praise to the Bountiful Immortals, Fravashis of saints, Zarathushtra's Fravashi,
    righteous people, future prophets, the Fire of Ahura Mazda, and beneficial waters.
    It lists ritual substances and implements, including Haomas, Myazdas, Zaothras,
    Baresman, flesh, milk, Hadhanaepata, Haoma-water, mortars, wood-billets, and perfume,
    and closes by naming the Bountiful Immortals as righteous rulers who abide with
    the Good Mind.
