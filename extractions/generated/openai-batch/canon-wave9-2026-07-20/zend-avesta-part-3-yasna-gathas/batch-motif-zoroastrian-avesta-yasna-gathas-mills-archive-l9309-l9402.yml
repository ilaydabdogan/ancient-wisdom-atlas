  summary: A first-person speaker addresses Mazda/Lord concerning B^dva's evil judge,
    a deceiver estranged from Righteous Order. The speaker affirms a saving religious
    choice, prays for the sheltering leadership of Good Mind, rejects the allies of
    the wicked, describes evil schemers who support the Daevas, and asks Mazda and
    Righteousness to disclose divine intention.
