canonical_text:
  quote: ''
  summary: The passage introduces Yasna XXXII as a continued struggle amid reverses.
    A composer or subject faces the Daeva party, seeks to remain among Ahura's apostles,
    and receives Mazda's reassuring answer. The composer then denounces the Daevas
    and their worshippers as aligned with falsehood, perversion, Satan, and the Evil
    Mind. The Daevas are said to corrupt human minds and destroy hopes for earthly
    happiness and heavenly immortality, while Ahura's holy doctrines and divine Sovereign
    Power are presented as countermeasures.
  language: English
