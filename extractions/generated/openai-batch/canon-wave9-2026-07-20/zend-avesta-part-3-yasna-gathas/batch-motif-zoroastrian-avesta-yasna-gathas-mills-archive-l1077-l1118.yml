canonical_text:
  quote: ''
  summary: The passage presents a historical argument that eastern names in the Vendidad
    may indicate ancestral East Iranian homes and westward migration before Zarathustra.
    It suggests Zarathustra may have arisen and labored nearer the land of the Vedas,
    in a region associated with Vistaspa, lingering Daeva-worship, shared Irano-Indian
    divine names, and the separation of Indo-Aryans from Irano-Aryans. It then turns
    to dating the Gathas and later Avesta, comparing the later Avesta with the Cuneiform
    Inscriptions of Darius and noting later Avesta prohibitions on burial and cremation
    alongside a religion that left sepulchral monuments.
  language: English
  quote_policy: summarized
