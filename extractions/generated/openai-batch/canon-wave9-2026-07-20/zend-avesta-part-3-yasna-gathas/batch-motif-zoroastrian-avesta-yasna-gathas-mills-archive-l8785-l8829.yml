canonical_text:
  quote: whoever would hope for spiritual growth and purity must turn his mind to
    that word of the Deity
  summary: The passage comments on Yasna XLVIII by presenting Ahura’s teaching through
    inspired prophets, urging adherence to the divine word for purity and understanding,
    praying that an evil alliance with its monarch not prevail, praising righteous
    authority and order connected with care for the sacred Kine, describing the Kine
    as the support of household prosperity, and calling for resistance against Rapine,
    false priests, and tyrants while awaiting Aramaiti and Khshathra.
  language: English
  quote_policy: quoted
