  summary: A fragmentary question asks about the first consequence and final doom
    connected with false dealing. The main stanza asks whether Daeva-worshippers have
    ever ruled as worthy kings, describes them as fighting for those who act amiss,
    says the Karpan and Usij(k) gave the sacred Kine to Rapine, notes Kavian flourishing
    in strength, and accuses these opponents of not providing tribal wealth, blessings,
    or waters to the fields for the Kine and Righteous Order.
