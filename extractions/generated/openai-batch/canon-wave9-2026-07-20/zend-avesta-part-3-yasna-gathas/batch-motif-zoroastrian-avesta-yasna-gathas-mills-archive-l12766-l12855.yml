canonical_text:
  quote: ''
  summary: A speaker prays to Haoma, asking it to grow and grant healing and victorious
    powers. Haoma is described as praised, tasted, health-bringing, hostile to Daevas,
    aligned with friendship rather than rapine, divinely created and planted on high
    Haraiti, carried by birds to snowy peaks, growing in milky and golden forms, and
    mixed with milk to grant prosperity and mind. The speaker asks protection from
    maligners and renounces the murderous woman's or Caini's emptiness.
  language: English
  quote_policy: summarized
