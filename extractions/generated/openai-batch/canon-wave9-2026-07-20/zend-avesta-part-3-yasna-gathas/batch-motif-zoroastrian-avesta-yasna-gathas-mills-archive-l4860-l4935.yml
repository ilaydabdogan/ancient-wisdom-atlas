  quote: ''
  summary: The passage contains the close of Yasna XXXII with a first-person promise
    to act against the wicked by the word of the mouth in defense or vengeance of
    saints, followed by translator notes on possible renderings and identifications.
    The introduction to Yasna XXXIII frames the next section as prayers, hopes, and
    self-consecration, describes promised vengeance as near, discusses comparisons
    with other Yasna passages, and presents an editorial account of primeval law,
    dualistic opposition to evil, Ahura's relation to corruption, and the Ratu's severe
    treatment of evil and beneficence toward saints.
