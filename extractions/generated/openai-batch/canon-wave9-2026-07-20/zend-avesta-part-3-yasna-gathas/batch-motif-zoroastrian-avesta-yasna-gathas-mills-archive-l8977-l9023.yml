  summary: A prayer asks that an unnamed female referent prosper for life. She is
    said to grant pleasing homes and lasting strength, while Mazda/Ahura causes plants
    to flourish for her nurture. In a coming strife, her foes, the Wrath-demon of
    rapine, and envy plotting against the throne are to be overcome; the addressed
    adherents abide by Good Mind and holy Order and hold fast a refuge tied to a sacred
    bond.
