canonical_text:
  quote: ''
  summary: The passage combines commentary and translation around a Gathic address.
    It describes inquiries about averting calamities, contested rule, punishment for
    those who install an evil monarch, the distinction between righteous and wicked
    parties, truthful guidance from Ahura rather than a blind guide, warnings against
    opponents’ doctrines, vindication through a holy sacrifice or ordeal of Fire,
    the self-induced punishment of seducers of the righteous, and the faithful receiving
    happiness, immortality, Righteousness, and Good Mind. The translated verses present
    declared doctrines as harmful to adherents of the Lie but beneficial to those
    devoted to Ahura.
  language: English
  quote_policy: summarized
