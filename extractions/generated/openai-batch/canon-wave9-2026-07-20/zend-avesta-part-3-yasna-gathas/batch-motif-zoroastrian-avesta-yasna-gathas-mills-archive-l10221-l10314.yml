canonical_text:
  quote: ''
  summary: The passage asks who is fit to receive Piety and serve the Good Mind, identifies
    Zarathustra as worthy and resistant to impure approaches, describes the righteous
    conscience overcoming the wicked spirit at the Judgment or Chinvat Bridge, contrasts
    Asha's paths with the Home of the Lie, condemns the Karpans as harmful teachers,
    and begins to describe a reward connected with Ahura Mazda and the Song Home,
    Garoman.
  language: English
  quote_policy: summarized
