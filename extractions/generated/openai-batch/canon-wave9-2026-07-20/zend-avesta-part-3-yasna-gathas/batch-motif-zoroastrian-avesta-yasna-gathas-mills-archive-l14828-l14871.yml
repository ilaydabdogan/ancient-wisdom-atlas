canonical_text:
  quote: ''
  summary: The passage is a prayer to Ahura Mazda asking for wise, bountiful, and
    tender action; the reward appointed to the speakers' souls; blessings in both
    this world and the spiritual world; enduring fellowship with Ahura and Righteousness;
    righteous human helpers; trained beasts for work and companionship; social support
    from a kinsman lord, village laborers, and clients or peers; and the ability to
    be holy, true, and freely giving gifts. It then introduces the next section as
    a prayer to Ahura as king and life.
