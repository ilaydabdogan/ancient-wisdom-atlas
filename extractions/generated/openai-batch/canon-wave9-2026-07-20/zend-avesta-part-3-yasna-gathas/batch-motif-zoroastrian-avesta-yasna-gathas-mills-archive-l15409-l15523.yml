  quote: ''
  summary: The hymn worships Sraosha, recalls Haoma worshipping him on high Haraiti,
    describes Sraosha's radiant thousand-pillared house and sacred utterances associated
    with him, states that the Bountiful Immortals descend to the seven-quartered earth
    through his power, invokes him as teacher and protector, and depicts four supernatural
    racers carrying him swiftly from east to west while evading weapons.
  language: English
  quote_policy: summarized
