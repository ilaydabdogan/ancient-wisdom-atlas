canonical_text:
  quote: ''
  summary: The passage gives a calendrical instruction for a Rapithwina recitation,
    names genii connected with cattle and the Zawtu, invokes Ahura Mazda and other
    holy beings, and presents a dialogue in which Ahura Mazda invites Zarathustra's
    question. Zarathustra asks what reward belongs to a man who properly recites and
    sacrifices with the Rapithwina office, using washed hands and mortars, Baresman,
    Haoma, fire, the Ahuna-vairya, and Mathra-bound bodily preparation. Ahura Mazda
    answers that the reward is like the southern wind that makes the material world
    advance, increase, rejoice, and progress.
  language: English
  quote_policy: summarized
