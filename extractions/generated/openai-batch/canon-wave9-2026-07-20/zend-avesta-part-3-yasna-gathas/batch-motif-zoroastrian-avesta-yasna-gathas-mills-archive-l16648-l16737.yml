canonical_text:
  quote: ''
  summary: A Visparad passage repeatedly announces and completes a Yasna to lords
    of creature classes, yearly festivals, future settlements, ritual praises and
    offerings, seasons, sacred chants, fecund women, the Yasna Haptanghaiti with water
    Ardvi Anahita, and the Gatha Urtavaiti with shining mountains. Translator notes
    explain Visparad as referring to all chiefs or lords of the ritual and mark Ardvi
    Anahita as interpolated.
