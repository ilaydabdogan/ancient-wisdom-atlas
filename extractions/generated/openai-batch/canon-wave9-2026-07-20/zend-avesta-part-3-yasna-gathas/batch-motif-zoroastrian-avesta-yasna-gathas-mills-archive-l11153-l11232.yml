canonical_text:
  quote: ''
  summary: The passage opens with monthly, yearly, and seasonal festival references,
    then begins Yasna II, where a first-person ritual speaker repeatedly desires to
    approach the Zaothra and Baresman with worship and praise. Through these ritual
    objects the speaker approaches Ahura Mazda, the Bountiful Immortals, multiple
    named ritual or temporal powers, Mithra and Raman Hvastra, Righteousness the Best,
    Fire as Ahura Mazda's son, Apam-napat, holy water, the Fravashis of the saints,
    women with many sons, and prosperous household conditions.
  language: English
  quote_policy: summarized
