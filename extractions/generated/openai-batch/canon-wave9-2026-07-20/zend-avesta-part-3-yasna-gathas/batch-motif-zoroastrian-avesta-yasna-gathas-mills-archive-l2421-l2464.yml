canonical_text:
  quote: ''
  summary: The passage comments on a Gathic prayer in which the reciter petitions
    Ahura, Asha, and Vohu Manah for continued mercy, perseverance in service, and
    spiritual gifts. It describes those gifts as holy revelation and asks Ahura to
    speak the laws of the moral universe so the reciter may proclaim them. The passage
    says Ahura answers through a revelation of eternal principles that distinguish
    truth from falsehood.
