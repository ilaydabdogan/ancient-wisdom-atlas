  summary: 'The passage contains fragmentary ritual invocations: a petition that the
    dead arise and bodily life return to lifeless bodies; sacrifices to Ahura Mazda,
    the Bountiful Immortals, victory-associated powers, Zarenumat, the Glowing Mountain,
    and the Yazads; propitiation of the Kine''s body and soul during a milk-and-water
    offering rite; and praise, sacrifice, and pouring out addressed to created waters
    and Apam-napat.'
