  summary: The passage introduces Yasna LI as instructions and appeals to an assembly
    of the faithful. It emphasizes Ahura's sovereign authority over faithful worshippers,
    prayer for the establishment of that kingdom, appeals for blessing and protection
    through Aramaiti, public recitation of Gathas and Mathras understood as divinely
    inspired, invocation of four energising Immortals, and a communal plea for the
    Ratu or Saoshyarat associated with the Kine, Asha, and Ahura's promise.
