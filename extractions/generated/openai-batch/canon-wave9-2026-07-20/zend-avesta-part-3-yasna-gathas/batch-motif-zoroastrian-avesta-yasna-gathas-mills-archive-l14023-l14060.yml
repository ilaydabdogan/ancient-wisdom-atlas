  summary: The passage explains formulas within the Yasna. A word for the Yasna is
    attributed to Zarathustra; the worshipper offers sacrificial worship connected
    with Mazda and Ahura, with beings destined to live and holy females led by Aramaiti
    as homage to the Immortals. The Yasna is addressed to the Bountiful Immortals.
    Mazda pronounces salvation, Ahura is asked to grant it, and the answer of salvation
    applies to saints across time. The passage ends with sacrifice to the piece called
    YeNhe hatam.
