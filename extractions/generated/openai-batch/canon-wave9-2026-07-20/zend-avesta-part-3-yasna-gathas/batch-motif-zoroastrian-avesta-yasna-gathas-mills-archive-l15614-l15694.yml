canonical_text:
  quote: ''
  summary: A Yasna liturgical passage commits settlements and persons to protective
    worship, praises the righteous herd-owner as father and guard of the Kine and
    holy creation, asks the Bountiful Immortals to save holy men and saintly women,
    offers thoughts, words, actions, herds, and men to the Bountiful Spirit, invokes
    Ahura Mazda’s stars and Fire for health, Weal, and Deathlessness, and worships
    the Praises of the Yasna and Ahura Mazda’s celestial body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The worshippers say they will abide in worship, approach it, belong to it,
    and confide settlements and persons to it for protection, care, guarding, and
    oversight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner of herds is described as righteous, victorious, best, a bestower
    of blessings, and father of the Kine, the holy man, and sanctified creation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cattle-owner is asked to approach as a guard and watchman together with
    Righteous Order, nourishment, liberality, sharing of goods, gentleness, and Ahura
    Mazda’s sacred Fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bountiful Immortals are asked to save holy men and saintly women, and
    are described as ruling and disposing aright.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The worshippers offer their thoughts, words, actions, herds, and men to the
    Bountiful Spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The creative stars of Ahura Mazda the Creator are asked to shine down on and
    around the worshippers with full and healthy herds, settlements, and men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Fire of Ahura Mazda is praised and asked to come for help, joy-producing
