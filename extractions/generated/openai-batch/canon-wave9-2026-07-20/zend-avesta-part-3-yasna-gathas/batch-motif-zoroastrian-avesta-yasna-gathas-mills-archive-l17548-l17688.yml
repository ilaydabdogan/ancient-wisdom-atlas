canonical_text:
  quote: ''
  summary: The passage addresses stone and iron mortars as full of wise meaning, then
    gives ritual worship and sacrifice formulas for Ahura Mazda, the Bountiful Immortals,
    sacred words, Zarathustra, Gathic chapters, the Gatha Ahunavaiti, and the Ahuna-vairya.
    It instructs Zarathustrian Mazdayasnians to prepare feet, hands, and understanding
    for lawful deeds, husbandry, aiding the needy, and the service, memorisation,
    and recital of the Yasna Haptanghaiti, including victorious words for Ahura Mazda's
    Fire.
