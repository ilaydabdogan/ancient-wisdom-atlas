canonical_text:
  quote: ''
  summary: A group of miscellaneous fragments instructs a priest or Zarathustra to
    speak Yasna praise and sacrificial words; names holy beings, waters, plants, Fravashis,
    Yazads, and Thraetaona as recipients of worship or propitiation; contrasts good
    and evil thoughts, words, and deeds with Heaven and Hell; and proclaims the Airyema-ishyo
    prayer as supreme, while Ahura Mazda rules and Angra Mainyu with the Daevas is
    to be hidden beneath the earth.
  language: English
