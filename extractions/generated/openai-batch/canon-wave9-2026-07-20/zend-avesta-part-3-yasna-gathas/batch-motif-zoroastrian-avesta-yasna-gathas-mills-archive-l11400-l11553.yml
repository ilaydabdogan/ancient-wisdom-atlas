  summary: The passage is a liturgical enumeration in which the speaker repeatedly
    desires to approach named ritual times, divine beings, celestial bodies, natural
    elements, sacred words, offerings, Fravashis, and good Yazads with praise or a
    Yasht. It includes invocations of Ahura Mazda, Mithra, Fire, Sraosha, Rashnu,
    Haoma, Haurvatat, Ameretat, Mount Ushi-darena, calendrical festivals, stars, moon,
    sun, waters, plants, blessing, curse, and the Fravashis of saints.
