canonical_text:
  quote: ''
  summary: The speaker prays to approach with praise the Fravashis of saints, households,
    communities, divine beings, named ancient figures, the dead, kin, and the speaker's
    own soul. The Fravashis are described as preserving heaven, water, land, cattle,
    and unborn children. The passage includes homage to ritual lords and good heavenly
    and earthly Yazads because of Righteousness.
  language: English
  quote_policy: summarized
