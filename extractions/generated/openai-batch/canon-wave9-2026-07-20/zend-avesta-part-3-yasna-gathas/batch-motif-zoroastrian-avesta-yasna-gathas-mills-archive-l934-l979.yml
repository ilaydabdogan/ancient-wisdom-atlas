canonical_text:
  quote: "“there is no certain mention of Angra Mainyu, or of the Amesha Spewta, in
    the Inscriptions”"
  summary: The passage discusses whether the theology of the Inscriptions should be
    identified with Zarathustrianism. It argues that the Inscriptions may reflect
    Gathic Zarathustrianism or an early stage of Mazda-worship, but not the later
    fully developed Vendidad system. The absence of Angra Mainyu and the Amesha Spenta
    is emphasized, while the presence of Auramazda’s grace and possible references
    to Draogha, Mithra, and Anahita are noted.
  language: English
  quote_policy: quoted
