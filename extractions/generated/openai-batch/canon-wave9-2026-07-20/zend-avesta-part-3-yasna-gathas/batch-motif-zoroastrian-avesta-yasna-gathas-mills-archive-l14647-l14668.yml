  quote: ''
  summary: A prayer addresses Ahura Mazda and the Fire as primeval ones. The speakers
    approach the holy Fire in its house or service, warn that one who brings pollution
    to the flame will be covered with pollution in return, and ask the Fire of the
    Lord to grant zeal, approach them, and bring friendly blessing with praise.
