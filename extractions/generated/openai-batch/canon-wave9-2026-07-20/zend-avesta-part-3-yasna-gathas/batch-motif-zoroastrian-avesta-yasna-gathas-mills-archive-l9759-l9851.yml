canonical_text:
  quote: ''
  summary: The speaker asks that a Mathra-speaker, identified with Zarathustra, proclaim
    the righteous way and divine regulations. The speaker would yoke Ahura's swift
    servants or mighty ones to gain the Bridges, then approaches Mazda and Righteousness
    through worship, sacred speech, stretched hands, ritual Truth, Good Mind, and
    Yasnas of sacrifice. Translator notes identify the Bridge with the Cinvat Bridge,
    a crisis before salvation or perdition where souls meet their consciences.
  language: English
  quote_policy: summarized
