canonical_text:
  quote: ''
  summary: The passage characterizes Zarathustra's system as a growth from earlier
    conceptions rather than a repudiation. It says older Aryan gods recede before
    spiritual Ahura, while divine qualities such as Benevolence, Order, Power, Piety,
    Weal, and Immortality dominate the thought-world. It also describes the Gathas
    as dense and difficult, especially because divine attributes can appear both as
    personified gods or angels and as divine thoughts reproduced in human beings.
  language: English
