canonical_text:
  quote: ''
  summary: The passage explains the Ahuna-vairya or sacred word as a symbol to be
    learned and recited. Its recitation acknowledges Ahura Mazda as supreme, prior
    to mind, creator or director of mind, lord of actions, source of life's amenities,
    and ruler to whom creatures and the Kingdom are assigned. It also assigns a nourisher
    and protector to the poor. Ahura Mazda pronounces the Ahuna-vairya as best and
    effective; the evil one arises in opposition and is repelled by Ahura's interdict
    and renunciation of any harmony between them. The saying is further described
    as having three stages or measures, four classes of supporters, and five chiefs.
  language: English
  quote_policy: summarized
