canonical_text:
  quote: ''
  summary: The passage offers sacrifice to the good, heroic, bountiful Fravashis of
    the saints, to the heights of Asha Vahista, and to the greatest Mathras as sources
    of action, faithfulness to vows, just actions, and acquisition of the Mazdayasnian
    Faith. It also offers sacrifice to the assembly and reunion of the Bountiful Immortals
    on the heights of Heaven for the sacrifice and homage of Zaotuma, who is then
    addressed as the holy lord of the ritual order. Notes add that the Ahuna follows
    and that Zarathustra conquered the Demon with the Ahuna-vairya.
  language: English
