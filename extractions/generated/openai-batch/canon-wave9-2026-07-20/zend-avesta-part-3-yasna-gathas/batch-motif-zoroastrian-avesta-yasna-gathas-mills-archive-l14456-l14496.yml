  quote: We are offering saving acts of wisdom and of worship with the sacred gift
    of the Ahuna-vairya intoned with sanctity
  summary: A liturgical prelude to the Ahuna-vairya declares that the recital renders
    and furthers Ahura Mazda and beneficent beings, smites hostile wicked beings,
    accompanies the crushing of Haomas and sacrifice, invokes Sraosha as helper, and
    presents offerings of wisdom and worship with sacred implements.
