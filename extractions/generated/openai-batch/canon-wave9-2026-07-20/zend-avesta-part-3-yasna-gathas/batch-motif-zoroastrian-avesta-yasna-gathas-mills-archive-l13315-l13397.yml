canonical_text:
  quote: ''
  summary: 'The passage presents worship and sacrificial dedication within the Mazdayasnian
    ritual: Ahura Mazda is named as knowing the better service in sacrifice; holy
    men and women, the Ahuna-vairya, Asha Vahishta, and the Bountiful Immortals are
    worshipped; the ritual speaker comes as priest, invoker, sacrificer, reciter,
    and chanter; the speaker dedicates body and life-blessings to the Bountiful Immortals,
    approaches the holy Yazads with Zaothra and Baresman, confesses Mazdayasnian identity,
    and participates in a Zaotar-Ratu ritual exchange. The following section continues
    the sacrifice by calling the Bountiful Immortals and Sraosha.'
  language: English
  quote_policy: summarized
