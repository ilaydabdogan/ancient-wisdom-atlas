canonical_text:
  quote: ''
  summary: A first-person ritual speaker repeatedly says that, in the Zaothra with
    the Baresman and praise, he desires to approach named lords of ritual order, monthly
    and yearly festivals, moon phases, seasons, the three and thirty lords, Ahura
    and Mithra, celestial bodies, Fravashis, Fire, waters, plants, Mathra, the anti-Daeva
    law, the Zarathustrian religion, Mount Ushi-darena, all mountains, Glory, Ashi
    Vanguhi, Blessing, Curse, lands, places, and districts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage repeatedly uses a first-person formula of desiring to approach
    sacred recipients in the Zaothra with the Baresman and praise.
  category: speech
  evidence_refs:
