- id: obs:2
  text: Ushahina, Bere^ya, Nmanya, Sraosha, Rashnu, and Arcta^ are named among holy
    lords of ritual order; Sraosha is described as smiting with victory and furthering
    settlements, Rashnu as most just, and Arcta^ as furthering settlements and increasing
    them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Monthly festivals, new moon, waning moon, full moon, yearly festivals, and
    seasons are approached with praise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker desires to approach all lords of ritual order, described as the
    three and thirty nearest around the Havanis and as taught by Mazda and spoken
    by Zarathustra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ahura and Mithra, stars, moon, sun, Fravashis, and Fire are approached with
    praise; Fire is called Ahura Mazda's son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Good waters, best waters, and plants are described as Mazda-made and holy
    and are approached with praise.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bounteous Mathra, the law instituted against the Daevas, the Zarathustrian
    law, and the Mazdayasnian Religion are approached with praise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mount Ushi-darena, all mountains, Mazda-made kingly Glory, Ashi Vanguhi, and
    the Benefit conferred by Mazda are approached with praise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Blessing, the pious and holy man who utters it, and the mighty Curse of
    the wise are approached in the ritual.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage closes by extending the approach to waters, lands, plants, places,
    and districts.
  category: setting
  evidence_refs:
  - ev:9
