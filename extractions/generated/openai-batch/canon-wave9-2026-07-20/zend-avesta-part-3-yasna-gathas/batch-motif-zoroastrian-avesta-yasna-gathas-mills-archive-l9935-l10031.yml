canonical_text:
  quote: ''
  summary: The passage summarizes parts of Yasna LI and begins the translation of
    verse 1. It presents prayer-pressing men as temporarily like the Ratu, invokes
    Ahura/Mazda as awarder of good and evil, asks for inspired teachings and a fire-born
    sign of justice, contrasts righteous disciples with destructive opponents, recalls
    a temptation of Zarathustra, describes saving knowledge held by a king, priests,
    and a female saint, and praises divine government, order, and spiritual blessing.
  language: English
  quote_policy: summarized
