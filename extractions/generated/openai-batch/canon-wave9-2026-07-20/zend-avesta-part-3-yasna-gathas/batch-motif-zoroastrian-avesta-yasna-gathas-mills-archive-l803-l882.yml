  quote: ''
  summary: The passage is a scholarly introduction discussing the uncertain relative
    age and transmission history of the Gathas, possible interpolation by early disciples,
    the question of whether the Gathas originated in eastern or western Iran, the
    argument for a north-eastern Iranian setting, the role of Vendidad I geographical
    names in reconstructing early Iranian homelands, and the debated association of
    Zarathustra with Ragha and with named families and associates.
