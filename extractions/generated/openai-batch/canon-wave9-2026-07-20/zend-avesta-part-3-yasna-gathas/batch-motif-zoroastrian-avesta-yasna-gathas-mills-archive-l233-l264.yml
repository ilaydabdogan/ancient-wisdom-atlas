  summary: The prefatory passage explains editorial choices in using Westergaard's
    text, omitting repeated prayers and notes, and citing Pahlavi, Sanskrit, Neryosangh,
    and Persian renderings. The speaker argues that these Asiatic commentaries and
    translations should be consulted with reserve for traces of older explanations,
    not treated as exact reproductions or simple unbroken tradition.
