canonical_text:
  quote: ''
  summary: A Visparad liturgical sequence repeatedly worships and sacrifices to Ahura
    Mazda, Fire, the Amesha Spentas, Sraosha, Fravashis, Zarathiutra/Zarathurtra,
    saints, the sun, sacred speech, creation, waters, plants, and other holy entities.
    It affirms good thoughts, words, and deeds, blessedness and salvation for the
    holy, and ritual speech that withstands evil and subdues the Daevas.
  language: English
  quote_policy: summarized
