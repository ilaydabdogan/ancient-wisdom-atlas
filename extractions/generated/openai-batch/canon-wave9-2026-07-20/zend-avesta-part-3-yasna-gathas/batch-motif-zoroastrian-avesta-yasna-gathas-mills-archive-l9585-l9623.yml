canonical_text:
  quote: "“none other help than Thee and Thy saving Order”"
  summary: The passage is commentary on Yasna XLIX-L. It presents Zarathustra as the
    central figure, spokesman, and likely composer of the hymns; argues that certain
    verses are rhetorically placed in the mouth of the monarch Vistaspa rather than
    Ahura; and describes a crisis in which the speaker prays to Ahura, invokes named
    allies, relies on Righteous Order, asks how to further the sacred herds, and answers
    with advance against the enemy.
