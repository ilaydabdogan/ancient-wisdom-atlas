canonical_text:
  quote: ''
  summary: The passage presents a liturgical sequence in which the Ratu instructs
    qualified men to eat the Myazda meat-offering, invokes divine and sacred addressees
    for teaching in Righteousness, contrasts adherence to righteous words with the
    word of a magician, prays for Ahura Mazda's saving rule and for the empowerment
    of the holy over waters, plants, and sacred creatures, calls for the wicked to
    be stripped of power, has Zarathustra exhort community leaders to follow Ahura's
    religion in thought, word, and deed, and closes with propitiation to Haoma and
    ritual speech between Zaotar and Ratu. An editorial note compares Haoma with Soma
    and places the deity in a shared Aryan context.
  language: English
  quote_policy: summarized
