- id: obs:2
  text: The passage addresses the Bountiful Immortals, the Mazdayasnian law, just
    men and women, and the Zaothras, and asks that a Mazdayasnian desiring the liberality
    of Righteousness be further taught.
  category: speech
  evidence_refs:
