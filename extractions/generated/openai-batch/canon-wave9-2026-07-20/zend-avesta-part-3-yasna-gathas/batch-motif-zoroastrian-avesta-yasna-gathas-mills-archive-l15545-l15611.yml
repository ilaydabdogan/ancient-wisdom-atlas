  quote: ''
  summary: The passage worships Sraosha (Obedience) as blessed, mighty, victorious,
    embodied by the Mathra, armed as a warrior, and a smiter of Daevas. It praises
    houses guarded by Sraosha where he is welcomed and where a holy man advances in
    holy thoughts, words, and deeds. The following section introduces a ritual service
    described as protective worship whose results are good thought, speech, and deed,
    and which shelters worshippers from Daeva and the evil-minded man.
