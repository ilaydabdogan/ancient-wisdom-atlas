canonical_text:
  quote: whether by thought, or word, or deed
  summary: The passage completes a Yasna offering to natural and celestial domains,
    holy creatures, ritual Righteousness, time-lords, Fravashis, and Yazads. The speaker
    then acknowledges possible offense by thought, word, or deed, offers compensatory
    praise for any deficiency in the rite, and declares himself a Mazda-worshipper
    of Zarathustra's order and a foe to the Daevas.
  language: English
  quote_policy: quoted
