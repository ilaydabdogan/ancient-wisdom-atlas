canonical_text:
  quote: ''
  summary: The passage praises Mazda as producer and protector of holy creation and
    settlements, invokes Asha to grant blessing to holy worshippers according to good
    thoughts, words, and deeds, worships Righteousness, Good Mind, the Gathas, and
    the Praises of the Yasna, and introduces repeated invocations for Sraosha to be
    present for worship of Ahura Mazda, good waters, Fravashis, souls, Immortals,
    and Sanctity.
  language: English
  quote_policy: summarized
