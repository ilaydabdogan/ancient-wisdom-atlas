canonical_text:
  quote: ''
  summary: 'The passage introduces Yasna XXXIV as a thankful address in which the
    prophet offers Ahura gifts corresponding to gifts received: immortality, righteous
    order, and sovereign power. Offerings are described as ethical actions, prayer,
    praise, and a meat-offering made with homage. Fire is invoked and compared with
    Agni in a priestly function, and the desired kingdom is framed as holy action
    that nourishes the poor rather than enriching priesthood, princes, or poet.'
