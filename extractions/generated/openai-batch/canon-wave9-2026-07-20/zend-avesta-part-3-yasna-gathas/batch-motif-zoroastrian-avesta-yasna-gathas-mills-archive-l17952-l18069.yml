- id: obs:2
  text: The meal is consecrated by a priest and then eaten by those present.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Afrinagan performance is required at fixed times, including the six Gahanbars,
    the five Gatha-days, and the third day of the first month for Afrinagan Rapithwin.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Afrinagan Rapithwin is devoted to the spirit presiding over the southern quarter,
    described as guardian of the way to paradise, and is linked to a soul wanting
    to pass K'mvad after death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The liturgical speaker confesses being a Mazda-worshipper of Zarathustra's
    order, a foe of the Daevas, and devoted to the lore of the Lord.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The formula directs worship, homage, propitiation, and praise to Havani, day-lords,
    month-lords, year-lords, season-lords, and Ritual Righteousness.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Present Mazdayasnians are commanded to offer the ritual service and present
    the Myazda with sound flesh from a choice beast and a full flow of milk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the prescribed offering cannot be made, the passage permits substitution
    with liquor of equal value, and then with well-cut, very dry wood brought to the
    Ratu's house or dwelling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If material offerings are not possible, the worshipper may make a mental offering
    and ascribe Sovereign Power to Ahura Mazda and Righteousness, completing the sacrifice
    with prayer for blessings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A disciple who fails to give the required Myazda is expelled by the Ratu from
    among the Mazda-worshippers.
  category: action
  evidence_refs:
  - ev:7
