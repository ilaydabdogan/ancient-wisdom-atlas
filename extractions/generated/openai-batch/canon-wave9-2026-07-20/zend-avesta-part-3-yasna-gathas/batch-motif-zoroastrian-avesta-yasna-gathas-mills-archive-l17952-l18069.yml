canonical_text:
  quote: ''
  summary: 'The passage explains Afrinagan blessings as rites recited over a consecrated
    meal for an invited angel or deceased spirit, required at fixed calendrical seasons.
    It then gives a Gahanbar Afrinagan formula: the speaker confesses Mazda-worship,
    invokes ritual time-lords and Righteousness, commands present Mazdayasnians to
    present the Myazda with flesh and milk, allows substitutions of liquor, dry wood,
    or mental offering according to ability, and states that a Ratu expels a disciple
    who fails to give the required Myazda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Afrinagan are described as blessings recited over a meal of wine, milk, and
    fruits, to which an angel or deceased spirit is invited and in whose honour the
    meal is prepared.
  category: action
  evidence_refs:
