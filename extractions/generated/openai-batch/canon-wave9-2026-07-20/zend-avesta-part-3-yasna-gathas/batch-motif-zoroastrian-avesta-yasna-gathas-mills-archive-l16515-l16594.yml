  quote: ''
  summary: The passage describes ritual sacrifice to fire, waters, plants, trees,
    land, heaven, celestial lights, animals, holy creatures, mountains, lakes, fires,
    and truthful words. The speaker invokes the Gathas, Weal, Deathlessness, divine
    lore, and the Haptanghaiti for protection and for the soul. Zarathustra is instructed
    to seek a holy friend and to pronounce sacred words at the end of life, with Ahura
    Mazda promising to keep the soul far from Hell.
