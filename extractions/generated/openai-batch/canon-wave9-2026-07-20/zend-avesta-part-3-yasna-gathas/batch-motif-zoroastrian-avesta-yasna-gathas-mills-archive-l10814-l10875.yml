canonical_text:
  quote: ''
  summary: Yasna I opens the sacrifice. A first-person ritual voice announces and
    intends to complete the Yasna to Ahura Mazda, then to beneficent powers including
    Good Mind, Righteousness, the Kine, and the Fire of Ahura Mazda, and then to ritual
    time-lords and named yazads including Mithra and Raman Zfoastra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is headed as Yasna I and as the commencement of the sacrifice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person ritual voice announces and intends to complete the Yasna
    to Ahura Mazda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ahura Mazda is described as creator, radiant, glorious, greatest, best, wisest,
    connected with Righteous Order, disposer of minds, sender of joy-creating grace,
    maker, nourisher, protector, and bountiful Spirit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note says Ahura Mazda is not conceived as having a body proper; it adds
    that stars are elsewhere poetically described as his body, and other divinities
    as having the Mathra as their body.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ritual voice announces and intends to complete the Yasna to Good Mind,
    Righteousness the Best, desired Sovereignty, Bountiful Piety, Universal Weal,
    Immortality, the body of the Kine, the Kine's Soul, and the Fire of Ahura Mazda.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Fire of Ahura Mazda is described as having made the most effort for human
    succour, more than the Bountiful Immortals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ritual voice announces and intends to complete the Yasna to the Asnya
    day-lords, Havani, Savanghi, and Visya, all associated with the ritual order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mithra is described as of wide pastures, with a thousand ears and myriad eyes,
    and as a Yazad of the spoken name; Raman Zfoastra is also named as a recipient.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A note explains the ritual-order lords as ruling at the time of their mention
    and as genii protecting ritual seasons and times; it also says Visya presides
    over the Vis and Savanghi over cattle.
  category: relationship
  evidence_refs:
  - ev:6
