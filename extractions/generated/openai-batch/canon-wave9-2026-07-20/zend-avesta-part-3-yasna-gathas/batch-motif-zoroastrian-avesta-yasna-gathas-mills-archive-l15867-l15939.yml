canonical_text:
  quote: ''
  summary: The passage first invokes ritual opposition against hostile groups, covenant
    breakers, murderers, persecutors, and the wicked, then asks how the Demon of the
    Lie may be driven away. It then turns to a hymn to Fire, offering sacrifice and
    homage to Fire as Ahura Mazda's son, prescribing fuel and ritual materials, asking
    Fire to remain aflame in the house until renovation is complete, and requesting
    glory, nourishment, booty, understanding, virile power, and offspring.
  language: English
