canonical_text:
  quote: ''
  summary: The supplied commentary and translation for Yasna XLVII.1-3 state that
    Ahura Mazda will set things right, grant the righteous fullness, Universal Weal,
    and Immortality, while the wicked prosper only in a marred way apart from God
    and under the Evil Mind. Divine gifts are described as connected with Fire, Piety/Aramaiti,
    Righteous Order, Good/Best Mind, the bountiful Spirit, and Sovereign Power. The
    passage also personifies Good Mind and Aramaiti through mouth, tongue, and hands,
    calls Ahura Mazda father of Righteous Order, and says he made the joy-creating
    Kine.
  language: English
  quote_policy: summarized
