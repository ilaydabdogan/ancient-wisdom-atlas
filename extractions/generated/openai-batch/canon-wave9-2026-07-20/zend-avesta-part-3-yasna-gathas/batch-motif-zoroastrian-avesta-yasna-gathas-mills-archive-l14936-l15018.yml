  quote: ''
  summary: The passage contains a sacrificial litany to waters, road-crossings, hills,
    lakes, corn, earth and heaven, wind, high Haraiti, Good Mind, saints, sacred animals,
    Vouru-kasha, Haoma, waters, birds, Fire-priests, and the Bountiful Immortals.
    It then gives a prayer for sanctity and benefit for the holy creation across present
    and future generations, describing sanctity as protective, prosperous, healing
    through waters, cattle, and plants, and opposed to the harmful malice of the Daevas.
  language: English
