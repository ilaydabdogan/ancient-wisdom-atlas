canonical_text:
  quote: ''
  summary: The speaker addresses Ahura Mazda as bountiful after an approach by a divine
    messenger with Good Mind. The speaker recalls receiving divine words, accepts
    a hard human portion while resolving to do what was said to be best, and asks
    not to be sent forth before Sraosha/Obedience comes to accompany him with recompense
    and splendour. The speaker asks for long life to make sacred aims known to men
    and for the desired place within Ahura Mazda's Realm, comparing divine giving
    to a generous enlightened man giving to a friend.
  language: English
  quote_policy: summarized
