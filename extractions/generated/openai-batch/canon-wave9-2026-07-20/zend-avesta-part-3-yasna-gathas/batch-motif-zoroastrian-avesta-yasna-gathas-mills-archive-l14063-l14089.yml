canonical_text:
  quote: ''
  summary: 'Yasna XXII opens with the continuation of the sacrifice. The first-person
    ritual speaker approaches ritual substances, implements, prayers, and sacred beings
    with praise: Baresman, Zaothra, Haoma, fresh milk, Hadhanaepata, waters, mortars,
    prayers, recitals, wood-billets, perfume, Fire, and all good things made by Mazda.
    The stated purpose includes worship and propitiation of Ahura Mazda and other
    divine or sacred recipients.'
  language: English
  quote_policy: summarized
