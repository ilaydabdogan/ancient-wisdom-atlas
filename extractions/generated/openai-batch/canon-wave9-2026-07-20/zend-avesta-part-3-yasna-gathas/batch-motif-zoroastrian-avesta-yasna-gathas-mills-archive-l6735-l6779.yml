  summary: The passage is a prose commentary on a Gathic section in which the composer
    petitions Ahura/Mazda for speech, holy truth, and ritual guidance; asks how to
    serve a heavenly Spirit who protects saints and repentant people; questions the
    origin of Holy Order and the fixed way of the stars and sun; and turns to natural
    phenomena, Good Mind, and the contrast of life and slumber.
