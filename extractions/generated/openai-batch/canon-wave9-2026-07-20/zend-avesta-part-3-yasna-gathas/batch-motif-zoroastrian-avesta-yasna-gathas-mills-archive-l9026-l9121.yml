canonical_text:
  quote: ''
  summary: The speaker addresses Ahura/Mazda in petitionary questions, asking for
    refuge for a struggling saint, the prayer that brings Ahura's holy reign and reward,
    helpers for Order, certainty of divine power, Good Mind's grace and recompense
    for the saving prophet, and the coming of perfected-minded men who will drive
    away a corrupt intoxicating influence associated with Karpans and tyrants. The
    passage ends with a question about the appearance of perfected Piety.
  language: English
  quote_policy: summarized
