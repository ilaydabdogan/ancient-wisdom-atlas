canonical_text:
  quote: ''
  summary: A first-person plural ritual voice earnestly offers Yasna, homage, and
    sacrifice to sacred beings and entities, including waters, fruit-trees, Fravashis,
    the Kine, Gaya Maretan, Mathra Spenta, Ahura Mazda, Zarathustra, Apam-napat, the
    Bountiful Immortals, and qualities of responsive hearing and mercy. The passage
    also venerates praise, the later Yasna, and its textual components, then begins
    a chant for the Bountiful Immortals and holy Saoshyants.
