canonical_text:
  quote: ''
  summary: A Mazdayasnian speaker confesses adherence to Zarathustra's order, praises
    good thoughts, words, and deeds, rejects evil ones, offers homage and sacrifice
    to the Bountiful Immortals, repudiates the Daevas, attributes all good things
    to Ahura Mazda, chooses Piety, honors Righteousness, and vows against violence,
    robbery, drought, wandering, and wasting in relation to the sacred Kine and Mazdayasnian
    villages.
