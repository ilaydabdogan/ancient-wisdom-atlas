  summary: The passage includes translator commentary and the opening translated verses
    of Yasna XXXIII. It presents prayers for sacrifice, hymn, divine pardon, spiritual
    strength, insight into Ahura Mazda's nature and sovereignty, the dedication of
    self and obedience to God, the hoped-for passage of pious chiefs' souls to Paradise,
    and the action of a spiritual chieftain identified with Zarathushtra who acts
    justly toward wicked, righteous, and mixed-deed persons.
  language: English
  quote_policy: summarized
