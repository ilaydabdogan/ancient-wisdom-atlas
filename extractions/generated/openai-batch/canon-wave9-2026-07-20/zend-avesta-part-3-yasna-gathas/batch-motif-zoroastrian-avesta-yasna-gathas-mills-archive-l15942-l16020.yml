canonical_text:
  quote: ''
  summary: The passage petitions Fire, called Ahura Mazda's Son, for orderly and powerful
    offspring, instructors, good reward, renown, and preparation of the soul. Fire
    admonishes those for whom it cooks meals, watches what visitors bring, and blesses
    the person who brings ritually prepared wood, Baresman, or Hadhanaepata. The blessing
    asks for cattle, many people, active mind and soul, and a blessed life. The passage
    then turns to praise of the good waters and Ardvi Sura Anahita, described as wide-flowing
    and healing.
  language: English
  quote_policy: summarized
