canonical_text:
  quote: ''
  summary: The passage contrasts Daeva-worshippers who oppose Asha and live by rapine
    with a faithful defender of the holy Daena. The speaker prays for discernment
    and asks Ahura to identify a faithful leader to proclaim the Daena, naming Frashaortra
    as fitted for this role. The passage then warns that those who choose an evil
    sovereign will not join the saints on the afterlife path, but will meet wicked
    dead in the home of Lies with poisoned food and mocking speech.
