canonical_text:
  quote: ''
  summary: The speaker petitions Haoma for earthly success, battle victory, early
    warning against attackers, and protection. Haoma is said to grant speed, offspring,
    wisdom, and husbands to various recipients; to have dethroned Keresani; to possess
    power and true words; and to receive from Mazda a star-bespangled girdle identified
    with the Mazdayasnian Faith for spreading the Mathra from mountain summits.
  language: English
  quote_policy: summarized
