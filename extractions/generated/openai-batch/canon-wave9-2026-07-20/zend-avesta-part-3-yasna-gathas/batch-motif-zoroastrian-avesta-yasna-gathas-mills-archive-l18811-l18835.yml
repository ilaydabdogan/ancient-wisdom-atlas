  quote: The moons of the season will wane.
  summary: The fragment says that the moons of the season will wane and instructs
    the Mazdayasnian to pray for a smiter who may quickly destroy the demon causing
    their decrease. It wishes that the malignant one die off and says her adherents
    cannot maintain the Druj by prayers. The Druj is then described as advancing while
    smiting fiercely with her weapon, mighty and mindful of her strength. Notes indicate
    a ritual recitation context and warn that the fragment is broken, corrupt, and
    translated conjecturally.
