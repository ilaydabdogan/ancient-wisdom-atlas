canonical_text:
  quote: ''
  summary: 'The speaker repeatedly asks Ahura Mazda to tell him aright: to reveal
    a powerful saving lord, to explain how to proceed to a divine conference and chieftainship
    supported by Weal, Immortality, Righteousness, and the Mathra, to acquire a prize
    of mares and a camel for sacrifice, and to know the sentence for one who withholds
    an earned gift from the correct speaker.'
  language: English
  quote_policy: summarized
