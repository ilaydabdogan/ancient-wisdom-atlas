canonical_text:
  quote: ''
  summary: A liturgical passage offers Haoma, Haoma-juice, wood-billets, perfume,
    and complete sacred offerings to Zarathustra's Fravashi, Fire, the Fravashis of
    saints, ritual lords, and good Yazads. It petitions Ahura Mazda for blessing,
    reward for souls, and lasting protection through Righteousness. It also enumerates
    sacrifice to sacred words, prayer, curse, Haurvatat and Ameretat, the flesh of
    the Kine, Haoma, wood-billets, and perfume, ending with a formula involving the
    Ratu and Zaotar.
  language: English
  quote_policy: summarized
