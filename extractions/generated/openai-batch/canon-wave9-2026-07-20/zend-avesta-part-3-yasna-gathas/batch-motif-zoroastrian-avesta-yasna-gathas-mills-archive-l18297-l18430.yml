canonical_text:
  quote: The Gahs are the five divisions of the day.
  summary: The passage defines the five daily Gahs and gives liturgical prayers for
    Havani and the opening of Rapithwina. The prayers include Mazda-worship, rejection
    of the Daevas, and repeated sacrifice, homage, propitiation, and praise to Ahura
    Mazda, time-lords, Yazads, the Fire, ritual objects, sacred words, Fravashis,
    souls of the dead, and elements of creation.
  language: English
  quote_policy: quoted
