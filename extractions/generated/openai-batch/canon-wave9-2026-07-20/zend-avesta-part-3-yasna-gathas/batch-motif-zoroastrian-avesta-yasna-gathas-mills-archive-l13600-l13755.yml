canonical_text:
  quote: ''
  summary: The passage petitions Mazda for immortality and weal, then presents a commentary
    in which Zarathustra asks Ahura Mazda about a primordial word. Ahura Mazda identifies
    it as the Ahuna-vairya, pronounced before created things. The passage describes
    the formula’s ritual value, its effect on the soul’s passage over a bridge to
    heaven when properly recalled and chanted, the negative consequence of removing
    parts from it, and its status as the most emphatic of all words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker asks Mazda, addressed as maker of the kine, plants, and waters,
    to grant Immortality and Weal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zarathustra asks Ahura Mazda which word was declared before the sky, water,
    earth, cattle, plants, fire, holy man, Daevas, Khrafstra-men, the incarnate world,
    and good creatures made by Mazda.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ahura Mazda answers that the word was the Ahuna-vairya, which he pronounced
    before the listed parts and beings of the corporeal world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ahuna-vairya, when intoned without needless repetition or omission, is
    said to be worth a hundred other ritual stanzas; even imperfectly intoned with
    additions and omissions, it is said to be worth ten prominent stanzas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Whoever mentally recalls, undertones, utters aloud, or chants the Ahuna-vairya
    in worship is promised by Ahura Mazda that his soul will be brought over the Bridge
    of Alnva/ to Heaven, Best Righteousness, and the lights of heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Whoever takes away part of the Ahuna-vairya, whether half, third, fourth,
    or fifth, is told that Ahura Mazda will draw his soul away from the better world
    as far as the earth is broad and wide.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The saying containing its Ahu and Ratu is said to have been pronounced before
    the creation of heaven, waters, plants, four-footed kine, holy biped man, and
    before the sun.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The more bountiful of the two Spirits is said to have declared to Zarathustra
    the entire creation of the pure: what exists, what is emerging, and what shall
    be, in relation to actions of a life devoted to Mazda.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The word is described as the most emphatic of words ever pronounced, now spoken,
    or to be spoken in the future.
  category: attribute
  evidence_refs:
  - ev:9
