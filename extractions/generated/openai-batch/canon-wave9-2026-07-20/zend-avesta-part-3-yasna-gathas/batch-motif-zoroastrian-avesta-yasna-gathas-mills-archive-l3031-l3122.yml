canonical_text:
  quote: ''
  summary: The passage exhorts hearers to listen, see bright flames with the Better
    Mind, and awaken for an individual decision about religions. It describes two
    primeval spirits as an opposed pair, better and worse in thought, word, and deed,
    and urges the wise to choose rightly. The spirits come together at the beginning
    to make life and life's absence and to determine the world's final ordering, with
    worst life for the wicked and the Best Mental State or Heaven for the holy. The
    evil spirit chooses evil and works worst results, while a more bounteous spirit
    is contrasted.
  language: English
  quote_policy: summarized
