canonical_text:
  quote: ''
  summary: The passage contains liturgical worship and offerings to Verethraghna,
    the Saoshyant, the Baresman with its Zaothra and girdle, souls, Fravashis, sacred
    formulas, Asha Vahishta, and Yasna praises. It includes reciprocal blessings spoken
    by the Ratu and the Zaotar, followed by prayers that blessings, righteous order,
    divine power, welfare, religious endurance, and cattle come to the sacrificer’s
    dwelling and village.
