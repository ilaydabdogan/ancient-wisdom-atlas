canonical_text:
  quote: ''
  summary: A Yasna litany worships the Mathra Spenta, the anti-Daeva Zarathustrian
    law, Mount Ushi-darena, holy mountains, Mazda-made glory and sanctity, blessing,
    waters, lands, plants, temporal lords, divine guardians, Haoma, Zarathustra's
    Fravashi, ritual offerings, Fire as Ahura Mazda's son, saintly Fravashis, Yazads,
    and ritual-order lords. It closes with a ritual speech exchange between the Ratu
    and the Zaotar.
  language: English
  quote_policy: summarized
