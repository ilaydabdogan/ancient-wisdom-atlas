  summary: A liturgical Visparad passage announces ritual recitations, prayers, wood-billets,
    perfume, and good Mazda-made objects to Ahura Mazda and other divine or spiritual
    recipients. It invokes Sraosha, Ashi, Rashnu, Mithra, the Bountiful Immortals,
    the Fravashis of saints including Zarathustra, and others for sacrifice, homage,
    propitiation, praise, household furtherance, protection from malice, blessing
    of herds and retainers, and the future renovation of the completed world.
