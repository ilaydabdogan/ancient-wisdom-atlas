canonical_text:
  quote: ''
  summary: 'The passage summarizes and comments on Yasna LIII: former injurers of
    the holy Daena may become disciples through conversion; king and nobles honor
    converts and disciples by hymns, ceremonies, and sacrifices. It discusses a bridegroom
    and the youngest daughter of Zarathustra as bride, including pious counsel for
    married life. A priestly speaker admonishes the wedding party and assembly, warns
    against demons and evil Vayu, calls for a champion or prince to defeat a murderous
    false leader, and attributes ultimate sovereign protection of innocence to Ahura.'
  language: English
  quote_policy: summarized
