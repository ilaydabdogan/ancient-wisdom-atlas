canonical_text:
  quote: ''
  summary: The passage condemns destructive and ignorant beings, names Yima Vivanghusha
    as famed among them for eating kine's flesh or teaching men to eat it, and distinguishes
    the speaker from such beings before Ahura Mazda. It then describes an evil teacher
    who destroys doctrines, perverts true understanding, takes away the wealth of
    Good Mind, blasphemes the sacred Kine and the Sun, offers gifts to Demon-gods,
    brings drought to meadows, and attacks the saint of Ahura Mazda.
  language: English
  quote_policy: summarized
