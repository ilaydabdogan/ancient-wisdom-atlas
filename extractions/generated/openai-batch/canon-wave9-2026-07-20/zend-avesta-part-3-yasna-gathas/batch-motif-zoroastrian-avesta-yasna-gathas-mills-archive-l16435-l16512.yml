canonical_text:
  quote: ''
  summary: Frashacstra asks Zarathustra to define the memorised recital of the rites
    and the completed delivery of the Gathas. Zarathustra responds with a litany of
    worship and sacrifice directed to Ahura Mazda, Zarathustra, the Fravashi of Zarathustra,
    the Bountiful Immortals, Fravashis of saints, ritual lords, Yazads, the Mazdayasnian
    Faith, sacred metres, the bounteous Mathra, holy creatures, the five Gathas, the
    Yasna, its praises, and Mazda’s words that oppose and destroy evil thoughts, words,
    and deeds.
