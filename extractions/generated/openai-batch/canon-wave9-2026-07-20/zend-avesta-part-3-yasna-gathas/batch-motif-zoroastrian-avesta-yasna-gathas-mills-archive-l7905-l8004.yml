  quote: from that narrow path (it becomes narrow to the faithless), they shall fall
    to 'eternal' Hell.
  summary: 'The passage comments on Yasna XLVI: a narrow path leads the faithless
    to Hell, while repentance remains possible even for enemies. Zaratustra offers
    rewards to supporters of his cause, names Vutaspa while warning against reliance
    on one individual, exhorts allied groups, and describes a sacred scene where the
    faithful praise and the Immortals dwell with God. Ahura discerns truth, answers
    praise, grants spiritual rewards, and threatens oppressive clans with visitation.'
  language: English
