canonical_text:
  quote: ''
  summary: The speakers choose good thoughts, words, and deeds that are best for both
    worlds; pray that the Kine may have comfort and fodder; ascribe Kingdom to Mazda
    Ahura and Righteousness; instruct men and women who know the duty to declare and
    fulfil it; remember sacrifice, homage, and the nurture of the Kine; act under
    ritual Order toward clean creatures; and proclaim words as Righteousness through
    praise, spoken words, and Yasna.
  language: English
  quote_policy: summarized
