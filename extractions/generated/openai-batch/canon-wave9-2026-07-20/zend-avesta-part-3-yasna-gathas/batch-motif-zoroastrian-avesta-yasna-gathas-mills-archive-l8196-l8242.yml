    to adore Ahura. The passage names Ahura/Mazda Lord as well-invoked, holy, and
    bountiful, and refers to words spoken by the Kine's creator for Ahura, connected
    with Righteous ritual Order and sought from the speaker by people coming with
    Good Mind.
