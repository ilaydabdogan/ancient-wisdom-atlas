  quote: ''
  summary: The speaker petitions the Lord/Mazda, Righteousness, and Piety to grant
    long-lasting life, spiritual help, sacred blessing, fulfilled wishes, understanding
    of divine words, and the best gift for named beneficiaries including Zarathustra,
    Vistaspa, Frashaoshtra, and the speaker. The requested help is directed toward
    overcoming the torments of the tormentor and toward enduring participation in
    the ages of the Good Mind.
