canonical_text:
  quote: ''
  summary: The speaker petitions Ahura Mazda and personified moral powers for sovereign
    rule, wealth, and spiritual blessings. A guarded assembly and a tiller of the
    earth ask where divine guidance and protection come from and how the sacred Kine
    may be gained. Ahura Mazda is described as the creator of the Kine, waters, and
    plants, the giver of benefits to the righteous chooser, and the sender of worse-than-evil
    consequences to the withholder of sacrifice. The speaker says he will proclaim
    woe to the wicked, salvation to the maintainer of holy Order, and mental keenness
    given to two striving sides.
  language: English
  quote_policy: summarized
