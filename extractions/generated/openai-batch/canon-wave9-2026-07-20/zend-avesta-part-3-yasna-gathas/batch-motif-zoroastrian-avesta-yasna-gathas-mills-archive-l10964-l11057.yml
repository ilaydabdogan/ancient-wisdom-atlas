  quote: ''
  summary: A Yasna formula announces and completes ritual address to Ahura Mazda,
    Mithra, celestial bodies, the Fire, waters, plants, sacred revelation, a sacred
    mountain and Mazda-made Glory, religious virtues, blessing and curse, and local
    lands, pastures, abodes, and springs. Translator notes compare some divine and
    solar imagery with Vedic material and associate Ushi-darena with later Iranian
    royal descent traditions.
