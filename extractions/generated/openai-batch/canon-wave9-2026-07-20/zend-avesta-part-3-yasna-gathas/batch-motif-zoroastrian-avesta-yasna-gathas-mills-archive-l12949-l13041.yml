canonical_text:
  quote: ''
  summary: A sequence of ritual and mythic utterances presents admonitions by a foddered
    being, a horse, and H(a)oma against improper use or withholding. The passage assigns
    tongue and left eye as H(a)oma's portion, warns of childlessness and evil descendants
    for denial, recalls H(a)oma binding Frangrasyan in iron within the earth, praises
    Mazda-made H(a)oma through Zarathustra, gives a numerical ritual formula, and
    offers the mature person of the speaker to H(a)oma in request for the shining
    best world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A foddered speaker curses a person who does not use it fairly and instead
    fattens it for wife, children, or a selfish meal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A horse addresses its rider and warns against overstraining racers or the
    fleetest horses without praying for swiftness in a crowded meeting or circuit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: H(a)oma addresses its drinker, curses one who withholds it from full outpouring,
    and denies being a head-smiter while being described as holy and death-far.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A father gave an offering; Ahura chose the tongue and left eye and set them
    apart for H(a)oma's meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: One who denies the offering is said to have no fire-priest, chariot-warrior,
    or thrifty tiller born in his house, but instead Dahakas and Murakas of evil practice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage instructs that H(a)oma's flesh portion be cut off quickly and
    warns that H(a)oma may bind the offender as he bound the Turanian Frangrasyan
    in iron in the mid-third of the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Zarathustra speaks praise to H(a)oma, calling H(a)oma made by Mazda and good.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A numerical formula describes one becoming two, being made three, and further
    number-making involving four, five, six, seven, nine, and a decade.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A ritual speaker offers his mature visible person to holy H(a)oma and to the
