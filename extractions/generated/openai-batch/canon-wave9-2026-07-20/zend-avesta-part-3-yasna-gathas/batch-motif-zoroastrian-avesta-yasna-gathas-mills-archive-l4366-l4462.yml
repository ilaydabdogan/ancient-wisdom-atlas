canonical_text:
  quote: ''
  summary: The passage contrasts a Daeva-affiliated party and its devotions with the
    speaker’s friendship with Ahura Mazda. Ahura Mazda answers through Good Mind,
    Sovereign Power, and Righteousness, accepting and choosing Piety. The Daevas are
    addressed as seed from the Evil Mind; their sacrificer is linked with the Lie-demon
    and perversion, and their deceits are said to be known in the sevenfold earth.
    The Daevas are also described as confusing thoughts and leading men toward worst
    deeds and speech.
  language: English
  quote_policy: summarized
