canonical_text:
  quote: ''
  summary: A prayer is directed to Ahura, the Great Creator, with outstretched hands
    and questions in doubt concerning the two worlds. The passage asserts that the
    righteous and the thrifty tiller will not share destruction with the wicked. Ahura
    then speaks as the Lord and Great Creator, described as understanding by insight,
    and says that a spiritual master or righteous chieftain is not found in that manner;
    therefore he has named the addressed figure as a head for the diligent tiller
    of the ground.
