canonical_text:
  quote: ''
  summary: The speaker asks Ahura Mazda and associated divine powers for grace, saving
    aid, just lands, and protection for flocks, herds, and the joy-creating Kine.
    The speaker promises sacrifice and praise, invokes the pathway to the Home-of-song,
    and describes divine friendliness that brings visible relief to the speaker of
    the Mathra-word.
