canonical_text:
  quote: ''
  summary: 'The passage describes a divine path set for a female Kine/cow figure,
    who chooses the husbandman or thrifty field-worker as holy master rather than
    the thieving nomad. It then addresses Ahura Mazda as creator of settlements, revealer
    of religious laws, giver of understanding and bodily life, and source of injunctions
    by which a wisher may make choices. The passage closes by noting opposed voices:
    truthful or liar, enlightened or unenlightened.'
