canonical_text:
  quote: ''
  summary: A fragment asks that Khshathra be with the speaker so the deadly Druf may
    die and destruction may come upon it. The next section praises the Ahuna-vairya
    and related formulas as chosen prayers or words of Mazda. The Mathra-spenta word
    is described as victorious, healing, opposed to malice, and effective for the
    one who pronounces it. A hymn is declared victorious against the words of Aeshma,
    and a worshipper is instructed to present it with a liberal offering and pleasing
    words. The passage ends with the statement that the Kingdom is to Ahura and may
    grant a nurturer to the poor.
  language: English
  quote_policy: summarized
