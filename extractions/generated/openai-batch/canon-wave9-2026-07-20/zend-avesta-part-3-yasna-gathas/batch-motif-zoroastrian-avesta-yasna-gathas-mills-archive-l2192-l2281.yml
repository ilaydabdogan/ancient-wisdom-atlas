  quote: ''
  summary: The passage presents Zarathustra as one who has heard sacred enunciations
    and will proclaim acts of grace for the Great Creator and Righteousness. The Soul
    of the Kine laments being wounded and having only a powerless lord, while a divine
    group asks when strong-handed help will come. Zarathustra then prays to Ahura,
    Righteousness, Good Mind, and Sovereign Power for gladness, peaceful dwelling,
    and strength for his mission.
