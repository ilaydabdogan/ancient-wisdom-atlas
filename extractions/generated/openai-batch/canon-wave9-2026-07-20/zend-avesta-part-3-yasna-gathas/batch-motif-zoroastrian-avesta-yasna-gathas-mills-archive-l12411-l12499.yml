canonical_text:
  quote: ''
  summary: Haoma answers questions about men who prepared him for the corporeal world.
    Athwya receives the birth of Thraetaona, who smites the dragon Dahaka, a multi-headed
    destructive demon made by Angra Mainyu. Thrita receives two sons, Urvakhshaya
    and Keresaspa; Urvakhshaya is a judge confirming order, and Keresaspa is a bludgeon-bearing
    youth who smites a poisonous man- and horse-swallowing dragon. A narrative detail
    says Keresaspa once cooked meat on the dragon’s back, after which the scorched
    dragon sprang up and Keresaspa fled.
  language: English
  quote_policy: summarized
