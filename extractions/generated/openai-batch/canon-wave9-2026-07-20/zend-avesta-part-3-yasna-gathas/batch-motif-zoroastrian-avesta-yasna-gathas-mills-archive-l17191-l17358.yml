  summary: The passage contains translator notes, then Visparad VIII-XI liturgical
    material. The ritual voice approaches Ahura Mazda and the Bountiful Immortals
    with proper words; offers homage to Haomas and Zaothras; associates these offerings
    with sanctity, healing, knowledge, prayer, veracity, libation, liturgy, pressing,
    and celebration; praises divine powers, the Kine and its Soul, fire, a sanctified
    farm-house, sacred speech, named regions, ritual implements, waters, souls, and
    the entire holy creation.
