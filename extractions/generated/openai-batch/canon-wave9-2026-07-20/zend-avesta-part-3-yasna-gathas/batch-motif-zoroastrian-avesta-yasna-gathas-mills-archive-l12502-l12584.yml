canonical_text:
  quote: ''
  summary: Haoma answers that Pourushaspa prepared him and received as blessing the
    birth of Zarathustra, who first recited the Ahunavairya and caused demon-gods
    to vanish into the ground. Zarathustra praises Haoma as holy, healing, golden-hued,
    and nourishing for the soul, then petitions Haoma for inspiration, strength, victory,
    healing, prosperity, understanding, power against malice and lies, victory over
    hostile beings, heaven, bodily health, and long life.
  language: English
