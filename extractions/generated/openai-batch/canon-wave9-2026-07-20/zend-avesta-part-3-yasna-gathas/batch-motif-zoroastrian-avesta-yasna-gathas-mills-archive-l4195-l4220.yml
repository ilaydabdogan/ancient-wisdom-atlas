canonical_text:
  quote: ''
  summary: The passage says that matters are clear to the wise person who discerns
    with the mind and is not blinded by the perverter. With Ahura Mazda's Good Mind
    and holy Kingdom, such a person follows Righteous Order in speech and action and
    becomes a helpful, vigorous servant of Ahura Mazda. A Pahlavi gloss paraphrases
    this as meditation on what the lord and dastur declare, and as righteousness effected
    in word and deed.
