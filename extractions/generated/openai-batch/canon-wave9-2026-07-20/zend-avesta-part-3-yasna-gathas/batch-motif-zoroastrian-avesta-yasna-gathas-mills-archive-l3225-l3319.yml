canonical_text:
  quote: ''
  summary: 'The passage addresses Mazda in an eschatological setting: a final body
    is compared to the first creations; a great struggle involving the Daevas and
    the Demon of Wrath leads to vengeance on wrongdoers; Good Mind gains the Kingdom
    for Mazda and commands the delivery of the Demon of the Lie into the hands of
    Righteous Order. The speaker asks to belong among those who bring the great renovation
    and progressive perfection of the world, with thoughts directed to the home of
    true wisdom. After perfection, destruction falls on the Demon of Falsehood and
    the righteous saints are associated with the happy abode of Good Mind and Ahura.'
  language: English
  quote_policy: summarized
