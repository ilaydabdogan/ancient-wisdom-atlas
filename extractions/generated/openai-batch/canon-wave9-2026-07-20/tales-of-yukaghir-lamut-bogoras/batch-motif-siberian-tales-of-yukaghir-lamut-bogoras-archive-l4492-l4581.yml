canonical_text:
  quote: ''
  summary: The passage contains the end of a comic tale about a man, his wife, a hidden
    treasure, and the wife being sewn into a bull hide and mistaken for a cow or devil
    at church. It then begins a forest-demon story in which a hairy forest-being has
    human descendants, and one descendant flees a summons from supernatural kin while
    warning his wife not to look outside during nocturnal disturbances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and woman come home and find a treasure of silver money; the man tells
    the woman not to tell anyone because it may be taken from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a quarrel, the woman reports the treasure to the chief officer, while
    the man denies having found anything.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The woman supports her accusation by referring to strange events: a barbot
    caught in a deadfall, a hare caught in a net, and women flogging the chief officer
    in a stable; the officer becomes angry and turns her out.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman demands a costly new dress for a holiday church visit, saying that
    poor clothes make people value her little.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man slaughters a young bull, removes the skin in one piece with horns,
    hoofs, muzzle, and tail, and sews the woman into it as her new dress.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman hurries to church in the bull skin, walking like a cow on its hind
    legs; people who meet her fall down in fright, which she interprets as bowing.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: At church the woman pushes through the crowd with the hoofs, gores women,
    and takes a place in front near the priest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The priest sees the horned and tailed figure, asks whether it is the Devil,
    and uses a censer with incense to try to expel it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The woman returns home interpreting the fear, bows, front place, and incense
    as honors given to her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The husband calls the woman a cow, puts a halter on her, ties her in the stable,
    flogs her until the bullskin falls away in shreds, revives her with cold water
    after she swoons, and then says she is again a woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The tale is attributed to John Sukhomyasoff, a Russian creole and church clerk
    in Nishne-Kolymsk, recorded in the Kolyma country in summer 1896.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: A forest-being described as a hairy man lives in the woods, roams the country,
    marries a Russian girl, and has a son; the son later has a wife and two children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The forest-being's son says his father calls him but he does not wish to go;
    he takes a barrel of alcohol and sets off with his family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In a dense forest, the man warns his wife that his elder brother will come
    to fetch him at night and tells her to stay in the tent without looking outside
    or calling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: After drinking a pail of alcohol, the man goes outside; the wife hears noise
    and clatter at midnight but does not look out, and in the morning sees trees stripped
    and broken while her husband sleeps exhausted on the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: On the following evening the man says his eldest brother will come, repeats
    the instruction to remain in the tent, drinks another pail of alcohol, and louder
    night noises begin before the passage breaks off.
  category: sequence
  evidence_refs:
  - ev:8
