canonical_text:
  quote: ''
  summary: A boy called Alder-Block repeatedly goes out at night to take cakes left
    near the shore. He puts the hiding daughters of Yaghishna, and later Yaghishna
    herself, to sleep by counting eyes, but when he forgets one eye Yaghishna captures
    him. She orders her daughters to cook him in a ground oven while she seeks her
    brother. Alder-Block tricks each daughter into sitting on the shovel and pushes
    them into the oven, then prepares their bodies as a meal and hides their heads
    under Yaghishna’s bed before she returns in a mortar with pestle and broom.
  language: English
  quote_policy: summarized
