canonical_text:
  quote: ''
  summary: A woman repeatedly warns an old man that Yaghishna, a female enemy or monster,
    is approaching. After slowly arming himself, he fails to harm her body until the
    woman tells him to shoot at her anus; the arrow passes through to her mouth and
    kills her. The old man and woman chop, burn, and scatter her remains, then go
    to her house to look for anyone left behind. They find small children emerging
    from an overturned wooden dish, kill them, burn the house, and return home. Afterward
    the old man becomes active as a hunter and provider.
  language: English
  quote_policy: summarized
