canonical_text:
  quote: So they have lived till now, but get nothing good whatever.
  summary: The line range contains the end of one tale in which hunger and domestic
    violence lead to the deaths of an old couple and their children, followed by Yaghishna
    killing the last surviving boy. It also contains the beginning and end of the
    “Story of Five Brothers,” where brothers encounter wolf tracks, a snowstorm, river
    ice, water, and freezing; three brothers remain frozen until spring, briefly thaw,
    and die again. Editorial notes identify the first tale’s ending as a negative
    variant of a Russian folk-story refrain and question whether the second story
    is a mutilated longer tale.
  language: English
  quote_policy: quoted
