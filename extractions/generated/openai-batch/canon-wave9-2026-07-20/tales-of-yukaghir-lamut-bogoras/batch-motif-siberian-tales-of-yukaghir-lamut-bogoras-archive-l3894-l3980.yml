canonical_text:
  quote: ''
  summary: In the passage, La’la marries a chief’s daughter and has two children.
    His wife vanishes after carrying out meal remains, leaving traces like a giant
    bird’s wings in the snow. La’la seeks her, receives information from a Bluejay,
    and learns that Raven-Son abducted her. Two old women in holes in the ground feed
    and advise him. He reaches Raven-Son’s village, learns that Raven-Son has also
    abducted his son and keeps three stolen wives, and kills Raven-Son by burning
    his house while he sleeps. La’la returns with the women, keeps his own wife, sends
    the others back to their husbands, and later sets off for his own country.
  language: English
  quote_policy: summarized
