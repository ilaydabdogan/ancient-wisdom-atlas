canonical_text:
  quote: ''
  summary: A man lingers crying at a water-hole where a girl appears from the water.
    His Monster-Woman wife puts him into a death-like sleep with a thimble, ambushes
    the waterwoman, and shoots her in the heart. The man follows the blood into the
    water-hole and reaches another earth below, where the wounded woman lies in a
    silver Lamut tent. She sends him across lands to a silver hill to catch one of
    three she-storks. He changes into a shrew, catches a stork, and the storks follow
    him back, sing incantations, and remove the arrow.
  language: English
  quote_policy: summarized
