canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which the Unclean Idol rewards a
    girl who fed his vermin children, while the envious woman's own daughter harms
    the same beings and is killed; the father returns with her bones while a small
    dog announces the truth. The passage then begins the tale “Sea-Wanderers,” describing
    Maritime people who set out by skin boat to see sea wonders under the guidance
    of a knowing incantation specialist, reach an island, and encounter vanished houses
    and underground childlike clamor.
  language: English
  quote_policy: summarized
