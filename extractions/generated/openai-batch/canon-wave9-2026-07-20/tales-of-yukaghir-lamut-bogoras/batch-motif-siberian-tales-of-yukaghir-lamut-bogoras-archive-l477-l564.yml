canonical_text:
  quote: ''
  summary: A young man creates a false spectacle of fire by setting burning willow
    brooms on horses' tails, drawing people out of the house. He returns inside, kills
    a drumming Wolf-woman shaman by suddenly dousing her with cold water and covering
    her with a kettle, then bargains to carry her body home in exchange for a daughter.
    He stages an apparent deadly accident at the wolves' house using blood-filled
    bladders and iron nails to make the wolf-children offer him their sister. He returns
    with two women, kills his brother's wife, gives one woman to his brother, and
    keeps the other.
  language: English
  quote_policy: summarized
