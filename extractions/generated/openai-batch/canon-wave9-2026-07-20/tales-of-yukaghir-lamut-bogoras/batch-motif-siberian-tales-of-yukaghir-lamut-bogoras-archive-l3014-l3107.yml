  - ev:3
- id: obs:6
  text: Small-Pox stays with the man and climbs a very high tree every morning and
    evening to listen in all directions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Small-Pox hears the ringing of iron to the east, where young men chop wood
    and young girls carry river water in iron pails early and late; the passage links
    this to a rule against doing those tasks except in daylight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man tells Small-Pox to creep into a ptarmigan bladder so he can carry
    her concealed, then ties the bladder and hangs it before the fireplace to dry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Small-Pox dries within the bladder, cannot pierce it, becomes shriveled, and
    pleads to be released.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Small-Pox promises not to touch the man's house and kin if they wear small
    red tufts on their caps.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man removes the weakened Small-Pox, places her on a board, and sends her
    floating down the river.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the second version, a powerful shaman in a large Yukaghir village beats
    a drum and announces that a great disease is approaching.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The shaman goes to a crossway where three small trails join into one broad
    straight trail and hides under the roots of a large tree.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Three sisters approach on red horses; their coats are red as fire and their
    hair is described as burning like lightning.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: The eldest sister says she wants to take away the powerful shaman in the nearby
    Yukaghir village, and the hidden shaman overhears her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The shaman returns home, has food prepared, opens a magic iron box with a
    magic seal, and catches a long red hair that falls during the meal.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The shaman seals the red hair in the magic iron box, puts the box into a big
