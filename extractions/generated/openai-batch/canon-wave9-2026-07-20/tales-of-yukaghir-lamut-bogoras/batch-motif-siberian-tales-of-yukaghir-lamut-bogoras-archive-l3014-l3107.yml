canonical_text:
  quote: ''
  summary: The passage first closes a tale in which a young man dies after the death
    of his beloved and is laid beside her bones in a grave-box. It then gives two
    versions of a Yukaghir Small-Pox tale. In the first, an isolated man receives
    Small-Pox as a frightening woman, traps her in a ptarmigan bladder by the fireplace,
    gains a promise that his marked kin will not be touched, and sends her away downriver.
    In the second, a powerful shaman foresees a great disease, overhears three red
    sisters at a crossway, captures a red hair in a magic iron box, roasts the captive
    in fire, and releases the weakened red girl.
  language: English
  quote_policy: summarized
