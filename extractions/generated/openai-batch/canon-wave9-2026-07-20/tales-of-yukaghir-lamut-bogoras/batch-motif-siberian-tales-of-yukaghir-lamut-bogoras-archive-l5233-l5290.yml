canonical_text:
  quote: ''
  summary: The passage contains two short tales. In the first, a childless old couple
    prays and receives a son, later also receiving a rapidly grown girl; domestic
    work around fire, kettle, and elk head leads to punishment, accidental death,
    grief, violence, and the deaths of the household. In the second, a young girl
    encounters two boys who claim to be her brothers, sinks through the ground and
    returns, then meets Yaghishna, a she-monster who wants her as a daughter; after
    the girl sets a hostile condition, Yaghishna strikes her, and the girl is left
    as scattered gravel.
  language: English
  quote_policy: summarized
