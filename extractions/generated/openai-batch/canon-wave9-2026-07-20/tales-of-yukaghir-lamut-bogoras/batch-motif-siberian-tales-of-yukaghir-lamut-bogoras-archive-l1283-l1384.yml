canonical_text:
  quote: ''
  summary: The passage contains the end of a Lamut tale in which a man searching for
    lost reindeer is rebuked by a sky-high white old man, sees his herd mounting to
    the sky, and becomes fixed in stone. It then gives a tale of a powerful old shaman
    who challenges a wandering boy to a shamanistic contest; the shaman's tiny spittle-bear
    is strangled by the boy's louse, and the shaman dies. The final tale describes
    old-time Lamut material culture before iron and a first encounter with Russians,
    who test Lamut hunting skill, give iron goods and tobacco, demand assistance in
    warfare, and institute tribute.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Lamut man searches the pasture for missing reindeer, finds no tracks outside
    it, becomes tired, and sits on a boulder at the pasture border.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A voice calls to the man, and he sees an old man who is large, white, and
    standing high on the rock, described as as high as the sky.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man questions the Lamut man and rebukes him for striking his assistants,
    saying each assistant is a man and a Lamut like him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man tells the Lamut man to look upward, and the reindeer, including
    bucks, does, and fawns, are seen mounting up to the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the white old man says the Lamut man will stand there forever and vanishes,
    the man finds his feet stuck to the stone and his legs begin sinking into it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man's people find him sunk to his ankles, later to his knees, and by spring
    he has become entirely stone and remains standing on the boulder.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great old shaman is said to be able, when angry, to lay a spell on anyone,
    including another shaman.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The shaman meets a little wandering boy who does not know who he is, says
    he walks in sleep, and says his father and mother are gone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shaman takes the boy to his house, puts a plate before him, and demands
    a shamanistic match, while the boy denies knowing shamanic practice.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The old shaman spits into his palm, places the spittle on the plate, and it
    grows into a small bear; a louse falls from the boy's head and becomes the boy's
    champion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bear and louse fight all day; the louse strangles the bear, the old shaman
    dies, and the boy takes the shaman's wives and goods and becomes rich.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In olden times the Lamut live in the mountains without iron, axes, knives,
    or kettles, using stone, bone, and reindeer materials for tools and containers.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Russian newcomers question the Lamut, observe demonstrations of bow shooting
    and snowshoe hunting, and praise them as active, strong, and successful hunters.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Russians ask the Lamut to be close friends and assistants in conflicts,
    give them iron goods, and the Russian chief institutes tribute in a big black
    book and gives pipes and tobacco.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
