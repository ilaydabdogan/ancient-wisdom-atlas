  text: A darkness covers half the sky and approaches; it is identified as an evil
    spirit with one lip touching the sky, the other dragging on the ground, and an
    open mouth ready to swallow what comes before it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl flees with an iron-tipped staff after recognizing the approaching
    being as her death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl throws an ivory comb behind her; it becomes a dense forest, which
    the evil spirit swallows, digests, and defecates, after which it becomes a small
    ivory comb again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl loosens a red handkerchief from her waist; it becomes a fire extending
    from heaven to earth, but the evil spirit drinks a river dry and pours the water
