canonical_text:
  quote: ''
  summary: The passage contains the tale “The Girl and the Evil Spirit,” in which
    a wealthy, solitary girl is pursued by a devouring evil spirit, delays him with
    transformed objects, changes herself into several animals with an iron-tipped
    staff, reaches a Lamut tent, and marries the eldest of three brothers, who says
    he had appeared in the form of the evil spirit. The passage also begins “A Tale
    about the Wood-Master,” where a poor hare-trapper wishes to see the Wood-Master
    and becomes lost in a snowstorm.
  language: English
  quote_policy: summarized
