  text: The girl reaches a Lamut tent covered with white skins, falls at the entrance,
    and later sees a young man on each side of her with caps adorned with large silver
    plates.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The evil spirit is then seen as a handsome youth combing and parting his hair,
    and the three young men ask the girl to enter the tent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The youth who had appeared in the form of the evil spirit says that he and
