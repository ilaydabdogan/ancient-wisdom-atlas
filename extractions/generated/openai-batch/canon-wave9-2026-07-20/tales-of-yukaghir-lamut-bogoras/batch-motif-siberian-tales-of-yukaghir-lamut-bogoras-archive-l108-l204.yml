- id: obs:1
  text: An unnamed girl is described as knowing no man, not knowing her parents, owning
    many reindeer and other property, and living without work because her songs bring
    back the reindeer and her home is already prepared when she returns.
  category: attribute
  evidence_refs:
  - ev:1
