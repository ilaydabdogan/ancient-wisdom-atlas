  text: The voyagers are afraid of the one-sided people and sail past without landing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: On a later island, people without anus or urethra cook wild reindeer meat
    in large kettles, inhale the steam through their armpits, and throw the meat down
    the bank.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men with long staffs prevent the voyagers from eating the discarded meat,
    call it offal, and instead give them choice meat, dried fat, and pure oil.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: An old man without bodily openings observes the voyagers eating; after persuasion
    from the man with incantations, he eats a meal and then suffers pain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The man with incantations sharpens a drift larchwood splinter, speaks incantations
