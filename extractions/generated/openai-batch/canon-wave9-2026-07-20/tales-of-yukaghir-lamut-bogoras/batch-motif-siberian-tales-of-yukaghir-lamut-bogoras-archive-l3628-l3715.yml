canonical_text:
  quote: ''
  summary: Voyagers enter an underground house of Polar Fox people, receive hospitality,
    and are warned by an old man to leave because they have trodden on Fox children.
    They then pass an island with a giant sea tree and one-sided people who catch
    fish. At another island they meet people without anus or urethra who live by inhaling
    steam from cooked meat through their armpits. A ritual specialist among the travelers
    persuades an old man to eat normally and then creates an anus and urethra for
    him with incantations and a sharpened larchwood splinter.
  language: English
  quote_policy: summarized
