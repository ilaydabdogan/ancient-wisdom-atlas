canonical_text:
  quote: ''
  summary: The passage contains the end of a monster-pursuit tale and the opening
    of “The Girl from the Grave-Box.” In the first episode, brothers reach a log cabin,
    a brother shows monstrous iron teeth, a similar being attacks, and the youngest
    escapes by using an old kettle and incantation before reaching a village and priest.
    In the second episode, a Lamut elder brother wishes for a girl assistant in the
    wilderness; a beautiful girl appears nightly and becomes his wife, but her tracks
    later lead to an ancient grave-box containing a skeleton.
  language: English
  quote_policy: summarized
