canonical_text:
  quote: ''
  summary: 'The passage ends one tale: a woman marries a mighty hunter, warns him
    not to tie her horse to a green tree, and after he forgets, a Monster appears
    from the hearth coals. The woman and older boy take refuge in a magically transformed
    raised storehouse while the Monster swallows two children and attacks the supports
    with weapons it vomits out. A She-Fox tricks the Monster and throws two tools
    into the sea; the winged horse frees itself and breaks the Monster''s back, and
    the husband cuts up the body and throws the remains into the sea. The family moves
    away and has more children. The passage then begins “Tale about Cu''mo”: three
    sisters who know no men hunt and gather; after the eldest wishes for a baby, they
    find a baby-like piece of rock with a human face, take it home, cradle it, and
    it becomes like a human being.'
  language: English
  quote_policy: summarized
