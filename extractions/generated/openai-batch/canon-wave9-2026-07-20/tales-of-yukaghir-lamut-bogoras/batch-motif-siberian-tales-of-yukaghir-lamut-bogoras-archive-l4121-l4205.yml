canonical_text:
  quote: ''
  summary: A young man survives a cannibal bride by refusing human meat, discovering
    her hidden iron killing tools, killing and decapitating her, and escaping across
    the sea in an iron canoe with an advising old man. The cannibal parents unknowingly
    receive their daughter’s flesh, pursue in a sabotaged wooden canoe, and drown.
    The woman’s pursuing head and the canoe become stones associated with a local
    sacrifice for success in love-suit. A following tale describes monstrous pikes
    in a lake near the Lena River; one pike and an elk kill each other in a stalemate,
    and the pike’s cheekbones become a small shelter.
  language: English
  quote_policy: summarized
