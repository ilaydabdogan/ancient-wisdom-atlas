canonical_text:
  quote: ''
  summary: The passage closes one tale with a woman recovering after reporting that
    a Yukaghir shaman imprisoned her in a box and burned her; her sisters report destroying
    one village and leaving one boy and one girl in another. A separate tale recounts
    a dead shaman left in an abandoned hut with his drum, and a young man who wins
    a horse wager by cutting off the dead shaman's braid at midnight despite a planned
    fright. A third tale begins with a Kolyma head man visiting an Aldan tribute chief
    whose wife is ill; seven shamans have failed to help, and the chief asks whether
    the Kolyma man's assistant may have shamanic ability.
  language: English
  quote_policy: summarized
