canonical_text:
  quote: ''
  summary: The passage ends a tale in which a woman abducted by a bear is found by
    her shaman brother-in-law, who changes into a bear, fights the captor, and rescues
    her; she later gives birth to a bear-eared son named Bear-Ear. It then begins
    'Grass-Blade Girl,' in which a childless old woman takes home a tall blade of
    grass that becomes a little girl, who grows into a marvelous bride producing pearls,
    precious stones, and fur animals.
  language: English
  quote_policy: summarized
