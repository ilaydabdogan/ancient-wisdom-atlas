canonical_text:
  quote: He strung it and shot an arrow up to heaven. Then he jumped upward and followed
    the arrow.
  summary: 'The passage gives the end of a Pondandi tale: a girl repeatedly sends
    Pondandi on dangerous or impossible tasks, hoping he will die or abandon marriage
    plans. He brings animal carcasses, moves a mountain to the entrance, shoots an
    arrow to heaven and follows it, then returns handsome and wealthy with reindeer.
    He proves his identity by showing his former clothes and the discarded skin of
    a snotty youth in a tree; their herds are joined and the girl marries him. The
    passage then gives a Kolyma lay of Bondandi for comparison, followed by the opening
    of a Kundirik tale in which an old couple pray to God for a child and receive
    a son.'
  language: English, with embedded Russian text in the Kolyma lay
  quote_policy: quoted
