canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a violent Bad Merchant is identified
    by his coerced workman, disarmed by a house master through a display of peltries,
    struck with his own lance, bound, and treated by the brothers as an oppressor
    whose capture liberates the country. It then begins a tale of a stepdaughter abused
    by her stepmother; after the father fails to protect her, he agrees to carry her
    to the Unclean Idol to be eaten.
  language: English
