canonical_text:
  quote: ''
  summary: A Lamut man finds a human-shaped stone that becomes his wife. He later
    meets a girl in the water and repeatedly plays with her. The stone wife uses sleep
    and disguise to wound the water girl with an arrow. The man follows the girl into
    the water, enters another world, and reaches a city mourning the chief's wounded
    daughter. After a failed healing and a clothing exchange, two spoonbills become
    young girls and revive the dead girl, who is then married to the visitor. The
    man returns to his stone wife, kills and burns her when she tries to devour him,
    and goes back to the water girl. The following tale begins with a Lamut camp destroyed
    by nearby strangers, while three sisters flee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Lamut man looking for a wife finds a stone in the likeness of a person,
    takes it home, places it near the fireplace, and addresses it as wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After initially not moving, the stone wife is later found cooking food, and
    she and the man live together as husband and wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a river water-hole, the man sees a girl below in the water combing her
    long glossy hair and calls her out to play.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man and the water girl play by shooting at each other with bows and arrows
    until sunset on successive days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stone wife makes a heavy sleep fall on her husband, puts on his clothes,
    takes his bow and arrows, and follows his tracks to the river on snowshoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stone wife draws the water girl partly out of the water and shoots her
    in the breast with an arrow; blood comes from the wound and the girl drops back
    into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man jumps into the water, sinks down, experiences bodily sensations, and
    finds himself in a new world with a track leading to a city covered with black
    calico.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A little old woman tells the man that the chief's daughter is sick because
    someone hit her with an arrow.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the man touches the arrow, the girl dies; he asks for men's clothes,
    dresses her body in them, wears her clothes himself, and keeps watch over the
    body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two spoonbills alight on two high larch trees, speak to the dead girl as sister,
    become young girls, and revive her by blowing and spitting upon her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the revived girl is taken to her parents, she is married to the visitor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the man visits his former stone wife, she prepares to bite and says she
    wanted to devour him; he shoots her, burns her in a great fire, and returns to
    the water girl.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the next tale opening, an old Lamut has three unmarried daughters; nearby
