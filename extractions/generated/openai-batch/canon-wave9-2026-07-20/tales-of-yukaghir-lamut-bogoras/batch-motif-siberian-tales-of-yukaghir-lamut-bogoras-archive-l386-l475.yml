canonical_text:
  quote: ''
  summary: An unmarried brother reveals that a strange man is hidden in the married
    brother's bed. The married brother decapitates the man and grieves. The unmarried
    brother carries the corpse to the dead man's family home, arranges it as if sleeping,
    later returns to hear the family explain the death as self-decapitation, and lies
    that he knows a shaman. Riding out with two horses, he finds a lonesome cabin
    inhabited by wolf-beings, brings an old wolf-woman as a shaman, and assists as
    she begins a performance with drum, fire, and a garment tassel.
  language: English
  quote_policy: summarized
