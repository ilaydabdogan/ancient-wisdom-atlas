canonical_text:
  quote: ''
  summary: A lazy young man from a seaside village is lured by a young woman in a
    self-moving iron canoe. His face sticks to her iron paddle, and she carries him
    across the sea to make him her husband. In the other country he sees human remains
    on drying poles and learns from an old man that the inhabitants are man-eaters
    and that the young woman eats her husbands after the bridal night. The old man
    gives survival instructions about where to lie, how to make her sleep, and not
    swallowing human flesh.
  language: English
  quote_policy: summarized
