canonical_text:
  quote: ''
  summary: A Lamut tale describes stingy reindeer-owners who refuse food to poor people,
    lose their herd after a shaman's warning dream, suffer famine, receive reindeer
    from the Master of the Desert after promising to feed poor neighbors, then lose
    the animals again when they remain stingy and die. The passage also begins an
    Arctic Fox tale in which Fox builds a winter fish weir, Bear demands a share,
    and Fox instructs Bear to sit still on wet planks while keeping watch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In winter, some Lamut pitch their tents close together and socialize, while
    an old shaman has nothing to eat because wealthy reindeer-owners give him nothing.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old shaman has a hungry dream that wolves scatter the reindeer herd and
    tells a hunter in his family that they should move away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the shaman leaves, the reindeer are gone in the morning and numerous
    wolf tracks are visible in the deep snow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A snowstorm covers tracks, game disappears, and the starving people eat saddles,
    harnesses, tent covering, clothes, and finally gnaw their own hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: An old father cries in the open desert, and the Master of the Desert comes
    from underground and asks what he wants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Master of the Desert says that he is also an owner of reindeer and will
    give food, but tells the old man to remember the Lamut custom of giving the best
    morsel to a poor neighbor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A sleeping boy moving his mouth as if chewing is taken as a sign of good luck;
    in the morning a large gray herd of reindeer has come to the camp, including large
    bucks worn by saddles.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After winter, the people camp near others, but the old woman advises her husband
    not to feed poor strangers and to move away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After they move away, the reindeer vanish; the text says they may have ascended
    to the sky, and explains that the Master of the Reindeer took back his property
    because of their hard hearts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The people who had previously received nothing refuse help to the old man
    and old woman, who go away and starve to death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the following tale opening, an Arctic Fox builds a fish weir on a small
    river in winter, and a Bear asks for a share of the catch.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Fox says he has many children to feed, eventually promises Bear half, and
    tells Bear to sit on wet planks, keep watch, and not stir until Fox returns.
  category: speech
  evidence_refs:
  - ev:10
