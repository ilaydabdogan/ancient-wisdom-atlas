canonical_text:
  quote: ''
  summary: The passage combines editorial notes, the ending of a tale about One-Side,
    and the beginning of a Yukaghir tale. In the One-Side tale, a boy is attacked
    at a house entrance, One-Side defeats his in-laws, takes home his wife and son,
    then removes a one-sided skin disguise and reveals his handsome true form. In
    the Yukaghir tale, a clever only daughter is carried by a whirlwind to mountains
    near a rock reaching heaven; a bluejay refuses to help her, a snow-bunting brings
    climbing supplies, and three captive girls begin climbing the rock with lines
    and hooks.
  language: English
