canonical_text:
  quote: ''
  summary: A Kolyma tale begins with a Tungus family whose three daughters become
    female geese and fly to sea islands for berries. The youngest loses her wings
    after One-Side hides or carries them, is left by her sisters, and becomes One-Side’s
    wife. They have a son, and One-Side is a powerful hunter. The elder sisters later
    carry away the wife and son. One-Side shoots a forked arrow toward the departing
    child’s voice, cutting off one of the boy’s fingers, which he keeps. After a year
    of searching he finds a mistreated poor boy whose missing little finger matches
    the severed finger and recognizes him as his son. The passage ends as One-Side
    and the boy go toward the house where the mother has been made a drudge.
  language: English
  quote_policy: summarized
