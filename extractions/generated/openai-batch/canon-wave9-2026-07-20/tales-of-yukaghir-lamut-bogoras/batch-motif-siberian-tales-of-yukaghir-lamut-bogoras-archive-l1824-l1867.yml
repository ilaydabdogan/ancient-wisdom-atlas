canonical_text:
  quote: ''
  summary: After an earlier son fails to return, the parents pray to God and receive
    another son. The new son learns from old woman Underskin that Raven-Man carried
    off his sister and killed his brother, so he leaves to seek them. At Raven's house
    his sister warns him, but Raven returns, changes from bird to young man, stages
    an iron-nut contest, then kills the young man in an overheated steam bath and
    eats him. Raven orders his wife to gather the bones in a pouch and hang it high
    in a tree; a note compares this to an ancient Yukaghir practice of collecting
    the bones of the dead in pouches.
  language: English
  quote_policy: summarized
