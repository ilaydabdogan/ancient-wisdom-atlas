canonical_text:
  quote: ''
  summary: A youngest son granted after prayer learns that Raven-Man destroyed his
    brothers and carried off his sister. He travels to Raven-Man's house, survives
    contests, burns Raven-Man in a bath house, retrieves his brothers' bones, restores
    them with water of life and youth, and returns home with his siblings; the parents
    become ashes from joy. The passage then begins another Yukaghir tale in which
    an old man predicts his death, asks to be placed in an abandoned hut with goods,
    appears dead, and giggles while being hauled toward the funeral place; an editorial
    note compares the tale to Raven-feigning-death variants.
  language: English
  quote_policy: summarized
