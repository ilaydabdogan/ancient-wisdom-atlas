canonical_text:
  quote: ''
  summary: 'The passage contains three tale segments: an old hunter discards his full
    storehouses after a dream of death and he and his wife die accidentally after
    attacking a fly; two sisters survive attacks by Yaghishna and fire-breathing horses
    but are burned by a taper while trying to thank God, followed by a contradictory
    survival postscript; and the beginning of an animal tale in which a She-Fox tricks
    and abducts a Cock while the Tom-Cat later pursues her.'
  language: English
  quote_policy: summarized
