    between man and wolf begins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bear, Wolverene, and Wolf are described as brothers living side by side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wolf seeks the daughter of Wolverene, but Wolverene refuses, saying they cannot
    join because Wolf is born from snow and Wolverene from earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bear judges the dispute, orders separation, and declares limits on the offspring
    of Wolf and Wolverene.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wolverene curses Bear to meet his fate underground and to sleep through the
    winter while his fate comes to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The tale states that Bear's words cause wolves to be born in twos and threes
