  text: Arctic Fox refuses to free Bear, calls his children, and the young foxes bite
    Bear to death and eat him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arctic Fox tells Wolf he is making a fish weir and instructs Wolf to put his
    tail into the water and stay still to catch fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After three days Wolf is frozen, gnaws off his own tail, and pursues arctic
    Fox.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arctic Fox hides in snow and pretends to be lame and blind; Wolf accepts the
    explanation and attacks another arctic Fox instead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People without dogs raise gray fox puppies, which produce black and spotted
    dogs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man raises a wolfling; that wolf produces long-legged, light-colored dogs
    and helps its master catch game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the rich master stops paying the wolf in food and shelter, the wolf brings
