canonical_text:
  quote: ''
  summary: The passage contains the end of an arctic Fox tale in which Bear and Wolf
    are tricked into freezing to river ice, a Lamut tale explaining kinds of dogs
    and the beginning of war between men and wolves, a tale in which Bear, Wolverene,
    and Wolf impose judgments and curses that explain animal birth numbers and bear
    hibernation, and the beginning of a tale about a bad-tempered reindeer owner whose
    herd disappears.
  language: English
  quote_policy: summarized
