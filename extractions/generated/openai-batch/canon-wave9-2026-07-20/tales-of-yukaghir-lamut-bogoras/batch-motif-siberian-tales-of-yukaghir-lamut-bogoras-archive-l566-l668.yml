canonical_text:
  quote: ''
  summary: The passage contains a tale in which a reindeer fawn delays being eaten,
    grows iron-like antlers, kills the Forest-Owner and the bear, but is killed by
    a wolf, explaining why reindeer are killed by wolves. It then gives a tale of
    a shaman who changes into foxes, a fish, and an ermine to test men as possible
    husbands for his daughter; a poor wanderer survives the ordeals and kills the
    black fox instead of accepting the daughter. The passage ends with the opening
    of a tale about a rich man of unknown birthplace who is forced by a She-Monster
    to marry her under threat of being devoured.
  language: English
  quote_policy: summarized
