canonical_text:
  quote: ''
  summary: The passage contains the close of a tale in which a Lamut woman in a cannibal
    shaman's camp learns that the camp can be killed by destroying maggots in a reindeer's
    liver, does so, and finds the enemies dead. It then gives a Yukaghir tale in which
    two sisters meet Kosetoka, a bad spirit or monster; one sister escapes by feigning
    death, and the other kills him by tricking him into tearing off his own testicles
    during an invented game on the ice. The final section begins a Markova tale about
    an old man who locks out an old woman to keep reindeer meat for himself; she leaves
    with a hare foot and asks a magpie for directions, but the magpie refuses because
    she formerly mistreated it.
  language: English
  quote_policy: summarized
