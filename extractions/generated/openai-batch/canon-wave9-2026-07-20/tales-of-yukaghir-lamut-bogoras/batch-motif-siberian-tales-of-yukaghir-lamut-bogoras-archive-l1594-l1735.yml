    scrape skins, and curry hides.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The girl becomes jealous and angry, boils water, pours the scalding water
    over the small creatures, and kills them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When One-Side returns, his commands no longer work; he thinks his incantations
    may have lost power and opens his bags and boxes to look at his goods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: One-Side finds the girl in a box, says she has destroyed all his people, and
    tells her she must now make herself useful and prepare to move with reindeer and
    sledges.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The girl wakes before sunrise, arranges the sledges, catches reindeer, attaches
