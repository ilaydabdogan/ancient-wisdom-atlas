canonical_text:
  quote: ''
  summary: An editorial note introduces song material. In the narrative, a female
    climber cuts the lines of two companions during an ascent, reaches a high plateau,
    and finds a well-stocked house belonging to One-Side. She hides in a box, observes
    One-Side’s magically serviced household, discovers small animal and insect female
    assistants under a flint stone, kills them with scalding water, and is then found
    by One-Side. He tells her to perform household and migration tasks. She harnesses
    reindeer to sledges, travels, and sings wishes for tent poles and for her husband
    to come.
  language: English, with Russian and Yukaghir song inserts
  quote_policy: summarized
