canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a young man kills a sea-spirit or
    sea-monster, is murdered by a herdsman who falsely claims the deed and the chief’s
    daughter, is recovered from the sea and revived with healing hot water, and then
    marries the girl after the impostor is exposed. It then begins a tale titled “The
    Sly Young Man,” where an unmarried brother visits his married brother and discovers
    the wife with a strange man hidden in the house.
  language: English
  quote_policy: summarized
