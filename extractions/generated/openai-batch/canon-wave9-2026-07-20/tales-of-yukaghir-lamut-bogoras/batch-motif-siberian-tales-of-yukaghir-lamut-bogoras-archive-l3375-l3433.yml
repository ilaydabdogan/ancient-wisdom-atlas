canonical_text:
  quote: "“I am hunting luck,” said the woman."
  summary: The closing episode of one tale describes greedy hunters, a dead old man,
    a birch tree that becomes a woman called hunting luck, a proper burial, and a
    pouch that continually refills with silver. The next tale begins with three brothers,
    two of whom hunt while one keeps house, and introduces a richly dressed armed
    Bad Merchant arriving with pack-horses, a workman, and a woman in fox garments.
  language: English
  quote_policy: quoted
