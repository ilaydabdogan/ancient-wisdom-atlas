canonical_text:
  quote: He croaked three times like a raven; then he roared three times like a bear;
    then he howled three times like a wolf.
  summary: A small, young, one-eyed assistant of Kolyma birth is asked to use shamanistic
    power to help a suffering wife. He says he could do more with his own place or
    garment, receives an oversized shamanistic garment, begins a performance with
    animal-like sounds repeated three times, grows so that his head pierces the roof
    and the garment bursts, and the door flies open as seven shamans are hurled. An
    editorial footnote describes related shamanistic “fits” and singing among Russian
    creoles and Russianized natives.
  language: English
  quote_policy: quoted
