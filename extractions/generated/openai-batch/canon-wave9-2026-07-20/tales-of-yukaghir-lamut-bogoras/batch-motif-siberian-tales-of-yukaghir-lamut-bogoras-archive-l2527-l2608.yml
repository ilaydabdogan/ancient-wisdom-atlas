canonical_text:
  quote: ''
  summary: A baby named Cu'mo repeatedly cries, speaks in a deep adult voice, grows
    until its head reaches the roof, eats stored meat, and shrinks back into the cradle
    before the sisters return. After all three sisters witness this, they throw the
    baby into a boiling kettle and flee with nine reindeer. Cu'mo pursues them in
    the kettle; the youngest sister throws an ivory comb behind her, and it becomes
    an ivory mountain, which Cu'mo gnaws through before continuing the chase.
  language: English
  quote_policy: summarized
