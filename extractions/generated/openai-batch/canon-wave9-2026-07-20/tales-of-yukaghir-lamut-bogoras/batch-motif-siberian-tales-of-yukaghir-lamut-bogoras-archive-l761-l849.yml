canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a man marries a young woman under
    the protection of female storks, loses her when he sleeps during a return journey,
    and recovers her through the youngest stork's rescue from a two-headed Eagle-Man.
    It then begins the tale “Reindeer-Born,” in which a Tungus man adopts a humanlike
    fawn-boy born from a doe, flees after the boy devours his reindeer herd, and meets
    a thought-reading transparent woman in an iron house who gives him a protective
    neckerchief and tree instructions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A patient sits up, wipes away tears of pain, and says that the youngest sister
    is a shaman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman asks the man to take her as his wife; he does so, and the bridal night
    takes place in a silver tent while three female storks circle above, keep watch,
    and sing incantations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The storks tell their brothers to send the man and his wife back home, and
    the brothers ask the storks to fly ahead and inspect the home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The storks report that they caught the man's old wife, threw her into the
    sea, and that she turned into a big sea-worm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the return journey the youngest stork warns the couple not to sleep; the
    man rides in front on a reindeer, is overpowered by sleep, and falls from the
    saddle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: While the wife tries to wake the sleeping man, a big two-headed Eagle-Man
    arrives, says he has been making suit for her since her earliest years, seizes
    her by the tresses, and carries her away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the man wakes, he finds his wife gone and sees no trace on the snow
    except the couple's own tracks.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The three storks arrive, identify the Eagle-Man as the mightiest of creatures,
    pursue him, and the youngest stork flies straight upward before dropping onto
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The youngest stork snatches the young woman from the Eagle-Man's talons, returns
    her to her husband, blesses the couple with safety, wealth, health, and children,
    and the couple returns to a silver Lamut tent in their own place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the tale “Reindeer-Born,” a Tungus man with a large reindeer herd and no
    son sees that a doe has given birth to a fawn that looks human.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The doe says the fawn is a small boy brought forth for the man, and tells
    him to take the boy as a son; the boy grows quickly.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Reindeer-Born swallows three live reindeer each day, causing the formerly
    rich man to become poor and fear that he will be eaten next.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Tungus man leaves his house and goods, flees without knowing where he
    is going, walks for a long time, and sees an iron house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Inside the iron house is a pretty girl whose swallowed food is visible through
    her transparent body; she answers the man's unspoken wish for a wife, gives him
    food and drink, and sleeps with him.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: The woman asks why he is running; after he explains Reindeer-Born, she gives
    him a neckerchief and tells him to hide behind a tree if pursued and to touch
    the tree with the neckerchief if Reindeer-Born does not stop.
  category: sequence
  evidence_refs:
  - ev:11
