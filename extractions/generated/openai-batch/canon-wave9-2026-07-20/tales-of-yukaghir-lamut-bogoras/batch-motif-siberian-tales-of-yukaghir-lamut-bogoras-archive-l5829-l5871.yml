canonical_text:
  quote: ''
  summary: In an Anadyr version of a Chuvantzi tale, Latka dies and his daughter remains
    with Pondandi, his assistant. Pondandi stops doing household work and sits silently
    across the river, watching her. After repeated unanswered requests and offers,
    she asks whether he wants to take her as wife; he jumps and dances, then sits
    again. The next morning she says that if he wants to marry her, he must kill a
    big brown bear to make her a blanket.
  language: English
  quote_policy: summarized
