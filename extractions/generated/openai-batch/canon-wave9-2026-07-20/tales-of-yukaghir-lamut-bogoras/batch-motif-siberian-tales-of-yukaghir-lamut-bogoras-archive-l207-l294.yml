canonical_text:
  quote: ''
  summary: A Lamut man shelters by a riverbank, encounters the Wood-Master with an
    iron sledge and iron reindeer-buck, damages the supernatural property through
    his frightened cry, restores it by spoken commands and touch, and receives lifelong
    food through five self-acting bows. The passage then begins a tale in which Tungus
    fishers meet a whale-sized sea-spirit that demands daily human victims; the chief's
    daughter is left by the sea, and a parentless wanderer stays beside her to await
    the spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tired man finds a cavity under a steep riverbank, makes a fire, and crouches
    before it while waiting for better weather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He sees a huge iron sledge, an equally huge iron reindeer-buck attached to
    it, and a black-faced man as tall as a larch tree.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the man cries out for help, the iron sledge breaks into small pieces
    and the iron buck is scattered to ashes, while the tall man remains standing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wood-Master says the man has damaged his property, frightened him, and
    must repair the sledge and restore the reindeer-buck to life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Wood-Master says the man had been thinking about him steadily and calling
    him in his mind, so he came.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lamut asks to work alone, then speaks to the sledge and buck; the sledge
    and buck become whole again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lamut touches the reindeer-buck with his right hand and it remains lifeless;
    he touches it with his left hand and it comes to life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Wood-Master offers wealth, but the Lamut asks instead for plenty of food
    for all his life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Wood-Master tells the Lamut to set five large self-acting bows in the
    forest, saying they will give him ample food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Lamut's wife says he has been absent for several days, but she denies
    that there has been any snowstorm.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Five self-acting bows kill five big elks the first night, and the Lamut continues
    catching five elks each time, becoming rich and living in plenty until death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the following tale, Tungus people living at the mouth of a small river
    see a sea-spirit as big as a whale come up from under the water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The sea-spirit threatens to devour the people and demands one man each day,
    to be left near the water as food.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The sea-spirit threatens to carry off nets, drive away fish, and overturn
    canoes if the people do not comply.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Tungus give the spirit one victim after another until the turn of the
    chief's only daughter comes; she is placed on the sand by the sea to await death.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: A young parentless wanderer arrives, refuses to leave, and sits beside the
    chief's daughter to wait for the sea-spirit.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The wanderer asks the chief's daughter to louse him, make him sleep, and wake
    him if anyone comes.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: An editorial note identifies the sea-spirit story as a Tundra Yukaghir version
