canonical_text:
  quote: ''
  summary: 'The passage ends one tale in which a shaman traces a bloody limb to a
    parish priest’s house, exposes the priest’s wife as the being responsible for
    destroying part of the village, and the woman is killed. A new tale begins: an
    abused stepdaughter of a Yahga-Witch loses a net at a water-hole, sees a road
    below it, descends to the lower world, cleans animal shelters and a dirty house,
    is hosted by a small old woman, and receives a silver net and a food-giving box.
    The witch then sends her own daughter to the water-hole hoping for a similar reward.'
  language: English
  quote_policy: summarized
