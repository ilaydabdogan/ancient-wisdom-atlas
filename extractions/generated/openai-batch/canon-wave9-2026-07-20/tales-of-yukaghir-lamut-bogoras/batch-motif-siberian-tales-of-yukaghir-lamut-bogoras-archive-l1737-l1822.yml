canonical_text:
  quote: ''
  summary: The passage ends one tale with a woman recognizing her one-sided husband
    after he transforms through ritual turnings, followed by a return to her parents,
    who die by becoming ashes from joy. It then begins a Raven tale in which a childless
    couple receive children after praying to God; their daughter is abducted by Raven-Man,
    and their son later seeks her after learning the truth from Underskin. The son
    reaches Raven-Man's house, but Raven-Man tricks him through contests and kills
    him in a hot steam bath, eats him, and orders the sister to gather his bones into
    a pouch and hang them on a tree.
  language: English
  quote_policy: summarized
