canonical_text:
  quote: ''
  summary: The passage contains the conclusion of one animal-companion tale, a Markova
    tale about the duck White-Cap, her frightened granddaughter, and a cumulative
    dialogue with a snow-bunting, a short tale of three brothers who die around blood-soup
    and their father killing their mother, and the beginning of a tale in which a
    sister seeks to marry her brother through a disguised second dwelling reached
    by an underground passage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wolverene brings a crooked pole, and a bear brings a whole tree forked near
    the middle; the old woman rejects both objects as unsuitable.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the old woman goes to get something herself, her companions devour the
    doe and run away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman returns to the old man; he has eaten his reindeer, is catching
    hares again, takes her back, and they live as before.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A duck called White-Cap asks her granddaughter to louse her; the granddaughter
    says the lice are on the back of the head, while White-Cap says in duck language
    that they are on the forehead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: White-Cap says gray geese passing high above made her lose her wits, and the
    girl becomes frightened and runs away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl remains alone, becomes lonely, sits on a high stone, and is addressed
    by a snow-bunting perched on a cranberry-bush.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The snow-bunting asks why the girl does not bathe in the river, hold a willow,
    put on mittens, mend them, or sharpen a needle; the girl answers each question
    with a fear, ending with fear that a whetstone might split and her brother would
    blame her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The snow-bunting asks about the girl’s household items, and the girl answers
    with dog-body materials: dogskin bed, dog’s neck pillow, paws for spoons, claws
    for forks, skull for kettle, cheek-bones for sledge, shoulder blades for ladles,
    tongue for titbits, and teeth for cups.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: When asked where the fire is, the girl says a jay extinguished it; when asked
    where the jay is, she says it flew to the mountain to peck at larch gum.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Three brothers named Grass-Leg, Bladder, and Little-Finger eat blood-soup;
    Little-Finger falls in and drowns, Grass-Leg breaks his leg while trying to help,
    and Bladder laughs until he bursts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father asks his wife where their children are; after she tells him, he
    becomes angry and kills her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A sister who wants to marry her brother sews a new tent cover, prepares new
    poles, digs a long underground passage from their house, and pitches a new tent
    at its far end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sister tells her brother that a strange woman has come to camp and that
    he should marry her; she then changes clothing and hair, uses the underground
    passage, appears in the new tent, and later returns home before him.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The brother says the woman in the new tent looks very much like his sister;
    the sister denies the implication and urges him to marry the woman soon.
  category: speech
  evidence_refs:
  - ev:8
