canonical_text:
  quote: ''
  summary: 'Opening of a Chaun Lamut tale: a young man leaves his family to seek people
    and a wife, becomes an adopted son-in-law in an unknown river camp, encounters
    catches and game that appear human to him but are treated as fish and reindeer
    by the camp, kills long-haired reindeer-men by smoke, and is warned by his wife
    to flee because the camp plans to kill him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Lamut man in Chaun travels toward East Cape with his wife and young son;
    the surrounding country is deserted.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man decides to look for people and says he will take a wife among
    them despite his father's warning not to go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man travels on snowshoes to an unknown river where there is a large
    camp with tents in two clusters, enters a household with a single daughter, and
    stays as an adopted son-in-law.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While fishing at open water, the son-in-law twice catches a small child human
    in appearance on his fish-line and throws the catch back into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The father-in-law and other people rebuke him, saying the catch is fish, that
    throwing fish back destroys fishing luck, and that fish are their existence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other fishers catch a small human-appearing child, roast it on a wooden spit
    before the fire, and eat it; later the son-in-law catches many human-appearing
    fish and covers the heap with sticks and stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a spring hunt for wild reindeer-bucks, the son-in-law hides behind
    a large tree and sees two giant naked men with hair reaching the ground run past
    instead of shooting them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man says the two figures were not men but wild reindeer-bucks, says
    hunting is their life, and rejects the young man as son-in-law.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man tracks the giant naked men, finds them asleep against trees,
    ties their long hair around a tree, makes a windward fire, and the smoke kills
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the young man reports killing the reindeer-bucks, the camp has abundant
    food, but he cannot eat it, so real reindeer are slaughtered for him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: His wife warns that the camp is angry over the continual slaughtering and
    plans to kill him; she agrees to flee to his country and says she wants no more
    human flesh.
  category: speech
  evidence_refs:
  - ev:9
