canonical_text:
  quote: ''
  summary: 'The excerpt ends a shamanic healing account: a Kolyma shaman cuts a woman’s
    body apart, sucks and blows on the pieces, reassembles them, sings through the
    night, and the woman recovers. A tribute chief offers the shaman a richly equipped
    swift horse and money; the shaman accepts only the horse and a smaller amount
    of paper money, puts the money in the horse’s left ear, blows on the horse, strikes
    it with his staff, and the horse flies away to the shaman’s mother and sister.
    The excerpt then begins a hunting tale about three hunters who usually hunt sables
    and foxes after the first snow and divide skins equally; one poorer hunter urges
    departure while richer companions delay.'
  language: English
  quote_policy: summarized
