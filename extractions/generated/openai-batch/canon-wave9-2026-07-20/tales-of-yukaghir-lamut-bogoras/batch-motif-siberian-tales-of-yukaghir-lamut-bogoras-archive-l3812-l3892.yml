canonical_text:
  quote: ''
  summary: The younger brother observes an attack on La’la’s household from a tree.
    The father is killed, the household is looted, and the mother is forced away with
    a needle through her tongue. La’la returns, finds the devastation, pursues the
    Chukchee attackers to a camp on a frozen lake, turns his younger brother into
    a fox as a lure, deceives the attackers into handing over his bow, quiver, and
    snowshoes, and then shoots the pursuers one by one.
  language: English
  quote_policy: summarized
