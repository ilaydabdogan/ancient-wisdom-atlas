canonical_text:
  quote: ''
  summary: An old woman seeks human people. A raven refuses to tell her the way because
    she once mistreated it at the fish racks, while a snow-bunting agrees to guide
    her because she had left food scraps for it. The old woman reaches settlements,
    receives hospitality and a goose, then obtains a swan and a doe by falsely claiming
    that her previous animal was of the more valuable kind. She later steals a sledge
    and reindeer-harness, drives with the doe, takes several animal passengers, and
    the bear breaks the sledge.
  language: English
  quote_policy: summarized
