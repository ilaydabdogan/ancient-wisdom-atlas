- id: obs:1
  text: The old woman asks a passing raven where there are human people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The raven refuses to tell her, saying she had thrown lumps of earth at it
    when it tried to perch on the fish racks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman asks a snow-bunting where there are human people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The snow-bunting agrees to show the way, saying she had not harmed it at the
    fish racks and had left roe and liver pieces for birds while drying fish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The snow-bunting flies ahead, the old woman follows, and she sees a village.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: People in the village welcome the old woman, give her shelter, food, and a
    couch, and the next morning give her a goose and show her the way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among people who own many swans, the old woman asks that her goose be placed
    among the swans and next morning claims she had a young swan; the people give
    her a swan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among people who have many does, the old woman asks that her swan be placed
    among the does and next morning claims she had a doe; the people give her a doe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old woman steals a sledge and reindeer-harness, attaches the doe to the
    sledge, seats herself, and drives on singing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An arctic fox, a wolverene, and a bear each ask the old woman to take them
    along on the sledge, and she tells each to sit down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the bear sits on the sledge it breaks; the old woman asks for wood to
    repair it, and the arctic fox brings a rotten log.
  category: sequence
  evidence_refs:
  - ev:7
