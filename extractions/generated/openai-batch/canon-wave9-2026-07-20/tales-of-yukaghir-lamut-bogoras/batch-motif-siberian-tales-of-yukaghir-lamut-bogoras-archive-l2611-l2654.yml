canonical_text:
  quote: ''
  summary: Three sisters fleeing Cu'mo detect his pursuit by listening to the ground.
    One sister creates a mountain of flint as an obstacle, which Cu'mo gnaws through.
    Another creates a river of fire, in which Cu'mo perishes after warning that his
    mother will catch them. The sisters lose their reindeer, reach a deep river, and
    are helped across by an old woman who stretches her leg as a bridge. After learning
    that they burned her son Cu'mo, she locks them in a storehouse. A parenthetical
    note says the Fox later saves the girls from the She-Monster by substituting clothes
    filled with twigs and ashes, but the narrator forgot the details and the tale
    is unfinished.
  language: English
  quote_policy: summarized
