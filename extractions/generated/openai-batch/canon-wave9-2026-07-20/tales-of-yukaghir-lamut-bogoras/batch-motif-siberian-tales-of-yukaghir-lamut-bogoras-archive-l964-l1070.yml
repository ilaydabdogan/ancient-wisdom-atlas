canonical_text:
  quote: ''
  summary: 'The passage includes the end of one tale in which a woman changes clothing,
    is led around a new fire three times, and returns to another land. It then gives
    a Lamut tale of Chukchee invasion: elders warn against arrogance, Chukchee enemies
    attack from the east, fleeing Lamut abandon wounded kin and escape by mountain
    paths. A third tale describes cannibals: a family flees cannibal neighbors, the
    daughter is married to a man-eater who fattens her for slaughter, a poor herdsman
    warns them, and the father kills three pursuers in a narrow pass before the family
    settles elsewhere.'
  language: English
  quote_policy: summarized
