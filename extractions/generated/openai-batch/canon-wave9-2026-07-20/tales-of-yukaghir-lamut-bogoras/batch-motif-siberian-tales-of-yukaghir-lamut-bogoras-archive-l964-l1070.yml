- id: motif:3
  label: flight from overwhelming enemy pursuit
  taxonomy_refs:
  - departure
  basis: After the Chukchee attack, some Lamut gather a few things, flee on reindeer,
    and attempt to escape pursuit across mountains.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The departure is a flight from war rather than a quest or voluntary journey.
- id: motif:4
  label: abandonment of wounded dependents during flight
  taxonomy_refs: []
  basis: A wounded wife and an infant whose cradle is struck are each left behind
