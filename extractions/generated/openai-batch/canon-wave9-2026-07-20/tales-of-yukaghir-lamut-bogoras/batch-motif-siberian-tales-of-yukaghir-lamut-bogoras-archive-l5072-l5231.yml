canonical_text:
  quote: ''
  summary: The passage contains the end of an animal tale in which a sung request
    for oven-baked cakes leads the Fox to send her daughters and then a Cock; the
    daughters are killed, while the Cock episode includes capture by the Tom-Cat and
    a corrupted note reporting revival after being thawed before a fire. It then gives
    the full 'Story of Elk's Head,' where an old couple and their daughter eat stored
    animal parts, the daughter dies choking on mare's tongue, the old woman gives
    birth while grieving, the old woman and boy die, the old woman briefly rises to
    strike the old man, and the old man scatters in ashes.
  language: English translation with embedded Russian transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song addressed to the Fox in her warm nest asks her to bring an oven-baked
    cake and includes percussive imagery of a little staff at an oaken door-sill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Fox sends Small-Stuffed-One with an oven-baked cake; the recipient strikes
    her on the head, kills her, and hides the body parts under sand and stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the song is repeated, the Fox sends Palachelka with an oven-baked cake,
    and she is killed likewise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Fox sends the Cock with an oven-baked cake; the Tom-Cat catches the Cock,
    carries him home, and beats him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the corrupted note attached to the Cock episode, the Cock's body is thawed
    before a fire, the Cock comes to life, and he crows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tom-Cat warns that whoever comes, the door must be kept tightly closed;
    afterward the household lives happily.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Story of Elk's Head, an old man and old woman send their daughter to
    the roof for an elk's head; they chop it small, cook it in a kettle, eat it, and
    finish it in one day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old couple send the girl to the roof for a mare's tongue; after it is
    cut and fried, the first morsel sticks in the girl's throat and she dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The old woman cries so much over the dead girl that she brings forth a boy,
    and the old man kindles a large fire to celebrate the birth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Before the old man returns from the roof, the old woman and the boy die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the old man strikes and rebukes the dead old woman, she jumps up, strikes
    him on the head, and dies again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The old man falls down and scatters all around in ashes; the tale ends by
    saying they live till now but get nothing good.
  category: sequence
  evidence_refs:
  - ev:9
