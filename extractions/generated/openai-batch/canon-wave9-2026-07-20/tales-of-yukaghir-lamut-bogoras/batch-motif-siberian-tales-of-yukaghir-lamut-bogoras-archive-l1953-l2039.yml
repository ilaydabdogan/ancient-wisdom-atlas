canonical_text:
  quote: ''
  summary: 'The passage ends a comic tale in which an old man who has feigned death
    hides in an abandoned hut to eat elk meat alone; his wife discovers him, sends
    a ptarmigan to scratch him, and forces him to return and share. It then begins
    a Tungus bear tale: a secluded beautiful younger daughter is abducted by a bear
    into its winter lair, survives by sucking fat from the bear''s paw, becomes the
    bear''s wife, and later asks for fire so she can cook meat. A collector''s note
    describes regional bear taboo and reverence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy reports that the supposedly dead old man laughs while being hauled;
    the old woman rejects this and says the old man is dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman and boy place the old man inside an abandoned hut, shut the
    door, and leave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After several days the boy sees smoke from the hut; the old woman sees the
    old man making a fire and cooking fat meat from a hidden elk he had killed before
    feigning death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old woman has the boy catch a live ptarmigan, plucks it except for its
    wings, and instructs it to fly through the chimney-hole and scratch the old man
    until it draws blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ptarmigan enters the hut through the chimney-hole, lacerates the old man's
    body, and frightens him into running home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the closed door, the old woman denies that he is her old man because her
    old man is dead, and asks whether he came from this world or the other one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After letting him in, the old woman beats him with a poker and warns him not
    to eat alone without her; he brings the elk carcass home and they continue living
    together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the bear tale, a Tungus family keeps its pretty younger daughter continually
    in her sleeping room, attended by an old woman nurse, so that no strange eye will
    see her beauty.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bear lifts the lower edge of the sleeping-room cover, enters, covers the
    girl's mouth, and carries her to his lair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bear stops up the lair entrance for the cold season; when the girl wakes
    hungry, she sucks the thick part of the bear's paw until fat drips from it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: As the days grow longer, the girl becomes the wife of the bear after being
    pressed down by his weight.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the warm season the bear brings game every day, but the girl cannot eat
    raw meat and asks the bear, addressed as grandfather, to bring fire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bear returns with a firebrand, a knife, an ax, and meat; the girl makes
