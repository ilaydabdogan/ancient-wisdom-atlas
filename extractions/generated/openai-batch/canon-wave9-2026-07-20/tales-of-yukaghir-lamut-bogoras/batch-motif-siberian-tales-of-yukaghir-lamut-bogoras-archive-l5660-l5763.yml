canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a boy learns from a Snow-Bunting
    that his parents are brother and sister, after which an enchanted axe kills the
    mother; a complete Lamut tale in which a man or Monster catches and eats large
    stores of fish, approaches a village, is exposed by a needle case, injures himself
    in a skipping challenge, and is killed by the returning people; and the opening
    of a Yukaghir tale about a lazy husband, his working wife, and the approach of
    Yaghishna, the unclean idol.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man goes to a woman's tent, marries her, and later she bears a boy who grows
    old enough to shoot with a bow and arrows made by his father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy shoots at a Snow-Bunting, which tells him not to shoot and says he
    is the child of a brother who married his own sister.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy reports the Snow-Bunting's words to his mother, who tells him not
    to say it to his father and repeatedly prevents him from speaking to the father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After hearing the boy's report, the father grinds an axe, hangs it above the
    entrance, speaks a conditional spell to it, and the axe falls and kills the woman
    when she enters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man, or perhaps a Monster, makes a willow fish trap and a weir across a
    river; the fish trap speaks when he asks whether it is whistling or choking.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For nine days the fisher fills nine drying racks and nine storehouses with
    dried fish, then consumes one storehouse per day until all are gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Monster approaches a village singing that people live there and that he
    will have a meal; a needle case in a work bag warns Lamut boys that the Monster
    is coming.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The people flee, leaving the needle case among offal; a gray jay then invites
    the Monster to a skipping match between drying racks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the skipping attempt the Monster breaks a leg and cuts it off, after
    which the needle case sings out that the monstrous old man has broken his leg.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: When the people hear the needle case's voice, they return with knives and
    axes, attack the Monster, and kill him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After killing the Monster, the people turn over the body and find that a long
    whetstone has entered his anus about a foot.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the beginning of a Yukaghir tale, a very lazy man lies in his tent while
    his wife chops wood, tends traps and snares, prepares food, and cooks.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The wife goes out, sees Yaghishna, called the unclean idol, coming, returns,
    and sings a formula.
  category: sequence
  evidence_refs:
  - ev:12
