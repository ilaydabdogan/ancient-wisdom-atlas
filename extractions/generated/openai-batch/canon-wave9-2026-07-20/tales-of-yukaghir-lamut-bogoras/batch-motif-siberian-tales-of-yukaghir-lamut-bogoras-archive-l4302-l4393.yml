  quote: ''
  summary: The passage describes a household 'grandfather' bag consulted for travel,
    loans, and protection, including a story in which it saves a man from a fright.
    It then gives a short Machekur episode involving Machekur, his wife, and three
    Mice-Girls, followed by the opening of a tale in which Snow-Bunting asks to live
    with better-prepared Mouse during winter.
