canonical_text:
  quote: ''
  summary: A strong Chuvantzi man named La’la and his youngest brother pursue Chukchee
    raiders who have killed their father and brothers, driven off the herd, and taken
    their mother. La’la uses a deception in the Chukchee camp while his brother turns
    into a fox to distract them, then kills many raiders and spares the rest. Later
    La’la travels in shabby outer clothing to seek a wife; women at a water-hole mock
    and mistreat him, but the youngest of three sisters refuses to do so, invites
    him home, and marries him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old Chuvantzi man has four sons; the middle son, La’la, is described as
    very strong and as repeatedly fighting and killing many Chukchee.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: La’la goes into the woods to cut a birch tree for a sledge and takes his youngest
    brother, who climbs to the top of a birch tree.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: From the tree, the youngest brother sees the Chukchee attack the family, but
    at first describes the events to La’la as ravens and crows coming or attacking
    one another.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youngest brother finally reports that the father and brothers have been
    killed, the herd driven off, and their mother made to follow while dragging tent
    poles.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When La’la and his brother return home, they find their father and brothers
    murdered, the herd gone, and the ground trampled by invaders.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers pursue the Chukchee caravan on snowshoes and find their mother
    at the rear dragging heavy tent poles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: La’la tells his youngest brother to stay behind and, when signaled with La’la’s
    first finger, to turn into a fox and run in view of the Chukchee.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: La’la enters the Chukchee camp claiming to be a man from farther away who
    came too late and had wanted to kill La’la.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Chukchee display La’la’s weapons; six men are needed to bring the bow
    and eight men to bring the quiver.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger brother turns into a fox and draws the Chukchee’s attention; La’la
    then seizes the bow and shoots them, killing five hundred in three hours and sparing
    only a few with a warning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Afterward La’la tells his mother that, since his brothers are dead, he will
    look for a wife and asks her to prepare a shabby overcoat made from the worst
    shreds of skin.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: La’la wears fine clothing under the shabby overcoat and travels on snowshoes
    to a river village with thirty houses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At a water-hole, women and girls laugh at La’la, call him shabby, spit at
    him, kick him, and pour water over him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The youngest of three sisters refuses to mistreat La’la, asks who he is, invites
    him to her house, and later identifies him to her father as her husband.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The young woman describes her father as the village chief, strongest man,
    and best hunter; after La’la is welcomed, fed, and given a bed, he marries her.
  category: relationship
  evidence_refs:
  - ev:8
