  text: The woman eats the pike from the intestine toward the head, discovers iron
    teeth in its mouth, throws away the remains, becomes pregnant, and gives birth
    to a girl.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl grows hourly rather than yearly and is soon larger than her older
