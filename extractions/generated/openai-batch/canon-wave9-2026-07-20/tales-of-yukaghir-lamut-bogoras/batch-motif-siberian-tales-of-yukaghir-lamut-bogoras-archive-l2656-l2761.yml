canonical_text:
  quote: ''
  summary: A woman craves pike, eats a fish with iron teeth, and later gives birth
    to a rapidly growing girl who threatens to eat her family. The older brother flees
    into the tundra, reaches a remote house guarded by wolves and bears, and marries
    a strange white-bodied woman who commands animals. When he returns home, he finds
    that the Pike-Girl has eaten their parents. She pursues him, destroys his six-legged
    reindeer, and gnaws a magically created iron tree in which he has taken refuge.
    A snow-bunting carries his message to his wife, who sends wolves and bears. The
    Pike-Girl changes into an ermine, is caught, chopped up, burned, and scattered
    as ashes; the brother returns to his wife and lives in peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife asks her husband to set nets in a lake because she wants to eat pike;
    he catches a large pike the same day.
