canonical_text:
  quote: ''
  summary: Yaghishna captures an old man and old woman, then finds a girl, commands
    and strikes her, leaves her to guard a spark, and forbids her to open one sealed
    storehouse. The girl opens it, finds charmed reindeer, ties them to a long line,
    and escapes across a river with them. When Yaghishna returns, the girl gives misleading
    explanations for crossing; Yaghishna tries to imitate her, falls into the river,
    bursts, and while being carried downstream tells the girl to use her body parts
    as household implements.
  language: English with a Russian/Cyrillic verse rendering included
  quote_policy: summarized
