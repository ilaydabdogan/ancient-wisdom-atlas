  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old man asks about the hunters' success, hears the first hunter's complaint,
    and says he will tell a story of a similar kind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old man says he was once a hunter who caught all kinds of game but was
    exacting and close-fisted when sharing with companions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the old man's story, a young woman strikes him, declares that he must become
    a wolf for three days, and later strikes him again to turn him back into a man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young woman then leads him near a village, strikes him, and turns him
    into a bunch of grass by the trail, where sledge runners hurt him until she later
    restores him to human form.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After being restored, the old man strikes the woman and uses the remembered
