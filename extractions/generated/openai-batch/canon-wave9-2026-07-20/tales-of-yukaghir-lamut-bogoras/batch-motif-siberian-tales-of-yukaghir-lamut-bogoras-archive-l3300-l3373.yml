canonical_text:
  quote: ''
  summary: A hunter, aided by his dog, makes a successful sable hunt and later joins
    two companions. After a larger shared hunt, the companions give him an unequal
    portion of the sable skins, and he leaves feeling wronged. The men encounter an
    unfamiliar house beside a tall thin birch tree and meet a frail old man. The old
    man tells them that he too was once a successful but close-fisted hunter; a young
    woman punished him by transforming him into a wolf and then into grass, and he
    later retaliated by turning her into a birch tree, but could not restore her.
    Living beside the tree, he interprets his condition as punishment and warns the
    two companions not to wrong their fellow hunter.
  language: English
  quote_policy: summarized
