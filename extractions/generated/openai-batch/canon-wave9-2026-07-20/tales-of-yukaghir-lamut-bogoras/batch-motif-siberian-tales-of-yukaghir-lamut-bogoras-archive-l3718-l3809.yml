canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which travelers receive provisions after
    furnishing a population with bodily openings, reach an island household surrounded
    by human remains, avoid eating human fingertips served as berries, and escape
    when the ''knowing one'' uses pipe ashes and a wolf howl to make the hosts and
    their bear sleep. They return home after three years to wives who had thought
    them dead. The passage then begins the Tale of La''la: La''la is a wealthy warrior
    known for furs; a Chukchee war party plans to attack him; while La''la works on
    a replacement snowshoe, his younger brother climbs a tree and sees the attackers
    coming.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The visitors are asked to furnish an entire population with anus and urethra,
    are paid with costly fur, and take dried meat from that place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers sail to another island where a single large house stands on
    the bank and an old man and his wife live there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A big brown bear is tied before the entrance as a watch-dog, and racks near
    the house are filled with human body parts bearing rings, earrings, and footwear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man asks his wife to bring cloud-berries for the guests, and she brings
    carefully cut rosy fingertips of women and children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 'knowing one' tells his companions not to eat the food but to hide it
    in their clothing; afterward they loosen their girdles outside and the fingertips
    fall to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 'knowing one' plans to smoke, knock glowing ashes from his pipe bowl,
    howl like a wolf, and rush out while the others hold on to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the wolf howl, the bear at the door and the old couple in the house
    fall asleep, and the visitors leave to find the skin boat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The travelers stop journeying farther, turn homeward, make almost no landings,
    and obtain provisions from people whose intestines they had earlier provided with
    openings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The journey lasts three complete years; the travelers' wives have given birth,
    believed their husbands dead, swoon when the men return, and later live with them
    as before.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: La'la is described as rich in peltries, known for costly furs, a great warrior,
    and living with his own family.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Chukchee men plan to make war on La'la, take his peltries, and kill the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: La'la goes into the woods with his younger brother to make a new snowshoe
    board; the brother climbs a high tree, looks homeward, and sees Chukchee coming.
  category: sequence
  evidence_refs:
  - ev:8
