canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which the daughter of the Yagha-Witch
    follows a road through a water-hole to the lower world, receives a net and a covered
    box from an old woman, and is destroyed with her mother when a flame comes out
    of the opened box; an old man and his daughter then join the old woman in the
    underworld. It then gives the Story of Magus: Magus''s four sons, each marked
    by a fragile body part, die one after another; Magus travels to Kosetoka, kills
    Kosetoka''s children, deceives the evil spirit with a decoy, hides underground,
    and causes a round hole to become a circular knife that cuts Kosetoka in two.'
  language: English
  quote_policy: summarized
