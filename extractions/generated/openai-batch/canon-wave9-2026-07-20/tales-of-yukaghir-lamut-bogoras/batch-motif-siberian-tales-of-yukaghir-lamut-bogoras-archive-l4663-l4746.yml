canonical_text:
  quote: ''
  summary: The passage contains a short tragic tale in which an old woman sends three
    daughters named for scraping or sharpening tools to ask a Bad Merchant for food;
    after refusal, deception, and rejection, she kills the daughters and herself.
    A collector's note contextualizes such stories as children's tales with real-life
    details and possibly older Yukaghir story-cycle elements. The passage then gives
    the complete story of Kundarik, a boy abandoned to Yaghishna, who evades her,
    becomes an ermine, and traps her first on a spiked stump and then in a grave-like
    hole before returning to his parents. The passage ends with the opening fragment
    of another Yaghishna story involving an old couple and a swaddled girl.
  language: English
  quote_policy: summarized
