canonical_text:
  quote: ''
  summary: 'The passage contains the end of one tale: a youngest sister notices that
    supposed husbands have black, daggerlike iron teeth, flees into the forest, dresses
    a tree stump as a decoy, traps a pursuing heretic or monster by its teeth, and
    impales it with a fire-hardened wooden stake. She reports the event to another
    settlement; the searchers find the household gone and the fate of women and children
    unknown. The passage then gives an episode from a Fox-and-Wolf story: Fox escapes
    a man and dogs by entering a polar owl nest, asks Owl to wet her neck so she slips
    free, later asks Owl to teach her to fly, and is dropped and killed. Editorial
    notes connect the broader Fox-and-Wolf tale to a usual Old World story and describe
    owl nests in hollow trunks or driftwood.'
  language: English
  quote_policy: summarized
