canonical_text:
  quote: ''
  summary: A childless old woman finds an infant boy in her house, raises him, and
    names him Alder-Block. He becomes a skilled canoe-maker, leaves by night to see
    the wonders of earth and sea, and reaches an island where the witch Yagha lives
    with her many-eyed daughters. The daughters use cakes in a birchbark vessel as
    bait, but Alder-Block puts their eyes to sleep, takes the cakes, insults and injures
    them, and returns by canoe. After the second encounter, Yagha restores the injured
    daughter with the water of life and youth. Editorial notes compare the tale and
    Yagha figure with European, Russian, Kolyma, and other traditions.
  language: English
  quote_policy: summarized
