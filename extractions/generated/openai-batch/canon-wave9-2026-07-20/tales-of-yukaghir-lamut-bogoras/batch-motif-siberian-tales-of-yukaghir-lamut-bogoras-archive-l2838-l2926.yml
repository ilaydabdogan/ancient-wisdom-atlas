canonical_text:
  quote: ''
  summary: In one tale fragment, a human woman and her son hide from a cannibal She-Monster
    by entering a wooden box that is transformed into an elevated iron storehouse;
    the monster swallows the girl child before a man kills, burns, and disperses the
    monster's remains. In the following tale, three brothers travel among lonely way
    houses, where the eldest brother repeatedly fights iron-toothed beings and becomes
    monster-like himself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children are playing outside when their aunt, identified as the eldest
    sister and the She-Monster, appears, hugs and kisses them, and bites the boy's
    upper lip and the girl's lower lip.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children run to their mother with blood on their faces and identify their
    aunt as the one who kissed them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The human sister asks to leave the house, and the boy slips out after her;
    they run to a storehouse and squeeze into an old wooden box.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman addresses the wooden box and commands it to become an iron storehouse
    standing high on twelve iron supports; the transformation occurs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eldest sister catches the girl, swallows her, spits out small bones, and
    gnaws at the supports of the iron storehouse until only three supports remain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man arrives, kills the She-Monster with a sword, chops her into pieces,
    burns her, burns the worms and vermin that crawl from her body, scatters the ashes
    to the four winds, and throws the remaining bones into the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the She-Monster's destruction, the survivors go to another country and
    live there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the next tale, three brothers travel through lonely places, stop at way
    houses or log cabins, make fire, and prepare soup.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:9
  text: At the first way house, a floor board is lifted and a monster with iron teeth
    appears; the eldest brother sends the others outside and fights it alone while
    they hear noise and gnashing teeth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the second log cabin, the Monster with Iron Teeth appears again; after
    the eldest brother fights it, he comes out changed, no longer fully human, devil-like,
    and with iron teeth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the third log cabin, a blood-covered woman with iron teeth rushes at the
