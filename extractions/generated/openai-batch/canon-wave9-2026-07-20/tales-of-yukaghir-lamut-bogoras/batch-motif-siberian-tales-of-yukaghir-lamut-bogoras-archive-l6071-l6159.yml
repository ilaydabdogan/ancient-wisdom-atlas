candidate_motifs:
- id: motif:1
  label: Child promised to a dangerous animal under threat
  taxonomy_refs:
  - sacrifice
  basis: The Bear threatens to kill the family unless Kundirik’s father promises to
    give him the boy.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The exchange is coerced and not described as ritual sacrifice, so the
    taxonomy reference is approximate.
- id: motif:2
  label: Clever child kills animal captor through deception
  taxonomy_refs:
  - trickster_boundary
  basis: Kundirik uses deceptive claims about travel, sleeping arrangements, and stone
    defecation to lure the Bear into a vulnerable position and kill him.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents practical trickery and effective speech but does
    not explicitly name Kundirik as a trickster.
- id: motif:3
  label: Threshold confusion at window or inside-outside boundary
  taxonomy_refs:
  - trickster_boundary
  basis: Kundirik remains on the window sill while answering the Bear as if alternately
    outside and inside, confusing the Bear before capture.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The confusion delays the Bear but does not by itself resolve the episode.
- id: motif:4
  label: Spoken command causes bodily binding and release
  taxonomy_refs: []
  basis: Kundirik’s words cause the daughters to stick to the floor and later detach
    from it.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: high
  cautions: The mechanism of the command is not explained in the passage.
- id: motif:5
  label: Marriage reward after release from enchantment or affliction
  taxonomy_refs:
  - sacred_marriage
  basis: After Kundirik releases the daughters from the floor, he is given the youngest
    daughter in marriage.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: low
  cautions: The marriage is a narrative reward, but the passage does not frame it
    as sacred or cosmological.
- id: motif:6
  label: Magical relocation of parents and house by spoken call
  taxonomy_refs:
  - return
  basis: Kundirik calls for his father and mother to come to his father-in-law’s place,
    and they arrive together with their house.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage does not explain whether the event is return, transportation,
    or transformation.
- id: motif:7
  label: Nocturnal animal intruder opposed by shamanic watcher
  taxonomy_refs: []
  basis: A shaman watches over a village where people vanish; a black dog enters at
    night through the window and attacks a man, and the shaman strikes it with a sword.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The excerpt ends before the black dog’s identity or wider narrative function
    is explained.
- id: motif:8
  label: Wrong limb restoration with animal body part
  taxonomy_refs: []
  basis: After the black dog tears off the man’s arm, the shaman accidentally attaches
    the severed dog limb to the man’s body, where it sticks.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: The subsequent consequences of the attached dog limb are outside the supplied
    passage.
