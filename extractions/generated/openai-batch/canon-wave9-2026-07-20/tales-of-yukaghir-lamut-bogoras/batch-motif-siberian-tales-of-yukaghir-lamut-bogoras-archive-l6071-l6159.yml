- id: ev:12
  type: summary
  locator: 6135-6140
  quote_or_summary: The youngest daughter is given to Kundirik in marriage; he takes
    her home, where his parents live in a small hut with a small fire and bubbling
    tea kettle.
  source_text_path: texts/public-domain/siberian/project-gutenberg/tales-of-yukaghir-lamut-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 6140-6147
  quote_or_summary: Kundirik returns to his father-in-law, calls for his parents to
    come over, and they appear; the father-in-law sees new people with their house.
  source_text_path: texts/public-domain/siberian/project-gutenberg/tales-of-yukaghir-lamut-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 6151-6157
  quote_or_summary: In a village people vanish nightly; a shaman arrives, asks what
    is wrong, and offers to keep watch.
  source_text_path: texts/public-domain/siberian/project-gutenberg/tales-of-yukaghir-lamut-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 6157-6161
  quote_or_summary: At night the people hide in boxes and bags; the shaman takes a
    sword and waits in the darkness while they sleep.
  source_text_path: texts/public-domain/siberian/project-gutenberg/tales-of-yukaghir-lamut-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 6161-6164
  quote_or_summary: A black dog glides noiselessly through the window, seizes the
    shaman’s fellow-traveler, and tears off one arm with the shoulder blade.
  source_text_path: texts/public-domain/siberian/project-gutenberg/tales-of-yukaghir-lamut-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 6164-6167
