canonical_text:
  quote: ''
  summary: The passage contains the end of a Kundirik tale, in which a boy promised
    to a Bear survives by trickery, punishes inhospitable daughters, causes an old
    woman’s death through a horse, marries the youngest daughter, and brings his parents
    and their house to his father-in-law’s place. It then begins a Markova tale about
    a shaman keeping watch in a village where people vanish; a black dog enters at
    night, seizes a workman, and is struck by the shaman, resulting in a dog limb
    being attached to the injured man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man hunting wild reindeer is attacked by a Bear, who spares him only
    after he promises to give the Bear his son Kundirik.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kundirik’s parents make dolls for him, place him on the window sill with the
    dolls, and leave the house forever.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Bear calls for Kundirik, the boy answers alternately as if outside
    and inside while remaining on the window sill, after which the Bear breaks the
    wooden wall and seizes him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kundirik tells the Bear that his father used to carry him on his shoulders,
    and the Bear carries him that way.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kundirik and the Bear come to a big hole in the ground with aspen poles and
    a sleeping place of green branches.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kundirik persuades the Bear to sleep in the hole, gathers heavy stones, says
    his stomach is aching, pushes the stones down, and the Bear dies from the impact.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kundirik enters a house where a man and his three daughters live; the daughters
    refuse to serve him food and drink.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kundirik quietly commands that the girls’ buttocks stick to the flooring,
    and in the morning the boards lift with them when they try to rise.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kundirik fetches the old man’s mother; while traveling, she asks him for bodily
    assistance, and he directs her to a horse, which tears her in two.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the old woman is torn open, mice, ermine, spermophile, toads, and grubs
    come out of her body.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kundirik commands that the girls be detached from the floor, and they are
    freed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kundirik is given the youngest daughter in marriage and takes her home to
    his parents, who live in a small hut with a small fire and tea kettle.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Kundirik returns to his father-in-law’s better-off household and calls for
    his parents to come there; his parents and their house appear.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: In the beginning of the next tale, people in a village vanish nightly, and
    a shaman offers to keep watch.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The shaman waits in the dark with a sword while villagers hide in boxes and
    bags and sleep.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: A black dog enters noiselessly through a window, seizes the shaman’s fellow-traveler,
    and tears off one arm with the shoulder blade.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The shaman cuts off the corresponding limb of the dog and mistakenly applies
    the dog limb to the man’s body, where it sticks.
  category: sequence
  evidence_refs:
  - ev:17
