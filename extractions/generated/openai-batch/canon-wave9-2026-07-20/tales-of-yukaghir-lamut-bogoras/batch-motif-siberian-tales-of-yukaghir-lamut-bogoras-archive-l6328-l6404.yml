canonical_text:
  quote: ''
  summary: The passage contains the end-to-end tale of Gege-Woman, in which two elder
    sons ignore a father's warning, meet a woman catching fish with breeches, reject
    her food, and are devoured by summoned predators; the youngest son accepts her
    food, survives, flees into an underground woman's house, and returns home after
    the two women kill each other. The passage then begins a second tale, 'Story of
    Heretics with Iron Teeth,' introducing three brothers married to three sisters,
    their departure to examine deadfalls, and the wives' anticipation of their return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man and his wife have three sons, and the old man warns the sons not
    to climb the roof or the upper beam.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder son climbs to the roof and upper beam, sees Gege-Woman on the seashore
    catching fish with her breeches, and goes to her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gege-Woman offers to become the elder son's wife and cook for him; after he
    rejects and insults the fish, she calls wolves, bears, and wolverines, which devour
    him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second son repeats the same visit to Gege-Woman, rejects her cooked fish,
    and is devoured by bears, wolves, and wolverines after she calls them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youngest son goes to Gege-Woman, accepts and eats the food, lives with
    her, and she forbids bears and wolves to devour him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man builds deadfalls and other traps, catches bears, wolves, and wolverines
    one by one, and tells his son that nobody is left to destroy him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The youngest son flees at night, sees smoke coming from the ground, plunges
    down, and reaches the underground house of Haihai-Woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gege-Woman and Haihai-Woman dispute over the young man as husband, fight,
    and kill each other; the young man returns to his parents, and the family takes
    possessions from the dead women's houses and becomes rich.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the next tale opening, three brothers are married to three sisters and
    go in fall to examine their deadfalls, while their wives and children remain in
    the settlement.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The middle sister repeatedly says the husbands are coming home; after sunset
    the wives hear sled runners, dogs, bells, and voices, and prepare supper as the
    husbands return.
  category: sequence
  evidence_refs:
  - ev:9
