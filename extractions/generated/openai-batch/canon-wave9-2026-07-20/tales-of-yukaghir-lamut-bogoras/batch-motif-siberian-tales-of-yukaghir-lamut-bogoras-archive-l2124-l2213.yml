  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the child cries, the substitute removes her left boot and gives the boy
    her left heel to suck instead of nursing him from the breast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The husband becomes angry at the way the child is fed and says he will return
    the woman to her mother the next morning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The true Grass-Blade-Girl, left naked in Yaghishna's underground cellar, finds
