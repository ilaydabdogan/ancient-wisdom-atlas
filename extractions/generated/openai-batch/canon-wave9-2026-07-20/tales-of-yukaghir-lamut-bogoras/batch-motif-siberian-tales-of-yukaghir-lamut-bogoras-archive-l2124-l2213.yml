canonical_text:
  quote: ''
  summary: After marriage, Grass-Blade-Girl is separated from her husband near Yaghishna's
    house when she asks for water. Yaghishna imprisons her in a deep dark cellar,
    takes her clothes, becomes exactly like her, and takes her place. The substitute
    later reveals abnormal behavior with the child. The true Grass-Blade-Girl escapes,
    is killed by animals sent by Yaghishna, and returns through grass grown from her
    blood. She then recounts the events in a tale, after which the husband kills Yaghishna
    and takes Grass-Blade-Girl home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man marries the young woman and takes her toward his house; while
    passing Yaghishna's house, she says she is thirsty and asks him to bring water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband goes to a lake with an ice-pick, cuts through the ice in several
    places, finds no water, and moves out of the woman's sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dogs of the team scent Yaghishna's house, rush there with the sledge,
    and the woman cannot hold them back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yaghishna brings the young woman into the house, seats her on a new reindeer
    skin, and causes her to fall into a very deep, wide, dark underground cellar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The trapped young woman asks to be let out and offers anything Yaghishna asks;
    Yaghishna demands her clothes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young woman sends up a bundle of clothes on a line; Yaghishna puts on
