canonical_text:
  quote: ''
  summary: A father takes his daughter by sledge to the house of the Unclean Idol
    and leaves her there. Following his instruction, she cooks ashes and coals, which
    become fat and meat. Hungry vermin who call themselves children of the Unclean
    Idol emerge from under the floor, ask for food from the household bowl and spoon,
    and she feeds them all, leaving herself hungry. The Unclean Idol then arrives
    flying with paper wings. A note explains that the expression usually has a Russian-story
    usage but here denotes a monster.
  language: English
  quote_policy: summarized
