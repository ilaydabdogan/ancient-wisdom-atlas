canonical_text:
  quote: the bear was weeping like a man
  summary: The passage includes the ending of a forest-demon tale and the full “Story
    of Transformed Bears.” In the first, a woman’s husband is killed by the old forest-demon,
    who is identified as his father, and the woman leaves with her children. In the
    second, a male bear mourns a drowned female bear, leads a Christian hunter to
    her body, reveals human identity tokens under bear skin, asks to be killed and
    buried with her, and the two bears are finally identified as merchant-class lovers
    who used to meet in bear form but could no longer become human.
  language: English
  quote_policy: quoted
