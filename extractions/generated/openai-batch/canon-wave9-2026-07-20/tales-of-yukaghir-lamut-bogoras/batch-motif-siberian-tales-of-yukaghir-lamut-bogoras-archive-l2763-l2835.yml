canonical_text:
  quote: ''
  summary: Three orphaned sisters live alone. The eldest is revealed as a cannibal
    who has eaten their stored meat and their father’s corpse and part of their mother’s
    corpse. The two younger sisters flee with feathers dropped by wild geese, but
    the second sister looks back during the pursuit and is swallowed by the She-Monster.
    The youngest continues, later reaches an isolated house, gives feathers to a young
    man through the chimney, removes her feathers, returns to human form, and becomes
    his wife. The She-Monster has foretold that the youngest will have a boy and a
    girl and that she will come to her later; the passage ends after the children
    are born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A family has three daughters and no sons; after both parents die, the daughters
    remain alone and support themselves by hunting, fishing, berrying, and gathering
    roots.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the youngest sister returns from berrying, she sees raw meat between
    the eldest sister’s teeth and notices that stored dried meat, reindeer, and elk
    are gone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At their parents’ graves, the two younger sisters find the graves opened,
    the father’s body eaten, and only part of the mother’s body left; the narration
    attributes this to the eldest sister.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two younger sisters decide not to return home because they fear the eldest
    will finish eating the mother and then come for them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The younger sisters ask flying wild geese for feathers; the geese drop feathers,
    which the girls place between their fingers before flying after the geese.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The youngest sister warns the second sister not to heed or answer the eldest
    sister’s calls and especially not to look back at her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eldest sister pursues from the ground, calls to the fleeing sisters, and
    invokes their shared mother and womb.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The second sister looks back and down; the She-Monster opens her mouth, and
    the girl falls into it and is swallowed without chewing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youngest sister continues without looking back, and the She-Monster eventually
    stops pursuing but foretells that the youngest will later be married, have a boy
    and a girl, and be visited by her.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The youngest sister reaches a small isolated house, looks down through the
    chimney, and drops feathers to a young man who is feathering arrows near the fireplace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the young man asks whether she is human or an evil spirit, she removes
    her feathers, turns into her former self, descends into the house, and is taken
    as his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The couple lives together for a long time; she gives birth first to a boy
    and then to a girl, and the husband goes out daily to search for game.
  category: sequence
  evidence_refs:
  - ev:9
