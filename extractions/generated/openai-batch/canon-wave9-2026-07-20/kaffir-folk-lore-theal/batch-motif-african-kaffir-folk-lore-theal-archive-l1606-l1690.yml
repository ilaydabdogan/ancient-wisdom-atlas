canonical_text:
  quote: ''
  summary: A woman tries to cultivate ground, but a bird sings commands that undo
    the work. The woman and her husband set a concealed pit trap; the bird perches
    on the man's raised hand and is caught. When threatened with death, the bird says
    it can make milk, produces milk in the man's hand, and later fills a basket. The
    man keeps the bird at home in a jar and has it produce milk for himself and his
    wife, while the children continue drinking milk of the tree.
