canonical_text:
  quote: ''
  summary: Hlakanyana carries a pot to goat-herding boys and prompts them to borrow
    it for milking; when it breaks, he demands compensation and receives a goat. He
    then prompts calf-keepers to suck the goat; when it dies, he demands compensation
    and receives a calf. He next lends the calf to cow-keepers so the cows will give
    milk; the calf dies, and he begins another cumulative accusation. Each accusation
    recites the prior chain of losses and replacements.
  language: English
  quote_policy: summarized
