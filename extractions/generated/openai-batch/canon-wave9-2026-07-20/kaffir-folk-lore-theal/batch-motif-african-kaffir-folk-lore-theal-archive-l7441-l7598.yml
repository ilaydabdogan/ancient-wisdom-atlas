canonical_text:
  quote: ''
  summary: Animals store fat in a kraal and appoint successive gatekeepers. A fabulous
    animal, the inkalimeva, repeatedly neutralizes each keeper through sleep, honey,
    play, grooming, or racing, eats all the fat, awakens the keeper with a stone,
    and the animals kill each failed keeper. The supplied passage ends with the hare
    selected as the sixth keeper.
  language: English
