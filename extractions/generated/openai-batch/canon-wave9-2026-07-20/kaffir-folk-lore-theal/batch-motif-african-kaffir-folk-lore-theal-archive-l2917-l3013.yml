canonical_text:
  quote: ''
  summary: A river follows Tangalimlibo, its water turns into blood, and men pulling
    a riem become frightened and let go; the river goes back taking her with it. Her
    husband is told of a voice from the water asking that her father and mother be
    informed that she has been taken by the river. He tries to send a racing ox and
    a dog, but they only bellow and bark. A cock agrees to carry the message, rehearses
    it as a song, and is sent. On the road, boys tending calves want to kill the cock;
    the cock sings its message and they ask it to sing again.
  language: English
  quote_policy: summarized
