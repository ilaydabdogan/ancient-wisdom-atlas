  quote: ''
  summary: The opening of “The Story of Five Heads” introduces a man with two marriageable
    daughters. He visits a village across a river where a great chief lives, learns
    that the chief wants a wife, returns home, and asks his daughters which of them
    wishes to marry the chief. The eldest daughter, named Mpunzikazi, says that she
    wishes to be the chief’s wife.
