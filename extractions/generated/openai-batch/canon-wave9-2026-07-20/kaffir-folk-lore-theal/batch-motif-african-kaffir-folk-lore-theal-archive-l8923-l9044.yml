canonical_text:
  quote: ''
  summary: Editorial notes for “The Story of Tangalimlibo” give Xhosa song originals,
    describe the story’s wide circulation, discuss childlessness and a fertility charm
    made from heifer tail hair, explain affinal name-avoidance speech, mention wedding
    and beer-drinking details, and state a belief that a spirit causes drowning and
    may accept an ox as ransom.
  language: English with Xhosa song excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says the story is a favourite and widely known, and that native girls
    employed as nurses sometimes teach children to chant the cock’s song.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage prints Xhosa originals of two songs connected with the tale; the
    second is associated in the note with the cock’s song and includes the name Tangalimlibo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note states that a childless wife finds little or no favour, may be treated
    harshly by her husband, and may sometimes be returned to her parents, especially
    when a marriageable sister can be given in exchange.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the illustrative court case, a husband obtained a heifer because tail hair
    was needed by a clan doctor to make a charm for his childless wife’s neck; after
    this, she bore a son, and the heifer was not returnable after such use.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The note states a custom requiring a charm made from the tail hair of a heifer
    belonging to a relative of a childless wife, in order to cause her to bear children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note says a woman may not pronounce the names of her husband’s male relatives
    in the ascending line, nor words containing the principal syllable of such a name;
    one singer substituted an invented word for water.
  category: speech
  evidence_refs:
  - ev:6
