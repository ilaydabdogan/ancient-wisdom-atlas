canonical_text:
  quote: ''
  summary: 'The passage describes belief in a Supreme Being named Qamata, to whom
    people sometimes pray but do not offer sacrifices. It reports that in danger a
    person may call on Qamata for help and later credit Qamata with deliverance. The
    narrator records answers from aged Gaika informants: Qamata was not a chief, not
    the first man, and never a man; he may perhaps have created visible things, is
    greater than mountains, sun, and stars, is everywhere, sees all things, helps
    when asked, is thought altogether good, and is alone without another like him.
    The passage also notes that some now call him u-Tixo, a missionary-introduced
    name for God, and begins an incomplete note about a peculiar act connected with
    prayer or worship of Qamata.'
  language: English
  quote_policy: summarized
