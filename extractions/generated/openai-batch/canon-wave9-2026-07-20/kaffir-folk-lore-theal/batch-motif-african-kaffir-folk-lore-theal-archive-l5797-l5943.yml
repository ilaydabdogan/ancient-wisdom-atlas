canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which a cannibal displays a singing ''bird''
    in a bag; the girl''s brother recognizes the song as like his sister''s voice,
    and the chief tricks the cannibal away, opens the bag, rescues his daughter, and
    substitutes snakes and toads. The cannibal later opens the bag before other cannibals,
    is exposed, and is killed and eaten by them. The passage then begins another tale:
    two children, a son and daughter living with their grandfather, ask to visit their
    parents though their mother is a cannibal. Their grandfather and father warn them;
    the father hides them under skins when the cannibal mother arrives, but she smells
    them and uncovers them.'
  language: English
  quote_policy: summarized
