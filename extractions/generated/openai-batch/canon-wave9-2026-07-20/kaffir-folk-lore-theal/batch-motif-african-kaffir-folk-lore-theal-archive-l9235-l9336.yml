canonical_text:
  quote: ''
  summary: The passage gives notes on roots, herbs, poisons, antidotes, charms, a
    river-crossing charm against a river spirit, and a trial-favor charm using smoke
    and a root kept in the mouth. It then comments on games and training among boys,
    including Iceya in the Story of Sikulume, throwing sticks and imitation spears,
    sham fighting, imitation hunting, and training calves.
  language: English
