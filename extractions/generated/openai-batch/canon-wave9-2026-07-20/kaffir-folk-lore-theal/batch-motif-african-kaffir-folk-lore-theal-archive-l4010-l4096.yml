  quote: ''
  summary: At an ox-skinning at the kraal, Hlakanyana repeatedly calls the chief father
    and demands meat. The chief pushes, threatens, throws, and later tramples him,
    but Hlakanyana returns. Men advise giving him meat; he brings a first piece to
    his mother, receives more portions, declares himself a man, and volunteers to
    carry meat for the men despite their doubts.
