canonical_text:
  quote: ''
  summary: 'The passage describes a ranked succession and clan-division system: one
    son forms and governs a new clan while his brother is still young; rivalry or
    war may follow when the chief heir reaches manhood. If peace is maintained after
    the father’s death, the right-hand son acknowledges his brother’s superior rank
    while retaining internal autonomy. The passage then generalizes that the system
    encourages tribal subdivision, territorial expansion, and settlement at a distance
    from rival chiefs.'
