canonical_text:
  quote: ''
  summary: Two sisters flee after one breaks a valuable clay pot and fears returning
    to their father. After two days of travel with only gum to eat, they follow a
    distant fire to a house belonging to their aunt, Nomagoda, who is described as
    a cannibal. Magoda, her son, warns and hides them. Nomagoda smells children nearby.
    The next day the children see a maimed person who says the cannibal ate the rest
    of them. Nomagoda later discovers the children, takes them to her house, and tells
    them to sleep while they remain frightened.
  language: English
