canonical_text:
  quote: ''
  summary: 'The passage gives the complete tale of Long Snake: two sisters separately
    go to Long Snake''s village, perform food-preparation tasks for his mother, serve
    Long Snake bread and fermented milk, receive beautiful robes, and flee back to
    their father''s place under pretext of cutting firewood. Long Snake follows them
    as his wives to their father''s village, where the villagers burn him in a house.
    The supplied text then begins the tale of Kenkebe, describing a famine, a wife''s
    request that Kenkebe seek corn from her father, and Kenkebe''s hospitable reception
    by his father-in-law.'
  language: English
  quote_policy: summarized
