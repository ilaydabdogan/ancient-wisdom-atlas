  summary: 'The passage contains the closing fragment of a chief''s daughter''s marriage
    story, followed by the opening of the story of Simbukumbukwana: a childless man
    consults a wise woman, is asked for a fat calf for medicine, brings a calf without
    horns or tail, hears a prophecy of a limbless son, is told to keep it secret,
    tells his friends, and his wife gives birth to a daughter.'
