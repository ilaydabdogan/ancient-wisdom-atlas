    gesture. The passage then describes Xhosa marriage practices, including the marriage
    dance, guardian-arranged marriages, elopement by mutually attached young people,
    cattle transfer as the binding element of marriage, protections attached to that
    transfer, and marriage prohibitions based on family title.
