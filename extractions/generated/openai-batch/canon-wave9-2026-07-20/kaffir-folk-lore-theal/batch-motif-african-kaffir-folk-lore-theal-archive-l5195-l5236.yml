  quote: ''
  summary: A cannibal comes to a fastened cave door and tries to imitate Demane's
    voice in order to make Demazana open the cave. Demazana rejects him twice because
    his voice is unlike her brother's and hoarse. The cannibal consults another cannibal,
    conceals that he seeks the girl, burns his throat with a hot iron as advised,
    loses the hoarseness, and returns to sing again before the cave door.
