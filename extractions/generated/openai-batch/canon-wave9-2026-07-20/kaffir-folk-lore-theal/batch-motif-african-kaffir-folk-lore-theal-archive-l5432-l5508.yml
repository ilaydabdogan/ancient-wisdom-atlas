canonical_text:
  quote: ''
  summary: Runaway children escape a cannibal aunt, Nomagoda, by replacing themselves
    with blocks of wood. She pursues them, and they climb a tall tree. A bird named
    Ntengu, and later one of its feathers, sings so that the chips cut from the tree
    return and fasten in place. Exhausted below the tree, Nomagoda is eaten by three
    large dogs belonging to the children's father, who then recovers and forgives
    the children.
  language: English
  quote_policy: summarized
