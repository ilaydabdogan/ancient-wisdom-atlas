  summary: A male figure says his sister has beaten him, and she asks forgiveness.
    He then speaks wishes for his father's house, fire, and cattle to be present;
    each appears. He tells the addressed group to go into the house and fire prepared
    for them, and they remain in the pleasant place ever after.
