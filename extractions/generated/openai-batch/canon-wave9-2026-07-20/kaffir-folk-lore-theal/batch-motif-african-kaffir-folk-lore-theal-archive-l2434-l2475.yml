canonical_text:
  quote: ''
  summary: Mpunzikazi is warned not to eat thick milk and not to take water from a
    man carrying his head under his arm. She rejects the old woman’s advice, later
    laughs back at laughing trees, eats the milk, and takes the water. At the river
    of the chief’s village, the chief’s sister offers route advice, but Mpunzikazi
    ignores her and reaches the chief’s village.
  language: English
