canonical_text:
  quote: ''
  summary: A neglected wife keeps her daughter Tangalimlibo in the house until the
    father sees her as a grown young woman. The father celebrates publicly, a chief's
    son sees and seeks Tangalimlibo in marriage, and she is conducted to a large marriage
    feast. Her father gives her a large beautiful ox named after her, and she feeds
    the ox a piece of her clothing. After marriage she has a son, is loved by her
    husband, and is known for avoiding daytime and walking by moonlight. The passage
    ends as her husband leaves to hunt.
  language: English
  quote_policy: summarized
