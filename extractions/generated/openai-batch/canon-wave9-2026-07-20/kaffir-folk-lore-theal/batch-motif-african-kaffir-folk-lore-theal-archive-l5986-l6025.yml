canonical_text:
  quote: ''
  summary: A tired boy and girl are being pursued. The boy asks his sister to sing
    in the hope that the pursuer will take pity and go home. The girl says the pursuer
    wants meat, but sings after Hinazinci urges her. The cannibal hears the song,
    runs backward to her house, and tries to cut her husband with an axe before he
    restrains her. She resumes the chase, overtakes the children near their grandfather's
    village, and swallows first the girl and then the boy at the entrance of their
    grandfather's house.
  language: English
