canonical_text:
  quote: The crocodile cast off its skin, and arose a man of great strength and fine
    appearance.
  summary: A bird leaves a child near a house and later speaks about custom and manhood.
    A boy encounters a crocodile, goes to its underwater house, receives cattle and
    millet, and is told to send his sister to marry the crocodile. The sister goes
    as a bride, chooses Crocodile, licks his face, and the crocodile sheds its skin
    and becomes a strong, handsome man. During a famine, the mother and father of
    the children come without recognizing them; the children feed them, and the young
    man later confronts the father about having hung them in a tree.
  language: English
  quote_policy: quoted
