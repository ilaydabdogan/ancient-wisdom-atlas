canonical_text:
  quote: ''
  summary: The tale opens with a man who has two wives. Numbakatali has no children
    and is not loved by her husband; the other wife has a very dark daughter and several
    children who are crows. Numbakatali weeps because she has no offspring. While
    she works and cries in her garden, two doves perch nearby; one tells the other
    to ask why she is crying. She answers that she has no children and her husband
    does not love her.
