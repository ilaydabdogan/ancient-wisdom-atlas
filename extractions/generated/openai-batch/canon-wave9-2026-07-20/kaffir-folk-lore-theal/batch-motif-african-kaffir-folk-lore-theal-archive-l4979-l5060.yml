canonical_text:
  quote: ''
  summary: Hlakanyana eats a cub left in his care, escapes a pursuing leopardess by
    making her hold up a rock, then reaches a village of animals. There he learns
    about the chief animal's fruit tree, eats all its fruit at night, attaches a branch
    to a monkey, and accuses the monkey when the animals discover the theft.
  language: English
  quote_policy: summarized
