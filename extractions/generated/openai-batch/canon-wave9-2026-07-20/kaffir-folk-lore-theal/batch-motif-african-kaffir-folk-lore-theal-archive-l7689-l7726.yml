canonical_text:
  quote: ''
  summary: In this fragment of a hare story, the protagonist escapes without being
    caught, comes upon a bushbuck building a hut with meat cooking on a fire, asks
    for a piece of meat, is refused, and then eats all the meat. He whistles a particular
    tune, after which a hailstorm kills the bushbuck; he takes the bushbuck skin and
    makes a mantle. The hare then goes to the forest for weapons, is pelted with leaves
    by monkeys, calls them down to beat him, and kills them all when they descend.
    An editorial note says the story ends abruptly and is probably a fragment, and
    compares it to a similar story about a pool of water guarded by animals deceived
    by a jackal.
  language: English
  quote_policy: summarized
