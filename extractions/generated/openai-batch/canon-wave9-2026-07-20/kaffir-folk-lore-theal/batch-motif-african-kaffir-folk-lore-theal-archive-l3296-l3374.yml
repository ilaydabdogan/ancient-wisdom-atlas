canonical_text:
  quote: ''
  summary: A man rejects a child and orders the child abandoned. A wise woman says
    his wife will later bear a son without arms or legs because he did not keep a
    matter secret. The wife bears Simbukumbukwana, a limbless boy who speaks on his
    birth day. The earlier girl survives in a valley, living in a hole in an ant-heap.
    When she visits the fastened house where Simbukumbukwana is alone, her spoken
    commands cause his arms and legs to appear so he can open the door, and later
    cause them to shrink again after she has swept, ground millet, and made bread.
    The parents return and ask who did the work.
  language: English
  quote_policy: summarized
