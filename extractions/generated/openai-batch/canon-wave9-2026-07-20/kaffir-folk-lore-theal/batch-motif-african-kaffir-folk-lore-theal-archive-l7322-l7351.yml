canonical_text:
  quote: ''
  summary: A woman leaves her children in the care of a hare near a path used by wild
    animals. After the woman leaves, animals arrive; the hare becomes frightened,
    runs off, and watches. A terrible monster among the animals asks whose children
    they are. The hare gives their names, and the animal swallows the children whole.
    When the woman returns, the hare reports what happened, and the woman gathers
    dry wood and begins to sharpen two unspecified items before the excerpt breaks
    off.
