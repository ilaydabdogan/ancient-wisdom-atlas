canonical_text:
  quote: ''
  summary: 'A sequence of Xhosa proverbs with English translations and explanations:
    an animal stuck by a front leg signifies commitment; eating meal remains without
    permission signifies uncalled-for opinion; disturbing monkeys on their way to
    drink signifies interference; the moon dying and rising signifies a question that
    reappears; wormwood flowering and withering describes human life; the foot having
    no nose exhorts hospitality; exposing oneself warns against encouraging importunate
    requests; a crab stuck between stones signifies self-created difficulty or defeat
    in argument; and a greedy person ties a dog to a shrub so it will not beg while
    he eats.'
  language: Xhosa proverbs with English translation and explanation
  quote_policy: summarized
