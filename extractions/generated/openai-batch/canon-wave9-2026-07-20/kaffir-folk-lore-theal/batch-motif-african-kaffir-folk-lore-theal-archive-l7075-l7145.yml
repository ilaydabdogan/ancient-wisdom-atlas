canonical_text:
  quote: ''
  summary: A motherless boy, mistreated by his other mothers, leaves his father's
    place on an ox. The ox speaks, defeats one bull, and its horns produce and withdraw
    food. The ox later predicts its own death in another cattle fight and tells the
    boy to take its horns, which will supply food when addressed. The boy uses the
    horns in a food-poor village, but a house owner steals and substitutes them. The
    boy discovers the substitution, returns, and takes his horns from the thief.
  language: English
  quote_policy: summarized
