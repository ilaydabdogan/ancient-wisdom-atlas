canonical_text:
  quote: ''
  summary: In this fragment, a complaint says another wife's children are crows that
    eat corn. A dove tells Numbakatali to bring two earthen jars. The doves scratch
    her knees until blood flows, place the blood in the jars, receive corn, and continue
    coming daily to be fed while telling her to inspect the jars. She later finds
    two handsome children, a boy and a girl, in the jars, keeps them secret, and hides
    them in the hut. Only she and a servant girl know about them, while her husband
    does not visit.
