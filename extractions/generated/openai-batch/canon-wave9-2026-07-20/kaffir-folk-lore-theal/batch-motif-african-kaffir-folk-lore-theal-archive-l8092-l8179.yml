canonical_text:
  quote: ''
  summary: A set of Xhosa proverbs in English translation, including an explanatory
    account of Hili/Tikoloshe as a mischievous water-dwelling dwarf-like being. In
    the account, a husband suspects his wife has fallen in love with Hili, feigns
    a journey, returns at night, kindles a fire, finds Hili in the hut, and calls
    neighbours who beat Hili, tie him to the woman, and send her away. The saying
    is presented as a warning against wrongdoing. Additional proverbs concern taking
    advice, choosing the secure over the uncertain, shiftlessness, favouring strangers
    over relatives, and talebearing.
  language: English translation with Xhosa proverb phrases
  quote_policy: summarized
