canonical_text:
  quote: "“Then the mbulu took her clothes and put them on.”"
  summary: A girl leaves after her mother gives her a stick and then burns herself.
    At a river a mbulu splashes the girl so she must bathe, takes her clothes, and
    makes her claim to be its servant while it poses as a chief’s daughter. The mbulu
    is accepted at a village and marries a man, while the girl is sent to drive birds
    from the corn. The girl sings about the deception, and women plan a test involving
    the mbulu’s tail, mice, and fat; the supplied passage breaks off during this test.
  language: English
  quote_policy: quoted
