canonical_text:
  quote: ''
  summary: 'In the closing episode of the Demane and Demazana tale, Zim sends members
    of his household to fetch something from a bag, but bees sting them. He opens
    the bag himself, is stung and blinded, escapes through the thatch, falls into
    a pond, and becomes a wooden stump inhabited by bees. Demane and Demazana take
    his possessions and become wealthy. The next tale begins in famine: a woman leaves
    home, becomes a cannibal in a distant village, eats the inhabitants except for
    herself and her son Magoda, and becomes an exceptionally swift hunter. Her brother,
    who remained at home, has two daughters whom he treats unkindly and sends to the
    river for water.'
  language: English
  quote_policy: summarized
