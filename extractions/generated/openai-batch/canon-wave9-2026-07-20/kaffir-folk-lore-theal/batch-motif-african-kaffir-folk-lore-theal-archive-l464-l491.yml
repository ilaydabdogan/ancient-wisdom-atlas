  quote: ''
  summary: An introductory note explains that in South Africa the word “Kaffir” is
    used broadly for certain black natives, while on the eastern Cape frontier it
    is usually restricted to members of the Amaxosa tribe. The collected stories are
    said to come from individuals of that tribe. The passage also states that Europeans
    have used this designation since the discovery of the country, although the people
    so named cannot pronounce the word because the English r-sound is absent from
    their language.
