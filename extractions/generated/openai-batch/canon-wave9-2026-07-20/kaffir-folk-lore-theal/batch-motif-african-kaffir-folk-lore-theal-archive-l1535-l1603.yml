  summary: The passage begins a tale about a poor household that gets milk by squeezing
    a tree. The wife cultivates a garden, but after she leaves a bird sings commands
    for the weeds to rise and the work to disappear. The woman returns to find her
    work undone, marks the place, reports the event to her husband, is accused of
    laziness and lying, and on the third day finds the grass restored again while
    her marker sticks remain.
