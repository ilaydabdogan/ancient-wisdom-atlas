  summary: The passage closes one version with an unnamed man astonished at a child-like
    figure, Crocodile giving the parents three baskets of corn, and a move to the
    mountains where the man dies. It then introduces another version of the Bird that
    made Milk, said to be current among the Barolongs. In that version, a grain-dependent
    town suffers famine; the poor man Masilo and his wife dig in their garden all
    day; a bird comes to a house beside the garden, whistles, and commands Masilo's
    cultivated ground to mix together.
