canonical_text:
  quote: ''
  summary: After the milk-making bird flies away, the children fail to recall it and
    try to find it among birds in a tree. The boy catches a wrong bird, which bleeds
    heavily instead of making milk. Their father returns, learns what happened, and
    hangs the boy and girl from a tree over a river despite the mother's plea. The
    boy frees himself and his sister; the two leave home, ask a big rock to be their
    house, and live inside it while the boy hunts food.
  language: English
  quote_policy: summarized
