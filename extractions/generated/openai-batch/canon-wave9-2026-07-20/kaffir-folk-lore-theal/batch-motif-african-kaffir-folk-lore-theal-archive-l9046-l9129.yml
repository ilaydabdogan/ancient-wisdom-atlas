canonical_text:
  quote: ''
  summary: 'The passage reports incidents and beliefs concerning water spirits and
    underwater people: a girl drowns after companions say a spirit called and took
    her; her father attempts to recover her by offering cattle to the spirit; a man
    swept away at a flooded ford survives and is said to possess a powerful charm;
    and underwater people are described as wise beings from whom skilled witchfinders
    obtain knowledge. The excerpt also includes an editorial comparison that many
    tales have endings like English tales, in which the heroine marries a prince.'
  language: English
  quote_policy: summarized
