canonical_text:
  quote: ''
  summary: Mpunzikazi says she has come to be the chief's wife. The people question
    her lack of a retinue and tell her to prepare food for the absent chief. She makes
    coarse millet bread. In the evening the chief arrives with the sound of a great
    wind and is described as a big snake with five heads and large eyes. He rejects
    the bread, says she shall not be his wife, strikes her with his tail, and kills
    her. Afterwards, Mpunzikazi's sister tells their father that she also wants to
    be the wife of a chief.
  language: English
