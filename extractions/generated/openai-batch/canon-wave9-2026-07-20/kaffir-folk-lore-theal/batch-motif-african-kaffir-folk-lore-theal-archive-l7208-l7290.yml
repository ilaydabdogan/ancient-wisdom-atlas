canonical_text:
  quote: ''
  summary: A woman in hiding with two children drives animals away by dropping a pot-raising
    stone into their cooking pot. She later traps a buffalo and asks a glutton monster
    to skin it. The monster eats part of the meat, but the woman frightens him by
    blowing an empty calabash from behind a bush, follows him until he abandons the
    bag of meat, and takes the meat home to feed herself and her children. The children,
    described as twins, later ask for bows and arrows.
  language: English
  quote_policy: summarized
