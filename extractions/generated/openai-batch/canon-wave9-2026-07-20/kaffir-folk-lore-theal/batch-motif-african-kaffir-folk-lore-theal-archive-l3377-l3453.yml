canonical_text:
  quote: ''
  summary: A woman goes to work in her garden while a man hides to watch. Simbukumbukwana's
    sister arrives, enters the house, and sends him to fetch water. He walks beyond
    the nearby river toward a hill, and when he refuses to return, she sings a formula
    that makes his legs shrink. The father catches the sister and keeps her at home.
    The mother later finds Simbukumbukwana on the hillside, carries him home, and
    the sister sings another formula that restores his legs and arms. Later, when
    the sister and other girls go to get red clay, Simbukumbukwana follows; the sister
    beats him and leaves him in the path. Heavy rain falls, but not where the boy
    is.
  language: English
  quote_policy: summarized
