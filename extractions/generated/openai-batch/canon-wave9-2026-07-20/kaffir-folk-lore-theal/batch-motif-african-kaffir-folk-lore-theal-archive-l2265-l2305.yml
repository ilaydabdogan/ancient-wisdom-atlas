canonical_text:
  quote: ''
  summary: A singer describes a dangerous journey marked by the blood of girls and
    a darkness or gloom. While he sings, a great bird appears, tells the children
    to hold fast, carries them to their own town, and lands at midnight by the gate
    of Mosemanyanamatong's mother's house. In the morning the mother casts ashes on
    the bird, saying it knows where the children are. At midday the bird sends word
    to the chief to have mats spread in all the paths; after this the bird brings
    out all the children, delighting the people.
  language: English
  quote_policy: summarized
