canonical_text:
  quote: "“So Hlakanyana had all the meat and the millet to himself”"
  summary: Hlakanyana refuses to lend his companion eating implements and consumes
    the food himself. He then bargains to herd goats in exchange for the daughter
    of a man, eats the goats, falsely blames wild dogs, and leaves. Later he steals
    birds from a trap owned by cannibals, is caught, and faces being cooked before
    offering two oxen, one white and one red, as substitutes.
  language: English
  quote_policy: quoted
