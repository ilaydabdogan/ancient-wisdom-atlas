canonical_text:
  quote: ''
  summary: The hare reluctantly agrees to keep the gate after recalling other animals'
    deaths. While pretending to sleep, he catches the inkalimeva entering to take
    the animals' fat. The hare mocks the inkalimeva, proposes that they tie each other's
    tails, then ties the inkalimeva tightly, kills it with a club, eats most of its
    tail, and hides a piece in the fence. The animals return, rejoice at the inkalimeva's
    death, ask for the tail for the chief, discover the hidden piece, and report the
    hare. The chief orders the hare brought; the animals chase him, but he escapes
    into a hole where they set a snare.
  language: English
  quote_policy: summarized
