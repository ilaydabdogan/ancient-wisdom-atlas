canonical_text:
  quote: ''
  summary: Kenkebe goes to fetch his wife from her parents. On the way he borrows
    a crow's eyes, then later retrieves his own eyes after his wife tells him to return
    the borrowed eyes. He then exchanges stomachs with an ant. After a domestic incident
    involving spilled food, he explains that his stomach has been borrowed by an ant.
    His wife tells him to return the ant's stomach, and he retrieves his own.
