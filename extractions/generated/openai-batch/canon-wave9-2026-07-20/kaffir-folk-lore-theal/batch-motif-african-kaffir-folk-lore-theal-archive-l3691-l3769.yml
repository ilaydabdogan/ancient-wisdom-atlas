canonical_text:
  quote: ''
  summary: During pursuit by cannibals, Sikulume and the boys are sheltered by a little
    man who turns a stone into a hut. After returning home, they find the settlement
    empty except for an old woman in ashes, who says the people have been swallowed
    by an inabulele at the river. Sikulume enters the water with an assagai, is swallowed
    unharmed, sees his parents and others inside, kills the monster from within, and
    the young men cut it open so the swallowed people and cattle are delivered. A
    later sentence says Sikulume asks that his sister prepare food before he goes
    to the doctor.
  language: English
  quote_policy: summarized
