canonical_text:
  quote: ''
  summary: Mpunzanyana's father accepts her wish to become a bride, and a bridal retinue
    sets out with her. On the road a mouse shows the way, an old woman by a tree tells
    her to choose the little path rather than the big one, and a cony gives further
    instructions about the chief's village, river encounter, millet grinding, and
    not fearing her husband. At the river she meets the chief's sister, is shown a
    hut, and receives millet from the chief's mother to prepare food for the absent
    husband. In the evening a strong wind shakes the hut, but Mpunzanyana stays inside
    as chief Makanda Mahlanu arrives.
  language: English
  quote_policy: summarized
