canonical_text:
  quote: ''
  summary: A caller deceives Demazana into opening a cave by making her think her
    brother has returned. The cannibal enters and seizes her. While being carried
    away she drops ashes along the path. Demane returns, follows the ashes to Zim's
    dwelling, and finds that Demazana has been put in a big bag until a fire is made.
    Demane asks Zim for water; when Zim leaves, Demane removes his sister from the
    bag and puts bees in it.
