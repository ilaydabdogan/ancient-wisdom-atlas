canonical_text:
  quote: ''
  summary: A little girl left in the shade of a tree while her mother works is carried
    away by two birds across a great river to a pumpkin field near a cannibal town.
    A cannibal chief dreams of her, has her found, and later takes her as wife. She
    bears two children, one physically like herself and one like the chief, and the
    cannibals become jealous of the two-legged child.
