canonical_text:
  quote: ''
  summary: Hlakanyana escapes cannibals at a singing stone, obtains food from baboons
    by frightening them with an announcement, traps a hyena by fastening its tail
    while eating its meat, steals an iguana's musical instrument and escapes by changing
    into a rush, and then deceives a leopardess while eating her cubs one by one.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hlakanyana goes away with the red ox while cannibals eat the white ox and
    then pursue him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a big stone, Hlakanyana sings; the cannibals dance, and after he runs away
    the stone continues singing the same song.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Baboons promise food if Hlakanyana fetches water, refuse him food after he
    returns, flee when he shouts about a baboon marriage at his village, and leave
    him to eat all the food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hyena with cooked meat refuses to share but accepts Hlakanyana's offer to
    assist in building a house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: While helping with the thatch, Hlakanyana fastens the hyena's tail, takes
    the pot, eats all the meat, throws bones at the hyena, and leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a river, an iguana playing an ugwali lends the instrument to Hlakanyana
    after he denies that he would run away with it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hlakanyana runs away with the ugwali, changes himself into a rush, is thrown
    across the river in that form by the iguana, turns back into Hlakanyana, and continues
    playing the instrument.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hlakanyana offers to care for a leopardess's four cubs while she hunts, and
    he eats one cub after she leaves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hlakanyana presents the remaining cubs to the leopardess one at a time and
    later repeats the same cub to conceal the missing cubs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hlakanyana makes the leopardess's doorway very small so she cannot enter and
    makes a small hole at the back for his own exit.
  category: action
  evidence_refs:
  - ev:7
