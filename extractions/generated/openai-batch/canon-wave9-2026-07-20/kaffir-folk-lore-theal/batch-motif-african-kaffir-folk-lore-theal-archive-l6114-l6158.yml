canonical_text:
  quote: ''
  summary: The excerpt first closes a preceding tale by saying a cannibal was brought
    to death and that a girl and Hinazinci afterward married into a great chief's
    family. It then begins the story of a widow with one son and two daughters. While
    the widow is away at her garden with one daughter, the son quarrels with and kills
    the other daughter. The daughter sent back to the hut is warned by a fly and a
    mouse, disbelieves them, and then finds her sister's head and bones after the
    fly directs her to look. When the mother returns and learns what happened, she
    kills her son.
  language: English
