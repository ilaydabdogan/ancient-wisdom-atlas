  summary: The passage describes a marriage festivity arrangement with men and women
    in separate lines, a communal springing dance led by a selected man, intervals
    of rest and feasting supplied by the bridegroom's relatives, and a closing-day
    procession in which the bride throws an assagai upright inside the cattle kraal
    before guests disperse with milk-sacks.
