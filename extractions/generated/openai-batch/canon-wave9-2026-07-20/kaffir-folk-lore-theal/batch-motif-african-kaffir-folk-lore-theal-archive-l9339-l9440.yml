  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In multi-player Iceya, players are beaten one after another until two remain;
    the final losing player is said to be left with the umnyadala and is laughed at,
    while the winner is greeted as wearer of the tiger skin mantle.
  category: sequence
  evidence_refs:
  - ev:5
