  text: Children described in the passage mould clay into small cattle images, make
    string puzzles, and form knots with thongs and pieces of wood for others to undo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some boys practise deceptive tricks with grains of maize, making a grain appear
