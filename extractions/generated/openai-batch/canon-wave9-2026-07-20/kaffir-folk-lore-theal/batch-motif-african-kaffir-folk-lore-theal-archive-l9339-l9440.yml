canonical_text:
  quote: ''
  summary: 'Ethnographic notes describe children''s outdoor and indoor games: selecting
    a calf herdsman by drawing a knotted grass blade, hide-and-seek, clay cattle,
    string puzzles, maize sleight-of-hand, dance practice, the indoor games Iceya,
    Imfumba, and Cumbelele, and toys including bows, arrows, imitation assagais, and
    a nodiwu. A footnote reports the Imfumba game and similar folklore stories in
    the Lake Nyassa area.'
  language: English
  quote_policy: summarized
