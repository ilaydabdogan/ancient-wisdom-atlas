canonical_text:
  quote: ''
  summary: In this fragment of “The Story of the Cannibal Mother,” a woman says she
    must eat people. She cooks an animal for the children and their father, and a
    dead man for herself. The father warns the children to listen for sounds in their
    mother’s stomach that will show she is asleep, then to escape. The children pretend
    to sleep, hear the sounds, bid farewell to their father, and creep away quietly.
    At midnight the woman wakes, finds the children gone, takes her axe, and goes
    after them.
