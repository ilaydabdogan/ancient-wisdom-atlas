canonical_text:
  quote: ''
  summary: Ironside identifies himself to his sister, who warns that cannibals will
    eat him without an introduction. They arrange for him to enter in a muddy disguise
    through a public introduction from a hill. He is received at the sister's house,
    later hunts successfully, and becomes envied. The cannibals plan to kill and eat
    their chief's daughter; a compassionate person reveals this while Ironside is
    present, and he tells his sister to pluck out and scatter her hair.
  language: English
  quote_policy: summarized
