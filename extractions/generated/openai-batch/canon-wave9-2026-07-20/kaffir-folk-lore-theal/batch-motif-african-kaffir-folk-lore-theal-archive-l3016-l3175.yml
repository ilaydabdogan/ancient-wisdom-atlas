    a black-blotched snake near their clothes. The companions respectfully ask for
    their mantles and receive permission, but the chief''s daughter mocks the snake;
    it bites her, she takes on its hideous colour, her companions abandon her and
    substitute another girl in the hut, and she hides in a tree.'
