    Tangalimlibo''s parents. Her mother, skilled with medicines, asks for a fat ox;
    at the river the ox is killed, meat is placed in the water, the river shakes and
    rises, and Tangalimlibo comes out and is taken home to her husband. The passage
    then begins the story of a chief''s daughter required to observe ntonjane seclusion.
