canonical_text:
  quote: ''
  summary: Editorial notes describe the nodiwu, a whirled noisemaking object associated
    with boys, child-quieting, and a wind-related taboo; identify Hlakanyana as 'the
    little deceiver' and note repeated tricks in that story; explain Xhosa kinship
    terms as understood by the collector; and summarize variants of 'The Runaway Children,'
    including differing cannibal relatives and recurring bird, deliverance, and broken-pot
    episodes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nodiwu is described as an object with a convex or two-inclined-plane surface,
    a thong attached at one end, and often a small round wooden handle at the other
    end of the thong.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When whirled rapidly round, the nodiwu gives a noise audible at a considerable
    distance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mother or nurse may have a boy make noise with a nodiwu outside a hut while
    a crying child is inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child is induced to be still by pretending that a monster is coming to
    devour it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A superstition is reported that playing with the nodiwu invites a gale of
    wind.
  category: other
  evidence_refs:
