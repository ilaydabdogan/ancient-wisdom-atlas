canonical_text:
  quote: I am taken by the river.
  summary: Tangalimlibo is compelled by her father-in-law to fetch river water in
    the daytime, though she says she never goes to the river by day. Her water-drawing
    implements are pulled into the river and she is drawn under. An ox named after
    her is killed and placed in the river as a substitute. Later, Tangalimlibo emerges
    from the river at night to nurse her crying child, commanding the nurse to keep
    the visits secret. After her husband learns the truth, he hides by the river with
    an ox-hide tether held by village men and seizes her when she emerges.
  language: English
  quote_policy: quoted
