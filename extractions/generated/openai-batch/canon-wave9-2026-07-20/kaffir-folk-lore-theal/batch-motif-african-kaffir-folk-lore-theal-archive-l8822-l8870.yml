canonical_text:
  quote: ''
  summary: The passage describes marriage proposal procedures, exchange or return
    of an assagai as a sign of agreement or refusal, the formation of a bridal procession
    from the young woman’s kraal to the future home, cattle associated with fortune
    and the marriage feast, and the subsequent killing of an ox, invitation of neighbors,
    and dancing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriage proposals may be initiated by the young woman’s father or guardian,
    by the man himself, or by the man’s relatives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man’s father may select a bride and send a messenger to the girl’s
    father or guardian with cattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If advances are favorably received, an assagai is sent back; if the girl’s
    father sends an assagai, it may be accepted or returned depending on whether the
    suit is agreeable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: After preliminary arrangements, a bridal procession forms at the young woman’s
    kraal to escort her to her future home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bridal party includes the bride’s relatives and young people of both sexes
    who can leave to join it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The procession leaves so as to arrive after dark and tries to reach the destination
    without attracting notice.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bridal party takes a cow called the Inqakwe, given by the bride’s father
    or guardian to confer fortune upon her.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bridal party also takes an ox provided by the bride’s father or guardian
    as a contribution to the marriage feast.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: At daylight on the following morning the ox is killed; part of the meat is
    taken by the bride’s party and the rest is left for the people of the kraal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The bridegroom’s friends send messengers to invite neighborhood people to
