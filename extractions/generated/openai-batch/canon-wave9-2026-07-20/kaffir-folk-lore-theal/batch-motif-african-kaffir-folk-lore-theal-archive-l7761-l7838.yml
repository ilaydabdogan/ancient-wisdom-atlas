canonical_text:
  quote: ''
  summary: 'Little Jackal''s children carry meat to a rock-top home accessible only
    by rope. Lion discovers that his own household has no meat, seeks Little Jackal,
    and repeatedly fails to catch him: Little Jackal escapes into a hole under a tree
    by claiming his tail is a root, later escapes after testing whether Lion is hidden,
    and later distracts Lion with a supposed bushbuck. The passage ends with the beginning
    of an animal meeting episode in which Lion is chief, only horned animals may attend,
    and Little Jackal takes out wax.'
