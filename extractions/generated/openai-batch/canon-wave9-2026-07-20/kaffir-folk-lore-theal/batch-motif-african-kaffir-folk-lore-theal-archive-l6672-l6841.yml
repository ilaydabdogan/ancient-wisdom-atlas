canonical_text:
  quote: ''
  summary: During a famine, Kenkebe receives seven bags of millet from his father-in-law
    but hides them in a cave. He deceives his wife by pretending her father’s people
    are eating themselves and by substituting his own food for flesh and corn-made
    cakes for nongwes. His child notices differences in smell and food, and his wife
    later follows him to the hidden grain. She and the child roll a stone after him;
    it pursues him through valley, river, hill, and plain until he reaches home. He
    lies about losing his belongings in a river, but his wife exposes the lie and
    withholds food. The passage then begins a hunting episode with Kenkebe, his two
    named dogs, an eland, and its calf.
  language: English
  quote_policy: summarized
