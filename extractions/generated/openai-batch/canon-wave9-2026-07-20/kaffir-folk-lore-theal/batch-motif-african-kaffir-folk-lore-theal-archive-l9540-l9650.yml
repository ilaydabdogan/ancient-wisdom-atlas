canonical_text:
  quote: ''
  summary: 'The passage consists of editorial notes on several tales and customs:
    marriage and motherhood naming practices; the ntengu bird; the mbulu as a fabulous
    shape-assuming creature with a tail and a tendency to lie; Long Snake as a bewitched
    man in serpent form and an exception involving girls carrying fermented milk;
    women''s millet grinding and bread-making; Kenkebe as a proverbial figure of selfish
    greed contrasted with food sharing; and a note that Lion and Little Jackal is
    likely of Hottentot origin though generally told by Kaffirs, with Little Jackal''s
    tricks described as silly and expandable by narrators.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a woman is married, her husband's parents give her a new name; after
    the birth of her first child she may be called by reference to the child's name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ntengu is described as a bright bluish-black bird, larger than a swallow,
    often seen on cattle backs seeking insects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mbulu is described as a fabulous creature believed in by children; it
    can assume human form but cannot lose its tail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mbulu is said to avoid telling the truth whenever it can tell a falsehood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Long Snake story, girls are represented as taking fermented milk to
    a man, although the note says ordinary usage prohibits females from serving out
    milk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Long Snake is described as a man who has been bewitched and compelled to assume
    the appearance of a serpent while retaining human faculties.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women bruise millet on a flat stone with a small round stone, sometimes chanting
    while several work near each other in the evening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bruised millet is mixed with water and formed into small loaves of bread.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kenkebe is described in the note as the personification of selfish greed,
