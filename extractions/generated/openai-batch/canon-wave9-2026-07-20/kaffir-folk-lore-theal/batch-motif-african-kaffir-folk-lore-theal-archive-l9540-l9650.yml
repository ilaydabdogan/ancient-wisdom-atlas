  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The note states that a person eating commonly shares food with others present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Lion and Little Jackal story is said to be generally told by the Kaffirs,
