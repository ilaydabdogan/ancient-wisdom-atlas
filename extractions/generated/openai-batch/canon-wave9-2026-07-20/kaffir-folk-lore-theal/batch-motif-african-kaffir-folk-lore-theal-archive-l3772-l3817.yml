canonical_text:
  quote: ''
  summary: Sikulume asks his sister to fetch skin from an inabulele he killed. She
    goes with companions to the river, sings to the inabulele, and its body comes
    out; she cuts skin for sandals and a mantle. Later Sikulume declares that he will
    marry Mangangezulu's daughter despite warnings that he will be killed there, sets
    out with chosen young men, and encounters a mouse in long grass that asks where
    he is going.
  language: English
  quote_policy: summarized
