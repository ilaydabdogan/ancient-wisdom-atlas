canonical_text:
  quote: ''
  summary: Masilo's children fear punishment and follow Masilo's milk-making bird
    all day as it keeps ahead of them. Their absence alarms the town, while Masilo
    notices that his bird is gone and keeps silent. At evening a storm frightens the
    children; the brave boy Mosemanyanamatong commands a house and firewood to appear.
    The children shelter, make a fire, and roast wild roots. A big cannibal arrives
    and asks for the roots. The children use the roots to delay him while they flee.
    They reach mountains with trees, climb a tall tree, and the cannibal tries to
    cut it down with a long sharp nail. Mosemanyanamatong tells the girls to repeat
    a strengthening formula for the tree while he sings.
  language: English
  quote_policy: summarized
