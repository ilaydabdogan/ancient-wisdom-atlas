  quote: all the people had been swallowed by a monster
  summary: A woman leaves her husband after a quarrel and returns to her father’s
    place. She finds the people gone, signs of animals and blood in the house, and
    hides in the top of the hut. A monster arrives singing that it has eaten and still
    lives. Later the house fills with animals, who make a fire, cook, eat, sleep,
    and go out in the morning to seek more food.
