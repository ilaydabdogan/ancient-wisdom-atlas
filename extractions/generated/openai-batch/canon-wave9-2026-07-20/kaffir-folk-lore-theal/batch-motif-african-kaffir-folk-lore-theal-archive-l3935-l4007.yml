canonical_text:
  quote: ''
  summary: A chief's wife remains childless while other women in the village bear
    children. The people kill an ox in the hope that she will bear a child. During
    the killing, she hears an unborn child repeatedly asking to be born before the
    father's meat or cattle are finished. She gives birth to a very small boy with
    an old-looking face; he asks for a skin robe, goes to the kraal, and asks the
    chief for meat while calling him father.
  language: English
