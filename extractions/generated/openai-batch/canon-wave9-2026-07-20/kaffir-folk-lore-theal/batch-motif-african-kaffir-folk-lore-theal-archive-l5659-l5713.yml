canonical_text:
  quote: '"River, I have found my sister. Be full."'
  summary: Ironside escapes with his sister and her child. Tufts of hair answer in
    the child's voice to confuse cannibal pursuers. After crossing a large river,
    Ironside strikes it with an iron rod so the water rises, then uses a rope trick
    to drown one pursuing party. A later party turns back, and the rescued sister
    is brought home to her mother.
