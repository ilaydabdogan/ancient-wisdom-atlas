  quote: ''
  summary: Little Jackal strikes Lion's wife, receives meat from Lion to take to Lion's
    wife, but repeatedly diverts it to his own wife until the ox is finished. Lion
    returns home, hears his wife's complaint that Little Jackal beat her and the children
    and sent only a shin, then angrily goes to Little Jackal's rock. Little Jackal
    questions Lion from above; Lion asks for a rope. Little Jackal lowers a mouse-skin
    rope, which breaks while Lion climbs, causing Lion to fall and go home hurt.
