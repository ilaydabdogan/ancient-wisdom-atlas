canonical_text:
  quote: ''
  summary: The passage describes an unnamed ritual office-holder associated with rainmaking
    and making warriors invulnerable, the punishment of such office-holders when their
    powers fail, claims of revelation from the spirit world, respectful treatment
    of snakes as possible ancestral visitors, gendered labor, property succession,
    and metal manufactures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed office-holder is associated with causing rain and making clan warriors
    invulnerable in battle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When performing these occupations, the office-holder dresses in a striking
    manner, painted with various colors and wearing tails of wild animals around him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before European supremacy, the passage says this office-holder seldom died
    a natural death; failure to produce rain, protect warriors, or prevent other mishaps
    could cause him to be regarded as an impostor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A failed office-holder was generally tied hand and foot and cast into the
    first stream at hand; confidence was then placed in his successor until the successor
    met the same fate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person may claim to have received revelation from the spirit world; if believed,
    his power becomes greater than that of the highest chief and his commands are
    obeyed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Snakes are treated with great respect; if one is found in a hut, the people
    move out and wait until it leaves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hut owner may say the snake is perhaps the spirit of an ancestor visiting
    in that form, while also allowing that it may be an ordinary snake.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The text says cultivation, collecting firewood, and thatching huts fall to
    women, and that a man who meddles in such work is regarded as intruding into a
    domain not his own.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Property descent is said to be regulated in the same manner as succession
    to the chieftainship.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage notes skilled manufactures, especially metal wares including weapons,
    agricultural implements, and personal ornaments; iron and copper are obtained
    in trade from Europeans.
  category: object
  evidence_refs:
  - ev:6
