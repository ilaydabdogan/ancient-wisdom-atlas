canonical_text:
  quote: ''
  summary: Kenkebe kills an eland calf and uses a dog wearing the calf skin to obtain
    milk from the eland, but the deception is exposed and the eland dies after chasing
    him against a stone. Kenkebe sends his son to a cannibal village for fire and
    warns him not to carry meat; the boy disobeys, the smell attracts cannibals, and
    they pursue him home. The household hides, but the cannibals eat the eland, an
    old woman, and Kenkebe, then carry off Kenkebe's wife. The wife gives the cannibals
    beer, closes them inside a house, burns the house, escapes, and lives with her
    son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kenkebe asks his two dogs whether either will imitate the calf and suck the
    eland so that he can obtain milk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tumtumse refuses, saying he will bark like a dog, and Kenkebe sends him away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mbambozozele agrees; Kenkebe kills and eats the calf and puts the calf skin
    on the dog so that the eland thinks the dog is her calf.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Mbambozozele sucks too long, Kenkebe strikes him; the dog howls and the
    eland recognizes the deception.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eland chases Kenkebe until his wife tells him to jump onto a big stone;
    the eland strikes the stone, breaks its head, and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because there is no fire to cook the eland, Kenkebe sends his son to the cannibal
    village on a hill over the valley and warns him not to take meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The son hides meat and gives a piece to an old woman, whose cooking of it
    makes a smell that draws the cannibals; they swallow the old woman, the meat,
    the fire, and the ashes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The son warns those at home to hide; Kenkebe's wife hides in a bush, an old
    woman covers herself with ashes, Kenkebe climbs a tree with eland breast in his
    hand, and the boy slips into a hole by the path.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The cannibals eat the eland, discover and eat the old woman under the ashes,
    discover and eat Kenkebe in the tree, find Kenkebe's wife in the bush, and carry
    her away for later.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The cannibals do not look for the boy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kenkebe's wife makes beer for the cannibals, leaves the house where they are
    drinking, closes the entrance, sets the house on fire, and escapes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After escaping, Kenkebe's wife lives happily with her son.
  category: sequence
  evidence_refs:
  - ev:9
