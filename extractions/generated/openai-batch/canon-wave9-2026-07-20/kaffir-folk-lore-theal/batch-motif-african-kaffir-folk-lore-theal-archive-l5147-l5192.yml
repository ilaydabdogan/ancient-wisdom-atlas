canonical_text:
  quote: ''
  summary: 'The passage ends the story of Hlakanyana: a tortoise clings to his back,
    his mother pours heated fat on it, the tortoise lets go, and the fat burns Hlakanyana
    so that he dies. A new story begins: Demane and Demazana, orphaned brother-and-sister
    twins, flee ill treatment by relatives and live in a cave secured by a strong
    inward-fastened door. Demane hunts by day and warns Demazana not to roast meat
    while he is away because cannibals may smell it. Demazana roasts buffalo meat,
    and a cannibal smells the cooking flesh and approaches.'
  language: English
  quote_policy: summarized
