canonical_text:
  quote: ''
  summary: Hlakanyana lifts meat that the men cannot lift, carries it to his mother's
    house, leaves blood as false evidence at the men's houses, and blames dogs for
    the missing meat. The men beat women and children over the alleged failure to
    watch the meat. Hlakanyana has his mother cook the meat, steals it from the pot
    at night while imitating a dog, leaves only bones, then obtains the bones by invoking
    his mother's status as the chief's wife. He later sleeps with boys who mock him
    as a child of a few days; after they sleep, he goes to the cattle.
  language: English
  quote_policy: summarized
