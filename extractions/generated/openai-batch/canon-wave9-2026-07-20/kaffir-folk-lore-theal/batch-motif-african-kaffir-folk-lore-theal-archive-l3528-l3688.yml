canonical_text:
  quote: ''
  summary: A chief rewards news of beautiful birds, identifies the seven birds with
    his seven dead sons, and sends six boys under his dumb son Sikulume to catch them.
    The boys capture the birds but lodge in a hut where a cannibal plans to eat them;
    after a warning and a watch-plan they flee, and the cannibal is eaten by his companions.
    Sikulume discovers he left his own bird behind, leaves his assagai as a sign of
    his condition, receives fat from an old woman for use if pursued, retrieves the
    bird, and delays cannibal pursuers by throwing fat on stones; the excerpt ends
    as he throws off a mantle that runs another way.
  language: English
  quote_policy: summarized
