- id: obs:3
  text: The speaking skin instructs Sikulume not to enter by the front of the village,
    not to eat from a new mat, and not to sleep in an empty hut.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Mangangezulu's village, Sikulume and his companions enter from the wrong
    side, refuse food on a new mat, and refuse to sleep in an empty hut, explaining
    these actions as their custom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mangangezulu orders Sikulume and his companions to tend cattle.
