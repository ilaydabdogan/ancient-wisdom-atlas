canonical_text:
  quote: ''
  summary: Sikulume refuses a mouse's warning to turn back from Mangangezulu's place.
    After the mouse is killed, its skin gives protective instructions that Sikulume
    and his companions follow when entering Mangangezulu's village. Sikulume's mantle
    shelters the group during a storm. Mangangezulu's daughter's mother causes Sikulume
    to become an eland; the daughter burns the eland to a coal and restores him in
    water as a young man. The daughter flees with Sikulume, using an egg, milksack,
    pot, and smooth stone to create obstacles against her pursuing father. Sikulume
    returns home with her as wife and later becomes a great chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mouse sings a warning that no one leaves the place of Mangangezulu and tells
    Sikulume to turn back; Sikulume refuses.
  category: speech
  evidence_refs:
