  evidence_refs:
  - ev:4
- id: obs:7
  text: The daughter of Mangangezulu comes to Sikulume and his companions; her mother
    presses her foot in Sikulume's footprint, and Sikulume becomes an eland.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The daughter loves Sikulume, drives the eland into a great fire, removes the
    resulting little coal, and places it in a pot of water, after which Sikulume becomes
    a young man again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The daughter leaves with Sikulume, carrying an egg, a milksack, a pot, and
    a smooth stone, while her father pursues them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The daughter throws down the egg, and it becomes a mist that delays her father.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The daughter throws down the milksack, and it becomes a sheet of water that
