  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The daughter throws down the pot, and it becomes thick darkness, delaying
    her father until light returns.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The daughter throws down the smooth stone, and it becomes a large steep-sided
