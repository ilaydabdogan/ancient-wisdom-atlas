canonical_text:
  quote: ''
  summary: Editorial notes explain fermented milk, agricultural labor, tools, land
    tenure, baskets, pottery, hut layout, an oxhide thong, a three-day journey formula,
    crocodiles and a water-spirit belief, a bewitched man appearing as a crocodile,
    and boys' ceremonial entry into manhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amasi is described as fermented milk kept in a skin bag; a portion is left
    behind as leaven, and it is a principal food or beverage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The master of the household is described as the only person permitted to touch
    the milk-sack.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cultivation of the ground formerly fell entirely upon women, and planting
    and weeding are said still to be performed by females.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The imda is described as a pick or hoe used for breaking up ground, made with
    a spike driven into the knob of a long heavy club.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief allots land to a family, which retains possession while it is cultivated;
    abandoned land may be forfeited, it cannot be sold, and pasture is held in common.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The itunga is a watertight basket used for milking cows; baskets and mats
    are made without dye or ornament, and mats are used as dishes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Large pottery jars are said to be replaced by wooden casks, and iron pots
    have come into general use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The house is described as having one low, narrow opening that serves as door,
    window, and chimney.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fireplace is a circle in the center of the hut; people sleep around it,
    while the back of the hut is used as a store room for jars and utensils.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Intambo is glossed as a riem or thong of untanned oxhide.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A noted expression is glossed as equivalent to saying that people journeyed
    for three days.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: The note says crocodiles are absent from rivers in the present Amaxosa country
    but are known to the people by hearsay, and that traditions place the tribe's
    migration from the north-east.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: A Xosa belief is described in which a water-spirit has power to charm people
    and entice them into rivers to their destruction.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The note says the spirit and the reptile have the same name.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the story being annotated, what appears to be a crocodile is later said
    to be a man who has been bewitched and forced to assume that appearance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Boys are said to enter manhood, or acquire the privileges of men, by a ceremony
    similar to the ntonjane.
  category: action
  evidence_refs:
  - ev:11
