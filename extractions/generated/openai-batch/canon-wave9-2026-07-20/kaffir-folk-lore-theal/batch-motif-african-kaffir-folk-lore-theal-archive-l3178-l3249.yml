canonical_text:
  quote: ''
  summary: A chief's daughter, previously harmed by a sinyobolokondwana and left in
    a blotched condition, is found after her voice is heard in the forest and recognized
    by her brother. The chief punishes the companions who took her to the river and
    substituted another girl. He then sends the daughter away with men and forty cattle.
    In the distant place, surplus milk poured into a hole rises into a great overhanging
    mass; when it falls on the girl, the milk runs over her and restores her beauty.
    A young chief later sees her, falls in love, learns she is a chief's daughter,
    and goes to her father.
  language: English
  quote_policy: summarized
