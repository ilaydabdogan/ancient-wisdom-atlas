canonical_text:
  quote: ''
  summary: Hlakanyana repeatedly obtains food and evades punishment by staging false
    evidence, framing others, raising a false cattle-raid alarm, stealing meat from
    a pot, changing into the form of an old woman to mislead pursuers across a river,
    and beginning another ruse by offering to make an old woman young.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hlakanyana kills two cows, eats their insides, smears blood on a sleeping
    boy, and the men kill the boy after finding blood on him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hlakanyana privately says that his earlier claim to be older than the others
    has now been shown.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Hlakanyana's father kills an ox and its head is put in a pot, Hlakanyana
    thinks about how to get the meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hlakanyana drives the village cattle into a thick forest, ties them by their
    tails to trees, cuts his own body with a sharp stone, and announces from a hill
    that an enemy is taking the cattle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men believe Hlakanyana's blood-covered appearance, take their assagais,
    and run after the cattle by the wrong way, leaving only Hlakanyana and an old
    man behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hlakanyana sends the old man to the far river for water, then eats the meat
    from the pot while the old man is away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the old man returns and sleeps, Hlakanyana places a bone beside him
    and fat on his mouth, then loosens the cattle in the forest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hlakanyana returns with the cattle claiming to have conquered the enemy, and
    the men find the pot empty of meat and filled with dung.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hlakanyana blames the sleeping old man, but concealed children say they saw
    Hlakanyana eat the meat and put dung in the pot.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hlakanyana denies the accusation, asks to go to the women, and escapes after
    a young man is sent with him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The chief sends an army after Hlakanyana; the pursuers see him near a bush,
    but when they arrive they find only an old woman who directs them across a rising
    river.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The old woman by the bush turns back into Hlakanyana, who resolves to go on
    a journey and states that he is wiser than his father's councillors.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: Hlakanyana goes to another village, asks an old woman if she wants to be made
    young, and tells her to take a pot and fetch water despite her saying she cannot
    walk.
  category: sequence
  evidence_refs:
  - ev:11
