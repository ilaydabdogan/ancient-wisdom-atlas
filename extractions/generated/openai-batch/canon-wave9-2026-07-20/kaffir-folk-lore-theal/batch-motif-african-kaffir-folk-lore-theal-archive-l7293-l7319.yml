canonical_text:
  quote: ''
  summary: A warning is given that the glutton will swallow the boys. The boys go
    to the monster while it sleeps, shoot both of its eyes with arrows, later find
    it dead, and report to their mother. Hearing voices inside the glutton, the mother
    cuts it open with a knife; people, cattle, and dogs emerge. The released people
    learn who killed the glutton and reward the boys with cattle.
