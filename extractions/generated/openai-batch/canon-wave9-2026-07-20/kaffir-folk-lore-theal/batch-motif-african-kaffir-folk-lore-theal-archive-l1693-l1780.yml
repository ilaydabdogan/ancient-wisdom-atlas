canonical_text:
  quote: ''
  summary: A girl and her brother Gingci wonder why their father is fat while they
    are thin. They watch him secretly at night and see him uncover a large jar, command
    his bird to make milk, and drink until full. The next day, after the adults leave
    and the father forbids entry into the house, the children enter and ask the bird
    for milk. The bird instructs the boy to place it by the fireplace and by the door,
    producing only a little milk each time, then instructs the girl to put it in sunlight,
    where it makes a full jar of milk and sings a cryptic song.
  language: English
  quote_policy: summarized
