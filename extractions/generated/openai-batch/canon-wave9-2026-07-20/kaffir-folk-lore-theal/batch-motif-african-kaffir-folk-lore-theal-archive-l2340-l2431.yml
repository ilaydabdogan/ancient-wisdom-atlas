canonical_text:
  quote: ''
  summary: A father says a chief wants a wife and sends his daughter Mpunzikazi. Though
    he gathers people to accompany her, she insists on going alone. On the path she
    rejects offers or requests from a mouse, a frog, and a hungry goat-herding boy,
    each of whom warns her. She then meets an old woman by a big stone who begins
    giving advice about laughing trees that she must not laugh back at.
