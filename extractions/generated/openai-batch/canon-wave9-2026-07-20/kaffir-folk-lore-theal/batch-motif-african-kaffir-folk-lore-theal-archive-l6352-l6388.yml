canonical_text:
  quote: '"Come, let us help our mother by bringing water from the river."'
  summary: A boy and his sister go to fetch river water for their mother. On the way
    they meet a company of men accompanying a chief's son who is looking for a wife.
    The girl gives water to the men, and the chief's son becomes attracted to her,
    follows her to learn where she lives, then asks his father for cattle to marry
    her. His father gives him cattle, and he goes to the girl's mother's hut to ask
    to marry her daughter. A different girl is then presented, but the chief's son
    begins to reject her before the excerpt breaks off.
