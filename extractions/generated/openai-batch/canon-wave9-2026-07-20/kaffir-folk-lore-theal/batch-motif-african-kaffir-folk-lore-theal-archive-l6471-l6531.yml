canonical_text:
  quote: ''
  summary: Mahlunguluza and Mbulukazi travel along a cliff above a deep pool. Mahlunguluza
    invites Mbulukazi to look into the water, pushes her over the edge, and Mbulukazi
    drowns. Mahlunguluza returns and gives a false account of Mbulukazi's absence.
    The next day Mbulukazi's ox alerts the village, leads men to the pool, retrieves
    her body, and licks her until life returns. Mbulukazi reports what happened; Broad
    Breast, the young chief, sends Mahlunguluza away, and Mbulukazi remains his great
    wife.
  language: English
  quote_policy: summarized
