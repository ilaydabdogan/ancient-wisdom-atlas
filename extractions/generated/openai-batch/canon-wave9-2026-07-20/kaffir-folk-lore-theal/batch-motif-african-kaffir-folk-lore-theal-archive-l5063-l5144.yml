canonical_text:
  quote: ''
  summary: Hlakanyana proposes a rope-crossing test to identify who ate the chief's
    tree fruit; a monkey with a branch falls and is accused. He then goes to a jackal's
    house, has the jackal announce Hlakanyana's death, traps the animals who gather,
    kills them, and eats. Returning to his father's home, he uses shouted words about
    black cattle with white teeth and his returning sister to obtain a black ox and
    fat meat. Later, while tending calves, he meets a tortoise going to a big stone,
    carries it on his back to his mother's house, and his mother asks what he has
    brought.
  language: English
  quote_policy: summarized
