canonical_text:
  quote: ''
  summary: A mbulu who is married to a man removes a snare after sending him away
    for medicine. The people then use a milk-filled hole as a test, saying that a
    mbulu's tail will seek milk. When the mbulu jumps, the tail goes down toward the
    milk, revealing it; the people kill and bury it in the hole. The man later marries
    the girl, who has a child. A square pumpkin emerges from the burial place and
    tries to kill the infant, but the people cut it up, burn it, and throw the ashes
    into a river so that nothing more will come from the mbulu.
  language: English
  quote_policy: summarized
