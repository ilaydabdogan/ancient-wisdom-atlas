canonical_text:
  quote: ''
  summary: A group of girls go to gather red clay, bathe in a pool, and return home.
    The chief's daughter goes back alone for a forgotten ornament, where a one-legged
    cannibal captures her in a bag. The cannibal takes her to villages, calls her
    his bird, and has her sing in exchange for meat while keeping her concealed. The
    other girls falsely tell the chief that his daughter has reached ntonjane and
    shut one girl in a hut as a substitute; the chief believes them and holds a feast.
  language: English
  quote_policy: summarized
