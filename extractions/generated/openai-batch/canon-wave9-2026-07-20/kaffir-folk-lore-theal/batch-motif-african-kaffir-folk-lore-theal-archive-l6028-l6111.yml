canonical_text:
  quote: '"I am a pretty bird of the valley, / You come to make a disturbance at my
    place."'
  summary: A cannibal woman eats people and cattle in a village, then meets a beautiful
    singing bird in a deep valley. The bird grows enormous, takes her axe, tears off
    her limbs, opens her stomach, and many swallowed people come out. Two children
    escape alive; the cannibal dies, and the children return to their grandfather
    and are made rulers.
