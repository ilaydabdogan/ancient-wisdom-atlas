canonical_text:
  quote: ''
  summary: Masilo and his wife repeatedly find their garden work undone and are mocked
    as lazy by other workers. Masilo stays behind to watch and discovers a beautiful
    speaking bird commanding the cultivated ground to mix together. He catches the
    bird and threatens to kill it, but the bird offers to make milk if spared. At
    Masilo's demand, the bird restores the ground, makes thick milk for him, and is
    taken home in his bag. Masilo tells his wife to wash the largest beer pots, but
    she angrily questions what he could put in them.
  language: English
