canonical_text:
  quote: ''
  summary: The passage describes features of the Amaxosa/Xhosa language, including
    vowel-final syllables, initial inflection, noun agreement, word-combination in
    writing, abstract nouns, numerals, adjective placement, and three click sounds.
    It also describes the custom called ukuklonipa, in which women avoid pronouncing
    certain male relatives' names or words containing their principal syllables; oral
    rather than written historical transmission; time reckoning by day, lunar month,
    events, and constellations; and pre-European dress using animal skins, with leopard
    skin reserved for chiefs and principal councillors.
  language: English
  quote_policy: summarized
