canonical_text:
  quote: The cunning fellow changed himself into a little round stone.
  summary: Hlakanyana tricks an old woman into being cooked in a pot, disguises himself
    in her clothing, and causes her sons to eat meat from the pot before revealing
    the deception and escaping across a river by changing into a stone. He later tricks
    a goat-tending boy during an underwater contest, eats the birds they had obtained,
    falsely accuses the boy, takes his digging-stick, and lends it to pot-makers,
    who break it in clay.
  language: English
  quote_policy: quoted
