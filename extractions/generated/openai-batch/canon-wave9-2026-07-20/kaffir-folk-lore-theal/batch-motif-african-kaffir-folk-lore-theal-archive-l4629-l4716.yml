canonical_text:
  quote: ''
  summary: Hlakanyana receives a cow after a preceding complaint, continues traveling,
    persuades a young man to become his companion, and repeatedly tells him that certain
    places require discarding objects. The companion discards kerries, a spoon, a
    knife, and an isilanda, while Hlakanyana secretly keeps his own spoon, knife,
    and isilanda. When they later walk through thorns, Hlakanyana uses his isilanda
    to remove thorns from his feet, but the companion cannot and must walk lame. They
    arrive at a village, where Hlakanyana asks for food before giving news.
  language: English
  quote_policy: summarized
