canonical_text:
  quote: ''
  summary: 'The passage closes a previous tale with Mpunzanyana giving bread to Makanda
    Mahlanu, who says she will be his wife and gives her ornaments; after he becomes
    a man, she remains his favored wife. It then begins the story of Tahgalimlibo:
    a childless wife grieves until a bird gives her pellets to eat before food so
    that she will bear a child. She offers the bird millet and an isidanga, both refused,
    and then fine gravel, which the bird accepts. After this she has a daughter.'
  language: English
  quote_policy: summarized
