  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The saying “You will prefer roasted meat” warns an immoderate boaster that
    trouble may force him to accept what is easiest, and it can also function as a
    threat of thorough punishment.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The proverb that throats are alike in swallowing is used when asking for something
