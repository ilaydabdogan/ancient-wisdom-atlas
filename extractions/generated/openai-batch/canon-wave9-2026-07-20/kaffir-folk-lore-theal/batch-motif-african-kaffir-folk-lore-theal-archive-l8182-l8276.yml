canonical_text:
  quote: ''
  summary: A sequence of Xhosa proverbs and figurative expressions is given with English
    translations and explanations. The sayings use images of beasts, a dog of the
    wind, a reversed shield, a stripped maize cob, adhesive grass, the setting sun,
    travellers, roasted meat, and swallowing throats to comment on self-assertion
    at home, planlessness, betrayal, worthlessness, clinging bad habits or companions,
    fresh news, quick performance of errands, boasting and punishment, and reciprocity
    in giving.
  language: English with Xhosa proverb forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proverb says that no beast fails to roar in its own den; the explanation
    states that a man recognizes no superior in his own establishment and compares
    it to the English saying about a cock crowing on its own dunghill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expression translated as “a dog of the wind” is applied to someone without
    a settled plan of living.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expression “the shield turned the wrong way” is applied to a person who
    goes from one party to another, especially one who gives evidence against accomplices
    in crime.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cob stripped of maize in an ashpit is said of a worthless character.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The adhesive grass called isinama sticks to clothing when touched and is hard
    to brush off; the proverb warns against a bad habit or unworthy companion that
    cannot easily be got rid of.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A proverb states that the sun never sets without fresh news.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: People of experience are described as not sleeping at a strange place; the
    explanation says this praises someone who goes on a message or performs distant
