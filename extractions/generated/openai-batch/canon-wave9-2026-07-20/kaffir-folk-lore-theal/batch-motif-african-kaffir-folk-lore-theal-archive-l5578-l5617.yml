  quote: "“River, I have no sister. Be empty.”"
  summary: A child is threatened with death and eating by an unnamed group, but one
    member warns the woman. After the little girl has been taken away by birds, her
    mother has a son whose body is half flesh and half iron. When grown, he searches
    for his lost sister, dries a river by striking it with an iron rod and commanding
    it to empty, crosses safely, hides by the cannibals’ water stream, and recognizes
    his sister when she comes for water.
