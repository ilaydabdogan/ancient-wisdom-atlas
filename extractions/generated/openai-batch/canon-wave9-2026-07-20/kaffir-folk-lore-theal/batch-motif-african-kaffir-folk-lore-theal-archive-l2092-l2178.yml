  summary: Masilo uses a bird kept in his bag to fill pots with milk for his family
    and warns his children not to tell anyone. The family's improved condition arouses
    curiosity. When Masilo and his wife are away, other children question Masilo's
    children, who reveal the bird, use it to make milk for their companions, then
    untie it to dance. Once taken outside, the bird flies away.
