canonical_text:
  quote: ''
  summary: A sequence of Xhosa proverbs and figurative expressions is given with English
    translations and explanations. The sayings refer to Kukwane as a place of abundant
    meat and legendary hospitality, Kolomba's mother as a disliked figure whose death
    is welcomed, Gaika as a marker of unequal fortune, a monkey caught in a trap as
    a warning against snares, umya seed as beauty, wild aloe juice as stupefaction,
    colliding walls as a dispute among important people, and a ripe water-melon as
    an unexpressed inner resolution.
  language: English with Xhosa proverb headings
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One proverb says that slaughtering has occurred at Kukwane, where much meat
    is obtainable; its explanation links Kukwane with a tradition about a rich chief
    who liberally entertained strangers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kukwane proverb is applied to people who ask too much from others, with
    the explanation that only at Kukwane were such expectations realized.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A saying translated as rejoicing that Kolomba's mother is dead is linked to
    a tradition that she was disagreeable, and is used when something dreaded or disliked
    has passed away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A proverb says that not everyone is a son of Gaika; the explanation states
    that Gaika was a powerful chief west of the Kei and that the proverb means all
    people are not equally fortunate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A warning says that a person will shed tears with one eye like a monkey; the
    explanation says it is used to deter someone from being led into a snare and that
    a trapped monkey cries with tears from one eye only.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A saying about the seed of the umya is applied to something or someone considered
    very beautiful; the seed is described as like a small jet black bead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A saying that someone has drunk the juice of the wild aloe flower is used
    of a dull, sleepy person; the juice is said to stupefy and temporarily benumb
    the limbs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A saying that walls have come into collision is used for a dispute between
    persons of consequence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A saying that someone is ripe inside like a water-melon is used for a person
    who has reached a resolution without yet expressing it; the explanation notes
