  summary: An unnamed man is refused lodging because he is ragged and travel-soiled.
    At a river he speaks to his horns, which produce fine clothing and ornaments.
    He is then received at another house, where a beautiful girl lives; the horns
    provide food and clothing. He marries the girl, returns home with her, is welcomed
    by his father, and obtains a fine house from the horns.
