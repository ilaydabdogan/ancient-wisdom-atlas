canonical_text:
  quote: ''
  summary: 'The passage gives an introductory ethnographic description of craft objects
    and practices: heat-resistant vessels used for beer, grain, and cooking; single-block
    wooden articles with simple carved patterns; grass and rush containers, including
    bags able to hold water; and skins softened with grease for clothing. It then
    gives a colonial narrator''s characterization of men as sociable, fond of gossip
    and verbal parrying, and linked to cattle lifting, which the passage describes
    as a civil offense requiring restitution rather than a religiously disgraceful
    crime. The passage closes by identifying the described people as the community
    among whom the following stories are current.'
  language: English
  quote_policy: summarized
