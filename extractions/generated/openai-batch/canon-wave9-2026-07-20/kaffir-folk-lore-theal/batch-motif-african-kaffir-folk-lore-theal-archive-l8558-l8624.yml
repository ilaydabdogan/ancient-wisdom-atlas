canonical_text:
  quote: Guluwe's two of yesterday.
  summary: The passage explains a proverb used for someone who promises to return
    but does not. Its origin is narrated as an event involving the renowned hunter
    Guluwe, who is captured by abatwa/bushmen after killing an eland, deceives them
    with a promised ransom of dacha, sends away two young men with private instructions
    not to return, and later kills most of the captors while they sleep after eating
    the eland. One dissenting captor awakens and escapes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The saying is applied to someone who goes away promising to return and then
    does not return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the saying originated in an event five generations
    earlier involving Guluwe, a renowned hunter who crossed the Kei with Khakhabay.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khakhabay is said to have taken possession of the Amatolas after purchasing
    them from the chieftainess Hoho, and the area is described as containing many
    bushmen.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guluwe, accompanied by two young men, killed an eland and shouted a triumph
    cry before being surprised by a group of abatwa/bushmen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The captors threatened Guluwe, saying he would kill no more of their game,
    and Guluwe offered a large quantity of dacha as ransom.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: One captor opposed sparing Guluwe, but the others agreed; Guluwe pretended
    to send the two young men for dacha while privately telling them not to return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The captors ate the eland through the day and night while watching Guluwe,
