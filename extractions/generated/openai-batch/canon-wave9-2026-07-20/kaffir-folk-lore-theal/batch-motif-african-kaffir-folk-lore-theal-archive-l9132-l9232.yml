canonical_text:
  quote: ''
  summary: 'The passage gives an explanatory note on the Ntonjane puberty ceremony
    for a girl, especially a chief''s daughter: seclusion, invitations, feasting,
    dancing, extended observance, public emergence led by a crane-winged escort, milk
    ritual at the fireplace, and dispersal. It then briefly notes customary sweetheart
    selection by the girls of the jaka and begins a new note on charms and medicines
    for disease.'
  language: English
  quote_policy: summarized
