- id: obs:2
  text: When a girl reaches puberty, her father sends messengers to nearby villages
    to invite young women to the Ntonjane, while the girl is secluded in the house
    of an aunt or other female relative and is not seen by her father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Parties of young women arrive from different directions singing and assemble
    in front of the cattle kraal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father chooses an ox to be slaughtered, the meat is cooked, and men and
    women come to the feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girls are dressed for dancing in rows, wearing a girdle and a leaf apron
    called cacawe, and holding assagais as walking sticks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Girls dance four at a time while the rest sing, and spectators applaud the
    best dancer or continue the dancing until agreement is reached.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the girls' dancing, men and women dance in lines until sunset; the party
    of girls called the jaka remains overnight, and dancing resumes the next day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the father is rich, three oxen may be slaughtered and the Ntonjane lasts
    twelve days; for a chief's daughter it lasts twenty-four days, with councillors
    sending oxen for the guests.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a chief's daughter, the son of her father's chief councillor wears two
    blue crane wings, called the indwe and described as an emblem of bravery, enters
    the seclusion house, and comes out followed by the girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The girl, her escort, her mother, the jaka, her father, and his councillors
    form a procession toward the kraal where dancing took place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After further cattle slaughter and dancing, the girl drinks milk for the first
    time since her seclusion; milk is brought from different kraals, some is poured
    on the fireplace, the female guardian takes the first mouthful, and then the girl
    drinks before being taken to her mother's house.
  category: sequence
  evidence_refs:
  - ev:8
