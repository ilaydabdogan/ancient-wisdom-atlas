  quote: ''
  summary: Little Jackal disguises himself with horns made from material from a bees'
    nest, but the horns melt when he sleeps near a fire and Lion recognizes him. Lion
    tries to catch him; Little Jackal hides under an overhanging rock, cries that
    it is falling, and escapes while Lion fetches a pole. Later Lion and Little Jackal
    hunt together, kill an ox, and Lion sends meat portions by Little Jackal; Little
    Jackal redirects the portions between households, and Lion's wife refuses the
    shin sent to her.
