canonical_text:
  quote: ''
  summary: A woman searching for her children is swallowed by the chief of the animals.
    Inside him she finds her children, other people, oxen, and dogs alive. Using pieces
    of iron, she cuts flesh from the animal, cooks it on a fire, and feeds the captives.
    The animal dies after seeking counsel and rolling in mud. A monkey announces dispersal
    to the animals. The woman cuts a hole through the chief’s side and emerges with
    the captives, who make her their chief. Later, her grown children kill a cannibal
    stuck in mud; when it is skinned, many people come out and join the deliverers,
    making the people a great nation.
  language: English
  quote_policy: summarized
