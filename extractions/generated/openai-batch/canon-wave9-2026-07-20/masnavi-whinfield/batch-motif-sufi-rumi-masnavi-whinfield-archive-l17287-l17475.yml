canonical_text:
  quote: ''
  summary: The passage contrasts lustful people with believers who behold the Beloved,
    praises prophetic rather than animal manliness, recounts a test in which Ayaz
    obeys the king by breaking a priceless jewel while other courtiers refuse, and
    expands the episode into reflections on imitation, intercession, death with God,
    self-annihilation, and divine omniscience. It then opens a prologue addressed
    to Husamu-'d-Din, presenting the sixth part of the Masnavi and describing love
    as attraction to the Beloved beyond the senses and spatial directions.
  language: English
  quote_policy: summarized
