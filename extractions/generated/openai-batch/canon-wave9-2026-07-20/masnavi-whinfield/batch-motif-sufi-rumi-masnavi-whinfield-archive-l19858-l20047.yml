  quote: ''
  summary: The passage warns against reliance on unaided reason and contrasts contrivance
    with grace. Princes learn from an old Shaikh about the lady depicted in a fort
    and the perilous journey to China; they are told that favor comes to those ready
    to yield their lives. The passage then develops themes of renunciation, figurative
    speech, the language of birds, the Simurgh beyond Mount Qaf, veiled blessing,
    and Zulaikha's use of many ordinary names to signify Yusuf alone.
  language: English
  quote_policy: summarized
