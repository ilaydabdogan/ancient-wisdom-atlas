canonical_text:
  quote: ''
  summary: 'The passage first describes the resurrection day, when human body parts
    testify against their owner’s sins. It then introduces the story of the Lion,
    the Fox, and the Ass: a wounded lion sends a fox to lure prey; the fox debates
    divine trust and worldly effort with a hungry ass, who cites exempla of contentment
    and providential care but is said by the narrator to lack rooted faith. The ass
    follows the fox to the lion’s lair, escapes a failed attack, and is then approached
    again by the fox with renewed deception.'
  language: English
  quote_policy: summarized
