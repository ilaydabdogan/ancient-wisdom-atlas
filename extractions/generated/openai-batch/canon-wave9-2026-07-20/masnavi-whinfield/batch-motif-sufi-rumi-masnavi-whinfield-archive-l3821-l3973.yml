canonical_text:
  quote: ''
  summary: The passage presents didactic advice about entering within and following
    a director, then narrates the lion hunting with a wolf and fox, a parable about
    a man admitted to his friend only after replacing self-assertion with identification
    with the beloved, and the story of Joseph receiving a mirror as a gift. It closes
    with reflections on defect and not-being as mirrors of beauty and perfection,
    warning against self-satisfaction and arrogance through the example of Iblis.
  language: English
