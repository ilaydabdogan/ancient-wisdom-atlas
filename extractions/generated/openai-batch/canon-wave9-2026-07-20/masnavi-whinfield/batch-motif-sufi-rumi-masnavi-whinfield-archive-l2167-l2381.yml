canonical_text:
  quote: ''
  summary: The passage develops a series of analogies about the unseen source of reason,
    soul, light, thought, speech, and continual renewal. It includes parables of cups
    and ocean, a rider searching for the steed he is riding, colors depending on light,
    God being hidden because without opposite, Moses and Sinai as an example of divine
    invisibility, speech as waves from an ocean of thought, forms returning to the
    formless source, thought as an arrow shot by God, life as a renewed stream, and
    a whirled spark appearing as a line of fire. It ends by naming Husamu-'d-Din and
    introducing the story of 'Omar and the ambassador, following a hare's deliverance
    of beasts from a tyrannical lion and exhortation to inner warfare against lusts.
  language: English
  quote_policy: summarized
