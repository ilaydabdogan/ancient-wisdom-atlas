  quote: ''
  summary: The passage opens with an admonition to silence and divine knowledge, then
    reports an anecdote in which the Prophet defends appointing a Hudhaili youth as
    captain over older warriors. The Prophet argues that true age is maturity of wisdom
    rather than white hair or outward signs, using examples including Iblis, an infant
    with 'Isa's soul, veils, divine light, rind and kernel, coins, baskets, and the
    heart. The passage then introduces the story of the Three Fishes from the named
    fable tradition, set in a secluded lake fed by a running stream.
