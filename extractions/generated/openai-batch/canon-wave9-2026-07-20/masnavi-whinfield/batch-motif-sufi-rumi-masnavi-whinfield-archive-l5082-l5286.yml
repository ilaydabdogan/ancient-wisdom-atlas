canonical_text:
  quote: ''
  summary: A pauper gains admission to a prison, consumes the prisoners' food, is
    publicly proclaimed a pauper by order of the Qazi, and refuses payment to a Kurd
    who lent a camel for the proclamation. The passage then turns the prison story
    into a teaching about Iblis/Satan in the world, evil forms and thoughts, refuge
    in God, the hidden true Beloved behind outward beauty, the need to seek the source
    of light rather than reflections, the Creator's hidden workshop of Not-being,
    and Pharaoh's blindness through egoistic Being.
  language: English
  quote_policy: summarized
