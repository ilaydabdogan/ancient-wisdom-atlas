candidate_motifs:
- id: motif:1
  label: supernatural labor under Solomon
  taxonomy_refs: []
  basis: Men and Jinns assist Solomon’s temple-building, and later demons and Jinns
    are imagined as digging stones for a spiritual edifice.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage uses the temple-building episode morally and allegorically;
    it does not narrate a full mythic episode beyond the summarized action.
- id: motif:2
  label: heart as sacred temple to be built
  taxonomy_refs:
  - mystical_quest
  basis: The hearer is urged to build the living temple of the heart and discipline
    inner demons so that the Divine Solomon may be seen.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy link to mystical quest is interpretive; the literal passage
    frames this as exhortation rather than a journey narrative.
- id: motif:3
  label: lustless sacred construction
  taxonomy_refs: []
  basis: Prophets’ buildings and Abraham’s founding of the Ka'ba are praised because
    they are built without lust or strife, not because of material construction alone.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No more specific supplied taxonomy family clearly matches this construction
    motif.
- id: motif:4
  label: guarded signet as protection against demonic rule
  taxonomy_refs:
  - royal_legitimacy
  basis: The heart is compared to Solomon’s signet, and losing it to demons would
    allow demons to rule over the hearer as over Solomon.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The royal-legitimacy taxonomy match is tentative because the passage uses
    the signet primarily as a spiritual warning.
- id: motif:5
  label: all creation supplicates divine sustenance
  taxonomy_refs: []
  basis: Animals, elements, heaven, and earth are said to depend on God and cry to
    Him for support and sustenance.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a theological and devotional pattern rather than a discrete narrative
    episode.
- id: motif:6
  label: animal teaches burial to a human
  taxonomy_refs:
  - wisdom
  basis: The raven teaches Cain to dig graves and bury corpses, illustrating that
    new knowledge depends on divine wisdom.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports the anecdote briefly and explicitly as a Quranic example,
