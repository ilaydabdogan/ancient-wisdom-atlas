- id: motif:7
  label: contrasting royal ministers as good and evil counsel
  taxonomy_refs:
  - duality
  basis: Two vizirs of the same name give opposite outcomes for the poet and are explicitly
    compared with Asaf and Haman.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The motif is embedded in an anecdotal moral comparison rather than in
    a separate mythic narrative.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the two Abu-'l-Hasan vizirs to Asaf and Haman,
    establishing a functional contrast between generous or good royal counsel and
    withholding or evil royal counsel.
  claim_level: same_function
  target: Asaf, Solomon’s good vizir, and Haman, Pharaoh’s evil vizir
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is made within the passage, but it is moral and functional;
    it does not claim historical identity between the paired vizirs.
- id: claim:2
  claim: The raven teaching Cain burial is presented as the same anecdotal motif as
    the cited Quran v.34 account.
  claim_level: same_motif
  target: Quran v.34 raven teaching Cain the burial of corpses
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only summarizes the Quranic anecdote and gives its doctrinal
    use; it does not provide an extended parallel text.
