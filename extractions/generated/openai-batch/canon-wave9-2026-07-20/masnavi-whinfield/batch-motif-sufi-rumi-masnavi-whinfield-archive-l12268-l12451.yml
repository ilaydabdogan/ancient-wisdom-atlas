canonical_text:
  quote: ''
  summary: 'The passage treats Solomon’s temple-building as an image of spiritual
    discipline: men and Jinn assist, lust and fear are described as chains, prophets
    and Abraham build without lust, and the hearer is urged to build the temple of
    the heart and guard Solomon’s signet from demons. It then summarizes a poet’s
    changing treatment by two vizirs, explicitly compared to Asaf and Haman. A later
    section says all creatures and elements depend on God for sustenance, and it mentions
    the raven teaching Cain burial as an illustration of divine wisdom surpassing
    unaided human reason.'
  language: English
  quote_policy: summarized
