canonical_text:
  quote: ''
  summary: The passage presents God as an artist who creates both beautiful and ugly
    forms, contrasts willing faith with unwilling infidelity, gives a prayer for good
    in this world and the next, and describes the faithful passing through Hell, which
    becomes a green garden for them because they have quenched and transformed inner
    fires such as lust, wrath, greed, and malice. It then uses imagery of the Beloved,
    wine, moths and flame, new soul, the opened heart-book, Darvesh correction, and
    begins a story in which Mo'avia is awakened by Iblis at prayer time.
  language: English
  quote_policy: summarized
