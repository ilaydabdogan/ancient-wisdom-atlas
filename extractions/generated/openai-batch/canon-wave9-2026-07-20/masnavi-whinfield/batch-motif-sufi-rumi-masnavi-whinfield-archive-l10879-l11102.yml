  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The resurrection imagery is simile and personified commentary within a
    love-and-reunion scene.
- id: motif:6
  label: Fearless night ordeal in a deadly sacred building
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The stranger insists on sleeping in the deadly mosque, confronts the midnight
