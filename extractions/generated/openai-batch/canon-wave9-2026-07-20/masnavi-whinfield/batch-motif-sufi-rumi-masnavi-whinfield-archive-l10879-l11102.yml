candidate_motifs:
- id: motif:1
  label: Dissolution of body and return of parts to origin
  taxonomy_refs:
  - return
  - death_rebirth
  basis: The elements of the body are loosened by death, sickness, and disease, and
    each part tries to fly back to its origin.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the pattern as a spiritual and bodily analogy, not
    as a narrated literal dismemberment.
- id: motif:2
  label: Heaven-born soul in exile seeking its source
  taxonomy_refs:
  - mystical_quest
  - return
  basis: The soul calls itself heaven-born and exiled, and its loves are directed
    to life, the living one, wisdom, knowledge, and high things.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The extraction treats the passage's explicit metaphor of exile as motif
    material without adding a full journey narrative.
- id: motif:3
  label: Mutual attraction between seeker and sought beloved
  taxonomy_refs:
  - divine_beloved
  basis: The passage states that the love of Him on high is directed to the soul and
    that the soul of the one sought inclines to the seeker.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The beloved relation is expressed doctrinally and poetically; the exact
    identity of each referent shifts between theological statement and narrative praise.
- id: motif:4
  label: Beloved returned from cosmic mountain
  taxonomy_refs:
  - return
  - cosmic_mountain
  basis: The Prince is praised as a phoenix of God and thanked for having come back
    from Mount Qaf.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The statement is praise imagery addressed to the Prince, not a full independent
    mythic episode.
- id: motif:5
  label: Collective grief and reunion figured as resurrection-day
  taxonomy_refs:
  - resurrection
  basis: The whole city weeps and mingles as on the last day, and Heaven tells Earth
