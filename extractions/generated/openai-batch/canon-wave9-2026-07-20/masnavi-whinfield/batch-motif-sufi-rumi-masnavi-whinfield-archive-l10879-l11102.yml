canonical_text:
  quote: "“If you never saw a resurrection-day, see it here !”"
  summary: The passage describes the four elements of the body as birds tied together,
    contrasts the bodily and heavenly origins of body and soul, and narrates praise
    and weeping around the Prince of Bokhara. The communal grief is likened to the
    last day and resurrection-day. The passage then introduces the story of a deadly
    mosque, where a fearless stranger confronts a supernatural threat and the spell
    is broken with falling gold.
  language: English
  quote_policy: quoted
