  summary: The passage concludes a tale in which a cock explains predictions of deaths
    shifted by a master onto others; Moses intercedes so the master may die in God's
    peace. It then gives a didactic discourse on freewill, reward, punishment, and
    moral outcomes. A story follows of a woman whose infants die; after crying to
    God she sees Paradise, mansions, her name inscribed, and her children safe there.
    The passage then reflects on knowing divine realities by effects, similitudes,
    reports, and essence, using examples of a child, Noah, and a Qur'anic formula
    about human casting and divine agency.
