canonical_text:
  quote: ''
  summary: 'The passage first presents a didactic metaphor in which reason slays the
    cow of the body to obtain spiritual sustenance, while lust objects. It then introduces
    the story of the people of Saba: they possess two gardens and divine provision,
    fail to give thanks, reject prophets, misuse parables, and are left to divine
    retribution by flood. The passage warns that sacred similitudes require hidden
    knowledge, citing Moses’ staff becoming a serpent, destructive parables associated
    with Iblis and Korah, and mockers of Noah’s ark.'
  language: English
  quote_policy: summarized
