  basis: The speaker is treated as an unguarded lamb or fawn but asserts a vigilant
    Guardian who protects against rash looks.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy link is interpretive because the passage’s beloved/protected
    figure is presented through poetic address rather than a fully narrated divine-beloved
    episode.
- id: motif:2
  label: Worldly filth as fuel for spiritual purification
  taxonomy_refs:
  - wisdom
  basis: The world’s lust, wealth, dung, and fire heat the bath of piety in which
    the pious dwell cleanly.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is an allegorical teaching rather than a narrative mythic episode.
- id: motif:3
