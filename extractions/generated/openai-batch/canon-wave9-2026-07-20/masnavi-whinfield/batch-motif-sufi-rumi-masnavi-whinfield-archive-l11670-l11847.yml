canonical_text:
  quote: ''
  summary: The passage moves from an admonition about a protected beloved and divine
    guardianship, to an allegory comparing worldly lust to a bath-stove that heats
    the bath of piety, and then to a summarized story of David, Solomon, Bilqis, the
    Jerusalem temple, supernatural aid, a stolen signet, and Solomon’s restoration.
    It closes with a teaching that outwardly man is a microcosm but inwardly the macrocosm,
    illustrated through tree and fruit imagery and prophetic precedence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says the addressee wrongly regarded them as a lamb, fawn, or captive
    without a shepherd or guardian, and that an arrow can answer rash looking by declaring
    guardianship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says they have a Guardian worthy of dominion who knows every wind
    that blows upon them and is neither ignorant nor absent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lust of the world is compared to a bath stove by which the bath of piety
    is heated; the pious are described as dwelling in the bath and cleanliness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rich are compared to those who carry dung to heat the bath furnace, and
    gold is described as foul dung that nevertheless kindles the fire.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A tanner accustomed to bad smells is said to be nearly killed by the smell
    of musk in the perfumers’ bazaar and cured by the familiar smell of dung.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: King David intends to build a temple at Jerusalem, but a divine voice forbids
    him because he has been a man of blood and says Solomon will accomplish the work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Solomon’s temple building is attended by miraculous circumstances, including
    quarry stones crying out and moving by themselves to the temple site.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bilqis, Queen of Saba, sends Solomon forty camels loaded with gold ingots;
    Solomon refuses the gift and sends a letter commanding her to abandon sun worship
    and embrace Islam.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Solomon instructs Bilqis’s messengers to report what they saw in his kingdom
    and later assures her that he seeks her attendance for her own spiritual benefit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bilqis renounces royal state, casts away care for worldly things, and comes
    to Solomon’s court out of desire to learn the true faith.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Solomon commands that Bilqis’s throne be brought from Saba; an Afrit offers
    to fetch it, but Asaf the vizier anticipates him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The temple building is assisted by devils and fairies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: God tests Solomon by placing a false counterpart on his throne; Sakhar steals
    Solomon’s miracle-working signet, assumes his shape, and personates him for forty
    days while Solomon wanders and begs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Solomon regains his throne, completes the temple, begins worship there, and
    sees a tuft of coarse grass in a corner that he fears portends the building’s
    ruin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Solomon takes comfort that while he lives the temple will not fall, and he
    resolves to root up evil weeds from both the hand-built temple and the spiritual
    temple in his heart.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that outwardly a person is the microcosm but in reality
    the macrocosm, and illustrates this by saying the bough seems to cause the fruit
    though the tree is planted for the fruit.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Mustafa is quoted as saying that Adam and all prophets are his followers and
