canonical_text:
  quote: ''
  summary: The passage gives a snake-catcher anecdote in which a frozen snake is brought
    to Baghdad, revives in the sun, and destroys spectators; it then explicitly compares
    fleshly lust to such a snake. It next gives the parable of an elephant in a dark
    room, where different observers touch different parts and give conflicting descriptions;
    this is followed by teaching on outward sense, sea and foam, inner water and Spirit,
    silence, wisdom, and entering Noah's ark. The passage closes with Noah urging
    Canaan to enter the ark during the flood, while Canaan trusts in swimming, his
    own torch, and a high mountain.
