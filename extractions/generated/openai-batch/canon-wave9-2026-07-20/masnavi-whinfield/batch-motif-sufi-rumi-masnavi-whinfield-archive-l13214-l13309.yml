    account of Moses and Pharaoh: Moses asserts God''s sole lordship, rebukes Pharaoh''s
    illusions, distinguishes divine miracle from sorcery, teaches spiritual perception
    and repentance, and offers benefits if Pharaoh confesses the One Creator.'
