canonical_text:
  quote: ''
  summary: 'The passage counsels reserve about mystical mysteries through images of
    the Sun of Truth, moon, stars, honey mixed with vinegar, and a purified heart
    ruled by God. Zaid flees and is described as lost like a star in sunlight, while
    senses and discourse are annihilated in the King''s knowledge. The passage then
    depicts sleepers restored to life on the last day. A following story summarizes
    Ali''s forbearance: when a Magian enemy spits in his face, Ali drops his sword
    and refuses vengeance, explaining that he acts only for God''s will; Ali also
    refuses to kill the stirrup-bearer foretold as his future killer.'
  language: English
  quote_policy: summarized
