canonical_text:
  quote: Seek annihilation and adore change of state.
  summary: The passage teaches that safety from inward enemies comes through self-annihilation
    and absorption in God. It contrasts worldly attachment with blindness and predation,
    using the crow associated with Abraham and Iblis as negative examples. A prayer
    asks God to transform base inclinations into knowledge, temperance, and meekness.
    The passage then presents God as an alchemical transformer who changes elements
    and lower states into human life and later into higher existences, describing
    repeated annihilations and resurrections from inorganic being through vegetative,
    animal, and rational life, and urging the crow to give up old life and live anew.
  language: English
  quote_policy: quoted
