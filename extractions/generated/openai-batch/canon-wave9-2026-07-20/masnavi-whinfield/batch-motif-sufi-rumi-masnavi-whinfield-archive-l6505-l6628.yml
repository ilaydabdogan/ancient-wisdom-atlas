canonical_text:
  quote: Pain is a treasure, for it contains mercies
  summary: A sick man interprets illness as a divine mercy because it brings Muhammad
    to visit him and keeps him awake for midnight devotion. The passage expands this
    into teachings that pain, abasement, darkness, grief, and even death can conceal
    life, exaltation, and mercy. It advises acting contrary to lust, abandoning self-reliant
    knowledge, embracing disgrace and poverty, and frames both good and evil as proceeding
    from God without diminishing divine perfection.
  language: English
  quote_policy: quoted
