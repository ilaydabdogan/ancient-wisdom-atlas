canonical_text:
  quote: ''
  summary: The passage recalls prophetic signs and allusions, then presents a divine
    correction to a Faqir who has sought a hidden treasure by drawing his bow too
    forcefully. It contrasts excessive speculation and proud seeking with humility,
    using Canaan’s mountain refuge against Noah’s ark as an example. It then tells
    of a Muslim, a Jew, and a Christian travelling together, disputing over divinely
    provided sweetmeats, recounting dreams, and accepting that the Muslim’s obedience
    to Muhammad’s command to eat them was best. The stated moral favors immediate
    intuition, prayer, and humble obedience over philosophical inference.
  language: English
  quote_policy: summarized
