canonical_text:
  quote: ''
  summary: The passage moves from a speaker who says he desired only the king’s blows
    and would receive eternal life if the king killed him, to an illustration in which
    Abraham refuses Gabriel’s help in Nimrod’s fire because one united with God needs
    no intermediary. It then presents Moses asking why God creates forms and destroys
    them. God instructs Moses to sow and reap grain, then explains separation of wheat
    from straw as an analogy for discerning pure and dark spirits. The passage closes
    with images of hidden treasure, soul hidden in body like butter in milk, and the
    opening of a new story about a king who dreams his son dies and arranges a marriage
    for succession.
