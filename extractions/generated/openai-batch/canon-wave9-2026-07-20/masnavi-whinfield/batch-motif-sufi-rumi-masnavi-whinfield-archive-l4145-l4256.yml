canonical_text:
  quote: ''
  summary: The passage presents counsels on inward prophetic knowledge and reserve.
    It introduces the story of the Prophet questioning his freedman Zaid at dawn.
    Zaid describes ecstatic knowledge marked by thirst, sleepless love, altered time,
    and visions of the eight heavens, seven hells, destinies of souls, and the last
    judgment. The Prophet repeatedly instructs him not to disclose such hidden knowledge
    before its appointed time, emphasizing hope, fear, and faith in the unseen. The
    section ends with sayings comparing the Prophet’s companions to stars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says one may see a pure bright essence and know the Prophet in
    the heart without book, tutor, or preceptor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A saying describes the soul beholding the Prophet by the same light by which
    the Prophet beholds the soul, in the fount of the water of life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names a mystery of being a Kurd last night and becoming an Arab
    in the morning, and says this leads to the road to God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn the Prophet asks Zaid about his state and asks him to show a token
    if the garden of faith has bloomed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zaid answers that he has been thirsty for many days, has not slept at night
    because of burning pangs of love, and has passed beyond ordinary days and nights.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Zaid states that in that state all faith is one, vast spans of time and a
    moment are one, and reason cannot enter when mind is lost.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Prophet asks Zaid to bring a token from the celestial region to show that
    he had truly been there in spirit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Zaid says he has seen the eight heavens, the seven hells, and the destinies
    of all people as bound for heaven or hell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zaid compares the body to a mother, the soul to her infant, and death to parturition,
    when the soul’s class becomes manifest.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Zaid says that on the day of judgment it will be manifest whether a soul belongs
    to the saved or lost, and that this is already plain to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Zaid asks whether he should publish his secret knowledge to all people or
    remain silent; the Prophet tells him to hold his peace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Zaid continues describing the last judgment vision, and the Prophet again
    commands him to pause.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Prophet says that God allows His Prophet to speak truth, but that it would
