canonical_text:
  quote: ''
  summary: 'The passage contains several didactic episodes: an old man and physician
    discuss ailments attributed to old age; a reflection contrasts external mosque-building
    with the hearts of saints; an Arab carrier rejects a poor scholar after learning
    that his human learning has not brought sustenance; Ibrahim bin Adham demonstrates
    inspired knowledge and spiritual power by casting a needle into the sea and receiving
    golden needles from fishes; and God answers a sinner, through Shu''aib/Jethro,
    that hidden punishment consists in bondage, rust on the heart, and blindness to
    mysteries.'
  language: English
  quote_policy: summarized
