canonical_text:
  quote: ''
  summary: The passage first teaches that loss and distress decreed by God may be
    a gain because a lesser calamity can prevent a greater one. It then begins the
    story of a man who asks Moses to teach him animal languages. Moses warns that
    such knowledge will be destructive, consults God, and teaches him the languages
    of fowls and dogs. The man overhears a cock and a dog; the cock predicts deaths
    of the master's horse and mule, and the man sells those animals to avoid the losses.
  language: English
  quote_policy: summarized
