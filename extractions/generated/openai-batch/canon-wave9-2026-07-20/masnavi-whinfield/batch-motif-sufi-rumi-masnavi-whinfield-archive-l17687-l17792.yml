canonical_text:
  quote: ''
  summary: The passage opens with a speaker fearing that a disclosed secret will spread
    and harm his standing among Arabs. It then turns to prayer for divine aid in the
    trial of free will, describing human will as a perilous trust and portraying escape
    from self-consciousness through intoxication or self-abandonment. It states that
    entry to the divine audience requires annihilation of self and defines ascension
    as self-annihilation. A story begins about a man whose Hindu slave, raised in
    the household, falls in love with the master's daughter; the master stages a mock
    marriage with a boy disguised as the bride, after which the slave rejects the
    girl and the story begins to draw a moral about worldly pleasures.
  language: English
  quote_policy: summarized
