  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Solomon rebukes Bilqis's messengers for bringing gold rather than a humble
    heart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Solomon's story, a druggist uses a lump of soapstone as a weight for sugar-candy,
