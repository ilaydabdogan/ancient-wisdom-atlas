    of sugar-candy he will receive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage explicitly applies the druggist story to people who grasp transitory
    worldly wealth and thereby lose stable wealth in the world to come.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Solomon's message to Bilqis reports gold plains, gold-faced mansions, his
