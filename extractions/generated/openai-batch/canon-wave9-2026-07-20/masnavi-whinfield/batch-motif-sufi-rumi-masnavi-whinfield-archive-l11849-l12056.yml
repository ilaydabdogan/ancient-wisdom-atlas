canonical_text:
  quote: |-
    Distance and nearness affect only the body,

    What do they matter in the place where God is ?
  summary: The passage moves through teachings and anecdotes on Muhammad’s ascent
    and mediating role, nearness to God beyond bodily distance, Solomon’s rebuke of
    Bilqis’s messengers and his parables against worldly wealth, a dervish and hidden
    saint whose firewood is miraculously changed to gold and back, and Ibrahim bin
    Adham’s relation to music, heavenly remembrance, renunciation, and the beginning
    of his abdication episode.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A figure identified in the supplied notes as Muhammad is connected with ascent
