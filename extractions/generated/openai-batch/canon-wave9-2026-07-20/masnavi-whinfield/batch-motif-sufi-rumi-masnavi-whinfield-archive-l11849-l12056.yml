    and precious pearls.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The address to Bilqis says to quit wealth, even the realm of Saba, and says
    that what is called a throne is only a prison when one lacks sovereignty over
    one's passions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bowing before the King of kings is said to bring otherworldly kingdoms, while
    the delight of bowing before God is said to be sweeter than countless glories.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A dervish dreams of saints and asks for daily bread without being obliged
