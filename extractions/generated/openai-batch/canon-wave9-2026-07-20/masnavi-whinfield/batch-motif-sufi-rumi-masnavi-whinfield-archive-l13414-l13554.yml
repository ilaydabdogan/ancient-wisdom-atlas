canonical_text:
  quote: ''
  summary: 'The passage first uses the image of a leased house, a neglected hidden
    treasure, and regret after death. It then addresses Pharaoh with admonition: a
    staff is brought for correction and becomes a serpent as a warning. God is described
    as able to make hell or heaven manifest wherever He wills, including in bodily
    sensations. The Nile is said to have become blood for Egyptians, preserved Israelites,
    and learned divine discernment by letting some pass and engulfing others. The
    passage ends by contrasting God''s mercy, which grants wisdom even to inanimate
    things, with wrath, which removes wisdom.'
  language: English
  quote_policy: summarized
