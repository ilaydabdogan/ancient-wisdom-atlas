canonical_text:
  quote: ''
  summary: A fable of three fishes contrasts immediate escape, delayed but clever
    feigned death, and foolish confusion ending in death. The following didactic verses
    identify marks of the wise, half-wise, and fool through images of light, guidance,
    wandering, and becoming as dead under the wise. The passage then begins a bird-counsel
    tale in which a captured bird offers three counsels, escapes to a roof, claims
    a lost pearl was inside its body, and the captor laments.
  language: English
