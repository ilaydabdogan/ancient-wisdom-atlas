canonical_text:
  quote: ''
  summary: The passage teaches that religious expressions and powers derive value
    from the speaker's inner state; contrasts valid and invalid utterance through
    exempla; warns against blind imitation through the Sufi's lost ass; identifies
    greed as a veil over perception; and contrasts worldly payment with the Prophet's
    reward of the Friend's vision.
  language: English
  quote_policy: summarized
