canonical_text:
  quote: ''
  summary: The passage treats envy as destructive among rulers and lovers, gives an
    anecdote of a lover who proves love by giving up life, cites a legal view on weeping
    in prayer, and tells of an ignorant youth who imitates a weeping Shaikh without
    understanding. It develops analogies of a deaf man laughing by imitation, a foolish
    imitator, a parrot trained through a mirror, and prophets or saints as mirrors
    through which hidden divine speech instructs people. The closing verses contrast
    borrowed joy with realized insight through images of water from a fountain, light
    from the moon, and awakening after wandering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says people in fleeting prosperity burn up wealth and men through
    envy, and that kings lead armies to slay their own people from envy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lovers and beloveds are said to become jealous, attempt one another's lives,
    and perish along with their love; the romances Wais and Ramin and Khosrau and
    Shirin are named as examples to read.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the lover anecdote, a lover recounts his services and toils to his mistress
    and asks what more he can do; she answers that these are branches of love and
    that the root is giving up life for the beloved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lover in the anecdote gives up his life and is described as enjoying eternal
    fruition of love, with a citation about the soul at rest returning to the Lord.
  category: sequence
  evidence_refs:
  - ev:2
