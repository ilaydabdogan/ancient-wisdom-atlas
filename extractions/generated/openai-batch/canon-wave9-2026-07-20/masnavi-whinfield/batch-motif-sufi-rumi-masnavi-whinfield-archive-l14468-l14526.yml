canonical_text:
  quote: ''
  summary: A guest refuses more food after receiving spiritual food from the Prophet,
    prompting other guests to marvel. The passage then teaches that ritual practices,
    almsgiving, offerings, and abstaining from avarice bear witness to inward faith
    and secret thoughts. It warns that fasting and almsgiving performed fraudulently
    are rejected in God's court, comparing hypocritical practice to a hunter scattering
    grain and a fasting cat waiting to catch birds. It closes by saying God's grace
    and mercy may purge hypocrisy and prevail over vengeance.
