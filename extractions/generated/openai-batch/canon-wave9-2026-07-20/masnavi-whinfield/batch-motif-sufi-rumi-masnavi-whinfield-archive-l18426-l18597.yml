  quote: Wisdom and knowledge serve to guide the wanderers; Were there but one road
    wisdom would be needless.
  summary: A Sufi, a sick Faqir, and a Qazi dispute justice, mercy, misfortune, and
    divine ordination. The passage then develops teachings on death, lost opportunities,
    the body as foam from the divine Ocean, and the necessity of temptations and oppositions
    for virtue and wisdom.
