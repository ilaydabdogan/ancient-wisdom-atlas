canonical_text:
  quote: ''
  summary: The passage presents Daquqi as a devotional wanderer seeking God's chosen
    ones and describing spiritual journeying as beyond bodily travel. It then teaches
    that diverse praises and religions are directed toward one divine object, using
    images of light, reflection, moon, well, stream, and ewer. A continued story recounts
    how a man who killed and ate a cow is brought before David by the cow's owner;
    David first orders restitution, then discovers the plaintiff had murdered the
    accused man's grandfather and stolen his goods, reverses judgment, and executes
    the murderer at a desert tree. The passage closes with moral reflections that
    hidden crimes betray themselves through the body, that God can expose sins on
    Judgment Day, and that lust should be killed like the murderer in the story.
  language: English
  quote_policy: summarized
