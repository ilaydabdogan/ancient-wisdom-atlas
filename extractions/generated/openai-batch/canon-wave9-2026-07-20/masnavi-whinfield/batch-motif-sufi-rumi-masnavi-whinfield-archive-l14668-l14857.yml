canonical_text:
  quote: ''
  summary: The passage opens with a mystical address to a divine writer who inscribes
    forms and letters upon Not-being and teaches Reason from the Indelible Tablet.
    It then reflects on bewildered human seeking, hidden mercies and wrath, and divine
    testing through deceptive appearances. It summarizes the story of an Arab whose
    dog dies of hunger while he keeps food for himself and offers only costless tears,
    leading a neighbor to rebuke him. It then tells of a sage who sees a peacock destroying
    its plumage to avoid hunters; the poet turns this into a lesson on worldly adornments,
    spiritual danger, probation, and inward detachment rather than bodily mutilation.
  language: English
  quote_policy: summarized
