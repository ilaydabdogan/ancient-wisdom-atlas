canonical_text:
  quote: ''
  summary: The passage first teaches that the Koran has multiple inner meanings beyond
    its outward sense and warns against reviling it. It then recounts a gnat petitioning
    Solomon for justice against the Wind; Solomon summons the other party, and the
    gnat flees when the Wind arrives, which is used as an analogy for seekers vanishing
    when God appears. The passage then begins the story of a lover separated from
    his mistress for seven years, pursued by the patrol into a garden where he finds
    her; when he tries to embrace her, she rebukes him because the blowing wind shows
    God is present.
