canonical_text:
  quote: ''
  summary: 'The passage moves through several units: an ant prince comments on outward
    form and mind; Muhammad asks Gabriel to reveal his true form and swoons when Gabriel
    does so; an address to Husamu''d-Din uses images of slaughter, new existence,
    and unity; a commentary interprets Abraham''s four birds as four passions; and
    a story tells how the Prophet hosts a gluttonous infidel guest, cleans the guest''s
    defiled bedding, receives his repentance, and brings him to Islam and restraint.'
  language: English
  quote_policy: summarized
