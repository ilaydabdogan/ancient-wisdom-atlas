canonical_text:
  quote: ''
  summary: 'The passage presents several linked didactic episodes: Zaid, after being
    struck, refuses speculative analysis while in pain; a lover reads sonnets before
    his mistress and is rebuked for preferring his own raptures to her presence; a
    doctrinal section contrasts the mere Sufi bound to changing states with the pure
    one immersed in divine love; a man in David''s time prays for provision without
    work and receives a cow; and a final section contrasts opinion and knowledge through
    the image of a bird with one or two wings.'
