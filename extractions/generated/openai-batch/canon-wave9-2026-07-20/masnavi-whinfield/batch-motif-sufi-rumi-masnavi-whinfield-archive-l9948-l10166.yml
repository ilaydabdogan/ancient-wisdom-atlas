canonical_text:
  quote: "“In difficulties there is provided a way of salvation.”"
  summary: 'The passage moves from the prophets’ despair over unbelievers to an exhortation
    that action in religion, like trade or sea travel, must proceed under hope and
    uncertainty. It then summarizes several miracles attributed to the Prophet Muhammad:
    a napkin purified rather than burned in fire, water multiplied from a single water-skin
    for a caravan, a water-carrier transformed in appearance, an infant recognizing
    the Prophet, and an eagle removing a sandal from which a viper falls. The closing
    moral urges the soul to trust God’s benevolence when sudden misfortunes occur.'
  language: English
  quote_policy: quoted
