canonical_text:
  quote: Death is gain, for “ God will change their evil things into good things ”
  summary: The passage recounts God appointing ’Izrail as the angel of death after
    his return to heaven with a handful of earth. ’Izrail fears human hatred, but
    God says death will be attributed to disease and sickness. The passage then argues
    that death is a gain or boon for the spiritual, contrasts foolish desire for an
    undying world with a corrective answer, and prays for things to be shown as they
    truly are.
  language: English
  quote_policy: quoted
