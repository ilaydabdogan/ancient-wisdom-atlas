canonical_text:
  quote: ''
  summary: The passage closes a schoolboy trick episode, then tells of a Darvesh who
    makes a mountain vow to eat only windfall fruit, breaks the vow through hunger,
    and later loses the offending hand after being mistakenly arrested with robbers.
    The surrounding teaching states that vows and human intentions depend on God's
    will, using images of a wind-driven feather, boiling water, birds falling into
    a visible snare, an impoverished king's son bound by an invisible decree, and
    Ahmad seeing an unseen burden of firewood and rope on the wife of Bu Lahab.
  language: English
  quote_policy: summarized
