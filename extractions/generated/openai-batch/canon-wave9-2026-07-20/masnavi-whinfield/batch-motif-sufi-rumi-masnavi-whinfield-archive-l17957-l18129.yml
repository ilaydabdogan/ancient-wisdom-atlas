canonical_text:
  quote: ''
  summary: The passage exhorts constant watchfulness for divine blessing, then develops
    a Sufi teaching on negation, annihilation of self, spiritual intoxication, and
    veiled mystical speech. It illustrates these themes through a sleeping lover,
    a drunken Turkish amir and a spiritual minstrel, metaphors of wine and pitchers,
    the nearness of the divine Beloved, and an anecdote about the Prophet, A'isha,
    and a blind man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The poet introduces the need for constant watchfulness in order to avoid worldly
    snares and not miss divine blessing.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tradition is cited in which Allah descends after half the night and grants
    requests, pardon, and petitions; negligent sleepers miss this blessing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A lover obtains an assignation with his mistress, is found asleep when she
    comes, and is rejected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage exhorts the casting away of one's own will, knowledge, power,
    and self into the river of annihilation, followed by a higher state of eternal
    existence in God.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The negation in the creed is described as finding its purpose in affirmation,
    and the negation of self clears the way for apprehending that there is no existence
    but The One.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The intoxication of life and its pleasures is said to veil Truth, and the
    hearer is urged to pass to spiritual intoxication and beatific vision.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Turkish noble wakes from drunken sleep and calls for a minstrel to enliven
