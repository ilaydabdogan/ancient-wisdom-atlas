  quote: ''
  summary: The passage includes Moses rebuking a calf-worshipping doubter by recalling
    miracles; reflections on recognition and unbelief using Abu Bakr, Muhammad, and
    Abu Jahl; a divine voice telling Moses that neglecting a sick saint is neglecting
    God; a gardener separating and chastising three friends; and Bayazid meeting a
    saint who redirects pilgrimage from the Ka'ba toward the living saint as God's
    house.
  language: English
  quote_policy: summarized
