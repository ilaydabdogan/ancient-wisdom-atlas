canonical_text:
  quote: ''
  summary: The passage opens with a prologue explaining the delayed recommencement
    of the Masnavi through images of blood becoming milk, birth, Husamuddin’s return,
    spring, sea and shore, music, and a hawk hunting mysteries. It then summarizes
    the story of a Sufi whose neglected ass is sold by other Sufis while he unknowingly
    joins their song. The poet explains that doctrines are veiled in fables and urges
    readers to separate grain from chaff. A doctrinal section says God sent prophets
    to distinguish faith from infidelity, like daylight revealing true and false coins.
    A final exegesis interprets Daylight and Night in relation to resurrection, saints,
    Mustafa/Muhammad, Qur'anic language, veiling, and union with God.
  language: English
  quote_policy: summarized
