canonical_text:
  quote: ''
  summary: The passage describes the eldest prince entering the King's presence after
    his spiritual perception has been opened, then inserts an anecdote about a Qazi
    trapped by a dwarf and his wife and rescued by a Deputy. The prince dies without
    obtaining the King's daughter but is said to gain union with the King or Spiritual
    Beloved. The passage then develops images of waning, sickness, silence, a wooden
    horse or boat, and the sea of Truth to express an inexpressible spiritual state.
    It ends with the second brother arriving for the funeral and receiving spiritual
    knowledge from the King.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eldest brother rushes into the King's presence and kisses his feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King is described as knowing the prince's troubles, his renunciation of
    earthly rank through love for the King's daughter, and his earlier lack of the
    inner eye or spiritual sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince's eyes are said to have been opened by the King's grace, after
    which he escapes worldly lusts and illusions and resolves not to be led captive
    again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A dwarf tells his wife to ensnare a rich man for money; she goes to the Qazi's
    court, pretends to have a grievance, and beguiles the Qazi into visiting her at
    night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the dwarf returns and knocks, the frightened Qazi hides in a large chest;
    the chest is taken toward the bazar, and the Deputy redeems it for one hundred
    Dinars so the Qazi escapes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the woman later tries to seduce the Qazi a second time, he refuses, saying
    he has escaped her toils once and will not fall into them again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Deputy's freeing of the Qazi is explicitly connected by the poet with
