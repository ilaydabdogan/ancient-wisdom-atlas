  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The eldest prince falls sick from hope deferred and dies; although he does
    not obtain the King's daughter, he obtains union with the King, described as the
    real spiritual object of his love.
  category: sequence
  evidence_refs:
  - ev:5
