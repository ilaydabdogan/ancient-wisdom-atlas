    the King cherishes the prince, who is compared to a moon waning in that sun.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:7
  type: summary
  locator: 20264-20281
  quote_or_summary: The waning of lovers is said to make them stronger; the lovesick
    speaker asks for increased waning and values the poison, sickness, and sin of
    love; the prince dwells with the King with a burning heart as a living sacrifice.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:8
  type: summary
  locator: 20283-20299
  quote_or_summary: Patient waiting consumes the prince; he dies before attaining
    his desire, the earthly Beloved is hidden, and he finds union with the Spiritual
    Beloved, becoming naked of the body and its illusions.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:9
  type: summary
  locator: 20301-20319
  quote_or_summary: The story says what follows is hidden and inexpressible; one rides
    to the sea-coast but needs a wooden horse, glossed as a boat, for the sea; silence
    is this horse and guides men at sea while uttering cries of love audible to the
    spiritual.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:10
  type: summary
  locator: 20321-20340
  quote_or_summary: The spiritual man says others lack ears for his cries; sensual
    ears are deaf, the carnal man hears nothing, and the perfect spiritualist breaks
    his boat and plunges into the sea as a fish of the sea of Truth, becoming a mystery
    beyond words.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:11
  type: summary
  locator: 20342-20347
  quote_or_summary: The marvellous one's state is said to be beyond further explanation;
    the illustrations are called weak and only necessary because no better sensible
    objects are available.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized evidence.
- id: ev:12
  type: summary
  locator: 20349-20353
  quote_or_summary: After the eldest prince dies, the youngest is sick and cannot
    come; the second brother comes to court for the funeral, and the King pities him
    and instills spiritual knowledge of the verities into him.
