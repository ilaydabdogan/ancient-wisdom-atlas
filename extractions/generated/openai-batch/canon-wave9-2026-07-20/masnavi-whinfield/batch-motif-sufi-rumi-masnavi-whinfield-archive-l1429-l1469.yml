  quote: ''
  summary: A Vazir secretly gives different and contradictory religious instruction
    books to twelve captains, withdraws into a cave, commands each captain to claim
    succession and kill rivals, then kills himself. The captains make competing succession
    claims, dividing the Christians into hostile sects, though one faithful band adheres
    to the name Ahmad mentioned in the Gospel and is saved. A following verse describes
    crowds of Christians gathering around the Vazir as he preaches Gospel mysteries
    and religious duties, while inwardly acting like a decoy and fowler.
