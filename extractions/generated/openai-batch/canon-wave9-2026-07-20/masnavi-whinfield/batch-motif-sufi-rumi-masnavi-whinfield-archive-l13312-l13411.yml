canonical_text:
  quote: Destroy your house, and with the treasure hidden in it / You will be able
    to build thousands of houses.
  summary: Pharaoh asks Asiya whether he should abandon unbelief and believe Moses.
    Asiya urges him to do so and warns him not to consult Haman, illustrating Haman’s
    spiritual blindness with the story of an ignorant old woman who ruins a royal
    falcon. Pharaoh still consults Haman; Haman appeals to Pharaoh’s royal pride,
    and Pharaoh refuses conversion. Moses is discouraged, but a heavenly voice consoles
    him. The passage then develops the saying about the hidden treasure through verses
    describing a treasure beneath a house that must be destroyed in order to reveal
    it.
  language: English
  quote_policy: quoted
