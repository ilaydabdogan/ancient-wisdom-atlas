canonical_text:
  quote: ''
  summary: The passage first recounts Joseph in prison asking a fellow prisoner to
    remember him before the king, then remaining imprisoned because he relied on human
    aid rather than God. It then introduces the story of a king who sends his three
    sons to inspect his realm but forbids them from approaching a fort; they disobey,
    see images there including a portrait of the daughter of the King of China, and
    become lovesick. A didactic exposition follows on forms, images, and the formless
    divine source, concluding with prophets revealing the hidden Truth or real self
    beyond the visible bodily self.
  language: English
  quote_policy: summarized
