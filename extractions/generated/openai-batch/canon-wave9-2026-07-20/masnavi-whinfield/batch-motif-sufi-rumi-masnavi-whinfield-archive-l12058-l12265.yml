canonical_text:
  quote: ''
  summary: The passage opens with an unnamed throne-seated figure questioning guards
    who claim to be searching for camels on a housetop; they answer that this mirrors
    seeking union with God while sitting on a throne. The figure then disappears from
    sight, with imagery of fairies, the 'Anka, birds, and Mount Qaf. The passage then
    turns to Solomon’s preaching to the people of Bilqis/Saba, addressing lovers,
    souls and bodies, and many kinds of birds according to their conditions. A prose
    summary recounts miraculous incidents from the Prophet’s childhood and a story
    of a cur attacking a blind man instead of hunting nobler game. The final section
    gives Solomon’s admonitions to Bilqis to abandon perishable worldly sovereignty
    for a spiritual kingdom, garden, fount of life, heavenly motion, and non-dual
    self-possession.
  language: English
  quote_policy: summarized
