canonical_text:
  quote: ''
  summary: The passage frames Daquqi's story as an illustration of a saint whose will
    is identified with the Divine will. Daquqi journeys in pious longing to see the
    Divine Friend, reaches the sea-shore, beholds seven lights that become one light,
    then seven men, then seven trees, and later seven men again. The trees bow in
    prayer, Daquqi leads the seven in devotion, and his prayer saves a distressed
    ship's crew, who then vanish, causing doubt among his followers. The verse section
    describes Daquqi as an itinerant lover of God, miracle-worker, intercessor, and
    one who avoids attachment to dwellings; it ends with a prophetic saying about
    fatherly care and the relation of parts to the whole.
  language: English
  quote_policy: summarized
