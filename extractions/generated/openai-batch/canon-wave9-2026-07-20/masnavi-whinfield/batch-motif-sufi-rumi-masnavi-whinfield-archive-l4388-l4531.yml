canonical_text:
  quote: ''
  summary: The passage recounts a discourse in which the Prophet foretells that ’Ali’s
    servant will kill him; the servant asks to be killed first, but ’Ali accepts the
    decree and describes the servant as an instrument of God. The passage then expands
    into reflections on divine decree, retaliation, abrogation, contraries, darkness
    and light, war and peace, and concludes with God rebuking Adam for scorning Iblis
    because hidden mysteries are unknown to him.
  language: English
  quote_policy: summarized
