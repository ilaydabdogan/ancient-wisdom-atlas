  quote: The moral is, not to find fault with others
  summary: 'Four Hindustanis begin prayer in a mosque, but each successively speaks:
    one questions the Muazzin, two rebuke earlier speakers, and the fourth praises
    himself for not making their error. The narrator states a moral against fault-finding
    and adds a brief exemplum of two prisoners in which a condemned man asks that
    his companion be killed instead.'
