  summary: The passage presents an anecdote about travellers who quarrel over different
    words for grapes, then a didactic poem about young ducks urged to leave a dry-land
    nurse and enter the ocean of real Being. It continues with a fable of hungry travellers
    who eat a young elephant despite warning and are killed by its parent, followed
    by a meditation on God's protection of saints and examples of prophetic chastisement.
