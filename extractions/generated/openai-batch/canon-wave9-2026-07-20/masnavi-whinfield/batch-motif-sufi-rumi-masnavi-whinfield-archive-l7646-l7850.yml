candidate_motifs:
- id: motif:1
  label: many names conceal one shared object or essence
  taxonomy_refs:
  - wisdom
  basis: The passage explicitly links sectarian error to names rather than essence
    and illustrates this with different words for grapes.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The supplied taxonomy has no specific language-confusion motif, so the
    broader wisdom category is used.
- id: motif:2
  label: innate return from false nurture to true element
  taxonomy_refs:
  - mystical_quest
  - return
  basis: The duckling's longing for the ocean is traced to its true mother, and it
    is urged to leave the dry-land nurse for the ocean of real Being.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The image is didactic and mystical rather than a narrative of physical
    return alone.
- id: motif:3
  label: human dual nature moving between two realms
  taxonomy_refs:
  - duality
  basis: The passage describes the addressee as flourishing on land and water and
    says the human body is animal while the soul is angelic, enabling movement on
    earth and in heaven.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is an explicit doctrinal comparison rather than a full mythic episode.
- id: motif:4
  label: neglected guide and the Causer beyond caused things
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Solomon is said to be present but unseen through negligence, and the thirsty
    person is described as looking to streams while missing heavenly rain and the
    Causer.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The motif is abstract and homiletic; no independent quest narrative is
    narrated here.
- id: motif:5
  label: slain offspring avenged by parent with guilt detected bodily
  taxonomy_refs:
  - divine_judgment
  - divine_parent_child
  basis: The young elephant's parent tracks the sleepers, detects the eaters by breath,
    kills them, and spares the abstainer; the following section frames this as a lesson
    on God's care for His children.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The literal story concerns elephants; the divine-parent reading is supplied
    by the passage's subsequent moralization.
- id: motif:6
  label: saints as divine children under jealous protection
  taxonomy_refs:
  - divine_parent_child
  basis: The pious, saints, and Darveshes are called God's children, and God is described
    as informed of their state and jealous for their lives.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The language is devotional and metaphorical; the passage does not describe
    biological divine parentage.
- id: motif:7
  label: prophetic words or signs enact divine chastisement
  taxonomy_refs:
  - divine_judgment
  basis: Moses' staff, Noah's curse and flood, Lot's prayer, and prophets holding
