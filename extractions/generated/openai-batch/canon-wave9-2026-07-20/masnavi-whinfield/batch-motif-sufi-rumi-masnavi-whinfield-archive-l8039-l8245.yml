candidate_motifs:
- id: motif:1
  label: Betrayed hospitality and recognition test
  taxonomy_refs:
  - wisdom
  basis: The story turns on a host-guest obligation being reversed and exposed through
    the villager’s own claim that he could distinguish an ass from a wolf in the dark.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy link to wisdom is broad; the passage frames the narrative
    as moral instruction rather than as a named folktale type.
- id: motif:2
  label: Miraculous healing at a holy threshold
  taxonomy_refs: []
  basis: Afflicted people gather at 'Isa’s door, hoping for healing through his breath,
    and rise healed after his prayer and command by God’s grant.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No more specific healing taxonomy reference was supplied.
- id: motif:3
  label: Supplication at the door of holy persons
  taxonomy_refs:
  - mystical_quest
  basis: The addressee is urged to seek pardon from the men of heart and remain at
    the door, with tears likened to clouds that make a rose-garden bloom.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The mystical-quest classification is interpretive and should be reviewed.
- id: motif:4
  label: Divine benefactor surpassing maternal nurture
  taxonomy_refs:
  - divine_parent_child
  - wisdom
  basis: God’s claims are said to exceed a mother’s because God forms and nourishes
    the embryo and makes mother, breast, milk, and father.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not call God a parent; the classification rests on the
    comparison between divine claim and maternal nurture.
- id: motif:5
  label: Faithful divine companion beyond ascent and descent
  taxonomy_refs:
  - ascent
  - wisdom
  basis: The speaker contrasts friends who rise or sink with God, who is beyond the
    above and below and remains with the addressee when house and home are lacking.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: Ascent is present as an explicit comparison, but the main emphasis is
    reliance on God rather than an ascent journey.
- id: motif:6
  label: Testing false pretensions to sanctity
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The passage states that many tests await one claiming spiritual rank and
    compares this with a claimed tailor being given silk by a master.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The initiation label marks the testing structure, not a full initiation
    rite.
