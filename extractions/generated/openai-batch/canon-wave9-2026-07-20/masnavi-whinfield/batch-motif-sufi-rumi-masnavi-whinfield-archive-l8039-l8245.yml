canonical_text:
  quote: ''
  summary: The passage presents a didactic parable in which a villager who once received
    hospitality refuses to recognize and shelter his townsman benefactor, then is
    exposed by a garden-watch test. It then turns to poetic teaching on Jesus healing
    the afflicted at his door, repentance toward the men of heart, gratitude for God's
    greater claims than even a mother’s, the danger of faithless companions, reliance
    on God beyond ascent and descent, and the testing of false claims to sanctity.
  language: English
  quote_policy: summarized
