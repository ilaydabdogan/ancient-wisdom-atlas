  text: The villager repeatedly invites the townsman to visit his village with his
    family; after long hesitation and ten years of solicitation, the townsman goes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On arrival, the villager shuts the door against the townsman, denies knowing
    him, and the townsman spends five nights in cold and rain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The villager grants shelter only if the townsman guards his garden from wolves;
    the townsman takes bow and arrows and shoots the villager’s pet ass in the rain
    and darkness, mistaking it for a wolf.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The villager says he would not mistake an ass for a wolf even on the darkest
