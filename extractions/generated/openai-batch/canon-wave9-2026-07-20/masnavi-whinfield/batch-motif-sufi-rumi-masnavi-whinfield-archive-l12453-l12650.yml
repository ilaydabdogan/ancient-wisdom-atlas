canonical_text:
  quote: ''
  summary: 'The passage contrasts inward spiritual perception, humble confession,
    love, and inspired knowledge with outward perception, bad companionship, pride,
    carnal reason, and self-excusing claims of compulsion. It uses several exempla:
    Solomon''s plant knowledge, a Sufi in a garden who sees divine signs inwardly,
    Adam''s confession, Iblis''s blame-shifting, Canaan''s failed refusal of Noah''s
    ark, the superiority of inspiration to book learning, and the Egyptian women overwhelmed
    by Yusuf''s beauty.'
  language: English
  quote_policy: summarized
