- id: obs:1
  text: A Muslim reports that the Prophet Muhammad appeared to him and spoke.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Within the reported vision, a Jew is said to have gone to the top of Sinai,
    and a Christian is said to have been carried by 'Isa to the summit of the fourth
    heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Muslim is told in the vision to arise and eat sweetmeats, confections,
    and divine sweets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The others accuse the Muslim of gluttonously eating all the sweets; he replies
    that he obeyed the command of his sovereign lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The others conclude that the Muslim has seen a true vision and say that his
    dream was seen while awake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker urges the audience to quit excessive speculation and inordinate
    science, and says that service, good conduct, and worship are the intended ends.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Samiri, Qarun, and Abu-l Jahl are cited as examples whose science, alchemy,
