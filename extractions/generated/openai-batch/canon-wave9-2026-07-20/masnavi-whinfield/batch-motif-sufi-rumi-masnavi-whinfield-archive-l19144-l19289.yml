canonical_text:
  quote: ''
  summary: The passage contrasts speculative learning with experiential knowledge
    and obedient service. A Muslim reports a vision of Muhammad in which Jewish and
    Christian companions are described as ascending to Sinai and the fourth heaven,
    while he is commanded to eat divine sweets. The companions accept his vision as
    true. The discourse then criticizes excessive proof-making through examples of
    downfall and the image of seeing fire directly rather than inferring it from smoke.
    It closes with anecdotes and maxims about mercy, chastisement, justice, and putting
    each thing in its proper place.
  language: English
  quote_policy: summarized
