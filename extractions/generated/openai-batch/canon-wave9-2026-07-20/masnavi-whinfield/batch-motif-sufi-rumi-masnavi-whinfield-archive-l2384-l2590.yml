canonical_text:
  quote: ''
  summary: An ambassador seeks 'Omar, finds him without a material palace and lying
    under a palm-tree, receives instruction on mystical union with God, and asks why
    souls descend from heaven and are confined in bodily life. 'Omar answers through
    a discourse on divine speech, creation, dissolution, inward hearing, freewill
    and compulsion, spiritual transmutation, the power of soul, and recompense as
    hell or “The Friend.” The ambassador accepts the teaching and becomes a pure-hearted
    Sufi; the frame voice says the hare urged his companions to do likewise.
  language: English
  quote_policy: summarized
