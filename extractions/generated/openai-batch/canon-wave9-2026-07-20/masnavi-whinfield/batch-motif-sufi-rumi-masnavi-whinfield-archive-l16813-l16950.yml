canonical_text:
  quote: ''
  summary: 'The passage links several didactic anecdotes: a disguised dwarf at a sermon
    distinguishes outward crying from inward heart-change; the king asks Ayaz to explain
    his regard for old shoes and rags and illustrates true holiness through stories
    of Bayazid, a Gueber, a hypocritical missionary, a harsh-voiced Mu''azzin, and
    a cat-and-meat analogy. It then tells of a noble''s servant fetching wine from
    a monastery, an austere devotee who condemns wine and breaks the wine-jar, the
    noble''s anger, the devotee''s concealment, neighbors'' intercession, and an interpretive
    statement that wine typifies spiritual pleasures not to be traded for worldly
    pleasures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dwarf disguised as a woman attends a sermon for women, causes a woman to
    cry out, and the preacher mistakes the cry for evidence that his sermon touched
    her heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dwarf says that if the woman's heart had been touched, she would not have
    publicly betrayed her feelings to the congregation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king asks Ayaz to explain his regard for old shoes and rags in order to
    admonish the courtiers, saying that true holiness attracts even infidels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Gueber says he admires and envies Bayazid's faith, but finds the missionary's
    faith insincere and hypocritical.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A harsh-voiced Mu'azzin gives the call to prayer in a heathen country, and
    a girl previously inclined toward Islam loses that wish after hearing him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl's father rewards the Mu'azzin because the harsh call has turned the
    girl away from changing religion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Gueber compares his difficulty understanding Bayazid's spirit and body
    to a man's puzzle about whether a weighed cat accounts for missing meat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A noble living under the Christian dispensation sends a servant to a monastery
    to fetch wine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An austere and testy devotee challenges the servant, condemns wine as a Satanic
    thief of men's wits, and warns against pleasure and drinking.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The devotee breaks the wine-jar with a stone, and the servant reports the
    act to his master.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The noble becomes angry, objects that the devotee has presumed to forbid wine
    when the Gospel has not prohibited it, and goes with a thick stick to chastise
    him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The devotee hides under wool and reflects that admonishing an angry man requires
    a face as hard as a mirror.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: An illustrative chess anecdote says that the Prince of Pirmid, enraged at
