- id: motif:6
  label: comic or practical analogy reveals hidden truth
  taxonomy_refs:
  - wisdom
  basis: The passage uses a disguised-dwarf sermon anecdote, a cat-and-meat puzzle,
    and a chessboard anecdote to explain inward states, body-spirit difficulty, and
    danger in admonishing anger.
  evidence_refs:
