- id: obs:1
  text: Hilal is described as a holy man who served a noble as a groom and is named
    alongside Bilal, Luqman, and Joseph.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hilal's affections are said to be set on things above, and he is represented
