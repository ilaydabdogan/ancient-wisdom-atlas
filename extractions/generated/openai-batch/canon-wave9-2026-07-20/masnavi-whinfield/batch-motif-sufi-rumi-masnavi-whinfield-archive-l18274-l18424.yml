canonical_text:
  quote: ''
  summary: The passage introduces Hilal as a holy servant whose spiritual ascent contrasts
    with ordinary self-lowering. It recounts the Prophet's visit to the sick Hilal,
    then teaches gradual growth through images of moons, ascent, cooking, creation,
    gestation, Adam's formation, and a prop-supported gourd. It next begins a story
    of a sick man, a physician, and a Sufi who restrains anger, followed by reflections
    on the future, death, and an anecdote of Mahmud and a Hindu boy.
  language: English
  quote_policy: summarized
