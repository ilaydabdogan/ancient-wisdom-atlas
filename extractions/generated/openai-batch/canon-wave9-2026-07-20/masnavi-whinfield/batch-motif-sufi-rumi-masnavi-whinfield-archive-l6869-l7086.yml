canonical_text:
  quote: ''
  summary: The passage contains a tale in which a man misses the Prophet's prayers,
    gives a sigh, and exchanges it for another man's prayers; a heavenly voice later
    declares the sigh to be of immense spiritual value. A damaged transitional note
    mentions treachery in religious guise and a mosque built from improper motives.
    The passage then develops the image of wisdom as the believer's lost camel, warning
    against false reports and false doctrines while also saying error can contain
    an element of truth. It closes this section with images of truth hidden among
    nights, a true Faqir among rag-wearers, and the need to distinguish true from
    false.
  language: English
  quote_policy: summarized
