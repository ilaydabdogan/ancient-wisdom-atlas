canonical_text:
  quote: ''
  summary: 'The passage includes an account of a sanctified old man who does not mourn
    his dead sons because he claims to see them with inner sight, followed by teachings
    on sense, reason, spirit, lust, and vision. It then introduces Bahlol’s visit
    to a saintly Darvesh, who explains resignation to divine decree: all events obey
    God, the perfected person’s pleasure conforms to God’s will, and divine love burns
    away self-pity and personal inclinations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man noted for sanctity loses all his sons and shows no grief or regret;
    his wife rebukes him for lack of feeling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man tells his wife that the dead and the living are equally visible
    to the eyes of the heart, and that his sons remain with him, playing around him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man contrasts ordinary people seeing the dead in dreams with his own
    claim to see them clearly while awake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man says he conceals himself from the world and shakes down the leaves
    of outward sense from a tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old man describes a hierarchy in which outward sense is captive to reason,
    reason is captive to spirit, and spirit unlooses reason.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man compares sensations and thoughts to weeds covering pure water,
    and says reason puts the weeds aside so the water can be seen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man says that when fear of God binds lust, God unlooses reason, the
    senses are subdued, mysteries appear, waking visions occur, and the gates of heaven
    open.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage introduces Bahlol’s visit to a saintly Darvesh as an example of
    resignation to the will of God.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Darvesh first says he fares like a man to whom death and life are subservient
    and whom the stars obey.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Darvesh explains that the world obeys God’s command, that no leaf falls
    and no morsel descends without God’s command, and that desire and appetite are
    also subject to God.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Darvesh says that when God’s decree becomes a person’s pleasure, that
    person desires the fulfillment of God’s decrees spontaneously, without hope of
    reward.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Darvesh says that for such a person life and death are all one, and that
    he lives and dies for God rather than for wealth, fear, or grief.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Darvesh says the faithful person acts for God’s sake rather than for paradise
    or from fear of fire, and experiences God’s decrees and deaths as sweets.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Darvesh says that the person burned up self-pity when he lit the lamp
    of love to God, and that this love burned up his inclinations one by one.
  category: speech
  evidence_refs:
  - ev:10
