canonical_text:
  quote: Patience will accomplish thy desire, not haste.
  summary: The passage presents Adam repenting after arrogant or scornful words, followed
    by a prayer for divine guidance and protection from fate, severance, and the dangers
    of worldly reliance. It then reflects on the forbidden fruit, identified in a
    note as wheat, and uses images of eclipsed light, bread as substance or empty
    form, a camel eating green or dry thorn, muddy water, and purification by God
    to counsel patience and dependence on divine grace.
  language: English
