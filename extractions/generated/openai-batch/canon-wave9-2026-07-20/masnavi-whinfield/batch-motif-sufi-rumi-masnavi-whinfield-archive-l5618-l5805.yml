canonical_text:
  quote: The moral is, that so long as the wall of the body intervenes, we cannot
    reach the water of life.
  summary: The passage opens with Sufi cosmological imagery of souls, pregnancy, world-birth,
    and repeated renewals. It then narrates a thirsty man separated from water by
    a high wall who throws bricks into the water so he can hear it and come nearer.
    The passage explains this as a parable of bodily impediment and approach to union
    with Deity, then develops themes of divine light, hidden agency behind visible
    actions, the arrow shot by God, shame that hinders bathing, Zu'l Nun testing his
    friends, and the introduction of Luqman the sage.
  language: English
  quote_policy: quoted
