canonical_text:
  quote: ''
  summary: A speaker explains that moderation is relative to capacity, defends an
    ecstatic spiritual state in which the heart remains awake and sees the two worlds,
    describes transformed perception and ascent beyond thought, allows exceptional
    eating for one with a divine spark, and presents recognition of a kinsman's voice
    as self-authenticating evidence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that the path of the mean is wisdom but that the mean is
    relative, using comparisons of water for a camel and a mouse and loaves for persons
    with different appetites.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The speaker gives further examples of unequal capacity: different appetites
    for loaves, different endurance in prostrations, and different ability to travel
    barefoot to the Kaaba or even to the mosque.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says that his state can resemble a dream, that his eyes sleep
    while his heart is awake, and that the heart has five senses that view the two
    worlds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker addresses a weaker or ordinary listener and says the listener's
    night is his day, the listener's prison is his garden, the listener's mire is
    his rose, and the listener's funeral wailing is his marriage drum.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says that while he seems to be on earth with others in a house,
    he ascends like Saturn to the seventh heaven, and that what companions others
    is only his shadow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says he has transcended thought, is lord of thought rather than
    ruled by it, can send himself to thought and return from it, and is like a bird
    of heaven in relation to thought as a fly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says that whoever has a spark of the light of Omnipotence may
    be told to continue eating, because it is lawful to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker says that a true lover will recognize the truth of his assertions
    when the voice of a kinsman is recognized; the nearness and sweetness of the kinsman's
    voice prove that the speaker is a near friend or kinsman.
  category: speech
  evidence_refs:
  - ev:7
