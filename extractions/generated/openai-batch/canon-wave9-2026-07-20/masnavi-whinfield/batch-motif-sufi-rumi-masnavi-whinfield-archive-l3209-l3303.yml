canonical_text:
  quote: Moses and I are Thy nurslings both alike.
  summary: The passage presents Moses and Pharaoh as both acting within God’s will,
    using paired oppositions such as light and darkness. Pharaoh addresses God at
    midnight, lamenting the burden of his boast and describing himself and Moses as
    God’s nurslings. The passage then turns to a parable in which husband and wife
    signify the rational and animal souls, joined in an earthly house and marked by
    variance between bodily desire and regard for Allah.
  language: English
  quote_policy: quoted
