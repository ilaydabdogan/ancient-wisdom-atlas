canonical_text:
  quote: Form w’ithout soul (life) is only a dream.”
  summary: 'The passage first describes a speaker called the Veiler of sins withholding
    secrets except one test: a person may practice obedience, fasting, prayer, almsgiving,
    and outward devotion while lacking expansion of soul, relish, spirit, or kernel.
    It then begins the story of a gluttonous Sufi in a convent, accused by brethren
    before a Shaikh of excessive speech, eating, and sleep. The Shaikh urges moderation
    and cites Moses being rebuked by Khizr; the Sufi answers that moderation is relative
    and that the spirit-led person follows an inner voice rather than outward law.'
  language: English
  quote_policy: quoted
