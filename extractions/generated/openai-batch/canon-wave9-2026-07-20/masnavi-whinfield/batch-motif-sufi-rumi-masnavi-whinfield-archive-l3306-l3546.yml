canonical_text:
  quote: ''
  summary: The passage gives a didactic exposition on outward forms as signs of inward
    love, the need for divine discernment, and the relation of form and reality. It
    then turns to Adam’s superiority over the angels through wisdom, God’s presence
    in the believer’s heart, the angels’ attachment to earth because of Adam, their
    questioning of God’s plan, and God’s reply that mercy prevails over wrath. The
    passage closes by saying the story is not a vain fable but concerns the spiritual
    state of the hearer and speaker.
  language: English
  quote_policy: summarized
