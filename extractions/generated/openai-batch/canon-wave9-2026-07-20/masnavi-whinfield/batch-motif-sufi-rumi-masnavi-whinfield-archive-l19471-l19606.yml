canonical_text:
  quote: ''
  summary: The passage moves from a reflection on spiritual homogeneity beyond outward
    form to the story of a debtor maintained by the Prefect of Tabriz. After the Prefect
    dies, the debtor repents of trusting a creature instead of God. A charitable man
    seeks help from the citizens, then prays at the Prefect’s tomb; the Prefect appears
    in a dream and reveals a treasure for the debtor. The passage concludes with a
    meditation on God as the true giver, human beings as reflections of divine signs,
    and the annihilation of servant and lord in God.
  language: English
  quote_policy: summarized
