candidate_motifs:
- id: motif:1
  label: Beloved as ultimate object of life and love
  taxonomy_refs:
  - divine_beloved
  basis: The passage says the Beloved is all in all and all that lives, and the lover
    becomes dead or wingless without Love's quickening.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage uses devotional and poetic language; the extraction does not
