- id: motif:3
  label: Love-sickness and divinely guided diagnosis
  taxonomy_refs:
  - wisdom
  basis: The maiden's illness defeats ordinary physicians, while a physician sent
    from heaven diagnoses love as the true cause; the later love passage also calls
    love a distinctive ailment.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: The motif is extracted from the passage's narrative and didactic framing,
    not from an external tale-type classification.
- id: motif:4
  label: Inscrutable divine command involving death
  taxonomy_refs:
  - sacrifice
  basis: The physician poisons the goldsmith by divine command, and the narrator compares
    the command to Abraham being commanded to slay Ishmael and to an angel slaying
    Moses' servant.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The goldsmith episode is a divinely commanded killing rather than a voluntary
    self-sacrifice; the sacrifice taxonomy is supported chiefly by the passage's explicit
    Abraham-Ishmael comparison.
- id: motif:5
  label: Ineffability of love beyond reason and language
  taxonomy_refs:
  - wisdom
  basis: 'The passage states that description fails before love: the pen splits, paper
    tears, reason sticks fast, and only Love can explain love and lovers.'
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a didactic-poetic motif rather than a full narrative sequence.
- id: motif:6
  label: Loss of separate self in relation to the Friend
  taxonomy_refs:
  - annihilation_union
  basis: The lover is described as a dead thing before the Beloved, and Jalal-ud-Din
    says praising the Friend would prove him existent, while existence is error.
  evidence_refs:
  - ev:1
  - ev:12
  confidence: medium
  cautions: The passage implies self-effacement through poetic phrasing; a fuller
    doctrinal reading would require material outside this passage.
- id: motif:7
  label: Master's urgent prompting of ecstatic teaching
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Shams of Tabriz urges Jalal-ud-Din to tell of ecstatic states and invokes
    the immediacy of present time.
  evidence_refs:
