canonical_text:
  quote: ''
  summary: The passage opens with prologue verses on separation, the Beloved, love,
    and the polished mirror reflecting divine light. It then summarizes the story
    of a prince, a sick handmaid, failed physicians, a heavenly physician, the goldsmith
    she loves, and the goldsmith's death by a divinely commanded poisonous draught.
    It continues with verses on love as heart-sickness, the failure of speech and
    reason before love, sun imagery, and Shams of Tabriz urging Jalal-ud-Din to speak
    of ecstatic states while Jalal-ud-Din defers because of separation and loss of
    self-command.
  language: English
  quote_policy: summarized
