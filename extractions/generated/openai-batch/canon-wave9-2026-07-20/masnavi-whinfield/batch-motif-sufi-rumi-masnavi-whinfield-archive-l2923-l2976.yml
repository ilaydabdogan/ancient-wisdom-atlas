  quote: entered into the state of ecstasy and intoxication of union with God
  summary: The passage recounts an aged harper whose former fame fails; he plays to
    God in the burial-ground of Yathrub, receives aid through a divine command to
    Omar, renounces his harp, and is instructed to leave past and future behind in
