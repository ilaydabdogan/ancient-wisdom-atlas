  summary: The passage gives analogies for immediate recognition of truthful or prophetic
    speech, mentions an anecdote of unborn infants leaping, and then narrates a king
    sending a courtier to Hindustan to find a tree whose fruit grants eternal life.
    After a failed search, the courtier asks the sage, who explains that the tree
    is knowledge or essential reality, known by many names and manifestations, and
    urges the seeker to pass beyond names to qualities and essence.
