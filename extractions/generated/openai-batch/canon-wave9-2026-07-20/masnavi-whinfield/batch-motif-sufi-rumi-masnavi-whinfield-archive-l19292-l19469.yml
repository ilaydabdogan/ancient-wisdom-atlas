canonical_text:
  quote: Body is like a string tied to soul’s foot.
  summary: The passage gives didactic counsel on timely chastisement and the danger
    of bad counsel, tells a fable of a mouse and frog joined by a string and destroyed
    when a raven seizes the mouse, explicitly applies that fable to body and soul,
    and then tells of Sultan Mahmud joining robbers in disguise, observing their talents
    and crime, judging them, and granting deliverance to the one who recognizes him.
    The closing moral links true sight with safety, intercession, and Muhammad’s unwavering
    vision of God.
  language: English
  quote_policy: quoted
