canonical_text:
  quote: "“To despair is wrong, / The mercy and grace of God are boundless.”"
  summary: 'The men of Saba argue fatalistically that God has locked and shaped their
    hearts so that preaching cannot change them. The prophets answer by distinguishing
    fixed created qualities from alterable accidental qualities, urging the use of
    remedies, hope in divine mercy, resignation, and obedience. The dialogue turns
    to the function of warning: what seems like an evil omen may be a compassionate
    warning like waking a sleeper threatened by serpents. A closing didactic reflection
    contrasts noble and base responses to kindness or humiliation and states that
    worship is the purpose of human and jinn existence, with hell and humbling described
    as a forced place of worship for the proud.'
  language: English
  quote_policy: quoted
