canonical_text:
  quote: ''
  summary: A didactic passage describes God purging hypocrisy, washing defilement,
    pardoning sins, and raining purifying water. It teaches that acts and words witness
    the hidden mind, like bodily fluid examined by a physician, while a physician
    of the spirit can discern the soul directly. A realized traveller is described
    by overwhelming light and nearness to the divine Ocean. The passage then explains
    evidence, essence, sincerity, contradiction, and the testing of words and deeds,
    before ending with a prayer for spiritual enlightenment and admission to an ecstatic
    holy assembly where saints drink pure wine.
  language: English
  quote_policy: summarized
