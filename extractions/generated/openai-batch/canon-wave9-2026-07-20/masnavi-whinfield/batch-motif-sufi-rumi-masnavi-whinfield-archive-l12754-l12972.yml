canonical_text:
  quote: ''
  summary: The passage begins with an allegory of base coin, pure gold, touchstone,
    alchemy, and judgment-day disclosure. It then narrates Bayazid's prediction of
    Abu-'l-Hasan Khirqani, a summons heard at Bayazid's snowy tomb, Bayazid's ecstatic
    divine utterances, his disciples' attempt to kill him according to his own instruction,
    the reversal of their blows upon themselves, and an explanation of the self-annihilated
    saint as a mirror reflecting others.
