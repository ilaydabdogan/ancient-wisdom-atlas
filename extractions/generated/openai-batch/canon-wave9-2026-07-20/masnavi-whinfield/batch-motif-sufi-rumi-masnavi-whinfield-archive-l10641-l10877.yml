canonical_text:
  quote: ''
  summary: The passage describes non-existence, death, and return to God through images
    of water hidden in darkness and water returning to a stream. It narrates a Bokharian
    before a Prince, using flame and torch imagery for love, then develops analogies
    of reciprocal love through hearts, trees, windows, lamps, thirst and water, paired
    world-parts, heaven and earth as male and female, and bodily elements drawn back
    to their roots.
  language: English
  quote_policy: summarized
