canonical_text:
  quote: ''
  summary: Iblis tells Mo'avia that he still loves God despite his revolt, compares
    his ruin to being checkmated in a game with God, denies being the ultimate cause
    of evil, and describes himself as a mirror. Mo'avia rejects these arguments, prays
    for protection from Iblis's sophistry, and presses him to reveal why he awakened
    him. Iblis finally admits that he woke Mo'avia because, if Mo'avia had missed
    the prayer, his sorrowful sighs would have counted before God for more than ordinary
    prayers.
  language: English
  quote_policy: summarized
