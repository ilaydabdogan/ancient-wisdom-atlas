canonical_text:
  quote: ''
  summary: The passage recounts a Jewish king who persecutes Christians by commanding
    worship of an idol and threatening fire; a Christian babe survives the fire and
    declares it harmless, after which the Christians enter unharmed and the fire consumes
    the king and his followers. The passage then reflects on elements and second causes
    as servants of God, compares praise to vapor rising and returning as rain, and
    begins the Kalila and Damna story of a lion who rules beasts, receives a daily
    victim by agreement, and is finally tricked by a hare into drowning in a well.
    It also includes an anecdote about fleeing death through Solomon's help and an
    analogy to Adam's disobedience.
  language: English
  quote_policy: summarized
