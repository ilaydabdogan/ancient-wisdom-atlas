canonical_text:
  quote: ''
  summary: 'The passage describes a devotee who has trusted the light of nature, grown
    infirm through age and abstinence, and has not yet received reward or vision from
    the Friend. It then resumes the story of Mahmud and Ayaz: Mahmud urges Ayaz to
    reveal secrets, and the narrator compares the wise person to a guest-house welcoming
    all thoughts, like Abraham unknowingly entertaining angels. A following example
    begins with a woman driving away a valued guest by a petulant remark.'
  language: English
  quote_policy: summarized
