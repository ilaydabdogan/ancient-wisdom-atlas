canonical_text:
  quote: ''
  summary: A didactic passage moves from divine purchase and levels of knowledge toward
    certainty and sight, then develops an extended image of potherbs boiling in a
    pot as a figure for trials that transform and improve. The speaker invokes Abrahamic
    sacrifice and resignation, describes death and consumption as elevation into higher
    life, and then answers criticism of the Masnavi by comparing such criticism to
    objections against the Book of God and its scriptural stories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is described as the one who buys, while the addressed weak one is said
    to prefer perishing snow to God’s price because of doubt.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Opinion, knowledge, certainty, sight, and ocular evidence are arranged in
    a sequence in which opinion aims at certainty, knowledge is above opinion but
    below certainty, and certainty leads to sight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he is above opinion and certainty and sees Him face to face
    after eating His sweetmeats.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Personified potherbs boil in a pot, leap in the heat, complain to the housewife,
    and are pushed down with a spoon while she says the boiling is meant to improve
    their savour and make them food mingled with life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The potherbs are said to have drunk fresh water in the garden before being
    reserved for fire, and the passage says mercy precedes vengeance so that the subject
    may withstand trial and be purified above its nature.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says, “I am Abraham,” addresses the other as his son under the
    knife, and speaks of sacrifice, throat-cutting, and a head restored to life by
    being cut off.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The potherbs are told that they boil in trials and sufferings so that neither
    existence nor self may remain, and that being torn from the earthly garden makes
    them food, strength, and thought.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage describes transformations from milk to lion, from rain and sunshine
    to moral qualities, from plants’ death to animals’ life, and from acts, words,
    and faith to an ascent toward heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A goose critic calls the Masnavi childish and only a set of prophetic stories,
    and the passage compares this to infidels saying the Book of God contains old
    tales, listing several scriptural narratives and figures.
  category: speech
  evidence_refs:
  - ev:6
