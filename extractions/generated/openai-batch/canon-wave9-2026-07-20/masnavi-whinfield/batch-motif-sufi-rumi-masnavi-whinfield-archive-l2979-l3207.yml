canonical_text:
  quote: ''
  summary: 'The passage combines a mystical prologue on the hidden Beloved, Omar''s
    rebuke of a harper for attachment to past, future, and contrition, the harper''s
    ecstatic emancipation and regeneration, and the opening summary of the Arab and
    his wife: poverty, persuasion, a journey to the Khalifa with a pot of water, and
    a disproportionate reward of gold. It closes with reflections on women''s influence,
    Adam and Eve, and a water-fire-cauldron analogy.'
  language: English
  quote_policy: summarized
