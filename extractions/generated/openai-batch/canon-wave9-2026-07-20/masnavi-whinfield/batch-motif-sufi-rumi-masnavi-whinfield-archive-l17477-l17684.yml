canonical_text:
  quote: ''
  summary: 'The passage moves through several didactic sections: Noah persists in
    warning a rebellious people; the Masnavi is described through ocean, island, water,
    and sea-of-Unity imagery; a preacher answers a student''s bird riddle to teach
    orientation and aspiration; examples of falcon, owl, Adam, angels, living old
    women, and painted figures teach that inner life, soul, knowledge, and aim outweigh
    outward form; the closing section warns that fear of evil eyes, public censure,
    and social opinion can obstruct faith, with Abu Talib given as an example.'
  language: English
  quote_policy: summarized
