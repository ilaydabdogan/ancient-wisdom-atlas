canonical_text:
  quote: ''
  summary: A deceptive religious teacher beguiles the followers of Isa and is mistaken
    for Christ's vicar, though the narrator calls him Dajjal. The passage then prays
    for divine rescue from snares, describes sleep as nightly release of spirits from
    the body, presents the Knower as awake in this state, and closes with a Laila,
    Khalifa, and Majnun anecdote about loverly perception.
  language: English
  quote_policy: summarized
