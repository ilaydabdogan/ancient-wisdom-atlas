- id: obs:1
  text: The followers of the Prophet Isa are said to be beguiled by the fraud of a
    demon-souled figure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceptive figure teaches outward devotion while minimizing the importance
    of hidden sins.
  category: speech
  evidence_refs:
  - ev:1
