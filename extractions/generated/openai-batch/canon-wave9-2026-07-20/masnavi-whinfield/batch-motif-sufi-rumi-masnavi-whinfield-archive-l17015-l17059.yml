canonical_text:
  quote: ''
  summary: The passage opens with a fragment about an unnamed woman who repents discourtesy
    by putting on mourning and turning her house into an inn. It then teaches that
    grief and joy both lodge in the heart, urges patient endurance like Joseph and
    Job, and invokes Solomon’s gratitude to the Lord. Mahmud praises Ayaz as a true
    man who controls lust and anger. A cowardly Sufi anecdote introduces the contrast
    between lesser warfare against infidels and greater warfare against one’s own
    lusts and passions. The saint Tyazi, formerly a warrior, renounces the world and
    sits in his cell; when his carnal passion urges him to join an army going out
    to fight, he rebukes the passion as foul, faithless, tricky, and disobedient,
    threatening it with discipline. The passion then cries and begins to complain.
  language: English
  quote_policy: summarized
