canonical_text:
  quote: ''
  summary: A poor Faqir prays for sustenance without labor and receives dream-instructions
    leading to a writing about a hidden treasure. A king confiscates the directions
    and fails to find it. The Faqir also fails until a heavenly voice explains that
    the arrow should be shot gently because the treasure is very near. The passage
    then draws teachings about overlooked spiritual nearness, alternating hope and
    fear, divine abasement and exaltation, unity overcoming plurality, moral oppositions
    in sacred history, and divine judgment through elements and ordinary things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor Faqir prays to God that he may be fed without having to work for his
    food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A divine voice comes to the Faqir in sleep and directs him to a scribe's house
    to take a writing found there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The writing gives instructions to go outside the city to a dome over a martyr's
    tomb, face Mecca, place an arrow in a bow, and dig where the arrow falls.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king hears of the writing, takes it from the Faqir, shoots many arrows,
    digs in many directions, fails to find the treasure, and returns the writing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Faqir also fails until he asks for divine assistance; a heavenly voice
    tells him not to draw the bow strongly but to shoot gently because the treasure
    is close to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that people overlook spiritual treasures close to them
    and that prophets have no honor in their own countries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Faqir alternates between distrust of prayer because of delay and renewed
    hope; he hears from God the word “Ascend.”
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: God is described as both Abaser and Exalter, and the world is described through
    alternating pairs such as barren and verdant seasons, day and night, health and
    sickness, and hope and fear.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Unity is represented by pure wine and a saltpan, while plurality is represented
