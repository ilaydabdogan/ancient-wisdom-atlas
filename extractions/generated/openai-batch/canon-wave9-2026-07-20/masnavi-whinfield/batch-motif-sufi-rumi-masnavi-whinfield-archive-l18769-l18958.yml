- id: motif:3
  label: Alternating hope and fear as a world-pattern
  taxonomy_refs:
  - duality
  - seasonal_cycle
  basis: The passage describes the Faqir moving between distrust and hope, then generalizes
    to divine abasement and exaltation and to alternating seasons, day and night,
    health and sickness, and hope and fear.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Seasonal-cycle reference is limited to the stated half-barren and half-verdant
    year.
- id: motif:4
  label: Unity absorbing plurality
  taxonomy_refs:
  - annihilation_union
  basis: The passage contrasts pure wine of Unity with many-colored wine of plurality
