- id: motif:2
  label: Divine instruction through dream and heavenly voice
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: A divine voice in sleep initiates the Faqir's quest, and a heavenly voice
    later corrects his method after he implores divine assistance.
  evidence_refs:
