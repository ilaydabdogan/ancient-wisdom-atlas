canonical_text:
  quote: ''
  summary: The passage recounts Luqman accepting a bitter watermelon from his master
    without complaint, then gives a didactic poem on love transforming bitterness,
    pain, fire, grief, and opposition. It teaches that good and ill move into one
    another, that hope and fear are like two wings, and invokes Abraham’s ascent and
    vision beyond setting lights. A prose prologue mentions Bilqis, the Hoopoe, Solomon,
    outward sense versus inner reason, a blind-struck philosopher, and then introduces
    Moses and the shepherd. The shepherd prays to serve God with bodily acts such
    as cleaning shoes and fetching milk; Moses rebukes him, but a heavenly voice rebukes
    Moses, saying that sincere devotion and the heart matter more than outward words
    or forms.
  language: English
  quote_policy: summarized
