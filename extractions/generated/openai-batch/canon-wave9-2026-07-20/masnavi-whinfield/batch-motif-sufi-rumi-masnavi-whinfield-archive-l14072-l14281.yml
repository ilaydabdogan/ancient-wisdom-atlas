canonical_text:
  quote: ''
  summary: 'The passage moves through several didactic episodes: an Israelite admonishes
    another to renounce egotism; a pear-tree adultery story illustrates distorted
    perception; a poem describes humanity passing from inorganic existence through
    plant, animal, and human states; the world is compared to sleep before resurrection
    and judgment; Zul Qarnain encounters the world-encircling Mount Qaf, which explains
    earthquakes through its hidden veins; and ants observing writing debate whether
    the pen, finger, or arm is the true agent.'
  language: English
