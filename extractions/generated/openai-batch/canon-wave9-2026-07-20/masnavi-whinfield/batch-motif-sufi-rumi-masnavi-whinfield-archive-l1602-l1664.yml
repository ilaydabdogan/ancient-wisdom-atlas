  quote: ''
  summary: 'Under the heading of the Jewish King, an unnamed male actor composes separate
    scrolls for different addressees. The scrolls contain mutually contradictory theological
    rules: fasting versus charity, faith versus works, human weakness versus human
    power from God, and whether to preserve or quench an earthy torch associated with
    light, union, and a Laila/Majnun comparison.'
  language: English
  quote_policy: summarized
