canonical_text:
  quote: ''
  summary: The passage gives didactic examples about patience, bitter experience,
    divine agency, and human responsibility. It summarizes anecdotes of a thief extinguishing
    a household light, Mahmud testing Ayaz before complaining courtiers, and a fowler
    disguising himself to trap a bird with grain said to belong to an orphan. After
    being trapped, the bird cries to God as Beloved, asking for mercy, grace, and
    resignation.
  language: English
  quote_policy: summarized
