  quote: ''
  summary: The passage presents a moral exemplum about a Sufi, his faithless wife,
    and her disguised paramour, followed by teachings that evil is relative, that
    what leads one to the beloved can become agreeable, that one should see God through
    the eyes of those who love Him, and that the divine names Seeing, Hearing, and
    Knowing correspond to real divine attributes that deter sin.
  language: English
  quote_policy: summarized
