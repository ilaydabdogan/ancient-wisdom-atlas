canonical_text:
  quote: ''
  summary: The passage recounts an ascetic Shaikh Muhammad of Ghazni, who fasts with
    minimal food, lives in the desert, receives divine guidance about charity, is
    miraculously provided for, and gains spiritual discernment through a heart purified
    of all but love of God. It then summarizes reflections on fasting, abstinence,
    trust in divine sustenance, and a debate between a Musulman and a Magian over
    divine will, fatalism, and human responsibility. Several illustrative anecdotes
    and poetic images follow, including a thief punished with his own fatalist logic,
    faithful slaves who keep their master's treasure secret under torture, images
    of hidden causes behind visible motion, and a reflection that love of God silences
    rational discourse to guard its secret treasure.
  language: English
  quote_policy: summarized
