canonical_text:
  quote: ''
  summary: 'The passage argues that spiritual struggle requires an opposing desire:
    lust makes abstinence, chastity, and obedience meaningful, just as hostility makes
    holy war possible. It interprets divine commands such as “Expend,” “Abstain,”
    and “Eat ... Exceed not” as implying the conditions needed for obedience and temperance.
    It concludes that enduring abstinence and fulfilling the terms leads to a soul-enchanting
    reward.'
  language: English
