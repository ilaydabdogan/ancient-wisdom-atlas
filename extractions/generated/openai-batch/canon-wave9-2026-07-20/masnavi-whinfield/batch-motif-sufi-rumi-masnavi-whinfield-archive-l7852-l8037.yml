  quote: ''
  summary: The passage contrasts foul, deceitful speech with sincere invocation. It
    gives examples involving Bilal’s imperfect but accepted call to prayer, God’s
    instruction to Moses about praying with an unsinning or purified mouth, an unnamed
    devotee whose repeated cry of “O Allah” is revealed through Khizr to be already
    answered by God, and Pharaoh’s worldly ease as a deprivation because it prevents
    prayer born of sorrow.
  language: English
