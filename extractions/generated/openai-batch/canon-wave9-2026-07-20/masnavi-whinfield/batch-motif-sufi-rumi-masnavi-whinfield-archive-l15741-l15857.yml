canonical_text:
  quote: ''
  summary: 'The passage first describes a judgment scene in which angels drive a prisoner,
    the prisoner confesses guilt and relies on divine mercy, and God grants pardon.
    It then introduces the story of Mahmud and Ayaz: envious courtiers accuse Ayaz
    of hiding stolen treasure or forbidden drink in a locked chamber, but Ayaz has
    only old shoes and a ragged dress there to remember his low origin and avoid pride.
    The king orders the chamber searched to expose the accusers; the courtiers find
    no treasure and return ashamed. The passage includes moral commentary on pride,
    humility, Iblis and Adam, evildoers suspecting saints, and lover and beloved being
    one soul.'
  language: English
  quote_policy: summarized
