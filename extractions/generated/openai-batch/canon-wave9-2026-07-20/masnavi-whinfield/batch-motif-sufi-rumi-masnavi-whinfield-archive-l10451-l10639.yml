canonical_text:
  quote: ''
  summary: 'A repentant servant of the Prince of Bokhara returns after years of exile
    despite warnings of death, because love for his lord outweighs prudence. He falls
    at the lord''s feet and is pardoned. The passage then gives didactic reflections
    and lyric examples: the beloved makes any place delightful; the speaker compares
    himself to a water-drawer drawn to deadly water; he likens himself to a sacrificial
    cow; and he describes repeated dying and rising through matter, plant, animal,
    human, angelic, and beyond-human states.'
  language: English
  quote_policy: summarized
