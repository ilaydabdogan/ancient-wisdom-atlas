canonical_text:
  quote: ''
  summary: 'The passage closes a Canaan episode by saying advice did not affect him
    and a violent wave overwhelmed him. It then presents an inquirer asking how to
    reconcile two sayings: acquiescence in infidelity is infidelity, while acquiescence
    in God''s ordinance is required of believers. The speaker replies by distinguishing
    what is ordained from the ordinance itself, uses a painter-and-picture analogy,
    and says extended argument would distract from the mystery of divine love. A closing
    anecdote tells of a half-grey-haired man who asks a barber to pluck out his white
    hairs before marriage; the barber cuts off the beard and tells him to separate
    the hairs himself.'
  language: English
  quote_policy: summarized
