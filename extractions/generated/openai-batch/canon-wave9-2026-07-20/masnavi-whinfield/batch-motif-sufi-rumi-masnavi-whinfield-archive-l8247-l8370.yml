canonical_text:
  quote: ''
  summary: 'The passage contrasts genuine God-intoxication and saintly nearness with
    fraudulent spiritual display. It then summarizes exempla of false pretension:
    a jackal dyed in many colors claims to be a peacock but fails behavioral tests,
    and a hungry proud man greases his beard with fat to feign a rich meal until a
    cat removes the evidence. The poet links such pretension to Pharaoh''s claim to
    divinity, cites a Qur''anic sign of false claimants in strange speech, recalls
    Harut and Marut being tested by temptation, and introduces the Moses and Pharaoh
    story.'
  language: English
  quote_policy: summarized
