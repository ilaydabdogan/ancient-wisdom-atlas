  quote: ''
  summary: The passage contrasts Pharaoh’s failed attempt to prevent Moses’ birth
    with a moral allegory about lust as an internal enemy. It summarizes an anecdote
    in which lust is likened to an abandoned mother and states that prophets and saints
    test human dispositions. It then recounts the story of a king who tests two slaves
    by their speech, followed by a catalogue of prophetic and saintly figures who
    receive a divine light and manifest knowledge, endurance, miracles, sacrifice,
    ascent, or discernment.
