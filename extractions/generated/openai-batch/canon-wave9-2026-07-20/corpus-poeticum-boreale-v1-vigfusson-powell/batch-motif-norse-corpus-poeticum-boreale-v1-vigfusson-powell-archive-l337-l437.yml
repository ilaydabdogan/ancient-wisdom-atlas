canonical_text:
  quote: ''
  summary: 'The passage discusses Magnus Olafsson’s rearrangement of Snorri’s Edda
    and then gives an extended biographical account of Bishop Bryniolf of Scalholt:
    his preservation of Edda manuscripts, his appearance and religious attitudes,
    his interest in prognostication and nativities, an anecdote of his encounter with
    boys at the Althing, his monogram and maternal naming preference, and the death
    of his son Halldor, whose predeceasing him is linked to later scattering and destruction
    of collected books and manuscripts.'
  language: English
  quote_policy: summarized
