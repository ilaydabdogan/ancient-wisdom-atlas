canonical_text:
  quote: ''
  summary: 'The passage is an editorial introduction arguing that the Prose Edda and
    related Eddic materials are accretive and textually altered works rather than
    mechanically preserved single-author books. It gives examples where Gylfaginning
    prose accounts and verse citations diverge: the Doom of the Gods and Last Battle,
    Creation, the Golden Age, maggot-like beings in the flesh of Ymir, and Sigyn protecting
    the bound Loki from dripping poison that causes earthquakes when it reaches him.'
  language: English
  quote_policy: summarized
