  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The giant says the maids deliver those who worship them in an altar-hallowed
    place every summer, even when great peril overtakes people.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The giant says that no man may sleep in Menglad’s arms except Swipday, and
    that the sunbright bride was destined to him as wife.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Swipday commands the door and gates to be opened, announces that Swipday is
    present, and asks whether Menglad will have his love.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The warder announces the newcomer to Menglad, says the hounds welcome him,
