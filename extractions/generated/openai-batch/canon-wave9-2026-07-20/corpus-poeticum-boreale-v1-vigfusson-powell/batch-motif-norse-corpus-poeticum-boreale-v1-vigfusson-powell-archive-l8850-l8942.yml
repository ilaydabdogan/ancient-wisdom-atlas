canonical_text:
  quote: ''
  summary: A mother sends her child onward with protective charms and remembered words.
    In Giantland, Swipday reaches Menglad’s bower and is stopped by the Giant Warder
    Manywise. Through a sequence of questions, Swipday learns about Menglad’s rule,
    the Hill of Healing, the healing maids at Menglad’s knees, and the fact that Menglad
    is destined for Swipday alone. Swipday identifies himself, the gates open, the
    hounds welcome him, and Menglad responds from within.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother addresses her child, says she has chanted charms while standing on
    an earthfast stone, and tells the child to carry and remember her words for luck
    through life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second scene is set in Giantland before Menglad’s bower, where Swipday
    encounters a giant warder.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Swipday sees a being in front of the fore-court near a hot flame and asks
    what it is.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The giant asks what Swipday seeks, tells him to go back by the wet ways, and
    says he has no abiding-place there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The warder names himself Manywise, says he has a wise mind, denies Swipday
    entry within the walls, and says Swipday will wander like a wolf to the woods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Swipday says the courts and golden halls gleam and that he would live there
    forever.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Swipday gives a cold-themed genealogy: his name is Wind-cold, his father
    is Spring-cold, and his father’s father is Hardcold.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Swipday asks who rules the land and gleesome halls; the giant answers that
    Menglad rules there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Swipday asks about the rock on which the praised maid sits; the giant calls
    it the Hill of Healing and says women who climb it while sick become whole.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
