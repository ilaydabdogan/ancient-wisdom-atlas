  quote: ''
  summary: The passage contains editorial notes on the transmission and attribution
    of Hornklofi's Raven-Song, followed by a translated excerpt in which a wise Walkyrie
    questions a raven about Harold Fair-hair, his sea-warrior habits, his rewards
    to warriors and poets, his berserks or wolfcoats, entertainers at court, and the
    beginning of an inquiry about the battle at Hafrsfirth.
  language: English
