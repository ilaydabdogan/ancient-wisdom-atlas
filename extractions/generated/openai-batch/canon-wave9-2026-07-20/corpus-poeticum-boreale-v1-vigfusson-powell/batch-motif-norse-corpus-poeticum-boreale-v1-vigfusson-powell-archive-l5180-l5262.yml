  summary: The passage discusses principles and difficulties of translating Old Northern
    poems and sagas into English. It praises some earlier saga translations, comments
    on uneven saga quality, recommends linguistic and literary knowledge for translators,
    explains the translator’s preference for literal intelligibility over smoother
    poetic rendering, notes omissions of unclear phrases, defines the scope of the
    translation, and states that the work was done without help from prior versions.
  language: English
