canonical_text:
  quote: ''
  summary: 'A first-person speaker recounts the approach of death: worldly pleasure,
    riches, pride, and bodily desire deceive mortals; the speaker struggles against
    death, is bound by the cords of Hell, hears Hell''s messengers and gates, repeatedly
    sees the Sun for the last time, and passes through bodily terror, cold, water,
    burial imagery, moral reflection, a rising star of Hope, a nine-day stay in the
    seat of the Norns, and a mounted passage through the Seven blessed Heavens while
    seeking a straight path.'
  language: English
  quote_policy: summarized
