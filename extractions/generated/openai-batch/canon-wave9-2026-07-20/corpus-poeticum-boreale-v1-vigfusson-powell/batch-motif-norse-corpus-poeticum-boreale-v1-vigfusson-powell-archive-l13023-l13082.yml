canonical_text:
  quote: ''
  summary: 'The passage gives genealogical and eschatological material: Balder is
    dead and avenged by Wali; Frey marries Gerd of giant-race; Loki produces several
    extraordinary or monstrous offspring; magical classes and giants are traced to
    named ancestors; Heimdall is born of nine giantmaidens and endowed with Earth’s
    strength; the Last Doom is described through raging waters, falling firmament,
    snow, and winds; Thor is named as an exceptionally strong figure; and an unnamed
    mightier being is said to come before the point beyond which none can see, when
    Woden meets the Wolf.'
  language: English
  quote_policy: summarized
