canonical_text:
  quote: ''
  summary: 'The passage discusses reported motifs and comparative interpretations
    in Wolospa/Voluspa and Old Scandinavian mythology: a first murder involving brother
    killing brother and a mother mourning in water; Balder''s death as the first crime
    rather than an immediate prelude to Doomsday; two contrasted conceptions of Loki,
    one as a chained monstrous being beneath a mountain and another as a mocking cunning
    figure in Walhall; and several archaic mythic figures such as Hel, beasts that
    swallow the sun and moon, the Earth-serpent, and criminal ghosts who suffer after
    death.'
  language: English
  quote_policy: summarized
