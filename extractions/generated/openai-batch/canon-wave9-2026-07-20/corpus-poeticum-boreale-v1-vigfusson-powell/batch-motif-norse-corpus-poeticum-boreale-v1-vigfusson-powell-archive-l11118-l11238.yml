canonical_text:
  quote: Laughing Weyland rose into the air
  summary: Cynwig urges Weyland's hamstringing and confinement; Weyland laments Nidad's
    possession of his sword and Bodwild's wearing of his bride's ring, deceives and
    kills Nidad's sons, turns their body parts into precious objects, gives Bodwild
    a beer-cup after which she sleeps, makes wings, escapes by flight, and reveals
    his vengeance and Bodwild's pregnancy to Nidad.
  language: English
  quote_policy: quoted
literal_observations:
