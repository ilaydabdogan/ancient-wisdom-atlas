canonical_text:
  quote: ''
  summary: The passage collects accounts of dead persons and ancestors dwelling in
    howes, barrows, hills, and stones. It describes King Anlaf’s burial in a howe
    and later worship for good seasons; Thorwolf of Most’s reverence for Holy-fell
    and belief that his kindred would die into the hill; a shepherd’s vision of Holy-fell
    opening with fires and feasting sounds as drowned Thorstan is welcomed among the
    dead; reverence and sacrifice at Cross-hills because people believed they died
    into the hills; Seal-Thori’s kindred dying into Thori’s hill; and a family-spirit
    in a stone overcome when Bishop Frederick sings over it and the stone bursts.
  language: English
  quote_policy: summarized
