  summary: The passage argues against very early dating of the Eddic poems, citing
    eighth-century linguistic change and narrowing their likely date to 800–1100.
    It discusses Scandinavian westward migrations, the relation of Norway, the Western
    Isles, Iceland, the Faroes, Greenland, and the American coast, and compares the
    poems’ social setting, vocabulary, hall-life, and tapestry imagery with Icelandic
    sagas and English ballads.
  language: English
