canonical_text:
  quote: ''
  summary: Sigmund and Sinfitela enter a wood, find two spell-bound kings’ sons with
    wolf-skins, put on the skins, and are unable to remove them. Under the werewolf
    spell they make a combat-aid covenant using wolf howls as signals. After separate
    fights, Sigmund bites Sinfitela in the throat. A healing leaf, first observed
    in use by polecats and then brought by a raven, restores Sinfitela. The two wait
    in a cave until they can leave the skins, then burn the wolf-skins with fire so
    they will harm no one else.
  language: English
  quote_policy: summarized
