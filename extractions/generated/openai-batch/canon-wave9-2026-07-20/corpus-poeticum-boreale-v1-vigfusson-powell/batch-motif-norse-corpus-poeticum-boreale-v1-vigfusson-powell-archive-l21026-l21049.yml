canonical_text:
  quote: ''
  summary: 'The passage is an editorial discussion of old northern calendrical reckoning:
    a five-day unit called “fimt,” possible division of months into pentads, Ari’s
    report of a year of twelve thirty-day months, the problem of a 360-day year, and
    two forms of intercalation, including four “Eke-nights” after Midsummer. A footnote
    comments on later Icelandic day-name terminology and textual usage.'
