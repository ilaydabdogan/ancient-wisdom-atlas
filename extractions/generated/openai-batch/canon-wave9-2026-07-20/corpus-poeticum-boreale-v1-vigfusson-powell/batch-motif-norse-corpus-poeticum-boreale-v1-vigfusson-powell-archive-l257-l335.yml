canonical_text:
  quote: ''
  summary: The passage gives biographical and editorial notes on Arngrim, his family,
    manuscript learning, and descendants. It includes a popular story in which Arngrim's
    son Gudbrand and Gudbrand's wife die in a house fire and a ditty is said to be
    heard from the fire. It also recounts an anecdote about Hilda, who as a humble
    young companion meets Hallgrim Petersson during a dark journey; he blesses her
    and predicts better things, later said to be fulfilled through her marriage and
    her son Paul Widalin's advancement.
  language: English
  quote_policy: summarized
