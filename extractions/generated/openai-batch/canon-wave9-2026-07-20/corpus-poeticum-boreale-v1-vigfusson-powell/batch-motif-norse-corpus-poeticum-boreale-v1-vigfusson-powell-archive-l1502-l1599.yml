  summary: Scholarly introduction describing manuscript witnesses, interpolations,
    scribal habits, preserved poems, textual parallels, and a short fifteenth-century
    blessing verse. The passage discusses W, Codex Regius, a sister manuscript, Codex
    Upsalensis, and Herwor’s Saga as witnesses for Eddic and heroic poetic material.
  language: English
