literal_observations:
- id: obs:1
  text: A fifteenth-century verse offers wishes involving wealth, power, life, health,
    luck, fortune, and Christ’s aid in a heavenly dwelling; the editors identify it
    as a father’s good wishes to a son, but mark the son identification with uncertainty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Paper leaves were inserted into W after it had been bound; these leaves copied
    interpolations found in Codex Regius but not originally in W, and the editors
    call them valueless and confusing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The value of W is attributed to a careful scribe who left blanks corresponding
    to blanks or difficulties in the archetype, and to W’s preservation of the Lay
    of Righ and Thorodd’s Essay.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Codex Regius of Snorri’s Edda is described as a small, blackened octavo bought
    by Bishop Bryniolf in 1640 and containing Gylfa-ginning, Scaldscaparmal, Thulor,
    Hattatal, and later items on blank pages.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer of Codex Regius is contrasted unfavorably with the scribe of W
    because he ran over blanks or defects in his source; modern editions are said
    to have filled a missing half-line.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The interpolation in Codex Regius is said to contain Sigfred’s Saga, part
    of Bragi’s Shield-Song, and the Mill-Song, and is described as highly valuable.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sister manuscript in the Arna-Magnæan Collection begins in the middle of
    Scaldscaparmal within the Sigfred interpolation and continues to the end of Thulor;
    a later blank page was filled with a Sturlung genealogy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Codex Upsalensis is said to bear a relationship to W and to contain several
    Eddic and grammatical materials, including tables referred to in W but not copied
    there.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Herwor’s Saga is preserved in two vellums and contains the Waking of Angentheow
    and the Death Song of Hialmar.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Fragments of the Hun cycle are included in Herwor’s Saga; one is paralleled
    in a prose paraphrase associated with Widukind of Corbey, and another is put into
    Latin elegiacs by Saxo.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Heidrek’s Riddles are named as a further contribution, and the compiler of
