  summary: An editorial note identifies the passage as a fragment of sayings associated
    in the manuscript with the Havamal Collection. The sayings give practical maxims
    about when to praise or trust things, list objects, animals, and situations not
    to rely on, compare false love to dangerous or futile undertakings, and conclude
    with remedies or counteragents for ale, sicknesses, witchcraft, curses, charms,
    and floods.
