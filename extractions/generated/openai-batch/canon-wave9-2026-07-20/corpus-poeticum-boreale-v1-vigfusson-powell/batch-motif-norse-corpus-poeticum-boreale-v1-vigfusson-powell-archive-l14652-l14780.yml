canonical_text:
  quote: ''
  summary: The passage closes Sona-Torrek with a bereaved first-person speaker remembering
    Arinbiorn, lamenting the irreplaceable loss of sons, blaming and yet acknowledging
    Woden, receiving poetry as recompense, and accepting approaching death. It then
    introduces and begins Darradar-liod, a lay connected with the battle of Clontarf,
    in which Valkyries or weird sisters weave a bloody web of war with human remains
    and weapons, foretell battle-deaths, protect a young king, and ride into battle.
  language: English
  quote_policy: summarized
