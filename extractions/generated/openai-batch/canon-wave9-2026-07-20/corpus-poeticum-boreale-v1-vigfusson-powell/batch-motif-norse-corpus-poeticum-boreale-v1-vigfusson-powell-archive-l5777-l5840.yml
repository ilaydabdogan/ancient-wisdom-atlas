canonical_text:
  quote: ''
  summary: An editorial list of final readings for several Norse poems and riddles.
    The entries include brief fragments mentioning women and maidens, burning and
    sinking, withy-lopping, waking from sleep, proverbial statements about cowardice
    and wisdom, Woden whispering to Balder his son, Woden’s pledge glossed as the
    Sun goddess or Woden’s Eye, a protective wish against sleet, frost, and night-riding
    witches, greedy ravens, blended blood in a footprint, and speech from the heart
    and breast.
  language: English with some Old Norse fragments
  quote_policy: summarized
