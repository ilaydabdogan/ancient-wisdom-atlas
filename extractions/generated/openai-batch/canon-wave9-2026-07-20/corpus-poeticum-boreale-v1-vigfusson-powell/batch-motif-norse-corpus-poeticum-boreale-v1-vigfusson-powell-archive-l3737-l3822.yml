  text: The passage says an editor needs knowledge of the poems and of manuscript
    phenomena, comparing line with line and epithet with epithet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a clause that is grammatically lame, senseless, and
    unfitted to context marks a corrupt text in the poems and Icelandic manuscripts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says a correction is keyed by outward resemblance in sound or
    appearance, while the corrected sense should differ from the false sense.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage distinguishes errors of the ear, attributed to minstrel, listener,
