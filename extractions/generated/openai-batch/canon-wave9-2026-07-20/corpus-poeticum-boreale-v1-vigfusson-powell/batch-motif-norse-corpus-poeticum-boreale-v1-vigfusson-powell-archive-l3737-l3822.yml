  summary: The passage is a scholarly discussion of textual emendation in Old Norse
    and Icelandic manuscripts. It describes how editors diagnose corrupt readings,
    how errors may arise through resemblance in sound or appearance, and gives examples
    from Old Gudrun Lay, Volsunga Saga, Hyndlu-liod, Hus-drapa, and Egil’s Sons’ Wreck.
  language: English
  quote_policy: summarized
