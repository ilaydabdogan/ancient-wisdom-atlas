canonical_text:
  quote: ''
  summary: 'The passage gives a sequence of Ynglinga-tal royal death notices: aged
    Aun becomes helpless like a child; several kings or princes are killed by horns,
    Danes, a fall from a horse, burning halls, sacrifice, stones, fire, Hell, treachery,
    and disease. It then introduces Haleygia-tal, explaining that Eywind used Ynglinga-tal
    as a model to provide Earl Hakon with a divine genealogy from a son of Woden.'
  language: English
  quote_policy: summarized
