  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eadgils is fated for destruction by the witch-wife Hell, falls from his horse,
    and dies at Upsala with his brain-blood mingled with dust.
  category: sequence
  evidence_refs:
  - ev:4
