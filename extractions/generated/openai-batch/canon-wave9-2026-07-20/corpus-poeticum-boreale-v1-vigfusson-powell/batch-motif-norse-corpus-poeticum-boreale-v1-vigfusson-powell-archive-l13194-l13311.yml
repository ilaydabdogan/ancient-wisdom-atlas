canonical_text:
  quote: ''
  summary: The passage recounts the birth, naming, growth, marriage, and descendants
    of Thrall, followed by Righ's visit to Gaffer and Gammer, his meal and three-night
    stay between them, the birth and naming of Carle, Carle's work, marriage, and
    descendants, and then Righ's visit to the more richly furnished hall of Father
    and Mother, where the same middle-seat and middle-bed pattern begins again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After nine months, Edda bears a male child; the child is sprinkled with water
    and called Thrall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thrall is described with swarthy skin, wrinkled hands, bent knuckles, thick
    fingers, an ugly face, a broad back, and long heels, and he begins laboring with
    bast, loads, and faggots.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Theow comes to the house, sits by Thrall, shares a bed with him, and the couple
    have children whose descendants are identified as the generations of thralls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Righ goes on his way, enters a hall where a fire is on the floor, and finds
    Gaffer and Gammer working with household implements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Gaffer and Gammer's house, Righ sits in the middle seat, is served food
    and broth, lies in the middle of the bed with the householders on either side,
    and stays three nights.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After nine months, Gammer bears a male child; the child is sprinkled with
    water, called Carle, swaddled in linen, and described as red and ruddy with rolling
    eyes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Carle grows and works at breaking oxen, building plows, timbering houses,
    smithying barns, making carts, and driving the plow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wife is brought for Carle; the couple keep house, farm land, have children,
    and their descendants are identified as the generations of churls.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Righ next enters a south-facing hall with a ring on the lintel, where Father
    and Mother sit together.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Father and Mother's hall, the master works with bowstrings, elm, and arrows,
    while the lady tends linen and wears fine clothing; the meal includes white wheat
