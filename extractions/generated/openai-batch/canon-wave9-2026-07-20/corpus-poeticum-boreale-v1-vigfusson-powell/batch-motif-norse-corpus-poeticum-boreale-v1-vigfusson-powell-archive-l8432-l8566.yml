canonical_text:
  quote: ''
  summary: 'The passage gives the end of an Allwise/Alviss dialogue: Allwise prepares
    for a bride, meets W. outside Walhall, is challenged to give names for natural
    and cosmic things in every world, and is delayed until daylight, when the dwarf
    is turned to stone. It then introduces King Heidrek’s riddles, describing Woden
    disguised as a blind wayfarer visiting King Heidrek at Yule-tide and posing questions
    that culminate in a fatal unanswered one.'
  language: English
  quote_policy: summarized
