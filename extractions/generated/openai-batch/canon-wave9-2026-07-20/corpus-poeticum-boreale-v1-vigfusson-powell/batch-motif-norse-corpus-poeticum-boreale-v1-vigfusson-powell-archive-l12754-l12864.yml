canonical_text:
  quote: ''
  summary: Thor and the giant Hymi fish at sea; Thor baits a hook with an ox head,
    draws up the world-girdling serpent, and strikes it with his hammer before it
    sinks. After returning, Hymi tests Thor with tasks involving carrying a ship,
    breaking a cup, and removing an ale-cauldron. Thor succeeds, fights a pursuing
    many-headed host, later has a goat lamed through Loki’s doing, and brings Hymi’s
    cauldron to the gods for ale-drinking.
  language: English
  quote_policy: summarized
