  quote: ''
  summary: 'The passage describes early Norse court poetry as royal praise and verse
    chronicle: kings seek lasting fame, poets arrange reigns into chronological encomia,
    recite them publicly, receive gifts, teach the poems for memorization, and thereby
    preserve historical facts later used by historians. It also mentions the Raven
    Song, where a Valkyrie questions a raven about Harold Fairhair.'
  language: English
  quote_policy: summarized
