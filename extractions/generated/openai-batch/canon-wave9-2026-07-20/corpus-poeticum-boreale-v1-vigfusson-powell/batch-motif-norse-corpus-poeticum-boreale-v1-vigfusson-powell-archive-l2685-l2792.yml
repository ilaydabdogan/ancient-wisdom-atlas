canonical_text:
  quote: ''
  summary: An editorial introduction discusses the reconstruction and dating of several
    Norse poems, especially Hyndlo-liod as a combination of a genealogical lay and
    an eschatological Sibyl poem. It reports motifs including Wodin summoning a Wolwa,
    Heimdal as royal progenitor and bridge-warder, Heimdal and Loki fighting over
    the Brising necklace, Christian visionary materials, a romantic mutual-death combat,
    an earth-serpent term, and a trick by which a dwarf is outwitted.
  language: English
  quote_policy: summarized
