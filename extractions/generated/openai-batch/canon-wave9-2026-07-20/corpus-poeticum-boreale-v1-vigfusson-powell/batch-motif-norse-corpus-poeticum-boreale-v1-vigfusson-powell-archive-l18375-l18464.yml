canonical_text:
  quote: Sterne senem, jugulumque meum pete vindice ferro
  summary: A Latin passage in which a speaker first disparages another figure as suited
    to food, hearth, and kitchen rather than war, then recounts numerous martial exploits,
    including slayings, punishments, battles, and plunder. Near the end the speaker
    addresses Hathere, says he killed Hathere's father Lenno, and asks Hathere to
    repay him by killing the willing old man with an avenging blade. The passage closes
    with reflections that fate may be anticipated and that an old tree should be cut
    down when it can no longer stand.
  language: Latin
  quote_policy: quoted
