canonical_text:
  quote: ''
  summary: The passage presents exchanges between Sigfred and the dying Fafni concerning
    death, the Norns, a future divine battle, the hoard, and Regin’s betrayal. Regin
    then praises Sigfred, asks him to roast Fafni’s heart, and disputes credit for
    the victory. Three talking pies warn Sigfred that Regin has plotted his death;
    after tasting the heart, Sigfred understands them. Sigrdrifa awakens from enchanted
    sleep, invokes divine powers, and teaches victory and love runes.
  language: English
  quote_policy: summarized
