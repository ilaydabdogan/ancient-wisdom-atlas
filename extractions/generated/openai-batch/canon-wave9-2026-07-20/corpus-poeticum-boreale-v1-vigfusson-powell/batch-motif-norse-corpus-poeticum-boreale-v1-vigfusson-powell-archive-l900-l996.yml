canonical_text:
  quote: ''
  summary: The passage is an editorial history of seventeenth-century recognition
    and naming of the Poetic Edda. It describes Biorn Johnson's 1642 essay as the
    first appearance of the word Havamal and as clear evidence that he had seen Codex
    Regius. It reports that Biorn treated the songs as ancient, obscure, and in need
    of interpretation; adapted a double-Edda theory by distinguishing Semund's verse
    Song-Edda from Snorri's prose Edda; attributed the collection to Semund; and cited
    an obscure prophecy named after the Wolwa. The passage then surveys later discoveries
    or mentions of individual Eddic-type poems and manuscripts.
  language: English
  quote_policy: summarized
