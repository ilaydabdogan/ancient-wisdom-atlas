comparison_claims:
- id: claim:1
  claim: The passage compares the burial of Sigfred and Brunhild to the burial in
    Beowulf as a more detailed example of the same funerary pattern.
  claim_level: same_motif
  target: Beowulf funeral
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage names the comparison but does not reproduce the Beowulf
    funeral details.
- id: claim:2
  claim: The passage claims Walhall, with hierarchy and elect population, resembles
    a counterpart to Christian heaven and popular Moslim theories of Paradise.
  claim_level: same_function
  target: Christian heaven and popular Moslim Paradise
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: This is a polemical secondary claim in the passage; no primary comparative
    evidence is supplied here.
- id: claim:3
  claim: The passage compares the Christianization or replacement of divine oath terms
    in the Norse formula with an English formula changing Anses and the holy Ring
    to saints and holy Gospels.
  claim_level: same_function
  target: English Christianized oath formula involving saints and holy Gospels
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives the comparison briefly and does not provide the full
    English formula.
- id: claim:4
  claim: The passage cautiously compares hallowed wells in the North with holy wells
    and well-side fairy-folk in the Irish St. Patrick story and with frequent holy
    wells in England.
  claim_level: same_function
  target: Irish and English holy-well traditions
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses possibility language for pre-Christian holiness of
    Bishop Gudmund’s wells and does not assert direct historical contact.
- id: claim:5
  claim: The passage explicitly calls the Old Roman fecial oath a parallel grith-oath.
  claim_level: same_function
  target: Old Roman fecial oath
  evidence_refs:
