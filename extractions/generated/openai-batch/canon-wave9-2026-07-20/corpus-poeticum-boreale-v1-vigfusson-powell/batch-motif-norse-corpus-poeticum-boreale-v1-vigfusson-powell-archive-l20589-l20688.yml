canonical_text:
  quote: ''
  summary: The passage surveys Old Northern funerary beliefs, including pyre processions,
    gifts, messages to the dead, and companions for the spirit-life; discusses cremation
    and burial; describes worship or hallowing of stones, groves, waterfalls, and
    wells; and summarizes ring-oaths and imprecatory peace-oaths sworn by sacred objects,
    divine powers, and named witnesses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage describes an arrow-burial type associated with Balder: procession
    on horseback to the pyre, farewell by kindred, messages entrusted to the dead
    for Hell, hallowing of the pyre with the Hammer, gifts, and the devotion of a
    wife who will not live apart from her husband.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The burial of Sigfred and Brunhild is described with purple pyre hangings,
    a horsed car holding Brynhild and her dead love, and hawks, hounds, captive men,
    and captive women as attendants in the spirit-life.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that, for Scandinavians, burning and burial need not be
    separated as ages because ashes or body could be placed in the funeral chamber,
    and old songs use “burnt” to mean dead and buried.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Walhall is described as having a hierarchy and a population
    of the elect.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Animism is described as appearing in the hallowing of places and things, including
    Eywind’s hallowing or worship of the Gund-stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Grove worship is reported: Ari is cited as saying that a person dwelt at
    the Grove and hallowed or worshipped the grove.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thorstan Rednebb is described as a great sacrificer who worshipped a waterfall,
    had leavings taken to it, and was considered a great prophet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Thorstan Rednebb account, he foretells that either all the sheep, he
    himself, or both are doomed; after his death, all the sheep run into the waterfall
    and perish there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says wells hallowed by Bishop Gudmund may possibly have been holy
    before to heathens, and notes holy wells in Ireland and England.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The regular legal oath is described as a ring-oath taken on a jointless gold
    ring lying on the temple table and worn by the presiding leader at the moot.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A temple-oath is described as using a silver ring reddened with the blood
    of sacrificed cattle; the oath-taker holds the ring, calls named human witnesses,
    and declares the statement to the Anse, identified as Thunder.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Poetic oath examples include swearing by the Southing Sun, the Great God’s
    rock, bed-chamber lintels, the ring of Wuldor, bright water, an ice-cold rock,
    ship timber, shield rim, steed shoulder, and sword edge, with imprecations if
    the oath is not kept.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'The passage says grith-oaths have three parts: witness-calling, terms, and
    imprecations; it names the Old Roman fecial oath as a parallel grith-oath.'
  category: relationship
  evidence_refs:
  - ev:9
