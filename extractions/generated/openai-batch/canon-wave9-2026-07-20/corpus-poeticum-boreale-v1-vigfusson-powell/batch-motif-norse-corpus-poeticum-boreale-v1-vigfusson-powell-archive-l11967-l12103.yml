canonical_text:
  quote: ''
  summary: 'The passage presents a prophetic sequence of world crisis: a wolf-related
    monster threatens the moon and darkens the sun; cocks, Garm, and Heimdal sound
    warnings; social bonds fail; giants, monsters, the dead, Loki, and Muspell’s sons
    advance; gods fight wolf, serpent, and fire-bearing foes; the sun darkens, earth
    sinks, and flame reaches heaven. The vision then turns to renewal: earth rises
    green from the deep, the gods meet again, golden objects are found, fields yield
    without sowing, Balder returns with Hod, and blessed halls are described.'
  language: English
  quote_policy: summarized
