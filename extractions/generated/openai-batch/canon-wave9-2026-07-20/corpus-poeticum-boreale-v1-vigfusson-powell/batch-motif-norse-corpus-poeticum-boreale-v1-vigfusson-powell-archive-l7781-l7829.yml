canonical_text:
  quote: ''
  summary: At a Gothic stronghold, watchmen report the arrival of armed men. Eormunrek
    boasts that he would bind Hamtheow and Sorli, but the brothers enter in a violent
    attack; weapons do not bite on their mail, many Goths are slain, and Eormunrek
    is maimed. Eormunrek orders the brothers stoned because ordinary weapons are ineffective.
    The brothers exchange blame about bad counsel, the killing of their brother Erp,
    and the prospect of turning on one another like wolves.
  language: English
  quote_policy: summarized
