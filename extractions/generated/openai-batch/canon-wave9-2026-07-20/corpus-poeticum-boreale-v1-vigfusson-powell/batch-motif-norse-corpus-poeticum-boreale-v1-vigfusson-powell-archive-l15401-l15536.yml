  summary: The passage contains editorial notes and surviving translated portions
    of a short Brunhild lay concerning Sigurd’s treacherous killing, Brunhild’s instigation
    and later lament, prophetic bird speech about vengeance for broken oaths, Gudrun’s
    reaction, and Brunhild’s dream of Gunnar’s fettered downfall. It also begins the
    editorial introduction to Oddrunar-gratr, summarizing a version in which Attila
    has Gunnar thrown into a snake pit, where Gunnar plays the harp and Ordrun comes
    too late to save him.
  language: English with Old Norse fragments
