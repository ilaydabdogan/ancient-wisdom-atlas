    oaths, Brunhild calls the Hniflungs oath-breakers, and she recalls Gunnar and
    Sigurd mingling blood in a footprint before Gunnar repaid Sigurd with evil.'
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The taxonomy reference is broad; the passage treats oath violation and
    vengeance rather than a formal covenant theology.
- id: motif:2
  label: Vengeance foretold by speaking birds
  taxonomy_refs:
  - wisdom
  basis: A raven speaks from a tree to the murderers and foretells Atli’s sword-vengeance
    for broken oaths; an eagle is also mentioned with the raven as a talking bird
    on the tree.
  evidence_refs:
