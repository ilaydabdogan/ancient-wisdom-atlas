canonical_text:
  quote: ''
  summary: The passage is an editorial discussion of alleged deliberate remaniement
    in Old Norse court poems and kings’ lives. It gives examples from Vellekla, poems
    on Olaf the Saint, and the Dirge on Erling Skialgsson, arguing that concrete historical
    details were replaced by vague battle commonplaces while traces of the original
    wording remain. One example concerns Earl Hacon’s sacrifices and casting of holy
    lots for an oracle at Gaut-skerries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that deliberate falsification or remaniement extends through
    court poems from the days of Harold Greyfell to the reigns of Harold Hardrede
    and Olaf the Quiet, approximately 970-1070, and then abruptly stops.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the affected poems are mainly in court-metre and especially
    encomia, while stray verses and loose epigrams are less seriously affected.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Vellekla example, a prose statement says Earl Hacon held Throndham
    for three winters and fought Gundhild’s sons, but the transmitted verse is described
    as saying only vaguely that a prince had a fleet, was joyful in battle, and waged
    war.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the remanieur changed concrete and factful phrases into idealized
    commonplaces while leaving some traces of earlier wording.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ari is said to quote a Vellekla stanza for Hacon’s levy from Haloga-land and
    Naum-dale, while the transmitted verse lacks the explicit place names that the
    editors believe are hidden under altered words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Ari’s fact about Earl Hacon’s sacrifices and throwing holy
    twigs for an oracle is hidden beneath an empty phrase, and gives the underlying
    statement as Hacon casting holy lots at the mouth of the Gaut-skerries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage refers to fighting at the Dane-work between Otho the Second and
    the Danish king, with Earl Hacon taking part, and says the emperor’s name is hidden
    under a common phrase.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says verses on Olaf the Saint transformed details about the king’s
    army, the position of Swedes, and the king’s golden helm into generic battle statements.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage contrasts prose statements about Erling Skialgsson as a husbandman,
