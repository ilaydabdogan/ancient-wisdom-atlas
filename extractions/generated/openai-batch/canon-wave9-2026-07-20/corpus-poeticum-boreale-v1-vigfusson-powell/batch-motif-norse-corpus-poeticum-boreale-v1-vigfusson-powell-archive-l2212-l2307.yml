canonical_text:
  quote: ''
  summary: The passage is an editorial introduction discussing cultural, material,
    linguistic, and geographic indications in Eddic songs. It mentions Fairhair's
    western expedition as a cause of migration to Iceland; describes halls, courts,
    fortifications, furnishings, food, fuel, agriculture, animals, hunting, trees,
    and dress; lists place names and imagined geography; and compares the Hymi Lay's
    giant-house details with the chamber and stone bowls of the New Grange tomb in
    Ireland.
  language: English
  quote_policy: summarized
