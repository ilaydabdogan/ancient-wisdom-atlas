canonical_text:
  quote: ''
  summary: The passage contains an editorial introduction to The Lay of Swipday and
    Menglad, a brief narrative synopsis of Swipday’s quest, and the opening scene
    at his mother Groa’s grave. Swipday calls his dead mother from the grave-mound
    because his stepmother has sent him to find Menglad. Groa responds and chants
    nine protective charms for his journey, covering evil encounters, despair, waters,
    enemies, fetters, sea, mountain frost, night-riding witches, and a contest of
    words with a giant. The passage also includes a preceding riddle/prose fragment
    involving Woden, Balder, Heidrek, Tyrfing, and Woden’s hawk-shape.
  language: English
  quote_policy: summarized
