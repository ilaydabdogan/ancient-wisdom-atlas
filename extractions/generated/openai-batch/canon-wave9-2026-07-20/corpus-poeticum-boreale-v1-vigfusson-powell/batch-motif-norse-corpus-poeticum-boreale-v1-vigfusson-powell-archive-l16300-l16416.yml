canonical_text:
  quote: ''
  summary: Kostbera warns Hogni not to travel after dreaming of fire, a bear, and
    a blood-spattering eagle; Hogni gives mundane explanations. Gleamwor likewise
    warns Gunnar after dreams of a gallows, serpents, a bloody weapon, a spear, wolves,
    a river in the hall, and dead women inviting him away. Gunnar says they cannot
    escape doom and must go. The men depart despite their wives’ attempts to stop
    them. Wingi swears he has no treachery in mind, but after the party reaches Atli’s
    hall he reveals that his invitation was false. Hogni’s party kills Wingi, and
    Atli’s men arm themselves and attack.
  language: English
  quote_policy: summarized
