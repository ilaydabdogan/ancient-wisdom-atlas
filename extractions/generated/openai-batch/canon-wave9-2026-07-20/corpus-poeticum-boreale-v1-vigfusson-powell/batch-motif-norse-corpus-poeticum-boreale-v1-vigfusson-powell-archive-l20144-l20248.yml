canonical_text:
  quote: ''
  summary: The passage discusses Norse examples of prophecy, sorcery, dream divination,
    and ancestor worship. It recounts a sibyl foretelling Ingimund’s settlement and
    the recovery of a lost lot, notes uncertain divinatory implements, gives examples
    of harmful charms and cross-way spell-working, and lists dream-prophecy traditions.
    It then argues that ancestor and household worship were central to older religion,
    citing ancestral spirits, family shrines near graves, offerings to Elves/dead,
    and cases of dead or deified rulers such as Gudmund, Frey, Grim Camban, Horicus,
    and Anlaf.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A sibyl tells Ingimund that he cannot prevent a westward settlement and gives
    a token: a lost lot from his purse will be found when he digs a place for his
    Porch-pillars in the new land.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states uncertainty over whether the named divinatory items were
    chips or later Y-shaped hazel-rods.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The words for witchcraft and sorcery are associated with examples in which
    Huld performs charms connected with Wanland and with continuing kindred slaughter
    in the Yngling house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sitting out or working spells at a cross-way is described as an evil kind
    of sorcery and is said to have been used to raise tempests.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dream divination is attributed to the Atli Lays, Hildebrand’s Lay, and Gisli’s
    Saga; dream-fairies tell a hero to fight or prophesy a hero’s death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jordanes’ testimony about the Anses as semi-divine ancestors of royal races
    is said to be confirmed by older authorities on ancestor worship.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage distinguishes tribal worship of Thunder and Woden from clan and
    family worship of their own ancestral beings, including Thorgerd Holgabride and
    collective Alfa-blot or Disa-blot sacrifices for good seasons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Household ancestor worship is described as patriarchal and conducted by the
    head of the family at the family horg, placed near graves or barrows where the
    dead were supposed to dwell.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Cormac’s Saga example, Thordis instructs that an ox slain by Cormac
    be taken to a knoll where Elves dwell, its blood sprinkled outside the knoll,
    and its meat given as a banquet so that healing will result.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The editors characterize the Cormac’s Saga offering as preserving the notion
    that the dead taste blood and receive meat at graves.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: Gudmund is said to have been worshipped and called a god after death; Frey
    is said to have remained unburned in Sweden, been called God of the World, and
    received sacrifices for good seasons and peace.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Grim Camban is said to have been worshipped after death; Anschar’s account
    is said to include an offer to bring the dead king Horicus into the guild of the
    Anses.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: 'The Anlaf story is introduced as an instance of ghost-worship: during famine
    and plague, the king prophesies that the trouble will not stop until he dies and
    is buried, and orders a huge howe to be prepared and fenced off.'
  category: sequence
  evidence_refs:
  - ev:13
