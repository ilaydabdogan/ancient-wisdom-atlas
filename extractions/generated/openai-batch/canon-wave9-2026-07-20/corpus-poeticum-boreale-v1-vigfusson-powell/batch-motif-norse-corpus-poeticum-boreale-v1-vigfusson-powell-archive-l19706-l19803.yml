  summary: The passage compiles notices about Old Norse ritual toasts, sacrificial
    feasts, seasonal offerings, Disa-blot and Soma-blot episodes, oath-making on a
    sacred boar, temple dismantling and migration, transfer of sacredness by temple
    materials, and the ritual use of high-seat pillars by settlers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual toast is associated with Woden’s toast and with boasting and vowing
    at great funeral feasts; after drinking the toast, an unnamed successor is led
    to the high-seat formerly owned by his father and is treated as having inherited
    from him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an autumn feast, people gather for great drinkings, hallow remembrance-toasts
    to the Anses, slaughter cattle and horses, redden the altar with blood, perform
    sacrifices, and use proper forms for improving the seasons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cited account says sacrifices were made before winter to the Anse identified
    as Thor, at mid-winter for the crop, and when summer began.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a Disa-blot at King Alf’s, Alfhild performs the sacrifice; while reddening
    the high-place at night, Starkad carries her away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another Disa-blot notice describes King Eadgils riding his horse around the
    hall of the Disa, after which the horse stumbles and falls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: King Heidrek sacrifices to Frey and gives Frey the largest boar he can obtain;
    the boar is regarded as holy, people swear on its bristles in major cases, and
    after Yule the Soma-boar is led into the hall before the king for avows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorhard the Old, a temple priest at Merin, dismantles the temple when emigrating,
    takes the temple mould and pillars with him, and lays Merin’s sacredness upon
    a firth where killing is restricted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thorwolf, described as a great friend of Thor, emigrates after an oracle and
    takes down a temple, carrying most of its wood and the mould under the altar;
    the passage also states that the altar held a ring and a bowl with twigs, not
    an image.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Several settlers are said to carry high-seat or porch-way pillars; Lodmund
    throws his pillars overboard and says he will settle where they come ashore, while
    another colonist refuses this method and trusts Thor’s oracle instead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The pillars are called ‘ondvegis-sulor’ and are interpreted in the passage
    as porch-way pillars with ritual significance.
  category: attribute
  evidence_refs:
  - ev:8
