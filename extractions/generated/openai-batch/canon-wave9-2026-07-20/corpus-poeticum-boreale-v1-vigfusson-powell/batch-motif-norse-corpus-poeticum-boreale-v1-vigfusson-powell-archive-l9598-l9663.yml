canonical_text:
  quote: ''
  summary: A king dreams of a fiery dragon rising from the sea, followed by northern
    birds, then swallowed by a storm cloud; thunder, lightning, rain, and hail fall
    over his realms, and his war-galleys turn into whales. The king wakes and calls
    on Hord to interpret the dream, but Woden assumes Hord's likeness and speaks with
    him. A paraphrase says the king later leaps overboard after Hord, both vanish,
    and Ivar Widefathom's empire is broken up. In the dialogue, the speaker foretells
    the fall of Ivar's kingdom and compares named men to Balder, Honir, and Hermod.
  language: English
  quote_policy: summarized
