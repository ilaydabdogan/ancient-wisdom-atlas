canonical_text:
  quote: ''
  summary: The passage argues that Old Norse verse quotations in Kings' Lives and
    related texts show evidence of later remodelling or corruption. It distinguishes
    Ari, who is said to have used a purer text and extracted facts critically, from
    Snorri, who is rejected as the author of certain works and as the remodeller.
    Einar Skulason is proposed as a possible remodeller. The passage also describes
    later scribal insertion of remodelled verses into saga corpora and concludes that
    the Early Kings' Lives may have high historical authority because they reflect
    Ari's use of contemporary documents.
  language: English
  quote_policy: summarized
