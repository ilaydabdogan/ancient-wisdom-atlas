canonical_text:
  quote: "“I swore to wed the man that rode through my Waver-Lowe”"
  summary: Sigfred and Brunhild speak of grief, broken troth, and an oath connected
    with riding through Brunhild’s Waver-Lowe. Brunhild refuses to have two husbands
    or to wed Sigfred. She accuses Sigfred and Gundhere of betrayal, laments that
    she lacks Sigfred as husband, and demands that Sigfred die or that Gundhere die.
    Gundhere and others incite Guthorm with a charmed drink and promises; Guthorm
    twice cannot kill Sigfred because of Sigfred’s bright eyes, but the third time
    stabs him while he sleeps. The passage also contains editorial notes comparing
    this material with Brunhild lays and a following heading about Sigmund and Sinfitela
    becoming were-wolves.
  language: English
  quote_policy: quoted
