canonical_text:
  quote: The hero took his revenge there in the hall; the bright sword Gram flew out
    of his hand and struck Gothorm.
  summary: In the hall, the dying hero Sigurd kills Gothorm with the sword Gram. Gudrun
    wakes in Sigurd's blood and laments; Sigurd speaks to her, names Brunhild as the
    cause, and dies. Brunhild laughs at Gudrun's cry, argues with Gunnar, recounts
    coercion by Atli and her love for Sigurd, rejects attempts to restrain her, distributes
    treasures, arms herself in a golden mail-coat, and wounds herself with a sword.
  language: English
  quote_policy: quoted
