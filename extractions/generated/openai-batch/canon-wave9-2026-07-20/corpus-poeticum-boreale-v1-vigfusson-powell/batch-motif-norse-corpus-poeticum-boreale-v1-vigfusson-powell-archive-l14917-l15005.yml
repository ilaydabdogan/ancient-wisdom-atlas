canonical_text:
  quote: ''
  summary: 'In a prophetic dialogue, Gripi tells Sigurd of future deeds: the slaying
    of Regin and Fafni, the taking of Fafni’s treasure, the awakening of a mail-clad
    woman on a flame-wrapped mountain, the learning of mysteries and healing arts,
    a fated death, love for Brunhild/Brynhild, Grimhild’s deception, marriage arrangements
    involving Gudrun and Gunnar, oath-swearing, and an exchange of face and form between
    Sigurd and Gunnar during the wooing of Brynhild.'
  language: English
  quote_policy: summarized
