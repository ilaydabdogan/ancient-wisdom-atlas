- id: motif:2
  label: Hero wins treasure from slain adversary’s lair
  taxonomy_refs: []
  basis: Sigurd is foretold to slay Regin and Fafni, find Fafni’s lair, and take treasure
    and gold.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not describe the combat itself or identify Fafni’s nature
    beyond the name and lair.
- id: motif:3
  label: Sleeping armored woman on a fire-wrapped mountain awakened by a hero
  taxonomy_refs:
  - initiation
  basis: A king’s daughter lies asleep on a mountain, bright in mail and wrapped in
    flames; Sigurd will cut the mail and awaken her.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The initiation taxonomy reference is interpretive and rests on the awakening
    scene followed by instruction; the passage itself gives the literal events.
- id: motif:4
  label: Woman as teacher of mysteries, languages, and healing
  taxonomy_refs:
  - wisdom
  basis: After awakening, the woman teaches Sigurd every mystery men wish to know,
    speech in every man’s tongue, and healing and leech-craft.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No divine status is stated for the teacher in this passage.
- id: motif:5
  label: Love and memory altered through another’s treachery
  taxonomy_refs:
  - stolen_beloved
  basis: Gripi says Brunhild will consume Sigurd’s happiness, that oaths will be sworn
    but few kept, that after one night at Giuki’s he will no longer remember her,
    and that Grimhild’s schemes and wiles cause his suffering.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage attributes the outcome to treason and schemes but does not
    give the mechanism of forgetfulness.
- id: motif:6
  label: Oaths sworn and broken or only partly kept
  taxonomy_refs:
  - covenant
  basis: Gripi says Sigurd and the maid will swear all oaths fully but hold few, and
    later says Sigurd, Gunnar, and Hogni will swear oaths to one another.
  evidence_refs:
  - ev:10
  - ev:15
  confidence: high
  cautions: The passage foretells failure to hold oaths but does not narrate the later
    breaking in this excerpt.
- id: motif:7
  label: Exchange of face and form for proxy wooing
  taxonomy_refs:
  - shapeshifter
  basis: Gripi says Sigurd and Gunnar will take each other’s face and form; Sigurd
    will put on Gunnar’s face and form while keeping his own speech and heart, and
    will betroth Heimi’s foster-daughter.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage describes form exchange but does not explain the means by
    which it occurs.
- id: motif:8
  label: Wooing the beloved for another man
  taxonomy_refs:
  - stolen_beloved
  basis: Grimhild will stir Sigurd to woo Brynhild for Gunnar, and Sigurd says his
    life goes wrong if he must woo the noble maid he loves best for another.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage presents this as foretold deception and proxy wooing rather
    than a completed abduction.
