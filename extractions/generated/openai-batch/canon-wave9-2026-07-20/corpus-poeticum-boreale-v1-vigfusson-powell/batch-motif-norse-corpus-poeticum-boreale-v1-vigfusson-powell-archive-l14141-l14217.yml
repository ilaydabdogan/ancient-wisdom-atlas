canonical_text:
  quote: ''
  summary: The passage praises Hakon, saying that he spared sanctuaries, was welcomed
    by Gods and Powers, and that no king so good will come again before a mighty Wolf
    is let loose and social ruin follows. It then gives violent battle imagery in
    which weapons, blood, and shields are described through fire, water, and storm
    images. The passage also introduces Egil Skalla-Grim's son and the poem Head-Ransom,
    summarizing the saga account that Egil, imprisoned by King Eric, made a praise-song
    and was spared through Arinbiorn's intercession; it ends with editorial notes
    on the poem's meter and structure.
  language: English
  quote_policy: summarized
