  summary: The passage surveys editions, translations, literary influence, and critical
    treatment of Old Norse and Eddic poetry, including Bugge, Grundtvig, Hildebrand,
    Mallet, English literary reception, seventeenth-century Icelandic commentators,
    the eighteenth-century Skyringar method, and Sveinbiorn Egilson’s interpretive
    and translation work.
  language: English
  quote_policy: summarized
