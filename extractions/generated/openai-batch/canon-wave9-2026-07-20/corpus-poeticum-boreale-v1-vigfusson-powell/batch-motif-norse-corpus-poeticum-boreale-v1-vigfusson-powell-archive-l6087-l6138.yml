  summary: Editorial final readings and notes. The passage lists late echoes of the
    old Helgi myth in the Romance of Olger the Dane; discusses Holgi, Helgi, and Otgeir
    as name/person identifications; notes an Earth-as-ship image in Christian's Wisdom
