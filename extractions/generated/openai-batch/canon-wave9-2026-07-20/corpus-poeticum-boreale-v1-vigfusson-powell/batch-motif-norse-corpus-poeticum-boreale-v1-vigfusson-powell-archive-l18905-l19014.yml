canonical_text:
  quote: ''
  summary: Brunhild recognizes a ring, becomes deathly pale, and falls silent. Gudrun
    and Sigfred discuss Brunhild’s anger, and Sigfred forbids Gudrun to question her.
    Gudrun later confronts Brunhild, and the two women argue over Sigfred, oaths,
    betrayal, the hoard, Gundhere, Grani, the fire, and Grimhild’s alleged draught
    of forgetfulness. Brunhild then takes to bed and lies as if dead. When Gundhere
    comes to her, she questions him about a ring she had given him, which King Attila
    had previously given her, and recalls an oath to harry and burn rather than be
    possessed by Gundhere.
  language: English
  quote_policy: summarized
