canonical_text:
  quote: ''
  summary: 'The passage is a scholarly introduction discussing German, English, and
    Northern heroic poetry. It summarizes several story elements attributed to lost
    lays: Samson-like vengeance after blindness, Grimwald’s striking appearance, brothers
    fleeing from the Avars, captive maidens preserving honour, and two warriors quarrelling
    before battle. It also notes the English image of a harper singing at a king’s
    feet and makes several cautious comparisons among Germanic and related song traditions.'
  language: English
  quote_policy: summarized
