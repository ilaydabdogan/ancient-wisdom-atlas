canonical_text:
  quote: ''
  summary: 'The passage introduces the Long Lay of Brunhild and summarizes its plot:
    Brunhild, driven by disappointed love, urges Gunnar to kill Sigurd, later stabs
    herself, is burned on a pyre with Sigurd’s body, and rides toward Hell where a
    Giant-witch blocks her way. The poetic narrative then recounts Sigurd’s arrival
    at Giuki’s house, his oath-bond with Giuki’s sons, his marriage to Gudrun, the
    wooing of Brynhild, Brunhild’s grief and jealousy, her demand that Gunnar kill
    Sigurd, Gunnar and Hogni’s debate over oaths and wealth, and Gunnar’s plan to
    use Gothorm because he is outside the sworn oaths; Gothorm then kills Sigurd with
    a sword.'
  language: English
  quote_policy: summarized
