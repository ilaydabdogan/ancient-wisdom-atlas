canonical_text:
  quote: ''
  summary: The passage closes Gudrun's lament with memories of slain kin and a call
    for Sigurd and the funeral pile. It then introduces and begins the Greenland Lay
    of Atli, in which Atli's secret counsel and summons threaten Gunnar and Hogni;
    Gudrun attempts to warn them with runes, Wingi alters the message, and Kostbera
    reads the dark letters and warns Hogni after a dream.
  language: English
