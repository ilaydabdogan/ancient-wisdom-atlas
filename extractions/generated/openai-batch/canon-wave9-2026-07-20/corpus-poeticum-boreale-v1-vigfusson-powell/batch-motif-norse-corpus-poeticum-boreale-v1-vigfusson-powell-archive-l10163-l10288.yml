canonical_text:
  quote: ''
  summary: The passage recounts Sigrun receiving news that Helgi has been killed,
    cursing her brother Day, and being told that Woden caused strife among kin. Sigrun
    laments Helgi. At dusk her bondmaid sees Helgi and his company riding as dead
    men granted leave to return. Helgi calls Sigrun to the opened barrow before he
    must ride away along aerial roads toward Windhelm’s bridge. Sigrun meets and kisses
    the dead Helgi, notes his cold, blood-wet body, and lies with him in the barrow.
    The passage then shifts to a fragment in which King Hiorward sends Atli to woo
    Sigrlind, aided by a talking bird that bargains for worship, high places, temples,
    and cattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most of the named kinsmen are said to lie as corpses at Yordan, and the addressee
    is said to have been fated to cause feud among the Mighty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Day comes to Sigrun and reluctantly tells her that Helgi fell that morning
    at Fetterholt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sigrun invokes oaths and curses Day’s ship, horse, and sword, and says Helgi
    would be rightly avenged if Day became a wolf-like outlaw in the woods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Day says Woden alone wrought the evil by scattering runes of strife among
    kinsfolk, and Day offers red rings and half his land as recompense.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sigrun says she will no longer be happy at Sevafell or see Helgi return, and
    she compares Helgi to a noble ash among thorns and to a dew-flecked hart above
    other deer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sigrun’s bondmaid sees Helgi and his company riding by at dusk and asks whether
    they are phantoms, the Doom of the Powers, dead men riding, or dead men granted
    leave to come home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Helgi answers that he and his company are not phantoms and that the end of
    the world has not come; they have been granted leave to come home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Helgi says the barrow is opened, calls Sigrun to come to him, and says he
    must ride reddening roads and paths of air to be west of Windhelm’s bridge before
    Salgofni awakens the mighty Host.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The bondmaid warns Sigrun not to go alone to the houses of the Ghosts, saying
    that dead fiends of Hell grow stronger by night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sigrun goes out to meet Helgi, falls on his neck, kisses him, and observes
    his bloody mail-coat, rime-thick hair, body drenched with gory dew, and cold damp
    hands.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Helgi says Sigrun’s tears fall bloody, cold, and damp on his breast, and he
    proposes drinking costly draughts instead of chanting dirges.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Sigrun says she has made Helgi a painless bed and will sleep in his arms as
    if he were alive; Helgi marvels that she has come down alive into the barrow and
    is sleeping in the arms of the dead.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: In the following fragment, Hiorward sends Atli to woo Sigrlind, and a talking
    bird bargains with Atli for worship, temples, high places, and gold-horned cattle
    in return for helping Sigrlind come willingly to the king.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Atli reports trouble and ill speed, saying that the steeds foundered on broad
    mountains and that they had to wade across.
  category: speech
  evidence_refs:
  - ev:13
