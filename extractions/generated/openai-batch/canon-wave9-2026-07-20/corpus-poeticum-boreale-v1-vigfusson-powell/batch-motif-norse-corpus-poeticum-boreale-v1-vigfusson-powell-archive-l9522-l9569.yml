  summary: In a dialogue across a Sound, Thor threatens Hoarbeard/Harbard and recounts
    defending a river in the East and fighting hostile female beings. Hoarbeard replies
    with accounts of a secret meeting with a woman, marching with an army, learning
    cutting words from old giantesses in cairns, offering a hand-ring settlement,
    and taunting Thor about Sif. The exchange includes threats involving wading across
    the water, the Hammer, and the Wolf.
