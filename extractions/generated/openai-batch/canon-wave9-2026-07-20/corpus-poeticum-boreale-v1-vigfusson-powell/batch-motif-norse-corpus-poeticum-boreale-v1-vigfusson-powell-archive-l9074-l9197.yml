canonical_text:
  quote: ''
  summary: A sequence of flyting exchanges in which Loki disputes with Woden, Frigg,
    Freyja, Niord, Ty, Frey, Byggvi, Heimdal, Skadi, Sif, and Beyla. The speakers
    accuse one another of sexual misconduct, sorcery, unfair victory-giving, hostage
    status, kinship violations, cowardice, and past violence. The passage also refers
    to Balder’s absence, Ty’s lost hand, the bound Wolf, Frey’s exchange of his sword
    for Gymi’s daughter, the coming of Muspell’s sons, Loki’s future binding, Sif’s
    cup of mead, quaking mountains, and Thor’s arrival.
  language: English
  quote_policy: summarized
