- id: motif:1
  label: divine flyting at a feast
  taxonomy_refs:
  - trickster_boundary
  basis: The passage consists of a sequence of public verbal confrontations in a divine
    hall, with Loki repeatedly crossing social boundaries through accusations and
    insults.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:9
  - ev:12
  - ev:13
  confidence: medium
  cautions: The taxonomy reference is interpretive; the passage itself presents the
    repeated flyting structure but does not use the word trickster.
- id: motif:2
  label: fate-knowing divine women
  taxonomy_refs:
  - wisdom
  basis: Gefion and Frigg are each said to know the fate of all men.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: Only the knowledge of fate is stated; no ritual or method of knowledge
    is described.
- id: motif:3
  label: gender transformation and magical flight accusations
  taxonomy_refs:
  - shapeshifter
  basis: Woden says Loki lived beneath the earth as a woman and milkmaid and bore
    children; Loki says Woden flew over the earth in a wizard’s shape after practicing
    sorcery.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: These claims occur inside an insult exchange, so their narrative status
    should be reviewed.
- id: motif:4
  label: lost divine son and parental grievance
  taxonomy_refs:
  - divine_parent_child
  basis: Frigg identifies Balder as her son, and Loki claims responsibility for Frigg
    no longer seeing Balder ride into the hall.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage alludes to Balder’s absence but does not narrate the full
    event.
