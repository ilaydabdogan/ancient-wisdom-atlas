canonical_text:
  quote: ''
  summary: A speaker identified by the surrounding dramatic exchange as Skirni utters
    magical threats and curses against Gerda, invoking giants, gods, demons, monsters,
    magical characters, and engraved signs. Gerda then brings a foaming cup of old
    mead, says she had not expected to love Frey, and agrees to grant love to Niord’s
    son at Barra after three nights. A following scene heading states that Skirni
    returns to Elfham to report success to Frey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The curse threatens public humiliation: Rimni is to grin on the addressed
    woman, everything is to stare at her, and she is to be better known than Heimdall
    among the gods, gaping through the gate.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker names magical characters called Maddener, Whooper, Teasle, and
    Lust, and says they will bring tears and sorrow on the addressee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker threatens that demons will pinch the addressee daily in Giant-land
    and that she will go loveless and sorrowful to the Frost-Giants’ hall.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker threatens that the addressee will linger with a three-headed monster,
    or else be without a husband, and likens her to a thistle-head thrust away in
    a porch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says he went to the holt and wood to fetch a magic wand and obtained
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says Woden, the pride of the Anses, and Frey are angry with or
    hostile to the addressee, and calls on Giants, Frost-Giants, sons of Suttung,
    and companies of the Anses while forbidding her joy and pleasure of men.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The curse states that a monster called Rimegrim below Corse-gates shall have
    the addressee as wife, and that sons of toil beneath the roots of the wood shall
    serve her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says he engraves the addressee with the sign “p” and three signs
    named Lewdness, Love-Madness, and Lust, but says he can scrape them off if needed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gerda, described as cowed, brings a goblet or foaming cup of old mead and
    says she had not thought she would ever love Frey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Skirni asks when Gerda will have a love-tryst with Niord’s blooming son; Gerda
    answers that Barra is a peaceful copse known to both, where after three nights
    she will grant love to Niord’s son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A following scene heading says Skirni is back at Elfham telling his success
    to Frey, and the surviving opening has Frey asking Skirni to tell before removing
    the saddle from his horse.
  category: sequence
  evidence_refs:
  - ev:7
