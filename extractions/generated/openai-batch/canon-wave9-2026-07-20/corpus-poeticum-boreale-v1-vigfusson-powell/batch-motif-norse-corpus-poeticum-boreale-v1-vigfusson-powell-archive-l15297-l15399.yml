canonical_text:
  quote: ''
  summary: 'Brunhild, near death, speaks to Gunnar and foretells reconciliations,
    marriages, betrayals, deaths, and the extinction of Sigurd''s line. She asks for
    a broad funeral pyre with Sigurd, attendants, animals, weapons, textiles, and
    a sword laid between them, so that the company may serve as an afterlife convoy.
    After declaring that her speech is true and that she must depart, she is presented
    riding to Hell in a funeral chariot, where an Ogress challenges her. Brunhild
    answers by recounting her past: her oath, Odin''s anger, her enclosure by shields
    and flame, Sigurd''s ride through the fire, their chaste bed-sharing, and the
    deception that gave her the wrong husband. She ends by saying that she and Sigurd
    shall never part again.'
  language: English
  quote_policy: summarized
