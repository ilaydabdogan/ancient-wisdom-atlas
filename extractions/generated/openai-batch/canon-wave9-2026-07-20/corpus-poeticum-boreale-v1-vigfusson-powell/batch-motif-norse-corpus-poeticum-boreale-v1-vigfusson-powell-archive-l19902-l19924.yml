  summary: 'The passage discusses Old Norse sacrificial vocabulary and ritual actions:
    terms connected with human sacrifice, pithing or slaughtering cattle, bleeding
    victims at a holy place, and hanging victims dedicated to Woden. It cites a Gautrick''s
