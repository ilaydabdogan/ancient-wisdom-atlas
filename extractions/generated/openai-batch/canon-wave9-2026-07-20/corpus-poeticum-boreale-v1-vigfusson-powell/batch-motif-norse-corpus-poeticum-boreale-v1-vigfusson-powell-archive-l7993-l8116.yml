canonical_text:
  quote: ''
  summary: The passage gives part of a question-and-answer contest between Woden and
    Wafthrudni concerning primordial giants, anomalous giant births, the origin of
    wind, Niord as hostage, the Chosen Host, knowledge of worlds and hell, survival
    after Monster-winter, the Sun’s daughter, post-fire succession among gods, Woden’s
    death and vengeance, and a secret whispered before a pyre. It then introduces
    Grimnis-mal, where Woden in disguise is bound between fires by King Geirrod, aided
    by Agnar, and begins to speak from between the flames.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Woden asks Wafthrudni about the eldest of the Giants or sons of Ymi, and Wafthrudni
    names Berwhelm, with Thrudwhelm as his father and Orwhelm as his grandsire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wafthrudni says poisonous drops from the Bay of Sleet grew into a giant, and
    that the whole giant race sprang from that origin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wafthrudni says a maid-child and a man-child grew from under the giant’s armpit,
    and that foot with foot begat a six-headed son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wafthrudni’s earliest memory is of the wise giant being laid in the Ark before
    Earth was fashioned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wafthrudni says the wind comes from under the wings of Carrion-gulper, a giant
    in eagle’s shape who sits at the end of heaven.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Niord is described as made in Wane-world by wise Powers, given to the Anses
    as a hostage, and destined to return home to the Wanes at the doom of the Age.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Chosen Host in Woden’s Court meet daily in sword-play, choose the slain,
    ride from battle, and sit together in peace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wafthrudni says he can speak truly of the mysteries of Giants and Gods because
    he has been in every world, in nine worlds, and underneath the Hell of Clouds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wafthrudni says Lif and Lifthrasi will be hidden in Hoardmimi’s holt after
    Monster-winter, feed on morning dews, and become the source of a new generation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wafthrudni says the Sun will bear a daughter before the Wolf destroys her,
    and that the daughter will ride the mother’s paths after the powers have passed
    away.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Three great rivers fall over the croft of the Maids of Mogthrasi; their images
    are in the world while they themselves dwell with the Giants.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: After Swart’s Fire is quenched, Widar and Wali will inhabit the city of the
    Gods, and Mood and Main will have Miollni after Wingni’s last battle.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Wolf will swallow Woden, called Sire of Men; Widar will avenge him by
    rending the Beast’s cold jaws and slaying it.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Wafthrudni says no being knows what Woden whispered in his son’s ear before
    the son mounted the pyre, and he acknowledges that he has contended in speech
    with Woden.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The introductory prose to Grimnis-mal describes Woden in disguise as seized
    by King Geirrod, bound between hearth fires, deprived of food and drink, aided
    by Agnar with mead, and later blessing Agnar with kingship after Geirrod’s death.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: In the opening scene, Grimni addresses the flame as too hot and too great,
    says his fur is singed and burning, and Agnar reaches him a cup.
  category: speech
  evidence_refs:
  - ev:16
