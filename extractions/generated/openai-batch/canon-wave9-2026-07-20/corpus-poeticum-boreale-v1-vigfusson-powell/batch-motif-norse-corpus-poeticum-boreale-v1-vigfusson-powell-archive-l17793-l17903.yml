canonical_text:
  quote: ''
  summary: An appendix passage gives Old Norse duplicate text comparing Sigurpr among
    the sons of Giuki to natural and precious objects, followed by Latin extracts
    labelled as songs from Saxo Grammaticus. The extracts include Haddingus contrasting
    rough inland hiding places and animal cries with a return to sea life; a wife
    at the shore complaining of birds, waves, and lack of sleep while preferring the
    woods; a martial exhortation telling nobles to wake, reject pleasures, and go
    to war; Biarco addressing his page Scalco with instructions to revive the hearth
    fire; counsel to bear fortune and hardship equally; and a fragment of an armoured
    figure entering battle as if certain to conquer.
  language: Old Norse and Latin, with English headings
  quote_policy: summarized
