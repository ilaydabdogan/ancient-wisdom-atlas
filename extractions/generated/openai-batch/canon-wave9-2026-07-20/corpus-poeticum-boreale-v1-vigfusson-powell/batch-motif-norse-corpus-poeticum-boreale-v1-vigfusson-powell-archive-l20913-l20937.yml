canonical_text:
  quote: ''
  summary: The editors describe their effort to reconstruct old Teutonic faith from
    early poems and prose notices. They state that the subject concerns Scandinavians
    and other Teutonic peoples, that direct evidence is largely in Ari’s prose and
    old verse, and that Teutonic worship was religious, household-centered, directed
    toward family spirits, conducted by the house-father, associated with temples
    and tribal sacrifices, and not idol worship. A footnote gives an example of clan
    sacrifice every third year at a grandfather’s temple and another notes the absence
    of idols or images.
  language: English
  quote_policy: summarized
