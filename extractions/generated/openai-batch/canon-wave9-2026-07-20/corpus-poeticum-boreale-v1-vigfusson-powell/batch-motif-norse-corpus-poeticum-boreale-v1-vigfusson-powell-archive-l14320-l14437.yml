  quote: ''
  summary: 'The passage includes a translated praise-poem section on a king’s courage,
    generosity, sea-war imagery, and rule at York, followed by an epilogue presenting
    song as Woden’s flood or a divine drink. It then gives editorial context for Arinbiorn’s
    Lay: Egil composed or sent it to his friend and preserver Arinbiorn; the poem’s
    surviving plan includes Head-Ransom, generosity, valor, and an envoy. The excerpted
    opening of Arinbiorn’s Lay presents the speaker as frank in praise and hostile
    to slander, then recalls approaching Arinbiorn under the wrath of King Eric at
    York.'
