canonical_text:
  quote: ''
  summary: The passage introduces and excerpts parts of Volo-spa/Volospa. It describes
    the Sibyl’s prophetic setting, an invocation to gods and humans, memories of giants
    and nine worlds, primordial chaos and the making of earth, the ordering of sun,
    moon, stars, and seasons, the gods’ building and crafting, the creation of dwarves
    and humans, Yggdrasil and the Three Virgins who determine fate, Gold-weig’s burning
    and rebirth, the first war among divine groups, broken oaths involving Freya and
    Giant-kind, the magical Sibyl called Haid, and Woden’s consultation concerning
    his hidden eye in Mimi’s well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Volo-spa has a past-facing section called Genesis and a future-facing
    section called Eschatology, with the Sibyl answering in different ritual or prophetic
    settings.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The speaker prays for a hearing from holy beings, the sons of Heimdall, and
    Woden, and says she remembers giants, nine worlds, nine Sibyls, and a judge beneath
    the earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: Before creation there is said to be no sand, sea, waves, earth, heaven, or
    grass, but a Yawning Chasm; afterward the sons of Bor make the earth and raise
    the flat ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: The sun, moon, and stars initially do not know their proper stations; the
    gods assemble and name times of day and phases for counting seasons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: The Anses meet on Ida-plain, build high places and temples, set up forges,
    fashion treasures and tools, and play happily until three Titan maids arrive from
    Giant-land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The gods consult about creating Dwarf-kind, and dwarves are fashioned from
    bloody surf, giant bones, and earth in the image of man, as Durinn commands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Three Anses find Ask and Embla helpless on the ground without breath, feeling,
    motion, utterance, or comely hues; Woden, Hoenir, and Lodur give them life-giving
    qualities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: A high holy ash called Ygg-drasil stands ever green over Weird’s burn; from
    a well beneath the tree come Three Virgins who set fates and destinies for humans.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:9
  text: Gold-weig is speared and burned in the High One’s Hall, and is described as
    burned three times, reborn three times, and still living.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The gods assemble to decide about tribute, hostages, and a league; Woden hurls
    weapons into the host, and the passage calls this the first war in the world.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage says the Anses’ wall is broken and the Wanes march over war-ringing
    plains.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The gods consult about who charged the air with venom and gave the Maid of
    Od to Giant-kind; Thor is angered, and oaths, faith, and leagues are broken.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A soothsaying Sibyl called Haid charms divining rods, knows witchcraft, receives
    rings, necklaces, treasure-spells, and divining rods, and sees far through the
    worlds.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Sibyl sits alone outside when Woden comes and looks into her eyes; she
