canonical_text:
  quote: ''
  summary: The passage recounts Gunnar’s refusal to yield the Hniflung hoard to Atli,
    his consignment of it to the Rhine, and his death in a serpent pit while playing
    a harp. Gudrun invokes Atli’s oaths, later serves him and the Huns in hall, reveals
    that Atli has eaten the hearts of his sons, distributes gold, kills Atli with
    a sword, and burns the hall in vengeance for her brothers. The line range also
    includes editorial notes on the textual transmission of Hamdis-mal.
  language: English
  quote_policy: summarized
