candidate_motifs:
- id: motif:1
  label: escape from stone-cave imprisonment
  taxonomy_refs: []
  basis: The passage explicitly frames Sigmund and Sinfiotli's action as escape from
    imprisonment in a stone cave by cutting or scoring the stone with a sword.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The fragment gives only a very brief description of the escape mechanism.
- id: motif:2
  label: cursed treasure causing kin death and feud
  taxonomy_refs: []
  basis: Andwari curses his gold so that it will kill brothers, create feud among
    kings, and bring no joy to its possessor.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the curse's predicted effects but does not narrate
    all of their fulfillment here.
- id: motif:3
  label: vengeance transmitted through descendants
  taxonomy_refs: []
  basis: Rodmar asks his daughter to continue the blood-revenge line by producing
    a descendant who may avenge his death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the instruction, not the later realization of the revenge.
- id: motif:4
  label: disguised divine counselor at a journey threshold
  taxonomy_refs:
  - shapeshifter
  - wisdom
  basis: Hnikar is identified as Woden in old-man guise, appears on a rock during
    Sigurd and Regin's sea journey, asks for passage, and gives battle counsel.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage states disguise or likeness, but it does not narrate an actual
    transformation.
- id: motif:5
  label: talking birds reveal hidden treachery
  taxonomy_refs:
  - wisdom
  basis: The birds disclose Regin's hidden plot and advise Sigurd how to act.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The birds' speech is preserved in fragmentary editorial context.
- id: motif:6
  label: monster-heart as potential wisdom food
  taxonomy_refs:
  - wisdom
  basis: While Sigurd roasts Fafni's heart, the birds say he would be wise if he ate
    the fierce life-core.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This passage reports the advice to eat the heart but does not clearly
    state the effect of eating it.
- id: motif:7
  label: treacherous foster-father after monster-slaying
  taxonomy_refs: []
  basis: Regin fosters and incites Sigurd, then after Fafni's death is described by
    the birds as plotting deception and vengeance against the trusting hero.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  confidence: high
  cautions: The foster relationship is explicit, but the passage is fragmentary and
    summarized by prose links.
- id: motif:8
  label: divine punishment by enchanted sleep
  taxonomy_refs:
  - divine_judgment
  basis: Woden places Sigrdrifa in sleep with a wand because she brought down in battle
    those other than the ones he wanted to fall; the Fates' decrees are also invoked.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives the divine cause but only a compressed account of the
    prior battle.
- id: motif:9
  label: hero crosses fire to wake an armored sleeping woman
  taxonomy_refs: []
  basis: The birds describe a fire-lapped hall and sleeping battle-maid; Sigurd then
    bursts through the wall of fire, cuts Sigrdrifa's mail-coat, and wakes her.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not present a marriage or betrothal in this excerpt,
    so those motif readings are not assigned.
- id: motif:10
  label: enchanted cup bestowed by awakened woman
  taxonomy_refs:
  - wisdom
  basis: Sigrdrifa gives Sigurd a cup of ale mixed with power and glory and filled
    with charms, love-spells, enchantments, and mysteries.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The cup is magical and knowledge-bearing in description, but the passage
    does not describe its later effects.
