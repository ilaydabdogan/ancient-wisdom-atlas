canonical_text:
  quote: ''
  summary: Fragments of the Western Wolsung-Lay recount Sigmund and Sinfiotli escaping
    a stone cave, Andwari cursing his hoard, Rodmar urging hereditary revenge, Regin
    fostering and inciting Sigurd, Sigurd and Regin meeting Hnikar/Woden at sea, Sigurd
    slaying Hunding and Fafni, birds warning Sigurd against Regin and directing him
    toward Sigrdrifa, and Sigurd waking Sigrdrifa from enchanted sleep behind fire
    before receiving her magic cup.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigmund and Sinfiotli are described as imprisoned in a stone cave and scoring
    the great stone with a sword using all their might.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As Andwari dies, he lays a curse on the treasure, saying the gold will cause
    the death of two brothers, feud among eight kings, and joylessness for whoever
    holds the hoard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dying Rodmar tells his daughter to bear a daughter if she bears no son,
    and to marry that daughter so a later son may avenge Rodmar's death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Regin identifies Sigurd as Sigmund's son, calls him a bold young warrior and
    wolf's cub, and says he will bring him up to become a mighty king.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Regin urges Sigurd toward the slaying of Fafni, while Sigurd's speech contrasts
    seeking red rings with avenging his father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the way to Gniteheath, Sigurd and Regin travel over the sea and meet Hnikar,
    identified in the prose as Woden in the likeness and apparel of an old man, standing
    on a rock.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hnikar names himself by several names, asks for passage, and gives Sigurd
    tactical counsel about battle direction and battle formation.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Sigurd has slain Hunding, and Regin rejoices over the killing of Sigmund's
    slayer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After Sigurd slays Fafni, Regin has him cook the dead monster's heart and
    lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Talking birds say Sigurd would be wise to eat Fafni's heart and warn that
    Regin is plotting deception and revenge for his brother.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sigurd follows the birds' counsel and slays Regin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The birds direct Sigurd toward Giuki's paths and describe a gold-built hall
