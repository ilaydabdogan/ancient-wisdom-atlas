- id: claim:2
  claim: The common curse asking trolls to take someone is presented as deriving from
    imprecatory oath formulas such as those in the late Atli-Lay.
  claim_level: linguistic_similarity
  target: Common curse formula, “May the trolls take me”
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
