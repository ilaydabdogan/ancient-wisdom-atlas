- id: claim:1
  claim: The passage compares oath formulas by natural objects and weapon edges across
    Highland tale, Fenian cycle, and North English ballads.
  claim_level: same_function
  target: Highland, Fenian, and North English oath formulas
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
