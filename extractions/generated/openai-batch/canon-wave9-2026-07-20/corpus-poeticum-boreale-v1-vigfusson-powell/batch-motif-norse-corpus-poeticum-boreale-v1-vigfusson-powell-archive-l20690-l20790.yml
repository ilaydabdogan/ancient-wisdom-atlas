    comparison in this excerpt.
- id: claim:3
  claim: The blood-in-footprint rite of sworn-brotherhood in Eddic references is compared
    with Saxo’s account of ancient league-makers soaking footprints with mutual blood.
  claim_level: same_motif
  target: Saxo’s account of league-making by blood-soaked footprints
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is text-to-text within the cited scholarly passage;
    independent verification of each source is outside this extraction.
- id: claim:4
  claim: The passage contrasts Gisla Saga’s mixed ceremony with Watzdola Saga’s earth-necklace
    rite, treating blood blended in earth as relevant to sworn-brotherhood and the
    turf-strip passage as submission.
  claim_level: same_function
  target: Gisla Saga and Watzdola Saga ritual accounts
