canonical_text:
  quote: ''
  summary: The passage surveys oaths, vows, ordeal practices, marriage hallowing,
    sworn-brotherhood, submission rites, and warrior hair vows in Old Norse and related
    comparative examples, citing saga, Eddic, ballad, and classical sources.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists oath formulas invoking earth, air, setting or westing sun,
    blackthorn, briar, weapon edges, oak, ash, thorn, and blade edges.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The late Atli-Lay is cited for imprecations calling on giants or the gallows
    if the speaker lies or breaches grith; the passage connects this with the common
    curse asking trolls to take someone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gudrun’s Ordeal is cited for an ordeal-oath over holy white stones, identified
    with the bright gem of the boiling cauldron, and for consecration of ordeal stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage refers to vows made on the hallowed boar of Frey at Yule-feasts
    and over the cup of Woden at arvals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Honsa-Thori’s Saga, Herstan rises at a bridal, stands with one foot on
    a stone, makes vows, and drinks his cup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Thrym’s Lay marriage-scene, the giant bridegroom calls for the hammer
    to be brought in to hallow the bride, laid on the bride’s knees, and used to hallow
    the pair by the vow-hand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that solemn pledges such as wedlock and sworn-brotherhood
    are called vows, and gives terms for oath-hand, vow-making, perjury, and breach
    of promise.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sworn-brotherhood is described through blood running together in a footprint;
    Saxo is quoted as saying that ancient league-makers soaked their footprints with
    mutual blood to establish friendship pledges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gisla Saga is said to preserve the blending of blood together in the earth,
    while Watzdola Saga is cited for the earth-necklace, propped-up strips of turf,
    as a submission rite.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Jökul is asked to go under the turf strips and refuses; Thorstan offers to
    act as proxy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The three earth-necklaces are described as propped at shoulder height, breech-belt
    height, and mid-thigh height, requiring the submissary to stoop successively.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says Loki alludes to an old bond of brotherhood with Woden and
    that sharing the cup was probably one of the clauses of the oath.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A warrior vow is described in which soldiers do not clip hair or beard until
    they have accomplished a difficult deed or revenge.
  category: action
  evidence_refs:
  - ev:10
