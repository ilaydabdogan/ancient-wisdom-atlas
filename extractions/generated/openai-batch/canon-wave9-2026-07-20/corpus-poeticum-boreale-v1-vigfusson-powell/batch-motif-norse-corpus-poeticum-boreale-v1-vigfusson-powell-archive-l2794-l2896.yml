canonical_text:
  quote: ''
  summary: The passage is an editorial introduction discussing several Eddic poems
    and related Irish or Western parallels. It treats the Lay of Righ as Western in
    origin, links the Lay of Darts with Clontarf traditions and Irish prophecies,
    notes stone cauldrons in Hymi’s hall as recalling Irish tumulus bowls, mentions
    Egil’s image of a cauldron of tears, distinguishes Norwegian encomia from Western
    poems, and then discusses the collection history and manuscript relationships
    of Eddic lays.
  language: English
  quote_policy: summarized
