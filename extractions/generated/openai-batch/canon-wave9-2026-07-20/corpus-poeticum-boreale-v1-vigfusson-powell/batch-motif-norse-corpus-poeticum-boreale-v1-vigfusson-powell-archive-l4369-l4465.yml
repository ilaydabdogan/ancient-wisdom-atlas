canonical_text:
  quote: there are not one but many mythologies in the Eddic poems
  summary: The passage first discusses editorial claims about Ari Thorgilsson and
    Snorri Sturlason, then turns to mythological aspects of Old Northern poetry. It
    rejects treating Teutonic mythology as one complete system and presents Eddic
    myths as layered by time. Examples named include a cosmogony from a slain world-giant,
    a firstborn holy cow, a later Christian-colored complex of heaven, supreme God,
    angels, demons, Holy Tree, hell, and doomsday, the late Walhall/Walcyrie system,
    and a belief in royal divine descent from God and Mother Earth.
  language: English
  quote_policy: quoted
