comparison_claims:
- id: claim:1
  claim: The passage compares the later use of “Dis” to “nympha” and “Elf” as names
    applied to multiple orders of spirits.
  claim_level: same_function
  target: nympha and Elf as spirit-category terms
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is lexical and functional; the passage does not establish
    shared origin or historical transmission.
- id: claim:2
  claim: The passage presents “Dis” alongside Old English “Ides,” indicating a linguistic
    comparison between the terms.
  claim_level: linguistic_similarity
  target: Old English Ides
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the equivalence but also says the etymology of Dís
    is uncertain.
- id: claim:3
  claim: The passage compares “uvettir” with German “unhold” as terms for unholy or
    hostile dead or beings.
  claim_level: linguistic_similarity
  target: German unhold
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to terminology; the passage does not provide
    a broader historical argument.
- id: claim:4
  claim: The passage states that later ideas of the dead going to Walhall and Freyja-hall
    imitate the Christian heaven, after which land-wights are said to become fairy-like
    huldo-folk or unbaptized spirits.
  claim_level: historical_contact
  target: Christian heaven and later fairy or huldo-folk conceptions
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: This is an editorial historical interpretation within the passage and
    is not independently demonstrated there.
