canonical_text:
  quote: ''
  summary: 'The passage is an editorial discussion of Old Norse spirit terminology
    and belief: draug, Dísir, vettir, land-wights, blessed and unholy dead, rites
    for female spirits or ancestors, ship-prow prohibitions to avoid frightening land
    spirits, second-sighted reports of land-wights assisting chiefs, Egil’s invocation
    against an enemy, later reinterpretation of land-wights as fairy-like beings,
    and accounts of evil dead, vampires, necromancy, and wisdom sought from the dead.'
  language: English
  quote_policy: summarized
