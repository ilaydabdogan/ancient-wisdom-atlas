    treasure through the Waver-Lowe around Brunhild and to slay men she names.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: No man except Sigfred dares to ride through the fire, and Sigfred does so
    because his heart does not fail him.
  category: action
