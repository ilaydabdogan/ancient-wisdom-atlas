    her conduct with another woman’s good repute.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Brunhild denies secret meetings and shameful deeds, but says she would be
    willing to kill Gundhere; Hagoni sets her in fetters when she would have slain
