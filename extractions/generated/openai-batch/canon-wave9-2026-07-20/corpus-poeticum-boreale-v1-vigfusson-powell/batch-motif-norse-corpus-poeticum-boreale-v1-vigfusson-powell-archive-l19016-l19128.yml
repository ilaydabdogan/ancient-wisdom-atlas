- id: obs:9
  text: Brunhild says Gundhere will not see her merry in his hall again, nor drinking,
    playing, speaking gently, embroidering with gold, or giving counsel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Brunhild sits up, strikes her embroidery so that it tears apart, orders the
    bower-doors opened wide, and her lamentation is heard through the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gudrun asks why her bower-maidens are mournful, and Swafrfled answers that
    it is a day of mourning and the hall is full of lamentation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Swafrfled says she will not wake or speak with Brunhild, who has not drunk
    mead or wine for many days and has gotten the wrath of the Gods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Gudrun asks Gundhere and then Hagoni to go to Brunhild; each goes or is asked
    to go, but neither obtains an answer from her.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sigfred says a portent will come to great woe and that Brunhild will die;
