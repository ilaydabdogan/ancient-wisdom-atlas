canonical_text:
  quote: ''
  summary: Brunhild recounts a marriage condition involving a rider on Grani, Fafni’s
    treasure, passage through the Waver-Lowe/fire, and the slaying of named enemies.
    She declares that Sigfred, not Gundhere, fulfilled the feat and that she had vowed
    to love only the noblest man. She threatens death and vengeance, is restrained
    by Hagoni, renounces joy in Gundhere’s hall, tears her embroidery, and causes
    a general lamentation. Gudrun and household women discuss Brunhild’s mourning,
    refusal of drink, and apparent charmed sickness or sleep. Gundhere and Hagoni
    fail to get speech from her; Sigfred foresees great woe and Brunhild’s death,
    then goes to wake her.
  language: English
  quote_policy: summarized
