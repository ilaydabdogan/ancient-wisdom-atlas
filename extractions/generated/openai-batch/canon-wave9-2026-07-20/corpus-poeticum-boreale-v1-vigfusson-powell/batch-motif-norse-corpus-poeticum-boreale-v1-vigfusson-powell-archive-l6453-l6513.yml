  quote: ''
  summary: A sequence of translated gnomic stanzas gives advice on wooing, mistrust
    and deceptive speech, friendship and reciprocal gifts, secrecy, early rising,
    guest conduct, armed vigilance, courtly appearance, and restraint in company.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man seeking a lady’s grace is advised to speak fairly, offer gifts, and
    praise the maid’s form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage warns not to trust a maiden’s talk or any woman’s word, using
    the image of hearts wrought on a whirling wheel and falsehood planted in bosoms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says men’s minds toward women are false and that fair speech can
    conceal false intent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A friend is advised to be a friend to a friend and to repay gift with gift,
    laughter with laughter, and lies with lies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man is advised not to be a friend of his foe’s friend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Friends are said to gladden one another with gifts of weapons and raiments,
    and giving and giving back are said to make long friendships.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage gives an example in which a comrade was gained with half a loaf
    and the last drops of a cup, and states that a gift looks for return.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wise or well-bred man is instructed to ask, speak, and learn to answer
    questions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A secret is to be told to one person but not two; if three know, the whole
    world is said to know.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man with few workers should rise early and work, because sleeping away mornings
    brings hindrances and the wakeful man’s wealth is partly won.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: One who would win another’s chattel or life should rise early; the slumbering
    wolf does not get a joint, and the sleeping man does not get victory.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A guest is told not to remain always in the same house, because welcome becomes
    wearisome if he sits too long at another’s table.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man is told not to step beyond his weapons, since he may need his spear
    while on the path.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before entering, a man should inspect all doorways because foes may be sitting
    in another man’s house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man should eat before visiting a neighbor and should ride to court washed
    and fed, without shame over poor clothing, shoes, breeches, or horse.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A man should not boast of his wits, should keep watch over his mind when a
    wise and silent man enters a house, and should not make another person a gazing-stock
    in company.
  category: speech
  evidence_refs:
  - ev:10
