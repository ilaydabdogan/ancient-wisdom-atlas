canonical_text:
  quote: ''
  summary: The speaker laments that grief makes poetry difficult to utter. He describes
    poetry as Woden’s theft brought from Giant-land, recalls burial and the end of
    his kin-line, says the sea and sea-beings have bereaved him, imagines but rejects
    battle against Ran, Aegir, and the billows, and remembers a loyal son or kinsman
    who has gone to the path of Bliss and is associated with Woden’s gathering.
  language: English
  quote_policy: summarized
