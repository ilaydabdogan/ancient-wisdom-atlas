canonical_text:
  quote: ''
  summary: 'Editorial introduction and opening scenes of The Lay of Gripi: Sigurd
    comes to Gripi’s castle to ask his wise uncle about his fate. Geiti the warder
    announces him, Gripi receives him, and Gripi foretells Sigurd’s greatness, vengeance
    for kin, victory over the sons of Hunding, and future slaying of a dragon at Glisten-heath.'
  language: English
  quote_policy: summarized
