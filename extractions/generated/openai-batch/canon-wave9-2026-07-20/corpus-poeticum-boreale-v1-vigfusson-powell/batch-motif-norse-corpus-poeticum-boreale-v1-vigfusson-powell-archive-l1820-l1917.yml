canonical_text:
  quote: ''
  summary: 'The passage introduces two old Elfwine lays as early Teutonic epic poetry
    and then gives a translated account of The Youth of Elfwine: in battle Elfwine
    kills Thurismund, son of the Gefid king; because Lombard custom requires a king’s
    son to receive weapons from a foreign king before sitting with his father, Elfwine
    visits Thuriswend with forty youths. Thuriswend hosts him, seats him in the place
    of the slain son, restrains a quarrel after an exchange of insults, gives Elfwine
    Thurismund’s weapons, and sends him safely home, where Elfwine is admitted as
    his father’s guest and praised.'
  language: English
  quote_policy: summarized
