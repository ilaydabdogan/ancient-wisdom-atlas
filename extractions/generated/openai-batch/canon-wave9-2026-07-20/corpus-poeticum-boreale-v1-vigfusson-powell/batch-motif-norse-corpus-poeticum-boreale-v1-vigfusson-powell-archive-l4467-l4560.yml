canonical_text:
  quote: ''
  summary: 'The passage discusses a proposed old myth of a great bird that lays or
    hatches the world, linking Hene/Hohni with a white marsh bird and Heimdal. It
    then surveys several forms of Woden’s quest for a Holy Drink or wisdom: a drink
    brewed by dwarves, stolen and hidden by giants, recovered by Woden through craft,
    guarded by a giantess, a witch, Midvitnir in Hades, or Mim at a Burn of Wisdom
    beneath the Holy Tree. The passage also notes comparisons with Aristophanes, Accadian
    holy-water guardians, Tacitus’s report about Ulisses, and linguistic parallels
    for Woden’s name.'
  language: English
  quote_policy: summarized
