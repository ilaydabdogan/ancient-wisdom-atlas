- id: claim:3
  claim: The passage says the wandering god’s adventures led Roman traders to speak
    of him as Ulisses, suggesting a functional comparison between Woden as wandering
    wisdom-seeker and Ulysses as a wandering adventurer.
  claim_level: same_function
  target: Ulisses / Ulysses wandering-adventurer pattern
  evidence_refs:
  - ev:11
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports an interpretive identification and a Tacitus quotation;
