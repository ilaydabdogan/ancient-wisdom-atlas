canonical_text:
  quote: ''
  summary: The passage combines fragments concerning Helgi, Kara, and Sigrun. Hedin
    vows revenge before returning. Helgi, whose father was slain, is protected by
    Hagal, raised under another name among enemies, later discovered in disguise at
    a mill, and then avenges his father by killing Harding. Kara, a war-fairy, flies
    to Helgi after the battle, questions him about his ships and bloody armor, and
    recognizes him despite his evasive answers. A following fragment says Sigrun seeks
    Helgi after battle, asks his aid against her betrothed suitor Hodbrord, and declares
    that she loved Helgi before he saw her.
  language: English
  quote_policy: summarized
