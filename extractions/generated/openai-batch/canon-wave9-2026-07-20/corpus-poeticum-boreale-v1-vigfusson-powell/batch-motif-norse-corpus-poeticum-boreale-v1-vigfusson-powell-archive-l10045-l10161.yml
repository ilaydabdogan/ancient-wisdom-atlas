canonical_text:
  quote: ''
  summary: The passage opens with Sinfiotli raising a red, gold-rimmed shield and
    exchanging hostile flyting with Godmund. Godmund reports Helgi's approaching war-fleet
    to Hodbrord, who orders a levy. The armies meet at Wolf-Rock, where Helgi fights
    in the foremost ranks. Helmed fairies descend from heaven, and Sigrun, a winged
    war-fairy, hails Helgi's victory, rejects the dying Hodbrord, and Helgi remarks
    that some outcomes belong to the Fates.
  language: English
