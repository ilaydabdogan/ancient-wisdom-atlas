canonical_text:
  quote: ''
  summary: The passage combines brief Helgi-Sigrun material with the dramatic episode
    of Atli and Rimegerd. Helgi is linked with Sigrun despite kin-conflict and has
    slain enemies, including Hati, Rimegerd's giant father. By night at Hatefirth,
    Atli keeps watch over Helgi's ships while Rimegerd appears from the cliff and
    exchanges insults and threats with him. Rimegerd demands recompense from Helgi
    for Hati's death, but Helgi rejects her. She then reveals that a gold-bright/white
    foremost maiden and three nines of maidens protected the fleet; their horses shed
    dew and hail that bring fair seasons. Atli delays Rimegerd until daybreak, and
    she is turned to stone while the fleet remains safe.
  language: English
  quote_policy: summarized
