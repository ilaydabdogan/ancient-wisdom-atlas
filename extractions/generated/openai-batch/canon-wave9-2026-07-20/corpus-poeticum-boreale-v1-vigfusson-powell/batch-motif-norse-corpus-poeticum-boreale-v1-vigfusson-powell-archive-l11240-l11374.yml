canonical_text:
  quote: ''
  summary: Thor wakes to find his hammer missing. Loki borrows Freya's feather-fell,
    flies to Giant-land, and learns that Thrym has hidden the hammer and will return
    it only if Freya is brought as his wife. Freya refuses. The gods consult, dress
    Thor as a bride, and Loki accompanies him as bridesmaid. At the wedding feast,
    Thor's appetite and fierce eyes are explained away by Loki. Thrym orders the hammer
    brought to hallow the bride; when it is placed on Thor's lap, Thor seizes it and
    kills Thrym and the giants.
  language: English
  quote_policy: summarized
