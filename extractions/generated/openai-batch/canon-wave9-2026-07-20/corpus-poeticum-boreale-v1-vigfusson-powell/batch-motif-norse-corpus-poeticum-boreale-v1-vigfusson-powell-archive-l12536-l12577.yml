canonical_text:
  quote: ''
  summary: 'The passage gives moral and devotional counsels: invoke the Virgins of
    the Lord and God, avoid adding offences, repair harm done to those made to weep,
    and pray aloud for needs. It includes a first-person example of arriving too late
    at a judge''s door, warnings that sin brings fear and that deceitful people walk
    paths of fire, and witnessed examples of unstable wealth, a rich man''s burned
    house and death, and harmful words from an evil woman.'
  language: English
  quote_policy: summarized
