canonical_text:
  quote: ''
  summary: 'The passage is an introductory philological discussion of possible Celtic,
    pre-Celtic, or Ivernian influence on Norse poetic names and figures: Dog-men and
    the Hundings/Dogsons of the Helgi Lays; an oath sworn at the Unnar-stein; Ith,
    Magh-Ith, and Wolospa''s Ida-vdllr; and Brownies, Fairies, and a dwarf named Dwryn
    in Wolospa. The later portion recounts the editorial history and aims of the Corpus
    of Old Northern Poetry.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Professor Rhys is reported as speaking of Dog-men who are described as sons
    and slaves of the Dog and as part of a nomenclature associated with the pra-Celtic
    population of Great Britain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors state that this Dog-men nomenclature recalls the Hundings, glossed
    as Dogsons, in the Helgi Lays, and they attribute the resemblance to Ivernian
    influences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that 'ond' is pre-Celtic for stone and that the Helgi Lays
    include an oath sworn at the Unnar-stein, while also saying that swearing by a
    stone is un-Teutonic.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies Irish and Scottish place-names in Ith and Magh-Ith,
    glossed as the plain of Ith, and describes Ith as probably the Ivernian name of
    a tribal and ancestral deity.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The authors ask whether Wolospa's Ida-vdllr might be the same word as Ith.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage mentions Brownies and Fairies of Wolospa and notes that one dwarf
    bears the Welsh name Dwryn, then asks whether these are borrowed Celtic or pre-Celtic
    figures.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The later section says that the Editor and Translator proposed a Corpus of
    Old Northern Poetry to the Clarendon Press and that the work was divided into
    two volumes, one Eddic and one Court-poetry.
  category: sequence
  evidence_refs:
  - ev:5
