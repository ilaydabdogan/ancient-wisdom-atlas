canonical_text:
  quote: "“The backbone of Teuton-poetry is alliteration-stress”"
  summary: The passage is an editorial discussion of Old Northern and Teutonic metre.
    It classifies kennings as descriptive synonyms or similes, gives examples of complex
    martial kennings, criticizes overuse in Court-poetry, distinguishes Court-metre
    rules from older metres, and argues that Old Northern metrical theory must also
    account for Old English and Old German parallels.
  language: English
  quote_policy: quoted
