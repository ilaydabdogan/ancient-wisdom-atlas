    involving a sword in each verse-sentence or half-line.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that alliteration-stress is the backbone of Teuton-poetry
    and that alliteration remains necessary to the Icelandic popular ear, while rhyme
