canonical_text:
  quote: ''
  summary: 'The passage introduces and excerpts a didactic wisdom poem in which a
    mentor repeatedly counsels Loddfafni on conduct: travel, friendship, speech, women,
    magic, battle, hospitality, elders, and treatment of the poor. It also includes
    editor summaries of proverbial verses about weather, hidden strength, speech causing
    death, and Gleipni being fashioned from impossible substances.'
  language: English
  quote_policy: summarized
