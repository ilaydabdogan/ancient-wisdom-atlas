canonical_text:
  quote: ''
  summary: 'A Latin martial speech: a warrior says battle words must be matched by
    deeds, arms himself, urges no retreat and vengeance for a dear lord, recalls slaying
    Agner son of Ingell with the sword Snyrtir, praises the slain warrior who laughed
    at death and entered Elysium, describes killing an unnamed king’s son with the
    same weapon, and declares that noble warriors and Rolvo’s magnates have fallen
    while Pluto takes powerful souls.'
  language: Latin, with English/editorial headings and name labels
  quote_policy: summarized
