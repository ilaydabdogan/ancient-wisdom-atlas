candidate_motifs:
- id: motif:1
  label: wisdom songs and instruction
  taxonomy_refs:
  - wisdom
  basis: The passage gives counsel to Loddfafnir, refers to songs to be followed and
    trusted, and frames Woden’s adventures as lessons or ensamples.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:11
  confidence: high
  cautions: The passage is a fragmentary edited translation and contains editorial
    framing as well as translated poetic material.
- id: motif:2
  label: deceptive acquisition of sacred or inspiriting drink
  taxonomy_refs:
  - sacred_theft
  - wisdom
  basis: The passage says Woden came by the Holy Mead by beguiling Suptung and Gundfled;
    the translated fragment calls the mead fraud-bought and associates it with Odreari/Inspiration.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives only fragmentary details and relies partly on editorial
    summary.
- id: motif:3
  label: beloved or helper betrayed after aiding acquisition
  taxonomy_refs:
  - divine_beloved
  - sacred_exchange
  basis: Gundfled gives the speaker the precious mead, helps him return from Giant-town,
    and is later said to weep after Wodin’s betrayal.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage describes affection and betrayal but does not present a formal
    marriage or covenant.
- id: motif:4
  label: failed or obstructed nocturnal courtship
  taxonomy_refs:
  - stolen_beloved
  basis: Wodin is invited to come in the gloaming, but finds an armed, awake household
    and later only a hound tied to the woman’s bed.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The available taxonomy reference is approximate; the passage describes
    attempted unlawful love rather than an actual abduction of a beloved.
- id: motif:5
  label: ordeal on a tree for spells and a magic drink
  taxonomy_refs:
  - sacrifice
  - sacred_tree_axis
  - wisdom
  basis: The editorial note says Woden hangs nine days on a gallows-tree and thereby
    learns spells connected with bringing a magic drink out of Hell.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The actual verse text of the hanging episode is not included in this line
    range; the extraction rests on the editor’s summary.
- id: motif:6
  label: body part pawned for precious potion
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  - wisdom
  basis: The editorial note says Woden pawned one eye to Giant Mimi in the Brook of
    the Weirdsisters for the precious potion.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The note attributes this account to Volospa and Egil rather than giving
    the full narrative in the translated fragment.
- id: motif:7
  label: drink-induced loss and return of wits
  taxonomy_refs:
  - wisdom
  basis: The heron of forgetfulness steals minds at banquets, and the speaker comments
    on drunkenness and the return or loss of wits through drink.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is more a didactic image than a complete narrative motif.
comparison_claims:
- id: claim:1
  claim: The passage itself says the preserved fragment appears to be the beginning
    of a song like the Guest’s Wisdom.
  claim_level: same_function
  target: Guest’s Wisdom as a comparable didactic song
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The note says only that it is apparently similar; no detailed parallel
    is provided in the passage.
- id: claim:2
  claim: The passage identifies the Holy Mead episode as a popular story also told
    at length by Snorri in his Edda and known to Eyvind the Poet-spoiler.
  claim_level: same_motif
  target: Snorri’s Edda and Eyvind’s version of Woden acquiring the Holy Mead
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is based on the editor’s statement in this passage, not on
    comparison of the parallel texts themselves.
- id: claim:3
  claim: The passage says the author of Volospa and Egil also tell of Woden pawning
    one eye to Giant Mimi for the precious potion.
  claim_level: same_motif
  target: Volospa and Egil accounts of Woden’s eye pawn and precious potion
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes the parallel accounts without quoting them.
- id: claim:4
  claim: The passage says Ari the historian must have known the High One’s Lesson
    as a separate song because he paraphrases several verses in Ynglinga.
  claim_level: linguistic_similarity
  target: Ari’s Ynglinga paraphrases of the High One’s Lesson
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial inference based on paraphrase, and the relevant
