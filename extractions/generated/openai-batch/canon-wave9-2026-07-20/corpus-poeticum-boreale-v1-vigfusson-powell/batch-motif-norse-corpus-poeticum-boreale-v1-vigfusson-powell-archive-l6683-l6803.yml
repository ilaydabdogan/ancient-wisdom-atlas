canonical_text:
  quote: ''
  summary: 'The passage contains editorial notes and translated fragments associated
    with the Havamal collection: counsel to Loddfafnir; Woden’s love lessons, including
    the Billing’s daughter episode; Woden’s acquisition of the precious mead through
    Suptung and Gundfled; comments on drunkenness and forgetfulness; and editorial
    notices on the High One’s Lesson, where Woden hangs on a gallows-tree, learns
    spells, brings a magic drink from Hell, and is elsewhere said to pawn an eye to
    Giant Mimi for a precious potion.'
  language: English
