canonical_text:
  quote: ''
  summary: A Latin poetic fragment describes an assault on the Danes, denounces Hiarthvar
    as a traitor influenced by Sculda, laments the death of the king and the danger
    to the city, calls Ruta and Bjarco to battle, proposes using fire, orders loyal
    fighters into formation, and recalls the king’s defeat of Roric, a wealthy but
    avaricious man who tried to meet attack with gold and gifts rather than arms.
  language: Latin, with English editorial heading and notes
  quote_policy: summarized
