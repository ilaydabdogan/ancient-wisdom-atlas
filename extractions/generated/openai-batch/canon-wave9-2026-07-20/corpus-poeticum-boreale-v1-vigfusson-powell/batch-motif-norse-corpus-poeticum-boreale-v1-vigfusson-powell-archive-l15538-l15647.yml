canonical_text:
  quote: ''
  summary: 'Oddrun hears that Borgny is in difficult labour, rides to her, acts as
    midwife, chants charms, and the child is born while Borgny invokes Frigg, Freyja,
    and other powers. Oddrun then recounts her own griefs: her intended marriage to
    Gunnar, Brunhild''s fiery stronghold and death with Sigurd, Oddrun''s forbidden
    love for Gunnar, Atli''s discovery of that love, and Gunnar''s death in a snake
    pit despite Oddrun''s attempted rescue.'
  language: English
  quote_policy: summarized
