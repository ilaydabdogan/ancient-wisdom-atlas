  summary: The passage is an editorial discussion of Old Northern and Teutonic metre.
    It presents fragmentary examples from named lays, dialogue poems, charm songs,
    ritual and spell songs, law formulae, and Germanic legal materials. The editor
    argues that irregular charm and oath-like lines preserve older short alliterative
    formulae later displaced by a more regular Cedmonian line, while alliteration
    remains essential in Icelandic verse.
