canonical_text:
  quote: ''
  summary: The passage gives editorial notes on a damaged and transposed Norse lay,
    summarizes the story of Swanhild, Gudrun, Hamtheow, Sorli, Erp, and Ermanarik/Eormunrek,
    and presents verse in which Gudrun urges her sons to avenge Swanhild. The sons
    are armed, foresee their deaths, depart, meet and kill their half-brother Erp,
    and approach a hall by way of a wind-cold gallows/tree. The editorial summary
    also reports the later attack on Ermanarik and the brothers’ death by stones because
    steel cannot hurt their mail-protected bodies.
  language: English
  quote_policy: summarized
