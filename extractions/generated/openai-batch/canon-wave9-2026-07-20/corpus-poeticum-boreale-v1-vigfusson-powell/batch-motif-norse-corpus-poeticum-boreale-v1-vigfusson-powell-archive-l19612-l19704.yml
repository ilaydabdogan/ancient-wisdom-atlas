canonical_text:
  quote: ''
  summary: The passage introduces Ari as an authority for old Northmen's customs,
    then quotes saga material on an ancestral temple with high-seat pillars, holy
    nails, an altar-like table, an oath ring, and hlaut bowl and twigs. It describes
    temple tolls, priestly duties, sacrificial feasts, animal blood rites, ale banquets,
    ritual fires, hallowed toasts to named deities for victory, rule, seasons, and
    peace, remembrance cups for noble kin, and a Bragi-toast vow at an arval. A Kialnesinga
    Saga variant adds disputed details including a sacrificial well.
  language: English
  quote_policy: summarized
