canonical_text:
  quote: ''
  summary: A scholarly introduction discusses Ari’s stated use of genealogies, traditions,
    court-poetry, epic lays, and royal encomia as historical authorities; notes a
    discrepancy between detailed prose narratives and the hazy surviving verse cited
    to support them; and proposes that much court-poem text was later remodeled, leaving
    traces of an earlier fact-bearing text beneath the received wording.
  language: English
  quote_policy: summarized
