canonical_text:
  quote: ''
  summary: The passage gives editorial framing for The Lay of Skirni and excerpts
    from the poem. Frey is overcome by love for Gerda, a giant-maiden, and Skirni
    is sent as his servant-envoy to woo her. Skirni receives Frey's horse and self-fighting
    sword, crosses dark and fiery barriers into Giant-land, and approaches Gerda's
    hall. Gerda first offers hospitality but refuses Skirni's gifts of golden apples
    and a self-multiplying ring. Skirni then threatens her with a rune-marked blade,
    violence against her father, and a magic curse of isolation and misery. The prose
    note says Gerda is made to consent at the cost of Frey's charmed sword, leaving
    Frey weaponless at the Last Battle. The passage also preserves preceding lines
    in which Thor threatens Loki and Loki curses Eager's banquet with flame.
  language: English
  quote_policy: summarized
