canonical_text:
  quote: ''
  summary: A prefatory note says the lost framework makes the scene and figures uncertain,
    but identifies the speaker probably as Woden in a wise counsellor role. The poem
    then presents the High One speaking from a wisdom-seat and recounting an ordeal
    on a tree, acquisition of mysteries, songs, staves, mead, and wisdom. It catalogs
    charms for healing, protection, freeing bonds, stopping weapons and fire, calming
    sea and wind, confusing witches, battle protection, speaking with a hanged corpse,
    water-sprinkling for invulnerability, divine knowledge, love, and secret knowledge,
    ending with praise for the speaker, knower, learner, and listeners.
  language: English
  quote_policy: summarized
