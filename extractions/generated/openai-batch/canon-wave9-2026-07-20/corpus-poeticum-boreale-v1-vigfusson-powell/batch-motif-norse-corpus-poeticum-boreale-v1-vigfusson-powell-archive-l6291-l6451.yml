canonical_text:
  quote: ''
  summary: A sequence of gnomic stanzas gives counsel on home, hospitality, generosity,
    companionship, friendship, speech, fire, health, survival, sons and memorials,
    mortality and reputation, wealth, folly, moderation, wisdom, fate, and love.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Home is described as best even when it is only a cottage; a person is said
    to be a person in his own house, while begging for every meal is painful.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes food-giving, boons, expected return, ale, hams, and
    the risk that an unwelcome guest misses the feast.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first-person speaker says that when young he travelled alone, went astray,
    and was happy on meeting another person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says he gave raiment to two wooden men in a field, and adds that
    a naked man is bashful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An unloved man is compared with a young fir in a court without protective
    bark or shoots, and a comradeless man is compared with an eagle at the sea.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Friendship between ill friends is described as flaring hotter than fire for
    five days and being slaked on the sixth; speech and shared confidence are presented
    as ways people draw near.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Fire, sunlight, health, and a guileless life are named as good things for
    people; living is preferred to death, and several bodily impairments are contrasted
    with burial.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A son born after his father’s death is said to be better than none, and roadside
    stones are described as usually raised by a son for a father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chattels, kinsmen, and the self are said to die, while good report or a dead
    person’s name is said not to die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A rich man’s dwelling is seen consumed by fire, with the man himself dead
    before the door.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Repeated maxims describe the fool as fearing battle yet still subject to old
    age, lying awake with worry, mistaking smiles for friendship, lacking advocates
    in court, speaking too much, and becoming proud with wealth or love.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A king’s son is advised to be silent, thoughtful, and daring in battle; people
    with foresight are advised to use power moderately because no one is peerless.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage advises being middling wise rather than over-wise, and says that
    a person should not know his fate beforehand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says love should not be blamed in another, because love can turn
    people from wise to foolish.
  category: speech
  evidence_refs:
  - ev:6
