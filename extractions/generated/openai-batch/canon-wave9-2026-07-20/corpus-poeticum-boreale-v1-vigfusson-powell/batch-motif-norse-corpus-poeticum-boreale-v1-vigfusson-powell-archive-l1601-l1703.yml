canonical_text:
  quote: ''
  summary: The passage describes the transmission, preservation, loss, physical form,
    provenance, and later editorial use of several Icelandic manuscripts, especially
    Hawk’s-book and Flatey-book. It notes copied fragments, heirloom ownership, gift-transfer
    to Bishop Bryniolf and the King, scribal work by John Thordarson and Magnus Thorhallsson,
    the addition of genealogical material including the Lay of Hyndla, later insertion
    of Harold Hardrede’s Saga, and the scattered manuscript witnesses for court-poetry.
  language: English
  quote_policy: summarized
