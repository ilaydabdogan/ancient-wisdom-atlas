canonical_text:
  quote: ''
  summary: 'A sequence of short scholia and anecdotes: a bird-wise yeoman exposes
    a king’s hidden acts; dreams and visions show Death, tormented souls, a serpent,
    blood-stained Walkyries or hags, and grey-hooded portents; a queen exchanges her
    twin sons with a bondmaid’s child until a poet identifies the true royal sons;
    further Icelandic anecdotes concern heroic boasting, landfall and departure verses,
    a curse after trespass, a dream-prophecy of Greenland disaster, a boy killing
    a bear, a cairn-breaker taking a belt-clasp from a barrow, praise of Ingolf’s
    beauty, and a swimming champion rejecting charm-amulets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king arranges for a yeoman’s horse to be killed secretly, seats the yeoman
    on the skull, and rows while speaking with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three crows fly over and caw; the yeoman reacts increasingly strongly and
    reports that the oldest bird says he is sitting on his mare’s skull and that the
    king stole his cattle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man in Iceland dreams of a black, hideous figure who names himself Death
    that walks and says he slays men and feeds on corpses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After sleeping again, the dreamer sees the same figure singing of sinful souls
    fluttering between worlds and spirits tortured in the jaws of the Serpent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two Walkyries, described as degraded to hags, sit blood-dabbled in a hall
    that rocks sideways while blood falls on them from above.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: One of the blood-dabbled figures sings that it is raining blood, names the
    pair War and Battle, and speaks of going to Raft-lithe before the fall of men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another dream shows two black-clad men with grey hoods sitting hand in hand
    in a small room, rocking so violently that the walls nearly fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The grey-hooded figures sing that peace does not last when they come in and
    that dishonourable deeds will be reckoned at the last day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the portent visions refer to the Civil Wars of Iceland.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: King Hior’s wife bears twin sons while he is away; her bondmaid bears a fair
    son, and the queen exchanges the children so the thrall-child is raised as a prince.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Old Bragi observes the three boys and tells the queen that Hamund and Geirmund
    are Hior’s sons, while Leif is Shag-hood’s son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The queen presents the two dark-skinned boys to the king; he rejects their
    appearance, but they later grow into famous men and found a notable Icelandic
    family.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Wemund chants at his forge that he alone has overcome and slain eleven men,
    while urging his brother to blow harder.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Several verses are tied to travel or settlement: Hallstan greets Iceland
    after his father’s death, and Thori speaks while sailing away from Cold-Side.'
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Thorleif threatens that Boggwi will be hacked apart as Boggwi hacked a herb-bag,
    strap, and garment after trespass on Boggwi’s land.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Snowbiorn’s dream-prophecy foretells death, frost, cold, horrors, and slaying
    in the north-west ocean near Greenland exploration.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Heriwolf, as a boy, kills a wood-bear because it killed one of his goats.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: A cairn-breaker says he leapt into an old barrow and carried away the clasp
    of Corn’s belt.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: A ditty says maids, a child, and an old crone all wish to go with the beautiful
