canonical_text:
  quote: ''
  summary: Editorial introduction to Book II and the opening portion of Vafprudnis-mal.
    The passage frames the poem as didactic mythology concerning cosmogony and cosmography,
    then presents Woden consulting Frigg, traveling under the name Ganger to the giant
    Wafthrudni’s hall, entering a wisdom contest with a wager of heads, and answering
    or asking questions about day, night, cosmic boundaries, the final battlefield,
    the making of the world from Ymis, and the origins of celestial and seasonal cycles.
  language: English
  quote_policy: summarized
