canonical_text:
  quote: ''
  summary: The passage surveys seventeenth-century scholarly theories about the Edda.
    It describes Magnus Olafsson's proposal that the extant Edda is only a compendium
    of an older, lost Edda or book of stories composed by the Anses or their grandsons.
    The passage notes that unexplained names of Woden, sea-kings, and ogresses may
    indicate lost legends and faded myths. It then describes Bishop Bryniolf's acceptance
    of the theory, replacing the Anses with Saemund as the supposed author, and his
    lament over lost treasuries of knowledge preserved only as a shadow or footprint
    by Snorri's compendium.
  language: English
