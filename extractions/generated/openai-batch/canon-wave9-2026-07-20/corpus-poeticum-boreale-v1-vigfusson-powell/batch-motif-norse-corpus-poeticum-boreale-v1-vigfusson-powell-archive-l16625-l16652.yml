canonical_text:
  quote: ''
  summary: Gudrun speaks of forced kinship, Sigurd’s death, widowhood, and bitter
    entry into Atli’s household. Atli answers her and asks for honorable treatment
    at burial. Gudrun promises a ship, a stained coffin, a waxed shroud, and all necessary
    funeral provisions. Atli dies, his kinsmen grieve, Gudrun fulfills her promise,
    and she later attempts self-killing but is spared until another death. The poet’s
    epilogue praises Giuki for begetting such a bold lady and says the tale of Gudrun
    and Atli’s quarrel will endure widely.
  language: English
  quote_policy: summarized
