canonical_text:
  quote: ''
  summary: 'A first-person speaker says he entered the Place of Torment and reports
    a sequence of hell-visions: souls as scorched birds, fiery dragons, cosmic beings
    from different directions, punished women, and multiple classes of condemned men
    whose torments correspond to named sins. The passage ends with a moral statement
    that sins become penance and pain follows pleasure.'
  language: English
  quote_policy: summarized
