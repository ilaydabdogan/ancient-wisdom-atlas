canonical_text:
  quote: ''
  summary: 'The passage contains the close of an exchange involving Freya and Houndling:
    Freya orders a cup of remembrance for her boar, Houndling insults her and speaks
    of fire over the Deep and Earth, and Freya counters an ominous drink with blessing
    for Othere. It then shifts to editorial prose and the opening of Rigs-pula, describing
    the poem’s manuscript state, its concern with the origins of social orders, Heimdal/Righ’s
    threefold wandering, and Righ’s first household visit to Al and Edda, where he
    sits and lies between them for three nights.'
  language: English
  quote_policy: summarized
