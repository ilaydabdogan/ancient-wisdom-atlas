  summary: 'Editorial discussion of Old Northern Court-metre: its relation to Bragi
    and Thiodwolf, its six-measure line structure, alliteration, stress and rhyme
    rules, pronunciation notes, quantity rule, and organization into couplets, stanzas,
    loose verses, short poems, and burden-poems.'
