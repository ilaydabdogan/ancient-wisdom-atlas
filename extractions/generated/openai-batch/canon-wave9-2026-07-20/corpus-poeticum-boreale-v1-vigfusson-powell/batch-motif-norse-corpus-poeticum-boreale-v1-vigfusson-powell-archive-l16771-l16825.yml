canonical_text:
  quote: Woden is wroth with you!
  summary: In a fragmentary lay, Angantheow offers Hlod extensive wealth, followers,
    and partial rule rather than dividing the heritage or Tyrfing. Gizur insults the
    offer, Hlod seeks Humli’s aid for vengeance, Wormbere brings a defiant message
    describing devastated Gothic lands and a slain sister, and Gizur volunteers to
    challenge the Huns, casting a spear and declaring Woden’s wrath against them.
  language: English
  quote_policy: quoted
