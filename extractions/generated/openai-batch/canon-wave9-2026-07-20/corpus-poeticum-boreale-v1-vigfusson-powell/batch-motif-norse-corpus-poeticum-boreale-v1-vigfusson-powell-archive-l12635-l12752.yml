canonical_text:
  quote: ''
  summary: 'The passage introduces Hymis-kvida as a poem about two adventures of Thor:
    hooking the Sea-Serpent and carrying off a cauldron. The translated narrative
    begins with the gods feasting at Eager''s hall and needing a cauldron large enough
    to brew ale for all. Tew tells Thor that the giant Hymi owns such a cauldron at
    the ends of heaven. Thor and Tew travel to Hymi''s hall, encounter a nine-hundred-headed
    granddam and a protective giant-wife, and face Hymi''s hostile arrival. Thor eats
    three oxen and then prepares to row out fishing, taking a bull''s head for bait.'
  language: English
  quote_policy: summarized
