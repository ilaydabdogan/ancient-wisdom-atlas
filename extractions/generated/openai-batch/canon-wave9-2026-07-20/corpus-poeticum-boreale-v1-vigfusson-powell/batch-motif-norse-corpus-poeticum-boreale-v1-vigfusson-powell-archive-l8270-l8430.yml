canonical_text:
  quote: ''
  summary: The passage introduces mnemonic mythological verses as instructional lists,
    gives fragments naming mythic best things, horses, oxen, a moon-pail, a tree-glass,
    dwarves, fates, valkyries, heroes with steeds, Woden’s ravens, and names of Woden,
    then introduces Alviss-mal as a poem in which a dwarf claiming Freya as bride
    is delayed by questioning until sunrise turns him to stone.
  language: English
  quote_policy: summarized
