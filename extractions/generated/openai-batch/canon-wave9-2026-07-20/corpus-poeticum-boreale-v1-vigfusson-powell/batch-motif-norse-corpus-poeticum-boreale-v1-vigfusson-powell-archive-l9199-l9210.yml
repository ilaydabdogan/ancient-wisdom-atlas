  summary: A dialogue passage in which Thor repeatedly commands an adversary, identified
    or addressed as Loki in part of the passage, to be silent and threatens him with
    Miollni/Mjollnir, his hammer. The interlocutor taunts Thor as Earth's son, refers
    to Thor's future fight with the Wolf who will swallow Woden, and recalls Thor
    crouching in a glove-thumb during eastern journeys. Thor again threatens to strike
    with the hammer called the killer of Rungni, and the final speaker says he means
    to live a long life.
