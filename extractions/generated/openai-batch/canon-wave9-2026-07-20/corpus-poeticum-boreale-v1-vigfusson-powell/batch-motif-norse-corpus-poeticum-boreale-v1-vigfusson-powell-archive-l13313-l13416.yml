  quote: ''
  summary: The passage contains the birth, naming, training, recognition, conquest,
    marriage, descendants, and spell-knowledge associated with Earl and Kin-the-young
    in the Lay of Righ, followed by editorial material introducing Ynglinga-tal as
    a royal genealogy attributed to Thiodwolf and as a poem used to magnify a kingly
    family by tracing descent to gods and Frey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After nine months, Mother bears a boy, swaddles him in silk, sprinkles him
    with water, and names him Earl; he is described with yellow hair, rosy cheeks,
    and eyes compared to a young serpent's.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earl grows up practicing shield-making, bow work, arrows, javelin, lance,
    horse-riding, dice, sword-fencing, and swimming.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Righ the Walker comes from the copse, teaches Earl spells, gives him his own
    name, acknowledges him as son, and grants him ancestral Udal-fields.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Earl rides through Mirkwood and the Holy Hills to a hall and displays martial
    actions with shaft, shield, horse, and sword.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Earl wages war, wins lands, rules eighteen townships, and distributes wealth,
    steeds, and rings among his people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Messengers ask Lord for his daughter Erla; she is brought home and married
    to Earl under a fine-linen veil, and the couple has named sons and daughters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Earl's sons grow up practicing horse-breaking, shield-rimming, shaft-smoothing,
    and ash-spear planing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kin-the-young knows hidden things, everlasting mysteries, mysteries of life,
    ways to save lives, blunt sword edges, still the sea, understand birds, quench
    fire, stop bleeding, allay sorrows, and has the strength of eight men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Earl matches spells with Righ, overcomes him by cunning, outdoes him, enters
    his heritage, and receives the surname Righ the Spell-wise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kin-the-young stuns birds with a bird-club; a crow speaks from a bough and
    tells him that he should instead ride, fight armies, and note Dan and Danp's higher
    heritage and warlike skills.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The cited prologue says Thiodwolf made the Genealogy of the Ynglings for King
    Reginwald, naming thirty forefathers and giving the death and burial-place of
    each; the passage states that Ynglinga Saga is founded on this poem.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: The editorial discussion says the poem is composed to magnify a king's family
    by tracing it through thirty generations to the gods at Upsala and to Ingowin-Frey.
  category: other
  evidence_refs:
  - ev:11
- id: obs:13
  text: The editorial discussion says Thiodwolf strings famous kings of various races
    and times together regardless of chronology, and remarks that Greek and Norse
    genealogies lose themselves among giants and gods.
  category: other
  evidence_refs:
  - ev:11
