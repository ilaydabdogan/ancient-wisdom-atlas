  summary: The passage surveys examples where Norse and Icelandic prose sources cite,
    paraphrase, or reshape older Eddic and heroic lays. It then quotes episodes from
    Hromund Gripsson’s Saga involving Helgi, Cara in swan form, magic and battle luck,
    an editorial aside on a magic sword and related borrowed episodes, Hagal’s concealment
    by an old woman, and Blind’s animal dreams interpreted by King Harding.
