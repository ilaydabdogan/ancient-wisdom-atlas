  text: The passage says fixed-weight rings are used for wages and trade, and also
    notes references to English coined money and a penny in named songs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists Gaelic words scattered through the songs, including words
    glossed as dish, oats, darkness, earth, well, and water.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tapestry-poet is said to use words for Huns and Hunnish as vague terms
    for foreign peoples, compared with earlier use of a term for Gauls.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Helgi-poet is described as giving ships a large role, with fleet movement,
    storm handling, waves over the bows, shielded bulwarks, a groaning hull, harbour
    marks, docks, a golden war-standard, forecastle tents, and a wicker shield used
    as a war-token.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes a captain at the tiller and a pilot or sound-warder
    in the forecastle who cons the ship in and warns the captain of danger.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wicker shield is identified as non-Norwegian and characteristically Irish,
    and the word for ship is described as foreign.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists unusual law and custom terms for judge, daysmen, inheritance,
    escheated estate, head-money, boot-money, battle summons, law ordeal, sacrifice
    or victim, wedding under linen, spreading a coverlet, and husband and wife.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The editor contrasts the poems with Icelandic Sagas, saying the Sagas have
    flesh-and-blood characters and homely incidents, while these poems show ideal
    beauty, an aerial unearthly fairy world, and love of nature.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage lists yew-trees, harts, wolves, hunting with hounds, and bird-clubbing
    as non-Icelandic details in the poems.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage describes ladies in bowers working gold tapestry and lofty castles
    or forts as medieval in tone, and says Scandinavia was not medievalised at the
    relevant period.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says hazel, oak, ash, thorn, and willow are unsuitable for Norway,
    while fir and birch are identified as characteristic Norwegian trees.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The final paragraph associates the Helgi poems with budding chivalry, the
