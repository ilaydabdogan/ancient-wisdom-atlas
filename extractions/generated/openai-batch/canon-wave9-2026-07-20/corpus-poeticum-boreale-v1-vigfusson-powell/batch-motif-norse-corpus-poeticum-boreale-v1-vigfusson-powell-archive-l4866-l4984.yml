  summary: The passage is an editorial introduction discussing archaic case endings,
    article forms, prepositions, and normalized proper-name forms. It then describes
    matter excluded from the edition, especially Hatta-lykill, Hatta-tal, poems associated
    with sagas, a footnoted catalogue of heroes, a note that the Helgi story was known
    in the West despite a corrupt Stockholm manuscript, and Hugsvinnz-mal as a translation
    of Cato’s Moralia in old Dialogue metre.
