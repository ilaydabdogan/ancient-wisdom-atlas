canonical_text:
  quote: ''
  summary: 'A paraphrased heroic-historical account explains the murder of Elfwine,
    king of the Lombards: after insulting Queen Rosamund with a skull-cup made from
    her father’s skull, he is killed through a conspiracy involving Rosamund, Helmgisl,
    and Beartheow. The passage continues with flight to Ravenna, theft or transport
    of the Lombard hoard, a poison-cup episode ending in the deaths of Rosamund and
    Helmgisl, and a reported sequel about Beartheow at Constantinople.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces the account as Paul the Deacon’s paraphrase of the
    song concerning the murder of Elfwine, king of the Lombards.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a wine banquet in Verona, Elfwine orders Rosamund to drink from a cup made
    from the skull of King Cynemund, her father.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator reports that Paul had seen Radgisl holding and showing the skull-cup
    at a feast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rosamund grieves over the insult and seeks to avenge her father’s death by
    arranging the slaughter of her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rosamund consults Helmgisl, the king’s shieldbearer and foster-brother, and
    Helmgisl advises that Beartheow be drawn into the plot.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rosamund secretly takes the place of Beartheow’s bed-partner by night; after
    Beartheow unwittingly lies with her, she reveals herself and tells him he must
    kill Elfwine or be slain by Elfwine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rosamund orders silence in the king’s house, removes the weapons, and binds
    Elfwine’s sword to the bed; Helmgisl brings Beartheow into the room, and Elfwine
    defends himself with a footstool before being killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Elfwine is buried under the stairs near the palace, and a later duke opens
    the tomb and removes the sword and other gear found there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Elfwine’s death, Helmgisl attempts to take the kingdom but is opposed
    by the grieving Lombards; Rosamund asks Longinus of Ravenna for a ship, and she
    and Helmgisl flee by night with Elfswintha and the Lombard hoard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Longinus seeks to persuade Rosamund to kill Helmgisl and marry him; Rosamund
    gives Helmgisl poison after his bath, and Helmgisl forces her to drink the remainder,
    so both die.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Longinus sends Elfswintha and the Lombard hoards to Constantinople to the
    emperor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A reported version says Beartheow went to Constantinople, slew a great lion,
    was blinded by imperial command, hid knives in his sleeves, and killed two imperial
    noblemen sent to hear his message.
  category: sequence
  evidence_refs:
  - ev:10
