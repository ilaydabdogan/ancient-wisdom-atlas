- id: motif:2
  label: wife conspires to kill husband for father’s death
  taxonomy_refs: []
  basis: Rosamund is described as avenging her father’s death through the planned
    slaughter of Elfwine, her husband.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No divine or supernatural kinship element is stated.
- id: motif:3
  label: sexual deception binds unwilling accomplice
  taxonomy_refs: []
  basis: Rosamund uses bed-substitution to make Beartheow believe he has lain with
    another woman, then reveals herself and compels him to kill the king or face death.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The language is coercive and moralizing; the extraction keeps to the literal
    plot function.
