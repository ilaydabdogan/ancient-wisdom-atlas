canonical_text:
  quote: ''
  summary: The passage introduces and excerpts Grotta-Song. It distinguishes Frodi's
    Gold Mill legend from a related Salt Mill tale, then narrates how the seeresses
    Fenia and Menia, giant-maidens held in bondage by King Frodi, are forced to grind
    at a magical mill. They first grind wealth, joy, and peace, then in anger grind
    curses and war, recount their giant ancestry and battle deeds, and prophesy the
    burning of Frodi's hall and vengeance by Rolf Kraki for Halfdan.
  language: English
  quote_policy: summarized
