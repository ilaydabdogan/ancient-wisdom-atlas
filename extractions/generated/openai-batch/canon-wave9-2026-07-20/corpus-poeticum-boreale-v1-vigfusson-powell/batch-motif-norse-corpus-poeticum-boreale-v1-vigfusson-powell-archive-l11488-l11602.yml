  source_text_path: texts/public-domain/norse/internet-archive/corpus-poeticum-boreale-v1-vigfusson-powell.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 11568-11580
  quote_or_summary: The maidens say they entered battle in Sweden, tore mailcoats,
    hewed shields, drove through ranks, pulled down and set up kings, helped Gothworm,
