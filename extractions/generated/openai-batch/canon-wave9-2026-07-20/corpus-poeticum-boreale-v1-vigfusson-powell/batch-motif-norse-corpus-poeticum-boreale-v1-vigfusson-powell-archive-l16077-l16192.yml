canonical_text:
  quote: ''
  summary: Gudrun sees the slain Sigurd and weeps. Goldrand remarks on the greatness
    of Gudrun and Sigurd's love. Gudrun praises Sigurd above other lords, accuses
    the sons of Giuki of causing her misery, and curses Gunnar's gold and rings because
    of his oath to Sigurd. Brunhild and Goldrand exchange accusations, and Brunhild
    names Atli and the sight of Sigurd's spoils or Fafnir's hoard as connected with
    the woe. Editorial prose introduces Gudrun's Chain of Woe as a separate poem in
    which Gudrun prepares for a funeral pyre, recounts her sorrows, names three husbands,
    recalls Sigurd's death, her marriage to Atli, a revenge involving the Hniflungs,
    an attempted drowning thwarted by fate, and her third marriage to Jonakr.
  language: English
  quote_policy: summarized
literal_observations:
