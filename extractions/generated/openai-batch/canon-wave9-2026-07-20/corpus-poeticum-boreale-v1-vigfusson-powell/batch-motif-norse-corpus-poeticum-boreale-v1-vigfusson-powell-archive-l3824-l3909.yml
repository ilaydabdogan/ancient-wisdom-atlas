canonical_text:
  quote: ''
  summary: The passage gives examples of textual corruption and emendation in Old
    Norse poetic and saga texts. It argues that manuscript inspection, attention to
    scribal habits, alliteration, sound resemblance, and parallels from other poems
    or prose can recover readings that were obscured by copyist error, unfamiliar
    words, bad hearing, or faulty memory.
  language: English
  quote_policy: summarized
