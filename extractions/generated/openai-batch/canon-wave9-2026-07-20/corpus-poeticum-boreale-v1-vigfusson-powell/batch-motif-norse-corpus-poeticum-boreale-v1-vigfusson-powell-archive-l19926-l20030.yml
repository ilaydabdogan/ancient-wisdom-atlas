candidate_motifs:
- id: motif:1
  label: Human sacrifice to gain a boon or avert peril
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage explicitly generalizes that sacrifices occur when an important
    object is to be gained or peril averted, and gives examples involving seasons,
    long life, victory, storm, and timber.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage is scholarly synthesis; some cited examples are described
    as legendary or doubtful.
- id: motif:2
  label: Sacrifice for good seasons during famine
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: The Doomwald episode links escalating sacrifices during famine to the aim
    of obtaining good seasons.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents this as vernacular tradition rather than direct historical
    report.
- id: motif:3
  label: Child or kin sacrifice to a deity for life, victory, storm, or material gift
  taxonomy_refs:
  - sacrifice
  - divine_parent_child
  - sacred_exchange
  basis: Ani devotes sons for long life; Earl Hakon and Hallstan are described as
    sacrificing sons for battle advantage or Thor's gift of driftwood.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The Hakon case is explicitly called doubtful, and the Hallstan case is
    called no more authentic.
- id: motif:4
  label: Self-dedication to a god for battlefield victory
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: King Eric gives himself to Woden when battle goes against him and receives
    ten years of victory in the account.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage frames this as a legend centered on the Fyris-field fight
    and calls it Faust-like.
- id: motif:5
  label: Blood consecration of ship launch or expedition
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The hlunn-rod practice binds victims to rollers so that a war-galley's stem
    is sprinkled with blood at launch or when an expedition sets out.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives comparative parallels and calls later legends mangled
    accounts; historical specificity needs review.
- id: motif:6
  label: Execution as devotion to an offended god
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: The passage states that executions may have been devotions of doomed criminals
    to the god they offended.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The statement is an inference by the authors, not a narrated mythic episode.
- id: motif:7
  label: Vowed life as substitute offering for human sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: At the Great Moot, Christians respond to a heathen plan for human sacrifices
    by making a victory-gift to Christ through vows to purer life.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage presents this as a Christian counter-practice, not as a direct
    continuation of heathen sacrifice.
- id: motif:8
  label: Private vengeance-offering through blood-eagle execution
  taxonomy_refs:
  - sacrifice
  basis: Blood-eagle making is described as a cruel death and a private vengeance-offering,
    though its exact significance is said to be lost.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage explicitly states that the rite's exact significance is lost
    and notes uncertainty about related traditions.
comparison_claims:
- id: claim:1
  claim: The passage cautiously suggests that Woden's spear-marking may echo the Longinus
    story, but also says such markings are commonly remnants of old sacrificial rites.
  claim_level: visual_similarity
  target: Longinus-story
  evidence_refs:
  - ev:1
  counter_evidence_refs:
  - ev:1
  confidence: low
  limitations: The passage uses 'perhaps' and offers an alternative explanation in
    older sacrificial markings.
- id: claim:2
  claim: The passage compares the hlunn-rod war-galley blood consecration with practices
    Cook found in the South Seas, treating them as functionally similar launch or
    expedition sacrifices.
  claim_level: same_function
  target: South Seas launch sacrifice practice observed by Cook
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the editorial comparison is available in the passage; no independent
    details of the South Seas practice are supplied here.
- id: claim:3
  claim: The passage states that the Hedin and Hagena legend, like that of Iason,
    preserves mangled accounts of the same kind of launch sacrifice.
  claim_level: same_motif
  target: Hedin and Hagena legend and Iason legend
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself calls the accounts 'mangled,' so the comparison
    is presented as uncertain.
- id: claim:4
  claim: The passage compares Earl Hakon's sacrifice of his son in battle to Mesha's
    sacrifice, implying a similar function of child sacrifice in a military crisis.
  claim_level: same_function
  target: Mesha's son-sacrifice in battle crisis
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The Hakon tradition is explicitly described as doubtful, and the passage
    gives no details about Mesha beyond the comparison.
- id: claim:5
  claim: The passage analogizes warship blood consecration to the custom of consecrating
    a large building by burying a human victim under main posts or a cornerstone,
    while stating that no trace of this building custom is found in Norse sagas or
    poems.
  claim_level: same_function
  target: foundation sacrifice beneath building posts or cornerstone
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: The passage explicitly denies evidence for this custom in the Norse
    sagas or poems.
- id: claim:6
  claim: 'The Great Moot episode compares two functional responses to religious crisis:
    heathen proposed human sacrifices and Christian vows offered as a victory-gift.'
  claim_level: same_function
  target: heathen human sacrifice proposal at the Great Moot
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The two actions are contrasted within the passage, but the Christian
    vow is not a killing and should not be treated as identical to human sacrifice.
