canonical_text:
  quote: ''
  summary: Scholarly discussion of sacrificial practices and traditions among the
    Old Northmen, including marking with Woden's spear, sacrifices associated with
    Thor, royal and child sacrifices for boons, warship consecration with victims'
    blood, rival heathen and Christian vows at the Great Moot, execution as devotion
    to an offended god, and the blood-eagle as a vengeance-offering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage discusses Woden being marked by a spear “himself to himself,”
    and states that the spear is characteristic of Woden as the hammer is of Thor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Thorsness, the cited saga passage describes a doom-ring, Thor's stone inside
    it, victims whose backs were broken on the stone, and blood still visible on the
    stone.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says little is heard of drowning rites except traditions of fastening
    men to reefs at low tide, and it also places a pit by the gallows at the west
    door of Walhall.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that late or authentic human sacrifices are presented in
    cases where an important object was to be gained or a great peril averted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Doomwald tradition, famine leads first to sacrifice of oxen, then to
    human sacrifices, and finally to the sacrifice of the king for good seasons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ani is described as devoting nine sons one by one to Woden for long life,
    until the Swedes intervene to save the tenth and the old king dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: King Eric is said to have given himself to Woden during battle for ten years
    of victory.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The hlunn-rod or roller-reddening practice is described as binding victims
    to rollers over which a war-galley was run so that the stem was sprinkled with
    blood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: According to a doubtful tradition, Earl Hakon sacrificed his son during the
    Iomswicking Battle, raised a magic storm, and won the day.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hallstan is said in Landnama-bok to have sacrificed his son to Thor, after
    which Thor sent an immense driftwood log for hall fittings and pillars.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the Great Moot, the heathen party proposed sacrificing two men from each
    quarter, while Christians offered a 'victory-gift' to Jesus Christ through vows
    by high-born men to live a purer life.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage presents execution as possibly a devotion of the criminal to an
    offended god and identifies blood-eagle making as a private vengeance-offering.
  category: other
  evidence_refs:
