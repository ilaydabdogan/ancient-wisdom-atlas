canonical_text:
  quote: ''
  summary: The passage first closes a praise poem for Arinbiorn, emphasizing his gold-giving
    generosity and the speaker’s lasting poetic memorial in the court of Bragi/Woden.
    It then introduces Sona-torrek, describing Egil’s grief over the deaths of his
    sons Gunnar and Bodwar, his refusal of food, his daughter’s intervention, and
    the consoling composition of a dirge. Editorial notes summarize the poem’s themes
    of family loss, isolation, the Sea Giant’s taking of Bodwar, reproach of Woden,
    and acknowledgment of song as Woden’s gift.
  language: English
  quote_policy: summarized
