canonical_text:
  quote: ''
  summary: Gudrun hears bad news, casts off ornaments, warns the Hniflungs that fate
    cannot be escaped, then fights for her kinsmen. A long battle leaves many dead.
    Atli and Gudrun exchange accusations; Atli orders Hogni tortured and Gunnar given
    to snakes. Hialli is nearly substituted, but Hogni asks that he be spared and
    bears torture bravely. Gunnar plays a harp with his toes before death. Atli taunts
    Gudrun and offers compensation, but she refuses, saying her brothers cannot be
    recompensed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gudrun is roused by bad news, tears away her necklaces, flings down silver,
    goes out of the hall, and greets the Hniflungs while saying she had tried to keep
    them at home and that no one can flee fate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gudrun throws off her mantle, takes a naked sword, and fights for the life
    of her kinsmen, striking down warriors and maiming Atli’s brother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hniflungs fight from morning until after midday, riving mail-coats and
    hewing helmets; the field is described as swimming with blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two sons of Bera and her brother are said to have slain eighteen and to
    have been the victors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Atli says that his fighting force has been reduced from thirty to eleven,
    that hell holds part of his family, and that Gudrun has brought him loss of kin,
    wealth, and sister.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gudrun replies that Atli began the wrongs, saying he murdered her mother for
    riches and starved her sweet cousin in a cave.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Atli orders his men to harm Gudrun by cutting out Hogni’s heart and by tying
    Gunnar to the gallows and calling snakes to their meal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Beiti proposes taking Hialli instead of Hogni, and Hialli becomes afraid,
    hides, whimpers, and begs to live even as a field-dunging laborer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hogni asks that Hialli be released, is seized, laughs, and bears the torture
    bravely.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gunnar plays a harp with his toes, causing both women and men to weep, and
    dies while the day is still young.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Atli taunts Gudrun over the deaths of those she loved; Gudrun answers that
    he will rue the murders and that woe will remain with him as long as she lives.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Atli offers compensation in slaves, treasures, and silver, but Gudrun refuses
    and says no recompense can replace her brothers’ deaths.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: Gudrun recalls growing up with Hogni and being decked by Grimhild with gold
    and necklaces.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Gudrun closes with images of men’s tyranny, a king mated when pawns are taken,
    and a tree falling when its roots are cut.
  category: speech
  evidence_refs:
  - ev:12
