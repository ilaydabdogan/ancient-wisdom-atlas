canonical_text:
  quote: ''
  summary: Gudrun tells her women that unhappy dreams have made her sorrowful. A woman
    interprets Gudrun’s dream of a golden-winged hawk as a sign of a coming royal
    suitor. Gudrun goes to Brunhild’s mountain hall and recounts further dreams of
    a golden hart shot by Brunhild and a wolf-cub that stains her with her brothers’
    blood. Brunhild interprets the dreams as foretelling Sigfred’s coming, Grimhild’s
    venom-mixed mead, Gudrun’s marriage to and loss of Sigfred, her later marriage
    to Attila, and the death of her brothers. The passage also recounts Sigfred’s
    splendid arrival at Gibika’s hall and Grimhild’s drinking-horn stratagem, through
    which Sigfred forgets Brunhild and enters oath-brotherhood with Gibika’s sons.
  language: English
  quote_policy: summarized
