  summary: A scholarly introduction discusses the Danish and Wolsung cycles, signs
    by which prose traditions may reveal poetic origins, examples from Thor and Outgarth
    Loki, the Death of Gorm, and Amlodi, and text-critical issues around Wolsunga
    Saga, Norna-Gests Thattr, and later citations or echoes of Eddic lays including
    Voluspa and Helgi lays.
  language: English
  quote_policy: summarized
