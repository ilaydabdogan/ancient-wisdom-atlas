canonical_text:
  quote: ''
  summary: 'The passage discusses the difficulty of reconstructing Old Norse heathen
    belief from unreliable stories, poetic allusions, and distant medieval reports.
    It uses Adam of Bremen''s account of Uppsala as an example: the author credits
    it with information about divine functions, the temple site, deified heroes, Thor''s
    sceptre, a pit and gallows by the fane, and a gold chain around the sacred spot,
    while also noting medieval commonplaces such as a gold-adorned temple and statues
    of three gods.'
  language: English
  quote_policy: summarized
