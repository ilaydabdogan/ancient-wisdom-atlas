canonical_text:
  quote: ''
  summary: The passage presents an editorial introduction to a fragment of an Atli
    lay and a dialogue in which Atli reports ominous dreams to Gudrun, who interprets
    them. It then introduces the Hlod and Angantheow cycle, recounting Heidrek’s death
    by his thralls with Tyrfing, the contested inheritance between Angantheow and
    Hlod, Gizur’s provocation of war, and the beginning of Hlod’s formal claim to
    half of Heidrek’s estate.
  language: English
  quote_policy: summarized
