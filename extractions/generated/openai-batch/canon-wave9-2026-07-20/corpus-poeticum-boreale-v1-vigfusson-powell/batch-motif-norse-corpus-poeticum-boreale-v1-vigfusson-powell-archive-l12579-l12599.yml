canonical_text:
  quote: ''
  summary: 'A fragmentary appendix gives short mythic or gnomic statements: a slanderer
    is killed by his tongue while falsely accused; unidentified figures sit at an
    unnamed door while witches’ blood from their nostrils awakens hatred; Woden’s
    wife rows the Earth’s ship; a father and the sons of Solkettle read signs on a
    hart’s horn brought from a grave-mound by a wise War-dwarf; and Niord’s nine daughters
    have graven runes.'
