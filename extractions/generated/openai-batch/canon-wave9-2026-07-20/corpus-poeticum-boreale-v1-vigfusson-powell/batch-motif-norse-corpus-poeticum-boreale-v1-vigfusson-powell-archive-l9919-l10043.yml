  summary: The passage narrates Helgi’s omen-marked birth, the Fates’ forecast and
    weaving of his royal destiny, a raven’s report of the armed infant, his naming
    and gift of lands and sword, his early wars against Hunding’s line, the appearance
    of armed airborne maidens, Sigrun’s request for rescue from a forced betrothal
    to Hodbrord, Helgi’s naval muster, Sigrun’s rescue of the fleet from a threatening
    sea power, and Godmund’s observation of the approaching war fleet.
