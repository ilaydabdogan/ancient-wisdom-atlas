canonical_text:
  quote: ''
  summary: The passage begins with the close of a Swipday and Menglad exchange in
    which Menglad seeks confirmation of the stranger’s name and kin, Swipday identifies
    himself and speaks of Fate, and Menglad welcomes him as her long-awaited lover.
    It then introduces and begins Loka-senna, set at the gods’ banquet in Eager’s
    Hall after Balder’s death. Loki arrives at the door, is warned by Eldi, enters
    anyway, demands drink and a seat, invokes an old blood-oath with Woden, and begins
    flyting with Bragi, Idun, and Gefion. Editorial remarks compare the poem’s divine
    mockery with Aristophanic and Homeric treatments and mention possible archaic
    cosmogonic allusions.
  language: English
  quote_policy: summarized
