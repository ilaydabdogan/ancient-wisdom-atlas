  quote: ''
  summary: The passage discusses editorial restoration of corrupt Eddic text by comparing
    paraphrases and related lays. Examples include a Voluspa reading concerning a
    league and hostages between the Wanes and the Anses, and a Brunhild-lay passage
    restored from Hamtheow's Lay as Eormunrec treading a woman to death with horses.
    It also describes corrupt court-poetry, manuscript copying and loss, Arne Magnusson's
    testimony, and early editions of Eddic lays.
  language: English
  quote_policy: summarized
