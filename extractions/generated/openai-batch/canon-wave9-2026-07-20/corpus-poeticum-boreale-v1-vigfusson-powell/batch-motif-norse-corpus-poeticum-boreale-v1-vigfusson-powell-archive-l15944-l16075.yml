canonical_text:
  quote: ''
  summary: 'The passage first recounts Atli accusing Gudrun, on Herkia''s report,
    of improper relations with Theodric. Gudrun swears on a white holy stone, submits
    to a hallowed boiling-cauldron ordeal, removes stones unharmed, and is declared
    guiltless while Herkia is scalded and punished. The passage then turns to the
    Old Lay of Gudrun: Gudrun sits near death in silent grief over Sigurd, unable
    to weep; wise men and women try to console her by recounting their own losses,
    and Goldrand uncovers Sigurd''s body and urges Gudrun to look on and kiss him
    as if he were alive.'
  language: English translation with embedded Old Norse editorial/textual material
  quote_policy: summarized
