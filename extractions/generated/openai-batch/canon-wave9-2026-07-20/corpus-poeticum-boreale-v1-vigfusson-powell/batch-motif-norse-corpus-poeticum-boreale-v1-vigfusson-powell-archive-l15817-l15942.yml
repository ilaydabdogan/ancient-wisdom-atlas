canonical_text:
  quote: ''
  summary: In a translated Eddic passage, Gudrun recounts grief after Sigurd's death,
    wandering before staying with Thora in Denmark, where heroic scenes are embroidered.
    Grimhild then seeks compensation and urges Gudrun to accept wealth and marriage
    to Atli. Gudrun refuses, speaks of Sigurd's death, predicts harm to Gunnar and
    Hogni, and vows vengeance. Grimhild gives her a cold bitter drink that causes
    forgetfulness; the drink and horn are described with sacrificial, watery, inscribed,
    and serpent imagery. A journey follows by land, sea, and land in seven-day stages.
  language: English
  quote_policy: summarized
