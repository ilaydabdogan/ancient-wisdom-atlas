canonical_text:
  quote: ''
  summary: The passage frames Hakonar-mal as a dirge for Hakon the Good and presents
    Woden sending the Walkyries Gondul and Skogul to choose Hakon from battle for
    Woden’s service in Walhall. After the battle, the Walkyries speak with the wounded
    or dead king and announce his coming to the gods. In Walhall, Woden sends Hermod
    and Bragi to meet him; Bragi offers truce and ale with the Anses, while Hakon
    says his men should keep their war gear ready.
  language: English
  quote_policy: summarized
