canonical_text:
  quote: ''
  summary: The passage gives editorial context and a prose synopsis of the Arngrim-cycle
    and The Waking of Angantheow. Swafrlami steals the sword Tyrfing from Dwarves,
    who curse it. The sword passes through Arngrim to Angantheow, whose death leads
    to Herwor's quest to Samsey, where she calls on her dead father at his mound and
    receives the cursed sword despite his resistance and warning.
  language: English
  quote_policy: summarized
