canonical_text:
  quote: ''
  summary: The passage closes the Sun-Song with a Christian prayer, instructions to
    recite the Sun's Song, and a hope of reunion on the Great Day. It then introduces
    The Christian's Wisdom as a teacher-disciple poem of parables and counsels. The
    excerpted parables narrate repentance followed by treacherous murder and angelic
    salvation, reversal of wealth and health, destructive love rivalry, punishment
    of pride between fire and frost, and betrayal of Sorli, whose hidden murder is
    seen by God.
  language: English
  quote_policy: summarized
