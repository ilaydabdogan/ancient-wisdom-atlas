canonical_text:
  quote: ''
  summary: An opening fragment describes ominous birds and a speaker foreseeing death.
    In the main passage, Herwor reaches Munarvoe at sunset, asks a shepherd for the
    way to Hiorward's howes, rejects his warnings about fire and opening grave-mounds,
    and goes alone to the burial mounds. She summons her dead father Angantheow and
    his brethren, demands the Dwarf-forged sword Tyrfing from the howe, withstands
    warnings about Hell, fire, and destruction, receives the sword, and hears Angantheow
    foretell that Tyrfing will destroy her race and later be wielded by her son Heidrek.
  language: English
  quote_policy: summarized
