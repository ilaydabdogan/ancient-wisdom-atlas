canonical_text:
  quote: ''
  summary: Sigfred is offered Gudrun and a realm, accepts, swears brotherhood with
    Gundhere, and marries Gudrun. He gives Gudrun a morsel of Fafni's heart, after
    which she is described as crueller and wiser. Grimhild urges Gundhere to seek
    Brunhild, whose winning requires riding through a wall of fire. Gundhere cannot
    pass the fire, so he and Sigfred change features; Sigfred, appearing as Gundhere,
    rides Grani through the Waver-Lowe, meets Brunhild, lies with her with sword Gram
    between them, takes back Andwari's Treasure, and returns. Brunhild later marries
    Gundhere. At a river washing, Brunhild and Gudrun quarrel, and Gudrun reveals
    that Sigfred, not Gundhere, rode the fire and was Brunhild's true husband.
  language: English
  quote_policy: summarized
