canonical_text:
  quote: ''
  summary: The passage is an editorial discussion of evidence for old Northern religion.
    It distinguishes older native witnesses from later legendary accounts influenced
    by Christian, classical, and apocryphal models. It then summarizes several suspect
    tales involving destruction or humiliation of images and temples, animate idols,
    temple burning, temple robbery, and comparisons to biblical, classical, and medieval-Christian
    story patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author distinguishes early poems and Ari's historical works from later
    foreign legendary materials, and urges distrust of the latter for reconstructing
    heathen Northern religion.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says later stories portray heathen ancestors as pagans of a later
    imperial type, worshipping graven images in gold-decked temples.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: One summarized story has a son destroy his father's temple, drag an image
    of Thor by a halter, cut it up, and give sawdust and ashes mixed with water to
    dogs to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author says that the reference in the preceding story is not really to
    Thor but to Jove or Saturn, and links the ashes-and-water draught to the golden
    calf episode at Sinai.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another story has a Christian king strike a large idol brought to confront
    him at a moot; the image breaks, and toads, paddocks, and adders come out of its
    hollow body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author compares the broken-idol story to the story of Dagon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another episode has a king tricked by Iron-beard into pulling Thor's car.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes a legend of the temple of Mærin in Throndheim with images
    on pedestals, gold glitter, and Thor in a car drawn by harnessed goats.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: In one story about Thorgerd, Earl Hakon worships in a temple described like
    a church with glass windows, kneels to an image, and the goddess's image bears
    a ring that she clasps or releases.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In another Thorgerd story, images of the gods move about, the idol Thorgerd
    speaks to Grimkettle, and Grimkettle burns the temple and dies the same day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a Niala story, Hrapp burns and robs the temple of the Earls, spoiling its
    images of gold trappings.
  category: action
  evidence_refs:
  - ev:9
