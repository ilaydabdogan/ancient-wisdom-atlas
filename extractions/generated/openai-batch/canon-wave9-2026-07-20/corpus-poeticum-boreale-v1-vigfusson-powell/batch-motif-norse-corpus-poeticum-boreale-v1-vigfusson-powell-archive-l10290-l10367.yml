canonical_text:
  quote: ''
  summary: Fragmentary Helgi material in which Helgi, silent after his father’s death,
    meets the Valkyria Swava, who admonishes him and reveals a magic sword. Later
    passages describe ancestral treasure held by Rodmar, Hedin’s Bragi-toast claim
    to Helgi’s bride, a wolf-riding witch who knows Helgi will be slain, and Helgi’s
    fatal wounding. Helgi summons Swava for a final battlefield meeting and asks her
    to love Hedin, but she declares her vow not to take another after Helgi’s death.
  language: English
