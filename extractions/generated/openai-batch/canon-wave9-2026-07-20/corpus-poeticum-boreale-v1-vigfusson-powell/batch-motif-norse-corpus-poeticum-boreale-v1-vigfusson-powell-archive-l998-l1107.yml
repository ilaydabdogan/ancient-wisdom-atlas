canonical_text:
  quote: ''
  summary: The passage surveys early modern knowledge, copying, naming, collecting,
    publication, preservation, and destruction of Icelandic and Eddic manuscripts.
    It describes Bryniolf's Codex Regius copy and title, limited early impact of the
    poetic Edda, Icelandic citations and a later forgery, the major Icelandic manuscript
    collections, losses by fire and neglect, and damage to vellum from bookbinding,
    damp, and smoke.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heidrek’s Riddles were known from Hawk’s-book, and Biorn made a commentary
    on them in 1641; Biorn also wrote a commentary on Hofudlausn.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Bryniolf found the Codex Regius, he had a vellum copy made, inscribed
    it with the title “Edda Semundi Multiscii,” and sent it abroad.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: The title placed on the copy spread on the continent and was treated by scholars
    as authoritative, according to Arne Magnusson’s complaint.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: The vellum copy associated with Bryniolf and Torfeus was later lost and is
    said to have probably been burnt in the Copenhagen fire of 1728.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The newly discovered poetic Edda had limited early influence; the mythic poems
    of Codex Regius were first fully printed in 1787, the heroic poems in 1812, and
    the whole in Rask’s 1818 edition.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Iceland, Hallgrim Petersson’s commentary quotes one of the Helgi lays,
    and other works by him show acquaintance with didactic poems.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies Hrafnagaldr Odins, also called Forspiall’s liod, as
    a forgery intended as an introduction to the Doom of Balder, with its oldest manuscript
    going back to 1670.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage names four main collections of Icelandic manuscripts: the Royal
    Library collection from Bishop Bryniolf, Arne Magnusson’s collection, the Upsala
    collection, and the Stockholm collection; it also describes a former University
    Library of Copenhagen collection.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The University Library of Copenhagen collection was destroyed by fire in 1728
    except for one manuscript lent to Arne Magnusson, but copies of important manuscripts
    had been made and survived in the Arna-Magnean Library.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Icelandic vellums were scattered, mutilated, destroyed,
