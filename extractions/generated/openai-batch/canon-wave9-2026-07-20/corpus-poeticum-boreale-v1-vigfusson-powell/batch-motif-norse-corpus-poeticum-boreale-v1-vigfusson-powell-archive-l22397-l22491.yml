  summary: The passage discusses the structure of Old Norse court-poetry, especially
    the Drapa and its burden or refrain. It distinguishes free and larded burdens,
    describes cloven or broken staves, lists examples from named poems and poets,
    notes an analogue in Dialogue-metre poems ending with proverbs, and contrasts
    Drapa with shorter Flokkr or Ode forms.
  language: English
  quote_policy: summarized
