canonical_text:
  quote: ''
  summary: The passage surveys Old Norse beliefs and stories concerning howes, family
    barrows, ancestral spirits, burial places, the presence and conduct of the dead,
    tomb-breaking, later demonization of howe-dwellers, and green barrows marking
    certain dead. It also notes Christian reuse of former high places and several
    explicit cross-traditional comparisons made by the editor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shepherd of Gymi is described as sitting on a howe near the hall when Frey’s
    messenger rides into Gymi’s croft.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harbard says he learned wisdom and eloquence from ancestral spirits, called
    patriarchs, dwelling in family barrows; Thor answers that these are more properly
    cairns associated with wicked ghosts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kweld-wolf, Skalla-Grim, and Egil’s two sons are said to be buried in the
    family barrow, while Egil imagines his beloved son entering Godhome rather than
    the grave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Missionaries in the Westmen’s Isles build a church at a place called Harrow
    ore, on instructions from King Tryggvason to build where they first came ashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that some dead were buried in howes where they died, especially
    after violent death, and lists Beowulf, Angantheow, and Hialmar as examples.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The presence of the holy dead is said to bless the neighborhood, and King
    Halfdan the Black’s head, bowels, heart, and body are each buried in separate
    howes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Older accounts portray the dead as feasting happily and caring for living
    kindred; examples include Helgi and Sigrun’s love and Angantheow’s attempt to
    dissuade Herwar from an ill-fated project.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Midfrith Skeggi breaks into Hrolf Craki’s howe and takes Skofnung, Healti’s
    axe, and much treasure, while King Rolf prevents Badwere from attacking him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Later legends describe ghosts bodily struggling with tomb-robbers; the passage
    also says that tomb-breaker was a term of contempt and that grave-stones carry
    curses against grave-robbers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says the howe-dweller is degraded into a demon after the change
    of faith, while also stating that in older days only bad men made bad ghosts;
    Glam is named as the spirit of a wicked man.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Thorgrim’s barrow is always green on one side, and Einar’s barrow at Wash-brink
    is green all year round.
  category: attribute
  evidence_refs:
  - ev:11
