comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the idea that holy dead bless a neighborhood
    with a practice said to exist in Hindustan.
  claim_level: same_function
  target: Hindustan practice of holy dead blessing the neighborhood
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only an editorial comparison and no separate description
    of the Hindustan practice.
- id: claim:2
  claim: The passage explicitly compares Halfdan’s piecemeal burial with later treatment
    of medieval saints and at least one Angevin king.
  claim_level: same_function
  target: medieval saint relic division and Angevin royal body-part burial
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states continuation or perpetuation but does not give detailed
    medieval examples within this excerpt.
- id: claim:3
  claim: The passage treats the passionate love of Helgi and Sigrun as echoed faintly
    by the William and Margaret ballads.
  claim_level: same_motif
  target: William and Margaret ballads
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is asserted by the editor without quoting or summarizing
    the ballad material in this passage.
- id: claim:4
  claim: The passage compares Egil’s imagined Godhome with an Elysian field, Hesperian
    garden of heroes, and Christian Paradise imagery.
  claim_level: same_function
  target: Elysian field, Hesperian garden, and Christian Paradise as blessed afterlife
    places
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is editorial and notes possible Christian influence,
    so it should not be treated as proof of direct equivalence.
