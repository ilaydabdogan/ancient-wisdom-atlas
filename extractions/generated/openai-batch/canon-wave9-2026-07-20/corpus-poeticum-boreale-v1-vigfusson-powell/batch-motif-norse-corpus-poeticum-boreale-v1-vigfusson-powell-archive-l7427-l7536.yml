canonical_text:
  quote: ''
  summary: An editorial note frames the Atli episode as linked to Attila, the cursed
    Hoard, and other legendary material. In the narrative, Atli sends Knefred to invite
    Gunnar with offers of rich gifts. Hogni interprets a ring wrapped with animal
    hide and wolf hair as a warning from their sister, but Gunnar proceeds. Gunnar
    and Hogni ride through mountains and Mirkwood to Atli’s hall, where their sister
    warns them that they have been betrayed and that a serpent-pit is prepared for
    Gunnar. Gunnar is bound; Hogni fights fiercely. Gunnar is asked whether he will
    buy his life with gold and demands Hogni’s heart. Hialli’s heart is first presented
    and rejected as cowardly; Hogni’s heart is then cut out while he laughs.
  language: English
  quote_policy: summarized
