canonical_text:
  quote: ''
  summary: Editorial notes introduce a fragmentary poem identified by the editors
    as Balder’s Doom or Balder’s Lay, followed by a narrative in which the gods deliberate
    over Balder’s ominous dreams. Woden rides Sleipnir to Mist-Hell, encounters a
    bloody hound from a cave, raises a dead Sibyl from her barrow, and questions her
    about Balder’s fate, Hod’s killing of him, Wali’s vengeance, and later events
    involving Loki and the Doom of the Powers. The passage then begins editorial notes
    on Grotta-Song, mentioning Frodi’s story and mill in later poetic allusions.
  language: English
  quote_policy: summarized
