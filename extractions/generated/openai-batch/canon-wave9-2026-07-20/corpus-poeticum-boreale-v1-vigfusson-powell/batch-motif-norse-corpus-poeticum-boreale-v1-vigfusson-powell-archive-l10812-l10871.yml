canonical_text:
  quote: ''
  summary: Odd and Hialmar confront Angantheow and his brothers, a group of twelve
    berserks coming from ships. Odd challenges them to fight fairly. After the battle
    the foster-brothers have slain their foes, but Hialmar is mortally wounded by
    Angantheow's sword. Hialmar speaks of honor, his approaching death on Samsey,
    lost fellowship in the hall, a farewell prediction from the king's daughter, and
    asks that his armor and arm-ring be carried back.
  language: English
  quote_policy: summarized
