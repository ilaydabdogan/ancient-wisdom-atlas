canonical_text:
  quote: ''
  summary: In a prophetic dialogue, Gripi tells Sigurd of sleeping beside the maid
    without dishonour, the double bridal in Giuki’s hall, a return from exchanged
    forms, remembered oaths and silence, Brynhild’s resentment and accusation, Sigurd’s
    coming death at the hands of Gudrun’s brothers, Gudrun’s grief, Grimhild’s blame,
    Sigurd’s lasting honour, and Sigurd’s acceptance that fate cannot be resisted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigurd says he would never treacherously ensnare the king’s daughter whom
    he honours most.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gripi tells Sigurd that he will sleep beside the maid as if she were his mother,
    and that Sigurd’s name will be held high while men live.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sigurd asks whether Gunnar can wed the lady after she has slept nights by
    Sigurd’s side.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gripi foretells that Sigurd’s and Gunnar’s bridals will be held together in
    Giuki’s hall, and that they will change forms again while each keeps his own heart.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gripi says Sigurd will remember the oaths but must be silent, will not begrudge
    Gudrun her luck, and that Brynhild will think herself ill-matched and devise revenge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sigurd asks what redress Brynhild will receive, saying that they beguiled
    her and that his sworn words to her are unfulfilled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gripi says Brynhild will persuade Gunnar that Sigurd has not kept his oaths
    to Gunnar, though Gunnar trusted Sigurd.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gripi says the mighty maid will act against Sigurd from wrath and despair,
    while also saying the ensnaring of the princess was not Sigurd’s fault.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sigurd asks whether Gunnar, Gothorm, and Hogni will follow Brynhild’s urging
    and whether the sons of Giuki will redden a spear-edge with his blood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gripi says Gudrun’s heart will be cruelly used when her brothers slay Sigurd,
    that she will never again be happy, and that this is Grimhild’s fault.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gripi consoles Sigurd by saying that no better man will ever come upon earth
    under the sun than Sigurd will be held to be.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sigurd parts in peace, says no man can withstand fate, and says Gripi has
    done as he was asked.
  category: speech
  evidence_refs:
  - ev:10
