  summary: 'The passage contains short Old Norse fragments with editorial English
    notes on saga quotations, Sturlunga notices, and runic-stone ditties: a sad lover
    and parting-gift, a pauper removal ditty, a capsized sailor told to climb a keel,
    executions preceded by quoted sayings, feuding chiefs separated in remote places,
    and memorial inscriptions for a husband and father.'
