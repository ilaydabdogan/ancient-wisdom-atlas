canonical_text:
  quote: ''
  summary: 'The excerpt first closes a Skirni/Frey scene in which Gerda is to meet
    Niord''s son after three nights, and Frey laments the delay. It then introduces
    Harbards-liod as a dialogue-drama contrasting Thor and Woden, with Woden disguised
    as the ferryman Hoarbeard. Thor, unable to cross a river, calls for ferrying;
    Hoarbeard mocks him, questions his identity, and denies or withholds passage.
    The two exchange boasts and taunts: Thor recalls slaying giants and placing Thiazi''s
    eyes in heaven, while Hoarbeard boasts of fighting, love affairs, trickery, and
    stirring kings to battle. Hoarbeard also contrasts Woden''s claim over fallen
    gentlefolk with Thor''s association with thralls and mocks Thor''s courage.'
  language: English
  quote_policy: summarized
