canonical_text:
  quote: ''
  summary: 'The passage surveys manuscript witnesses for kings'' sagas and court poetry,
    noting preservation, loss, marginal stanzas, and editorial manuscript preferences.
    It then cites classical and early medieval testimonies about old Teutonic heroic
    song: Tacitus on songs about Tuiscon, Mann, and Arminius; Einhard on Charles the
    Great preserving ancient lays; and Paul the Deacon on songs praising the Lombard
    king Elfwine.'
  language: English
