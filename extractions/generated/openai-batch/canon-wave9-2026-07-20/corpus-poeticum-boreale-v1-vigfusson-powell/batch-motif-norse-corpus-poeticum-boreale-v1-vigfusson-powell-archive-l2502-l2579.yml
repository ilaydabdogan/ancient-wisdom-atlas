canonical_text:
  quote: "“Gondul and her maiden-mates armed and helmed ride spear in hand to greet
    him”"
  summary: The passage is an editorial discussion of the relative chronology and style
    of several groups of Old Norse poems. It includes a comparison between the Valkyria
    scene in Haconar-mal and the Helgi poems, describing Hacon wounded among the dead
    while Gondul and armed, helmed maidens ride to greet him, and comparing this to
    Helgi and his “Helmed Fairies.” It also characterizes the Tapestry poems as later
    lamentation poems centered on sorrow and female characters.
  language: English
  quote_policy: quoted
