  summary: The passage is a philological discussion of early Teutonic and related
    metrical forms. It says older Teutonic law formulae and Latin Saturnians preserve
    a stage before regular alliterative verse, identifies line-pause, stresses, and
    alliteration as present factors, posits an unnamed artist who fixed the alliterative
    type before the English crossed the North Sea, and compares the same line-form
    across early German, Scandinavian, and English remains. A footnote defines consonance
    in contrast to assonance.
