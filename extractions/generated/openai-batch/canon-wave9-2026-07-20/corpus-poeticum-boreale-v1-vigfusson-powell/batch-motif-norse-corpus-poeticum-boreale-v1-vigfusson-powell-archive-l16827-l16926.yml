  quote: There is a curse on us, brother. I was ordained to be thy slayer
  summary: The fragment recounts a battle involving Hlod and Angantheow, Hlod's fatal
    wounding, Angantheow's statement that a curse and the Fates ordained him to slay
    his brother, and Angantheow's later recovery of the lost sword Tyrfing from runaway
    thralls who had murdered his father Heidrek. The passage then shifts to an editorial
    discussion of heroic muster-rolls and catalogues of champions.
