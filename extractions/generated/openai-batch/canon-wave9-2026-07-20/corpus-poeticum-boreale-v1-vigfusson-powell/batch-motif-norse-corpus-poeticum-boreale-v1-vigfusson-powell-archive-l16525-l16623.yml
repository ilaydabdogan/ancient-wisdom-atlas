canonical_text:
  quote: ''
  summary: Gudrun dissembles before Atli, prepares an ale-feast associated with the
    funeral of her brothers, kills her two young sons, and reveals to Atli that he
    has consumed food and drink made from their bodies. She and Hogni's son then wound
    Atli. Atli and Gudrun exchange accusations about betrayal, marriage, bride-price,
    household strife, and earlier deeds of Gudrun and her kin.
  language: English
  quote_policy: summarized
