canonical_text:
  quote: ''
  summary: A scholarly introduction describes the loss, copying, collection, and transmission
    of Icelandic vellum manuscripts; the work of Bryniolf, Arne Magnusson, Ole Worm,
    Stephanius, and others; and the early history of the word 'Edda' as a title, manuscript
    label, and later term for technical rules of court poetry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Icelandic vellum manuscripts had disappeared before Arne Magnusson arrived,
    while Bryniolf's sending and copying of manuscripts helped preserve readable transcripts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: John Erlendsson copied old vellums, including Libellus and Landnama, in 1651;
    the originals are said to have perished before Arne Magnusson's arrival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ole Worm corresponded with Icelandic contemporaries, studied runes, cited
    the Poetic Edda, and received a manuscript of Snorri's Edda from Arngrim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stephanius possessed Icelandic manuscripts that were later sold to De la Gardie
    and passed to the Upsala Library; the Codex Upsalensis of Snorri's Edda is singled
    out as the best of them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the word 'Edda' is first met in the Lay of Righ as a title
    for great-grandmother and that there is no actual testimony for why Snorri's book
    on poetic art came to be called 'Edda'.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Colophons in surviving vellums identify Snorri's work as Edda and describe
    parts concerning the Anses and Gylfi, Scaldscaparmal and names of things, and
    the Tale of Metres for King Hacon and Duke Skuli.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says medieval poets from about 1340 to 1640 used 'Edda' as a synonym
    for the technical laws of court metre.
  category: relationship
  evidence_refs:
  - ev:5
