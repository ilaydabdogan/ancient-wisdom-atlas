canonical_text:
  quote: ''
  summary: Sigmund and Sinfitela hide at King Siggeir's hall to take vengeance. Signy
    helps them, urges the killing of her children after they reveal the hiding place,
    later smuggles Sigmund's sword into the barrow where Siggeir has entombed the
    heroes, and finally chooses death in the burning hall after revealing her role
    in bringing about Siggeir's death and Sinfitela's birth.
  language: English
  quote_policy: summarized
