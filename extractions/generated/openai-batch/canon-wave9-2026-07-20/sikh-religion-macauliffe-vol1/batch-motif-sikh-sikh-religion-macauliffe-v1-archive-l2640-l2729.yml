canonical_text:
  quote: ''
  summary: The passage explains Sikh ontology of the soul as mobile, immortal, and
    luminous; it describes transmigration through bodies, purification, subtle embodiment
    after death, possible punishment, and final Nirvan as absorption of the individual
    soul into the Absolute, using analogies of moon, thread, light, and water blending
    with an ocean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the soul separates from the body, it is compared to the moon when invisible;
    it still exists though imperceptible and becomes manifest again when it moves
    into another body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul is described as mobile and immortal, seeking a body for the performance
    of its functions and entering a metaphorical matrimonial alliance with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The soul, bearing its burden of acts, is compared to a thread that can pass
    through a gold bead, a pearl, or an earthen ball, and is said to enter any body
    with which it comes in contact.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soul carries a finer or grosser covering from its last body and passes
    from body to body in a revolving wheel until purified and fit to blend with the
    Absolute.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paramatama is described as the primal spirit, Supreme Being, and pervading
    soul of the universe; it is represented as light.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jivatama, the soul of each living being, is described as light, an emanation
    from Paramatama, and not material.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Paramatama is compared to an illimitable ocean, and Jivatama to water in a
    glass immersed in that ocean; if the glass is removed or broken, the water blends
    with the ocean.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: According to the passage, animals have both a solid material body and a subtle
    intangible body; at death Jivatama separates from the material body but not from
    the subtle body unless Nirvan occurs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: While Jivatama is encased in a subtle body, it is described as susceptible
    to punishment.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage contrasts hopes of afterlife reunion with the believer in Nirvan,
    for whom only sufficiently purified souls are absorbed in the Absolute and individual
    consciousness ceases.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
