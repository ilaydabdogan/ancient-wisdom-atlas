canonical_text:
  quote: There is no Hindu and no Musalman.
  summary: Guru Nanak is treated as possessed or insane during an exorcism scene,
    then sings of being mad upon the Lord. After a period of silence he declares that
    there is no Hindu and no Musalman, is summoned before Daulat Khan and questioned
    by the Qazi, and explains true religious identity through obedience to God, self-effacement,
    kindness, truth, and good conduct. He reinterprets Muslim ritual objects and prayers
    as ethical virtues, then accompanies the company to the mosque, where he laughs
    during the Qazi's prayer.
  language: English
  quote_policy: quoted
