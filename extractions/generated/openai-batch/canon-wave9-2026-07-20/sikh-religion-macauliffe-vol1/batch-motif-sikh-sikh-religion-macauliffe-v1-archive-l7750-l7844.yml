canonical_text:
  quote: "“O man, ponder on the one Name, / And thou shalt go to thy home with honour.”"
  summary: Guru Nanak rejects dominion and revenue if they would cause forgetfulness
    of God; Kaljug adores him and departs. Guru Nanak and Mardana are rejected and
    mocked in one village, then welcomed in another. Nanak composes verses and a hymn
    on remembrance of the divine Name, mortality, divine gifts, purification, and
    the changeability of seasons and the body. He gives apparently opposite judgments
    on the two villages, explaining that the bad should stay put and the good should
    spread elsewhere. The passage closes with travel from Kamrup by the Brahmaputra
    and by coast to Puri.
  language: English
  quote_policy: quoted
