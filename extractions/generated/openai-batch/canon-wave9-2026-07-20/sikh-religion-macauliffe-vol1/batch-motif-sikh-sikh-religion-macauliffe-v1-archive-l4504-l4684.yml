canonical_text:
  quote: ''
  summary: 'The passage recounts two childhood miracles associated with Nanak while
    asleep: a tree’s shadow remains fixed over him and a cobra protects him with its
    hood. Rai Bular recognizes the boy’s miraculous powers and congratulates Kalu.
    The passage then describes Nanak’s resistance to secular work, his mother’s and
    father’s admonitions, and several hymns in which Nanak teaches devotion to the
    Name, guidance by the Guru, rejection of mammon, and spiritual cultivation through
    agricultural imagery.'
  language: English
  quote_policy: summarized
