candidate_motifs:
- id: motif:1
  label: Divine name as supreme duty and salvific knowledge
  taxonomy_refs:
  - wisdom
  basis: The passage places repeating the one God's name above caste duties and says
    repeating God's name removes sins and brings salvation.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage frames this as Sikh devotional teaching rather than as a narrative
    episode.
- id: motif:2
  label: Divine judgment after death
  taxonomy_refs:
  - divine_judgment
  - afterlife_journey_map
  basis: The passage mentions God's court, judgment hereafter, punishment in the next
    world, receiving the fruit of deeds, a narrow road, and hell.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage gives doctrinal warnings and images, not a full mapped journey
    narrative.
- id: motif:3
  label: Saving spiritual guide as boat
  taxonomy_refs:
  - ark_vessel
  basis: The true Guru is explicitly called a boat, and those who recognize this are
    said to be mercifully saved; those attached to mammon are wrecked.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The imagery is a spiritual rescue metaphor; no flood, ark narrative, or
    physical voyage is described.
- id: motif:4
  label: World ages as changing moral vehicles
  taxonomy_refs: []
  basis: The body's carriage and driver change through Sat, Treta, Dwapar, and Kal
    ages, with passion and falsehood named for the Kal age.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: No available taxonomy reference exactly matches the four-age moral vehicle
    pattern.
- id: motif:5
  label: Humility as fruitful lowliness
  taxonomy_refs:
  - wisdom
  basis: The tall simmal-tree disappoints seekers, while the lowly tree with sweet
    fruit is praised; the scale image also values the descending side as heavier.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is expressed as moral instruction through natural and object analogies,
    not as a mythic plot.
- id: motif:6
  label: External ritual transformed into inward virtue
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The janeu rite is recast as a thread for the soul made from mercy, contentment,
    continence, and truth; external ritual practices are criticized when separated
    from the true Guru.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The initiation reference depends on the janeu investiture context supplied
    in the passage prose.
- id: motif:7
  label: Devotional self-offering to the Guru
  taxonomy_refs:
  - sacrifice
  basis: The speaker says he is a sacrifice to the true Guru, by meeting whom the
    Lord is remembered.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The sacrifice language appears devotional and metaphorical in this passage.
- id: motif:8
  label: Tree of life in summarized Vedic doctrine
  taxonomy_refs:
  - sacred_tree_axis
  basis: The Yajur summary says Kan Krishan brought the tree of life for a milkmaid.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage only briefly mentions the tree of life and does not describe
    its axis, cosmological, or regenerative function.
