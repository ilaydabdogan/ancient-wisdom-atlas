canonical_text:
  quote: ''
  summary: The passage presents hymnic and explanatory material attributed mainly
    to Guru Nanak, with one section attributed to Guru Angad. It contrasts caste and
    ritual duties with repeating the name of the one God; describes divine knowledge
    through a guru; warns of judgment, punishment, and hell after death; uses vehicle,
    water, tree, scale, boat, salve, and sacred-thread imagery; summarizes Vedic doctrines;
    criticizes external ritual; and recasts the janeu as an inward thread made of
    virtues.
  language: English
  quote_policy: summarized
