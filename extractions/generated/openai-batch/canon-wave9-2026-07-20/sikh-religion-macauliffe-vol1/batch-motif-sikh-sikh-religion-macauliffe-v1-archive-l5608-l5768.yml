canonical_text:
  quote: ''
  summary: Guru Nanak exposes the distracted thoughts of the Qazi and the Nawab during
    prayer, teaches what makes a true Musalman, declares one Lord above countless
    religious figures and teachers, receives homage from Muslim and Hindu audiences,
    refuses temporal authority and money owed to him, and asks that the money be used
    to relieve the poor. A devotional hymn uses dyeing and bride-Bridegroom imagery
    to describe acceptance by God.
  language: English
  quote_policy: summarized
