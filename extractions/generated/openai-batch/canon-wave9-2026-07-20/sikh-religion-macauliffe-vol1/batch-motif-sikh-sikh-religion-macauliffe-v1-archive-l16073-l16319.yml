  text: Meeting the true Guru and fixing God's name in the heart is said to bring
    comfort, divine favor, freedom from hopes and fears, and destruction of pride
    by the Word.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Saints are described as pleasing the Lord, adorning the Lord's gate, and hymning
    praises; those outside divine favor find no entrance and wander in many births.
  category: relationship
  evidence_refs:
  - ev:3
