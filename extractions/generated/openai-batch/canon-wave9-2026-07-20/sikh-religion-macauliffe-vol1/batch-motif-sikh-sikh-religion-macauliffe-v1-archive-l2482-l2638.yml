    and begins anew.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a person has done evil and accumulated demerits, punishment after death
    is severe; the soul enters a lower animal and passes through many forms of existence
    until it again enters human parentage.
  category: sequence
  evidence_refs:
  - ev:7
