  summary: The passage explains Sikh teachings on Nirvan and Sach Khand, presenting
    absorption in God as the supreme goal while also describing a blessed realm. It
    describes meditation, Guru teaching, purgation, punishment, transmigration, rebirth,
    Karma, and comparative references to Mosaic, Hindu, Pythagorean, Platonic, and
    English poetic treatments of the soul’s prior or migratory existence.
  language: English
