literal_observations:
- id: obs:1
  text: Nirvan, or absorption in God, is presented as the supreme object of human
    attainment, while Sach Khand is described as a paradise promised to the blest;
    some learned Sikhs maintain that Nirvan and Sach Khand are practically the same.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gurus are said to hold that eternal happiness may be obtained without
    abandoning ordinary worldly duties, and that reunion with the Absolute should
    be the supreme object of Sikh devotion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hymn addresses the soul and directs it to seek shelter in God’s holy name,
    promising freedom from grief and the final joy of Nirvana.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nirvan is defined as the cessation of individual consciousness caused by the
    blending of the light of the soul with the light of God.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sikhs compare Nirvan to water blending with water when two streams unite.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nirvan is to be obtained through meditation on God, repeated attention, and
    a life conformed to the Guru’s teachings; individual consciousness then ceases
    and no pain or misery remains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Good works without devout meditation and mental absorption do not bring Nirvan
