canonical_text:
  quote: ''
  summary: The passage praises God’s Name, the Guru’s instruction, and devotion as
    the way to fearlessness, salvation, freedom from transmigration, and union with
    God. It describes God as unseen, unborn, self-existent, pervasive in the three
    worlds and all regions. It contrasts devotion and remembrance of the Name with
    ritual acts, ascetic signs, pilgrimages, books, grammar, and sectarian reliance
    on the Veds. It also presents accountability before God’s court and uses images
    such as the ocean of the world, Death, five arrows on a bow, diamonds and jewels
    of the heart, and God’s elixir.
  language: English
  quote_policy: summarized
