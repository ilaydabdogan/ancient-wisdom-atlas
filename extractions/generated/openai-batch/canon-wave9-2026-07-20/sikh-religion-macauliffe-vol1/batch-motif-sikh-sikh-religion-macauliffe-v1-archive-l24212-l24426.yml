- id: motif:2
  label: overcoming personified Death through virtues and the Name
  taxonomy_refs:
  - death_rebirth
  basis: Death and Death’s attendants are personified, Death is to be killed with
    the five arrows, and the Name prevents Death from striking and leads to meeting
    God.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  confidence: medium
  cautions: The passage does not narrate a mythic combat scene; the killing of Death
    is an instructional image.
- id: motif:3
  label: liberation from rebirth and transmigration
  taxonomy_refs:
  - death_rebirth
  basis: The text says that placing the Destroyer of fear in the heart prevents rebirth,
    while lack of the Word results in transmigration; salvation comes through Guru’s
    instruction and God’s Name.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:12
  confidence: high
  cautions: The motif is doctrinally stated rather than narrated as an individual
    story.
- id: motif:4
  label: self-effacement and blending with God
  taxonomy_refs:
  - annihilation_union
  basis: The passage says that one who effaces himself obtains the fearless position
    and that through saints’ society a person is easily blended with God.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: medium
  cautions: The lines use devotional language; the exact metaphysical meaning requires
    tradition-specific review.
- id: motif:5
  label: divine judgment through a court and account of deeds
  taxonomy_refs:
  - divine_judgment
  basis: The Lord is said to call for man’s account in His court, and human responsibility
