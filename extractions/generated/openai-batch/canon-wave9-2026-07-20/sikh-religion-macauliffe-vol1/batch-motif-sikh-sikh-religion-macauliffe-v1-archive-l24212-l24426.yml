- id: motif:1
  label: crossing the ocean of the world through spiritual instruction
  taxonomy_refs:
  - afterlife_journey_map
  - mystical_quest
  basis: The world is explicitly called a terrible ocean, and the passage says it
    is crossed by Guru’s instruction and by dispelling heart-doubts.
