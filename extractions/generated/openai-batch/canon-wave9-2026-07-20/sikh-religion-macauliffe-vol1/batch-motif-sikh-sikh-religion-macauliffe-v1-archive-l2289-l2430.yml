canonical_text:
  quote: No one existed but the One God.
  summary: The passage opens with a hymn describing a pre-creation state in which
    ordinary cosmic divisions, deities, scriptures, social categories, birth, death,
    heaven, hell, and worship practices were absent, and only God existed. God then
    creates the world, sustains the sky without supports, creates Brahma, Vishnu,
    and Shiv, and watches over all. The surrounding commentary discusses anthropomorphism,
    pantheism, Sikh understandings of a personal yet formless God, devotional love
    expressed through a spouse metaphor, equality beyond caste, and union with God
    illustrated by bubbles returning to water.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Before creation, the passage says there were no earth, heaven, day, night,
    moon, sun, continents, hells, seas, rivers, paradise, nether regions, birth, death,
    deities, social categories, scriptures, pilgrimage bathing places, or worship
    practices.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the pre-creation state, only the One God existed; God is described as meditating
    on the void and as the imperceptible speaker and preacher who was everything while
    unseen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When God pleased, God created the world, sustained the sky without supports,
    created Brahma, Vishnu, and Shiv, extended the love of Mammon, issued an order,
    and watched over all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary describes anthropomorphism as representing God in man’s image
    and subject to human passions such as wrath, jealousy, revenge, and love of praise.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The commentary describes pantheism as the belief that God is diffused through
    all matter and that matter is therefore part of God.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that, according to the Sikh Gurus, God is to be approached
    and loved as a faithful wife loves her spouse, and human beings are to be regarded
    equally as brothers rather than divided by caste.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Sikhs believe in a personal God who is not in man’s image;
