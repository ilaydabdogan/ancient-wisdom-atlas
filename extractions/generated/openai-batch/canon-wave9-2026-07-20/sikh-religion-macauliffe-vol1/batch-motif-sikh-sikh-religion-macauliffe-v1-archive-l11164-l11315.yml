canonical_text:
  quote: Nanak, my Guru hath blended me with God, and I have obtained Him as my Spouse.
  summary: The passage presents devotional verses in which God is addressed as Friend,
    Beloved, True One, and Spouse; pilgrimage, bathing, charity, and worship are interiorized
    through God’s name; the speaker becomes a bride blended with God. A narrative
    then describes Guru Nanak assisting a poor father with a wedding outfit, sending
    Bhagirath to Lahore, and converting a skeptical shopkeeper who later practices
    hymn-singing, pre-dawn bathing, and repetition of God’s name.
  language: English
  quote_policy: quoted
