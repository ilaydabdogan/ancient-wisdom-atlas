canonical_text:
  quote: ''
  summary: Nanak responds to his father’s and mother’s attempts to direct him toward
    ordinary work or away from devotion. He answers farming, shopkeeping, horse trading,
    government service, and concerns about reputation by using images of field, shop,
    merchandise, service, profit, divine grace, and nourishment through the true Name.
    The passage also praises God as immeasurable and speaks of union or absorption
    with the Creator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nanak tells his father that he has sown his own field, that its harvest is
    ready, that others will profit from it, and that he has done farming work for
    God; he also says his soul will be glad on union with his Creator.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When his father advises him to keep a shop, Nanak replies with instructions
    to make knowledge of life’s frailty the shop, the true Name the stock-in-trade,
    meditation and contemplation the vessels, and dealings in the true Name the source
    of profit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When his father advises him to trade in horses and visit foreign countries,
    Nanak replies by making hearing of sacred books the merchandise, truth the horses,
    virtues the travelling expenses, and arrival in the land of God the place of happiness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When his father urges government service, Nanak replies by making attention
    his service, faith in the Name his occupation, restraint of evil his effort, and
    divine favour the result.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nanak tells his father that God has granted the object of his prayers and
    has imparted to him the gains of commerce, government service, and banking.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hymn in the passage says that God’s greatness cannot be estimated or described,
    that even meditative men, appraisers, and religious specialists cannot describe
    a small portion of it, and that those who seek to describe God are absorbed in
    God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nanak’s mother asks him to forget his devotions for a few days and go abroad,
    but Nanak answers that repeating the Name gives life, forgetting it is death,
    and hunger for the true Name is satisfied by the Name.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The final hymn segment says the Lord and His name are true, God gives daily
    bread, no one is like Him, He made day and night, and those who forget their Spouse
    are nothing without His name.
  category: speech
  evidence_refs:
  - ev:8
