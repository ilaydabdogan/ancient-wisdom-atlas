canonical_text:
  quote: ''
  summary: At Kartarpur, the aged minstrel Mardana falls ill and discusses with the
    Guru how his body should be disposed of after death. Mardana rejects bodily pride
    and the idea of a stone tomb. The Guru instructs him to sit by the river Ravi
    in prayer, repeating God’s name, and says his soul will be absorbed in the light
    of God. After Mardana dies, the Guru and Sikhs consign his body to the river,
    read Sohila, distribute karah parshad, and counsel his son and relations not to
    mourn because he is returning to his heavenly home. Shahzada, Mardana’s son, continues
    as the Guru’s faithful friend and minstrel. The passage then gives a slok against
    wine, contrasting intoxicating drink and its associated passions with good conduct,
    truth, God’s name, merits, and modesty.
  language: English
  quote_policy: summarized
