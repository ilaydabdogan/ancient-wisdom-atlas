canonical_text:
  quote: ''
  summary: Babar offers the Guru bhang, but the Guru replies with a hymn in which
    fear of God is his true intoxicant and he begs for a sight of God. The Guru later
    falls into a trance while distressed over prisoners, rises amid a radiance likened
    to a thousand suns, and asks Babar to free the captives. Babar complies and seeks
    instruction; the Guru counsels justice, reverence for holy men, abstention from
    wine and gambling, mercy to the defeated, and worship of God. At parting, Babar
    urges the Guru to embrace Islam, but the Guru responds that there is one God above
    all prophets. When invited to ask a favor from Babar, the Guru says that God alone
    is the giver and that one who begs from Babar is foolish.
  language: English
  quote_policy: summarized
