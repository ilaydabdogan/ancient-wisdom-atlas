candidate_motifs:
- id: motif:1
  label: Divine Beloved and bridal separation-union
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: The passage repeatedly frames the devotional relation as a woman or wife
    separated from, longing for, or united with the Beloved/Husband/Spouse.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage uses devotional and poetic bridal language; it should not
    be treated as a literal marriage narrative without further context.
- id: motif:2
  label: Liberating crossing by ferry or boat
  taxonomy_refs:
  - afterlife_journey_map
  - ark_vessel
  basis: The passage mentions the true way to swim across, a ferry, a ferryman, a
    boat associated with the Guru, the other side, and travellers carrying baggage.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The crossing is presented in a devotional-soteriological context; the
    passage does not provide a detailed afterlife itinerary.
- id: motif:3
  label: Guru as mediating guide to emancipation
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The Guru gives instruction, enables the search of the body-house, unites
    the devotee with the Beloved, places people in the boat, and gives or procures
    emancipation.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: This is a doctrinal and devotional pattern in the passage, not a separate
    adventure narrative.
- id: motif:4
  label: Salvific power of the divine Name
  taxonomy_refs:
  - wisdom
  basis: God’s Name subdues passions, grants the boon sought in the body-house, exalts
    even Brahma, Vishnu, and Shiv, and is necessary for salvation and deliverance.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage states the saving efficacy of the Name directly; broader theological
    classification requires external context not used here.
- id: motif:5
  label: Transient human kinship versus enduring divine relation
  taxonomy_refs:
  - divine_beloved
  basis: The passage lists relatives who do not remain, while the relationship with
    the Beloved found through the Guru never breaks.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is framed as devotional instruction rather than a genealogical myth.
- id: motif:6
  label: Precious jewels as divine praise and wisdom
  taxonomy_refs:
