- id: motif:7
  label: Death as tax-gatherer overcome by cooled mind
  taxonomy_refs:
  - divine_judgment
  basis: Death is personified as a tax-gatherer, and the one free of avarice with
    a cool mind owes no tax to Death.
  evidence_refs:
