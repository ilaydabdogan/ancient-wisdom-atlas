canonical_text:
  quote: ''
  summary: The passage teaches restraint, devotion to God’s Name, and dependence on
    the Guru. It presents the soul or devotee through the imagery of a woman or wife
    separated from or united with the divine Beloved/Husband; contrasts passing family
    ties with an enduring divine relationship; depicts a ferry, boat, baggage, and
    the other side; describes the Guru as a lake with swans and jewels; states that
    the Guru grants emancipation; personifies Death as a tax-gatherer; and closes
    with a body-soul image and God speaking through wind, water, and fire.
  language: English
  quote_policy: summarized
