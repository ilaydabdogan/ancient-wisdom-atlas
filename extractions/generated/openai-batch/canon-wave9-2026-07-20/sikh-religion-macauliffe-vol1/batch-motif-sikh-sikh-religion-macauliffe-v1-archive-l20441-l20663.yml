canonical_text:
  quote: ''
  summary: The passage gives devotional instructions using dance and ritual imagery;
    asserts God's superiority to mythic beings and heroic feats associated with Ram
    and Krishan; presents God as bridegroom and spouse; describes the necessity of
    holiness, the Word, the Name, and the Guru; internalizes Brahmanical ritual signs
    as devotion to God; and concludes with the body as a frail vessel and the world
    as a dangerous ocean crossed only through the divine Guru.
  language: English
  quote_policy: summarized
