candidate_motifs:
- id: motif:1
  label: Devotion expressed as transformed dance
  taxonomy_refs: []
  basis: Dance implements and postures are recast as truth, contentment, vision of
    God, love, fear of God, and knowledge of bodily ashes.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage uses dance imagery devotionally; no broader dance-initiation
    taxonomy is asserted.
- id: motif:2
  label: Supreme deity surpasses heroic mythic feats
  taxonomy_refs: []
  basis: God's creation, pervasion, and unbounded greatness are contrasted with the
    slaying of Rawan, the serpent feat, the slaying of Kans, and the churning of the
    sea of milk.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage cites these episodes rhetorically rather than narrating their
    full mythic versions.
- id: motif:3
  label: Soul as bride of the divine Bridegroom
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: The first-person speaker rejoices at the Bridegroom's arrival, the Guru brings
    about the marriage, God is called the Spouse of all, and the favoured one is the
    happy wife.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage's own prose says the Guru compares himself to a bride; the
    extraction does not add details beyond that bridal imagery.
- id: motif:4
  label: Word and Name cultivated as a tree with fruit
  taxonomy_refs: []
  basis: The passage instructs making the Word a garden tree, planting it in good
    soil, irrigating it with love, and identifying the one Name as the fruit.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Although a tree is central, the passage does not explicitly present a
    world-tree or axis.
- id: motif:5
  label: Living by dying through the Guru's teaching
  taxonomy_refs:
  - death_rebirth
  - annihilation_union
  basis: The passage asks how a person may live except by dying by the Guru's teaching,
    and also speaks of absorption in God by the Guru's favour.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text uses devotional and mystical language; it does not narrate a
    literal death and rebirth.
- id: motif:6
  label: Internalization of ritual signs
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The Brahmanical loin-cloth, sacrificial thread, grass, frontal mark, alms,
    worship, and incense are replaced with body, heart, divine knowledge, meditation,
    the Name, remembrance, love of God, and rejection of love of wealth.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is ethical-devotional rather than a narrative quest episode.
- id: motif:7
  label: Name meditation reveals God beyond ceremonial and textual means
  taxonomy_refs:
  - wisdom
  basis: Repeating and pondering God's name leads to beholding God, while ceremonial
    acts, religious books, the eighteen Purans, and four Veds are said not to reveal
    God's secret; the true Guru shows God.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage contrasts devotional knowing with ritual and textual knowledge
    but does not provide a systematic doctrine.
- id: motif:8
  label: Dangerous ocean of the world crossed through the divine Guru
  taxonomy_refs:
  - mystical_quest
  basis: The body is a frail earthen vessel suffering in birth and death, and the
    world is a dangerous ocean that cannot be crossed without the divine Guru.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The crossing is soteriological and metaphorical in this passage; no geographic
    journey is narrated.
- id: motif:9
  label: Divine distribution of woe, weal, and reward
  taxonomy_refs:
  - divine_judgment
  basis: The passage says creatures are God's, none obtains reward without devotion,
    and woe and weal are distributed according to God's will.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage emphasizes divine will and devotion more than a formal judgment
    scene.
comparison_claims:
- id: claim:1
  claim: The passage juxtaposes Sikh devotion to God with cited Hindu mythic episodes
    by presenting Ram and Krishan as creatures and asking what greatness was obtained
    through feats associated with Rawan, the Jamna serpent, Kans, and the sea of milk.
  claim_level: same_function
  target: Hindu Ram/Krishan heroic and divine-feat episodes cited in the passage
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage cites these episodes polemically and briefly; it does not
    retell the full Ram or Krishan narratives.
- id: claim:2
  claim: A translator's note says Krishan, in some ways, resembles the Hercules of
    Greece.
  claim_level: same_function
  target: Hercules of Greece
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: The note is vague and does not specify which traits or episodes constitute
    the resemblance.
