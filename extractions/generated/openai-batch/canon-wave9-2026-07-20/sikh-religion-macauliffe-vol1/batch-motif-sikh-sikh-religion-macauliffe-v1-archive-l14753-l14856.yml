canonical_text:
  quote: ''
  summary: The passage says that rebirth and deliverance depend on God’s will, that
    interference brings punishment, and that God grants the boon of praising Him.
    It then praises God’s attributes, dealings, justice, court, measures, gifts, mercy,
    and ordinances as priceless. It lists many scriptural, learned, divine, demonic,
    human, ascetic, and servant groups who speak of God, while concluding that only
    the True One knows His own greatness and that improper speech about God marks
    ignorance.
