  text: When weighing provisions, Nanak paused at the number thirteen, tera, and repeated
    the word because it also meant “Thine.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mardana came from Talwandi, became Nanak's private servant, and accompanied
    him on the rabab; other friends followed and received employment through Nanak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nanak and his companions sat together at dinner and sang every night; before
    dawn Nanak went to the Bein river for ablutions before office work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: One day after bathing, Nanak disappeared in the forest and was taken in a
    vision to God's presence.
  category: action
  evidence_refs:
  - ev:5
