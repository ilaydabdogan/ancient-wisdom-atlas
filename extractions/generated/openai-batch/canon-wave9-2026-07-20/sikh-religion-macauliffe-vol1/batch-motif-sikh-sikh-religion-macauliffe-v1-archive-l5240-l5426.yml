canonical_text:
  quote: ''
  summary: The passage narrates Nanak's appointment as storekeeper under Daulat Khan,
    his charitable distribution of provisions, devotional singing, association with
    Mardana and other followers, daily ablutions at the Bein river, visionary disappearance
    after bathing, reception of a cup of nectar and divine commission, hymns before
    God, recognition as divine Guru, return after three days, renunciation of possessions,
    and a subsequent attempted exorcism by a Mulla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jai Ram introduced Nanak to Governor Daulat Khan, who appointed him storekeeper
    and gave him a dress of honour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nanak performed his duties in a way that pleased others, used only a small
    portion of his provisions for himself, gave the rest to the poor, and spent nights
    singing hymns to his Creator.
  category: sequence
  evidence_refs:
  - ev:2
