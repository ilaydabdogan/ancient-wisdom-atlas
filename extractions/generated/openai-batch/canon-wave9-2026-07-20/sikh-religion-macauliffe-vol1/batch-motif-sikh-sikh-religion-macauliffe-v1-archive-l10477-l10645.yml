canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes about Guru Nanak: a brief fragment
    about a soul entering a wolf because of desire at death; Duni Chand’s lesson that
    wealth cannot accompany him to the next world unless given in God’s name; hymns
    on the falsity of worldly attachments; Nanak’s dwelling by the Ravi and public
    reverence; a hostile millionaire official whose afflictions cease when he humbly
    approaches Nanak and who then founds Kartarpur; and a Brahman whose elaborate
    food-purity rules are frustrated by bones in the earth, after which Nanak teaches
    that ritual observances are nothing without the true Name and knowledge of God.'
  language: English
  quote_policy: summarized
