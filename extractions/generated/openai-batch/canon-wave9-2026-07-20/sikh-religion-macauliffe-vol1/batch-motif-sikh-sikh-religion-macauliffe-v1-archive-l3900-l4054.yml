canonical_text:
  quote: ''
  summary: The passage presents hymnic exhortations to meditate on God, be absorbed
    in the True One, and write God’s Name and praises as a true spiritual account.
    In the narrative, Nanak refuses ordinary schoolwork, says he prefers divine knowledge,
    composes a hymn using writing and bookkeeping imagery, and is honored by the schoolmaster
    as a saint. He then leaves school for private study, meditation, and association
    with religious men in the forests around Talwandi. A concluding verse contrasts
    other practices with Nanak’s desire to hear songs of the divine Beloved.
  language: English
  quote_policy: summarized
