canonical_text:
  quote: ''
  summary: At Batala, Guru Nanak defeats priests and adherents of the six schools
    in argument. Jogis praise him and offer the Sidhs’ cup of wine; Nanak answers
    with a hymn that replaces alcoholic ingredients with divine knowledge, meditation,
    good actions, love, devotion, and nectar. The Jogis then ask whether he is a beggar,
    Udasi or hermit, Audhut, Jogi, and Bairagi; he answers by defining each status
    through inner restraint, truth, devotion, divine knowledge, remembrance of God,
    and abandonment of pride and passions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Batala, Guru Nanak vanquishes priests at the fair in argument and causes
    followers of the six schools of philosophy to bow before him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jogis praise Nanak’s deeds and say he has lit a light in the last age
    of the world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the Jogis’ daily wine-taking, a goblet called the Sidhs’ cup is passed
    to Nanak; its contents are described as molasses and dhava flowers used for spirits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nanak’s hymn reassigns the materials and apparatus of distillation to divine
    knowledge, meditation, good actions, love of God, devotion, and nectar.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hymn states that drinking divine juice intoxicates the mind, absorbs it
    in God’s love, and that God gives a pure cup to one on whom He casts a favouring
    glance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: When asked if he lives by begging, Nanak asks why one absorbed in the Formless
    should go to beg alms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nanak defines a hermit as one who takes the sword of knowledge, wrestles with
    the heart, knows the organs and evil passions, knots divine knowledge to the mind,
    makes pilgrimage daily, and washes pride from the heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nanak defines an Audhut through service to the Guru, restraint, freedom from
    worldly desires, truthful words, meekness, profitable instruction, steadiness
    of mind, avoidance of spectacles, gambling, scandal, and obedience to the true
    Guru.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nanak defines marks of a Jogi as unsupported sitting, restraint of the five
    evil passions, little sleep, scant food, guarding the saintly body, devotion,
    penance, self-restraint, remembrance of God, and divine wisdom in speech.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nanak further says the Jogi contemplates God day and night, attaches a string
    to the vacant sphere, receives the Guru’s favour, is honoured by gods, and avoids
    tasting dainties.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nanak says the Jogi effaces wrath, avarice, and greed, quenches the fire of
    the five evil passions, flies a kite producing divine knowledge, cherishes holiness,
    restrains evil passions, and repeats the Guru’s spell.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nanak uses a milk-churning image in which the body is a vessel, remembrance
    of God is milk, truth is acid, divine knowledge is a churning staff, the Name
    is a string, and butter is extracted by repeated rolling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nanak defines a Bairagi as one sold to God, subduing mammon before God, performing
    both divine and worldly work, bearing an unbearable intangible thing, and abandoning
    wrath, avarice, and pride.
  category: speech
  evidence_refs:
  - ev:8
