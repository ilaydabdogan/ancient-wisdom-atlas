canonical_text:
  quote: Make mercy thy cotton, contentment thy thread, continence its knot, truth
    its twist.
  summary: The passage narrates an attempted childhood investiture of Nanak with the
    Hindu janeu, his questioning and critique of the physical thread, and his substitution
    of moral and spiritual qualities as the true thread. It then recounts the arranged
    marriage of Nanaki to Jai Ram and the arranged betrothal and marriage of Nanak
    to Sulakhani.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When Nanak was nine, his father decided that he should be invested with the
    Hindu janeu or sacrificial thread.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a boy not invested with the janeu was deemed almost
    an outcast, and that family, relations, neighbours, and religious and secular
    persons assembled for the rite.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hardial, the family priest, proceeded to put the sacred thread on Nanak's
    neck, but Nanak caught the thread and asked what was being done and what advantage
    the thread would bring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priest said the janeu was the basis of the Hindu religion and would bring
    greatness in this world and happiness in the next.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nanak answered by describing a janeu for the soul made of mercy, contentment,
    continence, and truth, and said such a thread would not break, soil, burn, or
    be lost.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nanak contrasted the purchased physical janeu with the soul's departure at
    death, saying the thread falls away when a person dies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priest explained that the custom came from Vedic ritual and told Nanak
    that without the thread he would be considered without religion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nanak described people committing thefts, adulteries, falsehoods, abuses,
    robberies, and villanies while the cotton thread is still spun and put on.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nanak said that a goat is killed, cooked, and eaten for the ceremony, and
    that when the thread becomes old it is thrown away and replaced.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the priest became angry and asked what a proper janeu was, Nanak said
    that adoring and praising the Name gives honour and a true thread fit for entrance
    into God's court.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nanak said there is no string for various organs, actions, women, or senses,
    and criticized the Brahman for twisting neck strings, taking hire for marrying,
    and showing the fate of a wedded pair on paper while mentally blind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the later account, Jai Ram, an Amil appraising revenue at Talwandi, saw
    Nanaki drawing water from a well, and a marriage between them was arranged through
    Rai Bular.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Nanak was later betrothed to Sulakhani, daughter of Mula of Batala; his marriage
