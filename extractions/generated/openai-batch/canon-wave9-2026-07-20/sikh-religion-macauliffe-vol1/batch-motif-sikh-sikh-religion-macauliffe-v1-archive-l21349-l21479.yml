canonical_text:
  quote: ''
  summary: The passage contains Sikh hymnic verses in which the speaker calls himself
    a servant at God's gate, says holy men reach God's court through the Name, urges
    truth, contentment, love, and recognition of the true Word, and asks to meet God
    after separation. A narrative frame says Bhai Budha and Mula ask the Guru about
    the highest gratification. The reply uses bride-and-spouse language for the soul's
    love and union with God, marketplace language for purchasing God's name and exchanging
    hearts with God, and ends by comparing the soul's capture by Death to a deer,
    bumble-bee, and fish caught in snares, with a warning about the sweetness and
    bitterness of sin.
  language: English
  quote_policy: summarized
