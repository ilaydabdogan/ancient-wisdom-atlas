  summary: A poetic response attributed to the Guru/Nanak answers Mian Mitha’s question
    about gaining distinction in God’s court and the fate of wicked souls after death.
    The passage describes worship, the true Name, divine accounting, armed heavenly
    messengers, postmortem punishment, Death’s court, testimony by the senses, and
    repeated transmigration for the soul without divine knowledge.
