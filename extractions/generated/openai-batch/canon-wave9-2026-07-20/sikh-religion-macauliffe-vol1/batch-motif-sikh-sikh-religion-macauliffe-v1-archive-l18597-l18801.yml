canonical_text:
  quote: ''
  summary: The passage presents hymnic teaching on the Guru-given Name, truth, divine
    favor, and deliverance. It contrasts devotion and inner realization with worldly
    possessions, family attachment, bodily pride, wealth, rank, and mortality. It
    uses images of God’s court, pure wealth, the world as dream and ocean, a terrifying
    mountain, water and milk as life-sustaining analogies, fire, dust, and lampblack
    to describe salvation, impermanence, and spiritual danger.
  language: English
  quote_policy: summarized
