canonical_text:
  quote: ''
  summary: 'The passage presents Sikh devotional and ethical teaching attributed mainly
    to Guru Angad and Guru Nanak. It contrasts worldly attachment with absorption
    in God, warns against evil deeds, pride, lip-worship, falsehood, and foolish companionship,
    and uses analogies of court judgment, dice, servant and master, vessels, milk,
    fire, water, chains, horses, and birth and death. It repeatedly emphasizes divine
    sovereignty: God creates, destroys, arranges, gives, sustains, judges, and regenerates
    those favored by Him.'
  language: English
  quote_policy: summarized
