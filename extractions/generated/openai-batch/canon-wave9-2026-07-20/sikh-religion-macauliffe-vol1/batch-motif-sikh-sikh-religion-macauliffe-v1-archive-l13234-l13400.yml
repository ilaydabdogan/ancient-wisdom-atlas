canonical_text:
  quote: ''
  summary: In Khadur, Lahina hears Jodha reciting Guru Nanak’s Japji, meets the Guru,
    gives up dancing before Durga, and begins repeating God’s name and serving the
    Guru. A vision of Durga serving Guru Nanak confirms Lahina’s faith. Guru Nanak,
    with a Jogi, tests followers in a forest by assuming a frightening huntsman guise
    and presenting successive temptations of copper, silver, and gold coins. Only
    the Jogi, two Sikhs, and Lahina remain. At a foul-smelling corpse on a funeral
    pyre, the Guru orders anyone who wishes to accompany him to eat from it. Lahina
    obeys and asks where to begin; when he lifts the sheet, the corpse is said to
    have become sacred food. Lahina offers it first to the Guru. Guru Nanak teaches
    that shared wealth is sacred food, gives Lahina the preamble of the Japji as a
    spell, instructs him to repeat it, embraces him, renames him Angad, and promises
    him succession.
  language: English
  quote_policy: summarized
