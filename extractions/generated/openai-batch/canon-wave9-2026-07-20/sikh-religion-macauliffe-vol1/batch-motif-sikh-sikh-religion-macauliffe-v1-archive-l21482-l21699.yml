comparison_claims:
- id: claim:1
  claim: The passage explicitly contrasts meditation on God’s Name and inner heart-worship
    with idol washing and offerings to Brahmans as represented in the passage.
  claim_level: same_function
  target: Hindu idol worship and Brahmanical offering practices as depicted in this
    passage
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This claim is limited to the passage’s own polemical presentation and
    does not assess historical Hindu practice outside the source.
- id: claim:2
  claim: The passage invokes the Hindu cosmological image of Brahma arising from Vishnu’s
    navel-lotus, but uses it to emphasize that Brahma cannot perceive the limitless
    God.
  claim_level: same_motif
  target: Brahma-from-Vishnu’s-navel-lotus cosmological motif
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage cites the image briefly and subordinates it theologically;
    it does not narrate the broader Hindu cosmogony.
- id: claim:3
  claim: The image of crossing the ocean of the world functions as a devotional salvation
    pattern in which God’s Name and good works enable passage beyond worldly existence.
  claim_level: same_function
  target: religious crossing-over or world-ocean salvation pattern
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself supplies the crossing image but not a detailed comparative
    corpus or historical derivation.
