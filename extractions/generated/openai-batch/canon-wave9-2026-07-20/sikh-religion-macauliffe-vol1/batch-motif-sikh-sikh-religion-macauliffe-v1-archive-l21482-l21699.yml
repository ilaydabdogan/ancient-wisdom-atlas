canonical_text:
  quote: Repeat God’s name and do good works ; thus shalt thou cross over the ocean
    of the world.
  summary: The passage exhorts the soul to remember God’s Name, warns that worldly
    desire and forgetfulness lead to death, punishment, and transmigration, contrasts
    inner devotion with idol worship and Brahmanical offerings, invokes Brahma and
    Vishnu while emphasizing God’s limitless superiority, and presents the Guru’s
    instruction as the way to knowledge, peace, and crossing the ocean of the world.
