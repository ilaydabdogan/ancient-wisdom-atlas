canonical_text:
  quote: ''
  summary: A shopkeeper in Ceylon keeps Sikh devotional discipline despite local religious
    pressure. Raja Shivnabh summons him and questions him. The shopkeeper says he
    has obtained salvation by beholding Guru Nanak and says that repetition of Nanak’s
    name can confer salvation. After hearing a translated hymn, the Raja asks to see
    Nanak; the shopkeeper instructs him to meditate on Nanak in his heart. The shopkeeper
    returns to India by ship, while the Raja remains at home longing to behold the
    Guru.
  language: English
