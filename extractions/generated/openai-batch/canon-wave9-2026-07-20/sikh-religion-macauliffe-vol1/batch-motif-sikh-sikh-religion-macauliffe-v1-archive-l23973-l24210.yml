canonical_text:
  quote: ''
  summary: A didactic Sikh passage warns that those who forget God's Name, follow
    evil passions, or act falsely suffer pain, hell, transmigration, the taking of
    accounts, and the difficult road of death. It contrasts this with service to the
    true Guru, singing God's praises, truthful conduct, and the merchandise of God's
    Name, through which one may see God's court, receive honour, and be absorbed in
    God. The passage also names Narad and Saraswati as servants of the Lord, describes
    the Creator as sustaining earth and creating species, criticizes empty scriptural
    disputation without the true Guru, and gives instruction to Taru and Bharu to
    reject vices, break superstition, and behold inner light through the perfect Guru.
  language: English
  quote_policy: summarized
