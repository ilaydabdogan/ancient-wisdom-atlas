canonical_text:
  quote: ''
  summary: Nanak’s family worries that he is mad after he rejects ordinary occupation
    and conduct. His uncle tries to console him, and Nanak responds with hymnic speech
    that replaces biological kinship with virtues and names one God as Lord. Nanak
    then refuses food and drink; his family calls a physician. When the physician
    tries to diagnose him by the pulse, Nanak says his pain is inward and caused by
    separation from God, and that ordinary medicine cannot cure it. Further verses
    describe the Name of God as antidote and prescription, instruct the burning of
    passions in the fire of divine knowledge, and contrast worldly status with the
    final hour and final home. The physician concludes Nanak is not ill, calls him
    a great being, worships him, and leaves. The passage closes with a brief note
    on Nanak’s sons and his practice of religious contemplation in the desert under
    trees.
  language: English
  quote_policy: summarized
