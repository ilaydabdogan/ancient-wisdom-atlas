candidate_motifs:
- id: motif:1
  label: Worldly splendor followed by aging and failure to know God
  taxonomy_refs:
  - wisdom
  basis: The passage contrasts pleasure, authority, and display with ignorance of
    God and the inevitable failure of youth in old age.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a moral and devotional teaching rather than a narrative myth episode.
- id: motif:2
  label: Inner purity and divine knowledge over ritual impurity
  taxonomy_refs:
  - wisdom
  basis: The childbirth impurity scene and verses reject literal impurity as universal
    and locate cleansing in divine knowledge and moral conduct rather than external
    washing or ritual food purity.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage critiques ritual purity practices; it does not present a separate
    purification rite as successful.
- id: motif:3
  label: Guru-mediated encounter with God and removal of inner evil
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Pauri XVIII says the True Guru can cause meeting with God, place a hand on
    foreheads, and remove evil from within.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage is hymnic and doctrinal; it gives no extended quest narrative.
- id: motif:4
  label: Woman as necessary vessel of birth, society, and kingship
  taxonomy_refs: []
  basis: Guru Nanak’s remonstrance says man is conceived, born, betrothed, married,
    socially connected, and succeeded through woman, and asks why she should be called
    bad when kings are born from her.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage uses a metaphor of vessel for woman but does not identify
    woman as a goddess or mythic mother figure.
- id: motif:5
  label: Divine court, account, and punishment of wrongdoers
  taxonomy_refs:
  - divine_judgment
  basis: The passage says each person bears the result of acts and adjusts an account;
    evil speakers are rejected in God’s court, and the wicked have accounts examined
    and are pressed like oil in a mill.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: The judgment imagery is moral-theological; details of an afterlife itinerary
    are not supplied.
- id: motif:6
  label: Inner virtue concealed by outward poverty
  taxonomy_refs:
  - wisdom
  basis: Those with silk within and rags without are praised, while those foul within
    and fair without remain filthy despite pilgrimage bathing.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage presents contrastive ethical imagery, not a full disguise
    narrative.
- id: motif:7
  label: World as losing and winning dice under divine observation
  taxonomy_refs: []
  basis: Pauri XX says God beholds losing and winning dice on earth after creating
    and empowering the world.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage gives only a brief image and does not elaborate a myth of
    divine gaming.
- id: motif:8
  label: Dependence on divine provision
  taxonomy_refs:
  - sacred_exchange
  basis: Devotees beg for food at God’s door and eat only when God gives it to them.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The exchange is devotional dependence rather than a reciprocal bargain
    or sacrifice.
