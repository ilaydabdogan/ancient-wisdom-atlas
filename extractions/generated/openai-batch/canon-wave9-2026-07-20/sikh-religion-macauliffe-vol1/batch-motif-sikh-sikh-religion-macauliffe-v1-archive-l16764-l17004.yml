  summary: The passage presents Japji verses and prose contexts concerning worldly
    pleasures, ritual impurity after childbirth, impurity of heart and speech, the
    True Guru’s grace, critique of ritual purification, defense of women as the source
    of human birth and kings, moral accountability in God’s court, inner devotion,
    and God as creator who watches the world where all beings depart in turn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pauri XVII describes fleet caparisoned horses, adorned women, mansions, pavilions,
    palaces, pleasures, authority, women’s chambers, and the later coming of old age
    when youth fails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: A rich man hosts a feast; Guru Nanak and several Brahmans are invited; a child
    is born in the house; the Brahmans refuse food and leave because they deem the
    house impure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: Guru Nanak’s verse says that if impurity is admitted, impurity is in everything,
    including cow-dung, wood, grain, and water by which things become green.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:4
  text: Guru Nanak’s verse says impurity is washed away by divine knowledge, and identifies
    impurity of heart, tongue, eyes, and ears with greed, falsehood, coveting, and
    slander.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: The passage states that birth and death are ordained, that people come and
    go as God pleases, that divinely sent food and drink are pure, and that those
    who know God have no impurity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pauri XVIII says the True Guru may cause people to meet God, place his hand
    on their foreheads, remove evil from within, and obtain the nine treasures when
    God is pleased.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Slok XIX describes a Brahman purifying himself, sitting in a purified square,
    eating purified food, and reciting Sanskrit verses; it then says food entering
    a sinful body becomes impure and the mouth without the Name is like one spat upon.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Guru Nanak remonstrates with a man who reviled women, saying that man is conceived,
    born, betrothed, married, socially bound, and succeeded through a woman described
    as a vessel, and that kings are born from her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pauri XIX says everyone must bear the result of their own acts and adjust
    their own account, and also instructs the hearer not to call anyone bad.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Slok XX says one who speaks evil is evil in mind, body, and reputation, is
    rejected in God’s court, has his face spat upon, and receives shoe-beatings as
    punishment.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage contrasts those foul within and fair without, whose filth remains
