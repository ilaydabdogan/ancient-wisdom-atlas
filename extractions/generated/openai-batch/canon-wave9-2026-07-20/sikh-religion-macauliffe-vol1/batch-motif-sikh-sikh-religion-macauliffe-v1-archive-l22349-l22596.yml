canonical_text:
  quote: ''
  summary: The passage contains devotional addresses to the one True Being as Lord,
    Beloved, and Spouse; reflections on human life, deceit, death, divine knowledge,
    and moral recompense; a Guru’s moralization on a thief and instruction to a Brahman,
    Qazi, and Jogi; teachings that God is pleased by love, service, and remembrance
    of the Name rather than external ritual; and spouse imagery for truth, merit,
    divine acceptance, and union.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the Merciful One, Lord, and Beloved, says he will cross
    over by the divine name, seeks attachment to that name, and calls himself a sacrifice
    and slave of the deity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that in the whole world there is only one True Being and
    no second.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Human life is described as very brief, and people are urged to serve the one
    to whom their souls and lives belong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A deceitful person who neglects God’s name is described as being led captive
    to the gate of Death and regretting lost opportunities.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the thief moralization, a thief’s praise or reviling of the magistrate
    does not change the magistrate; nobody stands surety for a thief, and a bad coin
    is exposed when assayed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage says that as a person acts, so is his reward: he sows and eats
    the fruit, and God knows his secret.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Brahman, a Qazi, and a Jogi enter discussion with the Guru; the Guru’s instruction
    compares the body to paper, the mind to an order written on it, and destiny to
    writing on the forehead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Qazi, Brahman, and Jogi are criticized, then each ideal role is redefined
    in terms of turning from the world, knowing the way to God, reflecting on God,
    and cleansing impurity or the heart.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: God is said not to be pleased by obstinate penance, many religious garbs,
    stone worship, pilgrimages, forest dwelling, or wandering renunciation, but by
    love and service.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Those who forget God’s name despite reading are said to suffer punishment
    and transmigration; one who repeats the Name and eats the food of fear becomes
    a worshipper and is absorbed in God.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A woman who pleases her Spouse is said to be honored in His house, while a
    false woman is not looked at by her Spouse and has painful nights.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage contrasts dwelling at home with wandering abroad, and asks why
    one would forsake ambrosia and eat poison.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The True One is described as pervading water, dry land, the nether regions,
    and the firmament.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Guru depreciates himself, says he has demerits and no merit, asks how
    he can meet his Spouse, and states that a woman adorned with divine knowledge
    becomes a happy wife if she pleases her Spouse.
  category: speech
  evidence_refs:
  - ev:9
