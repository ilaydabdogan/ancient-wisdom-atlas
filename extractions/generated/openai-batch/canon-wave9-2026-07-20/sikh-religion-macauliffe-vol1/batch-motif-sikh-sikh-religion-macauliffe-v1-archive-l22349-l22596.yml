- id: motif:1
  label: Crossing or salvation through the divine Name
  taxonomy_refs:
  - afterlife_journey_map
  - mystical_quest
  basis: The passage says the speaker will cross over by the deity’s name and later
    states that repetition of the Name leads to worship and absorption in God.
