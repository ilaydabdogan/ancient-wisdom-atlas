- id: motif:2
  label: Divine beloved and spouse relationship
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: The deity is addressed as Beloved and Spouse; a woman or wife is honored
    if she pleases the Spouse, and the speaker asks how to meet the Spouse.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage presents devotional spouse imagery rather than a narrative
    wedding episode.
- id: motif:3
  label: Divine judgment and moral recompense
  taxonomy_refs:
  - divine_judgment
  basis: The passage includes the gate of Death, God’s court, punishment, transmigration,
    divine knowledge of secrets, and the rule that one eats the fruit of what one
    sows.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The judgment imagery is moral and devotional, not a single continuous
    courtroom narrative.
- id: motif:4
  label: Inner truth versus counterfeit external appearance
  taxonomy_refs:
  - wisdom
  basis: The thief may be well dressed but remains a bad coin; counterfeit is useless
    in God’s court, while sterling silver is recognized; external religious acts are
    subordinated to love, service, and purity.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a didactic pattern rather than a mythic plot.
- id: motif:5
  label: Body as written record of destiny
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The passage compares the body to paper, the mind to an order written on it,
    and destiny to lines engraved on the forehead and a stamp of God’s court.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The image is compact and occurs within instruction to religious specialists.
- id: motif:6
  label: Absorption or union with God through inward devotion
  taxonomy_refs:
  - annihilation_union
  basis: The passage says one who repeats the Name becomes a worshipper and is absorbed
    in God; it also praises being dead while alive in the Guru-favored Qazi and speaks
    of union with God.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives doctrinal statements and metaphors, not a staged mystical
    ascent narrative.
- id: motif:7
  label: Home-based devotion versus wandering renunciation
  taxonomy_refs:
  - wisdom
  basis: The text contrasts practicing devotion at home with wandering abroad, asks
    why one forsakes ambrosia for poison, and criticizes pilgrimage, forest dwelling,
    and wandering renunciation when the mind remains impure.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The departure/wandering element is rejected, so it should not be treated
    as a heroic journey motif.
- id: motif:8
  label: Urgency of devotion in brief human life
  taxonomy_refs:
  - wisdom
  basis: The passage says human beings live only for a moment, may not live even a
    short span, and should serve the one to whom their souls and lives belong.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The motif is ethical and exhortatory rather than narrative.
- id: motif:9
  label: Devotional self-offering to the deity
  taxonomy_refs:
  - sacrifice
  basis: The speaker repeatedly calls himself a sacrifice to the deity and says he
    could bear to be cut to pieces for the divine Name.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The language appears devotional and figurative; the passage does not describe
    an actual sacrificial rite.
