canonical_text:
  quote: ''
  summary: The passage praises God as sole benefactor, eternal, formless, beyond destiny,
    and present as light in every heart. It warns of future punishment for sin and
    exclusion for those without the Guru. It presents the Guru as the means of knowing
    God, receiving the Name, obtaining the water or nectar of life, and becoming united
    with God. It internalizes pilgrimage and purification by locating God and the
    water of life in the heart and home, rejects external disguises, mammon-driven
    worship, tombs, and cremation places, and defines the true Bairagi as one pleasing
    to God.
  language: English
  quote_policy: summarized
