canonical_text:
  quote: "“I am water, he is air, a superior element.”"
  summary: The Guru travels south with Saido and Gheho. After mistaking his morning
    ablutions for worship of the river god Khwaja Khizir, the companions try to worship
    Khwaja Khizir themselves and meet a fish-bearing figure who says he is the river
    god bringing an offering to the Guru and deriving power from him. The companions
    confess to the Guru, who composes hymns identifying the True Guru, divine knowledge,
    and the Name as salvific. The passage then shifts to a Jain temple, where the
    Jain priest Narbhi questions the Guru about life-destroying practices; the Guru
    replies with verses on the mercy of the True Guru and then satirizes Jain ascetic
    practices.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Guru journeys to southern India, wearing wooden sandals, carrying a stick,
    using a rope as a turban, and bearing a patch and streak on his forehead; Saido
    and Gheho accompany him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saido and Gheho interpret the Guru’s morning ablutions as worship of the river
    god Khwaja Khizir and decide to worship the same god in hopes of surpassing the
    Guru spiritually.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night, while traveling for their worship, Saido and Gheho meet a man carrying
    a fish who identifies himself as the river god taking an offering to the Guru.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The river god states that his power comes from the Guru, not the Guru’s power
    from him, and contrasts himself as water with the Guru as air, a superior element.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Saido and Gheho prostrate before the Guru, confess their attempted worship
    of Khwaja Khizir, and ask forgiveness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Guru’s hymn describes divine knowledge as immortal water, the Guru’s instruction
    as jewels and gems, and the Guru as a river whose pure water washes away evil
    inclinations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A second composition says that those who forget the Name go astray, cling
    to branches rather than the stem, may wander in birth and death, and may die and
    go to hell; those who give their lives obtain honour in God’s court.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a frequented Jain temple, Narbhi the Jain priest comes with his disciple
    and questions the Guru about eating corn, drinking cold water, shaking trees for
    fruit, the Guru’s identity, and his power to pardon destruction of life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Guru replies that when the True Guru is merciful, faith is perfected,
    sorrow and fear of Death are removed, divine pleasure is enjoyed, nine treasures
    are obtained, and a person is absorbed in the True One.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage reports a satire on Jains describing hair plucking, drinking dirty
