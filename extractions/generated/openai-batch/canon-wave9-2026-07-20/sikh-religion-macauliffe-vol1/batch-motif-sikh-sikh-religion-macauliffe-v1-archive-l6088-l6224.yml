canonical_text:
  quote: ''
  summary: Guru Nanak instructs converts at Kurkhetar, then at Hardwar critiques ritual
    ablutions, ancestral water offerings, rosary-counting, cooking-place purity rules,
    and sacrifices when performed without love, devotion, truth, self-restraint, humility,
    and remembrance of God's Name. He uses a counter-gesture of throwing water westward
    to expose the perceived futility of eastward libations to distant ancestors. He
    then departs with Mardana toward Panipat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Guru made many converts at Kurkhetar and instructed his Sikhs to live
    harmoniously, utter the Creator''s name, reply with “Sat Kartar,” and approach
    God through four ways: holy companionship, truth, contentment, and restraint of
    the senses.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Hardwar, a large crowd had assembled from the four cardinal points to wash
    away sins.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that the people were cleansing their bodies while their
    hearts remained filthy and their minds were not restrained with love and devotion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people threw water toward the east for the manes of their ancestors, while
    the Guru cupped his hands and threw water toward the west.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The spectators questioned the Guru about what he was doing, his religious
    identity, and why he threw water westward rather than toward the rising sun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Guru asked why they threw water eastward, they replied that they
    were offering libations to the manes of their ancestors for their satisfaction
    and their own happiness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A learned man said the ancestors were thousands of miles distant.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Guru explained that before leaving his western home he had sown a field
    without anyone to irrigate it, so he was throwing water in its direction to keep
    it green.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spectators called the Guru's action futile and foolish because the water
    could not reach his field; the Guru replied that if his nearer field could not
    be reached, their far-off ancestors could not be reached by their water either.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The Guru told the people that they had forgotten God and that without love
    and devotion their minds had gone astray.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Guru said the Hindus were going to hell and that death would seize and
    punish them; a Brahman objected that those who repeat God's name should not go
    to hell.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Guru answered that repeating the Name with love prevents damnation, but
    rosary-counting is hypocrisy if the mind wanders toward worldly trade and gain.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The people thought the Guru had accurately divined their thoughts, began to
    regard him as a god, and asked him for pardon, salvation, and discipleship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the Guru sought fire in a Brahman's cooking-square, the Brahman accused
    him of defiling the food; the Guru replied that the food had already been defiled.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The composed verse depicts evil-mindedness, cruelty, slander, and wrath as
    polluting presences seated with the Brahman, and contrasts ritual cooking-place
    lines with truth, self-restraint, good acts, and utterance of the Name.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Brahmans urged the Guru to return to Hindu religion and praised sacrifices,
    burnt-offerings, and worship of cremation-grounds, gods, and goddesses; the Guru
    replied that in this age sacrifices and burnt-offerings consist in giving food
    to those who repeat God's name and practice humility.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Guru Nanak and Mardana departed from Hardwar and proceeded toward Panipat.
  category: action
  evidence_refs:
  - ev:10
