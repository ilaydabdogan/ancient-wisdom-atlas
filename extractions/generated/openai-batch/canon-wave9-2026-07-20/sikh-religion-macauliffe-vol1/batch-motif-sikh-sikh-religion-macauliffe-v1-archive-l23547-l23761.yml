candidate_motifs:
- id: motif:1
  label: Divine court and final reckoning
  taxonomy_refs:
  - divine_judgment
  basis: The passage explicitly describes God's court, the taking of accounts, a book
    produced by God in judgment, summoned debtors, Azrail placed over them, lack of
    escape, and a final triumph of truth.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The extraction describes the judgment imagery in this translated passage
    only; it does not infer a full doctrinal system beyond the passage.
- id: motif:2
  label: Soul as traveller on the road from this world to the next
  taxonomy_refs:
  - afterlife_journey_map
  basis: All souls are called travellers; the text speaks of the right road, a pointed-out
    road, the death-warrant, and recognizing God in the next world if known in this
    world.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The road language is partly ethical and partly eschatological; the passage
    does not provide a detailed map of afterlife places.
- id: motif:3
  label: Outward ritual marks fail without inner knowledge, Name, or Guru
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly lists external acts or marks—thread, cooking squares,
    ashes, earrings, ochre dress, patched coat, pilgrimage, washing, hair styles,
    silence—and contrasts them with good works, the Word, the Name, and the True Guru.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage is polemical and satirical; claims should be limited to the
    figures as portrayed here.
- id: motif:4
  label: True guide and divine Name as saving instruction
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The text says few travel the road, describes the proper Sanyasi as following
    the Guru's instruction, loving God's name, and being satisfied with it, and states
    that one repeating the Name is not examined hereafter.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The mystical_quest reference is supported only at the level of seeking
    the way, union with God, and recognition through the Guru and Name.
- id: motif:5
  label: Sacred lake affinity and unsuitable birds
  taxonomy_refs: []
  basis: The passage presents lake and swan as naturally affiliated, with diamonds
    and pearls as the swan's food, while cranes and ravens cannot remain in Lake Mansarowar
    because their food differs.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The scene functions as an analogy in the passage, but the exact referents
    of every element are not fully spelled out in the supplied excerpt.
- id: motif:6
  label: Inner fire not quenched by external fire penance
  taxonomy_refs: []
  basis: The passage says the fire within the hypocrite is not extinguished without
    the Guru, even though he heats himself with external fires.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage includes a translator's note on the penance of five fires,
    but the extraction does not assume details beyond the stated contrast.
- id: motif:7
  label: 'Moral reversal through service: sins erased, merits and peace arise'
  taxonomy_refs:
  - wisdom
  basis: Service to the Lord is said to remove sorrow, erase sins, cause merits to
    take their place, and establish peace in the heart.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The taxonomy reference is broad; the passage frames this as devotional
    and ethical instruction.
- id: motif:8
  label: Karmic descent into beast bodies after evil deeds
  taxonomy_refs:
  - death_rebirth
  basis: The passage states that those who disobey God's order and whose evil deeds
    are not effaced shall enter the bodies of beasts.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives the outcome but not a detailed rebirth cycle.
