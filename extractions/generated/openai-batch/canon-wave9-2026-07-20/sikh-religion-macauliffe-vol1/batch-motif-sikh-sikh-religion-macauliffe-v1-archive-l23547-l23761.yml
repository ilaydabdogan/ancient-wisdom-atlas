canonical_text:
  quote: ''
  summary: The passage presents Sikh poetic and prose framing that satirizes outward
    religious observances among Hindus, Brahmans, Muslims, Jogis, Sanyasis, and Kaparis.
    It contrasts external ritual markers with the Name, good works, the Word, the
    Guru, and service to God. It describes all souls as travellers who face a death-warrant
    and a divine court where God examines accounts, produces a book, and Azrail is
    placed over debtors. It also uses the imagery of Lake Mansarowar, swans, pearls,
    cranes, and ravens to describe affinity with the saints, and it defines the true
    Sanyasi as one who serves the True Guru and removes pride.
  language: English
  quote_policy: summarized
