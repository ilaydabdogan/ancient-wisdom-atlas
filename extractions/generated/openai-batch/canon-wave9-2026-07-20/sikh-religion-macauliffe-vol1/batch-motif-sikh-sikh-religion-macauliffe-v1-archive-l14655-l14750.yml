    in extent, mercy, gifts, perception, and creation. The passage contrasts worldly
    wealth with remembrance of God, uses river and sea imagery for divine vastness,
    and describes God as the great giver whose bounties extend to countless beings,
    including those in sin, denial, foolishness, distress, and hunger.
