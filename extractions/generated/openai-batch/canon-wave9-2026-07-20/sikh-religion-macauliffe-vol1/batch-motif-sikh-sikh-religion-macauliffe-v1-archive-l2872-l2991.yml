canonical_text:
  quote: ''
  summary: The passage surveys early accounts and custodians of Guru Nanak's life
    and teaching. It describes Bhai Gur Das as an early religious author and copyist
    of the Adi Granth, Bhai Budha as an early follower and custodian who marked Gurus
    with the saffron tilak, and Bhai Mani Singh as a disciple of Guru Gobind Singh
    who received baptism after humble service and later compiled or rearranged Sikh
    textual materials in response to community concerns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhai Gur Das is presented as the writer of the oldest authentic account of
    Guru Nanak and as Guru Arjan's amanuensis who wrote out the Adi Granth from dictation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhai Gur Das wrote forty religious cantos called Wars; the first War begins
    with Sikh cosmology and ends with a brief account of Guru Nanak and succeeding
    Gurus up to Gur Das's time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Gur Das probably wrote not much more than sixty years
    after Guru Nanak's demise, when some of Nanak's contemporaries were still alive.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhai Budha embraced Sikh religion under Guru Nanak at Kartarpur, accompanied
    him on some journeys, and was later made reader and custodian of the sacred volume
    at Amritsar by Guru Arjan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhai Budha was appointed to impress the saffron tilak, described as the patch
    of Gurudom, on the foreheads of Gurus of his time; his descendants retained the
    privilege while legitimate Gurus remained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bika and his son Mani met Guru Gobind Singh at Akoi to offer homage, after
    which Bika returned home and left Mani with the Guru.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Guru Gobind Singh asked Mani Singh to wipe the vessels used by the Sikhs and
    promised that as the vessels became bright, so would Mani's understanding; Mani
    wiped them humbly and received baptism as a reward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage explains that 'Bhai' means brother and connects Guru Nanak's use
    of the address with disregard for caste and a doctrine of human brotherhood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Nander, Guru Gobind Singh expounded the recondite language of the Granth
    Sahib to followers, including Mani Singh as an enthusiastic listener.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After Guru Gobind Singh's death, Mani Singh served as Granthi in the Har Mandar
    at Amritsar and was commissioned by the Sikhs to compile a trustworthy life of
    Guru Nanak because the Minas were said to have interpolated incorrect material.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mani Singh expanded Bhai Gur Das's first War into the Gyan Ratanawali and
    also wrote the Bhagat Ratanawali, but later copyists are said to have inserted
    Hindu ideas into his works.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mani Singh rearranged the hymns of the Granth Sahib by individual Guru rather
    than by musical measure, was censured by the Sikhs, apologized, and was pardoned.
  category: sequence
  evidence_refs:
  - ev:10
