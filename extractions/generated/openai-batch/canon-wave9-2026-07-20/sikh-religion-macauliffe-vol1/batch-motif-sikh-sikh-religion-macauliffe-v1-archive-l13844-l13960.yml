canonical_text:
  quote: There is but one God whose name is true, the Creator
  summary: The passage opens the Japji with a declaration of one true, creator, immortal,
    unborn, self-existent God and the instruction to repeat His Name. It presents
    the True One as present in the beginning, the primal age, the present, and the
    future. A note describes the Japji as a key Sikh prayer repeated in the morning
    and attributed to Guru Nanak. The verses state that thinking, silence, longing,
    and human devices cannot by themselves obtain God; becoming true requires walking
    according to the Commander’s preordained will. Divine order produces bodies, infuses
    souls, assigns status, pain, pleasure, reward, and transmigration, and understanding
    this order removes egoism. The passage also includes translator notes on creation
    terminology and a comparison to a Greek temple inscription about being, past,
    present, and future.
  language: English
  quote_policy: quoted
