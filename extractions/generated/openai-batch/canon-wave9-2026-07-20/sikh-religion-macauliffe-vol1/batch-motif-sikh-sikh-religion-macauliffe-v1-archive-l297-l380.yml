canonical_text:
  quote: ''
  summary: The preface argues for an English translation of Sikh scriptures because
    many English-educated Sikhs do not understand the Granth Sahib in its original
    language. It presents translation as a means to spread Sikh ideas, correct misunderstandings
    about the Gurus and Martyrs, renew the Tat Khalsa, and make Sikh religious teachings
    known in Europe and America. It compares the expected effect of Sikh scripture
    translation with the influence of translations of Hindu scriptures, describes
    Sikh scriptures as spiritually elevating and nonsectarian, and includes endorsements
    from Sikh figures.
  language: English
  quote_policy: summarized
