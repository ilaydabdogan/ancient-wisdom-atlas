canonical_text:
  quote: ''
  summary: The passage collects notes and sloks attributed to Guru Nanak and related
    explanatory headings. It includes a note on Jogi breath practice, moral criticisms
    of pride and worldly attachment, advice to the queen of Ceylon, imagery of crossing
    dangerous waters through the True Guru, reflections on mourning, hypocrisy, widowhood,
    the frailty of the body, ethical definitions of Brahman and Khatri, radical self-sacrifice
    in discipleship, requirements for salvation, a Ramayana-linked theological argument,
    and a closing remark about not blaming an aged nobleman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jogis are said to draw breath from the lower vertebral column to the brain,
    suspend it, and follow a passage called the serpent’s way; when the breath reaches
    the brain it is said to distil nectar producing exaltation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker addresses God as an ocean of merits and contrasts this with the
    speaker’s own demerits.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage condemns pursuit of worldly things, pride, desire for wealth,
    evil speech, false wisdom, strife-producing acts, and pleasure apart from repetition
    of God’s name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guru Nanak advises the queen of Ceylon to examine her goods, dismiss evil,
    welcome good, give soul and body to friends, and not love what is transitory.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: For crossing water, the passage advises consulting those skilled in crossing;
    the water is described with showers, squalls, torrents, waves, and a whirlpool,
    while addressing the True Guru prevents the bark from foundering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that companionship, friendship, love among kin, and faith
    have diminished because of mammon.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women mourning are described as crying out, beating their cheeks, plucking
    their hair, and uttering God’s name without meaning it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A hypocritical holy man is represented through the image of a raven washing
    in a small desert pool while full of demerits and filth; a swan of the lake associates
    with the raven without knowing it is evil.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pure ablution is said to occur when the Guru is deemed the river of pilgrimage.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that saints are few and that deceit and wrangling prevail
    in the world.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: A widow is described as following her husband and dying; another woman is
    said to die upon hearing of her husband’s death, and the Allwise is said to strike
    with an arrow of love that cannot be extracted.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The body is compared to a fragile vessel composed of five elements with false
    gilding; if God is pleased, the vessel is acceptable, light shines in it, and
    God’s praises resound.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: A Brahman is defined as one who knows God and practices devotion, penance,
    self-restraint, mildness, and patience; such a Brahman bursts bonds, obtains salvation,
    and is worthy of worship.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: A Khatri is defined as brave in good deeds and charitable; the acceptable
    Khatri is linked with God’s court, while the greedy, covetous, and false Khatri
    suffers for misdeeds.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Those who wish to play at love with the Guru are told to come with their head
    in the palm of the hand, set foot on the road, give the head, and disregard human
    opinion.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that divine knowledge requires the Guru, meditation requires
    faith, credit requires truth, and balance requires capital, identified in the
    heading with God’s name.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: Ram Chandar is described as mourning for Sita and Lachhman, remembering Hanuman,
    and being unable to erase his destiny; Rawan is described as a misguided demon
    who did not know that God, not Ram, did this.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: After a purse-proud person addressed improper language to the Guru, the Guru
    told his disciples not to blame the Rai because his intellect was forsaking him
    in old age.
  category: speech
  evidence_refs:
  - ev:15
