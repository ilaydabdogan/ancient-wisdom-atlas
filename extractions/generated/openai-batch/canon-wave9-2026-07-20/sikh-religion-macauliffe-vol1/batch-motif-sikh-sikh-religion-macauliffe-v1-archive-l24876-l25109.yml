candidate_motifs:
- id: motif:1
  label: Serpent-path breath ascent and nectar
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: Breath moves upward from the lower vertebral column to the brain through
    a path called the serpent’s way, where nectar produces exaltation.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports Jogi assertions rather than presenting a full Sikh
    doctrinal exposition of the practice.
- id: motif:2
  label: Worldly danger as stormy water crossed with a saving guide
  taxonomy_refs:
  - ark_vessel
  - mystical_quest
  basis: Spiritual guidance is framed as crossing dangerous waters by consulting skilled
    crossers and addressing the True Guru so the bark will not founder.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call the water the ocean of existence,
    though the salvific crossing imagery is clear.
- id: motif:3
  label: Wisdom instruction to reject the transitory
  taxonomy_refs:
  - wisdom
  basis: Guru Nanak advises the queen to examine goods, reject evil, welcome good,
    give herself to friends, and not love what is transitory.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The imagery is ethical and didactic rather than a developed narrative
    motif.
- id: motif:4
  label: False holiness exposed by impure washing
  taxonomy_refs:
  - wisdom
  basis: A hypocritical holy man is figured as a raven washing in a desert pool while
    remaining inwardly and outwardly foul.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The raven and swan are used as a brief moral exemplum, not as a full animal
    fable.
- id: motif:5
  label: Guru as purifying pilgrimage river
  taxonomy_refs:
  - wisdom
  basis: The passage states that pure ablution occurs when the Guru is deemed the
    river of pilgrimage.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: No available taxonomy family directly captures purification by sacred
    water; assigned to wisdom because it redefines ritual purity through the Guru.
- id: motif:6
  label: Divine arrow of love and widow’s death
  taxonomy_refs:
  - divine_beloved
  - sacrifice
  basis: The widow passage speaks of death after the husband and of the Allwise striking
    with an arrow of love that cannot be removed.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The heading references concremation of widows, but the passage’s evaluation
    is specific and should not be generalized beyond the quoted slok.
- id: motif:7
  label: Fragile body as vessel requiring divine grace
