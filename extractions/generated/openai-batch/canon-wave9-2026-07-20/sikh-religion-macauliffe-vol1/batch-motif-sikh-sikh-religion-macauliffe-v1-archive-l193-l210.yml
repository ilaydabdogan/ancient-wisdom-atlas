  summary: The preface describes earlier restrictions and prejudices concerning printing,
    uniting, selling, and translating the Sikh sacred book. It says the book was regarded
    as an embodiment of the wisdom of the Gurus and of the Gurus themselves. It also
    reports an injunction attributed to Guru Arjan to translate the sacred volume
