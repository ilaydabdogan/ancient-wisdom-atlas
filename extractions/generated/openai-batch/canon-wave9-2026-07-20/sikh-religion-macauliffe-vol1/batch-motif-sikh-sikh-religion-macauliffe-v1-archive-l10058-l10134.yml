canonical_text:
  quote: ''
  summary: Guru Nanak travels to Sialkot, rests under a wild caper tree, and sends
    Mardana to buy a small worth of truth and falsehood; the shopkeeper Mula replies
    that death is true and life false. Later, Mula is hidden by his wife from Mardana
    and dies from a snakebite. Guru Nanak then travels to Mithankot, where Mian Mitha
    challenges him with Islamic devotional terms about God, the Prophet, the Creed,
    and acceptance in God's court; Guru Nanak replies by emphasizing God alone, good
    intentions, action according to sacred books, fear as a wick, and knowledge of
    truth as burning.
  language: English
  quote_policy: summarized
