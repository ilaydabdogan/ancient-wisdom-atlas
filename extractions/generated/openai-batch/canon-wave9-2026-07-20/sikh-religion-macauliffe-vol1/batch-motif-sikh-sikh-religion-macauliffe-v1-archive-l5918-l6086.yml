  summary: The passage recounts Shaikh Sajjan’s repentance after hearing Guru Nanak’s
    hymn, his confession and restitution, his initiation through charanpahul, and
    the tradition that a Sikh temple was later built at the site. It then describes
    Guru Nanak visiting the Kurkhetar fair during a solar eclipse, cooking a deer
    presented by a disciple, and answering Brahman objections to flesh with hymns
    on embodiment, ritual inconsistency, scriptural precedent, and water as the source
    of crops and worlds.
