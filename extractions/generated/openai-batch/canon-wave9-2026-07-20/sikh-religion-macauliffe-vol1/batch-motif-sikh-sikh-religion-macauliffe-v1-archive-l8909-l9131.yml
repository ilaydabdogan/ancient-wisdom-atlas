canonical_text:
  quote: ''
  summary: Guru Nanak and Mardana travel toward Pak Pattan to revisit Shaikh Brahm.
    Shaikh Kamal hears Mardana sing a couplet on the one God, reports it to Shaikh
    Brahm, and Shaikh Brahm enters into a theological dialogue with Guru Nanak. The
    exchange treats divine unity, outward religious dress, devotional bride imagery,
    virtues as true dress, truth as a purifying knife, and praise of the Guru and
    the Creator.
  language: English
  quote_policy: summarized
