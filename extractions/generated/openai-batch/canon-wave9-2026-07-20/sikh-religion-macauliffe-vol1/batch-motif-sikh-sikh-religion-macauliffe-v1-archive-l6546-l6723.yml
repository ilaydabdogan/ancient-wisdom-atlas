canonical_text:
  quote: ''
  summary: Guru Nanak travels east with Mardana while wearing mixed Hindu and Muslim
    religious signs. He teaches Mardana that there is one God and explains social
    inequality through actions in previous states of existence. At Gorakhmata, a withered
    pipal tree becomes green when the Guru sits beneath it; Sidhs question him and
    invite him to become a Jogi, but he teaches that religion is not outward dress,
    ritual objects, pilgrimage, or posture, and that purity amid the world, equality,
    and the true guru are the path. The Sidhs bow to him. At Banaras, Pandit Chatur
    Das challenges the Guru for lacking Brahmanical devotional objects, and the Guru
    replies by criticizing empty ritual worship.
  language: English
  quote_policy: summarized
