canonical_text:
  quote: ''
  summary: Guru Nanak travels to Hasan Abdal, where Bawa Wali refuses water; the Guru
    produces a stream, Wali's well dries, and a hurled hillock is stopped by the Guru's
    raised hand, leaving a revered palm impression. The Guru then debates Jogis at
    Gorakh-Hatari, teaches about crossing the ocean and being dead while alive, and
    later begins a pilgrimage toward Makka in Muslim pilgrim guise. On the road, a
    cloud accompanies him; a fellow pilgrim becomes alarmed, and after going ahead
    can no longer see the Guru or the cloud.
  language: English
  quote_policy: summarized
