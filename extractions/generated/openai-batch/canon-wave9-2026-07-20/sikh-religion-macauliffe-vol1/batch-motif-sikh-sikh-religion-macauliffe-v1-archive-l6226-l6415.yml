canonical_text:
  quote: ''
  summary: The passage gives background on Shaikh Sharaf and recounts a meeting in
    which Tatihari, a disciple, encounters Guru Nanak and Mardana near a well. After
    Nanak alters a Muslim salutation to address the Invisible, the Shaikh comes to
    question him about his head-dress, sect, stole, loin-cloth, slippers, and the
    meaning of a darwesh. Nanak answers in hymnic speech, interpreting external ascetic
    markers as inward discipline, renunciation, self-effacement, contemplation, and
    obedience to God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note describes Shaikh Sharaf, also called Abu Ali Qalandar, as receiving
    instruction at forty, receiving a call from God, throwing learned books into the
    Jamna, travelling, and later casting books received from Shams-ul-din Tabrezi
    and Maulana Jalal-ul-Din Rumi into a river.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tatihari went to draw water from a well near where Guru Nanak and Mardana
    had rested.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tatihari addressed Nanak with the salutation “Salam Alaikum,” and Nanak replied
    “Salam Alekh,” glossed in the passage as salutation to the Invisible.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tatihari reported the altered salutation to his religious superior, and the
    Shaikh resolved to question the man who had saluted the Invisible One.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Shaikh asked what denomination Nanak’s head-dress denoted and why he did
    not shave his head in orthodox fashion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nanak answered that true shaving is shaving the mind, cutting off one’s head
    before the guru, becoming dust of all feet, and abandoning pleasures, affections,
    and egotism.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When asked what sect he belonged to, Nanak described himself as remaining
    a disciple under the instruction of his Guru, with stole and hat consisting in
    grasping the Word in his heart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nanak described living alone, settling in a silent city, dispelling joy and
    sorrow, and having forsaken his family.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When asked about his loin-cloth, Nanak spoke of mental peace, restraining
    the five senses, closing the eyes, locking the ten gates of the body, sitting
    in its sixty-eight chambers, and drinking from the waterfall of the brain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When asked about his slippers, Nanak described associating with those who
    go the right way, having no caste beyond fire and wind, enduring like earth or
    a tree, benefiting others like a river or sandal, churning the world, and abandoning
    evil.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the Shaikh asked what a darwesh is, Nanak ordered Mardana to play the
    rebeck and composed a hymn in answer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nanak’s hymn defines a darwesh as one who is dead while living, asleep while
    waking, knowingly lets himself be plundered, abandons everything, meets the Creator,
    is free from joy, sorrow, anger, pride, and avarice, and regards gold as dross.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says such holy people obey God’s summons, sit in a contemplative
    attitude in the firmament, play spontaneous music, and are beyond the praises
    known by the Veds or the Quran.
  category: speech
  evidence_refs:
  - ev:8
