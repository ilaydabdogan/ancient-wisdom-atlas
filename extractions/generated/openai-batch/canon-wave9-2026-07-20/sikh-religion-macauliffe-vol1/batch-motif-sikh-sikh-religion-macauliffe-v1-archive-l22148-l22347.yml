canonical_text:
  quote: ''
  summary: The passage describes the perfect Bairagi as one who keeps the Word in
    the heart, fears God, serves the Guru, abandons desires, and is absorbed in the
    True One. It teaches that destiny and divine knowledge come from God, understanding
    comes through the Guru, and the Name is salvific. A section addressed to a Brahman/Pandit
    rejects reliance on outward ceremonies, idolatry, hypocrisy, and superstition,
    using images of entanglement, spider web, churning milk or water, Maya’s cable,
    God’s court, and spiritual commerce. The closing lines urge service to the Lord,
    who delivers the devotee and enables crossing over.
  language: English
  quote_policy: summarized
