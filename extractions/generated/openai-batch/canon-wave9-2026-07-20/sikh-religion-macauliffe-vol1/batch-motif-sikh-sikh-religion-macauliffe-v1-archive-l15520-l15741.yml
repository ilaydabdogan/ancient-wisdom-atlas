canonical_text:
  quote: ''
  summary: Hymns attributed to Guru Nanak praise divine wonder and power in creation,
    describe death and judgment after life, present cosmic powers as acting in fear
    before the fearless Formless One, describe obtaining the true Guru and the Word
    after many births, and contrast religious spectacle with divine knowledge granted
    by grace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker enumerates wonders including divine word and knowledge, creatures
    and their forms, wind, water, fire, earth, pleasures, meeting and parting, hunger
    and repletion, desert and road, nearness and remoteness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seeing, hearing, fear, happiness, the nether regions, the heavens, creation,
    scriptures, eating, drinking, clothing, affection, species, virtues, vices, honour,
    dishonour, wind, water, fire, and earth are all said to exist or occur by divine
    power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who has enjoyed himself becomes ashes, and the soul passes away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ministers of Death put a chain on the neck of a great and wealthy person
    and take him away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An account of the person's acts is read; a Judge seated there takes the account
    and passes sentence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Winds, rivers, fire, earth, Indar, Dharmraj, sun, moon, Sidhs, Budhas, demigods,
    Naths, stars, the firmament, mighty men, divine heroes, and cargoes of people
    are described as being in fear, while the Formless One alone is without fear.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage mentions stories of Krishan, Veds and religious compositions,
    beggars dancing, actors entering the market-place, kings and queens singing, ornaments,
    bodily ashes, and divine knowledge obtained by God's grace rather than by mere
    words or skill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the Kind One looks with kindness, the true Guru is obtained; the soul has
    wandered through many births, and the true Guru communicates the Word.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage figuratively assigns gharis as milkmaids, pahars as Krishans and
