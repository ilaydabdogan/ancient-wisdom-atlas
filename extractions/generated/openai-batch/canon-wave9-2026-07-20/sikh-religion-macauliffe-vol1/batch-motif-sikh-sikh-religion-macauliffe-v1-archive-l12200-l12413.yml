  summary: In Chapter XIV the Guru travels north to Srinagar in Kashmir with two companions,
    is challenged by the Kashmiri pandit Brahm Das about his dress and practices,
    and replies with hymns praising the One God as creator. Brahm Das then asks what
    existed before creation, and the Guru recites a cosmogonic hymn describing primordial
    darkness, the absence of earth, heaven, deities, religious roles, rituals, caste,
    birth, death, and duality, with God alone existing before creation.
