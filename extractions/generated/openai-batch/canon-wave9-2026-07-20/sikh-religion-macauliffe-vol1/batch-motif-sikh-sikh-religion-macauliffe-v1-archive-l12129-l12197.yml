canonical_text:
  quote: ''
  summary: 'Nanak defines a true Bairagi through contentment, reversal of breath,
    absorption in God, control of the five senses, renunciation of evil, and attention
    to the one God. Followers of Gorakhnath ask the Guru to adopt the style of a Jogi
    and describe Jogi external marks. The Guru gives inward substitutes for those
    marks: the Guru''s word, forbearance, acceptance of God''s acts, reflection, divine
    knowledge, praise, instruction, and renunciation. The passage says this path unites
    the pilgrim soul with the Supreme Essence, declares God''s light present in everything,
    addresses Jogi Bharthari, and notes the Guru''s composition of the Sidh Gosht
    at Batala.'
  language: English
  quote_policy: summarized
