canonical_text:
  quote: ''
  summary: 'The passage first recounts the legend of King Gopi Chand: his mother Menawati
    weeps while he bathes, reflects on death, and urges him toward renunciation under
    Jalandharnath, after which he abdicates and receives instruction said to overcome
    death. The passage then presents Guru Nanak at Mount Sumer among Sidhs, where
    he speaks on the darkness of the Kal age, salvation through the True Word, self-offering
    to the True One, the nature of his dwelling in God, and detachment from the world.
    Charpat asks how to cross the ocean-like world, and Nanak answers with images
    of the dry lotus and waterfowl in water, meditation on the Word, and repetition
    of God’s name.'
  language: English
  quote_policy: summarized
