canonical_text:
  quote: ''
  summary: The passage recounts Guru Nanak's exchange with Shaikh Brahm, a hymn on
    the Divine Spouse and union with God, Jhanda's hospitality and recognition of
    Nanak, travels through an island and a desert, Mardana's hunger, a command concerning
    fruit from a tree, Mardana's disobedience, collapse after eating stored fruit,
    and revival through the Guru's touch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People brought bread to Shaikh Brahm; he said he had already eaten though
    he was fasting, and the people accused him by referring to Farid's similar refusal
    of food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shaikh Brahm questioned his own repeated claim that he had dined while fasting;
    the Guru approved of his conscience, said God was in him, and Shaikh Brahm asked
    about God and the virtues by which God is found.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Guru's hymn uses the language of sisters, companions, a happy wife, an
    Omnipotent Spouse, ornaments of composure, contentment, and sweet discourse, and
    meeting the Beloved through the Guru's word.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hymn states that the true Lord has all merits, that humans have demerits,
    that all are in the Creator's power, and that the true King blends a person with
    Himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After visiting Shaikh Brahm's district and making converts, the Guru went
    to Bisiar, where inhabitants treated his presence as pollution and purified the
    places where he had stood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jhanda, a carpenter, received the Guru hospitably, washed his feet, drank
    the washing water, received a revelation that Nanak was a Guru, and joined his
    wanderings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Guru and his companions went east to an island in the ocean where no food
    was available; there the Guru composed the Jugawali on the four ages, and Jhanda
    wrote and circulated it before returning home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a lonely desert, Mardana felt hunger and feared being killed and eaten
    by a wild animal; the Guru told him to take care and said that a place where God's
    name is uttered is always inhabited.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Guru composed a hymn saying that demigods, jogis, jatis, darweshes, priests,
    prophets, and holy persons endure hunger, travel, renunciation, and pain for God's
    sake.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Guru told Mardana that success required God's word and asked him to think
    of a hymn and play the rebeck; Mardana replied that hunger had left him too weak.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Guru pointed to a tree and told Mardana to eat its fruit until satisfied
    but not take any with him; Mardana ate and also kept some fruit for later.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Later Mardana ate the stored fruit, fell down, and confessed that he had disobeyed
    the Guru's instruction by bringing and eating forbidden fruit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Guru said the fruit was poisonous but had been blessed for that occasion,
    placed his foot on Mardana's forehead, and Mardana revived at once.
  category: action
  evidence_refs:
  - ev:8
