canonical_text:
  quote: ''
  summary: The passage recounts Sikhs regretting that they deserted Guru Nanak, after
    which he gives a hymn on the accounting of all human acts, deceitful attachment
    to Maya, death, judgment, and the Lord’s favor to the lowly. A successor of Pir
    Baha-ul-Din visits Guru Nanak and asks for help for a successful journey to the
    next world. Guru Nanak replies with an image of each person carrying the load
    he has filled, says the honest depart with bright faces, and then composes a hymn
    on the brevity of wealth, youth, and life, using grave, departure, and marriage-house
    imagery for death and moral consequence.
  language: English
  quote_policy: summarized
