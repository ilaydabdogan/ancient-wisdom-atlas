canonical_text:
  quote: ''
  summary: The passage presents hymnic statements that God's name and praise supersede
    ritual funerary offerings, sacred bathing, and pilgrimage. It then narrates Guru
    Nanak and Mardana at a grain-dealer's house during a birth celebration; the Guru
    interprets the newborn as a creditor who will depart in the morning, sings a four-watch
    hymn on birth, attachment, youth, and death, and the child dies the next morning.
    A later scene shows a watchman preparing gram and intending hospitality, while
    the Guru says the watchman's love and simple pallet are sufficient.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says lamp-light has dried something up and that he has escaped
    meeting Death; he also says a particle of fire can destroy many heaped logs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker identifies God and the Creator's name with barley rolls, leafy
    platters, true obsequies, support in this world and the next, Ganges and Banaras,
    and true ablution.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker contrasts rolls offered to gods and manes with the Brahman who
    kneads and eats them, and says God's rolls are never exhausted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Guru Nanak and Mardana arrive at a grain-dealer's house where a son has been
    born; people offer congratulations, throw red powder, and fill the neighborhood
    with blessings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the entertainment, the grain-dealer goes inside without noticing Mardana;
    Mardana reports the birth and celebration to the Guru.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Guru says the newborn is not a son but a creditor come to settle an account,
    who will remain for the night and depart in the morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Guru orders Mardana to play the rebeck and sings a hymn organized by the
    first, second, third, and fourth watches of night.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:8
  text: In the first watch, the child enters the womb by God's order, remains reversed
    within it, prays, comes naked into the world, departs naked, and bears destiny
    written on the forehead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the second watch, the child forgets meditation on God, is dandled in arms
    like Krishan in Yasodha's house, and is claimed by the mother as her son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the third watch, man's thoughts turn to woman and youthful pleasures; he
    neglects God's name, worldly love grows, and he fails to trade in virtue or befriend
    good acts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the fourth watch, the reaper comes to the field, Death may seize a person
    at an unknown time, lamentations are hollow, and one's goods become another's.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: When morning comes, the child dies; the grain-dealer and relatives come out
    weeping and wailing after the previous day's rejoicing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Guru utters verses saying that those who received blessings now grieve,
    that some dead are buried and others thrown into rivers, and that Nanak should
    praise the True One.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Guru Nanak and Mardana later see a watchman roasting gram in a small enclosed
    field; the watchman intends to bring them better food and bedding, but the Guru
    says the watchman's love and pallet suffice.
  category: sequence
  evidence_refs:
  - ev:6
