  summary: The passage teaches equanimity through the Word, describes the Guru as
    possessing a vessel for the fearful ocean of the world, gives Indian natural similes
    for love of God, contrasts true devotion with pride and ritualism, depicts God
    as an assayer of genuine and counterfeit coins, and declares God’s name superior
    to severe austerities, ceremonies, and offerings.
