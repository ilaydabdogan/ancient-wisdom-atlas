canonical_text:
  quote: The whole earth is my sacred lines, and he who loveth truth is pure.
  summary: The passage recounts Guru Nanak and Mardana staying with Lalo, rejecting
    ritual and caste restrictions, exposing the moral difference between Lalo’s and
    Malik Bhago’s bread, warning Mardana against accepting offerings, and encountering
    the robber Shaikh Sajjan, whose outward hospitality and piety conceal murder.
    It ends with a hymn using images of hidden blackness, hollow buildings, predatory
    white herons, the simmal tree, and a blind burdened traveler on a mountainous
    road.
  language: English
  quote_policy: quoted
