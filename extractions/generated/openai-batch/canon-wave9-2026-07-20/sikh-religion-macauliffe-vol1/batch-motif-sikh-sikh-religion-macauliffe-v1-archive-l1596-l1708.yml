  summary: The passage presents historical notices and quoted reports about Muslim
    rulers and Mughal emperors. Sikandar Khan Lodi is described as pious and just.
    Jahangir is described through memoir and ambassadorial reports as using rapid
    and violent punishments against robbers, lovers, nobles, and rebels, and as later
    causing Guru Arjan to be tortured to death. Aurangzeb is described as a strict
    religious ruler whose officers excluded Hindu writers and destroyed Hindu temples
    and schools, including the temples of Vishwanath at Banaras and Mathura, with
    a mosque founded on the Mathura site.
