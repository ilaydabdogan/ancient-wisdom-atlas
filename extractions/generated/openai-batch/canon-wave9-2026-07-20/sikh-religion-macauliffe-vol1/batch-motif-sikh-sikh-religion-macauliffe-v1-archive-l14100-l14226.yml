canonical_text:
  quote: ''
  summary: The passage says God cannot be described in words and is the one Bestower
    on living beings. Pleasing God is treated as the true pilgrimage bath, and hearing
    the Guru’s word or the divine Name brings inner treasure, knowledge, honour, freedom
    from sorrow and sin, and immunity from death. Worldly longevity, fame, and following
    are said to be worthless without God’s favour. The passage also contains commentary
    invoking Hindu divine names, an earth-supporting bull, and a sword described as
    the emblem of Death created before the world.
  language: English
  quote_policy: summarized
