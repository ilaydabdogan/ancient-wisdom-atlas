canonical_text:
  quote: I should ascend the stairs of the Lord, and become one with Him.
  summary: In Japji XXXII the speaker imagines multiplied tongues uttering the Lord's
    name many times, by which he would ascend the Lord's stairs and become one with
    Him; the religious find the Kind One while the false are jealous and boast falsely.
    In Japji XXXIII the speaker repeatedly denies having any strength for speech,
    silence, asking, giving, living, dying, wealth, meditation, divine knowledge,
    or escape from the world, and concludes that no one has superior or inferior strength
    before God.
