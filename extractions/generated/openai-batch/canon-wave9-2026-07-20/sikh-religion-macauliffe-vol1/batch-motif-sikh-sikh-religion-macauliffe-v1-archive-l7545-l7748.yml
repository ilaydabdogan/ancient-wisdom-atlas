canonical_text:
  quote: ''
  summary: The passage presents a hymn using wife, Bridegroom, and Spouse imagery
    for devotion to God; narrates Nurshah and her women submitting to Guru Nanak and
    receiving instruction for salvation; then describes Guru Nanak entering a wilderness,
    confronting Kaljug, teaching Mardana about fear of God, explaining signs of Kaljug,
    and rejecting Kaljug’s offers of wealth, luxury, miracles, women, and sovereignty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hymn instructs the listener to put God’s fear in the eyes like surma and
    to wear love as decoration, promising recognition as a devoted happy wife if she
    loves the Bridegroom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hymn says a woman who does not please the Spouse cannot enter His chamber,
    obtains nothing without God’s grace, and is misled by avarice, covetousness, pride,
    and mammon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The happy wives advise accepting whatever the Bridegroom does, worshipping
    His feet, giving Him body and soul, and effacing the self to obtain Him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hymn states that the wife who pleases her Spouse is the happy wife, queen
    of them all, and remains absorbed in His love day and night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nurshah and her women show submission by twisting their head-dresses around
    their necks and falling at the Guru’s feet, then ask how they can obtain salvation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Guru tells Nurshah and her women to repeat God’s name, perform domestic
    duties conscientiously, and renounce magic; the narration says they became followers
    and secured salvation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After leaving Kamrup, the Guru enters a wilderness where Kaljug comes to tempt
    him, and Mardana becomes afraid.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Guru tells Mardana that if he feels fear, it ought to be fear of God,
    not fear of Kaljug.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Guru’s hymn states that fear of God causes fear of Death to depart, and
    that the soul neither dies nor is drowned but is saved through fear of God.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The hymn describes the swan of the heart aspiring to fly to heaven, being
    restrained by great hunger, and needing fear as its eating, drinking, and support.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: When Mardana asks about Kaljug, the Guru identifies signs of Kaljug as true
    speakers suffering, penitents failing in penance, and those repeating God’s name
    meeting obloquy.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kaljug offers the Guru worldly wealth, a palace of pearls and gems, beautiful
    women, miracle-working power, and sovereignty of East and West if the Guru abandons
    his mission.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Guru says he has renounced sovereignty and questions what use he has for
    Kaljug’s offers, especially since they belong to others.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: In the stanza following Kaljug’s offer, the Guru lists pearls, gems, perfumes,
    jeweled couches, damsels, miracles, honor, and kingship as things that might cause
    him to forget God’s name.
  category: speech
  evidence_refs:
  - ev:13
