canonical_text:
  quote: In the midst of these He established the earth as a temple.
  summary: The passage presents God as creator of time divisions, cosmic elements,
    nether regions, earth, and living beings; it describes judgment according to acts
    in God's court; it then moves from the realm of righteousness to the realm of
    knowledge, where innumerable cosmic elements, deities, teachers, places, beings,
    languages, kings, knowers, and worshippers are enumerated.
  language: English
  quote_policy: quoted
