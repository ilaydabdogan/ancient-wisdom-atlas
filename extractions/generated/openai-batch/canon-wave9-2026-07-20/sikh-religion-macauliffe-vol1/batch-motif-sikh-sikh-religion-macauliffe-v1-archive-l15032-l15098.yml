canonical_text:
  quote: One Maya in union with God gave birth to three acceptable children.
  summary: The passage addresses God as primal, pure, beginningless, indestructible,
    and constant. It instructs the hearer to make divine knowledge food, compassion
    the storekeeper, and the inner voice a call to repast. God is described as stringing
    the world on His string, while wealth and supernatural power are left to others.
    Union and separation regulate the world, and destiny allots portions. Maya, in
    union with God, gives birth to three children who perform creation, provision,
    and destruction under God's orders; God sees them but is unseen by them. God's
    seat and storehouses are in every world, and the Creator beholds creation.
  language: English
  quote_policy: quoted
