canonical_text:
  quote: ''
  summary: A sequence of translated Sikh hymns describes one God with many forms,
    cosmic worship using heavenly and natural elements, divine light present in everything,
    longing for God’s lotus feet, service to saints and Guru, release from transmigration,
    true spiritual intoxication through the Name, and the Guru as ladder, boat, raft,
    water, and stream leading the seeker toward the divine Beloved and God’s palace.
  language: English
  quote_policy: summarized
