- id: motif:2
  label: divine light made manifest by the Guru
  taxonomy_refs:
  - wisdom
  basis: The divine light is said to be in everything, with its manifestation linked
    to the Guru’s teaching.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage presents a devotional-theological
    image rather than a narrative wisdom tale.
- id: motif:3
  label: longing for the divine Beloved or Spouse
  taxonomy_refs:
  - divine_beloved
  - mystical_quest
  basis: The passage includes longing for God’s lotus feet, woman-and-Spouse language,
    the distant Beloved, and warning against separation from the Spouse.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:11
  confidence: high
  cautions: The imagery is devotional and allegorical within the hymn.
- id: motif:4
  label: absorption in divine love and release from return
  taxonomy_refs:
  - annihilation_union
  - death_rebirth
  basis: The soul is absorbed in the region of God’s love; saints destroy fear of
    transmigration; seekers may reach God’s palace and not return to this world.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage speaks doctrinally about absorption, transmigration, and non-return,
    not as a plotted death-and-rebirth narrative.
- id: motif:5
  label: Guru and Name as salvific vessel and ladder
  taxonomy_refs:
  - ark_vessel
  - ascent
  - mystical_quest
  basis: The Guru giving God’s name is called ladder, boat, and raft, while the Guru
    is also lake, sea, boat, and sacred stream leading toward purity and the divine
    palace.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The vessel and ascent imagery is metaphorical, not a literal flood ark
    or physical mountain ascent.
- id: motif:6
  label: divine court and afterlife honour
