canonical_text:
  quote: ''
  summary: Mardana, weary from travel and hunger, negotiates conditions for continuing
    with Guru Nanak. They turn toward home after twelve years of wandering and halt
    near the village. Mardana visits his own people and Kalu’s house, where Nanak’s
    mother learns enough to follow him with clothes and sweets. Nanak greets his mother,
    but responds to her requests for domestic return, food, and new clothes with hymns
    presenting God’s word, name, love, and favour as true sustenance and raiment.
    His father Kalu arrives on horseback and urges him to return home, see a new house,
    and visit his wife; Nanak answers with a hymn treating divine knowledge, virtue,
    the Name, and divine favour as true conveyance, family, palace, and empire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mardana addresses his master after travel, hardship, and hunger, saying the
    Guru is a holy man who has abandoned the world, neither eats nor drinks, and never
    enters a village.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mardana says he will remain if his hunger is satisfied as the Guru satisfies
    his own, and if the Guru promises not to notice anything he does; the Guru agrees
    and says Mardana will be happy in this world and the next.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mardana proposes returning home to see his parents after twelve years of wandering,
    and the Guru adopts the suggestion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Guru and Mardana halt in the forest about three miles from the village;
    the Guru permits Mardana to visit his people and Kalu’s house but tells him not
    to mention the Guru’s name.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mardana is greeted by his people and then goes to Kalu’s courtyard, where
    Nanak’s mother embraces him and asks about Nanak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mardana avoids detailed inquiries, says only that he has been with Nanak,
    and leaves quickly; Nanak’s mother suspects Nanak is nearby and follows Mardana
    with clothes and sweets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nanak rises when he sees his mother, salutes her respectfully, and she kisses
    his forehead, weeps, and asks him to abandon wandering, live with them, and take
    up commerce.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Guru calls on Mardana to play the rebeck while he sings in response to
    his mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the hymn, devotees attached to God are compared with drunkards seeking
    stimulants and fishes needing water; the Lord is called a fruit-bearing tree whose
    name is ambrosia.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nanak’s mother places clothes and sweets before him and asks him to eat; he
    says he requires no food and sings that God’s word and love supply flavours and
    thirty-six dishes, while other viands bring pain and sin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When his mother asks him to remove the faqir’s jacket and wear new clothes,
    Nanak sings that devotion, truth, charity, meditation, contentment, and the Lord’s
    name are true raiment, while other dress brings pain and sin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kalu, Nanak’s father, hears of Nanak’s arrival, comes on horseback, weeps
    for joy, and asks Nanak to mount the horse and go home with him; Nanak bows and
    falls at his feet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Nanak replies that he needs no horse and sings that knowing God’s way is like
    horses with golden saddles, virtue is like weapons and equipment, and God’s favour
    is like caste.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kalu again urges Nanak to return, see a new house, and visit his wife; Nanak
    answers that the pleasure of the Name is like mansions and palaces, God’s favouring
    glance is family, and pleasing God is empire.
  category: speech
  evidence_refs:
  - ev:9
