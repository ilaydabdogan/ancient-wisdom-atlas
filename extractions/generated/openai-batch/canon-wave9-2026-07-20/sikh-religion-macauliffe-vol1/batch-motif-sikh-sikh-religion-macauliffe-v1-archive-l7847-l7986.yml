canonical_text:
  quote: ''
  summary: At Jagannath, Guru Nanak is invited to join a temple worship ceremony but
    instead recites a hymn that presents the sky, sun, moon, stars, sandal perfume,
    wind, and forests as the true accessories of divine worship. The hymn describes
    the Lord as both manifold and formless, identifies divine light in everything,
    and asks for grace through devotional images of lotus feet, a bee, and the thirsty
    sarang bird. The passage then narrates Nanak challenging a Brahman who claims
    occult sight while closing his eyes and nose; Nanak hides the Brahman's lota,
    exposing that he cannot find what is behind him.
  language: English
  quote_policy: summarized
