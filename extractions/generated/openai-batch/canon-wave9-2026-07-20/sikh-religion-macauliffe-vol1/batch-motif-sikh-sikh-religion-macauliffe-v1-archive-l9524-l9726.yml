  quote: ''
  summary: The passage notes a wedding-related water rite, then narrates Guru Nanak
    in captivity after Babar’s destruction of Saiyidpur. Mir Khan and Babar witness
    or hear of miraculous signs around Nanak, including an unsupported bundle, a horse
    following sacred music, and a hand-mill turning by itself. Nanak sings of divine
    preservation and asks God for deliverance from the ocean of the world. Babar reveres
    Nanak and releases the captives at his request. The captives return to a devastated
    city, and Nanak laments the disappearance of wealth, military power, households,
    and women’s safety, framing death and suffering under divine command and allotment.
    A final hymn describes God establishing cosmic regions, seas, worlds, qualities,
    ages, and lamps for the ages.
  language: English
  quote_policy: summarized
