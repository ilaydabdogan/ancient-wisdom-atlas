canonical_text:
  quote: ''
  summary: A hymn describes many beings, places, and cosmic domains singing praise
    to God at His gate. Named divine and holy figures, sages, celestial women, warriors,
    saints, worlds, and sources of life all praise Him. A paraphrase expands the scene
    with elemental powers and judgment figures. The passage concludes that God is
    eternally true, creates diverse forms, beholds His own handiwork, acts by His
    own will, and is King of kings.
  language: English
