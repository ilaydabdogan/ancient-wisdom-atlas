canonical_text:
  quote: ''
  summary: Guru Nanak and Mardana go to Kamrup, where Queen Nurshah and her women
    attempt to gain influence over the Guru through magic, performance, and wealth.
    The Guru answers with hymns using wife-and-Spouse imagery for devotion to God,
    criticizing pride, hypocrisy, corruption, attachment to valuables, and forgetfulness
    of the divine Bridegroom. Nurshah's attempts fail, and the Guru rejects the treasures
    offered to him.
  language: English
  quote_policy: summarized
