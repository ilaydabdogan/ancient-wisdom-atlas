canonical_text:
  quote: When the world is in distress, it heartily prayeth.
  summary: The passage begins with volume contents, then introduces the fifteenth
    century as an era of religious, intellectual, and political awakening. It compares
    Europe and India as places where priestly control of sacred learning was challenged
    by reformers and saints. It identifies Guru Nanak as founder of the Sikh sect,
    discusses the idea that religions arise during social distress, cites the Messiah
    as an example of a birth under oppression, and quotes Guru Amar Das on God responding
    to a distressed world by sending rain, glossed as the Guru coming by God’s order
    with abundant instruction. It closes by describing some Hindus under conquest
    and persecution withdrawing to desert or forest to seek religious truth.
  language: English
  quote_policy: quoted
