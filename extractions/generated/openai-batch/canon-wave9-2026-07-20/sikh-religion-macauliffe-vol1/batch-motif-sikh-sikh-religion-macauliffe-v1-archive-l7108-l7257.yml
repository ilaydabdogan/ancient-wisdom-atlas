canonical_text:
  quote: ''
  summary: 'The passage recounts a watchman receiving spiritual dignity, then narrates
    two shopkeepers whose outward fortunes appear unequal: the one visiting Guru Nanak
    is wounded by a thorn, while the one pursuing a mistress finds a gold coin and
    a jar of charcoal. Guru Nanak explains these outcomes through former-birth deeds
    and present conduct, teaches that virtue can alter destiny, recites moral verses,
    warns against lust, and later instructs robbers who intended to rob him; they
    abandon their former life, repeat the Name, and reform.'
  language: English
  quote_policy: summarized
