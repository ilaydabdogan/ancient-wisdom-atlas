canonical_text:
  quote: ''
  summary: Guru Nanak visits Lalo at Saiyidpur, announces Babar’s coming conquest,
    sings hymns describing the invasion as moral and social catastrophe, explains
    God’s power to reverse worldly orders, warns a Brahman to leave before the city
    is destroyed, is imprisoned with Mardana after the massacre, sings of being God’s
    slave, and then sings of captive women whose former wealth and status have been
    overturned.
  language: English
  quote_policy: summarized
