candidate_motifs:
- id: motif:1
  label: Prophetic warning before invasion
  taxonomy_refs:
  - wisdom
  basis: The Guru announces Babar’s coming conquest, predicts the briefness of Pathan
    dominion, and later warns the Brahman to leave before destruction.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage presents the statements as Guru Nanak’s words and later fulfillment,
    but does not explicitly label the event as a formal prophecy motif.
- id: motif:2
  label: Divine judgment through social catastrophe
  taxonomy_refs:
  - divine_judgment
  basis: The hymn frames the invasion with statements about the Lord’s true decision
    and justice, greatness and punishment being given as God pleases, and the city’s
    devastation.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:13
  confidence: medium
  cautions: The passage links suffering and punishment to divine order in hymn language,
    but it also describes a concrete historical invasion; human review should assess
    theological interpretation boundaries.
- id: motif:3
  label: Reversal of worldly and natural order by divine power
  taxonomy_refs:
  - duality
  basis: The Guru says God can make predators eat grass, herbivores eat meat, put
    hills in rivers and rivers in deserts, appoint a worm to sovereignty, and reduce
    an army to ashes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The taxonomy reference is approximate; the passage’s literal emphasis
    is divine omnipotence and reversal rather than a named dualistic system.
- id: motif:4
  label: Devotional self-surrender as slavery to God
  taxonomy_refs:
  - annihilation_union
  basis: The Guru sings of himself as a purchased slave who has sold himself for God’s
    word and serves the Lord through humble acts while repeating the divine name.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage uses servant/slave language for devotion; union or annihilation
    is not directly stated in this excerpt.
- id: motif:5
  label: Fall from luxury to captivity
  taxonomy_refs:
  - death_rebirth
  basis: The hymn contrasts women’s former adornment, marriage, ivory sedans, attendants,
    fans, pearls, wealth, and beauty with shorn hair, dust, chains, dishonour, and
    punishment.
  evidence_refs:
  - ev:13
  confidence: low
  cautions: The taxonomy reference is weak and only captures drastic status reversal;
    no rebirth or restoration is present in the passage.
- id: motif:6
  label: Sacred utterance enabling devotional action
  taxonomy_refs:
  - sacred_exchange
  basis: The Guru tells Mardana to utter ‘Wah Guru’ and release the horse so that
    he can play the rebeck for the hymn.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: The passage does not explicitly describe an exchange or miracle; it only
