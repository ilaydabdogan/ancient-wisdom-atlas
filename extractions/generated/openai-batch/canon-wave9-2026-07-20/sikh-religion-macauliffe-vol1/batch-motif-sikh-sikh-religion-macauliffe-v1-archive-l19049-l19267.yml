canonical_text:
  quote: ''
  summary: 'A sequence of translated Sikh devotional and didactic verses presents
    humility before God, criticism of false guidance, the vanishing of worldly power,
    inexhaustible praise of God despite imagined cosmic riches and powers, warnings
    about caste and folly, and several allegories: ascetic progress as mounted cavalry,
    the soul as corn spared by attachment to the mill axle, good people as tortured
    sugar-cane, and alliance with God through praise.'
  language: English
  quote_policy: summarized
