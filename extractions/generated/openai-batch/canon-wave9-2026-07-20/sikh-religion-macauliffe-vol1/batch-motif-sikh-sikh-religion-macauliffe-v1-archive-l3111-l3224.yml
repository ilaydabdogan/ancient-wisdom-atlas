  quote: ''
  summary: The passage critically evaluates the Bhai Bala Janamsakhi, arguing from
    language, chronology, and Sikh lists that Bala is not a secure eyewitness authority.
    It then describes three Sikh schisms—Udasi, Mina, and Handali—and associates each
    with rival succession claims, textual revision, or the composition of Janamsakhis
    that exalt particular figures and diminish others. The passage also makes explicit
    comparisons with early Christian apocryphal writings and sectarian divisions in
    Christianity and Islam.
  language: English
  quote_policy: summarized
