canonical_text:
  quote: ''
  summary: A sequence of translated Sikh hymnic and didactic passages praises spring
    as a time for remembrance of God, develops a tree metaphor for virtuous practice,
    refutes ritual impurity ideas, redefines purity and deliverance through ethical
    virtues and meditation, criticizes idolatry, charms, mendicant religiosity, and
    moral decline in the Kal age, and commands honest labor, non-covetousness, and
    equanimity under the Guru’s instruction.
  language: English
  quote_policy: summarized
