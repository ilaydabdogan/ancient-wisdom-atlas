- id: motif:6
  label: world as smoke or unstable dwelling
  taxonomy_refs: []
  basis: Nanak says, after seeking and searching, that the world is a mansion of smoke.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No supplied taxonomy family directly matches this image of impermanence.
- id: motif:7
  label: rejection of external asceticism and ritual purification
  taxonomy_refs:
  - wisdom
  basis: Extreme ascetic settings and practices, washing, bathing, and mortification
    are rejected when the heart remains impure; meditation on the Name is favored.
  evidence_refs:
  - ev:12
  - ev:14
  - ev:15
  confidence: medium
  cautions: "'Wisdom' is a broad taxonomy family; the passage is primarily doctrinal
    and ethical rather than a narrative wisdom tale."
- id: motif:8
  label: annihilation or absorption in God through the Word
  taxonomy_refs:
  - annihilation_union
  basis: After pondering on the Word, the speaker says he is not, was not, and shall
    not be; the note glosses this as total absorption in God.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The statement is brief and depends partly on the translator's explanatory
    note.
- id: motif:9
  label: Death's noose as consequence of blindness and error
  taxonomy_refs:
  - divine_judgment
  basis: The blind person is led astray and falls into Death's noose; the surrounding
    passage opposes external purification to inner impurity and pride.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: low
  cautions: The passage names Death's noose but does not explicitly stage a divine
    judgment tribunal.
- id: motif:10
  label: religious hypocrisy exposed by blood pollution
  taxonomy_refs:
  - wisdom
  basis: The Qazi wipes blood from his clothing before prayer, and the Guru contrasts
    this with the impurity of hearts that drink human blood.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: medium
  cautions: The motif is ethical critique; 'wisdom' is a broad available category
    rather than a precise motif label.
