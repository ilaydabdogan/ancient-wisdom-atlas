canonical_text:
  quote: Turn my feet in a direction in which God is not.
  summary: Guru Nanak arrives in Makka, is challenged for sleeping with his feet toward
    the Kaaba, and responds with a statement of divine omnipresence. A miracle is
    reported in which the temple turns with his body. Muslim religious authorities
    question him about Hindu and Muslim religion, scripture, fasting, and how God
    may be obtained; he answers with teachings emphasizing good acts, inner discipline,
    humility, prayer, and the presence of the Creator in creation.
  language: English
  quote_policy: quoted
