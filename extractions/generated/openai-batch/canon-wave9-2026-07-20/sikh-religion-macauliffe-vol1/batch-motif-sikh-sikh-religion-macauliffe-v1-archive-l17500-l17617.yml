canonical_text:
  quote: ''
  summary: The passage praises the infinite Creator and says meditation, worship,
    and service to God bring happiness, emancipation, release from Death’s noose,
    fearlessness, and absorption in God. It contrasts true saints who please God with
    outward religious acts alone, affirms God’s will and the transience of creation,
    describes God as an ocean containing all, and ends with an image of man in the
    world as a tank with water hot as fire and mire of worldly love in which he drowns.
  language: English
