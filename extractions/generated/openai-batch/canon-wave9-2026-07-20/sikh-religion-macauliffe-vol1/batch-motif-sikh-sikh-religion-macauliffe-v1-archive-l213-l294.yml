  summary: In this preface passage, Macauliffe explains that Sikh societies asked
    him to leave judicial service and translate Sikh sacred works. He describes submitting
    every line of the translation to learned Sikh criticism, names Sikh reviewers
    who certified the translation, and records an appeal for Sikh readers and patrons
    to read or support the work.
