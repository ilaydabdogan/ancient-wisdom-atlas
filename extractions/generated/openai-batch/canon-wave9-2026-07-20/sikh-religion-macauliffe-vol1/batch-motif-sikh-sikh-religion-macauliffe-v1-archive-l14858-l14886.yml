  summary: The stanza asks what gate or mansion God occupies while watching over all
    things. It describes countless instruments, musicians, musical measures, and singers
    praising God. Wind, water, fire, Dharmraj, recording angels, Ishar, Brahma, and
    Devi are also said to sing to God. The notes identify the recording angels as
    Chitr and Gupt and explain their recording function for Dharmraj’s judgment; another
    note identifies Ishar as a title of Shiv.
