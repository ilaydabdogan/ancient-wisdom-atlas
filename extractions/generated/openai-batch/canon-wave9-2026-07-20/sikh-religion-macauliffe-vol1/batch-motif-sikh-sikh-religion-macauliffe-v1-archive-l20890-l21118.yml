  summary: The passage teaches that the divine Name, the Guru's instruction, and the
    Word bring honor, deliverance, inner purity, restraint of the wandering mind,
    and union with God. It depicts the soul and senses facing account and death, contrasts
    worldly attachment with devotion, criticizes hypocritical asceticism, and uses
    images of the soul's beloved, blooming lotuses, unbodied music, divine treasure,
    cosmic pervasion, and a mind like a furious elephant in a forest.
