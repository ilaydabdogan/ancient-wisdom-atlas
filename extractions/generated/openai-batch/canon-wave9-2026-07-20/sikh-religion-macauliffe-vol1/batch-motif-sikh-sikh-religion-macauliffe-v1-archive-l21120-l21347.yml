  summary: A devotional and didactic passage teaches that God is known through the
    Guru’s instruction and God’s Name. It contrasts inward remembrance, domestic devotion,
    and love of God with worldly entanglements, greed, ostentatious ritual, external
    asceticism, and the pursuit of supernatural power. It uses images of shackles,
    the heart as temple or forest, crossing a terrible ocean, poison, stone, wealth,
    nectar, God’s gate and court, and a stone boat.
