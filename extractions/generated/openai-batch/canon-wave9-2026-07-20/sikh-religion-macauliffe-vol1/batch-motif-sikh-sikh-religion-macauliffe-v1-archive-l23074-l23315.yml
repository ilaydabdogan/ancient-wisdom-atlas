canonical_text:
  quote: ''
  summary: The passage opens with a prayer that God's name assist at the last hour.
    A narrator explains a Hindu funerary custom of keeping a lamp burning and floating
    it on water, after which Guru Nanak gives a homily reworking the lamp as an inner,
    knowledge-filled, deed-shaped light that accompanies a person in this world and
    the next. Subsequent sections address a Jogi, describe the body as a carriage
    drawn by five oxen, commend the Guru's instruction, the Name, sahaj jog, and devotion
    to God, state that God is in the heart, recount Chetnath's reproach to Guru Nanak
    and Nanak's rebuke of a false Jogi, and finally reject astrology in favor of the
    Guru's word and God's will.
  language: English
  quote_policy: summarized
