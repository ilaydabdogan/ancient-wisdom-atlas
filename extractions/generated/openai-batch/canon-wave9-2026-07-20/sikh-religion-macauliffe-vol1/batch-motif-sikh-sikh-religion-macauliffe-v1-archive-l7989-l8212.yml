canonical_text:
  quote: ''
  summary: Guru Nanak and Mardana visit the shrine of Shaikh Farid, where Shaikh Brahm
    engages the Guru in a sequence of poetic exchanges. Their dialogue uses images
    of boats, rafts, water-crossing, worldly attachment, bodily impermanence, the
    divine Beloved or Spouse, dyed garments, divine sovereignty, and gifts granted
    during night devotion. The passage ends with a villager bringing milk to the Guru
    and Shaikh Brahm in the forest before dawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Guru and Mardana return from travels in Eastern India to the Panjab and
    visit the shrine of Shaikh Farid at Ajodhan, now Pak Pattan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shaikh Brahm is described as the incumbent of the shrine and begins the dialogue
    after seeing the Guru dressed in ordinary secular costume.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The opening exchange uses the image of putting one’s feet on two boats; Shaikh
    Brahm warns against it, and the Guru replies that one boat may sink while another
    crosses over, then says that for him there is no water, boat, wreck, or loss.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Shaikh Brahm speaks of the world being enamoured of a witch and of a field
    being ruined; the Guru replies that the field will not be ruined if the watchman
    is alert.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shaikh Brahm describes his failing body and asks the beloved to become his
    physician; the Guru answers that the Beloved is not far and should be beheld in
    the heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shaikh Brahm speaks of a raft not made in time, a full river difficult to
    cross, fire that burns, milk that will not return to the udder, the Spouse calling,
    the soul departing, and the body becoming dust.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Guru replies with a hymn that speaks of making a raft of devotion and
    penance, crossing the stream, the Lord’s name dyeing a robe, meeting the Bridegroom
    through virtues, union, the end of transmigration, and a garment made by abandoning
    egotism.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: Shaikh Brahm praises those who have heart-felt love for God and longing to
    behold Him, contrasts truth and falseness, and asks God for shelter and worship
    as charity.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: In the hymn called Suchajji, the Guru addresses the Lord as treasure and Spouse,
    says the Lord may bestow a throne or make a person a mendicant, may cause rivers
    to flow over dry land, may cause a lotus to bloom in the heavens, and may enable
    or prevent crossing the terrible ocean.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The Guru and Shaikh Brahm remain together at night in the forest; a charitable
    villager brings a basin of milk before daylight, and Shaikh Brahm and the Guru
    exchange verses about night devotion, watching, and gifts from the Lord.
  category: sequence
  evidence_refs:
