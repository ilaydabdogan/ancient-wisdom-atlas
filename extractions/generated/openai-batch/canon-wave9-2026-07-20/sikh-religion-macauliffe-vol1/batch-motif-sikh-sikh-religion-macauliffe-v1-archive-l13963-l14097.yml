canonical_text:
  quote: ''
  summary: The passage praises God as beyond complete description, creator and restorer
    of life, giver of bounty, ruler of the world, and true Lord. It instructs meditation
    on the true Name at the ambrosial morning hour, speaks of divine favour as a robe
    of honour and access to the gate of salvation, praises the self-existent God,
    and presents the Guru’s instruction as the means by which God’s word and omnipresence
    are known. It also identifies the Guru with several named Hindu deity figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage repeatedly asks who can sing God’s attributes, greatness, deeds,
    difficult knowledge, creation and destruction of the body, restoration of life,
    nearness, all-seeing nature, and omnipresence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that describing God has no end and that millions of people
    giving countless descriptions fail to describe Him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is described as the Giver; receivers grow weary of receiving; humans subsist
    by His bounty in every age; and the Commander has laid out the way of the world
    by His order.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Lord and His name are called true, and people are represented as praying
    and begging for gifts while the text asks what can be offered or uttered so that
    His court may be seen and He may love the speaker.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage instructs meditation at the ambrosial hour of morning on the true
    Name and God’s greatness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kind One is said to give a robe of honour, and by His favour the speakers
    reach the gate of salvation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: God is described as not established or created, pure and self-existent; those
    who worshipped Him obtained honour.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage tells hearers to sing, hear, and put divine love into their hearts,
    after which sorrows are removed and they are absorbed in the abode of happiness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Under the Guru’s instruction, God’s word is heard, knowledge is acquired,
