  text: Obeying Him leads to the gate of salvation, salvation with one's family, the
    Guru being saved and saving disciples, and no wandering in quest of alms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The elect are described as acceptable and distinguished, honored in God's
    court, shining in kings' courts, and attending to the one Guru.
  category: relationship
  evidence_refs:
  - ev:7
