    unfathomable fathomable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The condition of one who obeys God is said to be indescribable; no paper,
    pen, or writer can describe it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Obeying Him brings wisdom and understanding into the mind and lets a person
    know all worlds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Obeying Him prevents punishment and prevents the person from departing with
    Jam; the note explains this as not dying again but being absorbed in God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Obeying Him makes the path unobstructed, gives an honorable departure, lets
    the person proceed in ecstasy, and forms an alliance with virtue.
  category: sequence
  evidence_refs:
  - ev:5
