canonical_text:
  quote: ''
  summary: Kalu questions the Guru about his dissatisfaction and offers to find him
    another wife. The Guru answers with hymns on divine ordering, gifts, virtue, marriage
    imagery, and God as the sole actor. The mother urges worldly duty, and the Guru
    answers with a hymn about remembrance of the Lord, celestial journey, destiny,
    and separation or union with God. Kalu appeals to health and safety; the Guru
    replies that he has no anxiety about death or desire for life because God cherishes
    all and accounts breath. Finally, the Guru says he has returned after being a
    hermit and asks his parents to let him depart again; his mother protests his twelve-year
    absence and then falls silent.
  language: English
  quote_policy: summarized
