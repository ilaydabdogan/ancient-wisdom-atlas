canonical_text:
  quote: ''
  summary: Guru Nanak, nearing death, appoints Angad as successor, gives final teachings
    on death and remembrance of God, resolves a Hindu-Muslim dispute over funeral
    rites through a flower test, recites funeral hymns, blends his light with Angad's,
    and leaves no body beneath the sheet the next morning; flowers on both sides remain
    in bloom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guru Nanak appoints Angad as successor after stating that his sons had disobeyed,
    rebelled, and deserted him; he places the umbrella of spiritual sovereignty over
    Angad's head and bows to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whole troops of Sikhs, Hindus, and Musalmans come to bid Guru Nanak farewell
    when it becomes known that he is about to die.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Angad asks Guru Nanak to restore those who had seceded from him, and Guru
    Nanak replies that he has forgiven them for Angad's sake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guru Nanak sits under a withered acacia tree, and the tree becomes green and
    produces leaves and blossoms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guru Nanak's hymn says that when life's measure is full the soul is led away,
    body and soul are separated, relations weep, all must depart, and everyone fares
    according to acts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After mourning songs, Guru Nanak falls into a trance; when he wakes, his sons
    ask what provision has been made for them, and he tells them that God gives food
    and clothing and that repeating God's name will save them at last.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Musalmans who had received God's name from Guru Nanak say they will bury him
    after death, while Hindu followers say they will cremate him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Guru Nanak instructs Hindus to place flowers on his right and Musalmans on
    his left; whichever flowers are fresh in the morning may determine the disposal
    of his body.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Guru Nanak orders the crowd to sing the Sohila, whose verses include marriage,
    bride, and meeting-the-Lord imagery in connection with the approaching day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Guru Nanak draws a sheet over himself, utters Wahguru, makes obeisance to
    God, and the passage states that he blends his light with Guru Angad's.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next morning, nothing is found beneath the sheet; flowers on both sides
    are in bloom, Hindus and Musalmans remove their respective flowers, and Sikhs
    salute the spot where Guru Nanak had lain.
  category: sequence
  evidence_refs:
  - ev:9
