  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nanak's hymn says the mind and body are troubled, compares the body that forgets
    God's word to a leper, says God knows everything without complaint, and describes
    God as maker of the senses and tongue.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same hymn says worldly attachments are blackness and stains, that a person
    departing with sin's brand will not sit in God's court, and that one favored by
    God repeats the Name and is saved.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nanak blesses the leper; the leper is cured, falls at Nanak's feet, and begins
    uttering the Name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Kari Pathandi, Nanak makes many Pathan converts, who serenade him with
