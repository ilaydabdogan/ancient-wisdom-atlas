canonical_text:
  quote: ''
  summary: Guru Nanak instructs Shaikh Brahm on humility and gives him assurance that
    God will accept his devotion. Nanak defines udas for a Sanyasi as using the world's
    things without owning them and desiring to meet God. At Windpur, Khatris reject
    Nanak's faqir dress and Mardana's singing and order him away. Near the site of
    Goindwal, only a poor leper receives Nanak; Nanak recites a hymn on suffering,
    sin, divine knowledge, the Name, and salvation, then blesses the leper, who is
    cured and begins uttering the Name. At Kari Pathandi, Pathan converts praise Nanak.
    Nanak composes a hymn using images of the Beloved or Spouse, the wife seeking
    union, companions who know the way, metal blending with metal, nectar ending doubt
    and transmigration, and blending with God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shaikh Brahm asks Guru Nanak for further instruction, and Nanak teaches that
    low-lying water rises under pressure into fountains, so those who keep a humble
    mind mount to God's highest pinnacle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shaikh Brahm says Nanak has found God and asks to be on good terms with God;
    Nanak replies that God will cause the Shaikh's cargo to arrive safe, which the
    passage explains as acceptance of the Shaikh's devotion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sanyasi asks Nanak to define udas, and Nanak defines it as using all things
    in the world while not deeming them one's own, but God's property, and always
    desiring to meet God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Khatris at Windpur are displeased by Nanak's faqir dress and by Mardana's
    singing, accuse him of disgracing his tribe and misleading the world, and order
