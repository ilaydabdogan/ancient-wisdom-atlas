canonical_text:
  quote: ''
  summary: A Shaikh honors Guru Nanak and departs. Guru Nanak travels to Dihli, where
    a royal elephant has died; after he instructs the keepers to rub its forehead
    and say “Wah Guru,” the elephant stands up. Ibrahim Lodi questions the Guru, who
    attributes destruction and reanimation to God alone, refuses to be treated as
    a wonder-worker, and rejects a royal gift. The Guru then visits Bindraban, sees
    a Krishanlila performance, and expresses dissatisfaction with religious theatrics,
    contrasting dancing and tumbling with devotion to the Formless One, divine favor,
    moral causation, and fear and love of God.
  language: English
  quote_policy: summarized
