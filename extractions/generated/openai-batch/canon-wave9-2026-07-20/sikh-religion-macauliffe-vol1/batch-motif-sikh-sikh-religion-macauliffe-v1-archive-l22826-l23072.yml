canonical_text:
  quote: ''
  summary: A set of translated Sikh devotional verses and editorial headings urges
    remembrance of God’s Name, criticizes corrupt association, ritual display, scriptural
    learning without understanding, attachment to mammon, and hypocrisy. The passage
    praises the formless, indescribable God, presents the heart as a temple, describes
    bridal longing for God, warns of Death’s gate and transmigration, and uses images
    of commerce, light, washing, bonds, and a frail cord for spiritual teaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men are urged to traffic in God’s Name from their earliest years, and the
    opening of shops begins the traffic.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents two lamps for fourteen shops and as many shopkeepers
    as souls; a note identifies the lamps as the sun and moon for the fourteen worlds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Religion is described as a broker who marks goods, and those who profit by
    the Name are acceptable and welcomed at their own homes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Thieves, adulterers, prostitutes, pimps, and the irreligious are grouped as
    bad associates who do not think of God’s praises and whose mental filth increases.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Falsehood is described as being spun and woven into a web, cloth, measurement,
    raiment, and pride.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Repetition of God’s Name is said to be superior to the call of the Muazzin,
    the horn of the Jogi, and the chorus of bards.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker likens separation from God to a married woman seeking even one
    night with the Bridegroom, and compares those lacking love to a guest in an empty
    house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pandits are addressed about Vedic reading; the speaker says divine knowledge
    dispels mental ignorance and that one who listens to the Guru’s instruction shall
    be saved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says it would not glorify God to call Him by the names of Hindu
    incarnations and emphasizes God as indescribable and beyond the speaker’s capacity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker says his body is clothed in a Qalandar’s dress, his heart has
    been made a temple and place of pilgrimage, the one Word dwells in the heart,
    and he shall not be born again.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: God is said to fill sea and land, upper and lower regions, and to have light
    in every heart; men and lower animals seek God’s protection.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Those attached to mammon are said to regret it, go in fetters to Death’s gate,
    suffer transmigration, and receive blows from the god of death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the tenth lunar day the Name is prescribed as offerings and ablutions,
    and day and night laving in the attributes and knowledge of the True One is recommended.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The world is compared to a frail cord that will soon snap, and the mind is
    told to fix firmly on the True One.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: Some people read the Veds and Purans or repeat names on rosaries; the speaker
    says he recognizes only God’s Name, while the greedy mind searches for mammon
    and man amasses wealth despite being doomed to die.
  category: action
  evidence_refs:
  - ev:10
