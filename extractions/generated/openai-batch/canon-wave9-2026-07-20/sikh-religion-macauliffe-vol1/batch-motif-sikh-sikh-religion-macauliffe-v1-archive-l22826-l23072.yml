candidate_motifs:
- id: motif:1
  label: Sacred exchange through the divine Name
  taxonomy_refs:
  - sacred_exchange
  basis: The passage casts spiritual life as traffic in God’s Name, with souls as
    shopkeepers, religion as broker, and profit by the Name bringing acceptance.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The exchange is metaphorical devotional instruction rather than a narrated
    bargain.
- id: motif:2
  label: Divine beloved and bridal longing
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: The devotional voice uses the figure of a married woman separated from God
    and speaks of the Bridegroom’s delights.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents the imagery as devotional metaphor; it does not narrate
    an actual marriage episode.
- id: motif:3
  label: Wisdom as light dispelling ignorance
  taxonomy_refs:
  - wisdom
  basis: The passage compares lamp-light and sunrise to the appearance of divine knowledge,
    which dispels mental ignorance.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is didactic symbolism rather than an independent mythic narrative.
- id: motif:4
  label: Inner temple and mystical devotion
  taxonomy_refs:
  - mystical_quest
  - world_center
  basis: The speaker makes the heart a temple and pilgrimage place, holds the one
    Word in the heart, and describes God’s light in every heart and presence through
    cosmic regions.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The world-center reference is interpretive and based on the inward sacred-place
    imagery rather than an explicit cosmic center.
- id: motif:5
  label: Judgment at Death’s gate
  taxonomy_refs:
  - divine_judgment
  - afterlife_journey_map
  basis: Those attached to mammon are described as going in fetters to Death’s gate,
    suffering transmigration, and receiving blows from the god of death.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives a brief warning image, not a detailed afterlife itinerary.
- id: motif:6
  label: Liberation from rebirth through Word, Name, and Guru instruction
  taxonomy_refs:
  - death_rebirth
  basis: The speaker says the one Word dwells in the heart and he will not be born
    again; elsewhere no one is emancipated without Guru instruction.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The emphasis is soteriological teaching within Sikh devotional verse,
    not a rebirth story of a named hero.
- id: motif:7
  label: Devotional self-offering and self-deprecation
  taxonomy_refs:
  - sacrifice
  basis: The speaker says he is a sacrifice to those who hear and accept the Name,
    and elsewhere describes himself as foolish, blind, ignorant, and dependent on
    God.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:10
  confidence: medium
  cautions: The word sacrifice appears as devotional idiom rather than a literal sacrificial
    rite.
- id: motif:8
  label: Renunciation of mammon and fragile world
  taxonomy_refs:
  - mystical_quest
  basis: The passage counsels disregard of mammon, compares the world to a frail cord,
    and urges the mind to fix on the True One.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: This is ethical and devotional instruction; the taxonomy reference is
    broad.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares repetition of God’s Name with the Muazzin’s
    call, the Jogi’s horn, and bardic chorus, assigning superior value to the Name.
  claim_level: same_function
  target: 'Ritual sound practices named in the passage: Muazzin call, Jogi horn, and
    bardic chorus'
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
