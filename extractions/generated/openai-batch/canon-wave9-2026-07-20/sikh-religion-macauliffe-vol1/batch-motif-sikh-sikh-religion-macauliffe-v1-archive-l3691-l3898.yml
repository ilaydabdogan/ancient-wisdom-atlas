- id: claim:1
  claim: The translator’s note states that the Sikh four ages correspond to the golden,
    silver, brass, and iron ages of Greece and Rome.
  claim_level: same_motif
  target: Greek and Roman sequence of golden, silver, brass, and iron ages
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a translator-supplied correspondence in a note; the passage
    does not provide evidence for historical contact or common inheritance.
- id: claim:2
  claim: The translator’s note says the Sikh image of God as husband and the Gurus
    as wives has a partial parallel in the Greek myth of Psyche and Eros, where the
    human soul suffers to regain the divine beloved.
  claim_level: same_function
  target: Greek myth of Psyche and Eros
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly framed as partial by the note and does
    not establish historical dependence or identical narrative structure.
