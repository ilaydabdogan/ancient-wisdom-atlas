  quote: ''
  summary: The preface explains the compiler’s decision to present Sikh hymns in narrative
    form and to avoid printing multiple near-identical hymns. It compares repetition
    in sacred books to oral prophetic instruction, reports Sikh scholarly approval
    of the abridgement, and gives examples involving Guru Teg Bahadur’s prophecy to
    Aurangzeb and a partial statement attributed to Guru Gobind Singh about the Khalsa
    awakening in battle.
  language: English
  quote_policy: summarized
