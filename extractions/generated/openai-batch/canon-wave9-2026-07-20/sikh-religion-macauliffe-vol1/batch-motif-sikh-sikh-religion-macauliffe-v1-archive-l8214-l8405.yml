canonical_text:
  quote: ''
  summary: Guru Nanak and Shaikh Brahm encounter a villager whose milk is found to
    contain gold coins; the villager suspects magic, leaves, later returns to find
    his basin transformed into gold and filled with coins, and repents his worldly
    suspicion. The Guru recites hymns using watches of the night, a thief, fields,
    bodily decline, Death, accounting, mammon, and a raft of God's fear to teach vigilance,
    remembrance of the Name, detachment from worldly possessions, and divine judgment.
  language: English
