canonical_text:
  quote: not one blade had been trampled on or eaten
  summary: The passage first gives a sequence of admonitory verses addressed to Rukn-ul-Din,
    emphasizing good works, self-knowledge, restraint, prayer, almsgiving, truth,
    remembrance of God, divine judgment, and finding God through service to the guru.
    It then comments on Nanak's Persian learning and probable acquaintance with Muhammadan
    writings. A narrative follows in which Nanak is sent to herd buffaloes, falls
    asleep, and his cattle enter a neighbor's field; after Nanak says God has blessed
    the field, messengers find the field undamaged, and the place is identified as
    Kiara Sahib. A note states that the preceding composition is not found in the
    Granth Sahib and that some Sikhs deny its attribution to Guru Nanak.
  language: English
  quote_policy: quoted
