- id: motif:2
  label: Sacred marriage or bridal union imagery
  taxonomy_refs:
  - sacred_marriage
  basis: The passage is said to be sung at marriages and festivities, asks women to
    sing rejoicing, and declares that the Spouse has come to the house.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage uses marriage language for divine-human relation; no separate
    mythic wedding narrative is told.
- id: motif:3
  label: Annihilation or absorption into the divine beloved
  taxonomy_refs:
  - annihilation_union
  basis: The woman who dismisses pride is absorbed in her Beloved, and elsewhere God
    blends the emancipated person with Himself.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage states absorption and blending in devotional-theological language,
    not through a detailed journey episode.
- id: motif:4
  label: Release from birth, death, and transmigration
  taxonomy_refs:
  - death_rebirth
  basis: The text mentions suffering in many births, not being born again when dyed
    with the True One, suffering transmigration when led astray, and ending the pain
    of birth and death by beholding the Friend.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:9
  confidence: high
  cautions: The focus is liberation from rebirth rather than a narrative death-and-return
    episode.
- id: motif:5
  label: Divine judgment by accounting and testing
  taxonomy_refs:
  - divine_judgment
  basis: Accounts are summoned, given, examined, and considered; an executioner punishes;
    and the Lord's court tests counterfeit and genuine persons like assayed money.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The judicial language is moral and devotional instruction, not a fully
    mapped afterlife tribunal narrative.
- id: motif:6
  label: Wisdom through Guru, Word, and divine knowledge
  taxonomy_refs:
  - wisdom
  basis: The Guru gives instruction and steadies the soul, the Word removes demerits,
    and divine knowledge is applied as salve to see God's form.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage emphasizes spiritual instruction rather than a separate wisdom-quest
    plot.
- id: motif:7
  label: Inner purity over external ritual washing
  taxonomy_refs:
  - wisdom
  basis: The pilgrimage-bathing passage says external washing does not remove inward
    filth, comparing such people to an externally washed poisonous gourd and stating
    that a thief remains a thief.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The available taxonomy has no specific purification or anti-ritual motif
    family; mapped cautiously under wisdom.
