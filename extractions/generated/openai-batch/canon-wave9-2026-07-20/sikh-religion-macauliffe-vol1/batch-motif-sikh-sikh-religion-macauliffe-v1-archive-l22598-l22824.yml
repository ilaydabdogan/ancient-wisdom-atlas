canonical_text:
  quote: ''
  summary: A sequence of devotional hymns and instructions presents the human soul
    in feminine imagery before God as Beloved, Spouse, Bridegroom, Friend, True One,
    and Supreme Spirit. It contrasts false worldly attachment with the lasting dye
    of divine love, emphasizes the Name, Word, Guru, saints, and divine knowledge,
    and describes release from rebirth, divine judgment by accounting and testing,
    and the insufficiency of external pilgrimage bathing without inner purity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening prayer asks God to attach an unadorned woman to the divine feet,
    and describes one who lacks wisdom and does not remember God at the last moment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman attached to mammon and superstition fails to please her Spouse, but
    if she dismisses pride she is absorbed in her Beloved and obtains Him as nine
    treasures.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says separation from God has caused suffering through many births
    and asks the Beloved Sovereign to take the speaker's hand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage contrasts the fleeting dye of the safflower with the enduring
    dye associated with the True One and divine love.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Without the Name, a person wanders in error, is robbed by evil passions, and
    does not obtain spiritual wealth by wandering in every direction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Guru is said to give God's dye, protect some people, and dye their hearts
    with instruction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: People wearing white clothes but having filthy hard hearts are said not to
    utter the Name and to become absorbed in mammon like thieves.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
