  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Love for the True One saves a person, and the Pardoner pardons him; one who
    makes someone other than God his friend dies and is blended with dust.
  category: relationship
  evidence_refs:
  - ev:4
