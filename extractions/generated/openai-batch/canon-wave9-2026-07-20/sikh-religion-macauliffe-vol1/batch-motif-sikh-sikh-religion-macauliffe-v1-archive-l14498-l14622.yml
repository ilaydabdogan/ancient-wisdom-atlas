  quote: ''
  summary: Stanzas XIX-XXI of the Japji praise God's numberless names, places, worlds,
    and creation; describe letters and the divine Name as media of praise, knowledge,
    destiny, and purification; contrast external washing and pilgrimage with inner
    cleansing; describe moral record, consequence, and transmigration under God's
    order; and state that only the Creator knows the time of the world's creation.
  language: English
