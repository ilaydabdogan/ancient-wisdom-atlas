    beings by His order.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Women who adorn themselves with love and affection for their Spouse are said
    to abide in His chambers, be regenerated by the Word, supplicate the Beloved,
    and quaff nectar when their hopes are fulfilled by the Word.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: Nanak’s inquiry after the True Name is compared with images of an unsatisfied
    desert, fire, kings, and ocean.
  category: speech
  evidence_refs:
