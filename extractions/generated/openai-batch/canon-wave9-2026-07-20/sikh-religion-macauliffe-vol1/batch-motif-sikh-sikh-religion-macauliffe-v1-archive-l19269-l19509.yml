- id: motif:1
  label: sole enduring God amid cosmic and worldly transience
  taxonomy_refs: []
  basis: The passage repeatedly says various beings, regions, powers, and natural
    supports will not abide, while addressing God with the refrain that only Thou
    remains.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No specific available taxonomy family exactly matches this motif without
    adding interpretation.
- id: motif:2
  label: divine assessment at palace, court, gate, and scales
  taxonomy_refs:
  - divine_judgment
  basis: False persons fail to reach God’s palace or court, while the owner is weighed
    and genuine goods are assayed and selected at the gate of the All-seeing.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage uses mercantile and courtly imagery; it does not narrate a
    full judgment scene.
- id: motif:3
  label: Guru as knowledge-bearing sacred tree
  taxonomy_refs:
  - wisdom
  - sacred_tree_axis
  basis: The Guru is called a tree of contentment with religion as blossom and divine
    knowledge as fruit, with pilgrimage places at the Guru’s feet.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The tree is sacred and knowledge-bearing, but an explicit world-axis or
    world-center function is not stated.
- id: motif:4
  label: devotee as bride or lover of the divine Spouse
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: Women are told to adorn themselves with love for their Spouse, dwell in His
    chambers, supplicate the Beloved, and appear beautiful near Him.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The marriage language functions devotionally in this passage; no literal
    wedding narrative is present.
- id: motif:5
  label: destructive inner vices as fire
  taxonomy_refs: []
  basis: Greed is a fire in the heart quenched by the Guru’s instruction, and cruelty,
    worldly love, avarice, and wrath are four streams of fire that burn those who
    fall into them.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The available taxonomy includes fire as a symbol, but the available motif
    family 'world_destroying_fire' would overstate the passage because the fire is
    moral and inward rather than cosmic.
- id: motif:6
  label: unending quest for the True Name
  taxonomy_refs:
  - mystical_quest
  basis: Nanak says he has inquired after the True Name and not been satisfied, using
    images of unsatisfied rain, fire, dominion, and ocean.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage expresses devotional longing rather than a narrative quest
    with travel or trials.
- id: motif:7
  label: regenerating Word and nectar
  taxonomy_refs:
  - wisdom
  basis: The Word is said to regenerate devotees, fulfill hopes, and enable them to
    quaff nectar.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage does not define the Word beyond its devotional and salvific
    effects.
- id: motif:8
