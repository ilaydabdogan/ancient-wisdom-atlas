canonical_text:
  quote: ''
  summary: Guru Nanak’s verses and instructional passages praise God as the only enduring
    reality, teach devotional discipline through the day, criticize false worldly
    attachments, describe the True One, Guru, and Word as sources of liberation, compare
    the Guru to a life-giving tree, portray vices as fiery streams, depict forgetfulness
    of God as bitterness and poison, describe human condition through bird imagery,
    frame devotees as women loving the divine Spouse, and express unsatisfied longing
    for the True Name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces seven sloks as part of the Guru’s instruction to Shaikh
    Brahm, also identified as Farid the second of Pak Pattan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Priests, shaikhs, potentates, emperors, demigods, demons, men, Sidhs, Strivers,
    earth, subterranean regions, solar and lunar regions, continents, seas, corn,
    and wind are described as not abiding, while God alone is repeatedly addressed
    as remaining.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds are described as having no money and depending on trees and water, with
    God named as their giver.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says no one can erase what is written on the forehead, and that
    God gives human power and takes it away again.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Guru Nanak discourses to Prem Chand of Sarhind on occupying time, emphasizing
    early-morning praise and meditation and describing distractions, hunger, thirst,
    sleep, dreams, turmoil, and love of God through the watches of the day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: False worldly occupations are said to prevent reaching God’s palace; the owner
    of a house is weighed, and genuine goods are assayed and selected at the gate
    of the All-seeing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Without the True One, the false are bound and led away, the body is dust,
    dress and food are hunger, and the false do not attain God’s court.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The fire of greed in the heart is said to be quenched by the Guru’s instruction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Guru is compared to a tree of contentment with blossom as religion and
    fruit as divine knowledge; another tree is described with gold, corals, jewels,
    rubies, and gem-like fruit.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sixty-eight places of pilgrimage are said to be at the Guru’s feet and to
    worship them.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cruelty, worldly love, avarice, and wrath are called four streams of fire;
    those who fall into them are burnt, while deliverance is obtained by cleaving
    to good works.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: People who never remember God are described as having bitterness and poison
    in heart and mouth and as wandering bereft of God’s favour.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Man is compared to a bird that sometimes flies high or low and perches on
