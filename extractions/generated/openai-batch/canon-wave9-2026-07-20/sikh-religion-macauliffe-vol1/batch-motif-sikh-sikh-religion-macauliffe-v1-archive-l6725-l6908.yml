  quote: ''
  summary: The passage presents Guru Nanak's exchanges with Chatur Das/Pandit at Banaras,
    using metaphors of raft, irrigation, digging, birds, city, inner elements, and
    sacred letter to teach that God's Name and divine knowledge surpass ritual tokens,
    worldly sciences, and conventional learning. The Pandit accepts the Guru and becomes
    a Sikh. The passage then notes visits by two young pandits and the Guru's move
    to Gaya, where he responds to Brahmans urging ancestor rites by identifying the
    Name as his ritual lamp.
