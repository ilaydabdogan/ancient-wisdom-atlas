    Guru and go where the Lord is.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Assu, the wife asks the Beloved to come, says love of mammon ruins man,
    says falsehood causes a husband to put a woman away, and names the true Guru as
    mediator for meeting the Beloved.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: In Kartik, divine knowledge lights a lamp, love is its oil, the woman and
