canonical_text:
  quote: ''
  summary: A sequence of monthly stanzas presents a woman or wife addressing God as
    Spouse, Beloved, Lord, or True One. Seasonal changes, plants, animals, heat, rain,
    cold, separation, prayer, divine knowledge, the Word, the Guru, sin, virtue, and
    union with God are described across months from Chet through Poh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening lines describe spouses in houses, ask why the speaker’s Spouse
    has forgotten her, and call on the one who rains ambrosial speech to come to the
    speaker’s abode.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Chet, spring, flowering forests, a kokil on a mango-tree, and a bumble-bee
    on flowering branches accompany a wife’s distress because her Beloved has not
    returned home.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Chet, Nanak states that comfort is obtained if the woman obtains God in
    her home as her Spouse.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Baisakh, trees blossom and the woman waits at her gate, asking God or her
    Beloved to come home, take compassion, make her cross the difficult ocean, and
    be recognized as present in her heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Jeth, the land burns like a furnace, and the woman supplicates God, praises
    His qualities, and says that without God she lacks honour, strength, and comfort.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Har, the sun burns, the earth is parched like fire, people die in anguish
    from heat, grasshoppers chirp, and women look for shade.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Har, the passage says that one who departs with sins will suffer in the
    next world, while one who remembers the True One will obtain comfort.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Sawan, clouds and rain mark the season; the wife says her Spouse has gone
    abroad, lightning frightens her, she is alone on her couch, and sleep, appetite,
    and raiment do not comfort her without God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Bhadon, rainy-season water fills lakes and meadows; frogs, peacocks, the
