canonical_text:
  quote: ''
  summary: The passage lists many turning objects and tumbling motions, then compares
    them to people bound in entanglements who dance according to their acts and may
    weep at departure. It teaches fear and love of God, repetition of the Formless
    Name, humility, good acts, and the inevitability of old age and death. It then
    describes Muslim, Hindu, and Jogi religious practices, and contrasts generous
    giving with self-interested giving and sinful conduct.
  language: English
  quote_policy: summarized
