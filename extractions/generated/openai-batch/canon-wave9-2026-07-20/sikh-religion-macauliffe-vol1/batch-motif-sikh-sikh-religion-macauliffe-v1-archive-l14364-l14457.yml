canonical_text:
  quote: ''
  summary: The passage says the Creator's works cannot be numbered. It identifies
    the spoken-of bull as righteousness, born of mercy and supported by patience,
    maintaining the order of nature. It says there are more worlds beyond this earth,
    that living things and their kinds cannot be fully accounted, and that God expanded
    the world by one word, producing countless rivers. The speaker declares inability
    to describe or be a sacrifice to God, accepts whatever pleases God as good, and
    addresses God as the secure Formless One. A following stanza lists numberless
    worshippers, lovers, ascetics, reciters, Jogis, saints, true men, almsgivers,
    heroes, and silent worshippers.
  language: English
  quote_policy: summarized
