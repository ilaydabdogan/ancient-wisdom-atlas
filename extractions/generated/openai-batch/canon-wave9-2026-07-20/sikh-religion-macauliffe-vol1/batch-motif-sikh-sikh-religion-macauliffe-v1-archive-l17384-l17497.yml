canonical_text:
  quote: ''
  summary: A Rahiras passage praises the Guru’s instruction, the saving and satisfying
    power of God’s Name, and the company of saints. It contrasts devotees with those
    who lack relish for the Name, describes God’s providential care for insects and
    birds, uses the image of dry wood made green, and presents God as pure, inaccessible,
    illimitable, creator, provider, giver, enjoyer, worshipped Lord, worshipper, and
    all-pervading presence in every heart.
  language: English
  quote_policy: summarized
