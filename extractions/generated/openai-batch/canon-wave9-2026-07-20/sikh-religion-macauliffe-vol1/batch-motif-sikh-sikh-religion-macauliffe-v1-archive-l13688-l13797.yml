canonical_text:
  quote: ''
  summary: The passage first describes Sikh and Muhammadan memorial structures for
    the Guru near the Ravi being washed away by the river. It then presents Bhai Gur
    Das’s account of widespread moral and religious disorder at the rise of Sikh religion,
    including pride, false worship, sectarian division, caste, corrupt rulers, and
    lack of a true guide. Pure religion is personified as burdened by human sin and
    appealing to God. God empowers Guru Nanak with the Name and humility and sends
    him to relieve suffering humanity. Nanak travels, teaches one formless and omnipresent
    God, rejects caste and empty ritual, restores religion, and finds contemporary
    religious groups immersed in pride and superstition.
  language: English
  quote_policy: summarized
