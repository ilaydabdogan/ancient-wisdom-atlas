canonical_text:
  quote: ''
  summary: Guru Nanak answers questions about the marks of a holy person, the vices
    of the perverse person, and the reason for writing Sat Nam at the head of hymns.
    The passage then introduces and begins a translation of his poem on the Twelve
    Months, using devotional language of God as Beloved and Spouse, seasonal imagery,
    birdsong, nectar, and the body as God's dwelling or temple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man named Kalu asks Guru Nanak for a definition of a holy man, and the Guru
    lists traits such as friendship, sympathy, pure intentions, service of the virtuous,
    craving for the Guru's word, fidelity, avoidance of quarrels, humility, and holy
    company.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two Sikhs named Bhagta and Ohri ask how rest can be obtained and transmigration
    avoided; the Guru replies that rest is found by avoiding perverse acts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Guru defines perverse conduct through envy, pride, slander, and obstinacy,
    and instructs the hearers to expel or relinquish these vices like trees dropping
    leaves in autumn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Guru explains that Sat Nam, the True Name, is written as an introduction
    to hymns because the Guru's Sikhs worship the True Name and thereby remove obstacles
    to salvation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the Guru composed a poem on the Twelve Months of the
    year, suited to the climate of the Panjab, and the notes list Indian seasons and
    months.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:9
- id: obs:6
  text: The poem says that God gives weal or woe justly according to actions in previous
    states of existence and that creation belongs to God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The poetic speaker says she cannot live without God, calls God her Beloved,
    and says she drinks nectar from the Guru's instruction.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The poem presents a woman waiting for the Omnipresent Spirit and says that
    the woman embraced by her Spouse enjoys happiness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The poem says God established nine mansions of the body and that the tenth,
    superior to all, is God's home.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chatrik cries 'Prio' and the kokil sings; a note explains that 'prio'
    also means beloved and that the kokil is the black Indian cuckoo.
  category: object
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:11
  text: The speaker says she is a sacrifice to God, seeks shelter at God's feet, becomes
    pure in body, and receives peace through God's favor and the Guru's teaching.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The poem describes a torrent of nectar, the meeting of the kindly Guru, love
    established with God, God entering the temple of the body, and the woman rising
    to repeat God's praises.
  category: sequence
  evidence_refs:
  - ev:8
