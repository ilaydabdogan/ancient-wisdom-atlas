canonical_text:
  quote: ''
  summary: An unnamed woman is mocked by other women for having borne a beast, snake,
    or monster, although her child had once been expected to become king. The king
    tells the women to leave her alone. A water-dwelling snake sheds or loses its
    skin, and many children emerge from it, including Unthlatu-yesiziba and Ntombintombi.
    The children leave the pool for land and home. At the old village they find ten
    ox bones, assemble them, bring oxen back to life, and mount them.
  language: English
  quote_policy: summarized
