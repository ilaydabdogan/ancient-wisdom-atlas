  evidence_refs:
  - ev:1
- id: obs:2
  text: The other women mock the woman by asking whether she exalts herself because
    she gave birth to a beast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The other women say her child had been expected to become king, call her a
    dog, and tell her to return to the pool where her child lives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king tells the others to leave the woman alone and says he had expected
    her to bear a child who would be king, but she bore a monster.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
