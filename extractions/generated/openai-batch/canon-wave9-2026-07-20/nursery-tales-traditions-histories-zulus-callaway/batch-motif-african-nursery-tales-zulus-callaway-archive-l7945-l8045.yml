canonical_text:
  quote: "“The Rock is not opened by children; it is opened by the swallows which
    fly in the air.”"
  summary: The passage closes a discussion of the Rock of Kntunjambili, which will
    not open to a human requester and is said to be opened by swallows. The narrator
    reports an uncertain interpretation that the Rock may refer to houses of white
