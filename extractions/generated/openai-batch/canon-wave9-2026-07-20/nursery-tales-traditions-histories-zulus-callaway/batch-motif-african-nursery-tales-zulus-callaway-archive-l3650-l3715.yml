canonical_text:
  quote: ''
  summary: A man repeatedly asks animals for the being who has gone away with his
    children. Leopards and an elephant identify the sought figure as Unomabunge by
    epithets and urge him forward with an oath-like formula. He reaches Unomabunge,
    who is crouched and as large as a mountain. Footnotes explain the oath “Mametu”
    and gloss one epithet as referring to long, broad feathers.
  language: English with Zulu names and phrases
