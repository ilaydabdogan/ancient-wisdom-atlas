canonical_text:
  quote: ''
  summary: A man fishing in the Tukela catches the Isitshakamana, a speaking animal
    that names his ancestors beyond his own knowledge and says it lives in the pool
    and fears the sun. After meeting its gaze, the man flees home and repeatedly asks
    to be hidden, but says the animal is still looking at and destroying him. Another
    man identifies the creature as one known for knowing the names of old people.
    The frightened man dies because he saw the Isitshakamana and heard it call ancestral
    names unknown to his family.
  language: English
  quote_policy: summarized
