  summary: In this fragment of a tale about two brothers, the younger reports that
    he hewed a tree and livestock came out, which an unnamed female figure declared
    to be his. The elder leaves the younger in water or at the foot of a precipice.
    The father, mother, and another helper arrange a rope rescue. After the younger
    is drawn up and returns home, the elder son has fled and his whereabouts are unknown.
