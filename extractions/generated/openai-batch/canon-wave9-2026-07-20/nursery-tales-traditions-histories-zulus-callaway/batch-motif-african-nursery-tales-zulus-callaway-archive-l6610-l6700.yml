canonical_text:
  quote: ''
  summary: Visitors identify the house where a sought girl or princess entered. The
    village chief angrily denies that he has a human daughter. The woman of the indicated
    house welcomes the visitors as the bridegroom’s people, reveals a boy and girl
    hidden in the house, and explains that pigeons produced them from a clot placed
    in a vessel after scarifying her loins. The father embraces the boy, and a young
    ox is slaughtered for the visitors; the bridegroom is accepted.
  language: English
  quote_policy: summarized
