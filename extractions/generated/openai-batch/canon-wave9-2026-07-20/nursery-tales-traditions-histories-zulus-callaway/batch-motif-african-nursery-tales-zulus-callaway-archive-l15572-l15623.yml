canonical_text:
  quote: ''
  summary: The passage lists abstinences from certain animal foods. Women, girls,
    young people, and men avoid particular flesh or entrails because of feared childbirth
    danger, feared resemblance in children, or feared bodily harm. Elephant may be
    eaten only under famine necessity. Old people are said to eat cattle entrails.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The flesh of a cow associated with childbirth danger is abstained from because
    women fear becoming like the cow in childbirth, being unable to give birth, and
    dying with the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls do not eat pig flesh; the pig is described as ugly, with an ugly mouth
    and long snout, and the stated fear is that pig resemblance will appear among
    their children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage generalizes that many abstinences are practiced through fear of
    bad resemblance.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: A report is mentioned that a person once gave birth to an elephant and a horse,
    but the passage explicitly says the truth of this is not known.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elephant and horse are described as abstained from because people think they
    will produce an evil resemblance if eaten.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The elephant is said to produce evil resemblance because parts of its body
    resemble those of a female, including breasts like those of a woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young people fear eating elephant, but in famine, when there is no food, it
    is eaten from necessity; young women are represented as preferring survival even
    if they give birth to an elephant.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men and young men do not eat cattle entrails because they fear that, if they
    do, an enemy will stab them in the bowels; old people eat the entrails.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The supplied passage ends with the beginning of another abstinence item but
    does not complete it.
  category: sequence
  evidence_refs:
  - ev:7
