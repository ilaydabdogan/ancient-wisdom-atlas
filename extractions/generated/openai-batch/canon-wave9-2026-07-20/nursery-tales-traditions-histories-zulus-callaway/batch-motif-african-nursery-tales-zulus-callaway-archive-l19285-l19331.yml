canonical_text:
  quote: ''
  summary: The passage describes the Abatwa as rock-dwelling people without fixed
    villages, living where they kill game and departing after consuming it. It recounts
    how a traveler who answered an Umutwa literally was killed, while later travelers
    used a magnifying greeting that pleased the Umutwa. It also says Abatwa ride together
    along a horse when journeying and may eat the horse if no game is found. A note
    links the wording to a Zulu salutation meaning “We saw you.”
