canonical_text:
  quote: ''
  summary: A boy reports that Ukcombekcantsini proposed fetching water and that they
    were seen by Abahhwebu. Later, a large party arrives with many cattle and formally
    asks the village head or king for his daughter in marriage. Villagers are astonished
    because they believe the village has only crows rather than human girls. Women
    jeer at the supposedly childless woman, but the men rebuke them. The village head
    says he has no daughter, only crows; the bridegroom's party insists they know
    there is a human damsel at the place and considers asking the earlier Abahhwebu
    witnesses.
  language: English
  quote_policy: summarized
