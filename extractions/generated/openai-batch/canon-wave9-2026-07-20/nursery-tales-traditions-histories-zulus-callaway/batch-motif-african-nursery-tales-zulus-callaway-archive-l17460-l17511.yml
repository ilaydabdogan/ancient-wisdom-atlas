canonical_text:
  quote: "“you still smell of fire”"
  summary: A brief notice says that a dead person who reaches the people living beneath
    is told to remain at a distance until the smell of fire has passed. The next tale
    begins with Uncama’s mealie garden being repeatedly damaged by a porcupine; he
    tracks it by the dew it brushes away, enters its hole with weapons, and comes
    to a pool. A footnote glosses the name as involving preparation or strengthening
    for a journey with an igudu or insangu-horn.
  language: English
