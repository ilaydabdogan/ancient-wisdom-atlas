canonical_text:
  quote: ''
  summary: 'The passage first gives editorial comparative examples of storm or flood
    caused by prayer or divine appeal. It then resumes the tale of Umkxakaza: heaven
    or lightning kills some Amadhlungundhlebe while sparing her; her enemies try to
    silence her by placing her on a red-hot sherd, but she addresses heaven and a
    storm kills their chief and many others. The remaining enemies decide to starve
    her. Umkxakaza grows thin, packs gifts into a basket, escapes, wanders hungry,
    and eventually reaches a town she recognizes as her father’s. She meets her mother,
    who speaks of the lost princess, the grieving father, the beast with whom the
    princess went, and cattle connected with bringing her home.'
  language: English with embedded Zulu song lines
  quote_policy: summarized
