  quote: "“for our mother eats men.”"
  summary: A fragment says daughters escaped because of the bitterness of flesh. Usikulumi,
    a king’s son, comes by day to court Uzembeni’s two daughters while Uzembeni is
    away hunting. Uzembeni, also called Long-toe, is identifiable by her very long
    toe, which raises dust before she appears. The daughters and Usikulumi love one
    another, but the daughters weep and warn him that their mother eats men and that
    they do not know where to hide him; one daughter points to an injury on her cheek
    as her mother’s doing.
