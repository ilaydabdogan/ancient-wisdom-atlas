canonical_text:
  quote: ''
  summary: Ulangalasenzantsi comes to a spring used by the village of Ulangalasenthla
    and encounters many children, including his daughter's child. He breaks the child's
    reed so that the child will summon its mother to the reed-bed. When the mother,
    identified as the queen and as Umalangalasenzantsi, arrives, Ulangalasenzantsi
    reveals himself as her father. She warns that Ulangalasenthla may kill him because
    he possesses her children. Ulangalasenzantsi tells her to conceal his identity
    and present him as a foreigner named Ubombi, a tall man taken into her protection
    and service.
  language: English
  quote_policy: summarized
