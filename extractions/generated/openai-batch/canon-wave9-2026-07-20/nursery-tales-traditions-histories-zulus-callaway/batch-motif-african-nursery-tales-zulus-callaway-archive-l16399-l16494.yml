canonical_text:
  quote: It was just as though she was asleep.
  summary: Usilwanekazana hears that a child of her family may become an umtakati
    and plans to kill an animal associated with Usilwane. While others are away, she
    gives Usilwane's dog hot milk-and-corn food, and it dies. Usilwane confronts her,
    accuses her of killing the dog on purpose, and stabs her. He gathers her blood,
    cleans and adorns her body so that it appears to be sleeping, then kills a sheep,
    mixes its blood with hers, cooks blood and viscera as food, and offers it to Untombi-yapansi
    when she arrives and asks why Usilwanekazana is sleeping.
  language: English
  quote_policy: quoted
