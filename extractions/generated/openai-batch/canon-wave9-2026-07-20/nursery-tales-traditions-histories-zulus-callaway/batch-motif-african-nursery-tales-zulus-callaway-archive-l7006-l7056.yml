  summary: A bride and her maids resume their own forms and visit the bridegroom’s
    kraal. While the villagers are away digging, the damsels become human again, ask
    the homebound old woman Uthlese not to report seeing them, and perform village
    domestic tasks including fetching water, preparing beer, smearing floors, and
    placing firewood.
