canonical_text:
  quote: ''
  summary: A king has several wives. The other wives bear children, but the chief
    wife remains pregnant for many years, although she is expected to bear the future
    sovereign. She eventually gives birth to a snake identified as a boa constrictor.
    The people remove it with a rope, cast it into a pool, and wash themselves. The
    king abandons the mother and moves away with his people. After years she follows
    him to his new settlement, is mocked for her misfortune, and is summoned by the
    king.
  language: English
  quote_policy: summarized
