canonical_text:
  quote: "“all was there inside the elephant”"
  summary: A woman seeking the elephant that has eaten her children is swallowed by
    it. Inside the elephant’s stomach she finds a populated landscape, her children,
    animals, and villages. She gives her children amasi, tells them the elephant can
    be eaten, kindles a fire, and roasts and eats its liver and flesh with them. Other
    people inside the elephant then also cut and eat.
