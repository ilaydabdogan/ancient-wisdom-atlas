canonical_text:
  quote: The chief of the damsels exercises great authority.
  summary: The passage describes a practice in which young women assemble by a river
    and appoint one damsel as their chief or girl-king. Her authority regulates relations
    with sweethearts, offences, fines, and firstfruits notice-giving. Some parents
    oppose a daughter becoming girl-king because of a reported belief that a girl-king’s
    children die, though the passage notes this is not known to be true.
  language: English
