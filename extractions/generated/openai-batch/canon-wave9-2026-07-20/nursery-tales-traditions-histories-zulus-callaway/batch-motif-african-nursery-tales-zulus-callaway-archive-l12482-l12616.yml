canonical_text:
  quote: ''
  summary: A boy associated with the named ox Ubongopa-kamagadhlela is among cattle
    thieves. He says they cannot stab him and repeatedly commands Ubongopa to go or
    stand still; the thieves and cattle obey the stopping and going. At the home village,
    his nocturnal cattle-driving is interpreted as a sign of maturity, and the people
    prepare food and beer but later worry about his absence. A thief reports to a
    chief that the stolen cattle are under magical power because a boy lies on a white
    ox; the chief plans to kill the ox as the means of the boy's magic, but the cattle
    halt before the village and the men say the boy will not let them proceed.
  language: English with Zulu names and formulae
  quote_policy: summarized
