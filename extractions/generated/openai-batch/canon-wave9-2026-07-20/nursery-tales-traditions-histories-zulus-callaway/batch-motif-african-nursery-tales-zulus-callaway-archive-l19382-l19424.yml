canonical_text:
  quote: ''
  summary: 'The passage first explains that the Abatwa are feared because their arrows
    are smeared with poison that causes severe bleeding and death. It then gives a
    fable explaining why the hyrax lacks a tail: when tails were distributed on a
    rainy day, the hyrax stayed in its hole and asked other animals to bring a tail
    for it; they returned with tails, but the hyrax remained tailless and cannot brush
    away flies.'
  language: English, with Zulu headings/titles
