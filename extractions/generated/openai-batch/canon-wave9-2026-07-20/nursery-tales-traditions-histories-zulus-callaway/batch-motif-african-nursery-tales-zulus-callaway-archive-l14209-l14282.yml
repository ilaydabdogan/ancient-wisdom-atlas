canonical_text:
  quote: ''
  summary: The passage describes an umgon^o puberty-ceremony setting for a girl of
    age, where young people gather, young men seek entry, and a girl-king may decide
    what present is sufficient to open the door. A woman sleeping in the hut and other
    damsels obstruct entry until presents are given. A separate girl-king festival
    is described as involving beer, assembled people, and a location near the river
    rather than at home; some observers treat it as play rather than true chiefly
    rule.
