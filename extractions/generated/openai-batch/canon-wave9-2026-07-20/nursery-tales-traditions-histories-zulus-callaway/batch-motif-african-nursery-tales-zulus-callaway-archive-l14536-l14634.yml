canonical_text:
  quote: ''
  summary: A customary account explains inheritance, authority, cattle, marriage payments,
    and succession in polygamic households. It distinguishes the chief house from
    secondary houses, describes when the iponsakubusa may inherit, explains how cattle
    given by fathers and cattle belonging to sons create different household sides,
    and gives an example involving Uzita, Ubabazeleni, and Unsukuzonke.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The iponsakubusa cannot inherit the chief house property while any boy of
    the chief-house side survives, but inherits the whole and becomes chief if no
    such boy survives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man's father's cattle and his own cattle are treated as distinct property,
    and fathers customarily give cattle to sons while living.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A son may marry two wives at the same time, one by his father's cattle and
    one by his own cattle, producing two household sides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child of the father's cattle claims high status in the village, while
    the son whose mother was taken with hereditary-estate cattle has authority in
    the grandfather's village if no other chief son exists.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person whose mother was taken by the father's cattle leaves the hereditary-estate
    village and forms a separate village, but may later take the chief place if no
    chief-house member remains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the chief house takes a wife with cattle belonging to a subordinate house,
    a female child born to that wife is counted as belonging to the chief house, and
    her dowry restores the cattle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A son of the chief house may take a wife with cattle received as dowry from
    such a female child and may place her in the kraal according to his preference
    because the village is his own.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the example, Uzita's chief wife gives birth to Ubabazeleni, who is described
    as Uzita's chief son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cattle belonging to Ubabazeleni's house take to wife the mother of Unsukuzonke,
    so that Unsukuzonke can inherit if Ubabazeleni and his offspring die, preventing
    dispute among Uzita's children.
  category: sequence
  evidence_refs:
  - ev:6
