canonical_text:
  quote: ''
  summary: A queen or mother looks into a large pot after a period of moons and finds
    hidden children grown and laughing. She conceals them, shuts the doorway at night,
    feeds them milk, and keeps them from being seen by hostile crows. The crows trouble
    her household by spilling water and scattering ashes. She laments being mocked,
    lacking recognized human children, and losing her husband’s regard. The children
    grow rapidly into a young man and a maiden. The passage also contains editorial
    notes on the timing of the vessel episode and comparative strange-birth examples.
  language: English translation with Zulu heading/fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After three moons without looking into a large pot, the woman looks in the
    fourth moon and finds the children large and laughing; she rejoices.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman goes to the garden, waits until sunset, and says she is jeered by
    other women who, in her speech, give birth to crows rather than human beings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At evening she shuts the doorway with a wicker door and a mat so that passers-by
    will see nothing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the village is quiet, she places the children on a mat and gives them
    milk; the boy drinks it, the little girl refuses it, and she returns them to their
    place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Both children grow quickly, crawl, and walk while remaining unseen because
    their mother conceals them and keeps them inside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother says the children must not go out because crows would see and kill
    them; the crows also vex her in the house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After fetching water and going out to dig, the mother returns to find water
    spilled through the house and ashes from the fireplace spread so that the house
    is white with ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother says this treatment occurs because she does not give birth even
    to crows, and says her husband no longer regards her as human because she has
    no child.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hidden children continue growing until the girl is a grown-up maiden and
    the boy is a young man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An editorial note explains the three moons by reference to a clot placed into
