canonical_text:
  quote: ''
  summary: Long-toe pursues Usikulumi and a damsel. They climb a lofty yellow-wood
    tree while dogs remain below. Long-toe arrives with an axe and tries to cut down
    the tree, but the dogs tear her body apart. The tree immediately restores itself,
    and Uzembeni comes back to life, her limbs rejoining as she rises and resumes
    cutting with the axe. A note compares the magical tree to another Zulu legend
    and to a Highland tale in which cut trees stand up again.
  language: English
