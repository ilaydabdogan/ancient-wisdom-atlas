canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which Ubabuze encounters hyenas, refuses their
    request, and the damsel’s brother kills the hyena chief, after which all the hyenas
    die. Ubabuze’s party reaches home, sacrifices oxen, celebrates the marriage, and
    the bride becomes queen. A new tale begins: during famine, a woman’s repeated
    attempts to cultivate a garden are undone by a wagtail, which claims the land
    for its father and commands the clods, seeds, handle, and pick to reverse, scatter,
    break, and fly away.'
  language: English
  quote_policy: summarized
