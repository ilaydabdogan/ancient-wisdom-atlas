  quote: ''
  summary: In the preface, Henry Callaway explains the lack of early Zulu-language
    study materials, describes learning by writing at the dictation of Zulu speakers,
    contrasts this with imperfect colonial contact speech, and outlines a process
    of recording tales, reading them back for correction, consulting other speakers,
    and accumulating materials from many informants.
