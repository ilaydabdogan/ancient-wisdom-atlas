canonical_text:
  quote: ''
  summary: A man takes an uvati, a fire-making apparatus, and flees. Young izingogo
    discover blood and their grandmother dead, then alert older izingogo, who pursue
    the man by following the blood trail. The man, carrying a liver, uses the uvati
    to set long grass on fire near a steep hill, causing the pursuing izingogo to
    retreat; the visible passage ends during a renewed pursuit.
  language: English
  quote_policy: summarized
