canonical_text:
  quote: ''
  summary: Umkatshana goes hunting with dogs, follows a rheebuck into a hole, and
    reaches people who dwell beneath. He sees cattle and milking there, meets his
    own friends, is told to go home, and later returns to his community, which had
    thought him dead. The narrator localizes the descent place by several place names.
