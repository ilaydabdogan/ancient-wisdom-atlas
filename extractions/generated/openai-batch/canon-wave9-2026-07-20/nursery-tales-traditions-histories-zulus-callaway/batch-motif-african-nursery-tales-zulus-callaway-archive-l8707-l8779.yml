canonical_text:
  quote: ''
  summary: An English passage explains the Amazimu as cannibals who were originally
    men. In a time of famine they began to eat men, separated from other people, lived
    in mountains, dens, and caves, and hunted humans as game. It describes their method
    of decoying a lone man by apparent kindness before seizing him. An editorial footnote
    compares this decoying method to that of Thugs.
  language: English
  quote_policy: summarized
