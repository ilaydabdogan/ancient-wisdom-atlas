canonical_text:
  quote: ''
  summary: The passage describes repeated night visits by thieves who enter the village
    or kraal and beat the cattle with sticks, but the cattle do not rise. An unseen
    person associated with the ox Ubongopa-kamagadhlela commands the cattle to go
    graze and return, and eats food brought to him while on the ox. On later nights
    the thieves bring multiple bundles of sticks, but the sticks break and the cattle
    still do not get up.
