  quote: "“She poured sesamum on the ground, and went on quickly.”"
  summary: A girl fleeing cannibals repeatedly scatters sesamum so that they stop
    to pick it up. Tired, she climbs a high tree. The cannibals rest below, then discover
    her when water from her vessel leaks down. They try repeatedly to cut down the
    tree, but each time it settles back and becomes firm. Her brother dreams that
    she is being eaten by cannibals near a known place and sets out with his dogs
    toward that place.
