canonical_text:
  quote: ''
  summary: The Amadhlungundhlebe gather at the chief’s cave, discover Umkxakaza inside,
    question whether she is human or beast, and inspect her. After an ox is slaughtered
    she comes out with her belongings. They consider her beautiful except for her
    two legs, later bring a revealing veil, dance for her, and take her to their chief’s
    village. The chief loves her and calls her his child. She becomes extremely fat;
    the people, described as man-eaters, urge that she be eaten and her fat melted.
    After prolonged pressure the chief agrees, and preparations are made with firewood,
    a pit, fire, and a heated sherd. As she is brought to the gateway, the heading
    states that her incantations raise a destructive tempest, and she begins a song
    addressed to heaven.
  language: English translation with Zulu names and terms
  quote_policy: summarized
