canonical_text:
  quote: ''
  summary: The passage first recounts relatives who inquire about an uncle's wife
    who had left pregnant and is said to have miscarried; they later see a girl resembling
    their family and say they know she is theirs through sympathy by the navel, especially
    after she names Umagushu as her father at marriage. A second adjacent account
    describes a great fiery serpent associated with water, rainbow notions, and the
    arrival of the Dutch; the serpent comes from a pool, is killed by Amangwane men,
    and afterward the pool dries up. The text also includes editorial notes comparing
    the water-snake belief to a Bechuana superstition and explaining the 'soft stone'
    found in the serpent.
  language: English
  quote_policy: summarized
