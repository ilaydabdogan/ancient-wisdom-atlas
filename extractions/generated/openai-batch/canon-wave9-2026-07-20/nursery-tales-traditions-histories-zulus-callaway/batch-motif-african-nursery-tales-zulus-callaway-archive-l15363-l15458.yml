canonical_text:
  quote: ''
  summary: A king and others question plural speakers about their origin. They say
    they came from a pool connected with a snake or boa whose father was Unthlangunthlangu
    and whose mother was the daughter of So-and-so. The mother had a very long pregnancy
    and gave birth once, to a boa, which was commanded to be cast into a pool. Unthlatu-yesiziba
    says he heard these events, went to the snake's mouth, removed its skin, and ten
    persons came out from inside in order of birth.
  language: English
  quote_policy: summarized
