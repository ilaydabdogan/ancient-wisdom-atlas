canonical_text:
  quote: ''
  summary: Unanana-bosele learns that an elephant has eaten her children, though their
    death is uncertain. In the morning she prepares food, takes a knife, and sets
    out to find the elephant. Antelope, leopard, and other animals direct her toward
    a place marked by very high trees and white stones. She finds the elephant there,
    but the elephant repeats the directions as if sending her onward.
