canonical_text:
  quote: ''
  summary: A woman tells her husband that a speaking bird appears while she digs,
    claims the land as its father's, and undoes the field work. The husband hides,
    hears the bird, chases and catches it. The bird produces whey and curds, and the
    husband eats alone. He hides the bird in a sealed pot and secretly eats amasi
    at night while his wife and children sleep. One child sees this and tells the
    other children.
  language: English
  quote_policy: summarized
