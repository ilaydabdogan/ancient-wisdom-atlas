canonical_text:
  quote: ''
  summary: The Imbulu persuades the bride to descend, takes her dress and veil, mounts
    her ox, and refuses to dismount. The bride and bridesmaids depart, transform into
    birds, and remain in the forest. When the bridegroom and his men return, the bridegroom
    notices that the apparent bride is smaller, no longer shines, and is without the
    bridesmaids; he feels weak and suspects she is not his bride. Editorial notes
    explain the bridal veil and compare the bridegroom’s unease and related lost-bride
    patterns with other tales.
  language: English
  quote_policy: summarized
