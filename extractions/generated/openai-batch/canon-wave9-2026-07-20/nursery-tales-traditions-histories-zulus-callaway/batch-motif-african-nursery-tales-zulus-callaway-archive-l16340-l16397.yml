  summary: The passage introduces a tale about a chief with three children, names
    the children, notes the affection between the two elder siblings, and tells how
    the eldest son returns from hunting with a leopard that he calls his dog. He orders
    it fed cold milk-and-corn porridge. The leopard grows, and the people fear that
    it will devour them and suspect the son of becoming an umtakati, glossed as a
    wizard or secret poisoner.
