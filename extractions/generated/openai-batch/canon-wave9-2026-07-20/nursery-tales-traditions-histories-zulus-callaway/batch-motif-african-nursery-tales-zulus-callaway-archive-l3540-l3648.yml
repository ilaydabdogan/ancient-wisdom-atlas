canonical_text:
  quote: ''
  summary: The marriage companions petition the Isikgukgumadevu for their belongings
    and blame Untombinde for bringing them to the dangerous pool. Untombinde refuses
    to petition the monster because she is the king’s child, and the monster seizes
    her and puts her into the pool. The other girls return home and report this. The
    king sends young troops against the monster, but it emerges from the water, enormous
    as a mountain, and swallows the army, the king’s village, people, dogs, cattle,
    and two beloved twins. A father who escaped arms himself to pursue the monster
    and asks buffaloes where it has gone.
  language: English
  quote_policy: summarized
