canonical_text:
  quote: ''
  summary: Umamba travels with a wedding party carrying cattle for a marriage settlement.
    He has Unthlamvu-yetusi carry a pot of fat, then lags behind with her on the high
    land. He asks her to anoint him and remove his skin because grass hurts him as
    he moves on his belly; after the skin comes off he walks, then puts the skin back
    on near the others. At the bride’s home, people flee in fear, calling him a snake,
    while the damsels identify the snake as Unthlamvu-yetusi’s bridegroom. Cattle
    are killed for the party, the meat is eaten, and the bridegroom’s party returns.
  language: English
  quote_policy: summarized
