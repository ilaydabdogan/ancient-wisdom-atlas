canonical_text:
  quote: ''
  summary: Opponents repeatedly try and fail to kill Ubongopa-kamagadhlela with assagais.
    The boy uses one assagai to kill the opposing chief and causes groups who died
    to rise again, while the chief remains dead. The defeated people submit to him.
    He sends messengers to his father, sends a distinctive bullock as proof that he
    is alive, and returns home with people and cattle. His father summons the nation,
    beer is prepared, a damsel is sought for his arrival, and his parents rejoice
    when he reaches home.
  language: English
  quote_policy: summarized
