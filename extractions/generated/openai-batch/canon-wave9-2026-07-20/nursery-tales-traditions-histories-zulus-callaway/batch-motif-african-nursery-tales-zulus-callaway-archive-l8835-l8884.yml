canonical_text:
  quote: ''
  summary: The appendix discusses reported forms and explanations of cannibalism.
    It states that local opinion connected cannibalism with recent famine, compares
    Marimo/Bechuana, Zulu-legend, and reported Natal cannibals as speaking of humans
    as game, lists several alleged African practices, cites Herodotus on the Padseans,
    considers a possible relation to sacrifice, reports a Zulu-Kafir distinction between
    famine necessity and the cannibal proper, and warns that accounts are often exaggerated
    and that Zulu legendary cannibals are magnified as giants and magicians.
  language: English
  quote_policy: summarized
