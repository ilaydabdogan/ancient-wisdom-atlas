canonical_text:
  quote: ''
  summary: The preface characterizes Uthlakanyana as a very small but cunning and
    wise man who is underestimated and despised, and it associates him by name and
    analogy with Ukcajana, a clever weasel-like animal. The passage describes the
    animal stealing bait from traps, frightening a man off a path, killing and eating
    snakes, and bringing bad luck when caught in a trap. Editorial notes discuss respectful
    names for bait animals and compare euphemistic naming practices with northern
    Europe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uthlakanyana is described as very cunning and very small, about the size of
    a weasel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people among whom Uthlakanyana lived despised him and thought a child
    could not deceive them, but he deceived people because they did not recognize
    him as a deceiver.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage explains Uthlakanyana's smallness by saying he had not grown because
    he was overburdened by cunning and wisdom, becoming an undersized and contemptible
    dwarf.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Uthlakanyana is also called Ukcajana-bogconono and Mathlab’indoda-i-s’-emi;
    Ukcajana is explained as a little red animal with a black-tipped tail.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ukcajana or weasel is said to be cleverer than other animals and to take
    the bait mouse from a wild-cat trap before the cat arrives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An editorial note says the bait mouse is called by respectful or euphemistic
    names, and that using the ordinary contemptuous name would prevent the trap from
    catching anything.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A weasel may frighten a man on a path by moving aside only a little and growling,
    causing the man to go around and later feel ashamed when he realizes the animal
    was only a weasel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The weasel is described as being at great enmity with snakes and as eating
    them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The weasel watches an imamba's hole, enters while the snake is away, waits
