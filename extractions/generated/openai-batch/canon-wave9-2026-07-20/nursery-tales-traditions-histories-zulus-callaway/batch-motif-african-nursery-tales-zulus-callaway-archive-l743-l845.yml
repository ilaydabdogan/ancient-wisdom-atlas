  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a weasel is caught in a trap, trappers expect bad luck and believe the
    weasel stands in the way of later success.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Editorial notes compare weasel cleverness to an English proverb and compare
