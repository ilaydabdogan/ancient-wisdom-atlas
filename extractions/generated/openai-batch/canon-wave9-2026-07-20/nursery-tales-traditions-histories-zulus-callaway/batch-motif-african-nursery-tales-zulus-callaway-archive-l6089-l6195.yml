canonical_text:
  quote: The wives of a certain king give birth to crows. His queen has no child.
  summary: A king's wives bear crow children, while his queen remains childless and
    is mocked. While weeping in a garden, the queen is approached by two speaking
    pigeons, who ask about her sorrow and discuss what she would give them if they
    gave her power to have a child. She offers possessions and food items, including
    amabele and amadumbi.
  language: English
  quote_policy: quoted
