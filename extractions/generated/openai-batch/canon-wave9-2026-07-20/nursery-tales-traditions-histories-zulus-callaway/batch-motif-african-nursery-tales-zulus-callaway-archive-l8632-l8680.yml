  summary: A boy hunter named IJmbadhlanyana kills a very small bird. Cannibals surround
    and greet him; one cannibal takes and eats the bird. IJmbadhlanyana makes himself
    short and enters the cannibal's nostrils. The cannibal sneezes and asks him to
    come out, while IJmbadhlanyana speaks from inside and accuses the cannibal of
    eating his bird and intending to eat him too.
