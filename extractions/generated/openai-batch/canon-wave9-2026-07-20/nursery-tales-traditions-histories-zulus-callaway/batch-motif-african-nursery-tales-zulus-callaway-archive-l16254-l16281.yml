canonical_text:
  quote: ''
  summary: Utshintsha recounts watching in a garden after rain when a rainbow descended
    into a river, came out, and entered the garden. He fled because the rainbow came
    near, dazzled his eyes with red color, and frightened him. He says people call
    the rainbow disease and warn that if it rests on a person something will happen.
    After the encounter his body became swollen; a note says he had a scaly eruption
    over the whole body.
