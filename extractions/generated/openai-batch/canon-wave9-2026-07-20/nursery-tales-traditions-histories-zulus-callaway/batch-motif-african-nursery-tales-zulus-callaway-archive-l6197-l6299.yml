canonical_text:
  quote: ''
  summary: In an episode of a Zulu tale, a woman identified in a heading as the queen
    feeds two speaking pigeons castor-oil seeds. The pigeons instruct her to fetch
    a horn and lancet, turn her back to them, and be scarified or cupped at the loins.
    A pigeon collects clotted blood in a horn and tells her to place it in a large
    vessel until two moons have passed; after the third new moon appears, she finds
    two children in the vessel.
