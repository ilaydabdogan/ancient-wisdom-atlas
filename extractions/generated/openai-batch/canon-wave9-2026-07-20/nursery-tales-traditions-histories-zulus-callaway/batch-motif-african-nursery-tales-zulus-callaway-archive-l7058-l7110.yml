canonical_text:
  quote: ''
  summary: A group asks Uthlese what she will say about work done in the village;
    she says she will claim to have done it. The group goes to open country and again
    becomes birds. When the villagers return, women wonder who smeared floors, fetched
    water and firewood, crushed mealies for beer, and heated water. Uthlese claims
    she performed the tasks herself. The next morning, damsels identified by Uthlese
    as her father’s daughters-in-law or a wedding party come carrying firewood and
    perform further beer-making and household tasks throughout the kraal.
  language: English
  quote_policy: summarized
