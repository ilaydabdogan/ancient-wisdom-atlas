canonical_text:
  quote: ''
  summary: Two sisters and their female attendants go out to gather ubenthle. The
    sister who is the child of the great house says their father loves the child of
    the inferior house instead of her. On the return, the loved child remembers that
    she left her ubenthle behind. The attendants refuse to accompany her back because
    her sister had instructed them to refuse. She returns alone and encounters a cannibal
    sitting in a house where her ubenthle is.
  language: English
