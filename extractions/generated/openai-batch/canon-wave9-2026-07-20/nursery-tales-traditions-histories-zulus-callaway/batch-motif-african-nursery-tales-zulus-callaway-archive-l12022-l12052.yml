canonical_text:
  quote: ''
  summary: A guilty old man is killed. Beer is made and the king dances, while his
    sister questions his earlier order that Umk&akaza be sent away. Umk&akaza-wakoginggwayo
    returns to her father's place with cattle marking her as the bridegroom's chosen
    bride. The bridegroom's people arrive, cattle are killed for them, dowry is paid,
    and she marries the king, who loves her; she becomes his wife and reigns prosperously
    with him.
