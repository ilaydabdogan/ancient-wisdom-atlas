canonical_text:
  quote: ''
  summary: Umkxakaza is found missing after a disturbance at home. Her mother identifies
    the beast Usilosimapundu as the one who has taken her, apparently in retaliation
    for cattle taken from him. Armed men pursue and attack the beast but their spears
    fail. The family briefly reunites with Umkxakaza, but the beast carries her away
    again. Her kin follow until only her mother remains; the mother later bids her
    farewell. Usilosimapundu takes Umkxakaza far away to a furnished cave near an
    old village and explains that by taking her he has repaid her father for taking
    his cattle and has deprived him of future bridewealth and contact with his daughter.
  language: English translation with Zulu names
  quote_policy: summarized
