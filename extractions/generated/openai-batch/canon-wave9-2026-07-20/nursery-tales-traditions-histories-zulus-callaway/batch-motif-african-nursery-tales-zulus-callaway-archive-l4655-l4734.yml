canonical_text:
  quote: ''
  summary: A cannibal takes home his bag, which contains biting or venomous animals.
    His children and chief wife are bitten when sent to fetch it. He has himself shut
    inside the house, empties the bag, is attacked by the animals, and is later found
    reduced to bones. He runs to a mud-hole, falls in, and bees enter his bones as
    he becomes a tree. At home, the king calls for Usitungusobenthle, finds that the
    girls at the puberty-ceremony hut have substituted another girl decorated with
    branches, and cuts off the heads of all the girls.
  language: English
  quote_policy: summarized
