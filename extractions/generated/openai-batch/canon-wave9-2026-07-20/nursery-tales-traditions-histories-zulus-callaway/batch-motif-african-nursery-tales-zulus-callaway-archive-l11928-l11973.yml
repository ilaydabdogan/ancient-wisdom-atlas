canonical_text:
  quote: "“Open, my head, that my things may come out.”"
  summary: A woman called Ukandakulu, identified by the heading as Umkxakaza, is publicly
    feared because of her head and excluded from a dance. Later, while bathing with
    a damsel, she commands her head to open, brings out her things, and her head becomes
    small again. The damsel recognizes her in astonishment, embraces her, and they
    laugh and roll in the mud.
