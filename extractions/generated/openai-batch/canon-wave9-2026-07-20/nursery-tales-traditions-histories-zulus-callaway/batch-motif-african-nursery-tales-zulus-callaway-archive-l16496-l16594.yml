canonical_text:
  quote: ''
  summary: Untombi-yapansi is warned by a noisy fly that Usilwane has killed Usilwanekazana
    and that the food is connected with the killing. She verifies blood beneath the
    covering, flees, is pursued by Usilwane with an assagai, asks the earth to open,
    descends into it, escapes pursuit, travels underground overnight, emerges near
    a chief's garden, and gives an alarm about coming mourning.
  language: English
  quote_policy: summarized
