  quote: ''
  summary: The passage explains a Zulu tale and proverb about the hyrax having no
    tail because he sent someone else to fetch it. The saying is used to rebuke people
    who avoid effort, especially in bad weather, and ask others to bring things for
    them. The narrator adds that the hyrax is said to fear cloudy weather and not
    go out unless there is sunshine. A note compares this tale generally with other
    animal fables explaining taillessness.
