canonical_text:
  quote: ''
  summary: Ubabuze, a king's son, takes a road his father warned against and is repeatedly
    confronted by hyenas. He gives them his cattle and then his men until he is alone.
    A striped mouse tells him to skin it; the mouse skin carries him up into the clouds
    and away from the hyenas, then sets him down at the kraal of the princess he loves.
    After a year, a marriage party is assembled. On the return journey, Ubabuze receives
    cattle, restores the mouse's skin to its flesh, kills an ox for it, and the mouse
    eats the offering.
  language: English
  quote_policy: summarized
