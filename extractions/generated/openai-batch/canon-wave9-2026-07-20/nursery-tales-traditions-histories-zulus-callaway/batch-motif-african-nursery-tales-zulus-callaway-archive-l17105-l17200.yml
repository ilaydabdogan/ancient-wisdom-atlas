canonical_text:
  quote: ''
  summary: Udalana examines Untombi-yapansi, tells the chief that Untombi-yapansi
    secretly bathes, emerges glistening with a brass rod, opens the earth to bring
    out her father’s cattle, men, food, and ornaments, and sings with men, cattle,
    trees, and everything. The chief attempts to watch, but Untombi-yapansi notices
    signs of concealment, refuses to bathe, and the chief sees nothing.
  language: English
  quote_policy: summarized
