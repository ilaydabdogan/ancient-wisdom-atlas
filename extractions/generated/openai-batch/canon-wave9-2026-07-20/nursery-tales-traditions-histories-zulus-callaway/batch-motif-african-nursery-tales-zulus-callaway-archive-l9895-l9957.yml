canonical_text:
  quote: "“The Izingogo are fabulous animals, — degenerated men...”"
  summary: The passage describes the Izingogo as degenerated men who live apart from
    human habitations, become baboon-like, go on all fours with tails, speak like
    humans, and eat human flesh. A translated account says they lived in the open
    country, accepted a man who acted like them, while children rejected him as not
    an ingogo. Children used leaping at a river bank as a test, and the Izingogo were
    said to be light because they ate red earth. A Zulu sentence and English translation
    repeat that the Izingogo went on all fours, had tails, and spoke like people.
    The editor compares them to Swift’s Yahoos and links the account to a native legend
    of baboon origins.
  language: English with embedded Zulu
  quote_policy: quoted
