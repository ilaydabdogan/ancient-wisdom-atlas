canonical_text:
  quote: ''
  summary: Usitungusobenthle and her children are on the far side of the sea when
    the army of the Amajubatente arrives. She pretends to help the army cross with
    a long rope, repeatedly cuts the rope while groups are in mid-sea, and the sea
    carries them away until only a few remain and turn back. She returns to her people's
    country, finds it empty because the Isikgukgumadevu has eaten the people, mistakes
    the monster for a newly appeared mountain, then approaches it with a knife and
    cuts open its belly. A heading in the excerpt states that the Isikgukgumadevu
    is ripped open and that animals and all things are renewed.
  language: English
  quote_policy: summarized
