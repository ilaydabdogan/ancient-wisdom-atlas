canonical_text:
  quote: ''
  summary: Uthlakanyana tells his mother to cook trapped birds in a pot sealed with
    cowdung and not to uncover them while he sleeps with other boys. The other boys
    resist sharing a bed with him, calling him wise, verbally powerful, not like the
    king's son, and a prodigy who has already deceived their fathers over meat. At
    cockcrow he returns home while his mother sleeps, secretly eats the birds' bodies,
    leaves the heads, places cowdung in the pot, seals it again, and then re-enters
    as if just arriving. He asks for the birds and claims they may have turned into
    dung after sunrise; the pot appears to contain dung with the heads left.
  language: English
  quote_policy: summarized
