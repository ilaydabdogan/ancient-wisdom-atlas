canonical_text:
  quote: ''
  summary: 'The passage introduces the Zulu nursery tales as a collected oral corpus,
    notes women as their main custodians, and lists recurring tale elements: Uthlakanyana
    as a small cunning magical figure, gigantic cannibals, the ogress Uzwanide who
    rises from repeated deaths, talking animals and animal forms of magical powers,
    a contest between good and malicious genii, a Magical Tree, the voice-opened Rock
    of Two-holes, huge monsters, a River Tortoise mistaken for an island, and a very
    long Fiery Serpent. The editor also makes explicit comparisons with Tom Thumb/Giant
    Killer, Heitsi Eibip, and “Open Sesame.”'
  language: English
  quote_policy: summarized
