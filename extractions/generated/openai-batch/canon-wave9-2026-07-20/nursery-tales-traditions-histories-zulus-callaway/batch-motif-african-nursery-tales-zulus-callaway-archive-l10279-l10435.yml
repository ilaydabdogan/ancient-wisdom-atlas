canonical_text:
  quote: ''
  summary: An army finds a vast herd of varied cattle in a valley overseen by the
    huge beast Usilosimapundu, whose body is described like terrain with hills, rivers,
    forests, precipices, and countries with different seasons. Two tall Imidoni trees
    serve as the beast's officers. The soldiers drive away the cattle after insulting
    the beast, and the herd raises dust that darkens the sky. The cattle are brought
    to Umkxakaza/Umkrakaza, who then enters an umgongo with damsels. The passage ends
    with communal slaughter and rejoicing, while the cattle of Usilosimapundu are
    not slaughtered.
  language: English
  quote_policy: summarized
