canonical_text:
  quote: ''
  summary: Uthlakanyana puts the cannibal's mother into a covered boiling vessel and
    refuses to release her until she is silent. He then wears her garments, lies in
    her place, imitates her voice, and tells her cannibal children to eat the supposed
    game. The cannibal's boy notices that the limbs resemble their mother's, but is
    rebuked. Uthlakanyana leaves, reveals from a distance that they have been eating
    their mother, and flees. At a swollen river he changes into a weeding-stick; a
    cannibal throws the stick across, unknowingly carrying him over the river, and
    Uthlakanyana reveals the trick from the far bank.
  language: English
  quote_policy: summarized
literal_observations:
