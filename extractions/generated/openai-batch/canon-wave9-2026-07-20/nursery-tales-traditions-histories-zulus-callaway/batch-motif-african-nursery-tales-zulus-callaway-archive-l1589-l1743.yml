- id: obs:2
  text: The woman cries out to Uthlakanyana to take her out, saying she is being scalded
    to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Uthlakanyana refuses to release her and argues that a person who can still
    say they are scalding or being done is not yet fully scalded or done.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The woman is boiled and becomes silent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Uthlakanyana says the boiled woman will be eaten by her children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Uthlakanyana takes the garments of the cannibal's mother, puts them all on,
    becomes big by means of the garments, and lies down where she had lain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the cannibals call 'Mother,' Uthlakanyana answers in a little voice like
    the mother and tells them to eat the game.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The cannibals draw out and eat an arm and a leg; the cannibal's boy says the
    hands and foot are like his mother's.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder cannibal rejects the boy's statements and beats him after the second
    resemblance is named.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Uthlakanyana asks the cannibals to move away from the door, leaves the house,
    removes the garments, and runs away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: From a safe distance Uthlakanyana shouts that the cannibals have been eating
    their mother, and the cannibals pursue him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: At a swollen river, Uthlakanyana changes himself into a weeding-stick on the
    bank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A cannibal finds the footprints and the weeding-stick, assumes Uthlakanyana
