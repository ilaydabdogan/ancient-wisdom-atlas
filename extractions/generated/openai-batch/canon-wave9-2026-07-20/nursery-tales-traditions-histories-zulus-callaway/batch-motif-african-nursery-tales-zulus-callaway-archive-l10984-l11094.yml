canonical_text:
  quote: ''
  summary: After Usilosimapundu leaves, Umkxakaza remains alone in a cave with sugarcane
    and maize, prepares and eats selected middle portions, and discards the rest.
    A strange leaping being comes from the high land, sits by a lone tree, plucks
    tobacco, notices footprints, enters the cave, and flees when Umkxakaza thrusts
    out her hand. The next morning two such beings come, again pluck tobacco, speak
    about the footprints, enter the cave, and flee when she thrusts out both hands.
    They report to their chief that something is in the chief's cave. Editorial notes
    compare these beings with half-men or one-legged/part-bodied beings from other
    traditions.
  language: English
  quote_policy: summarized
