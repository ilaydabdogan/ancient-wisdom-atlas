canonical_text:
  quote: ''
  summary: Unsimba is afraid and angry when he sees that Umamba is a human being.
    The people wonder that Umamba is now a man and question him. Umamba's father postpones
    the dance until the next day so he can look at him. Umamba's mother rejoices because
    her child has taken a wife. The next morning the people dance and rejoice, while
    Unsimba remains troubled. Umamba builds his own village, attracts people to live
    with him, sews on a headring, marries many wives, and lives happily and prosperously.
  language: English
