  summary: The preface explains how language exercises became a collection useful
    for studying Zulu customs, histories, thought, religion, traditions, myths, nursery
    tales, and proverbs. The author describes the decision to publish the materials
    with Zulu and English side by side, states his translation principles, comments
    on handling frank speech about sex, and begins a discussion of writing and spelling
    conventions.
