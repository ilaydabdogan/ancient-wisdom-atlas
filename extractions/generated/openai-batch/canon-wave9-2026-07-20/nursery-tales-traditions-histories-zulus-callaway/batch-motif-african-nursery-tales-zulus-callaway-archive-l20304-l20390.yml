  quote: This, then, is the laughing of fire.
  summary: The excerpt gives a key to several riddles. A supernumerary finger is described
    as disrupting pairing and counting. Fire is concealed under the word “man” and
    explained as laughing while its sparks and flames cause losses and mourning. “Iso”
    is glossed as the eye. A stone is explained as “paying a debt” through useful
    work such as stopping a gateway or grinding.
