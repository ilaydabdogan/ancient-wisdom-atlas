canonical_text:
  quote: ''
  summary: A man following a porcupine travels through a dark underground hole, crosses
    water, reaches signs of an underground village, and retreats in fear. He returns
    home, where his wife and community had treated him as dead and disposed of his
    belongings. He later explains that he came from the people who live underground.
    A narrator says the tale made children fear ant-bear holes. An editorial note
    cites a separate legend of S6nuttaro traveling underground to the land of Nagas
    and returning to the upper world.
  language: English
  quote_policy: summarized
