canonical_text:
  quote: ''
  summary: An old woman, hungry during the digging season, repeatedly enters her son-in-law's
    house and eats the household amasi. The son-in-law discovers the theft and sends
    her to fetch water from a place where no frog cries. She travels from pool to
    pool, pouring out water whenever a frog answers. At a large pool with paths and
    shady trees, no frog first answers; she fills the vessel, drinks excessively because
    the water is delicious, and becomes unable to depart as the passage breaks off.
  language: English with Zulu title/fragments
  quote_policy: summarized
