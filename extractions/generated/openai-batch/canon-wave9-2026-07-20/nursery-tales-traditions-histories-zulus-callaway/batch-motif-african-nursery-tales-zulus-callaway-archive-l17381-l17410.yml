canonical_text:
  quote: ''
  summary: The appendix notes Zulu tale allusions to persons descending into water
    and returning unharmed, traditions of people emerging from below or from water,
    beliefs in heavenly people and a king of heaven who makes weather, and tales of
    men descending to lower regions and returning to report what they saw. It also
    states that underground inhabitants are imagined as departed dead living a material
    life, and adds authorial comparisons to other literary traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several Zulu tales are said to allude to persons descending into water, remaining
    there, and returning, with water not destructive to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a tradition about the origin of the Amasikakana, the tribe descended from
    Uzimase is said to have come up from below and first revealed itself to some women
    while still in the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another tradition mentions a heaven-descended unkulunkulu, heavenly men, and
    a king of heaven regarded as creator of lightning, thunder, and rain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two following tales are described as accounts of men who descended to lower
    regions and returned to relate what they had seen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says traditions imply man-like inhabitants in earth, heaven, water,
    and underground.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The underground inhabitants are described as abapansi, subterraneans or underground
    people, supposed to be the departed dead and to live a material life with ordinary
    cares and labors.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The appendix author compares these beliefs speculatively with other countries'
    theologies and with literary tales such as Jullanar of the Sea and Undine.
  category: other
  evidence_refs:
  - ev:6
