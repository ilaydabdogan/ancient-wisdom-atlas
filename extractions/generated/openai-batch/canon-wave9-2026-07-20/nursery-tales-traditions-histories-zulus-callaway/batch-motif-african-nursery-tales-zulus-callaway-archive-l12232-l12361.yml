canonical_text:
  quote: ''
  summary: A king with many wives orders that a child born to one wife be placed on
    a named ox, Ubongopa-kamagadhlela. The child lives on the ox, sleeps and eats
    there, and commands the ox and cattle with repeated formulaic speech to wake,
    graze, return, and enter the pen. He grows into a young man without knowing fire,
    wearing garments, or touching the ground. At night thieves from another tribe
    try to steal the king’s cattle, but the cattle do not rise and the thieves’ sticks
    break.
  language: English with Zulu fragments
  quote_policy: summarized
