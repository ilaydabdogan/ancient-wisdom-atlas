canonical_text:
  quote: ''
  summary: Uthlakanyana collects biting and poisonous animals in a bag, secretly blocks
    the cannibal inside his house by narrowing the doorway, tricks the cannibal into
    opening the bag, and the released animals sting, bite, and kill the cannibal.
    Uthlakanyana then mocks the dead cannibal, removes the body, and takes possession
    of the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uthlakanyana takes a bag, departs, and puts a snake, a wasp, a scorpion, and
    other biting or deadly poisonous animals into it until the bag is full.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uthlakanyana returns to the cannibal's house and says the doorway should be
    contracted and made small; the cannibal says he does not like a narrow doorway.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Uthlakanyana says he is going to his mother's kraal to fetch his cousin, then
    takes the bag with him and hides it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night Uthlakanyana comes to the cannibal's house with rods, enters and
    leaves, and builds up the doorway so that it is too small for a child to go out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bag is inside the house when the cannibal finds the door hard to open
    in the morning.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Uthlakanyana tells the cannibal to untie the bag, shake it, and bring it to
    the little hole, while saying he will enlarge the doorway.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the cannibal opens the bag, a snake bites his hand, a bee stings his
    eye, a wasp stings his cheek, and a scorpion also stings him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The cannibal asks Uthlakanyana for help and says he is being eaten up in his
    own house and can no longer see.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Uthlakanyana says he does not know how the animals got into his bag.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The animals come out of the bag, eat the cannibal, and he dies of poison after
    crying out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the cannibal dies, Uthlakanyana opens the door, speaks to the silent
    cannibal, enters, removes the body, takes possession of the house, sleeps, and
    is happy.
  category: sequence
  evidence_refs:
  - ev:7
