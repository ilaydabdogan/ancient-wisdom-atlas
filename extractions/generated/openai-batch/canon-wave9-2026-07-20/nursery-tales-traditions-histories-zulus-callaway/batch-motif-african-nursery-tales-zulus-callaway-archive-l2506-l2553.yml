canonical_text:
  quote: ''
  summary: Uthlakanyana conceals the trouble that caused his return and presents his
    return as motivated by love for his mother. The next day he attends a marriage-dance,
    finds and digs up an edible tuber called umdiandiane, and asks his mother to cook
    it while he goes to milk. His mother cooks, tastes, and eats all of it; when he
    later asks for it, she admits she has eaten it. A heading states that she redeems
    this fault by a milk-pail.
  language: English
  quote_policy: summarized
