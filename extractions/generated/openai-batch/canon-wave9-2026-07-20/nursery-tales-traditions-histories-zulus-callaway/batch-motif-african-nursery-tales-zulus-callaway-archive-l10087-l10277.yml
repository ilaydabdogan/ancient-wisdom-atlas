canonical_text:
  quote: ''
  summary: The passage contains two narrative units. In the first, Umasendeni receives
    a stranger during famine; the stranger later kills, boils, and eats Umasendeni’s
    mother, and Umasendeni buries her remains in vessels. In the second, a king’s
    daughter Umkxakaza-wakoginggwayo comes of age and refuses successive cattle offerings
    for her return until the cattle darken the sun, prompting escalating cattle collection
    and raids.
  language: English
  quote_policy: summarized
