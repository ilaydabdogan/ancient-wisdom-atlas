  summary: A speaker says he did not see or bury dead brethren during a difficult
    journey among enemies. The group later remains, builds houses, rejoices, and becomes
    a great people again. A note describes the legend as old and of uncertain derivation,
    and compares it with Moses and Pharaoh, another tale in which the sea divides
    for Usitungusobenthle, and Hottentot fables of Heitsi Eibip in which water divides
    for escape and destroys the pursuing enemy.
