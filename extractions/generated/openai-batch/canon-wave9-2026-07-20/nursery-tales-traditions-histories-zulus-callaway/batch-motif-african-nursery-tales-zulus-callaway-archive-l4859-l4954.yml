canonical_text:
  quote: "“Sea, sea, sea, divide! I am Usitungusobenthle.”"
  summary: Three children deliberately feign injury or illness so their father sends
    them home from a hunting party. Their mother, identified as the queen and as Usitungusobenthle,
    ties up her luggage and flees with them. An old woman raises an alarm that the
    queen has gone away with the king’s children. Several men who report hearing this
    are killed as if they are prophesying evil, until a fourth persuades the king
    to return and verify the alarm. The king then assembles a large army to pursue
    and fetch Usitungusobenthle. She reaches the sea, commands it to divide, and the
    sea divides; the heading states that she and the children pass through.
  language: English
