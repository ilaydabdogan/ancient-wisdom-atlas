  summary: 'The passage introduces the Amavukutu legend with an editorial comparison
    to a birth tale and to a Hottentot fable of resuscitation through a heart placed
    in milk. The narrative then begins in a primordial setting: rock pigeons come
    to the house of a married childless woman, scatter ashes in her house, and then
    six pigeons repeat and question the utterance “Vukutu.” A footnote explains the
    phrase rendered “source of being.”'
