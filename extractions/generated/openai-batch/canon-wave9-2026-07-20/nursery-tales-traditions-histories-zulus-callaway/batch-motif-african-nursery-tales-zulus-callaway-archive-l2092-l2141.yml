canonical_text:
  quote: ''
  summary: Uthlakanyana has the cannibal work on the outside of the house while he
    pushes the thatching-needle from inside. He fastens the cannibal’s long hair tightly
    into the thatch, then goes to the fire, takes the boiled cow udder, cuts it with
    an assagai, and eats. The cannibal tries to come down but cannot, and Uthlakanyana
    says he has thatched well and will eat in peace. A note compares this episode
    to a Basuto tale in which a hare fastens a lion’s tail into a hut.
  language: English
