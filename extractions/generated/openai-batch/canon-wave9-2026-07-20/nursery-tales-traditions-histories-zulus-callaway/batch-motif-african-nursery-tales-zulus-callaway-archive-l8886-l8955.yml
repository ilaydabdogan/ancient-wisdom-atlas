canonical_text:
  quote: "“long-haired Amazimu of South Africa”"
  summary: The appendix discusses long-haired cannibals in Zulu legend, compares them
    cautiously with Highland Gruagachs, and proposes that many cannibal traditions
    arise from fear of foreign oppressors, slave-hunters, or socially opposed groups.
    It also cites examples from Western Africa, Natal nursery warnings, ancient and
    European labels for savages, and an Arabian Nights passage about fear of being
    roasted and eaten.
  language: English
  quote_policy: quoted
