canonical_text:
  quote: "“The eyes of the people were dazzled by the brightness of his body.”"
  summary: Unthlatu recounts jealousy against him because he was said to be king.
    He sends Untombinde to call his mother, who recognizes him as her lost child and
    arranges for beer to be brewed to assemble the nation. The people gather, Unthlatu
    appears with a dazzling body, a festival is held, gifts of animal tails are given,
    and Unthlatu is restored as king. Editorial notes explain the attempted killing
    by obstructing breathing and compare the story to other tales of a persecuted
    younger brother who returns in greatness.
  language: English
  quote_policy: quoted
