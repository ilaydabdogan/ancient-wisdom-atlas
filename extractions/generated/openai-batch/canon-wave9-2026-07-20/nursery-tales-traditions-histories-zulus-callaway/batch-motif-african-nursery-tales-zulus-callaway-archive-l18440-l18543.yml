canonical_text:
  quote: ''
  summary: A pregnant young daughter is sent away because her pregnancy is feared
    to contain a beast. She wanders and gives birth in another village, but the child
    is a human boy. Searchers sent by her father find her, and she returns home. The
    king publicly rejoices, declares the boy to be the child of his daughter only
    and not of a male, and orders praise for him. The boy grows into a renowned healer
    called the Wise Son of the King, surpassing other doctors and traveling among
    nations to heal diseases.
  language: English
  quote_policy: summarized
