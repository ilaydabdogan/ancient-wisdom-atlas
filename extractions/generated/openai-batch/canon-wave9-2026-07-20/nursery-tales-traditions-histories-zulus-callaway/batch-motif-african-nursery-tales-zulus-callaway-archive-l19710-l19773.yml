canonical_text:
  quote: Famine takes away wisdom.
  summary: A hungry man searches for bread he had previously thrown away. He uses
    memory, an ant-heap landmark, and an arm gesture to retrace the throw, but cannot
    find the bread. He misses the time for digging roots, returns home empty and faint,
    and later tells the story after the famine, saying that famine removes wisdom
    and increased his want.
