canonical_text:
  quote: "“This rock has eyes.”"
  summary: A person in a pool is visible by firelight and says he is held by the foot
    before sinking; villagers conclude that a tortoise has devoured him and send an
    ox to report to Ungonyama. Later boys playing by the Umtshezi River mistake a
    tortoise for a beautiful rock and begin making cattle-pens on it. A little boy
    notices eyes in the rock, is contradicted, and pokes the eye with a stick. On
    another day the tortoise overturns with the boys and goes with them into the river;
    one boy reaches home crying and reports what happened.
  language: English
  quote_policy: quoted
