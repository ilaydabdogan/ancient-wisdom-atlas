canonical_text:
  quote: ''
  summary: Two brothers go hunting and encounter a long row of pots. The younger brother
    turns the pots over, and a little old woman emerges from the last one. She invites
    the brothers, leads them to a place with a tree that contains cattle, and instructs
    the younger brother to hew it; livestock comes out. The brothers return with the
    animals, pass through a scorched waterless country, and reach a precipice where
    the elder asks to be lowered by rope to drink.
