canonical_text:
  quote: ''
  summary: Usilosimapundu tells Umkxakaza-wakoginggwayo to turn, laugh, and come down.
    She is troubled because she is leaving her parents and princely position. After
    she comes down and mounts Usilosimapundu, he runs off with her. Her younger sister
    at the river and her mother both feel her departure and hurry back; both later
    see something disappearing behind a hill without recognizing it. Editorial notes
    explain this as sympathy or presentiment and compare such impressions with wider
    legendary and contemporary beliefs.
  language: English
  quote_policy: summarized
