canonical_text:
  quote: ''
  summary: The passage describes food abstinences for young people. A young person
    is not to eat the lower lip of a bullock, because the child may develop a trembling
    lip like the bullock’s moving lower lip, and a father may be blamed for such a
    child’s condition. Young people also abstain from the bullock paunch portion called
    umtala, described as smooth and hard, because their children may be born without
    hair. A further incomplete statement says young people do not eat cow flesh until
    it is eviscerated, fearing an effect on wounds received in war. A footnote discusses
    pronunciation and derivation of related terms.
  language: English
