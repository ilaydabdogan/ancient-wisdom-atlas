canonical_text:
  quote: ''
  summary: In the evening, after Umamba’s sister has entered and gone out, Umamba
    tells Unthlamvu-yetusi to close the doorway. He asks her to anoint him with fat,
    saying that moving on his belly pains him, that anointing makes his body soft,
    and that he devours no one. Unthlamvu-yetusi is reluctant, but pours soft fat
    into her hand and anoints him. She feels the snake’s cold body and is afraid.
    Afterward, Umamba asks her to hold him tightly and stretch him because his body
    is contracted, again assuring her that he will not harm her.
  language: English
  quote_policy: summarized
