canonical_text:
  quote: ''
  summary: A cannibal takes Usitungusobenthle in a bag after her companions return
    home and report her maturity. Her brothers recognize her voice when the cannibal
    beats the bag, bring him to her home, and her mother and father also hear the
    child speak from inside. Her father sends the cannibal to fetch water in a secretly
    pierced calabash, rescues the girl, and replaces her in the bag with scorpions,
    snakes, and dogs.
  language: English
  quote_policy: summarized
