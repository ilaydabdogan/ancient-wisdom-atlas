canonical_text:
  quote: ''
  summary: During Ukakaka's return journey with a bride, birds repeatedly jeer that
    the king's child is going off with an animal or Imbulu. At home the king and the
    assembled men reject the bride's appearance. Ukakaka explains that he once saw
    the beautiful damsel, but after his party killed an animal they had been told
    not to kill, the damsel appeared as she now does and her attendants were gone.
    Ukakaka refuses to call her his wife, and people say she is not like a human being.
  language: English
  quote_policy: summarized
