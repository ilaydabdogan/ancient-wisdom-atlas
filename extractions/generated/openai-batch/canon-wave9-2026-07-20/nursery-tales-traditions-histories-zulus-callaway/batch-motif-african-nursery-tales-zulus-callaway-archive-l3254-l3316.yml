canonical_text:
  quote: "“We thought you were no longer in the land of the living. We thought you
    were dead.”"
  summary: In the main tale fragment, dogs dismember a female figure, take the pieces
    to a river rock, grind them to powder, and later cast the ground flesh into water.
    Usikulumi and a damsel descend from a tree and flee to Usikulumi’s people. Uzembeni
    dies; Usikulumi returns home, where his people make a funeral lamentation, kill
    oxen, rejoice, and say they thought he was dead. Editorial notes compare a tree-related
    episode with the Polynesian Rata story and explain funeral lamentation for a returned
    person presumed dead, with Polynesian examples.
  language: English
  quote_policy: quoted
