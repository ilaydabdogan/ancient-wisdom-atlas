canonical_text:
  quote: ''
  summary: The passage describes Usilosimapundu swallowing everything taken from a
    village without chewing. Animate leaves drain two beer pots, bring the pots to
    him, and he swallows them. Usilosimapundu summons Umkxakaza; she uncovers a little
    pot, takes out brass ornaments and brass-decorated belongings, dresses herself,
    goes outside, and is told by him to turn her back to him.
