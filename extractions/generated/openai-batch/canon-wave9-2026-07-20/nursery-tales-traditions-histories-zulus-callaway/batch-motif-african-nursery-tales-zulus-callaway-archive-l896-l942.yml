canonical_text:
  quote: "“the child spoke in the womb”"
  summary: A pregnant woman’s unborn child speaks from within the womb, asks to be
    born immediately, and says his father’s cattle are being consumed. The father
    gathers people to hear the prodigy; the child repeats the request and says he
    will prepare flesh for himself. The people wonder what will happen. An editorial
    footnote compares the wonder to a Christian hagiographic claim about St. Benedict
    singing hymns in his mother’s womb.
