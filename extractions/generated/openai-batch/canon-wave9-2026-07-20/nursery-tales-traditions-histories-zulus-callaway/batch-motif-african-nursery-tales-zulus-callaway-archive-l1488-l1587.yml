canonical_text:
  quote: ''
  summary: 'Uthlakanyana, caught by a cannibal, persuades him that he should be cooked
    by the cannibal''s mother while the cannibal is absent. At the cannibal''s home,
    after the cannibal and his brother leave, Uthlakanyana tricks the mother into
    a game of boiling each other: he is briefly put in the pot while the water is
    not yet hot, then he increases the fire until the water boils and tells the mother
    to prepare to enter the pot.'
  language: English
  quote_policy: summarized
