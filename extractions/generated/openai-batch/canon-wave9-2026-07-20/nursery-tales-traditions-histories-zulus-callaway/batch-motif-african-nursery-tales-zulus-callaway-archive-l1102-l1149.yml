canonical_text:
  quote: ''
  summary: In this excerpt, Uthlakanyana diverts meat to his own house, leaves bloody
    objects as apparent evidence that the meat was properly hung up, and answers villagers
    by pointing to those objects. His mother praises him as a man born that day. The
    women of the kraal express doubt that such a newborn is a real man, and an editorial
    footnote links this doubt to testing whether he is a real man or a fairy substitute.
  language: English
  quote_policy: summarized
