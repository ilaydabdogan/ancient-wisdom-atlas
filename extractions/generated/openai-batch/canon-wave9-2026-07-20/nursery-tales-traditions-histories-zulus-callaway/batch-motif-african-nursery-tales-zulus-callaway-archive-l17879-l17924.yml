canonical_text:
  quote: ''
  summary: 'After Umamba''s sister goes out, Umamba asks Unthlamvu-yetusi to perform
    tasks for him: closing the doorway, spreading the mat, and anointing him with
    fat. He explains that he has no hands and that his usual lad is absent. Unthlamvu-yetusi
    fears touching a snake but spends the night there. In the morning the people marvel
    at her courage, and Umamba''s mother brings her food while reflecting that, if
    her son were truly human, he would have married the damsel.'
  language: English
  quote_policy: summarized
