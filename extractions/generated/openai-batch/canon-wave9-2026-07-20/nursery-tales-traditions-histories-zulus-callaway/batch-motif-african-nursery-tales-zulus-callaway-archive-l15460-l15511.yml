canonical_text:
  quote: ''
  summary: In a fragmentary passage, participants identify one another and a mother.
    The mother's house is said to be at the gateway because she gave birth to a snake.
    The father orders cattle collected and gives oxen to Untlilatu-yesiziba and to
    his younger sister. The mother rejoices, and Untlilatu-yesiziba refuses the father's
    invitation to go to the house at the head of the village, choosing instead to
    enter his mother's house.
