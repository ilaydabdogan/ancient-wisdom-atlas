canonical_text:
  quote: "“mother of all animals”"
  summary: The passage explains Ugungqu-kubantwana as the mother and chief of all
    animals, describes animals drinking first from a special pool compared to milk,
    describes her body as containing country, rivers, and forests, and explains her
    name through the loud rattling sound heard when she moved. Editorial notes compare
    the tale with other South African legends, especially a Basuto tale involving
    a fabulous animal, a woman who drinks a lake dry, animal punishment, and a trickster
    hare.
  language: English
  quote_policy: quoted
