canonical_text:
  quote: "“Forsooth these birds speak, and no one understands them.”"
  summary: A crow’s warning that no one will return is believed by Umpeza and some
    others but rejected by many who go seeking spoil; the expedition is killed by
    the Zulus, with only Usichile escaping. The appended note compares bird and animal
    speech, human understanding of birds, serpent-linked acquisition of such understanding,
    and speaking birds as helpers, warners, informants, or judges across several cited
    traditions.
  language: English
