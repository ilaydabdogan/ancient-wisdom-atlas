canonical_text:
  quote: ''
  summary: An incapacitated old woman sits in the shade associated with Ugungqu-kubantwana.
    Several animals question her and warn that she will soon see Ugungqu-kubantwana.
    At sunset a huge animal arrives, drinks deeply from a pool, and orders the old
    woman to be eaten. Hyenas agree, but oribes delay the killing. At night four oribes
    carry the old woman away and one takes her water-vessel.
  language: English
