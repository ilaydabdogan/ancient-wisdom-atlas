  summary: The passage describes repeated visits by many damsels while the household
    is absent. They prepare malt, mash, and beer, share beer with Uthlese, and rely
    on her secrecy. After leaving, they turn into birds. The household women notice
    the work has been done and suspect something wonderful. Ukakaka questions Uthlese,
    who reveals that many damsels come at noon, including one especially beautiful,
    glistening figure; Ukakaka plans to come and see them without warning them.
