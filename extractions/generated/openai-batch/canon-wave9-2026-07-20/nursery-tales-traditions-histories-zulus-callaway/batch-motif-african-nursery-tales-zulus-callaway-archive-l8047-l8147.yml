  summary: A girl is kept inside a word-opened rock dwelling by a cannibal owner.
    After she roasts meat, other cannibals smell it. One gains entry by imitating
    the owner's voice. The girl escapes, and pursuing cannibals are diverted by sesame
    scattered on the path.
