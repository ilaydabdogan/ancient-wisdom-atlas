canonical_text:
  quote: ''
  summary: A group gets out, fires, and meets eight Dutchmen, who ask whether they
    are safe. The group says they are safe and recounts that one horse hid, another
    helped it, and they shot a snake. At the place where the snake died a fire was
    kindled. The others go to inspect the place, see smoke, find the great snake with
    fat running out, describe it as man-sized in thickness and very long, and propose
    fetching a wagon to carry it away.
  language: English
  quote_policy: summarized
