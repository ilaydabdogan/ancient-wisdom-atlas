canonical_text:
  quote: She gave birth to us only ; she did not nourish us ; we ate earth and grew.
  summary: A group of children ride oxen, strike an ox named Umpengempe so that it
    cries, and repeatedly declare that they are seeking their mother, who bore them
    but did not nourish them. They say they ate earth and grew. They arrive at their
    maternal grandmother's village, where an old woman connects their claim with her
    child having given birth to a beast that was cast out. They are asked to dismount
    but refuse; cattle are fetched and two oxen are selected while they are asked
    whose children they are.
  language: English
  quote_policy: quoted
