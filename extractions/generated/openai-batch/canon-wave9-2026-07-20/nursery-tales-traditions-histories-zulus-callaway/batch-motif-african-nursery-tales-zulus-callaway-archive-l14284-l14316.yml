canonical_text:
  quote: The women who are taken to wife by the cattle of the eldest son’s house...
    become the heritage of the eldest son.
  summary: 'The passage explains inheritance rules in a polygamic household: the eldest
    son or heir is treated as the next chief after the father; women married through
    cattle belonging to the eldest son''s house become part of that house''s hereditary
    estate. A note distinguishes the inherited estate of the eldest son''s house from
    property derived personally through the mother, and describes native entailed
    property as invested in wives, girls, and cattle.'
  language: English with Zulu terms
  quote_policy: quoted
