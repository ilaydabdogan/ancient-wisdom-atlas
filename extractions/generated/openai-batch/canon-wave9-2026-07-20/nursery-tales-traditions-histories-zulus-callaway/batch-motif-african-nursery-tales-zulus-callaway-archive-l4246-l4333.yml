  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is an authorial comparative catalogue rather than a single Zulu narrative
    episode.
- id: motif:2
  label: river or aquatic monster threatening humans
  taxonomy_refs: []
  basis: The Isikgukgumadevu is a river monster, and other cited monsters attack,
    swallow, or threaten people and canoes in water settings.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The examples come from multiple traditions and are not all Zulu.
- id: motif:3
  label: many-headed monster or dragon
  taxonomy_refs: []
  basis: The passage names a many-headed monster in Usikulumi, the Hydra, a three-headed
    loch monster, and a seven-headed dragon.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage groups these examples comparatively; only one is from the
    Zulu tale referenced.
- id: motif:4
  label: hero or protagonist defeats a monster
  taxonomy_refs: []
  basis: The passage repeatedly describes monsters slain, killed, or overcome by Hercules,
