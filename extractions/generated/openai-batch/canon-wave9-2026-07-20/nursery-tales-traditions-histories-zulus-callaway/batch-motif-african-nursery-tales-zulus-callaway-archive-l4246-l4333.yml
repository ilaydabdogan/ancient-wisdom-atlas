comparison_claims:
- id: claim:1
  claim: The passage directly compares the Zulu Isikgukgumadevu with the Kammapa of
    Basuto legends as corresponding monsters.
  claim_level: same_motif
  target: Kammapa of the Basuto legends
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states correspondence but does not provide details of the
    Kammapa story here.
- id: claim:2
  claim: The many-headed monster in Usikulumi is placed alongside Hydra and other
    monster-slaying examples as part of a broad many-headed or destructive monster
    pattern.
  claim_level: visual_similarity
  target: Hydra, Minotaur, Neptune's sea monster, and related classical comparanda
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says the comparison is a reminder; it does not claim historical
    contact or shared origin.
- id: claim:3
  claim: The Neapolitan dragon is compared with the Isikgukgumadevu in terms of overwhelming
    destructive power, described as making nothing of an army.
  claim_level: same_function
  target: Monstrous dragon in the Neapolitan tale of Minuccio
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: Only one shared functional trait is specified; other narrative roles
    are not compared in detail.
- id: claim:4
  claim: The Highland three-headed loch monster and the German seven-headed dragon
    are comparable to the many-headed monster pattern listed earlier in the passage.
  claim_level: same_motif
  target: Three-headed loch monster and seven-headed dragon
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only short summaries and does not analyze structural
    correspondences beyond heads, monstrosity, and defeat.
- id: claim:5
  claim: The Polynesian cuttle-fish and Mishe-Nahma share the function of an aquatic
    monster threatening or swallowing a canoe with people aboard.
  claim_level: same_function
  target: Polynesian monstrous cuttle-fish and American Indian Mishe-Nahma
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The traditions are listed side by side in a catalogue, with no claim
    of historical relationship.
- id: claim:6
  claim: The Hari fish episode fits a flood-preservation pattern because a deity in
    fish form promises to save Satyavrata during a deluge.
  claim_level: same_motif
  target: flood_and_renewal motif family
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents this as a summarized Hindu tradition inside a
    monster catalogue, not as a full flood narrative.
- id: claim:7
  claim: Jormungand and Cadmus's serpent are comparable as enormous serpents whose
    size produces extraordinary physical effects.
  claim_level: visual_similarity
  target: Norse Midgard Serpent and Greek serpent of Cadmus
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: The passage lists both serpents but does not explicitly compare them
    beyond including them in the same monster catalogue.
- id: claim:8
  claim: The passage treats monster traditions across named cultures as recurrent
    examples of imagined beings that aid or destroy, rather than as requiring a single
    fossil-bone explanation.
  claim_level: independent_recurrence
  target: world-wide monster traditions as explained by imagination and personified
    natural phenomena
  evidence_refs:
  - ev:1
  - ev:10
  counter_evidence_refs: []
