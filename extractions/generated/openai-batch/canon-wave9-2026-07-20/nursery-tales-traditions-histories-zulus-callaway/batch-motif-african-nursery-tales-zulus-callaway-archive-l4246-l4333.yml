canonical_text:
  quote: "“The Isikgukgumadevu is the great monster of these Tales. It is a river
    monster, capable of living on the land.”"
  summary: The appendix surveys monsters and giants in Zulu legends and in other traditions.
    It identifies the Isikgukgumadevu as the principal Zulu monster, compares it and
    other many-headed or gigantic beings with monsters from Basuto, Greek, European,
    Polynesian, American Indian, Hindu, Muslim, Ojibwa, Norse, and other narrative
    traditions, and closes with an authorial explanation of monster traditions as
    products of imagination and personified natural phenomena.
  language: English
  quote_policy: quoted
