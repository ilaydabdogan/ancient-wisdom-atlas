canonical_text:
  quote: ''
  summary: The passage explains inheritance and property relations in polygamic households.
    Cattle left after dowry payments can become the property of a wife’s house. A
    wife whose house is set apart is called a hill, and her son is called iponsakubusa,
    “almost a chief,” because he is not chief of the father’s chief house but may
    be head and heir in his mother’s secondary great house. The passage describes
    disputes over cattle used for marriages, claims by chief wives and heirs, repayment
    of cattle to preserve house boundaries, and the enlargement of a village side
    through wives assigned to it.
  language: English
  quote_policy: summarized
