canonical_text:
  quote: ''
  summary: A brother and sister use a rope to draw a cannibal upward, let him fall,
    then raise him into their house. They roast and eat meat in his presence, deny
    him food, stop him from taking ox-stomach contents at night, and continue eating
    while giving him nothing. A note compares the rope trick to a jackal-and-lion
    episode in Bleek's Hottentot Fables.
  language: English
  quote_policy: summarized
