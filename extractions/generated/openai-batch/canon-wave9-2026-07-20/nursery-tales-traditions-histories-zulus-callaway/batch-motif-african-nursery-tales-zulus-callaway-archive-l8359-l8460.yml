- id: obs:3
  text: When the cannibal is midway between above and below, the brother proposes
    letting him fall, while the sister proposes raising him so they can harass him
    because cannibals have harassed them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother lets go of the cannibal; the cannibal falls, complains of injured
