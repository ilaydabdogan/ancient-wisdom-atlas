canonical_text:
  quote: ''
  summary: Ulangalasenzantsi speaks with an unnamed woman about food, concealment,
    rest, and plans to collect the children of their nation and kill her husband.
    On the third day he appears openly before Ulangalasenthla and says he has come
    to fetch the children, who are described as captives of Ulangalasenthla’s army.
    Ulangalasenthla refuses, claims the children, summons soldiers through a boy,
    and orders them to kill Ulangalasenzantsi. A footnote explains an idiom about
    never laying hand on children in a dispute over them.
  language: English
  quote_policy: summarized
