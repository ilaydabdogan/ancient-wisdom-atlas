  summary: While hunting, a man sees cannibals beneath a tree trying to cut it down
    because his sister is on top. He conceals his distress, distracts them with snuff,
    sets his dogs on them, and kills them. He calls his sister down; they return to
    their mother, who holds a feast and slaughters many oxen in rejoicing.
