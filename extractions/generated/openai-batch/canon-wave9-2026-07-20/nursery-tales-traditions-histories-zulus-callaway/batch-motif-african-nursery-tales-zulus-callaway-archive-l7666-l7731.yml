canonical_text:
  quote: ''
  summary: The passage describes the Inthlamvu, or honey-bird, as a bird whose cry
    calls people to places with honey-bees. It is treated with high regard, and a
    person who throws a stone at it or calls it a liar for not finding bees is condemned.
    A hungry walker encounters the bird, answers and praises it, follows it through
    bushes and underwood, and relies on its calls and returns as it guides him toward
    the bees.
  language: English
