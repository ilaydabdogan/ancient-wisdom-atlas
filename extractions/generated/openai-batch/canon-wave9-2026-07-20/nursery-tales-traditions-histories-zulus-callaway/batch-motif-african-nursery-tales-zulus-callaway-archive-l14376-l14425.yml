  quote: ''
  summary: The passage explains how a husband in a polygamic household may acquire
    a cow independently of the chief wife’s house and the hereditary estate, by separate
    cultivation or a separate tobacco field. Such a cow can be used to marry another
    wife who is not attached to the chief wife’s house. A note distinguishes the hereditary
    estate and the chief wife’s house as property-holding units with special claims,
    with the eldest son as heir to property derived from both.
