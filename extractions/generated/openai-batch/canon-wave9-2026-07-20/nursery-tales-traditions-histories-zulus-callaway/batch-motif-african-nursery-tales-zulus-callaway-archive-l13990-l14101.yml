canonical_text:
  quote: ''
  summary: Unkosi-yasentlila arrives with cattle and asks Unkosi-yasenzansi for his
    daughter Umdhlubu in marriage. The father assents, marriage goods and attendants
    are provided, Umdhlubu is brought to Unkosi-yasentlila’s home, public wedding
    dances and rites occur, cattle are slaughtered, gifts are sent to Umdhlubu’s mother,
    and a town is built for Umdhlubu as queen.
  language: English
