canonical_text:
  quote: ''
  summary: The imbulu claims to be Untombi-yapansi and explains away the missing brass-like
    body. The sister notices another person at the doorway, whom the imbulu presents
    as a thing found at the river and names Umsila-wezinja. The household debates
    how to feed this person; Untombi-yapansi spills the amasi/whey after placing her
    hands around the house pillar. In the morning she is sent with Udalana to watch
    the garden against birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sister asks the claimant who she is, and the imbulu answers that she is
    the child of the house, Untombi-yapansi, saying illness caused the loss of the
    former brass-like body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sister remarks on a person at the doorway; the imbulu says it is a mere
    thing encountered at the river, going on foot.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister offers food; the imbulu eats porridge, and the brother-in-law insists
    that the person outside be brought into the house to eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The imbulu gives the doorway person the name Umsila-wezinja, and the sister
    calls her by that name to eat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the sister gives the doorway person whey/amasi, the imbulu objects to
    using a children's vessel and suggests pouring it on the ground, while the brother-in-law
    says to give it into her hands.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Untombi-yapansi places her hands around the house pillar; when she separates
    them, the amasi is spilled, and she explains that her hands had been on each side
    of the pillar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An editorial note says Untombi-yapansi acts this way because it was not proper
    for her to eat milk belonging to her brother-in-law, whereas the imbulu disregards
    such customs.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sister says birds trouble her garden and that she lacks someone to watch
    it; the imbulu proposes that Umsila-wezinja go, and Untombi-yapansi goes with
    Udalana.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An editorial note reports another version in which groundnuts are given, one
    is taken, and all the rest disappear from the vessel.
  category: other
  evidence_refs:
  - ev:7
