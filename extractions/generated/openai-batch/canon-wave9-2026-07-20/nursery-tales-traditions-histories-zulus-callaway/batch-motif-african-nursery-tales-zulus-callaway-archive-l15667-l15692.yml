canonical_text:
  quote: ''
  summary: Under the heading “Sympathy by the Navel,” and attributed to Umpengula
    Mbanda, the passage describes feared effects from laughing at ugly or deformed
    beings. Women laugh at a pig’s ugly head, but old people warn them not to laugh
    lest they give birth to something resembling it. A deformed person is likewise
    not laughed at, because a woman who does so is said to call down an omen on herself.
    The passage concludes that many such things bring about resembling outcomes and
    are abstained from. The opening is fragmentary and mentions an unspecified feared
    thing associated with a man’s death.
