canonical_text:
  quote: ''
  summary: A bride’s family completes her marriage and puberty-related customs with
    slaughtered goats, dancing, and a cattle feast. Her father urges that she leave
    with the bridegroom’s party and that food be set aside for the journey. Her mother
    warns the travelers not to pursue a green animal that will appear on the high
    land. The next morning the bridal party sets out, sees the animal, and the soldiers
    pursue it despite the bride’s warning. The bridegroom goes to fetch them, leaving
    the bride with her attendants. While she waits and longs for water, an Imbulu
    arrives and greets the women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father says the child’s customs should be fully carried out and that the
    bridegroom’s party should take her on their departure because crows may kill her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Goats are killed for the bride because no such killing had been done at her
    puberty; she dances for the bridegroom’s party, and cattle are killed and eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father tells the travelers to set aside a leg for the bridegroom and bride
    to eat on the journey; they say they wish to leave in the morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother warns the bridegroom’s party that a green animal will appear in
    the path on the high land and tells them not to pursue it, saying the marriage
    will be fortunate if it is left alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note identifies the warned green animal as possibly a Jnsimango, a large
    baboon with grey-green coloring and valuable skin used for ornaments of chiefs
    and great men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the following morning the party sets out; the bridegroom and bride are
    placed on two large oxen, with soldiers going before and damsels from the bride’s
    father’s tribe accompanying them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the party reaches the high land and sees the warned animal, all the soldiers
    run after it; the bride asks the bridegroom to forbid them, but he dismisses her
    concern.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bride, bridegroom, and bride’s damsels wait a long time; at noon the bridegroom
    leaves to bring back the men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After more waiting, the bride says she is tired and longs for water; an Imbulu
    comes and greets the women as beautiful princesses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note describes the Imbulu as a large land lizard, mostly forest-dwelling,
    harmless, fond of milk, and sometimes blamed by boys for stolen cow’s milk.
  category: attribute
  evidence_refs:
  - ev:9
