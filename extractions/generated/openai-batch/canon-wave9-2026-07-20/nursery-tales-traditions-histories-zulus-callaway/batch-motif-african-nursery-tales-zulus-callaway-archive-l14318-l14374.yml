canonical_text:
  quote: "“women taken to wife by these cattle belong to the house whence that cow
    came, the son’s house.”"
  summary: 'The passage explains inheritance rules in polygamic households: wives
    acquired through cattle belonging to a particular house belong to that house,
    and property and succession follow the house from which the bridewealth came.
    A footnote applies the rule comparatively to the household of Jacob, Leah, Rachel,
    Bilhah, and Zilpah.'
  language: English with Zulu terms
  quote_policy: quoted
