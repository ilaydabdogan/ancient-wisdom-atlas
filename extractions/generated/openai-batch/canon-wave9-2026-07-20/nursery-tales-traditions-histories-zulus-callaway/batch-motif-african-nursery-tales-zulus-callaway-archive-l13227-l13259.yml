canonical_text:
  quote: ''
  summary: A chant addresses Ubongopa-kamagadhlela and commands going in; the cattle
    enter an enclosure. Another village is built. A male speaker says he does not
    love the damsel because she goes on the ground; the damsel departs. He says he
    will live on Ubongopa-kamagadhlela's back until death, and others tell him to
    stay there. He herds his people's cattle and continues enchantments practiced
    since childhood.
  language: Zulu and English
