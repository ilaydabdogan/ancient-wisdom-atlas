canonical_text:
  quote: ''
  summary: When rain is falling, the appearance of the rainbow, called the queen’s
    bow or rod, is said to signal that the sky will clear. The people also say the
    bow is an umnyama that dwells in a pool, is like a sheep, drinks where it touches
    the earth, and may catch and eat ordinary people who enter a large pool. A man
    being prepared as a diviner can enter such a pool without being eaten; the umnyama
    covers him with coloured clay, and he emerges with snakes entwined around his
    body. The passage also contains an editorial footnote comparing exaggerated large-creature
    descriptions with a West Highland eel anecdote and a Mussulman legend of Moses’
    serpent.
  language: English with Zulu headings and source text
  quote_policy: summarized
