  quote: ''
  summary: The passage gives explanatory keys to several riddles. It explains that
    a riddle poser deliberately misleads guessers by calling thumbs “cattle-pens”
    in a louse-and-ox riddle; that a pillar is described as a man because it stands
    and upholds a house; that an ear is not moved by wind although other things move;
    and that teeth are called men forming a row like men prepared for a wedding-dance.
