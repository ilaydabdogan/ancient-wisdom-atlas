canonical_text:
  quote: It is a prodigy.
  summary: A group of young girls go to their river pool to bathe and sport. One young
    child emerges and calls attention to the sudden swelling of her breasts. The maidens
    bring her to the king, her father. The king summons men and old men to consider
    whether the event is disease or something unprecedented. The council says they
    have never known such a thing and calls it a prodigy. The king orders that the
    child depart from her home.
