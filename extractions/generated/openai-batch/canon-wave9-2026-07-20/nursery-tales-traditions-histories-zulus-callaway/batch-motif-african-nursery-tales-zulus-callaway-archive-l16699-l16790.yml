canonical_text:
  quote: ''
  summary: Untombi-yapansi is sent to her sister, instructed to ride her ox and not
    look back when she hears the burning village. At a river an imbulu appears, persuades
    her to dismount and hand over her ox and things, refuses to return them, wins
    a wet-feet crossing advantage, gives her the name Umsila-wezinja, and claims to
    be Untombi-yapansi. They arrive at the sister's village, where the imbulu enters
    the house and makes Untombi-yapansi hold the ox.
  language: English
  quote_policy: summarized
