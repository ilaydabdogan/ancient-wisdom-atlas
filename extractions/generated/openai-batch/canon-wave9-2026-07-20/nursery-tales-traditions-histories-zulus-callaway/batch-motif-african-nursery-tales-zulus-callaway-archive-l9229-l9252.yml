  quote: she could not eat the milk of her son-in-law.
  summary: An old woman lives with her daughter at her son-in-law's kraal during a
    famine. The son-in-law offers her amasi and then a cow or milk, but she refuses
    because she cannot eat her son-in-law's milk. An explanatory note states that
    parents-in-law may not eat their son-in-law's milk and describes related milk
    restrictions.
