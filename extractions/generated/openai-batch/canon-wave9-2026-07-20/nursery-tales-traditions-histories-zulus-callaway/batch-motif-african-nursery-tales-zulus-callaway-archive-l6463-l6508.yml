canonical_text:
  quote: ''
  summary: The passage reports a dialogue between children and new acquaintances.
    The children identify their village, house, and mother, described as the queen
    whose house had been moved near the entrance because she had no child. The acquaintances
    identify themselves as Abahhwebu and say they are seeking a very beautiful damsel
    for their king’s first marriage. After the Abahhwebu leave, the boy places a water-vessel
    on her head and the children return up the hill. Their mother later returns from
    digging and questions them about fetching water and going outside despite her
    prohibition.
