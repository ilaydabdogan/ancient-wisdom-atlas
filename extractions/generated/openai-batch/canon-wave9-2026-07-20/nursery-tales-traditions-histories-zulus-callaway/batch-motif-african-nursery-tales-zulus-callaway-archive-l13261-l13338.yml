canonical_text:
  quote: "“We have destroyed the father’s darling.”"
  summary: The excerpt opens a tale titled “Umdhlubu and the Frog.” A king loves a
    newly married wife and their daughter, provoking the jealousy of his other wives.
    While the king is absent, the co-wives arrange a fibre-cutting outing and discourage
    others from carrying the child. The mother takes the child, but during the outing
    leaves her behind in a valley and returns home without her. The mother searches
    unsuccessfully, the co-wives rejoice, and a messenger tells the king that his
    child has been lost.
