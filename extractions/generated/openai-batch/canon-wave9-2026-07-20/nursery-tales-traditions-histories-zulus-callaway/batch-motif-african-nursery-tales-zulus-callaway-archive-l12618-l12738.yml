canonical_text:
  quote: I shall die if that ox dies.
  summary: Ubongopa, a boy associated with cattle and an ox, moves and dismounts through
    sung speech. He says he has never felt the ground since birth, refuses ordinary
    housing and ground-eaten food, and is placed in a ruined house. His spittle boils
    up, addresses the chief, fills the house, and is followed by thunder and heavy
    rain that affects all houses except his. Observers call him magically powerful
    and propose killing his ox; he says he will die if the ox dies.
  language: English translation with Zulu refrain/title forms
  quote_policy: quoted
