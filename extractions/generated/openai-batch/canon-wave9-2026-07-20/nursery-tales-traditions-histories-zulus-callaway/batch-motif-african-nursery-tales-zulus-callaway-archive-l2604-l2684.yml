canonical_text:
  quote: ''
  summary: In this Uthlakanyana episode, the protagonist receives an axe, lends it
    to women fetching firewood, and receives a blanket after the axe breaks. He lends
    the blanket to two unclothed young men and receives a shield after it tears. He
    lends the shield to men fighting a leopard and receives a war-assagai after the
    shield's hand-loop breaks. At each compensation request he recites the chain of
    prior objects and losses.
  language: English
  quote_policy: summarized
