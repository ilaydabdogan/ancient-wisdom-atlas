canonical_text:
  quote: ''
  summary: The Isikqukqumadevu leaves to summon others because it cannot conquer the
    strong damsel. Another animal warns Uluthlazase, who leaves the water and returns
    home. Other girls falsely report that she has reached puberty and resist her father's
    demand to see her; the father discovers she is absent from the hut and kills the
    girls, including Ubuthlaluse. He summons the nation, Uluthlazase shows the pool,
    and the men enter the water and kill the enraged creature. Damsels from the whole
    country come out; the creature had habitually stayed in the bathing pool and devoured
    damsels alive. Their fathers bring cattle to reclaim them, which the note explains
    by a Zulu custom of redeeming a lost child found by another person.
  language: English
  quote_policy: summarized
