canonical_text:
  quote: ''
  summary: After a confrontation in which spears fail to reach the opposed man, Ulangalasenthla
    agrees to return the children. He later sends an army to pursue and kill Ulangalasenzantsi
    and the children in the wilderness. Ulangalasenzantsi reaches a great red flooded
    river, raises his royal rod, and the river is stayed so his group can cross. When
    the soldiers arrive, he again stays the river and tells them to cross; after they
    enter, he drops the rod and the river overwhelms them. Ulangalasenzantsi and the
    children rejoice and set out for their people. Ulangalasenzantsi dies on the way;
    his brother continues with the children, old men die, and the young survivors
    with one man reach the country of their people.
  language: English
  quote_policy: summarized
