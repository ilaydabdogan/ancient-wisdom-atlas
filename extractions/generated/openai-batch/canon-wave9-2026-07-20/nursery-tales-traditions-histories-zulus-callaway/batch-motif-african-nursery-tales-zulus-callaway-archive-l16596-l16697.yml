canonical_text:
  quote: ''
  summary: Untombi-yapansi repeatedly moves to new places and shouts that Usilwanekazana
    has been killed by Usilwane after being accused of killing the prince’s leopard.
    Earlier hearers are punished for relaying the ominous report, but when the people
    hear Untombi-yapansi directly they cry and run to her. Usilwane flees, returns,
    is seized and bound. The king orders the house closed and burned with himself,
    his wife or the mother, and Usilwane inside, while sending Untombi-yapansi to
    live with her sister. Usilwane asks to be stabbed instead of burned, but the chief
    refuses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Untombi-yapansi moves onward to another place, including a small elevation,
    and shouts the same report about Usilwanekazana and Usilwane.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shouted report says there will be weeping in the summer and that Usilwanekazana
    has been killed by Usilwane because he says she killed the prince’s leopard without
    cause.
  category: speech
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: An old woman in the royal garden hears or reports the distant shouting and
    is seized, killed, and cast outside the garden as one prophesying evil against
    the king’s child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old man hears or reports a similar distant shout and is seized and cast
    outside the garden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Untombi-yapansi comes near and shouts again, all the people hear, cry,
    run toward her, and ask what she is saying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the men go home, Usilwane flees, is called back, enters the house, and
    is seized and bound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king orders the door closed and the house set on fire so that he, his
    wife or the mother, and Usilwane may be burned.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king tells Untombi-yapansi to go to her sister and live with her because
    the parents do not wish to live after Usilwanekazana’s death.
  category: speech
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:9
  text: Usilwane asks not to be burned in the house and requests to be stabbed with
