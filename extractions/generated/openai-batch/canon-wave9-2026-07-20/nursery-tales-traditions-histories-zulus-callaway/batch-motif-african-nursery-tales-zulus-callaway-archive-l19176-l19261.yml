canonical_text:
  quote: ''
  summary: The passage presents several Utikoloshe-related episodes. In one, a husband
    kills a male lover and his wife after Ugilikakgwa is said to have cohabited with
    her. In another, a rejected woman is advised to prepare herself with coloured
    earth and fat, boil white amabele, go to the river, and call Ugilikakgwa; a river
    being appears, the woman flees, and the Utikoloshe returns to the pool after people
    stone him. In the tale headed Unoko Masila, a man discovers his wife with the
    Utikoloshe, kills the Utikoloshe, has the wife carry the wrapped corpse to her
    kin, and receives cattle back after the corpse is shown.
  language: English
  quote_policy: summarized
