canonical_text:
  quote: "“A man knows one of his blood-relations by the navel.”"
  summary: A genealogical exchange reveals that two men share a grandfather, and both
    cry. Bystanders explain that one man had treated the other sympathetically because
    a blood-relation may be known by the navel. The narrator says elders do not explain
    how the navel acts, but the matter is repeatedly confirmed. A further note describes
    desolation causing parents and children to be separated and relatives scattered,
    while children may retain their father’s and family names.
