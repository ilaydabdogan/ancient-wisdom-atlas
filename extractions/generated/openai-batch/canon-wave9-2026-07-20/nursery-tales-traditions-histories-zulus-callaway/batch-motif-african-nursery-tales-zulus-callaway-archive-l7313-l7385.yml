canonical_text:
  quote: ''
  summary: A being called the Imbulu is drawn by milk, her tail unfolds, and she enters
    a pit. People pour boiling water into the hole and the Imbulu dies. The people
    announce that the true bride has come, gather the nation for a dance, celebrate
    the royal wedding with cattle slaughter and feasting, build Ukakaka’s kraal, appoint
    the bride as queen, and she reigns with her husband. Editorial notes compare the
    tale with several European false-bride or retained-animal-nature stories.
  language: English
  quote_policy: summarized
