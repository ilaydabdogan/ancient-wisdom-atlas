canonical_text:
  quote: ''
  summary: The passage presents Uhlakanyana as an uncanny child who speaks unusually
    early, is said not to have been naturally produced, and is predicted to do prodigious
    things. An inserted comparative excerpt recounts an Irish changeling test involving
    boiling egg-shells, a child speaking with an old man's voice, and a threatened
    red-hot poker. The Zulu narrative then continues with Uhlakanyana going to the
    river, taking birds from traps, bundling them, and bringing them to his mother,
    who praises him as wise.
  language: English
  quote_policy: summarized
