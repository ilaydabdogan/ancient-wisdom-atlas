canonical_text:
  quote: ''
  summary: An etiological tale says baboons originated from an idle Amatusi man who
    avoided work, fastened a hoe handle behind himself to become an animal, and became
    a baboon. As a baboon he raids a garden, tricks and strikes a sleeping watchman,
    and escapes to a precipice. The narrator connects present baboons' cries and crop-raiding
    with this origin. An attached comparative note cites a Mussulman legend in which
    apes descend from humans transformed by Allah for Sabbath desecration.
  language: English
  quote_policy: summarized
