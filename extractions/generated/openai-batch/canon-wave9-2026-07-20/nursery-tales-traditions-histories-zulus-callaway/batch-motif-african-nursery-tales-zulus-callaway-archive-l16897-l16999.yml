canonical_text:
  quote: ''
  summary: Untombi-yapansi accompanies Udalana to watch gardens from opposite watch-houses.
    She repeatedly uses a spoken formula naming her true identity to drive away crop-eating
    birds. At midday she bathes in a river pool, emerges shining like brass with a
    brass rod, strikes the ground, and summons her father’s people, cattle, food,
    and her own ox from the earth. She mounts the ox and sings while the people and
    trees join in. She then commands the earth to open and receive the people and
    things again, conceals her shining body with black earth, and returns to the garden.
    Footnotes report variant details involving the dead and an alternate bird-garden
    episode.
  language: English
  quote_policy: summarized
