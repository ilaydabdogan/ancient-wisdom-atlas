  summary: The appendix explains “ukuzwana ngenkaba,” translated as “sympathy by the
    navel,” as a belief that blood-relations can feel a mutual, undefined attraction
    without knowing its cause. It applies this idea to U nthlatu-yesiziba recognizing
    his mother, whom he had never seen, and then cites English romance and poetic
    examples of instinctive recognition or blood sympathy.
