canonical_text:
  quote: ''
  summary: 'A boy repeatedly addresses Ubongopa-kamagadhlela with a sung command:
    first to stand, then to allow mounting, then to go, and later to stand still.
    The boy mounts the ox, and as Ubongopa sets out the houses, gardens, cattle pen,
    and things of the village follow. Men, the chief, and the tribe pursue and try
    to kill the boy. When assagais are hurled at him, they repeatedly fail to reach
    him and strike the ground instead. Editorial footnotes compare adjacent incidents
    with other traditions, including renewed animals and weapons failing to hit a
    protected target.'
  language: English with Zulu names and refrain
  quote_policy: summarized
