canonical_text:
  quote: ''
  summary: A cannibal who has been denied food dies during the night and is cast down.
    A sister persuades her brother to leave their tree refuge and seek a married sister
    their mother had mentioned, because their parents are dead and only the two of
    them remain. They soften a rope in water, fasten it to a log, descend from the
    tree, pass the cannibal’s bones, and search through a lunar cycle until they find
    their sister. The found sister recognizes and names them; they recount their separation
    from their parents, their trouble with cannibals, their stay in a beautiful country
    above, and the death of the cannibal. The three then live together peacefully.
  language: English
  quote_policy: summarized
