canonical_text:
  quote: ''
  summary: A night cattle-theft episode is described. After cattle are found swollen
    from blows, the father blames his child, though the passage states thieves had
    beaten them by night. On the next night the thieves return, enter through a gateway,
    beat the cattle, and identify a fellow who prevents the cattle from moving. Compelled
    to speak, he calls on Ubongopa-kamagadhlela to awake because thieves of another
    tribe are killing them. Ubongopa-kamagadhlela awakes, commands going, and the
    cattle and calves move out and follow.
  language: English
