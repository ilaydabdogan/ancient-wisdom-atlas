canonical_text:
  quote: I am taking Umdhlubu to her own country.
  summary: A speaking frog escorting Umdhlubu is spared by people who consider killing
    it. The frog reaches the area of Umdhlubu’s mother’s village, places Umdhlubu
    down with her belongings, cleanses, anoints, and ornaments her. Umdhlubu enters
    her mother’s house, questions her mother about having left a lost child, and is
    recognized by her mother, who rejoices and praises her.
  language: English translation, with embedded Zulu text and notes
  quote_policy: quoted
