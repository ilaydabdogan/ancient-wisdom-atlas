canonical_text:
  quote: Just come and see the children who came out of the snake.
  summary: Children of Unthlangunthlangu travel with their maternal grandmother toward
    their father’s or home village. In answer to questions, they recount that their
    mother gave birth to a snake, that the king ordered it cast away, and that their
    mother was left behind. The grandmother identifies the mother as her own child
    and recalls a saying that her child would be king. People gather, slaughter cattle,
    speak of the children who came out of the snake, direct them onward, question
    them again, hear that they had lived in a pool and were a snake, and finally point
    out Unthlangunthlangu’s village, which they reach.
  language: English
  quote_policy: quoted
