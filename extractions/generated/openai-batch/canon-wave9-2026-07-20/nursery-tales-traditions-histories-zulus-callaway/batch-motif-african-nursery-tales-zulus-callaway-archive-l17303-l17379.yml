canonical_text:
  quote: The imbulu was scalded. They covered it up with earth in the hole.
  summary: In this closing episode, Untombi-yapansi is brought to her sister and identifies
    the being as an imbulu. The chief has a deep pit dug in the cattle-pen, with milk
    lowered into it, and orders the women and the imbulu-bride to leap across. The
    imbulu falls into the hole when its tail sees the milk; women pour boiling water
    into the hole and cover the imbulu with earth. The passage ends with public celebration,
    dancing, cattle slaughter, eating, and Untombi-yapansi living happily with her
    sister.
  language: English
  quote_policy: quoted
