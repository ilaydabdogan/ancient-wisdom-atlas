canonical_text:
  quote: ''
  summary: In this excerpt, Umdhlubu, a princess believed dead, is seen alive again.
    Her mother and her side of the household rejoice, while rival queens are troubled
    because they had thought the child killed and fear loss of their children’s supremacy.
    A messenger informs the king, who orders oxen gathered and a public proclamation.
    People rejoice, bring gifts and cattle, and slaughter cattle. The king slaughters
    oxen to induce Umdhlubu to come out and enter the cattle-kraal, where people dance
    for her. She is restored to her royal position, and when asked how she came, she
    says a frog brought her.
  language: English
  quote_policy: summarized
