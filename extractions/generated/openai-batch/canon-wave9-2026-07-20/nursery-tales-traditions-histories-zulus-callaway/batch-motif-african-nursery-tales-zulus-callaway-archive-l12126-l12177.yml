canonical_text:
  quote: ''
  summary: In a tale of two brothers, the elder lets the younger down by a rope to
    drink water and abandons him at the bottom, then drives away the cattle and lies
    to their parents. A bird comes in the morning and repeatedly tells the family
    that their child has been put into the water. The parents follow the bird to the
    place, where the younger brother explains that his brother left him there and
    recounts an earlier encounter with a little old woman whom the elder refused to
    help.
  language: English
  quote_policy: summarized
