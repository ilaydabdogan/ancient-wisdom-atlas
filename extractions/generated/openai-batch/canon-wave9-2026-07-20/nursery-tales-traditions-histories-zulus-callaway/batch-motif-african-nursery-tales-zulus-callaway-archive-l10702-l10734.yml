canonical_text:
  quote: ''
  summary: Animated leaves go to a house near a gateway and carry pots of beer, boiled
    meal, mats, vessels, and other contents from houses to the gateway. Umkxakaza
    asks that a little pot in the upper part of Uxnkasakaza’s mother’s house, luted
    down with cowdung, be left. The leaves leave the little pot and very large pots
    of strained beer, then go down to the gateway. Notes explain puberty-related umgongo
    customs, household storage in pots or skin sacks, and strained beer as ready for
    use.
  language: English
  quote_policy: summarized
