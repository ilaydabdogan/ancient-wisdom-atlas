canonical_text:
  quote: ''
  summary: A central character asks his mother for an umdiancliane and receives a
    milk-pail. He lends the milk-pail to boys herding sheep; after the last boy breaks
    it, he demands its return by reciting its prior history and receives an assagai.
    He then lends the assagai to other boys eating liver; after it breaks, he again
    recites the chain of prior exchanges. A section heading states that the broken
    assagai leads to an axe, and an editorial note explains the character’s altered
    speech and the compensation custom behind the demand.
  language: English
  quote_policy: summarized
