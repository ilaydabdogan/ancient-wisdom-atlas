canonical_text:
  quote: ''
  summary: After a devouring being is killed, those it had swallowed, including Untombinde,
    emerge from its dead body. Untombinde returns to her father and is taken as wife
    by Unthlatu, but when she goes to his people to stand in his kraal, they say he
    was lost as a child. She is allowed to remain in a separate house. At night Unthlatu
    secretly comes, consumes sour milk, meat, and beer placed there, and later questions
    Untombinde about her purpose, her loyalty to the lost bridegroom, and her refusal
    to eat or drink before the marriage acknowledgment rite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man stabs a lump associated with the devouring being, and the being dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those the being had devoured come out of its dead body, including cattle,
    dogs, men, and Untombinde.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Untombinde returns to her father, Usikulumi, and is then taken by Unthlatu,
    son of Usibilingwana, to be his wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Untombinde goes to the bridegroom’s kraal, stands at its upper part, and says
    she has come to marry Unthlatu.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: The people at the kraal say Unthlatu is not there and had been lost when he
    was a boy; his mother weeps and says she had one child who was lost.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king allows Untombinde to remain, suggesting she may become wife to one
    of his other sons, and a separate house is built for her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note glosses Unthlatu as a boa-constrictor or boa-man and says he had a
    snake-like appearance with bright, slippery skin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Unthlatu’s mother places sour milk, meat, and beer in Untombinde’s house and
    says she had placed such food there even before Untombinde came.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At night Unthlatu comes into the house, takes from the sour milk, eats meat,
    drinks beer, stays a long time, and leaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the morning Untombinde finds that the food and drink have been diminished,
    fears she will be accused of stealing them, and tells the mother she does not
    know what ate them and did not hear the man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On a later night, after a wether is slaughtered and food and drink are again
    placed in the house, Unthlatu enters and touches Untombinde’s face, waking her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Unthlatu asks why Untombinde is there; she says she has come to marry Unthlatu
    and, despite his being lost, will marry him only.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Unthlatu asks why Untombinde does not marry the king’s other sons instead
    of waiting for a lost man.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Unthlatu invites Untombinde to eat meat and drink beer; she refuses, saying
    she has not yet had the imvuma slaughtered for her and does not yet eat or drink
    these things.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: A note explains that a young woman seeking marriage stands at the bridegroom’s
    kraal; acknowledgment involves slaughtering a goat called the imvuma, while rejection
    may be signaled by giving burning firewood.
  category: other
  evidence_refs:
  - ev:6
