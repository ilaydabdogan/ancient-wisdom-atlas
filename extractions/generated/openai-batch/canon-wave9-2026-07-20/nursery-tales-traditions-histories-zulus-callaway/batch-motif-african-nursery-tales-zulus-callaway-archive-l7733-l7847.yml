canonical_text:
  quote: ''
  summary: The passage describes how the honey-bird leads people to bees by crying,
    chirping, settling, and indicating direction. A person follows it, finds bees
    entering near a tree, digs out honey, and leaves young bees or comb for the bird,
    which may guide him again. Women may also follow the bird and return with honey.
    The passage then gives practical cautions about snakes in bee holes, careful digging
    that preserves the bee entrance, and testing with a stick before taking honey.
  language: English translation with Zulu text present in the supplied passage
  quote_policy: summarized
