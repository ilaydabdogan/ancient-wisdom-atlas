canonical_text:
  quote: ''
  summary: A man escapes the Isitwalangcengce by filling a basket with branches, catching
    a tree, and running home before the basket is emptied on a rock. The strategy
    is then used by children who are seized by the Isitwalangcengce. The tale is described
    as an old fabulous account used to silence crying children. The passage then begins
    a related account in which a hyena takes Udhlokweni at night and carries her toward
    a forest, where she tries to use a tree during a route choice episode.
  language: English with Zulu names and terms
  quote_policy: summarized
