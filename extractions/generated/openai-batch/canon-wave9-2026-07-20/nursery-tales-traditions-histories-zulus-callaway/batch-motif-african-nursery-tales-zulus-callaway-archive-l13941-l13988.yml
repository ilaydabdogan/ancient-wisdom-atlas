  summary: The passage introduces Umdhlubu as a notably beautiful young woman. Her
    mother rejoices in her, and Umdhlubu's household is exalted, but other queens
    become intensely resentful because Umdhlubu is admired and loved by a king of
    another nation. People identify Umdhlubu to that king, who decides to go with
