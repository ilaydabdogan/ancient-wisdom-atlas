canonical_text:
  quote: ''
  summary: A group of oribes, having helped an old woman escape, plan to avoid blame
    by smearing mud on the legs of sleeping hyenas. In the morning the chief accepts
    a muddy-leg test, the hyenas are accused and eaten. The old woman is later received
    by her son-in-law with her water-vessel, and after the water is finished she orders
    him to fetch the liver of an ingogo for her. Editorial notes compare the mud-marking
    episode with other animal trickery tales and describe the task exchange as retaliatory
    spell-binding.
  language: English
  quote_policy: summarized
