canonical_text:
  quote: ''
  summary: A being addresses Udhlokweni about the mourning, crying children, and grief
    of her people, and says it has taken her from her village forever. Udhlokweni
    replies that she loved the children and gave generously to women and men. She
    then catches hold of a tree and climbs up. The Isitwalangcengce goes on alone
    to a river, throws itself down, and laments that it has killed itself while thinking
    it was throwing down Udhlokweni. Udhlokweni has in fact fled and returned to her
    mourning people.
  language: English
  quote_policy: summarized
