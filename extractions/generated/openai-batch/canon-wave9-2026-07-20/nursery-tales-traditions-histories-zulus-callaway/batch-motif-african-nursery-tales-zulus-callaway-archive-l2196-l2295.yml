canonical_text:
  quote: ''
  summary: Uthlakanyana is rejected by one cannibal who refuses to lend him a calabash.
    He then enters another cannibal's house, claims kinship, and uses the noise made
    by the following calabash owner to frighten the second cannibal away. The calabash
    owner later accepts Uthlakanyana into the house and leaves him to guard the kraal
    while he goes hunting.
  language: English
  quote_policy: summarized
