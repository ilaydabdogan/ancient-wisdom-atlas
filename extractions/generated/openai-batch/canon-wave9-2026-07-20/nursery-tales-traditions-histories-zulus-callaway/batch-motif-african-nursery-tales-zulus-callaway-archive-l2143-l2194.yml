canonical_text:
  quote: ''
  summary: In this excerpt, Uthlakanyana refuses to release a cannibal who asks for
    meat and help. A storm of hail, rain, and lightning comes; Uthlakanyana brings
    the meat into the house and lights a fire while the cannibal remains on the house,
    is struck by hailstones, and dies. Uthlakanyana then eats his cow alone and goes
    on his way. He next meets another cannibal carrying a large musical calabash and
    addresses him as uncle, but the cannibal questions the kinship claim.
  language: English
