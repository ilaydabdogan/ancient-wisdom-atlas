canonical_text:
  quote: ''
  summary: 'The passage describes a wife in a polygamic household who fails in expected
    food-giving and household conduct: she grudges, denies, conceals, and secretly
    eats food, scolds people, and angrily turns them out. Such a wife is said to lose
    the chief place, move lower to the entrance, and be replaced by another wife able
    to fill the position properly.'
