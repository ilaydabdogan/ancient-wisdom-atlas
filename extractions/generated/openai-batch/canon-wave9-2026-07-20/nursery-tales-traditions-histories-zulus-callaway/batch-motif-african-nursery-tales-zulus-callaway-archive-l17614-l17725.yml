canonical_text:
  quote: ''
  summary: A chief with many wives marries two sisters, makes one chieftainess, and
    the other becomes jealous. The chieftainess's first three children die after being
    handled by her sister. Warned by the chief's mother, the chieftainess later gives
    birth secretly to an imamba snake. Her sister gives birth to a human boy. The
    chief names the snake-child Umamba and the boy Unsimba, and people suspect Unsimba's
    mother killed the earlier children because she wanted her son to become king.
  language: English
  quote_policy: summarized
