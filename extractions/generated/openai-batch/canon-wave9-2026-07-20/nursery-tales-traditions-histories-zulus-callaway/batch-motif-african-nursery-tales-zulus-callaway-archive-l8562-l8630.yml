canonical_text:
  quote: ''
  summary: The appendix surveys tales and scholarly comparisons about ascent to heaven
    or celestial regions by trees, vines, rattans, or similar vegetal links; related
    descents from heaven or stars; acquisition or origin of food plants; Yggdrasil;
    Tylor’s caution about overusing bare similarities to prove common origin; and
    cosmologies of layered heavens and earths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An American legend is summarized in which a tree reaches the sky; by the tree
    a male figure reaches the stars and finds a firm plain and a road followed by
    the sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Celebes legend of Utahagi is compared with Tawhaki: the hero had married
    a daughter of heaven, was forsaken by her, and ascended to heaven by rattans in
    search of her.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nokomis is described as swinging on grape-vines in the moon; after her companions
    sever the vine she falls to earth and gives birth to Hiawatha’s mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Osseo is described as having descended from the evening star, later being
    raised again to the evening star by magic, and descending again when the spell
    was broken.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a Dayak tale, Si Jura ascends by a large fruit tree whose root is in the
    sky and whose branches touch the waters; he reaches the country of the Pleiades,
    obtains three kinds of rice seed, and returns as a blessing to humankind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the myth of Mondamin, Mondamin descends from heaven as a beautiful youth,
    fights Hiawatha, is overcome, and from his buried body a magic plant springs up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Other legends are said to describe ascent from regions under the earth to
    its surface; the Mandan version uses a grape-vine, while a later Zulu legend mentions
    ascent without naming the means.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Yggdrasil is quoted as the largest and best of trees, with branches spreading
    over the world and rising above the heavens; the passage reports speculation that
    it may symbolize enduring time or relate to similar legends.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tylor is quoted warning that climbing from earth to heaven by a tree may be
    a simple idea in another cultural model, so bare coincidences should not be used
    alone to prove common origin.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The quoted cosmological model describes a flat earth, a sky-roof with holes
    or windows, inhabitants above and below the earth, and human access by climbing
    high enough or traveling between levels.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Arabs are described as believing in seven heavens above one another and
    seven earths beneath one another, with the inhabited earth as the highest of the
    latter and next below the lowest heaven.
  category: setting
  evidence_refs:
  - ev:10
