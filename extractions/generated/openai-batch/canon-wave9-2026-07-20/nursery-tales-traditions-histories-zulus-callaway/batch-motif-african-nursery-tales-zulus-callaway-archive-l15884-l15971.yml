canonical_text:
  quote: "“It is the navel which has brought about such a thing as this.”"
  summary: A man questions a woman about her names and kin, discovers she is his sister,
    and both attribute their recognition to the navel. Her caretakers receive repayment
    and she returns with her brother. The narrator then introduces a related, supposedly
    known family case involving scattering during conflict, Umagushu, and his missing
    pregnant wife Umanjonga.
  language: English
  quote_policy: quoted
literal_observations:
