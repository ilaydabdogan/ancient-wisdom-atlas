canonical_text:
  quote: ''
  summary: The passage explains that a honey-bird may call people toward places containing
    a leopard, a carcass, or a coiled snake, and that people learned to read its wing-striking
    as a warning. A narrator recalls following a honey-bird while traveling to fetch
    buffalo meat; the bird repeatedly led the group to an old village site, where
    they eventually found a heavy red brass collar under a tree. A note adds that
    other bird cries are locally interpreted as resembling human speech.
  language: English
