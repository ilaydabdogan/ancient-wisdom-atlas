canonical_text:
  quote: ''
  summary: A mother names the girl Ukcombekcantsini while the boy refuses a present
    name, saying he will receive a manhood name from his father when grown. Later,
    while the mother is absent, the girl persuades the boy to go fetch water because
    crows have spilled their mother's water. They go to the river with a water-vessel;
    the boy is described as white and the girl as very shining. After drawing water,
    they see many people arrive, and the boy gives all of them water to drink.
  language: English
