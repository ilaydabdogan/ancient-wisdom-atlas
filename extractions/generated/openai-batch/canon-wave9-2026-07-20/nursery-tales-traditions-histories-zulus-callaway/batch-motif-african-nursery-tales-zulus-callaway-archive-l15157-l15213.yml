canonical_text:
  quote: ''
  summary: In this fragment, travelers repeatedly inquire at villages while seeking
    their mother. Their formula says their mother gave birth to them but did not nourish
    them, and that they ate earth and grew. They travel mounted on oxen; named or
    unnamed oxen are prompted to cry. Village people repeatedly tell them to go forward.
    At Umkuzangwe's large village, they are asked whose children they are and give
    a named lineage or parentage.
  language: English
  quote_policy: summarized
