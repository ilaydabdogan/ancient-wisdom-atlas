canonical_text:
  quote: "“a beast in the water which can seize the shadow of a man”"
  summary: The passage gives the end of a tale in which children are lost at a pool,
    one child escapes, and men find that the rock associated with the event is gone;
    they wonder whether it was a tortoise and mourn the missing children. The appendix
    explains a belief that a water beast can take a person's shadow when he looks
    into a dark pool, making him desire to enter the water, where he is eaten. It
    also records a prohibition against looking into dark pools and mentions a similar
    Amakccosa/Amakrosa tale.
  language: English with brief Zulu
  quote_policy: quoted
