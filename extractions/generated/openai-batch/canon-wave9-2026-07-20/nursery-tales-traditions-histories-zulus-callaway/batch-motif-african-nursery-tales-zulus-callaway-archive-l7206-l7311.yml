canonical_text:
  quote: ''
  summary: A group of girls, including Ukcombekcansini, visit the kraal while the
    people are away, strain beer, collect it in vessels, clean the kraal, fetch firewood,
    and drink beer in the house where Uthlese is. Ukakaka enters, blocks their attempted
    escape, and confronts Ukcombekcansini. She says he took her from her father’s
    kraal, left her on the high lands, and went away with an Imbulu. Ukakaka rejoices
    that the lost damsel has returned and tells his father. His father orders men
    to dig a pit in the cattle enclosure and women to boil water; milk is put in the
    pit so that the Imbulu will throw itself in to eat it. The false bride is called
    to join the women leaping over the pit and is reluctant to enter the cattle-pen.
  language: English
  quote_policy: summarized
