  summary: The passage describes the Isitwalangcengce as a hyena-like basket-bearing
    animal that stays near villages during famine, watches for meat distribution after
    slaughter, seizes children carrying meat at doorways, carries victims on its head,
    and eats only their brains at rocks. A later episode begins with the animal carrying
    off a sleeping man, who asks where they are going.
