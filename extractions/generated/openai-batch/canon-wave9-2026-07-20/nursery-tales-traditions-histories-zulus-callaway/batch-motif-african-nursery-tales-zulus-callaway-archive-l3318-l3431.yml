canonical_text:
  quote: ''
  summary: Usikulumi travels to court Uzembeni’s daughters. A swallow warns him of
    danger and becomes a speaking skin-charm on his rods. The charm warns him when
    Uzembeni approaches by night, then urges him to flee with a damsel. During the
    flight, the charm directs him to climb a tree. Dogs attack and tear Uzembeni apart,
    but she repeatedly comes back to life, even after being ground to powder and thrown
    into water. She ultimately fails to find the fugitives and goes home. Editorial
    notes compare the repeated revivals and pursuit sequence with other tale traditions.
  language: English
  quote_policy: summarized
