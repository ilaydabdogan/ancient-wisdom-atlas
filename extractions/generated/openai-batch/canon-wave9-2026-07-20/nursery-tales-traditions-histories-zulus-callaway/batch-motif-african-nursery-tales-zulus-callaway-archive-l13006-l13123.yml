canonical_text:
  quote: ''
  summary: In an episode of Uboxgopa-kamagadhlela, a boy asks for one assagai, spits
    on the ground, and kills a chief and his people with the weapon. He then restores
    them to life by striking with the weapon or its haft. After repeated failed attacks
    against him, he again kills the chief and people, revives the people only, and
    they declare themselves his people. As they travel, another tribe raises an alarm
    and threatens them; the boy is on an ox and says he does not walk on the ground.
    An editorial note cites similar revival episodes in other tale collections.
  language: English
  quote_policy: summarized
