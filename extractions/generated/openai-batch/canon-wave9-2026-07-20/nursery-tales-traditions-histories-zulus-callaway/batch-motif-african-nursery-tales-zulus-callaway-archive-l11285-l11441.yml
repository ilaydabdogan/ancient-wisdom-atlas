  quote: ''
  summary: A song addresses heaven, saying that it thunders in an undertone in order
    to produce rain and seasonal change. After the Amadhlungundhlebe see clouds gathering,
    Umkrakaza sings the song again. The sky becomes covered with clouds, thunders
    strongly, rains heavily, and the rain quenches a red-hot sherd and tosses it upward.
    An editorial note compares this to widespread beliefs in human control of weather
    by incantation or other means.
