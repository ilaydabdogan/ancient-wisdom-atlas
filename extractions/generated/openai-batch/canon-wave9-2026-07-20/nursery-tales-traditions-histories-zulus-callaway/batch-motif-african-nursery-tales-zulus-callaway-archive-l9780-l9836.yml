canonical_text:
  quote: ''
  summary: In this excerpt, the izingogo see fire and halt, later pursue a fleeing
    man until he nears villages. At their own home they boil and eat a grandmother,
    saying this will prevent death. The son-in-law of the old woman reaches home and
    gives a liver to a female recipient, who praises him. A note explains the eating
    as analogous to a life-prolonging medicine made from the remains of very old animals.
  language: English with Zulu terms
  quote_policy: summarized
