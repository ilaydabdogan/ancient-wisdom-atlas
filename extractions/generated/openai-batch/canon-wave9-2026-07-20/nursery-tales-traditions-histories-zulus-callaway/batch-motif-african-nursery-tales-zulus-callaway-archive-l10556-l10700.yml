canonical_text:
  quote: ''
  summary: The passage contains editorial comparative notes on spell-bound immobility
    and humbling a proud princess, followed by a tale segment in which speaking leaves
    command Umkxakaza to cook, grind corn, cut off her long nails, prepare amasi and
    ground corn, and take food to Usilosimapundu. Usilosimapundu consumes food together
    with baskets and spoon. The leaves then force Umkxakaza to eat amasi although
    she says she is still under puberty obligations and should receive it properly
    from her father after ceremonies.
  language: English
