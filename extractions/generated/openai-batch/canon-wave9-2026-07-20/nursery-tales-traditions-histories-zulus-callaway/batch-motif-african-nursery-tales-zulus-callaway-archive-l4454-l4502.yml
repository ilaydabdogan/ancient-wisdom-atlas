  quote: It is my child, the child of a clot of my blood, the child of the pigeons
  summary: A woman is instructed to draw out a blood clot, seal it in a pot, and uncover
    it in the ninth month. She finds a child inside, hides and feeds him so he grows
    quickly, then reveals him to her husband, explaining that pigeons taught her this
    wisdom. The husband rejoices and the child grows up.
  language: English
