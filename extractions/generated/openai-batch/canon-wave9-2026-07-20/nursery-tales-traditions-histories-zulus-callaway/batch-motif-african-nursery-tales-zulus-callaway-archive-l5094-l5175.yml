canonical_text:
  quote: ''
  summary: Two princesses and attendant maidens bathe at a pool. A being named Isikgukgumadevu
    takes their garments and returns them when asked. The younger princess Uluthlazase
    refuses to ask, is left behind, fights the being, and is dragged with it into
    the pool, where neither prevails and both sleep.
