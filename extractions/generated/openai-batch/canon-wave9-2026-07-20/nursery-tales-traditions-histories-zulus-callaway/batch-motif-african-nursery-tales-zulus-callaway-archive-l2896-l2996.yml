canonical_text:
  quote: ''
  summary: Usikulumi is welcomed by his uncle's people with joy, oxen, and a feast.
    He then reaches his father's kingdom, where his father, distressed by his return,
    orders the nation to arm itself and kill him. Usikulumi stands openly and invites
    the people to throw spears at him. They attack until sunset but cannot kill him,
    because a monster has given him strength and the power not to die. An editorial
    note compares this invulnerable-hero episode with another Zulu legend, Balder,
    and Polynesian examples.
  language: English
  quote_policy: summarized
