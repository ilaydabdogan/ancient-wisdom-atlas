canonical_text:
  quote: ''
  summary: In this fragment, two wedding companies ask merchants to judge the prettiest
    girl. The merchants praise Utintakabazana but say she is not equal to Untombinde,
    the king's child; Utintakabazana's marriage company then kills the merchants.
    The companies later arrive at the river or pool named Uulange/Ilulange, remove
    ornaments and decorated clothing, and bathe. When they come out, a little girl
    finds the items gone. The girls say the items were taken by the Isik^uk/umadevu
    and petition it to return them. Footnotes explain the praise imagery and describe
    the Isik^uk/umadevu as a bloated, squatting, bearded monster, with reported interpretations
    comparing the tale to a first large ship or to Noah's ark.
  language: English
  quote_policy: summarized
