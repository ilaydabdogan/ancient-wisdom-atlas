canonical_text:
  quote: ''
  summary: Umdhlubu leaves her adopted home after saying she is expected to become
    her brother's wife. A great frog tells her to fetch her valued things, then swallows
    the objects and Umdhlubu in order to take her to her own people. On the way, groups
    of men threaten to kill the frog, but he speaks and declares his errand. Later,
    herding boys connected with her father also threaten the frog as the excerpt breaks
    off.
  language: English
  quote_policy: summarized
