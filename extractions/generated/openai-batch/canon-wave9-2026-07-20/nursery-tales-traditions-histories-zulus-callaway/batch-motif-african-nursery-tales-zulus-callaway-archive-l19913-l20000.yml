  summary: 'A sequence of riddles asks hearers to identify unnamed men or groups described
    through striking attributes: standing without lying down, remaining unmoved by
    wind, forming a white-adorned wedding-dance row, living among enemies, working
    unseen at night, halting when a number exceeds ten, laughing with harmful consequences,
    and acting as a sighted chief for blind followers.'
