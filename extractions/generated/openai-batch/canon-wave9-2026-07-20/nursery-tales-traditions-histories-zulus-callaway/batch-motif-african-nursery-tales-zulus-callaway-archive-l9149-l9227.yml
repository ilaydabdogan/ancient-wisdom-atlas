canonical_text:
  quote: ''
  summary: The passage describes a ritual account in which a victorious chief uses
    portions of a defeated chief's body and preserved head with king-medicine. The
    flesh is charred with medicines and eaten by the chief; the head is kept and used
    as a charm associated with courage, future military success, and humiliation of
    the defeated chief's tribe.
  language: English with Zulu terms
  quote_policy: summarized
