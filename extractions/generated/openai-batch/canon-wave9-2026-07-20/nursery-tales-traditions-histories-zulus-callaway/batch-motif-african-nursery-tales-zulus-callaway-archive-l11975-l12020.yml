canonical_text:
  quote: ''
  summary: After bathing, a damsel asks what had happened; her companion says she
    had placed her things in her head and recounts what the old man did. She receives
    a garment, names herself, and the two return home. People gather, ask which damsel
    has come to point out a husband, and are told that one is Ukandakulu. The chief
    sees her, orders many cattle slaughtered, summons the nation, and the people are
    to dance for the queen.
