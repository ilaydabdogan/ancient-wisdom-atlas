canonical_text:
  quote: ''
  summary: A chief’s daughter looks into a pool and is drawn into it. The chief comes
    with cattle to redeem her. Spotted, red, and white cattle do not secure her release,
    but two black hornless oxen do; the beast releases her and eats the oxen. Afterward
    she is changed and unable to understand anything. The narrator adds that the tale
    is among the Amak^eosa and much of it is lost, followed by an editorial note about
    fabulous animals resembling sprites and fables from Northern nursery tales.
  language: English
  quote_policy: summarized
