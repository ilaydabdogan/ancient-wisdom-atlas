canonical_text:
  quote: ''
  summary: 'The passage describes inheritance rules in a polygamic household: heritage
    passes through ranked houses and may fall to the iponsakubusa if all nearer heirs
    are dead. It also describes conditions for ejecting the first wife from the chief
    place, especially adultery or failure in hospitality to strangers, and explains
    how a new virgin wife may become chief wife and mother of the heir, with the heir
    and his property transferred to her house.'
  language: English
