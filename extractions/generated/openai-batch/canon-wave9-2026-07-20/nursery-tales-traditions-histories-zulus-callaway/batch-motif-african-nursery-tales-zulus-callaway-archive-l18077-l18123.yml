canonical_text:
  quote: "“Since he is a snake how will he dance?”"
  summary: At a wedding gathering, people laugh at Umamba because he is identified
    as a snake and is expected not to dance. After the wedding company dances, Umamba
    is anointed, has a skin removed, receives adornments from his mother, puts on
    a great skin, moves on his belly to the cattle-pen, and then has the skin taken
    off by his lad, revealing a glistening appearance that the people cannot look
    at.
  language: English
  quote_policy: quoted
