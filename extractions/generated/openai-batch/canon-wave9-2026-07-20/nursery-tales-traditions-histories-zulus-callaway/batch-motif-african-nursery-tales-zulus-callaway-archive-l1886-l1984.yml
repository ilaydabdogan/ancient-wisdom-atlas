canonical_text:
  quote: ''
  summary: Uthlakanyana deceives a leopard mother by controlling access to her cubs,
    cooks a buck for her, is entrusted with the cubs, constructs a house with a narrow
    doorway and an escape burrow, eats one cub, manipulates the mother with the remaining
    cub, and sets four shortened assagais at the doorway so that the leopard is pierced
    and dies when pursuing him.
  language: English
  quote_policy: summarized
