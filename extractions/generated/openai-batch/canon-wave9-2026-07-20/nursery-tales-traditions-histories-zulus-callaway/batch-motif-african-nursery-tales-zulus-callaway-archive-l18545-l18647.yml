canonical_text:
  quote: "“I help you from pure mercy.”"
  summary: 'The passage closes an account of a king’s child who travels with his mother
    and others treating diseases without reward. It then begins the tale of the Great
    Tortoise: during a famine, women gathering herbs come to the Umtshezi River, where
    a huge tortoise obstructs the water and takes the grandmother into deep water.
    Later a herding boy throws a stone into the pool, refuses food at home, runs back
    to enter the pool, and remains with only his head visible while his father offers
    cattle to anyone who can save him.'
  language: English with Zulu headings and names
  quote_policy: quoted
