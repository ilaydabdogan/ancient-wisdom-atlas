canonical_text:
  quote: ''
  summary: 'The passage continues Uthlakanyana episodes: after a leopard episode he
    eats the leopard and child and travels on; an alternate doe version has him devour
    thirteen kids as nurse, escape pursuit by becoming an upper millstone, and be
    thrown across a river. He then meets a cannibal, shares meat, claims the black
    of two cows while the cannibal claims the white one, and directs house-building,
    slaughter, and thatching before eating.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the leopard is dead, Uthlakanyana kills the leopard’s child, eats the
    leopard and her child, takes one leg, and continues traveling because he does
    not stay in one place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another version, a doe has thirteen children; Uthlakanyana engages himself
    as nurse and eats the kids one after another over thirteen days by a similar stratagem.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the doe pursues him to a full river, Uthlakanyana turns into an upper
    millstone; the doe throws the stone across the river, and he speaks from the other
    side.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage note explains an upper millstone as the hard pebble used with
    a lower flat stone in native women’s grinding.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: An editorial note states that the upper-millstone incident is related of Litaolane
    in the Basuto Legend of Kammapa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A section heading frames the cannibal episode as one in which Uthlakanyana
    gets a cannibal into trouble and leaves him to die; the narrative begins with
    their meeting and kinship-style greetings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Uthlakanyana offers meat to the cannibal; the cannibal thanks him because
    he was very hungry, and both eat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Two cows appear, one white and one black; the cannibal claims the white cow,
    and Uthlakanyana claims the black cow.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A house is built; at Uthlakanyana’s suggestion the white cow is killed first
    and found lean, while the black cow is killed and found very fat, after which
    the cannibal praises Uthlakanyana as wise.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Uthlakanyana tells the cannibal that the house should be thatched before they
    eat because the sky suggests they will get wet, and the cannibal agrees.
  category: action
  evidence_refs:
  - ev:10
