canonical_text:
  quote: Through the arrival of Unthlatu by night he found Untombinde; he told her
    not to make him known; but at last he was seen.
  summary: In this fragment, a mother and father discuss Unthlatu’s absence and the
    damsels who have come. The father says the damsels should not be driven away and
    mentions sons who are crows. Untombinde arrives to marry Unthlatu, is set apart
    in the youth’s house, and becomes the means by which Unthlatu is finally seen,
    despite his request that she not make him known.
