  quote: ''
  summary: Uhlakanyana returns through an enclosure with a leg of meat and gives it
    to his mother, who praises having given birth to a wise man. He then goes to the
    cattle-kraal, offers to carry meat for men into a house, and instead takes it
    to his mother after smearing blood on an eating-mat and stick. A footnote compares
    his strength with youthful feats in several other traditions.
