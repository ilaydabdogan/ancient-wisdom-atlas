canonical_text:
  quote: ''
  summary: Officers bargain with Usikulumi's father for a reward of black oxen before
    reporting that they have seen a child like one of his. The king becomes angry
    and orders his son taken to a great forest known for a many-headed man-eating
    monster. Usikulumi's mother and sister accompany him farther than the rest and
    leave him on a great rock in the forest. A many-headed monster comes out of the
    water, spares and feeds him, and gives him food, men, and a subject nation. Usikulumi
    later travels as a king with a great nation and visits his uncle, who does not
    recognize him at first.
  language: English
  quote_policy: summarized
