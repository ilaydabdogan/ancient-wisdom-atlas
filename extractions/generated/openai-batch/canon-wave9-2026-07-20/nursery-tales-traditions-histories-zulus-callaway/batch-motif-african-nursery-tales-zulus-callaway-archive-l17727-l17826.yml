canonical_text:
  quote: ''
  summary: The passage describes discussions about a death-causing medicine or touch,
    then several marriage-selection scenes involving Unsimba and Umamba. Maidens come
    to choose husbands but fear Umamba because he is a snake. The father or king loves
    Umamba and treats him as a royal child whose marriage should take precedence.
    Later, a bride from another country chooses Unsimba, while her sister repeatedly
    points out Umamba as her preferred man despite attempts to redirect her choice
    to Unsimba.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father of Unsimba says that if the medicine by which a woman killed the
    children is found, it should be brought to him so he may take it and touch her,
    causing her to die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father observes that human children died, while the snake is not dead,
    and says he does not know whether they were killed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Unsimba and Umamba are grown, maidens come to choose husbands; some name
    Unsimba, and others come for Umamba.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When maidens see that Umamba is a snake, they flee and say they thought he
    was a real man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father is troubled by the maidens' fear because he loves Umamba, and he
    says Unsimba shall not marry before Umamba because Umamba is his superior.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Unsimba laughs at the rejection of Umamba by the girls, and the mother of
    Umamba says the father is only joking about preventing Unsimba's marriage because
    of a deformed rival.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Two damsels come from another country to choose a husband; one is the companion
    or sister of the other, and the bride names Unsimba.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father agrees that Unsimba may marry; cattle are killed, and many people
    gather because the king's child is an elected bridegroom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the evening young men come into the house so the damsels can point out
    those they like best; Umamba also enters, and the damsels flee screaming to the
    upper end of the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king and people in the house tell the damsels not to run away because
    Umamba is the king's child; Umamba takes his mat and sits on it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the damsels ask how Umamba became a snake, people answer that his mother
    lost her children by death and that at last he was born.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: During the choosing, the bride's sister points out Umamba as her favourite,
    while young men repeatedly say she means Unsimba; she repeatedly answers that
    she means Umamba.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Unsimba dislikes his sister-in-law pointing out Umamba and wishes her to point
    out himself.
  category: attribute
  evidence_refs:
  - ev:6
