  quote: ''
  summary: 'The passage first describes Isitshakamana as a small round being and notes
    a human child named Usitshakamana. It then gives reports about Utikoloshe: a short
    hairy creature associated with pools or rivers, dances, women, firewood carrying,
    milk theft, household disruption, deformity of a boy, and a wedding-dance episode
    involving Ugilikak^wa, identified in a note as Utikoloshe.'
