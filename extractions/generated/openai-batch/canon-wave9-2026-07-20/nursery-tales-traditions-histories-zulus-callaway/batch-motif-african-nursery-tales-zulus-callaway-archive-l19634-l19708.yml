canonical_text:
  quote: He threw the bread on the lower side of the path, and so went on no longer
    burdened.
  summary: A man begins a journey carrying more bread than he can eat. After becoming
    full, he discards the remaining bread beside the path instead of saving it for
    future hunger or another hungry person. Mice eat the abandoned bread. Later, during
    famine, he returns by the same way, remembers the bread, identifies the place
    where he threw it away, and searches unsuccessfully for it in the thick grass.
    The excerpt also contains an editorial footnote comparing a fable in the surrounding
    passage to “the Boar and the Herdsman.”
  language: English with a brief Zulu heading/original fragment
