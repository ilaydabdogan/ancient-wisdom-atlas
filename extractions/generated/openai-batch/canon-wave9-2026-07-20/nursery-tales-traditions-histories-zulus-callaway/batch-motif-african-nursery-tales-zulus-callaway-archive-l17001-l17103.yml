canonical_text:
  quote: ''
  summary: Udalana questions Untombi-yapansi during garden watching. Untombi-yapansi
    conceals a brass-coloured body with a smear. She goes to bathe at the river while
    Udalana secretly follows and watches. After bathing, Untombi-yapansi emerges glistening
    with a brass rod, strikes the ground, commands the earth to open, and summons
    her father’s things, people, cattle, and food. She adorns herself, mounts an ox,
    sings, and the people and trees join the song. She then commands everything to
    sink back into the earth, smears her body again, and returns to the garden.
  language: English with Zulu names and song fragments
  quote_policy: summarized
