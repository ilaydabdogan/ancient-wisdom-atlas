canonical_text:
  quote: ''
  summary: A group described as beautiful people and apparent children of one man
    stand at a gateway. Their mother comes out. They strike an ox named Umpengempe
    and repeatedly recite that they are seeking their mother, who gave birth to them
    but did not nourish them; they say they ate earth and grew and identify themselves
    as children of Ulubundubundu-a-ba-lu-vume. The mother is distressed and hears
    their words as if directed to her. People assemble, the king is called, and the
    ox-and-speech sequence is repeated before him. The passage then turns to questioning
    of the grandmother about where she found them.
  language: English
  quote_policy: summarized
