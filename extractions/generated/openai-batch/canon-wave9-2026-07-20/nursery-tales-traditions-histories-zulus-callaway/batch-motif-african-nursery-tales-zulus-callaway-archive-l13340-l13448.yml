canonical_text:
  quote: ''
  summary: An old woman fetching water finds a child playing near the river and brings
    the king's chief wife to see her. The queen joyfully has the child taken, washed,
    carried home, suckled, and raised with her own son. The girl grows up, is appointed
    chief of the girls at a feast, and is later proposed as a wife for the queen's
    son. The young man refuses because he regards her as his sister through shared
    nursing. An old woman then tells the girl that she was taken from a valley and
    brought up by the queen. The girl grieves, goes to the river with a water-pot,
    refuses food, and returns to the river weeping the next morning.
  language: English
  quote_policy: summarized
