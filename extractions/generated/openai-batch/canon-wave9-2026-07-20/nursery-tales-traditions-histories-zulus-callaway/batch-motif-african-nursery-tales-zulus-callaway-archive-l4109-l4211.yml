canonical_text:
  quote: ''
  summary: A childless woman is told she can have a child after giving castor-oil
    berries to unnamed figures and being scarified on the loins. She becomes pregnant
    and bears Unthlatu, a beautiful human son, while rival wives are described as
    bearing animals or crows. She hides him in a sewn boa skin to prevent the co-wives
    from killing him. Unthlatu later leaves without telling his mother; she searches
    in vain, keeps his house standing, and regularly leaves food there, of which a
    little is eaten. Damsels who come to marry say they seek Unthlatu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother states that she has no children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unnamed interlocutors ask what she will give them if they tell her that she
    shall have a child.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: She offers all she has, but the interlocutors reject this and request a vessel
    or pot full of castor-oil berries; she breaks the pot outside, the seeds scatter,
    and they eat all the seeds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The interlocutors tell her to turn her back, scarify her in two places on
    the loins, say she will now have a child, and she later becomes pregnant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Her pregnancy is a cause of rejoicing because she had long been reproached
    with barrenness and had lost status in the kraal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The other wives are described as giving birth to crows, whose actions scatter
    the ashes in Unthlatu’s mother’s house.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:7
  text: When Unthlatu is born, his mother sees him as a very beautiful child and puts
    a sewn boa’s skin from her own people on him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Unthlatu’s mother conceals him so that the wives who share her husband might
    not kill him; the text contrasts her human son with their animal offspring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Unthlatu leaves independently without telling his mother; she searches for
    him in vain, but his house is kept standing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: His mother regularly places beer, meat, and other food in his house; in the
    morning, a little of each has been eaten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Damsels who come to marry are asked whom they seek, and they answer that they
    come to Unthlatu.
  category: speech
  evidence_refs:
