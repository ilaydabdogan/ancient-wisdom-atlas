  quote: ''
  summary: The preface discusses orthographic choices for writing Zulu, especially
    the representation and origin of click sounds. The author cites Max Müller, Dr.
    Bleek, Kolben, Lepsius, Grout, and Dohne, notes disagreement over whether clicks
    were borrowed from Hottentot languages, describes consonantal combinations associated
    with Zulu clicks, and reports differing views on whether click signs should precede
    or follow associated consonants.
