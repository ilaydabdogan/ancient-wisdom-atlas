canonical_text:
  quote: ''
  summary: Usikulumi comes alone to Uzembeni's daughters after leaving his dogs in
    reeds. The daughters hide him in a covered pit inside the house. Uzembeni, also
    called Long-toe, returns, detects a pleasing smell in the house, and questions
    the daughters, who deny knowing anything. After Uzembeni goes hunting the next
    morning, one daughter leaves with Usikulumi while an injured daughter remains
    behind. The fleeing pair retrieve the dogs and travel day and night in fear of
    being caught.
  language: English
  quote_policy: summarized
