canonical_text:
  quote: ''
  summary: A traveling man reaches a group of izingogo at a river bank, imitates them,
    and is accepted by the old ones despite the young ones' suspicion that he has
    human features. At their kraal, where an old grandmother lives, hunting parties
    leave and return. The newcomer claims stomach pain, remains behind, sends the
    young ones to fetch water with a leaking vessel, then kills the grandmother and
    removes her liver.
  language: English translation with Zulu terms
  quote_policy: summarized
