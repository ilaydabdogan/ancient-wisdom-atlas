canonical_text:
  quote: ''
  summary: Uthlakanyana crosses a river, lures a hare with talk of tales, catches
    and eats it, and makes a whistle from one of its bones. An iguana later persuades
    him to lend the whistle, refuses to return it, strikes him with its tail, and
    escapes into deep water with it. Uthlakanyana then steals hidden bread from an
    old man, hides in a snake’s hole, misleads the old man into pulling a root, eats
    the bread, and continues on. He comes to a leopard’s cubs, placates the angry
    mother leopard with flattery and offers to care for the cubs and build a house.
    The passage ends as he begins arranging how the leopard should suckle the cubs.
  language: English
  quote_policy: summarized
