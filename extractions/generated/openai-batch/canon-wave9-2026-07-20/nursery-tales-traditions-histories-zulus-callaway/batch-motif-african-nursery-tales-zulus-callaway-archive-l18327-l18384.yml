canonical_text:
  quote: "“At length we see the country.”"
  summary: An elephant, ill after swallowing a woman and many beings, dies. The woman
    cuts open the elephant, and a cow, a goat, a dog, and people emerge. The woman
    receives livestock gifts and returns home with her children, where her little
    girl is alive. The passage also begins the next tale, stating that an eastern
    king has many daughters and that a strange thing happens to the youngest when
    the daughters bathe.
  language: English with a short Zulu/parallel-text fragment
  quote_policy: quoted
