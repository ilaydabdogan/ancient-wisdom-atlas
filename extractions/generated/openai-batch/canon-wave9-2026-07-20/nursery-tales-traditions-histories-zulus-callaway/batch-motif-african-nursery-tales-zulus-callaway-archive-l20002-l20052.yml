  summary: A riddle fragment describes an unnamed chief or king whose people dispute
    his authority because he appears to do nothing. He warns that if he merely sits
    and looks down, the land will become desolate and the people will suffer blindness,
    falls, beasts, and famine. The people acknowledge him so that they may live, and
    the country is peaceful. The passage also says his slight illness troubles the
    whole nation and begins a separate truncated riddle about a fleshless, uncuttable
    bullock.
