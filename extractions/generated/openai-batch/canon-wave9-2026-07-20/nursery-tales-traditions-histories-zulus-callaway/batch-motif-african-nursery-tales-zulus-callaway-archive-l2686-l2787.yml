canonical_text:
  quote: ''
  summary: A king with many sons fears that his sons will grow up and depose him,
    so old women are appointed to kill each male child born to him. When Usikulumi
    is born, his mother conceals him, gives presents to the old women, and persuades
    them to spare him and take him to his maternal uncle. They suckle the child and
    leave him there. As a young man at his uncle’s kraal, Usikulumi herds cattle,
    is honored by the other boys, and directs them to heat stones, choose and kill
    a calf, and roast it. His father’s officers later encounter him, note his resemblance
    to their king, and take him to his father. Editorial notes explain names, compare
    the tale to Greek myths of feared children exposed by parents, and comment on
    heated-stone cooking.
  language: English
  quote_policy: summarized
