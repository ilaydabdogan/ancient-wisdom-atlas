  quote: ''
  summary: Uluthlazase, a princess, becomes queen and governs with young girls who
    had not abandoned her. Her father slaughters cattle to make her glad because she
    had been carried away by the Isikyukgumadevu. The fathers of the damsels thank
    a man who took their children out of the Isikyukgumadevu and killed it. The Isikyukgumadevu
    is described as a long, large, hairless animal that swallowed young girls without
    eating them.
