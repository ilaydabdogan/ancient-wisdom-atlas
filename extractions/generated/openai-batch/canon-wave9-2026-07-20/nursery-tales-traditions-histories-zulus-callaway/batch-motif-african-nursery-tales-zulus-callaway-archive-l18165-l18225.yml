canonical_text:
  quote: "“He swallowed them both, and left the little child.”"
  summary: A woman named Unanana-bosele, mother of two young children, has deliberately
    built her house in the road. When she goes to fetch firewood, a baboon, an antelope,
    and other animals come to the house and ask whose beautiful children are there.
    A very large elephant repeats the question, remarks on Unanana-bosele’s building
    in the road, swallows the two children, leaves the other child, and goes away.
    The mother returns and learns from the little girl that an elephant with one tusk
    has taken them.
  language: English
  quote_policy: quoted
