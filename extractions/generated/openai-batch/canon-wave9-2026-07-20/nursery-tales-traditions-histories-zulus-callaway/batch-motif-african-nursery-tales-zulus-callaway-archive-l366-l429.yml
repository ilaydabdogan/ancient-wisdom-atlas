  quote: ''
  summary: The preface discusses editorial and orthographic choices for representing
    Zulu in writing. It argues for separating words, compares the difficulty of unseparated
    writing with old manuscripts and Cuneiform inscriptions, cites Max Müller on the
    usefulness of word-separating signs, explains decisions about compounds, prepositions,
    possessive particles, genitive forms, capitalization, and phonetic spelling, and
    notes the difficulty of reaching a universal alphabet.
