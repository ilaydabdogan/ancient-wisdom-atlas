canonical_text:
  quote: ''
  summary: The passage recounts Uthlakanyana’s extraordinary birth. His father orders
    everyone out of the hut because the child has already spoken while still with
    his mother. Once born, the child stands, refuses his mother’s help, cuts himself
    with his father’s spear, and is washed. He enters the cattle-kraal, frightening
    the men, sits by the fire, and eats meat. The men return, praise his wisdom, and
    suggest he is fit to be the great child among the king’s children. Uthlakanyana
    then proposes a test of manhood involving a leg of beef thrown below the kraal.
  language: English
  quote_policy: summarized
