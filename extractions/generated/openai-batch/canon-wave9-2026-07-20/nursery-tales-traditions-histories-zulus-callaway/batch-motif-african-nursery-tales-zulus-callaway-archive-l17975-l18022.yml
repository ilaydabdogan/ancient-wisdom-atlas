canonical_text:
  quote: ''
  summary: Unthlamvu-yetusi pulls at Umamba as instructed, removes a skin, and sees
    that he is a beautiful human being with a glistening body. Umamba explains that,
    after his mother had lost previous children, he was put into the skin of a small
    imamba at birth so that others believed he was a snake. He asks Unthlamvu-yetusi
    not to reveal that he is a man. He says that on other days his lad anoints him
    with fat and removes the skin. The passage then shifts to preparations for the
    damsels to return to their fathers with their lovers, including the selection
    of twenty cattle.
  language: English
  quote_policy: summarized
