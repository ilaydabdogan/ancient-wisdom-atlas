canonical_text:
  quote: ''
  summary: The passage continues a tale in which Uselesele, identified as a frog-man,
    is ceremonially brought home, fed, and rewarded by a king with black hornless
    cattle and people. Uselesele builds a great town, feeds many people, takes followers
    under his protection, and becomes a king. A second episode reports that Unkosi-yasenthla
    hears of Umdhlubu, the beautiful daughter of Unkosi-yasenzansi, and sends trusted
    emissaries to inspect and choose a suitable queen. They select Umdhlubu above
    the other daughters, causing shame and hostility among those not chosen and rejoicing
    in Umdhlubu's house.
  language: English with Zulu names and brief Zulu text
  quote_policy: summarized
