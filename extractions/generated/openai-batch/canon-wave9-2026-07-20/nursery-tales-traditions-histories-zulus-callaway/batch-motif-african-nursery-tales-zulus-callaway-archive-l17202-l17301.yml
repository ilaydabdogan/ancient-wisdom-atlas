canonical_text:
  quote: "“Open, earth, that my father’s things may come out, and my father’s people,
    and his cattle, and my things.”"
  summary: A chief secretly watches Untombi-yapansi, who is living under the name
    Umsila-wezinja. In the garden she uses a charm to drive away birds and partly
    reveals her true identity. At the river, after bathing, she appears with a brass-like
    body and a brass rod, commands the earth to open, and brings forth her father’s
    possessions, people, cattle, and her own things. She dresses, mounts an ox, sings,
    and the people and trees join. The chief comes out after the things sink back
    into the ground, reassures her, and takes her and Udalana toward the garden.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Udalana, described in the passage as Untombi-yapansi’s sister while Untombi
    later denies that she is truly her sister, says that birds trouble the garden
    and asks Umsila-wezinja to watch them so they do not destroy her corn.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief goes to the garden by another way and hides in the corn before Udalana
    and Untombi-yapansi arrive to watch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Untombi-yapansi looks at her legs and sees that dew is beginning to wash off
    the substance with which she had smeared herself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the birds come, Udalana tells Umsila-wezinja to scare them, and Untombi-yapansi
    speaks to the birds, saying that she became Umsila-wezinja but used to be Untombi-yapansi;
    the birds go away immediately.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Untombi-yapansi says she is going to bathe at noon; the chief and Udalana
    also go to the river and hide in the underwood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Untombi-yapansi enters the pool and comes out with her body glistening like
    brass and with a brass rod.
  category: attribute
  evidence_refs:
