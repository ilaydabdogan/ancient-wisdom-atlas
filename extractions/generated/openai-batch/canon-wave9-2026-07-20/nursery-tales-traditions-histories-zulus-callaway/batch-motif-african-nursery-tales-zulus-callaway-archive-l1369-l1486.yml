canonical_text:
  quote: ''
  summary: Uhlakanyana tells his mother that he is very old, not her child, and not
    the child of the man she lives with. He announces that he will leave and travel
    over the whole world. After the pot is opened, his mother finds dung at the bottom
    and bird heads at the top; Uhlakanyana eats the remaining heads and leaves. He
    goes to a cannibal's traps, removes birds, is caught by birdlime set by the cannibal,
    and bargains not to be killed or beaten, asking to be cleaned and taken home.
    Editorial notes compare his precocious speech and intrusive household presence
    with European examples of preternatural or demonic children.
  language: English
  quote_policy: summarized
