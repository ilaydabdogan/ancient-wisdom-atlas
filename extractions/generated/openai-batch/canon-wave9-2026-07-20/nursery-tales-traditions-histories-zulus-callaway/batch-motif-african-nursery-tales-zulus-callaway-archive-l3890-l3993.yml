canonical_text:
  quote: ''
  summary: Untombinde is visited at night by Untlilatu, who has remained unseen and
    has prevented her from lighting a fire. On the third visit he asks her to feel
    his body, receives snuff, spits, and his spittle speaks praises naming him king
    and chief, black and as large as mountains. He then permits her to light the fire;
    she sees a shining body and is afraid. He says he lives underground and explains
    that he left as a child because of his brethren.
  language: English
  quote_policy: summarized
