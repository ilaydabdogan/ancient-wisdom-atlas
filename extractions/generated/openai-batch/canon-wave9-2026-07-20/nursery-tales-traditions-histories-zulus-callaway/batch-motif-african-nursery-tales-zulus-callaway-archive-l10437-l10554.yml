canonical_text:
  quote: ''
  summary: Umkasakaza has remained for a very long time hidden in the umgongo and
    is known only to the damsels who guard that seclusion. Before her expected emergence,
    the people go to a distant royal garden, leaving Umkasakaza and her sister Ubalatusi
    at home. After thunder and earth movement, Ubalatusi sees a forest blocking the
    village entrance and the fence broken. Strange guests, later called leaves, enter
    the house and command Ubalatusi to fetch water; she fills a vessel at the river
    but cannot leave. The leaves then command Umkasakaza to fetch water and to light
    a fire. An editorial note compares the speaking-tree element with other traditions.
  language: English
  quote_policy: summarized
