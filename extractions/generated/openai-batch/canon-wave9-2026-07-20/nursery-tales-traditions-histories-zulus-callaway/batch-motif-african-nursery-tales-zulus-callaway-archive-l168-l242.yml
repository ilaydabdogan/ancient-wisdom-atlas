canonical_text:
  quote: ''
  summary: The passage quotes Elizabeth Cookson on popular tales, songs, creeds, and
    superstitions as evidence for earlier modes of thought. The preface author then
    applies this framework to Zulu tales, arguing that they indicate both a lost higher
    condition and evidence of intellectual and tender feeling. The author explains
    the practical value of such lore for language study, missionary work, and translation,
    asks for support for publication, announces a forthcoming section on the Zulu
    notion of the Origin of Things, and thanks helpers.
  language: English
  quote_policy: summarized
