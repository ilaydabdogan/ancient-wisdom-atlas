  quote: ''
  summary: A town is completed for the queen. The king visits, cattle are killed for
    the soldiers, and the king goes to live at the new town, taking Umdhlubu as his
    wife. The people of Umdhlubu’s father return home and report that all has gone
    well, including cattle for Umdhlubu’s mother from her son and respects sent to
    both parents. The passage closes with everyone living together in peace.
