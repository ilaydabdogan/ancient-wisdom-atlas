  quote: the bird slipped from him who held it, and flew away with a whir
  summary: A father secretly keeps and eats amasi from a covered pot associated with
    a bird. His children discover the food, watch his nocturnal eating, eat the amasi
    themselves, and let the bird escape. When the father finds the bird gone and the
    amasi reduced, he questions and beats the children for losing his titbit.
