canonical_text:
  quote: ''
  summary: The passage presents an account, framed under cannibalism, of warfare between
    rival chiefs. A chief orders his army to capture an enemy chief alive so that
    he may leap over him. Spies reveal the captive’s hiding place; the captured chief’s
    army loses courage and scatters. The victorious chief, fearing the captive’s medicines
    or prestige, calls a doctor to strengthen him, then leaps over the captive repeatedly,
    kills him, sits upon the corpse, and cuts small portions from the whole body.
  language: English, with Zulu headings and phrases
  quote_policy: summarized
