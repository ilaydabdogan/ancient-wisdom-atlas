canonical_text:
  quote: ''
  summary: After Umkxakaza-wakoginggwayo returns to her parents, her father summons
    the people to celebrate. Beer is made throughout the land, cattle are brought
    and killed, and her parents mark the occasion by changing their hair ornaments.
    Chiefs come to seek her as a wife, but her father refuses because she has only
    just returned after being carried off by a beast. A distant chief sends an old
    man; when the man reaches the town entrance he becomes a beautiful, glistening
    frog. Umkxakaza and others admire the frog, and she decides to follow it with
    attendants carrying food and her possessions. The passage heading states that
    the frog becomes an old man again and proves treacherous.
  language: English
  quote_policy: summarized
