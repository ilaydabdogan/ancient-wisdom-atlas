canonical_text:
  quote: ''
  summary: Umkxakaza travels with a frog that becomes a man and says he is taking
    her to his chief. In a forest the man leaves the path, decides not to deliver
    her to another man, and calls wild beasts. Umkxakaza hides her belongings inside
    her opened head, climbs a tree whose branches close behind her, and escapes while
    the beasts seize the old man instead. She rejoins him with an enlarged head. At
    the chief's village she is presented as a possible wife, rejected by many because
    of her head, defended by the chief's sister, and invited by that sister to attend
    a dance.
  language: English
  quote_policy: summarized
