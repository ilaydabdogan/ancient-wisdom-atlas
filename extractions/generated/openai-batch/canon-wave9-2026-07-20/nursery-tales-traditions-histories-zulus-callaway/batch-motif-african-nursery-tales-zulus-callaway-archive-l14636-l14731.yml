canonical_text:
  quote: ''
  summary: A dispute is described over whether a daughter born to Unsukuzonke's mother
    belongs to Unsukuzonke's house or to Ubabazeleni's house. Uzita explains that
    because the mother was taken to wife by cattle from Ubabazeleni's house, the daughter
    belongs there, while later-born children belong elsewhere according to house order.
    Unsukuzonke repays the cattle and thereby removes himself from his position next
    after Ubabazeleni. Unsilane is installed in that position, Umatongo's later claim
    is rejected, and the passage states general rules for inheritance and headship
    among ranked houses in a polygamic household.
  language: English
  quote_policy: summarized
