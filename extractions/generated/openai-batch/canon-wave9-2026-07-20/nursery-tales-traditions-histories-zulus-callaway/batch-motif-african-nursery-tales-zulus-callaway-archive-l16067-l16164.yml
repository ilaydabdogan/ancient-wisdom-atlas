canonical_text:
  quote: ''
  summary: After a serpent has been killed, the Dutch tell the black men that such
    a serpent should not be killed when alone because the pool may dry up. The black
    men say they killed an unfamiliar animal from the water and wanted its head for
    medicine. The Dutch warn them, then go by night to the pool on horseback. Two
    snakes emerge from the pool, fire blazes when one appears, and the Dutch shoot
    at it. The snake pursues the mounted men, selects two horses in the fleeing group,
    and is later struck by a Dutchman's shot as the men discuss the flame and regrouping.
  language: English
  quote_policy: summarized
