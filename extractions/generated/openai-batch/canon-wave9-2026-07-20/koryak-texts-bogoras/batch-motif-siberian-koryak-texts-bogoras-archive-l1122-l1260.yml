candidate_motifs:
- id: motif:1
  label: Devourer compelled to self-consume
  taxonomy_refs: []
  basis: The being first consumes a child and is then ordered by Big-Raven to eat
    its own body, which it does until death.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not identify the being or explain the wider cosmological
    meaning of the self-consumption.
- id: motif:2
  label: Fire offering before entry of returnees
  taxonomy_refs:
  - sacrifice
  basis: The returning newcomers ask for the fire, the women bring it out, and the
    fire is explicitly fed with sacrifice before the newcomers enter.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not specify the substance offered or the ritual context
    beyond the brief statement.
- id: motif:3
  label: Return followed by settled dwelling
  taxonomy_refs:
  - return
  basis: Two figures come back, and afterward the people stop going to the open country
    and remain at home.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The earlier departure narrative is outside this extracted passage, so
    the full return cycle is only partially visible.
- id: motif:4
  label: Animal transformation from mouse to wolverene
  taxonomy_refs:
  - shapeshifter
  basis: Eme'mqut finds and loads a dead mouse, then looks back and sees that it has
    turned into a wolverene.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The transformation is stated, but no agency, speech, or voluntary shape-changing
    is described.
- id: motif:5
  label: Shamed wife departs, gives birth outside, and returns
  taxonomy_refs:
  - departure
  - return
  basis: Fox-Woman leaves after shame, gives birth outside in the open country, and
    is brought home by Eme'mqut.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: This is a domestic narrative sequence; the passage does not mark the births
    as sacred or supernatural.
- id: motif:6
  label: Craft objects become children's clothing
  taxonomy_refs: []
  basis: Fox-Woman's leather thimbles, previously hung outside, become clothes for
    her numerous children.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says the thimbles 'turned somehow' to clothes but gives no
    mechanism or agent.
- id: motif:7
  label: Rejected refugees in cave forced upward by flood
  taxonomy_refs:
  - flood_and_renewal
  - ascent
  basis: After rejection, the Ermine-People live in a cave, are caught by a flood,
    and have to climb upward.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Only flood and upward movement are present; renewal or survival outcome
    is not elaborated in this brief episode.
- id: motif:8
  label: Rejected birth-feast exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Meat from a birth-feast is carried to Big-Raven's people, who reject the
    messenger and throw the meat to dogs.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The exchange is ceremonial around birth, but the passage does not explicitly
    call it sacred.
- id: motif:9
  label: False invitation leading to communal rejection
  taxonomy_refs: []
  basis: An Ermine-Man lies that Big-Raven's people invited the Ermine-People; when
    they arrive, they are beaten and rejected.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No broader trickster identity is stated for the lying Ermine-Man.
