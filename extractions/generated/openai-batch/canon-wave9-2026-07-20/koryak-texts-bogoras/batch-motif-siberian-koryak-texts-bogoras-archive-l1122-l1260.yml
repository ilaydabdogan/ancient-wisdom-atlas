canonical_text:
  quote: They fed the fire (with sacrifice). Then only did the new-comers enter.
  summary: 'The passage includes the end of one tale in which Big-Raven causes a devouring
    being to consume itself and die, followed by a return scene involving extinguished
    fire and fire-sacrifice. It then gives the tale of Eme''mqut and Fox-Woman, including
    a mouse that becomes a wolverene, Fox-Woman''s shame and secret outside childbirth,
    and a reconciliation. Two Ermine-People episodes follow: one about a false invitation,
    rejection, cave refuge, and flood-driven climbing; another about a birth, a search
    for an axe to cut the navel-string, and rejected birth-feast meat sent to Big-Raven''s
    people.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed being approaches and licks the supports of a platform; Big-Raven
    cuts at its tongue with a hatchet and an axe, and both tools become jagged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Big-Raven's instruction, Grass-Woman drops their small son into the being's
    mouth, and the being spits out broken bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Big-Raven tells the being to eat its own body; it consumes its toes, legs,
    body, arms, and shoulders until only the neck or throat is left, then dies and
    is burned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the fire has gone out and the people are sitting in the dark, Yini'a-na'wgut
    and her sister stop up the smoke-hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two newcomers return, one apparently carrying a little son; they ask for the
    fire, the women carry it out, and the fire is fed with sacrifice before the newcomers
    enter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the return, the people cease going to the open country, lose the desire
    to roam, and stay at home in one place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eme'mqut finds a dead mouse at a blubber-bag, loads it on his sledge, and
    later sees that the mouse has become a wolverene.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fox-Woman beats the drum and sings words identifying herself as unskilful
    and untidy; the narration also associates foxes with eating snowshoe strings by
    full moon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fox-Woman leaves in shame, later appears outside with many children, and says
    she had wanted to give birth in the open country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Leather thimbles previously made and hung outside by Fox-Woman become clothes
    for her numerous children; she is described as a skilful seamstress.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After reconciliation, the household lives joyfully, catches winter fish when
    ascending the river, returns to house-mates, and kills plenty of game.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An Ermine-Man falsely says Big-Raven's people asked the Ermine-People to live
    with them; when the Ermine-People come to that house, they are beaten and rejected.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After rejection, the Ermine-People decide to live in a cave, are caught by
    a flood, and have to climb upward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In a second Ermine-People episode, Ermine-Woman gives birth to a son, and
    an axe is obtained so the navel-string can be severed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Birth-feast meat is sent to Big-Raven's people; the messenger is insulted,
    the meat is thrown to the dogs, and the empty dish is returned, with a later repetition
    ending in Big-Raven throwing her out with the dish.
  category: sequence
  evidence_refs:
  - ev:10
