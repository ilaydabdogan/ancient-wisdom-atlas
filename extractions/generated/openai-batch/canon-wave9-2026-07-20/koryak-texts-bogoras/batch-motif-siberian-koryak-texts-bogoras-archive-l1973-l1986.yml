canonical_text:
  quote: '"The suitor came first to me!"'
  summary: K'ilu' returns to the village and reports that a kamak devoured her cousin.
    The villagers go to look and see two people walking together, including a very
    good young man. They tell K'ilu' that he would have married her if she had not
    run away. Kilu' falsely boasts that the suitor came first to her, and she envies
    Yini'ana'wgut because Yini'ana'wgut has the husband and is married instead of
    her.
