  quote: ''
  summary: The passage contains the end of one tale, where a girl falsely attributes
    a lost tooth to a heavenly arrow but is exposed as having gnawed a pudding, and
    a tale titled “How a Small Kamak was transformed into a Harpoon-Line,” in which
    a hungry small kamak ignores his mother’s warnings, is caught by Big-Raven, made
    into a thong or line, warns against one theft attempt, and is later stolen by
    people from down the coast.
