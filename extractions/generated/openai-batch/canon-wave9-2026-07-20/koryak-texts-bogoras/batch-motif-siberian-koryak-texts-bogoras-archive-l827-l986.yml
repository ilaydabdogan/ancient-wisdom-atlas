  locator: 878-895
  quote_or_summary: Big-Raven asks for soup, eats a kettleful, asks Miti' for the
    big hammer, swallows it, goes to the kamak house, vomits through the vent-hole,
    fills the house, and kills the big kamak with the hammer.
