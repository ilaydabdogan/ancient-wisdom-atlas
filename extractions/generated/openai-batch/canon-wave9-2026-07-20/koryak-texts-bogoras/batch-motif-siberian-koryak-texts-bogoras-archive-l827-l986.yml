canonical_text:
  quote: ''
  summary: 'The passage contains several Koryak narrative episodes: Eme''mqut retrieves
    a stolen line by entering a wooden whale; Big-Raven is eaten by kamaks and returns
    as a shaman, then kills a big kamak; Eme''mqut marries a Bumblebee-Woman, whom
    Kilur later kills, causing eggs and fishermen to become bumblebees; and Eme''mqut''s
    people hold a whale thanksgiving festival where Magpie-Women and Fox-Women dance
    and are shamed by songs revealing scavenging or pilfering behavior.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A line has been taken away, and Big-Raven identifies people living down the
    coast as the thieves; Eme'mqut says the line will be brought back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eme'mqut makes a wooden whale, enters it, travels to the people down the coast,
    and is regarded by them as an unusual good whale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The whale-hunters attack the wooden whale with a harpoon and new line; a small
    kamak bites into it; Eme'mqut speaks to the kamak, distracts the hunters with
    berries, flees home, and carries away the new line.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the line is recovered, it is kept in the inner room so others cannot
    steal it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Big-Raven slides down the largest mountain into the porch of the kamaks' house;
    small kamaks call him human game, and he says he is a man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
