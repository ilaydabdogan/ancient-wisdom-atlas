- id: ev:5
  type: summary
  locator: 896-918
  quote_or_summary: In 'Kilur and the Bumblebees,' Eme'mqut lives with his people,
    marries Kilur, and is childless; he follows a river upstream, finds resplendent
    people fishing with drag-nets, learns they are Bumblebee people, marries a Bumblebee-Woman,
    and she bears many children.
  source_text_path: texts/public-domain/siberian/project-gutenberg/koryak-texts-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 919-929
  quote_or_summary: Kilur becomes restless, follows the river upstream, sees Eme'mqut
    among the fishermen, tramples his new wife to death, and the scattered fly-eggs
    become bumblebees; the fishermen also turn to bumblebees, and Eme'mqut goes home.
  source_text_path: texts/public-domain/siberian/project-gutenberg/koryak-texts-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 930-941
  quote_or_summary: In 'Eme'mqut's Whale-Festival,' Eme'mqut and his people kill a
    whale, bring it home, arrange a thanksgiving ceremonial, gather reindeer-breeding
    people and Magpie-Women, and ask Magpie-Woman to dance; her song concerns other
    people's wallets, and Kilur says the wallets are found half-eaten.
  source_text_path: texts/public-domain/siberian/project-gutenberg/koryak-texts-bogoras.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 942-971
  quote_or_summary: Fox-Woman is invited to dance and sings about a knife and eating
    whale-skin; Big-Raven says they sing about feeding at others' expense. Another
    Fox-Woman sings about eating hard excrements and gnawing snowshoe-strings; Eme'mqut
    confirms the gnawed strings and she leaves ashamed.
  source_text_path: texts/public-domain/siberian/project-gutenberg/koryak-texts-bogoras.md
  rights_note: Public domain source; summarized.
