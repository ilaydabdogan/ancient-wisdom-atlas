canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Gull-Woman and then Cormorant-Woman
    are swallowed whole by kamak figures and cut their way out from inside, followed
    by editorial notes on role confusion and revival. It then gives the tale of Yini'a-na'wgut
    and Kilu', in which fish bones, claims of becoming a kamak, sleep, and awakening
    lead to marriages with Fish-Men and abundant fishing. The passage ends with the
    opening of a tale in which Big-Raven walks on a sand-spit, rejects several sea
    mammals by throwing or kicking them back into the water, and finally approves
    a striped whale.
  language: English
  quote_policy: summarized
