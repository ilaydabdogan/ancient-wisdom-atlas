- id: motif:2
  label: dangerous imitation of a prior escape feat
  taxonomy_refs: []
  basis: Cormorant-Woman deliberately seeks the same swallowing experience as Gull-Woman,
    despite lacking a knife, and substitutes her nails as the cutting tool.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: This is a local narrative pattern within the passage rather than a mapped
    taxonomy item.
- id: motif:3
  label: revival or return after killing of kamaks
  taxonomy_refs:
  - resurrection
  basis: An editorial note states that both Kamaks seem to have revived after being
    killed.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The editor explicitly notes confusion in the tale's roles; the revival
    is not narrated in a clear continuous sequence.
- id: motif:4
  label: marriage with Fish-Man and resulting fish abundance
  taxonomy_refs:
  - sacred_marriage
  - sacred_exchange
  basis: Yini'a-na'wgut and Kilu' each marry Fish-Man, and the couples are associated
    with catching plenty of fish and successful fishing.
  evidence_refs:
