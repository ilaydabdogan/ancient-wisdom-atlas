- id: motif:5
  label: false or reported transformation into kamak leading to changed status
  taxonomy_refs:
  - trickster_boundary
  basis: Kilu' first reports that Yini'a-na'wgut became a kamak, then arranges and
    pretends the same condition for herself; Fish-Man names Kilu's case as pretension.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  confidence: medium
  cautions: The term kamak is not defined in the passage, and the exact boundary crossed
    is not fully explained here.
- id: motif:6
  label: departure and return with nonhuman spouse
  taxonomy_refs:
  - departure
  - return
  basis: Both Yini'a-na'wgut and Kilu' go away from Big-Raven's house, undergo the
