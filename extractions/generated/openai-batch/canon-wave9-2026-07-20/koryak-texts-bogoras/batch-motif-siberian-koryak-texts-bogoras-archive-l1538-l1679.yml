canonical_text:
  quote: ''
  summary: The passage narrates a daughter given to a kamak after a divinatory or
    riddle-like exchange, her journey with animal-drawn sledges, her armed defeat
    of kamaks, her later swallowing by the same spirit and escape by cutting him open
    from inside, and her return to Big-Raven's people. It then gives a tale in which
    a kamak and his wife demand blubber, threaten to eat people, fail to follow the
    people when they escape upward on an arrow-road, and die grotesquely at a roof
    vent. The passage ends with the opening of a tale about Gull-Woman, Cormorant-Woman,
    a cave, and Big-Kamak on the shore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An evil spirit comes out from the fire, identifies the drum as made of a small
    louse after wrong guesses, and Miti says the daughter must be given to the kamak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter is prepared for a journey with three lines of living sledges
    hauled by whales, reindeer, and white whales; she mounts a small cow and carries
    a large knife and a comb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the kamak's house, other kamaks eat the reindeer; the girl kills kamaks
    with her knife, throws down a comb that grows large, and climbs it so the remaining
    evil spirit cannot eat her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The evil spirit says that after the girl marries a man and has two children,
    he will eat her; she later marries a reindeer-breeder and bears two children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When her husband is absent, the kamak eats her; she uses a concealed woman's
    knife to cut open his body from inside, the evil spirit dies, and she comes out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The next morning a woman in the house identifies herself as the one who ate
    the mistress the previous day; a note states that the kamak became an ordinary
    human woman.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The woman's sons grow up; one son marries the woman who had been the eater,
    and the family later reaches Big-Raven's people, where the daughter is recognized
    and they live together prosperously.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In tale 18, a kamak and his wife repeatedly ask for blubber, eat it from storage
    places, and threaten to eat the people when no blubber remains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The threatened people flee upward at night by throwing an arrow upward, which
    becomes a road.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The kamak-woman uses her husband's penis as a divining-stone while considering
    possible directions in which the people fled.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The kamak pair cannot follow upward; while trying to leave through a roof
    vent, the husband carrying his wife becomes stuck in a grotesque way, and both
    die.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: The fugitives return, pull the kamak's head free with an iron hook, throw
    the bodies toward the sunset, and live without further molestation by spirits.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At the start of tale 19, Gull-Woman and her female cousin Cormorant-Woman
    sit sewing; Cormorant-Woman goes to the cave to prepare sinew-thread, while Big-Kamak
    walks along the shore and notices something white.
  category: sequence
  evidence_refs:
  - ev:12
