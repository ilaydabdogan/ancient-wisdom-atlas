candidate_motifs:
- id: motif:1
  label: Predatory spirit wins or demands a daughter
  taxonomy_refs: []
  basis: After the evil spirit correctly names the drum material, Miti says the daughter
    must be given to the Kamak, and the daughter is sent away crying.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage says the daughter is given, not stolen; the social or ritual
    context of the transfer is not fully supplied in this excerpt.
- id: motif:2
  label: Heroine escapes man-eating spirits through carried implements
  taxonomy_refs: []
  basis: The girl carries a knife and comb, kills kamaks with the knife, and uses
    the enlarged comb as a refuge from the remaining spirit.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The taxonomy supplied has no exact implement-aided flight motif; the label
    is descriptive.
- id: motif:3
  label: Swallowed person cuts out from inside the devourer
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The kamak eats the woman, but she cuts open his body from inside with a concealed
    knife, the spirit dies, and she comes out.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly say she dies before emerging; the death-rebirth
    or resurrection family is therefore only a cautious fit.
- id: motif:4
  label: Spirit transformed into human household member
  taxonomy_refs:
  - shapeshifter
  basis: After the kamak is killed, a woman appears and identifies herself as the
    one who ate the mistress; the note states that the kamak turned into an ordinary
    human woman assisting them.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The transformation is clarified by an editorial note within the passage
    rather than expanded in the narrative itself.
- id: motif:5
  label: Return from spirit abduction to kin and prosperity
  taxonomy_refs:
  - return
  basis: Big-Raven says the evil spirit took his daughter away, but she returns and
    is received; afterward they live together and grow rich.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The excerpt preserves only the return episode, not the full earlier kin
    context.
- id: motif:6
  label: Predatory visitors demand food and threaten to eat hosts
  taxonomy_refs: []
  basis: The kamak couple asks repeatedly for blubber, eats it, and says they will
    eat the people when no blubber remains.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not frame the demand as a formal hospitality contract
    or exchange.
- id: motif:7
  label: Upward escape on a magically formed road
  taxonomy_refs:
  - ascent
  basis: The people flee upward at night after an arrow thrown upward becomes a road.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The destination above is not described in this excerpt.
- id: motif:8
  label: Divination to locate fugitives
  taxonomy_refs:
  - wisdom
  basis: The kamak-woman performs divination to determine whether the fugitives went
    toward dawn, sunset, the seaside, or upward.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: medium
  cautions: The available taxonomy has no divination-specific family; the wisdom reference
    is broad.
- id: motif:9
  label: Grotesque self-defeat of predatory spirits at a house boundary
  taxonomy_refs:
  - trickster_boundary
  basis: The kamak couple attempts to leave through the roof vent and dies in a grotesque
    entanglement; the fugitives then dispose of them and are no longer molested.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The kamak pair are predators rather than explicit tricksters; the boundary
    element is literal but the trickster classification is interpretive.
- id: motif:10
  label: Animal-women in cave and shore setting
  taxonomy_refs: []
  basis: Gull-Woman and Cormorant-Woman are named as female animal-women; one goes
    to a cave, and Big-Kamak walks the shore.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: Only the opening of the tale is included, so the later motif function
    is unknown.
