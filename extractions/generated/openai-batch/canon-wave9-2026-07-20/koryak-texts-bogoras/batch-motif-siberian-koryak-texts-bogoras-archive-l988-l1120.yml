canonical_text:
  quote: ''
  summary: 'The passage concludes one tale with Raven-Woman’s dance, mockery of Magpies,
    a spoiled dog-skinning episode, and the end of a thanksgiving ceremonial. It then
    gives the tale of Eme''mqut and ila'': Eme''mqut receives ornamented tobacco-mortars
    with a warning not to look back, obeys long enough to gain a woman in a covered
    sledge and prosperity, while ila'' imitates him but repeatedly looks back and
    returns only with mortars. The next tale begins with Eme''mqut becoming cannibalistic;
    Grass-Woman discovers him eating her father Root-Man, flees with lice decoys,
    and Big-Raven’s people take refuge on a raised platform.'
  language: English
  quote_policy: summarized
