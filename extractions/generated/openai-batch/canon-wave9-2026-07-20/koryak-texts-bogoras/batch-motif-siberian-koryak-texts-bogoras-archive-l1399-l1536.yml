candidate_motifs:
- id: motif:1
  label: Food remnant transforms into sons
  taxonomy_refs:
  - miraculous_child
  - shapeshifter
  basis: Two dried perch tails turn into small men who are instructed to identify
    themselves as sons of Eme'mqut.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the transformation and filial naming, but does not describe
    conception or later life of these small men in detail.
- id: motif:2
  label: Departure by marvelous vehicle with provisions
  taxonomy_refs:
  - departure
  basis: After dried meat is packed into two bags, the departing group leaves in iron
    canoes and takes the girls along.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explain the destination or full purpose of the departure.
- id: motif:3
  label: Animal-man lover exposed in domestic chamber
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: Magpie-Man enters the sleeping-room with Miti'; Big-Raven fills the space
    with smoke, hears a Magpie voice, and the Magpie escapes through a crack.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage uses both Magpie-Man and Magpie wording, but does not explicitly
    state a transformation process.
- id: motif:4
  label: Egg-born children of ambiguous paternity
  taxonomy_refs:
  - miraculous_child
  basis: After the encounter with Magpie-Man, Miti' bears two small eggs; the children
    grow rapidly, are loved by Big-Raven, but are later called thievish magpies and
    sent toward Magpie-Man.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The text implies but does not directly state biological paternity.
- id: motif:5
  label: Social father rejects children as animal offspring
  taxonomy_refs: []
  basis: Big-Raven feeds the two sons but later calls them thievish magpies; Miti'
    instructs them to speak of another real father and takes them to Magpie-Man.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The phrase about the real father herding reindeer is reported as Miti's
    instruction to the children and should not be overread beyond the passage.
- id: motif:6
  label: Tiny parasite transformed into ritual drum
  taxonomy_refs:
  - shapeshifter
  basis: A small louse found in the daughter's clothing is not killed but made into
    a drum, and the louse turns into a drum used by Big-Raven as he acts as a shaman.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The available taxonomy has no specific shamanic-drum category; shapeshifter
    is used broadly for the louse-to-drum transformation.
- id: motif:7
  label: Bride promised for solving a material riddle
  taxonomy_refs:
  - wisdom
  - sacred_exchange
  basis: Big-Raven offers his hidden daughter to whoever can correctly state the material
    of his drum; suitors guess many materials and fail.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: No successful solution appears within this passage, and the exchange is
    social/marital rather than explicitly sacred.
