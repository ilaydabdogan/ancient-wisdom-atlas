canonical_text:
  quote: ''
  summary: The passage contains the end of an Eme'mqut episode, the tale of Miti'
    and Magpie-Man, and the beginning of a tale about Big-Raven's daughter. Eme'mqut
    fishes, marries Fox-Woman, and dried perch tails become small male sons. In the
    Miti' episode, Magpie-Man courts Miti' during Big-Raven's absence; Big-Raven discovers
    the Magpie by filling the sleeping-room with smoke. Miti' bears two eggs, the
    children are called magpies, and she takes them to Magpie-Man. The final tale
    begins with Big-Raven making a small louse into a drum, acting as a shaman, and
    offering his hidden daughter to whoever can identify the drum's material.
  language: English
  quote_policy: summarized
