  quote: "“Simply with fly-agaric (I have stunned myself).”"
  summary: The passage gives the opening of a song in which a first-person singer
    says they will sing of Qutx, Qutx's family, a wife named Alfiatva'gal, and the
    people of Ye'jmel. The singer then says they will recover their senses after being
    stunned with fly-agaric, rest, run to their sweetheart, and sing of their bad
    children. A footnote describes the phonographic-record source and Chukchee/Koryak
    linguistic context of the songs.
  language: English
