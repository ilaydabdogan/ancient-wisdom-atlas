canonical_text:
  quote: ''
  summary: 'In a Koryak narrative segment, Big-Raven takes a small ringed seal associated
    with the Mouse-Girls. Mouse-Woman and the Mouse-Girls spy on his household, use
    a magic-practiced grass bundle to make him postpone eating the meat, then steal
    the cooked meat and defile his kettle and boots. Big-Raven repeatedly tries to
    retaliate, but the Mouse-Women feed him pudding, make him sleep, and alter his
    body: first fastening red shreds to his eyelids, then painting his face with charcoal.
    The first alteration leads him to command Miti'' to tear one of their sons apart
    to appease a supposed fire; the second leads him to mistake his own reflection
    in river water for a Painted-Woman, offer a hammer, propose marriage, and jump
    into the water. The line range then begins a separate tale titled “The Mouse-Girls,”
    in which a youngest Mouse-Girl loses a tooth during play.'
  language: English
  quote_policy: summarized
