candidate_motifs:
- id: motif:1
  label: Animal-people become real animals after ordeal
  taxonomy_refs:
  - shapeshifter
  basis: The Ermine-People are treated as visitors in the narrative, undergo the cave
    and water ordeal, and at the end turn into real ermines.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage explicitly gives the final transformation, but does not explain
    the group's earlier ontological status beyond the name Ermine-People.
- id: motif:2
  label: Water enters cave and forces escape
  taxonomy_refs: []
  basis: Sea-water enters the cave where the group is sleeping, and they must climb
    up the cliff to escape.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a local cave-water episode, not a world flood or renewal scene.
- id: motif:3
  label: Unwitting consumption of a person's detached body part
  taxonomy_refs: []
  basis: Ermine-Man's side detaches, he explains the meat as left by Chukchee, the
    group cooks and eats it, and Ermine-Woman later realizes it was his side.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the eating as unknowing; it does not present it as
    ritual sacrifice.
- id: motif:4
  label: Spirit-call with drum enables sleep magic and revival
  taxonomy_refs:
  - resurrection
  basis: Eme'mqut calls spirits with the drum, puts the kamak couple to sleep, revives
    another man, and escapes with him.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The man's prior death is supported by the kamak statement that a man had
    been killed and by the verb 'revived,' but details are brief.
- id: motif:5
  label: Mistaken identity in a dangerous nonhuman household
  taxonomy_refs:
  - trickster_boundary
  basis: A voice addresses Eme'mqut as La'wa, Eme'mqut answers within that identity,
    and the real La'wa later returns and denies having been home.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage supports mistaken identity, but does not explicitly state
    whether Eme'mqut deliberately impersonates La'wa from the outset.
- id: motif:6
  label: Humans treated as game by spirits or kamaks
  taxonomy_refs: []
  basis: The kamak speech asks about 'human game,' says wild reindeer were killed,
    and says one man was killed at home; the note glosses 'human game' as a word used
    only by spirits.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The observation is linguistic and narrative; broader interpretation of
    kamak predation should be reviewed against the wider corpus.
- id: motif:7
  label: Nonhuman shellfish bride
  taxonomy_refs:
  - shapeshifter
  basis: Eme'mqut detaches a whimpering shellfish, finds its hood transformed into
    a house, enters, and marries Shellfish-Girl.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The tale is identified in the passage as a fragment, and the exact relation
    between the shellfish, hood, house, and Shellfish-Girl is compressed.
- id: motif:8
  label: Detached covering becomes a dwelling
  taxonomy_refs: []
  basis: The shellfish's detached hood is said to lie among stone-pine bushes and
    then to have turned into a small house.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the transformation but not its cause or wider meaning.
