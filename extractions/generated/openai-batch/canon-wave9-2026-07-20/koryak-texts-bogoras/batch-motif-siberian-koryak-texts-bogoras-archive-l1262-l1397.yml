canonical_text:
  quote: ''
  summary: 'The passage contains the end of an Ermine-People episode, in which rejected
    visitors go to a cave, are trapped by sea-water, unknowingly cook and eat Ermine-Man''s
    detached side, and become real ermines. It then gives the tale of Eme''mqut and
    the kamaks, where Eme''mqut is mistaken for La''wa, calls spirits with a drum,
    puts kamaks to sleep, revives a man, and escapes with him. A short Shellfish-Girl
    tale follows: Eme''mqut finds a whimpering shellfish, finds its detached hood
    transformed into a house, marries Shellfish-Girl, and brings her home.'
  language: English
  quote_policy: summarized
