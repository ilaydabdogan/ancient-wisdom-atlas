canonical_text:
  quote: The sun jumped out and fastened itself to the sky. It grew daylight.
  summary: The passage relates episodes in which Raven-Man hides the sun in his mouth,
    causing darkness; Can'ai' obtains water through song and marries River-Man; River-Man
    brings partial light by magic; Yini'a-na'wgut makes Raven-Man laugh so the sun
    returns to the sky, later kills him, and utters words associated with a cloudless
    sky and bad-weather incantation. A further episode has Little-Bird-Man die while
    carrying the woman across a river, then reappear as her husband with reindeer
    and wealth. The next tale begins with Mouse-Girls on the seashore, the youngest
    Mouse being tied up, falsely claiming a shell as a nail, then discovering a small
    ringed seal, after which Big-Raven approaches the Mouse-Girls.
  language: English
  quote_policy: quoted
