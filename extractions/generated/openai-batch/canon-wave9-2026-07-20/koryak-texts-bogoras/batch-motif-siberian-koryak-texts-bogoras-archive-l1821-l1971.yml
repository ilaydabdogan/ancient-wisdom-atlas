canonical_text:
  quote: ''
  summary: 'The supplied range contains several Koryak tale episodes: Big-Raven enters
    a whale, obtains whale-oil, spills oil onto a fox, and is killed by a poisoned
    return-gift; Eme''mqut and Envious-One compare their wives, leading to Envious-One''s
    humiliation; Big-Raven marries Fish-Woman, who provides spawn as food and repeatedly
    revives after Miti'' attacks her, but finally withdraws to the sea; and Kilu''
    escapes after diverting Monster-Being toward her companion, fleeing through trees
    to a river.'
  language: English
  quote_policy: summarized
