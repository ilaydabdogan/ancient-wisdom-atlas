  quote: ''
  summary: A young man marries a farmer's only daughter. During peat-cutting, the
    young wife is sent home for food, sees a speckled filly's packsaddle above her
    head, and cries over the possibility that it might fall and kill her and future
    offspring. Her mother is sent to check on her and responds with the same alarm.
