canonical_text:
  quote: ''
  summary: 'The passage opens with Campbell’s comparative notes on motifs in adjacent
    Gaelic tales, including a magic box, a town under the waves, a sleep-thorn or
    pin, a skin bag, and great birds. It then begins the tale of Mac-a-Rusgaich: a
    harsh tenant who cheats servants hires a pranky servant under a reciprocal covenant
    involving wages and a bodily penalty. For his first task, Mac-a-Rusgaich eats
    all three daily meals before work, uses the master’s own statement about what
    servants do after supper to go to bed, and challenges the master not to rue the
    bargain.'
  language: English
  quote_policy: summarized
