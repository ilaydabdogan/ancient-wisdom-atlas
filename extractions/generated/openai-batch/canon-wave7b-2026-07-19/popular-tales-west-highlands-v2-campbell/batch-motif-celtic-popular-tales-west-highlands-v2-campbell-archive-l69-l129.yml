canonical_text:
  quote: ''
  summary: A king wants his son to obtain a wife and gives him half a hundred pounds.
    The son lodges at a hostelry, where the host tells him of a nearby man with three
    similar-looking daughters, the eldest identifiable by a mole. A successful suitor
    must identify whether the desired daughter is older or younger and pay a hundred
    pounds. The host lends the son the missing half under a penalty of losing a strip
    of skin if unpaid after a day and a year. The son watches the daughters, chooses
    the eldest by the mole, buys her, brings her home, and marries her. After the
    old king dies, the young king hunts, sees a great ship at the strand, and asks
    the captain what is on board; the supplied passage ends before the captain's reply.
  language: English
  quote_policy: summarized
