canonical_text:
  quote: ''
  summary: A herdsman flees after his master mistakes a snow-covered buck goat for
    a terrible beast. Lost for three days, the herdsman comes to a shore dwelling
    where a little russet man welcomes him, tells him to lie in a bed and not reveal
    what he sees, and he finds a dead man in the bed. Armed men arrive with cattle,
    cook and salt the meat, and eat. Near dawn the little russet man tricks them by
    reporting a terrible man or giant outside, then gives the herdsman money, bread,
    and cheese and sends him away. The herdsman returns safely to his master. The
    editor comments that the tale shows flight from imagined danger leading to real
    peril and compares the little red helper to other helper figures in popular tales.
  language: English
  quote_policy: summarized
