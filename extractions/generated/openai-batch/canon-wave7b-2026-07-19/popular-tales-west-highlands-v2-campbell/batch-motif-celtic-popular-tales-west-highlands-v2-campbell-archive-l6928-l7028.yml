canonical_text:
  quote: ''
  summary: The passage gives editorial comparison and provenance notes for a Gaelic
    tale, then begins a version titled with Ribin, Robin, and Levi the Dun. Ribin
    and Robin dislike Levi-our and kill one of his cows. Levi-our flays the cow, dries
    the hide, sews pockets into it, hides coins inside, and uses it in an inn to deceive
    a rich buyer into thinking the hide pays for drink when struck. After selling
    the hide for one hundred merks, Levi-our tells Ribin and Robin that raw hides
    fetch a great price, leading them to kill their own cows and unsuccessfully seek
    the same price at market.
  language: English
  quote_policy: summarized
