canonical_text:
  quote: ''
  summary: A wooer finds a daughter, mother, and father crying at a peat-stack over
    a hypothetical future misfortune. He decides to leave home to see the world and
    gain knowledge. After traveling, he encounters three similarly dressed men by
    a river; one hosts him, provides ale through a woman after striking a board, appears
    to answer his unspoken thoughts, and later a girl sets a small pot on the fire.
  language: English
  quote_policy: summarized
