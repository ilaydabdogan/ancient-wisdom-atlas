canonical_text:
  quote: ''
  summary: A Scotsman and an accomplice use dresses from a tailor to appear as royal
    ladies. The Scotsman uses a royal door-signal to gain entry to the bishop's house,
    rebukes the bishop while in disguise, has the watchers dismissed from the bishop's
    daughter's chamber, leads the daughter out, changes clothes by a brown horse,
    and rides away to his master with the bishop's daughter.
  language: English
  quote_policy: summarized
