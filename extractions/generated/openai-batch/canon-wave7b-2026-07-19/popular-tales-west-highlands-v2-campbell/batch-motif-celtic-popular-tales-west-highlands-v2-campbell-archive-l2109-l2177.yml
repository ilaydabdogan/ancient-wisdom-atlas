canonical_text:
  quote: ''
  summary: 'The passage reports several regional fairy-belief anecdotes: an Eoss-shire
    minister is carried through the sky by little men; fairies use a weaver''s loom
    and stolen wool to make green cloth; a Harris man refuses a woman''s warm milk
    and later drowns; Argyllshire fairies dwell in hills, steal milk, dance to pipes,
    and are checked by charms, a rowan-tree cross, and running water; a magic chain
    at a waterfall draws milk from cattle until a lad seizes it and crosses the lin;
    Manx belief is said to be similar.'
  language: English
  quote_policy: summarized
