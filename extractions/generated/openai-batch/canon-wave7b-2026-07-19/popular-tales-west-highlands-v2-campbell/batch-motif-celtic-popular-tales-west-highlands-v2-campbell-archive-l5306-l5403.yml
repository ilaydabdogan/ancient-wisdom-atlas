canonical_text:
  quote: ''
  summary: Fiachaire and Innsridh repeatedly go to the battle place or ford to confront
    Greeks who say they are coming to take Mac Cumhail's head for their next day's
    meal. They kill one force and return to the burgh, where Fionn warns of larger
    coming forces. When no enemy appears, hungry Fiachaire goes to seek food scraps
    while Innsridh remains behind; another group then arrives unexpectedly.
  language: English
  quote_policy: summarized
