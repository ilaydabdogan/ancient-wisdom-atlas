canonical_text:
  quote: ''
  summary: 'Editorial note for the Gaelic tale “The Chest”: it records the tale’s
    collection history, compares incidents with Cymbeline, Portia’s defence, and Decameron
    2.9, lists several corresponding plot elements, and comments on possible traditional
    or literary transmission and on a customary premise involving purchase of a wife
    and marital power of life and death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says the tale was written in April 1859 by Hector MacLean from Catherine
    Milloy/Mrs. MacGeachy’s dictation, and that she learned it from Robert MacColl
    of Cowal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor states that no other version had yet come to him, that the tale
    resembles Cymbeline in some incidents, and that one blood incident resembles Portia’s
    defence in the Jew of Venice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage summarizes Decameron 2.9: Bernard of Genoa is deceived by Ambrose,
    loses money, orders his innocent wife killed, while she escapes, enters service
    in man’s dress, exposes the deceiver, resumes her former dress, and returns rich
    with her husband.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage compares Decameron and Gaelic details: a poor woman in one replaces
    the Gaelic Hen wife, and a man hidden in a chest takes listed articles, with the
    Gaelic version reducing the articles to a ring and a chain.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In both compared stories the wife disguises herself as a man, though the service
    she undertakes differs, and in both she discloses the cheat in court.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The editor says the stories resemble one another but differ widely in spirit,
    incident, scene, and detail, and then presents traditional transmission and Decameron-derived
    literary influence as alternative possibilities.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The editor treats the three tellings by Boccaccio, Shakespeare, and a Highland
    farmer’s wife as versions of what appears to be the same popular tale.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The note says the story hinges on a custom in which buying a wife gives a
    right to shoot her, and it connects this idea with reported ancient Gaulish family
    power and an Icelandic wife-purchase custom.
  category: relationship
  evidence_refs:
  - ev:8
