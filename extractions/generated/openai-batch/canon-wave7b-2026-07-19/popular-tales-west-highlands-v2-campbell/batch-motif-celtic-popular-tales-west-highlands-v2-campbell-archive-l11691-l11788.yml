canonical_text:
  quote: ''
  summary: 'The passage collects accounts and commentary on serpent beliefs: snake
    charmers and snake-bite cures, a white king cobra in Ceylon, Highland traditions
    of a great white snake that produces a protective ring, lucky snake eggs or adder
    stones, large eels and sea-serpents, and many-headed Highland sea monsters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake charmer is described as having a bag of snakes and selling white powders
    said to make the swallower independent of snake bites; the narrator tests them
    and suspects they are vegetable matter or flour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Ceylon, the passage reports a rare snake called the King of the Cobras,
    with a head and anterior body so light in colour that it appears silvery white
    at a distance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Ceylon snake charmers use a certain stone and a certain root
    to cure snake bites, and notes that snake charmers are common in Northern Africa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Sutherland account says the great white snake never rests, moves on the
    ground, and also turns over and over through a loose ivory ring on its body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sutherland account says the ivory ring is formed from the snake's own
    slime, can slip off, and protects the finder against diseases and enchantments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another serpent is described as nine feet long, covered with hair, having
    a mane, and being regarded as a bodily manifestation of the evil one.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that in the West, so-called snakes' eggs were considered
    lucky, and describes one as a blue-and-white, multicoloured bead apparently made
    of glass.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage identifies similar objects as adder stones in the Lowlands and
    Druid's glass in Ireland, and says they are commonly found in tumuli and commonly
    believed to have been produced by snakes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A great eel is said to appear repeatedly in lakes and in the sea, with enormous
    size as its known peculiarity.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: A Lorn account says an eel's head passed a fishing rock in the morning, the
    eel was still passing an hour later, and its tail disappeared behind the rock
    at dusk.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports several sea-serpent or sea-worm sightings and mentions
    Highland sea monsters called Uille bheist and Draygan, described as having numerous
    heads.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
