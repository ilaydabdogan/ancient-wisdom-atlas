canonical_text:
  quote: ''
  summary: Domhnull prompts a maidservant to remove a stick from a silent woman, who
    falls into a well. Domhnull loudly claims his mother has drowned, receives five
    hundred Saxon pounds from the king, then disposes of his mother in the well. Two
    men ask how he got the money; Domhnull tells them to kill their mothers and try
    to sell them in town. They do so, are mocked and chased by dogs, then put Domhnull
    in a barrel intending to roll it from a rock. While they pause for a drink, a
    shepherd with sheep passes, hears Domhnull playing a Jew's harp, and Domhnull
    says he is making a fortune in the barrel among gold and silver.
  language: English
  quote_policy: summarized
