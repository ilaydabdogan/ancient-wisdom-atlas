canonical_text:
  quote: ''
  summary: A forebear of John Bethune wagers that he can seize the kelpie of Moulin
    na Fouah and bring her bound to the inn at Inveran. With a horse and a dog he
    captures the Vough, ties her behind him, and subdues her with an awl and needle.
    When companions come out with lights at Inveran, the light falls on her and she
    falls to earth as a small lump of jelly likened to the remains of a fallen star.
    A collector's note connects such jellies with objects seen on moors and attributed
    to stars.
  language: English
