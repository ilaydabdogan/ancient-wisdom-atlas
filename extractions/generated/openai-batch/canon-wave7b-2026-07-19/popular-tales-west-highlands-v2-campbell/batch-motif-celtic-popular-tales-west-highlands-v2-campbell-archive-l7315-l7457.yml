canonical_text:
  quote: ''
  summary: The passage first closes an episode involving an old hat sold after its
    apparent effect, then gives Campbell's comparative note on variants of the tale,
    including a Straparola version about a priest and three rogues, false death and
    revival, sack substitution, and drowning at a river. It then begins a separate
    tale in which the youngest son of a Scottish yeoman leaves home for London, enters
    service with the chief magistrate, notices the bishop's prized brown horse, and
    wagers that he can steal it by the next day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man bargains that he will take off an old hat as payment for board and lodging
    on his return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buyer described as a Jew sees the effect of the hat, buys it, tries it,
    is cudgelled by innkeepers, and curses the tar who outwitted him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The editor states that the story has incidents common to Gaelic, Norse, English,
    German, and an African-language tradition, while also having a distinctive character.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Straparola analogue is summarized as a story of a priest and three rogues
    who outwit one another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Straparola summary, the rogues persuade the priest that his mule is
    an ass and obtain it; afterward the priest sells them a useless goat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priest pretends to kill his housekeeper using a knife and a blood-filled
    bladder, appears to revive her, sells the reviving means to the rogues, and the
    rogues then kill their three wives in earnest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rogues put the priest in a sack intending to drown him in a river.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The priest deceives a shepherd into taking his place in the sack by claiming
    he is being forced to marry a lord's daughter; the shepherd is drowned, and the
    priest takes the sheep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the rogues find the priest with sheep, they ask to be put into three
    sacks; they are carried to the river by three facchini and disposed of, while
    the priest returns home rich.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The editor says the Italian version and the four Gaelic versions resemble
    each other closely, while the process by which the story moved between Italian
    and Gaelic is uncertain.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The editor speculates about possible Scottish routes of transmission through
    the court of Mary Queen of Scots, foreigners in Scotland, and David Rizzio, but
    marks several distribution and variant-element questions as unresolved.
  category: other
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The editorial itinerary links the tale figures from Barra to the Grassmarket,
