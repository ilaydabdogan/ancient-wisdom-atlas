canonical_text:
  quote: ''
  summary: 'The passage recounts several fairy anecdotes and beliefs: people trapped
    in night-opened fairy hills can be rescued if a gun or sword is left across the
    entrance; a young woman is rescued from compulsory dancing with fairies; the narrator
    notes similar hill incidents elsewhere; confined women with unbaptized children
    are protected by a Bible; a fairy mistaken for a delicate child is exposed as
    a fairy sweetheart and leaps into the sea; and fairies assist a favored tenant''s
    wife with woolworking while reciting a work chant.'
  language: English
  quote_policy: summarized
