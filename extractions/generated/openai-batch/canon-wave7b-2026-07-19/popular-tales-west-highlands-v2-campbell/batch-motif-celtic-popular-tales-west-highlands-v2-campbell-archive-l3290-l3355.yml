canonical_text:
  quote: ''
  summary: The passage presents Oisean after the time of the Feen as an aged, impaired
    man living with his daughter while others write down histories he tells. After
    being accused of lying about an enormous bone, he burns the books, which his daughter
    rescues. He calls for the worst lad and dog of the Feen, goes to a glen, uses
    a whistle to direct a deer hunt on a mountain, has stags cooked in the Feen's
    great cauldron, and eats them while removing oaken skewers from his belly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aisean/Oisean is described as an old man after the time of the Feen, living
    in his daughter's house, blind, deaf, limping, and with nine oaken skewers in
    his belly.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: People present are writing down the old histories that Oisean tells them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oisean is said to eat the tribute that Padraig had over Eirinn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A large stag is killed; its shank is stripped, and the bone is brought to
    Oisean for comparison with bones in the time of the Feen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oisean answers that he once saw a black bird chick's bone large enough for
    the stag shank bone to go around it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: When his listeners call his account lies, Oisean angrily catches hold of the
    books and sets them in the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Oisean's daughter removes the books from the fire, quenches them, and keeps
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Oisean asks that the worst lad and dog in the Feen lay weight on his chest;
    one weight identifies itself as MacRuaghadh, and another at his feet is identified
    as MacBuidheig.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At daybreak the figures arise, and Oisean asks the lad to take him to a particular
    glen.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: In the glen, Oisean takes a whistle from his pocket, plays it, and asks what
    is passing on a mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The lad reports seeing deer; Oisean distinguishes slender grey deer, gaunt
    grizzled deer, and heavy sleek deer, letting the first two groups pass and sending
    the dog after the heavy sleek ones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The dog drags down deer; Oisean instructs the lad to check the dog when a
    dozen have been taken, and the whistle is used to check the dog.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The dog returns with its mouth open and tongue out, which Oisean interprets
