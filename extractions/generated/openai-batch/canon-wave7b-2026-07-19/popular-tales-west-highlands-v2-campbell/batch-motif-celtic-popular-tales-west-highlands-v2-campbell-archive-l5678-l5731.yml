canonical_text:
  quote: ''
  summary: 'Editorial and collector commentary on the Gaelic tale “Maghach Colgar”:
    its Barra oral source, its Ossianic heroes, their enchantment in a Brugh, fighting
    with Greeks or possibly Gruagach-like people, extravagant long-distance combat
    between Eirinn and Lochlainn, and manuscript parallels involving a Shannon ford
    and Cuchullin’s training journeys.'
  language: English
  quote_policy: summarized
