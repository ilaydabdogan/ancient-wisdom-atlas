canonical_text:
  quote: ''
  summary: 'The passage recounts Sutherland and Highland fairy traditions: supernatural
    beings attempt to build a gold-mounted bridge across the Dornoch Firth but vanish
    when blessed, a green lady asks a Bible-reading old man whether Scripture offers
    salvation for beings like her, baptism and blessing are described as charms against
    fairy child theft, and a changeling substitution is reversed when the substitute
    child is ignored. The narrator adds that fairies may seek spiritual advantage
    for their children through human adoption or marriage, comparing this idea to
    Undine.'
  language: English
  quote_policy: summarized
