canonical_text:
  quote: ''
  summary: Brian steals the White Glave of Light after following the fox's advice,
    but the sword rings and wakes the big women, who capture him. They force him to
    choose between punishment under the bellows' sparks and stealing the Sun Goddess,
    daughter of the King of the Gathering of Fionn. The fox supplies a matching dress
    and instructions; Brian passes the guards, meets the Sun Goddess, and helps her
    escape through a window. The fox later proposes to take the Sun Goddess's form
    so Brian can exchange the fox for the White Glave of Light; the fox escapes and
    rejoins them as they approach the big giant's house and the next exchange involving
    a marvellous bird.
  language: English with Gaelic phrases and editorial notes
  quote_policy: summarized
