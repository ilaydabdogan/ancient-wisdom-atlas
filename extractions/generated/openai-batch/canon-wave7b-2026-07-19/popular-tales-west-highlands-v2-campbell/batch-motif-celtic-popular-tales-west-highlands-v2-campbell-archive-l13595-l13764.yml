canonical_text:
  quote: ''
  summary: In this episode, the Fair Chief has Fionn strike him with a rod, becoming
    a brown ambler that carries Fionn with extraordinary speed. At the wall of the
    Tree Lion, Fionn repeatedly feeds and combs the ambler until it reaches the top
    of the wall. After Fionn visits the Tree Lion's household while the Tree Lion
    is absent, the Fair Chief explains that the Tree Lion will pursue them and that
    victory depends on the Tree Lion forgetting his book of witchcraft. The Tree Lion
    arrives and both opponents take successive bull, ass, and hawk forms; the Fair
    Chief kills him. Fionn hides the Fair Chief in a napkin under turf and truthfully
    tells the Tree Lion's wife that he does not know who killed her comrade above
    the earth. Fionn and the Fair Chief then return to the castle of the dame of the
    Fine Green Kirtle and refuse food until they can share the deer with the rest
    at Sruth Ruaidh.
  language: English
  quote_policy: summarized
