canonical_text:
  quote: ''
  summary: In this episode, the Carlin bursts hoops with her yells, binds the Feeantaichean
    except Fionn, and confronts the Fair Chief. The Fair Chief prepares a deer in
    a cauldron while Fionn guards the cooking because imperfect cooking or spilled
    broth would allow the deer to rise again. The Carlin demands parts of the deer,
    Fionn refuses, and the Fair Chief battles and fells her. The Carlin and the Fair
    Chief then lay reciprocal spells or conditional obligations on Fionn and the Carlin.
  language: English
  quote_policy: summarized
