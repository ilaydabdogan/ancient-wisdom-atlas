  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Fair Chief seizes the Carlin, strikes her in the crook of the hough with
    his foot, fells her, and asks Fionn whether he should take off her head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Carlin lays Fionn under crosses and spells unless he is, as a husband,
