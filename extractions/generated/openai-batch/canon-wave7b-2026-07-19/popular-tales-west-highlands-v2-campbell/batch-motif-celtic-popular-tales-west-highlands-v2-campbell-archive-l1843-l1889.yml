canonical_text:
  quote: ''
  summary: The passage introduces Sutherland fairy belief as similar to fairy belief
    elsewhere in Scotland. One anecdote tells of Duncan More's mother giving meal
    to an unknown little woman who then refuses it after seeing a smoking kiln and
    disappears at a running burn, leading the mother to judge her a fairy. A second
    anecdote begins with a tailor and wife whose troublesome child is left with a
    farm servant; the child speaks sharply, gets out of bed, insists on accompanying
    the servant, and commands him to go east and rap three times at a big brae before
    the passage breaks off.
  language: English
  quote_policy: summarized
