canonical_text:
  quote: '"Now I am king over Erin, as I myself had a right to be."'
  summary: In a battle episode, demands are made for Fearghus's head or captivity.
    False heads are sent to Conall and rejected. Lagh an Laidh finally obtains Fearghus's
    head, brings it to Conall, and fights with him. Conall kills Lagh an Laidh, claims
    kingship over Erin, brings his mother and her father to the palace, and his descendants
    rule until a final child dies and another tribe comes into Erin.
  language: English
  quote_policy: quoted
