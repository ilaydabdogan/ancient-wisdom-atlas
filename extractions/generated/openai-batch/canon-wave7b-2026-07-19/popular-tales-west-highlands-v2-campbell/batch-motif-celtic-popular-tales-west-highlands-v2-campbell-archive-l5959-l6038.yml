canonical_text:
  quote: ''
  summary: The passage presents a comparative note on The Brollachan by summarizing
    the Odyssey Cyclops episode, including Ulysses' entry into the cave, the false
    name, wine, and blinding. It then links the Cyclop with Gaelic water beings such
    as the Fuath, water-horse, kelpie, and Each uisge, while cautiously discussing
    possible borrowing from Homer or an older shared story. A second anecdote tells
    of the Cailleach Mhore of Clibrick, an inhospitable rich old woman, who is verbally
    tricked by William dean Suidhe and dies after eating the remainder of a cursed
    bannock she had wished would kill him.
  language: English
  quote_policy: summarized
