canonical_text:
  quote: ''
  summary: The bishop is overawed by brightness near the pulpit, prays, and agrees
    to follow the young man. The young man leads him to the chief magistrate's stable,
    where shining servant's clothes provide light while he expounds in various languages
    through the night. Before daylight he removes and hides the dress. When the chief
    magistrate arrives, he tells the bishop that the young man has gained the bishop's
    daughter, horse, and money, and advises him to accept and support him. The young
    man and the bishop's daughter are lawfully married, and the father shows kindness.
  language: English with a final Scottish Gaelic title fragment
  quote_policy: summarized
