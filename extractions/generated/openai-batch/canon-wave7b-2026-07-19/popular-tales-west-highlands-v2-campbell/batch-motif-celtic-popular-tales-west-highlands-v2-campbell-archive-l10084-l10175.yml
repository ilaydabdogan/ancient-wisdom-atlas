canonical_text:
  quote: ''
  summary: Mac-a-Rusgaich accepts eating, drinking, and stone-throwing contests with
    a giant. He hides a leather bag under his shirt, puts food and drink into it,
    then cuts the bag open to make room and throw the stone. The giant imitates the
    apparent act by stabbing his own belly, dies, and Mac-a-Rusgaich takes gold and
    silver from the giant's house.
  language: English
