  summary: The passage gives editorial comparative notes on the tale of Scire mo Chealag
    and then lists several short comic anecdotes from Sutherland and related traditions,
    especially mistakes attributed to an Assynt man and to market-going women. The
    examples include a woman doubting her identity after her clothing is cut, a man
    abandoning a wind-driven spinning-wheel, a woman releasing rolling balls of worsted,
    a sundial handled literally, a carriage-wheel joke, and a baptism/catechism misunderstanding.
  language: English with Gaelic names and terms
