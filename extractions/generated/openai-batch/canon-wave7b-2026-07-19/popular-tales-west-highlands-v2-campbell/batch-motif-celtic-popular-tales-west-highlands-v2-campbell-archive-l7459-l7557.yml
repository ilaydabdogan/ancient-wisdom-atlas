canonical_text:
  quote: ''
  summary: A young man wagers his head and money that he can steal the bishop's horse.
    Finding the horse guarded indoors, he recruits a helper, obtains a hanged man's
    body and the hanging rope, lowers the corpse through the chimney to make the guards
    think he has killed himself, then seizes the horse's bridle and takes the bishop's
    brown horse back to his master's stable.
  language: English
  quote_policy: summarized
