canonical_text:
  quote: '"every one we kill to-day they will be alive to-morrow."'
  summary: The Warrior of the Red Shield gives a woman and body trophies to two heroes,
    is abandoned by them on an island, finds an old castle, recognizes three weary
    youths as his foster brothers, feasts with them, and learns that they are spell-bound
    to fight MacDorcha MacDoilleir and his hundred people, whose slain revive the
    next day. He goes alone against the enemy host, kills them, and begins to grapple
    with MacDorcha.
