canonical_text:
  quote: ''
  summary: The Warrior of the Red Shield asks about the king’s distress. The king
    says his two sons have driven three horses’ teeth into his head for a year. The
    warrior restores the king’s own teeth by using a can of water and having the king
    drink. The king recognizes the warrior as the true doer of the valiant deeds and
    condemns his sons to burning, but the warrior asks that they be spared. The sons
    are instead given bird and fool clipping and expelled. The little treasure and
    the Warrior of the Red Shield marry, and a long wedding feast follows.
  language: English
  quote_policy: summarized
