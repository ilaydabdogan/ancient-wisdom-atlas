canonical_text:
  quote: ''
  summary: 'The passage gives source notes for riddles collected from Flora MacIntyre
    and Catherine MacArthur, a glossary of Gaelic terms and images, and an editorial
    comparison to a familiar riddle type. It then begins the tale of the Fair Gruagach,
    son of the King of Eirinn: the Fair Chief travels with his company, meets the
    Dame of the Fine Green Kirtle, plays cards with her, wins the first game, returns
    the next day, loses the second game, and is placed under spells and threatened
    with loss of life if he rests by day or night.'
  language: English with Scottish Gaelic glossary terms
