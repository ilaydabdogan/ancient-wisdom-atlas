canonical_text:
  quote: ''
  summary: The king takes the Yellow Bay Filly from Mac Iain Direach and says he will
    not give it unless Mac obtains the daughter of the King of France. Gille Mairtean
    meets Mac near the sea, transforms into a ship, carries him to France, and instructs
    him to present the ship as wrecked. The French royal family comes to view the
    ship; sweet music on board draws the king's daughter and Mac through its chambers
    until the vessel is out at sea. Mac tells the daughter that he is taking her to
    Eirinn as part of a chain of exchanges for the filly, the White Glave of Light,
    and the Blue Falcon, so that he may be freed from afflictions and spells. She
    says she would rather be his wife. At the end of the passage Gille Mairtean transforms
    into a fine woman and tells Mac to leave the daughter while they return.
  language: English
  quote_policy: summarized
