canonical_text:
  quote: ''
  summary: Uistean confronts a speaking goat that asks about its kid. His gun and
    sword fail, but he stabs the goat with a dirk; the goat roars and is not seen
    again. Uistean then returns to the weaver's house, finds the weaver bleeding under
    the loom, accuses him of the harm done on the yellow knoll, and kills him. The
    passage then notes a similar variant and gives the collector's comments on Highland
    spirit tales and their mixture of natural and supernatural elements.
  language: English
