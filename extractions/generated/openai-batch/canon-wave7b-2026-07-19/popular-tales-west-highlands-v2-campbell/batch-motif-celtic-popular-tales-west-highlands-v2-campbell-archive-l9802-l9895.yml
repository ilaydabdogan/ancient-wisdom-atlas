canonical_text:
  quote: ''
  summary: In this passage, Mac-a-Rusgaich performs two tasks in destructively literal
    fashion. When his master goes to a wedding, Mac-a-Rusgaich removes the eyes of
    stots and throws them toward the master as a literal fulfilment of a phrase about
    casting an ox-eye near the twelfth hour. Later, asked to make a sheep footpath,
    he cuts off sheep's feet and lays their legs as a path. Editorial notes explain
    the idiom of casting an eye and the practical meaning of a sheep footpath or causeway.
    The passage ends with the master assigning another cleaning task.
  language: English
