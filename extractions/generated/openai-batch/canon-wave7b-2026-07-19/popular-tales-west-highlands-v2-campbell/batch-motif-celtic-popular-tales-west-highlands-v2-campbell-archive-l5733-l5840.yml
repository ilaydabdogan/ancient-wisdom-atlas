  claim: The editor proposes that the prose tales and poems are old compositions founded
    on old traditions common to all Celts and perhaps to all Indo-European races.
  claim_level: common_inheritance
  target: Old Celtic traditions and possible wider Indo-European tradition
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
