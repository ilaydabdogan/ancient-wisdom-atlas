canonical_text:
  quote: ''
  summary: 'The passage first gives editorial abstracts and commentary on Maghach
    Colgar-related Fenian material, including Colgar''s rebellion, riddles, enchantment
    of the Fingalians, fighting, ford-guarding, and an editorial comparison to older
    manuscript and wider Celtic traditions. It then gives the tale of The Brollachan:
    Murray, a cripple living at a mill, encounters a shapeless child of the Fuath;
    after the being is burned by flying embers, its fierce parent arrives, but the
    being''s limited speech prevents revenge on Murray. Murray hides under a peck
    measure and escapes, while a passing woman is later maimed by the furious parent.'
  language: English
  quote_policy: summarized
