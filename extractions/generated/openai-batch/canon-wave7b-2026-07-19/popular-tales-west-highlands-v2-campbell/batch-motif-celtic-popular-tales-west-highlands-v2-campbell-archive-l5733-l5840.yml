- id: motif:7
  label: Night visitation by a shapeless supernatural child
  taxonomy_refs: []
  basis: The Brollachan, son of the Fuath, enters the mill at night; he has eyes and
    a mouth, limited speech, and no shape.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage identifies the being as shapeless, not as a being that changes
