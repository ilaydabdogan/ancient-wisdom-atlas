- id: motif:8
  label: Fire harms a supernatural being and summons its parent
  taxonomy_refs: []
  basis: Murray throws peat on embers, red-hot pieces burn the Brollachan, and its
    fierce parent comes when it screams.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state that Murray intended to attack the Brollachan.
- id: motif:9
  label: Self-thyself speech confusion averts supernatural revenge
  taxonomy_refs:
  - trickster_boundary
  basis: The Brollachan can only say words glossed as myself and thyself, so when
    asked who burned him he answers in a way that leads the parent to say she would
    only take revenge if it were another.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: Murray is not explicitly labeled a trickster; the episode turns on the
    Brollachan's limited speech rather than a stated deliberate verbal trick.
- id: motif:10
  label: Hiding under a domestic measure to escape a supernatural being
  taxonomy_refs: []
  basis: Murray slips a peck measure over himself, hides among the machinery to look
