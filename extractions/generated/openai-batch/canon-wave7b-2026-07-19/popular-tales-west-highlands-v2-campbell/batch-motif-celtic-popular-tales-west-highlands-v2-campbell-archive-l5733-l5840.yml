    resemble Maghach Colgar and later calls Tale 5 a longer, better, and older version
    of the tale of Maghach Colgar.
  claim_level: same_motif
  target: Maghach Colgar and Tale 5, the rebellion of Miodach son of Colgar
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The evidence is an editorial comparison based on an abstract of an
    abstract; the full manuscript tale is not supplied in this passage.
