canonical_text:
  quote: ''
  summary: Campbell summarizes and compares several West Highland versions related
    to The Knight of the Red Shield. In one version three adventurers travel by boat
    to recover a king's teeth and part of his jaw, encounter supernatural beings,
    and the despised companion proves to be the true hero, restores the king, marries
    a rescued Greek lady, is recognized as the king's legitimate son, and receives
    the kingdom. Another version features three sons of the king of Greece seeking
    the daughter of the king under the waves. Campbell notes repeated boat-voyage
    passages across oral and manuscript witnesses, links the material to other Gaelic
    and Irish story cycles, and describes such passages as fragments of an old romance
    preserved in oral tradition.
  language: English
  quote_policy: summarized
