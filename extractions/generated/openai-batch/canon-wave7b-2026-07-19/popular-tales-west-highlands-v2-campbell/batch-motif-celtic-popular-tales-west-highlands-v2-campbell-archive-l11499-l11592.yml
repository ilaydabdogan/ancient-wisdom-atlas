canonical_text:
  quote: ''
  summary: 'The passage first links the figure of Farquhar or Ferchard Leech with
    medieval grants and later descendants, while noting that the marriage with a king''s
    daughter and a black beetle lack confirmation. It then gives an Islay Doctor tradition
    about Beaton brothers: a herbalist gains unrivalled medical insight after licking
    liquid from a boiling herb cauldron containing a white snake, cures a Scottish
    king, and is poisoned through other doctors'' jealousy. A later episode has him
    cure a wasted young woman by using the smell of roasting sheep to draw a swallowed
    toad or reptile, called Lon Craois, from her mouth. The narrator then notes a
    similar Norwegian report of a young woman who swallowed a serpent while sleeping
    in a field.'
  language: English
  quote_policy: summarized
