canonical_text:
  quote: ''
  summary: 'The passage gives notes on Highland and Norwegian betrothal customs, including
    dower negotiation, wedding procession, music, celebration, and stocking ceremonies.
    It then notes a skin-thong punishment motif and gives brief Gaelic word etymologies.
    The passage begins the tale ''The Inheritance'': a dying farmer tells his three
    sons to divide gold hidden in a drawer, but after his burial the sons find the
    drawer empty and go to consult an old friend of their father.'
  language: English
  quote_policy: summarized
