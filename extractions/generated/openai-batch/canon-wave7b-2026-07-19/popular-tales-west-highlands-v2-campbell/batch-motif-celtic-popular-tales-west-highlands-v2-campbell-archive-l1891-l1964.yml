canonical_text:
  quote: ''
  summary: The passage recounts a fairy flail retrieved by ritual knocking, the exposure
    of an apparent substitute child by fire and the return of the parents' own child,
    a note about fairies haunting Sutherland places and retaliating when earth is
    taken from their hill, and a tale in which a new father enters a fairy cavern,
    dances with fairies, and returns after a year has passed outside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Donald raps three times, calls up a fairy described as a little man, receives
    Johnnie's flail, and is sent away in terror.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Johnny and Donald thresh the straw in the barn, after which Donald restores
    the flail at the brae with the same ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the parents return, Donald confesses the truth, and the tailor and his
    wife conclude that the child is not their own.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents put the child in an open basket and set it on the fire; when it
    feels the fire, it starts from the basket and vanishes up the chimney.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A crying child appears at the door, and the mother recognizes the child by
    its frock as her own; the child is welcomed back from a sojourn among the little
    people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The burn of Invernauld and the hill of Durcha are said still to be believed
    haunted by fairies.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fairies are said to have chased a man into the sea and destroyed a new mill
    because earth for the mill-dam embankment had been dug from their hill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man whose wife has just borne their first child travels with a friend to
    Lairg to register the birth and buy whisky for the christening feast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two men rest near a large hole at the foot of the hill and hear sounds
    of piping and dancing from it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father enters the cavern, goes a few steps in, and disappears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The companion is suspected of murdering his friend, asks for a year and a
    day's law, and repeatedly goes at dusk to the place to call and pray.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Near the end of the allowed term, the companion enters the cavern, hears reel
    tunes and pipes, sees the missing man dancing with fairies, catches him by the
    sleeve, and pulls him out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The rescued man thinks his reel has only been interrupted and does not believe
    a year has passed until he sees his wife with a yearling child.
  category: sequence
  evidence_refs:
  - ev:6
