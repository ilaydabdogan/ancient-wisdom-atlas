canonical_text:
  quote: ''
  summary: A first-person speaker recounts meeting a beggar, learning of a wedding,
    entering the wedding feast in beggar guise, being recognized by a bodily mark,
    arming for combat, taking the bride onto a ship, and sailing to his father-in-law's
    town. Murachadh responds to the story and then finds himself in a tower in Erin
    with relatives and animals present.
