canonical_text:
  quote: ''
  summary: A male traveler sails to Spain, enters a change-house, disobeys an instruction
    not to lift a dish-cover, eats herrings, and compensates the housewife with many
    herrings. On successive Sundays he attends church, reads from a book, and draws
    the tearful attention of the king and queen. After repeated failed summons, the
    king and queen intercept him, invite him to the palace, and feast him because
    they hope for news of their daughter. The queen asks him not to conceal that a
    woman's hand provided his clothes, ring, book, and whistle, and he confirms it.
  language: English
  quote_policy: summarized
