  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: After the sermon three nobles follow him and shout that the king has a matter
    for him, but he does not return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: He returns to the change-house and repeats the church visit on the next Sunday
    without staying for anyone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:11
  text: On the third Sunday the king and queen leave during the sermon and stand at
    the two sides of the bridle rein as he comes out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: The king lets go the rein, takes off his hat, bows to the ground, and invites
    him to dine at the palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: At the palace food, drink, and music are set out, and the company feasts with
