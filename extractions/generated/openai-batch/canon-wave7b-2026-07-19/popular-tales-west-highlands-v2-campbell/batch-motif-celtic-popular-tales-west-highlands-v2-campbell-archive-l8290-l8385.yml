canonical_text:
  quote: ''
  summary: A poor widow and her three daughters live from a kailyard that a great
    gray horse visits to eat. The eldest and second daughters each try to keep the
    horse away, become stuck to it through objects they strike it with, and are carried
    to an opening green hill. Inside, the horse is addressed as the king's son; he
    gives each daughter access to the house except for one forbidden chamber. Each
    opens the chamber, finds dead gentlewomen and blood, refuses a cat's offer to
    clean the blood for milk, and is beheaded when the blood is discovered. The youngest
    daughter then sets out to learn what happened to her sisters and is likewise carried
    into the green hill.
  language: English
  quote_policy: summarized
