canonical_text:
  quote: ''
  summary: 'A woman asks a man to go on a journey according to her will. She instructs
    him to take clothing from a shop, obtain a cargo of herring, sail with it to Spain,
    and return to her before departure. After the cargo is aboard, he returns. She
    gives further instructions: wear a dress on the first Sunday after reaching Spain,
    go to church, carry a whistle, ring, and book, be accompanied by a horse and servant,
    place the ring on his finger, read the book, observe three seats in the church,
    and leave first unless met by the King or Queen.'
