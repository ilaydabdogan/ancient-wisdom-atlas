canonical_text:
  quote: ''
  summary: The passage gives provenance for a Gaelic tale and an editorial comparison
    to related tales. In the tale summary, a poor woman has three daughters and a
    kail-yard visited daily by a horse. The daughters attempt to drive the horse away
    with a distaff, but the distaff sticks to the horse and their hands, and the horse
    drags them to a castle. The eldest daughter is given a key, forbidden to look
    into one room, and told to milk three red-brown hornless cows. She enters the
    forbidden room, is marked by blood, refuses milk to a grey cat, and is killed
    by a giant with the White Glave of Light. The same happens to the second daughter.
    The youngest daughter also enters the room and sees her dead sisters, but gives
    milk to the grey cat. The cat becomes a splendid woman, says she is a king's daughter
    under spells, and tells the youngest to wash the blood from her foot with milk
    so the giant will find her foot clean and marry her.
  language: English with Gaelic title and opening fragment
  quote_policy: summarized
