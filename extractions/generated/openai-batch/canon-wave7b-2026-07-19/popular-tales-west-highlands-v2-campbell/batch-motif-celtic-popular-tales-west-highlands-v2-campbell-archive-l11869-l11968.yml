canonical_text:
  quote: ''
  summary: A young man encounters a household lamenting a hypothetical accident involving
    a pack-saddle. He sets out to find three others as foolish, reaches Sgire mo Chealag,
    and meets three women who claim they can make local men believe anything. He offers
    a gold ring for the best deception. The women then make their husbands believe,
    respectively, that one is sick and dead, that one is not himself, and that one
    is clothed while he runs stripped after a funeral procession.
  language: English
  quote_policy: summarized
