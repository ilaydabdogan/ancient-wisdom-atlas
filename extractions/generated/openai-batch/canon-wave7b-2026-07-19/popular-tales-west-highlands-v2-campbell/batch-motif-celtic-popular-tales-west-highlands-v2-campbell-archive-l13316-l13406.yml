canonical_text:
  quote: ''
  summary: The Fair Chief, named the Gruagach Ban and son of the king of Eireann,
    comes to Fionn seeking hire. Fionn gives him work dragging the net with the Feen.
    The Fair Chief sees a deer above them and urges that the swift men hunt it rather
    than fish. Fionn says they know the deer and are tired of it. The Fair Chief asks
    for the swift man called Luathas, and Caoilte comes. Caoilte is tasked with chasing
    the deer, though he says he has often chased it without catching it. Fionn describes
    Caoilte and the deer at full speed and says the deer must cross seven glens, seven
    hills, and seven summer seats before reaching rest. The passage ends as the Fair
    Chief turns back to the net and begins another instruction to Fionn.
  language: English
  quote_policy: summarized
