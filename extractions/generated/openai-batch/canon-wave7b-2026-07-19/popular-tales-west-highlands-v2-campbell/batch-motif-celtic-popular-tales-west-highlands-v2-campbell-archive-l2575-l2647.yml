canonical_text:
  quote: ''
  summary: The passage introduces a related bogle story, then recounts how Ian Dubh
    Mor, called Big Black John, meets a terrible being by a burn below a fall, exchanges
    commands about striking and prodding, fights until cock-crow, and receives a choice
    between speechless art and artless speech. He chooses speechless art, becomes
    an exceptionally skilled blacksmith with powers over witchcraft and evil eye,
    and later helps a Skipnish man recover lost malt yield. The narrator closes by
    stating a general notion that supernatural beings cannot withstand iron and that
    some people deal with them.
  language: English with some Gaelic terms
  quote_policy: summarized
