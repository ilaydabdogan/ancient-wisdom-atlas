canonical_text:
  quote: ''
  summary: In the passage, Domhnull entices a shepherd into a barrel by speaking as
    if wealth is inside, then replaces himself with the shepherd. An unnamed group
    carries the barrel to a rock and sends it down despite the shepherd calling out.
    The group later sees Domhnull alive with a plaid, dog, and a hundred sheep. Domhnull
    claims that the world beyond sent him back with sheep and says the group could
    receive the same by the same means. The group imitates the descent; one is sent
    down in a barrel and another jumps, and both die. Domhnull returns home and has
    the land to himself.
  language: English
  quote_policy: summarized
