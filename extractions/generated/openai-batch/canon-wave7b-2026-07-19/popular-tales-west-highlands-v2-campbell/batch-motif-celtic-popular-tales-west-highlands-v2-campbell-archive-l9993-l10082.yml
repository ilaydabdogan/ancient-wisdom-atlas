canonical_text:
  quote: ''
  summary: 'Mac-a-Rusgaich and a giant move through a sequence of work and contest
    scenes: wood, mowing, threshing, throwing at a crag, and a dinner challenge. In
    each completed task shown, Mac-a-Rusgaich uses a method or verbal framing that
    makes the giant abandon the work or propose another contest. The excerpt ends
    as the giant threatens a skin-thong penalty if Mac-a-Rusgaich cannot eat as much
    bread and cheese as he does, and Mac-a-Rusgaich begins to propose a reciprocal
    condition.'
  language: English
  quote_policy: summarized
