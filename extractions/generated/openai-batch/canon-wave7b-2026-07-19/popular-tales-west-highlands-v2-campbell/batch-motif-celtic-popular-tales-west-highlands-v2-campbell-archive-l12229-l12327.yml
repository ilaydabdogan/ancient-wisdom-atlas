canonical_text:
  quote: ''
  summary: 'The passage gives several comic episodes about foolish or simple men:
    an infant is dropped unnoticed into snow before baptism; an Assynt man misunderstands
    a clock question; he releases cheeses downhill and expects them to arrive at market;
    he fears a hare and falls into a duck pond. The editor notes parallels to other
    comic traditions. A Gaelic Islay version follows, in which a poor woman''s half-booby
    son steals planks from a wreck; his mother fabricates a milk-porridge shower so
    that his later confession sounds impossible. He later builds a cradle before having
    children, and when his shuttle casts a weight into the empty cradle, the women
    cry out as though a hypothetical child had been killed and reproach him.'
  language: English with some Gaelic terms and names
  quote_policy: summarized
