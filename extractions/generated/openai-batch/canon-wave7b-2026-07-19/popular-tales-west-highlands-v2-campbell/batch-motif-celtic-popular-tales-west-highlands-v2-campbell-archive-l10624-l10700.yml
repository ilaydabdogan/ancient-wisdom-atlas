canonical_text:
  quote: ''
  summary: A shapeshifting Gille Mairtean accompanies Mac Iain Direach disguised as
    a maiden, wounds the King of Eirinn after being accepted as a wife, then becomes
    a ship to carry Mac Iain, the King of France's daughter, and the Yellow Bay Filly
    to Diurradh. He then becomes a filly used as a decoy so Mac Iain can obtain the
    White Glave of Light from the Seven Big Women of Diurradh. The women mount the
    false filly, strike him with a rod, and he runs across moors toward a mountain
    crag. A note links the incident to a Sutherland bay water-horse tale.
  language: English
  quote_policy: summarized
