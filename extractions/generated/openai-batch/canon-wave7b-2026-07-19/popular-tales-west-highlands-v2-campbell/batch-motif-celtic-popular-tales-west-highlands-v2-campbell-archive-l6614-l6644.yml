canonical_text:
  quote: ''
  summary: The passage opens a tale about three widows, each with a son. Dómhnull,
    one son, owns more stots than the others. The others complain, kill his stots
    at night, and Dómhnull finds them dead. He flays and salts the animals, takes
    a hide toward the town to sell, spends the night in a wood with the hide over
    his head, catches a bird that lands on it, and later tells a gentleman that the
    bird is a soothsayer.
