canonical_text:
  quote: ''
  summary: The Feen suffer failed hunting and search shores for food. Fionn dreams
    of a hard night at a crag where he will be driven backward and unable to escape.
    On waking he injures Diarmid, who retaliates. The group casts lots over who should
    go and who should stay; most depart while Fionn stays. At night some of the group
    shelter by a tree, make a booth, play cards, and sleep in frost. Fionn and followers
    see a light and find them. They later enter a hunter's house occupied by a woman
    in a fine green kirtle. The house has seven doors, and Fionn sets his attendants
    in the doors. The woman warns that the son of the king of the people of Danan
    is coming that night with eight hundred heroes.
  language: English
  quote_policy: summarized
