  quote: ''
  summary: The passage first gives a note on a puzzle attributed to Hector Urquhart,
    including a comment that similar puzzles are current in India. It then begins
    the tale “The Eidere (Knight) of Riddles,” attributed to John Mackenzie near Inverary.
    In the tale, a king has an elder son by his first wife and a younger son by his
    second wife. The queen fears her son will not inherit the kingdom and repeatedly
    arranges for poison to be put in the heir’s drink. The younger brother overhears
    and warns the elder. After the second attempt, the elder decides to bottle the
    draught and leave the house; the younger brother says he will accompany him.
