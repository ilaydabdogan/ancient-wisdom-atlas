canonical_text:
  quote: ''
  summary: A king or prospective husband goes hunting after giving a woman keys and
    forbidding her to open one small chamber. She opens it, finds her two sisters
    dead, and gets blood on her feet that she cannot clean. A tiny cat cleans the
    blood in exchange for milk. When the king returns, he tests her by asking to see
    her feet and, finding them clean, says she has behaved well. The next day, the
    cat advises her to use three old chests in a plan involving her mother's house.
  language: English
  quote_policy: summarized
