canonical_text:
  quote: '"Mise mi Fhin" — me myself.'
  summary: The passage collects Highland accounts of Banshees, Fuath, the Brollachan,
    and an Islay water-horse. It describes fairy or water-spirit traits such as webbed
    feet, yellow hair, green dress, manes, tails, noseless faces, hairiness, and large
    eyes. The main embedded tale tells of a woman alone on an island during a storm;
    a large hairy creature enters her hut, asks her name, seizes her, is scalded with
    boiling water after she gives the name “Me myself,” and later cannot get help
    because his companions understand him to say that he hurt himself. The woman survives
    by lying inside a consecrated circle after moving a cow, which is dead by morning.
    The narrator also notes related versions from John Piper, Man, and Gairloch.
  language: English with Scottish Gaelic phrases
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Beann na Caltuinn, an unnamed caller asks Donald MacIlobb whether he will
    eat charcoal, and Donald refuses because his wife will give him supper at home.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Munro family is said to have married with the Vougha of Beann na Caltuinn,
    and their descendants are said to have had manes and tails until within the last
    four generations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loch Nigdal is described as near Skibo Castle, with a granite rock, a burn,
    and a mill where the Brollachan entered.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The miller's wife saw a Banshee sitting quietly on a stone; she wore a green
    silk dress with puffed sleeves, had long yellow hair, and had no nose when viewed
    closely.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A shepherd found an old, dirty Banshee at the edge of the moss, offered to
    carry her, saw that she was web-footed, threw her off, discarded the plaid she
    had lain on, and ran away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that the Fuath in Sutherland is a water-spirit with male
    and female forms, webbed feet, yellow hair, green dress, tails, manes, no noses,
    and vulnerability to light and steel; the narrator also says they become restless
    when crossing a stream.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Islay water-horse tale, a woman is left alone with cattle on a small
    island when her male fellow-servant is prevented by storm from returning from
    the mainland.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: While the woman sits by her peat fire, she hears living creatures around the
    hut, sees large round hostile eyes at the window, and an unearthly tall, large,
    rough, hairy creature with a dark livid facial covering enters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The creature asks the woman her name; she answers “Mise mi Fhin,” meaning
    “me myself,” and when the creature seizes her she throws a ladle of boiling water
    over him, causing him to yell and leave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Other wild voices ask the scalded creature who hurt him; when he says “Mise
    mi Fhin,” they laugh.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The woman rushes outside, moves a cow from its resting-place, makes a circle
    around herself, lies there, hears footsteps, laughter, and strife through the
    storm, and is safe in the morning inside the consecrated circle while the cow
    is dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: An Islay pilot reports that water-horses still haunt a nearby glen, that rattling
    chains are heard there, and that newspapers had reported a mermaid near the same
    spot.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator says he had heard the groundwork of the story from John Piper
    and a similar story in Man, and identifies it as the same as the Brollachan; in
    that summarized version the creature is scalded by a woman who called herself
    Mi Fhin because he wanted to eat her porridge.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The narrator reports hearing a similar story from a gentleman at an inn in
    Gairloch, but the provided passage breaks off before the details of that story.
  category: speech
  evidence_refs:
  - ev:11
