canonical_text:
  quote: ''
  summary: Brian, called son of the King of Greece, travels with a speaking fox that
    becomes his adviser and mount. The fox brings him to the house of a many-headed
    giant who owns a marvellous bird and advises Brian to enter service there. Brian
    steals the bird but uncovers it; its screech wakes the giant. The giant catches
    Brian with magic shoes, binds him, and gives him the choice of death or stealing
    the White Glave of Light from the realm of Big Women. The fox rebukes Brian, carries
    him to that realm, and begins instructing him in a crying ruse before the passage
    breaks off.
  language: English with embedded Scottish Gaelic phrases
  quote_policy: summarized
