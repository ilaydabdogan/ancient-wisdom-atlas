canonical_text:
  quote: ''
  summary: Domhnull claims that a bird can perform divination and interprets its cry
    as a message that a gentleman wishes to buy it for two hundred pounds Saxon. The
    gentleman buys the bird, which does no divination afterward. Men who see Domhnull
    counting the money are told to kill and flay their own stots and sell the hides
    in town; they do so, are mocked, and return angry. They choke Domhnull's mother
    at a well. Domhnull finds her dead, takes her home, dresses her in her best clothes,
    carries her to the king's house, props her by a well with a stick, and sends a
    maidservant to tell the king that the woman has business with him.
  language: English
  quote_policy: summarized
