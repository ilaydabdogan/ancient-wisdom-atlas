canonical_text:
  quote: ''
  summary: The passage gives the end of an old proverbial rhyme about fear of hooked
    feet, a killed sister, and blame placed on John Roy's cat. It then begins a tale
    in which a scholar threatened with beheading if he cannot answer three questions
    seeks help from a miller, who disguises himself and gives clever answers about
    a ladder to the sky, the middle of the world, and the worth of the world.
  language: English
