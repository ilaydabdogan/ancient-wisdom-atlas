canonical_text:
  quote: ''
  summary: The passage gives the end of one version of “The Three Widows” and begins
    a third version, “Brian Briagach.” In the first, two men kill their wives while
    trying to imitate a feast-and-revival episode associated with Levi-our; a horn
    fails to revive the wives. They pursue Levi-our, who diverts them toward a shepherd,
    then later tricks them into a pool by claiming sheep can be found there. In the
    Brian version, Lying Brian sells a merchant a falsely money-making mare, stages
    his wife’s apparent death and revival with blood-filled entrails and horns, and
    later escapes death in a sack by substituting dogs. Brian then appears with cattle
    and claims the sea brought him wealth and contact with the merchant’s dead female
    kin.
  language: English
  quote_policy: summarized
