canonical_text:
  quote: ''
  summary: The passage summarizes a Gaelic variant associated with “The Knight of
    the Red Shield,” noting its oral recitation in Barra. In the summarized tale,
    a hero travels by boat with a king’s two sons to recover the king’s teeth, encounters
    wounded heroes whose stolen sister is linked to a lady he has rescued, receives
    foreknowledge of enemies, defeats enchanted warriors, giants, harpers, a darkness
    figure, and an old carlin, and gains victory over a reviving magic cup. The editor
    also comments on the tale’s wide spread and resemblance to medieval romance.
  language: English
  quote_policy: summarized
