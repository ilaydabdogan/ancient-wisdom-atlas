canonical_text:
  quote: ''
  summary: A first-person hero is sent by his father-in-law to hunt and returns to
    hear from his weeping mother-in-law that his bride has been taken by the wet-cloaked
    warrior. He follows a duck track on the ninth morning, launches his ship, reaches
    the warrior's town, learns of a wedding from a herdsman, takes the herdsman's
    patched cloak, attacks the assembled wedding party, and carries his wife away
    by boat. After a return celebration at his father-in-law's town, the same hunting
    absence recurs, and the mother-in-law reports that the son of the King of Sorcha
    has taken the bride; the hero again begins a ship pursuit.
  language: English
  quote_policy: summarized
