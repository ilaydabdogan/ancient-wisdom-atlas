canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of Iain: an unnamed man rescues him by
    boat to Spain after eliciting a promise involving half his wife and children;
    Iain is restored in appearance, plays a whistle that frees and restores the king''s
    daughter, marries her, receives the realm, and later learns that his rescuer was
    the corpse for which he had paid in Turkey. Editorial notes identify oral sources
    and compare the tale to material known from Grimm and Hans Andersen. The passage
    then begins another tale: a sick queen sends her three daughters to a well of
    true water; a toad denies the water to the two elder daughters when they refuse
    marriage, but the youngest promises marriage to heal her mother, obtains the water,
    and later receives the toad at the door as he recites her pledge.'
  language: English, with a short Gaelic refrain and phonetic rendering
  quote_policy: summarized
