canonical_text:
  quote: ''
  summary: A smith is instructed by an old man to enter an opened fairy hill on a
    particular night with a Bible, a dirk, and a crowing cock in order to recover
    his son. The smith enters the lit, musical hill, demands his son, and after the
    cock crows the fairies throw father, son, and dirk out. The son remains inactive
    and nearly silent for a year and a day, then demonstrates extraordinary sword-making
    skill. Campbell's note compares several incidents with other tale collections
    and records local beliefs about opened fairy hills, dancing fairies, changeling
    substitutions, and people carried away by fairies.
  language: English
  quote_policy: summarized
