canonical_text:
  quote: ''
  summary: In the castle, the Fair Chief is unaware that much more time has passed
    than he thinks. The damsel tells him that his food, drink, and bed will not worsen
    until he chooses to return home. Later, after he boasts of great strength, she
    warns him that the Feen can defeat any man. He resolves to seek them. She gives
    directions for approaching Fionn, advises humility, and tells him to ask that
    Fionn place him in a napkin when need comes, whether alive or dead. The Fair Chief
    departs, finds the Feen fishing trout with Fionn apart from them, and exchanges
    blessings with Fionn.
  language: English
