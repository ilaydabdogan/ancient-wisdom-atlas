canonical_text:
  quote: '"It is an island and a hoop of fire about it, flaming at either end"'
  summary: Three named warriors on a ship dispute who can climb the mast to bring
    news. The Knight of the Cairn climbs and faints; the Knight of the Sword climbs
    partway and is unable to go up or down. The Son of the Green Spring by Valour
    leaps to the cross-trees, reports seeing something that becomes identifiable as
    an island encircled by fire, and the party lands on the windward side, draws up
    the barge, rests three days and nights, and prepares arms before seeking news
    from the isle.
  language: English
  quote_policy: quoted
