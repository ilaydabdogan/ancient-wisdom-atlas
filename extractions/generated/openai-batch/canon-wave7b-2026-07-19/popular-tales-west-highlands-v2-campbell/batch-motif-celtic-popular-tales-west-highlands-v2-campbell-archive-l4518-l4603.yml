  quote: ''
  summary: The passage recounts a dispute over which side to support in a coming battle,
    Fearghus seeking help from Fionn and receiving neutrality instead, the ordering
    of battle lines, Boinne Breat arming himself and devastating the opposing ranks,
    the killing of a disabled one-eyed man so he cannot report the event, Fearghus
    beheading his mother's brother under threat, the smith's daughter taking arms,
    and Lagh an Laidh entering a frenzy while searching for the now-unarmed Boinne
    Breat.
