  summary: 'The passage introduces a small collection of riddles collected by Hector
    MacLean, mostly from a school-girl in Islay. The riddles describe and answer:
    linseed; a man with a porridge pot on his head; a hare; Death, described as a
    small figure with the world under his power; and the rainbow, described through
    an image of a man in a green boat with red-threaded clothing.'
