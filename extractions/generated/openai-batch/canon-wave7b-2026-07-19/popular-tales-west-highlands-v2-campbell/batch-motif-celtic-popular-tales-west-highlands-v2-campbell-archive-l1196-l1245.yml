canonical_text:
  quote: ''
  summary: A kettle is missing after a frightening encounter. The wife goes to a knoll,
    finds the kettle inside, and carries it away. An old carle calls for two dogs
    to be released. The dogs pursue her, but she throws portions of the kettle’s contents
    to delay them. Near the farm, local dogs bark at the dogs of peace, and the woman
    of peace does not return for the kettle.
