canonical_text:
  quote: ''
  summary: A war leader identified in the passage as Fearghus/Fhearghuis recounts
    threatening battle, sailing to Alba, gathering heroes, receiving further aid from
    the king of Sassun, and returning to Erin. He confronts the king of Erin, his
    maternal uncle, over promised support and supplies. The king of Erin travels through
    Erin to gather people, reaches An t' lubhar/Newry, and enters the house of Goibhlean
    Gobha because he is thirsty. The smith's daughter serves him milk from a vessel
    connected with the smith's single cow, Glas Ghuibhlean, though she fears death
    if the vessel is not full when her father returns. The king drinks part of the
    milk, restores the vessel to fullness by a spell, has an intimate encounter implied
    by the statement that the girl was his own, and offers her livestock and grazing
    lands; she asks for writing and a drop of blood to bind the promise.
  language: English
  quote_policy: summarized
