canonical_text:
  quote: ''
  summary: The Badenoch fairy accounts are introduced as similar to the preceding
    accounts. The narrator reports eight stories from a Highland minister, indicating
    a popular belief that fairies carried off men, women, and children who seemed
    to die but lived underground, with only a narrow separation between mortals and
    fairies. One story has a man seeing fairies carding and spinning in a shealing,
    with the long-dead Miss Emma MacPherson of Cluny among them. Another has a benighted
    woman entering a fairy hill and promising her unborn child in exchange for being
    let out; she later gives the child and is allowed to visit it, though the excerpt
    ends mid-sentence.
  language: English
