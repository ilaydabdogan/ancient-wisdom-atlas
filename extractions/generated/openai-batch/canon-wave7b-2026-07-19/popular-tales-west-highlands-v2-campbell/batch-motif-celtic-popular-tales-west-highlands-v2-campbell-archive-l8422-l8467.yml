canonical_text:
  quote: ''
  summary: An unnamed speaker instructs the daughter to use chests, a tree-top warning,
    and a magic club to recover her two sisters and deceive the male figure transporting
    the chests. The male figure carries the chests to the widow's house, is prevented
    from opening them by voices calling from within, returns enraged, breaks in the
    door, and is beheaded by the daughter with a bar. Afterward he becomes a king's
    son, marries her, and the mother and sisters are left with gold and silver for
    life.
  language: English
  quote_policy: summarized
