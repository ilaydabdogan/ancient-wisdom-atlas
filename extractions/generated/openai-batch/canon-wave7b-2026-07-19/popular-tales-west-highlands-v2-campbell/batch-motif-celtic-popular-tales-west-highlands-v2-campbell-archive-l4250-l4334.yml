canonical_text:
  quote: ''
  summary: A young claimant to the kingship of Erin disputes with his maternal uncle,
    who denies his right to rule until the uncle is dead. The young man threatens
    battle and sails to Alba to seek aid. The king of Alba receives him with royal
    hospitality, promises nine hundred heroes, and reluctantly grants his son Boinne
    Breat as commander after promising to give what he can. The king of Alba warns
    that Boinne Breat can only be overcome by treachery. The party then sails to Sassun,
    where the young king is again received with hospitality and begins recounting
    the grievance to the king there.
  language: English
  quote_policy: summarized
