  quote: ''
  summary: Ian receives advice and a blessing from an Oracle before setting out to
    avenge his friend. After sunset on the Mile Reith he battles the Coluinn, a being
    that cannot be seen in daylight, wins, and carries him toward light. The Coluinn
    asks to be released, promises never to be seen there again, swears on named objects,
    and is freed. He flies away singing a lament that the passage says is still sung
    by women to children in that country.
