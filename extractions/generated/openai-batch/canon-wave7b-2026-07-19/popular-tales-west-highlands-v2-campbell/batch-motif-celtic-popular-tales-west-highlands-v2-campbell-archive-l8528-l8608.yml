canonical_text:
  quote: ''
  summary: The passage concludes part of a tale in which a girl is instructed to hide
    her sisters, valuables, and a sword in hay-stuffed sacks, have them carried to
    her mother, and then decapitate a pursuing male figure. Editorial notes compare
    the tale to several Bluebeard/Fitcher's Bird-type analogues and to Gaelic stories
    about underground shapeshifting abductors. The passage then begins another tale,
    in which an old soldier named John lodges in a castle and encounters two tawny
    women carrying a dead man's chest, from which he pulls an old hoary bodach.
  language: English with Gaelic phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unidentified speaker instructs the girl to use a vessel of balsam on her
    big sister, place the sister in a sack with gold and silver, stuff the sack with
    hay, and present it as a whisp for the cow to be left with the mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instruction says to repeat the same process with the second sister and,
    on the third day, to put the girl herself and the white glaive of light into the
    sack.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instruction says that when the male figure comes through the door, the
    girl should cut off his head with the sword and keep the sword on the spinal marrow
    until it cools, before the head can go on again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl follows the instructions; the male figure carries the three sisters
    alive, along with his gold and sword, in hay-stuffed sacks to the mother, saying
    each time that it is a whisp for the cow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the third day, the male figure returns home, notices the girl is absent,
    goes to the poor woman's house, and is decapitated by the youngest daughter as
    he enters the door.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the decapitation, the youngest daughter returns to the castle and stays
    there with the king's daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An editorial note identifies the tale with several named analogues, including
    Mr. Greenwood, Old Dame and her Hen, Fitcher's Vogel, Old Rink Rank, Barbe Bleu,
    and Bluebeard, and states that the Norse and Gaelic versions resemble each other
    most.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: An editorial note describes a recurring Gaelic idea of underground people
    who assume various creature-shapes, live by hunting, possess gold, silver, and
    swords, carry off women and children, and eat or murder victims.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A new tale begins with an old soldier leaving the army, going to the top of
    a hill, and saying that mischief may take him if he comes again in sight of the
    town.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A gentleman grants the old soldier lodging for the night in a castle beside
    a wood and says he shall have pipe, tobacco, whisky, and a bible.
  category: action
  evidence_refs:
  - ev:7
