canonical_text:
  quote: ''
  summary: 'A series of Sgire mo Chealag episodes presents deceived or foolish people:
    a naked man and a man in a dead-chest report what their wives told them; boatmen
    miscount themselves until an observer counts them by striking them; tenants drain
    a loch, blame a great eel, try to feed a cow on roof grass, and hold a court that
    executes a horse for carrying a stolen cow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a funeral, the people flee and leave the funeral; a naked man stands at
    the end of the dead-chest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man from the wood asks the naked man whether he knows him; the naked man
    says he does not.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The naked man says his wife told him that clothes were about him, and the
    man in the chest says his own wife told him that he was dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the men hear the dead speaking, they run away; the wives come and take
    the men home, and the wife of the man who was dead gets the ring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The observer then sees three people described as as silly as the three he
    had left at home, and he returns home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Twelve men are counted going into a fishing boat, but only eleven are counted
    when the boat lands because the counter does not count himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The observer offers to find the missing man for a reward, makes the men sit
    beside each other, and strikes them one by one with a rung of a stick until twelve
    men have been counted and bloodied.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The beaten men are pleased because the lost man has been found, and they make
    a feast for the one who found him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The tenants of Sgire mo Chealag drain a loch to get fresh fish for the feast,
    find only one great eel, call it the monster that ate their fish, and take it
    to drown in the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Four men try to put a cow on the top of a house so that she may eat grass
    growing on the roof.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The observer asks what reward they will give him to bring the grass down,
    then cuts the grass and gives it to the cow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A man comes with a cow in a cart; the people of the town find out that the
    cow was stolen, hold a court, and put the horse to death for carrying the cow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says that this court episode is what made Iain Lom the bard utter
    a saying about Sgire mo Chealag.
  category: other
  evidence_refs:
  - ev:5
