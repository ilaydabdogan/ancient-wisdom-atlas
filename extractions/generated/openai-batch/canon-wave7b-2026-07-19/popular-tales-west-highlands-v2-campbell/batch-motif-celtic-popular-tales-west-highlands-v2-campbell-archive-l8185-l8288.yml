candidate_motifs:
- id: motif:1
  label: Three tasks by a clever thief
  taxonomy_refs:
  - trickster_boundary
  basis: The passage states that Gaelic agrees with Herodotus, Straparola, and Grimm
    in having three tasks accomplished by a clever thief, and the Herodotean king
    pardons the thief who has outwitted him three times.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The available taxonomy has no specific clever-thief category; "trickster_boundary"
    is a broad fit for deception and rule-crossing.
- id: motif:2
  label: Theft or escape using a dead body part as decoy
  taxonomy_refs:
  - trickster_boundary
  basis: Cassandrino uses a dressed corpse in the bed theft, and the Herodotean thief
    uses a dead man's hand to escape the daughter.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The two incidents use different body-related devices and occur in different
    comparative versions.
