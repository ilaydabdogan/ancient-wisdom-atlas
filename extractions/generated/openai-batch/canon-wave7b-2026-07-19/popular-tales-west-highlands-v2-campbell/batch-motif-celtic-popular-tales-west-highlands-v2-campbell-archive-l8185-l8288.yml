canonical_text:
  quote: ''
  summary: Campbell comments on comparative versions of a clever-thief tale. He summarizes
    Straparola episodes involving Cassandrino stealing a priest's bed, a horse, and
    a clergyman; summarizes the Herodotean Rhampsinitus story with a secret treasure
    chamber, a trapped brother, recovery of a body from guards, a dead-hand escape,
    pardon, and marriage; and then compares Gaelic, Italian, German, Norse, Norwegian,
    Egyptian/Herodotean, and other Gaelic parallels, especially the recurrence of
    three tasks by a clever thief.
  language: English
  quote_policy: summarized
