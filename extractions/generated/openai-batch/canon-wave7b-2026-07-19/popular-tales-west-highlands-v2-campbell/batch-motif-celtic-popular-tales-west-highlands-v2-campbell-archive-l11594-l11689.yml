canonical_text:
  quote: ''
  summary: 'A series of folk-medical anecdotes and commentary: a young doctor lures
    a serpent from an ill woman with milk and kills it; the narrator compares this
    to African/Anansi and London bait-cure stories; the Olladh Muileach cures rheumatism
    by whipping and chasing a patient until he sweats, and cures sore eyes by preventing
    eye-rubbing through a false warning about horns on the knees. The passage also
    compares a sweating cure to the Arabian Nights sage Dooban, notes the Bethune/Beaton
    physician tradition, and speculates on serpent healing associations from biblical
    and classical examples to Highland and Spartan contexts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young doctor has an ill woman placed in a dark room on the floor with a
    saucer of milk before her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A serpent first shows only its head, then comes out when the milk is moved
    farther away; the young doctor kills it and the woman recovers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator lists parallel bait-cure stories involving an African/Anansi
    episode with a swallowed baboon and banana bait, and a London story in which a
    serpent is tempted out with a mutton chop.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Olladh Muileach treats a rheumatism patient by making the patient’s wife
    strike him with a birch rod and chase him until he sweats and becomes supple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator compares the sweating cure with the Arabian Nights sage Dooban,
    who makes King Voonan play ball until he perspires and absorbs medicine from the
    handle of a stick.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For sore eyes, the doctor tells a man that horns may appear on his knees unless
    he keeps his hands there for three weeks; afterward the man’s eyes are well, and
    the doctor tells him not to rub them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage notes descendants of Fergus and Gilleadh in Islay and describes
    Malcolm Bethune/Beaton as belonging to a learned physician family remembered in
    Western Isles tradition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrator asks whether the serpent cure may be a remnant of serpent worship
    or possession, and states that serpents are associated with healing in Highland
    and other traditions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A journal entry near Sparta describes a shepherd in a sheepskin cloak with
    a crook handling a serpent about a yard long.
  category: action
  evidence_refs:
  - ev:8
