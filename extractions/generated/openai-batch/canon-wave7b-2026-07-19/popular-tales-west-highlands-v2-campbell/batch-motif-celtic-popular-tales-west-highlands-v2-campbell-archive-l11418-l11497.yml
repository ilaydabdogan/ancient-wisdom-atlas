    as caused by a black beetle secretly placed there by doctors, curing the king,
    receiving a grant of islands after requesting the king's daughter and lands, and
    later dying by poison. Editorial notes compare the knowledge-gaining incident
    with Volsung, Scottish, German, Grimm, and Gaelic parallels.
