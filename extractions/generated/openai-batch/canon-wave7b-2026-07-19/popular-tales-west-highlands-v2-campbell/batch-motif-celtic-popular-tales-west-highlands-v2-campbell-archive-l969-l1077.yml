canonical_text:
  quote: ''
  summary: The passage concludes a tale episode in which a young brother and the Hero
    of the White Shield fight until they recognize their kinship through a statement
    of blood and descent from Ardan, King of Albann. The young man is welcomed into
    the hero's palace, then later encounters twelve powerful men playing shinny, learns
    they are his sons by twelve different mothers, and brings the twelve wives and
    twelve sons home; the narrator links his descendants with kings in Alba. The passage
    then gives collection notes, an explanation of the term Ridere/Righdeire, and
    editorial comparisons with Grimm, classical material, and Romulus.
  language: English
