canonical_text:
  quote: "“Take me to the realm of the king under the waves”"
  summary: The passage includes an editorial arithmetic note about John, robbers,
    deaths, and three lives, followed by an episode from “The Widow’s Son.” A lady
    repeatedly comes to the sleeping hero and cannot wake him; in a variant she appears
    on three days in white, grey, and black, with matching chariot-horses, and leaves
    a ring. The hero then undertakes a long journey, receives magical shoes from helper
    women, is carried in a cow-hide bag by great birds to an island, survives there
    for a year and a day, opens a box left by the lady, and commands the three beings
    from the box to take him to the king under the waves. Footnotes report MacCraw
    variant details for the same episodes.
  language: English
  quote_policy: quoted
