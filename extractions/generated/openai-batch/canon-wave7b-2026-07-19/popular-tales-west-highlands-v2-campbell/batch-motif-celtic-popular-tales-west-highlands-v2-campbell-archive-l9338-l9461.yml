canonical_text:
  quote: ''
  summary: The protagonist lodges with a weaver, uses a magic box whose three servants
    provide animals, clothing, and shoes, wins races set as contests for the king's
    daughter, and disappears after each victory. He is later found in degraded appearance
    at the weaver's house and nearly hanged, but the princess recognizes the name
    written on his arm and stops the execution. She declares that Iain, the fisher's
    son, freed her from spells and endured being beheaded three times for her. The
    old carlin and her son are burned in seven furnaces, and a wedding follows. A
    footnote variant adds theft of the magic box and the recovery of the princess
    and palace from the realm of rats by animal helpers.
  language: English
  quote_policy: summarized
