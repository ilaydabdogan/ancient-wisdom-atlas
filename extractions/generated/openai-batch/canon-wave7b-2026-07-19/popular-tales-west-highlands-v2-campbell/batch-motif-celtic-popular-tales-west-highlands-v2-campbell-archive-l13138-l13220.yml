canonical_text:
  quote: ''
  summary: A female figure commands the royal son to keep moving from meal to meal
    until he finds her somewhere under the four quarters of the world, then disappears
    after shaking a napkin. The son returns home sorrowful; his father, the king of
    Eirinn, offers wealth and resources to lift the spells, but the son refuses and
    departs alone. After a week of deprivation, he finds a castle that first appears
    to have no opening. A shout invites him back to a feast; on return the castle
    has a door and window for every day of the year, and he is received with food,
    drink, music, lodging, warm water for his feet, and a morning meal.
  language: English
  quote_policy: summarized
