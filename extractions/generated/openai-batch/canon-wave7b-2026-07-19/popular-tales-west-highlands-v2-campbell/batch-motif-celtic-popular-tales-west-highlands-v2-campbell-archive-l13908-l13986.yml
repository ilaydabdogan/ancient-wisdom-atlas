canonical_text:
  quote: ''
  summary: A king of Eirinn goes hunting with his people, warriors, nobles, and gentles
    and sits on a green hillock. A speaker boasts that no one would dare disgrace
    the king before his realm, but the king says such a person might come. A rider
    on a black filly follows the shadow of a shower, appears surpassingly impressive,
    speaks wise words, then strikes the king, knocks out three teeth, puts them in
    his pouch, and departs. The king’s son, the Knight of the Cairn, the Knight of
    the Sword, and Mac an Earraich uaine ri Gaisge each vow abstinence until they
    take a corresponding body part from the assailant.
  language: English
  quote_policy: summarized
