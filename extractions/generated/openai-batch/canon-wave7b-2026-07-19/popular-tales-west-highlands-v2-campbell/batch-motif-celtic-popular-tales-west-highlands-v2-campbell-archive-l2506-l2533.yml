canonical_text:
  quote: ''
  summary: Two shepherd-neighbors live on opposite sides of a river between Lochaber
    and Badenach. The west-side shepherd visits the east-side shepherd in the evening,
    stays late, and refuses the host's urging to remain overnight. The host's strong
    son, accompanied by a herding dog, escorts the visitor across the river. On returning
    with the dog, the son reaches the river and chooses to remove his foot-clothes
    rather than use the stepping-stones.
  language: English
