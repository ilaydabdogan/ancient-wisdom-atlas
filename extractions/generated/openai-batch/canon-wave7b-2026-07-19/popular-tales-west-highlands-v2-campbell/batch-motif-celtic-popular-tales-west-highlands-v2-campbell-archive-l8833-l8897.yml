canonical_text:
  quote: ''
  summary: 'The passage first gives editorial notes on ''The Tale of the Soldier,''
    including its Gaelic dictation source, an asserted relationship to Grimm''s tale
    of the man who travelled to learn what shivering meant, and a note that the story
    is widespread in Europe. It then begins ''The Sharp Grey Sheep'': a king''s first
    queen dies, the king remarries, and the new queen mistreats the first queen''s
    daughter, sends her to herd sheep, and gives her insufficient food. A sharp horned
    grey sheep brings meat to the girl. The queen, wondering how the girl survives,
    consults the henwife, whose daughter Ni Mhaol Charach is sent to watch. The sheep
    will not come while the watcher is present, and the queen''s daughter gets Ni
    Mhaol Charach to put her head on her knee for hair-dressing; Ni Mhaol Charach
    falls asleep.'
