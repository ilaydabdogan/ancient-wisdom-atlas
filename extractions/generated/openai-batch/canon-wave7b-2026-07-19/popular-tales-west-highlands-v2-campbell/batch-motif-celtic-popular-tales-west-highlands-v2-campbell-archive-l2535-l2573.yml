canonical_text:
  quote: ''
  summary: A shepherd's son loses his bonnet after his dog leaps at his head near
    a river. He returns across the river and finds a large man holding the bonnet.
    After the lad takes it back, the large man tries to drag him down to a loch. The
    lad resists by gripping an oak tree until cockcrow near daybreak, after which
    the large man releases him and leaves.
