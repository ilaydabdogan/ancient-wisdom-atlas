canonical_text:
  quote: ''
  summary: A servant of the chief magistrate wagers with a bishop that he can steal
    the bishop that night. The servant obtains salmon skins, has tailors make them
    into a dress or cloak by midnight, enters the bishop's church with a key, goes
    to the pulpit, and is reported as preaching in a lit church. The bishop, seeing
    the church brightness and hearing the preacher use many languages and denounce
    him, becomes afraid.
  language: English
  quote_policy: summarized
