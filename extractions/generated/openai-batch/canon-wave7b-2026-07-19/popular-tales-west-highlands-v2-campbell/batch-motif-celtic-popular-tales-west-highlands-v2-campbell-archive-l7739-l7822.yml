    steal the bishop, while the servant says he is not afraid.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night the servant goes to the bishop's house area and then seeks out fishermen
    of the city to ask for fresh-killed salmon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fishermen skin salmon for payment, and the servant receives enough fish
