canonical_text:
  quote: '"It is my bargain to herd the mountain, and I will keep the mountain where
    it is."'
  summary: In the supplied passage from the Mac-a-Rusgaich tale, a servant repeatedly
    performs tasks according to the exact wording of his master’s commands or bargains.
    He holds a plough without ploughing, reports that the mountain itself is all right
    instead of herding cattle, searches for missing heifers in the house thatch after
    being told to search where they might and might not be, then finds the heifers
    and repairs the thatch. The passage ends with instructions for fetching the master
    home from a wedding and signaling him with an “ox eye.”
