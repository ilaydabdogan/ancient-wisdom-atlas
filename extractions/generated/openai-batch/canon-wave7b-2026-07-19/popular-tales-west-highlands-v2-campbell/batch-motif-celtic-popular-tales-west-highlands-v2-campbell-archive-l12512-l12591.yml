canonical_text:
  quote: ''
  summary: 'The passage gives the close of a wise-question exchange in which a miller
    answers how long it would take to go round the world and identifies himself as
    the questioner''s brother rather than his scholar. A collector''s note links such
    wise sayings to George Buchanan. The passage then lists several riddles and answers:
    whether man or beard is older; what wood is neither bent nor straight; what the
    Creator never saw, kings seldom see, and the speaker sees daily; and a river-ferry
    puzzle involving three soldiers and their wives, followed by a solution and a
    note comparing it to the Fox, Goose, and Bag of Corn puzzle. A Gaelic section
    begins with versions of the first two riddles.'
  language: English with some Scottish Gaelic
  quote_policy: summarized
