    as a handsome and successful hunter.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: On a hunting day when he gets no game, Iain Direach shoots at a blue falcon,
    knocks a feather from her wing, places it in his hunting bag, and takes it home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Iain Direach's muime receives the feather and lays crosses, spells, and the
