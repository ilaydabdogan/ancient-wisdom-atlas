  text: The passage glosses the names Gille, Neumh, Mac, and Rusgaich and suggests
    that the title may be rendered as a story of Saint's servant, Mac Skinner.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A reported tradition says Gille Neumh Mac Rusgaich disguised himself in woman's
    apparel, went to Iona, passed for a nun, and caused some of the sisters to become
    frail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same report says there is a long tale about Mac-a-Rusgaich and his sister,
    in which she entered service attending ladies and he disguised himself in her
    clothes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The editor says the story of MacRuslaig or Mac-a-Rusgaich is widely spread
    and that a very similar story is known in Sutherland.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sutherland tale is framed as an Erse version of Jack the Giant Killer,
    though the editor says the opening and the deaths of Cormoran and Blunderbore
    from children's books are absent there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Sutherland account, a giant threatens to kill a little herd boy; the
    boy replies that he is strong despite being small and that he is an enchanter
    who would make the giant ill if eaten.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The giant crushes a stone to powder and challenges the boy; the boy uses curds
    disguised as a stone and squeezes whey from them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The giant throws a heavy hammer; the boy claims he would throw it out of sight
    into the sea, so the giant asks him not to throw his great-grandfather's hammer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tale continues with food tests including brose and a black pudding; when
    the boy pierces the pudding and it runs blood, the giant imitates him with a knife
    in his own body and dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mac Iain Direach is introduced as the son of a king and a dead first queen;
