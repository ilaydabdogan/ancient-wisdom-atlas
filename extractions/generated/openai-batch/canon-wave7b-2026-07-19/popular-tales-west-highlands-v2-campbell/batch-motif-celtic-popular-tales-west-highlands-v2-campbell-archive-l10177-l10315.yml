canonical_text:
  quote: ''
  summary: 'The passage contains editorial notes on Mac-a-Rusgaich, including name
    glosses, a tradition that Gille Neumh Mac Rusgaich disguised himself as a woman
    or nun at Iona, and comments that similar stories are widespread. It then summarizes
    a Sutherland giant-and-herd-boy tale associated with Jack the Giant Killer and
    compared by the collector to a Scandinavian Giant and Herd Boy story. Finally,
    it begins the tale of Mac Iain Direach: a royal hunter obtains a blue falcon feather,
    is cursed by his muime to seek the bird, counter-curses her, and departs on the
    quest.'
  language: English
  quote_policy: summarized
literal_observations:
