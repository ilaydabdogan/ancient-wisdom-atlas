canonical_text:
  quote: ''
  summary: The passage contains editorial commentary on a Gaelic formula of falling
    like a faggot, then recounts a Jura tale in which Chaileach Bheine Mhore, a powerful
    giantess or Carlin with a magical ball of thread, detains MacPhie of Colonsay
    until he learns of and steals the hatchet that can cut the thread and escapes
    by boat. The giantess laments, attempts to draw the boat back, and leaves or is
    associated with a conspicuous hill-mark called Sgriob na Cailich. A further episode
    states that she killed the Islay post at the ferry, prompting MacDonald of Islay
    to promise Buie the farm of Largie Breac if he would kill her; Buie refuses, but
    his eldest son challenges her and is brought to his knees in wrestling.
  language: English with Scottish Gaelic names and quoted phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that in Gaelic legends people beaten to death or enchanted
    are described as falling like a faggot of sticks or twigs, and notes an analogy
    with faggots associated with the Scythian sword-god.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chaileach Bheine Mhore lived in Jura at Largie Breac and had a ball of thread
    by which she could draw toward herself any person or thing if she could throw
    the ball beyond them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Caileach got MacPhie of Colonsay into her toils, would not part with him,
    intercepted his attempts to leave, and could draw his boat back to shore by throwing
    the ball into it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage parenthetically states that a giant in the story of Black White-red
    had an alike magic clue.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: MacPhie pretended contentment, learned that the Caileach had a hatchet able
    to cut the enchanting thread, stole the hatchet, arranged for a boat to wait,
    and departed at dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Caileach saw MacPhie in the boat, she cried out to him, threw the
    magic clue into the boat, and drew it toward shore until the thread was cut and
    the boat rowed beyond her reach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After seeing MacPhie escape, the Caileach became desperate and slid down the
