canonical_text:
  quote: ''
  summary: 'The passage ends one episode in which a female opponent repeatedly overcomes
    a male fighter until he stabs her with his dirk, followed by MacDonald fulfilling
    a land-gift promise to the Buies. The editor then comments on a song about the
    Carlin of Ben Breac and compares old women associated with a sword, magic clues,
    and an island to the Breton Groach. A separate version begins: Brian, son of the
    king of Greece, wants to marry the hen-wife’s daughter, but his father requires
    him first to obtain the world’s most marvellous bird. Brian travels to the house
    of Cailleach nan Cuaean, is hosted for the night, and the next morning finds a
    speaking fox putting on his shoes and stockings; the fox offers to become his
    servant if Brian accepts him.'
  language: English with Gaelic names and phrases
  quote_policy: summarized
