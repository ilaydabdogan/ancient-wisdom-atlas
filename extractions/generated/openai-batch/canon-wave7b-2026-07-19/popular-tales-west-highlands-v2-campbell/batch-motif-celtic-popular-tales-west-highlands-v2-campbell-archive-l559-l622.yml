canonical_text:
  quote: ''
  summary: 'The excerpt concludes an inheritance tale in which an old man exposes
    the youngest son''s theft of his father''s money, leading to confession and division
    of the recovered money. The editor then comments on tale parallels and classification.
    A new tale, ''The Three Wise Men,'' begins: a well-off unmarried farmer visits
    another farmer''s household to look for a wife; the daughter is told to show domestic
    competence, goes to fetch peats for the fire, is struck by falling peats, and
    imagines a future disaster involving marriage, motherhood, and posterity.'
  language: English
  quote_policy: summarized
