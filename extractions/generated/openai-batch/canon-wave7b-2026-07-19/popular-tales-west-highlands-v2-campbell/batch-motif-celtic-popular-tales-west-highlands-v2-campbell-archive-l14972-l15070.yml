canonical_text:
  quote: ''
  summary: Campbell summarizes and compares variants related to The Knight of the
    Red Shield. A prince fights a three-headed giant, receives nightly healing and
    supernatural advice, recovers a tooth, and marries a lady. The editor then discusses
    related tellings involving a king whose tooth is knocked out by a fiery or singing
    head, magic transport, a voyage to a fiery island where teeth are kept, Loircean
    as a despised successful hero, many-headed opponents, underground ladies, restored
    teeth, punishment of rivals, and marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male adventurer is sent in a basket to fight a three-headed giant; he cuts
    off one head each day, gives a pistol-shot signal at a rock to be hauled up each
    evening, and the giant does not fight after sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lady cures the adventurer each night with magic balsam, and he goes out
    fresh each morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The giant's third head repeatedly leaps back on after being cut off, until
    an eagle tells the prince to hold the sword on the neck until the marrow freezes;
    the prince does this and the giant is killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After killing the giant, the adventurer takes spoil from a castle, finds the
    tooth in a drawer, returns home with the beautiful lady, and marries her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Campbell states that in this form two teeth and two adventurers have disappeared,
    an island surrounded by fire has become a high rock, and magic shoes replace the
    magic boat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Campbell says the form is different from The Knight of the Red Shield, while
    its groundwork is the same: incidents remain, but style and accessories change.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In a version called Loircean na luaith, figures see one head coming in flame
    and another head singing; a fist strikes the king's mouth, knocks out a tooth,
    and gold or silver buttons fall from the king's coat in shame; the event happens
    three years in succession.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another related telling has three old men on separate islands who send a wandering
    hero onward with what Campbell first took as a cap and later believed to be a
    coracle, which served the same function as the magic shoes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Loircean, a king's son who is a knight, a red-skulled cook, and Shanks
    in the Ashes go off together and fill roles corresponding to the king's two sons
    and the son of the Green Spring.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The companions climb the mast, and the despised one succeeds; the voyage is
    retained in brief form, including a barge steered so well that it could split
    a grain of hard corn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Loircean leaps onto the barge and shakes ashes off himself, the ashes
    nearly blind the five fifths of Ireland, and seven bolls of ashes fall on the
    barge floor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: From the mast, Loircean sees an island in a red blaze of fire; the barge cannot
    come closer than seven miles because it would catch fire, and Loircean says his
    father's teeth are on the island.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Loircean tells the others to come ashore only if the fire grows smaller after
    nine days and nine nights; he then makes a dark spring ashore, and the handfuls
    he drives out scorch those in the ship.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Later Loircean adventures include a fearful old woman with marvellous teeth,
    three many-headed gigantic warriors, and three lovely ladies found underground
    and carried off by cowards.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Loircean story ends with the replacement of the king's lost teeth, punishment
    of the knight and the cook, and Loircean marrying the three ladies.
  category: sequence
  evidence_refs:
  - ev:7
