canonical_text:
  quote: ''
  summary: Iain, the Barra widow's son, first proves successful in managing shops,
    then chooses a ship because he was raised at sea. A storm separates his ship from
    the others and he reaches Turkey with a coal cargo. There he pays the debt of
    a dead Christian whose corpse is being abused, buries him, and then ransoms a
    Christian woman who is about to be burned after refusing to marry the great Turk.
    The rescued woman warns him about a planned deception during a coal-for-gold exchange;
    by following her instructions, the ship escapes with the gold. Iain returns to
    England, shares the gold with his adopted father, and secures lodging for the
    woman.
  language: English
  quote_policy: summarized
