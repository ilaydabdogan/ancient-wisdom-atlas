  quote: '"There shall not come a stop on my foot, or rest on my head, till I hit
    upon three more silly than you."'
  summary: An unnamed man leaves to find three people sillier than the person he has
    just rebuked. He encounters comic fools involving a cow and roof-grown corn, dyke
    workers who cannot identify their own legs, and a household where he plays tricks
    under the name “Saw ye ever my like.” The editor adds explanatory and comparative
    notes, including parallels to a Ross-shire version and to Norse Tales of the Master
    Thief.
