canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which an old man explains the strange conduct
    and cryptic speech of three brothers: their wise father made them swear to discuss
    important matters only in whispers, and each brother had a hidden household circumstance
    affecting hospitality. The farmer later attends a funeral with the old man, remains
    in his house, marries the old man''s daughter, and receives property. A collector''s
    note identifies Donald MacDonald MacCharles MacIntyre as the teller and describes
    a later storytelling visit. The passage then begins another tale, ''A Puzzle,''
    describing a wake custom in which people drink, sing, and tell tales until daylight.
    A man with no tale or song is expelled, sees three groups of nine in colored garments
    and a horse carrying a woman and man, and receives from the woman a kinship puzzle
    to take back inside.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The farmer demands an explanation because the household bowed their heads,
    whispered, did not answer him for a time, spoke in ways he could not understand,
    and seemed to know his thoughts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man says he and his two brothers inherited the place from their father,
    who made them swear to discuss important matters only in whispers, because people
    cannot dispute in a whisper and the brothers therefore do not quarrel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first brother had the corpse of his mother-in-law inside and did not want
    to invite a stranger into a house of sorrow before the burial.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second brother had a wife who, according to the old man's explanation,
    would do nothing until she received three blows of a stick, and the brother did
    not want a stranger to see this.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man says he understood the farmer's thought when his wife came in
    and then explains possible marriages involving the farmer, the old man's wife
    if he were dead, and the old man's daughter if all parties were willing.
  category: speech
  evidence_refs:
  - ev:3
