canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Maclain Direach, the King of
    France's daughter, the Yellow Bay Filly, the White Glave of Light, the Blue Falcon,
    the Gille Mairtean, a giant, and Maclain's muime are involved. The Gille Mairtean
    changes shape into a boat to ferry the party to the mainland, then into a sword
    to obtain the falcon from the giant and kill him. He instructs Maclain how to
    use the White Glave of Light against the muime's deadly bewitching glance. Maclain
    follows the instructions, the muime falls and is burned, and Maclain is left with
    the wife, filly, falcon, and sword as sources of prosperity and protection.
  language: English
  quote_policy: summarized
