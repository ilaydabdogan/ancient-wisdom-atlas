canonical_text:
  quote: ''
  summary: An unnamed son learns that Lagh an Laidh slew his father, Boinne Breat.
    He receives and dons his father's arms, vows to find the killer, travels into
    a great wood, lodges in a tree, and subdues a monstrous being by shooting arrows
    into its arms until it promises to help him become king over Erin. Together they
    go to the king's palace and demand battle or the head or captivity of Fearghus;
    warriors are sent out against them and killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boinne Breat is identified as the father of the speaking figure and as a son
    of the king of Alba; Lagh an Laidh, brother of Fearghus, is identified as the
    one who slew him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After slaying Boinne Breat, Lagh an Laidh could not remain on the land of
    Erin and went to the hills, where he made a cos in the forest among monsters and
    untamed creatures.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman says that she kept the father's arms, brings them, and the son puts
    them on; the arms fit him as though made for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The son vows not to eat, drink, or stop beyond that night until he reaches
    the man he seeks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After prolonged travel that wears his shoes, the son reaches a great wood
    and makes a cos in one of the trees for the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the morning he sees an uile bheist described as unmatched under the sun,
    stretched out without clothing, foot-covering, or head-covering, with hair and
    beard grown over it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: From above, the son shoots an arrow into the uile bheist's right forearm and
    threatens to sew it to the earth with oaken darts unless it promises to see him
    king over Erin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the uile bheist does not yield, the son shoots it in the left forearm
    and repeats the demand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The uile bheist tells him to come down and promises that before the next night
    it will see either him or itself in the stated position; it then agrees to go
    because it has promised.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The son and the uile bheist go to the king's palace and demand battle or combat,
    or else Fearghus's head or captivity.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Groups of four hundred swift heroes, four hundred full heroes, and four hundred
    strong heroes are sent out and killed; after a repeated challenge, twelve hundred
    swift heroes are sent out.
  category: sequence
  evidence_refs:
  - ev:11
