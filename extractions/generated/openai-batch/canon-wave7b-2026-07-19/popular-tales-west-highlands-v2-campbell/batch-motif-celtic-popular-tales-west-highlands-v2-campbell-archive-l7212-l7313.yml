canonical_text:
  quote: ''
  summary: The passage presents a fourth Argyleshire version centered on Eobhan lurach,
    also called Hugh. He profits through linked deceptions involving a coin-loaded
    cowhide, his dead mother-in-law's body, a staged death and revival of his wife,
    and an escape from a sack execution by substituting a drover. His neighbours imitate
    his claims and die, after which Hugh takes their farms and cattle. The editor
    also notes parallels for the dead-body extortion and valueless-object sale incidents.
  language: English with Scottish Gaelic names and phrases
  quote_policy: summarized
