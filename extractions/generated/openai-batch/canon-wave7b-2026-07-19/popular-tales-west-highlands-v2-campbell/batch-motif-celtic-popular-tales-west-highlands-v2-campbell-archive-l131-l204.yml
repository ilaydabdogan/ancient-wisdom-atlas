canonical_text:
  quote: ''
  summary: A king wagers with a ship captain over whether the captain can gain entry
    to the royal chamber. With help from the hen-wife, the captain hides in a kist
    carried into the queen's sleeping chamber, steals her ring and chain while she
    sleeps, and uses them to convince the king he has been with her. The king crosses
    the loch and leaves; the captain returns to dwell in the king's house. The queen,
    not knowing why the king has not returned, dresses in men's clothes, crosses by
    boat, and is hired as a stable gillie at a gentleman's house, where wild beasts
    and a wild man come nightly to an empty barn.
  language: English
  quote_policy: summarized
