canonical_text:
  quote: the holy, healing power overcomes the subtle destroyer
  summary: The passage is Campbell's comparative note on Gaelic serpent stories. It
    lists several dragon, serpent, and monster-slaying examples, states that Gaelic
    and Highland serpent beliefs are old myths about holy power overcoming the serpent,
    recounts St. Patrick trapping the last Irish snake in a chest and putting it into
    Lough Neagh, and describes Scottish island beliefs that serpents and toads cannot
    live on places linked to Ireland or blessed by St. Columba. It also gives an origin
    legend for Texa and neighboring islets as pieces of Ireland dropped from a giant
    wife's apron.
  language: English
  quote_policy: quoted
