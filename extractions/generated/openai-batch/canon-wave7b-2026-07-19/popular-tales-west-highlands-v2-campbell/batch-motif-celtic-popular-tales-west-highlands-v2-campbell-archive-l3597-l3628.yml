canonical_text:
  quote: ''
  summary: A woman watches a child go aboard a vessel and desires to have him back.
    The boy is taken to England, educated on the vessel until age eighteen, and renamed
    Iain Mac a Maighstir because the man raising him is master of the vessel. A wealthy
    owner with seven ships and seven shops gathers the seven skippers, says he is
    aged and lacks a clan-man heir, learns that one skipper has kept an eighteen-year-old
    son aboard, and offers the youth the choice between remaining with him as heir
    or going to sea with his father.
