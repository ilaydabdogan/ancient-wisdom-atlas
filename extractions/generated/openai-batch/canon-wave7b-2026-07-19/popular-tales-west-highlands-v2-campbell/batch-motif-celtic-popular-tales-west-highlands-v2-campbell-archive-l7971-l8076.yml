- id: obs:1
  text: In the opening fragment, a second person agrees to be hanged, refuses to whistle,
    is left hanging, has his pockets emptied by his friend, and is abandoned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listener asks whether there is more of that story, and MacCraw says there
