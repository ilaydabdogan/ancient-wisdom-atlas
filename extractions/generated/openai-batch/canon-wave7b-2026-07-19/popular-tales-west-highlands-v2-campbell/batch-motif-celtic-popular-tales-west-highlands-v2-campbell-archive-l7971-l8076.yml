- id: obs:3
  text: A smith in Eirinn has a servant or apprentice described as very clever at
    stealing and able to steal anything.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The smith and a gentleman wager five notes on whether the lad can steal the
    gentleman's horse or powney, and the money is laid down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gentleman sends gillies to watch the powney.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The lad buys three bottles of whisky, lies among litter in the gentleman's
    farm square at night, and pretends to be drunk by snoring and snorting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The watchmen find the whisky bottles on the pretended drunk man, drink them,
    become noisy, and fall fast asleep after the third bottle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the watchmen fall asleep, the lad steals the powney, brings it to the
    smithy, and goes to sleep; in the morning the gentleman must pay the bet.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The lad proposes a twenty-note wager that he will steal the gentleman's daughter,
    and the smith and gentleman lay down the money.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Because no time is fixed for stealing the daughter, the gentleman sets a watch
    on his daughter's room, with men going in and out all night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The lad travels to a seaport town in Eirinn, makes friends with a ship captain,
    and secures the captain's help.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The lad dresses himself as a woman, and the captain plans to say that he has
    a sister on board.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The ship sails to the gentleman's house, the captain says he has an unwell
    sister on board after a long voyage, and the gentleman invites her to sleep in
    his daughter's room.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The disguised lad, as the captain's sister, asks the gentleman's daughter
    about the men walking in and around the room; the daughter says they are watchmen
    guarding her from the man who wagered he would steal her.
  category: speech
  evidence_refs:
  - ev:9
