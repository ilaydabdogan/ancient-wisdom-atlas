canonical_text:
  quote: ''
  summary: An opening fragment describes one man left hanging and robbed after refusing
    to whistle. The narration then turns to MacCraw's tale of a smith's servant in
    Eirinn who is famed for stealing. The servant wins a wager by stealing a gentleman's
    guarded powney after causing the watchmen to drink whisky and fall asleep. He
    then makes a larger wager to steal the gentleman's daughter, recruits a ship captain,
    disguises himself as a woman presented as the captain's sick sister, and gains
    access to the daughter's room, where the daughter explains the guards and the
    wager.
  language: English
  quote_policy: summarized
