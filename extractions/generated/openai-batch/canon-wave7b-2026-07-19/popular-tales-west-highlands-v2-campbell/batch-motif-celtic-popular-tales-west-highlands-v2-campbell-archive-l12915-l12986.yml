  summary: 'A sequence of riddles, with English prompts, answers, and some Scottish
    Gaelic equivalents, describes ordinary objects and situations through puzzling
    images: a sieve as a many-doored house, smoke, smoke before flame, an apple-tree
    paradox, a potato pot, a thorn in the foot, a tailor''s thimble, a shoe on a foot,
    and fire, griddle, and oatcake.'
