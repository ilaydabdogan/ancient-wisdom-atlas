canonical_text:
  quote: ''
  summary: Fionn teaches Maghach Colgar, son of the king of Lochlann. Maghach later
    returns to Lochlann for royal succession and, after the chase fails for the Feinn,
    invites Fionn and his company to Lochlann with promises of sea and shore burghs
    full of food and drink. Fionn leaves four men in Eirinn and arranges that a blow
    of the Ord Fiann will signal his condition. In Lochlann, Fionn and his company
    enter a shore burgh with abundant provisions but become immobilized by frozen
    rime, chairs, and knives. Fiachaire and Innsridh hear the hammer signal, travel
    to Lochlann, and fight Greek forces under Iall who seek Fionn’s head for a feast.
  language: English
  quote_policy: summarized
