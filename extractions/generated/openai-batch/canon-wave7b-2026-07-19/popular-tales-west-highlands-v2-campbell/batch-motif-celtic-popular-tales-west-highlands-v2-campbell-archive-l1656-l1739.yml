canonical_text:
  quote: ''
  summary: The passage gives two fairy anecdotes. In the first, a boy named Williamson
    repeatedly disappears for days, is understood to be taken by fairies, appears
    during a peat-casting meal, and later stops disappearing after receiving a cross
    from a priest. In the second, a richly dressed green lady, believed by the household
    to be the Queen of the Fairies, borrows oatmeal and later has meal returned by
    a small green figure; a servant who refuses the meal dies soon after. A small
    green figure later asks the miller to set the mill and water for grinding at night,
    and all is found in order the next morning.
  language: English
  quote_policy: summarized
