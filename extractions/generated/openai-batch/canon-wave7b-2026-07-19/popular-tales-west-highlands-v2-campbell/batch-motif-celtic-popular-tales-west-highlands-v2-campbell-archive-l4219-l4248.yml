canonical_text:
  quote: ''
  summary: The passage opens the tale of Conall. An old king in Erin has a sister,
    Maobh, whose three sons are Ferghus, Lagh an Laidh, and Conall. The king chooses
    the eldest, Ferghus, as heir, gives him royal schooling, and brings him to the
    palace. At year’s end the king worries that the country’s vassals are coming to
    reckon with him. Ferghus answers that he is already publicly proclaimed as young
    heir in records across the realm and proposes to build a fine castle before the
    palace using carpenters, stonemasons, and smiths.
  language: English
