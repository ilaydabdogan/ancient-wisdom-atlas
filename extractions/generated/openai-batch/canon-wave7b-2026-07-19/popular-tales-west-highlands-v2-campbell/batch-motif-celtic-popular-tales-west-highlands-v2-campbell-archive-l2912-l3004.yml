canonical_text:
  quote: ''
  summary: A Gaelic tale is introduced with an editorial comment linking supernatural
    beings with robbers and mountain or cavern dwellers. In the tale, a herd woman
    leaves a remote summer herd dwelling. The male herd remains alone during a snowy
    night, secures the door with heather, and sits by the fire. A noisy being strikes
    and breaks in; a hairy, horned, cud-chewing beast enters and stands by the fire.
    The herd flees through the storm, reaches his master before daybreak, and reports
    the terrifying event. The master and his eldest son take a gun back to the sheiling,
    fire into it, but fear prevents them from searching. The beast emerges, and they
    flee back toward the farm while it follows them; the passage ends mid-action.
  language: English
  quote_policy: summarized
