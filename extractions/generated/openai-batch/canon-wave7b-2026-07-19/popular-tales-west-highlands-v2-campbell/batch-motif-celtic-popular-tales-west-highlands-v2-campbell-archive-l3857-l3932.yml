canonical_text:
  quote: ''
  summary: A rescued woman is identified as the queen's daughter, formerly caught
    in Turkey after fleeing by vessel with a female cousin. Iain agrees to return
    her. A rival general secretly boards the ship, bribes the crew, and has Iain left
    on an island. The woman goes mad from his loss, the king grieves, and Iain survives
    there in a ruined state until a boat arrives at night and a caller addresses him.
  language: English
