canonical_text:
  quote: ''
  summary: The Warrior of the Red Shield retrieves the King of Eirinn's three teeth
    from a defeated opponent and demands a way off the island. His foster brothers
    provide a self-moving coracle and three musical pigeons. He returns to Eirinn,
    crosses toward the king's house, encounters a hoary old river porter who explains
    his disgrace, seats the old man beside the king, and defeats the Knight of the
    Cairn and the Knight of the Sword. A female figure called the little treasure
    laughs at the scene.
  language: English
  quote_policy: summarized
