canonical_text:
  quote: ''
  summary: On an island hill, the Son of the Green Spring by Valour questions a woman
    who sits with a sleeping youth. After a failed finger-cutting attempt, she reveals
    that only the prophesied warrior of the red shield can wake the youth by striking
    a crag on his chest. The Son performs the act, is named Warrior of the Red Shield,
    fights and kills the awakened youth, takes body parts and teeth from him, carries
    the woman away, leaps over a fire, and sees the Knight of the Cairn.
  language: English
  quote_policy: summarized
