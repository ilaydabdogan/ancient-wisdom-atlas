- id: obs:7
  text: When Conal can speak and walk, his mother takes him on a wet misty day to
    a mountain among high moors and forests, leaves him astray to make out a way for
    himself, and goes home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Conal finds a small road, follows it to a little roadside hut at evening,
    enters, and sits by the fire until a woman arrives at the end of the night with
    six sheep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman, named Caomhag Gentle, advises Conal to go to the king's house for
