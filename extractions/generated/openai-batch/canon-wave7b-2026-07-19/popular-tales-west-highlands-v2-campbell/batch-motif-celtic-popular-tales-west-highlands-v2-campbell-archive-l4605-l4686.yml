canonical_text:
  quote: ''
  summary: In a battle aftermath, Lagh an Laidh turns against Boinne Breat, distracts
    him by directing him to look behind, and beheads him. Fearghus laments and pronounces
    a curse denying Lagh land in Eirinn. Lagh withdraws to a mountain and builds a
    castle. The smith's daughter bears and names Conal Mac Eigh Eirinn, then leaves
    him in misty mountain moors to find his own way. Conal follows a road to a hut,
    bargains with Caomhag Gentle to herd her sheep for food, and later lets the sheep
    into three gentlemen's wheat fields, saying the sheep ate them rather than he.
  language: English
  quote_policy: summarized
