canonical_text:
  quote: ''
  summary: After killing MacDorcha MacDoilleir and his sons, the Knight of the Red
    Shield lies wounded among the dead. A great toothy carlin comes ashore, revives
    dead men by putting her finger in their mouths, attacks the knight, and is then
    beheaded by him with a short spear. A musical harper appears and lures him toward
    sleep; the knight feigns sleep and kills the harper after discerning danger. The
    knight’s three foster brothers seek him and say that the carlin’s little vessel
    of balsam could heal him.
  language: English
  quote_policy: summarized
