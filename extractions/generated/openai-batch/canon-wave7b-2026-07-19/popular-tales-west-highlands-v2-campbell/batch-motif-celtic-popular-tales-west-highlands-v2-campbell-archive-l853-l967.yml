canonical_text:
  quote: ''
  summary: Two brothers flee after suspecting poison in a drink. The poison kills
    two horses, then twelve ravens that feed on a horse carcass. The brothers have
    the ravens baked into pies, which kill twenty-four robbers; they take the robbers'
    wealth. At the Knight of Riddles' house, where the daughter may be won by posing
    an unsolved question, the elder brother presents a riddle based on these deaths.
    The younger brother, acting as gillie, prevents the daughter's attendants from
    learning the answer and takes their plaids, but the elder gives the answer to
    the daughter. When the knight solves the riddle and threatens punishment, the
    elder poses a second riddle based on the plaid-taking episode, wins the daughter,
    and later kills three giants. The knight names him the Hero of the White Shield.
    The passage ends as the hero's brother challenges him to a fight.
  language: English
  quote_policy: summarized
