canonical_text:
  quote: ''
  summary: Diarmid learns from Fionn that Fionn's healing and release require the
    blood of the three daughters of King Gil, who live alone in a castle in the midst
    of an anchorage. Diarmid travels there, leaps into and out of the castle with
    his spear, carries the three daughters back, wrings out their blood, and spills
    it on the bound people within so that they rise and go. The blood runs out before
    Conan is freed, so Diarmid pulls him loose by hand. The daughters are then found
    alive and are returned to their castle, and the company returns to Eirinn.
  language: English
  quote_policy: summarized
