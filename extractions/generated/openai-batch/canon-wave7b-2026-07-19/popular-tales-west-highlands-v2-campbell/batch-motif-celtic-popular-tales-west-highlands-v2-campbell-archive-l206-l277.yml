canonical_text:
  quote: ''
  summary: A woman has a bearded wild man captured after he enters a barn with wild
    beasts. When his beard is removed, she recognizes him but does not reveal this,
    and he does not recognize her. She keeps him as a servant, then takes him on a
    journey home. At a hostelry he admits an unpaid debt whose penalty is a strip
    of skin from head to foot; she prevents the punishment by demanding that no blood
    fall, with a reciprocal penalty if it does. She then brings him to her father's
    house, where he admits he once got a wife there but does not know what happened
    to her, and her father prepares to hang him from a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman asks her master to send a man with her to catch the wild man, but
    the master refuses, saying the wild man and the beasts have not harmed them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman steals the barn-door key, hides in a hole until the wild man and
    beasts go in, brings gillies, and they catch the wild man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the wild man's beard is taken off, the woman knows him, but she takes
    no notice; he does not know her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman asks her master to keep the wild man as help, and the master orders
    her to keep him; the two clean the stable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman receives leave to go home and asks to take her gillie and the two
    best horses from the stable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the road she questions him about why he went with wild beasts or what he
    had been doing, but he will not tell her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the hostelry he refuses to enter and says he received half a hundred pounds
    from the man of the house, has not repaid it, and is subject to a strip of skin
    from head to foot if it is unpaid after a day and a year.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hostelry owner recognizes him as the big gillie, asks for payment, and
    the people prepare to cut the strip of skin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman says that if the strip is cut he must not lose a drop of blood,
    asks for a web of linen for him to stand on, and says another strip will come
    off the hostelry owner if blood appears; as a result they let him go.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When taken to her father's house, the man is even more opposed to entering
    than he was at the hostelry.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the father's house the man says he once got a wife there and does not know
    what became of her; the father asks where the wife is and what he did to her,
    and when he cannot answer, hanging him to a tree is planned.
  category: sequence
  evidence_refs:
  - ev:6
