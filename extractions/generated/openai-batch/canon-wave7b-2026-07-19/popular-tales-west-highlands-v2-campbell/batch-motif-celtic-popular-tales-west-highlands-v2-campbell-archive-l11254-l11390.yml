canonical_text:
  quote: ''
  summary: 'The passage concludes part of the Mac Iain Direach tale: a fox, the White
    Glave of Light, a giant’s oak-tree trial, the winning of a marvellous bird, the
    fox’s beheading at a spring or well, the emergence of a royal son connected with
    the Sun Goddess, and a wedding. Editorial notes compare the tale with Grimm’s
    Golden Bird and discuss possible Druidical associations. The passage then begins
    Fearachur Leigh, in which Farquhar is sent by a doctor to a hazel tree to capture
    the seventh serpent, a white snake, which is then boiled with secrecy over a hazel
    fire.'
  language: English
  quote_policy: summarized
