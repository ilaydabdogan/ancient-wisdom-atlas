canonical_text:
  quote: ''
  summary: Maclain Direach searches the waste for a falcon and is aided by Gille Mairtean,
    the fox. The fox advises him to serve a many-headed giant who keeps the falcon,
    gain trust by caring for birds, and flee with the falcon without letting a feather
    touch anything in the house. Maclain Direach enters service and gains the giant's
    trust, but when escaping the falcon's feather touches the doorpost, which screeches;
    the giant catches him and demands the White Glave of Light from the Big Women
    of Dhiurradh. The fox later shares food again, leads him to the ocean, grows into
    a boat to carry him to Dhiurradh, and instructs him to enter the women's service.
    Maclain Direach serves diligently for six weeks and is entrusted with the White
    Glave of Light.
  language: English
  quote_policy: summarized
