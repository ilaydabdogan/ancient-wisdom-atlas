canonical_text:
  quote: ''
  summary: John repeatedly spends the night in a castle where a dead old man, called
    the bodach, is brought in a dead man's kist by tawny women. John treats the dead
    man as cold rather than frightening, breaks open the kist, seats him by the fire,
    offers pipe, tobacco, and drink, and finally ties him to himself. At cockcrow
    the bodach asks to be released and discloses hidden stores and treasure. He explains
    that four women whose cows he took now punish him nightly, and he instructs John
    to tell his son to repay the cows, avoid oppressing the poor, divide treasure,
    and give generously to the poor.
  language: English
  quote_policy: summarized
