canonical_text:
  quote: ''
  summary: Fionn possesses the Ord Fianna, which sounds by itself when he is in extremity
    and is heard throughout the five-fifths of Eirinn. The gillies hear it, gather,
    return, raise him on their spears so that he recovers, kill the king's sons and
    surviving people, and regain the chase. Editorial notes classify the story as
    Seanachas na Feine, describe the Feinne/Fingalians as hunters and warriors, and
    offer comparisons or etymological suggestions involving Bran, the Tuatha de Danan,
    Thor, and the Ord Fianna.
