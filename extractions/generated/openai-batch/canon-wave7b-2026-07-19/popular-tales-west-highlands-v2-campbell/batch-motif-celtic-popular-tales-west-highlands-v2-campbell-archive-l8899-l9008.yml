canonical_text:
  quote: '"The blood''s in the shoe, and the pretty foot''s in the nook at the back
    of the fire."'
  summary: A helpful sheep feeds the first queen's daughter, is killed, and returns
    to life after its skin and bones are gathered, though it becomes lame because
    small hoofs are forgotten. A prince falls in love with the girl, gives her golden
    shoes, and later uses a lost shoe to identify his bride. The queen hides the true
    girl and has another daughter's toes cut so the shoe will fit, but a bird reveals
    the blood in the shoe and the true girl's hiding place. The prince finds the first
    queen's daughter, the shoe fits her, and he marries her.
  language: English
  quote_policy: quoted
