canonical_text:
  quote: ''
  summary: Fionn repeatedly uses his knowledge tooth to report the distance between
    Caoilte and a deer while the Fair Chief pauses to fish. The Fair Chief then throws
    down the net, runs with extraordinary speed, passes Caoilte, and catches the deer
    at the ford of Sruth Ruadh. A Carlin claims the deer as the beast of her love
    and asks for it or a portion of it, but the Gruagach refuses. After the Carlin
    threatens the Feen, the Fair Chief leaves the deer with Fionn, fetches iron hoops
    and a hammer from a smithy, and fastens three hoops around the head of each man
    of the Feen. The Carlin screeches, and the highest hoop on the Feeantan bursts.
  language: English
  quote_policy: summarized
