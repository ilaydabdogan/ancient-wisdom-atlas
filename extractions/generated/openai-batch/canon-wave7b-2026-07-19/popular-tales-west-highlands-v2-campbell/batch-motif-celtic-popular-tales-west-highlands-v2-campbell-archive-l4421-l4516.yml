canonical_text:
  quote: '"I saw a dream there : a shoot of fir growing from the heart of the king,
    one from my own heart, and they were twining about each other."'
  summary: 'The smith''s daughter says the king of Erin visited her and promised livestock,
    grazing lands, and a written pledge bound with his blood. The smith takes her
    to the king''s camp and obtains confirmation. At night she reports three dreams:
    intertwined fir shoots growing from her heart and the king''s, Fearghus removing
    the head and neck, and Erin covered with sheaves before a blast sweeps things
    away. The king interprets the dreams as the conception of a son and as his own
    coming death by Fearghus. He tells her to preserve his arms, rear the child, and
    send him wandering to discover his identity; he predicts kingship for the child
    and his descendants until a later child dies from a fishbone. The passage also
    identifies Maobh as the king''s sister and Fearghus''s mother.'
  language: English
  quote_policy: quoted
