canonical_text:
  quote: ''
  summary: The passage gives two related Gaelic tales about Uistean Mor mac Ghille
    Phadrig, a Gairloch champion who kills bogles and Fuathan. In the first, he shoots
    at a mist accompanied by music and brings home a speechless woman. After a year
    he enters a lit hill where fairies are dancing, learns that a cup-drink will restore
    her speech, seizes the cup, escapes pursuit at cockcrow, gives her the draught,
    and restores her to the Earl of Antrim after expelling a hostile bed-occupant
    that leaves as flame. In the second, Uistean goes against a deadly Fuath in goat
    form on Tombuidhe Gairloch; a weaver enchants his named weapons except the dirk
    he calls his mother's sister, and Uistean reaches the goat's pit.
  language: English
  quote_policy: summarized
