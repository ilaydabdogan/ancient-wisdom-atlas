canonical_text:
  quote: ''
  summary: The passage closes a tale of a blind last giant, later identified in a
    variant as Ossian, who is mocked for claims about the great size of animals in
    former times and proves them through a guided hunt. A reported variant adds a
    yellow dog, firelocks, spades, enormous deer, a lost chance to recover sight,
    and a silenced boy. The collector comments on Gaelic word meanings and changing
    local versions. The passage then begins another tale in which a poor Barra widow
    gives her young son Iain to a vessel master in exchange for wealth and promised
    education.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A blind last giant has an only daughter married to a common man, and the son-in-law
    sometimes treats him poorly so that he wears a hunger-belt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dinner the son-in-law asks whether the giant ever ate beef from so large
    an ox among giants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The giant replies that among his people the legs of birds were heavier than
    the hind quarters of the son-in-law's ox.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being laughed at because of his blindness, the giant calls for his bow,
    three arrows, and a servant to lead him to a named corrie in Balnagowan forest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The servant reports birds appearing near a rock and rushes, with later birds
    growing from ordinary size to three times the size of eagles and then to a largest
    bird three times as big as an ox.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The blind giant has his hand guided to the bow, shoots the largest bird, and
    has a hind quarter carried home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The giant returns to his son-in-law's house, strikes the place where the son-in-law
    usually sits, breaks the empty chair, and the son-in-law later treats him better.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The collector reports another English version in which the blind old giant
    is Ossian and a figure named Paul of the nine clerks is his father-in-law; the
    collector links a change between ox and deer to the Gaelic word damh.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the reported variant, Ossian's black birds are disbelieved; he goes with
    a boy to a hill, pulls rush tufts, and finds a yellow dog under one tuft and firelocks
    and spades under another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the variant, the old giant whistles three times while the boy has his head
    in a dug hole, and the boy sees deer increasing in size from peat-stacks to houses
    to hills before a yellow dog is loosed after them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the variant, they roast deer at a fire; the boy eats some, and the old
    giant is angry because eating all of it would have recovered his sight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the variant, the old giant makes the boy shoot a blackbird on its nest,
    takes home a leg that breaks the table, and later the boy is killed at a well
    to keep him silent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The collector explains the blackbird or black elk element through the Gaelic
    expression lon dubh and states that versions of the same story change across localities
    as Gaelic fades and elks no longer exist in Scotland.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: A poor widow in Barra has a baby son named Iain and gathers shellfish on the
    strand to feed herself and the child.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: A vessel west of Barra sends a boat ashore with three people from on board.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The vessel master asks about the shellfish and the child, then offers the
    widow gold, silver, schooling, teaching, and better circumstances for the boy.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The widow first says she would rather die than give the child away, but then
    agrees because of love of the money.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The master sends men to fetch a box from a press in the cabin, empties it
    for the widow, and takes the child with him.
  category: action
  evidence_refs:
  - ev:11
