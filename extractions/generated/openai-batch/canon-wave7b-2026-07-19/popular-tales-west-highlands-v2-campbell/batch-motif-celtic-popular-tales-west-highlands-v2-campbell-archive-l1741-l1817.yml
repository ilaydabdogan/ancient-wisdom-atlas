canonical_text:
  quote: ''
  summary: The passage contains two folk narrative episodes. In the first, a tailor
    catches a human baby before a little woman in green can receive it, while a fairy
    or elf child is left at the farm-house in exchange. The tailor later makes the
    cradle child reveal itself through speech and pipe-playing; the elf departs up
    the chimney, the real child is restored, and the nurse is dismissed. In the second,
    the Macgowans are described as having hereditary witchcraft; Jenny Macgowan uses
    a bridle and whispered command to transform Harry Dew into a horse, rides him
    to the Auld Kirk of Buittle, and other named women arrive mounted on transformed
    human servants.
  language: English
  quote_policy: summarized
