canonical_text:
  quote: ''
  summary: An old man recalls his trust in the young men's father, hosts them, and
    tells an embedded tale. In the tale, a poor young man and a rich neighbor's daughter
    pledge themselves to each other, but her father has her marry a wealthier suitor.
    The bridegroom learns of the earlier pledge and takes the bride to the pledged
    man, who formally releases her before a priest and sends her back with written
    proof. On the way home, robbers seize her in a wood; one robber escorts her home
    while the others take her money. The old man then asks which person acted best,
    and the eldest son begins to answer.
  language: English
  quote_policy: summarized
