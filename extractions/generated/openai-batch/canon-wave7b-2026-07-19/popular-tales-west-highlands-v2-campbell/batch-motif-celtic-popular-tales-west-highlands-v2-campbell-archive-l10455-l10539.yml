canonical_text:
  quote: ''
  summary: Mac Iain Direach attempts to take the White Glave of Light while the Big
    Women are away, but a screeching lintel alerts them and they take it back. They
    say they will not give him the sword unless he obtains the Yellow Bay Filly of
    the King of Eirinn. At the ocean he meets Gille Mairtean, who shares a meal with
    him, changes into a barque, carries him to Eirinn, and instructs him to enter
    the king's service as a stable lad until he can run away with the filly, with
    special care at the gate. Mac Iain Direach becomes a trusted stable lad, is entrusted
    with the filly, and prepares to flee with her while the king is hunting; the supplied
    passage ends mid-action.
  language: English
  quote_policy: summarized
