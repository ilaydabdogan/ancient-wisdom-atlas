canonical_text:
  quote: ''
  summary: The companions declare themselves free of a woman's spells, bring down
    a small vessel of balsam, and wash a man with it so that he rises whole and healthy.
    The next day they play shinty, then see the Great Son of the Sons of the World
    approaching. They warn him that the Knight of the Red Shield is inside and seeking
    him. The Knight overhears, goes out, strikes his shield, and fights the great
    warrior. During the combat, the warrior says he can only be killed by a blow above
    the covering of his trews and that the king's three teeth are in his pouch. The
    Knight changes his attack after learning where the warrior's death lies.
  language: English
  quote_policy: summarized
