canonical_text:
  quote: ''
  summary: John leaves with gold, returns toward the town and regiment, meets the
    Mischief, tests him through transformations, tricks him into entering an abersgaic,
    is arrested as a deserter, gains release by keeping the being hidden, and later
    has twelve threshers beat the container in which the Mischief is confined.
  language: English
  quote_policy: summarized
