- id: obs:1
  text: John refuses to marry the old girl of the hoary bodach, fills his pockets
    with gold, and asks the gentleman to give plenty of gold to the poor.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: John becomes weary at home and returns toward the town and regiment; on the
    hill above the town, the Mischief comes to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mischief identifies himself as the one to whom John had given himself
    when John was there previously.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: John says he will not believe the being is the Mischief unless he makes himself
    into a snake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mischief changes into a snake, then into a roaring lion, and then spits
    fire seven miles behind him and seven miles before him.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: John tells the Mischief to enter his abersgaic and not come out until asked;
    the Mischief promises and enters it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the town John is recognized as a deserter, seized, tried, and sentenced
    to be executed; he asks to be shot with a bullet rather than hanged.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the execution scene, the Mischief speaks from within the abersgaic and
    offers to scatter the soldiers; John hushes him and tells the colonel the voice
    is only a white mouse.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The colonel tells John not to let the creature out of the abersgaic and gives
    him a letter of release.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At night John enters a barn with twelve threshing men and asks them to thresh
    his abersgaic; after prolonged beating with twelve flails, the abersgaic leaps
    upward and throws some threshers on their backs.
  category: action
  evidence_refs:
  - ev:8
