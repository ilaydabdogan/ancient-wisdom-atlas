canonical_text:
  quote: ''
  summary: 'In a frame conversation, John affirms that iron has power against witchcraft
    or fairy spells and tells how cows that had lost their milk recovered after a
    shoe from an entire horse was secretly nailed to the byre door. He then explains
    the red book: an orphan herdboy is approached by a fine gentleman who offers employment
    and urges him to write his name in a large red book. Warned by his master, the
    boy draws a sword-circle and cross in the name of the Trinity, refuses to leave
    the circle, obtains the book, and withstands the gentleman''s all-night transformations
    until daybreak.'
  language: English
  quote_policy: summarized
