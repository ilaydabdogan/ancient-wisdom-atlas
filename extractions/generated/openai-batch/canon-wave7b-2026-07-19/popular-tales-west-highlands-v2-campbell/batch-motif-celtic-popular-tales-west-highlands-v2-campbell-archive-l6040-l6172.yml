canonical_text:
  quote: ''
  summary: 'Three men in Erin attend a feast, see the maid of Knock Seanan passing,
    and go after her. A great lad seeks service, is hired by Murachadh for an unusual
    share of counsel, and repeatedly performs strange acts: producing tools from his
    hat, removing an oversized thorn from his foot, bringing a roasted duck, sleeping
    in a hidden place, and violently striking the maiden. A deer and dog then appear,
    the company gives chase amid sparks from their toes, and Murachadh loses his companions
    as mist comes on.'
  language: English
  quote_policy: summarized
