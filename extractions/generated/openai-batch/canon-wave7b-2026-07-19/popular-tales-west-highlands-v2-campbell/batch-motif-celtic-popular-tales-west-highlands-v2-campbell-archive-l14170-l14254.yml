canonical_text:
  quote: ''
  summary: The Son of the Green Spring by Valour sends the Knight of the Cairn and
    then the Knight of the Sword to test a fire; both attempt to leap it and are burned.
    The Son of the Green Spring by Valour asks for arms and armour, receives the Knight
    of the Cairn's gear, dons it, reaches the circle of fire, leaps over it, and then
    sees a beautiful island with a yellow bare hill in its midst.
  language: English
