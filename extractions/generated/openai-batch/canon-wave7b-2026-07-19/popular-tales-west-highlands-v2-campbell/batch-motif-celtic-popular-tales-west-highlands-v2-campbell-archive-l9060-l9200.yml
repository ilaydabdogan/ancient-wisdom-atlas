canonical_text:
  quote: ''
  summary: A poor fisher's widow's son, Iain, trades a horse for a gun, dog, and falcon,
    leaves home, and is hired to shoot a deer eating a farmer's corn. When he aims,
    he sees a woman and does not shoot. The deer leads him to a robber house, where
    he eats, hides, is repeatedly killed by robbers, and is repeatedly restored to
    life by the deer with wax from her ear until the robbers destroy one another.
    The deer then directs him to meet her at a church, but an old hag places a harmful
    spike that causes him to sleep; a lady arrives with music, cannot wake him, writes
    her name under his arm as daughter of the king of the kingdom of the town under
    waves, and later leaves a snuff-box in his pocket.
  language: English with Gaelic names and terms
  quote_policy: summarized
