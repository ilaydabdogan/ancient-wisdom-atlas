canonical_text:
  quote: ''
  summary: 'The passage narrates successive combats: Innsridh fights and is beheaded
    by a great warrior; Fiachaire receives and kisses the severed head, then kills
    the warrior by striking him with it. Fiachaire reports to Fionn about Innsridh,
    the Greeks, and the great Greek. He then confronts Maghach Colgar over a demanded
    father’s head, kills Maghach’s people, and fights Maghach, whose spear wounds
    him and makes him roar while Diarmid is returning from the chase in Eirinn.'
  language: English
  quote_policy: summarized
