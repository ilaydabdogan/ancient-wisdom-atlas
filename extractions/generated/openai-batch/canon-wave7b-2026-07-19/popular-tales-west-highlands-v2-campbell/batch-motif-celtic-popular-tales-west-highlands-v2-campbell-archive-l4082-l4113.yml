canonical_text:
  quote: When the steel touched him, he grew a handsome youth
  summary: A male speaker repeatedly reminds a woman of a small promise made at a
    well. She first makes him a bed by the fireside, then a bed beside her own, but
    he continues complaining. He tells her to use an old rusted glave behind her bed
    to take off his head rather than keep him in torture. She cuts off his head; when
    the steel touches him, he becomes a handsome youth, thanks her for removing long-endured
    spells, regains his kingdom because he is a king, marries the princess, and they
    live happily.
  language: English with Scottish Gaelic refrain
  quote_policy: quoted
