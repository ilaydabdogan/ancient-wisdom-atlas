canonical_text:
  quote: ''
  summary: After Levi-our's mother is killed, he dresses her body, sets it by a deep
    well, and causes a boy to be blamed when the body falls in. The boy's father pays
    Levi-our compensation. Levi-our then tells his neighbours that dead old women
    can be sold for money; they imitate him unsuccessfully. He later prepares a feast
    and stages his wife's apparent stabbing and recovery using a blood-filled sheep
    gut and a horn.
  language: English
  quote_policy: summarized
