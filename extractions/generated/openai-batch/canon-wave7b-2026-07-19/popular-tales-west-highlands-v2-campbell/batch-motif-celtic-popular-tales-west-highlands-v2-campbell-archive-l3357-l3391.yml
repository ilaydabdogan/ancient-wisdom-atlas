canonical_text:
  quote: ''
  summary: In the section titled “Osean after the Feen,” a blind male figure has a
    lad take him to a rock and bring out a blackbird’s chick. Near home, he asks whether
    a shout would reach the house, has himself faced toward it, kills the lad so that
    no one will tell tales of him, and returns home. He tells the household he has
    brought a little pet; when they cannot bring it in, he does so himself. He then
    uses a knife and the chick’s shank bone to show that a dun-deer shank can pass
    through its marrow hole, thereby proving his account truthful. The household asks
    for more tales, but he will not begin again. An editor’s note adds that a Lapp
    measure of distance is “a clog’s baik.”
  language: English
  quote_policy: summarized
