canonical_text:
  quote: ''
  summary: 'The passage gives versions and comments on Gaelic fairy traditions: fairy
    workers weaving for a housewife are frightened away by a cry that Dunbhuilg or
    Dunbhulaig is on fire; fairies are also described as working a field overnight,
    eating during rain with sunshine, and being especially active with witches on
    the night after old-style May-day, when protective charms such as tar in cows''
    ears are used. A Kintyre version of the Dunbhulaig weaving story and its work/departure
    rhymes are summarized. The collector then notes the tale''s distribution across
    Highland districts and introduces a Kirkcudbright brownie tale in which a ploughman
    enters a mill during Hallowe''en-time revelry and is seen a year later when a
    Bible is used, causing the music and lights to cease.'
  language: English with quoted Scottish Gaelic phrases
  quote_policy: summarized
