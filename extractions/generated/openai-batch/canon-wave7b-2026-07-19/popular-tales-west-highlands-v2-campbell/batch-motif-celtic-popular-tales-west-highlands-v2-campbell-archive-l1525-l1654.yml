comparison_claims:
- id: claim:1
  claim: The passage presents the Dunbhulaig fairy-weaving story as the same or nearly
    the same story across multiple Highland locations, with incidents nearly the same
    and only minor rhyme variation.
  claim_level: same_motif
  target: Dunbhulaig/Dunvuilg fairy-weaving story in Kintyre, Lorn, Lewis, and Benbecula
  evidence_refs:
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The claim relies on the collector's summary; full parallel texts for
    all locations are not included in the passage.
- id: claim:2
  claim: The passage explicitly treats the Kintyre account as a version varying little
    from Mrs. MacTavish's Dunbhulaig story.
  claim_level: same_motif
  target: Mrs. MacTavish's Dunbhulaig story and John MacLean's Kintyre version
  evidence_refs:
  - ev:1
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: Only the summarized Kintyre version and the present excerpt of the
    other version are available here.
- id: claim:3
  claim: The passage compares the Kirkcudbright Man in the Hill tradition to a related
    form in which the hill has become a mill and the fairies are called Brownies.
  claim_level: same_motif
  target: Man in the Hill tradition and Kirkcudbright mill Brownies story
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives the comparison before narrating only one Kirkcudbright
    mill story; it does not supply a full Man in the Hill text here.
- id: claim:4
  claim: The passage says Kirkcudbright fairies resemble other traditions by carrying
    off children like Island Elves and borrowing meal like fairies of Sutherland.
  claim_level: same_function
  target: Kirkcudbright fairies compared with Island Elves and Sutherland fairies
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The compared Island Elves and Sutherland narratives are not included
    in this passage, so the claim records only the collector's stated comparison.
