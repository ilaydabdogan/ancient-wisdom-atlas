canonical_text:
  quote: ''
  summary: The passage contains two Barra-related tale items. In the first, cattle-watchers
    see a dog; Calum MacNill strikes it despite a warning and loses the power of his
    hand and arm. An old woman, Nic a Phi, tells him that after a day and a year he
    must address a knoll with a threat; when he does so, his hand recovers. An editorial
    note compares the item with a Manx Black Dog tradition at Peel Castle. In the
    second, a woman seeking calves in a storm strikes a tether-peg into a knoll, which
    opens; a woman dwelling in the tulman tells her to take the calves to a tuft of
    grass, promising continuing possession of a milk cow if the calves eat it. The
    promise is fulfilled.
  language: English
  quote_policy: summarized
