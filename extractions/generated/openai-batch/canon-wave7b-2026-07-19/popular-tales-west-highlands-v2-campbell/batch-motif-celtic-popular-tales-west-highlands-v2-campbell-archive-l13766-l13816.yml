canonical_text:
  quote: ''
  summary: The Fair Chief frees and feeds a bound group, tells his tale to the carlin
    at the ford of Sruth Ruaidh while restraining her, returns to his companions,
    then goes with Fionn to the Dame of the Fine Green Kirtle. He announces that he
    has found what he sought and will return to his father's palace. The Dame fears
    being abandoned, but he promises to take her with him. They go to the palace,
    obtain a churchman, marry, and celebrate a long wedding feast.
  language: English
  quote_policy: summarized
