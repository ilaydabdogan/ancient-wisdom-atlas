candidate_motifs:
- id: motif:1
  label: Fairy abduction of living persons mistaken for the dead
  taxonomy_refs:
  - stolen_beloved
  basis: Several anecdotes state that a mother, a young man, or a wife was carried
    off by fairies, with at least two being believed or treated as dead or missing
    from ordinary life.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy reference fits especially the wife and mother cases; the
    young man is summarized too briefly to specify emotional or marital relation.
- id: motif:2
  label: Recovery of a fairy captive by demanded exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The abducted mother is recovered when a man throws his bonnet to a passing
    party and demands an exchange.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives a compressed summary, and the exact mechanics of the
    exchange are not fully explained.
- id: motif:3
  label: Substitute in the bed after childbirth
  taxonomy_refs: []
  basis: After leaving his wife in childbed, a man returns to a changed bed occupant
    who says the real wife was carried away and that she was appointed successor.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The substitute's species or exact identity is not explicitly stated in
    the passage.
- id: motif:4
  label: Fire threat compels revelation of hidden captive's location
  taxonomy_refs:
  - fire
  basis: The husband builds a great fire and threatens the bed occupant until she
    reveals where his wife has been taken.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a literal fire-threat episode; no broader ritual meaning is asserted.
- id: motif:5
  label: Quest through fairy mountains and knoll to recover wife
  taxonomy_refs:
  - mystical_quest
