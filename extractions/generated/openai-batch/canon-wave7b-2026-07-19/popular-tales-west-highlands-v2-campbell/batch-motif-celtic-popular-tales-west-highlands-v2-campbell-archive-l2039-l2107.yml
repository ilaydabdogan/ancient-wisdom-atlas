canonical_text:
  quote: ''
  summary: A sequence of Badenoch fairy anecdotes describes humans carried off by
    fairies, recovery by exchange, warnings from deceased or supernatural figures,
    fairy thefts of snuff and milk, a bogle with a red hand, a late-night encounter
    with nonhuman crowds, and a husband recovering his abducted wife after interrogating
    a substitute and traveling through named mountains and a Fairy Knoll.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother is reproached for giving her child over to beings among whom the
    child is doomed to dwell; she then finds herself outside a hillock and cannot
    enter again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lad recognizes his mother, who had been carried off by fairies but was believed
    to be dead.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man recovers the abducted mother from the fairies by throwing his bonnet
    to a passing party and demanding an exchange.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The collector reports having several Gaelic and English versions of the abducted-mother
    story and believes it is printed somewhere.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old woman meets her deceased landlord and landlady, who say fairies have
    carried off a young man supposed to be dead and advise her not to be out so late.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young Baron of Kincardine is entertained by fairies, who steal his father's
