- id: obs:12
  text: Thomas MacDonald of Dunrobin gives the collector a fairy tale said to be commonly
    believed in Badenoch.
  category: other
  evidence_refs:
  - ev:10
- id: obs:13
  text: A man returns home after leaving his wife in childbed and finds her changed
    from unruffled temperament to a wicked scold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Suspecting that something is wrong, the man builds a great fire and threatens
