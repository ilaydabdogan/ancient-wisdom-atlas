canonical_text:
  quote: ''
  summary: The passage closes a red-book episode, noting that the Red Book of Appin
    was obtained, consulted by people from many places, and that iron was considered
    a chief safeguard against evil spirits. It then introduces a Highland account
    of Coluinn gun Cheann, the Headless Trunk, a Bauchan associated with the Macdonals
    of Morar. The being favours that family but haunts the Smooth Mile after sunset,
    attacks solitary men, and leaves victims dead and often mutilated, while women
    and children are not harmed. A friend or relative of Raasay is killed, and Big
    John of Raasay hears the news.
  language: English
  quote_policy: summarized
