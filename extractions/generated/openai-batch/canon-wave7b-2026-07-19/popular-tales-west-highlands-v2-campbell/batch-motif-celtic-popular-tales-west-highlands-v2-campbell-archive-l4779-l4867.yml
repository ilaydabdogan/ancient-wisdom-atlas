canonical_text:
  quote: '"Still be thy hand, Conall, son of the king of Erin."'
  summary: A lad gives a legal judgment dividing responsibility for an eiric. The
    king infers royal blood from the lad's skill and sends three heroes to take his
    head, but the lad seizes the sword and sends them back. He then vows to discover
    his parentage in Erin, finds his mother washing, threatens her for the truth,
    is named Conall son of the king of Erin, and asks who killed his father. She names
    Fearghus before the excerpt breaks off.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The lad judges that responsibility for the smith's son's eiric should be divided
    among the gentleman, the smith, the nurse, and the groom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated grounds for the division include the smith not measuring a nail,
    the nurse not staying in her chamber, and the groom possibly leaving some word
    untaught to the horse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the judgment, the judgment-seat stops, the king's neck is released from
    its turn, and the king is let go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king says the lad must have king's blood because he split the law so well,
    and he orders his three best heroes to bring the lad's head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three heroes tell the lad that they are going to kill him because the
    king sent them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The heroes give the lad a sword and tell him to strike his own neck and cast
    off his own head.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The lad takes the sword, twirls it in his fist, refuses to return it, and
    says there are not enough men in Erin to take it from his fist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lad declares that he was not born without a mother or begotten without
    a father, says he knows he was born in Erin, and vows not to leave any house with
    smoke or fire in Erin until he knows who he is.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: On a fine warm day at the lubhar, the lad sees his mother washing and begins
    to think or understand that she is his mother.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lad comes behind the woman, puts his hand on her breast, and claims to
    be a foster son of her right breast; she denies having such a son or foster son.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The lad threatens to strike off the woman's head with a sword unless she tells
    him who he is; she answers by naming him Conall, son of the king of Erin.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Conall says he knew there was kingly blood in him, asks who killed his father,
    and the mother says Fearghus killed him; the excerpt ends before her sentence
    is complete.
  category: speech
  evidence_refs:
  - ev:9
