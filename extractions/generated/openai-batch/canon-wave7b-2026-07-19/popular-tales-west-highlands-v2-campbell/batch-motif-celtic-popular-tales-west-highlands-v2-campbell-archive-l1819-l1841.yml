canonical_text:
  quote: ''
  summary: A supernatural gathering in a kirk lasts until cockcrow. Harry, after a
    charmed bridle is removed, finds himself back in bed and in his own shape. He
    later uses the same bridle and words on Jenny, who becomes an old brown mare;
    he has the mare shod by a smith, then hides the bridle. The next morning Jenny
    is ill, and horse-shoes are found on her hands and feet. Harry attributes this
    to her own deed, and the passage adds that Jenny played many similar tricks on
    local young people.
  language: English
  quote_policy: summarized
