canonical_text:
  quote: ''
  summary: In tale XXVII, a witch is said to have enchanted the Reay forest deer so
    that hunters could not catch them. William watches her by counter-enchantment
    and sees her milking hinds at her hut. A hind eats blue worsted, the witch declares
    the spell off and predicts Lord Reay’s bullet will kill it; the hind is killed
    and the yarn found inside it. An editorial note compares the tale to a Lapp camp
    account and a Grant Stewart story about a ghost using deer. In tale XXVIII, a
    smith’s son becomes mysteriously ill. A knowledgeable old man says the real boy
    was taken by the Daoine Sith and replaced by a Sibhreach. The smith tests the
    being with empty egg-shells used as water vessels, causing it to laugh and claim
    to be 800 years old. The old man says the son is in a fairy hill and instructs
    the smith to expel the intruder with a large fire; the passage ends as the smith
    seizes the child.
  language: English
  quote_policy: summarized
