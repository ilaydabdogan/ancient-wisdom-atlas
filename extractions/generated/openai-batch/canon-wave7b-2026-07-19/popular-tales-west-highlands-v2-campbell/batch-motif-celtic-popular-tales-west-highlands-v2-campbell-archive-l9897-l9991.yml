canonical_text:
  quote: ''
  summary: Mac-a-Rusgaich is ordered to clean and wash a stable and horses, including
    within and without; he kills the horses, removes and washes their insides, then
    claims he obeyed. He demands three wages or a strip of the tenant's skin; the
    tenant initially chooses the skin penalty, then pays after the cutting begins.
    Mac-a-Rusgaich is then sent as servant to a giant who threatens to break his bones
    unless he keeps even work; they agree on wages if Mac-a-Rusgaich wins and go to
    gather faggots in the wood, where the giant gathers thick roots and Mac-a-Rusgaich
    gathers slender tops.
  language: English
  quote_policy: summarized
