canonical_text:
  quote: ''
  summary: A herd's wife on Sanntraigh has a kettle. A woman of peace, glossed as
    a fairy, comes daily without speaking and takes hold of the kettle. The housewife
    recites a formula about a smith, iron, coal, the due of a kettle, bones, and returning
    it whole. The fairy returns each day with the kettle containing flesh and bones.
    When the housewife plans to cross the ferry to Baile Castle, she instructs her
    man to say the same words. He sees the woman coming with a shadow from her feet,
    becomes afraid, closes the door, and does not open it. The woman goes above a
    hole in the house, and the kettle jumps twice.
  language: English
  quote_policy: summarized
