canonical_text:
  quote: ''
  summary: Murachadh meets a man in the wood, receives hospitality at his house, and
    is drawn into hearing the host's account of how his wife was won, abducted by
    three monks, pursued by ship, and recovered after the abductors were killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Murachadh goes into the wood while waiting for mist to clear, hears an axe,
    and meets the man of the little cap.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Murachadh and the youth exchange blessings described as peaceful words of
    wisdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth says he would give the traveler a night's share for the sake of
    Murachadh Mac Brian, even if there were a man's head at the traveler's belt.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man carries the faggot and axe himself, and the two go to his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the house, the wife gives a gold chair to her own man, a silver chair to
    Murachadh, and wine to Murachadh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The host drinks from the vessel after Murachadh and breaks the cup against
    the wall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The host says he has done Murachadh discourtesies by taking the gold chair,
    giving him the silver chair, and drinking from a half-empty vessel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The host says Murachadh has gazed at his wife since entering the house and
    says this relates to past trouble about her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The host reports that he had lived seven years with no companion before a
    soothsayer told him to go to the white Sibearta for knowledge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the white Sibearta, the host finds the Gruagach of the island and the Gruagach
    of the dog in combat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Gruagach of the island promises her daughter in marriage if the host helps
    her, and the host kills the Gruagach of the dog.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A wedding is made between the host and the daughter that night, but fatigue
    and drink prevent him from reaching her chamber door.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The next morning the father-in-law sends the host to the hunting hill, and
    on return the host learns from his mother-in-law that three monks have taken the
    woman he married.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The host takes up pursuit, finds his ship drawn seven lengths onto dry land,
    and forces it out to sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The host reaches the sea-isle and finds three monks casting lots for his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The host cuts off the three monks' heads, takes his wife, places her in the
