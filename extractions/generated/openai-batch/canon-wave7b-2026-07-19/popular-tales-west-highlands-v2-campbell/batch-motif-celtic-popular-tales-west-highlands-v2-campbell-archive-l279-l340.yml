canonical_text:
  quote: ''
  summary: An unnamed woman prevents her gillie from being hanged by arguing from
    the purchase of a horse. She briefly appears in a gown and is recognized by her
    family, then resumes men's clothes. She later has the gillie record a householder's
    explanation of how he obtained the old house, brings the written record to court,
    identifies the man, and returns with the king to their own house.
  language: English
