canonical_text:
  quote: ''
  summary: A brief Gaelic narrative fragment is followed by editorial commentary on
    the tale of An Gruagach Ban, identifying its Barra informant, describing it as
    Highland seanachas, and comparing its heroic, magical, wooing, animal, net, hammer,
    and transformation motifs with Celtic, Norse, Germanic, Gaelic, Scotch manuscript,
    Arabian Nights, Irish, Breton, Welsh, Greek, and classical parallels.
  language: English with a short Scottish Gaelic excerpt
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female figure asks who killed her companion; the addressee replies that
    they do not know who killed the companion; she then goes away loudly weeping.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies Alexander MacNeill, a fisherman from Ten Tangval, Barra,
    in connection with the tale.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary calls the tale a specimen of Seanachas, described as an old
    Highland story type.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary says Fionn and his comrades are treated as very great heroes,
    but as foils to one greater hero, Gruagach Ban, who beats the Fingalians.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary suggests that the Barra context makes a mixture of Norse and
    Celtic mythology probable.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary identifies Fionn and his comrades as Celtic worthies and says
    the editor suspects them to be divinities in disguise.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentary compares a leader holding one end of a net while all his comrades
    hold the other with an Edda passage in which Thorr holds one end of a net and
    the Asa hold the other.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary says Fionn has a hammer whose stroke was heard over Eirinn
    and Lochlann, and the editor interprets it as more like a thunderbolt than a militiaman’s
    whistle.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The commentary says Fionn is a chief and the wisest in old Western romances,
    but not the strongest, with some power always wiser and stronger than him.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The commentary says the dame of the Fine Green Kirtle and the carlin with
    the wonderful deer perform feats the Feen cannot equal and overcome the heroes
    by magic arts.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The commentary mentions the wife of the Tree Lion in her magic castle and
    a leaping man in disguise who carries the wooer.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The commentary summarizes a parallel tale pattern as including a lady to be
    won, an obstacle to be surmounted, a steed that springs over it, and a disguised
    worthy more valiant than the chief.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The commentary says transformation into many shapes is a common incident in
    Gaelic tales and also occurs in Norse material, Peter Buchan’s Scotch manuscript
    collection, and a story resembling an Arabian Nights princess fighting a genius.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The commentary says the dame of the Fine Green Kirtle is a common Gaelic-tale
    character, was mentioned in Sutherland as seen about hills, and is always possessed
    of magic powers.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: The commentary says the carlin with the deer can be traced in Irish, Breton,
    and Welsh materials and compares her to Diana and the sacred hind with golden
    horns and brazen feet pursued by Hercules.
  category: relationship
  evidence_refs:
  - ev:15
