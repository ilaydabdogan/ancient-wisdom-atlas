canonical_text:
  quote: ''
  summary: At Fearghus's first court after receiving the crown, unjust judgments cause
    the judgment-seat to kick and the king's neck to twist. Caomhag's herd, after
    asking for food, corrects the king's judgment in a sheep dispute by ordering future
    lambs as compensation while Caomhag keeps the sheep. In a second case, a horse
    being shod is hurt by a misplaced nail and kicks a child; the king orders the
    horse's leg removed, but the same supernatural reaction occurs, and the herd begins
    to re-examine responsibility by summoning the owner, groom, smith, and nurse.
  language: English
  quote_policy: summarized
