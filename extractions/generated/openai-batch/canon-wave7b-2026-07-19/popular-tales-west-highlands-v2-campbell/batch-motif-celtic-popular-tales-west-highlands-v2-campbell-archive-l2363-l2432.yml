canonical_text:
  quote: ''
  summary: In a crowded house, Fionn and the Feen confront arriving groups of the
    people of Danan. A poor boar is brought as an insult, a better boar is fetched,
    and Gallaidh insults Fionn's provision of meat. Fionn kills men of the people
    of Danan with a jaw-bone. A black dog of the people of Danan challenges the dogs,
    defeats many packs, and is then killed by Bran after Conan removes a golden shoe
    from Bran's venomous claw. Bran and the Feen fight foes outside, leaving Fionn
    alone inside. The children of the king attack Fionn and drive him back to a rock,
    where he resists them.
  language: English
  quote_policy: summarized
