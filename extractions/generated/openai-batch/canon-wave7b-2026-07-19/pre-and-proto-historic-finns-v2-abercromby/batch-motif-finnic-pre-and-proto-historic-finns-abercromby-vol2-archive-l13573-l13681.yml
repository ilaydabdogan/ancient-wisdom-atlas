canonical_text:
  quote: '"she brought forth a swarm of boys, a flock of children"'
  summary: The passage gives several Finnic magic-song origin formulae. A female figure
    gives birth in a bath-house to many harmful children, hides them, and names them
    as winds, frosts, worms, sores, and diseases. Variants describe disease origins
    from iron/steel matter eaten by an old crone, and from a church-threshold birth.
    Subsequent sections give origins for rust in corn, scab, the pig, and chaff in
    the eye.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A female figure approaches confinement and comes to the rooms of Pohjola and
    the bath-house floors of Sariola to give birth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She gives birth to a swarm or flock of children in one bath-house during a
    single heating, under a single moon, after a single cockcrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: She hides the children in a copper vat and fiery washing-tub under five woollen
    rugs and eight kaftans.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She gives names to the children and assigns them forms or functions including
    Wind, Fire, Sharp Frost, Fall of Snow, Atrophy, Worm, Cancerous Sore, Heart-Eater,
    Gout, and Pleurisy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some named offspring are associated with harmful actions such as eating furtively,
    stabbing openly, clawing limbs, causing joint pain, or carrying tools and weapons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A variant names Naata as the youngest of the girls and mistress of Hiitola.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another variant has a stumpy lassie, Tuoni's girl, crush iron seeds and pound
    steel in a doorless, windowless smithy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A furious old crone eats the iron and steel material, becomes pregnant, seeks
    a lying-in place, and finally gives birth in the bloody hut of Hiitola to sicknesses
    and causes of injury.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'A variant says Nikotiera gives birth outside the church door under the red-painted
    stair to three sons: Bloody Flux, Scab Disease, and Pestilence.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the origin of rust in corn, Pohja's old wife sleeps in a mossy swamp, wakes,
    rubs her palms together, and blood drops into the swamp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: From the dropped blood an evil brood is produced and wretched rust is bred
    in grass near a ploughman's steps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the origin of scab, a scabby crone gives birth to an eight-headed, single-footed
    scabby son and throws him at a human being's skin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the origin of the pig, the pig's mother and father are named, and the pig
    is commanded to root up the ground without tearing down fences or overturning
    gates.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the origin of particles of chaff in the eye, a pearl falls from the Lord,
    the Omnipotent, or Jesus' hand from the sky to a field-edge, producing a birth,
    family, bent-grass, and chaff.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chaff or plant is described as growing upward and being rocked by wind,
    suckled by bitter frost, and drawn up or sustained by the Maker or Omnipotent.
  category: sequence
  evidence_refs:
  - ev:9
