canonical_text:
  quote: ''
  summary: A sequence of Great Russian exorcisms addresses fevers, hernia, abscess
    or boil, and bleeding. The charms invoke distant stones, sea or island settings,
    holy or female helper figures, an iron man in an oak, sewing implements, animals,
    and natural places to remove, return, dry up, devour, or stop bodily afflictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white inflammable stone, God's throne, the very holy Mother, and a white
    swan appear in the opening fever charm.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The very holy Mother holds the white swan and plucks a white feather from
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fever charm commands inborn fevers and inborn heat to jump and leap back
    and sever from the servant of God and from named body parts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fever charm states that if the affliction came from wind, water, or forest,
    it should return to wind, water, or forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the hernia charm, an open field contains a moist oak, and the moist oak
    contains an iron man.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The iron man is described as unable to be fed drink, bread, salt, or fruit,
    and instead must be fed hernia from a living man's body.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A pretty girl issues from a white stone in the blue sea ocean, takes the hernia
    from the servant of God, lays it on a silk ribbon, and carries it to the moist
    oak and iron man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The iron man eats and devours the hernia from the servant of God and becomes
    satiated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another hernia charm instructs that the words be repeated three times and
    that the sore place be bitten each time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The addressed hernia is told to gnaw stumps, roots, and rough stones and to
    go walking in an open field away from the servant of God forever.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The abscess or boil charm directs drawing the middle finger of the right hand
    around a knot in door or window woodwork.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The abscess or boil charm compares the drying and withering of the knot to
    the desired drying and withering of the abscess, and compares absence of fire
    from the finger to absence of a nodule from the boil.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: One bleeding charm places a tomb on a high stone on the island of Buyana in
    the sea Kiyan, with a pretty girl lying in the tomb.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The pretty girl in the tomb is told to rise, thread a sewing needle with silk
    thread, and sew up the bleeding wound.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Another bleeding charm places three girls in a small room on the island of
    Buyana in the sea Okiyan; one keeps needles, one makes thread, and one sews a
    bloody wound.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Commands addressed to Blood not to gush or drip are paired with statements
    addressed to a chestnut or brown horse.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The final visible bleeding charm mentions the oceanic Tsar on the sea-ocean,
    with a brown horse under him, and commands Blood not to drip until agreement and
    decree.
  category: speech
  evidence_refs:
  - ev:10
