canonical_text:
  quote: ''
  summary: An exorcistic healing passage first commands an abscess to shrink, sink,
    and disappear with the waning moon and setting sun, while redirecting swelling
    or bursting to stumps, sand, and earth rather than human skin. The following snake-bite
    charms address the snake as a black or grey worm, underground creature, hissing
    snake, ghostlike apparition, or snail; question who raised or incited it; cite
    the Creator’s curse that it crawl on its belly; command it not to bite human or
    animal victims; require it to remove its venom; invoke Jesus and Mary; and state
    knowledge of the snake’s origin and earth parentage.
  language: English
  quote_policy: summarized
