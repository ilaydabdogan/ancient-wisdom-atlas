canonical_text:
  quote: ''
  summary: A sequence of exorcistic formulas menaces or commands a harmful being,
    evil, or Disease to leave. The addressee is threatened through fiery imagery and
    harm to kin, urged to return to home and family, directed back to a human spell-sender
    if human-made, deprived of payment if commissioned, and sent back toward forest
    places if from Metsola/Tapiola.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When prior measures have little effect, the formula commands glowing coals
    to be blown up and Lempo’s forge to be heated in the hollow of the begetter’s
    heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told to claw the mother’s womb, twist the parent’s paunch,
    set a tent in her liver, set a cellar in her lungs, squeeze her veins, and make
    her blood-pipes sound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formula threatens to kill a boy or eldest child and to twist its nose
    and break its beak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A figure called the scoundrel of Hiisi is ordered to return to its home and
    family; its relatives are described as vexed or alarmed because it has left its
    country and place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The addressee is said to have stayed long at village thresholds, alien gates,
    screeching hinges, and creaking doors.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother or parent waits at the gate and speaks of the luckless boy journeying
    in a houseless tract, asking who will pursue elks and manage reindeer, bears,
    and wolves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The father, grandmother, brother, and son are described as weeping, grieving,
    pouring bloody tears, or lying sick, and the family prepares for the soul’s departure
    with bloody beds, rugs, clothing, mouths, heads, and hair.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Named locations are assigned to family members: the father at the maiden’s
    spring, the mother in Aijo’s den, the son at the fountain of Vuojela, and the
    daughter under the Tyrja falls.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: If the evil or disease was caused by human art, a sorcerer, or a scheming
    or strong woman, it is ordered to return to the person who cast, sang, pronounced,
    incited, or conjured it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The return to the spell-sender is specified as going to the sender’s jaws,
    throat, heart, breast, or chest before sunrise, morning star, dawn, or cockcrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Disease thrown or brought by another and sent for reward or money is ordered
    to leave without reward, money, or gold, going toward its mistress’s morning meal
    and its grandmother’s egg-scraps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The addressed wicked pagan is told to eat under the bench, keep its head down,
    and not raise it before the flooring, wall-beams, and ceiling decay.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: If the addressee is from Metsola, it is told to go to Metsola, Tapiola, places
    of knotty roots and hard dry stumps, between two stumps, and beneath three birches’
    roots.
  category: setting
  evidence_refs:
  - ev:6
