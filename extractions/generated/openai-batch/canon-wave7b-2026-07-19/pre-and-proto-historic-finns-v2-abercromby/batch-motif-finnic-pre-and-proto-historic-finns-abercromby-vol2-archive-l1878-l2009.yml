canonical_text:
  quote: People now began to be their own wizards
  summary: The passage discusses the likely age and social development of Finnic Magic
    Songs, arguing that their greatest growth occurred between pure heathenism and
    pure Christianity. It describes magic power shifting from professional wizards
    and wise men to lay people, with private charms used for divination, hunting,
    fishing, livestock, crops, and sick children. It then surveys poetic similes in
    the songs, especially images of firmness and rapid movement drawn from nature,
    animals, plants, and human-made objects.
  language: English
  quote_policy: quoted
