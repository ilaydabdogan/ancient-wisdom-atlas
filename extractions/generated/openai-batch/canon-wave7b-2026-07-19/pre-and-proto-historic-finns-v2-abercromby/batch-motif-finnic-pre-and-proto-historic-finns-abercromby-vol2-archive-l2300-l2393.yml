literal_observations:
- id: obs:1
  text: The passage lists body-related figurative expressions, including tears as
    waters of grief, veins as blood-pipes, blood as milk or berry-coloured/carmine
    substance, tongue as central flesh, and throat as breathing-hole or talking-place.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The womb and pudendum are given numerous figurative names, including chest,
    stove, oven, nest, abode, door, threshold, gate, water gate, land, fields, fence,
    and wall.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Human persons are named figuratively: an old man is a bearded mouth; a woman
    or hag is long-hairs or bristly snout; a son is a calf; a marriageable girl is
    compared to flowers, birds, sun, and moon.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A new-born child is figuratively called a traveller, wee fingers, a stone,
    a pebble, and a backmost flat stone in the stove or oven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sorcerer is given many figurative names, including archer, shooter, Lapp,
    jealous one, Piru, cur, giant, elf, Keito, wolfskin coat, fiery throat, squinting
    eye, viper, and frog.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Sharp frost is personified by expressions describing injury or demand upon
    body parts: sweller of ears, hurter of nails, and demander of toes.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Named female or supernatural figures include the maiden of a spring or swamp,
    the mist maiden, Mielikki, Syöjätär, Para, and Christ, each with one or more figurative
    epithets.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bear is described through a long set of figurative expressions referring
    to body shape, colour, clothing, forest status, domestic animals, dogs, bundles,
    and fearfulness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dog is figuratively called the barker, son of Penitar, woolly tail, and
    money-seeker.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Milk appears both as a figurative name for blood and as a figurative name
    for the venom of a snake; literal milk is also called the gift of cows.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:8
