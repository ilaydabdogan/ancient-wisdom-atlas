canonical_text:
  quote: ''
  summary: 'A sequence of Finnic magic-song formulas: divination by arpa gear to identify
    the source of calamity; charms for horse bites, making a horse stand still, mice,
    spiders, and crossbow shooting; and a best-man formula invoking Ilmarinen, Hiisi,
    a supernatural horse, a defensive coat made from stone or rock, and Ukko’s fiery
    sword against hostile beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks the Creator, the Lord, and heaven’s ruler for leave and assistance
    before divination.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks the divining-gear to declare where the calamity came from
    and to begin moving.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The divining-gear is instructed to move with the sun for a burial-place plague,
    against the sun for village-spells, seawards for harm from water, northwards for
    harm from earth, and to stand still if it brings true intelligence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A second divination formula demands truth rather than a pleasing answer; lying
    gear is to be cast into fire, while truthful gear is raised toward the knees of
    the holy God.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hiisi is asked to bring a linen cap, Lempo a broad-brimmed hat, and old mother
    Kave is asked to arrange and turn the divining-gear and alder slips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The horse-bite formula directs a puppy’s bite into a pipe, a woman’s blow
    into a pestle, a horse’s bite into sand, and a bone-hoof’s bite into heath.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horse stand-still formula says the horse has invisible and visible attendants
    who press down its head and tire out its strength, and it commands the horse to
    stand like walls and towers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mouse formula addresses a mouse or gnawer, mentions hair in its bite or
    throat, threatens death if it touches a third item, gives a field-edge boulder
    as food, and forbids meddling with the speaker’s stack.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spider formula calls the spider a reddish ball and a golden flower, demands
    that it recognize evil action, and threatens to flay it and sell its hide in Viborg.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The cross-bow formula commands the birchen or fir-backed bow and hempen bowstring
    to strike and discharge, and asks the arrow to rise or fall if the shooter’s hand
    points too low or too high.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The best-man formula says a careful and steady man is needed when a man goes
    to wed or be betrothed and when trouble or bloodshed comes at a wedding-feast.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Smith Ilmarinen is said to have shod a horse for the speaker so the speaker
    might go woo girls in Hiisi’s fort and among the Rakko-vuori cousins.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The speaker says that if needed he will take a horse from Hiisi or a foal
    from the mountain, with hoofs that do not slip on the ice-like path of the atmosphere
    or slippery road of death.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The speaker says he previously shore wool from a stone and broke hair from
    a rock to make a defensive coat for hiding little maids and covering budding heroes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The speaker says Ukko’s fiery sword fell from sky and clouds into his right
    hand, and that he will use it to strike hounds and chase away the ghostly crew
    from front, rear, and flanks.
  category: action
  evidence_refs:
  - ev:12
