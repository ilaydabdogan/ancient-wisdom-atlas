canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes Kave, mist and spring
    maidens, earth figures, a man from Pohjola/Pimentola, Tuoni’s son, Ukko, and divine
    powers to protect the speaker from sorcerers, witches, jealous people, diviners,
    and harmful spells. Protective garments, armed helpers, a blinding bloody rug,
    and an iron or steel fence guarded by snakes and reptiles are requested.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks Kave, called Nature’s daughter, to bewitch sorcerers, curse
    those who curse, upset envious people on land, and crush witches in water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kave is asked to weave gold and silver cloth and prepare a defensive shirt
    and copper cloak for the speaker to use by night and day.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A maid of mist or fog is asked to make a shirt of mist and a copper cloak
    from materials described as wool or hair taken from stone or rock, for use when
    hostile spell-singing occurs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A maiden from the spring, pool, grass, or withered grass is asked to support
    and defend the speaker, overturn enemies in all directions, and tread old divining-men
    into mossy swamps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that seers, sorcerers, witches, soothsayers, and envious
    people are numerous in the land, earth, dells, gates, and fences.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Earth’s daughter is asked to raise hundreds and thousands of men from the
    earth and dry land, including swordless men and men with swords, to serve as the
    speaker’s people, strength, and nation among sorcerers and wizards.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Earth’s old man or Field’s son is summoned not for hunting animals but as
    the speaker’s defence, help, refuge, support, protection for work, aid for setting
    a fence, and help for rowing over waters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy in Pohjola or tall man in Pimentola, described with a gleaming beard
    and swaying hair, is called to give strength and manliness to the speaker so that
    the speaker will not be destroyed or shamed among sorcerers and diviners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tuoni’s son, addressed as red-hatted and physically askew or crooked, is asked
    to knock down sorcerers, shoot or gouge adversaries, and cover the eyes of jealous
    prying people with a bloody or gory rug brought from sky to earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ukko, father above and man of the sky, is asked to help his son and children,
    remove witches, watch jealous people, saddle stallions, and provide armed men
    to accompany the speaker and overthrow evil ones around the speaker.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Ukko formula asks that the speaker not fall before the term fixed by the
    Creator and determined by the Holy Birth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ukko is asked to make an iron or oaken fence and a steel or rowan enclosure
    reaching between earth and sky as a shelter and screen for the speaker’s people.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The fence is described with steel stakes and withes made of land-snakes, adders,
    and lizards; these reptile elements watch sorcerers, bite or crush hostile people,
    eat spells, lap up incantations, remove spell-sickness, and scatter hindrances.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A following variant asks Ukko to forge an iron enclosure and iron fence with
    iron stakes and copper withes, raised from earth to sky; the passage breaks off
    while saying a sorcerer cannot climb it.
  category: sequence
  evidence_refs:
  - ev:10
