canonical_text:
  quote: ''
  summary: The passage contains Finnic magic-song formulae. A hunting formula asks
    forest and fog beings to drive wild animals toward the hunter and to blind the
    quarry with mist. A healing section for sprains and injuries invokes Jesus, a
    sky maiden, Suonetar, and Tuoni's son to restore bones, flesh, veins, blood, and
    skin by driving, rowing, sewing, spinning, weaving, and binding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks animals to move rapidly to the speaker's catching places
    and game passes, traveling across morasses, lands, streams, forests, wilds, wooded
    hills, and mountains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mist-maiden, maid of Fog, is asked to sift mist with a sieve, scatter
    fog before the wild creature's face, rub fog on its eyes when it is nine paces
    away, and let mist descend on its head until the speaker is ready with a bow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A forest-youth with a golden hat and a forest-mistress named Juonetar, with
    variants noted, are asked to bring their 'gold' and 'silver' and send the best
    of their flock or herd to the speaker's hunting places.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A switch from a spinney, a birch bough, a bit, and halters are named as means
    for making the drove run and directing a 'money-pelt' toward the speaker.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hiisi's little boy, riding a good two-year-old, is asked to take a golden
    spur and prod the wild creatures' flanks so that the drove runs toward the man
    searching for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the formula for sprains and injuries, the aerial God, Spirit Lord Jesus,
    is asked to harness a colt, prepare a sleigh, and drive through bones, flesh,
    and loosened veins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same healing invocation asks that bone, flesh, vein ends, blood, skin,
    and joints be restored to their places, with gold placed in a bone fissure and
    silver between the flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A maiden from above the air and from the sky's midpoint is called to come
    in a copper boat or skiff and row with honeyed oars beside wounds made by iron
    or steel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sky maiden is asked to row a boat of veins and a boat of bone through
    bones, joints, missing flesh, fissures, and crevices, and to adjust veins by lengthening,
    shortening, aligning, sewing, stitching, knotting, and tying them with ribbons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Suonetar is described as a beautiful woman of the veins who spins veins from
    a golden tuft on a copper spinning-rock and weaves a cloth of veins.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Suonetar is asked to come with a skein of veins in her belt and a bundle of
    skin under her arm, in order to tie and knot vein ends in wounds, gashes, rents,
    and holes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tuoni's son with ruddy cheek is asked to twist a scarlet cord and use it to
    close a raw bleeding cut, bind the veins, knot the vein ends, and stop blood from
    flowing.
  category: action
  evidence_refs:
  - ev:7
