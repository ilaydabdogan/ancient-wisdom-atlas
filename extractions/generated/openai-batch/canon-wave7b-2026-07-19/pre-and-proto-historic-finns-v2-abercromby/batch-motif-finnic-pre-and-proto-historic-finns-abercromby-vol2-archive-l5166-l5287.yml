canonical_text:
  quote: ''
  summary: A sequence of Finnic healing and exorcistic songs addresses rickets, spell-caused
    injury, plague, thrush, and eye pain from chaff. The speaker names or questions
    afflictions, invokes divine or mythic precedents for release, commands harmful
    beings or particles to depart to remote waters, rocks, mountains, or Manala, and
    identifies chaff by names, origin, kin, and proper destination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rickets is directly addressed as a corroding boy and as a progeny without
    mouth or eyes, and is accused of attacking a child’s body.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The speaker asks who brought Rickets into the house, to the child’s bedding,
    and to the child’s body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the spell for injuries caused by spells, the speaker asks whether a person
    is to be eaten or killed without disease, God’s mercy, or the Creator’s leave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Creator is said to have freed moons, suns, men, horses, colts, and priests
    from battle-fields, and to have sent Satan to hills of steel and rocks of iron.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A variant says Kuume enclosed the moon and concealed the sun, while Kapo or
    Kave released the moon from an iron enclosure and the sun from rock or a mountain
    of steel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker states that, with the Maker’s leave and the Lord’s mercy, he releases
    the afflicted man from harm caused by villagers’ spells, utterances, enchantments,
    charms, and curses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The current release of the afflicted person is compared to the son of the
    sun escaping when freed by Paivatar.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Plague is addressed as a red Cock; the speaker says he knows its origin and
    birthplace, which are located on battle-fields or slaughter-grounds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Plague is told not to come to these parts and is directed first to outlying
    islands and reefs near Rutja’s sea, then to the Vuoksi Falls, and finally to Manala’s
    eternal huts under ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the spell for Thrush, shares are assigned to the moon, sun, and Great Bear,
    but not to Thrush.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The eye-pain spell identifies the irritant by a series of names, including
    Particle of Chaff, Barn Sweepings, Blossom of the Knoll, Gift of the Wind, and
    Donation of the Stream.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The chaff-particle is told that it came in like a fish and should depart like
    a fish into the heaving sea, where its relatives are located.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A second eye-pain spell says the chaff or husk was made to grow from the earth
    by Mantu and made to sprout by Pellermoinen.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The footnote reports that the phrase gloomy wood seems to mean the eye, with
    eyelashes compared to trees, or may refer to a splinter entering the eye while
    working in the forest.
  category: other
  evidence_refs:
  - ev:14
