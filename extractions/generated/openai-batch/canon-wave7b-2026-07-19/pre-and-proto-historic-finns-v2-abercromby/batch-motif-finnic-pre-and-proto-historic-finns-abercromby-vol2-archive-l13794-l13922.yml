canonical_text:
  quote: ''
  summary: 'The passage gives several Finnic magic-song origin formulae: an addressed
    dread being is traced to spittle, scurf, sea, wind, and a forest-creek; the wolf
    is traced to Loveatar’s childbirth and then assigned to the woods by Vainamoinen;
    salt and hail are traced to Ukko’s sky-fire falling into the sea; and the oak
    is traced through mowing, burning, ash, wind, an acorn, and a sky-reaching tree.
    Several variants substitute different names, figures, and locations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks the addressed dread being whether its origin is from wind,
    sky, or a deep water-spring, then denies these and says the origin is known.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Syojatar spits on the water or waves, and Kuolatar rises from the sea on a
    treeless isle or stoneless reef.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kuolatar rubs her palms, obtains a little scurf, throws it on the lake or
    sea over her left shoulder, and wind carries it ashore to a wooded forest-creek.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The addressed being is said to be born or to have arrived in the wooded creek,
    while also being bred on the open sea and reared in the creek.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A variant names Nuoratar, with Maaratar as another variant, as the figure
    who rises from the sea.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the wolf origin, Loveatar first tries to give birth in a frosty pool or
    icy well, but no birth occurs there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Loveatar then gives birth in a dense bird-cherry grove to a son described
