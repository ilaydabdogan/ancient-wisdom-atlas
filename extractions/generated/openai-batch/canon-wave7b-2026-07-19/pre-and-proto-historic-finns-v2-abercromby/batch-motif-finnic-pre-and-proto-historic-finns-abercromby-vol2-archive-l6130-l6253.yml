  quote: ''
  summary: The passage contains Finnic magic-song formulae addressing a bear with
    euphemistic affection, redirecting it toward wilderness or ritual submission during
    a hunt, and a cattle-protection charm that seeks guardians for herds by addressing
    trees, a maid of rapids, and named female forest-related figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker redirects anger, bitterness, bad desires, and virulence into vegetation
    and instructs natural actions such as grubbing at a grassy knoll, shaking a rotten
    tree, upsetting a birchen stump, throwing mountain stones, and twisting water-growing
    bushes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear is addressed with affectionate or euphemistic names and is told not
    to remain at the cows' feet but to go to distant grassy plains, backwoods, wilderness,
    and wooded wilds where honey and mead are mentioned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hunter-speaker takes a pike and pointed spear, leaves men, and goes with
    dogs to Bruin's room, house, yard, and trampled ground near pines and a fir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bear is told to rise from its lair, conceal its claws and teeth, lay its
    head on linen, bind silk across its eyes, and lie on a grassy knoll or rock under
    firs and pines.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sound first thought to be a cuckoo is identified as the speaker's dog at
    the door of Bruin's room.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The bear is told not to take offense if bones crack, heads are struck, or
    teeth are smashed, and is instructed to surrender a head-ornament, cast teeth
    away, and fasten its jaw.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the cattle-protection formula, Jesus and God are named as makers of summer,
    while marshes, firm land, and waterpools thaw or warm.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The cattle-protection speaker asks whether to release cows, calves, sheep,
    horses, and swine to pasturage, forest places, abandoned fields, and shorelands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A poor mistress asks whom she should send as shepherd, cattle-herd, godfather,
    and guardian of the bells.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Willow, alder, rowan, and wild bird-cherry trees are proposed and addressed
    as shepherd, cow-watcher, manager, and drover for the cattle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The trees are threatened with being cast into a stream, cut, or put into fire
    and flames if they do not perform their assigned cattle-guarding tasks.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The maid of rapids or maid of foam is appointed as shepherd, godmother, and
    guardian of the bells.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Suvetar, Mielikki, Hongatar, Pihlajatar, Katajatar, and Tuometar are named
