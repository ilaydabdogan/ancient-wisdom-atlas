canonical_text:
  quote: ''
  summary: 'The passage catalogues recurring structures in magic songs and charms:
    return to a source, boasting by the speaker, impossible events as conditions before
    evil can act, binding evils in a place, divine self-identification by ritual specialists,
    and redirecting ailments to inanimate natural objects. It compares Finnish examples
    with Russian, Votiak, Ceremis, Mordvin, and Lettish materials, then discusses
    the uncertain antiquity of Finnish magic formulae and earlier practices involving
    wizards, diagnosis, offerings, and prayer-like appeals to helpers.'
  language: English
  quote_policy: summarized
