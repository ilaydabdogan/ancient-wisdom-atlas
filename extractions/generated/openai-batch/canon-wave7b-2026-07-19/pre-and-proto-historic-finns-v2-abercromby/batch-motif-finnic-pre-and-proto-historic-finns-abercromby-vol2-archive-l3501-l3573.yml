canonical_text:
  quote: ''
  summary: The passage contains boasting and violence-stilling incantation material.
    The speaker claims prior access to witch-drunk water, protective stone or gravel
    hand-coverings, serpent companions that consume hostile spells, and animal-derived
    claws or paws for overcoming sickness attacks. Later lines state that death or
    injury requires divine permission, invoke helpers associated with Hiisi, the mountain,
    and the sea, command a violent hound or dog of Hiisi/Manala to stop harming a
    Christian man, and threaten escalation to a sea ogress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he had already drunk from water associated with witches,
    jealous villagers, and fire-throated drinkers before a wizard, sorcerer, or jealous
    person had risen or awakened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he made mitts of gravel and gloves of stone for handling
    adders and gathering snakes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he took ten adders and a hundred snakes to accompany him,
    move before and beside him, and eat or devour villagers’ spells and incantations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Three attacks of sickness are said to have come against the speaker: one
    by swamp, one by ground, and one by water; the water-borne attack is described
    as the hardest.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The swamp and ground attacks are described with necks, one pole-like and one
    crooked or arch-like.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker says he took claws from an eagle, talons from a hawk, paws from
    a bear, and crooked hands from bruin to claw the miscreant, check the hideous
    thing, squeeze elfshots, and smash arrows of disease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that no one is eaten or slain without cause, disease, the
    Creator’s leave, or God’s death-decree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the speaker is not the proper man to release spell-sent trouble, he says
    his comrade is proper; this comrade dwells with Hiisi’s folk and roams on the
    mountain, and can strengthen the speaker against club, hook, and wind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker commands the ‘hound of Hiisi’ or ‘dog of Manala’ to disappear
    or cease from deranging a Christian man and from harming many specific organs
    and body parts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: If the speaker cannot help, he says he will send a better man to remove the
    malady; a man from the sea is then described as appearing, shaking his furs and
    skin coat, with very large hose.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the malady does not heed the sea man, the passage refers to an Ogress in
    the sea with a mouth in the middle of her head and a tongue in the middle of her
    throat, who has eaten and destroyed many people.
  category: attribute
  evidence_refs:
  - ev:5
