canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes the Creator as cattle
    watcher, narrates a spear seized by Hiisi, silences or diagnoses dogs, lures ermines
    into traps, commands yeast to rise, and instructs how to charm a snake on the
    hand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cattle formula says the Creator or Omnipotent may be sent as herd and
    watcher, bringing the cattle to fire and smoke until they come home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note explains that smoky fires are made in summer where cattle pass the
    night to keep midges away.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the spear charm, a wolf finds a spear in a swamp and tells a bear that
    the spear is medium-sized.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hiisi overhears the animals, takes the pointed or copper-headed spear, and
    hurls it into a human body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dog charm addresses Hiisi-associated dogs and other beings, orders them
    to close the mouth and conceal the head, and redirects barking away from the speaker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker claims to know the dog’s origin and lineage, describing the father,
    mother, and dog itself as eyeless.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The dog charm uses honey, closed-jaw imagery, Hiisi, Lempo, a bloody cloak,
    a gory rug, and silk over the eyes to stop the dog from speaking, hearing, or
    seeing the passer-by.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A second dog charm asks why the dog will not bark or point properly and suggests
    that a jealous or skew-eyed person may have observed it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The second dog charm contrasts ordinary fir branches with fir-tree “flowers”
    and “luxuriant” trees.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The ermine charm addresses the ermine with affectionate or metaphorical names
    and summons it immediately into the speaker’s gins and traps.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The ermine-trap bait is described with honey, hook, golden cup, copper box,
    salt taste, and honeyed appearance or effect.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The yeast charm commands yeast or barm to rise and ferment, contrasting it
    with the moon and sun that have already risen.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The snake charm is framed as speech for a careful man when a viper, snake,
    worm, or Tuoni’s maggot crawls on the hand or fingers.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: The snake is praised with affectionate names, warned away from fir bough,
    stone, and water, and commanded to close its mouth, hide its tongue, turn on the
    palms, and leave the hand.
  category: speech
  evidence_refs:
  - ev:14
  - ev:15
