  text: A fox and its sleigh are invoked to draw the target to the beach and roll
    it into the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The target is ordered into a sequence of animal mouths, throats, holes, heads,
    flesh, tongues, groins, bones, and other enclosed places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the target has come from Raima’s chambers, the huts of the spectral host,
    stone heaps, or the border of a holy field, it is urged to go home to Raima’s
    heath and grave-like earth where dead families are enclosed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grave-associated home is described as a house of fir or pinewood nest
    where the target may sing like a golden cuckoo or silver turtle-dove.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the target has bolted from a corpse or Kalma, it is commanded to disappear
    into a corpse and go to a burial ground, holy field, or house of the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The corpse or dead person is described as providing food, fat flesh, and a
    body that will not weep if bitten.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker orders smarting pains and sufferings to sink at fiery rapids and
    in the whirlpool of a holy stream.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A fiery bull on a fiery reef is said to bear the pains to Mana and the sufferings
    to Tuonela, from which they will not escape or be fetched away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A later command sends the target into named violent, gurgling, and foaming
    rapids.
  category: setting
  evidence_refs:
  - ev:6
