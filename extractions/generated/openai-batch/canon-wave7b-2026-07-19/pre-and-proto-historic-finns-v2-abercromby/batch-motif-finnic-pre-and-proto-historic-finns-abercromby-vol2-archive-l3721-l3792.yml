  quote: ''
  summary: A Finnic exorcistic song commands an addressed harmful presence or pain
    to depart into animal vehicles, animal bodies, water, burial places, grave-associated
    origins, fiery rapids, and finally to Mana or Tuonela, where it will not return.
  language: English
  quote_policy: summarized
