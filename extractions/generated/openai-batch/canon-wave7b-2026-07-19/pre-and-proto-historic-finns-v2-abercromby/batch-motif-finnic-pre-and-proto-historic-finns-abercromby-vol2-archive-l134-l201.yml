canonical_text:
  quote: ''
  summary: The passage describes the organization and numbering of Lönnrot’s East
    Finnic charm collection and lists types of magic-song formulae used by an exorcist
    or wizard for healing, protection, diagnosis, reparation, expulsion, pain relief,
    intimidation of hostile persons, ecstatic strengthening, and fixing an expelled
    evil in a locality. It also notes that the order of recitation was not uniform,
    but gives an example involving a wound or open sore and a vapour formula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lönnrot’s collection is described as having 233 heads with variants, divided
    into charms, prayers, and origins; the translator states that he selected, translated,
    and renumbered specimens for reference.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A preliminary formula could be repeated by the exorcist before beginning operations,
    especially when healing the sick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Defensive formulae were directed against sorcerers, witches, and other malevolent
    persons, and were especially necessary before setting out on a journey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Formulae against envy were said to prevent envious persons from spoiling the
    exorcist’s work through evil glances and intrigues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vengeance and boasting formulae are described as frightening away antagonists,
    sorcerers, witches, the envious, and other opponents.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: A formula to discover the cause was used in treating the sick when the origin
    of the malady was uncertain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a reparation-for-harm formula, the exorcist or wizard orders the person
    who caused pain and suffering to come and cure the sufferer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Formulae against inflammation were useful in cases of snake-bite, contusions,
    and inflammatory wounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Expulsion charms were used for complaints and diseases, especially those attributed
    to bewitchment; exorcism removed disease, pain, curses, and spell-sent injuries
    elsewhere.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:10
  text: A posting formula followed an expulsion or exorcism formula, and a make-fast
    formula obliged the expelled evil to settle in a given locality and remain motionless.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:11
  text: Pain or sickness, distress, and still-violence formulae are described as useful
    for allaying or assuaging pains and severe pain in sickness.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The reproaching formula could be used for snake-bite, toothache, and injuries
    caused by stone, fire, iron, frost, and similar causes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A falling-into-ecstasy formula was used for steeling the nerves while conjuring
    the sick and removing obstacles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Boasting was also used for steeling faculties, proclaiming power, and gaining
    confidence; menacing was used after an expulsion formula if the latter failed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Lönnrot states that the order of reciting charms was hard to determine and
    not everywhere uniform.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: For a patient with a wound or open sore, a vapour formula could be recited
    to prevent hot steam from hurting it, followed, if not already done, by preliminary,
    defensive, and anti-envy formulae.
  category: sequence
  evidence_refs:
  - ev:8
