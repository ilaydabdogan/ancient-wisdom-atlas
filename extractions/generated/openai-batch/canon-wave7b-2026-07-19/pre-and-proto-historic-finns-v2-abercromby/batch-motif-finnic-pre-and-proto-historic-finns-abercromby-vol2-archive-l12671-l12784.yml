canonical_text:
  quote: ''
  summary: The passage gives Finnic formulaic accounts in which an iron-axe-bearing
    man fells a powerful oak. Chips and branches from the oak are carried by wind
    and water; some become boat wood for Vainamoinen, some confer luck or magic skill,
    and some are gathered by Hiisi’s lass and made into arrows and spears associated
    with injury, stitch, pleurisy, and elf-shots. A variant repeats the fiery-oak
    origin of harmful missiles through underworld waters and demonic smithing. Another
    short variant derives fevers and pleurisies from mist and fog sifted by Udutar/Terhetar.
  language: English
  quote_policy: summarized
