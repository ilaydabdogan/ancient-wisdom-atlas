  summary: A healing or defensive incantation addresses an unnamed harmful being or
    affliction, questions its possible origins in water, earth, animal places, fire,
    smoke, wind, and sky, commands it to repair the harm it caused, invokes its mother
    or parent as a threatened witness, and asks that inflammation, anger, malignity,
    and sores depart, sink, dissolve, or melt away.
