canonical_text:
  quote: ''
  summary: 'The passage contains several Finnic healing and exorcistic charms: an
    affliction is commanded to leave the gloomy wood for the sea; eye disease is addressed
    and sent back to its cause; rickets affecting the eyes is transferred to mountains,
    roofs, and eaves while the eyes are wished bright; a lizard bite is treated by
    naming the lizard’s origin and commanding it to repair its harm; a wolf-bite narrative
    has Nukuhutar threatened with Mana/Tuonela but healed by Tapio’s daughter with
    honey and alder leaves; childbirth pain is framed as an obstacle, followed by
    a narrative of Virgin Mary’s berry-induced pregnancy and Ukko’s aid in delivery.'
  language: English
  quote_policy: summarized
