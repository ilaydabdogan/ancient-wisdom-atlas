canonical_text:
  quote: ''
  summary: 'The passage describes East Finnic healing and magical procedures: injuries
    are treated by reciting their ''origins''; unknown causes are sought by a formula
    and divination; the wizard recites a contemptuous genealogy of the harm in order
    to shame or expel it; healing is often performed secretly in a vapour-bath house
    using specially selected woods, waters, switches, numbers, directions, and materials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Known categories of disease or injury are treated by reciting their respective
    'origins.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the origin or cause is not known, a formula 'to discover the cause' is
    recited, and the wizard may use divination to ascertain the cause of disease or
    injury.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The 'origin' recited by the wizard is described as the genealogy or pedigree
    of the disease or cause of harm, not as the actual immediate cause of the patient's
    condition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The origin or pedigree is said in an opprobrious, derisive, or contemptuous
    manner.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wizard's stated aims include shaming the harmful cause into repairing
    the evil or making clear that it cannot succeed against him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wizard sometimes represents himself as the son of Ukko and as protected
    by defensive clothing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The recital of a deep origin is said to expel a needless evil or banish an
    evil spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Healing is usually performed in a vapour-bath house heated as secretly as
    possible so that hostile persons do not learn of it and injure the operation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Preferred heating wood may come from trees struck by lightning, trees washed
    ashore by wind, the hindmost beam of a barn for childbirth, or paired trees grown
    or twisted together for love magic.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ritual water may be drawn from a north-flowing stream, especially its bubbly
    part near rapids, or from a natural spring into which gold or silver scrapings
    have been dropped three times.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dropping gold or silver scrapings into spring water three times is called
    'buying the water.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bath-switches may be made from triple-twigged birch sprigs from the land of
    three or nine rent-paying farms and are called 'exorcism-twigs.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: For a love spell, the bath-switch may be made from twigs growing where three
    paths cross, with three root-shoots from the north side of a tree inserted in
    its centre.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Other instructions place bath-switch materials near three rapids or at the
    brink of three angry rapids, and specify rowan or juniper for heating the bath.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: One instruction has water carried from the Vento stream in a cup connected
    with the moon and a ladle connected with the sun.
  category: object
  evidence_refs:
  - ev:10
