  summary: A healing or expulsion sequence commands an intrusive evil or Hiisi-associated
    being to leave the sufferer’s body under divine Christian timing, recalls the
    release of sun and moon from confinement, offers a supernatural horse for the
    departing force, and sends pains to mythic locations where female figures gather,
    spin, boil, contain, or bury them in sea depths, chests, pots, and a nine-holed
    stone on the Hill of Pain.
