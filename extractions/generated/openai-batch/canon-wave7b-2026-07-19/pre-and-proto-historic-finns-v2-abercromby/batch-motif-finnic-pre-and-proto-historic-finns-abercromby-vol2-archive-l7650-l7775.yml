literal_observations:
- id: obs:1
  text: A tooth charm commands a copper crooked bow with a fiery string and a fiery
    bolt feathered with eagle and sparrow feathers to be used against a being named
    as Tuoni’s grub, a bone-biter, Hiisi’s cat, or Lempo’s dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same tooth charm describes the target as eating, crunching, fretting,
    gnawing, tearing, ravaging jaws, and hacking down teeth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A short maiden called Tuoni’s girl is asked to remove a cur or Lempo from
    the teeth and jaws and to force maladies and injuries into an iron baking-pan
    among Hiisi’s coals in the fire of the evil power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old white-bearded man is asked to strike the ground with a whip so that
    mist rises, and a little man appears in the mist carrying a bow and bolt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says the bow and bolt from the mist will be used to shoot Hiisi’s
    son so that Lempo’s cur stops rending teeth and cheek-bones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: St. Stephen or Tapani is invited to watch near at hand when a horse is sent
    to summer grazing-grounds and honeyed grassy places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lord of horses, named Tahvanus with variants Timanter and Rukotiivo, is
