canonical_text:
  quote: ''
  summary: 'The passage presents several Finnic magic-song formulae: tooth or jaw
    affliction charms using fiery weapons, burning, and summoned helpers; horse-protection
    charms invoking St. Stephen/Tapani, the lord of horses, and Iki Tiera; a formula
    for a person gored by an ox invoking parents and Virgin Mary; and the opening
    of a bridal-procession formula invoking landscape beings, Luonnotar, and sky/earth
    parents for protection and road-opening.'
