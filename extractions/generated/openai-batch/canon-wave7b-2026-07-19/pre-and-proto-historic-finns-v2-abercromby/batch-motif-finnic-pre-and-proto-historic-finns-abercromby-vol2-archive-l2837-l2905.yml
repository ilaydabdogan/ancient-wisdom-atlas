canonical_text:
  quote: ''
  summary: The passage gives charm-formulas against envy and for vengeance. It addresses
    envious onlookers, spies, and curse-speakers, wishing their eyes, mouths, jaws,
    tongues, and senses to be blocked, injured, bound, or transformed. It also describes
    malicious words and thoughts returning to their speaker and stones punishing a
    curser or one who has melted someone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An envious glance, jealous eye, mouth-bewitchment, and imprecating words are
    named as harmful acts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The formula wishes substances and restraints associated with Hiisi and Tempo
    upon the harmful person's eyes, face, mouth, jaws, tongue, and head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a person who merely overlooks or stares from one side, the passage asks
    that the person look with honeyed eyes and a honeyed glance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If envious or cockeyed persons look or pry, twigs or branches are asked to
    tear or pluck out their eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A withered fir or iron-branched tree is wished to grow before the envious
    person's house and hold that person's gaze until release.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Envious persons are described as watching from windows, farmyards, cattle-sheds,
    bridges, fences, or nearby ambush places.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A bloody cloak, gory rug, and hat associated with Hiitola, Hiisi, or variant
    names are to be bound across eyes, ears, and napes so the watchers cannot see
    or hear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Malicious words and thoughts are wished to return to the speaker's house or
    cottage and penetrate the speaker's heart, liver, lungs, lap, body, and quick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person who repeats the speaker's words is threatened with words leaving
    the head and brains like steel-pointed needles, with tongue twisting and hair
    rubbed away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A person who curses is threatened with a fiery plug, copper wedge, Hiisi's
    gag, Tempo's lock, a stone tongue, and a moss-grown mouth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says stones should curse the curser and boulder stones should
    melt the one who has melted anyone.
  category: action
  evidence_refs:
  - ev:8
