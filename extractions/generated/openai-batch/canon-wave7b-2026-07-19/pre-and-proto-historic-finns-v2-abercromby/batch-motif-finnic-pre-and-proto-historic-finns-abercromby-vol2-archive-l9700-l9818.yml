candidate_motifs:
- id: motif:1
  label: Forest powers release or drive game into traps
  taxonomy_refs: []
  basis: Multiple hunting formulae ask forest rulers, mistresses, maids, and related
    beings to supply animals, open stores, sow hoofs, or drive forest creatures toward
    snares and traps.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage consists of formulaic requests; it does not narrate an actual
    hunt being completed.
- id: motif:2
  label: Food offering or approval request in exchange for quarry
  taxonomy_refs:
  - sacred_exchange
  basis: The fox-catching formula asks forest powers to take a fancy to salt, approve
    groats, feed or coax, and then induce or drive quarry toward the speaker’s traps.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text frames the food items as part of a petition; it does not explicitly
    describe a completed reciprocal transaction.
- id: motif:3
  label: Divine control of weather for travel
  taxonomy_refs: []
  basis: Ukko is asked to make fresh snow fall so a sleigh or sledge can glide or
    dash along and so ground stalks are covered.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a short utilitarian formula rather than an extended mythic episode.
- id: motif:4
  label: Fiery divine weapon cuts spell-wrought injury
  taxonomy_refs: []
  basis: Anti-spell formulae ask Ukko to bring a fiery sword or sparkling blade to
    sever spell-wrought ills, scatter injuries, remove plague, and tear out Hiisi’s
    sore.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives ritual speech rather than a narrative combat scene.
- id: motif:5
  label: Affliction imagined as death or underworld bindings on the body
  taxonomy_refs: []
  basis: A formula asks Ukko to take from the sufferer’s mouth, neck, and shoulders
    the bit of Death, chains of Manala, and Tuoni’s reins.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe an afterlife journey; it only names death-
    or underworld-associated objects attached to the sufferer.
- id: motif:6
  label: Coercive fire used to drive or expel harm
  taxonomy_refs: []
  basis: Fire appears both as Hiisi’s hot coals driving the herd and as Ukko’s fiery
    sword used against spell injuries.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: medium
  cautions: This combines two different formula contexts, hunting and healing, so
    the shared fire function should be reviewed.
- id: motif:7
  label: Cosmically marked healing weapon
  taxonomy_refs: []
  basis: One anti-spell formula describes a fiery sword whose point gleams with the
    moon and whose hilt shines with the sun.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The motif is based on a single image in one formula variant.
comparison_claims:
- id: claim:1
  claim: The fox-catching petitions have the same function as a sacred-exchange pattern,
    because food items are presented to forest powers in a request that quarry be
    sent or driven into traps.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The formula requests acceptance and aid but does not show a completed
    exchange or reciprocal covenant.
- id: claim:2
  claim: The anti-spell formulae fit a protective divine-intervention pattern in which
    a high sky figure is summoned to remove magical affliction with a weapon.
  claim_level: same_function
  target: protective divine intervention against sorcery pattern
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports functional similarity only; it gives no evidence
    for historical contact, inheritance, or a specific comparative source.
