canonical_text:
  quote: ''
  summary: 'The passage gives several Finnish magic formulae: hunting and trapping
    invocations to forest rulers and mistresses, a request to Ukko for fresh snow
    for a sleighing road, fox-catching formulae invoking forest beings and named helpers,
    and anti-spell formulae asking Ukko to remove injuries, plague, and death-associated
    bindings with a fiery sword.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses a good old man and golden forest-king, asking him to provide
    ewes, rams, wool-like packages, flax-like sheaves, and a distaff-like object under
    the speaker’s snares and trigger-pin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker addresses the forest-mistress Simanter, described with a tin sheath
    and silver belt, as dwelling in mountain tracts and making noise on copper hills.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Simanter’s tallest serving-maid is asked to open mountain magazines and passages
    so a file of creatures or mountain cattle will run toward trapping devices.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the cattle do not hurry, the speaker asks that Hiisi’s hottest coals be
    set below their hind feet so the herd is burned or scratched by sparks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ukko is asked to let fresh snow fall for a sleigh or sledge and to cover berry
    and heather stalks on the ground.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a fox-catching formula, the forest king Kuippana and a liberal mistress
    of the woods are asked to accept salt and boiled groats and to drive forest creatures
    toward iron gins and steel traps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another fox-catching formula addresses Forest, Tapio, Mimerkki, Raunikko or
    Rammikko, Louhi, and Nyyrikki, asking that animals come without suspicion to the
    speaker’s catching places and traps.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says white ones may be chosen for other men, but black ones suit
    the speaker best, and asks that such animals be fetched from beyond nine deep
    woods or from a hundred stages away if they do not appear nearby.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Paistarys, also identified in variants as Tapio’s maiden or Ristikko, is asked
    to strew flax-stalks or cloaks so cross-breasted and black fur-bearing beings
    come to the speaker’s trapping places without scenting humans.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: An anti-spell formula asks Ukko, lord on high and god above the cloud, to
    come when needed, see pains, avert calamity, remove injury from spells, and eject
    plague.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ukko is asked to bring a fiery sword or sparkling blade to sever spell-wrought
    ills, scatter injuries, tear out Hiisi’s cankerous sore, and assign pains to winds
    and abandoned fields.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A related formula locates Ukko at the sky’s mid-point and the edge of a thundercloud,
    asking him to undo a fiendish deed with a fiery pointed sword whose point gleams
    with the moon and whose hilt shines with the sun.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A further formula asks Ukko at the sky’s mid-point to remove from the sufferer’s
    body the bit of Death, chains of Manala, and Tuoni’s reins.
  category: speech
  evidence_refs:
  - ev:9
