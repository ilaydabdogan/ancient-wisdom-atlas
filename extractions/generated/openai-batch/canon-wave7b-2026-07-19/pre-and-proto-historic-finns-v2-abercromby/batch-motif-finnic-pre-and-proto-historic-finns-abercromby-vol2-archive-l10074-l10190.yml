canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae asks Vaino’s girl to wet a firearm
    touch-hole pan, invokes Ukko and Ilmarinen for weapons before war, invokes Ukko
    for snow-skates, appeals to Creator/God/Nature/Holy Ghost and Ukko against harmful
    incantations, and calls on Ukko to release a laboring woman and open birth obstructions
    so a child can emerge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaino’s girl, described with gold, copper, and silver adornments, is asked
    to dash water from nine springs and three pitchers on a touch-hole pan so powder
    and projectiles do not discharge among the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ukko is addressed as a high god and sky-father and asked to bring swords and
    sabres for the speaker’s impending war and hand-to-hand combat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The war setting is described as battle-fields and slaughter-plains where blood
    reaches to the leg or knee.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilmarinen the smith is summoned from under a wall or behind a stone and asked
    to forge a sword, pikes, and spears for war.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ukko is asked to procure straight and rapid snow-skates for travel through
    forests, swamps, firm land, and northern moors to places of game and fur animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Creator, Nature, God above, and words framed by the Creator and prescribed
    by the Holy Ghost are invoked for protection from evil words, incantations, sorceries,
    and hostile designs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ukko is addressed as beloved father in the sky and urged not to go fishing
    or to war, but to counteract harmful charms, spells, plots, and scheming.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: In childbirth distress, Ukko is called to come close, observe whether the
    woman is under village spells or old women’s charms, and release her from binding
    spells and heavy bands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ukko is told to take a golden club, break obstacles, smash door-posts, open
    the Creator’s locks, and break bolts so a small or large child may come out into
    the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A second childbirth formula asks Ukko to take a golden axe and silver hatchet,
    break thresholds, gates, bone locks, and oven or wall stones, and release a boy
    or child from the woman before death approaches.
  category: action
  evidence_refs:
  - ev:9
