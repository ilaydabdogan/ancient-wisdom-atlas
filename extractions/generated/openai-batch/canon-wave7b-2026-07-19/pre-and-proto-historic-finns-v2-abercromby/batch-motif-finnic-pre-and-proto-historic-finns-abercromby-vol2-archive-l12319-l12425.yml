- id: obs:4
  text: An old man associated with Osmo or Luck sows barley, and the barley grows
    well in Osmo’s new field and Kaleva’s son’s clearing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Osmotar, described as a brewer of ale and a woman who brews small beer, combines
    barleycorns, hops, water, and fire in a pot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Osmotar boils the ale but cannot make it ferment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Osmotar plucks wild mustard and rubs it with her hands and thighs, producing
    a martin with a golden breast.
  category: action
  evidence_refs:
