canonical_text:
  quote: ''
  summary: The passage gives formulaic accounts of ale-making. Hops, barley, water,
    and fire are prepared by female brewers such as Osmotar, Kalevatar, or Pohja’s
    maiden. Failed fermentation is corrected first by a martin that brings horse froth,
    with harmful results, and then by a bee that brings honey, producing successful
    ale. A variant personifies hops, water, and barley as desiring union, includes
    bird helpers, and ends with a reminder to pour ale on the earth.
  language: English
  quote_policy: summarized
