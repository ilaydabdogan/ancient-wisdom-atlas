  text: Ilmarinen the smith comes upon iron sprouts and lumps of steel in a swamp,
    located in the tracks of a wolf and in the heel-dints of a bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen addresses Iron as unlucky and asks whether it would become more
