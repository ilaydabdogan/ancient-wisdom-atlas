canonical_text:
  quote: ''
  summary: Ilmarinen finds iron in a swamp in the tracks of a wolf and bear, persuades
    the personified Iron to enter the forge, smelts it, receives Iron's oath not to
    harm kin, forges implements, and then seeks a hardening fluid; a bee is sent for
    honey, but a hornet associated with Hiisi brings poisons for the steel-hardening
    water.
  language: English
  quote_policy: summarized
