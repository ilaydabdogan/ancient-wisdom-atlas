canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song exorcisms commands blood to stop flowing
    and remain inside the body, seeks plugs or dams for wounds, invokes divine aid
    and a primordial divine precedent, then addresses dropsy, cough, and colic as
    hostile agents to be removed, redirected, or overcome.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blood is addressed directly and commanded to stop trickling, dribbling, and
    flowing to the ground.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood is told that it is not a stream, lake, swamp-pool, or leaking worn-out
    boat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Blood is assigned an internal bodily place: the heart, below the lungs, and
    within a chamber.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blood or gore is commanded to stand still like fixed barriers and objects,
    and to move within flesh and bones rather than stream to the ground.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A wound is described as a fearful hole, gash, incision, and slash made by
    iron, steel, and a slender blade, while blood flows like a stream or cataract.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Silver stoups, golden cans, birch-bark pails, and alder-stave pails are fetched,
    but they do not adequately contain the flowing blood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gravel and sand are proposed as means to change the blood’s course or mix
    with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A dangling spider is summoned to spin a web before the blood passage, so that
    it may become skin or harden into stone as a stopper, dam, or bar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The word of God, trust in the Maker, the Creator’s grasp, and flesh from Jesus’
    or the Lord’s side are invoked to stop the blood before it reaches earth or dust.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A primordial episode says land was lifted from under the sea and fish, after
    which the Creator made an incision in his own flesh and blood flowed from under
    his left foot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Creator declares that tar and fir-fat should drip to the ground rather
    than guiltless blood, because blood belongs in the heart, flesh, and bones.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Water’s rulers are asked why they are angry and why they have sent armed sons
    or hirelings to injure internal organs, bones, and knees.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: An iron-crested, spur-footed cock is summoned to claw toads and rub down Hiisis
    until they are heard of no more.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cough and Glanders are addressed as arrivals or attackers; if brought by wind,
    Cough is told to depart along the wind’s path into firs and pines.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: If Cough came from old women, it is ordered to go to a crone’s home and then
    an old man’s home, where old women and old men are said to need it.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Colic is addressed as a gasping, groaning boy, a toad, water’s scum, an evil
    one, and Lempo, and is asked why it has attacked a Christian man.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Colic is told it should have gone past a blue bridge and red foot-bridge toward
    the polar star, or entered a lynx’s skin, a wolf’s mouth, a forest-bear’s arms,
    or a bear’s bones.
  category: speech
  evidence_refs:
  - ev:12
