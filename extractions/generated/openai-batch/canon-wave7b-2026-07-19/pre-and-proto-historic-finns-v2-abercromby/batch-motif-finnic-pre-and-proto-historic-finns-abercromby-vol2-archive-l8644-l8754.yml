canonical_text:
  quote: ''
  summary: 'The passage gives several Finnic magic-song formulae for making a maiden
    attractive and marriageable: fetching water to wash her; invoking Virgin Mary
    to draw water, purify, adorn, and beautify her; summoning a maiden from a spring
    or pool to lend water; commanding personified Love and Renown to rise, shine,
    and attract men; and invoking rut or erotic heat from animals and heated objects
    to compel a male target. The excerpt ends with the heading and opening fragment
    of a separate formula for weaning a heart from another love.'
  language: English
