canonical_text:
  quote: ''
  summary: A first-person protective spell imagines yoked adders, saddled snakes,
    and released predators guarding the speaker against spells and magical adversaries.
    A sky-maiden weeps three rivers, including fiery rapids where a fiery reef, birch,
    and eagle appear; the eagle is equipped to remove wizard-arrows and watch jealous
    people. The passage then calls kin to encircle the speaker, recalls aid from God
    or a haltia, and gives an anti-envy formula invoking the Envy-matron, Vffinamoinen,
    and Jesus, with curses for jealous gazes and blessing for non-envious eyes.
  language: English
  quote_policy: summarized
