canonical_text:
  quote: ''
  summary: A group of translated Finnic magic-song passages commands a bound addressee
    to remain fast until released by the speaker; addresses wasps, gadflies, and hornets
    to stop stinging and redirect their harm; describes a fiery self-equipping exorcist
    combating elfshot and sudden strokes; and narrates toothache as a dog-like affliction
    followed by an intervention by Tuoni's girl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the bound addressee will not be free unless the speaker returns
    to release it, including with groups of animals such as rams, bulls, stallions,
    dogs, and hounds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker orders a wasp not to shoot or sting human skin and directs its
    sting, arrows, and biting toward wood, juniper, stone, rock, trees, stumps, itself,
    or its mates.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker addresses a wasp, gadfly, and hornet, says their arrows should
    not enter human skin, and claims knowledge of the wasp's origin and upbringing
    by Synnytar and Kasvatar.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The insect is described as blind like its father and mother and is told that
    father, mother, and the insect die or will die in snow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The insect is ordered to remain no higher than the knee, put its nose and
    head into confined places, and cast malice, smarts, bitterness, cruel harm, and
    poisons into a copse, fallen trees, heath, wilderness, and mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The insect's place and dwelling are assigned to wilderness, swamp, and bark-built
    rooms or huts, away from passers-by and human awareness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker sews a fiery fur coat with fiery selvages in a fiery room, dresses
    in it, and goes to hunt a sudden stroke and combat elfshot disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker sends the stroke to wild fields and blows elfshots to the clouds,
    then answers one, two, or three hostile arrows with greater numbers, up to a hundred
    and a thousand arrows, using stronger steel tools.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An eagle or figure called steely jaws and scaly back rises from wet or stony
    places and sits on a stone edge; the speaker takes its claws to meet a fiend and
    drive away elfshot-sicknesses, paralysis, and other attacks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Attacks of sickness are described as threefold, approaching by swamp, winter
    road, and water springs; the worst is forced into the cleft of five big hills
    and between two rocks, while the others are sent into wild fields and wet places.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Toothache is narrated through a stinking dog or hound that bites bone and
    tears the jaw, putting peas and beans into an old man's jaw and aching teeth;
    the old man droops and dies from the disease and gnawing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A short old woman called Tuoni's girl drives a thrice-forged nail into the
    jawbone, salves toothache pains with her tongue, and speaks words asking that
    salt sound propitiously and that the old man arise and stand upright.
  category: sequence
  evidence_refs:
  - ev:7
