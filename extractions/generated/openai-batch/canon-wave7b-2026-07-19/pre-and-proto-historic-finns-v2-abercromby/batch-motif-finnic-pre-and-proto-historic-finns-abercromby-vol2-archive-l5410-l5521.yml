canonical_text:
  quote: ''
  summary: The passage gives exorcistic and healing formulas for itch, scab, warts,
    skin eruption, and burns. Skin afflictions are addressed as beings and commanded
    away to wilderness or back to their elemental origins. Fire is addressed as a
    created force that has gone too far and is ordered to leave human skin, ascend
    to the sky, and return to its former state. Burn remedies invoke Sumutar, metal-taloned
    eagles, a black dog, an ox struck by a sea-born man, Porotytto/Hiiletar with ice
    and water, and maidens on clouds or near water who cool, wipe, salve, or extinguish
    fire injuries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Itch and Scab are directly addressed and ordered to leave human skin and the
    body of a mother’s son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The itch/scab affliction is sent by four roads to deep gloomy woods and a
    wilderness from which humans do not return; if it meets a bear, it is told to
    enter the bear’s house and not come back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Warts are described as caused by earth or soil, fire, wind, and air, and are
    exorcised back to earth or fire according to their origin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wart or annoyance is also addressed as a toad and evil one and is told
    to go beneath stones and into the evil spirits’ flags; possible origins include
    barn-sweepings, field edges, steam heat, furnace stones, bathhouse smoke, and
    sweltering heat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire and Flame are accused of causing damage, while also being described as
    made by God and formed by the Creator.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fire is commanded to withdraw from painful human skin, move away like wind,
    water, and warm vapor, mount to the sky, flee to the clouds, and return to its
    former state and the center of the golden ring.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sumutar, a portly woman from the mud, is raised from a swamp to survey Fire’s
    deeds and repair its injuries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Three eagles with iron, copper, and silver talons are invoked to eat pain
    produced by Fire and lap Fire’s broth; a black iron-colored dog is invoked to
    have the eater eaten and the biter bitten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An ox or bull grows across named regions, a small man rises from the sea or
    wave and strikes it, and ointments and charmed remedies are obtained from it to
    heal burns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Porotytto, also identified with Sinisirkku, the Pohja girl, wife of Tapio,
    and Hiiletar, burns herself in cinders and sparks, then uses slush and ice from
    a Pohjola horse and sprinkles water with a golden cup and copper twig to cool
    burns and deprive fire of heat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A holy maid or woman appears on an eastern cloud and the rim of a rainbow,
    carrying a golden box under her arm and a golden wing in her hand, and uses the
    wing to wipe pain and salve fire injuries.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A tiny cloud contains a water-drop, the drop contains a little pond, and beside
    the pond stands a maiden carrying slush and ice with which she extinguishes Fire
    and cools burned places.
  category: sequence
  evidence_refs:
  - ev:8
