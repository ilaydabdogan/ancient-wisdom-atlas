  quote: "“I raise the girl’s Love-god, I exalt the girl’s Renown from sleeping underneath
    the ground”"
  summary: A set of Finnic love-exciting formulae asks why an unmarried girl has not
    attracted suitors, blames possible hostile agents or speech, and ritually raises
    or recovers her Love-god and Renown from hidden places so that suitors, bridal
    messengers, gifts, and desire may arrive. One version asks a wise woman why the
    speaker is not paired like trees, fish, birds, shoes, and fence stakes.
