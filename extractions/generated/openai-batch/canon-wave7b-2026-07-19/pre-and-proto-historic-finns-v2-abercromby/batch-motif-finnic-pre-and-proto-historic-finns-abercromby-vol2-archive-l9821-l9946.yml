canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes fiery weapons, aquatic
    powers, an eagle with armed men, river guardians for sea-otter trapping, Ukko
    or God for redirecting rain, Vainamoinen for curing disease, Jesus and the Creator
    for healing, and water beings who receive offerings for health.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fiery or sparkling sword in a sheath of fire is requested for the speaker's
    right hand to attack an evil one, a toad, and a Hiitolainen, and to stop a beastly
    creature's noise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sea, a Landlocked Lake, and a Dweller in the stream are asked to come
    with their people to remove plagues, undo spell-sent harm, and consume curses
    and incantations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An eagle in the northeast or Turjaland is described as having many armed men
    located under its wing, above its wing, at its tail, and on its feathers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eagle is summoned from the northeast or Lapland to save a head, preserve
    a life, and remove spell-wrought injuries and plagues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For trapping sea-otters, Christopher or Ristoppi, a river-chief, and Nokiatar
    or Jokiatar, a youthful girl watching over the river-herd, are invoked to drive
    otters from stony dens through a silver door and golden window.
  category: action
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:6
  text: The silver door and golden window are glossed in the note as referring to
    the trap.
  category: object
  evidence_refs:
  - ev:11
- id: obs:7
  text: The otter-guiding power is promised gold as old as the moon and silver as
    bright as the sun if it drives a full-grown, wave-colored otter through the trap.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: God and Ukko, god of the sky and lord of air, are asked to stop rain and wind
    and to conduct clouds and rainbows toward other regions where water is needed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stated reason for redirecting rain is that an old woman has borne a child
    and children there have not yet seen water and remain unbaptized.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Old Vainamoinen is called to arise from sleep and help a beloved son or famous
    man in a difficult task involving divining an origin and removing a great injury.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A sick man is described as lying groaning in bed with an unusual, unnamed
    disease while the floor rots underneath and the roof moulders overhead.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Vainamoinen is asked to use a bathing-switch and honeyed wing to sweep away
    fearful or holy sparks and plagues, lift disease to the sky, and send pains to
    wind, bad weather, the north, Lapland, or deep waves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Jesus, lord of air and God in the sky, is summoned to come when needed and
    to provide spittle or foam as ointment and remedy for the sick person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Creator, God, and Almighty are asked to repeat a charm, speak, heal, and
    make the sick man well by means of holy words and well-arranged formulas.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Pure water, water's mistress, and water's master are asked to restore health
    while the speaker offers blood and salt for appeasement and reconciliation.
  category: action
  evidence_refs:
  - ev:10
