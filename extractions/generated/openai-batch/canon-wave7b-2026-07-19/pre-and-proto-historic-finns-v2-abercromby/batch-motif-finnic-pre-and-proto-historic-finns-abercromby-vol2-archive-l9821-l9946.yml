- id: motif:5
  label: ritual exchange with helper powers
  taxonomy_refs:
  - sacred_exchange
  basis: The sea-otter formula promises gold and silver for guiding quarry, and the
    water-healing formula offers blood and salt to appease and reconcile water powers.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The first case is a promised reward and the second an offering; they are
    related by exchange logic but occur in different formulae.
- id: motif:6
  label: water as active healing, trapping, and spell-removing agency
  taxonomy_refs: []
  basis: Sea, lake, stream, river, and pure water powers are addressed as agents able
    to remove harm, drive otters, and restore health.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:10
  confidence: high
  cautions: The available motif-family taxonomy has no direct water-agency motif;
