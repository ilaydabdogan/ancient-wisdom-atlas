  quote: ''
  summary: The passage describes Kivutar, the old wife of sickness, carrying a fiery
    horn on the Hill of Pain and Mount Suffering; a spark falls and becomes inflammatory
    burns and sickness for humans. It then depicts the girl of Tuoni, Maid of Pain,
    suffering while collecting pains with stone gloves and boiling pains and sickness
    in iron vessels so no one receives hurt. A reproaching section questions who ordered
    the addressed being to perform harmful deeds of death.
