canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae addresses boils, sharp frost,
    reindeer-catching, and pleurisy. The speaker invokes named supernatural, heroic,
    Christian, smith, northern, and subterranean helpers; commands harmful forces
    away from human bodies; asks for protective warmth; requests the release of reindeer
    game; and treats pleurisy as arrows, needles, knives, or spears to be extracted
    and destroyed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boil or scab formula tells an addressed being to pluck evil scabs, take
    them to earth or swamps, and dissolve or cook the scab matter in the mouth or
    on the tongue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pullitar, called a red maiden, is invoked to twist a scarlet cord on her left
    knee so the speaker may bind roots while squeezing scabs and pressing boils.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old Vainamoinen is invoked to raise a paddle or sword from the sea and a shovel
    from the wave in order to smash scabs and thresh abscesses from a human body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sharp Frost is addressed as a son of Puhuri or variant names and is told not
    to freeze the speaker's nails, toes, head, ears, skin, or body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sharp Frost is ordered instead to freeze or bite fields, swamps, trees, hot
    stones, iron rocks, steel hills, rapids, and northern sea margins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Virgin Mary is asked to bring a fur or wool coat, place fire and coal into
    clothing, and bring a warm misty or rainbow-colored cloud covering; butter and
    fat are prescribed for frost-nipped spots if gangrene ensues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The reindeer formula says the reindeer originates in the North or Lapland
    and describes curved, rock-like antlers on its head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Crone of the North is asked to open an iron chest and bolt on the game
    and send game from northern or Lapland tracts to the hunter's path and traps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ukko is asked to drop pincers from a cloud into the speaker's right hand;
    the pincers have hafts of earthly worms and points of variegated snakes and are
    to lift sorcerer's arrows and bloody needles from a human body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ilmarinen is asked to make very small tongs or pincers to lift out Tempo's
    arrow and extract a bloody knife from a human body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The formula states that the afflicted man must not go to Mana or Tuonela in
    the context of being taken by disease or death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: An old crone below the earth and a boy from the field's deepest parts are
    asked to keep watch so Death and Disease do not consume or reap too much, and
    to lift or summon back harmful shafts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If no heed is paid, the subterranean helpers are asked to raise men or heroes
    from the earth to help and surround a lonely or beloved man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A blind crone of Pohjola or Vainola and an old northern man with stony nails
    and iron teeth are invoked to extract arrows, spears, shooting-irons, and jagged
    points from bare skin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The old northern man is asked to snap arrows, smash spears into pieces, and
    squash their points.
  category: action
  evidence_refs:
  - ev:8
