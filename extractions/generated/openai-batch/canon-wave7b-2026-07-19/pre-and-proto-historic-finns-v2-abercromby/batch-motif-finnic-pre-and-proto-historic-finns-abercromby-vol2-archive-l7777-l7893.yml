canonical_text:
  quote: ''
  summary: 'The supplied passage contains several Finnic magic-song formulae: a bridal
    journey charm invoking Ukko to protect the party and clear dangers; hare-catching
    charms invoking female forest powers to send game into traps; a charm against
    cabbage grubs invoking female figures and an iron-hook sentinel; and fishing charms
    invoking Ahti/Ahto to send fish into nets and toward music.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula describes hissing mouths, sorcerers beside the path, and
    envious people as a bridal party passes and a man is led to be betrothed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ukko is addressed as a high lord, a god ruling journeys and governing clouds,
    and is asked to come from the sky like fire or a burning brand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker asks Ukko to act not against the speaker or followers but against
    enemies, accidents, spell-cast injuries, impediments, criminals, sorcerers, a
    fiend, a spook, bad weather, and broken roads.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The travel contexts named include land travel, rowing on water, wandering
    on mountains, and moving over low ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Specific road obstructions named include someone standing across the path,
    a snake lying along the road, trees, fallen trees, and logs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The formula asks that the tree-placer become a tree and the log-maker become
    a log.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In a hare-catching formula, Elina, mistress of the forest, is asked to bring
    game from forest places, including the foot of a forest-fort, honeyed woods, and
    copper hills, toward the speaker's trap and snare.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another hare-catching formula, Lumikki, daughter of Tapio, is asked to
    release her creatures, called gold and silver, and to turn the animal toward the
    hunter, even pulling it by tail or ears if it leaves the track.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The game is repeatedly directed to avoid other people's snares or traps and
    to come to the speaker's gins or traps.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: Varvutar, Mikitar, and Annikki are addressed in a hare-catching formula and
    asked to give animals in numbered groups from forest dells, copses, abandoned
    fields, and juniper clumps.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the formula against cabbage grubs, Kulotar and Kanarvatar are asked to
    remove their dogs or curs from life-sustaining herbs and food-producing plants
    before Ukko harms them with drops from clouds and iron hail.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Maarana, called the witch-ball mother, is told to sit at the end of a blue
    bridge holding an iron hook and to make noise with the hook when the witch-ball
    comes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage note explains that the term translated witch-ball is used here
    as an epithet for the cabbage grub.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: In a fishing formula, Ahti or Ahto of the sea is asked to put on luck-bringing
    clothes and gift-giving shirts and to draw fish from underwater places and sandbanks
    toward music and Vainainoinen's melody.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: In another fishing formula, Ahti or Ahto is called master of the waves and
    ruler of a hundred caves, and is asked to give perch and drive fish with a long
    stake or pole toward the nets.
  category: speech
  evidence_refs:
  - ev:9
