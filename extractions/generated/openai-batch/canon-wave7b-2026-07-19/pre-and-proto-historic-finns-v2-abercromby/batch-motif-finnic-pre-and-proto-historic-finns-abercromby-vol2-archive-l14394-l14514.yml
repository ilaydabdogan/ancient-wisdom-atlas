canonical_text:
  quote: ''
  summary: 'A sequence of Finnish magic-song formulae describes the making and sourcing
    of healing salves: herbs and oak bark are boiled and tested on broken wood and
    stone; Juhannes prepares reliable salves; divine and celestial sources of ointment
    are invoked; milk from a woman on a cloud or bow becomes salve; a field-born maiden
    dies and a salve-bearing herb grows; Vuotar makes salves in Metsola; and a giant
    ox is slain by a small man rising from the sea. The passage ends mid-sentence
    after the ox episode begins to connect to ointments.'
  language: English
  quote_policy: summarized
