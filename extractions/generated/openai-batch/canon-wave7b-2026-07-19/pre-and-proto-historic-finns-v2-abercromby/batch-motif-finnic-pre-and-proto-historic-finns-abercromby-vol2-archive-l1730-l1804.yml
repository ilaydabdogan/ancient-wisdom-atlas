canonical_text:
  quote: The recitation of the story was itself sufficient for the purpose of banishing
    the evil
  summary: 'The passage analyzes recurrent structures in Finnish magic songs and related
    charm traditions: invocation of a helper, description of the origin or genealogy
    of a disease, recitation of an appropriate story as an exorcistic act, ordering
    a disease-spirit to depart to a place, offering inducements for departure, and
    invoking aid from animals, birds, trees, or stones. It also compares these structures
    with Esthonian, Mordvin, Lettish, Russian, Swedish, and Post-Classical charms.'
  language: English
  quote_policy: quoted
