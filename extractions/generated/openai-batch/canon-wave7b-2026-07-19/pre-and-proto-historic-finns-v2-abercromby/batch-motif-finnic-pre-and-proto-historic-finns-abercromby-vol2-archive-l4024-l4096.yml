canonical_text:
  quote: ''
  summary: 'A sequence of exorcism formulae commands an afflicting being, sickness,
    or pains to leave a human body and go to remote or unsuitable places: a bloody
    war-horse setting, the sky if sky-born, mountain clefts, northern snowy mountains,
    swamps, stones, deep water, a seal, or back to the wind that brought it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An addressed entity is directed to a gorge associated with an iron churn and
    war-horse or battle-foal hoofs, where blood and flesh are abundant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the addressed entity comes from the sky, it is commanded to mount back
    up into the sky and air, passing by the moon, sun, clouds, and stars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker conjures Tormentor or Nightmare into hills, firs, a copper hill
    or mountain peak, an iron mountain rift, and the space between rocks, where escape
    is denied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An addressed entity is sent to Norja mountain and Turja Fell, to a snowy northern
    mountain side where snow, rime, wind, and storm act on it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks where to exorcise pains and hurts from a human body and sends
    them to swamps, fields, wild clearings, gravel, and sand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the pains do not heed, the speaker says they will be forced into stony
    rocks and iron heaps of stone, to torment stones and flagstones that do not weep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker places pains inside a variegated stone or flagstone, breaks the
    stone, and rolls the pains into water below the deep sea waves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A kindly seal is described as bearing or floating the pains to the deep or
    open sea, or under dark mud and ancient dust, where they are to remain for an
    indefinitely long time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If sickness was brought by wind or dragged by water, the Wind and Chilly Blast
    are told to take back what they brought and carry the pain away in a cradle or
    under a wing.
  category: speech
  evidence_refs:
  - ev:7
