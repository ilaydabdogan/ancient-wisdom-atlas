canonical_text:
  quote: ''
  summary: 'A Finnic magic-song passage against inflammation commands anger or harmful
    power to become liquid, to consume its own malignity and pains, and then gives
    an expulsion formula: inherited words and knowledge of the origin remove needless
    harm from a human body. Hiisi, Satan, and an evil power are ordered to depart
    before dawn by road, horse, snow-skates, or boat toward the far north. The closing
    fragment describes violent shaking of castle structures, lakes, copper hills,
    atmosphere, earth, clouds, and sky.'
  language: English
  quote_policy: summarized
