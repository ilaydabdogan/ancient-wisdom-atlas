canonical_text:
  quote: ''
  summary: A Finnic magic-song formula and its variants describe primordial sowing,
    ploughing, and other generative acts through which trees and vegetation arise
    in particular places. The variants name different sowers or agents, including
    Sampsa/Pellervoinen, Semmer, divine figures, Kati, Tuoni’s son, a girl of Pohja,
    and a creature called kave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sampsa / boy Pellervoinen lies all summer on the hard ground in a cornfield
    and in a grain-filled barge before setting out to sow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The main sower places six grains and seven seeds in animal containers described
    as a martin’s skin and a summer-squirrel’s leg.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The main sower sows firm land, swamps, sandy clearings, stony places, hillocks,
    hills, valleys, humid dells, moist land, holy places, flooded land, meadow boundaries,
    sterile places, and river banks.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Different tree species are assigned to different locations, and the trees
    then begin to sprout and grow while moved by wind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Variants identify alternate sowing figures, including Pellervoinen/Sampsa,
    Ahti with boy Pellervoinen, Old Vainamoinen, the God of the air, Kunerva, Swamp’s
    maiden with Heather’s son, and Kyyni.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Semmer variant, Semmer sows land and various trees grow; the Creator
    then speaks from the sky and says that trees are made by God, grown by the Omnipotent,
    rocked or tended by wind, and affected by frost.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one variant, a wolf runs on ice, a pike swims below the ice, body fragments
    snap off, and fair Kati plants the wolf hair, after which a fir grows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In one variant, Tuoni’s red-cheeked son catches a pike with a seine or dragnet;
    the pike’s teeth fall on a meadow, and a swamp-fir or golden fir grows from them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In one variant, a swarthy-cheeked girl of Pohja ploughs swamps, land, and
    outlying rims; heather, willows, birches, firs, and pines then arise in different
    places.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In one variant, a creature called kave runs over swamps, land, and moist abandoned
    fields, sheds hair or wool, and trees arise from it.
  category: sequence
  evidence_refs:
  - ev:9
