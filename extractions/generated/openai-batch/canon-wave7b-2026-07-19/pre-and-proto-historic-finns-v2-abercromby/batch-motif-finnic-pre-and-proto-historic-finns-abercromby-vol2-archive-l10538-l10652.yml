canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes Ukko, Vesi-viitta, Virgin
    Mary, Jesus, Panu, Panutar, air-daughter-associated beings, Kunnotar, Karehetar,
    and forest powers. The speaker asks supernatural figures to enter, bind, quench,
    cool, put to sleep, or contain fire using water, ice, frost, snow, clothing, and
    vessels. The final formulae concern an offering or exchange involving gold and
    silver, addressed to named female figures and forest powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ukko is addressed as a sky figure and is asked to enter the fire and flame
    with water, to walk a fiery path, and to apply icy water and wind to burns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vesi-viitta is addressed as a mountain or rock-related figure and is asked
    to attach himself to glowing ash, cast himself into Panu, disable Fire/Panu, and
    bring cold water from a birch-root setting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker states that Fire or Panu has caused damage and committed an evil
    deed against God and the Blest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Virgin Mary is asked to go to Pohjola and a snowy mountain top, bring snow
    and ice, and quench or subdue the fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mary is also asked to put her shirt and copper belt into the flame and to
    give a blue silk scarf for use as a hand bandage to quench the fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A formula asks that raging fire fall asleep, that Mary make it sleep, that
    water stay awake, and that Jesus watch from above.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Panu is addressed as the son or offspring of solar female figures, associated
    with forge-fires, hearth, coals, ashes, sparks, embers, a stove, and a hearth-ring.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Panu is ordered to conceal or tether himself among coals, ashes, sparks, and
    embers, and the formula contrasts older Water staying awake with younger Fire
    falling asleep.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Panutar is asked to come when needed, quench a fire, reduce a flame, and put
    the fire into her furs, clothes, and rags so it will not burn or hurt a person.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nunnus or Munnus and Hdykenys are summoned and asked to bring frost and ice
    from the air, freeze the speaker’s fingertips, ice the speaker’s hands, and silence
    the fire’s crackling.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: In an offering formula, Kunnotar and Karehetar are invited away from melting
