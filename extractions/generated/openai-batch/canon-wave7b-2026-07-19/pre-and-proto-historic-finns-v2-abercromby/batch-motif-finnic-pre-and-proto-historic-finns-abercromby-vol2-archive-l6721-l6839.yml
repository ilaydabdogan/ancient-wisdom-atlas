canonical_text:
  quote: ''
  summary: The passage contains formulaic speech for obtaining milk and several hunting
    charms. The speaker calls milk from Mana, Tuonela, Manala, and beneath the earth,
    while avoiding hostile human attention. In the hunting charms, the speaker prepares
    to enter Metsola/Tapiola, changes clothing, masks human scent with fir and juniper,
    readies weapons, skates, and dogs, sings to forest maidens, invokes snow from
    Ukko and Palvonen, praises hunting implements, laments poor hunting luck, and
    petitions the Creator or giver of game with claims of proper conduct, labor, offerings,
    and prayers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula says the speaker's mother obtained milk from Mana and
    other named or social sources, amid references to villagers, jealous persons,
    sorcerers, hags, and district malice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says they do not ask advice from villagers and make milk come
    from Tuonela, Manala, and beneath the earth, arriving at night and in darkness
    without being noticed or harmed by hostile people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker directs a herding-horn toward the sky and a pipe toward the clouds
    while bringing milk from that land and from the villagers' grasp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the hunting charm, the speaker intends to go to Metsola, Havu-linna, the
    side of the forest girls, and the courtyards of the woodland maids to drink forest
    mead and taste woodland honey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Before entering the forest, the speaker removes working clothes, puts on other
    clothing, and brushes and combs the head with fir and juniper so that no human
    smell or breath escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker readies bow, spear, skates, and staves, takes a dog, skates into
    the forest, and sings songs at a copse and in the forest depths to amuse the forest
    girls and maidens.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ukko is said to have rained fresh snow, and Palvonen to have cast down fine
    white snow, on which the speaker leaves other men and starts hunting on untracked
    ground.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker addresses skates, spear, and bow, describing the skate as of the
    family of foot, the spear as of the race of axe, and the bow as kin to a hand.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The speaker takes three or five dogs and describes them with enlarged or
    sharpened features: large eyes, large ears, sharp teeth, and thick tails.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker asks what change has come over Metsola, saying a forest maiden
    formerly enriched the hunting tract with game but now the forest is angry, the
    wilderness is upside down, and gold and silver are not valued.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker questions why the Creator or giver of game is angry and not giving,
    even though that power fed the tribe, race, and first ancestor.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker compares their bad luck with Kauko and brothers, then asks the
    Gift-giving Maker and faithful God why no gift or promise is given when the speaker
    beseeches, propitiates, and conciliates.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker denies worshipping stones or hunting on holy days, contrasts their
    conduct with fraudulent hunters, and claims to hunt by labor, offerings, and prayers.
  category: speech
  evidence_refs:
  - ev:13
