canonical_text:
  quote: ''
  summary: 'The passage concludes an origin account for ale, in which birds, personified
    beer, and a cat speak about the drink and its name. It then gives three variant
    origin accounts for Sharp Frost: one has Frost born in cold natural settings and
    suckled by a snake; another has Raani of Pohja conceive by wind and dawn and name
    three sons; a third has Hiisi-folk create Frost from horse blood vapour, after
    which Frost is nursed, baptized, named Kuljus, taken to heaven, thrown into a
    spring, and later released to harm leaves, grass, and men.'
  language: English
  quote_policy: summarized
