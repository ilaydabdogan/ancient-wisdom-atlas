canonical_text:
  quote: ''
  summary: 'The passage begins with a fishing charm that calls perch and pike to the
    speaker’s hook and contrasts the speaker’s honey-like fishing gear and bait with
    other people’s inferior bait. Two notes describe a sapling noose trap and Hiisi
    as a former forest spirit who aids hunters. The passage then gives charms against
    bears: the bear is addressed with euphemistic names, warned not to harm cattle,
    reminded of an ancient oath at the river of Tuonela before the Creator, directed
    to avoid cattle and their sounds, described through wool imagery that neutralizes
    claws, teeth, and malice, and invited into an eternal peace or treaty with shared
    land but separate subsistence.'
  language: English
  quote_policy: summarized
