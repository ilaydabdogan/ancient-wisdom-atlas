canonical_text:
  quote: Black worm that liveth underground... I know thine origin with all thy bringing
    up
  summary: The passage gives several formulaic accounts of the origin and making of
    a harmful worm, snake, or viper. These include creation from Syojatar’s spittle
    after it is carried by water, birth from the Daughter of Pain after wind impregnation,
    emergence from a reed blown down by a fiend, formation from blood produced during
    spinning by Tuoni’s old wife, and assembly from many named hostile substances.
    The closing section begins an origin account of flax involving burnt land, an
    unburnt spot beneath a triple-rooted birch, a flax seed, a burned boat, ash, rapid
    growth, and the Sotkotar sisters finding Tuoni’s grub.
  language: English
  quote_policy: quoted
