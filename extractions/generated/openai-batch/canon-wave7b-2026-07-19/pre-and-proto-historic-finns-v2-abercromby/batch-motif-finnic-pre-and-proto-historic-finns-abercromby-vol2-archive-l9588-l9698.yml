canonical_text:
  quote: ''
  summary: 'English translation of Finnic magic-song formulae: an eagle is summoned
    to remove a bloody arrow or needle from a wounded person; named beings are ordered
    to take back or redirect their arrows, darts, stings, and spears; a gun is magically
    blocked, wetted, or made to misfire; and Ukko is invoked for tools, snow, honeyed
    wood, and concealment in setting traps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An eagle is said to dwell in Turjaland or Lapland, with serviceable claws,
    five talons like reaping-hooks, a fiery mouth, a flaming throat, and eyes at the
    ends of wings or feathers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker summons the eagle to strike a stone and hostile spear or arrow
    parts, and to carry a bloody arrow or pointed needle out of a roaring or moaning
    full-grown man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lempo, Piru or Pirn, and a limping fellow are ordered to take back their shafts,
    arrows, and darts, and to remove bloody needles and stings said to have been made
    from fragments of an evil oak or brittle tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Keito and Piru are told to launch or cast spears and pikes on battle-fields
    and into the throat or mouth of a raven or crow, so that the birds carry them
    away to the sender’s family, birthplace, and kin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hiisi, a devil’s son, Aijo’s son, and Lempo are addressed in a command to
    remove stings, goads, darts, and leaf-shaped spears from a human being’s skin
    or a woman’s son’s body before sunrise or the morning star.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The projectiles are redirected or blunted in bear bones, Bruin’s throat, the
    home of bears, or, if needed, into the mother, nurturer, or begetter of the addressed
    being rather than into human skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the gun spell, a boy or child from Pohjola and the land of Lapps is summoned
    to press his hand, thumb, and finger into the throat or mouth of the gun so that
    lead will not hit a man and the tin ball will not be discharged.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the boy from Pohjola cannot deaden the lead or block the fiery mouth, God
    the father and Jesus, lord of air, are invoked to stop balls by watery, slushy,
    mildew, water, and grease coverings that prevent the hammer from striking fire
    and the touch-hole from flashing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a strange bloodthirsty dog discharges a leaden ball, the ball is directed
    into that being’s tail or hind-quarters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hide of an elk from Hiisi’s land is asked to take possession of the hostile
    gun, twist its touch-hole pan, shorten the lead, and smash its egg so that it
    does not hurt the speaker.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the trap-setting formula, Ukko is asked for an axe or silver hatchet; the
    speaker says he will cut a honeyed aspen from a honeyed or golden mound, orient
    its trunk and branches, and call honey or juice to fall into its bark and heart.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ukko is asked to cause fresh snow to fall on slippery ice and heath so that
    the speaker’s tracks are unseen and breath gives no smell; if tracks or scent
    remain, they are to be like a hare’s track and forest fir scent.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A switch from a thicket and from three birch-trees is to be used while roaming
    through scrub and shaking groves, in order to drive a lazy one toward the speaker’s
    trap places while avoiding other people’s snares.
  category: action
  evidence_refs:
  - ev:10
