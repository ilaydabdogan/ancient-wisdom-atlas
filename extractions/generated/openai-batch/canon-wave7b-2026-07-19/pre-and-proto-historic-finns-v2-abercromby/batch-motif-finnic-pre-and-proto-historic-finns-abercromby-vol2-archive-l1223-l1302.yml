canonical_text:
  quote: ''
  summary: The passage gives numbered Lettish charms for protection, evil, and cows'
    milk, followed by the opening of a Great Russian love-spell. The charms use images
    of black figures and animals, iron beings or barriers, child-guarding animals,
    banishment of evils to the sea, milk-restoring water and pail imagery, boundary
    watchers against witches, Christian invocations, and a love-spell journey to a
    sea-ocean island where seventy-seven brothers forge arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One charm depicts a black man walking in the street with a black cat and then
    states that the figure was the merciful God himself, followed by an appeal to
    Lord Jesus Christ.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A black man and a black horse stand in a willow thicket; the man has iron
    garments, and then the man, horse, and thicket vanish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tiny dog runs day and night, barking and protecting the speaker's cradle
    and child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another child-protection charm lists table and room corners, three magpies,
    three black whelps, and three black kittens watching the speaker's little child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage labels a group of charms as being against all sorts of evil.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:6
  text: An iron pig is said to have crept into a hay-cock; iron men are commanded
    to take iron forks and cast it out, and Jesus and his Mother are invoked for protection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A charm commands a harmful force to go to the sea and gnaw white flint stones
    rather than the speaker's body, while evils are wished to vanish and health to
    shine like the sun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A black cock sits on a willow bush; the mother of the devil comes with weapons
    and is described as being shot down and disappearing, while hewing is redirected
    to pine and fir rather than oak.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a charm for bewitched milk, black men are described mowing hay on an island
    in the sea, wearing pitchy caps and coats of plaited withes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A milk charm connects a hen with nine chicks, kind Mara with nine milk-pails,
    and three springs flowing into the sea and then into the udders of the speaker's
    cows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A one-armed fellow is told to stand at the cross-way and watch for witches
    and sorceresses who pass or run by.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A witch is ordered to fly obliquely through the air and not enter the farmyard,
    which is described as reinforced with iron, scythes, and needles.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the love-spell, the servant of God says he will go from door to door and
    from the door to the gate, then to the eastern side of the sea-ocean, where an
    island, a post, and seventy-seven brothers are found.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The love-spell speaker asks the seventy-seven brothers for the hottest and
    lightest arrow and says he will shoot it at a named girl in specific parts of
    her body so that she will lament.
  category: speech
  evidence_refs:
  - ev:11
