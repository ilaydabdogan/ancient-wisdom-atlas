canonical_text:
  quote: ''
  summary: A sequence of Mordvin charm texts describes ritual speech and images used
    against burns, frost-bite, worms, snake-bite, rheumatism, imprecation, and colic.
    The charms include color-marked figures, addressed plants and snakes, expulsion
    or separation of illness, impossible counting conditions for curses, and illness
    removal by blowing or spitting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening fragment says a blind fellow went into water and a breathless fellow
    blew up fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A black girl is located on the hearth and is described as wearing black items
    of clothing from head to feet.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tokhantoyitsa, called the black girl, carries wood and running water, mitigates
    burns, blows burns away, and the patient is said to be burnt only when cold water
    boils by itself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a charm labeled against frost-bite, a white old man is located on a dust-heap
    and is described as wearing white clothing and footwear.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a charm labeled against worms, the speaker addresses the Tatar plant or
    thunder-nettle, says Sergei’s cow has worms, and threatens to tear and dry the
    plant’s roots if the worms are not removed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a charm labeled against snake-bite, a great noxious snake is asked why
    it bit an animal, and answers that the old snake sent it to devour the animal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a charm against rheumatism, the illness is to be separated from many named
    body parts and tissues, while Niske-pas is asked for help; Niske-pas drives away
    and Vere-pas separates.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a charm against imprecation, the speaker heals curses by blowing and describes
    a large hill with an apple-tree whose roots stretch around the earth, with the
    curse to hold only when apple cores and roots are counted.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same imprecation charm describes a large field with a well whose water
    appears like silver and gold, with the imprecation to hold only when the sand
    and dregs are gathered, counted, and returned.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In a charm against gripes or colic, the speaker dashes and cuts the ailment
    to pieces, while named figures and seven wizards are described as blowing and
    telling the speaker to blow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The colic charm says the speaker blows and spits with the others’ favor, and
    that a great old woman has come from the other side of the great water and blown
    the illness away.
  category: action
  evidence_refs:
  - ev:9
