canonical_text:
  quote: ''
  summary: 'The passage contains English-translated Finnic healing charms and notes:
    an exorcistic identification of an addressed being by origin and hue; charms for
    gout or heartburn, cutting off excrescences, contusions or lesions, hiccough,
    and sprains; and a note about the wood-grouse. Named figures include Ukko, the
    Creator, Lempo or the Evil One, an aged man from Turja or Pimentola, the Virgin
    Mary, Jesus, a horse, and a wood-grouse. Recurrent materials include fire, a sky-forged
    knife, honey, veins, blood, flesh, bone, threads, trees, and a bridge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the addressed being's origin has been stated and asks to
    see its hue and outward shape, listing many possible colors and demonic hues.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gout is addressed directly as good, lovely, and Mary's sweet gout, and is
    commanded to depart and turn back elsewhere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ukko strikes fire on tin into alder chips, and the speaker says the gout was
    blown from a sufferer's skin into those chips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A knife falls from the clouds or sky, is described as sky-forged with silver
    blade and golden haft, and is used to cut away excrescences and uproot roots.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says the treatment will be brief and gentle, touching with river
    horse-tail, water-sedge, and rush, and naming the removal as caused by wind, chilly
    blast, or raging storm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Where the knife or iron blade makes a wound, honey and honeyed salve are requested
    to fall or stream into the wound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If iron acts amiss or Lempo causes the knife to slip, Lempo or the Evil One
    is threatened with being cut by a blade and iron he made himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: An aged man from Turja or Pimentola carries veins, blood, flesh, and bone,
    makes himself into a wizard or healer, and joins flesh, bone, veins, and blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Virgin Mary carries veins, blood, bone, and flesh along the sky boundary,
    repairs injured veins, blood, bones, and flesh, and blesses the spot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Hiccough is commanded to go to a clump of limes or birch, with a note that
    the charm is repeated until the hiccough ceases.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Jesus goes toward church and Mary toward mass in the morning; Jesus rides
    a varicolored horse over swamp, land, waste clearings, heath, field-edge, sandy
    path, and toward a bridge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: At a bridge or foot-bridge, a wood-grouse starts up, the earth quakes, Jesus'
    heart throbs, and the horse's foot or leg is injured.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A note says the Finns believed the wood-grouse was formerly enormous; the
    Saviour cursed it to grow smaller until it could pass through a ring, at which
    point the end of the world would come.
  category: other
  evidence_refs:
  - ev:12
- id: obs:14
  text: Jesus dismounts, inspects and repairs the sprain, joins bone to bone and joint
    to joint, uses a red thread for blood and a blue thread for veins, and blesses
    the place.
  category: action
  evidence_refs:
  - ev:13
