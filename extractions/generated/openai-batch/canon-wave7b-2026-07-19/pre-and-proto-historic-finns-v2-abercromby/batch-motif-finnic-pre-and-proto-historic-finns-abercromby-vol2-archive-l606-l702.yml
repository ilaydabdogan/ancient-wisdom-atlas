canonical_text:
  quote: ''
  summary: 'The passage gives Votiak charms concerning evil glance, attraction or
    turning of a person, farmyard damage, a counter-spell, protection against incendiary
    fires, bleeding, swellings, and stomach-ache. The formulas often use analogy or
    conditional impossibility: harm or illness is permitted only when unlikely or
    impossible events occur, such as an anchor at the sea bottom catching fire, blood
    flowing from a knife edge, or a ladder being made to heaven in a minute.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A green or black eye is said to throw an evil glance; if such a glance can
    dry fir needles or strike the moon, it is invoked to affect a man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moon is described as rolling away from its mother and returning to her;
    this movement is used as a model for a man turning to the speaker.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The touching of fir needles and the turning of a head toward the Emperor are
    used as models for a person meeting or turning toward the speaker.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: For damaging a farmyard, the practitioner spits on a kopek and on a piece
    of silver money, throws them into the enemy farmyard, and utters a constricting
    formula.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The counter-spell says farmyard damage may occur only when the incanted kopek
    can be made into a plough and used to produce enough grain to fill the stomach.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Against incendiary fires, the charm makes fire damage contingent on setting
    fire to submerged or watery things, burning the world into ashes, and restoring
    it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Against bleeding, the charm makes human bleeding contingent on blood flowing
    from broken edges of knives made of gold, silver, copper, and steel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Against swellings, the charm names swelling on a snake's sting, a young sheep's
    horn, a lizard, and a wasp, and commands the swelling to retire along the three
    roads by which it came.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another swelling charm makes swelling contingent on making a gold, silver,
    or copper ladder and climbing to heaven in one minute.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Against stomach-ache, the charm makes a person's stomach-ache contingent on
