canonical_text:
  quote: ''
  summary: A great oak grows so high that it interferes with clouds, sun, moon, and
    earth. People seek someone to fell it. A small swarthy man rises from the sea
    with an axe and cuts down the oak in three strokes, producing fire and scattering
    chips. The felled tree forms a bridge toward Pohjola. One chip is carried by sea
    to a Hiisi bay, retrieved by Hiisi's iron-toothed dog, handled by Hiisi's girl,
    and then taken by an evil figure who makes disease-causing arrows from it.
  language: English
  quote_policy: summarized
