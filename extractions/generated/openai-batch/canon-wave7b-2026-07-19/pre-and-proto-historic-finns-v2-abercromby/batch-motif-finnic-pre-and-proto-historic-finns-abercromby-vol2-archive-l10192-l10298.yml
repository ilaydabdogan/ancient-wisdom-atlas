canonical_text:
  quote: free the lass from childbirth pains, bring into the world a traveller
  summary: A sequence of Finnic magic-song formulae invokes Ukko, Kave, Porotytto,
    Vainamoinen, Hiisi, and celestial bodies to relieve childbirth, open bodily gates,
    supply liquids or tools, and guide the child into daylight. A following house-setting
    formula petitions Mary and Peter for land, household space, woodland goods, gold,
    honey, and abundance.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker calls on Ukko, described as a high god and ancient sky-father,
    to come to a vapour-bath where a distressed woman cries at the bath-house threshold.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks Ukko to bring pure water, sleet-colored liquid, luscious
    juice, and honey, with part blown into the speaker's mouth and part made into
    salves for anointing and opening the birth passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kave is addressed as an old wife, Nature's daughter, and golden beautiful
    one who formerly allayed pain and freed the moon from a cell and the sun from
    a rock.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kave is asked to free the woman from childbirth pains and bring the babe,
    boy, or girl from the womb into the world of mankind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Porotytto, the Northern girl, is instructed to take a knapsack and sack, go
    into the sea, call to fish, and obtain spittle or slimy stuff for anointing the
    woman and relieving childbirth pains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vainamoinen is addressed as an old diviner and asked to bring a scythe from
    Esthonia and a hay-hook from Hell for stroking the woman, separating her legs,
    and sending forth a traveller to daylight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hiisi is summoned from Hiitola with a golden sleigh and golden axe to break
    obstacles, open the Maker's slit and water gate, and separate the woman's thighs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Moon, Sun, and Great Bear are addressed to set free, release, and lead
    a human child from unfamiliar doors, unknown gates, small nests, and a cramped
    abode to earth, daylight, moon, sun, Great Bear, and stars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the house-setting formula, the speaker asks Mary for land and Peter for
    an inheritance, specifically a small piece of ground sufficient for a floor, body,
    play, dancing, running, and rolling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The house-setting formula asks that wild animals, goods of the woods and land,
    gold beneath the centre beam and roof, and honey or luscious juice in the timbers
    and wall site be brought to the ground.
  category: object
  evidence_refs:
  - ev:7
