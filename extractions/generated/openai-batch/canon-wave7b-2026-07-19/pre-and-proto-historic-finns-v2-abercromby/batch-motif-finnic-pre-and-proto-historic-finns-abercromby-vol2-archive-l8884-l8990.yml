canonical_text:
  quote: ''
  summary: A group of Finnic hunting formulae asks Forest, Backwoods, Tapio, Mielikki,
    and other forest or celestial beings to be favorable to hunters and dogs, accept
    offerings, guide the hunter along marked paths to game-rich places, and adorn
    or enliven the forest and its trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks Forest, Wilderness, the air of the gods, Tapio, and a Mistress
    to be kind or well disposed and to guide a fellow to a wooded isle or knoll where
    quarry can be obtained.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuutar and Paivatar are asked to bake a suet cake and a honeyed bannock, which
    the speaker says he will use to make the Forest and Backwoods well disposed on
    hunting days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks Forest and Backwoods to be kind to his men and dogs, while
    describing the men, archers, dogs, bows, and arrows as weak, young, uncertain,
    or ineffective.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The forest, backwoods, swamp-sides, and abandoned fields are associated with
    smells of honey, mead, melted butter, and wort; the cuckoo and zither are invoked
    so that the game called gold and silver will pay attention.
  category: object
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:5
  text: Grove, Wilderness, and Backwoods are asked to be friendly and to be appeased
    by peace-offerings or inducements, which are said also to have appeased the Creator
    and Omnipotent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker asks that his men be married or introduced to the pleasant daughters
    of the woods, described also as downy-breasted chicks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man of the forest, forest king, Mielikki, and Miiritar are addressed
    and asked to ascend trees to listen to the speaker’s songs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The forest and trees are described as being armed, clothed, and adorned with
    a sword, glaive, homespun cloth, German linen, coats, silver, gold, flowers, and
    copper or silver belts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker recalls entering the forest and backwoods, ascending to the wilderness
    and a mountain top, and seeing trees adorned with silver or gold and shining like
    the moon or sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Named forest beings and Nyyrikki are asked to show the path, open the door,
    set up posts and landmarks, cut marks, and guide a slow or ignorant man across
    morasses, firm land, and the backwoods of Pohjola to game-rich places.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: A note in the passage glosses the quoted words gold and silver as wild animals,
    birds, or game of any kind.
  category: other
  evidence_refs:
  - ev:9
