canonical_text:
  quote: ''
  summary: The passage gives a series of Finnic magic-song origin formulae for tooth
    affliction, Tuoni’s grub, pike, horse, elk, ague, seal, man, cabbage worm, and
    bear, identifying their materials, places, agents, movements, and ritual naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Syojatar, also called Rakehetar and the old mother of iron, pounds iron grains
    and steel points in an alderwood setting and eats the sifted material; stray bits
    lodge in the teeth and gums and cause tooth and jaw harm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small man rises from the sea with an axe and billhook, strikes a large tree,
    gets a chip stuck on the axe and then in his mouth, after which tooth pain and
    jaw stench occur and a tooth-harming being is born.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fox carries off and gnaws a bone between rocks and along five mountain slopes;
    from this the worm, Tuoni’s grub, is bred and spreads on jaws and teeth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the pike origin, flax is sown and grown, wind threshes and carries it to
    the eddy of a holy stream, water stretches it, and a pike or water-monster arises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The horse is said to originate from Hiisi and the mountain, in a room with
    a door of fire and a smithy with an iron ridge; its body parts are made of stone,
    rock, iron, and steel.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The elk is said to originate on a windy marsh in bird-cherry and willow growth;
    its body is made from birch, stakes, ash root, rotten wood, and horse-tail grass.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ague is described as rocked by wind, put to sleep by chilly air, brought by
    wind, drawn by water, conveyed by hard weather, and arriving in storm and chilly-blast
    tracks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A fellow rises from the sea, counts sea isles, and watches fish; oil-filled
    flowers or cups in his hand coagulate into seals, and the seal is commanded away
    into sea mud, blue clay, and a dragon’s throat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Man is described as made from a clod of earth and a cake of mould, while the
    Lord or Creator gives breath and life from his mouth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The cabbage worm is addressed as a black worm whose father, mother, sisters,
    and other relations are blue butterflies; its birth is associated with rustling
    and buzzing in turf and a dell, then movement into grass and hay.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The bear, called broad-forehead and honey-paws, is said to be born close to
    the moon, beside the sun, and on the shoulders of Charles’s Wain, then let down
    to earth into the woods.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Sinisirkku rocks the bear in a golden cradle with silver straps under conifers;
    the king of Himmerkki christens or baptizes the bear, and the Virgin Mary acts
    as godmother and carries him to the christening.
  category: sequence
  evidence_refs:
  - ev:11
