  locator: lines 11513-11520, opening formula before §186
  quote_or_summary: Syojatar/Rakehetar, old mother of iron, pounds iron grains and
    steel points on an iron rock in an alderwood room with alderwood tools, eats the
    groats, and stray bits lodge in teeth and gums, causing tooth and jaw harm.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:2
  type: summary
  locator: lines 11522-11534, formula beginning 'From the sea a wee man rose'
  quote_or_summary: A small man rises from the sea with an axe and billhook, strikes
    an oak or gigantic tree, has a chip stick to the axe and then in his mouth, experiences
    tooth pain and jaw stench, and from this the great eater or evil hacker of teeth
    is born.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:3
  type: summary
  locator: lines 11536-11541, fox and bone formula before §186
  quote_or_summary: A fox carries off and gnaws a bit of bone between two rocks and
    along five mountain slopes; from this a worm is bred, called Tuoni’s grub, which
    spreads upon the jaws and teeth.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:4
  type: summary
  locator: "§186, The Origin of the Pike, within lines 11513-11638"
  quote_or_summary: Liipo or Liito sows flax at night, Kauko grows it by day, wind
    threshes and carries the flax to the eddy of a holy stream, water stretches it,
    and a pike or water-monster arises.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: "§187, The Origin of the Horse, within lines 11513-11638"
  quote_or_summary: The horse originates from Hiisi and the mountain in a room with
    a door of fire and a smithy with an iron ridge; its head is stone, hoofs rock,
    legs iron, and back steel.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: "§188, The Origin of the Elk, within lines 11513-11638"
  quote_or_summary: The elk, son of Kari, originates on a windy marsh in dense bird-cherry
    and willow growth; its body is made from birch, railing stakes, ash root, rotten
    wood, and horse-tail grass.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: "§189, The Origin of Ague, within lines 11513-11638"
  quote_or_summary: 'Ague’s genesis is said to be known: it is rocked by wind, put
    to sleep by chilly air, brought by wind, drawn by water, conveyed by hard weather,
    and comes in storm whirlwinds and chilly-blast tracks against sufferers.'
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: "§190, The Origin of the Seal, within lines 11513-11638"
  quote_or_summary: A fellow rises from the sea, counts islands and watches fish,
    holding six flowers or cups with train-oil that coagulate into seals; the seal
    is then commanded into the sea’s black mud, blue clay, and a dragon’s throat.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: "§191, The Origin of Man, within lines 11513-11638"
  quote_or_summary: Man is described as made from a clod of earth and a cake of mould;
    the Lord gives breath and the Creator forms life for him from his mouth.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: "§192, The Origin of the Cabbage Worm, within lines 11513-11638"
  quote_or_summary: The black cabbage worm’s father, mother, sisters, other relation,
    and own identified form are blue butterflies; at first birth there is rustling
    in turf and buzzing at a dell before it moves into withered grass and hay tufts.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: "§193, The Origin of the Bear, within lines 11513-11638"
  quote_or_summary: The bear is born close to the moon, beside the sun, on Charles’s
    Wain, let down to earth into woods, rocked by Sinisirkku in a golden cradle with
    silver straps under fir and pine, baptized near fiery rapids or a holy stream
    by the king of Himmerkki, with the Virgin Mary as godmother and carrier, and receives
    several names.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:12
  type: quote
  locator: footnote to §193, The Origin of the Bear, within lines 11513-11638
  quote_or_summary: '"The Voguls also say the bear was let down from the sky in a
    silver cradle"'
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
