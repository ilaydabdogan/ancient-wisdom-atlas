comparison_claims:
- id: claim:1
  claim: 'Several charms in the passage share the same functional pattern: a harmful
    entity, disease, or object is addressed as an agent and controlled through threats,
    origin knowledge, or return commands.'
  claim_level: same_function
  target: intra-passage exorcistic address-and-expulsion pattern
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:10
  - ev:11
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: This is only an intra-passage functional comparison; it does not claim
    historical contact or external parallels.
- id: claim:2
  claim: The tooth-affliction charm and whooping-cough charm both use fire or coals
    as places connected with the affliction’s punishment, disposal, or return.
  claim_level: same_function
  target: fire as exorcistic medium within adjacent charms
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The functions differ: one section threatens burning punishment, while
    another commands return to fire if that is the disease’s source.'
- id: claim:3
  claim: The Kalma charm and the whooping-cough charm both redirect an affliction
    away from the patient toward an origin-place or responsible source.
  claim_level: same_function
  target: return-to-origin or return-to-sender exorcism pattern
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: Kalma’s possible sender is conditional, and whooping-cough’s origin
    is also framed conditionally.
