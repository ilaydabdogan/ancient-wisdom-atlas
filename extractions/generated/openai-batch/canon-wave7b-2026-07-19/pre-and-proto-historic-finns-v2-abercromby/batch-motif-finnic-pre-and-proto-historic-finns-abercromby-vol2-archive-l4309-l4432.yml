canonical_text:
  quote: ''
  summary: The passage presents several Finnic magic-song exorcisms and healing charms.
    An old man rises restored; a gnawing demonic affliction is insulted, extracted,
    threatened with weapons, stones, fire, and forge; Hiisi is attacked by a metal-hoofed
    mare; whooping-cough is ordered back to its source; Kalma is sent to the graveyard
    or to its sender; an aerial maiden supplies sinews, skin, and salves for wounds;
    and a stone is personified and reminded of its origin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man rises from sleep and is able to stand upright as before.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hostile being is addressed with demonic and canine insults and is accused
    of sending things called beans and peas to eat, gnaw, fret, bite, and injure jaws
    and teeth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he has tiny tongs or pincers with which he draws out Tuoni’s
    grub and kills the worm of Manala from tree, bone, and human skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker threatens the gnawing being with a willow bow and alderwood shaft
    if it does not stop tearing and grubbing in.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker threatens to use stones from Kimmola’s hill or mountain slope
    to grind, pound, thresh, and split the hostile being’s lips, head, and teeth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker threatens to use a sleigh of various logs to set the hostile being’s
    house and straw bed on fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hostile being is threatened with coals beneath Ilmarinen’s forge, smith’s
    pincers, agonising fire, Hiitola’s fire, evil flames, and iron cooking pans.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: A mare reared in Karjala, with iron hoofs and copper claws, is commanded to
    knock Hiisi down so that he stops injuring a Christian man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Whooping-cough is addressed as a disease of children; if it came from Hiisi’s
    bin, Hiisi’s coals, or fire, it is commanded to return there and leave an innocent
    child.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: The speaker says the protected child will not go to Mana or Tuonela.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kalma is addressed, and the speaker claims to know Kalma’s lineage and birth.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kalma is told to go to a graveyard and huts of the departed if generated from
    the stock of Eve and Adam, or to return to the sender’s cottage if sent as someone’s
    arrow.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: A maiden lives in the air on the edge of a little cloud, holding a skein of
    sinews and a roll of skin.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: The sinews and skin fall to earth through wind associated with the mountain
    top, wooded wilderness, and leafy groves, and they provide materials and remedies
    for wolf and bear wounds.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A stone is addressed as Kimmo Kammo’s son, egg of the earth, field clod, and
    offspring of deep rapids, and is asked why it raised its beak or snout against
    human skin.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: The stone is told to remember its ancient state and origin from the earth,
    sky, cloud, or from the foot or sole of God or Jesus.
  category: speech
  evidence_refs:
  - ev:14
