- id: motif:2
  label: Magical knowledge of origin or lineage
  taxonomy_refs:
  - wisdom
  basis: The speaker claims to know Kalma’s lineage and birth, commands whooping-cough
    according to possible origins, and tells the stone to remember its ancient origin.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:14
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage supports ritual
    knowledge of origins rather than philosophical wisdom.
- id: motif:3
  label: Affliction returned to its source or sender
  taxonomy_refs:
  - return
  basis: Whooping-cough is ordered to return to Hiisi’s bin, coals, or fire; Kalma
    is sent to a graveyard or back to the sender if it was sent as an arrow.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy family return is applied cautiously to an exorcistic return
    command, not to a hero-return narrative.
- id: motif:4
  label: Fire as punishment or disposal medium for affliction
  taxonomy_refs: []
  basis: The gnawing being is threatened with a burning house, forge coals, Hiitola’s
