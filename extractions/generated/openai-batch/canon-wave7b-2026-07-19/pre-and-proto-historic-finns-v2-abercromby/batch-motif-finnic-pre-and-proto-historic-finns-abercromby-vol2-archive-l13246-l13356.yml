canonical_text:
  quote: ''
  summary: 'The passage gives several origin formulae. Iron is said to arise from
    a burnt survivor’s scrapings in an unfrozen pool, from fish spawn that produces
    maidens who make iron before God and Ilmarinen complete the forging, and from
    swamp plants or genealogical parents linked to springs and swamps. A variant has
    Jesus producing maidens by rubbing his hands. The passage then gives an origin
    of Rickets/Atrophy: a maiden is coerced and impregnated by a giant or sea monster,
    gives birth to the disease-child Rickets, and the child is baptized at a shore
    or water-girt stone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A destructive summer conflagration burns much land and swamp, while a small
    unburnt place remains on a wild mountain top on the largest swamp.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One partly burned man runs to an unfrozen pool, scrapes off soot and scabby
    crust, and iron ore or black mire is produced there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A gold fish and salmon spawn or plunge in an unfrozen pool and bubbling spring,
    and maidens or brides are bred from the fish material to be mothers of iron ore
    and breeders of steel.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maidens make iron and form steel by pulverizing iron seeds and pounding
    lumps of steel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: God or a god arrives where the iron pieces lie and carries them to a smithy,
    specifically to Ilmarinen’s forge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ilmarinen puts the material into fire and forge, moves it to the anvil, and
    hammers it while forging iron and making steel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a variant, Jesus rubs and grinds together his palms, after which maidens
    or Luonnotars are born.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Iron is directly addressed as a personified being whose origin and genesis
    are known, and it is assigned named parents or kin from fountains, springs, and
    swamps.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rust-coloured sedge and purple melic grass grow in a swamp or pool and are
    rocked or swung by named female figures.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Holma, described in relation to Tuonela and Manala, comes from under the earth,
    finds the swamp plants, and carries them to Ilmarinen’s forge to be made into
    iron and steel tools.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A maiden rises from a dell, the sea, or a clump of grass, is described as
    lovely, and pays no regard to suitors.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A giant or shirted sea monster puts a nightmare or sleep on the unwilling
    maiden, lies with her, makes her pregnant, and leaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Creator, with Jesus given as a variant, speaks from the sky and tells
    the suffering pregnant maiden to give birth in a gloomy wood or wilderness recess.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The maiden goes toward the homes of dogs and woolly whelps and gives birth
    to a son identified as the Rickets boy, who gnaws the navel root and eats the
    backbone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: People seek someone to christen or baptize Rickets; no baptizer is found in
    the named places, but Rickets is nevertheless baptized on a shore or water-girt
    stone touched by waves.
  category: sequence
  evidence_refs:
  - ev:9
