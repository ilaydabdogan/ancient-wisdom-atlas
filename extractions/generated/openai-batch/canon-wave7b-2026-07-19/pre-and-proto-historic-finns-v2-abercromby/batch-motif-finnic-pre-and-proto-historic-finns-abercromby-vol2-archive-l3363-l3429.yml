canonical_text:
  quote: No sorcerer bewitches me, no Lapp can place me under spells
  summary: A first-person speaker boasts of resisting sorcery, counter-bewitching
    hostile sorcerers and witches, feeding attackers with worms, toads, lizards, and
    venomous snakes, carrying inherited skill and paternal armaments, resisting arrows
    and iron, and singing enemy magic-workers into violent falls and rapids where
    they sleep until grass grows through them. The passage ends with the speaker identifying
    himself as the youngest son of a sorcerer and the calf of an old divining-man,
    and recalling a visit to a smith where steel things were made.
  language: English
  quote_policy: quoted
