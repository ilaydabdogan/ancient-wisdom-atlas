  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A tall fir grows on a heath on the summit of the Hill of Pain; a sorcerer
    makes single-, double-, and triply-feathered arrow shafts from its lower, middle,
    and highest boughs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sorcerer shoots arrows or pointed shafts angrily and indiscriminately,
    whether into human skin or an animal body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Annikki goes to the war of Istero; a tin plug and silver terminal fall between
