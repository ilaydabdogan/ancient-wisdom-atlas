    the Almighty’s colt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vainamoinen goes to war, prepares spears and arrows near women in a cattle-shed,
    and a spear breaks so that parts fall into the muck and shed litter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: From the fallen spear-parts a cunning, nimble, gliding, snow-coloured wild
    creature is said to be born or bred.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rash called maahinen is said to be from earth, yard, water’s anger, earth’s
    anger, or the secret rancour of a frog, and it appears on human skin burning or
    scorching like fire or flame.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker commands the affliction to return to earth, water, or fire according
