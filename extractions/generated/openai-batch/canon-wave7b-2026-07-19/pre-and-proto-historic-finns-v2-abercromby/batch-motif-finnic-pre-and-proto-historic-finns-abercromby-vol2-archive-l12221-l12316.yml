canonical_text:
  quote: ''
  summary: 'The passage gives several origin formulae: snakes or earth-worms are spun
    and an evil stall-grub is bred; Vainamoinen’s broken spear-parts give rise to
    a gliding snow-coloured creature; the earth-elf rash is traced to earth, water,
    fire, or a frog’s rancour and is conjured back to its source; a water-Hiisi is
    linked to the earth-elf race; the sorcerer is born in the far north; arrows are
    made from a fir on the Hill of Pain or forged from fallen metal connected with
    Annikki; and ale is said to originate from barley.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls spin snakes and reel up earth-worms while a whorl and spindle rotate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stall- or winter-grub is described as an evil brood bred in animal enclosures
