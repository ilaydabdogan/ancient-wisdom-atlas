canonical_text:
  quote: ''
  summary: 'The passage reproaches an unnamed harmful actor as solely responsible
    for evil, then gives magic-song formulas for falling into ecstasy: the speaker
    summons inner Nature, Haltia or Genius, Helper, Guide, Death, Flesh, and ancestral
    natures to rise and assist. The speaker asks for fiery protection against Hiisi''s
    folk and later, in distress, calls for God''s hour and the Lord''s help while
    commanding an afflicting being, associated with elfshot, Hiisi, Manala, hell,
    Pimentola, devils, and Satans, to stop and return to its own place.'
  language: English
  quote_policy: summarized
