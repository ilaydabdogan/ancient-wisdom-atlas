canonical_text:
  quote: ''
  summary: English translation of Lettish healing charms, mostly numbered 35-48, addressing
    snake-bite language, sprains, tumours, swellings, boils, and abscesses. The charms
    use commands, animal and elder figures, colored or armed groups, trees, stone,
    sea, iron or steel objects, and thread or spinning imagery to describe the removal
    or reversal of pain, swelling, and boils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment commands a biting agent not to bite cattle or little children,
    but to bite a brown stone; a following charm describes serpentine movement and
    gives several descriptive names such as a creeper through moss and smooth slimy
    skin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three adders, colored white, variegated, and brown, have crept into a dense
    thicket, and a copper gate is told to open so all may crawl through.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A figure called “Toothless” lies in a willow thicket and is called out; the
    pain is told to rot like a willow leaf, and swelling to subside like a heap of
    wool.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a sprain charm, a billy-goat jumps over a fence, meets an old harrow, and
    upsets it; the charm asks flesh, bone, and health to return to proper relation
    while the ailment falls on a field.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A short formula places bone with bone, soft part with soft part, sinew with
    sinew, and red blood through the middle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old man leads a white mare along a street and across hills and valleys;
    hills, valleys, oaks, iron, and steel are described as breaking, colliding, or
    melting before the charm asks for no groan, no moan, no swelling, and restored
    health.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A tumour or dropsy charm describes hewing a willow and a lime-tree shooting
    forth between oak roots, then asks that a man’s body revive like lime leaves and
    that swelling vanish.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A swelling charm depicts thrice nine red wagons, thrice nine horses, and thrice
    nine drivers with red clothing, whips, gloves, and cord; the cracking whips are
    linked with the disappearance of swelling.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Thrice nine Perkoni emerge from the sea with thrice nine iron arrows and dash
    the swelling under a stone, after which the man remains in former health.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A black man sits on a lime-tree stump with an ash besom and repeatedly dips
    and sprinkles so that swelling may be suffocated.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: An old man walks along the sea with a steel sword and cuts boils in two; the
    boil runs into the deep sea, sea-sand, and sea-gravel, where it must spin and
    twist.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A boil is described as spinning between the door and is ordered to hurry into
    the forest to a ramified willow-bush where grandfathers and grandmothers are present.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: A little old mother sits on a hill with a basket holding a ball of yarn; as
    the ball unwinds, the boil discharges itself, vanishes, and passes into dust like
    a fuzz-ball.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: A final partial charm begins with the little old mother sitting on a hill
    with a ball of thread in her bosom and a little dog at her side.
  category: setting
  evidence_refs:
  - ev:14
