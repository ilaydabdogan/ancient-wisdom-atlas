canonical_text:
  quote: ''
  summary: The passage gives formulaic origin accounts for trees, cancer, and iron.
    Trees, especially the fir, are described as generated, nurtured, and fastened
    by named beings, weather, water, and divine agents; variants attribute tree origins
    to God, Jesus, Luonnotars, and hostile or demonic figures. Cancer is described
    as a malignant boy born from an old furious woman and sent to harm a baptized
    man. Iron is generated after Ukko produces three Luonnotars, whose black, red,
    and white milk becomes different kinds of iron or steel; Iron later encounters
    Fire, flees, hides, and is eventually forged, while further iron grows from wolf
    and bear tracks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening tree formula says trees issued from clean, soft, wooded places
    and Metsola; the fir is described as an unsteady or tall lanky boy, nurtured by
    frost, sky water, dew, a hillock, and wind, and associated with named agents including
    Syojatar, Maajatar, Pellervoinen, and Naservainen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed variants say the fir was rocked by a whirlwind or named wind figures,
    that Jesus’ blood made it shoot, and that variant forms of Naservainen pegged
    it down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A later tree formula describes the fir as a pure creation of God and a sprout
    drawn forth by Jesus, says its bough drips honey-like juice, says the birch was
    formed by three Luonnotars, and says the alder was made for bodily gripings, hurts,
    sores, and wounds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another tree formula says all trees were created by God except an evil alder
    buckthorn or variant tree, and attributes particular trees to a pagan, Pirulainen,
    Hiisi, Piru, Lempo, Kasonen’s son, Lemmes, and Kanelia or variant names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cancer-origin section describes an old furious woman carrying a heavy
    womb for thirty summers and winters, producing a malignant boy, fashioning him
    into cancer, clothing him in bloody clothing, and sending him to devour, gnaw,
    lacerate, rot flesh, and gnaw bones of a christened or baptized man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the iron-origin section, Ukko, called the aerial god and Creator above,
    rubs his palms on his left knee, after which three maidens, the Luonnotars, are
    born to be mothers of iron ore and generators of steel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The three Luonnotars milk black, red, and white milk on land, swamps, and
    still waters; the black milk becomes soft iron, the red produces brittle iron,
    and the white becomes steel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Iron wishes to meet his elder brother Fire; Fire burns swamps, land, and wooded
    wilds and nearly burns Iron, so Iron flees and hides in Pohjola, Lapland, a swamp,
    and a wild mountain-top, but later has to enter Fire’s chamber to be made into
    a tool or forged into a sword.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A wolf runs along a swamp and a bear hurries over a heath; iron bars and lumps
    of steel grow on the tracks of the wolf’s feet and the dints of the bear’s heels.
  category: sequence
  evidence_refs:
  - ev:9
