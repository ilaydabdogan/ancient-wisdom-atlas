canonical_text:
  quote: ''
  summary: 'The passage gives several formulaic origin accounts: variants for the
    growth of a great oak from mud, sparks, tears, a sapling carried by maidens, a
    maiden’s broken comb, and the sowing of Pellervoinen/Sampsa; an origin of the
    titmouse from a willow fragment; and the beginning of an origin of fire in which
    Ukko makes fire in the sky and an air-maiden rocks it until it falls.'
