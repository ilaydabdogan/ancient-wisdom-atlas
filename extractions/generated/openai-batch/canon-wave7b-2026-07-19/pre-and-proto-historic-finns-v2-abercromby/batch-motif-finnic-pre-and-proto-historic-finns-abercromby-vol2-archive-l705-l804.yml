candidate_motifs:
- id: motif:1
  label: Conditional impossibility as protective deferral
  taxonomy_refs: []
  basis: Multiple charms allow harm only when the addressed agent accomplishes extraordinary
    conditions, such as damaging devils and stars, climbing to the sky on a cord of
    sea-bottom sand, darkening the world, making the earth’s navel bloody, rupturing
    seventy-seven anvils, or seizing special implements.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives charm formulae, not narrative explanations of why these
    conditions work.
- id: motif:2
  label: Sympathetic return of fish into traps
  taxonomy_refs:
  - return
  basis: The fishing charm explicitly says that as water turns, the sun returns, and
    the moon returns from its mother, the fish should return and enter the traps.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The available taxonomy term “return” is broad; here the return is a practical
    fishing charm, not a narrative homecoming.
- id: motif:3
  label: Sky ascent by cord made from sea-bottom sand
  taxonomy_refs:
  - ascent
  basis: The evil-eye charm describes fetching sand from the bottom of seventy-seven
    seas, twisting it into a cord, and climbing up to the sky as the condition for
    the evil eye to fall.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The ascent is framed as a condition to be fulfilled before harm can occur,
    not as a completed mythic journey.
- id: motif:4
  label: Earth navel as world-center image
  taxonomy_refs:
