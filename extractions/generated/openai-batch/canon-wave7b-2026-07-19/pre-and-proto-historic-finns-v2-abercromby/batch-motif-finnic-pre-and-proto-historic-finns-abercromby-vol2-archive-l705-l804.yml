- id: obs:2
  text: The opening fragmentary clauses mention the hearts of a Siberian pine, a maple,
    and an elm, as well as an anchor lying at the bottom of a ship.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The skin-disease charm called “mushroom” says that when “mushroom” forms on
    the bottom of a ladle, it should attack the man; parallel clauses mention a pot
    and an anvil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fishing charm says that if the fish hears the sound of carding the wool
    of the dead, sees the shadow of a dead man, sees the cross on the church, or sees
    ashes from the bathhouse, it should notice the fish-traps set by the speaker.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fishing charm compares the desired return of fish into traps with the
    turning of water according to the sluice-current, the return of the sun, and the
    moon returning from its mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The anti-bewitchment charm includes the speaker treading on seventy-seven
    devils with seventy-seven stars above the speaker’s head, and also mentions reversing
    twelve thunderbolts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The evil-eye charm says the evil eye may fall on the man only after sand is
    fetched from the bottom of seventy-seven seas, twisted into a cord, and used for
    climbing up to the sky.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The calumny charm says a tongue may calumniate the man when the addressed
    agent can keep the world in darkness or make the navel of the earth bloody.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The stomach-ache charm directly addresses Stomach-ache and tells it to attack
    the man when it can keep seventy-seven vapour-bathrooms hot.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The dropsy charm speaks of engendering a seed of sickness on the point of
    a best-steel needle and on the blade of a steel axe before it is formed in the
    man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The rupture charm allows attack only if the addressed agent survives rupturing
    seventy-seven anvils or succeeds in letting itself down into the opening of a
    stove.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The horse-disease charm tells the addressed agent to seize the horse if it
