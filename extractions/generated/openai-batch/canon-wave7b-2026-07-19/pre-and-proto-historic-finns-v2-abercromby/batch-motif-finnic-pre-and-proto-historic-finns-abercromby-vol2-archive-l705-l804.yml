canonical_text:
  quote: ''
  summary: A sequence of Votiak charm formulae gives conditional statements for skin
    disease, fishing, bewitchment, the evil eye, calumny, stomach-ache, dropsy, rupture,
    and a horse disease. Many formulae permit harm only after difficult or cosmic
    conditions are fulfilled; the fishing charm asks fish to notice and return into
    traps by analogy with water, sun, and moon returning.
  language: English
  quote_policy: summarized
literal_observations:
