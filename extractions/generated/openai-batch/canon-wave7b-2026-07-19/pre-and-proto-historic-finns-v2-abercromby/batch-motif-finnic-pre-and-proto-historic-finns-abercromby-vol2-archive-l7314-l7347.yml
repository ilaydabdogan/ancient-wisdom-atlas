canonical_text:
  quote: ''
  summary: 'The passage contains portions of Finnic magic formulae: a healing charm
    using water identified with Jesus’ blood and divine protection; an invocation
    of a golden burbot to bring health and remove pains; a charm addressing and expelling
    cockroaches from domestic spaces; and the opening of a wind-laying formula greeting
    the Moon, Sun, Weather, and Winds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker says that the one washed with water is washed with
    Jesus’ blood, soused with the Lord’s gore, and fomented with “the water of grief”
    so that he may become well and recover health.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told to rise from lying down and awake from sleep, leaving
    the clutches of cruel luck and the grip of an evil pagan, and to remain under
    God’s favour and the true Creator’s guard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A “little golden burbot” is invited to come from a copper burbot’s mouth to
    give health, bring repose, seize pains, and make torments cease in wounded flesh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cockroach is addressed as a black, bloated, six-footed, ball-shaped stranger
    in poor northern frontier lands.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cockroach is said to wander around stoves at night, invade timber-joints
    by day, creep over dough, and climb jugs of milk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the cockroach will not flee, the speaker says he will find post horses
    or give a driving-horse for it to return to its former mother’s place or ancestral
    parent’s house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wind-laying formula begins by welcoming the Moon, Sun, Weather, Winds,
    and the northern and southern wind.
  category: speech
  evidence_refs:
  - ev:7
