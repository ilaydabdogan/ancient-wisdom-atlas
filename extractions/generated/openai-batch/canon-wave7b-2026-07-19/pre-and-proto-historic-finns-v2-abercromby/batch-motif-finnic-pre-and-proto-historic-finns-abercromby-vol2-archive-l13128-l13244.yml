canonical_text:
  quote: ''
  summary: 'The passage gives formulaic accounts of iron and steel: Ilmarinen hardens
    steel with a fluid he believes is honey, after which the steel becomes harmful;
    variant origin formulae explain iron as arising from maidens'' milk, from elemental
    sibling relations among water, fire, and iron, from Iron hiding beneath birch
    roots, and from ore or steel growing where wolf and bear disturbed the ground.
    Vainamoinen finds iron sprouts and brings them to Ilmarinen, who produces iron
    and steel with forge, fire, bellows, and a helper.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilmarinen believes a bee has returned with honey and says the fluid is good
    for toughening steel and hardening iron.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen dips iron and steel into the fluid after taking them from the fire
    and forge; the steel becomes bad, the iron rages, and a brother or relative is
    cut so that blood flows.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one origin formula, winds and storms tear up or break trees and carry a
    hillock to the sea, where an island is formed by spells.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the island a wood and meadow appear, and girls or brides grow up there.
  category: setting
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:5
  text: The maidens sit with their breasts to the east and heads to the south and
    milk their milk onto the ground and meadow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The milk flows over swamps, lands, sandy fields, and a swamp hillock or honeyed
    knoll into golden turf; from there iron originates and iron sprouts grow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vainamoinen finds the iron sprouts or growing shoots of steel, questions what
    they are, gathers them into his pouch, and carries them to a smith.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ilmarinen finds a place for a forge, sets up bellows and a forge, obtains
    wood and fire, and uses a servant or hireling to work the bellows before iron
    and steel are produced.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another formula states that water is the eldest brother, fire the middle brother,
    and iron the youngest brother; it also gives water's origin from a hill, fire's
    from the sky, and iron's from ore or rust.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fire becomes violent and burns lands, swamps, sandy fields, and heaths while
    Iron hides from the face of his angry brother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage lists several denied hiding places for Iron and then states that
    Iron hid between two stumps, beneath a birch-tree's triple root, in a place where
    birds nest or raise young.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A wolf lifts mould from a swamp and a bear digs mould from a heath; iron ore
    and a bar of steel grow where the wolf raised his foot and in the dint of the
    bear's heel.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The ore or steel is brought to a smithy or forge, where iron is produced and
