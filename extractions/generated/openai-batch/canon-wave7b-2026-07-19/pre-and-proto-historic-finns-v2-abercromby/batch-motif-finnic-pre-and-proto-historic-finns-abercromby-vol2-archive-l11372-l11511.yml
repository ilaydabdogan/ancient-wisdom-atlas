candidate_motifs:
- id: motif:1
  label: Celestial procurement of healing remedies by winged messenger
  taxonomy_refs:
  - ascent
  basis: The passage sends a winged being upward by the Seven Stars to the Maker’s
    and Omnipotent’s place to fetch salves and remedies.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The movement is commanded for a messenger figure rather than narrated
    as a full heroic ascent.
- id: motif:2
  label: Healing wing or feather applied to an injured person
  taxonomy_refs: []
  basis: The bee is sent for a honeyed wing and the swallow for a feather or plume,
    both to stroke and heal a harmed or helpless man.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader taxonomy reference is assigned beyond the literal healing action.
- id: motif:3
  label: Prayer for crop abundance and communal drink
  taxonomy_refs:
  - seasonal_cycle
  basis: Jesus and God are asked for a barley-year and corn-summer, with the result
    that people and servants can consume ale, brew, or wort.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage is a crop petition, not an extended seasonal-cycle myth.
- id: motif:4
  label: Harmful creature generated from a fallen human hair
  taxonomy_refs: []
  basis: A woman’s fallen hair is wind-carried to a meadow and becomes a wasp with
    poisoned stings; another tooth-worm origin also involves a wafted hair that becomes
    the basis for a worm.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The two uses of hair occur in separate origin accounts and should not
    be merged beyond this shared literal pattern.
- id: motif:5
  label: Vermin born from chthonic or affliction-associated parentage
  taxonomy_refs: []
  basis: The daughter of Pain and Tuoni’s son sleep together on a stone; after pregnancy,
    worms and snails originate.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage names Pain and Tuoni but does not explain their larger mythological
    functions within this excerpt.
- id: motif:6
  label: Knowledge of a disease-being’s origin as part of an incantation
  taxonomy_refs:
  - wisdom
  basis: The tooth-worm is addressed directly, and the speaker says its descent and
    origin are known and complete before or after narrating its origin.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The available taxonomy term 'wisdom' is broad; the passage specifically
    supports knowledge of origin within a charm context.
- id: motif:7
  label: Tooth disease as a gnawing worm or devourer born from refuse or small objects
  taxonomy_refs: []
  basis: Several tooth-worm variants derive the harmful tooth entity from sea refuse,
    a copper pin, dirt, or a broom twig, and describe it gnawing, biting, or destroying
    teeth, jaws, flesh, and bones.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The variants give different origins for related tooth-attacking beings;
    they should remain distinct textual variants.
