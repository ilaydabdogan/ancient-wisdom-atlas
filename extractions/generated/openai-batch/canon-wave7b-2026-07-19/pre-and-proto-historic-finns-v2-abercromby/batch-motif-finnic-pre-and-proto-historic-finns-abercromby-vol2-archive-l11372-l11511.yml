canonical_text:
  quote: ''
  summary: The passage contains healing and crop formulae followed by origin accounts
    for wasps, snails, and the tooth-worm. Winged beings are asked to obtain healing
    substances or feathers; Jesus, Mary, God, the Maker/Omnipotent, and Vainamoinen
    are invoked. The origin narratives explain harmful beings as arising from hair,
    pregnancy of underworld- or pain-associated figures, sea refuse, a fallen copper
    pin, and dust or broom fragments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A winged being is told to fly by the Seven Stars to the Maker’s porch and
    the Omnipotent’s chamber, where salves and ointments are prepared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The salves are described as being prepared in silver pots and golden kettles,
    with honey, water, melted butter, and other ointments arranged in the place.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker instructs the winged being to dip claw and feather into the ointment
    or melted butter and bring nine salves and eight magic remedies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The remedies are to be placed in Jesus’ hands and Mary’s mouth, and Jesus
    and Mary are asked to test them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The remedies are identified as the Almighty’s remedies used when the Maker
    or Omnipotent was besmeared and healed after being pierced or tortured by an evil
    power.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A bee called a pleasant bird and blue-wing is told to fly to old Vainamoinen’s
    place, take a honeyed wing from his belt, and stroke an injured man so he can
    sleep and rest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A swallow called blue-wing is told to fly from the south and bring a feather
    or downy plume from a warm land to stroke and heal a helpless man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The swallow’s feather is intended to sweep away or quench fearful or holy
    sparks and plagues.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jesus and God are petitioned for a barley-year and corn-summer so poor people
    in Bothnia and near Savolax can have drink, ale, brew, and wort.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the wasp origin, a maid or woman sits on a stone or rock, brushes her hair,
    and one hair falls or breaks off.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The fallen hair is carried by wind to a nameless meadow, where a wasp or evil
    bird is made, with a copper quiver full of poisoned stings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the snail origin, the daughter of Pain and Tuoni’s son sleep together on
    a ground-fast stone or rock; the daughter becomes pregnant, and worms and snails
    take origin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In one tooth-worm origin, a black or iron man rises from the sea, a wind-wafted
    hair becomes a beard, and a worm is bred on the beard before moving to the jawbones
    and teeth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The speaker says that the tooth-worm’s descent and origin are known and complete.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: In another tooth-worm origin, Luonnotar or a furious old wife sweeps the sea;
    refuse sticks in her mop, she takes it between her teeth, and an evil biter of
    bone is bred in her jaw.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: In another tooth-worm origin, Luonnotar loses a copper pin in withered grass
    and hay, after which a worm or Tuoni’s grub originates in the teeth and cheek-bones.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: In another tooth-worm origin, a blind daughter of Pohjola or Vainamoinen’s
    old servant girl sweeps a hut; dirt or a broom twig falls, and a devourer is born
    and enters the mouth, tongue, and teeth.
  category: sequence
  evidence_refs:
  - ev:12
