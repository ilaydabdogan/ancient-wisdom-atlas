canonical_text:
  quote: ''
  summary: 'The passage first describes the baptism and naming of Rickets in polluted,
    blood-mixed water, with variant settings. It then gives a formula for the origin
    of injuries caused by spells: Louhiatar, Pohja’s old wife, is impregnated by wind,
    seeks a place to give birth, is directed by God/Creator to a three-cornered shed
    in Pohjola/Lapland, gives birth to nine sons and one female child, is refused
    baptismal service by the Maker and by Juhannes, baptizes and names the children
    herself, assigns the sons to disease forms, and sends a nameless malformed boy
    to the Rutja rapids, from whom frosts, destroyers, sorcerers, wizards, and jealous
    persons arise.'
  language: English
  quote_policy: summarized
