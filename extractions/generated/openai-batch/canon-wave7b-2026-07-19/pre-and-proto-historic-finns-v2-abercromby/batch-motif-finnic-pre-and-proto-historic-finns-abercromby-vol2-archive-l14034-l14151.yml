canonical_text:
  quote: ''
  summary: Several fire-origin formulae describe fire as a celestial or divinely made
    spark/flame that falls from the sky, harms people and landscape, is hidden or
    subdued, and is later contained in domestic hearth use. Variants name a sky fire-maiden,
    Virgin Mary, a northern or sky maiden, and Juhannes the priest in roles connected
    with tending, handling, or naming fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fiery spark or red drop falls from above the nine skies and six firmaments
    from the place where the Creator or Ukko struck fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spark enters Tuuri's new house through a sooty chimney-hole and dry ridge-beam
    and burns or injures household members, including children, a master, a baby,
    and a mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fire continues through land, swamp, abandoned fields, and forests, then
    enters Lake Alue, whose waves are kindled and swollen so that fish are left on
    an arid reef.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lake Alue does not quench the fire; it burns juniper and fir growth and parts
    of named regions before hiding under roots, stumps, and an alder trunk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After hiding, fire is taken into rooms and pine houses, handled by day in
    a stone stove, and rests at night on the hearth in a coal receptacle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In one variant, fire is born in the sky on the Seven Stars' back and is rocked
    by Kasi, a sky fire-maiden, above nine skies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the same variant, red fire falls through a door latch and a child's bed,
    burns a boy and the mother's breast, and the child goes to Mana, Tuonela, and
    Manala.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother or old woman does not go to Mana; she knows how to fascinate fire,
    drive it through small apertures, wind it into a ball or skein, and push it into
    underworld waters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Variants identify the fire-maiden as Katrinatar or Katrina and give alternative
    destinations for the subdued fire, including a tranquil lake, Lake Alue or Haleva,
    the open sea, and Lake Kaleva.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Another variant says fire is created by God or the Maker and born from Jesus'
    word or God's mouth above nine skies.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Virgin Mary rocks and nurses the fire in a doorless, windowless room and carries
    it in or on birch-bark to a fiery cape.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A maiden from Pohjola, an icy spring, or in a variant the sky or air, comes
    able to touch and handle fire; Juhannes baptizes and names Fire for household
    use.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
