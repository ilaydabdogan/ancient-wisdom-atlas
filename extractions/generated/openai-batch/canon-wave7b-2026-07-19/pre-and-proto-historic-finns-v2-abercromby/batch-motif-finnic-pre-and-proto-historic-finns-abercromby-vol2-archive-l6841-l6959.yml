canonical_text:
  quote: ''
  summary: The passage contains formulaic song material in which a hunter laments
    poor luck and an ineffective guardian spirit, recalls forest forts and gift-giving
    forest powers, contrasts a kindly golden forest mistress with the cruel withholding
    Kuurikki, gives a charm against forest fires by addressing and redirecting Fire,
    and gives an ale charm involving a nested cloud-water-boat image, Christian holy
    figures, Hiisi’s animals, and serpents drinking ale and wort.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says his power is insignificant, his luck is short, and his guardian
    spirit is lying down or confused, while other men’s luck and guardian spirits
    work for them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes mourning, sorrow, and annoyance as his meals, contrasts
    his ragged clothing with other hunters’ gold and silver attire, and says he returns
    empty to the fire.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'In a former hunting context, three forts lay in the forest: one of wood,
    one of bone, and one of stone.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wooden fort contains forest lassies, the bone fort contains mistresses,
    and the stone fort contains the forest’s master.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The master and mistress of Tapio’s house and Tapio’s maiden are described
    in gold and silver attire; Mielikki is adorned with gold ornaments and pearls
    and is disposed to give gifts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the later scene, Halli barks along the swamp while the speaker goes along
    the hill, sees Tapio’s farm and golden doors, and looks through a sixth window-hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The later scene shows gift-givers and old wives that give game in dirty ragged
    clothes, and Kuurikki with a black and terrible appearance, withy ornaments, and
    no inclination to give or help.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The forest-fire charm asks how to sing or speak when fire ravages swamp, land,
    heaths, clearings, and hills.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fire is addressed as formed by God and made by the Creator, told it has risen
    in the woods and attacked junipers, and instructed to return to a stone oven,
    sparks, coals, and a golden hearth, or else depart to fishless tarns.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two rivers or waters are said to flow around the speaker’s home, where frost-
    or ice-covered ducks, swans, hares, and bears will destroy Fire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The ale charm describes a tiny cloud, distant rainbow, water-drop, little
    pond, and little boat containing three men: Saint Andrew, little Peter, and Jesus.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The three men are said to comb Hiisi’s elks and wash his runaway deer, after
    which the elk and runaway reindeer are summoned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Adders and snakes are described as drinking ale and drawing off wort, causing
    a wretched mistress to get less ale.
  category: action
  evidence_refs:
  - ev:6
