candidate_motifs:
- id: motif:1
  label: Forest powers dispense or withhold game and gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly calls forest beings givers of gifts or game, shows
    Mielikki disposed to give largesses, and contrasts this with Kuurikki’s refusal
    to give or help.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage emphasizes giving
    and withholding but does not describe a specific offering or reciprocal bargain.
- id: motif:2
  label: Impaired personal luck or guardian spirit causes hunting failure
  taxonomy_refs: []
  basis: The speaker links his failure and empty return to short luck and a confused,
    inactive guardian spirit.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a passage-level formulaic pattern rather than a fully narrated
    mythic episode.
- id: motif:3
  label: Contrasted golden benevolent mistress and withy-adorned cruel mistress
  taxonomy_refs:
  - duality
  basis: The passage contrasts an earlier kindly Mielikki with gold ornaments and
    gifts against a later cruel Kuurikki with withy ornaments and refusal to give.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents a contrast of appearances and dispositions; it does
    not explicitly state a cosmological dualism.
- id: motif:4
  label: Personified destructive fire redirected by charm
  taxonomy_refs: []
  basis: Fire is addressed directly as a being that has risen in the woods and is
    ordered to return to an oven/hearth or leave for fishless tarns.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The fire is destructive in a forest-fire context, but the passage does
    not describe world destruction.
- id: motif:5
  label: Cold waters and ice-covered animals overcome fire
  taxonomy_refs: []
  basis: The charm says rivers and waters encircle the home and frost- or ice-covered
    animals will destroy Fire.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The function is protective within a charm; broader cosmological implications
    are not stated.
- id: motif:6
  label: Nested water vessel containing holy figures
  taxonomy_refs: []
  basis: The ale charm places a little boat with Saint Andrew, Peter, and Jesus inside
    a pond, water-drop, cloud, and rainbow sequence.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives the image but does not explain its symbolic meaning.
- id: motif:7
  label: Serpents consuming ale and wort
  taxonomy_refs:
  - serpent
  basis: Adders are described as drinking ale and snakes as drawing off wort, which
    reduces the mistress’s ale.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The charm’s practical ritual purpose is only partly evident from the passage.
- id: motif:8
  label: Christian holy figures acting within a charm involving Hiisi’s animals
  taxonomy_refs: []
  basis: Saint Andrew, Peter, and Jesus appear in the ale charm and perform grooming
    and washing actions for Hiisi’s elks and deer.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage juxtaposes these figures but does not explicitly comment on
    syncretism or theological meaning.
