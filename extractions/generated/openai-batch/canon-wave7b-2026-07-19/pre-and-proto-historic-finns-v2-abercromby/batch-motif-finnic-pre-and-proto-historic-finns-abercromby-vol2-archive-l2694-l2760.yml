canonical_text:
  quote: ''
  summary: A weak or powerless speaker calls for help by horn, pipe, and distress
    cry through sky, earth, and Manala. Helpers arrive from above and below. The speaker
    then describes defensive places, protective garments and metal armor, ancestral
    fiery clothing from Tuonela, aid from Ukko, the Earth-mother, and Vainamoinen,
    and a defensive shirt made from fibers taken from stone, rock, and gravel. The
    protection is directed against sorcerers, witches, diviners, arrows, knives, and
    hostile forces.
  language: English
  quote_policy: summarized
