canonical_text:
  quote: ''
  summary: 'The passage contains several Finnic magic formulae: a charm to separate
    lovers, a charm for excising flesh with a knife, multiple bird-catching and hunting
    invocations to forest powers, a bedtime protection formula, and a journey-starting
    formula invoking earth or field powers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula asks that coldness freeze the hearts and inward parts
    of a loving pair so that they part and do not know, recognize, or try to unite
    with each other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening formula names three icy stones, three swarthy snakes, and three
    fragments of a bath-house stove, and says the speaker will walk nine times between
    the pair to force their hearts apart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formula for excising flesh invokes Hikityttö, Hiisi's girl, to toughen
    iron, color the knife, and sharpen its edge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The excision formula asks the blade to cut without tearing or causing blood
    to flow, and prescribes honey or sweet ointment on the iron edge or wound if the
    blade slips into flesh or blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One bird-catching formula addresses a golden forest-king, a forest-mother,
    and a little forest maid, asking them to lead covies, bevies, and flocks of birds
    toward the speaker rather than other searchers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same bird-catching formula asks that blackcock and grey-hens come to the
    decoy and that their wings, legs, and toes be bound so they cannot fly or run
    before the speaker's bow is ready.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note to the bird-catching formula says a variant of its last lines shifts
    the action to recent times by mentioning wiping snow from a gun and loading it
    with shot.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Another bird-catching formula addresses a lord of the wooded wilds and a mistress
    of Metsola called Hollow Fir, asking them to bring or send a feather to spring
    honeyed snares and nooses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same formula asks that birds be driven from coppice or abandoned fields
    toward trapping grounds and that their mouths and heads be bound so they do not
    damage flaxen or hempen snares.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A further bird-catching formula addresses Laaus, master of Pohjola, asking
    for a full-grown bird from clean sticks or whitened twigs and promising thanks,
    a bow, and praise in return.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bedtime formula greets Earth and dry land and says the speaker goes to
    bed with the leave of Earth, a Tree, and all the house.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bedtime formula asks Earth, the Omnipotent, the Creator, a saint, Jesus,
    and Mary to defend, guard, lock, bolt, shield, arm, lull to sleep, and raise the
    speaker to give thanks and praise.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Notes to the bedtime formula state that some recite it over cattle when they
    are driven into the cowhouse on the eve of St. Michael's day, and that the 'holy
    field' often means the churchyard.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The journey-starting formula calls Dry land's old wife and Primeval Master
    to rise from earth or field, accompany the speaker, and help with unharnessing
    the horse and removing the collar and shaft-bow.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The forest-hunting formula says that when the speaker sets out to hunt, he
    asks Forest, Tapio, and Wilderness to take him as their man, arrow-boy, or extra
    comrade, and calls on Knoll in relation to the heavenly bow, Great Bear, and stars.
  category: speech
  evidence_refs:
  - ev:10
