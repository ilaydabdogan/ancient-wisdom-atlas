canonical_text:
  quote: ''
  summary: 'The passage contains two formulaic sequences. In the first, an unnamed
    male figure prepares poisoned, fiery arrows and shoots three shafts: one into
    the sky, one into the earth, and one across land toward an iron or steel rock,
    where it rebounds into a human body; the wound can be remedied by divine word
    or favor. In the second, a great oak grows so large that it blocks the sun, moon,
    Great Bear, and stars; living beings suffer and search unsuccessfully for someone
    to fell it, until a small iron-clad man emerges from the sea.'
  language: English
  quote_policy: summarized
