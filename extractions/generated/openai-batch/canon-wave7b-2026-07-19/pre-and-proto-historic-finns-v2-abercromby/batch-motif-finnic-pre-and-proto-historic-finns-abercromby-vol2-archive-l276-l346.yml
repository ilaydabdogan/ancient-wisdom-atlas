  quote: "“Sovereign lady of the earth, Ultava!”"
  summary: The passage frames a selection of charms from neighboring peoples for comparison
    with Finnish magic songs, then gives Mordvin charms against illness caused by
    a fall and against burns. The fall charm addresses earth and dwelling-place powers,
    offers gifts, sends an otter’s claw to locate the place of the fall, and prescribes
    washing the child with egg mixed in water. The burn charm attributes blowing to
    God and mentions anomalous figures handling firewood.
