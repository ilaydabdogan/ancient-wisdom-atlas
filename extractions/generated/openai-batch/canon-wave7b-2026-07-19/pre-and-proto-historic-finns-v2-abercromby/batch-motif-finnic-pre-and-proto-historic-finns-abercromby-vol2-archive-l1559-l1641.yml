  text: A live hare has fur plucked from its belly and is released with a command
    to take colic pain away with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The digestion charm instructs the operator to lie down, rub the stomach, and
    repeat three times a formula about a wolf going by road and path, eating raw things
    and drinking liquids.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The menstruation charm addresses Herbula Proserpinacia, called the daughter
    of King Horcus/Orcus, and asks it to close the stream of blood as it closed a
    mule's birth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The toothache charm is performed on seeing the first swallow; the operator
    silently approaches clear water, puts water in the mouth, rubs the teeth with
    the middle finger, and speaks to the swallow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A stomach-ache formula narrates three sows falling from heaven and being found,
