  summary: The passage lists post-classical medical charms and one Swedish charm.
    The charms address gout, a stye, transferred disease, digestion, menstruation,
    toothache, stomach or heart pain, bleeding, and swelling. They combine ritual
    actions, animal release, body-rubbing, water use, spitting, and spoken formulas
    in Latin, Greek, and English.
