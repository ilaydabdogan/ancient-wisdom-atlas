  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another stomach or heart-pain formula describes shepherds gathering, cooking,
    and eating without hands, fire, or teeth, and three virgins in the middle of the
    sea with a marble table, two twisting and one untwisting.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A stomach-rubbing charm uses the left thumb and both little fingers, spitting,
    and a threefold recitation about a tree in the middle of the sea, a bucket full
    of intestines, and three virgins circling, binding, and loosening.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The bleeding charm depicts a foolish woman sitting over a spring or possible
    mountain while holding a foolish infant, then says that mountains, valleys, and
    veins dry.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Swedish swelling charm strokes the sore place from right to left with
    a whetstone, a brush, and wool-scissors, with spitting on the ground at every
    stroke.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Swedish swelling formula greets the swelling and says that even if it
