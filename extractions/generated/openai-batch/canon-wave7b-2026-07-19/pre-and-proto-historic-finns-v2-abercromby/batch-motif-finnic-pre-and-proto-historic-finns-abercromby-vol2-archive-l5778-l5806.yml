canonical_text:
  quote: "“Go as a comrade to the moon, to pay a visit to the sun”"
  summary: A first-person exorcistic speaker seeks to relieve a sick man of colic
    or gripes by squeezing and removing a personified “Colic boy.” The speaker invokes
    bear teeth and claws, a fiery ram, commands the ailment to leave the belly, threatens
    transfer into animal bodies or parts, and finally sends it to the moon and sun
    where it cannot be fetched back.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker asks how to squeeze the gripes and remove the “Colic boy” so that
    the sick or afflicted man can rest, keep his senses, breathe, and sigh.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says bear teeth will be fetched to bite the “evil boy,” and bear
    paws or crooked claws will be taken from the “blood-drinker.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says these animal parts will squeeze the gripes, crush the head
    of Colic’s son, strike the evil insect, and enrage the midge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the first measure is insufficient, a fiery ram with twisted horns is called
    to butt Colic’s gripes and affect its “prickles.”
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Colic is addressed directly and told not to be clamorous or swell itself;
    it is called a toad and worm and commanded to depart or flee from the belly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Colic is ordered to go home or to its country, where a bitch has littered
    twin dog-puppies, and to eat their hearts’ core and crawl in their livers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: If Colic does not heed the command, the speaker says it will be exorcised
    under a goose’s wing, inside a swan feather, inside a sik rib-bone, and inside
    a burbot fish’s liver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If Colic still does not heed, the speaker remembers another place and sends
    it to the moon and the sun, from which it will never be removed or fetched away.
  category: sequence
  evidence_refs:
  - ev:6
