canonical_text:
  quote: ''
  summary: The passage contains Finnic magic-song formulae for silencing a dog, for
    shooting dangerous rapids safely by invoking supernatural helpers, and for removing
    severe pain by gathering it into objects, stones, water, sea, or remote clefts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hiisi or Juntas and Tempo or Perkele are addressed and asked to shut the dog’s
    mouth, stop its nose or scenting-channel, and prevent it from giving tongue at
    passers-by.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog-silencing formula names hats, caps, a bar, a gag, a check, a hedge-stake,
    and a fence railing as means of stopping the dog’s mouth or pressing its head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stone Kimmo or Kiikka is invoked to bore or cut through the stone in the cataract
    so that a wooden skiff or fir boat will not stick or be harmed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The water king Litvetti is asked to make rocks like moss and the boat like
    a pike’s bladder while it passes through surge and projecting rocks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Meletar is asked to give a serviceable oar for steering through spell-bound
    streams past a jealous person’s house and a sorcerer’s window without the boat
    sticking or being harmed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ahti or a golden water-king is asked to steer or push the boat with a sword
    and to manage waves, foam, stones, and flatstones so the craft passes safely.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ukko, lord on high, is asked to send a cloud into the rapid’s foaming surge
    and provide steel rowing seats and copper oars for moving through hostile streams
    among rocks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The rapid-shooting formulae describe threats from boulder-stones, stony rocks,
    waves, midstream whirls, sorcerers, and witches.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:9
  text: Kirsti, called the maid of pains, is described as sitting on the stone of
    pain where three rivers flow and three or five waters part.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kirsti is asked to gather pains into a hole in a bluish or speckled stone,
    or to roll them into water and ocean depths where wind is not perceived and the
    sun never shines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Pain-maiden, Aijo’s girl, is asked to bring a cup of pain and a box of torments,
    gather pains and sufferings into them, and dash them into a stream and the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kivutar and Vammotar are asked to take a plume and a wing, sweep away sparks
    and wounds, put pains and sores into a glove and mitts, enclose them inside a
    stone, and roll the stone to the ocean depths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Pain-Maiden called Tuoni’s girl and Akaatar is asked to winnow and sift
    pains so that stones and flat stones suffer instead of a human being.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kivutar, called an old wife of pain, is summoned to seize pains from a distressed
    human and take them in a bundle or packet to a stony cleft, mountain rift, cellar
    of pains, or bluish stone from which they cannot escape.
  category: action
  evidence_refs:
  - ev:9
