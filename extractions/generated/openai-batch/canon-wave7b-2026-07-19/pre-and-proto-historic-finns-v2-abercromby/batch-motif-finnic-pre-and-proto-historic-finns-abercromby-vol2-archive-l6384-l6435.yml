  quote: ''
  summary: A sequence of Finnic magic formulae addresses legal conflict, sheep prosperity,
    bathing a child to remove pain, and quieting a child by invoking God, Mary, Sleep,
    and Sleep's son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The court formula asks that the advocate be smothered, the jurymen mollified,
    the judge suffocated, the law fall down, and the law-books fall to the floor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks justice to stand before the door while the speaker enters,
    stands by the wall or behind the door, and walks to court.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formula asks that the magistrate become a child, the jurymen become sheep,
    and the speaker become a ravening wolf or destructive bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker asks that any word spoken have the effect of a hundred words,
    so the speaker will not incur a fine or be compelled by force.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The sheep formula directs sheep to Finland to be bred, Karelia to grow up,
    Esthonia to put on wool, and home to be shorn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sheep formula tells the sheep to take wool from humid turf, a honeyed
    knoll, and a lass described as light-footed as a cloud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the bathing formula, the speaker washes a little child and commands needless
    pain and evil suffering to depart while the speaker scrubs with the bathing-switch
    and its leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bathing formula sends pain before moonrise or sunrise into stony rocks
    and hills of steel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Stones, flat stones, crags, and hills are described as calling for or lamenting
    pains and accidents.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The bathing formula says steam may enter the furnace stones, smoke the moss
    between logs, water trickle down, and the little child begin to thrive.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:11
  text: The child-quieting formula calls on God to lull the child to sleep and on
    Mary to cause it to slumber.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sleep is outside the door, and Sleep's son is in the porch or waiting behind
    the door.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sleep's son asks whether there is an infant in the crib, a little child in
    the blankets, or an innocent under the clothes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The formula invites dear Sleep into the cradle, cot, blankets, and covering
    of the child, so the child may sleep.
  category: action
  evidence_refs:
  - ev:5
