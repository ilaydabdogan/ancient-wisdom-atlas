canonical_text:
  quote: ''
  summary: The passage contains the end of one formula concerning an offender and
    then a group of cattle-benefit formulae. The speaker invokes female nature beings,
    Jesus, Ukko, forest rulers, the Creator/God, Tapio’s son, and forest figures to
    consecrate, watch, feed, water, protect, beautify, and return cattle. The formulae
    ask for luck, grooming implements, wooden or tree-made herders, protection from
    spells and weather, and a honeyed horn that produces milk, butter, fertile pasture,
    and unfailing drink.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male is to have silk bound over his eyes and a bandage tied over
