canonical_text:
  quote: ''
  summary: A set of Great Russian charms and exorcistic formulas gives procedures
    and spoken words for snake-bite, worms or grubs, a tired back, hunting, fishing,
    and presenting a petition. The charms use actions such as speaking thrice over
    damp aspen bark, making a spittle-moistened circle around a wound, girding with
    first-cut rye, grasping a door handle three times, and speaking commands to snakes,
    grubs, game, fish, or a human addressee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One snake-bite charm is to be said three times over damp aspen bark, after
    which the bark is rubbed on the wound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same charm, a broad feathered snake comes from the sea, from behind
    a hill, and from a white stone, bringing three iron pincers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The broad feathered snake removes the sting of a black snake, a little striped
    snake, a copper snake, and a blind-worm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another snake-bite charm requires making a circle around the wound with a
    finger moistened with spittle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spoken formula contrasts the fierce snake's house in a cave with the servant
    of God's place in a village, and contrasts the snake's long way to the sea with
    the servant's height to the sky.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The formula says the fierce snake has a glowing coal in its teeth and commands
    that the wound not pain or swell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The grub charm tells grubs to ride into empty sacks and fly across the sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Across the sea, grubs are described as holding a wedding; a lamb and a barren
    cow are being roasted, and there is fire, burning brimstone, and boiling tar for
    grubs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A woman going out for the first time in harvest cuts the first handful of
    rye, girds herself with it, and asks that her back not tire as Mother Rye stood
    for a year without tiring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A hunting spell begins with a white hare running and being compared to white
    ice.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Prophet Ilya stands with twelve servants and tells them to take iron switches
    and drive game from rivers, fields, hillocks, and hills into a named person's
    trap.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A fishing formula spoken while baiting a hook commands the fish to nibble,
    bite, and pull the bait to the bottom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A second fishing formula, repeated three times, tells little fish to enter
    the mother net, described as a wide pair of drawers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Before presenting a petition, the speaker is instructed to grasp the door
    handle three times and say that as the handle speaks, so the named person should
    speak against the speaker.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After entering, the petitioner is told to look up and think or say that the
    speaker is a wolf and the other person is a lamb, adding threats to eat and swallow
    the addressee.
  category: speech
  evidence_refs:
  - ev:7
