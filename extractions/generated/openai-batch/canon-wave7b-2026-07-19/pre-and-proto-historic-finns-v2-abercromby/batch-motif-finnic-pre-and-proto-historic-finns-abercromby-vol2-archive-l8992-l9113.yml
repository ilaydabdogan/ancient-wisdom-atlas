canonical_text:
  quote: ''
  summary: A sequence of hunting formulae invokes Mielikki, Kuuritar, Ukko, God/Earth's
    Ruler, and Tapio's daughter. The speaker asks forest and divine figures to unlock
    stores, release and guide game animals, drive animals from the wilderness toward
    traps, and grant enough animals for food, skins, and household needs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses Mielikki as forest-mistress and asks her to help during
    days of seeking game and hunting.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mielikki is asked to take golden keys, go to a storehouse and cellar, open
    Tapio's magazine, disturb the forest-tower, and set free the figuratively named
    gold and silver toward the hunter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note states that in winter the Finnish hunter dresses in pure white when
    going to the forest after game.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mielikki is also addressed as a mother with a lovely face and asked to open
    a honeyed chest or box and release a drove or file of animals before the searching
    man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: If Mielikki is unwilling, the speaker asks her to send serving-maids, thralls,
    or obeyers of commands who watch, tend, regulate, and guide the forest animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kuuritar is addressed as a forest sovereign, with a note that the form is
    feminine, and is described as making hoofs and bending paws.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kuuritar is asked to open a money magazine or store and release a drove or
    file of animals, including images of a golden fur-coat and homespun cloth, toward
    the speaker's traps along silver and copper paths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kuuritar is asked to restrain quick animals with reins and a bit and to urge
    slower animals with a switch, rope end, cock's beak, and golden spur.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ukko is addressed as a golden king and silver governor and asked to use a
    golden club or copper hammer to beat the wilderness so that pine branches become
    squirrels and wooded wilds become otters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old Ukko is asked to beat trees and stumps with a fiery sword and golden club
    and to drive creatures out from wilderness places to edges and open abandoned
    fields during the speaker's hunting and trapping periods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ukko is asked to give his ewes, rams, gold, and drooping ears, sending animals
    from groves, boughs, knolls, and brooks in groups of threes, fives, and sixes
    along ornate roads, paths, bridges, swamps, and wet spots.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: God or Earth's Ruler is asked to give animals of varied aspect and hue, and
