canonical_text:
  quote: ''
  summary: The passage first describes Vainamoinen splitting hills and rocks with
    a fiery-pointed sword; his golden ring falls into an iron-hill rift, and a “crafty
    one” or “striped back” is produced. In §203, two variants explain the origin of
    the snake. In variant a, Hiisi runs until exhausted, sleeps on a rock, and produces
    saliva, slime, or foam; Syojatar eats and spits it onto water, where wind, water,
    air, sun, and a cliff cave shape it. Hiisi, Piru, and Lempo then give it life,
    eyes, jaws, and teeth, and the snake is born. In variant b, Juntas/Piru produces
    slaver or slime on a rock after running and fleeing before Jesus and his companions;
    Saint Peter asks the Lord/God to give it life and eyes, and the snake begins to
    hiss and crawl.
  language: English
  quote_policy: summarized
