- id: obs:9
  text: In variant b, Juntas runs for three days, falls or sleeps on stone or a mountain
    slope, then springs from the path as Jesus passes with companions; slaver or slime
    remains on the rock.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Saint Peter notices the slaver or slime on the rock and asks what it would
