canonical_text:
  quote: ''
  summary: 'The passage gives Ceremisian and Votiak charms against evil, colic in
    horses, burns, Russian-inflicted illness, snake-bite, wasting caused by a deceased
    person, bewitchment, and evil eye. Many charms use conditional impossibilities:
    an affliction or sorcerer may harm the speaker only after performing an impossible
    or extreme feat, such as consuming fire, charring a river, tying many paths into
    one knot, reaching God through a golden portal, reversing mill-wheels, or hitting
    a target with a bow made from an eyelash. Other charms compare the disappearance
    of evil or burns to dawn-red, butter, honey, mist, or frost melting away.'
  language: English
  quote_policy: summarized
