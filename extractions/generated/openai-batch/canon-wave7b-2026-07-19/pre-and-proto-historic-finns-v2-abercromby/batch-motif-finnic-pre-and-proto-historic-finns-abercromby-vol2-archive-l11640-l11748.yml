canonical_text:
  quote: ''
  summary: The passage gives a sequence of origin formulae. An addressed honey-loving
    figure called broad-forehead is born in the sky, lowered to earth, nursed, baptized,
    and oath-bound not to harm the innocent. A figure called Shaggy or the reindeer
    cow is born in the north and assembled from natural materials before baptism.
    Further formulae explain the origins of courts of law, the cat, stone, and cancer
    or whitlow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he knows the origin of the addressed figure called broad-forehead,
    honey-paws, blue stumpy tail, claw-footed one, and lover of honey.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Broad-forehead is said to have been born in the sky on the moon, sun, and
    Seven Stars, near maidens of the air and Nature’s daughters, while fire flashed
    from the sky and the world turned on a wheel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Broad-forehead is let down to earth, nursed by Hongatar, rocked by Tuometar,
    and baptized on a honeyed knoll near Sedge-River Sound in the arms of Pohja’s
    daughter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Broad-forehead swears before God and the Blessed One not to harm the innocent
    or guiltless and to move or abide seasonally in specified forest and swamp places.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shaggy is said to have been born and raised in the far north, in Lapland’s
    woods and on named hills, with Putkinen as father, Putkitar as mother, and Putkinens
    as kin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says he was chief juryman while the reindeer cow or cow was being
    made; Pohja’s old mother made body parts from a grassy knoll, a fir, stones, quartz,
    and shoe stuffing, then took the being to baptism.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The devil, Ferkele, makes a nest or lair in the places and garments of legal
    and ecclesiastical authorities and brings forth children or progeny associated
    with strife, courts of law, and ruin to the poor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cat is obtained on a stone and described as having a girl’s nose, hare’s
    head, tail from Hiisi’s plait of hair, viper-snake claws, cloudberry feet, and
    the rest of its body from a wolf.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Stone is described through variant genealogies and substance-identities:
    son, offspring, egg of the earth, clod of the field, liver, heart-core, growth,
    and spleen of named figures.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Stone is also described as once small like grain or berries, hidden in clouds,
    coming from the sky, and rolling or wobbling through cloudy columns and red rainbows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cancer or whitlow is said to have been born at Cottage Creek at the mouth
    of the river Jordan after harlots rinsed linen caps there.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Cancer is called a biter of bone, eater of flesh, and blood-sucker; it is
    also called a dog or worm that moves to corrupt bone, macerate flesh, and cause
    swelling.
  category: action
  evidence_refs:
  - ev:10
