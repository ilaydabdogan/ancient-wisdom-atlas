canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes Hiisi-associated beings,
    Pohjola figures, Virgin Mary, God/Creator/Lord, Suvetar, Etelatar, Ukko, Jesus,
    and Vainamoinen for restraint of a threatening being, wound-healing, bandaging,
    removal of chaff from an eye, feeding pigs, and protection or deliverance in war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula addresses Hiisi-associated figures and asks them to bring
    people or lumps from a hill or mountain-top to press down a rascal or violent
    one so its foot or hoof cannot rise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A blind female figure of Pohjola or Ulappala is told to milk into wounds from
    iron and places burned by fire to prevent suppuration, eruptions, smarting, and
    inflammation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Virgin Mary is asked to weave a golden or silver belt and bind damaged places;
    Maker, Lord, God, and Creator terms are used for ligature, covering, bolt, coverlet,
    mercy, and healing effect.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old woman from Pohjola is asked to come with a basketcup, copper dish,
    and golden plume to anoint hurts and bind wounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Virgin Mary is asked to provide finger-tips and fingers so the speaker can
    remove a bit of chaff or nettle from the eye.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Virgin Mary is asked to open a golden box or chest and use a golden hook and
    honeyed line to remove a bit of chaff from the eye.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Suvetar and Etelatar are asked to feed the speaker's pigs when the swine are
    sent into woods, abandoned fields, and a shore facing the sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ukko is asked to hold counsel in the clouds, send clouds from several directions,
    and rain water or snow onto firearm parts so their locks, touch-holes, powder,
    and report do not function against a person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ukko is asked to protect the speaker in war with fiery furs, a shirt of flame,
    and a stone wall so the head, neck, and hair are not harmed by iron or blades.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Creator, Nature, and God above are asked to save men and crews from war and
    murderous waves of men, and to give deliverance.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jesus is asked to care from the sky for a self-created child, make a stone
    shield and iron enclosure, and make death-bolts and metal weapon-points fail by
    smashing, squeezing, or twisting them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Vainamoinen is asked to clip wool from a stone or break hair from a rock and
    weave a war shirt or cover behind which the speakers will shoot and fight.
  category: action
  evidence_refs:
  - ev:12
