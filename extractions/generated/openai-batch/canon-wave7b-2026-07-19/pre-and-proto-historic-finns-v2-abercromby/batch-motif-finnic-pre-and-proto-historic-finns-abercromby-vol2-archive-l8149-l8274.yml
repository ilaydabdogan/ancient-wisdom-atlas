canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes named supernatural and
    personified beings to protect cattle, guide herds through forest and swamp, aid
    a petitioner at assizes, incite a hunting dog, and silence or obstruct a dog’s
    senses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Katrinatar is addressed as a fair woman, girl of night, and maid of dusk,
    and is asked to take serving-girls to watch and tend the speaker’s herd and kine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The formula asks that a wolf’s mouth be barred and a bear’s tooth be broken
    off for the span from summer night to winter night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If earlier measures do not suffice, the speaker asks for an iron and steel
    fence around the livestock, reaching from earth to sky, to prevent injury by hostile
    creatures.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ukko, lord on high and father of the sky, is asked to make summers, groves,
    fields, morasses, forests, and woodland favorable, and to roll forward a cloud
    as a covering for the herd.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a forest dog or greedy creature is encountered, the formula asks that
    cows, calves, and bullocks be changed into stones, stump-heads, gravel stones,
    and knolls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If transformation is not enough, the formula asks for a bar or golden pole
    in the predator’s gums, Tuoni’s lock on its jaws, and the stone of Manala down
    its throat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nyyrikki, son of Tapio, is asked to cut marks on rowan trees and mountain
    clefts and to place pines and firs as bridges over mire, swamp, and water-pools
    so the cattle may reach smoke unharmed.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: Pihlajatar and Katajatar are asked to cut a birch or branch and drive the
    cattle to the farm and homestead, while the forest herd goes to the Forest Home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the assizes, earth, ancestral, warrior, forest, juniper, fir, and lake
    beings are summoned to arise, speak, and plead for the speaker so that evil or
    destruction will not fall on the speaker’s head.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: If that support is insufficient, the Creator’s golden wattled cock, compared
    in movement to a golden cuckoo and silver dove, is summoned to plead for the speaker
    and to obstruct or influence judge, jurymen, and sheriffs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: To incite a dog, Louhi and Penitar are asked to remove impediments from the
    dog, let it bark, open its scenting ability, carry scent to it like fire or smoke,
    and lead it to bear or reindeer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: To silence a dog, the old man and woman of the North and Raana are asked to
    stop the dog’s mouth and hide the puppy’s tongue so it will not bark at every
    pine branch or leafy bough.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: A field maiden, farmyard girl, and golden king of earth are asked to close
    a dog’s mouth and block its eyes, ears, and nostrils with silk, a bandage, a mushroom,
    and an apple so it will not detect a passer-by or wanderer.
  category: action
  evidence_refs:
  - ev:10
