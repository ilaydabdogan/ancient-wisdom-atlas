canonical_text:
  quote: ''
  summary: A blind or swarthy daughter of Tuonela/Pohjola is impregnated by winds,
    carries a painful pregnancy for years, fails to give birth in several marked places,
    enters the sea, bears nine sons, is denied priestly christening for them, and
    names or transforms them herself into harmful beings and diseases. Variants identify
    related female figures with Hiisi, Pimettola, and Akaatar; one variant has Akaatar
    impregnated by a bearded sea monster, producing evil progeny.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening female figure is described as blind or swarthy, associated with
    Tuonela, Pohjola, Ulappala, or Manala, and called the origin of every ill and
    many destructive acts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The female figure is positioned with her body oriented toward the cardinal
    directions, including east, south, west, and north-west.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Winds blow through her hips, lower limbs, bones, and joints and cause her
    pregnancy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Her pregnancy is described as swelling and lasting for multiple years, culminating
    in labor pains in the ninth year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: She attempts to find repose or reduce the womb on an iron rock, a steel hill,
    the Hill or Mountain of Pain, a silver hill, a golden mountain peak, between rocks,
    in a stone or fiery stove, in an oak barrel with iron hoops, and near fiery rapids
    or a holy stream; these attempts do not relieve the womb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: She goes into the sea, into a water-Hiisi's den, a hidden bug-bear's pen,
    and nixies' huts, entering the water up to different parts of her body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the sea she calls to perch, roach, and the water's fish, asking a ruff
    for slaver and a burbot for sliminess in Hiisi's heat or Hell-fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: She gives birth to nine sons near one waterfall, one Sound, and one water-girt
    stone, from one filling of the womb.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: She seeks a man, priests, and sacristans to christen or baptize the sons,
    but the priests and sacristans refuse, saying they were not ordained to baptize
    the iniquitous or horrible.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After no christener is found, she undertakes the office herself, baptizes
    or bewitches the progeny, and gives them names.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: She changes or names the offspring into forms including Wolf, Snake, Cancer,
    Ring-worm, destructive ones, Thrush, Cripple, Toothworm, a heart-devourer, and
    Woman's Enemy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Variants identify the female as Hiisi's maiden with covered ears, Pimettola's
    short-nailed one, and Hiisi's old wife with iron teeth, and also vary her orientation
    toward the east or dawn.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: A variant describes Akaatar as an enormous maiden with a hair-plait reaching
    her heels and breasts hanging to her knees, acting on the Mountain or Hill of
    Pain or Help.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: In the Akaatar variant, she enters the sea, a bearded sea monster sleeps with
    her on the sea foam, makes her pregnant, and an evil progeny is born.
  category: sequence
  evidence_refs:
  - ev:13
