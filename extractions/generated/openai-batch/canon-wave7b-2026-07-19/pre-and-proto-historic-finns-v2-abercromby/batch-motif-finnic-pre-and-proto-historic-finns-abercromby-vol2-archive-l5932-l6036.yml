canonical_text:
  quote: ''
  summary: The passage includes a brief charm in which a speaker seeks help from a
    rock, hill-stone, hill, and Hiisi's castle for a betrothal action; two charms
    against grubs, slugs, worms, or snails that threaten crops, invoking salt, iron,
    expulsion to other feeding places, a fiery sword, and Ukko in the sky; and two
    hare-catching charms in which the speaker prepares snares and verbally entices
    the hare into the speaker's trap while warning it away from other traps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker says that, if not sufficient or proper to give away
    a maiden's hand and lead a man to betrothal, he will seek help from a rock and
    strength from a hill-stone; the hill and Hiisi's castle are said to contain help
    and supplies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A crop pest is addressed as a grub of Tuoni, worm of earth, and grim root-worm.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Salt and iron are invoked to destroy or injure the pest so that it will not
    take corn, growing crops, or food supplies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If salt and iron are not enough, the pest is commanded as an unbidden guest
    and evil one to flee to grassy fields and mossless swamps, where it may eat swamp
    and roots without touching human food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A second pest charm says the grub or snail came from withered grass and grassy
    tufts to food-producing plants and kail, and asks where it obtained its scissors
    and bony jaws.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pest is commanded to stop gnawing, press its head into the earth, hide
    its tongue, depart to forest or thicket, cut alder and aspen roots, and dwell
    in ditch bottoms or banks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the pest does not accept the forest or ditch places, it is told to depart
    into the sea, settle beneath the waves, eat sea-sand or sea herbage, drink sea-water,
    and put sea-gravel or sand in its mouth and teeth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the pest does not heed the command, the speaker threatens to draw a fiery
    sword from a fiery sheath, fasten up the pest's throat, and disperse its teeth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If that is still not enough, Ukko in the sky is invoked to smash and crush
    the pest's head with a copper wagon and an iron cart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: For catching hares, the speaker arranges snares, flaxen threads, and nooses
    on snow and addresses a leveret, asking it to run into the speaker's gin and golden
    snares.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hare is told to approach without anxiety, touch the trap, bite the nearest
    trigger-pin, and avoid other people's trigger-pins, where death would seize it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker says the speaker's trigger-pin is honeyed, smeared with forest-honey
    or woodland-sweetness, and describes its relation to tongs and a bow.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A second hare charm addresses the hare by several epithets and commands it
    to run to the speaker's snares, noose-hung tree, trap, golden loop, and wide sweep-net.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The hare is told to come like ruddy fire and summer water from beneath a tree,
    fir, or juniper, past other people's snares, gins, and traps, and into the speaker's
    trap before sunrise or dawn.
  category: sequence
  evidence_refs:
  - ev:7
