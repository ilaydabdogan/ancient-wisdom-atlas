canonical_text:
  quote: ''
  summary: A sequence of Finnish healing formulae invokes Christian and Finnic sacred
    figures, including Jesus, the Virgin Mary, the Mother of Pains, Ukko, and a bee,
    to obtain or prepare salves, honey, water, and other curative substances for sores,
    wounds, pains, frostbite, bones, joints, veins, and flesh. The formulae describe
    sources in the sky, above nine skies, across nine seas, on a sea-island with a
    honey-lake, in Metsola and Tapiola, and along a cosmic route near the moon, sun,
    and Charles’s Wain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula directs the sufferer to wash, souse, rub, and foment pains
    with Jesus’ blood, the Lord’s gore, the Maker’s tears, and the “water of grief.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same formula frames the healing as release from accidents, evil days,
    oppressive bands, and tight-fastened belts of pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Virgin Mary is addressed as a dear, beloved, compassionate mother and is asked
    to anoint sores and still sufferings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Virgin Mary is asked to bring nine salves and eight magic medicines from above
    nine skies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Virgin Mary formula names feathers or plumes from a finch, snow-sparrow,
    and swallow as part of the healing action.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The salve is associated with grease used to anoint Jesus and with Jesus being
    healed after being racked by Pilatus and tortured by an evil power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The anointing is ordered above, below, and in the middle, with first, intermediate,
    and last applications directed to different parts of the body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The formula asks that the salve flow through bone, joints, flesh, and veins
    and prevent sores from suppurating, swelling, or breaking into blisters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Mother of Pains is addressed as a great mistress of the Hill of Pain and
    an old maker of salves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Mother of Pains is asked to cook reliable salves, test them on her tongue
    and mouth, and bring a suitable ointment for hurts and wounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Ukko is addressed as the Maker above and the God dwelling in the sky, and
    is asked to boil water and honey into a salve in the sky.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Ukko formula includes salmon, salmon trout, butter, fat, and swine flesh
    as ingredients for a potent salve intended to remove fractures, fissures, pain,
    and aches from bones and joints.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: Another Ukko formula asks the golden king and powerful father of the sky to
    push clouds together and rain honey, water, salve, and magic remedies down from
    the sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The cloud formula asks that horns and pipes be sent from the sky or clouds
    so that ointment may pour and magic medicine may grow on earth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: A bee is addressed as a pleasant bird and asked to fetch honey and luscious
    stuff from Metsola, Tapiola, honey-dropping sward, fields, flowers, and herb seed-vessels.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The bee is instructed to cook or melt the honey on its tongue and in its mouth
    so it can be used on hurts and sores.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The bee is told to fly across nine seas and a half without resting, to an
    island or islet in the sea, and to bring salves from nine anointers and eight
    healers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The sea-islet contains a honey-lake with delightful honey and a goodly salve
    suitable for veins and joints.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:19
  text: A bee or bumblebee is instructed to fly to the new house of Tuuri and the
    roofless one of Palvonen, where salves and honey are prepared on one fire made
    with nine sorts of wood and in nine clay pots.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The bee is told to thrust its wing or feather into honey, melted butter, a
    young maiden’s chest, and an old woman’s box to obtain honeyed sweets for frostbite
    and places touched by cruel air.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The final fragment commands the bee, called honey-wing, to rise from earth
    or a knoll and fly above the moon, below the sun, and along Charles’s Wain.
  category: action
  evidence_refs:
  - ev:9
