- id: motif:2
  label: Invoked holy mother or pain-mother as healer
  taxonomy_refs:
  - mother_goddess
  basis: The formula invokes Virgin Mary as a compassionate mother who anoints sores
    and invokes the Mother of Pains as mistress of the Hill of Pain and maker of salves.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage names Mary and a Mother of Pains, but it does not explicitly
    classify either figure as a goddess; the taxonomy link is therefore tentative.
- id: motif:3
  label: Upper-world or sky source of healing medicine
  taxonomy_refs:
  - ascent
  basis: Salves are requested from above nine skies; Ukko prepares salve in the sky
    and rains honey, water, and medicine from clouds; the bee’s final route begins
    with a flight above the moon and below the sun.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage emphasizes sky locations and upward flight, but it is a healing
    formula rather than a full ascent narrative.
- id: motif:4
  label: Animal messenger fetches healing substance from distant realms
  taxonomy_refs:
  - mystical_quest
  basis: The bee is repeatedly commanded to fly to Metsola, Tapiola, across nine seas
    to a sea-island, to Tuuri and Palvonen’s places, and along a cosmic route in order
    to obtain honey or salves.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The questing agent is an addressed bee in an incantation; the passage
    does not narrate an independent adventure with resolution.
- id: motif:5
  label: Healing island beyond nine seas
  taxonomy_refs: []
  basis: The bee is instructed to cross nine seas and a half without resting to reach
    an island or islet in the sea where a honey-lake and vein- and joint-salve are
    located.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No afterlife or underworld function is stated, so broader journey-map
    classifications should not be assumed.
- id: motif:6
  label: Ritualized numeric repetition in healing formula
  taxonomy_refs: []
  basis: The passage repeatedly uses counts of nine and eight for skies, salves, medicines,
