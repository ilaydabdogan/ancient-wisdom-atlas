canonical_text:
  quote: ''
  summary: The passage contains several Finnic magic-song exorcisms. An unnamed afflicting
    being is ordered to return toward earth or sky according to its origin and not
    harm a human body. A blind old man is described as injured on a journey and lying
    sick. A syphilis charm personifies the disease as a hostile being with named affiliations
    and origins in clothing or bedding, then commands it away from the human body
    to clothes, wilderness animal places, or hell. A tumor-removal charm seeks healing
    words from the north and Pohjola, invokes an old wife’s knowledge, and presses
    tumors with eagle claws, bear paws, stones from Tuonela’s river, large stones,
    and an axe. The final fragment addresses a swelling as Hiisi’s toadstool and boss
    of Lempo.
  language: English
  quote_policy: summarized
