canonical_text:
  quote: ''
  summary: A set of Lettish charms against bleeding, burns, and snakes. The bleeding
    charms describe virgins, dams, seas of blood, birds, a black snake, alder, hard
    stone, iron, and steel; Perkons, Mar'a/Mar'ina, Jesus Christ, and Christian prayer
    formulae appear as helpers or invocations. The burn charms use holy virgins, fire,
    wood, a red cock, Mar'a, crows, and a raven. The snake charms command adders and
    snakes to flee or keep to swamp and forest, and use a little old man with metal
    implements, feather-grass, and a vine-bush. The final charm is cut off in the
    supplied passage.
  language: English
  quote_policy: summarized
