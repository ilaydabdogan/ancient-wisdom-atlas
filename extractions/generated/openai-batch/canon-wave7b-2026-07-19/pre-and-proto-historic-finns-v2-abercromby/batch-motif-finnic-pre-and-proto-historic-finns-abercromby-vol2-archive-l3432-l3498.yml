canonical_text:
  quote: ''
  summary: A first-person magic-song boasting passage in which the speaker claims
    metal protections, sends hostile spells back upon their casters, recounts a threefold
    washing by his mother that made him a wizard and singer, reverses prior attacks
    by song, boasts of northern birth and cosmic disturbance at his creation, claims
    feats with weapons, serpents, bears, and wolves, and mentions an arrow rite and
    a water-bearing horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he ordered steel shoes and had a copper coat cast so that
    sorcerers' arrows, witches' knives, and divining-men's sharp weapons will not
    pierce him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker commands spells, charms, and spell-sent harms from sorcerers,
    seers, roadside prowlers, Laplanders, wizards, and witches to return to their
    sources and injure the senders or their families.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker states that sorcerers and wizards cannot bewitch him or make him
    die, faint, or fall on a road or journey.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says his mother washed him naked on a nether stone three times
    on a summer night so that he would become a wizard, a skilful man, a singer at
    home, and a performer abroad.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker recalls that sorcerers and those called vipers formerly cursed
    him and threatened to make him lie down or sink as a plank or bridge in swampy
    or miry places.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says he answered by casting a spell and singing, turning strong
    singers into weak ones and placing pigskin over their eyes, dogskin over their
    ears, and stone items on their feet, hands, necks, and heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker claims to be the son of a Northerner, rocked by a Turja girl and
    swung by a Laplander in an iron cradle; at his creation or arrival in the world,
    Ukko rumbled in the sky, the earth quaked, the Creator's clouds became wet like
    water, and heaven crackled like fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker boasts that a true man would be one who could draw his bow, and
    he claims to have driven a spear shaft deep into a clay-bottomed field, milked
    fierce adders, handled snakes, and armed a thousand men with swords in one summer
    night.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker says he visited a bear at its home, bitted wolves, shackled bears
    to a she-Lempo's tether-post, and hung them on Hiisi's gallows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker says no other man can put on his shoes or tie his laces; he puts
    on his own shoes, tightens the laces, and sticks an arrow or oaken shaft into
    the floor so that sorcerers and witches will not overdo their harm.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker says that, if the preceding measure is not enough, he possesses
    a chestnut stallion with a lake on its croup, clear water on its backbone, and
    a fountain mentioned before the passage breaks off.
  category: object
  evidence_refs:
  - ev:11
