canonical_text:
  quote: ''
  summary: The passage presents several Finnic magic-song origin formulae. It gives
    accounts of the dog or whelp being conceived by wind and born from Louhiatar,
    raised by a firwood-crone, improved by a maiden, and alternatively assembled by
    Manuhatar from natural materials. It then recounts the birch growing from a girl’s
    tear, the raven being formed from coals, soot, bad materials, and objects associated
    with Lempo and Hiisi, a neck swelling being traced to mist and ordered away, and
    the viper arising from the broken stony thread spun by Night’s daughter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The whelp’s genesis is stated to be from wind, and a variant gives a pup’s
    origin from the shining of the sun.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Louhiatar sleeps with her back against the wind and her side to the north-west;
    the wind makes her pregnant and hardens her womb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After three months, Louhiatar gives birth to a dog or whelp from her womb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hawonakka, the furious firwood-crone, carries swaddling-clothes, rocks the
    pup, and teaches it to trot and mark the way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The best maiden of Pohjola melts a luscious substance, lets it harden on her
    fingertips, and smears it on the dog’s teeth so that the result is a useful dog
    that does not bite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An alternative dog-origin formula says the dog was made on a heap of dust
    or meadow, produced by nine fathers and one mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Manuhatar forms dog body parts from a grassy knoll, stakes, water-lily leaves,
    east wind, and wind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A girl sitting in a dell sheds a tear that rolls down to the ground and is
    compared in roundness and heaviness to bird eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A lovely birch grows from the tear, is rocked by Tuuletar, and reaches upward
    toward the sky while spreading its boughs in the air.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The raven is called Tempo’s bird and a disgusting bird of the air, born on
    a charcoal hill and reared on a coaly heath.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: One raven-origin formula describes the raven’s body parts as made from burning
    brands, charcoal sticks, potsherds, Lempo’s objects, crooked sticks, a worn-out
    kettle, Hiisi’s weaving-stool, a sorcerer’s arrow-tip, Kirki’s axe, and mussel
    pearl or stone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A second raven-origin formula addresses the raven as ill-omened, says it belongs
    to three Lempos, and places its hovel on the ground and its home on a birch.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The second raven-origin formula says the raven was gathered from kitchen soot,
    burning sticks, coals, and bad things, with parts made from Hiisi’s and Lempo’s
    objects, tarry sticks, birch leaves, an iron bean, a sorcerer’s axe, and Keito’s
    spear.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: A swelling on the neck is addressed as Lempo’s lump, ball, and whorl, and
    the speaker says its origin is from mist, with mother, father, progenitor, and
    relatives also from mist.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The addressed swelling is told to remove itself to nameless and unknown meadows.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Night’s daughter, the maid of dusk, spins a stony and gravelly thread on a
    stone distaff and copper spinning-staff.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When the stony and gravelly thread snaps, an evil brood is obtained from the
    broken ends, and the striped back or worm of Manala is born.
  category: sequence
  evidence_refs:
  - ev:8
