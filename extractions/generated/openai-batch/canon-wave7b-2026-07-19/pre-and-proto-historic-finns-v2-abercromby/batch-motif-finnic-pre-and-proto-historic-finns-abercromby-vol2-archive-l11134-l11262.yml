literal_observations:
- id: obs:1
  text: A fire-drinking Laplander or Northerner is summoned to sip up and stop blood,
    fetch a stopper or rivet-nail, prepare pipes, and direct blood back to internal
    bodily places such as the heart and lungs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Homma is addressed as a brisk king and called to stop a flood of blood by
    closing its mouth and throat and plugging it with flesh taken from Lempo or an
    evil spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiery Hiisi from fiery Hell is called with three sons and two daughters to
    bar blood’s path with hair or a shaggy glove, or to plug the hole with flesh from
    his thigh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Travelers on dangerous waters ask Ahti for better oars and steering equipment
    and ask Ahti and his sons to still waves and swells so the boat can travel easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahti, called water’s master, is asked to give oars and a boat for cruising
    past witches and jealous people, and the speaker asks that sun, moon, wind, and
    rain not act in anger.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old woman beneath the waves, living near foam, is asked to rise and collect
    foam-headed waves in front of a boat so they do not strike or upset an innocent
    man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A joyous bird of the air, with a note giving nightingale as an alternative,
    is commanded to fly to the far east and the home of dawn and to blow a favorable
    breeze.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A maiden from the spring or gravel is asked to bring energetic and helpful
    water from the Jordan or holy stream where Christ, the Almighty, was baptized.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ukko, god on high and golden king of the air, is asked to create a storm,
    wind, and wave, not against the speaker but against the hostile boat and enemy
