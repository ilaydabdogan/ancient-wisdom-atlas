canonical_text:
  quote: ''
  summary: The passage gives formulaic origin accounts for fire, copper, and water.
    Fire is described as a child born in water, as a spark struck by Ilmarinen and
    Vainamoinen and later contained, and in an alternative account as celestial Panu,
    offspring of the sun, brought down from the sky. Copper is explained through Ilmarinen's
    smithing of a stone and through a Hiisi-associated figure's urine becoming ore.
    Water is explained as coming from sky and rock, released by Vesiviitta/Suoviitta,
    with a variant linking the water's emergence to death and Manala/Tuonela.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hoyhenys/Lemmes carries a womb, enters a lake waist-deep, and gives birth
    to a boy who is identified as Fire or Flame because he cannot be touched or held.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A luckless summer girl rocks Fire/Flame in copper and iron vessels and carries
    him to baptism or christening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ilmarinen strikes fire and Vainamoinen causes a flash without ordinary fire-making
    tools such as steel, flint, or tinder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A red spark falls, travels toward the sea, and burns the storehouse of the
    perch and the stony castle of the ruffs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Takaturma, Aijo's son, squeezes and compresses fire into tinder-spunk and
    birch-fungus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Variants of the fire-striking formula mention a snake or worm of the earth
    and, in another variant, eagle feathers and wings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another formula says it is false that Vainamoinen struck fire, and instead
    states that fire came from the sky and Panu was formed in the clouds as the sun's
    offspring.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the celestial account, fire is kept near the sun, moon, a ring or hearth,
    and God, and is then brought down through clouds while the heavens and air are
    opened or torn.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Ilmarinen finds a variegated stone, places it under his forge, blows the bellows
    for three days, and the stone liquefies or pours as copper, which he molds into
    kettles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Hiisi-associated female or mare figure urinates on a rock; the urine dries
    and becomes copper ore that pours from a hill or furnace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Water and dew are said to come from the sky and clouds, arise in a hill and
    rock, and be dug or released by Vesiviitta/Suoviitta with a golden stick and copper
    staff until they become rills, river, cataract, and sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A water-origin variant says Vesiviitta/Vaito's son sleeps or grows in a hill
    or rock while bringing water and dew; the water from the stone is connected with
    the death of his family, his father's head, and his going to Manala or Tuonela.
  category: sequence
  evidence_refs:
  - ev:9
