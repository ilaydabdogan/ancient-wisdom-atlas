canonical_text:
  quote: ''
  summary: A sequence of Finnic healing formulae invokes Jesus, the Maker, the Holy
    Birth, the Virgin Mary, God, the Lord, and the Creator in connection with washing,
    cleansing, and a healing bath. Harmful anger, wounds, sores, sparks, pains, and
    plagues are directed into earth, water, stones, woodpiles, stoves, moss, vessels,
    boxes, and chests. The Virgin Mary is asked to prepare a bath-house, bring water
    and bath-switches, create honeyed steam, and heal wounds. God or the Father of
    the air is asked to enter the steam; bath water is wished to become honey, and
    divine breath is imagined moving through the patient’s body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula asks Jesus to wash and cleanse with water described as
    made by the Maker and ordained by the Holy Birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The formula directs water’s anger, earth’s anger, and a frog’s secret rancour
    back into earth and water, with downward destinations below ground, fields, swamps,
    moss, and deep waves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Virgin Mary is invoked as a motherly female figure with golden adornments
    and is asked to come urgently to restore health and give repose before sunrise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mary is asked to heat the bath-house, make the stones steam, fetch water and
    bath-switches under cover, and make honeyed steam and vapour rise without harming
    the speaker’s children or offspring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wounds from iron, trees, and stones are ordered away to stone-heaps, woodpiles,
    and stony stoves, and the sufferer is wished health at night and freedom from
    pain by day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A second address to Mary describes her as coming with a golden cup in her
    hand and a honeyed wing in her wrapper to warm a honeyed bath-house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The formula instructs secret entry to the bath-house and describes anointing
    or wetting the door, gate, hinges, and handle so they do not make noise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bathing-switches, stones, junipers, a cup from the side of the moon, a ladle
    from under the arm of the sun, and water from the Vento stream or spring are named
    as ritual materials.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fearful or holy sparks and plagues are to be swept or quenched with Mary’s
    honeyed wing and bathing-switch into a golden cup and a copper-sided vat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Pains, plagues, angry sores, and cruel smarts are assigned to the stove, bath-house
    moss, a wool-chest, and a box.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: God, named with the Father of the air, is asked to enter the hot steam and
    bath-house secretly in order to restore health and give repose.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A sick or feeble man is described as lying in the hot bath, while excessive
    or bad steam is to be thrown down or sent away.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The bath water thrown on hot stones is wished to change into honey or luscious
    juice, and a river or lake of honey is wished to flow through the stone stove
    and moss-stopped bath-house.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The breath of the Lord and warm breath of the Creator are described as passing
    through bones, joints, sinews, flesh, blood, and arteries.
  category: action
  evidence_refs:
  - ev:10
