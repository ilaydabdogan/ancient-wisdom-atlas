candidate_motifs:
- id: motif:1
  label: animal messenger retrieves brewing ferment from a distant place
  taxonomy_refs: []
  basis: The bee and the martin are both commanded to travel away and bring back honey,
    juice, yeast, or froth as ferment for ale or small beer.
  evidence_refs:
