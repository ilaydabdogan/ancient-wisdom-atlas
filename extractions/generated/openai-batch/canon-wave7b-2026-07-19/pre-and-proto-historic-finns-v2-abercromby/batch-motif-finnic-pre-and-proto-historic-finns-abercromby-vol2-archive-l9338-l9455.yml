- id: motif:2
  label: protective enclosure from earth to sky
  taxonomy_refs: []
  basis: The good-luck formula asks God to construct an iron fence and stone castle
    around the speaker’s property, extending between earth and sky.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents a protective structure, but does not itself identify
    it with a broader cosmological motif.
- id: motif:3
  label: forest powers release and guide game to the hunter
  taxonomy_refs: []
  basis: Annikki and Mielikki are asked to open stores, throw out game shares, bring
    squirrels down, direct them to branches, and steady the hunter’s weapon.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage supports a hunting-aid pattern; any broader classification
    would require comparison outside the supplied text.
- id: motif:4
  label: magical thread as conduit for action
  taxonomy_refs: []
  basis: In the hunting charm, colored threads make a path for the arrow to reach
    the squirrel; in the healing charm, Mary’s blue thread is used to press down scab
    and swellings.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The thread appears in two different formulae with different functions;
    the shared motif is based on repeated literal use of thread.
- id: motif:5
  label: nightmare or incubus confined by ritual containment
  taxonomy_refs: []
  basis: Rahko is asked to put the incubus under beams, an iron roof, a bell, or into
    sacks, with Hiisi’s dead collected together.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain Rahko or Hiisi’s dead beyond the formula.
- id: motif:6
  label: disease transferred from human body to vegetation
  taxonomy_refs: []
  basis: The healing formula tells tumours, blisters, and boils to grow on trees,
