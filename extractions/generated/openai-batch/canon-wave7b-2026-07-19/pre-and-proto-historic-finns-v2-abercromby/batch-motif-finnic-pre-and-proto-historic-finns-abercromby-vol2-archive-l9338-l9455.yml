canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes Saint Catharine, animals
    used in ale-brewing charms, God for luck and protection, forest powers for squirrel
    hunting, Rahko against nightmare, and Virgin Mary and a scab/boil figure against
    swellings and scab.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saint Catharine is summoned in named footwear, stockings, shoe-laces, and
    ribbons to look at a creature she has made after a ram or goat has done a shameful
    deed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bee is addressed as a nimble bird and king of meadow flowers, commanded
    to fly over seas to an island or skerry where a sleeping girl lies amid honeyed
    ground and red clover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bee is told to put its wing and tongue into sweet substances and bring
    juice and honey from grass and a golden flower as ferment or barm for ale.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A small martin is commanded to go to the northern fields and Lapland ground
    where mares and stallions fight, and to collect yeast or froth from their mouths
    for ale or small beer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker asks Creator or God for luck, peaceful dwelling, and continuing
    help and guard by night and day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker asks that sun, moon, wind, rain, cold, and hard weather not act
    angrily or harmfully.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker asks for an iron fence and a stone castle around the property,
    extending between earth and sky, for protection and support.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tapio’s daughter Annikki is asked to open storehouse and garret doors, throw
    the speaker’s share of game onto boughs and trees, and make the dog bark.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Annikki is asked to stretch scarlet and blue threads along which an arrow
    can ascend to the squirrel’s brow or nose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mielikki, called forest-mistress and forest-mother, is asked to give the speaker
    something to shoot, bring squirrels down, direct them to a branch, and steady
    the bow or gun.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The hunted squirrel is linked with paying tribute and carrying away a receipt
    for rent.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rahko, described as wearing iron boots and making a stony hill revolve, is
    asked to put the incubus under structural coverings or into sacks; Hiisi’s dead
    are also to be collected together.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Virgin Mary is asked to spin a blue thread from a distaff and let it fall
    from above or from the sky so the speaker can press down scab and swellings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tumours and boils are directed to grow on trees, earth, shoots, and sapling
    firs rather than on a human body.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A brown maid or smith of scabs and bad mother or king of boils is addressed
    and told to take a pig’s snout and a foal’s tush to flog or squeeze disease from
    human skin.
  category: speech
  evidence_refs:
  - ev:11
