canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae gives origins and uses of healing
    ointments, followed by invocations for morning sunrise, treasure-seeking, elf-shot
    removal, protection against wasps, and the opening of a toothache charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juhannes, described as priest of God, boils an unguent for a year in a very
    small kettle and strokes the Lord's wounds with it during torment by Pilatus and
    an evil power; the result is healing and freedom from pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A boy or tall man comes from the Northern Land/Pimentola with many horns,
    and a feather inside a horn is to be taken and used for anointing above, below,
    and in the middle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A maiden carries cups filled with ointments from a distant country, from anointers
    and healers, and from named containers associated with the son of Vipunen and
    Lemminkainen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aijo's little girl churns butter on a mountain top and stone point, preparing
    grease as ointment for sores and wounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hiisi's ox ascends the Hill of Sicknesses and Hill of Pain; its horns and
    nipples are associated with ointments and grease to anoint and heal the sick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A star falls from the sky onto a hare, is rolled into water, swallowed by
    a duck, and transformed into eggs, salves, and magic cures for wounds and hurts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Karehetar digs earth; a hornet brings bad ointments containing poisons and
    harmful fluids, while a bee brings honey that becomes a good magic cure for sores
    and wounds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Snakes, a toad, a viper, and a worm provide saliva, slaver, milk, or similar
    substances into metal cooking vessels where ointment is cooked for wounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The golden Sun or morning star is welcomed for rising from under the waves
    above firs to the sky and is asked to bring health, game, quarry, hook-luck, and
    a pleasant daily circuit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A kinsman of Hiisi, the mountain haltia, is invoked to rise and show a seeker
    the path and place where treasure or booty can be opened.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Ghostly Shade or manalainen is commanded to rise from the earth, take away
    its own blast, and force the injury into Tuoni's turf and Manala rather than into
    human or creature skin.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Siilikki or Huijutar, called the woods' daughter-in-law, is asked to restrain
    a small winged creature; Kuutar and Paivatar are asked to conceal their children
    or family and not follow a wizard's wish.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The toothache charm begins by summoning an iron-kneed boy from Pohjola or
    the north to grind or crush Hiisi/Juntas; the supplied passage ends mid-formula.
  category: speech
  evidence_refs:
  - ev:13
