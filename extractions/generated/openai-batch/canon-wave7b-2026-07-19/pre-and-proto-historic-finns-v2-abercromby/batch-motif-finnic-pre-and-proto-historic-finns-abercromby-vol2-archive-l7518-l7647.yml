candidate_motifs:
- id: motif:1
  label: mythic origins and precedents for healing ointment
  taxonomy_refs: []
  basis: Several formulae explain healing ointments or salves as coming from sacred,
    named, animal, celestial, insect, or serpent-related sources and apply them to
    wounds, sores, or sickness.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a functional label for recurring healing-origin formulae within
    the passage, not a claim of a specific external tale type.
- id: motif:2
  label: animal or insect mediator of medicine
  taxonomy_refs: []
  basis: Hiisi's ox bears ointments; a hare and duck mediate the star's transformation
    into salves; a hornet brings bad ointments; a bee brings good honey; snakes and
    related creatures provide substances for cooked ointment.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The animals have different functions, beneficial and harmful, so the motif
    is broad.
- id: motif:3
  label: ascent or rising associated with benefit
  taxonomy_refs:
  - ascent
  basis: Hiisi's ox ascends sickness and pain hills carrying ointment, and the Sun
    rises from under waves to the sky and is asked to bring health and luck.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The ascent instances occur in different charm contexts and should not
    be merged into one narrative without review.
- id: motif:4
  label: solar morning circuit as source of health and luck
  taxonomy_refs:
  - ascent
  basis: The Sun or morning star is welcomed for rising and asked to bring complete
    health, game, quarry, and luck to the hook while completing the day's journey.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage presents a daily morning charm, not necessarily a seasonal
    myth.
- id: motif:5
  label: spirit-guided treasure seeking
  taxonomy_refs: []
  basis: The mountain haltia is invoked to show a human seeker the path and place
    where booty or treasure can be opened.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No additional treasure narrative is supplied beyond the invocation.
- id: motif:6
  label: harm returned or redirected to an underworld place
  taxonomy_refs: []
  basis: The elf-shot charm orders the Ghostly Shade to remove its own blast and force
    the injury into Tuoni's turf and the hut of Manala, not into living skin.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage gives a ritual command rather than a developed underworld
    journey.
- id: motif:7
  label: stinging creatures restrained through their guardians
  taxonomy_refs: []
  basis: The wasp charm asks Siilikki/Huijutar, Kuutar, and Paivatar to hide or bind
    winged creatures, children, or family so that they do not stab or sharpen their
    steel.
  evidence_refs:
  - ev:12
