  quote_or_summary: A golden, damp-bearded water king is asked to forget hate and
    niggardliness, accompany the speaker fishing, and give perch, siks, and pike.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:3
  type: summary
  locator: 7912-7916
  quote_or_summary: The speaker asks that fish rush into traps on holidays as a squirrel
    once rushed in firs and jumped among boughs and leafy trees.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:4
  type: summary
  locator: 7918-7928
  quote_or_summary: The old wife of the sea is asked for perch from deep, dark, undisturbed
    places and to frighten or stir fish from grots and reef holes so they tug the
    speaker’s lines.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:5
  type: summary
  locator: 7933-7942
  quote_or_summary: The speaker casts a net and stone sinks, calls Juolehetar the
    water’s mistress, and asks her to rise from mud and send or lift fish from reef
    holes and rock recesses toward the nets.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:6
  type: summary
  locator: 7944-7954
  quote_or_summary: In a bear-hunting formula, Louhi of Pohjola is asked to extend
    a woolly fist and hairy palm; the Maker, Creator, and Tapio are named in connection
    with getting big game and prostrating “honey paws.”
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:7
  type: summary
  locator: 7956-7966
  quote_or_summary: Taaria is asked to speak to the bear with affectionate names,
    telling it not to be disturbed and promising virgin honey and new honey among
    men.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:8
  type: summary
  locator: 7968-7978
  quote_or_summary: Mielikki, Annikki, and Tellervo are asked to come, collar their
    “dogs,” restrain their “hounds,” and prepare rowan or oaken restraint to muzzle
    bruin’s mouth.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:9
  type: summary
  locator: 7980-7990
  quote_or_summary: The Old man of Juumi, Juumi’s old wife, and Juumi’s former inhabitants
    are asked to keep in their “dog” or “hound” from cattle ranges; the bear is described
    as emerging from several terrains and becoming an enemy.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:10
  type: summary
  locator: 7990-7995
  quote_or_summary: The formula asks that the forest bear be choked with a honey ball
    so its jaws, teeth, central flesh, and tongue do not open or move freely.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:11
  type: summary
  locator: 7997-8005
  quote_or_summary: When the forest king or grey bear leaves its chamber or castle,
    Mielikki and Tuometar are asked to anoint its claws with wort and treat its teeth
    with honey so it touches nothing, including while crossing cattle-grounds and
    swamps.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:12
  type: summary
  locator: 8007-8017
  quote_or_summary: If the bear continues harm, Kuitua or Kuittola, forest king, and
    Hongas, a benevolent mistress, are asked to restrain the dog or hound with gold
    collars, silver straps, nine locks, and ten bars away from cattle grazing grounds.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:13
  type: summary
  locator: 8019-8022
  quote_or_summary: Kuippana, king of the forest, is asked to inhibit his son or bastard
    son from the speaker’s live stock and herd; if that is insufficient, the bear’s
    tongue, nose, and nostrils are to be blocked with a mushroom and an apple.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v2-abercromby.md
  rights_note: Public domain; source metadata permits full text use.
