canonical_text:
  quote: ''
  summary: The passage contains fishing formulae addressed to water beings and bear-hunting
    or anti-bear formulae addressed to forest, northern, and local powers. The speaker
    asks water powers for an exchange of garments and for fish to enter nets and traps.
    In the bear formulae, the speaker asks named powers to authorize hunting, soothe
    the bear with honeyed speech, muzzle or restrain the bear, and keep it away from
    cattle and livestock.
  language: English
  quote_policy: summarized
