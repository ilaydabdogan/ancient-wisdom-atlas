canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song formulae invokes Mary, Kave, Hiisi, an
    eagle, Ukko, Kullatar, Etelatar, an underground earth mistress, Kasaritar, Suvetar,
    and related powers to remove pains and swellings, aid sowing, stupefy a snake,
    and increase cows' milk yield.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Virgin Mary is invoked as a merciful mother and asked to come in described
    clothing to seize pains, remove plagues, and release spell-made injuries.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pains are directed into water, ocean depths, and wind so that the sick
    person may sleep and repose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kave is addressed as Nature's daughter, the oldest of womankind, and first
    mother of individuals, and is asked to view pains and remove plague.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sufferer's pain is accompanied by imagery of the ground cracking below
    and the sky splitting above.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hiisi is summoned from Hiitola, with variant references to hell or Perkele
    from Pimentola, together with sons, serving-girls, and a whole nation, to crush,
    eat, and lap up an evil thing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker asks for a scythe from Estonia and a mowing-iron from hell to
    cut or hack the evil impediment from an afflicted man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An eagle from Turja land or Lapland is described with steel and iron body
    parts, great size, and eyes on wing-tip and back, and is summoned to tear, cut,
    and devour pain from a human body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a charm for neck swellings, Ukko is asked to bring a golden scraping-knife
    and silver axe to remove growths, tumors, and named lumps from the neck and breathing-hole.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kullatar, the Maiden of swellings, is asked to pack away needless packages
    and move frogs, wens, and monstrous things from the neck and veins to an apple
    branch and an oak top.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: While sowing, Ukko and Etelatar are asked to send clouds from west and south,
    with water, honey, and liquid honey falling on seed, shoots, and crops.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: An old wife below the ground, Earth's mistress and the soil's old wife, is
    asked to awaken earth from sleep and cause straw, stalks, tips, and branches to
    grow where ploughing and sowing have occurred.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Kasaritar is asked to milk a snake so that venom, with a variant wording of
    milk, drips into copper-handled and iron vessels before being upset or dashed
    to earth.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: For increasing cows' milk, Suvetar and Etelatar are asked to open the ground,
    create a honeyed stream or brook, and sink a golden well from which the herd can
    drink into swollen udders.
  category: speech
  evidence_refs:
  - ev:10
