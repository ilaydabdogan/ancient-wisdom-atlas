  summary: A sequence of exorcistic formulas in which a first-person speaker commands
    an addressed being away to a bear household, murky Pohjola, northern/Lapland fires,
    battlefields, and the mouth of a cannon, describing routes, resting places, animal-like
    movement, and abundant flesh or blood at the destinations.
  language: English
