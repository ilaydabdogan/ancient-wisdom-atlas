  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Pohjola destination is described with a sea-beach, gravel, sand, heath,
    flesh, fish, and killed or roasted animals as food.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another command sends the addressee across nine woods to fires and flames
    associated with the North and Lapland; blazes mark the way and an iron path with
    steel posts is provided.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the northern/Lapland destination a place to rest, food, drink, game flesh,
    game blood, and animal flesh or bones are described, along with sleeping in a
    pigsty or sheep-pen.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another command sends the addressee to battlefields and slaughter-fields where
    men fight with swords and hand to hand, and where raw flesh, warm blood, abundant
    blood, heads, and hair are described.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage ends by ordering the addressee to go before a great cannon's mouth
