canonical_text:
  quote: ''
  summary: 'The passage surveys poetic elements in Finnic magic songs: plant-growth
    similes, images of rough planting, curses and similes involving dogs, stones,
    tools, animals, and death, humorous or exaggerated formulae, a hunting-related
    address to forest deities, a rise formula applied both to Love and yeast, an aspen
    restored by salve, an enormous ox described by impossible animal journeys, and
    authorial comments on metaphor, allusion, and indirect wording in the songs.'
  language: English
  quote_policy: summarized
