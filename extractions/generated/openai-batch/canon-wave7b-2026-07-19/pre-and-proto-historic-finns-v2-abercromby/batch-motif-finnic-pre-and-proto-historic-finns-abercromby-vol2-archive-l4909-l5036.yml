  quote: ''
  summary: The passage contains healing and exorcistic songs for removing arrows or
    sorcerous iron from a human body, treating contusions caused by trees through
    address to the injuring tree and honey-based ointment, and confronting a personified
    Cancer or Whitlow through Ukko and then Jesus with Peter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses Piru and Keitolainen and tells them to remove arrows or
    a spear from a human skin and body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arrows are directed away from the body into willow cracks, swamps, field
    subsoil, steel or iron hills, vipers in an iron hill, or the sky, clouds, and
    stars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker describes lifting out a sorcerer's shaft, Keito's spear, pointed
    iron, or an evil lance-head from human or animal skin by the word of God and the
    Lord's decree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the speaker or Ukko's son cannot remove the arrow, the black-sided Vento
    ox is summoned to tug out arrows, spears, and spikes, as it has done before.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Further helpers from Hiitola or Satan's place, Manala and Raima, Pohjola and
    Pimentola, and Pirula or Hiisi's home are invoked to draw out bolts, arrows, spears,
    or iron barbs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the tree-contusion charm, birch, spruce, trunk, bough, tree, or stump is
    treated as able to injure human skin and is commanded to carry its malice away
    or face uprooting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: When one kind of tree, stem, or branch causes injury, the injury is reported
    to another tree, stem, or branch, which responds by making good, soothing, repairing,
    or removing the injury.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tree stems and boughs possess honey; honey rains down through tops, boughs,
    and roots, producing honey-filled herbs and stalks from which ointment is prepared
    for bruises.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A personified Cancer travels along a road, is questioned by Ukko, and says
    it is going to a village to plague bones and make flesh decay or fret away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ukko forbids Cancer to harm a christened or baptized man and commands it to
    go to hell fire or the evil power's flame and harm the unchristened or unbaptized.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jesus walks along a road with little Peter; Cancer comes toward them, and
    Jesus asks Cancer where it is going.
  category: action
  evidence_refs:
  - ev:9
