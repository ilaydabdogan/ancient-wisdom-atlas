canonical_text:
  quote: ''
  summary: A sequence of Lettish charms against flux, fever, a skin disease called
    “holy virgins,” a stye, and toothache. The charms address ailments directly, command
    them to leave, bind or send them into trees, water, boats, mole-holes, or earth,
    and use repeated images of maidens, virgins, colored clothing, ice, fire, bath-house
    foundations, carts, animals, and divine invocations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The flux charm addresses Flux in several forms and says the speaker will cure
    it, draw it through nine beds, nine doors, nine fallow fields, and nine unused
    fields, then bind it to a creaking aspen where it will no longer disturb people’s
    health.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fever charm describes ice in a well and ditch, hot water behind a threshold,
    mutton boiling over icy wood, a blue goat lying in a stubble-field, pains told
    to go to hell, and a red maiden wading through the sea with a white staff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another fever charm orders flabby Fever to go to the bridge of the great river
    and look at five red maidens dancing on pieces of ice; the maidens disappear,
    the ice melts, and the fever vanishes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A skin-disease charm describes blue smoke rising or ascending from the foundation
    of a vapour-bath or bath-house, where a tiny or little black man with a black
    cap is present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A charm for the disease called holy virgins mentions a little virgin who scourges
    children, five maidens in the sea spinning a silk thread, green and blue fire
    appearing through bath-house foundations, and commands the holy Virgin to quit
    the body and go into the deep sea onto a boat or Lauma’s broken boat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: One charm commands holy virgins to flee while the speaker says they will be
    chased, overtaken, caught, whipped, and beaten; the speaker claims the dwelling-room,
    table, bed, and cradle.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A charm describes three virgins in white stockings and black shoes wading
    through the sea, finding an ignited lime-tree stump, spitting on it, extinguishing
    it, and the stump becoming black again, followed by a healing statement with God’s
    help.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'A charm describes three virgins coming to the speaker’s hands: one dressed
    in red items, one in yellow items, and one in white items; they are commanded
    away from the hands, and the Our Father is mentioned.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The stye charm presents a red cart, red horse, red driver, red whip, and red
    dog, then orders disappearance like the waning moon and like an old fuzz-ball.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The toothache charm says the pain belongs to a maiden’s teeth, not the patient’s;
    the maiden is told to take the painful tooth, creep into 3×9 mole-holes, and bury
    3×9 pains in God’s deep earth, after which the God of the earth is told to close
    the earth.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage repeatedly uses numbered groups or counts, including nine passages
    in the flux charm, five red maidens in the river charm, five maidens in the sea,
    three virgins, and 3×9 mole-holes and pains.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  - ev:10
- id: obs:12
  text: 'Several ailments or disease-names are directly addressed as if they can be
    commanded: Flux, flabby Fever, holy Virgin or holy virgins, and the stye-like
    affliction commanded to disappear.'
  category: speech
  evidence_refs:
  - ev:1
