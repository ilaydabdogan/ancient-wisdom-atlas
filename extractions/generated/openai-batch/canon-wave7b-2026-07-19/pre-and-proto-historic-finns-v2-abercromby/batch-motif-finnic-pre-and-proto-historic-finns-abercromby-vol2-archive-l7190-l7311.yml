canonical_text:
  quote: ''
  summary: 'A series of Finnic magic-song formulae: a toad or frog is identified,
    attributed divine creation, and banished; a rain cloud is sent to a dry place;
    a war charm invokes iron, fiery clothing, legendary mantles, and a protective
    stone with a snake; wolves are exorcised away from cattle; salt is empowered with
    divine breath and honey brought by a bee; and a health charm invokes Earth, Earth''s
    Haltia, divine helpers, and the speaker''s breath for a sick man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The amphibian is described as living on the shore, in swamps, groves, pools,
    springs, clay, and at roots of firs, and is named or addressed as frog, toad,
    “dirty face,” “slaver mouth,” and “wide of jaw.”
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The Lord or God is said to have created life for the amphibian and given it
    eyes with a blessing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker commands the toad or frog to depart to waters, muddy clay, miry
    pools, and mossless swamps, and threatens bodily harm if it raises its head from
    there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cloud is commanded to go to Pietula, where wells, springs, and brooks are
    described as dry or empty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Pietula, old men, old women, children, crones, steam-raisers, boys, and
    girls are described in heated places or positions; ale has not foamed and children
    remain unbaptized.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A smith’s boat has iron bows to resist rocks and sandbanks, and a fighting-man
    equips himself with coats of mail and iron shirts to resist lead and iron balls.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first-person warrior-speaker puts on his father’s fiery furs and mother’s
    shirt of flame for protection when going to battlefields and slaughter-grounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker asks that old Väinämöinen’s cloak, called also the mantle of the
    distant Lapp, be brought for protection on the bloody field.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Earth and Dry Land are asked to arise and shelter the speaker by making a
    large stone or slab with a hole in the centre and a snake around the hole.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A wolf or wolves are described near a herd or flock and are exorcised to distant
    northern, Lapp, wooded mountain, and other foreign places away from cattle grounds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Over salt, the speaker says he speaks with an unsullied mouth and the Lord’s
    breath, while a bee brings virgin honey from behind nine seas and strokes the
    salt with it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the health charm, Earth, Dry Land, Earth’s Haltia, and the Temple of the
