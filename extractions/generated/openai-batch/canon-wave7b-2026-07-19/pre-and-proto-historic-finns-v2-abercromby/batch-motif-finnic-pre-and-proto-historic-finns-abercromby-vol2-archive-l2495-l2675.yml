  summary: The passage first lists figurative expressions used for insects, diseases,
    pains, natural objects, human-made objects, places, and celestial features. It
    then gives a preliminary healing incantation in which a speaker prepares for a
    dangerous task, describes banishing sickness and spell-sent injury, asks God,
    the Creator, the Lord, and Jesus to empower his speech, hands, fingers, and breath,
    and says he will summon earth-matrons and long-reposed warriors or horsemen from
    earth, mire, and sand if he is not strong enough.
