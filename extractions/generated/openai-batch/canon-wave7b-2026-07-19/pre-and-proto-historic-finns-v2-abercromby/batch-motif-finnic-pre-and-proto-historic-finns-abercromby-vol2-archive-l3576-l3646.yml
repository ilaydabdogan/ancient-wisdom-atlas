canonical_text:
  quote: ''
  summary: 'A first-person charm for stilling violence and menacing a harmful force
    escalates threats and remedies: the speaker raises earth and landscape helpers,
    invokes named powerful figures, treats sickness as magical projectiles in the
    body, obtains smith-made tools, uses stronger-than-bear hands and dead hands,
    threatens the addressee through its mother, and calls on plant switches, horned
    animals, corpse hands, and raptor claws.'
  language: English
  quote_policy: summarized
