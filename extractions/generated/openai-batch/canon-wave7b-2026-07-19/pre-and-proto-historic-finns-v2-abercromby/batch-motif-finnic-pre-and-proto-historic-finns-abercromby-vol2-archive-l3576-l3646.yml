- id: motif:2
  label: Summoning earth, ancestral, and landscape helpers for protection
  taxonomy_refs: []
  basis: The speaker raises earth-matrons, house-fathers, armed figures, and populated
    forests, thickets, and lakes to provide might, refuge, and support.
  evidence_refs:
  - ev:2
