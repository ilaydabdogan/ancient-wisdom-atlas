canonical_text:
  quote: ''
  summary: The passage contains squirrel-hunting charm formulae and a charm for Sharp
    Frost. The squirrel is addressed with affectionate epithets and urged to come
    from forest places toward the speaker’s dogs while being reassured that the dogs,
    bows, and arrows are harmless. Sharp Frost is personified as the son of Puhuri,
    with a birth and career of freezing land, vegetation, waters, sea, and a smith’s
    forge. Ilmari/Ilmarinen subdues Frost with fire and an oath. A second formula
    describes Frost’s assaults on rooms, fences, woods, and the sea, until Ahti/the
    god uses a trick with moss from a wintered stone, made into socks and gloves,
    to hold Frost restrained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses a squirrel with affectionate animal and kinship terms
    and calls it from copses, forest dells, fir branches, and juniper clumps in numbered
    groups toward the speaker’s dogs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the squirrel not to fear the dogs or mistrust the arrows,
    describing the dogs as puppies, the archers as half-grown, and the arrows as blunt
    and short-ranging.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The squirrel is described with epithets such as knoll blossom, beauty of the
    earth, golden apple of the fir, and forest-cat, and as dwelling and moving among
    boughs and firs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker instructs the squirrel to bite a tree, eat a cone, call on a fir
    branch, and stretch itself on a branch while the speaker prepares bow and blunt
    bolts or captures it with staff or hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sharp Frost is identified as the son of Puhuri and as born of a mother; he
    is associated after birth with pools, a swamp reach, and fences.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sharp Frost freezes morasses, dry land, clearings, dells, watersides, trees,
    riverbanks, the sea shore, springs, lakes, and an iron bar in Ilmari the smith’s
    forge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sharp Frost intends to freeze Ilmarinen, but the smith warns him that his
    nails and paws will burn and plunges him into fire and a stone oven.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Sharp Frost swears an oath asking that his life be spared and accepting fiery
    punishment if he later causes frost or returns incautiously.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After being spared, Sharp Frost moves toward gloomy Pohjola and strong Sarentola,
    then northward to Lapp country, with tracks visible on the ice and with a reindeer
    covering and bear blanket.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In another formula, Sharp Frost forces himself into rooms but finds the heat
    oppressive, then dwells on fences and gates, sounds among pines and boughs, and
    freezes or strips vegetation and pasture-grounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sharp Frost attempts to freeze the sea; on the first night only the shores
    congeal and a bullfinch and wagtail remain unfrozen, while on the second night
    he greatly thickens ice and snow but Ahti’s boat remains unfrozen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sharp Frost threatens Ahti/the god; the god forbids him, uses a trick, shears
    moss or fluff from a wintered stone, makes socks and gloves from it, and holds
    Sharp Frost or Hard Weather so he cannot act by night or escape by day.
  category: action
  evidence_refs:
  - ev:8
