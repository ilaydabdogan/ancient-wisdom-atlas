canonical_text:
  quote: ''
  summary: The passage gives several formulaic variants for the origin of the lizard,
    including birth from sea froth swallowed by Kasaritar, birth from Nuoramo’s fallen
    pearl or golden trinket, formation from wood and refuse, transformation of the
    boy Ungermo into a lizard, and birth after Vingas and Vangas embrace. It then
    begins a formula on the origin of the wolf, in which a country girl’s fallen pearl
    or golden ornament produces the wolf breed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Syojatar, also named Lapahiitto, spits on the sea or waves, and a bubble or
    froth floats on the open sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kasaritar, also given the variant name Kasarikki, sits on birch and aspen
    branches, sees the floating bubble and froth, swallows the bubble, and draws the
    froth into her nostrils.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bubble and froth burn or scorch Kasaritar’s throat and nostrils, enter
    her belly, and she carries a heavy womb for three years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kasaritar gives birth to a child named Lizard, whose abode is described as
    a heap of twigs, a dry birch stump, and a rotten trunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Nuoramo steps from stone to stone and knoll to knoll; a pearl or golden trinket
    falls from her bosom onto a brushwood-covered hill and heap of twigs, and a lizard
    is produced from it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lizard is directly addressed with epithets, and the speaker says that
    he knows its origin; its father, mother, and self are called Brisk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lizard is said to have been made or composed from birch wood, aspen fungus,
    tarry root, fir branch, dust, and feathers, and to have been put or thrown near
    a house-corner, log pile, twig heap, and fence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Vingas and Vangas sleep near woodpiles and leafy twigs; during their sleep
    a boy named Ungermo appears, is secretly brought into a birdcherry-wood room and
    cradle, and then goes into the yard under a woodpile.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ungermo is considered for removal to a field, woods, water, and a wild field;
    each setting is described as unsuitable or dangerous, and finally he is changed
    into a worm and transformed into a lizard in a rotten birch-stump home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Vingas embraces Vangas in a thicket and near stone settings; a little lizard
    is produced and is described as sweepings or trash that lives under fences and
    rustles in twigs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wolf is addressed as a hungry wolf and fat dog, and the speaker says he
    knows its breed and origin.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A country girl travels over varied ground, gathers flowers or pellicles, places
    them in cloth and head-attire, combs her hair by a stone and thicket, drops a
    pearl or golden ornament, and from it the wolfish breed appears.
  category: sequence
  evidence_refs:
  - ev:6
