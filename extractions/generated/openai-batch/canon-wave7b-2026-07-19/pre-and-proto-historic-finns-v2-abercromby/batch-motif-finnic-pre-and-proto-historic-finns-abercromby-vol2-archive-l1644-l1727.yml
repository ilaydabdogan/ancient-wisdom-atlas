canonical_text:
  quote: ''
  summary: The passage gives Swedish charms for stupefying a judge, stopping bleeding,
    treating stitch and pleurisy, countering snake-bite, treating elf-shot in an animal,
    head pain, and whitlow. It then states general structural elements of magic songs
    and charms, including invocation of a stronger power or helper and commands directed
    to disease, harm, or helper.
