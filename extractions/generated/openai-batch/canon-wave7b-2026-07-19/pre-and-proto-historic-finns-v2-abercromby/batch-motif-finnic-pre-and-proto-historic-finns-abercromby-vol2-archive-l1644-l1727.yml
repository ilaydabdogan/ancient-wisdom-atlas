literal_observations:
- id: obs:1
  text: A charm for stupefying a judge instructs the reciter to look at him through
    the fingers and says the judge's fancy, utterance, and teeth will be bound to
    the speaker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One bleeding charm says the speaker will bind the blood with ten fingers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other bleeding charms compare standing still to a man at the gateway of hell
    and to Jordan's flood at the Saviour's baptism; one instruction includes standing
    on an earth-fast stone and reciting thrice against the sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A charm against stitch and pleurisy invokes Christ's birth and the Holy Trinity
    while commanding stitch and pleurisy not to hold or sting.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A snake-bite charm says Gub under the fir-tree's root stung Jesus in the foot;
    the being that stung burst, while the injured one did not.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: An elf-shot charm narrates a sorcerer going to the forest to shoot people
    and beasts; Christ forbids this and directs him to shoot stocks and earth-fast
    stones instead.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: A head-pain charm says the Virgin Mary and her maidens went to the shore,
    saw floating brains, waded out, took them, and put them in the brain and brain-pan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: A whitlow charm personifies whitlow as meeting the Lord, declaring an intent
    to break bone and cause pain, and being forbidden to harm even an earth-fast stone.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage states that magic songs and charms are composed of simple cells
    or elements, each containing an idea compressible into a single sentence.
  category: other
  evidence_refs:
  - ev:10
- id: obs:10
  text: 'The structural note names two recurring themes: the exorcist invokes a stronger
    power or helper, and the disease, harm, or helper is told what to do.'
  category: other
  evidence_refs:
  - ev:11
  - ev:12
