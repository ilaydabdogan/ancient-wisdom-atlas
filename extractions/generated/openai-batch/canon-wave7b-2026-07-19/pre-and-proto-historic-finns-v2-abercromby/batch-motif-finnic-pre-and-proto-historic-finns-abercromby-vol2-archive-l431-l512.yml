canonical_text:
  quote: ''
  summary: The passage gives one Mordvin blood-staunching charm and several Ceremisian
    charms. The Mordvin charm places three sewing girls inside a white stone by great
    water and invokes the strengthening of Vasya’s heart and the stopping of blood.
    The Ceremisian charms use impossible conditions, analogies of heaviness or lightness,
    animal and celestial imagery, and conditional prohibitions to avert bewitchment,
    dog attack, hoarseness, a snake’s glance, and blood flow, or to obtain sickness
    relief and corn abundance.
  language: English
  quote_policy: summarized
