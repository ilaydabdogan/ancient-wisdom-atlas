canonical_text:
  quote: ''
  summary: The passage contains several Finnic magic-song formulae. A speaker invokes
    forest owners and mistresses for an exchange involving gold and silver. Other
    formulae summon Kalma, Hiisi-associated beings, and Otavatar to recover stolen
    property or guard goods. Further formulae seek aid against sorcerers from Eine,
    a dead mother in the earth, Jesus, God, and the Creator, including requests for
    protective strength, a fur coat from Tuoni’s land, a wall-like defense, and a
    fiery sword.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the master and mistress of Tapio’s farm, an old forest
    man with a hoary beard called the forest’s golden king, and forest female figures
    including Mimerkki, Blue-cloak, Red-socks, and the mistress of the swamp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks the forest beings to make an exchange involving gold and
    silver bits, which are described as old, Swedish, and obtained from war or conflict
    in distant places.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The speaker offers gold and silver bits for the forest being’s “gold,” “silver,”
    “hoofs,” and “paws,” for the benefit of Tapio’s farm and the Forest Home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The forest mistress is asked to spread a lovely linen handkerchief under the
    speaker’s gold bits so they do not fall or become soiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the stolen-property formula, Kalma is commanded to rise, watch the thief,
    look after the speaker’s goods, and recover what was taken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hippa, one of Hiisi’s daughters, and Kipinatar, Hiisi’s cat, are invoked to
    torment the thief until the thief brings back and replaces what was taken, robbed,
    or hidden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Otavatar, called maid of night and steady watcher during night, is summoned
    to watch the speaker’s goods and have returned what was taken away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Old mother Eine, called life’s ruler, is asked to rise before sorcerers, jealous
    persons, presumptuous persons, or wizards act.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: If Eine cannot come herself, she is asked to send serving maids or servants,
    especially the best and tallest, to go and walk with the speaker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker wonders whether to seek relief and strength from the father in
    the sky or the mother in the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker calls to his mother, who has long lain in the earth, asking her
    to arise from the burial-place with strength and might.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The dead mother is asked to bring a fur coat from Tuoni’s land, described
    as Tuoni’s fur coat with a thousand knobs, so the speaker can dress in it against
    sorcerers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Jesus, Lord Jesus, and good God are invoked as the speaker’s defense, strength,
    and might against spells, curses, malicious thoughts, and hostile magical speech.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Jesus is asked to stand before the speaker as a wall and behind the speaker
    as a fence so that sorcerers’ arrows and wizards’ steel bolts do not take effect.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The speaker asks for a fiery, frost-hued, gleaming sword to flash into his
    right hand, with which he will strike hostile beings and persons.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: The speaker says he pushes himself higher toward the sky and asks the Creator
    or God to exorcise, speak, lower himself, and aid in overcoming enemies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: God is asked to release a man from injuries, hindrances, village sorceries,
    cursing spells, mutterings, witchery, plots, damage, filth, and spoken words of
    relations.
  category: action
  evidence_refs:
  - ev:9
