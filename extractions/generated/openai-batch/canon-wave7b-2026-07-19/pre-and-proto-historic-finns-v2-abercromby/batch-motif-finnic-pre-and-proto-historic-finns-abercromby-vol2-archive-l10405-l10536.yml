canonical_text:
  quote: ''
  summary: The passage contains a formula addressing a bee to bring honey or juice
    for iron and steel wounds, followed by several formulae against damage from fire.
    These invoke frosty or watery helpers, Water, Ismo, Iron Cock and Hen, Virgin
    Mary, a pike, a northern crone, a boy from Pohjola, and a Maid of fire to cool,
    cover, consume, or restrain burns, Fire, and Panu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bee is addressed as an active man, fellow, and lively bird, and is instructed
    to fetch juice and honey on its wing and tongue from six flower-tops and seven
    grass-heads.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The honey or luscious juice is named as a material for hardening or tempering
    steel, softening an iron blade or edge, and remaining where iron has cut.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A frosty maiden or icy girl is called to bring snow, frost, and ice for sores
    and injuries made by Fire and Panu, and to form a crust or coat of ice over them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The frosty maiden is described sitting at the mouth of a frosty spring or
    in an icy well with a golden ladle, drawing water and being asked to send icy
    or slush-colored water onto burned places.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water is described as the eldest brother and Fire as the youngest daughter;
    Water is asked to keep awake and Fire to fall asleep.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ismo, of the daughters of the air, is invoked to enter the sore place and
    throw water from her apron on scars from fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: An Iron Cock and Iron Hen are called to rise from the ground to eat pains
    produced by Fire and sip Fire's broth from burned places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Virgin Mary is invoked as a dear, compassionate mother to come with a golden
    cup of icy water containing copper twigs and dash water on burns; if that is insufficient,
    a pike is to eat the pains and lap Fire's broth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A maiden from a dell, frosty spring, or icy well is described with shoes,
    skirt, jacket, and clothes covered in ice, rime, and snow, and carrying ice to
    gag Fire's mouth and weigh down Panu's head.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Maid addressed with the names Blue-socks and Red laces is summoned from
    swamp, dale, and stream to raise frost or cooling matter and wrap fire and flame
    in her clothing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Crone of the North is called to fetch slush and ice and sprinkle icy or
    slushy water on burned matter to prevent suppuration and pus.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A boy from Pohjola or the cold village is called to bring frost, ice, and
    animal blood, and to freeze or ice the injuries caused by Fire and Panu.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A Maid of fire is called to extinguish Fire and repair Panu's work by bringing
