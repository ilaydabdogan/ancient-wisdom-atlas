  summary: The passage contains a vengeance formula against a magical injurer and
    diagnostic/healing charm sections that question Disease, Elfshot, Hiisi, Perkele,
    and Lempo about why they entered an innocent human body. The speaker distinguishes
    divine-made illness from illness caused by human sorcery and lists possible origins
    in sorcerers’ places, northern/Lapp lands, burial and underworld places, waters,
    graves, churches, and battlefields.
  language: English
