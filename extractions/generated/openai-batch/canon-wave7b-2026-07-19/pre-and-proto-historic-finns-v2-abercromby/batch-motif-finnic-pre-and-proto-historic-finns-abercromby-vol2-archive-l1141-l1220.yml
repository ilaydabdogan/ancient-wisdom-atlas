canonical_text:
  quote: ''
  summary: A sequence of Lettish healing charms addresses boils, erysipelas, caries
    of the bone, cramp, childbirth, and convulsions in children. The charms personify
    ailments, use numbered repetitions and striking images, command afflictions to
    vanish or be displaced, invoke water bodies, stones, celestial bodies, animals,
    metal implements or teeth, trees, and Christian prayer formulas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm against boils names a little white stone in the sea, a diamond knitting-needle
    in the middle, and urges the named patient to receive health.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker calling herself a woman of iron with a tongue of steel says she
    splits the boil into nine pieces and commands it to vanish or turn to dust; the
    charm ends with a Jesus formula.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boil is addressed as a howling boil and told to howl, coo, and burst;
    rotten birch-bark, rind, and leaf are then repeated without end.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: An erysipelas charm describes a woman at the foot of a hill with thrice nine
    balls of string or thread in a basket; colored balls roll, hills break and roll
    down, and the text prescribes repetition twenty-seven times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blue, white, and red erysipelas are commanded to vanish and disappear like
    morning frost, the waning moon, and the shadow of the sun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A charm against caries of the bone calls on the sun and moon to kindle and
    on bright stars to help, so that the evil dies of hunger; it is to be repeated
    twenty-seven times over tobacco mixed with honey.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A cramp charm describes a black billy-goat cooking beef and lighting a fire
    of ice, and a black man in the house who wants to contend with the speaker; the
    black man is told to go to the sea and contend with two posts of ice there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Childbirth charms tell a wanderer to stand up, sit in a cart, take reins,
    drive home, and hasten to open a gate; another tells a green pike to shoot forth
    from a lake while gentry travel and golden sails belly out.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: A charm against children’s convulsions says the devil’s mother and father
    drive to church with black horses, while three servants with thrice nine arrows
    come from the sea, meet them at crossroads, and will shoot the addressed target
    so that it vanishes and turns to dust.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: Another convulsion charm compares an old master and an old woman becoming
    tired while climbing hills with the named child tiring the evil that plagues,
    tortures, convulses, and tears him.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:11
  text: A further convulsion charm says the evil one breaks a rod, then commands that
    the pine and fir be struck rather than the named patient, who is said to be given
    by God and begotten of God.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: Black men with iron teeth wish to bite the named patient, and all the small
    stones of the sea come to help the patient.
  category: sequence
  evidence_refs:
  - ev:13
