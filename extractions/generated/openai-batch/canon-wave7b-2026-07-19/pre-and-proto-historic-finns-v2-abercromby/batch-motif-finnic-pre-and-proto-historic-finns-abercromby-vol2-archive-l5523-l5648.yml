canonical_text:
  quote: ''
  summary: The passage contains Finnic magic-song charms for burns, scalds, copper
    injuries, and hemorrhage. It summons or invokes cold-bearing and fire-controlling
    figures from Pohjola, Turjaland, Lapland, the sea, and other places; addresses
    Fire, Water, and Copper as agents whose origins can be named; and uses mythic
    precedents involving Lempo figures to support stopping blood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A yellow wren is hired and sent for the old crone in Pohjola, but the old
    woman does not come; a bee is then hired and fetches her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old crone arrives bent-backed and wet with melting snow, carrying slush,
    ice, an icy cup, and three feathers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old crone asks about the damage done by Fire and treats the burnt and
    scabbed places with salves, a wing, and melted butter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A maiden or girl comes from Turjaland and Lapland in an icy boat with a kettle
    of slush and a ladle of ice; the speaker asks her for slush and ice because she
    has cold and the speaker has heat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old man from Turjaland and Pimentola is described as very large and wise;
    he knows how to bewitch Fire and address a fiery brand, and he lifts Fire into
    the sky and clouds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Red Fire burns a lassie's breasts; a small man or hero rises from the sea,
    wears icy items, knows how to bewitch fire, recites the ravages of Fire, and heals
    the injury.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A fiery, sparking river flows in Pohjola or Sarentola; a dry-throated man
    of Pohjola drinks up the fiery stream and is asked to come eat or lap up Fire's
    injuries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the scald charm, Fire is said to have caused injury by means of water mixed
    with salt and groats; Water is addressed as Fire's oath-bound friend and is told
    its origin in mountain and rock.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the copper-injury charm, Copper is addressed directly, its origin from
    a hill and Vattala is named, and its injuries are asked to dry up or fade.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the hemorrhage charm, abundant blood has flowed, and the speaker asks why
    it is not staunched or checked with turf, hill-knolls, and iron instruments.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The son of Lempo and later the Lempo family are described as having cuts whose
    veins were knotted or united so blood no longer flowed.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The charm for iron and sword cuts says that 'Milk' or guiltless blood should
    not fall on the ground but is better inside the body, under the skin and in the
    veins and bones.
  category: speech
  evidence_refs:
  - ev:10
