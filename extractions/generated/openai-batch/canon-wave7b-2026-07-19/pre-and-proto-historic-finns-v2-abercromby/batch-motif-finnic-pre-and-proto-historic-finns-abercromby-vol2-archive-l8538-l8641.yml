canonical_text:
  quote: ''
  summary: The passage gives Finnic magic-song formulae for increasing and recovering
    cattle milk, invoking Suvetar/Etelatar, an old wife or haltia of cattle, Mana,
    Tuonela, and Para; it then gives formulae to excite love, invoking Jesus and the
    Virgin Mary to wash, purify, adorn, and make a girl desirable, including a bath
    with tree materials, fire, and love-inspiring steam.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening formula describes milk beginning to move and flow from tight teats
    in rivers, rivulets, cataracts, pipes, and channels, with butter and cream becoming
    abundant despite an ill-wisher and with milk not being brought to Mana or disappearing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suvetar, also called Nature’s old wife and Etelatar, is asked to feed and
    water named cattle and increase their milk from grasses, knolls, heather, cloud,
    and sky-associated female sources.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: If milk has been brought to the village or retained at a neighbour’s, sky
    herding-horns and cloud pipes are requested so the milk can escape a restraining
    spell and flow back home past the evil-wisher to the well-wisher.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old wife of cattle or haltia of kine is told to arise before a sorcerer
    or jealous person, ascend a buttery or milky hill, fetch milk from Mana or from
    the one keeping it back, and descend with a flask and keg so the milk and cream
    do not go to Mana or Tuonela.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Para, also addressed as Stick-shanks with a yarn-ball head and as a luck-bringer,
    is told to come to life, bring butter and milk, churn noisily, thicken the milk,
    and harden the butter; a little calf is promised monthly as recompense if good
    luck is brought.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a love formula, Jesus is asked to wash and purify a little girl or snow-sparrow
    from women’s and men’s talk, make her bloom for the moon and sweet for the sun,
    arouse Love, spread her renown, and cause men to look at her with honeyed and
    loving eyes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A second love formula asks Jesus to wash and whiten a little bullfinch or
    tender babe, make her brilliant as the moon and enchanting as the sun, clothe
    her in gold and silver ornaments, and make her desired and noticed by youths,
    suitors, men, and women.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Virgin Mary is invoked as dear, beloved, and merciful mother to awaken
    Love and Renown, free a lass from spell-wrought harm and harmful village speech,
    and prepare a bath with a bath-switch, mountain-ash or murder tree, fire, and
    love-inspiring steam.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A note explains the murder tree as an awful or terrible tree because it was
    made by a devil, and reports a Zirian name meaning dirty or abominable tree.
  category: attribute
  evidence_refs:
  - ev:9
