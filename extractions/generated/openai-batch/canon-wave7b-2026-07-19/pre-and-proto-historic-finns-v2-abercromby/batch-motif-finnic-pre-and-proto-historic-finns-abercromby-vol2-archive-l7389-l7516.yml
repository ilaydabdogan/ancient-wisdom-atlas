canonical_text:
  quote: ''
  summary: 'The passage gives several Finnish magic-song formulae: charms for sea
    travel and storms, an invocation for departure on the sea with divine and bird
    assistance, a brief heroic boat scene, a trap charm addressing a honeyed tree
    in the forest, and ointment charms deriving healing substances from Jesus and
    the Virgin Mary.'
  language: English
  quote_policy: summarized
