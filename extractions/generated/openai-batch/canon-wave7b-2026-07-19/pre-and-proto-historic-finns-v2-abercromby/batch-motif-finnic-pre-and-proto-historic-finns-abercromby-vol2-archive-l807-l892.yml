canonical_text:
  quote: ''
  summary: A sequence of Votiak and Lettish healing charms addresses illness as a
    hostile or personified force. The Votiak charms refuse to surrender a sick man
    unless hostile beings can perform impossible feats involving hot objects, animal
    transformations, the sky pillar, and celestial bodies. The Lettish charms expel
    cough, fire-like stitch, stomach-ache, bodily pain, and flux through commands,
    threats, ritual numbers, animals, thread imagery, and Christian formulae.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that the sick man will not be given to the evil one, even
    though he is bewitched.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hostile addressee is allowed to eat the sick person only if it can first
    eat a white-hot stone, red-hot steel, and thunderbolts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hostile addressee is also challenged to repair broken distilling equipment,
    make a black bear into a horse, and make a black snake into a whip.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A pillar of the sky is said to be in the sky, and knowledge of its measure
    and length is set as a condition before the sick man is yielded.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hostile addressee is challenged to divert the full sun and full moon,
    know the number and measure of the stars, and squeeze the stars in its fist before
    eating the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cough is directly commanded to leave and not scratch the named person’s body,
    bones, or heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cough is sent along the sea to scratch sea-stones and sea-sand, and is warned
    that dogs and cats will tear it apart if it comes into the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fire or wild fire is addressed as a tearing and pricking force and ordered
    to cease, go through the earth, and remain still.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A charm states that in the sea there is a four-cornered white post hacked
    into very fine pieces, followed by a Christian formula and repetition three times.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: For stitch in the side, the charm calls for three, nine, and three-times-nine
    Perkoni or lightnings to strike it, with crosses made according to the number
    mentioned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For stomach-ache, three balls of thread, red, black, and white, roll over
    a high hill, and the speaker says they will be wound up in that order.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: For pains in bones and muscles, the speaker takes a pine-splinter and stabs
    the devil.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A black dog, a black cat, and a hare run past and bite off or bite through
    the pain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Flux is commanded to flee while the speaker threatens to catch, strike, whip,
    and tear it to pieces with an iron harrow.
  category: speech
  evidence_refs:
  - ev:11
