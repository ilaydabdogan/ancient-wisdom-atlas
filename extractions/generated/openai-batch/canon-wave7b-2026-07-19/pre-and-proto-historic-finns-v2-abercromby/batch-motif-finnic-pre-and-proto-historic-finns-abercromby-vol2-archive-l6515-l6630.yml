canonical_text:
  quote: ''
  summary: A sequence of Finnic magic formulae addresses courtship, love alienation,
    bird-taking, fowling, artificial decoy-making, bugs, and a cow-house snake. The
    formulae use direct address, commands, ritual washing, decoy objects, threats,
    and references to named figures such as Väinämöinen and the son of Kaleva.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An addressed girl and named daughters are described as unmarried because of
    bodily dirt, husks, soot, ashes, and filthy clothing; the formula commands removal
    of such garments and putting on attractive clothing before going to church.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A first-person speaker says she was formerly black and unbetrothed, gathered
    bathing materials, heated a vapour-bath, washed at marked calendrical times, appeased
    the Love-god, and then received wooers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A formula to alienate love orders the Love-god to leave a maiden and calls
    for sweat, tar-smell, pig skin over the eyes, Lempo's filth on the ears, evil
    gossip, and absence of suitors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A redstart is commanded to fly in all directions toward the place where the
    speaker's bird whistles to allure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A fowling formula asks a bird to alight on branches and remain still until
    a snare-like mechanism moves or bangs; if it flies, hawks and eagles are said
    to eat it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A second fowling formula summons named game birds to a gold decoy or iron
    carrion and tells them to lie helpless when the speaker hisses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: An artificial decoy-bird is made from churchyard grave sand, a magpie's nest,
    and birch-bark shoes; it is carried to fire, rubbed with an alder bathing-switch,
    washed with pure water, and brought home without witch interference or discovery
    by a squinting eye.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A bug is personified with epithets, ordered into the wall, and threatened
    with burning, pounding, and grinding if it does not obey.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A cow-house snake is addressed as round, plump, snow-coloured, and long; the
    formula says it was formerly an apron, Väinämöinen's clasp, and the son of Kaleva's
    belt-clasp, and describes it lying in byre muck and animal urine.
  category: speech
  evidence_refs:
  - ev:9
