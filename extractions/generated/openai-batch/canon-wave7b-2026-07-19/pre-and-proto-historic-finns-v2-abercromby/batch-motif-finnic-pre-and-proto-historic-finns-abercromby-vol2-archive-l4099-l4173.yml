canonical_text:
  quote: Thee I conjure away to other, to foreign lands
  summary: A sequence of Finnic exorcism formulae commands an unnamed harmful presence,
    pains, and torments away from a human body and into foreign lands, waters, sea-depths,
    fish, or containers and resting places associated with named figures. One formula
    threatens the returning presence with Ukko’s punishment; another depicts waves
    bearing fires, men, spits, and roasted meats.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker conjures the addressed presence away to foreign lands, Russian
    land, pig-sty and sheep-pen settings, and finally unseen black waters and unchristened
    places where it will not be heard of again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the presence has come from water, it is commanded to roll back into water,
    move like a little snake or otter, and go toward sea or bay waters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The water-borne presence is directed into the mouths, teeth, eyes, or tails
    of named fish, which eat, crush, bear, float, or carry it into deep sea and inky
    mud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the presence raises its head from the deep place, Ukko is said to split
    its head with a golden club and silver wedge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another exorcism sends a water-origin presence to the clear sea surface and
    endless waves, where wind, shore, swell, and water rock or shake it and fish are
    available as food.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sea scene includes three swelling waves; at the head of each wave is a
    fire, before each fire stands a man holding spits with roasted flesh, including
    elk, ox, and whale head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A formula warns pains away from a human being’s skin and directs pains and
    torments into named receptacles or resting places associated with Kivutar, Vammatar,
    Vaivatar, and Paivatar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If no place is found in those receptacles or beds, the torments and suffering
    are to roll into water, subside into the dark sea-depths, and go to the lower
    parts of Saarva lake, nine fathoms deep, from which they will not escape.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The final fragment commands the addressed presence to move to the place where
    the speaker ordered and conjured it, to spend weeks and months there.
  category: speech
  evidence_refs:
  - ev:8
