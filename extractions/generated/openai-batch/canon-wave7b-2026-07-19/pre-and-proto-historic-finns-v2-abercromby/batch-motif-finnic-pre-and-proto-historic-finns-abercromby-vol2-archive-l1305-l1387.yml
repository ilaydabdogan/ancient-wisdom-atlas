canonical_text:
  quote: ''
  summary: 'The excerpt gives several Great Russian exorcism and healing charms: a
    sealing formula with a lock and key thrown into water; toothache charms invoking
    a corpse, impossible meetings of separated beings, and a rowan-tree; a gripes
    ritual using a whetstone, knife, cross-signs, and water; scrofula charms spoken
    over water, salt, and oil that banish or wash away the affliction; and the beginning
    of a fever and ague charm involving blessing, crossing, and going to the blue
    sea.'
  language: English
  quote_policy: summarized
