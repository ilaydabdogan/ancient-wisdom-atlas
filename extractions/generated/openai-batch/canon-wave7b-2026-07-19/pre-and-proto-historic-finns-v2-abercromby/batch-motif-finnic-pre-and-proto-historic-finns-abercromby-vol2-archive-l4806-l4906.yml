canonical_text:
  quote: ''
  summary: A sequence of Finnic magic-song passages describes healing an injured horse
    or limb by binding veins with colored threads, female vein-spinners preparing
    such threads, charms against nightmare, frostbite, and cold, and a charm against
    stitch or pleurisy involving forged bolts or spikes extracted from the body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man rides toward church on an elk-like, seal-fat horse, crossing a
    blue bridge, the Kedron brook, and a stony path toward a lofty hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The horse’s foot slips; its leg breaks in a hole or cavity between rocks and
    stones, and the old man falls from its back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vuolervoinen prepares to bind veins and reset the limb; he joins the bone,
    ties the veins, and inserts ruddy and dark-blue thread.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says veins and threads are knotted with magic words near a blue
    bridge and at the end of a red foot-bridge.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Suonetar is described as a beautiful woman and lovely spinner of veins who
    knots veins and prepares threads with magic words using spinning equipment and
    metal or precious supports.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saint Anni, called a gracious maid and maiden of the veins, spins ruddy, blue,
    and black threads on copper, silver, and iron spinning implements.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Saint Anni binds the thread on a foot, on animal or human skin, or on a body
    when a joint has sprained, cracked, shifted, or been knocked from place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the nightmare charm, the speaker has sacks below and above and a steelyard
    beneath the stern, on which nightmares are set down and Hiisi’s dead are gathered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the first nightmare procedure does not help, Rahko in iron boots is invoked
    as one who makes a stony hill revolve and will place the nightmares under structural
    or iron coverings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sharp Frost, son of Blast or Puhuri, is addressed as an ice-crusty winter
    boy who has hurt human skin and injured a mother’s son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sharp Frost is ordered to recognize and remedy his deeds, heal what he has
    bitten or touched, or else the speaker will report him to his mother and father.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sharp Cold, son of Narappa, is exorcised to distant northern limits and the
    flat open land of the Lapps, where Cold and Chilly Weather may live.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the northern destination, Cold is told he will level trampled ground, slay
    a grazing reindeer, eat nearby flesh, and gnaw nearby bone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: If Cold does not heed the first exorcism, the speaker sends him into the belly
    of Pakkanen and then to the clouds and sky, commanding him to stop injuring a
    christened or baptized man.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the stitch or pleurisy charm, Piru forges bolts and the son of Aijo forges
    jagged spikes in the smithy of Hiitola on Lapland’s bird-snare plains.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The speaker says he ordered small tongs and tweezers to draw a sorcerer’s
    bolts and an archer’s weapons out of human skin and the body of a woman’s son.
  category: action
  evidence_refs:
  - ev:10
