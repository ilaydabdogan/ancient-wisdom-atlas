candidate_motifs:
- id: motif:1
  label: Apotropaic serpent-bound boundary
  taxonomy_refs:
  - serpent
  basis: The formula commands steel gates and a fence interlaced with snakes whose
    orientation and hissing are meant to force hostile beings to go around and prevent
    passage under or over the fence.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a magical formula, not a narrative episode of a serpent
    guardian.
- id: motif:2
  label: Divine protective armor from the sky
  taxonomy_refs: []
  basis: Ukko is asked to send a pipe, copper horn, and golden shield that the speaker
    can wear so sorcerers’ arrows and a wizard’s steel cannot stick.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The objects are formulaic and their practical form is not fully explained
    in the passage.
- id: motif:3
  label: Storm god’s thunder-fire against sorcery
  taxonomy_refs:
  - divine_judgment
  basis: Ukko, ruler of thunder-clouds, is asked to make thunder crash and pour fire
    from the sky to overthrow jealous men, destroy witches, and remove sorcerers and
    wizards.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage frames the action as defensive magic; it does not explicitly
    call the attack a judgment.
- id: motif:4
  label: Summoning auxiliary armies from natural domains
  taxonomy_refs: []
  basis: The speaker calls helpers and warriors from waters, mountain, earth, forest,
    wilderness, hill, wells, and streams to oppose enemies and shield against weapons.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  confidence: high
  cautions: The summoned groups are many and formulaic; the passage does not provide
    a single unified mythic narrative for them.
- id: motif:5
  label: Ancient diviner’s words as protection
  taxonomy_refs:
  - wisdom
  basis: Old Väinämöinen, called a diviner as old as time, is invoked to speak on
    the speaker’s behalf and utter words at the speaker’s side.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy link to wisdom is based on the figure’s diviner role and
    verbal protection, not on an explicit wisdom-teaching episode.
- id: motif:6
  label: Animal helpers against curses and sorcerers
  taxonomy_refs: []
  basis: A fiery hound or iron dog is to eat spells or curses and snap up sorcerers,
    while an earth-raised cock or hen is to attack jealous men and sorcerers.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The animal helpers appear in separate formulaic requests rather than a
    continuous animal-helper tale.
- id: motif:7
  label: Turning hostile weapons against attackers
  taxonomy_refs: []
  basis: The speaker says sorcerers, witches, wizards, and evil men will be slain
    or defeated with their own arrows, knives, steel, and swords.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a magical threat or command, not a completed narrative
    reversal.
- id: motif:8
  label: Dead or earth-resting old folk as protective force
  taxonomy_refs: []
  basis: Old folk long reposed in earth or grove are requested to become the speaker’s
    people, strength, and nation.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly identify the old folk as ancestors or
    dead persons, though it says they have long reposed in the earth and rested in
    a grove.
comparison_claims:
- id: claim:1
  claim: The snake-bound fence functions as an apotropaic boundary and can be cautiously
    compared at the functional level to serpent-as-guardian or serpent-boundary motif
    patterns.
  claim_level: same_function
  target: serpent boundary or guardian pattern
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not narrate an independent serpent guardian; snakes
    are woven into a commanded magical fence.
- id: claim:2
  claim: The invocation of Ukko’s thunder and sky fire against witches, sorcerers,
    and wizards fits a broad storm-deity protective-punitive pattern.
  claim_level: same_function
  target: storm god protective punishment / divine_judgment pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly define the action as judgment and remains
    within a protective spell context.
- id: claim:3
  claim: The repeated calling of warriors from water, mountain, earth, forest, hill,
    and other natural domains supports comparison to a general magical pattern of
    summoning hidden or chthonic auxiliary forces.
  claim_level: same_function
  target: summoned hidden auxiliaries from natural domains pattern
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides formulaic summons rather than a narrative account
    of where these helpers originate or how they relate to one another.
