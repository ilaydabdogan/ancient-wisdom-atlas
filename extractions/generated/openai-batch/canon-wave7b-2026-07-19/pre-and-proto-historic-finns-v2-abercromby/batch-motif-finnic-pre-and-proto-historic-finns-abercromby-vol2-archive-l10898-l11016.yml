canonical_text:
  quote: ''
  summary: A sequence of Finnish magic-song formulae commands protective gates and
    fences, invokes Ukko for sky weapons and thunder-fire, calls water, mountain,
    earth, forest, and ancestral powers for armed helpers, and asks Väinämöinen and
    animal helpers to counter sorcerers, witches, wizards, jealous men, and enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage commands gates and a fence to be made of steel or forged work
    and interlaced with snakes whose heads face outward and tails inward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fence is to be lowered or raised so that land snakes, vipers, birds, and
    eagles cannot pass under or over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ukko is invoked from the sky to drop a pipe, copper horn, and golden shield
    for the speaker to put on or dress in, so sorcerers’ arrows and a wizard’s steel
    cannot stick.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker asks Ukko for a golden axe and silver hatchet to cut Tempos and
    devils and to defeat sorcerers, witches, wizards, and evil men with their own
    weapons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ukko is addressed as a high lord, ruler of thunder-clouds, and governor of
    fleecy clouds, and is asked to release sparks, thunder, and fire from the sky
    against hostile magical opponents.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage locates wizards, sorcerers, witches, and jealous men on roads,
    in dells, at water-sides, near the cattle-shed, and along the fence.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A water mistress, also called blue-cap, soft-skirted one, and clean of face,
    is called from waves, spring, and mud to strengthen and support the speaker.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The water mistress is asked to raise men, heroes, bowmen, and swordsmen from
    the sea, landlocked lakes, streams, and wells to oppose the speaker’s enemies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The mountain and the rock are said to contain people and help, and Mountain
    or Mountaineer is asked to provide might and people to aid and surround a man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Old Väinämöinen is called an ancient diviner and is asked to come speak on
    the speaker’s behalf and utter words at the speaker’s side.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Väinämöinen is asked to bring a fiery hound or iron-hued dog to eat spells
    or curses and snap up village sorcerers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker asks Väinämöinen for old folk who have long rested in the earth
    or grove to become the speaker’s people, strength, and nation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker asks for a fiery-edged sword or air’s sword to strip away spell-brought
    harm, hew injuries down, chase corpses of the dead, frighten Hiisi’s folk, and
    drive devils away.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: A black, gold, or iron cock and an iron hen are called from the earth to move
    with the speaker and attack jealous men and sorcerers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Men of the sea and heroes of landlocked lakes are called from gravel and pool;
    they are described with scaly cloaks and sandy shirts and compared in height to
    cloud pillars and great firs.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: A hundred sword-bearing men and a thousand full-grown men of iron are summoned
    to follow the speaker and overcome enemies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Swordsmen, heroes, glaive-men, bowmen, Forest, Wilderness, old man of the
    hill, water-Hiisi, Mistress of water, Chief of the water, maidens, and their folk
    are called to help and to prevent hostile weapons from sticking.
  category: speech
  evidence_refs:
  - ev:10
