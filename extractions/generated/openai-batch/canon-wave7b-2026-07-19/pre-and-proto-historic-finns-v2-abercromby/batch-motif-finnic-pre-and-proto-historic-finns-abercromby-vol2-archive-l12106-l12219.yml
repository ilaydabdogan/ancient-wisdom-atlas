canonical_text:
  quote: ''
  summary: The passage gives formulaic origin accounts for flax grown from ash and
    several variants explaining the cow-house snake or related worms. Source materials
    include burnt worms or horse remains, broken comb or brush parts, hair, tears,
    an oak chip, scum, and wolf slaver on pike bones. These materials are carried,
    sown, hidden, or transformed, producing flax, grubs, worms, or snakes associated
    with cattle-sheds, byres, milk bowls, and pails.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tuoni’s grub or earth-worm is roasted, scorched, baked to ash, and the resulting
    ash is carried to a field and mountain slope.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Flax is sown in the ash of Tuoni’s grub or earth-worm and grows extremely
    high within a single summer night or the space between two days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A black jade or white horse dies; bones singe a meadow, ashes result, and
    flax is sown in the ashes, with Liiko sowing by night and Kauko making it grow
    by day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lass or woman on a cloud or rainbow edge combs her hair; a brush hair or
    comb tooth breaks off and falls into the sea, where wind and water carry it ashore
    into a stony hole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sea-borne broken comb or brush part turns into a distaff and changes into
    a snake, which goes toward the cattle-shed and byre.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The snake lives or moves in byre and cattle-shed spaces, including shed litter,
    hay husks, mangers, milk bowls, and butter-tubs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old woman near a Sound combs her hair; a brush bristle or comb tooth falls
    into the bay or sea, is drifted ashore, and from it an autumn worm or winter snake
    is born.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kuutar or Paivatar sheds a tear that rolls into a dell, and from it an oak
    or verdant shoot springs up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A small man emerges from the sea with a tiny axe, fells the oak, and a chip
    from the oak falls into the sea, becomes foam, and is drifted ashore.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A furious old crone, with a variant identifying her as the harlot mistress
    of Pohjola, picks up the chip or scum, carries it in a pouch, and hides it near
    a cattle-house among litter, dust, and sweepings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: From the hidden material a family is bred and a small white snake is reared;
    it mutters in the byre, crawls to a bowl of milk, and curls round a pail handle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A wolf running on ice and a pike swimming below the ice provide slaver and
    bones; the mixture is carried ashore as scum, gathered by Annikki, taken to a
    cow-house stall, and a tiny white snake is born from it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The harlot mistress of Pohjola combs her hair; a tress falls into the sea,
    is carried by wind and tempest to a rock, and Hiisi’s servant-girl examines it
    and asks what could be made from it.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Seated figures described as a wretch, sneak, and lout answer that grubs or
    earth-worms might come forth from the hair.
  category: speech
  evidence_refs:
  - ev:12
