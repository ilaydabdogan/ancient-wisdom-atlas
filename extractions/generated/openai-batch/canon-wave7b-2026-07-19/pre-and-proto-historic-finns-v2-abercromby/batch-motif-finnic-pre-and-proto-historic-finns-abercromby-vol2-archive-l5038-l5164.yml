canonical_text:
  quote: ''
  summary: The passage contains exorcistic formulae in which Cancer declares an intent
    to harm villagers and Jesus commands it into a dark space beneath a stone. The
    following charms address personified Iron/Steel as a kin-injuring substance, recount
    its origins in milk, water, clay, swamp, and forge-fire, recall its oath not to
    harm kin, and seek to redirect or bind it by covenant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cancer says it is going to a village to bewitch young people's bones, putrefy
    flesh, gnaw joints, and pain nails.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jesus forbids Cancer from going to the village to damage villagers' bones
    and flesh, and commands it to go beneath a boulder or thick flat stone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commanded place of confinement for Cancer is described as a place where
    the moon does not shine and the sun does not illuminate.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Iron, Steel, Slag, Rust, and Dross are addressed as culpable beings that have
    injured flesh, skin, veins, and blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker contrasts the wound to a human body with possible injury to trees
    or stone, stating that Iron did not bite or hack those objects but injured living
    skin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: One origin account says Iron once lay as milk or fresh milk in a young maiden's
    teats or breast, on a cloud-bank under the sky.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another origin account says Iron existed as miry clay or transparent water
    in swamp or mountain settings and was trodden by animals.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iron is described as washed or dug from morass, mud, or clay, carried to a
    smithy, and placed in Ilmarinen's forge-fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the forge context, Iron is said to have sworn not to cut its brother or
    kin, and is then accused of breaking that oath.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A variant has the speaker state that he knows Iron's origin from swamp and
    water, dug it from under the sward, scraped it, and carried it to a smith for
    hammering.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Iron is said to have sworn before God and on the shoe of Kaleva not to harm
    its brother.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The final formula tells witch-sent iron to attack the sender and spare the
    innocent, and asks Iron to make a lasting covenant and sworn brotherhood with
    the speaker.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
