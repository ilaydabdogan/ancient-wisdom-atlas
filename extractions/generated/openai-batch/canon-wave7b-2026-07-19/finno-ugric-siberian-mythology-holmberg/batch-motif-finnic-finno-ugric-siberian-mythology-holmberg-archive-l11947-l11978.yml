canonical_text:
  quote: "“Nourishingmother of the child, eat!”"
  summary: 'The passage reports traditions about a northern figure called the Golden
    old woman and describes Ostiak birth customs centered on the placenta: it is treated
    with special regard, placed in a birch-bark basket with offerings, carried to
    the forest and hung in a tree, personified as the child’s nourishing mother, given
    clothing, addressed by women with food, and sometimes accompanied by a small bow
    and arrows when the newborn is male. The passage also notes similar placenta beliefs
    among Slavs and other peoples.'
