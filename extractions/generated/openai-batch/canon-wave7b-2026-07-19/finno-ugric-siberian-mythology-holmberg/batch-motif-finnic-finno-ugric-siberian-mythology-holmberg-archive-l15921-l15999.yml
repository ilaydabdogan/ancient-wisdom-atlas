canonical_text:
  quote: ''
  summary: The passage surveys tree-of-life imagery across Egyptian, Yakut, Icelandic
    Eddic, Central Asian, Kalmuck, Buriat, and ancient Iranian materials. It describes
    life-giving trees, springs of water of life, birth-and-fate deities near or in
    the tree, eagles and serpents associated with the crown and roots, a central iron
    mountain, first-man traditions, and an authorial proposal that Yakut tales preserve
    Iranian paradise ideas transmitted eastward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient Egyptian pictures are described as showing a date-palm partly tree
    and partly woman, nourishing its ward with what produces eternal life, sometimes
    at the brink of the spring of the water of life.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yakut tree of life is described as having a goddess appearing from its
    roots.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yggdrasil is described as the greatest and best tree, with branches covering
    the whole earth and rising over the heavens, a tall trunk hidden by white fluid,
    and the capacity to stagger first when the world ends.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Under Yggdrasil is the spring Urdarbrunn, and beside it under the roots live
    three deities of birth and fate, the Norns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that Yggdrasil and the Yakut tree of life are identical
    in detail except that the Scandinavian poem has three goddesses under the tree
    while the Yakut material has one goddess.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Eddic eagle sits in the tree crown, while the Nidhugg snake is under the
    roots.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Kalmuck account places a dragon in the sea at the foot of the Zambu tree,
    waiting for falling leaves; leaves it misses sink and become gold.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Buriat poems place the Abyrga snake at the foot of the tree in a lake of milk.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Certain Central Asian tales describe the Abyrga snake twining around the tree
    while the Garide eagle lives in the crown and attacks it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Garide is described as causing storms when flying furiously and is identified
    in the passage with the Indian Garuda, the robber of Soma.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: West Siberian peoples are said to place the mighty tree on an iron mountain
    rising from the centre of the earth-disc.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ancient Persian literature is said to call the central mountain Hara Berezaiti,
    the iron mountain, with the tree of life on its summit and the spring Ardvisura
    under the tree.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Iranian paradise on the mountain is said to be inhabited by the first
    man, Gajomartan, who is described as a white being.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The author proposes that the tale spread from Iranians to Turco-Tatar peoples
    and then with the Yakuts to the River Lena.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: In Yakut conception, the First Man and all animals of creation dwell near
    the tree, which is regarded as the nourisher of them all.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: A variant says the Over-god and Kybai-Khotun, goddess of Birth and Fate and
    also the name of the spirit dwelling in the tree, gave birth to the first man
    in the third heaven and lowered him to earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Another version is described as preserving details in which the ancestor of
    the human race appeared in life-giving surroundings and inferred that he had been
    born there.
  category: sequence
  evidence_refs:
  - ev:7
