canonical_text:
  quote: ''
  summary: The passage surveys Siberian, Tungus, Yakut, and Buriat beliefs about hereditary
    shamanic calling, the special shaman-soul or soul-bird, burial and sacrificial
    rites for shamans, thunder-given shamanic power, female shamans, deceased shamans
    as protective spirits, clan obligations tied to shamanic origin, animal protectors,
    and inherited household spirit-images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, among Siberian peoples generally, only someone from
    a family or clan that has earlier contained shamans can become a shaman; shamanic
    talents do not appear in every generation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tungus at the Yenisei explain that if a shaman is buried in the earth
    rather than on an erection in the air, the shaman’s “loom,” described as a soul-bird,
    will not return to the family.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The reappearance of the loom in a family is regarded as a great honor, and
    the loom is identified as the wandering soul of the deceased shaman.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the loom appears to someone, meaning that shamanic gifts become apparent,
    a wooden image of the bird is made and a reindeer is sacrificed to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The loom becomes the protective spirit of the new shaman, and the passage
    says the shaman possesses a special shaman-soul in addition to ordinary human
    souls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the shaman-soul is considered more immortal than other
    souls, making special burial ceremonies necessary for a shaman.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Yakuts sometimes call the shaman-soul sur, locate its seat in the shaman’s
    head, and preserve a tale in which a great shaman received his head in the Heaven
    of Manariks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: According to the Buriats, a person frightened out of his wits by violent thunder
    receives special shamanic talent; according to the Yakuts, such persons have received
    sur from Ulu-Tojon, the thunder god.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Female shamans are also present, usually under names different from male shamans,
    and some Buriat female shamans became famous and were worshipped after death by
    relatives.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Buriats say that each place, family, and tribe has individual Zajans,
    protective spirits of deceased male and female shamans, buried on adjoining heights
    where their ongon images were also placed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ordinary Buriat men or women may also become Zajans after death when special
    ceremonies are performed in their honor, by the power of shamanic origin and protective
    powers for survivors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Each Buriat family or clan has its own Utkha, or shamanic origin, which imposes
    special duties on members.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Sartul family is said to avoid consuming animal blood and especially the
    blood of its shaman animals because its shaman-Utkha forbids this.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A Buriat khubilgan is an animal or bird regarded as protecting a shaman; examples
    given are snake, vulture, and frog.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Household Ongons are worshipped by family members and preserved in the tent,
    often as a sheepskin bearing tinplate or painted figures of humans and other things.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: The household Ongons are inherited together with the tales and traditions
    attached to them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: Among the Buriats of the Khangin clan, an Ongon called Borto is found in nearly
    every dwelling and is said to have been carried from Mongolia by the forefather
    Khorton, a great shaman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: Prayers to Borto begin by invoking the Utkha of the Khangins, the Sen-Serel
    bird, the Utkha of the Serel Mongols, and the Khun-Khorel bird.
  category: speech
  evidence_refs:
  - ev:6
