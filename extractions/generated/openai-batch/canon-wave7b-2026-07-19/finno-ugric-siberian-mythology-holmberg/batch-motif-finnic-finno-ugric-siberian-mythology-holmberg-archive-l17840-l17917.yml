canonical_text:
  quote: ''
  summary: 'The passage reports Radloff’s descriptions of Turco-Tatar, Altaic, Mongol,
    and Buriat heavenly orders: an Over-god or creator with divine sons and descendants
    occupying layered heavens; sacrifices offered to gods; Kara-Khan departing from
    heaven to the underworld; variant lists of seven, seventeen, and nine heavenly
    levels or divine sons; and the author’s comparisons of these figures with Babylonian
    planetary gods and related regional deities.'
  language: English
  quote_policy: summarized
