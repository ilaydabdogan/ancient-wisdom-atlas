candidate_motifs:
- id: motif:1
  label: divine father with multiple divine sons
  taxonomy_refs:
  - divine_parent_child
  basis: The passage names the creator Kudai Bai-Ulgon as father of four sons and
    also discusses groups of seven or nine sons, servants, brothers, or Tengeri.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: high
  cautions: The passage is a comparative survey and includes multiple regional variants
    rather than a single narrative version.
- id: motif:2
  label: layered heaven inhabited by ranked deities
  taxonomy_refs: []
  basis: Named gods, luminaries, and messengers are assigned to different storeys
    of heaven in seven- and seventeen-storey descriptions.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: No supplied taxonomy reference directly names layered heavens; the motif
    label remains descriptive.
- id: motif:3
  label: sacrifice to heavenly gods
  taxonomy_refs:
  - sacrifice
  basis: The passage describes horse and grain sacrifices to Ulgon and other gods.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage lists ritual offerings but does not narrate an enacted sacrificial
    episode.
- id: motif:4
  label: divine son’s descent from heaven to underworld
  taxonomy_refs: []
  basis: Kara-Khan, a son of Kudai Bai-Ulgon, is said to leave heaven and remove to
    the underworld or Hades.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives only a brief notice and does not provide a full descent
    narrative.
- id: motif:5
  label: astral gods corresponding to heavenly levels
  taxonomy_refs: []
  basis: The passage associates heavenly storeys with the sun, moon, stars, and planet
    gods, and cites nine great stars corresponding to nine Tengeri.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:11
  confidence: medium
  cautions: Much of the astral identification is the author’s comparative interpretation,
    not solely an emic description.
comparison_claims:
- id: claim:1
  claim: The author claims that the gods dwelling in seven storeys of heaven point
    to Babylonian Planet gods ruling seven sky-discs arranged one above another.
  claim_level: historical_contact
  target: Babylonian Planet gods and seven sky-discs
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author’s diffusionary interpretation; the passage does
    not supply independent historical evidence beyond the asserted resemblance and
    origin from elsewhere.
- id: claim:2
  claim: Mergen-Tengere is said to remind the author of the Ostiak Arrow-sacrifice
    Torem.
  claim_level: same_function
  target: Ostiak Arrow-sacrifice Torem
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The passage phrases the comparison as a resemblance and immediately
    raises a question about a possible lightning deity, without firm identification.
- id: claim:3
  claim: The passage identifies Mongol Kisagan-Tengri as corresponding to Kysagan-Tengere
    and describes the Mongol figure as a war god.
  claim_level: same_function
  target: Mongol Kisagan-Tengri
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to naming correspondence and war-protective
    function as described in the passage.
- id: claim:4
  claim: The author suggests that if Kysagan-Tengere and related figures were originally
    star gods, Kysagan-Tengere’s counterpart would be Babylonian Nergal, identified
    with Mars.
  claim_level: same_function
  target: Babylonian Nergal / Mars
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: The passage frames the claim conditionally with 'if' and 'as seems
    probable,' so it should be treated as speculative.
- id: claim:5
  claim: The author suggests that Kara-Khan may correspond to Saturn, called the black
    star by the ancient Babylonians, because of his color and other attributes.
  claim_level: same_function
  target: Saturn as the Babylonian black star
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The passage uses cautious language, and the supporting details are
    limited to color, descent to Hades, and unspecified attributes.
- id: claim:6
  claim: The passage connects the Mongol group of nine Tengeri with nine great stars
    and with an expanded group of planetary gods associated with weekday names.
  claim_level: same_motif
  target: Nine planetary or star gods corresponding to nine Tengeri
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The author notes that the Buriat names are artificial and vary by district,
    and that the group of nine is less common than the group of seven.
