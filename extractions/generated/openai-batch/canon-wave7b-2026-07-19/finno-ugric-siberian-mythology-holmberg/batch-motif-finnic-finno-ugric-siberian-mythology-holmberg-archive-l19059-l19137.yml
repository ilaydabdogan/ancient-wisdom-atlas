  summary: 'The passage surveys star and Milky Way traditions: separated lovers divided
    by a heavenly river and reunited yearly by a bird bridge; a straw-thief tale explaining
    the Milky Way as a spilled trail; later names for the Milky Way as pilgrimage
    road, Burkhans'' road, God''s footprints, and ski-track; Vogul and Ostiak stories
    of a six-footed stag hunted across the sky, with the Great Bear, Milky Way, and
    Pleiades identified in the sky; and the beginning of a note on Central Asian twelvefold
    animal-named time periods.'
