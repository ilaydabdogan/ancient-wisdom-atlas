candidate_motifs:
- id: motif:1
  label: bear feast after the hunt
  taxonomy_refs: []
  basis: The bear or its skin is installed in a sacred part of the dwelling, fed,
    displayed, decorated, and honoured with several days of festivals, songs, dances,
    and banquets.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is a survey account and summarizes several peoples' practices
    together.
- id: motif:2
  label: feeding and addressing the animal so others will come
  taxonomy_refs:
  - sacred_exchange
  basis: The bear receives salt fish and is asked not to report that it received nothing;
    the speech says other bears may also come and be fed.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The sacred_exchange taxonomy mapping is interpretive; the passage itself
    gives the literal feeding and speech.
- id: motif:3
  label: protective purification around animal remains
  taxonomy_refs: []
  basis: The passage describes alderwood, water, smoke, metal objects, covered eyes
    and nose, claw rings, purification, and sprinkling as protective or purifying
    acts around the bear-skin and participants.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: Individual practices vary by named group and are not all performed by
    every group in the passage.
- id: motif:4
  label: waking the dead or killed bear
  taxonomy_refs: []
  basis: During image-making, a man strokes the bear's head with dry branches, explicitly
    described as waking it so it knows they have arrived at the village.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explain a wider doctrine behind the waking action.
- id: motif:5
  label: covered senses of the bear as protection
  taxonomy_refs: []
  basis: The bear's eyes and nose are covered with bark, coins, and tin-plate, and
    the passage compares this to a protective practice used at burial feasts.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage notes the comparison but says the derivation is difficult.
- id: motif:6
  label: postmortem bear life narrated in performance
  taxonomy_refs: []
  basis: Bear songs describe birth, adventures with hunters, and life after death,
    while dances imitate bear actions and later ceremonies picture the bear's life
    and hunting.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage does not provide the contents of the songs beyond summary
    topics.
- id: motif:7
  label: masking to avoid recognition by an offended animal spirit
  taxonomy_refs: []
  basis: Vogul masked performers alter their voices and pretend to be distant travellers
    so the bear will not recognize them, with the passage explaining this as fear
    of postmortem vengeance.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage attributes this explanation to the bear-feast context and
    does not compare it to a broader mask tradition beyond this ceremony.
comparison_claims:
- id: claim:1
  claim: The passage presents the bear-feast ceremonies of the other peoples mentioned
    as corresponding in their main points to the Lapp bear-feast account.
  claim_level: same_motif
  target: Bear-feast ceremonies among Lapps and the other named peoples in the passage
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is broad and the passage then lists group-specific practices
    rather than a complete one-to-one comparison.
- id: claim:2
  claim: The passage explicitly compares the Finnish chewing of alderwood with the
    Lapp protective use of alder-bark as resembling practices.
  claim_level: same_function
  target: Lapp alder-bark protection and Finnish alderwood chewing before bringing
    in the bear-skin
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states resemblance but does not derive one practice from
    the other.
- id: claim:3
  claim: The passage compares covering the bear's eyes and nose among Ostiaks and
    Voguls with protective covering of the dead at burial feasts.
  claim_level: same_function
  target: Ostiak/Vogul covering of bear's eyes and nose and burial-feast covering
    of the dead
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and analogical within the source; the
    passage says the custom is difficult to derive.
