canonical_text:
  quote: ''
  summary: The passage describes bear-feast practices among Lapps, Finnish people,
    Ostiaks, and Voguls. A bear is addressed and fed, its skin or head is placed in
    a sacred part of the dwelling, and protective acts using alderwood, smoke, water,
    metal objects, bark, coins, and coverings are performed. The bear-skin is displayed,
    decorated, given food and drink, and honored with several days of feasting, songs,
    dances, imitation, and, among the Voguls, masked dramatic performances intended
    to conceal the actors from the bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bear is bowed to, a piece of salt fish is placed in its mouth, and words
    are spoken to it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The words addressed to the bear ask it not to say at home that it visited
    and received nothing, and say that others may come and be fed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says a common custom is to place the bear, its head, or its skin
    in the sacred back part of the dwelling during the feast, where women are not
    allowed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Finnish custom is to chew alderwood before the bear-skin is brought into
    the house, so that the forest will not infect anything.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Ostiaks, villagers meet returning huntsmen with a dish of water
    and smoke, and the bear-skin is smoked and sprinkled three times with water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that metal objects are widely used as means of protection
    in these bear-feast practices.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Ostiak custom cuts a picture of the bear on a flat surface of a tree-trunk
    and cuts as many lines over it as there were hunters in the kill.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While the bear picture is being made, a man strokes the bear's head with dry
    branches to wake it and let it know that the hunters have reached the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among Ostiaks and Voguls, the bear's eyes may be covered with birch-bark or
    silver or copper coins, and its nose with tin-plate fastened by threads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The prepared bear-skin is placed in the sacred back part on a low table with
    the head resting on the forepaws, and a many-coloured cloth is spread over its
    back.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: In some districts, a male bear receives a hat and muffler, while a female
    bear receives a shawl and pearl necklace.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women and children put brass rings on the bear's claws so that it will not
    scare them during berrying time in summer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Food and drink are placed before the bear, neighbours bring offerings, and
    the skin remains in the house for three or four days while evening festivals,
    banquets, and merriment are held in its honour.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Festival participants must arrive purified and are sprinkled with water as
    they enter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Bear songs describe the bear's birth, its adventures with the hunters, and
    its life after death.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Dancers wear bear-skins turned inside out and imitate the bear and its actions
    with distinctive movements.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Among the Voguls, bear-feast games have developed into a drama in which masked
    men appear.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The Vogul masks are made of birch-bark, usually with large noses, painted
    with charcoal and red earth, and sometimes furnished with beards of reindeer-hide
    or oakum.
  category: object
  evidence_refs:
  - ev:10
- id: obs:19
  text: The masks, altered voices, and claims to be distant travellers are said to
    hide the actors from the bear, especially if the bear is offended by the play.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: The passage states that the mask custom is rooted in fear that the bear might
    recognize its killers after death and avenge itself.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:21
  text: The passage says that later additions were made to the older ceremonies picturing
    the life and hunting of the bear, including some forms borrowed from Russian baptism
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:12
