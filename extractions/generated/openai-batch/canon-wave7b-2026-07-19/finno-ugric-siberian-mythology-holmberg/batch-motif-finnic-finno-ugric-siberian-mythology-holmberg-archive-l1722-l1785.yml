canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and Siberian death and burial practices:
    boats supplied for the dead and boat remains over graves, Lapp sleigh coffins,
    hollowed tree-trunk coffins, linguistic evidence for laying out corpses, and reports
    of cremation among Baltic Finns and Esthonians, with other Finno-Ugric cremation
    linked to dangerous dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karjalainen is reported as arguing that a land of the dead reached over water
    is not an original Ugrian belief; he explains the boat given to the dead as needed
    in the world beyond for procuring means of existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Russian Karelia, remains of boats have been found capsized, often broken
    in two, over graves and not used as coffins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Ugrians buried their dead in boats, while Lapps used sleighs
    as coffins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In more remote districts, Lapps are said still to bury the dead in sleighs,
    with sods of earth and tree stumps placed around them as protection against beasts
    of prey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead are sometimes said to have been buried sitting in a sleigh to which
    a reindeer was harnessed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A very old custom among Finno-Ugric stocks is described as using a hollowed
    tree trunk or trough as a protective covering for the dead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Many dead were buried between two hollowed logs, the lower log forming the
    coffin and the upper log the lid.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among Siberians, such a coffin is described as erected above the ground on
    two or four pillars.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A word group is cited with meanings including corpse, grave, death, and scent
    of death in Samoyed, Mordvin, and Finnish; Setälä interprets the original meaning
    as corpse or dead one and connects it with an older practice of laying out the
    body.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Reliable reports of burning bodies are said to be found only among the Baltic
    Finns, and burnt bones have been found in certain ancient graves in Finland.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Henry the Lett is cited as saying that Esthonians exhumed dead previously
    buried in cemeteries and burned them in their old heathen way after returning
    to old beliefs during the Crusades period.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Other Finno-Ugric peoples are said to have burned bodies only when the dead
    were supposed to be dangerous to the survivors.
  category: relationship
  evidence_refs:
  - ev:7
