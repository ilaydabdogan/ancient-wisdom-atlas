comparison_claims:
- id: claim:1
  claim: The passage itself presents a shared North Siberian pattern in which water-birds
    are sacred and subject to avoidance rules such as not pointing at them or naming
    them.
  claim_level: same_function
  target: Tungus and other North Siberian sacred water-bird taboos
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is broad; the passage gives Tungus details and generalizes
    to many other North Siberian peoples without listing all local variants.
- id: claim:2
  claim: The passage presents Yakut and Buriat eagle traditions as functionally related
    forms of eagle reverence and dread, while giving different examples for each group.
  claim_level: same_function
  target: Yakut and Buriat eagle reverence and shamanic-bird pattern
  evidence_refs:
