canonical_text:
  quote: ''
  summary: The passage surveys Siberian and Altaic beliefs about sacred shamanic animals,
    especially birds. It describes taboos against harming or naming certain birds,
    tales of punishment for mistreating swans and eagles, offerings and burial rites
    for eagles, and a Buriat swan-woman tale in which heavenly swans become women,
    one is detained through theft of her swan-garment, marries a hunter, bears children,
    and later returns to Heaven after recovering the garment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animals, especially birds connected with shamanic beliefs, are not to be killed
    or molested, because sickness or misfortune may result.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Tungus and other North Siberian peoples, certain water-birds, including
    the loom, sea-gull, swan, and crane, are treated as sacred; pointing at them and
    mentioning their names are avoided.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Buriat tale says that a swan whose nest was damaged carried a burning brand
    and dropped it on a house, burning the whole village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yakuts and Buriats treat the eagle with extraordinary respect and dread; Buriat
    traditions call it Olkhon island’s master, the son of the god on Olkhon island,
    and in some myths the first shaman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who drove an eagle away from his cow’s carcass later became seriously
    ill and learned in a dream that the illness was caused by his treatment of the
    eagle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Buriats throw milk or kumiss into the air when a swan or eagle flies over
    their village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Yakut who finds a dead eagle or its skeleton is said to bury it on a wooden
    erection or in a tree, in a manner formerly used for human beings and especially
    shamans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage notes that shaman animals are not always easy to distinguish from
    animals regarded as forefathers or foremothers of a clan or people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Buriat tales, three swans came down from the sky to bathe in a lake, removed
    their swan-garments, and became three fair women.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A hunter hidden on the shore took and hid one of the swan-garments.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The swan-woman whose garment was missing could not fly away, remained on earth,
    married the hunter, and bore eleven sons and six daughters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After a long time, the wife asked about her former garment; her husband returned
    it, and after putting it on she flew up through the smoke-hole.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The departing swan-woman declared that the others were earthly beings who
    must remain on earth, while she was from Heaven and was flying back home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The swan-woman instructed those left behind to carry out ceremonies in her
    honour each spring and autumn when swans migrate, then blessed her children and
    disappeared into the sky.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: One daughter tried to stop the swan-woman by grasping her feet; because the
    daughter’s hands were dirty, the feet became black and are said to have remained
    so.
  category: sequence
  evidence_refs:
  - ev:9
