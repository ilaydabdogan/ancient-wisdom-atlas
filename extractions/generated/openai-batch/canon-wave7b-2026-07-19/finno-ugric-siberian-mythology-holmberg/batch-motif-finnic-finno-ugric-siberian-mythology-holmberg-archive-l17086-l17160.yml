canonical_text:
  quote: ''
  summary: The passage gives several related origin accounts for mosquitoes and other
    insects. In one tale, a bird traps and kills a man-eater, burns his body, and
    the spirit foretells that the ashes will become mosquitoes. Altai Tatar, Yakut,
    Mongol, and Golde variants describe heroes or avengers killing man-eating giants
    or demons; their blood, bones, flesh, or fragments become mosquitoes, gnats, flies,
    beetles, and other destructive creatures.
  language: English
  quote_policy: summarized
