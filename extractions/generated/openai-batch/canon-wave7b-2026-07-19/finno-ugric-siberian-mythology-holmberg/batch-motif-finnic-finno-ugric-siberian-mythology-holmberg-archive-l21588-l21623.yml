canonical_text:
  quote: ''
  summary: A plate caption describes a Yakut shaman's bird-type dress with feather-like
    fringes and says that, when dressed in it, the shaman could fly wherever desired.
    The passage then narrates a bird that places a man in a tree and torments him;
    a heroine confronts the bird, which transforms its wings into iron feathers as
    a shaman costume. The heroine finds an unprotected spot on the bird's breast and
    shoots it; the bird falls and becomes a flame of fire. A concluding note says
    that souls on dream-voyages may encounter nests of evil spirits, an idea associated
    by the author with nightmares and fever-visions.
