canonical_text:
  quote: ''
  summary: The passage gives a plate caption for Cheremiss priests at a Nature-Gods
    festival, then notes details of sacrificial practice including a liver placed
    on a stick and the trial by water of a sacrificial animal among Volga peoples,
    compared in the passage to ancient Greeks. It then describes the Lapp shaman or
    noidde as a necessary medium for consulting spirits, sometimes a sacrificing priest,
    a high-status figure with mountain-related titles, and a recipient of hospitality,
    taxes, and rewards for services such as finding lost objects, curing sickness,
    and offering sacrifice; neglecting him was believed to risk misfortune.
  language: English
  quote_policy: summarized
