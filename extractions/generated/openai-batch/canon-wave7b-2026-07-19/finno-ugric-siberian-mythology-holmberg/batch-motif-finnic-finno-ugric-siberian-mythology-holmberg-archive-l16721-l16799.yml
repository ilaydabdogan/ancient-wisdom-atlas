canonical_text:
  quote: ''
  summary: 'The passage presents several Central and Northern Asian creation-of-man
    tales. In these accounts a deity or creators make human bodies but lack a spirit
    for them, leave a hairless or naked dog as guardian, and an opposing figure such
    as the devil or Erlik bribes the dog and animates the humans by breath, reed,
    smoke, flute, or music. A frog advises Ulgen to spare living humans. The author
    also summarizes two tale cycles: one in which the devil soils the God-created
    body, and one in which the devil gives life to a God-created human, both used
    to explain human deficiencies. A final Altaic story links Maidere, seven men and
    trees, a golden mountain, and Erlik’s animation of woman to an explanation of
    woman’s tempers and moods.'
  language: English
  quote_policy: summarized
