canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric, Central Asian, and Siberian descriptions
    of the realm of the dead, including an underground world with rivers and dim light,
    a multi-storeyed cosmos, Erlik-Khan and evil spirits, shamanic routes through
    central holes and a world-tree, heavenly afterlives resembling earthly life, special
    heavenly destinations for those who die violently, and the opening of a Buriat
    tale in which Mu-monto travels toward the realm of the dead to recover a sacrificed
    horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The underworld is described with dim light from rotted trees, underground
    rivers with strange fishes, and an underground Yenisei that reflects the Yenisei
    District but flows in the opposite direction.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seven grottoes are connected with seven or nine underground storeys beneath
    the earth, corresponding to a similar number of heavenly planes above.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Central Asian peoples are said to regard the underworld as populated by evil
    beings and ruled by Erlik-Khan, who sits on a black throne with a court of evil
    spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Erlik-Khan's command, evil spirits travel at night to the world of the
    living, seize a soul, and carry it to their home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ruler over the dead is said commonly to have power only over those who
    were wicked in life, while those who did more good than evil are taken after death
    to heavenly dwellings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The path to both underground and heavenly dwellings is believed to pass through
    a hole in the middle of each plane; the Ostiaks call the sky seven-holed, and
    the Chukchee place each hole under the North Star.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A shaman may use the underworld hole at the center of the earth, and shamanic
    equipment may include an earth-disc with a round hole at its center.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Altai shamans travel heavenward by a divided world-tree, and Dolgan accounts
    say shamans escort dead souls to this tree, where the souls continue life as little
    birds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Heavenly life is described as resembling earthly life: souls fish in lakes,
    possess cattle and houses, have spouses and children, visit one another, and drink
    spirits.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chukchee heavenly spirits live in families and fish or hunt; sometimes their
    game consists of human souls that they carry to a storey of the sky, from which
    only a clever shaman can save them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that many peoples believe those who die in war or by accident
    go to Heaven, while some North-East Siberian groups distinguish violent death
    from natural death in afterlife destination.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The Chukchee identify the Aurora Borealis chiefly as the home of those who
    die a violent death.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that the most original views do not treat the realm of
    the dead as a place of restitution for sins, with exceptions among some Altaic
    peoples influenced by other teachings.
  category: other
  evidence_refs:
  - ev:11
- id: obs:14
  text: In a Buriat tale, the hero Mu-monto is sent by his father through the realm
    of the dead to demand back a horse sacrificed at the burial of his father’s father;
    the route begins due north and includes a large black stone.
  category: sequence
  evidence_refs:
  - ev:12
