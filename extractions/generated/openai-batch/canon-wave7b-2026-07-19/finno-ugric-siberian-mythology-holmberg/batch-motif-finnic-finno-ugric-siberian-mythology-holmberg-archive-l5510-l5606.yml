    home like a bride in a sleigh with two horses and bells while women wear wedding
    costume.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Vorsud feast is called mudor suan, “mudor wedding,” and modern hut inaugurations
