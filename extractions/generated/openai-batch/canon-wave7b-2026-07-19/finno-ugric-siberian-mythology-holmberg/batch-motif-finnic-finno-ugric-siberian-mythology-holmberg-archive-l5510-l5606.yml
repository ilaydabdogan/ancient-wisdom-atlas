canonical_text:
  quote: ''
  summary: The passage describes Votiak rites for transferring the Vorsud or family
    protector when a son leaves his father’s home to found a new household. It records
    transfers of bread, hearth ashes, a wooden chip, earth, fire, sacrifice-case contents,
    and possibly family-spirit images; it also describes wedding-like ceremonies,
    protective home-earth customs among related groups, and comparisons with other
    traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies a Votiak case for the Vorsud or “Luck-protector”
    with offerings on a sacrifice shelf, and a Votiak village or Great Kuala.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son separated from his father’s home receives bread, carves a chip from
    a wooden pot hanger, takes ashes from the hearth, and carries the chip and ashes
    to the newly founded kuala.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The person who carries the Vorsud must not put his foot on bare ground and
    must walk on planks laid on the ground.
  category: action
  evidence_refs:
