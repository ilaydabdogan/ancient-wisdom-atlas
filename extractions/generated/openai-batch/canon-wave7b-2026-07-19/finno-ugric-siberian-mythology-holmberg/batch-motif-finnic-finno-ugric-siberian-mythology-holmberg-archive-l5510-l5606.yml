  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a removal ceremony reported by Aminoff, a son leaves his father’s home,
    descends under the hut floor, takes earth and hearth fire, and prays to the son
    of the family spirit to accompany him to the new home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Siryan person leaving home for a long journey may take earth from under
    the home’s earth foundation, and the earth is said to protect from accidents and
    nostalgia.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among Ingrians, a bride going to a strange neighborhood may receive earth
    from under her native hut, and a domestic animal moved to another farm may be
    accompanied by earth from its former outhouse so it will not miss home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says that early founders of new families seem to have received
    one or more images of family spirits, and that Lapps believed such images descended
    as inheritance from father to son.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Votiak traditions say that a son leaving the father’s home was given part
