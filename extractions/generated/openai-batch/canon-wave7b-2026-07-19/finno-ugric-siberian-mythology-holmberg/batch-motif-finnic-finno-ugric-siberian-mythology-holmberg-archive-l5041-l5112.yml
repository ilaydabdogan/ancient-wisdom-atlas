  summary: The passage defines family gods as family-specific tutelary beings represented
    by images kept at or near the home and sometimes carried during movement. It describes
    Lapp Seide hierarchy, Samoyed portable and sacrificed-to images, Ostiak and Vogul
    storage and feeding practices, and Votiak family gods identified as forefathers
    housed in a kuala shrine building.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Family gods are described as tutelary genii worshipped by each separate family,
    with images kept at home or nearby and carried when the family removes from one
    place to another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Lapps by Torne Lake, one god was described as highest and foremost
    and worshipped by the whole village; family gods stood in lower places, and the
    passage says it is uncertain whether Lapps carried them or kept them in tents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Samoyed family gods are described as wooden images or stones, sometimes up
    to fifteen dolls held by the father of a family, generally dressed in reindeer
    skins or cloth gowns wrapped or tied rather than sewn.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Samoyeds travel, the gods are conveyed in special sleighs, and the sleigh
    of the gods must be last in the caravan; the images receive new clothes yearly
    and sacrifices from time to time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During Samoyed sacrifice, the images are taken from the sleigh and set on
    a temporary dais or placed in the tent’s sacred background; when reindeer are
    sacrificed, the mouths of the images are smeared with blood and lard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Samoyeds make images of family gods, a shaman must conjure a spirit to
    live in them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Samoyed family gods may have small lead arms and tools nearby, as well as
    images of animal spirits for company and help.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Northern Ostiaks are described as preserving and carrying family gods in a
    special sleigh, while Ostiaks and Voguls more commonly keep them in the dwelling-house
    near the back part of the tent, in a chest or case, and later also in a barn or
    attic.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ostiak and Vogul family gods may be made of wood, metal, hides, and other
