canonical_text:
  quote: ''
  summary: The passage describes northern afterlife imagery around Pohjola and a Russian
    Karelian death-song in which the soul travels through a detailed otherworld route
    with holy escorts, water crossings, forests, marshes, serpents, paths, a bridge,
    cleansing water, food, milk rivers, honey-fruit trees, and a balance that weighs
    life events. It also reports older beliefs that postmortem destination could depend
    on manner of death, with violent or lightning death leading upward or to heaven
    and natural death leading downward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pohjola is described as entered through a gate and as a place breeding sickness
    and death, including a man-eating village ruled by Pohjan-akka or Pohjan-emanta.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that beliefs from Greek mythology and an eastern paradise
    tradition, mediated through the Russian Orthodox Church, entered Russian Karelian
    views of life beyond.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the death-song, the deceased is asked whether archangels, angels, apostles,
    Peter, Paul, Abraham, and Isaac met or took the soul with ritual objects such
    as candles, golden plates, golden eggs, and keys.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The song asks whether the deceased had redeemed guides to the other world
    during life and whether berries refreshed the soul after earlier generosity with
    berries.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The way to the other world leads over roaring rapids and swift streams, with
    escorts using oaken boats and golden oars.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the river, the route includes a dense forest, then wide bubbling marshes
