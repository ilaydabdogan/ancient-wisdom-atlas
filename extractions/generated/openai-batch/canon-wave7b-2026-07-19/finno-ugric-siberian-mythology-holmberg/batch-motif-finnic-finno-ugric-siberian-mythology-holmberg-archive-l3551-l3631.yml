  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the eastern end of the table stands a balance in which the events of life
    are weighed, with the song asking whether the deceased had redeemed favorable
    weighers.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports that in an older pagan period separate worlds for good
    and bad dead were unknown, but different worlds were associated with the cause
    of death.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Cheremiss and Ostiak examples say that those killed in battle, by lightning,
