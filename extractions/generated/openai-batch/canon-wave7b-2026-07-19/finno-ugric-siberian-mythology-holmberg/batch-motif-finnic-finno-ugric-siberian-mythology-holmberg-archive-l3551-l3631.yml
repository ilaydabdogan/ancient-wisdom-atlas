    the marsh.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The right-hand road leads to a blue bridge with reed parapets and to a spring
    with a golden ladle for cleansing the besmirched soul.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The soul is offered a fishbone bed for rest after the bridge and cleansing
    spring.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Beyond these stations are lush grass, wide fields, an enormous table, food
    that satisfies by breath, rivers of milk, and a tree for each soul bearing honey-sweet
