canonical_text:
  quote: ''
  summary: The passage surveys crop-related rites and personifications among Cheremiss,
    Mordvins, Siryans, Esthonians, Finns, Swedes in Finland, and related Finnish-stock
    peoples. It describes autumn horn use and attempted horn theft for corn-luck,
    harvest divination by listening to the corn-mother during rye flowering, female
    and animal corn spirits, preservation of the last sheaf as a corn-deity, straw
    dolls or old men used at seasonal festivals, new-flour cakes preserved until sowing,
    and an Esthonian straw figure carried to the wood for crop growth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Northern Cheremiss blow horns after the conclusion of field-labour in autumn
    and keep them for the next year in a secret place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the described dangerous time, the horns may not be blown.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of a wedding procession escorting a bride to the bridegroom's village
    attempt to steal the horns from her home because they believe the horns carry
    corn-luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Mordvins say that absolute silence during the flowering of rye allows
    one to hear from the corn-mother what kind of harvest to expect.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Mordvin account, whistling from the field foretells a good year, while
    weeping and wailing signify famine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Siryans describe Poloznitsa as a female spirit dwelling in rye-fields
    who punishes anyone harming the rye during flowering.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A blue flower growing among the corn is called Poloznitsa's eye.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Esthonians speak of spiteful Corn virgins wandering in the fields and of a
    Corn wolf, also called Pea wolf and Bean wolf, used to frighten children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Finns in Osterbotten say that the person who cuts the last stalk in the rye-field
    or oat-field catches a hare.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Among Esthonians, the animated last sheaf is called rye-pig.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that Baltic Finns, like Teutons and Slavs, preserve the
    last sheaf of the corn-field and regard it as a kind of corn-deity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Finns are said to place a sheaf from the previous autumn on threshing-shed
    rafters, bring it into the dwelling-house at Christmas, use its grain to begin
    spring sowing, and hide some of its straw in the corn-field.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A widespread custom among Baltic and Volga Finns preserves the last sheaf
    undisturbed until the next year so that the corn will thrive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Among Esthonians, such a preserved sheaf is called threshing-shed father.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Swedes in Finland make a human-like Christmas old man of straw, set it in
    the place of honour at the head of the table, and treat it with drink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Finns prepare a corresponding straw doll on Kekri or Keyri, called the Keyri
    old man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: At Christmas and Kekri there is a custom of placing straw on the dwelling-room
    floor and baking a large new-flour cake, sometimes resembling an animal such as
    a Christmas pig or Christmas bull.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The festival cake is kept on the table during the holiday and then preserved
