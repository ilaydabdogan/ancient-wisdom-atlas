  quote: ''
  summary: The passage describes memorial-feast customs involving representations
    of the deceased through clothing, images, dolls, a living substitute, or a written
    name; timed feasts on funeral and later ordinal days or nights; required animal
    killing; food and drink offerings with petitions to the dead; and a Sarapul belief
    that earlier dead relatives meet and feast with the newly deceased.
  language: English
