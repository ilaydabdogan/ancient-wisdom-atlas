canonical_text:
  quote: ''
  summary: 'The passage describes Lapp beliefs and practices concerning Seides: spirits
    associated with stones and mountain places, animated holy stones that could move,
    feel, be punished, or be destroyed, reports of first-seen objects worshipped as
    temporary gods, and wooden Seides or sacrificial posts made from stumps or posts,
    sometimes human-like and smeared with blood.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Swedish Lapmark account says Seide spirits live in places on high mountains
    that people cannot reach.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The account says people smeared a stone with blood from a reindeer sacrificed
    in honor of the Seide and threw the stone high up on the mountain where the Seide
    spirit dwells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Seide stone could move about and that passing over the
    holy stone’s “wander-path” was dangerous for a human being.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone was described as impressionable and capable of feeling, and it could
    be punished by striking it or hammering pieces from it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: If regarded as a dangerous neighbor, the Seide stone could be destroyed by
    shattering, burning, or throwing it into water; the passage calls this the death
    of the Seide.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An inherited tradition from near Sompio Lake says that the first object seen
    on leaving the tent, such as a stone or tree stump, could be worshipped as a god.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same tradition says that on the next morning a new god could be adopted
    if the first glance fell on another object.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the Lapps also had wooden Seides, either tree-stumps embedded
    in the ground or posts driven into it, and that these did not appear to have a
    definite shape.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Posts resembling human beings were reported on an island in the foaming Darra
    rapids in the Tarne River; they stood in a line, one man-high and four smaller,
    each with something like a hat on its head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Among the Finnish Lapps, a wooden Seide could be prepared from a growing tree
    chopped off above the ground, shaped at the upper end like a funnel, and covered
    with a stone slab.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Such pillars were said to be formed to honor the water near waters rich in
    fish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Swedish Lapp sacrifice-stumps were two to three yards high, roughly human-shaped
    with head and neck, smeared with blood, used once, and not destroyed.
  category: object
  evidence_refs:
  - ev:6
