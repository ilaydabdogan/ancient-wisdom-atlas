canonical_text:
  quote: ''
  summary: The passage describes star-myths centered on the Pole Star, Little Bear,
    and Great Bear. Kirghis tales identify stars of the Little Bear as a rope fastening
    two horse-stars, guarded by seven watchmen or pursued by wolves associated with
    the Great Bear; the world ends if the predators kill or catch the horses. Other
    accounts tie the Great Bear to the Pole Star, associate released dogs with the
    end of the world, and compare Slavic tales of a bound dog whose iron chains form
    the Little Bear.
  language: English
