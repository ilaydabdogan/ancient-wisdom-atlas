canonical_text:
  quote: ''
  summary: The passage reports a shadow-soul belief in which loss of the shadow explains
    dreams, sickness, and death. It states that humans, animals, plants, and lifeless
    objects possess such a soul; Yakuts say men have three shadows and die when all
    disappear; spirits lack shadows; and Yenisei Ostiaks say a pre-existing shadow-soul
    enters before birth and accompanies a person through life.
  language: English
  quote_policy: summarized
