candidate_motifs:
- id: motif:1
  label: First humans formed from earthly materials and animated by a spirit
  taxonomy_refs: []
  basis: The main Buriat account says the first pair is made from clay, stone, and
    water and needs a spirit; variants also describe a creator fetching a spirit for
    man.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: No available taxonomy family directly names creation from clay or animation
    by spirit.
- id: motif:2
  label: Divinatory signs determine the human life-giver
  taxonomy_refs: []
  basis: The creators use torches and water-vessels, with fire and a plant as signs,
    to determine who will procure the spirit and guard humanity.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents this as a tale episode, not as a named ritual type.
- id: motif:3
  label: Theft of life-giving signs leads to human theft and quarrelling
  taxonomy_refs:
  - sacred_theft
  basis: Shibegeni-Burkhan steals the fire and plant from Madari-Burkhan, and Madari
    declares that the people Shibegeni enlivens will steal and quarrel.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The available taxonomy label 'sacred_theft' is broader than the passage’s
    literal theft of fire and a plant among creators.
- id: motif:4
  label: Failed animal guardian permits primordial human corruption
  taxonomy_refs:
  - trickster_boundary
  basis: A dog is assigned to guard the first humans or first man, but a devil bribes
    or deceives it and then defiles or spoils the human body.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage names devils and deception, but does not explicitly call the
    adversary a trickster.
- id: motif:5
  label: Loss of original body covering explains nakedness, sickness, and death
  taxonomy_refs: []
  basis: The main tale explains human nakedness through removal of devil-soiled hair;
    variants connect the loss of hair, horn, or nail covering with sickness and death.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage itself treats hair-covering and horn-covering as related but
    notes differences between creation tales and paradise-stories.
- id: motif:6
  label: Curse explains the dog’s present condition
  taxonomy_refs:
  - divine_judgment
  basis: Shibegeni-Burkhan curses the dog to hunger, bones, scraps, and beatings after
    its failed guardianship.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives a curse by a creator figure, but does not explicitly
    frame it with the term judgment.
- id: motif:7
  label: Adversary’s touch introduces human mortality
  taxonomy_refs: []
  basis: The Alarsk and Vogul variants say the devil’s touching or spoiling of man
    leads to sickness and death or makes humans susceptible to them.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: This motif is clearest in the comparative variants rather than in the
    main Balagan Buriat preface.
comparison_claims:
- id: claim:1
  claim: The passage characterizes the Balagan Buriat story as a product of Buddhism
    and as an explanation for quarrelling and robbery.
  claim_level: historical_contact
  target: Buddhist influence on the Buriat creation tale
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the passage narrator’s statement; no independent supporting
    material is supplied in the excerpt.
- id: claim:2
  claim: A corresponding Alarsk Buriat tale shares the pattern of a creator making
    a hair-covered first man, assigning a dog as guardian, going to heaven for a spirit,
    and a wicked being deceiving the dog and removing the hair.
  claim_level: same_motif
  target: Buriats of Alarsk corresponding creation tale
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage notes that the Alarsk version lacks the Balagan preface
    about stolen fire and plant.
- id: claim:3
  claim: The Vogul Losva tale shares the pattern of a creator absent while seeking
    a spirit, a devil spoiling the first man’s protective body covering, and the loss
    of that covering leading to sickness and death.
  claim_level: same_motif
  target: Vogul tale of the Losva
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The Vogul version uses nail-matter or horn-matter rather than hair
    as the primordial covering.
- id: claim:4
  claim: The Mordvin form shares the pattern in which the devil uses the dog’s hair-covering
    to gain the opportunity to spoil the first horn-covered man, leaving covering
    only on the extremities.
  claim_level: same_motif
  target: Mordvin form of the tale
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt gives the Mordvin form only in summary.
- id: claim:5
  claim: The passage compares the original hair-covering or horn-covering of humans
    with tales recalling the Biblical fall of man and with paradise-stories where
    such covering is said to be common.
  claim_level: same_motif
  target: Biblical fall of man and paradise-stories
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage offers only a brief resemblance and transfer hypothesis,
    without quoting or detailing the Biblical or paradise-story parallels.
