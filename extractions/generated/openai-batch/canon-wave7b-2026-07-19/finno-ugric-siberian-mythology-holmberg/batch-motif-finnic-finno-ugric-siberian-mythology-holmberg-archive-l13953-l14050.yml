canonical_text:
  quote: ''
  summary: 'The passage surveys northern and Inner Asian world pictures: the earth
    as a middle place between Heaven and Hades, Mongolia and China as central lands,
    a mound-like world, layered heavens and underworlds, celestial beings in different
    heavens, Samoyed and Yakut descriptions of heavenly landscapes, Chukchee stacked
    heavens joined under the Polar Star, the flat earth encircled by an ocean, and
    an Altaic account in which Ulgen supports the earth on three great fish.'
  language: English
  quote_policy: summarized
