canonical_text:
  quote: ''
  summary: The passage describes Lapp customs and interpretations concerning deities
    of birth, including Sarakka’s tent, childbirth sacrifices, postpartum offerings,
    flour and milk rites after calving, comparisons with Scandinavian childbirth porridge
    and Norns, and a comparison between Uksakka and the Swedish Dorr-Karing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jessen reports that a special consecrated building was erected for Madderakka
    and Sarakka, and that Sarakka’s tent appears on some magic drums.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the so-called tent of Sarakka may be a relic of a
    separate tent used by a woman in childbirth rather than the common tent.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Lapp mother who believed she was pregnant secured a little dog beforehand
    and kept it until the time of birth approached.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shortly before lying down for birth, the dog was sacrificed so that God might
    help and mother and child might preserve life and health.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After birth, a reindeer or another domestic animal bought from neighboring
    peasants was sacrificed; examples include goats, calves, sheep, lambs, pigs, cats,
    and cockerels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sacrificial animal’s head was bound with a linen kerchief or woman’s linen
    hat, and the sacrificial priest wore a white linen hat and linen apparel for these
    rites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dog and other animals were buried alive; the cock was instead shut in
    a stone grotto where it could live and crow for a time before dying of hunger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Except for the cock, male animals were not sacrificed to the deities of birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Randulf’s notes state that the Lapps also sacrificed spinning-wheels and spindles
    to the deities of birth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the calving of a cow, the first milk was milked onto the ground, flour
    was scattered over cow and calf, and flour was added to the milk before a male
    person could drink it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage compares Sarakka’s porridge with Old-Scandinavic Norna porridge,
    described as the first meal after childbirth for women of the Faro-Islands.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says Scandinavians placed three sticks in porridge for women in
    childbed, and that the child’s luck was supposed to be connected with them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Several Lapp magic drums picture the deities of birth as three females, and
    the passage says their number corresponds with the Scandinavian Norns.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Madderakka’s three daughters are known only among
    the Scandinavian Lapps.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Uksakka is said to have a counterpart in the Swedish Dorr-Karing, described
    as a light-fearing spirit dwelling near the door and blowing out a lighted candle.
  category: relationship
  evidence_refs:
  - ev:9
