canonical_text:
  quote: ''
  summary: 'The passage describes part of a Cheremiss sacrificial rite: animals and
    food portions are prepared before a sacrificial tree; blood is thrown toward the
    tree and fire; selected meat, bread, porridge, and drink are apportioned into
    dishes and bowls for Jumo and the Fire god; a lime-wood stick with ordered meat
    slices is placed in a sacrificial girdle; and the priest prays for divine acceptance,
    protection, health, prosperity, riches, and peace while using ritual implements
    including a knife, axe, and burning brand.'
  language: English
  quote_policy: summarized
