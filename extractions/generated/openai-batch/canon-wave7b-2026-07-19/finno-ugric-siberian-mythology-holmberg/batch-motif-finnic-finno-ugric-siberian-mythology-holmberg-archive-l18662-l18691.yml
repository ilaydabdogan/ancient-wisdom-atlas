canonical_text:
  quote: ''
  summary: The passage surveys several northern Eurasian interpretations of the Great
    Bear as an animal, especially a stag, pursued by hunters, with variant mappings
    of individual stars and a Yakut account in which hunters, a stag, and a dog become
    stars. It also notes a North American comparison involving an animal in the Great
    Bear pursued by three hunters, and begins a Buriat account of the seven stars
    as seven old men or skulls of seven smiths.
  language: English
  quote_policy: summarized
