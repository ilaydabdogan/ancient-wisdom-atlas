  text: The Yenisei Ostiaks see a stag and three hunters in the Great Bear constellation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Yenisei Ostiak mapping, the square stars are the stag, the arch stars
