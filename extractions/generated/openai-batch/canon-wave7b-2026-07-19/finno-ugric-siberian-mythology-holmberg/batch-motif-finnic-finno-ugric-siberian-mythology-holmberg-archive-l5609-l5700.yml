canonical_text:
  quote: ''
  summary: The passage describes Votiak beliefs and legends concerning the Vorsud
    family spirit and the kuala sanctuary. It explains transfer or seizure of a Vorsud
    within a family, the consecration and perpetual sacrificial duty of the kuala,
    procedures for moving sanctuary materials, stories of neglected or displaced Vorsud
    spirits moaning or afflicting people, and a legend in which multiple spirits appear
    as three white-clad persons and punish a man who attacks them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a father quarrels with his son and refuses to give him a Vorsud, the son
    is said to need to procure it by robbery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When taking the Vorsud, the son may say that he leaves the smaller and takes
    the greater; magicians interpret this as receiving the older Vorsud and standing
    religiously above his father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the mudor wedding, the kuala is described as a sanctuary where the Vorsud
    lives and where worship begins.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sacrifices in a consecrated kuala are said never to be interrupted across
    generations; failure to observe this is associated with accidents, loss of property,
    or madness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a kuala is moved, the building is dismantled and rebuilt with the wall
    timbers in the same order, while hearth ashes, stones, and the Vorsud case are
    ceremonially carried to the new place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one account, a sacrificial bull escaped from a great kuala, and the place
    where it was caught was considered pleasing to the kuala spirit, so the whole
    building was moved there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If a kuala is destroyed, the sacrifice case and hearth stones must not be
    lost.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A legend says that a man built a barn where his kuala had stood, left the
    sacrifice case and stones under the hearth, heard groaning later identified as
    the Vorsud, and restored the case and stones to a new kuala, after which the barn
    was silent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Although the name Vorsud is commonly used in the singular, the passage states
    that older practice allowed for several spirits in one kuala and for their distribution
    among descendants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Votiak who became Christian and stopped the old sacrifices was annoyed by
    spirits; at midnight he saw three white-clad persons emerge from the kuala, fired
    at them, and afterward suffered a severe illness sent by the spirits.
  category: sequence
  evidence_refs:
  - ev:6
