literal_observations:
- id: obs:1
  text: The passage states that some accounts say the earth has always existed, but
    that stories among Altaic peoples also tell of an initial state with no earth
    and only a deep, shoreless primordial ocean.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widespread cycle is described in which a being dives into the water and
    brings earth-matter up from the ocean depths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a Yakut tale, Yryn-Ajy-Tojon moves above the boundless ocean, sees a floating
    bladder, and asks it who it is and where it comes from; the bladder answers that
    it is Satan and lives on earth hidden under the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the same Yakut tale, Satan dives under the water and returns with a morsel
    of earth; God blesses it, places it on the water, and sits on it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the same Yakut tale, Satan tries to drown God by stretching out the land,
    but the land grows stronger and covers much of the ocean surface.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author describes the God-and-Satan opposition in the Yakut tale as sharp
    dualism and points to the name Satan and a following variant as clues for tracing
    the myth's origin.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Yakut variant, Satan is called the elder brother of Christ; Satan is
    described as wicked and Christ as good.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the variant, Satan dives for sand from the ocean bottom twice without success,
    then changes into a swallow and brings up a little mud in his beak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the variant, Christ blesses the mud so that it becomes a flat, smooth earth,
    while Satan hides part of the mud in his throat to make his own world; after Christ
    strikes him, the mud from his mouth forms mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author states that the Yakut tales coincide in every detail with Eastern
