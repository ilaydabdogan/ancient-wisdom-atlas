canonical_text:
  quote: ''
  summary: The passage compares bird episodes in flood and creation traditions, then
    surveys several Asian creation tales in which a creator or sacred figure uses
    a water-bird, diver, or duck to bring up earth, clay, or mud from primordial waters
    so that land can be formed. Some variants include a raven sent to observe the
    growing earth, a blessing explaining a water-bird’s diving ability and many young,
    and a curse on a failed diver-bird. The author emphasizes that these tales lack
    a devil-like opponent and cautions against deriving the bird feature from the
    Biblical flood story.
  language: English
  quote_policy: summarized
