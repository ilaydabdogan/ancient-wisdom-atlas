- id: obs:3
  text: The raven’s trips take longer on successive days, which is used to infer that
    the earth grows from day to day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that creation and flood stories are often found separately
    among the same people, and describes an Asian form in which the Creator uses an
    ordinary water-fowl to bring earth from the waters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Yenisei Ostiak account, water is everywhere at the beginning; the Great
    Shaman Doh hovers over it with water-fowl, asks a diver-bird to fetch earth from
    under the sea, and makes an island from the earth brought in its beak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Buriat account, black earth and red clay lie at the bottom of a shoreless
    primordial ocean; Burkhan asks a white diver to fetch them, and a floating world
    with trees and grass is created after they are sprinkled on the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Balagan Buriat form, Sombol-Burkhan commands a water-fowl with twelve
    young to bring black soil and red clay; God scatters the materials on the water,
    the earth becomes vegetated, and the bird is blessed with many young and diving
    ability.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that these tales contain no being akin to the devil as
    God’s opponent.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Northern Yakut story, the Mother of God creates a diver-bird and a
    duck, commands both to fetch earth from under the ocean, receives mud from the
    duck, and curses the diver-bird after it returns without mud and says earth cannot
    be found.
  category: sequence
  evidence_refs:
  - ev:8
