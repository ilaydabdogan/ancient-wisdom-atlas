canonical_text:
  quote: ''
  summary: The passage describes Lapp Seides as stone or wooden sacred objects, with
    stone Seides regarded as holier, and then summarizes several forms of sacrifice
    to them among Lule, Kemi, and Norwegian Lapps. The described rites include slaughtering
    an animal, smearing sacred stones, trees, sticks, or shaped stones with blood
    and fat, placing horns, bones, hide, and meat portions at the holy place, holding
    a sacrificial meal, and singing ritual songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes stone Seides, wooden Seides or pillars, and wooden
    images made for Nature gods; stone Seides are reported as much holier than wooden
    Seides.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that sacrificial practices to Seides varied across the
    wide Lapland area, while still showing general archaic forms.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Lule account, the sacrificial animal is bound behind the tent, stabbed
    in the heart, and its heart-blood is carefully gathered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Lule account, horns, head and neck bones, and hoofs are carried to
    the holy place where the Seide stands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Lule account, the sacrificer removes his hat, bows to the idol, smears
    it with blood and fat, piles horns behind the stone, and hangs small meat pieces
    on a birch switch at the horn pile.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Lule account, bones and hide are left on the holy mountain, and the
    head may be hung on a nearby tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Kemi account, a tree near the Seide stone is cut down and called the
    sacrifice tree; before sacrifice, the god is asked by lifting him what he wants
    in return for help.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Kemi account, the animal is bound to the sacrifice tree and slaughtered
    after a long speech; the stone and tree are smeared with blood, and meat strips
    on a ring of young branches are hung in the tree.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: In the Kemi account, any remaining food cannot be taken home and must be left
    at the place with the hide and horns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Norwegian account, pieces from each ear and the tail are placed before
    the god as a preliminary taste before the animal is stabbed and flayed with horns
    and hoofs left attached to the hide.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Norwegian account, marked sticks called the sacrifice tree are smeared
    with blood and placed near the god to represent wax candles.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Norwegian account, the cooking fire has a fixed place, preferably near
    a spring or brook; the sacrificial priest smears shaped stones with fat and blood
    and places them near the god.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the Norwegian account, the priest and followers eat the whole carcass,
    avoid scattering the bones, leave bones and hide at the offering place, and sing
    songs called luete.
  category: sequence
  evidence_refs:
  - ev:11
