canonical_text:
  quote: ''
  summary: The passage describes Votiak bath-house and threshing-barn spirits, their
    appearances, dangers, taboos, amulets, and sacrificial practices. It then compares
    Votiak household spirits with Russian and Siryan counterparts, especially the
    Domovoy/Susetka, including under-floor dwelling, prosperity protection, misfortune
    when angered, moving-house rites, and stated correspondences among outbuilding
    spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bath-house man or Bath-house ruler is said to live in a dark corner of
    the bath-house and to appear as a tall middle-aged man in a white shirt and lime-bark
    shoes, or as a tall one-eyed being.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bath-house man sometimes speaks and cries like a suckling infant and appears
    to humans only before misfortune.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bath-house man hides bathers' underclothing, ties shirt sleeves together,
    or turns shirts inside out, thereby hindering dressing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage advises against going alone into the bath-house, quarreling there,
    or speaking loudly there.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bath-house man, like the House man, can substitute changelings for rightful
    infants, and iron or another metal is used as an amulet in such cases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Threshing-barn man lives in the threshing-barn and receives autumn sacrifices
    so that he will not become angry or frighten people, and so that he will protect
    the barn from fire and storm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The threshing-barn sacrifice may be a goose, duck, or sheep killed by the
    head of the family in the barn or on the threshing-floor, with blood allowed to
    drip there; the flesh is cooked at home, then brought back for prayers, and remains
    and bones are buried under the barn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After threshing, a sheaf of grain is often left on the beams of the threshing-barn
    for the Threshing-barn man.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The source states that Votiak household spirits do not differ from corresponding
    Russian ones, even in sacrifices, and says the Votiak Korka-murt is identical
    with the Russian Domovoy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Siryan Susetka is said to dwell under the floor, receive sacrifices there,
    and act as a kindly spirit protecting the prosperity of the house.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: When angry, the Susetka is said to cause misfortunes, poor manual labor, and
    thin cattle; it may also attack as a nightmare, kiss sleepers so that blisters
    appear, or make spinning/building noises that precede death, fire, or other misfortunes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During a move to a new house, the master takes a saint's picture from the
    old corner, goes under the floor, addresses the Susetka, places the picture in
    a corner of the new home, and bids the spirit to dwell under the floor; the spirit
    is believed not to move until the fireplace is ready.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The source states that foreign Russian models exist for the Votiak Cattleyard
    man, Bath-house man, and Threshing-barn man, and says Siryans borrowed corresponding
    spirits from Russians.
  category: relationship
  evidence_refs:
  - ev:8
