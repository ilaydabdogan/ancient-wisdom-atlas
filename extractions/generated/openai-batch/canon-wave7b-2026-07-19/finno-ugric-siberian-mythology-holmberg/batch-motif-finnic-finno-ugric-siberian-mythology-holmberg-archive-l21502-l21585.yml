canonical_text:
  quote: ''
  summary: The passage gives explanations of punishments in the realm of the dead,
    where the Princes of death answer Kubaiko’s questions and identify bodiless serving-spirits.
    Kubaiko then revives her dead brother with water of life procured from God. The
    passage next surveys postmortem weighing among Tungus near Baikal, a narrow punishment-bridge
    among certain Tatar tribes, and Goldes cannibal-myths of a gloomy river place
    with a high poplar, spirit-birds, human bones, fires in the sky, and a great bird
    carrying a tormented human being.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Princes identify the bodiless beings that seized and tormented Kubaiko
    as invisible serving-spirits able to injure or kill wicked people but unable to
    harm the good.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women in the first room are made to spin as punishment for having spun after
    sunset during life, when work was forbidden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People in the second room are punished for hiding stolen wool; they are doomed
    to keep an impossible spindleful in their throats through eternity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Younger women in the third room are punished for selling butter weighted with
    hidden stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several rooms contain suicides whose punishments or marks correspond to hanging,
    shooting, or cutting themselves with knives while drunk.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The inhabitants of the seventh room are punished because they teased mad dogs
    in life and were bitten by them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Quarrelsome married people in the eighth room bicker eternally over a covering,
    while harmonious married people in the ninth room are present as an example rather
    than as punishment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After receiving information from the Princes of death, Kubaiko returns to
    her brother’s body with the head and revives him with water of life procured from
    God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among Tungus near Baikal, the passage reports that each mortal is weighed
    after death with a white and a black stone, and the soul goes either upward to
    heaven or to the underworld according to the outcome.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The underworld punishment in the Tungus account is a dark pit of terrible
    cold followed by roasting in never-ending flames.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among certain Tatar tribes, the passage reports an idea of a very narrow punishment-bridge
    from which a soul overloaded with sins falls into the depths below.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author states that ideas of restitution are alien to true shamanism, while
    northern cannibal-myths include terrible places into which a soul may fall regardless
    of its former life.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Goldes cannibal myths, a gloomy place by a river has a sand-covered bank
    and an enormously high poplar whose leaves block sunlight by day and moonlight
    by night.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Spirit-birds serving wicked shamans gather mostly in the high poplar, and
    countless human bones lie on the ground around it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: A girl who came there one evening saw two fires in the sky and heard the wings
    of a great crane-like bird carrying a pleading human being on its back.
  category: action
  evidence_refs:
  - ev:10
