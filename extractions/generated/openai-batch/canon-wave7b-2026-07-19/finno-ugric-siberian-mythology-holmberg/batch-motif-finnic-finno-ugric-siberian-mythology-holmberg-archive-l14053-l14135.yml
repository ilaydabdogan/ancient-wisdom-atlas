canonical_text:
  quote: ''
  summary: The passage surveys world-picture traditions in which the earth is supported
    by or associated with giant animals, including fish, a frog, a bull, a crab, a
    mammoth, and the dog of Tuila. Their movements are said to cause floods, earthquakes,
    landslides, river-ice breaking, or the end of the world. The passage also reports
    comparative links to East European, Jewish, Indian, Chinese, Islamic, Tatar, Finnic
    Volga, Tungus, and North-East Siberian materials, often in connection with a cosmic
    ocean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A middle fish is flanked by one fish on each side; when the middle fish presses
    its head downward toward the north, floods occur in the north, and if it sinks
    too low the whole earth is inundated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rope is attached to the fish's gills and reaches to Heaven, where it is
    attached to three posts; Bodhisattva Mandishire can lower or raise the fish's
    head by moving the rope among the posts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some Buriat districts, one large fish supports the earth, and earthquakes
    occur when it changes position.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the idea of giant fish supporting the earth is also
    general in East European legends and that Jewish myths have the fish-shaped Leviathan
    bearing the earth's foundations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A world-supporting frog is described as replacing an unknown turtle; movement
    of its finger causes the earth to quake, and the belief is said to have spread
    to Tungus groups beyond the Baikal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kirghis, Tatar, Votiak, and Cheremiss variants describe a great bull supporting
    the earth, sometimes standing on another support such as a fish, a stone, or a
    crab in or above the cosmic ocean.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In bull variants, earthquakes may occur when the bull moves or shakes its
    head; one Cheremiss version says one horn is broken from the world's weight and
    the world's end will come when the other horn breaks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the world-bull idea probably reached the Tatars with
    Islam and notes a Jewish tale of a bull-shaped Prince of the Depths.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: North-East Siberian peoples are said to attribute earthquakes and landslides
    to an underground mammoth, and local Tatars say God ordered the mammoth to bear
    the earth because the earth could not bear the mammoth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Kamchadales say the dog of Tuila makes the earth tremble when it shakes
    snow from its back while Tuila rides it underground; the passage notes that in
    this view the earthquake causer is not the earth's actual supporter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage concludes that Central Asian ideas of a world-supporting being
    are generally connected with belief in a cosmic ocean and with popular tales about
    the origin of the earth.
  category: setting
  evidence_refs:
  - ev:9
