canonical_text:
  quote: ''
  summary: The passage describes animal-type shaman costumes and instruments among
    Siberian and Altaic peoples. It explains that costume parts, drums, sticks, and
    staffs are understood as animal powers, vehicles for spirit travel, repositories
    or perches for spirits, and possibly as forms of the shaman's soul-animal or the
    world-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies the object as the dress of a Yenisei Ostiak shaman
    of the animal type, shown from the back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says earlier shaman costumes used natural animal objects, including
    owl wings, bear paws, and real horns, rather than or alongside metal objects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yakut explanation links the bird-costume with the shaman receiving the power
    to fly; Tungus explanation calls the costume the shaman's shadow or the shape
    in which the soul travels on spirit journeys.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Golde myth relates that a great bird alighted on a tree and shook its wings,
    which became iron feathers of the shaman costume.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Yenisei Ostiaks call the costume and its hanging objects the shaman's
    power; when the shaman wears long boots representing bear feet, he believes he
    has acquired bear power and may imitate the bear while shamanizing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the costume form may be inherited in a shaman's family
    and is sometimes called Tangara by the Yakuts; it further says it probably represented
    the shaman's soul-animal.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In songs and myths the shaman's drum is called an animal or mount, including
    horse, deer, loom, or eagle, and is said to be ridden or flown on.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Yenisei Ostiaks use reindeer-calf skin for drum covers, attach iron reindeer
    ribs, and often place a reindeer image inside the wooden frame of the drum.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage notes a broader Siberian artistic practice in which objects made
    with an animal hide may be decorated with images or features of the same animal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The inside of the shaman drum may carry spirit-pictures, including small human-
    or bird-like metal images; some peoples also paint Heaven, the underground, shaman
    animals, hunting trips, and similar scenes on the drum skin.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Buriat shamans who no longer use drums use two sticks shaped with horse heads
    and horse hoofs; these sticks are called the shaman's horses and are decorated
    with small skins and bells.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Some Yenisei shamans use an iron staff with cross-branches where summoned
    spirits are believed to alight; the passage connects this object with the world-tree,
    dead-soul escort, and ascent to the Heavens.
  category: object
  evidence_refs:
  - ev:11
