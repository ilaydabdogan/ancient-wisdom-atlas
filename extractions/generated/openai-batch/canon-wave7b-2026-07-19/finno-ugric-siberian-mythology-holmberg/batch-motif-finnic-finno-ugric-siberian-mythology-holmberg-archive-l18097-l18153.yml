canonical_text:
  quote: ''
  summary: The passage describes Buriat and Mongol traditions of ninety-nine Tengeri
    divided into western white benevolent gods and eastern black harmful gods. It
    recounts a quarrel between the divine groups over a border deity, sometimes said
    to involve the deity’s beautiful daughter. It then compares the number and division
    of these beings with Altai Tatar beliefs about ninety-nine other worlds and Erlik’s
    forty-three servants, and with Chinese good and evil Star gods.
  language: English
  quote_policy: summarized
