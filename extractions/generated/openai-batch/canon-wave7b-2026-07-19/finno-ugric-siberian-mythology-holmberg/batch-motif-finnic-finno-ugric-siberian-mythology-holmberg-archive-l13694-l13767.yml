canonical_text:
  quote: ''
  summary: The passage surveys historical cultural and religious contacts among Uigurs,
    Mongolians, Turco-Tatar peoples, Buriats, Tungus groups, and others. It describes
    inscriptions, missionary contacts, Persian influence on mythological names, Mongol-era
    migrations and religious policies, Buddhist and Lamaist influence, suppression
    or reinterpretation of older sacrifices and customs, and later affiliations with
    Islam, Buddhism, and Russian Orthodoxy.
  language: English
  quote_policy: summarized
