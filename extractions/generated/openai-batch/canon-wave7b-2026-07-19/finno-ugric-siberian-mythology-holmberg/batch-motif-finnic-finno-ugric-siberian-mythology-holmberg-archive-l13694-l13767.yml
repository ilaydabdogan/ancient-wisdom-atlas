- id: obs:1
  text: Ancient Turkish inscriptions on gravestones of departed chiefs were found
    south of Lake Baikal on the Selenga River and Orkhon; the passage dates them to
    the Turk dynasty and the Uigur period.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Uigurs are described as having contact with Syrian missionaries preaching
    Nestorian and Manichean doctrines and with Buddhist missionaries from China.
  category: relationship
  evidence_refs:
