- id: obs:3
  text: The passage states that an East Turkestan cultural centre arose after Uigurs
    moved toward the Tientshan and took up agriculture and commerce.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that Syrian cultural influence is visible in Syrian characters
    used in Uigurean literature excavated at Turfan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ancient Persian culture is said to have affected the religious views of Mongolians
    and Turco-Tatars at Sajan and the Altai, shown by listed mythological name correspondences.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that Jenghiz Khan's conquests caused upheavals, regroupings,
    and westward pressure on Turks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jenghiz Khan is described as religiously liberal and tolerant of different
    religious sects, while successors such as Kubilai are described as more inclined
    toward Buddhism.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the fall of the Mongol dynasty in China, Buddhism is said to have declined
    in fashion and paganism to have revived until Lamaism gained followers in the
    seventeenth century.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Missionaries, fines, and punishments are said to have overcome pagan sacrifices,
    while many old folk-customs were tolerated by giving them a new meaning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old shamanistic religion is called the “Black Religion,” and Lamaism is
    called the “Yellow Religion”; the latter is said to have almost entirely supplanted
    the former among orthodox people described in the passage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The older Buddhist culture that entered from China is said to have left myths
    among Central Asian tribes in which divine names appear borrowed from Sanskrit
    rather than Tibetan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that most Turco-Tatar tribes gradually adopted Islam, while
