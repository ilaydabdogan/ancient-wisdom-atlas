canonical_text:
  quote: ''
  summary: 'The passage surveys Central and Northern Asian beliefs and rites concerning
    fire: fire purifies uncleanness, is worshipped as holy or as a hearth deity, must
    be kept pure through taboos, is thought by Yakuts to understand speech, receives
    first portions of meals, appears in family and wedding rites, and is transferred
    symbolically by a Chuvash bride through hearth ashes or stone.'
  language: English
  quote_policy: summarized
