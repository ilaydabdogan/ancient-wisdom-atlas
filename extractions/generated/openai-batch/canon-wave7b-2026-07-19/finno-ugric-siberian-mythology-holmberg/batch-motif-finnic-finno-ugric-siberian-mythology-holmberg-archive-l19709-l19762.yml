  text: The passage says a fire-purification custom is known among Volga Finno-Ugric
    peoples; Yakuts declare it was learned from Russians, while older sources are
    said to show ancient Turco-Tatar use of fire as a magic purifier.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Byzantine chronicles are cited for an episode in which Justinian's messengers
    had to pass between two fires before the Turkish Great Khan could receive them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People, animals, or objects made unclean, for example by touching a dead body,
    were purified by this fire rite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that fire is esteemed holy because of its mystical and
    heavenly birth, power, and domestic importance, and that many Central and Northern
