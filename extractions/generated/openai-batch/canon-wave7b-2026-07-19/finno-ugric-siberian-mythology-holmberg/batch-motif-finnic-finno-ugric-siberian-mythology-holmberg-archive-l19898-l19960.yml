canonical_text:
  quote: ''
  summary: The passage describes the Fire god or Master of fire as an anthropomorphic
    being who may appear before household catastrophe, with Yakut and Buriat examples.
    It describes Buriat hearth images of the Master and Mistress of fire, then discusses
    fire as a sacred mediator conveying sacrifices to gods, especially upper-sphere
    gods. It closes with a comparative argument about uneven development of fire-worship
    among Altaic, Tungus, Mongol, Finno-Ugrian, Turkish, and Indo-Iranian peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master of fire may appear to people before a disastrous fire or other
    catastrophe threatening the home, and the Fire god often takes human shape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yakuts see the Fire god in the form of a grey old man, while a Buriat
    report describes him as a great red, flame-coloured man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buriats make images of the Master of fire and keep them in a box near
    the hearth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Balagansk District homes, two human-shaped red-cloth figures may represent
    the Master and Mistress of fire, with glass-bead eyes and black sheepskin on the
    headdress, hands, and garment hem.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mistress image is described with beads for nipples and a tin ornament
    on her breast.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The red and black colors in the Fire god image are said to represent glowing
    coal and soot.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among most peoples identified in the passage as Altaic, fire has the duty
    of conveying sacrifices to the various gods, so not every offering put into fire
    is intended for the fire itself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fire is especially used as a medium when a sacrifice is intended for a god
    of the upper spheres, and in this mediating capacity it is treated as especially
    sacred and worshipped at sacrificial festivals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Finnish peoples of Eastern Russia are said to have the conception of fire
    as sacrificial mediator and related rites.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Tungus of North Siberia are described as keeping fire clean and refraining
    from hurting it, while sacrifice to fire, wedding-fire rites, and fire as conveyer
    of sacrifices are said to be less necessary or uncommon among them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage argues that the more developed Fire god and fire-worship of some
    Altaic-related peoples developed under foreign, especially Iranian, influence,
    with Turkish tribes named as intermediaries for Mongol fire-worship.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The passage states that an older northern custom gave sacrifices to gods untouched,
    alongside later sacrifices by fire.
  category: sequence
  evidence_refs:
  - ev:7
