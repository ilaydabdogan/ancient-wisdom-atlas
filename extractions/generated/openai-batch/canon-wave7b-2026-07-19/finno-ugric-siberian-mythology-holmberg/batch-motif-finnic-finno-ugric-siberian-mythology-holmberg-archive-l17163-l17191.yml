canonical_text:
  quote: ''
  summary: A Goldes tale tells of a brother who discovers tiger footprints outside
    the hut after suspecting his sister has a secret visitor. The sister, pregnant
    and singing shaman songs, says the tiger is her husband and that his spirit is
    in her; she can be killed only if her little finger is cut off. The brother cuts
    off the finger, she dies, and he burns her body. Evil spirits in the forms of
    birds and insects emerge from the fire. The passage then compares this with cannibal
    myths among Tungus, northern Siberian peoples, and North American Indian traditions
    involving blood-sucking insects born from the ashes of a man-eater.
  language: English
  quote_policy: summarized
