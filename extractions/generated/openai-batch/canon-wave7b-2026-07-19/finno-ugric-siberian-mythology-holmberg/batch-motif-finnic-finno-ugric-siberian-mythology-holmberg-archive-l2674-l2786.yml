canonical_text:
  quote: ''
  summary: The passage surveys memorial feasts and related rites among Votiaks, Eastern
    Cheremiss, Mordvins, and Siryans. It describes offerings to the dead, animal sacrifices,
    horse and cow memorial rites, bones hung in graveyard trees, harvest-field rites
    for the dead, and special feasts prompted by dreams, illness, missing animals,
    or other adversities attributed to the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies an image as being at a grave in Ingermanland.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:2
  text: One Votiak report says that without a memorial feast the dead will not give
    a newcomer a place in their community and will make him continue to wander about
    the village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In an Eastern Cheremiss anniversary rite, the deceased person's clothes are
    hung on his favorite horse, which is taken to the grave and led three times around
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A three-branched candle is lit on the grave while the living announce the
    anniversary to the dead man and promise to kill the horse in his honor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After returning to the homestead, the horse is killed and its flesh is prepared
    as a memorial meal; the relations tell the deceased to eat and take the horse
    with him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the end of the Eastern Cheremiss feast, the horse bones are taken to the
    graveyard and hung in a tree, while the hide is sold for the poor and fatherless.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Votiaks celebrate a special memorial feast for particular persons, called
    a horse-wedding or wedding of the dead, sometimes a year or several years after
    death and generally late in autumn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Votiak horse-wedding is described as a cheerful feast with wedding-songs
    and wedding-presents.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Votiak rite, the sacrificial animal is generally a horse for a deceased
    man and a cow for a deceased woman; in some places the animal favored and used
    by the deceased is sacrificed.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Only relations are invited to the Votiak sacrificial meal, and inviting strangers
    is said to be against custom.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Votiak rite, the animal's bones are taken in the evening by candlelight,
    with music and singing, to the graveyard and hung on a tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Mordvin harvest of the dead includes a spring prayer that the corn grow
    for the welfare of both the living and the dead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: During the Mordvin harvest-festival, relatives reap a dead man's portion,
    each cutting only a few straws.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Mordvin harvest rite, the widow plays the chief part, wears a self-made
    straw belt all day, and cattle are slaughtered for the feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage says traces of a memorial feast in the harvest-field have also
    been found among the Siryans.
  category: other
  evidence_refs:
  - ev:7
- id: obs:16
  text: The dead may remind the living of their wishes through dreams or various signs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Memorial feasts are especially held for illnesses that a wise man declares
    to originate from someone among the dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Among the Mordvins, a patient in such a case must creep on all fours to the
    deceased person's grave to ask forgiveness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: According to the Votiaks, when a horse or cow disappears from pasture or strays
    in the forest, a dead relation has hidden it.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:20
  text: For missing livestock, wax-tapers are lit and food is sacrificed to the dead
    in the hope that they will send the animal home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: Minor adversities, such as failed distilling, a loosened wheel, or a restless
    baby, may become reasons to prepare a memorial feast.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:22
  text: A Cheremiss widow may interpret an aching back as caused by sexual contact
    with her deceased husband during the night, after which she must light a wax-taper
    and sacrifice to the dead.
  category: relationship
  evidence_refs:
  - ev:11
