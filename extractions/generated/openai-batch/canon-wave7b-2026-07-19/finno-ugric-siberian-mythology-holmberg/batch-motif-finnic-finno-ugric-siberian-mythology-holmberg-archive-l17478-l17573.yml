canonical_text:
  quote: ''
  summary: A plate caption describes an erected phallus before a Mongol monastery
    used to frighten a female demon. The prose passage surveys Siberian and Central
    Asian conceptions of a remote Heaven god, a life-giving male sky paired with a
    female Earth Mother, Buriat fallen-stone rituals for rain and fruitfulness, tales
    of souls and births descending from Heaven as birds, hail, or light, and Yakut
    and Chuvash creator or birth-giving Heaven names.
  language: English
  quote_policy: summarized
