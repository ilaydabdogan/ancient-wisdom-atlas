canonical_text:
  quote: ''
  summary: The passage describes worship of Lapp Seides and comparable Finno-Ugric
    and Samoyed local gods or spirits, often associated with famous men, founders,
    or shamans. It details Yurak sacred places and sacrifices, Ostiak Samoyed idol
    buildings and images, votive objects and holy trees, and Ostiak/Vogul fixed sacred
    places with strict prohibitions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Lapp Seides worshipped by larger groups are described as dedicated to
    the spirit of a famous man, family founder, shaman, or similar person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Yuraks, some stone or wooden gods were worshipped by wide tribal
    groups, while others had only small congregations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yurak sacred places were located near gathering places used for hunting, fishing,
    or seeking reindeer food.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Samoyed meetings, reindeer and dogs were sacrificed to tutelary spirits;
    idol mouths were smeared with blood and fat, the flesh was eaten, and heads or
    hides could be hung on a holy tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eastern Samoyeds are described as throwing pieces of sacrificial flesh into
    the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ostiak Samoyeds sometimes marked a deer by cutting the face of a god or other
    figures on its back instead of slaughtering it; afterward the animal was treated
    as holy and not used or eaten.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yurak sacred places were not fenced and had no buildings; their idols stood
    under the open sky.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: An Ostiak Samoyed idol building hidden in the forest stood on four high supports
    and was described as a dwelling-place of the gods.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Inside the building stood a wooden human-like god with a marital partner;
    the face was roughly carved, with eyes made from blue glass pearls.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The images were dressed in fine furs and surrounded by pewter weapons and
    pewter animal figures including swans, geese, snakes, and reindeer.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The pewter animals were said to help the images flee if an unconquerable enemy
    approached.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A small figure dressed as a Russian policeman stood near the door and held
    weapons.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Objects, including money and old coins, lay before the ancestor image; garments,
    animal horns, hides, and other items were hung in the holy trees around the building.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ostiaks and Voguls are described as possessing many similar spirits bound
    to fixed places, some honored over wide areas and others by small groups or single
    villages.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Ostiak places dedicated to idols had defined boundaries, and within them people
    avoided cutting trees, mowing grass, hunting, fishing, and even drinking water.
  category: action
  evidence_refs:
  - ev:11
