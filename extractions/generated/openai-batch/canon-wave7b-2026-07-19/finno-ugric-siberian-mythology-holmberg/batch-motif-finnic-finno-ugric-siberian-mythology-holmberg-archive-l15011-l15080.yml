canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and Siberian beliefs about a central world-pillar
    or post supporting the sky, sometimes associated with a tree, branch-like cross-pieces,
    and bird figures. It also describes the sky as a tent-like roof or stitched cover,
    with divine openings in the sky interpreted as meteors and with stars or the Pleiades
    imagined as holes in the cover.
  language: English
