canonical_text:
  quote: ''
  summary: 'The passage surveys earth and vegetation beliefs among Finno-Ugric and
    neighboring Volga groups: Earth Mother offerings and crop prayers; local Yard,
    Field, and Meadow Mothers; theft and retrieval of field-luck by moving earth or
    sod; and beliefs in a detachable earth, field, or corn soul that can appear as
    a grey butterfly and be ritually sought by Eastern Votiaks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that offerings to the earth are rare among non-agricultural
    Finno-Ugric peoples.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ugrians mention a black or hairy Earth Mother in folk poetry and sacrifice
    to her only for certain sicknesses believed to come from the earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Volga-area groups sacrifice black animals, often cows and sheep, to Earth
    Mother; the bones are buried in the earth and the blood is allowed to run into
    it for the production of corn and grass.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cheremiss, Votiak, and Mordvin prayers address Earth Mother or the earth as
    a nourisher and producer of corn or crops.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Votiaks pray that the earth not be offended when ploughed, and they avoid
    very late autumn sacrifices because they say the earth sleeps.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Mountain Cheremiss worship a Yard Mother, and the Mordvins worship a Field
    Mother and a Meadow Mother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Earth-luck or field-luck can be stolen by carrying sod or a little earth from
    a more fortunate field to one’s own field.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Siryans accompany the taking of field-luck with a spoken request that
    good luck follow and give good subsistence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A Cheremiss person who believes his field-luck has been stolen may go at dusk
    to bring it back in a bark-shoe while addressing the corn or luck so that it will
    remain in his fields.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Chuvashes are described as stealing earth with wedding-like ceremonies
    and choosing a living bridegroom for Earth Mother; the passage also notes related
    Votiak and Mordvinian concerns about field fertility being carried away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Cheremiss and Votiak beliefs describe a soul of the earth, field-soul, or
    corn-soul that can leave tilled earth or a field and take fruitfulness with it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Votiak corn-soul can become visible like a human soul in the form of a
    little grey butterfly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Among Eastern Votiaks, a seer and six selected persons, three youths and three
    maidens dressed in white and riding white horses, seek the butterfly around the
    village fields and return singing and playing when it is found.
  category: sequence
  evidence_refs:
  - ev:6
