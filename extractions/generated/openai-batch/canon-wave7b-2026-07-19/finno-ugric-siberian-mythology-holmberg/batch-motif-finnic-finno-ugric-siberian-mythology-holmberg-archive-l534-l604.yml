- id: obs:1
  text: The passage reports that, according to the Lapps, life continues in some form
    after death as long as the skeleton remains.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the gods let new flesh grow on the carefully preserved bones
    of a sacrificial victim.
  category: action
  evidence_refs:
