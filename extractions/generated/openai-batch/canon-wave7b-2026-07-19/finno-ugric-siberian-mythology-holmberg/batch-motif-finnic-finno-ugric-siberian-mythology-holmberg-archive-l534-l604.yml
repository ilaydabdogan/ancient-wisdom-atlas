canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and Siberian beliefs in souls bound to
    bodies, bones, limbs, and organs. It describes survival while bones or bodies
    remain, regrowth of flesh on preserved bones, offerings to graves until bodily
    decay, destruction or staking of dangerous corpses, and Cheremiss ideas of a soul
    or life-force moving within the body.
  language: English
  quote_policy: summarized
