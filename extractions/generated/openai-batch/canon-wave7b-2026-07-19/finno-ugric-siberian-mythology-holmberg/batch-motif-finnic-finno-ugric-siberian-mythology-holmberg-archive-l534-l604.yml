- id: obs:3
  text: In the Vogul custom described, an injured man destroys all parts of a bear's
    body in order to free himself from it; the custom is explained as killing the
    victim's soul together with its body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pite Lapps are reported to have crumbled barley bread and strewn it on graves
