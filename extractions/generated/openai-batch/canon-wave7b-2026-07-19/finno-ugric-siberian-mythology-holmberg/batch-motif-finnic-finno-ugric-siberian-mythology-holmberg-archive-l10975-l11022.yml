canonical_text:
  quote: ''
  summary: The passage describes Volga and Cheremiss customs in which fire mediates
    offerings between humans and gods, a Lapp practice of burnt sacrifice to the sun,
    and Finnish magic-song accounts of the origin or acquisition of fire from heaven,
    from a serpent identified with lightning, and from within a red salmon caught
    by a net. It also notes a proposed Iranian origin for some fire-cult customs and
    a North American North-West Coast counterpart to the salmon-fire tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stocks living along the Volga are described as worshipping fire as an intermediary
    between gods and humans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Offerings thrown into the fire may be intended for the Fire mother to pass
    on to their true recipients.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Cheremiss sacred groves, priests address fire as bearing sacrifices and
    prayers to God with its smoke, and fire also receives a sacrifice as reward.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage attributes these Volga-region fire-cult beliefs and customs to
    foreign, probably Iranian, origin.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Randulf is cited as saying that the Lapps burn sacrifices only for the sun,
    on a stone consecrated for that purpose, to show the sun's heat and fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Finnish magic songs describe fire as originating in heaven, at the navel of
    the sky and on the peak of a famous mountain.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Finnish song names Ismaroinen or Ilmarinen and Vainamoinen in connection
    with striking or securing fire without flint or tinder, using a black snake or
    mottled serpent on open water or waves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A variant names the Thunderer or Pitkamoinen as striking fire among sea rocks
    from a many-coloured serpent, and the author states that the serpent is lightning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another song describes weaving a net to catch a red salmon in whose bowels
    fire is bound; the net is made from plant materials such as lime-bark, heather,
    bast, or juniper threads.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage notes a counterpart among certain North American North-West Coast
    tribes in which fire is also found in a salmon's bowels, and suggests the salmon's
    colour may have encouraged association with fire.
  category: other
  evidence_refs:
  - ev:9
