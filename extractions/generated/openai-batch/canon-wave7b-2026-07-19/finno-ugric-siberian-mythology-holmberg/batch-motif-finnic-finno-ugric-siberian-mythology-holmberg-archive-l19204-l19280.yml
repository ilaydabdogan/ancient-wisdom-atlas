canonical_text:
  quote: ''
  summary: The passage surveys northern Siberian and neighboring beliefs that thunder
    is caused by powerful bird- or dragon-like beings. These beings may protect shamans,
    generate thunder and lightning through wings, voice, tail, sneezing, or stones,
    and pursue enemies, squirrels, or evil spirits during storms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that peoples in the farthest north of Siberia imagine thunder
    as resembling a large and mighty bird whose wing-rustling is heard on earth as
    thunder.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Forest Tungus make a wooden bird image representing thunder when weaving
    a magic spell and fix it outside the tent on a long pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tungus are said not to sacrifice to or worship the Thunder bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Thunder bird is believed to protect the shaman's soul during aerial flight
    and may be sent by the shaman against enemies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Trees struck by lightning are interpreted by the Tungus as proof that the
    bird of the upper air has torn them with stone claws.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Chukchee and peoples of Turukhansk are described as holding a similar
    conception of thunder.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eastern Samoyeds liken the Thunder bird to a duck whose sneezing causes rain,
    and the bird is also imagined as an Iron bird.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yurak Samoyeds make an image of thunder in goose form and say the Thunder
    bird attends and protects the shaman's soul; one shaman is said to have wandered
    for years in the air accompanied by the giant bird.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Yakut tale has a hero ask why he should not change himself into a bird and
    pretend to be ruler of rain and thunder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Tremyugan Ostiak belief, thunder appears as a black bird resembling a grouse
    and screaming loudly.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mongol tribes, many Altai peoples, and some Eastern Tungus groups such as
    the Goldes say thunder is caused by a large flying dragon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Mongol dragon has wings and fish scales, lives sometimes in water and
    sometimes in the air, and its movement, voice, or tail is connected with thunder
    and lightning.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dragon is said not to come near enough to earth to be seen and to winter
    in lofty mountains, dense forests, or the sea, depending on local explanation.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Altai peoples say lightning and thunder follow when the dragon strikes two
    stones together, one in its mouth and the other in its hand.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A Tengeri is said to ride the dragon while chasing a striped or flying squirrel
    that tore out the eye of God's youngest son in Heaven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: During a thunderstorm, it is considered dangerous to stand under a tree where
    a squirrel is hiding because lightning always strikes such trees; the passage
    says this belief is also common among the Buriats.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Goldes say the dragon pursues evil spirits who hide anywhere when a thunderstorm
    arises.
  category: action
  evidence_refs:
  - ev:11
