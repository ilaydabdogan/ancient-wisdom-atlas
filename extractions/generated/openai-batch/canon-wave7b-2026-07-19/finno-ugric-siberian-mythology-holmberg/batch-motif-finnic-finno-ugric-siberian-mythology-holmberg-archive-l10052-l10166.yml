canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and Siberian beliefs and rites concerning
    a Heaven god: his remoteness among northern peoples, his agricultural and procreative
    functions, later expansion under Christian and Islamic influence, a female Mother
    of heaven associated with childbirth, and sacrificial customs involving eastward
    orientation, white animals or cloth, white or leaf trees, burnt offerings, and
    elevated ritual places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among some northern peoples, sacrifices to the Heaven god are described as
    very rare because the deity is considered too far away to be interested in human
    life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The worship of the Heaven god is described as closely connected with agriculture,
    with sacrifices chiefly made so that fields may become fruitful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For some Votiaks, sacrifice to Inmar is limited to the summer months and becomes
    unsuitable after the beginning of winter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Votiaks call Inmar “the procreator and nourisher,” and Mordvin names for
    the god dwelling on high are connected in the passage with procreation or giving
    birth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Vogul prayer to Numi-Torem asks the father deity to send down fish from
    the sea and game from the forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Volga Finns, the Heaven god is said to have become more powerful
    in later times under Christian and Islamic influence, but he is still approached
    for material needs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inmar is described in the cited account as a good spirit who protects life
    and gives food and clothing, while having nothing to do with relations among people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the Heaven god did not originally watch over morality
    among Finno-Ugric peoples, whereas spirits of the dead were supposed to do so.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Beside the male Heaven god, generally called Father, sacrificial prayers of
    peoples by the Volga and Ob mention a female deity called the Mother of heaven.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Mother of heaven is described as a guardian-spirit of childbirth, later
    merged into the Virgin Mary, and sometimes pictured in folktales as the wife of
    the Heaven god.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: In sacrifice to the Heaven god, sacrificing priests and the sacrificial animal
    keep their faces turned toward the rising sun, unlike worship of the dead, which
    turns in the opposite direction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Cheremiss and Votiaks are said to distinguish the two ritual orientations
    with expressions meaning “sacrificing upward” and “sacrificing downward.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The sacrificial animal for the Heaven god should be white when possible; when
    not possible, Ostiaks place a white cloth over the animal’s back.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sacrificial tree of the Heaven god should be a leaf or “white” tree, while
    trees of the dead are coniferous or “dark.”
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Burnt offerings are most often offered to the Heaven god, and the sacrifice
    is performed on a hill or high place because smoke from the plains could not reach
    the sky.
  category: action
  evidence_refs:
  - ev:7
