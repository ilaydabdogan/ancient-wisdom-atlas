canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and Siberian beliefs and rites concerning
    atmospheric powers: Lapp and Ostiak wind personifications, wind sacrifices and
    wind-bundle magic; Votiak, Cheremiss, Mordvin, and southern Lapp frost rites;
    Cheremiss offerings to the Cloud mother and beliefs about living clouds; and a
    twilight work taboo with a noted Volga Tatar parallel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage includes a plate caption identifying an “Ostiak Sacrifice” after
    a photograph by K. F. Karjalainen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Lapp “Wind man” is described as pictured on magic drums with a spade in
    his right hand.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lapps are said to call on the Wind man when harmful wind threatens reindeer
    herds on mountains or when storms endanger fishing at sea, promising sacrifices
    on his altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sacrifices to the Wind god, a bundle of twigs, sometimes birch and called
    the “nest of wind,” is set up at the altar and smeared with sacrificial blood;
    boats and spades are also offered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A reported Lapp wind-magic binds an appeal to the Wind god into three bundles;
    opening them produces a moderate storm, then a dangerous storm, then inevitable
    shipwreck.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that this wind-invoking magic was reported as early as
    the thirteenth century, used by Finns and Esthonians, and adopted from Scandinavians.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among the Ostiaks, wind is personified as the “Wind old man”; hunters at Vasyugan
    sacrifice a small piece of white cloth at a birch-tree for hunting luck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Votiaks sacrifice a grey lamb or a duck to the “rimefrost” when rime appears
    on fields during cold spring nights, and some districts make an annual Easter-time
    sacrifice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cheremiss prayers name a “Frost man” and “Frost woman,” but the passage says
    they are not regarded as anthropomorphic beings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: In some Cheremiss districts, morning-frost is called the “Frost man” and evening-frost
    the “Frost woman”; grey ram and grey sheep sacrifices are made, with prayers that
    frost not spoil seed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mordvins place porridge for the “Frost man” in the smoke-outlet on the Thursday
    before Easter and pray for protection of spring sowings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says the Russians had an absolutely identical custom to the Mordvin
    porridge offering for the Frost man.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says there are no reliable accounts of sacrifices to the Frost
    god among the Baltic Finns, although frost is personified in Finnish magic songs.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: The most southern Lapps in Scandinavia worshipped a “Frost man” described
    as a god of weather, snow, and ice, with sacrifices so ice would not harm reindeer
    and blizzards would cease.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Cheremiss “Cloud mother” is remembered at great sacrificial feasts with
    a drink-offering poured into the fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Cheremiss are said to regard clouds as living beings that move and wander,
    and that can be called toward a person or asked to travel away.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The “twilight” is worshipped by avoiding work, especially noisy work, after
    sunset, lest it punish people; the passage notes a similar Volga Tatar belief.
  category: action
  evidence_refs:
  - ev:11
