canonical_text:
  quote: ''
  summary: 'The passage surveys forest and animal-associated spirits among Lapp/Sámi
    groups as reported by earlier sources: Leib-olmai, connected with bears and bear
    hunting; Luot-hozjik and related reindeer spirits; a wolf tutelary genius; and
    Barbmo-akka, associated with migratory birds. It describes prayers, offerings,
    taboos, animal protection, hunting success, and one reindeer-human transformation
    account.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames forest spirits in relation to hunting as an important means
    of existence for Finno-Ugrian tribes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Missionary reports say the Scandinavian Lapps worshipped Leib-olmai, called
    the “Alder man,” for hunting luck.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Randulf describes Leib-olmai as a bear-man or bear-god who protects the bear
    and presents it to the Lapps when they pray and call for it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the Lapps had not asked Leib-olmai for help, they could lose their prey,
    and the god might help the bear against its assailants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before bear hunting, the Lapps are said to consult magic drums and pray that
    the spirit not take the bear’s part.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Randulf states that hunting equipment, bows, and arrows were offered to Leib-olmai.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kildal reports a restriction concerning women walking around a tent where
    there is a gun, connected with the Forest spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Forbus reports sprinkling alder-bark extract on hunters’ faces at bear-feasts
