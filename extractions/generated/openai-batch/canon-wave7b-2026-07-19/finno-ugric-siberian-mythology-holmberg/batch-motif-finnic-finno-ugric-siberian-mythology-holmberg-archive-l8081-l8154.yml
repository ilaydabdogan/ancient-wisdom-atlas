candidate_motifs:
- id: motif:1
  label: Animal-specific tutelary genius
  taxonomy_refs: []
  basis: 'The passage repeatedly associates spirits or geniuses with particular animals:
    bear, reindeer, wolf, and migratory birds.'
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Some identifications, especially Leib-olmai and Mientus as species geniuses,
    are presented as the source author’s cautious interpretation rather than direct
    quoted belief statements.
- id: motif:2
  label: Sacred exchange with a hunting or herd spirit
  taxonomy_refs:
  - sacred_exchange
  basis: Hunters pray to Leib-olmai for bears and offer hunting equipment; Russian
    Lapps pray to Luot-hozjik for reindeer protection and thank her when flocks return.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage gives limited detail on offering procedure and does not frame
    all prayers as formal reciprocal exchange.
- id: motif:3
  label: Spirit may withhold prey or aid the animal if not invoked
  taxonomy_refs: []
  basis: If hunters do not ask Leib-olmai’s assistance, they may lose prey and the
    god may help the bear rush upon assailants.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is specific to the bear-hunting account and should not automatically
    be extended to all forest spirits in the passage.
- id: motif:4
  label: Reindeer-human shapeshifter shedding horns
  taxonomy_refs:
  - shapeshifter
  basis: Mientus is said to be like a male reindeer at times and to become human by
    casting off its horns.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Only one brief tale reference is summarized; no full narrative context
    is provided.
- id: motif:5
  label: Seasonal return of animals mediated by an old-woman spirit
  taxonomy_refs:
  - seasonal_cycle
  basis: Barbmo-akka, whose name includes “old woman,” brings migratory birds back
    to northern countries from the warm south.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage mentions seasonal movement but gives no ritual calendar or
    extended mythic narrative.
- id: motif:6
  label: Gendered restriction around hunting weapon and spirit power
  taxonomy_refs: []
  basis: A woman may not walk around a tent where there is a gun, and the passage
    connects this rule with the Forest spirit.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The report says the connection is “in some way” with the Forest spirit,
    leaving the rationale unclear.
comparison_claims:
- id: claim:1
  claim: Within the passage, Leib-olmai, Mientus or reindeer spirits, the wolf genius,
    and Barbmo-akka share the function of being animal-specific tutelary or controlling
    spirits.
  claim_level: same_function
  target: Animal-specific tutelary spirit pattern among the Lapp/Sámi figures described
    in this passage
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage compiles reports from different sources and groups; the
    claim is functional, not evidence of a single origin or identical figure.
- id: claim:2
  claim: Luot-hozjik and Pots-hozjin/Pots-hozjik are presented as functionally equivalent
    reindeer-protecting spirits.
  claim_level: same_function
  target: Russian Lapp reindeer spirit names Luot-hozjik, Pots-hozjin, and Pots-hozjik
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage says the duties are the same, but it does not prove that
    the named beings are identical in all local traditions.
- id: claim:3
  claim: The passage itself compares Leib-olmai as bear genius with Mientus as probable
    wild-reindeer genius.
  claim_level: same_function
  target: Leib-olmai and Mientus as species geniuses
  evidence_refs:
  - ev:4
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: Both identifications are mediated by the source author’s cautious wording,
    including “would seem” and “probably.”
