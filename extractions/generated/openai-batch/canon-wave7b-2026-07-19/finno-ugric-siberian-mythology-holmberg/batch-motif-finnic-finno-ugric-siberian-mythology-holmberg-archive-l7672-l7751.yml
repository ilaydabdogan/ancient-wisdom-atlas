  summary: 'The passage surveys Votiak and Cheremiss household and cattleyard spirits:
    a house spirit dwelling under the floor; Cheremiss House man and House woman invoked
    for protection, health, children, riches, and prosperity through prayers and offerings;
    the harmful Suksendal, said to be of Tatar origin, causing nightmares, sexual
