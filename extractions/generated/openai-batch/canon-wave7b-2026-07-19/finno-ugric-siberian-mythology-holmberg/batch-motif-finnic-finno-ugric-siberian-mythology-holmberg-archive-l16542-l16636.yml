canonical_text:
  quote: ''
  summary: The passage surveys Central and North Asian, Siberian, and Volga Finnic
    tales about the creation of humans. It describes varying body materials, life-giving
    breath or spirit, antagonism between God or creator figures and the devil, dog
    or human guardians who are bribed, defilement of unfinished human bodies or images,
    inside-out transformation, and etiologies for human internal filth and some diseases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Different peoples are said to describe the first human body as made from red
    clay, stone, water, reeds, willow twigs, clay, earth, snow, or rubbed pieces of
    earth.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: The passage states that many creation-of-man tales contain two antagonistic
    beings, God and the devil, and that the devil mars God's work before the human
    has received life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:3
  text: The dog is described as an important guardian figure whom God sets to watch
    over man or the first people.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:4
  text: In the Black Tatar story, Pajana forms the first people from earth, cannot
    give them life, goes to Heaven to Kudai for a life-giving spirit, and leaves a
    dog to guard them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: In the Black Tatar story, Erlik bribes the naked dog with golden hairs and
    receives access to the soulless people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: In the Black Tatar story, Erlik defiles the people by spitting on them; after
    Kudai approaches, God turns the defiled bodies inside out, explaining why the
    human interior is full of filth and spittle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: In the Yakut tale, God builds a great stone house, places seven stone images
    in it, and appoints Man to guard them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: In the Yakut tale, the devil gains entrance by promising Man an indestructible
    garment, soils the images, and God changes the guardian into a dog, turns the
    images inside out, and blows a spirit into them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage says corresponding Volga Finnic tales explain why the inside of
    God-created man is unclean; Mordvin, Russian, and Samoyed examples connect the
    devil's spittle or saliva with diseases or eruptions.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:10
  text: Another cycle mentioned at the end says that people originally had a covering
    of hair or nail-matter before the devil soiled them.
  category: attribute
  evidence_refs:
  - ev:12
