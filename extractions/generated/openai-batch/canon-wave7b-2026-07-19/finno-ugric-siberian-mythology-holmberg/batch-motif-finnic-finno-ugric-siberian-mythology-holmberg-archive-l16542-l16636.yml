candidate_motifs:
- id: motif:1
  label: First humans fashioned from earth and other natural materials
  taxonomy_refs: []
  basis: The passage lists multiple variants in which the body, bones, blood, skeleton,
    or first man and woman are made from clay, stone, water, reeds, willow twigs,
    snow, or earth.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The materials differ by people and tale; the passage is a survey rather
    than a single narrative.
- id: motif:2
  label: Life imparted after bodily formation by breath or spirit
  taxonomy_refs: []
  basis: Bodies or images are formed before they receive life; God blows into forms,
    Pajana seeks a life-giving spirit from Kudai, and God blows a spirit into Yakut
    images.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage does not present one uniform mechanism across all cited peoples.
- id: motif:3
  label: Creator and adversary struggle over unfinished humanity
  taxonomy_refs:
  - duality
  basis: The passage explicitly describes God and the devil as antagonistic beings,
    with the devil marring God's work before humans receive life.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:9
  confidence: high
  cautions: The named figures and details vary by tradition.
- id: motif:4
  label: Bribed guardian allows hostile access to first humans
  taxonomy_refs:
  - trickster_boundary
  basis: A dog or Man is appointed to guard unfinished people or images, but the devil
    gains access through promises of hair or an indestructible garment.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is used cautiously because the passage does not
    label the devil a trickster; it only shows boundary-crossing through bribery.
- id: motif:5
  label: Demonic defilement explains human internal filth and disease
  taxonomy_refs: []
  basis: The devil's spitting, saliva, or soiling of human bodies or images explains
    the filth inside people and, in some variants, internal diseases, cough, eruptions,
    pox, and gatherings.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: Disease examples are summarized across several traditions and are not
    all tied to the same narrative sequence.
- id: motif:6
  label: Inside-out body transformation after pollution
  taxonomy_refs: []
  basis: In the Black Tatar and Yakut tales, God turns defiled human bodies or images
    inside out before or while giving life, making the pollution internal.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The Samoyed tale is explicitly said not to contain this inside-out element.
- id: motif:7
  label: Original or acquired bodily covering of dog and humans
  taxonomy_refs: []
  basis: The dog is naked before being promised golden hairs, the Samoyed dog receives
    hair through the devil's stroking, and another cycle says humans originally had
    hair or nail-matter covering.
  evidence_refs:
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The final cycle is only briefly introduced, so the exact relation to the
    preceding dog-hair variants is uncertain.
