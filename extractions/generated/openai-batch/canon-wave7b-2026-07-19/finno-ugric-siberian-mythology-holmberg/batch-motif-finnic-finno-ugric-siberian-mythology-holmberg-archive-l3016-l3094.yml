canonical_text:
  quote: ''
  summary: 'The passage describes Finnish and related memorial-season customs: guests
    or spirits are dismissed with libations; signs in bath water predict harvest or
    famine; Kekri includes masked visitors, hospitality, omens for the coming year,
    death divinations, and fires on hills; related Baltic Finn, Esthonian, Russian
    Lapp, Scandinavian, and Lapp Christmas practices are noted, including wandering
    dead, offerings of food and water, silence rules, and protection of wells with
    metal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the evening of All Souls’ Day, a host takes guests out of the yard late,
    in darkness, bareheaded, while pouring beer and brandy on the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Straws found in the water after the baths of the “saints” signify a good harvest,
    while chips of wood or bits of coal signify famine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Kekri, people disguise themselves in unusual costumes and wear face masks
    made of materials such as birch-bark or paper.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Masked persons called Kekritar wander anonymously from house to house and
    village to village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kekritar threaten to pull down household ovens if they are not abundantly
    entertained and regaled.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: During All Saints’ time, beggars are customarily given food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People try to make spirits reveal coming events, including by casting molten
    tin into water and interpreting the resulting figure.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the night before Kekri, people listen under windows and infer the coming
    year from conversations heard inside the hut.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sticks counted in the oven in the evening are checked in the morning; missing
    sticks indicate deaths in the house during the following year.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: One rye ear per family member is pressed into bread; the person whose ear
    burns up during baking is expected to die before the next Kekri.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A piece cut from a loaf and dropped on the table predicts a good year if it
    falls crust-down, and disaster otherwise.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: One grain of salt per family member is placed on a window-sill; the person
    whose grain melts overnight is expected to die.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kekri-fires are burned on hills from oakum mixed with straw; the passage says
    this was most probably to drive away spirits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that a corresponding feast is known among Esthonians and
    appears common among Baltic Finns, with later Catholic calendar influence.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Western Finland, spirits are believed to walk at Christmas, and young people
    mask themselves and go around farms as “Christmas Mothers.”
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that the Western Finnish Christmas masking custom and its
    underlying idea were borrowed from Scandinavia.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Lapps are said to believe that at Christmas the dead leave their underground
    dwelling and wander through woods and fells.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Children are required to keep still during the Christmas wandering of the
    dead, because noise would cause ghosts to appear.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: On Christmas night, shamans sitting at the entrance of their dwelling feel
    spirits climbing over their legs into the tent.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Food, especially water, is set out when the spirits come.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: Pieces of metal are thrown into well water on the “most dangerous evening”
    to protect the wells from spirits.
  category: action
  evidence_refs:
  - ev:12
- id: obs:22
  text: If the underground people are not treated well, they may take cruel revenge,
