canonical_text:
  quote: ''
  summary: The passage describes Votiak lud sanctuaries and rites, interprets many
    features as connected with worship of the dead, gives examples of Votiak ancestor
    or hero worship centered on Mardan, and compares the Votiak lud cult with Cheremiss
    keremet and Chuvash sanctuary traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate captions identify Votiak lud-kualciy as a former storeplace for
    offerings and sacrificial vessels, and identify a Votiak lud-kuala in the Birsk
    district.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Votiak rite, a guardian reads prayers asking protection for
    humans, animals, and fields from sickness, evils, hail, and storms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After each prayer, the kneeling congregation touches the ground with their
    foreheads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When leaving the sanctuary, people bow low to the lud and ask it to live happily
    and protect them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The festival may continue at the guardian’s house, where men and women gather
    and sing that the lud-spirit has wished them peace and given blessing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that the Votiaks themselves do not always know the origin
    of the lud-spirit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lud-spirit is described as appearing in dreams in human shape, being fixed
    to a place, being worshipped by families, and receiving evening sacrifice with
    the worshipper’s face turned west or north.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Black sacrificial animals are presented in the passage as a sign pointing
    to worship of the deceased.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Votiaks sometimes worship in their lud a spirit called Sulton, and the
    Chuvashes apply a related epithet to a sanctuary-dwelling spirit called kiramat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says Turco-Tatar influence is indicated by the Votiak belief that
    the lud may appear in dreams as a Tatar when desiring a sacrifice.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Eleven villages in Bussurman-Mozhga celebrate the memory of Mardan, described
    as the founder of their line, who came from the north and chose the village as
    his dwelling-place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Every third year a horse is sacrificed to Mardan and a cow to his wife, with
    an annual sheep sacrifice also made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The thanksgiving to Mardan thanks Father Mardan for fine children and a fine
    harvest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Cheremiss fenced sanctuaries are called keremet; sacrifices there are described
    as made downward or toward the night, unlike sacrifices to Nature gods made upward
    or toward the sun.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Cheremiss keremet groves of the lower spirits are feared, should contain coniferous
    trees where possible, and prohibit foreign tongues because the resident spirit
    is said to hate them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: Cheremiss keremet sanctuaries may be tied to clans, villages, founders, places,
    individual families, or wider groups of villages.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: In the Urzhum District, several sacrifice-trees may stand in the same gloomy
    fir forest, with different families offering sacrifices by them.
  category: setting
  evidence_refs:
  - ev:9
