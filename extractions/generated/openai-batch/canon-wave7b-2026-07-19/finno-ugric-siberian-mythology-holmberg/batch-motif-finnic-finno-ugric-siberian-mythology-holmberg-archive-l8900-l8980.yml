canonical_text:
  quote: ''
  summary: 'The passage describes Votiak beliefs about the Water man and related water
    spirits: their names, appearance, watery dwellings, family, occasional human or
    fish manifestations, seasonal weddings, winter visits to villages and bath-houses,
    ritual expulsion and offerings, harmful powers, and possible aid when appeased.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Votiaks call the water spirit Vu-murt, translated as “Water man,” and
    in some places Vu-kuzo, translated as “Water master.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Water man is described as human-like, often naked, with very big eyes
    and long black hair.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stones resembling thunderbolts found on river shores are called or understood
    as the fingers of the Water man.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Water man usually lives in deep waters such as large rivers and seas,
    but also in brooks and especially mill ponds; he has a house and family in the
    water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: In folk-tales the Water man may seek human company at great fairs, dressed
    as a peasant and recognizable by the damp left side of his coat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: An appearance of the otherwise invisible Water man is said to forebode death
    or other misfortune.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: The female water spirit is described as beautiful, naked, glistening white,
    and sometimes with very large breasts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The wife or daughter of the Water man may emerge at twilight on the shore
    to comb her long black hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Both male and female water spirits are shy and throw themselves into the water
    when observed by humans.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: The Water man may become visible in the shape of a fish, specifically an enormous
    pike that sleeps with its head in the opposite direction from other pikes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Water spirits have weddings twice a year, in spring and autumn, moving noisily
    in the water and causing inundations that can break mill sluices.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Northern Votiaks say the water spirits come before Christmas to villages,
    occupy bath-houses, and may be met in twilight streets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: During this winter period people avoid going out alone without a light and
    avoid making noise near water, rinsing dirty clothes, or ferrying singing people
    across rivers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After Twelfth Day the Votiaks accompany the Water spirits back to the water,
    and Epiphany is called “the following of the Water spirit.”
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: On Twelfth Night young people go with torches from bath-house to bath-house
    to hear their fate and call to the Water man to leave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The following morning men with axes, sticks, or branches go to the river,
    knock on the ice, and tell the spirit to go away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: Offerings of bread, porridge, and meat are thrown into the water while asking
    the river to preserve people from disease and accidents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: In some districts a duck was sacrificed to the Water man through an ice-hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: The Water man is regarded more as evil than good, bringing ruin to people
    and animals, breaking ice under wanderers, and sending sickness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:20
  text: If appeased, the Water man can help millers, drive fish into fishermen’s nets,
    and protect and increase water birds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:21
  text: In autumn the Votiaks sacrifice a duck or goose in the river so that no one
    will drown or be taken ill with ague, and they pray for protection of geese and
    ducks.
  category: action
  evidence_refs:
  - ev:7
