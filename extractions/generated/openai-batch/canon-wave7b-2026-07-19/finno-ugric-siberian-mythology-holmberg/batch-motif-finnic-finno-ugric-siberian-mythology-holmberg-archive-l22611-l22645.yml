  summary: The passage explains shamanic implements and costume parts as means enabling
    shamanic flight and travel. It describes soul or shadow images on Tungus and Yenisei
    Ostiak shaman costumes, then recounts a tale in which the first shaman Doh drops
    his shadow during a skyward flight; evil spirits take it to the land of the dead,
    where Khosadam, female ruler of the dead, attempts to devour it. The passage ends
    mid-sentence with textual/scanning artifacts.
