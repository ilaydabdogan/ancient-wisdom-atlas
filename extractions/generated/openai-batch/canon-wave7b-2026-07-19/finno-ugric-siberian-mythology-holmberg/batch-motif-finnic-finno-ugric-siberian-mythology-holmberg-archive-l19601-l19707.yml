candidate_motifs:
- id: motif:1
  label: first fire descends from heaven or lightning
  taxonomy_refs: []
  basis: The passage states that first fire came down from heaven and gives Tungus,
    Yakut, Buriat, and Ostiak lightning or sky-fire examples.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage is a comparative survey; it does not prove a single historical
    source for the accounts.
- id: motif:2
  label: celestial deity or bird gives fire to humans
  taxonomy_refs: []
  basis: The Thunder bird brings fire, Ulu-Tojon gives first fire, and Galta-Ulan-Tengeri
    is first sender of fire.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The named figures differ in type and tradition; the shared element is
    the role of celestial fire-bringer or sender.
- id: motif:3
  label: fire generated from stones, flint, steel, or iron
  taxonomy_refs: []
  basis: Ulgen strikes two stones; Porcupine's secret concerns flintstone and steel;
    the frog points to mountain stones and birch tinder; a Mongol saying names iron
    and stone as fire's parents.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents this as an explanation distinct from heavenly lightning
    fire.
- id: motif:4
  label: animal inventor or adviser of fire-making
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Porcupine is described as a wise animal inventor who alone can make fire,
    and the frog advises Ulgen about the materials needed to strike fire.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy labels are broad; the passage does not itself use the phrase
    culture hero.
- id: motif:5
  label: theft of secret fire-making knowledge
  taxonomy_refs:
  - sacred_theft
  - forbidden_knowledge
  basis: A hawk sent by the gods overhears and steals Porcupine's secret of flintstone
    and steel, then tells it to the gods, from whom humans learn fire-making.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The stolen item is knowledge of making fire, not a physical flame.
- id: motif:6
  label: protective or purifying new friction-fire
  taxonomy_refs: []
  basis: Friction-fire is made during epidemics or plagues, used to purify people
    and cattle, and carried home as new fire.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage notes that Yakuts say they learned this custom from Russians.
- id: motif:7
  label: cosmogonic birth of fire from tree or Heaven-Earth separation
  taxonomy_refs: []
  basis: Mongolian prayers are summarized as saying that fire came from a tree or
    was born when Heaven and Earth separated.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage only briefly summarizes these prayer variants.
comparison_claims:
- id: claim:1
  claim: The passage explicitly groups multiple Altaic and North Siberian accounts
    under a shared motif of first fire coming from heaven or lightning.
  claim_level: same_motif
  target: heavenly or lightning-origin fire accounts among Tungus, Yakut, Buriat,
    Ostiak, and broader Altaic materials
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: The comparison is motif-level only; the passage does not establish
    historical contact, common inheritance, or a single original version.
- id: claim:2
  claim: The passage identifies a second shared motif in which fire is produced from
    stone, flint, steel, or iron, appearing in Altai Tatar, Buriat, Mongol, and Finnish
    materials.
  claim_level: same_motif
  target: stone-origin or struck-fire motif in Altai Tatar, Buriat, Mongol, and Finnish
    poem materials
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  counter_evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  limitations: The passage states the recurrence of the explanation but does not specify
    transmission routes or exact Finnish poem passages.
- id: claim:3
  claim: Yakut, Tatar, and Chuvash friction-fire practices share a protective or purifying
    ritual function during epidemics, plagues, or similar danger.
  claim_level: same_function
  target: friction-fire or new-fire purification rites among Yakuts, Tatars of Eastern
    Russia, and Chuvash
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The Yakut example includes an explicit note that local people say they
    learned the custom from Russians; the passage does not settle origin or diffusion.
