canonical_text:
  quote: ''
  summary: The passage surveys accounts of the origin and uses of fire among Yakut,
    Tungus, Buriat, Altai Tatar, Ostiak, Mongol, Finnish, Tatar, and Chuvash materials.
    It describes fire as heavenly or lightning-borne, as produced from stone or tree
    materials, as secret knowledge held or stolen from animal figures, and as friction-fire
    used in protective or purifying rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Yakut hero asks about the origin, purpose, and power of fire and concludes
    that fire is the son of Yryn-Ai-Tojon, who sits on a milk-white throne reached
    by three flights of silver stairs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that belief in the first fire coming down from heaven
    is common among peoples described as of the Altaic race.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Tungus account says the Thunder bird brought fire down from the sky to
    earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tungus consider lightning-caused fire sacred and do not dare extinguish
    a forest fire lighted from heaven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Yakuts, the Thunder god Ulu-Tojon is said to have given people the
    first fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Buriat fire god Galta-Ulan-Tengeri is described as the first sender of
    fire, as god of heat and drought, and as sender of lightning that sets fire to
    what it strikes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: In an Altai Tatar account, humans first lived on vegetables and fruits and
    did not need fire; later Ulgen struck a white stone and a black stone together,
    producing a spark that flew from sky to earth and set dry grass on fire, from
    which humans learned to strike fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Through a Buriat shaman, fire declares itself to be the middle son of the
    day-sky and the youngest son of the night-sky.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Yenisei Ostiak account says lightning kindled a tree, a great shaman taught
    people to use the fire, and later fire-steel and tinder were placed beside the
    communal fire so that fire was transferred to those objects.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a Buriat tale, Porcupine alone can make fire; after maidens laugh at him,
    he decides to reveal the fire-making secret only to his wife and only under a
    promise of silence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A hawk sent by the gods overhears Porcupine explaining flintstone and steel
    to his wife, tells the gods, and humans learn the art of making fire from them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Altai Tatar tales, a frog advises Ulgen that mountains contain stones and
    birch contains tinder for striking fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Mongol saying describes iron as the father of fire and stone as its mother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'The passage summarizes two explanations for fire: it came down from heaven
    with lightning, or its spark sprang from stone; it adds that both explanations
    occur in Finnish poems on the origin of fire.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:15
  text: Mongolian prayers are said to relate that fire came from a tree or was born
    when Heaven and Earth separated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that lightning-caused fire is esteemed holier than other
    fires, while wood-fire or friction-fire has been important in expelling diseases.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: During epidemics, Yakuts are said to make fire by rubbing two pieces of dry
    wood together, with this fire understood to have special protecting powers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Tatars of Eastern Russia and Chuvash extinguish old household fires, light
    a friction bonfire outside the village, jump over it, drive cattle through it,
    and carry a brand of new fire home.
  category: sequence
  evidence_refs:
  - ev:9
