canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugrian and related beliefs about the underworld
    as an inverted realm, the fate and possible rebirth or diminution of the dead,
    reversed rites for the departed, graveyard communities with rulers or elders,
    the danger of dying away from home, Manala or Tuonela as an underground realm,
    and a later motif of a black river and bridge on the way to Tuonela with comparisons
    to Scandinavian, Christian, Islamic, and Persian traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The underworld is described as contrary to the world of the living: the sun
    rises in the west and sets in the east, and life there runs in reverse.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead or their shades become younger and smaller with the years until they
    disappear, become nothing, or are born again into the family as children; an Ostiak
    belief says the dead finally dwindle to a little beetle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Rites for the dead are described as reversed: washing or sacrificing with
    the left hand, holding a sickle by the blade, throwing it backward over the head,
    sacrificing backward or contrary to the sun''s motion, wearing clothes inside-out,
    and placing offerings upside-down on graves.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the idea of an inverted world seems to have been derived
    from reflection seen in water.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dead are believed to live together in villages, with each person's coffin
    forming a private house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Volga Finns, the first person buried is called the graveyard ruler,
    is supposed to keep order in the graveyard community, and receives a special candle
    and food offerings at commemoration feasts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Votiak belief says the dead receive newcomers known in life for evil ways
    and quarrelsomeness very unwillingly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Death in a strange district is regarded as calamitous because the shade is
    believed to remain where the body lies or nearby, preventing it from joining relatives;
    certain tribes, including the Voguls, perform a mock burial to entice the dead
    to the home burial-place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Finns call the world beyond under the earth Manala, meaning underground,
    or Tuonela, the home of Tuoni.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Tuonela everyone has a house; the passage identifies this house with the
    grave, citing descriptions of turf roof, sand floor, and the house being carpeted
    with women's hair and supported by men's bones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: An Ingrian weeping song mentions Manalan vanhimmat, the elders of the underworld,
    who appear to have governing rank and may restrict visits by the dead to the world
    of the living.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Folk poetry describes the way to Tuonela as requiring passage over the black
    river of Tuonela, on which neither sun nor moon shines, and across a bridge called
    the bridge of Tuonela or Manala.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the comparative material, Gregory the Great is said to relate a near-death
    vision of a bridge over a gloomy black stream where judgment occurred and unrighteous
    persons fell into dark, evil-smelling waters.
  category: action
  evidence_refs:
  - ev:6
