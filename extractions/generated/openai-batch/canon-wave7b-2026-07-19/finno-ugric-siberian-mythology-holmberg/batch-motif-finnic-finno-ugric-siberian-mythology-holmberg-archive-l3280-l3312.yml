  summary: The passage surveys beliefs and practices concerning life after death among
    several Finno-Ugric and Siberian peoples. It describes the dead as needing provisions,
    tools, warmth, and food; continuing ordinary work and social life; dwelling below
    the earth; sometimes facing a second death; and inhabiting an underworld that
    resembles this world but appears inverted or reversed.
