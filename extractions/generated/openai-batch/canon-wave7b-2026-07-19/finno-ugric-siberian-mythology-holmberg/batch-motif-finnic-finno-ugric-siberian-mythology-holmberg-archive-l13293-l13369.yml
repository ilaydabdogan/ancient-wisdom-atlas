canonical_text:
  quote: ''
  summary: The passage describes Lapp shamanic drum use, song, trance collapse, protection
    of the unconscious body, divination, sickness diagnosis, underworld spirit travel,
    soul theft as a cause of illness, and a ritual underworld voyage with helpers,
    attendants, fire, axe actions, and women attempting to locate the shaman's wandering
    soul in holy places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The shaman sang a special song joined by the other Lapps present, with men
    required to sing louder than women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song repeatedly named a mountain where information-giving spirits were
    believed to dwell and named the district from which news was desired.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the shaman beat the drum and sang louder, he became excited, the ring stopped
    at one place, his face darkened, he sank to his knees, and he finally fell to
    the ground as if dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: No article was allowed to touch the shaman's unconscious body, because the
    Lapps believed the spirit would not return if that happened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The men and women present continued singing until the shaman regained consciousness,
    after which he was reminded of the question and related what he had discovered
    during trance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says the drum could be used for divination and as an excitant
    for trance, though these uses were generally kept separate.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: For minor questions such as hunting or fishing success, any male person could
    use his drum without being an actual shaman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: For serious misfortunes such as severe sickness, the cause was sought in an
    unconscious condition, and the drum was used to help induce that condition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A real shaman was required for serious sickness because he alone was said
    to be able to visit spirits dwelling under the earth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Illness was attributed to causes including a departed person's desire for
    a relative's company, punishment for wrongdoing or neglected duty, theft of the
    sick person's soul, or removal of an article closely connected with the sick person.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The shaman's task was to learn what the departed spirits required, why they
    were angry, and how they could be appeased so the sick person would be left in
    peace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before a voyage to the underworld, the shaman called together helping spirits
    invisible to others and required particular human attendants to be present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The shaman bared his head, loosened belt and shoe-strings, covered his face,
    bent his body backward and forward, and shouted commands about harnessing reindeer
    and pushing out a boat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: After drinking gin, the shaman handled firebrands with bare hands, used an
    axe against himself and over his shoulders, ran three times around the assisting
    females with the axe, and collapsed unconscious.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: While the shaman lay unconscious, no one could touch him and watchers kept
    even a fly from settling on him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The shaman's soul was believed to be wandering in the underworld, somewhere
    in the holy mountains, while his body lay unconscious.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: Women present whispered names of holy places to guess the spirit's location;
    if they named the exact place, the shaman moved an arm or leg.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: When the shaman began to awaken and start a song weakly, the women raised
    their voices and joined in.
  category: sequence
  evidence_refs:
  - ev:7
