candidate_motifs:
- id: motif:1
  label: Masking to avoid recognition by the honored bear
  taxonomy_refs: []
  basis: The plate caption states that bear-feast players wear masks in order to prevent
    the bear from recognizing them.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives this as a caption note only and does not explain the
    rite further.
- id: motif:2
  label: Ritual exchange with the dead bear for luck and protection
  taxonomy_refs:
  - sacred_exchange
  basis: Food is placed before the bear-skin, morsels are eaten for luck, a ring is
    placed in the bear’s claw, and the bear is asked not to harm livestock.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The exchange pattern is explicit in action and speech, but the taxonomy
    label is broad and should be reviewed.
- id: motif:3
  label: Bear feast as wedding
  taxonomy_refs:
  - sacred_marriage
  basis: The Finns call the bear feast “the wedding,” appoint bridegroom and bride
    figures according to the bear’s sex, give them an honored place, and later process
    ceremonially with the skull as at a wedding.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage uses wedding terminology, but it does not explicitly identify
    a divine marriage; taxonomy assignment is provisional.
- id: motif:4
  label: Denial of responsibility for killing the honored animal
  taxonomy_refs: []
  basis: Finnish hunters sing that they are innocent of the bear’s killing, saying
    that it wounded itself or that its death was accidental.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Limited here to the bear-feast context described in the passage.
- id: motif:5
  label: Imitating the bear to gain further hunting success
  taxonomy_refs: []
  basis: The Rothovius account reports participants drinking the bear’s health from
    its skull, acting and growling like the bear, and thereby seeking further success.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The evidence is a quoted early report summarized within the passage.
- id: motif:6
  label: Preservation and elevated placement of skulls and bones
  taxonomy_refs: []
  basis: The bear skull is taken to a tree; Samoyeds hang it in a tree or place it
    on a pole; Lapps and Samoyeds preserve animal bones, with some bones placed in
    water, dry protected places, or trees.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage asks about original purpose but does not resolve it; no rebirth
    or afterlife interpretation is asserted here.
- id: motif:7
  label: Extending bear-like honor rites to other valuable animals
  taxonomy_refs: []
  basis: The passage says other wild animals also had to be treated with honor, and
    gives Ostiak stag and otter images cut in pine as an example of a practice also
    used with the bear.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: Only stag and otter picture-cutting is detailed in this passage.
