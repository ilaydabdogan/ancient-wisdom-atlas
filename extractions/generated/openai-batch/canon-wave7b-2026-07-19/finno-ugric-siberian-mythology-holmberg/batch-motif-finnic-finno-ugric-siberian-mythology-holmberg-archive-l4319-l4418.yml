canonical_text:
  quote: ''
  summary: 'The passage describes bear-feast practices among Vogul, Ostiak, Finnic,
    Samoyed, and Lapp contexts: masking to avoid recognition by the bear, honoring
    the dead bear or bear-skin with food, ring, prayers, wedding-like roles and songs,
    drinking from the skull, carrying the skull to a tree, and preserving animal skulls
    and bones. It also extends similar honor practices to other wild animals and describes
    bone disposal according to land or water habitat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Players at a Vogul bear-feast are described as masked so that the bear will
    not recognize them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the last feast night, the bear-skin is carried through the window to
    a warehouse-shed, and the dish first placed before it in the house is put in front
    of it there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After two or three days, hunters gather again, go to the shed, and each eats
    a morsel from the dish for luck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Ostiak prayers and wishes to the dead bear show that
    honoring it is intended to honor the whole race of bears.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An Ostiak woman places a ring in the bear’s claw and speaks to it about going
    around trees when she gathers berries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When food is set before the bear-skin, speakers ask it not to touch their
    horse or cow, referring to the dish placed before it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Finns call the bear feast “the wedding”; the house is cleaned and everyone
    wears their best clothing.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A young man and young girl may be dressed as bridegroom and bride; alternatively,
    only a bridegroom is chosen for a female bear or only a bride for a male bear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bear’s head is placed highest on the table, the rest of the meat is arranged
    in natural order, and the bridegroom and bride sit in the place of honor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Finnish hunters sing runes in honor of the bear and present themselves as
    innocent of killing it, saying that it wounded itself or was killed by accident.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A seventeenth-century account says that Finns held a dark feast after capturing
    a bear, drank the bear’s health from its skull, acted and growled like the bear,
    and sought further success.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bear skull is left overnight on the table and then carried ceremonially,
    wedding-like, to a certain tree in a procession with bridegroom, bride, beer-bearer,
    singer, skull-bearer, and others.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Samoyeds are said to preserve the bear skull by hanging it in a tree or
    placing it on a long pole, generally near a road.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Other valuable wild animals are said to receive honor; when Ostiaks kill a
    stag or otter, they may cut pictures of the animals in a pine near the village
    as they do with the bear.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Lapps are described as preserving bones of beasts of prey, burying land-animal
    bones in dry places inaccessible to dogs or prowling animals, and hiding water-animal
    bones in springs.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage also reports Lapp customs of returning fish bones to the water
    and hanging wolf skeletons in trees, and says similar bone-preservation accounts
    are preserved of the Samoyeds.
  category: action
  evidence_refs:
  - ev:13
