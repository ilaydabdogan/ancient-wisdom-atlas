canonical_text:
  quote: ''
  summary: The passage describes Yakut tales about a life-giving cosmic tree at the
    earth's navel. The tree produces nourishing liquid, reaches into heaven, extends
    roots into underworld depths, and is associated with the First Man or White Youth.
    A female tree or place spirit appears from the tree, explains the First Man's
    purpose as father of the human race, and later blesses the White Youth with milk,
    increased power, happiness, and protection before his intended journey to seek
    a partner.
  language: English
  quote_policy: summarized
