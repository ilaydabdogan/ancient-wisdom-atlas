canonical_text:
  quote: ''
  summary: The passage surveys beliefs among Siberian and Finno-Ugric groups about
    fixed-number sky gods closely connected with the Heaven god, especially a group
    of seven assistants or sons. It describes Altaic, Yakut, Lebed Tatar, Vogul, and
    Ostiak variants, including roles connected with horses, sacrifice, the underworld,
    flood, and escorting souls to Hades.
