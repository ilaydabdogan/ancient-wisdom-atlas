canonical_text:
  quote: ''
  summary: 'The passage describes Finno-Ugric and Siberian hunting and fishing observances:
    hunted and caught animals are treated as holy; prey, especially the bear, receives
    secret or euphemistic names; hunters and fishers maintain ritual cleanliness through
    fire and water; several groups observe taboos around dirt, corpses, women, and
    contact; Lapp, Ostiak, and Finnish customs use special openings or thresholds
    in bear and prey rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Finno-Ugric stocks regard the fruits of hunting and
    fishing as holy, and that their actions in these occupations follow special rules.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Words for game differ from everyday usage, and the bear is given multiple
    secret or euphemistic names among Lapps, Ostiaks, and Finns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage gives the stated reason for avoiding the actual name of the prey:
    it might hear the name and become angry.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: During hunting trips and bear feasts, special names are used for bear parts
    and hunting gear; on fishing expeditions, a special language is also used.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Purification methods for hunters, fishers, and their implements include smoking
    over fire, jumping over fire, washing in water, and sprinkling with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports a view attributed to the Siryans that hunting is a pure
    occupation and that animals love only pure people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ostiaks avoid dirty household work on the day when hunters are known to have
    reached a bear lair.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Samoyeds do not hunt, fish, or cross a stream when there is a corpse in the
    village, and they avoid intercourse with women at hunting or fishing times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lapp hunters and fishers formerly left tents through a special holy opening
    in the back rather than through the ordinary outlet; the opening was not used
    by womenfolk.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Lapp back opening is called varr-lyfs, glossed as the bloody backdoor,
    because bleeding prey were brought in through it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ostiaks carry a bear head through a window on returning from the forest and
    later carry it out the same way to the storehouse after the feast-night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Finnish bear hunters lift a door from its bottom hinges and pass through the
    hinge-side opening when going out in pursuit of a bear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hunting and fishing trips are to be begun secretly and without meeting anyone,
    especially women; women do not take part in hunting trips but prepare special
    ceremonies for returning hunters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a Lapp brought wild reindeer meat through the holy backdoor, his wife
    prepared alder-bark liquid, with which he washed his face; the supplied passage
    breaks off shortly afterward.
  category: action
  evidence_refs:
  - ev:8
