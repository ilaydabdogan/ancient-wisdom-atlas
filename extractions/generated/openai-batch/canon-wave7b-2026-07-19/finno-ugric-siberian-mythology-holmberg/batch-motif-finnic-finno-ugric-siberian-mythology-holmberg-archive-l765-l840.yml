canonical_text:
  quote: ''
  summary: The passage surveys beliefs among Finno-Ugric and Siberian peoples about
    souls of the dead and living appearing in animal, wind, fire, and double-like
    forms. Examples include butterfly, insects, mice, beetle, bird, wolf, whirlwind,
    fire-serpent or meteor, blue flame, and the Siryan ort or Vogul urt as guardian
    or death-portent forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening fragment says a soul moved about a tree, went by night to the forest,
    sought the tree, and found coins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the souls of the dead have power of motion like those
    of the living.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a Votiak memorial feast for a child's father, a mother identified a little
    grey butterfly entering by the window as the father's soul.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The departed are said to conceal themselves as insects; among the Cheremiss,
    many caterpillars in grainfields occasion sacrifice to departed persons who died
    without kinsfolk.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A similar offering when many mice appear in the yard is presented as evidence
    for a belief in soul-mice among the same people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: According to the Ostiaks, the deceased transforms into a beetle and is thereby
    revealed to the living.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Finnish maidens ask beetles where they go to wed; if the beetle flies to the
    churchyard, it is treated as an omen of death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says certain Finno-Ugric peoples believe the departed appear as
    birds, and reports a Lapp account of a dead man buried on a small island who haunted
    it by day and flew across the water as a great bird.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dead may also manifest as wolves, and Votiaks driving away Easter-roaming
    spirits cry, "Go, wolves, go!"
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A widespread belief is described that a person's soul may wander as a whirlwind;
    a Cheremiss story tells of a wayfarer throwing a knife into an eddy, later finding
    an old man with that knife in his cheek.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The soul of a living person or of the dead can fly as a fire-serpent or meteor;
    in Cheremiss belief its course can be stopped by specified actions, after which
    it falls and changes back into the man who flew as the fire-snake.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Siryan belief, the soul or ort of the departed may manifest as a blue flame
    burning on the ground.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Siryan ort is described as dwelling near its protege as a guardian-spirit,
    appearing in dreams in the person's shape, and sometimes pinching blue spots into
    the skin.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that after death the person's soul is blended with the
    ort; the ort of the deceased reveals itself in the form of the departed for forty
    days and then vanishes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: As a portent of death, the ort chiefly manifests as a bird; a similar belief
    is attributed to the Voguls, whose urt lives in the forest and cries out when
    a human being must die.
  category: attribute
  evidence_refs:
  - ev:9
