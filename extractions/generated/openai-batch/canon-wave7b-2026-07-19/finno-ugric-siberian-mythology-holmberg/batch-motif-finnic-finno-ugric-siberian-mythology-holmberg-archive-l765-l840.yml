comparison_claims:
- id: claim:1
  claim: The passage itself compares the Ostiak belief that a deceased person transforms
    into a beetle with a Finnish beetle custom, saying that a like idea seems to have
    been known to the Finns.
  claim_level: same_motif
  target: Finnish beetle divination or death-omen custom
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The Ostiak example is an explicit deceased-beetle transformation, while
    the Finnish example is a beetle-based omen or divination custom; the passage does
    not prove identity beyond similarity.
- id: claim:2
  claim: The passage states that similar beliefs occur among other European peoples
    in connection with the beetle material.
  claim_level: same_motif
  target: other European peoples, unspecified
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: No specific peoples, texts, or details are provided in the passage.
- id: claim:3
  claim: The passage compares the Siryan ort as a bird-shaped death portent with a
    Vogul belief about the urt living in the forest and crying out before a human
    death.
  claim_level: same_function
  target: Vogul urt death-portent belief
