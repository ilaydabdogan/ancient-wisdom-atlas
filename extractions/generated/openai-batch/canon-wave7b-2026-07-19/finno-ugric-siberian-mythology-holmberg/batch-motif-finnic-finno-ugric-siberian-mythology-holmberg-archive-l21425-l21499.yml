canonical_text:
  quote: ''
  summary: Kubaiko is tormented in a dark room in the realm of the dead, follows a
    death-prince leader through many rooms of dead inhabitants, and reaches Irlek-Khan
    with eight Princes of death. She asks for her brother’s severed head, accepts
    a dangerous task involving a seven-horned goat embedded in the earth, succeeds
    on the third attempt, receives the head, and is guided back toward the earth.
    During the return, the Princes explain several sights as punishments or examples
    involving milk and water, bodies in a brook, and a horse on dry sand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kubaiko is in a dark room where invisible, bodiless hands seize, tear, drag,
    and torment her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Kubaiko shouts, the door opens, the room becomes light, the Head or Ataman
    of the Princes of death enters, notices her, leaves silently, and she follows
    him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Kubaiko passes through empty rooms and then through rooms filled with human
    beings in varied conditions: spinning, swallowing, burdened with stones, bound
    by nooses to logs, wounded, bitten by mad dogs, or lying as married couples under
    coverlets.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tenth room is described as large as a steppe and contains eight Princes
    of death with their Chief, Irlek-Khan, in their midst.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kubaiko bows and asks why Yelbegen, the Princes’ servant, cut off and carried
    away her brother’s head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Princes say Yelbegen acted on their orders and promise to return the head
