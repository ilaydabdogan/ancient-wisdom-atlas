    she will lose her own head.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kubaiko accepts the proposal, is taken through nine rooms filled with human
    heads, recognizes her brother’s head, and lifts the goat on her third attempt.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After Kubaiko succeeds, the Princes give her the brother’s head and escort
    her back to the larch; she mounts her horse and compels them to show the way back
    to earth.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Princes explain that an old woman who mixed water with milk for guests
    must separate water from milk forever as punishment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Princes explain a half-body damming a brook as belonging to a wise man
