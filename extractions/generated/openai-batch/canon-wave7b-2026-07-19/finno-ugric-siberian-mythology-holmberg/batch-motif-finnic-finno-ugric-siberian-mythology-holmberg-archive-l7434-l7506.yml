canonical_text:
  quote: ''
  summary: The passage surveys household spirits among several Finno-Ugric and neighboring
    groups. It describes a Russian Lapland household spirit living by or under the
    fireplace, a Votiak under-floor house spirit with protective and punitive functions,
    and rituals of appeasement involving animal sacrifice, food offerings, deposits
    under the floor, and prayers for peace and happiness. It also notes proposed borrowing
    or transmission of some household-spirit figures or names from Russian, Finnish,
    and Swedish traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the anthropomorphic household spirit of many European
    peoples was unknown to the forefathers of the Finno-Ugric race and is rare or
    unknown among the Ostiaks and Voguls.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Russian Lapland Kyode jielle or Port hozjin is described as living under
    the fireplace and sometimes appearing in the shape of a dog.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Lapps are said to offer sacrifices to appease this household spirit and
    to be glad when he leaves the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: By the fireside where the Russian Lapland household spirit dwells, the passage
    describes a spot where women are afraid to go or step over.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Votiak house spirit is called Korka-murt, meaning “House man,” or Korka-kuzo,
    meaning “House ruler,” and his chief dwelling-place is under the floor.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Votiak house spirit is said to have the outward form of a man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Votiak house spirit seldom shows himself; when he appears, this is taken
    as a forewarning of death or other misfortunes, and he may sometimes resemble
    the master of the house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Votiak house spirit is generally described as kindly and useful, protecting
    the inhabitants from strange spirits and looking after the interests of the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Votiak house spirit is said sometimes to spin at night if the womenfolk
    have been prevented from finishing their day’s task.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When angered, the Votiak house spirit annoys sleepers in the form of the nightmare,
    tangles hair and beards during the night, and hinders the successful conclusion
    of tasks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Little children are not left alone in the house because it is believed that
    the Votiak house spirit can substitute changelings for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: When the Votiak house spirit shows signs of being offended, he must be appeased
    by sacrifices; the passage says this generally takes the form of a black sheep
    killed under the floor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Votiak sacrifice, the master of the house acts as sacrificing priest,
    only family members may take part, and the flesh of the sacrifice may not be offered
    to strangers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Pieces of meat and the bones of the sacrificed animal are buried in a hole
    under the floor, and the victim’s blood is allowed to run into that hole during
    slaughtering; the flesh is cooked and eaten in the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Regular autumn sacrifices to the Votiak house spirit include a goose or duck
    and porridge, with the bird’s bones, porridge, and a spoon placed under the floor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: A Votiak prayer addressed to the spirit dwelling under the floor asks him
    not to frighten the household, to accept the goose, and to give peace and happiness
    to the speaker, family, and dependants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: In some places offerings are also made during summer at sheep-clipping time;
    if no suitable victim is available, the ceremony is postponed and a promise is
    given with porridge, part of which is buried under the floor.
  category: sequence
  evidence_refs:
  - ev:7
