canonical_text:
  quote: ''
  summary: 'The passage describes Volga Finnic sacrificial practice to Nature gods:
    sacrifices may be performed in farm-yards, pure field-spots, or sacred groves.
    Cheremiss sacrifice-groves are described as large groves of leafy trees, preferably
    lime, with oak and birch also acceptable. Sacrifices are made facing east or upward.
    Villages may have separate groves, and wider districts may share important groves
    for mutual sacrifices, with terminology connected to village-community, ownership-marks,
    and possible clan organization.'
  language: English
  quote_policy: summarized
