canonical_text:
  quote: ''
  summary: 'The passage surveys mortuary customs among several Finno-Ugric and Siberian
    peoples: covering or closing the dead person''s sensory organs, moving the dying
    from beds, using metal objects for protection, restricting who may prepare the
    corpse or grave, suspending ordinary work while the corpse is present, keeping
    vigil to prevent the dead from taking a living soul, covering mirrors, and carrying
    the dead out by an unusual route to prevent return or further death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Samoyeds cover the eyes of the corpse with copper coins or small stones
    to prevent the dead from harming its own people by its glance while the body lies
    in the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ostiaks cover the deceased person's face with a cloth and also cover the
    eyes, nose, and mouth with silver or copper coins or brass buttons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Cheremiss close the eyes and mouth of the dead and cover the eyes, ears,
    and nostrils with small bunches of thread.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chuvash perform a similar covering and address the dead with a formula
    saying that its ears, eyes, and nostrils perceived no one to follow after it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Missionaries reported that the Lapps were careful to cover the entire body
    of the dead in shrouds; the passage explains this as connected with fear that
    the soul might leave the body and frighten the living.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss move the dying from their beds to a litter of straw; Hill-Cheremiss
    belief says that a person dying on down or hair mats must count the feathers or
    hairs in the coming life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Metal objects are described as protective in mortuary rites: Finns put a
    copper coin in the corpse-washing water, and Scandinavian Lapps require the person
    washing and covering the dead to wear a brass ring on the right arm.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Russian Lapmark, the coffin and grave are prepared by men whose womenfolk
    are not pregnant and are not nursing children; otherwise the child might be struck
    by mortal illness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: While the corpse remains in the village or house, ordinary occupations and
    social exchanges are restricted; examples include Samoyedic prohibitions on hunting,
    fishing, and crossing a stream, and Estonian prohibitions on household tasks,
    visits, and giving or selling things from the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the corpse is kept overnight in the house, people must remain dressed and
    watch by the body; the passage says sleep would make it easier for the deceased
    to take a living person's soul to the kingdom of the dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Cheremiss say relatives and neighbours must sit silently watching to see
    if the spirit of the deceased returns to its dwelling-place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A mirror in the room must be turned around or covered so that the dead cannot
    use it to choose a companion from among those present.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: To prevent the dead from visiting the old home, the Lapps and Samoyeds do
    not carry the dead out through the door, but directly out under the canvas tent
    from the place of death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Lapps say that carrying the dead out through the door could be followed
    soon by another death.
  category: speech
  evidence_refs:
  - ev:9
