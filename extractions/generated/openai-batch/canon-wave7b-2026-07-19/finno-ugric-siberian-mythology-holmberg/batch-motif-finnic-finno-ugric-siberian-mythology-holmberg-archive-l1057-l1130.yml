canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric death and burial practices: rites to aid
    the departed soul on its journey, precautions against the dead, opening house
    apertures at death, forgiveness requests, water for cleansing the soul, hen or
    fowl rites, omens of further death, meeting of ancestral spirits, washing and
    dressing the corpse, and equipping the dead for a long journey.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that death-related customs and beliefs among Finno-Ugric
    peoples vary locally but share general affinities.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains the ceremonies as arising from care for the departed
    on a last journey and from precautions by the living against dead persons believed
    to seek companions into the other world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After death, Finns opened smoke-outlets, Russian Karelians lifted roof boards
    three times, and Esthonians opened doors so that the soul might depart more quickly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wind arising while someone lay dying was called the wind of the dead, and
    the Permian peoples believed a storm would arise at a shaman's death.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Relatives gathered around the body and implored forgiveness from the dead
    person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mordvins, Ingrians, and others placed a bowl of water on the window-sill so
    that the soul could cleanse itself.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A widespread custom involved cutting the throat of a hen at death; the Chuvash
    accompanied it with formulas equating soul for soul and saying the hen would lead
    the soul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eastern Cheremiss slaughtered the fowl at the gate while following the
    dead to the grave and interpreted the headless hen remaining in the courtyard
    as a sign of another imminent death in the house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the place where the hen was killed, the deceased was believed to meet the
    spirits of departed relatives who came to meet the new arrival.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Reported explanations of the hen slaughter include the hen gathering the deceased's
    nails in the other world, preserving the deceased's blood from death, painting
    the dead person's eyebrows with the first blood drops, and leaving the fowl on
    the road for dogs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A later custom prepared the slaughtered fowl for the funeral meal, while Finns
    in Savolax cast a living hen onto the coffin to prevent the dead from taking the
    poultry-luck away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The dead were to be escorted quickly to the grave, and the body was washed;
    in some places the washer was chosen during life, only the left hand was used,
    and the corpse's stiffness or softness indicated whether the washers pleased the
    deceased.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The corpse was dressed in clean garments, and Volga Finns and Baltic Finns
    equipped their dead as for a long journey, including a male hat and clean foot-wrappings.
  category: action
  evidence_refs:
  - ev:11
