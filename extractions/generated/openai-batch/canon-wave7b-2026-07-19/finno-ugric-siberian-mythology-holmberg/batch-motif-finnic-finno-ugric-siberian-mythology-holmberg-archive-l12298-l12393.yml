canonical_text:
  quote: ''
  summary: A Cheremiss nature-gods sacrificial scene is described. The sacrificing
    priest stands before the sacrifice tree with a knife and lime branch, prays to
    a great god, and divines acceptance by the fall of lime-wood shavings. A sacrificial
    foal or horse is then tested and purified by water sprinkled through lime branches;
    its shudder is treated as a sign that the god accepts the offering. If the sign
    does not occur, priests check ritual placements and repeat the sprinkling and
    prayers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies Cheremiss sacrificial loaves, bowls, and coins
    at a festival to nature-gods in Ufa Government.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacrificing priest moves to the sacrifice tree holding a knife in his
    right hand and a branch in his left.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priest prays to a great god and lists ritual offerings including a sacrifice
    loaf, honey-drink, silver candle, resin-bowl, sacrifice tree, sacrifice girdle,
    tassel, and sacrifice pewter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priest shaves a piece from the lime-wood branch, and the priests examine
    the shaving’s position on the ground.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A shaving with the thicker end toward the sacrifice tree or east signifies
    that the god is kindly disposed and satisfied with the people and priests.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the shaving falls unfavorably, the sacrificing priest goes around the fire
    in the direction of the sun, returns to the left of it, and repeats the whittling
    before the sacrifice tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A lucky first shaving is placed in the porridge-pan to the right of the silver
    spoon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A second shaving is used with a prayer asking whether the god is pleased with
    the ritual objects, and a lucky second shaving is laid in the porridge-pan beside
    the first.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A third shaving is used to examine whether the sacrificial foal is acceptable
    to the god.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The foal is expected to shiver when sprinkled with water.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:11
  text: The assistant pours fresh water into a wooden bowl, takes green lime-branches,
    circles the fire in the direction of the sun, and goes to the foal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The foal wears a silver bridle and its head is to be turned toward the sacrifice
    tree.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The kart prays that the god accept the sacrificial horse and shake from it
    the touch of human hands.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: During the prayer, the assistant pours water on the animal’s back through
    lime-branches, beginning from the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that the purpose of the water-pouring is to purify the
    animal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Other participants kneel with bared heads and wait for the animal’s shudder,
    which is regarded as a sign of divine acceptance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: If the desired result does not occur, the sprinkling and the kart’s prayer
    are repeated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: While waiting for the sign, assisting priests check the fire site, the structure
