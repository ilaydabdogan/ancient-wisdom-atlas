canonical_text:
  quote: ''
  summary: 'The passage introduces fall-of-man tales in which humans originally possess
    a protective covering and lose it after eating forbidden fruit. It then summarizes
    an Altaic tale: God creates branches on a lonely tree and ordains nine humans
    and races; a first couple, Torongoi and Edji, are covered with fur. God forbids
    fruit from four sunset-facing branches, permits fruit from five sunrise-facing
    branches, and appoints a dog and snake to guard the tree. The devil enters the
    sleeping snake, tempts the woman and then the man to eat the forbidden fruit,
    after which their body hair falls away and they hide. God questions the man, woman,
    snake, and dog. A comparative note links the tale to related seven-tree/seven-man
    and North Siberian seven-ancestor traditions, suggesting alternation between seven
    and nine.'
  language: English
  quote_policy: summarized
