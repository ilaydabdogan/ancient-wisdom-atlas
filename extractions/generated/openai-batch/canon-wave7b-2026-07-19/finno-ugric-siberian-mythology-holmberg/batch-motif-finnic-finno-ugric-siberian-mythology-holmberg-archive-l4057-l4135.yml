canonical_text:
  quote: ''
  summary: 'The passage describes Lapp bear-feast rules: gendered restrictions on
    eating bear parts, prohibited metal implements, required complete consumption,
    ritual treatment of women and children with alder-bark juice and brass rings,
    ornamenting and returning the bear’s tail on a twig, songs voiced in the bear’s
    name, and burial or reassembly of the bear’s bones and body parts in a grave with
    associated objects and vessels. It also notes comparisons with Vogul and Ostiak
    bear-feast practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are forbidden to eat the fore part of the bear and the more noble organs,
    especially the heart, while men eat these parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oldest man of the party must eat the last three or four joints of the
    backbone from the hind part of the bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kidneys are described as delicacies and awakeners of love, and some people
    suck the bear’s gall to harden their natures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: It is said to be inadvisable to smear one’s boots with bear fat because the
    bear might thereby discover who killed him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bear meat is eaten without knives or other metal aids, and all the meat must
    be eaten in one sitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men carry the women’s share to the dwelling tent, where women receive them
    with alder-bark juice in the face and glances through a brass ring; children from
    the cutting-up place receive the same treatment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first bite is taken through a brass ring or with the ring held before
    the mouth, and women use wooden sticks during the meal because they may not touch
    bear meat with their hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bear’s tail is cooked unskinned, brought into the tent, eaten clean, tied
    to a branch, and returned to the men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women and children bind brass rings to the retrieved twig as ornaments before
    the tail is attached to it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the tail is returned, women cover their faces and are kissed and thanked
    by the men for not disturbing the bear feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Songs from bear feasts are reported, and the passage states that the bear
    was regarded as appearing in dramatic ceremonies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In songs sung in the bear’s name, the bear says it has come from wide forests
    to populated districts and that young men hindered its return journey.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The smallest bear bones are not broken; a hole is dug as a resting place,
    twigs are placed on the bottom, and the bones are laid in the grave in their natural
    order.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: If a dog has devoured or taken away any bones, the missing bones are taken
    from the dog.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The skin of the nose, sexual organs, and tail are put back in their places
    with the bear remains.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Rings hung on the tail by women are removed and later used to decorate the
    magic drum or sometimes given to the person who tracked the bear.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: A plaited birch twig is described as kept wrapped in cloth because of its
    supreme holiness, and another note says backbone joints were threaded onto a twig
    in natural order with the head fastened to it.
  category: object
  evidence_refs:
  - ev:12
- id: obs:18
  text: A birch-bark vessel filled with alder-bark juice is placed before the bear’s
    nose, and sometimes objects such as skis, a plane, and a knife are laid in the
    bear’s grave.
  category: object
  evidence_refs:
  - ev:13
