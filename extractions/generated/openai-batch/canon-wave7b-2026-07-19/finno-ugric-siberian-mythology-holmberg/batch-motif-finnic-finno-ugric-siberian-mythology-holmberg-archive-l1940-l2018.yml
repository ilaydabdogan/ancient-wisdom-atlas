canonical_text:
  quote: ''
  summary: The passage surveys memorial and funeral practices among Lapps, Samoyeds,
    Northern Ugrians, and North Voguls. It describes offerings of food and drink to
    the dead, sacrifices of reindeer and sometimes dogs, grave-side meals, objects
    left at graves, shamanic conveyance of dead persons' shadows to the world of the
    dead, and varying memorial periods or remembrance days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a deceased person is given a charge such as guarding reindeer, sacrifices
    to that deceased person are made yearly during the assigned period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: A Lapp is described as able, through sacrifice, to have a father or near relation
    from the lower regions guard reindeer for one, two, or three years before returning
    to the dead.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Lapp drinking or feasting, part of the liquor is poured on the ground in
    honor of spirits and especially the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Food such as cheese, meat, fish, fat, and marrow is placed in a little trough
    and buried in the earth together with an image.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that Samoyeds, like Lapps, have no fixed memorial days or
    annual feasts in honor of the dead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among Samoyeds, the reindeer that dragged the deceased to the grave is sacrificed;
    it may be impaled on the grave, used for a meal, or tied on the grave and left
    to starve.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In some Samoyed districts, the dead are believed to need care from relatives
    until a shaman has taken their shadows to the world of the dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Samoyed sacrifices of a reindeer or dog to the deceased for accidental reasons
    such as illness are performed after sunset behind the tent, with the sacrificial
    animal's head directed west.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Northern Ugrians take several of the deceased's best reindeer to the graveyard
    on sleighs following the corpse and kill them after the body is placed in the
    grave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Northern Ugrian grave-side rite described by Pallas, a killed reindeer
    is left on the grave, straps are placed on a stand above the grave, sleighs are
    overturned, and a funeral meal is cooked nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A later custom kills the deceased's best-loved reindeer, eats the meat, and
    places the bones, horns, sleigh, and harness on the grave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a North Vogul funeral feast, a cereal or meat dish is cooked and poured
    against the coffin; the pan bottom is knocked out and the pan is left by the grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If the dead North Vogul person was conveyed by reindeer, those reindeer are
    strangled by the grave; the meat is eaten there, the hide is buried, and the bones
    are placed by the dead person.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ugrians frequently remember their dead, especially during the first period
    of their life in Hades, and in many districts memorial days are set by agreement
    with relatives rather than fixed calendar days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Northern Ugrians are said to hold memorial feasts for fifty days for a dead
    man and forty days for a dead woman; food is kept at the grave for a while and
    then eaten at home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At Tremyugan, remembrance of the dead after one or two months, a half-year,
    or a year involves setting forth a birch-bark dish or trough.
  category: object
  evidence_refs:
  - ev:8
