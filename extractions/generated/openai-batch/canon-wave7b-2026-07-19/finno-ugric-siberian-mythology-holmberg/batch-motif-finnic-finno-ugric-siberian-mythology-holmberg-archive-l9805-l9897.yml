canonical_text:
  quote: ''
  summary: The passage first captions a Lapp World-pillar image, then surveys Finno-Ugric
    and related water-spirit rites. It describes brooks and springs as sources of
    weather and rain, rituals of throwing offerings into water or cleaning springs,
    rain-making by wetting people and fields, duck sacrifices and lake-circling rites
    for rain, bridal washing and drenching rites directed to a mother river or Water
    mother, prayers for children, birds, and cattle, and spring ice-break festivals
    with horse sacrifice in honour of water.
  language: English
  quote_policy: summarized
