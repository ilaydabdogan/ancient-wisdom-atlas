canonical_text:
  quote: ''
  summary: 'The passage describes part of a Cheremiss sacrificial festival in a sacred
    grove: offerings and fire are left overnight at a sacrifice tree, a sunrise orolek-sacrifice
    is performed by the kart with assistants and participants, remains are burned,
    coins are reburied at the tree, related rites continue at other trees for nature
    gods, and the festival closes with ashes swept together, blessing words, and an
    optional communal meal. It also notes local variations involving a girdle tied
    to a living sacrifice tree and shavings in suldes-branches.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A silver bridle and the stand for resin-bowls are burned with the burning
    skin, while the Cheremiss do not burn the sheep-skin but dispose of it by giving,
    selling, or reserving it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Orolek-pieces, a candlestick, part of a large loaf, and three small loaves
    are left at the foot of the tree because sacrifices remain to be made the next
    morning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fire is not extinguished at evening but is left to illuminate the grove
    overnight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunrise, those who spent the night in the grove take part in the orolek-sacrifice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Meat, pieces of the large loaf, a bowl of drink, three small loaves, and coins
    dug up on the previous day are arranged on a cloth before the tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kart lights the candle, holds a brand and a knife, rings three times on
    an axe, reminds the god of the shining sacrifice foal, circles the fire, throws
    in the brand, stands before the tree, and reads a prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the prayer, everyone shakes the kart's hand in thanks; the priest sacrifices
    the drinking-bowl and two assistants sacrifice the meat-bowls, followed by presenting
    sacrificial objects and eating the orolek-flesh.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: All remains, including the candlestick, are thrown into the fire; sacrifice-tree
    coins with added copper coins are hidden again in the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The kart addresses the sacrifice tree while reburying the coins, telling it
    not to say that it was left empty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Similar ceremonies are performed at other trees for gods of the sun, thunder,
    wind, or another god; fires burn before the different trees and long prayers are
    read daily.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the end of the festival, the priest who sacrificed at a fire sweeps together
    the ashes and says a formula wishing benefit for a man, dog, or cattle that blunders
    onto them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the rites, people may go to a reserved village room to eat pancakes,
    drink mead and beer, and remember the deities to whom sacrifices were made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Local variations include tying a girdle with attached objects to the living
    sacrifice tree as a pledge until the next festival and varying the number of shavings
    inserted in suldes-branches.
  category: other
  evidence_refs:
  - ev:8
