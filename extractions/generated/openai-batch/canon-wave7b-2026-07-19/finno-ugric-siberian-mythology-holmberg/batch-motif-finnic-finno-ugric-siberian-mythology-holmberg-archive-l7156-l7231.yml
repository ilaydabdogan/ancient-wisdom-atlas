canonical_text:
  quote: ''
  summary: The passage describes Cheremiss practices of sacrifice and promised sacrifice
    to a keremet-spirit, including evening restrictions, votive bundles and objects,
    substitute offerings when a promised animal cannot yet be given, and a witnessed
    duck sacrifice in a grove involving a sacrifice-tree, fire, bread, candles, blood,
    prayers, and offerings to the keremet and the Fire-mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cheremiss offerings are made late in the evening, with restrictions against
    visiting or receiving visitors after sacrifice and an effort to avoid meeting
    people on the way to the grove.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists foal, black sheep, and formerly black bull as usual sacrificial
    animals.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A promised sacrifice may be represented by money, flour, honey, or a small
    special loaf placed in a bundle while the worshipper prays to the keremet-spirit
    on behalf of the sick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The promise-bundle may be hung at home or on the sacrifice-tree in the keremet,
    and is burned when the promise is redeemed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other objects connected with a promised sacrifice include garments of the
    sick, iron implements placed in the storeroom wall, wool or hair from a promised
    animal, bark harness for a promised horse, sticks of wood, and sometimes a wax
    candle.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The objects accompanying a promise of sacrifice are said to assure the spirit
    that the promised offering will not be delayed long.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a poorer Cheremiss cannot fulfil the promised sacrifice in due time, the
    promise must be renewed by sacrificing a lesser object, such as a goose, duck,
    or hare in place of a horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the witnessed Birsk District sacrifice, only the sacrificing priest and
    three assistants entered the sanctuary after bathing and putting on clean garments.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Assistants made a fire from glowing cinders brought from the village, and
    sacrifice bread was kneaded and baked on the spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A loaf marked with two “noses” was placed at the root of the sacrifice-tree,
    candles were placed in bark hollows, and a bound duck lay near the tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During prayer, a burning branch was swung and a knife was struck against an
    axe while the duck was killed by cutting its throat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The sacrificing priest poured warm blood into the fire and asked the keremet
    to accept the sacrifice, remove the cattle-plague, and wait until autumn for the
    promised horse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the duck was cooked, pieces from several body parts were placed in two
    bowls, one for the keremet through the fire and one for the Fire-mother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After offerings from the bowls, the rest of the meat was eaten and remnants
    were thrown into the fire.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the Urzhum District, Cheremiss refer to the keremet-spirit as the “Old
    man,” the “Great man,” or the “Prince.”
  category: speech
  evidence_refs:
  - ev:11
