- id: obs:1
  text: One source places “the Lord with the axe” in the eighth heaven.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some sources distinguish the Yakut Thunderer, called “Bold Screamer,” from
    the Lightning-maker, called “the Lord with the axe.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Thunderer and the Lightning-maker are said to pursue demons and evil spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a thunderstorm threatens, Yakuts burn pieces of a tree struck by lightning
    to smoke evil spirits out of homes, speak a dismissal formula, and throw the wood
    far into a meadow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Objects believed to be thunderbolts found in the earth are kept in houses
    as talismans against lightning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Goldes call old stone weapons found in the ground “thunder-axes.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: In another conception, the Thunder god is a skilled archer; in Altai Tatar
    belief a mighty hero has the rainbow as bow and lightning as arrow.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In some Ostiak districts, the rainbow is the Thunder god’s bow, stone weapons
    are his arrows, and he shoots them to kill the Forest spirit hiding in trees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says many Altaic peoples do not generally call the rainbow a thunder-bow,
    but often imagine it as a being that drinks water.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yenisei Ostiaks are said to call the rainbow “The thunder drinks water,” and
    Votiaks also call it an animated water-drinker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: East European peoples are said to imagine the rainbow sucking water from seas,
    lakes, and rivers and sprinkling it back as rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The same East European rainbow-being is described as a giant snake, and Esthonians
    say it has the head of an ox that it lowers to a river to empty it of water.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Yakuts believe the rainbow can raise people from the ground; one tale says
    it lifted a girl in Verchoyansk and set her down near Irkutsk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Yakuts and Buriats also call the rainbow “the urine of the she-fox.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Southern Tatar names for the rainbow include “rainbelt,” “the half-bow of
    the pot,” and, in the Caucasus, “God’s sword.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: 'A Kirghis tale explains the rainbow as “the old woman’s sheep-halter”: a
