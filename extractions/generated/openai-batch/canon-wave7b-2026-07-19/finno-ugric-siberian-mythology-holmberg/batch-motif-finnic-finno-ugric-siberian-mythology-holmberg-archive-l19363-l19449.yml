candidate_motifs:
- id: motif:1
  label: Thunder and lightning beings pursue harmful spirits
  taxonomy_refs: []
  basis: Yakut Thunderer and Lightning-maker are both said to pursue demons and evil
    spirits, and household rites expel those spirits during storms.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the function clearly but does not supply a named
    taxonomy motif for thunder deities.
- id: motif:2
  label: Lightning-struck wood used apotropaically
  taxonomy_refs: []
  basis: Yakuts burn pieces of a tree struck by lightning to smoke evil spirits from
    homes and throw the pieces away.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage describes a ritual practice, but its broader distribution
    is not established here.
- id: motif:3
  label: Thunder-stones or stone weapons as celestial weapons and talismans
  taxonomy_refs: []
  basis: Thunderbolts found in earth are kept against lightning, Goldes call old stone
    weapons thunder-axes, and Ostiak accounts identify stone weapons as the Thunder
    god’s arrows.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage groups several related beliefs but does not state that all
    are part of one uniform tradition.
- id: motif:4
  label: Rainbow as Thunder god’s bow and lightning as arrow
  taxonomy_refs: []
  basis: Altai Tatars tell of a hero whose bow is the rainbow and arrow the lightning;
    some Ostiaks call the rainbow the Thunder god’s bow.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage says this conception is local to Middle and Northern Asia
    and occurs sporadically.
- id: motif:5
  label: Water-drinking rainbow-serpent
  taxonomy_refs:
  - serpent
  basis: The rainbow is described as an animated water-drinker, and East European
    accounts imagine it as a giant snake that sucks water and returns it as rain.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The serpent identification is explicitly given for East European peoples,
    while Turco-Tatar beliefs are said not to clarify what the water-drinker is.
- id: motif:6
  label: Rainbow-mediated ascent or aerial transport
  taxonomy_refs:
  - ascent
  basis: A Yakut tale says the rainbow can lift a girl from the ground and transport
    her; a Kirghis tale has a cursed older wife flee to the heavens and tether sheep
    to the rainbow.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The two examples involve different narrative contexts; the passage does
    not state a single shared narrative type.
- id: motif:7
  label: Sky animal and riders produce weather
  taxonomy_refs: []
  basis: An Altai tale attributes thunder, lightning, and rain to three persons riding
    a camel in the sky, each performing a different action.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage says this tale belongs to a very limited area.
- id: motif:8
  label: Sky shaman’s drum causes thunder
  taxonomy_refs: []
  basis: Some accounts say a great shaman beats a drum in the sky when it thunders.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage notes that the belief is only occasionally met with.
comparison_claims:
- id: claim:1
  claim: The passage compares the Yakut “Lord with the axe,” a demon-pursuing thunder
    or lightning figure, with corresponding figures in European myths and suggests
    an Asian source for such figures.
  claim_level: historical_contact
  target: European axe-bearing thunder figures and ancient civilized peoples of Asia
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives an authorial comparison but provides no detailed
    examples or transmission evidence in this excerpt.
- id: claim:2
  claim: The passage cautiously raises a possible comparison between the water-sucking
    rainbow-serpent and the Vedic Vrtra or Ahi, from whose power Indra releases the
    waters.
  claim_level: same_motif
  target: Vedic Vrtra/Ahi water-holding serpent and Indra’s release of waters
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: uncertain
  limitations: The passage frames the comparison as a question and does not assert
    identity, contact, or inheritance.
- id: claim:3
  claim: The rainbow-as-Thunder-god’s-weapon belief is treated as a sporadic regional
    pattern in Middle and Northern Asia rather than a general Altaic belief.
  claim_level: same_motif
  target: Middle and Northern Asian thunder-bow / rainbow-weapon pattern
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The passage explicitly limits the pattern’s distribution and notes
    that many Altaic peoples do not use this explanation.
- id: claim:4
  claim: The sky shaman beating a drum to make thunder is presented as fitting a Siberian
