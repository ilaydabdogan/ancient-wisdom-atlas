canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric, Siberian, Altaic, and neighboring beliefs
    about thunder, lightning, thunder-weapons, the rainbow, and weather-making figures.
    It describes Yakut thunder and lightning beings who pursue spirits; apotropaic
    use of lightning-struck wood and thunder-stones; rainbow-as-bow and lightning-as-arrow
    traditions; rainbow-as-water-drinking or serpent-like being traditions; rainbow
    transport and naming tales; and sky figures such as camel-riders or a shaman who
    produce thunder, lightning, and rain.
  language: English
  quote_policy: summarized
