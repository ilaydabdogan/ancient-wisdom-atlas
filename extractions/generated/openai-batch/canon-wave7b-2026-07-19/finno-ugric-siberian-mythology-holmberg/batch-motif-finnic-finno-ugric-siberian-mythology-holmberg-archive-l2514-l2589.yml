canonical_text:
  quote: ''
  summary: 'The passage describes Cheremiss memorial-feast rites: prayers to the newly
    dead and earlier dead, a procession with objects of the deceased, offerings deposited
    at a hill, broken utensils intended for the deceased, fortieth-day animal sacrifice
    and feasting, a one-foot table for the deceased, a pole bridge for the dead to
    cross, a widow’s last-night cushion rite, and a horseback invitation followed
    by horse slaughter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants kneel, turn toward the deceased’s seat, and tell the dead man
    that it is time to depart for his home among the other dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earlier dead, called the “old Cheremiss,” are considered present and are
    addressed with wishes for abundance, light, help for the living, and restraint
    from frightening the living or dispersing the family.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A procession carries a taper-stand, foodtrough, drinking-vessel, and the dead
    man’s clothes, with the widow at the head of those carrying the clothes and the
    “representative” foremost.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The procession stops at a hill outside the village, where the remaining burning
    tapers, food, and drinks are thrown down.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the hill the deceased is wished a happy and comfortable existence among
    those already there and is asked not to come home, at least not uninvited.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A wooden spoon and cup are presented to the deceased and shattered on the
    spot; the passage says the Cheremiss explain this as necessary for the dead man
    to receive them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Hill Cheremiss, a horse is killed for a man’s fortieth-day memorial
    feast and a cow for a woman’s; all the meat must be consumed during the feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the Hill Cheremiss sacrifice, relatives and neighbours state that they
    have prepared meat and drink in memory of the deceased and ask the dead not to
    be angry, punish them, or send diseases and misfortunes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the feast prayer, the dead are told to go back to their dwelling sated,
    singing, and dancing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The deceased is conveyed with music and singing to a fixed place where a one-foot
    table called the “table of the deceased” is set up with a food vessel and three
    spoons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In some places a long pole is laid across chasms or rivulets so that the dead
    man can cross; the pole is called the “bridge of the deceased.”
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among the Eastern Cheremiss in the District of Birsk, the widow takes the
    cushion on which the deceased is supposed to have sat during the feast and says
    they will sleep together for the last night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The next morning in the Eastern Cheremiss rite, the dead man is ceremoniously
    conveyed with two horses back to the burial-ground.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the province of Perm, a relative rides horseback to the burial-ground to
    invite the deceased, returns at full gallop crying that he is coming, and the
    waiting crowd immediately slaughters the horse.
  category: sequence
  evidence_refs:
  - ev:10
