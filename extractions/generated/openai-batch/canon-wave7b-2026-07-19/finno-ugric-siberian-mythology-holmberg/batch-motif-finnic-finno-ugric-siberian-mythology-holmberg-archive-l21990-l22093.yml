comparison_claims:
- id: claim:1
  claim: 'The passage explicitly compares two Buriat conceptions: clan descent from
    an animal and animal-derived powers of the first shaman woman, treating them as
    closely related and relevant to the problem of totemism.'
  claim_level: same_function
  target: Buriat animal-ancestor traditions, first-shaman-woman traditions, and totemism
    as an interpretive problem
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is the author’s comparative interpretation within the passage;
    it does not establish historical priority between the two conceptions.
- id: claim:2
  claim: The passage connects the animal whose powers lie latent in a shaman clan
    with a special shamanic soul and with the Buriat term khubilgan, glossed as metamorphosis
    or taking another form.
  claim_level: same_function
  target: Animal-derived clan power, shamanic soul, and khubilgan/metamorphosis
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The relation is conceptual and terminological; the passage gives only
    one brief Bukha-Nojon variant as narrative support.
- id: claim:3
  claim: The passage states that the Tungus conception of the return of the ‘loom’
    points to a kind of migration of the soul, in the same discussion as Buriat khubilgan
    and animal soul-power.
  claim_level: same_function
  target: Tungus ‘return of the loom’ and animal-linked shamanic soul migration
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The Tungus phrase is not explained further in the provided passage,
    so the comparison must remain cautious.
- id: claim:4
  claim: The passage invites comparison between Samoyed spirit-reindeer combat and
    bull-fighting in a Buriat myth.
  claim_level: visual_similarity
  target: Buriat bull-fighting myth mentioned parenthetically
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The Buriat bull-fighting myth is only referenced parenthetically and
    is not described in the provided passage.
