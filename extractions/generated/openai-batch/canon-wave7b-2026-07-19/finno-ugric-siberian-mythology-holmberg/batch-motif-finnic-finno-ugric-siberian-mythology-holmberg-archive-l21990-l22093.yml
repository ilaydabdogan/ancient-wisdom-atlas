canonical_text:
  quote: ''
  summary: The passage gives a plate caption for shamanic objects and then summarizes
    Buriat, Tungus, and Samoyed beliefs about the animal origin or transmission of
    shamanic power. Buriat tales describe a vulture or eagle sent by gods to protect
    people and then to transmit shamanic power to a woman or to a child born from
    an eagle and a woman. The author relates these stories to clan animal ancestry,
    inherited shamanic power, khubilgan or metamorphosis, and Samoyed beliefs about
    a shaman’s reindeer-shaped spirit bound to the shaman.
  language: English
  quote_policy: summarized
