canonical_text:
  quote: ''
  summary: 'The passage presents Northern Siberian interest in the origin of mosquitoes
    and summarizes several accounts: a Yenisei Ostiak attribution of mosquito creation
    to the demon woman Khosadam; an Ostiak Samoyed story in which the hero Itje kills
    and burns the man-eating giant Piinegusse, whose ashes become mosquitoes; a Samoyed
    variant in which a small black bird is born from Piinegusse''s flesh; and the
    opening of a Vach Ostiak version involving a great bird, a pike, and the bird''s
    sister.'
  language: English
  quote_policy: summarized
