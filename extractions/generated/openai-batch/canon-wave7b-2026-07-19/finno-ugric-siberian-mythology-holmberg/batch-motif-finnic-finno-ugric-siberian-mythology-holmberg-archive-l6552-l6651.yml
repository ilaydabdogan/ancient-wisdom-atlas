canonical_text:
  quote: ''
  summary: The passage describes Ostiak holy places and sacrificial sites, including
    taboo conduct around holy waters, offering storehouses with images of gods or
    spirits, hereditary caretakers, and ritual sacrifices. It explains that some feared
    spirits were remembered as former humans, rulers, heroes, clan founders, or shamans,
    and gives a folk-poem example of a dead enemy-hero becoming an offering-spirit.
    It also mentions Ostiak and Vogul sacrificial practices, bloodless sacrifices,
    consecrated children, and former Siryan hero/idol worship.
  language: English
  quote_policy: summarized
