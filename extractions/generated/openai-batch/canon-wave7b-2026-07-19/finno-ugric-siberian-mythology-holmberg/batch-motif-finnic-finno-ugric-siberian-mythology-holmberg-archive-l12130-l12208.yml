canonical_text:
  quote: ''
  summary: The passage describes offices and preparations for a Cheremiss festival
    in honor of Nature gods. It explains the grove forepart, bathing and clean-garment
    requirements, deity-specific sacrifice trees, and the preparation of ritual objects,
    fire, cauldrons, coins, candle, bowl, and a small tree at the tree of Jumo or
    Heaven god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When one priest leaves his holy office, the neighbor moves up one place and
    the newcomer enters at the end; each priest may choose his own assistant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described festival is presented as a great mer-festival among unbaptized
    Cheremiss in Tsherlak village, Birsk District, observed by the author in 1913.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the morning of the festival, the functionaries go to the grove before the
    rest of the congregation and first remain in a forepart with a provisional tent-like
    hut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The treasurer accounts for means collected during the festival in the forepart
    of the grove.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The congregation remains in the forepart during the holy ceremonies, where
    people converse, tell fairy-tales, take refreshments, and dry garments washed
    in a nearby brook.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: No one may enter the sanctuary without previously bathing in the brook and
    putting on clean, preferably white, holiday garments; this is a daily duty during
    the festival.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sacrificial animals and sacrificial objects wait in the forepart until they
    are used.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a grove where several gods receive offerings, each god has a separate sacrifice
    tree arranged in a row, and the tree of the great Jumo stands at the extreme east.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ceremonies begin at the tree of the great Jumo, and the passage follows
    the ceremony at the tree of the Heaven god because ceremonies at the trees are
    said to closely resemble one another.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After bathing, the sacrificing priests carry needed objects to the foot of
    Jumo’s tree and divide tasks such as bringing water, gathering fuel, and making
    sacred lime-bark objects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A sacrificial fire is made on the site of former fires, and the fire must
    be brought from the village in a pot rather than lit with a match.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: An erection of young limes called a cauldron-holder is set above the fireplace,
    while meat-cauldrons are placed on birch-log foundations.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The trunks used for the cauldron arrangements are laid with their thick ends
    toward the sacrifice tree.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The chief priest digs up copper coins that had been buried at the foot of
    the tree during the preceding festival.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A wooden candlestick called a silver candlestick is placed to the left before
    the tree, holding a small yellow candle made in the grove and called in prayers
    the great silver candle.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: To the right of the sacrifice tree, a small round pillar holds a wooden bowl
    into which a honey drink is poured; the passage notes that its name resin-bowl
    suggests former resin use.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: A small tree, a young lime chopped off at the root, is set against the living
    great sacrifice tree and bound to it with bast; if the great tree is oak or birch,
    the small tree should also be oak or birch.
  category: object
  evidence_refs:
  - ev:9
