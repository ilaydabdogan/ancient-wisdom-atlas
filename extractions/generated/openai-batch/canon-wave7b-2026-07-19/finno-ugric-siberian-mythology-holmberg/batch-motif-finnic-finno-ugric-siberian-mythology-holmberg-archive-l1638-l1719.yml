canonical_text:
  quote: ''
  summary: The passage surveys grave adornments and burial structures among Finno-Ugric
    and Siberian peoples, emphasizing grave-houses or house-like coffins, over-ground
    burial houses, windowed tombs or coffins, bedding and grave goods, and boat or
    punt coffins among Ugrians and Karelian Finns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A branch may be stuck into the grave with threads for the dead bound to it;
    for young girls, kerchiefs may be bound to a pole in the grave or to nearby trees,
    and a three-branched candle is lit on the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the coffin is of comparatively late origin and that
    Eastern Votiaks and Cheremiss prepare the dwelling-house of the dead at the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Eastern Votiaks and Cheremiss, the dead is escorted to the grave
    in full panoply, on a sleigh in winter and on a carriage in summer; the widow
    sits or lies alongside during the journey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A low grave may have fir twigs or birch leaves at the bottom, boards at the
    sides and ends, the dead laid on its back, a roof of boards, and a window in one
    side-wall.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Samoyeds and the most northern Ostiaks formerly, and in many
    places still especially in winter, placed the dead in a dwelling-place erected
    above ground rather than burying them in the earth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among Ostiaks and Voguls, an above-ground tomb is described as resembling
    a small low house with a sloping roof of birch-bark and narrow logs, often with
    a window.
  category: object
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:7
  text: Among Lapps, burial-houses are found whose roofs rise above the ground, and
    the dead are bedded in them on moss, reindeer hair, or similar material.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes a Karelian Finnish custom of building a small log house
    with roof and windows even after earth burial had begun, and presents it as connected
    with older over-ground disposal of the dead.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage identifies an intermediate form in which a low grave is not filled
    in again but is covered with boards and birch-bark.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ancient Karelian Finnish graves are described as containing a house-like wooden
    erection lowered into the grave, sometimes with a board floor and skins; the dead
    were placed inside in festive costume and supplied with necessary articles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The house-like burial structure could be roofed with boards, the grave filled
    in, and the grave covered with one or two layers of stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage notes a Volga Finnish custom of furnishing coffins with a window.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among Ugrians and Karelian Finns, the dead may be buried bedded in a boat
    or punt; in some parts of Karelia, the coffin is still called a punt.
  category: action
  evidence_refs:
  - ev:8
