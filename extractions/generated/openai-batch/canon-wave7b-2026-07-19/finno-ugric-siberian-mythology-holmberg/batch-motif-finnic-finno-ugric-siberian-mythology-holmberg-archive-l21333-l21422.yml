- id: obs:3
  text: Mu-monto sees fat horses on naked rock, thin cattle on rich meadow, women
    with sewn mouths, officials and shamans in boiling pitch, bound men, naked women
    embracing thorn-bushes, and contrasting poor and rich women.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains the dead people's and animals' conditions by prior-life
    conduct, including charity, miserliness, adultery, theft, professional falseness,
    lying, calumny, and treatment by masters.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Tatar tale, the daughter of Irlek-Khan comes to earth in the shape
    of a black fox and harms humans; Komdei-Mirgan is persuaded to hunt her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yelbegen, a nine-headed monster riding a forty-horned ox, rises from the earth,
    cuts off Komdei-Mirgan's head, and carries it to the underworld.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kubaiko sees that her brother's head is missing, decides to seek it in the
    realm of the dead, follows Yelbegen's ox tracks to an underground opening, and
    descends into Irlek-Khan's kingdom.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kubaiko sees seven clay vessels, an old woman endlessly pouring milk from
    vessel to vessel, two contrasting horses, and human bodies used as dams for brooks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kubaiko hears hammering and sees groups of forty men making hammers, saws,
