canonical_text:
  quote: ''
  summary: 'The passage first gives plate captions for Buriat shamanic objects. It
    then describes Mu-monto''s fox-led journey into the land of the dead, where he
    sees people and animals in rewarded or punished conditions explained by their
    conduct in life. A Tatar tale follows: Irlek-Khan''s daughter appears as a harmful
    black fox; the monster Yelbegen takes the head of Komdei-Mirgan to the underworld;
    Komdei-Mirgan''s sister Kubaiko descends by following the ox tracks, encounters
    marvels in Irlek-Khan''s kingdom, and reaches the death-ruler''s stone dwelling
    and a primordial nine-larch tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate captions identify a Buriat shaman with hobby-horses and hides of
