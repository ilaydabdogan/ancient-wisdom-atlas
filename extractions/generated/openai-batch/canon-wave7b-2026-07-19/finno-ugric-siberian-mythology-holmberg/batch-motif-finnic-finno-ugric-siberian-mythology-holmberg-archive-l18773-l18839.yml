canonical_text:
  quote: ''
  summary: The passage surveys Orion traditions in which the constellation or its
    belt is identified with three stags or deer, hunters, arrows, horses, hounds,
    and related figures. It reports Buriat, Teleut, Mongol, Kirghis, Yenisei Ostiak,
    and object-name traditions, and explicitly compares some Siberian Orion hunting
    traditions with ancient Greek Orion traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Buriat account says a famous archer hunted three stags; the stags rose into
    the sky, became the three stars of Orion, and the hunter's arrow is visible as
    a star lower down.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Teleut version names the horseback hunter Kuguldei-Matyr; the three stags
    spring into the sky, the hero follows and shoots two arrows, and the hero, steed,
    and arrows appear as stars.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Teleut account one arrow is white and the other is red because it has
    passed through the bodies of the stags and is bloody.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another tale says God cursed a hunter who intended to kill all the stags on
    earth and changed the three stags into the belt of Orion, with hunter, steed,
    hound, and arrows as stars around them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some variants include a hunting-hawk, arrows, one hound, or two hounds, and
    hunters are said to worship the archer-hero and pray to him for hunting luck.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mongol tradition calls the belt of Orion the three stags and also sees an
    archer, horse, hound, and arrow in the constellation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Buriat tale says this hero was born of a cow and had a human head and a
    horse's body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kirghis tradition sees three deer in Orion's belt and the surrounding stars
    as three hunters and their arrow; God took the deer into the sky because no animal
    could escape the hunters' arrows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the Buriat centaur calls to mind ancient Greek Orion
    tales, where Orion is a mighty hunter who intended to destroy all animals and
    whose hunt, with a hound, was reflected in the sky.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Yenisei Ostiaks call Orion a stag's head, but the passage says their ideas
    do not appear to belong to the preceding myth series; their account says the stag
    carried off a bride for the hero Alba, and Orion is the maiden-robber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage lists object-based names for Orion, especially scales or hand-scales
    and a bucket-yoke, among several named groups.
  category: speech
  evidence_refs:
  - ev:8
