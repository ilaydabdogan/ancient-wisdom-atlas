canonical_text:
  quote: ''
  summary: 'The passage describes Cheremiss, Eastern Votiak, Volga Finnic, Ostiak,
    and Karelian death and burial customs: a coffin as the dead person’s house, farewell
    speeches and wishes for afterlife well-being, wedding-like rites for unmarried
    dead, textile acts meant to leave luck or retain some connection with the dead,
    threads laid for ascent to heaven, grave-side blessings, and a requested small
    opening for the soul’s movement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A coffin is described as a house for the dead, with a small square “window”
    through which light reaches it and through which the dead can observe the surroundings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When placing the corpse in the coffin, Cheremiss speakers address the deceased,
    wish a light, happy, warm existence beyond the grave, ask for dream communication,
    and also ask the deceased not to return or cause early death among the living.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: For an unmarried young man, parents tell him to choose a good wife beyond
    the grave; in some districts unmarried dead are escorted to the cemetery with
    wedding-associated ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a young virgin dies, Cheremiss bury her with needlework, decorations,
    and the headgear of a married woman so that she can appear as a married woman
    at a wedding beyond the grave.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In some districts a thread is snatched from the deceased’s garments, or mourners
    hold the coffin, while asking the deceased not to take the house, cattle, seed,
    fortune, or luck away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among Eastern Votiaks, a relative tears a white cloth into two pieces at the
    cemetery; one piece is left on the dead person’s breast and the other is taken
    home and fastened to a rafter or wall for a year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among Volga Finns, and also among Ostiaks, a body-length thread, or three
    differently coloured threads, is laid from the head to the feet of the covered
    dead body, and is said to be a means by which the dead can climb to heaven.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A body-length thread may be laid by a child so that the child may grow to
    that length in the other world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cheremiss watchers by the body are expected to accompany it to the grave,
    and people who meet the procession wish the dead a happy existence, warmth, and
    light.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the body is lowered, the coffin is lifted three times with the words
    “Fear not,” and relatives then wish the dead a happy dwelling-place and ask it
    not to frighten the living but to protect the former home, family, and herds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A Karelian graveside weeping-song asks that a tiny crack, like a mole’s way,
    be left for the soul to move through after the grave is filled.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Volga Finns return from the grave, those present sweep a little earth
    onto the grave and say that the earth may be light over the dead.
  category: action
  evidence_refs:
  - ev:10
