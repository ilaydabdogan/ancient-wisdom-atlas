canonical_text:
  quote: ''
  summary: The passage surveys a Great Mother or birth-goddess complex among eastern
    Finno-Ugric, Altaic, Turco-Tatar, Iranian, Yakut, Buriat, and Greek materials.
    It emphasizes a life-giving milk lake, a tree of life at the world center or in
    heaven, a Central Asian quest tale involving a heavenly milk lake and Garuda eagle,
    and myths explaining the Milky Way as milk from a goddess.
  language: English
  quote_policy: summarized
