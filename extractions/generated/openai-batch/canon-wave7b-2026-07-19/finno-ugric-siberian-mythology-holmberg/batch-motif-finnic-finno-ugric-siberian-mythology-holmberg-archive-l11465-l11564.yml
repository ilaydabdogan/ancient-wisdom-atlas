canonical_text:
  quote: ''
  summary: The passage describes a Cheremiss harvest rite called the feeding of the
    sickle, in which food is taken to a field, prayers are made for a good harvest,
    sickles are wrapped with the last oat-stalks, and the sickles are addressed and
    stored until the next summer. It then discusses northern Lapp vegetation or fertility
    figures, including the grass mother, Rana-neidda, and Veralden-olmai, with sacrifices,
    drum iconography, and prayers for crops, fish, reindeer, moss, and other forms
    of increase. The passage also states comparisons with Frigg, Frey, and Saturn.
  language: English
  quote_policy: summarized
