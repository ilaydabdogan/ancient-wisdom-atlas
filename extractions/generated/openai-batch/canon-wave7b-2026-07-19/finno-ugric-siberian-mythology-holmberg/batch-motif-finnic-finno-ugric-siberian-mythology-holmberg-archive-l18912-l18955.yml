literal_observations:
- id: obs:1
  text: Solbon, also glossed as Turco-Tatar Tsholbon and identified with Venus, is
    said to be visible in the morning and evening and to play a notable role in Buriat
    tales.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solbon is described as a famous horse-lover who rides over the sky with a
    lasso in hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Solbon is said to possess a great troop of horses watched by a horse-herd
    named Dogedoi or Toklok.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buriats regard Solbon as the patron-god of their horses and pray to and
    worship him for that reason.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In spring, when horse manes and tails are cut and colts are marked, the Buriats
    prepare a sacrifice for Solbon using meat, cream-porridge, and home-distilled
    spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wine is thrown into the air for Solbon and his groom Toklok, while the
    meat and porridge are put into the fire before the people begin their own meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Live horses are dedicated to Solbon, after which they are no longer used in
    human service.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A reported belief says that gods, especially the shepherd-god Sulbundu, ride
    the dedicated horses at night while watching over other horses, explaining their
    morning perspiration.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tales say that Solbon’s groom teaches people to care for their horses and
    sometimes tells beforehand which people will prosper with horses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The birth of a colt in autumn after Solbon has appeared in the sky is regarded
    by the Buriats as a good omen for that colt’s later quality.
  category: attribute
  evidence_refs:
  - ev:6
