canonical_text:
  quote: '"the world of the dead was originally a reflection of the earthly one"'
  summary: The passage describes Siberian and Finno-Ugric-related accounts of the
    realm of the dead as inferred from burial customs, grave goods, sacrifices, and
    shamanic ceremonies. The dead are equipped for continued life, work, travel, festivals,
    and family residence in the underworld. Shamans guide souls along a difficult
    road threatened by hostile spirits; a Golde account details branching roads, a
    steep slope, a river crossing, and family villages of the dead.
  language: English
  quote_policy: quoted
