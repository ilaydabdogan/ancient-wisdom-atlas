canonical_text:
  quote: ''
  summary: The passage describes Finno-Ugric and Siberian burial practices in which
    the dead are clothed, wrapped, and supplied with provisions, tools, weapons, household
    goods, and status-specific objects for a final journey. It also describes rods
    for protection in the underworld, gifts or messages sent through the deceased
    to earlier dead kin, the breaking or 'killing' of objects given to the dead, and
    protective measures against dangers believed to come from the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dead persons are dressed or swathed with garments or protective wrappings,
    with examples including undergarments, kerchiefs, towels, trinkets, birch-bark
    wrappings, and reindeer- or bear-skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some burial items vary by age, gender, or social role, including a marriage
    portion for a young girl, a staff for an old man, distaffs and sewing tools for
    women, toys for children, crutches for the lame, a drum for a shaman, and dog
    and spear for a hunter.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The dead are supplied with provisions for a journey, money, weapons, implements,
    and household articles; smaller objects are placed in the coffin and larger objects
    around the grave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among some Cheremiss, a rod is placed in each hand of the corpse so that it
    can protect itself in the underworld against attacking hounds, serpents, or evil
    spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Ostiak and Cheremiss offerings are treated as items sent with the deceased
    to relatives who died earlier, including nuts described as sweets for the children
    of kinsmen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Objects given to the dead are broken; examples include dashing a valuable
    object in pieces in Savolax and breaking the deceased's spoon in Ingria.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that breaking objects prevents the dead person's spirit
    from returning to demand property and that 'killing' an article releases its 'soul'
    or 'shadow' to follow the deceased.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that protective burial measures are performed by survivors
    because the dead are believed able to cause danger, including a belief that the
    dead wishes to take along family, children, and dependants.
  category: other
  evidence_refs:
  - ev:6
