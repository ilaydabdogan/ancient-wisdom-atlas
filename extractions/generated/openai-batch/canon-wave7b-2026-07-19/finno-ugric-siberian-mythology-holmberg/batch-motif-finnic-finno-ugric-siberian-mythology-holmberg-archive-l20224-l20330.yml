canonical_text:
  quote: "“The ground has lost its kut”"
  summary: The passage describes an Altaic conception that natural objects, phenomena,
    and even man-made objects possess soul-like powers or invisible Masters/Rulers.
    It gives terminology from Tatar, Chuvash, Yakut, and Buriat contexts, then describes
    Yakut and Buriat blacksmith tool spirits, blacksmith deities, sacrificial rites,
    iron images of tool-Masters, and a Buriat ordeal by which a neophyte may gain
    musical skill from the Master of a musical instrument.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A plate caption describes a Mongol shaman’s dress with metal ornaments and
    symbols, and a drum whose inner side shows a hand-grip with bells.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that among the described Altaic peoples a soul corresponding
    to the human soul is conceived as hidden within natural objects and phenomena.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Altai Tatars are said to use the word kut for the soul of both human beings
    and natural objects.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When kut leaves a human being, decline and sickness result; when it leaves
    the earth, a tree, or similar object, that object withers or loses fertility.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dwelling-place may also lose its kut, taking away the feeling of homeliness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The word sur is described as having meanings including appearance, beauty,
    comfort, power, and soul, and is used for human souls, spirits of the dead, cattle
    health, army power, and bread’s nourishing property.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that invisible souls animate and govern natural phenomena
    and stand in relation to visible nature like a master toward property.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The passage lists words for Master, Lord, or Ruler in several languages or
    dialects: Ea or Oja in Tatar dialects, Hoza in Chuvash, Itshi in Yakut, and Edzhi
    in Buriat.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Invisible Rulers are said to be found in the sky, stars, fire, land, forest,
    trees, grass, rivers, lakes, mountains, rocks, animals, and man-made objects.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Yakuts are said to see a Ruler in sharp weapons, objects capable of motion,
    noisy objects such as magic drums or musical instruments, and a bundle of birch-branches
    used in baths.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The blacksmith’s trade is said to be held in great respect by both Yakuts
    and Buriats, and Rulers are believed to dwell in blacksmith tools.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: In the Yakut description, the anvil and striking-hammer share an Itshi, the
    tongs and forge each have their own, and the Head-Itshi is in the bellows.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Yakut tutelary genius of blacksmiths called Kudai-Bakshy is said to dwell
    in the underworld.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Yakut smiths slaughter a brown cow for Kudai-Bakshy, anoint themselves and
    their tools with its blood, roast the heart and liver in the forge, and beat them
    on the anvil until nothing remains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Buriats of the Balagan District worship a blacksmith deity called Boshintoi,
    who has nine sons and one daughter said to have taught blacksmith craft to men.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: In Buriat sacrifice to Boshintoi’s family, smiths pour kumiss and other sacrificial
    liquids onto the glowing forge, and sometimes slaughter a lamb.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Iron images of Boshintoi’s sons and daughter are made with blacksmith tools
    in their hands, and are called the corresponding Masters of those objects.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Buriat Master of a musical instrument is said to teach people to become
    skilful musicians.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: A musical neophyte must go on a moonless night to a junction of three roads
    and sit on a horse skull fitted with silken reins.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: At midnight the horse skull is said to try to unseat the rider; falling causes
    death, but remaining seated and continuing to play results in becoming a skilful
    player.
  category: sequence
  evidence_refs:
  - ev:10
