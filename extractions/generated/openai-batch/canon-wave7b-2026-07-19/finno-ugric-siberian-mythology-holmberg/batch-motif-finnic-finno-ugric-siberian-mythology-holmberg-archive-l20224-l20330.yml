candidate_motifs:
- id: motif:1
  label: Hidden animating soul in natural objects and places
  taxonomy_refs: []
  basis: The passage states that natural objects and phenomena possess a soul corresponding
    to the human soul, and gives kut as the term used for the soul of both humans
    and natural objects.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a conceptual motif rather than a narrative episode.
- id: motif:2
  label: Loss of vital soul causes decline or loss of fertility
  taxonomy_refs: []
  basis: The passage links departure of kut or sur with human sickness, withering
    of earth or trees, field infertility, loss of homeliness, loss of nourishment,
    and loss of army power.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not describe restoration of the lost soul.
- id: motif:3
  label: Invisible Master or Ruler inhabiting nature and artifacts
  taxonomy_refs: []
  basis: The text explicitly describes invisible Nature gods as Masters, Lords, or
    Rulers present in the sky, fire, land, forests, waters, mountains, animals, and
    man-made objects.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: No single individual Master is named for every listed object or place.
- id: motif:4
  label: Tool-indwelling spirit of blacksmith equipment
  taxonomy_refs: []
  basis: Yakut blacksmith tools are said to have Itshi, with specific spirits assigned
    to anvil and hammer, tongs, forge, and bellows.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage reports a classification of tool spirits, not a mythic narrative.
- id: motif:5
  label: Sacrifice to craft patron and tools
  taxonomy_refs:
  - sacrifice
  basis: Yakut and Buriat smiths make offerings involving animal slaughter, blood
    anointing, organs placed on anvil and forge, liquids poured onto the glowing forge,
    and occasional lamb sacrifice.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The exchange expected from the sacrifice is not described in detail beyond
    honoring the beings.
- id: motif:6
  label: Supernatural teachers of blacksmith craft
  taxonomy_refs:
  - culture_hero
  basis: Boshintoi’s nine sons and one daughter are said to have taught the blacksmith’s
    craft to men.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage states a culture-teaching function but does not narrate a
    full culture-hero cycle.
- id: motif:7
  label: Nocturnal crossroads ordeal for mastery
  taxonomy_refs:
  - initiation
  basis: The musical neophyte must perform a dangerous night ordeal at a three-road
    junction; success gives skill, while failure brings death.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage concerns musical skill rather than a complete social initiation
    ceremony.
- id: motif:8
  label: Animated skull as tester of the seeker
  taxonomy_refs:
  - initiation
  basis: The horse skull on which the neophyte sits is said to try to unseat him at
    midnight, functioning as the immediate danger in the ordeal.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The text does not explain whether the skull itself, the musical-instrument
    Master, or another power animates the test.
- id: motif:9
  label: Underworld dwelling of craft tutelary being
  taxonomy_refs: []
  basis: Kudai-Bakshy, the Yakut tutelary genius of blacksmiths, is said to dwell
    in the underworld.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No journey to the underworld is described in this passage.
comparison_claims:
- id: claim:1
  claim: The passage treats Tatar Ea/Oja, Chuvash Hoza, Yakut Itshi, and Buriat Edzhi
    as comparable terms or functions for invisible Masters, Lords, or Rulers.
  claim_level: same_function
  target: Altaic terms for invisible Masters or Rulers of nature and objects
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives glosses and functional equivalence; it does not establish
    etymology or a single historical origin.
- id: claim:2
  claim: 'The passage supports a functional comparison between Yakut and Buriat blacksmith
    traditions: both attach supernatural rulers, patrons, or Masters to blacksmithing
    and its tools.'
  claim_level: same_function
  target: Yakut Itshi/Kudai-Bakshy and Buriat Boshintoi/tool-Master traditions
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The named beings, ritual details, and tool classifications differ;
    the text does not claim identity between the Yakut and Buriat figures.
- id: claim:3
  claim: 'Across the described examples, the same general pattern extends from natural
    phenomena to man-made objects: invisible rulers are associated with both domains.'
  claim_level: same_function
  target: Nature-spirit and artifact-spirit pattern in the surveyed Altaic material
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is a broad survey claim within the passage and not a narrative
    comparison between two complete myths.
