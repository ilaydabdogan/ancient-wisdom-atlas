canonical_text:
  quote: ''
  summary: The passage describes Finno-Ugric and Siberian beliefs and customs about
    naming children, especially the idea that illness or a mark from the dead may
    indicate a wrong name, that rites seek a departed ancestor's name or soul for
    the child, and that some related traditions connect naming with ancestor rebirth,
    guardian spirits, sacrifice to the dead, or names drawn from objects or phenomena
    noticed at birth. It closes with a note on the antiquity and linguistic distribution
    of the word for “name.”
  language: English
  quote_policy: summarized
