  text: A child's illness or a skin mark attributed to the dead is interpreted as
    evidence that the child has received a wrong name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magic ceremonies are used to determine a new name so that the child may thrive
    and recover.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The names enumerated in these rites are usually names borne by departed forefathers,
    and the passage says the sought “soul” or “spirit” is inferred to be an ancestor's
    soul.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Lapp belief described, a pregnant woman may indicate in dreams or through
    shamans which kindred dead person is willing to live anew in the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old woman gives or baptizes the child with the name of a departed person
