  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the right name is not found at once, the child's name may be changed several
    times in cases of sickness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: According to the Northern Ostiaks, after some years the spirit of a deceased
    person can be born again into earthly life in a child of the same kindred, and
    the dead person's name must be found so that the child may thrive and be strong.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among Eastern Finno-Ugrian peoples, another custom gives a child a name from
