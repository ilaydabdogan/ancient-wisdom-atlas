canonical_text:
  quote: ''
  summary: The passage surveys beliefs about threats to the inhabited earth, especially
    inundation from the cosmic ocean, then summarizes Buriat and Sagaiyes flood tales
    in which a divinely aided vessel preserves humans and animals while the devil
    interferes. The author notes resemblance to the Biblical flood story and identifies
    Noj with Noah.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents world-destruction dangers including the sinking of a
    sky-supporting pillar and the possibility that the earth's foundations may give
    way or be inundated because the earth lies on a great cosmic ocean.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asian tales of different earth periods are said to relate that a great flood
    once destroyed all life and that one escaped human became ancestor of a new race
    of humans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author says similar tales occur among Altaic peoples, but the question
    of ancient borrowings or direct remainders is difficult to decide, and the known
    forms seem to represent later currents of civilization.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Buriat tale, Burkhan advises a man before the flood to build himself
    a great ship, and the man works in the forest while concealing his purpose from
    his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shitkur, the devil, tells the wife that her husband is building a ship and
    instructs her how to enable him to accompany her into it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When a great flood threatens the whole earth, the ship-builder urges his family
    to enter the vessel; his wife resists, repeats the formula taught by Shitkur,
    and the devil is enabled to board with her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: With Burkhan's help, the man gathers specimens of all animals into the ship
    except the Prince of animals, Argalan-Zon, which believes itself too large to
    be drowned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Inside the vessel, the devil changes into a mouse and gnaws holes in the bottom
    until Burkhan creates a cat to catch the mouse.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The flood destroys all animals left on earth, including the Prince of animals;
    other tales name the mammoth as the animal that failed to survive.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a Sagaiyes tale, the ship-builder is called Noj; the devil tempts his wife
    to find out what he is building and then destroys by night what Noj builds by
    day.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When the flood begins in the Sagaiyes tale, the vessel is unfinished, so God
    sends an iron vessel in which Noj, his wife, family, and all kinds of animals
    are saved.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The author states that both tales call attention to the devil's role, otherwise
    resemble the Biblical flood story, and that Noj is Noah.
  category: other
  evidence_refs:
  - ev:12
