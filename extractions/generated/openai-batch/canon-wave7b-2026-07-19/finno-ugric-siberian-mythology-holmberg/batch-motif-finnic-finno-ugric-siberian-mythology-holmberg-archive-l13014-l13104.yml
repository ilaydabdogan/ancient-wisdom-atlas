canonical_text:
  quote: ''
  summary: The passage identifies Lapp shaman drums and describes the shaman’s spirit
    or soul, called sueje, as able to take animal forms. It summarizes soul-animals
    that assist or embody the shaman during trance journeys, contests between shamans’
    animal doubles, underworld journeys to retrieve or escort souls, bargains with
    underworld spirits involving sacrifice, and brief parallels in Samoyed and Finnish
    beliefs about shamanic animal or elemental flight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate identifies a Lapp shaman’s bowl-drum and sieve-drum, and the passage
    states that the drum was used for excitation, trance, and divination.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Scandinavian Lapps called the shaman’s spirit sueje, originally meaning
    “shadow,” and it was supposed to take the shape of a reindeer, fish, bird, or
    snake.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Southern Lapp shaman-animals assisted the shaman during unconscious
    visits to the underworld, naming a reindeer-bull, bird, fish, and snake.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited missionary account places some of these animals in holy mountains
    and distinguishes them from other mountain inhabitants.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage states that the animals were soul-animals: the shaman’s separated
    soul moved over land as a reindeer-bull, through air as a bird, through water
    as a fish, and into earth as a snake.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When two shamans sent their reindeer-bulls to fight, the result for the animals
    determined victory, illness, death, or exhaustion for the shamans who owned them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In a cited account, a shaman in trance journeyed in his fish to the underworld
    and the fish brought him back uninjured to his body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage reports Finnish tales in which Lapps fly in bird form and fall
    when the bird is shot down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that soul-animals were sometimes pictured on magic drums.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says the shaman’s soul needed different forms to overcome underworld
    difficulties, especially when bringing back the bodyless soul of a sick person
    carried off by spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The underworld spirits are described as bolting their doors, while a clever
    shaman’s soul could enter through a small crevice; fighting could occur before
    a compromise involving a fixed sacrifice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the bargain, the shaman’s soul brought the soul in question home quickly
    over mountains and valleys.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The shaman also had to go to the underworld to accompany the soul of a dead
    person or bring back the soul of a departed relative, for example to herd cattle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage says Samoyeds also believed shamans used animal forms for supernatural
    journeying, and it adds that Lapps believed the shaman’s soul could fly as a whirlwind,
    with similar Finnish relics and an incomplete mention of flying in the form of
    fire.
  category: relationship
  evidence_refs:
  - ev:9
