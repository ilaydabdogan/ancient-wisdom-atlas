canonical_text:
  quote: ''
  summary: The passage describes Finno-Ugric and Siberian bear worship and related
    animal taboos. It notes a Vogul practice of covering the bear's eyes and nose
    like a corpse, gendered restrictions around eating and slaughtering forest animals,
    beliefs that the bear is holy, intelligent, and dangerous even after death, oath-taking
    by bear body parts, and Lapp bear-festival procedures involving tracking, drum
    divination, an ordered procession, killing the bear, apologizing and thanking
    it, and post-kill customs with twigs, skis, and a fir-twig ring.
  language: English
  quote_policy: summarized
