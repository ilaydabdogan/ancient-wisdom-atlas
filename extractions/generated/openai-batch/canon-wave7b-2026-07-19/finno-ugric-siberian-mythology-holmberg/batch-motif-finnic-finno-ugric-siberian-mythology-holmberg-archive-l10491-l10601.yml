comparison_claims:
- id: claim:1
  claim: The passage explicitly says the Baltic Finnic and Lappish elevation of the
    Thunder god over the Heaven god occurred under foreign influences according to
    comparative research.
  claim_level: historical_contact
  target: Foreign influence on Baltic Finnic and Lappish Thunder-god prominence
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt does not identify the exact foreign sources or mechanisms
    for this influence.
- id: claim:2
  claim: The passage presents Erza Pur'gine as derived from Lithuanian Perkunas and
    groups several thunder-related names with Baltic and Scandinavian terms.
  claim_level: linguistic_similarity
  target: Lithuanian Perkunas, Scandinavian Fjorgynn, Finnish Perkele, and related
    thunder terms
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a source-level philological comparison; the excerpt does not
    provide detailed linguistic argumentation.
- id: claim:3
  claim: The passage says the Norse Thor has been recognized in an Esthonian battle-cry
    and in the Karelian name Tuuri, while the identification of Turisas with the same
    god is uncertain.
  claim_level: linguistic_similarity
  target: Norse Thor compared with Esthonian Tar and Karelian Tuuri; possible Turisas
    comparison
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: The same evidence includes explicit uncertainty about Turisas, and
    the excerpt reports recognition rather than demonstrating it.
- id: claim:4
  claim: The passage supports a regional comparison in which the Thunderer is conceived
    as an old man or grandfather among Ostiak, Mordvin, Esthonian, and Finnish examples.
  claim_level: same_motif
  target: Regional old-man Thunderer pattern
