  quote: ''
  summary: The passage surveys moon-cult and thunder-deity beliefs among Finno-Ugric
    and Siberian peoples. It describes a moon-ring object used to preserve moonlight
    in winter, then compares regional conceptions of the Thunderer as bird, old man,
    mother, or anthropomorphic god. It records sacrifices, first-thunder observances,
    storm-stilling rites, lightning-struck tree worship, and linguistic comparisons
    linking local thunder names with Baltic, Scandinavian, and other neighboring terms.
  language: English
