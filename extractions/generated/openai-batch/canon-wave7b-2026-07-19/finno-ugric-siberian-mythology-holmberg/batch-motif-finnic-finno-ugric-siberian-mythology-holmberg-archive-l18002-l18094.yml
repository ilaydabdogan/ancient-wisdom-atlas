canonical_text:
  quote: ''
  summary: The passage surveys a fate-writing and heavenly-messenger figure among
    the Ostiaks, including Pairekse or the Life-time writing man, who records the
    fate of newborn persons and travels between heaven and earth, sometimes in goose
    or animal form. It compares related Chuvash, Cheremiss, and Votiak materials,
    then draws parallels with Babylonian Nabu and Egyptian Thout as divine scribes.
    It also mentions Central Asian groups of Tengeri, including thirty-three gods
    on the Sumeru world-mountain and thirty-three heavenly discs.
  language: English
