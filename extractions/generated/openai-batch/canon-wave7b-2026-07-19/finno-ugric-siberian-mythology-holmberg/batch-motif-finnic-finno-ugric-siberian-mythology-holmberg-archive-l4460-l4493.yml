  quote: ''
  summary: The passage introduces the Seides of the Lapps as sacred stone gods placed
    in mountain and waterside settings. It describes them as natural stones, often
    shaped by water and sometimes resembling humans or animals, with human-like stones
    especially valued. Groups of Seide stones could be understood as a family, and
    an excavated holy place at Lulea is described as having mounds with larger and
    smaller stones arranged around them. The passage also notes devoted care for the
    stones and their placement on green, grassy ground where possible.
