canonical_text:
  quote: ''
  summary: 'The passage describes Lapp bear-hunt ceremonies after a successful killing:
    treatment of the bear carcass, singing at the return home, branch and ring signals
    at the tent, women’s restricted reception of the hunters, alder-bark markings,
    festive decoration, separated feasting and sleeping, and next-day transport of
    the bear with prayers that it not send bad weather.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the bear has fallen, hunters drag it a short distance, swing spears
    at it as if it were still alive, cover the carcass with fir branches, and leave
    it until the next day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Returning hunters signal success with traditional singing; women in the tent
    dress festively and answer with similar singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one account, the leader plaits a fir twig with a small ring, strikes the
    tent’s backdoor three times, and says a gendered name according to whether the
    prey is male or female.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Other accounts describe a birch twig with copper rings or an alder branch
    pushed under the tent wall three times as a signal to the wife that the bear has
    been killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women are not to approach the bear or join in its slaughter; when the men
    enter through the sacred backdoor, the women cover their faces and may look through
    a copper ring.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women spit chewed alder-bark juice into the faces of the hunters, and the
    same is done to the dogs that took part in the hunt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men and women may paint bodies or faces with alder-bark juice, including rings
    around arms, lines on the breast, and a cross on the forehead.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women decorate husbands with brass rings and chains; the bear-killer’s wife
    wraps the twig in linen and keeps it until the bear’s tail has been cooked and
    eaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The day of the news is marked by feasting; men and women eat separately, do
    no other work, sleep in finery, and sleep with their own sex only.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the next day, some men prepare a temporary dwelling-place for the bear
    from boards covered with fir, while others go to transport the bear.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men and the reindeer used for transport are decorated with brass rings and
    chains; the reindeer may also receive alder-bark marks on the neck and forehead.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the way to bring in the bear, the men sing and pray to the bear not to
    send bad weather; they avoid crossing any woman’s track.
  category: action
  evidence_refs:
  - ev:8
