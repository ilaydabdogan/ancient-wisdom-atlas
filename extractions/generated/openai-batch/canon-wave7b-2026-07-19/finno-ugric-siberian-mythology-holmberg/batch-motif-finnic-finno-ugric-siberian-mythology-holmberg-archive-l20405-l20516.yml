comparison_claims:
- id: claim:1
  claim: The passage reports a scholarly view that the Yakut Forest Master became
    connected with a corresponding Russian spirit through Russian beliefs.
  claim_level: historical_contact
  target: Russian forest-spirit belief and Yakut Forest Master belief
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is attributed to Serosevskiy in the passage and is not independently
    demonstrated within this excerpt.
- id: claim:2
  claim: The passage states that European Tatar and Chuvash Forest spirits correspond
    to Russian spirits while differing from the more worshipped northern Siberian
    Forest spirits.
  claim_level: same_function
  target: Russian spirits, European Tatar and Chuvash Forest spirits, and northern
    Siberian Forest spirits
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is broad and based on appearance, worship status, and
    moral characterization, not a detailed narrative match.
- id: claim:3
  claim: The Volga Tatar Shurale is presented as a figure also encountered among the
    Volga Finns.
  claim_level: same_motif
  target: Volga Finn Shurale-like forest being
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt only alludes to an earlier discussion and does not reproduce
    the Volga Finn evidence.
- id: claim:4
  claim: The Chuvash Obyda is described as a corresponding evil Forest spirit to the
    Shurale-type pattern of harmful forest beings.
  claim_level: same_function
  target: Volga Tatar Shurale and Chuvash Obyda
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The beings share harmful forest-spirit functions, but the passage also
