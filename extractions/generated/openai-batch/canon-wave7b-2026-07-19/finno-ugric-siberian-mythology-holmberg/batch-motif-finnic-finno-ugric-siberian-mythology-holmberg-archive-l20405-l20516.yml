canonical_text:
  quote: ''
  summary: The passage surveys forest, steppe, and animal “Masters” among North Siberian
    and related peoples. It describes offerings to Forest Masters, temporary ritual
    images made on trees or from wood, local masters of forests and trees, evil forest
    beings such as Shurale and Obyda, the suffocating Albasta, the deceptive Steppe
    Master Albin, and animal-species masters including mammoth, reindeer, and bear
    masters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning of the autumn hunting season, some North Siberian tribes
    sacrifice part of the first hunting bag to the Forest Master.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The Yakuts are said to have sacrificed black bulls to Bajanai.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sacrifices, Tungus, Yakuts, and other northern peoples make an image of
    the Forest Master by carving human features on a living tree trunk or shaping
    a billet of wood into a human-like form.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mouth of the Forest Master image is smeared with sacrificial blood, and
    a new image is made at each sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A cited view says Yakut beliefs about the Forest Master became connected with
    Russian beliefs, and that originally each forest, thicket, or separate tree had
    its own Master.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Buriats ask separately from each local Forest Master for
    game rather than from one general Forest spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among European Tatars and Chuvashes, the Forest spirit is described as having
    a defined appearance and as chiefly evil and seldom worshipped.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Volga Tatar Shurale can increase or diminish its height, has very large
    nipples, and kills victims by tickling them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Chuvash Obyda is described as human-like, naked, long-haired, with large
    nipples and feet turned the wrong direction.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Obyda causes people to lose their way and kills victims by tickling or dancing
    them to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Folk-tales say that animals ridden by Obyda run backward and that Obyda itself
    wanders backward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Chuvash also call the evil Forest spirit the “Half-human,” and the passage
    connects this name cautiously with Votiak and Yakut accounts of one-sided or same-named
    beings.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Tatar Albasta is said to dwell in desert spaces, bogs, and chasms, to
    be human in shape, to take the form of many forest or field objects, and to kill
    people by suffocation.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Kirghis imagine Albasta as a great woman with a large head, breasts reaching
    to the knee, and long sharp fingernails, attacking especially pregnant women.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Steppe Master Albin lights will-o’-the-wisps by the wayside to deceive
    travellers into leaving the road and losing their way.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Forest-animal spirits and each animal species have Masters or Khans, and sacrifices
    are made to these Masters.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Tungus sacrifice to the Mammoth Master to find mammoth teeth, the Reindeer
    Master is said to have received blood-sacrifices, and the Bear Master must not
    be offended.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Bear flesh and carcasses are treated with taboos and respect; the bear skeleton
    may be preserved on wood or branches, and the skull may be hung in a tree.
  category: action
  evidence_refs:
  - ev:13
