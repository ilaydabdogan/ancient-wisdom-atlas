canonical_text:
  quote: "“Arise, Chief, there is war on the earth!”"
  summary: The passage describes Cheremiss worship of the Nemda Old Man or Nemda Prince,
    also called Tshembulat and in some districts the Northern Ruler. It reports sacrifices
    at the Nemda brook, a sacred stone, and later groves; recounts tales that the
    spirit was once a Cheremiss chief who hid beneath a stone and could be summoned
    in war by a rider on a white stallion; and describes penalties for a false summons,
    an invisible army, war sacrifices, and other local hero-spirits such as Hero Aren.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Nemda Old Man or Nemda Prince was associated with the Nemda Hill and Nemda
    brook, where Cheremiss pilgrims made sacrifices at a greatly feared holy place.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stone on the bank of the Nemda near the village Tshembulatova was a sacrifice
    site; Russian priests destroyed the stone, and the spirit worshipped there was
    called Tshembulat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people later prepared groves in the spirit's name at different places,
    so that the same spirit could be worshipped in groves of many villages.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tales say the Nemda Old Man lived by the Nemda brook, which had a bridge,
    and had a wife and officials who each received separate offerings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many tales describe the Nemda Old Man as a former Cheremiss chief who rode
    a white stallion, fought enemies, and re-established peace on earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: After proclaiming peace at a stone, the chief lifted the stone, placed himself
    under it, and instructed the people how to summon him if war returned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Cheremiss once performed the summoning out of curiosity; the chief arose,
    found no war in any direction, and imposed future servitude and an annual foal
    sacrifice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In some districts the same figure is called the Northern Ruler and is said
    to command an invisible army whose warriors are blamed for cattle sickness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Meeting the Northern Ruler without yielding causes immediate illness, requiring
    a horse sacrifice; he is described with a green cloak and red head-dress and is
    specially sacrificed to in war.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Besides the Nemda Prince, the Cheremiss have other local keremet spirits,
    many of whom became worship objects through heroic deeds.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hero Aren fought against the Tatars, died before a gate later called the Hero
    gate, asked for a good horse in the grave, and told the Cheremiss to continue
    war by slinging stones.
  category: sequence
  evidence_refs:
  - ev:8
