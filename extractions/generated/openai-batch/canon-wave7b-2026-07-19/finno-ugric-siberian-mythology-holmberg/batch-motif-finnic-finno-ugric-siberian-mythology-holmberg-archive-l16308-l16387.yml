canonical_text:
  quote: ''
  summary: The passage surveys Siberian and Finno-Ugric traditions about world destruction
    by flood and fire, including Yima or Schal-Jime as a death-ruler and flood-associated
    figure, flood survivors dispersed into peoples and languages, Samoyed survivors
    reduced to an ancestral pair, North-East Siberian raft survival, Tungus fire-destruction
    with a boy and girl rescued by an eagle, and a Vogul account of divine fire sent
    against the devil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yima is described as the Iranian “First Man,” worshipped as ruler over souls
    and also as a flood hero; an Altaic tale gives Schal-Jime care over drinkers,
    little children, young animals, and those dying happily.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ugrian accounts say people saved on rafts drifted in different directions
    and settled in different parts of the earth after the flood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Yenisei Ostiak account says water rose for seven days, people and animals
    climbed onto floating logs and rafters, and a north wind scattered the people
    for seven days, leading to different languages and peoples.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator comments that foreign flood-tale influence seems apparent in
    the seven-day periods of time.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Samoyed flood tale says seven persons were saved in a boat; after the flood
    drought and hunger followed, leaving one young man and one maid, from whom the
    present human race descended.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A North-East Siberian flood tale says people bound tree trunks into large
    rafts, carried provisions, used rocks on ropes as anchors, and finally grounded
    on a high mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Tungus account says a great fire raged for seven years, the earth was burned
    up, everything became sea, and all Tungus were consumed except a boy and girl
    who rose into the sky with an eagle and later descended where the water had dried.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Vogul account says God sent a sea of fire upon the earth to destroy the
    devil; only gods and a few mortals saved themselves, the gods on an iron ship
    and the mortals on a seven-bottomed beech-raft.
  category: sequence
  evidence_refs:
  - ev:8
