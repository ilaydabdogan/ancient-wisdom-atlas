  quote: ''
  summary: 'The passage describes beliefs about Water spirits and related beings:
    their cattle may be seized with iron or steel; water beings may appear as strange
    fish or death omens; Nakki is feared and repelled by ritual words and metal; and
    a Water spirit may teach music at dangerous cost.'
  language: English
  quote_policy: summarized
