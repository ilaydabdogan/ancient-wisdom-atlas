canonical_text:
  quote: ''
  summary: Survey passage reports Yakut, Buriat, Altai Tatar, Turukhansk, Mongolian,
    and Altai explanations for figures seen in the moon, lunar waning, and eclipses.
    Reported images include water-fetchers taken by the moon, a man-eater and a shaman
    imprisoned in the moon, a lunar hare, animals eating the moon, and an eclipse
    beast named Alkha or Arakho.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Yakut tale says the moon pitied a poor orphan girl fetching water, descended,
    lifted her to his breast, and ascended to the heavens; the girl with yoke and
    buckets is then seen in the moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another tale says a brother and sister went to fetch water, watched the moon,
    and were snatched by the angry moon; Yakuts are said not to allow children to
    watch the full moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Buriat tale has a hard-hearted stepmother wish that the sun and moon take
    the girl; the girl grasps a willow-bush, and the moon takes the child with her
    buckets and the bush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the water-fetcher tale has a variant in Snorri's Edda
    and is widely known in Asia and Europe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: An Altai Tatar tale says an old man of the moon once lived on earth as a man-eater;
    the moon descended, seized him with a hawthorn tree, and returned to the sky,
    where both can still be seen in the moon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: People of the District of Turukhansk are said to see a shaman with his drum
    in the moon; the shaman had tried to fight the moon and was made its prisoner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mongolians and peoples of the Altai are said to imagine a hare dwelling in
    the moon.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Yakuts explain the waning of the moon as wolves and bears eating its disc
    whenever it has grown back to ordinary size.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Buriat account explains eclipses as a beast, Alkha, swallowing the sun and
    moon; gods cut Alkha in two, but the living forepart still haunts the sky and
    cannot retain swallowed stars.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage reports a custom of praying, screaming, making noise, throwing
    stones, and shooting into the sky to drive away Alkha when it troubles the sun
    and moon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Another Buriat account says Arakho consumed people's body hair; God asked
    the moon where Arakho hid, struck the beast in two, and the living forepart continues
    eating the moon.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A final, incomplete account says Otshirvani had the sun and moon prepare water
    of life, Arakho drank it and soiled the cup, and God cut him in two after asking
    the moon for the beast's dwelling-place.
  category: sequence
  evidence_refs:
  - ev:11
