canonical_text:
  quote: ''
  summary: The passage describes Votiak family-god sacrifices in kuala sanctuaries,
    including regular spring, summer, and autumn rites; variations between little
    and great kualas; older accounts of offerings before fir branches representing
    the family god; an Easter rite involving purification, food and beer offerings,
    and prayer to the Vorsud; a fuller Multan account involving bread, eggs, drink,
    animal killing, blood collection, boiling meat with blood, offerings into fire,
    disposal of bones, and prayers for family, cattle, and vegetation; and a note
    on women's participation varying by region.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Votiaks perform general regular kuala sacrifices most widely three times
    a year: in spring, summer, and autumn.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On regular holy days, sacrifices are performed in both little and great kualas,
    and representatives may be sent to the greater sanctuary of the mother village.
  category: action
  evidence_refs:
