  evidence_refs:
  - ev:8
- id: obs:10
  text: During the Multan rite, one person recites prayers over the victim while another
    pours water on it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The animal is killed, its blood is collected in a cup or trough, the skin
    is removed, entrails are cleaned, and worthless parts are buried in a pit.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The meat is divided so that pieces are taken from different members, boiled
