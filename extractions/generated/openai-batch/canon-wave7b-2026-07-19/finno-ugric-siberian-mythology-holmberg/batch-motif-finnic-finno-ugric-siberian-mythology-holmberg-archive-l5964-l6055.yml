- id: obs:4
  text: One older account says Votiaks sacrifice a young calf near fir branches regarded
    as representing the family god, then place the calf's ears on the shelf where
    the branches lie.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Georgi's account, men and women first cleanse themselves in a bathhouse
    and bring necessary sacrificial objects to the kuala guardian.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Georgi's account, the priest places portions of cooked food and beer on
