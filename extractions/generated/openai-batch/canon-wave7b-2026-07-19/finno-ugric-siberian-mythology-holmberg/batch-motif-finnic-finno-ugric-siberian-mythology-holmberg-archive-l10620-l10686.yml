canonical_text:
  quote: ''
  summary: 'The passage describes historical Finnish, Ingrian, Esthonian, and Lapp
    rites and traditions concerning thunder or sky deities: sacrifices of food, sheep,
    beer, spirits, bulls, and reindeer; offerings carried to mountains or grottoes;
    prayers and liquid-pouring rites for rain, crop fertility, and protection from
    drought; Rauni/Ravdna as wife of the Thunder god and associated with the rowan;
    and hammer or bow/rainbow attributes of thunder gods compared with Thor.'
