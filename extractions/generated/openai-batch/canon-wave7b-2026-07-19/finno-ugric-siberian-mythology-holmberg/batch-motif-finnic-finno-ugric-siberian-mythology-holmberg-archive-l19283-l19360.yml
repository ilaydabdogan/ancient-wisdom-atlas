canonical_text:
  quote: ''
  summary: The passage surveys thunder-god imagery, including dragon, bird, and winged
    forms; recounts Buriat tales in which human men ascend to heaven, use heavenly
    stones as lightning weapons, and become Thunderers; notes Buriat uncertainty about
    which Tengeri raises a given storm; and names Yakut thunder gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Chinese and Japanese traditions imagined the Thunder god
    in the shape of a peculiar dragon represented in art in many ways.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects bird and winged-dragon conceptions of thunder with the
    swift movement of a thunderstorm and the sudden flash of lightning, and notes
    that human-featured Thunder gods may be winged.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Buriats, tales are reported in which a human hero becomes a Thunder
    god by putting on winged garments.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: In one Buriat tale, an aged clever archer leaves his wife and three sons,
    rides away, and chooses the middle road at a meeting of three roads; this road
    leads to the sky.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the heavenly house, four young men feast the old man, ask him to remain
    as guardian, and forbid him to open a chest or put on a winged garment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man opens the chest, sees differently colored stones shaped like arrow-points,
    notices a person stealing vegetables on earth, and throws a red stone at the thief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The four masters say the old man has set a whole village on fire because of
    one wicked man; later he puts on the winged clothes, gains the power of flight,
    and becomes the god of Thunder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a second version, a man lost in great forests finds stairs from earth to
    sky, ascends to a glittering heavenly house, and becomes servant to Esege-Malan-Tengeri.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the second version, the servant sees a stolen sheep being led away, angrily
    throws a stone from God's chest, sees it fall as lightning that kills the thief,
    and thereafter serves as the Thunderer.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The passage says the Buriats lack a clearly defined anthropomorphic Thunder
    god, call thunder rumble the song of heaven, and may consult a magician or nine
    shamans to identify which Tengeri raises a storm.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Asan-Sagan-Tengeri is named as one of the mightiest Thunder gods and is said
    to fight evil spirits with his fiery arrow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Yakuts are said to have a distinct Thunder god called Ulu-Tojon, meaning
    Great Lord, or Syga-Tojon, meaning Lord with the axe.
  category: attribute
  evidence_refs:
  - ev:9
