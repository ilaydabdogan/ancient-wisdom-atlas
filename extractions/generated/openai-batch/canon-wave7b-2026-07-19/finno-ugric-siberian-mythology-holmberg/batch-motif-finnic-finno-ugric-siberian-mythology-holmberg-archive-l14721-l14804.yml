canonical_text:
  quote: ''
  summary: A comparative survey of earth-origin tales describes North American, Central
    Asian, Indian, Mongolian, Nearer Asian, and Japanese accounts in which primordial
    water precedes land. Recurrent episodes include animals or divine beings fetching
    mud or earth-matter from under water, earth being placed on or supported by a
    turtle or other animal, a creator or Bodhisattva taking turtle form, and land
    forming when water or cosmic foam is stirred or coagulated.
  language: English
  quote_policy: summarized
literal_observations:
