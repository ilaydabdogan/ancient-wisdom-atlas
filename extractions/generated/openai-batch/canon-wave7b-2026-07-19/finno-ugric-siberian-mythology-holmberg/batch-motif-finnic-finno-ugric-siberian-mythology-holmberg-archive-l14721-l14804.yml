  text: In the Sioux account summarized here, a turtle and a water-bird swim in the
    primordial ocean with earth-matter in their mouths, one carrying mud and the other
    grass.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grassy earth made by the turtle and water-bird is placed on the turtle's
    back.
  category: action
  evidence_refs:
