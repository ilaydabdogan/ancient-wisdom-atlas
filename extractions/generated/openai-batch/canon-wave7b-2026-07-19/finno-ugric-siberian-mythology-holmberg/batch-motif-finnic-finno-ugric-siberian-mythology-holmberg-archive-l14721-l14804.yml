- id: obs:3
  text: In the Huron account summarized here, only water exists at first until a turtle
    appears from the depths and sends water-dwellers to fetch earth-matter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Huron account, the frog is the last sent and is the one in whose mouth
    the turtle finds mud.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Huron account, mud is sprinkled around the edges of the turtle's shell
    and forms the earth; the turtle remains the earth's supporter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: In the Buriat account summarized here, at the beginning there is only water
    and a great turtle looking into the water.
