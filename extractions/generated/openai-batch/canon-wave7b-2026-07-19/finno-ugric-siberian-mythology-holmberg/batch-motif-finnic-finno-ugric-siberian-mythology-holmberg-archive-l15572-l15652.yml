canonical_text:
  quote: ''
  summary: The passage surveys Altaic, Turkic-related, Ostiak, Tatar, Mordvin, and
    briefly Yakut traditions about a cosmic tree or birch located at the world center,
    often on a central mountain, reaching into the heavens and rooted in lower depths.
    It is compared with the world-pillar, associated with gods, water, life-giving
    liquid, ladles, and in one Tatar poem a guardian appointed by the Creator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Altaic tales place the highest tree on earth at the navel or center of the
    universe, with a giant silver-fir raising its crown to Bai-Ylgon’s dwelling.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The world-tree is described as generally growing on a high hill or mountain,
    especially the central mountain of the earth; a cited folk-poem has an iron mountain
    with a white, seven-branched birch on it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the central mountain is believed to hide its summit among the sky-storeys,
    the tree is said in some beliefs and tales to have been raised into the sky.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among peoples related to the Turks, the tree is said to have grown from a
    small sapling as the universe grew and to be connected with the construction of
    the universe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tree’s position is compared to that of the world-pillar; gods use it to
    tether their horses, and it is sometimes pictured as many-storeyed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Vasyugan Ostiak shaman songs, the tree is described as seven-storeyed,
    like the heavens themselves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The tree is often regarded as piercing the different floors of the sky while
    thrusting its roots deep into underground depths.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: The cosmic tree is described as a branched, living tree whose notable features
    are freshness and sappiness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: In most tales, the tree is situated on the brink of a spring, lake, or sea,
    or sometimes in the water itself; the Ostiaks speak of a watery sea of the heaven-center
    beside which it grows.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: A Minusinsk Tatar poem describes a birch piercing twelve heavens on a mountain
