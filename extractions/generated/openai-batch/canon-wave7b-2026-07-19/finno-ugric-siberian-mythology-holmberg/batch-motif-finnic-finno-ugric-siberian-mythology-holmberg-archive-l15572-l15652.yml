    ladle at its foot.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The same Tatar poem says the birch is watched over by Old Tata, the forefather
    of the Tatars, who received this post from the Creator.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: A Mordvin tale describes a giant birch on a forest hill, with roots ringing
