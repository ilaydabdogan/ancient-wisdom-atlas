canonical_text:
  quote: ''
  summary: The passage describes a Cheremiss fortieth-day memorial feast, presented
    as a solemn farewell feast. Family members ritually fetch the deceased from the
    graveyard with horses and a wagon, offer food and drink at the grave, invite ancestral
    dead and the ruler of the lower world, bring the deceased's shade to the homestead,
    seat it on a cushion, show it household property, and begin the larger feast after
    sunset.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fortieth-day memorial feast is described as both a memorial and a farewell
    feast, celebrated more solemnly than other memorial observances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that among the Volga Finns the ceremonies for this occasion
    were very similar, and gives a Cheremiss example from the District of Urzhum.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the fortieth day, a sheep or sometimes a larger animal is killed, and relations,
    neighbours, and friends of the deceased gather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of the deceased's own family are chosen to fetch the deceased from
    the graveyard.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the sun is highest, the fetchers put the best horses before a wagon,
    take meat and drink, and drive rapidly with bells to the burial-ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the grave, honey, meat, gin, beer, bread, cheese, and pancakes are placed
    on a white cloth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fetchers uncover their heads, kneel, address the deceased by name, and
    invite the deceased to rise, eat, and come to the village for the great feast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Drink is poured and food is placed on the grave with the memorial-feast formula
    that this is the deceased's portion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The deceased is called on to bring earlier-dead relations and the dead fathers
    and mothers of the family; the ruler of the lower world is also invited to the
    feast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A soft cushion is placed in the wagon for the deceased, and the deceased is
    asked to sit there and ride home.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Although the wagon seat is empty, the Cheremiss participant is said to believe
    that the deceased's shade is present and speaks to it during the drive.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In some places, the wagon is driven three times round the grave before returning
    to the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the homestead, the widow and children kneel by the steps, and a solemn
    functionary with bared head holds bread, cheese, and drink while inviting the
    dead man into the hut.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The cushion is taken into the hut to a fixed place where the deceased is asked
    to sit, and living people do not sit there.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The deceased's clothes and bast-shoes are hung near the place reserved for
    him, and the widow says that no one has used or lost them.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Meat and drink are set before the deceased at home; afterward, men take him
    to see the cattle, corn-stacks, farm implements, and sometimes the bath-house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The feast proper begins only after sundown, when relations and friends of
    the dead man arrive at the yard.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
