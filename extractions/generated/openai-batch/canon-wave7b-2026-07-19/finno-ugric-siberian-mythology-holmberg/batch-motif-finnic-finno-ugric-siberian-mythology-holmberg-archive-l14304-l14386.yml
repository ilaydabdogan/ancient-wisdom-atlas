canonical_text:
  quote: ''
  summary: The passage surveys creation-tale variants in which God and a devil or
    antagonist may be brothers or counterparts, the antagonist may assume bird or
    water-fowl form, and an earth-fetcher dives or seeks earth from the primordial
    ocean. It recounts an Altaic tale where God and the “First Man” move as black
    geese over primordial water; the First Man fetches earth for God, hides some in
    his mouth to make his own world, and the swollen earth is spat out to form boggy
    places. The passage then compares North Russian, Vogul, East European, and Buriat
    variants in which bird-form or human-like earth-fetchers hide earth and thereby
    produce landforms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in Yakut tales Satan is called the elder brother of
    Christ, that in corresponding Votiak and many Russian tales God and the devil
    Keremet are brothers, and that Zervanists held Ormazd and Ahriman to be born of
    the same mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that in the previously discussed creation tales the devil
    usually appears in human shape, while a Yakut variant has him take the shape of
    a swallow to hold mud in his mouth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that the devil often changes into a water-fowl, a form described
    as suited for diving and seeking earth at the bottom of the deep ocean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Eastern European variants summarized in the passage, the devil helps God
    both in human form and as a diver-bird such as a loon, goose, or other water-fowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Altaic tale, the beginning contains only water, and God and the “First
    Man” move over the primordial ocean in the shape of two black geese.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Altaic tale, the devil or First Man tries to rise higher, sinks into
    the depths, nearly suffocates, calls to God, and is raised into the air by God’s
    word.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: God commands a stone to rise from the bottom of the ocean, and the First Man
    sits on it.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: God asks the First Man to dive under the water and bring land; the First Man
    brings earth in his hand, and God scatters it on the water while commanding the
    world to take shape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On a second earth-fetching, the First Man hides a morsel of earth in his mouth,
