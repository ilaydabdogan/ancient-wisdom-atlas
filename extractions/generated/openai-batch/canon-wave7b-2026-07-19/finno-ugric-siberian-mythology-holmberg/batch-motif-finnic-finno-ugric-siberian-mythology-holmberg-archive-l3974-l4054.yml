canonical_text:
  quote: ''
  summary: 'The passage describes a Lapp bear ceremony after a hunt: men return with
    the bear, women answer their songs, the bear is placed and decorated in a separate
    cutting-up tent, protective substances and brass ornaments are used, men sing
    to and about the bear during butchery, the flesh and blood are cooked under strict
    rules, omens are watched, and the meat is distributed by rank with a separate
    share for women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are forbidden for a whole year to use the reindeer that dragged in the
    bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the men approach home with the bear, they sing, and the women answer with
    a welcome to the men who felled the bear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bear is placed in a cutting-up tent near the holy backdoor of the dwelling-tent;
    the cutting-up tent may be decorated with hay garlands.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The carcass is laid outstretched, sprinkled with alder-bark juice, and given
    a small bark receptacle of the same liquid before its nose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Knives and vessels are decorated with brass rings, and brass rings and chains
    are bound around the bear’s neck.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children may be present and run between the cutting-up tent and the dwelling-tent
    to report what they have seen and heard to the women.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: During the cutting-up, the men sing to guess the bear’s home district, thank
    it for its fur, describe the honour shown to it, and ask it to tell other bears
    about that honour.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the men correctly guess what the women are doing in the other tent, this
    is regarded as a good omen.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The flesh is cut carefully so that small bones, arteries, and muscles are
    not damaged; the women’s portion is cooked separately.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bear’s blood is cooked with fat and eaten; hunters sometimes smear bear
    blood on themselves, wives, children, the door, and the logs supporting the tent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The head, windpipe, and entrails are left untouched until the flesh is cooked;
    the head is skinned last and cooked with the attached entrails.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hunters sit on each side of the fire according to rank and the importance
    of each person’s role in the kill.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The cooking vessel must be brass or decorated with brass rings, and even a
    tiny overflow of gravy into the fire is considered a very bad omen.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: If the gravy boils too violently, a man checks whether women’s behaviour caused
    it; if not, the chief person tries to stop the boiling over by singing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The food may not be seasoned with salt; the chief person distributes meat
    to each participant, while the women’s share is taken to the dwelling-tent.
  category: action
  evidence_refs:
  - ev:8
