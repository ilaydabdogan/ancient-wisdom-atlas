canonical_text:
  quote: ''
  summary: The passage describes Christmas-season Lapp offerings involving birch-bark
    or fir boat-shaped troughs, trees, reindeer blood, food, and named spirits; an
    authorial comparison to Icelandic Jolasveinar; and memorial feasts for deceased
    kin or unknown dead among East Karelians, Mordvins, and Cheremiss.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain spirits walking about at Christmas were called by the Lapps “the Christmas
    people.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Swedish Lapps collected morsels from all Christmas feast dishes and placed
    them in a birch-bark trough shaped like a small sailing boat with masts, sails,
    and oars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boat-shaped trough was put in a tree near the tallest pine-tree by the
    tent, while round figures were cut on four sides of the pine trunk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each man who had contributed food to the trough threw three spoonfuls of fat
    with his left hand into the cut figures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A four-yard tree with twigs was smeared with blood from a slaughtered reindeer
    on Christmas Eve, and pieces of the reindeer’s lungs, heart, tongue, and lips
    were placed on its branches.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fir boats with masts were dedicated to “the Christmas Master,” smeared with
    reindeer blood, and marked with the sign of the cross.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sailing boats and birch-bark troughs with Christmas food, fish, cheese, and
    milk were placed in tall trees; the sacrifice was made to Ruotta to prevent harm
    to women’s wombs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author notes that the sailing-boat sacrifice is striking because the Lapps
    themselves did not use sailing-boats.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fritzner compares the Lapps’ “Christmas people” with Icelandic Jolasveinar,
    who were also believed to move about at Christmas.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In East Karelia, relatives arranged a common feast in honor of the deceased,
    with slaughtered animals and abundant food brought by invited relations and friends.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For the deceased, a cloth was spread on a separate table in a separate room,
    and an item such as a spoon or dish was laid there every day for nine weeks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nails were driven into the walls for the deceased to hang their clothes on,
    food was set out, empty chairs were placed around the table, and windows were
    opened.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The family went to the burial-ground to invite the deceased to the feast,
    with women calling for kinsfolk and acquaintances to come.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mordvins were reported to hold a great common feast for a large family in
    honor of the deceased after long intervals such as about fifty years.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Cheremiss memorial feasts honored unknown deceased with no living relations,
    called Utumo, and are described as customary among the Eastern Cheremiss.
  category: action
  evidence_refs:
  - ev:12
