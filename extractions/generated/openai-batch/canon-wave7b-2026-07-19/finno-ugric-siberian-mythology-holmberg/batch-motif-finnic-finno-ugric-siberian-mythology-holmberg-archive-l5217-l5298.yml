canonical_text:
  quote: ''
  summary: The passage describes Votiak family organization, inherited property marks,
    and the transmission of the kuala sanctuary and its guardianship. It explains
    how family and village kualas function as worship places, storehouses, and markers
    of family identity, with sacrifices performed by a guardian who is ideally an
    eldest son or lineal male descendant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one village, sixteen fathers of families lived in economic nearness and
    ate common meals despite inhabiting different houses; in another village, twenty
    men living separately were subordinate to one common head.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Votiaks are united by family name and by a stamp used to mark property.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The property mark is generally a picture of an object, such as a goosefoot
    or an axe; the passage notes that Ostiaks earlier also used animal pictures.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father's mark is left to the eldest son, who remains in the father's cottage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other male members of the same family, when leaving the paternal home, obtain
    new marks by adding to or slightly changing the mark of the former home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Family members who receive their own marks still remember the mark of their
    fathers, which also belongs to the kuala sanctuary of the former home.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Blood relations may recognize one another in unfamiliar places by means of
    the inherited mark.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the father's death, the eldest son inherits the homestead, the mark,
    the kuala, and the office of kuala guardian.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The duty of the kuala guardian is to perform family sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: If there is no male heir, the office of kuala guardian is inherited by the
    deceased man's brother or another nearest male relation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The family kuala is used as a sanctuary, storehouse, and kitchen, and only
    the family in question worships there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Votiaks also take part in sacrifices in a kuala whose guardian is, if possible,
    a lineal descendant of the founder of the village family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The family sanctuary is called the little kuala when compared with the kuala
    associated with the village family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: There are many little kualas in a village, but not every kuala is a sanctuary.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: A Votiak who has founded a family and home may continue to worship in his
    father's kuala, or, if he has none, in his grandfather's kuala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage infers that the Votiak family was formerly larger, comprising
    several sub-families that likely lived in one house-complex under one head.
  category: other
  evidence_refs:
  - ev:6
- id: obs:17
  text: In a family village, there is only one great kuala; in villages containing
    descendants of different families, there are as many great kualas as there are
    families.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: Every great kuala is named after its respective family, and its worshippers
    are also called by the family name as sons of that family.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: The number of great kualas indicates how many families there are in a village.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: Where several great kualas are present, they are generally located in the
    houses of their guardians and may function like private kualas as store-rooms
    for household utensils.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:21
  text: Where a village is inhabited by one family only, the great or village kuala
    is common property of the village and is generally situated in the guardian's
    garden or in a special enclosure.
  category: setting
  evidence_refs:
  - ev:8
