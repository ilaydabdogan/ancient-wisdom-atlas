  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: According to the Tungus, a deceased shaman appears to a family member chosen
    as successor, either in a dream or during severe illness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says a person who refuses the shamanic call is tormented by the
    spirit to the verge of death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After a spirit appears to a Tungus shaman candidate, the candidate withdraws
    from others and experiences nerve-attacks, hysteria, epilepsy, and abnormal behavior.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A Yakut shaman describes illness beginning at age twenty, seeing and hearing
    what others do not, resisting the spirit for nine years, then becoming near death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Yakut shaman reports recovering immediately when he began to shamanize,
