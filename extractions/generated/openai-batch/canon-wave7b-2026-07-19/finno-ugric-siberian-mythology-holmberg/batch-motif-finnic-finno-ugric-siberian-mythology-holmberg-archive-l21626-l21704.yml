    “shaman.”'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says a shaman cannot become such only through education or practice,
    but must possess special shamanic talents that are received or called.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Giliak shaman reported being ill for over two months, motionless and unconscious,
    before becoming a shaman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Giliak account, the candidate dreamed of singing shaman songs and saw
