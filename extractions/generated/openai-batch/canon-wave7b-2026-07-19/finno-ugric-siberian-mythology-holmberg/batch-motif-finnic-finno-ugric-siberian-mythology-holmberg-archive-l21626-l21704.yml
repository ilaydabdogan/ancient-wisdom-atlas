canonical_text:
  quote: ''
  summary: The passage describes Siberian shamanism as a religious complex centered
    on specialists who contact the spirit-world, often in ecstasy, to recover absent
    souls and cure sickness. It presents shamanic vocation as an involuntary calling
    marked by illness, dreams, spirit encounters, and recovery through acceptance
    of shamanizing. Examples are given from Giliak, Tungus, and Yakut accounts, including
    a dream with a white owl and human figure instructing a candidate to make a drum,
    a deceased shaman-spirit choosing a family successor, and the Yakut Amagat as
    the soul of a dead shaman represented on costume as a small man-like metal figure.
  language: English
  quote_policy: summarized
