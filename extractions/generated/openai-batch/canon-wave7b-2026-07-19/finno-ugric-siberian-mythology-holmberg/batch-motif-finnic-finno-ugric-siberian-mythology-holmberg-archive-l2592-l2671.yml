canonical_text:
  quote: ''
  summary: The passage surveys memorial-feast and funeral customs among Mordvins,
    Siryans, Ingrians, Russian Karelians, Eastern Votiaks, and related Volga groups,
    including ritual deputies for the deceased, invitations from the grave, food portions
    for the dead, conveyance by horse or sleigh, farewell feasts, and burial or redistribution
    of objects associated with the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hide is hung over the grave of a dead man after the relevant animal or substance
    has been boiled and eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Mordvins, the dead man is described as fetched from the graveyard
    by a horse promised to him for sacrifice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person dressed in the deceased's clothes relates the deceased's experiences
    and describes the work or condition of various dead persons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Mordvin funeral festivity, the representative of the dead is placed on
    a cushioned chair, given a large knife, carried to a drying-kiln, and made to
    chop down a twig treated as a tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At dawn, the Mordvin representative is taken to the graveyard, seated on the
    grave with his back to the east, offered foods such as pancakes and mutton, invited
    to eat for the last time, and asked to return at harvest-time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Siryans, a woman serves as principal guest for a deceased female
    and a man for a deceased male; at the end the guest exits first while others attend
    with candles, because the deceased is thought to withdraw in the person of the
    deputy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In some Siryan places, the deputy is accompanied as far as the first cross-road.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Ingria, people went with food to the grave at the six-weeks festival to
    invite the deceased to the feast, then placed food on the home table with a spoon
    that no one could touch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Ingria, the eldest family member scattered salt, peas, and slices of egg
    on the table for the dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the Ingrian repast, a woman in the entrance sang a weeping-song imploring
    the deceased to join the circle of relations.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the Ingrian repast, participants went out facing the graveyard and each
    stuck a fire-stick or twig into the ground as a walking-stick for the dead man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Russian Karelia, when relatives went to the graveyard to invite the deceased,
    they also took a driverless horse harnessed to an empty sleigh covered with a
    white cloth to convey the deceased home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In some districts among the Siryans and Volga races, an anniversary was celebrated
    with a farewell feast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: According to the Eastern Votiaks, at the anniversary the deceased first leaves
    his own people, among whom his soul had lived and thriven up to that time.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the Eastern Votiak anniversary rite, relations gather, a sheep or cow is
    killed for the feast, some food is taken to the grave, a white cloth fixed to
    a rafter on the funeral day is buried in the grave, and the dead man's clothes
    may then be given to the poor.
  category: sequence
  evidence_refs:
  - ev:10
