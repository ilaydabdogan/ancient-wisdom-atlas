canonical_text:
  quote: ''
  summary: The passage surveys sources and scholars for the study of ancient Finno-Ugric,
    Ugric, Samoyed, and related religious traditions. It describes how Christianization
    affected preservation of earlier beliefs, lists peoples whose religions are discussed,
    and names collectors, authors, and authorities for Ostyak, Vogul, Samoyed, Siryan,
    Votiak, Cheremiss, Mordvin, and Chuvash religion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Missionary activity is said to have occurred alongside growing interest in
    recording and describing ancient heathen beliefs and customs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that accounts are least complete for peoples earliest converted
    to Christianity, giving the Magyars as an example and noting that Ostiaks and
    Voguls may illuminate early Ugric religion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: G. Novitskiy's 1715 description of the Ostyak people is identified as one
    of the most important older sources, and several collectors and investigators
    of Ostyak and Vogul material are named.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage names sources and investigators for Samoyed and Yurak religion,
    including Castren, Archimandrite Veniamin, T. V. Lehtisalo, and K. Donner.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The oldest accounts of Siryan religion are said to be in the biography of
    St. Stephen, followed by a long gap in documentation while the Siryans adopted
    Orthodox doctrine and Russian folk-beliefs; V. Nalimov is named as collecting
    remaining material.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says more is known about ancient Votiak faith than about Siryan
    faith, though the earliest Votiak sources date only from the eighteenth century,
    and it lists authorities on Votiak religion.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cheremiss religion is said to have been recorded by A. Olearius in 1636, with
    later valuable studies by G. Jakovlev and V. M. Vasiljev.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Mordvins are described as having mostly lost their ancient faith until
    modern scholarship recorded vanishing remnants after their adoption of Orthodoxy;
    several scholars are named in relation to this material.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that Chuvash religious beliefs, customs, and usages help
    elucidate the ancient faith of the Volga Finns, and names V. Magnitskij and G.
    Meszaros as valuable sources.
  category: relationship
  evidence_refs:
  - ev:8
