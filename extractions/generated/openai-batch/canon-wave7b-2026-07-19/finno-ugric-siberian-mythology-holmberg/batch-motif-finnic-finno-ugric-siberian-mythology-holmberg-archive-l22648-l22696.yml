  quote: ''
  summary: The passage captions a plate of a Yakut shaman’s drum, then describes a
    fragment in which an unnamed female being prevents a soul from returning to a
    shaman’s body by nailing it to a tree. It then summarizes the shaman’s soul journeys
    through earth, heaven, and the underworld to gain knowledge, divine practical
    matters, recover souls of the sick, and escort souls of the dead. It closes with
    a description of shamanic songs and nocturnal performance with drum, dance, spectators,
    hearth-fire, and forest setting.
