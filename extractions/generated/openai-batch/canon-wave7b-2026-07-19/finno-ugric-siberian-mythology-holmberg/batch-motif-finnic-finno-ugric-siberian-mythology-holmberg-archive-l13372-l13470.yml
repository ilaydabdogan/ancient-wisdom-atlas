canonical_text:
  quote: ''
  summary: 'The passage describes Lapp shamanic practice: diagnosing sickness and
    prescribing sacrifice, using the magic drum to enter trance, relying on an awakener
    to retrieve the shaman’s wandering soul, and facing danger from hostile shamans.
    It includes an embedded account in which a shaman uses a cloth and a sieve-like
    drum bearing images of a whale, reindeer with sleigh, and boat with oars; his
    soul travels in whale form, is attacked by an antagonistic shaman in the form
    of a sharp post, and his bodily death reflects the injury. A second shaman restores
    a dead hostess, who reports the first shaman’s fate. The passage also compares
    Lapp drum use and drum images with Siberian shamanic practice.'
  language: English
  quote_policy: summarized
