canonical_text:
  quote: The place where the foal stops is the site of the grove.
  summary: The passage describes Votiak family and clan worship at sacred groves called
    lud, their hereditary guardians, ritual cleanliness requirements, reasons for
    founding new groves, dream-revealed sites, site selection by a magician riding
    an unridden foal, transfer of the old grove’s spirit through ashes, annual sacrifice
    duties, punishment by the lud spirit, and a fable about a failed attempt to remove
    the spirit by taking away offerings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Votiaks worship by family at a lud; members of one family do not worship in
    another family’s lud, and a larger clan grove for mutual sacrifice is called a
    great lud.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each lud has a guardian, usually passing from father to son; when the guardian
    is childless, another family or clan member may be chosen, and sometimes the magician
    chooses the guardian.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The guardian has no special ceremonial dress, but neat and clean apparel is
    required; where possible he wears white garments and new bark-shoes, and worshipers
    must bathe before entering the grove.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lud may be made in hope of deliverance from serious illness, because a grove
    spirit has revealed its place in a dream, or because settlers have moved too far
    from the old lud.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the spirit reveals a grove in a dream, the dreamer is expected to go
    at once and fence in the place shown.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For selecting a new grove, the magician rides an unridden young foal without
    bit or reins into the forest, and the foal’s stopping place becomes the grove
    site.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sacrifices are not offered in a new sacred grove until the spirit has been
    brought from the old place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that ashes from the old grove or native village grove
    are brought to the new sanctuary and placed at the new fireplace site.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After inauguration, the lud becomes a sanctuary where yearly sacrifices are
    owed by the founder and descendants.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Votiaks are said to continue worshiping the spirit at the former grove
    site even when the physical lud has been laid waste.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Anyone omitting the prescribed sacrifices is said to be punished severely
    by the stern lud spirit.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Votiak fable says a Tatar tried to take away the lud spirit by collecting
    offerings from the grove, but punishment continued; the people believed the offerings
    had not been taken far enough away.
  category: sequence
  evidence_refs:
  - ev:8
