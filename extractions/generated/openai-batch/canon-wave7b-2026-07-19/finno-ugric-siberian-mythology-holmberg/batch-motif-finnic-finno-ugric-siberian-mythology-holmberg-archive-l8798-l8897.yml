canonical_text:
  quote: ''
  summary: The passage surveys water spirits among Lapp, Samoyed, Ostiak, Vogul, and
    related groups. It describes female water beings, sacrificial rites to water and
    fish spirits for fishing success or relief from illness, fish-form representations,
    human marriage motifs in folklore, identified loans from neighboring traditions,
    and a general shift toward water itself as a sacrificial cult object in agricultural
    settings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female water being called Caccejienne, translated as “Water mother,” is
    described as emerging from the water at dawn, combing long black hair, fleeing
    back into the water when frightened, leaving her comb on the shore, and enticing
    men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Western Lapp Saiva-neida, translated as “Sea maid,” is identified as a
    loan from Scandinavia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Samoyeds, the “Master of the water” is generally regarded as dangerous
    and sometimes as a bringer of disease.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Samoyed rites to the “Master of the water” include offerings of money at river
    mouths, clothes hung on bushes near water in illness, seasonal sacrifices for
    fish, and in some Yurak cases a fishlike wooden image or a specially shaped dried
    fish as representation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ostiaks hold sacrificial feasts on the shore before fishing, pour blood
    into the water for Jengk-tongk, offer items such as brandy and animals, and sacrifice
    on the ice after rivers freeze.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Older Lapp and Ostiak sacrifices for fishing luck are said to have been directed
    chiefly to spirits of the dead believed to live in certain holy places; the passage
    also notes that water- and forest-spirit sacrifices are especially found in districts
    with foreign influences.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Vasyugan a Fish spirit named Kul jungk is said to live in the water and
    give fish to its favourites; after the ice breaks, a fish-like image of wood or
    birch-bark is made and the spirit receives a share of the first catch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Vogul Vit-khan, translated as “Water Khan,” is described as less prominent
    in sacrificial worship, but folklore says the spirit or his daughter may marry
    human beings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A water spirit named Kul is described as a loan from the Siryans, an evil
    being of human shape living in deep waters and known in western Ostiak and northern
    Vogul territory.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that among agricultural peoples water remains important
    for settlement, communication, mills, and fertilization, leading water itself
    to become an object of sacrificial cult.
  category: relationship
  evidence_refs:
  - ev:9
