canonical_text:
  quote: ''
  summary: The passage describes a Lapp shamanic conflict in which Aurora-like lights
    fight in the sky, then surveys the construction, imagery, ornamentation, and accessories
    of Lapp shaman drums, including sieve-shaped and bowl-shaped forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When two Lapps quarrelled, they sat on the ground and sang for their saivo
    to send them a “light,” described as a flame of the Aurora Borealis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lights met in the sky and fought while the shamans lay on the ground and
    practised their art; noise and crackling in the sky accompanied the duel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The person whose light faded became ill, and if the light was totally extinguished
    the shaman died.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage connects the Finnish term “Fire-Lapp” with a method of flying
    through the air like a flame.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The shaman’s most important instrument was the drum, whose skin could be painted
    with drawings and figures using alder-bark juice or reindeer blood.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Drum images could show heaven with the sun, moon, and gods; earth with tents,
    storehouses, animals, and fishing-waters; and the underworld with its inhabitants.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Lapp drums varied in shape, size, and construction, and are classified in
    the passage into sieve-shaped and bowl-shaped groups.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sieve-shaped drum was made by stretching skin over a wooden band, generally
    oval in form, with a narrow wooden cross-piece handle on the back.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The bowl-drum was hollowed from a piece of wood into a rounded bowl, with
    skin stretched over its mouth, two long holes cut in the bottom to form a handle,
    carved figures, small sound-strengthening holes, and an oval egg-form body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: On sieve-drums the pictures usually formed a circle with the sun in the middle,
    while on bowl-drums horizontal lines divided the surface and upper rows contained
    Heaven gods.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the sieve-drum resembles Siberian drums and is often fitted
    with wire belts or chains holding metal jingles.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bowl-drum ornaments are described as claws of wild animals, ears or hair of
    forest animals, or carved figures on the handle when other decorations are absent.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The drum set included a two-branched carved hammer of reindeer horn, often
    skin-covered, and later also a ring, bunch of rings, or other metal object called
    arpa, meaning “die.”
  category: object
  evidence_refs:
  - ev:7
