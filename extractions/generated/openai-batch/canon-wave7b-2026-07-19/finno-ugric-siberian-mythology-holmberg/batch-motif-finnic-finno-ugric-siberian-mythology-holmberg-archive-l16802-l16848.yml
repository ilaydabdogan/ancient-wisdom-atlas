canonical_text:
  quote: ''
  summary: 'The passage summarizes creation-tale variants involving a naked dog, a
    devil who spoils or mars humans created by God, and a dualistic pattern compared
    by the author to Iranian and Syrian Christian contexts. It then recounts a tale
    in which seven men respond differently to a woman given life by the devil: three
    refuse and go to a golden mountain to become divine assistants, while four remain
    and a wife is made from Targyn-nama''s ribs. A Yakut variant has seven first men
    marred before receiving life; only four receive wives at first, leading to dissatisfaction,
    adultery, later marriages to daughters, and one daughter becoming a prostitute.
    The passage closes by contrasting these deficiency-origin tales with supposedly
    older tales in which humans succumb to evil suggestions only after receiving life.'
  language: English
  quote_policy: summarized
