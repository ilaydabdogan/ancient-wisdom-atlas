canonical_text:
  quote: ''
  summary: 'The passage describes beliefs about forest and water spirits among Finno-Ugric
    and neighboring peoples: the protective rowan, personified forest figures such
    as Forest Mother, Tapio, Tava, and Hiisi, anthropomorphic and dangerous forest
    spirits, Lapp Seide fish-gods, Akkruva as a fish-bodied sea-spirit, Ravgga/Meriraukka
    as a water omen and drowned-person spirit, and Nekke/Nik as a Scandinavian-derived
    evil water being.'
  language: English
  quote_policy: summarized
