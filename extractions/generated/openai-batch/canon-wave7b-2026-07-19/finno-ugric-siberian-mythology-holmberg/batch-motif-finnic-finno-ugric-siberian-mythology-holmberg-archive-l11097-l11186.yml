canonical_text:
  quote: ''
  summary: 'The passage describes agricultural rites among Mordvin, Votiak, and Cheremiss
    groups: recovery of a corn-soul in butterfly form, the Mordvin Corn mother and
    her grain-life lyric, Votiak spring seed prayers and egg-sowing omens, Cheremiss
    seed and rain magic, Votiak rites honoring grass with porridge, hay, Inmar prayer,
    a white bull sacrifice, and a bull-calf impersonation. It closes by stating that
    the Votiak Meadow man is a counterpart to the Russian Polevik field-spirit.'
