canonical_text:
  quote: ''
  summary: 'The passage surveys household and local spirits among Finnic and related
    peoples: the Estonian Kratt/Tulihand, the Votiak Ubyr, the Finnish Boundary man,
    the ruler of buried treasures, Estonian sacrifices to the Father of the home at
    a purified orchard spot, related domestic sacrificial sites and first-fruits offerings,
    and Volga Finnic foundation sacrifices connected with a mill spirit. It also notes
    counterparts among Teutons and Slavs and cautions against concluding that household
    spirits were originally sacrificed humans.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Estonian Kratt or Tulihand is described as manufacturable, like the Finnish
    Para, and as carrying money and other things in a sack.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food, generally porridge and milk, was offered to the Kratt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a person unloosed all bindings and buttons of their garments during the
    Kratt's flight, the Kratt fell to the ground with its treasures.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Votiak Ubyr is described as flying through the air like a fire-worm or
    meteor and drinking the blood of sleeping people, leaving blue marks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ubyr may be the soul of a living sorcerer or of an evil dead person, and
    it can be brought to the ground in the same way as the Estonian Kratt.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Finnish Raja-aija, or Boundary man, was said to dwell on the boundary
    between two neighbors' properties, to shout without echo, and to appear when boundary
    lines were dishonestly moved.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: In East Finland, people were reported to have sacrificed on boundary stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hidden treasures in the earth had a Ruler, and blue flames could be seen over
    them on certain holiday nights, especially Midsummer's Eve.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Estonians in Krasna sacrificed to the Father of the home in a purified corner
    of their orchards, and women could enter this spot only once, after their wedding
    ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The master of the house looked after the purified spot, offered sacrifices
    there with a pure assistant, and each autumn the family-beer ceremony included
    taking a portion of sacrificial flesh to the spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage compares the Krasna Estonian purified spot with Votiak sacrifices
    in yard corners or kuala, Hill Cheremiss reverence for old kudo sites, Volga Finnic
    autumn sacrifices to family gods, and Finnish first-fruits offerings at a holy
    tree or stone near the home.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that offerings to household spirits among Finno-Ugric peoples
    seem especially connected with appeasing underground spirits.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among the Volga Finns, children were reportedly sacrificed under a new watermill,
    and the Mordvin ceremonial wish addressed the victim or spirit as the Ruler of
    the mill and the Mill mother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage cautions that these foundation-sacrifice traces do not prove that
    Finno-Ugric household spirits were originally human beings sacrificed under buildings.
  category: other
  evidence_refs:
  - ev:8
