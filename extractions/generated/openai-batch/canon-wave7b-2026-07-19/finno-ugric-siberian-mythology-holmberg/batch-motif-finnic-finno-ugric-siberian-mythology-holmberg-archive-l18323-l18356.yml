canonical_text:
  quote: ''
  summary: The passage surveys beliefs about the Pleiades and stars among Lapp, Turkish,
    Yakut, Votiak, Lithuanian, Baltic Finnic, and Siberian peoples. It links the Pleiades
    with warm or cold weather, recounts Yakut stories of a shaman shortening winter
    by cutting the Pleiades' binding-rod and of a hero trying to stop the cold-blowing
    Urgel, and records explanations of stars as splinters, holes admitting heavenly
    light, or reflections of a heavenly ocean.
  language: English
