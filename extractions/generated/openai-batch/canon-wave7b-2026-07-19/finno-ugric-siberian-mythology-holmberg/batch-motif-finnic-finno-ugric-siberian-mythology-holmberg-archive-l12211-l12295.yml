canonical_text:
  quote: ''
  summary: The passage describes a Cheremiss sacrificial rite at a sanctuary and sacrifice
    tree. Porridge, bread loaves, bowls, honey drink, ritual implements, and a foal
    are arranged and dedicated to deities including the great Jumo. The priest casts
    molten pewter into water to determine whether the god accepts the horse, then
    performs invocations with fire, iron, an axe, and a knife before touching the
    horse with a burning brand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A smaller vessel of porridge is placed on the roots of the sacrifice tree
    beside the resin-bowl, with a small lime-bark spoon called the silver spoon inside
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: White cloths are spread on ground bestrewed with lime-branches, and sacrificial
    butter-and-milk loaves are placed on them in rows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'There must be nine sacrificial bread loaves: one large loaf and eight small
    loaves, baked by the priest early in the morning at the village.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The loaves bear three-fingertip marks called nose and body; the large loaf
    also has side lines called wings and end lines called the bird's tail, so that
    a bird is formed on it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The loaves are set with their noses toward the tree, the large loaf on the
    extreme right, with nine wooden bowls placed behind them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A honey drink prepared by young maidens is later poured into the wooden bowls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The large loaf and its bowl are dedicated to the great Jumo, while the other
    loaves and bowls are dedicated to other gods who are not exactly defined and may
    vary.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A candle is lit from the fire, a young foal is led into the sanctuary, and
    the horse is bound to a birch-wood post with a lime-bark bridle called the silver
    bridle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A plaited lime-bark footsnare is also used to bind the forefeet of the sacrificial
    animal during the sacrifice.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The first sacred act is the casting of pewter: the kart holds an axe blade
    over water and prays to the great god for blessing, protection, health, prosperity,
    riches, and acceptance of the horse.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: An assistant pours molten metal from an iron ladle onto the axe blade so that
    it falls into the water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The priest examines the metal shape; if it does not resemble the sacrifice
    it is thrown into the fire and recast, while a resemblance is taken to show that
    the god accepts the animal.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The pewter figure is called the picture or shadow of the sacrifice and is
    temporarily placed on the large sacrificial loaf.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: The kart places an axe before the sacrifice tree, holds a knife and burning
    brand, faces the tree, invokes the deity with smoke and iron, rings the axe three
    times with the knife, and touches the horse's forehead and neck three times with
    the brand.
  category: sequence
  evidence_refs:
  - ev:14
