canonical_text:
  quote: ''
  summary: 'The passage surveys Siberian shamanic objects and practices: images on
    poles possibly serving homeless souls, Buriat animal-hide helpers, animal-shaped
    serving spirits, spirit-journeys requiring costume and drum, birch-bark masks
    and squirrel-tail moustaches, sacred transport of shaman objects, Buriat consecration
    and training, and the partial survival of shaman costumes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Images of birds, looms, and similar objects are described as set up on long
    poles, probably as refuges for a homeless soul.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buriat shaman is described as keeping many little animal-hides in his
    house instead of wooden images.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The animals said to help the shaman vary by tribe and often include small
    forest animals such as fox, hare, ermine, marten, and sable.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Helping or serving spirits are described as taking the shapes of different
    animals and are distinguished from the shaman's khubilgan.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: For a spirit-journey after sunset, a shaman is generally said to need a special
    costume and a drum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The “Black Tatars” in the Minusinsk District are said sometimes to use birch-bark
    masks on their eyebrows and moustaches made of squirrel tails.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Shaman objects are described as sacred and, among more northern peoples during
    removals, are transported by a separate reindeer not used for profane purposes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among the Buriats, a person called by spirits to become a shaman is consecrated
    with special ceremonies before being considered worthy to handle shamanic instruments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The future shaman must receive training from an older shaman and participate
    as an assistant in séances and ceremonies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Among many Siberian Altaic peoples, shaman costumes still exist, though often
    incomplete or reduced to ribbons, other costume objects, or only the head-dress.
  category: object
  evidence_refs:
  - ev:10
