canonical_text:
  quote: ''
  summary: The passage describes Siberian shaman costumes and their components, especially
    bird, deer/reindeer/stag, and possible bear types. It explains how garments, fringes,
    metal ornaments, skeleton-like attachments, horns, bird signs, and boots make
    the costume represent an animal or spirit-bird across several named peoples and
    museum examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate and figure captions identify a Tungus bird-type shaman dress, Yenisei-Ostiak
    reindeer or stag head-dress, Soyot bird-type head-dress, Tungus bird-type shaman
    boot, Tatar bird-type shaman, and Yenisei-Ostiak bear-type boot.
  category: object
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: Complete shaman costumes are described as including a long tunic, breast-covering,
    cap or crown, top-boots, and gloves, generally made of softened reindeer or other
    skin and decorated with copper or iron.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The costumes may carry a sun and moon on the back, human-like and bird-like
    spirit images, and metal objects corresponding to parts of a skeleton.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When compared across districts, a complete costume is said to form a whole
    representing an animal, mostly either a bird or a horned animal such as deer or
    reindeer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bird-type costumes are distinguished by long fringes called feathers, arm
    fringes said to represent wings, metal objects interpreted as bird feathers, bird-head
    forms on some head-dresses, brass-button bird eyes, and bird feet on boots.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Deer or reindeer-type costumes are distinguished by a crown with high upright
    iron horns, absent or shorter fringes, pointed tunic tails in some groups, and
    iron pieces called hairs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes metal bones on the garments, including ribs, collar-bones,
    limb bones on gloves and boots, bird bones for bird-type costumes, and deer skeleton
    features for deer-type costumes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The exact bird represented by bird costumes is said to be difficult to determine,
    but examples or marks include vulture, owl, hawk, and eagle.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yenisei-Ostiak shaman boots are described as carrying complete bear bones,
    which the passage says may point to a bear-representing shaman costume.
  category: object
  evidence_refs:
  - ev:8
