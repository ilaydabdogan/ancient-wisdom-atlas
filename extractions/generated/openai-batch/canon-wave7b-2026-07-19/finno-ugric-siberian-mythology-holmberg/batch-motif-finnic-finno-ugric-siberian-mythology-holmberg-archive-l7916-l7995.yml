canonical_text:
  quote: ''
  summary: The passage surveys household and outbuilding spirits among Baltic Finns
    and related peoples, including Haltia, Tonttu, Riihitonttu, Bearer, Para, and
    Puuk. It describes reserved rooms and offerings for spirits, barn-spirit etiquette
    and retaliation, a spirit connected with the last sheaf and harvest divination,
    and cat-like or artificially made bearer spirits that bring grain, money, milk,
    cream, butter, or other goods to an owner.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A church Haltia was sometimes considered equal in height to the church.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Baltic Finns were strongly influenced by Scandinavians,
    and that Finnish Haltia beliefs have a counterpart in the Swedish Ra or Radare.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Finnish Tonttu is described as of Swedish origin by name, with human characteristics,
    and as a being said to guide the house.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In some districts a clean special room with a table of untouched food was
    furnished for the Tonttu; the food was renewed several times weekly and only the
    caretaker could live there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tonttu occupied outhouses including the bathhouse, stables, mill, and
    especially the threshing-barn.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Every threshing-barn was said to have a Riihitonttu who stole grain from neighbours'
    fields and carried it to its own threshing-barn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The threshing-barn Tonttu looked after the threshing-barn, but if offended
    it could carry away grain from the house or burn the whole barn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: People greeted the threshing-barn Tonttu in the morning, asked it in the evening
    to watch the fires, wished it good-night, and requested its permission before
    staying overnight in the barn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person staying overnight in the threshing-barn was not to lie down near
    the hearth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The threshing-barn Tonttu sometimes appeared in grey clothes and a grey hat,
    and porridge and milk were offered to it behind the threshing-barn fireplace.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some beliefs said the threshing-barn Tonttu was born from the last sheaf of
    grain cut in the fields, which was placed on the barn rafters for a year or longer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: On Christmas Eve the master of the house could ask the Tonttu what kind of
    harvest year to expect; a creak from the barn was taken as a sign of a good year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Votiak 'Bearer' is described as cat-like and as assisting its owner by
    carrying grain from other people's granaries.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that if the Bearer 'cat' is killed, its owner dies likewise.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Finns call the spirit Para, after Swedish Bjara or Bara; Ingria has Money-,
    Bread-, and Milk-Paras, and Finnish districts also report Paras bringing money,
    rye, manure, milk, cream, and butter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The milk-bearing Para was usually believed to have the shape of a cat, and
    the Scandinavian 'Butter-cat' is identified in the passage with the Lapp Smierragatto.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: According to Finnish belief, a person could create such a spirit by fashioning
    a body from stolen objects such as cast-off female garments, the head of a thread-ball,
    and the foot of a spindle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Para carried milk or other commodities in its mouth or intestines; if
    the milk-closet door was left open overnight, empty milk and butter dishes could
    be full in the morning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The Seed-Para left a narrow track through fields from which it had stolen
    grain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The same spirit is called Puuk by the Esthonians, with related names noted
    from Plattdeutsch and Latvian; the Ingrian Money-Para is said to fly through the
    air like a meteor.
  category: relationship
  evidence_refs:
  - ev:9
