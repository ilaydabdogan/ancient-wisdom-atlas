canonical_text:
  quote: "“With the sacrificial porridge, with the great suldes, we approach thee.”"
  summary: 'The passage describes part of a Cheremiss sacrificial rite: a kart prays
    for prosperity, uses lime-wood shavings as an omen for different forms of luck,
    prepares a ritual object called a suldes, fastens offerings to a sacrifice tree,
    and oversees communal prayers and coin offerings in a grove. Assisting priests
    pray over individual donors'' coins, and the congregation later kneels for a long
    festival prayer for household, livestock, and agricultural blessings.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The kart addresses a great or good god and asks for health, happiness, riches,
    peace, family luck, cattle luck, grain luck, bee luck, money luck, and other forms
    of progress.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kart carries or goes around the fire with a lime-branch and whittles shavings
    while posing questions about whether requested blessings will be granted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The falling position of each shaving is examined as an answer to the ritual
    question, and the later shavings are laid in the porridge-pan with bark upward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bough is taken a third time around the fire, and the kart stands to the
    left of the fire while praying to the great good god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer asks the god not to grant requests to people who disregard god,
    the Czar, or human order, and asks that people described as harmful magical actors
    be hounded from one end of the world to the other.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The kart strikes the top of the bough into the fire, splits both branches,
    threads the shavings on them in order, besmears the resulting suldes with porridge,
    and places it in the girdle next to the meat stick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the meat and shavings have been placed in the girdle, the congregation
    is called into the grove, and a great white cloth is spread before the altar.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Four assisting priests pray for each person who brings a sacrifice coin; the
    coin is kept on a sleeve-covered hand because the naked hand is believed to defile
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the individual donor prayer, the donor is named and kneels behind the priest
    while blessings and protections for family, cattle, seed, crops, and bread are
    requested.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the end of the donor prayer, the priest lets the coin fall from his sleeve
    onto the cloth, and absent persons may send money by others so that prayers are
    read for them too.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the donor prayers, the congregation kneels in parallel rows behind the
    sacrificing priest for the main festival prayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The main festival prayer asks chiefly for children in the house, cattle in
    the yard, and large stacks in the threshing-barn.
  category: speech
  evidence_refs:
  - ev:6
