  text: Tengri and related forms are presented as names for the Heaven god in several
    Altaic languages, and the word is said to have originally meant Heaven.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the word later came to be used for god in general,
