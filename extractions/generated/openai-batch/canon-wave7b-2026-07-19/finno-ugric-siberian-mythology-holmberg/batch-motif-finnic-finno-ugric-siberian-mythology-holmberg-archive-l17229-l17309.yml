canonical_text:
  quote: ''
  summary: The passage discusses Tengri and related names for the Heaven god among
    Mongol and other Altaic-language peoples, arguing that the term originally meant
    the sky or Heaven itself before becoming a more general term for deity. It describes
    the Mongol expressions Blue Tengri and Eternal Tengri, the sky’s connection with
    fertility, fate, birth, rulership, law, and providence, and compares these ideas
    with sky-deification and fate concepts in several neighboring or referenced traditions.
  language: English
  quote_policy: summarized
