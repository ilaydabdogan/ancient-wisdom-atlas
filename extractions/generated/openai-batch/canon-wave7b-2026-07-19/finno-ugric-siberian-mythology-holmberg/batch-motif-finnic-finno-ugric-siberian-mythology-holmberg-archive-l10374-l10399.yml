  quote: ''
  summary: 'A plate caption describes drawings on a Lapp drum according to Randulf:
    named sky and air figures, shamans associated with heaven and underworld, sacrificial
    animals, boundaries between heaven and earth, the sun, a Christian road with buildings
    and livestock, underworld features, female figures, a sea with fish, a Lapp village,
    and bears.'
