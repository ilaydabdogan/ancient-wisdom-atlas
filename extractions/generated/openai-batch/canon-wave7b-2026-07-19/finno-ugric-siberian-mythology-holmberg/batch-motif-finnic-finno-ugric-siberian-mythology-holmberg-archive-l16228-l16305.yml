canonical_text:
  quote: ''
  summary: The passage recounts parts of several Altaic and Siberian flood traditions.
    Nama curses devouring birds, is urged by his wife to kill beings saved from the
    flood, is warned indirectly by his son Sozun-uul, kills his wife, and later ascends
    to heaven with his son, whom he turns into a five-star constellation. The survey
    then describes beliefs in the flood hero Jaik-Khan/Jajutshi as mediator, protector,
    ruler of the dead, ritual recipient, and sender of souls; compares these ideas
    with Irtysh Ostiak Pairekse traditions; and summarizes a Soyot flood tale in which
    an earth-supporting frog or turtle moves, the cosmic ocean floods the earth, an
    old man survives on an iron-strengthened raft with his family, the raft grounds
    on a wooded mountain, and the survivor recreates the world and teaches strong
    drink. It also records beliefs that the ark or raft remains on mountain summits
    or as large nails found at the grounding place.
  language: English
  quote_policy: summarized
