canonical_text:
  quote: ''
  summary: The passage describes practices and tales concerning soul-loss, sickness,
    and recovery. A lost soul may be sought at the place and time of its departure
    with clothing and food connected to the event. A Buriat tale recounts three spirits
    who cause a rich man's son to sneeze so that his soul exits, but a man who can
    converse with spirits tricks them and returns the soul. The passage also reports
    beliefs that injury to a wandering soul or shadow is reflected as bodily sickness,
    with related ideas among Yenisei Ostiaks and Tungus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person seeking his lost soul is instructed to return to the scene of the
    loss at the corresponding time, wearing the clothes worn on that occasion and
    bringing delicacies liked by the soul.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the soul remains nearby, it may return to its owner, and the owner is said
    to feel reunion as violent shivering in the back.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The exact time of the soul's departure is treated as important because the
    soul is expected to revisit the place first daily, then at longer intervals, and
    finally once a year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A soul long absent from the body is said to face dangers from malicious and
    cunning spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that spirits may drive a soul from its home by tickling
    the nose and inducing sneezing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Buriat tale, a man able to see and speak with spirits meets three spirits
    and learns that they plan to steal the soul of a rich man's son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man pretends to assist the spirits and explains his noisy, track-leaving
    walk by claiming that he died recently and has not yet learned to move like a
    spirit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the rich man's house, two spirits station themselves at the door and chimney
    while the third irritates the son's nose and makes him sneeze.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the sneeze, the son's soul jumps out, tries to escape by the door,
    is seized by the guarding spirit, and weeps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The spirits say they greatly fear thistles and thorns; the man falsely says
    that he fears fat meat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After being allowed to carry the captured soul, the man jumps with it among
    thorny bushes and thistles, where the spirits are afraid to follow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The spirits throw pieces of fat meat among the bushes to drive the man out,
    but he eats the meat and remains unharmed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The spirits realize they have been tricked and leave; the man returns the
    soul to the rich man's house, and the son recovers.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: The passage states that sickness may be caused by the soul injuring itself
    while traveling.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: According to the passage's Yenisei Ostiak examples, if the soul or shadow
    hurts its foot the owner limps, and if it catches cold the owner shivers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage reports similar ideas among the Tungus and connects them to the
    belief that what is done to a person's image affects the person.
  category: relationship
  evidence_refs:
  - ev:8
