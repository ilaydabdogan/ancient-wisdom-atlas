canonical_text:
  quote: ''
  summary: A Cheremiss sacrificial rite is described. The kart prays, thanks the god,
    asks pardon, instructs the congregation, and oversees offerings. Bowls, drink,
    meat, soup, sacrificial objects, bones, a small sacrifice tree, animal skin, and
    a resin-bowl are offered by casting or burning them in fire or by casting liquid
    onto a sacred tree. The rite includes sunwise circuits around the fire, prayers
    to Jumo, the Fire god, Jumo’s messenger, and all Cheremiss gods and spirits, followed
    by a communal sacrificial meal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption states that in Government Vyatka a Cheremiss priest prays
    to god with accompaniment of a stringed instrument called a kiisle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kart thanks the god for attending the sacrifices with fortune and accepting
    the offerings, asks pardon for possible errors in the order of his words, and
    the congregation bows their foreheads to the ground after each prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kart speaks to the people, urging harmony and prohibiting quarrels, theft,
    lying, false witness, and excessive drinking; elder people then shake his hand
    in thanks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The kart takes Jumo’s drinking-bowl, two assistants take bowls, and they proceed
    around the fire keeping to the right before throwing the contents into the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kart pours twice from his bowl, first to Jumo and second to the Fire god,
    and asks the Fire god to carry the sacrifice to the great god with smoke and steam.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: A drink-offering and bowl-sacrifice are made to Jumo’s messenger and the Fire
    god; meat is also taken to fires at the places where a foal and sheep were slaughtered,
    with a prayer that all blood be burned up.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Eight goblet-bearers receive bowls from the kart and make repeated sunwise
    circuits around the fire, casting contents into the fire in honor of named gods
    until all Cheremiss gods and spirits have received a share.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The kart casts liquid three times onto the sacred tree while praying for justice
    and peace, then throws soup onto the tree; an assisting priest also performs the
    action once.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two assisting priests go three times sunwise around the fire while shaking
    sacrificial objects on the trough, bowls, dishes, cloths, the small sacrifice
    tree, and the animal’s skin, saying, “This is for thee.”
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near evening the sacrificial meal begins after nearly a day’s fast, with porridge
    and honey-drink tasted first, then bread, meat, and other food distributed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The remains and bones are gathered; the kart places head bones in natural
    order in the fire, the small sacrifice tree with attached objects is burned, and
    the animal skin is held over flames while the kart pours a resin-bowl into the
    fire.
  category: sequence
  evidence_refs:
  - ev:10
