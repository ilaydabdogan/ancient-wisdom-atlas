canonical_text:
  quote: ''
  summary: The passage describes a Chuvash agricultural ceremony called the “stealing
    of earth,” in which a young man acts as bridegroom to the Earth mother and productive
    soil is ritually taken from a flourishing field and distributed at home. It also
    notes comparable Earth-mother wedding traditions and discusses the Land-water
    deity/name across several traditions and possible Iranian linguistic parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agricultural Chuvashes perform ceremonies called “the stealing of earth” when
    a field has lost productive power, intending to obtain productive earth from another
    person’s flourishing field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A living suitor is chosen for the Earth mother, dressed as for courtship,
    and required to be young and strongly built because the marriage is described
    as exhausting for the bridegroom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wedding procession begins with bells, songs, and music, but becomes quiet
    when it reaches the field at night; the bridegroom is lifted from the first wagon
    to the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The oldest man in the procession speaks as the bridegroom’s agent, addressing
    the earth as a rich and dear bride and asking her to love the bridegroom and comply
    with the request.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bridegroom bows to the ground during the address, and shovelfuls of earth
    are then lifted into all the wagons.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: At the home village the bridegroom welcomes the bride with a spade in hand,
    asks her to spread her property over fields, pastures, forests, and rivers, and
    earth from the wagons is carried to field patches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that similar weddings for amusing and enticing the Earth
    mother occur among certain other agricultural peoples, and that the Earth mother’s
    bridegroom is also mentioned in old Finnish poems.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jar-Sub, glossed as “Land-water,” is described as an Earth deity mentioned
    in the Orkhon inscriptions, and Teleuts are quoted as saying they have worshipped
    Land-water and Sky from oldest times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Land-water spirit is said to appear in a Chuvash list of deities beside
    Earth mother and Earth father, and a “Man of Land-water” is said to be known among
    the Voguls.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The phrase “land and water” as a name for fatherland is presented as possibly
    Iranian, with a Persian expression and Xerxes’ demand for “land and water” cited
    as parallels.
  category: other
  evidence_refs:
  - ev:9
