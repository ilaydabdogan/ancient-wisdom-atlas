canonical_text:
  quote: ''
  summary: 'The passage first describes Lapp sacrifices to the earth and to the “World’s
    man,” including a birch-wood image, blood, a genital organ, reindeer, red thread,
    and agricultural implements, with stated aims of protecting and increasing reindeer.
    It then introduces Lapp birth deities: Madderakka and her daughters Sarakka, Juksakka,
    and Uksakka; notes Madderakka’s functions in childbirth and fertility; mentions
    a male counterpart Madderatshe; and locates Madderakka and her daughters in the
    earth beneath the Lapp tent, where sacrifices were placed in the ground.'
  language: English
  quote_policy: summarized
