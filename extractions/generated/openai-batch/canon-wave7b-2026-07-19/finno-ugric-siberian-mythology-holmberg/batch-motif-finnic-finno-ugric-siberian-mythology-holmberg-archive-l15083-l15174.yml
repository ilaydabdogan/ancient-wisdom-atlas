canonical_text:
  quote: ''
  summary: The passage surveys world-pillar beliefs in Finno-Ugric and Siberian contexts.
    It describes the pillar as a support of the sky, a post around which stars revolve,
    and a horse-post for celestial or divine animals. It gives Yakut, Buriat, Siberian
    Tatar, Ostiak, Vogul, and Ugrian examples, including heavenly smiths, sky tents,
    iron and stone posts, holy trees, sevenfold pillars, sacrifices, and sevenfold
    offerings or bows.
  language: English
  quote_policy: summarized
