canonical_text:
  quote: ''
  summary: 'The passage describes Votiak lud sacrificial practice: organs and fragments
    of the sacrificial animal are prepared, portions are offered on a table and in
    the fire, and earlier or comparative customs place such pieces in a holy tree.
    It describes sanctuary buildings, the lud-kuala, guardianship, images and valuables,
    a Siryan image-house destroyed by St. Stephen, communal eating of the sacrifice,
    hanging hides and bones or skeletons in the holy tree, careful preservation of
    bones, wax candles, and post-meal prayer by the lud-guardian.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief organs of the sacrificial animal are cooked separately, and small
    fragments are cut from each quarter of the carcass and from organs such as the
    tongue, lungs, heart, and liver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One fragment is placed in a dish on the table, while another fragment is thrown
    into the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that in an earlier period the pieces now placed on the altar-table
    were hung in the tree, sometimes threaded on a twig with lime-bark attached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage compares this practice with other peoples, including the Lapps,
    who cut slices from important organs and fastened them to a holy tree on a pole.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In sanctuaries with a building, offerings are placed on a corner shelf, and
    the lud-kuala is described as so sacred that only the lud-guardian may enter it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Siryan image-house is described as containing images, sacrificing tables,
    and many valuables, and as being watched by a special guardian.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: St. Stephen gathers animal skins associated with the gods, burns them, strikes
    the images with an axe, cuts them up, and burns the pieces together with the skins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the lud-spirit receives its share of the sacrifice, the food is divided
    among the participating families and must be consumed in the sanctuary at the
    same time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hide and larger bones are hung in the holy tree, and among the Eastern
    Votiaks whole animal skeletons are said to be hung on the tree with bark ropes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Votiaks are described as carefully carving the flesh without fracturing
    bones and joining the bones together in their natural order.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Wax candles are used in Votiak lud worship and are sometimes prepared in the
    grove from wax kneaded around strands of flax.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the meal, the congregation stands in long rows while the lud-guardian
    prays in a low voice, with older custom prescribing that prayer and slaughter
    face west or north.
  category: action
  evidence_refs:
  - ev:6
