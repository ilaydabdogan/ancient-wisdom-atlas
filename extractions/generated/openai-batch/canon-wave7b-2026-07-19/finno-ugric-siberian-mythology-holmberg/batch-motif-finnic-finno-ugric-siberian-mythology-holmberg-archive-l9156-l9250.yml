canonical_text:
  quote: ''
  summary: The passage describes a plate caption of a Votiak sacrifice to the River
    Buj after the breakup of ice, then surveys Esthonian and Livonian beliefs about
    water spirits. The Esthonian Nakk is described as a dangerous male water spirit,
    often human-like but also appearing as various animals, fish, or objects, with
    music that can bewitch hearers and lead them into the sea. The female water spirit,
    called Nakineitsi or related names, appears as a young water-maid combing long
    hair with a golden comb, sometimes with a fish tail, and is associated with music
    and sea cattle. Livonian blue sea-cows are mentioned as a related report.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies a Votiak sacrifice to the River Buj after the
    breaking-up of the ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Esthonian water spirit is said to live in popular imagination mostly as
    a human being and may be male, female, full grown, or a child.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The male spirit is described as a grey old man who swims with an enormous
    open maw, swallows those in his path, and watches from water, shore, or a well-cover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In human shape the Nakk performs human work and may be recognized at night
    at fish-spearing places by having his torch on a stone slab rather than in a boat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Nakk's song is said to bewitch hearers and make them prisoners; in the
    Hapsal area, his singing or playing makes men and animals dance faster until they
    fall into the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Although appearing in human shape, the Nakk is said in folk tales to have
    fish teeth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The female water spirit is called Nakineiu, Nakineitsi, Veeneiu, or Mereneiu
    and is usually a pretty young girl combing long hair with a golden comb near or
    on the water.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The female water spirit's hair may be golden yellow or grass-green; she may
    appear naked or dressed, and in some districts has a human body with a fish tail.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Nakineitsi is associated with song and music and with beautiful fat cattle
    that emerge from the sea, are tended ashore, and then disappear again with her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Livonians tell of blue sea-cows, some of which stray from the other cattle,
    remain on shore, and come into human hands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Nakk may appear as a young grey horse or white foal that comes from the
    water, approaches children, entices them to mount, and then gallops back into
    the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Nakk may also appear as an ox, calf, hare, waterbird, swan, goose, duck,
    fish, or lifeless object.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
- id: obs:13
  text: In fish shape, the Nakk may wind its tail around a fisherman and drag him
    into the water; a tale also describes gold-glittering fish vanishing during a
    tempest and snowstorm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In whatever shape the Nakk appears, the passage states that he is dangerous
    and that his appearance predicts drowning or other disaster.
  category: attribute
  evidence_refs:
  - ev:9
