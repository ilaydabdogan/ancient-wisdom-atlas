canonical_text:
  quote: ''
  summary: 'The passage describes northern Eurasian sky and air beliefs: a Finnish
    Lapp sacrificial grotto of the Thunder-God; Yurak reindeer sacrifice to Num on
    high mountains; North Star traditions in which the star is a sky-nail or world-pillar
    supporting the heavens; a Lapp end-time sequence in which Arcturus shoots down
    the North Star and the sky falls with destructive fire; Lapp rituals to Veralden
    rade using a blood-smeared tree or pillar of the world; comparisons with Scandinavian,
    Finnic, Estonian, Ostiak, and Turco-Tatar traditions; and Ostiak personifications
    of the Sun and Moon with rare offerings.'
  language: English
  quote_policy: summarized
