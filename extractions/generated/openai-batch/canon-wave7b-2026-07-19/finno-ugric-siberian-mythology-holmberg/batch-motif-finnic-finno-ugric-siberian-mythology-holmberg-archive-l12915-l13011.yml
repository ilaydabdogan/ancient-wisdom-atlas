canonical_text:
  quote: ''
  summary: The passage describes the qualifications, calling, training, spirit relations,
    ritual abilities, limits of office, and spirit contests associated with the Lapp
    shaman in Holmberg’s survey. It emphasizes hereditary or illness-linked shamanic
    gifts, trance aids, invulnerability claims, coercive spirit calling, underworld
    instruction, dead and tutelary helper spirits, bodily-wholeness requirements,
    and rivalry through animal-guise spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The office of shaman is described as bringing honour and riches but requiring
    particular psychic qualities and not being open to everyone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shamanic gifts are said often to run in the same family and to appear either
    in childhood or after a severe illness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the shaman sometimes uses artificial stimulants to assist
    the coming of trance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lapp shaman-drink is described as made from soda boiled from birch-wood
    ash, seal-fat, or other materials.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Drinking such liquids was believed to harden the shaman’s body so that even
    a sharp knife could not penetrate it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A great shaman is said not to be destroyable by fire or water and to be able
    to sit naked on a glowing fireplace and scatter fire and burning cinders over
    his body without danger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: People with shamanistic talent were believed able to converse with spirits
    living under the ground, which could also appear materially to them at the first
    call to shamanic office.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Lapp spirits called noidde-gadse offer help to a young shaman and stress
    that they had served his father and forefathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: If the called person resists the spirits’ services, the spirits are said to
    use threats and force, with stories reporting decay and even death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: If the Lapp accepts the call, the spirits are described as devoted helpers
    and teachers of the arts of shamanism.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The shamanic schooling is said to occur either on the ground in a lonely place
    or by leading the pupil to the underworld to absorb the wisdom of former shamans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: At the first call of the spirits, the Lapp is said to behave like one mentally
    afflicted, leave wife, children, and servants, and wander in forests or on mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A shaman is said generally to become unfit for office in his fiftieth year,
    and bodily disfigurement, including loss of a tooth, can disqualify him as sacrificer.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: After a shaman begins practicing, spirits live more freely in his company
    and can be called from the holy mountains to his service.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The spirits of the dead are described as guides in strange districts, protectors
    on hunting or fishing trips, givers of rich hauls, and guardians of property and
    reindeer herds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A special tutelary spirit or mobile soul is said to procure news, report on
    distant market conditions, bring news of family and herds, and foretell coming
    events.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When two shamans quarrel, they may sit opposite one another and perform their
    arts to show which owns the stronger spirit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: In such a contest, the shamans’ spirits are believed to fight one another
    in the guise of reindeer-bulls.
  category: action
  evidence_refs:
  - ev:9
