canonical_text:
  quote: ''
  summary: The passage surveys death and burial customs among named Finno-Ugric and
    Siberian groups. It describes measures used when removing a corpse, protecting
    a house, transporting the dead, avoiding sight or backward glances, marking or
    directing the way of the dead, and cleansing mourners on return from burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Votiaks are described as removing the door used for carrying out the corpse
    from its hinges and passing the corpse through an opening on the hinge side to
    deceive the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Volga Finns are described as placing the coffin on the end of a log and
    spinning it three times in a direction contrary to the sun; funeral-procession
    footmarks are also said often to be swept away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage calls strewing ashes a general protective or cleansing measure
    and says the Lapps and Baltic Finns threw ashes and fire after those following
    the hearse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Objects including steel articles, axes, knives, heated stones, glowing cinders,
    ashes, salt, and flour are described as being placed where death occurred; Baltic
    Finns are also said to hammer a nail where death occurred, where the corpse was
    washed, or into the threshold crossed by the coffin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Russian Lapps are described as leaving homes open and empty after a family
    death, earlier nomad families as moving away, and a stone or other mark as being
    left at the place of death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rooms may be smoked or beaten with branches; the Voguls make noise while smoking
    homes to drive away death, and among the Ostiaks the fire must remain lit for
    five nights after a male death and four after a female death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states a belief that dead relatives of the dead man come to take
    him away; Lapps say they have seen them in twilight, while the passage also says
    such spirits are generally invisible to humans but visible to animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: During transport for burial, the Lapps place the corpse in the last sled,
    and at Tremyugan the Ostiak escort goes before the coffin rather than behind it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The escort may not look behind, other villagers may not look at the funeral
    procession through windows, and the Cheremiss cover windows so as not to follow
    the dead one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On returning from burial, footprints are swept over at the burial mound; Yuraks
    go three times around the grave in widening circles and erect a gateway toward
    the night or north with words directing the dead to go his own way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Returning from burial, one may not look back; a two-stick gateway is erected
    before the tent door, through which the relatives of the dead pass with their
    belongings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Votiaks strike one another with fir branches at the cemetery gate and
    address the dead; a juniper branch may also be waved with words telling the dead
    not to come with the living and to go home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In some places, a channel is cut across the way or around the funeral escort
    by dragging an axe or other sharp instrument; after reaching the house, people
    may jump over fire, rub hands with ashes, or take a bath.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In Finland the coffin was sometimes carried to the cemetery between two straw
    fires so that the soul would not return home to disturb the living.
  category: action
  evidence_refs:
  - ev:8
