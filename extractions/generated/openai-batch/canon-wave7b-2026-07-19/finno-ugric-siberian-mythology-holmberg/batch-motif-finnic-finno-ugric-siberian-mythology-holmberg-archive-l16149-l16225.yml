canonical_text:
  quote: ''
  summary: The passage compares northern Vogul/Ostiak and East European apocryphal
    flood legends in which a devil uses Noah’s or a flood hero’s wife, strong drink,
    and a spoken name or curse to learn a secret or enter the ark. It then summarizes
    an Islamic Iblis ark-entry tale and begins an Altaic flood tale in which Ulgen
    commands the good man Nama to build an ark on a mountain, take in family and animals,
    survive rising waters, and release birds after the ark comes to rest on mountains.
  language: English
  quote_policy: summarized
