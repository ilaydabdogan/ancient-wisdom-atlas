canonical_text:
  quote: the pieces escaped and flew into the sky, where they now twinkle as six little
    stars
  summary: 'The passage gives several Pleiades tales: Metshin or Urker is a destructive
    insect-like being crushed by hoofed animals, its fragments escape through a cow''s
    cleft hoof into the sky, and the stars become or explain the Pleiades. Variants
    connect the Pleiades with heat and cold, winter omens, the Great Bear as a Khan
    who carries off one star, and the common idea that the Pleiades once had seven
    stars but now have six.'
  language: English
  quote_policy: quoted
