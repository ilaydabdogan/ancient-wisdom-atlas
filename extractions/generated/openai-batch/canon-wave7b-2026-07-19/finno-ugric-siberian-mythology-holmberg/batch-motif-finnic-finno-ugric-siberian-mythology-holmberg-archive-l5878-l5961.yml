canonical_text:
  quote: ''
  summary: The passage describes Votiak beliefs and practices concerning kuala family
    spirits and family sanctuaries. It notes human-like appearances of kuala spirits,
    rare nonhuman manifestation by the Vorsud, a story of a bird emerging from a demolished
    sanctuary, nested relations among little, great, mother, and uttermost kualas,
    sacrificial obligations among family and village groups, remembrance of ancestral
    sanctuaries after migration, mudor, and illness-related sacrifices at old crumbling
    huts under a sorcerer's direction.
  language: English
  quote_policy: summarized
