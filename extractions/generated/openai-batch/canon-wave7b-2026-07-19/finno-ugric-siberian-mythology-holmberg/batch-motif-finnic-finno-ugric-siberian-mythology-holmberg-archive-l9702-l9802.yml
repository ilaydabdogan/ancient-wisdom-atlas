canonical_text:
  quote: ''
  summary: The passage describes sacrifices and prayers to the Cherlak girl and the
    Water mother, the restoration and cleansing of water after offerings, descriptions
    of Water mother as animated and anthropomorphic water, and wider Finno-Ugric and
    Baltic Finnic water-cult practices involving offerings, rain, fishing, illness,
    and named water-mother figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People first considered offering a black bull to the Cherlak girl, but the
    lake was not pleased because the bull did not shudder when water was poured over
    it; a black heifer was then offered and accepted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants wore clean clothes, sprinkled one another with water left in
    a hole, and prayed that the Cherlak girl would return to her old place.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The heifer’s bones and pieces of flesh were wrapped in its hide and hidden
    in the water hole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A prayer addresses Watermother, asks for protection and health of the water
    and the Cherlak girl, asks for fish and sea-birds to return, and names Azelekel
    and Kandralekel as agents who should return the Cherlak girl’s former riches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the sacrifice the water began to return, at first muddy and foul; after
    a black lamb was sacrificed for the water’s health, the water became clean and
    fish and sea-birds appeared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says elder sisters sometimes come from Belebey to visit the Cherlak
    girl when flooding occurs, and reports an old Cheremiss statement that a strange
    lake had twice visited another lake.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Cheremiss and Mordvins generally call animated water Water mother; the
    passage also lists Esthonian, Livonian, and Karelian water- or sea-mother names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mordvin magic prayers give Water mother anthropomorphic traits, including
    silky hair and a plait decorated with silver wire; her children and family are
    sometimes mentioned.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Mordvin prayer says Water mother comes from the sea, spreads over the country,
    wanders and floats over her own ways, receives many genuflexions, and flows glowing
    like gold and shining like silver.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Christian Mordvin prayer asks Water mother to give health to people who
    eat, drink, or bathe in the water, and to cattle who drink it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Smaller offerings are made to water when fishing or in sickness, especially
    skin diseases believed to come from offended water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Agricultural water-cult sacrifices to Water mother seek fruitful rains and
    use black sacrificial animals; participants sprinkle water, throw food and hide-wrapped
    animal parts into water, and rinse ritual objects in the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a sacrifice brings too much rain, offerings thrown into water are taken
    up and buried in earth to make the rain cease.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says a similar water cult was known among the Votiaks, Mordvins,
    and Baltic Finns, and reports that Esthonians worshipped the brook Wohhanda, believed
    to produce fertilising rain.
  category: relationship
  evidence_refs:
  - ev:8
