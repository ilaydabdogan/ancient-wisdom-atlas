canonical_text:
  quote: ''
  summary: The passage describes a pasture-protecting spirit and its cattle-protection
    sacrifice; Baltic Finnic Earth Mother and field figures; possible Earth Mother
    wedding language; Sampsa/Pellervo as a vegetation deity retrieved by Summer after
    Winter fails; Karelian crop deities named by Agricola; and rituals involving double
    turnips or double ears of grain associated with Agroi and Votiak practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies a Cheremiss sacrifice to the Field-Gods in the
    Ufa Government, after a photograph by U. Holmberg.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed spirit is described as child-sized, able to become longer or shorter
    according to the length of the grass, and therefore difficult to see.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same spirit is said to wear a white garment, live chiefly in pastures,
    and look after and protect animals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The only sacrifice to the pasture spirit occurs when cattle are first let
    out to pasture, with a request that the spirit protect them from beasts of prey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Baltic Finns are said to have worshipped the Earth Mother, and Finnish
    magic songs mention figures called the Field old woman and Meadow old woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A belief is reported that if a field produces too little, milk of a black
    sheep must be sacrificed to the Earth Mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Earth bridegroom in poems is presented as possibly preserving a memory
    of an ancient ceremony in which the Earth Mother was honored with a wedding.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At an Ingrian festival of the Thunder god, a song was sung about Sampsa or
    Pellervo, a vegetation deity in whose absence nothing could grow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Ingrian song, the Winter son first goes after Sampsa with a wind-horse,
    causes disaster, and is killed; the Summer son finally succeeds in bringing Sampsa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Finland, Sampsa is represented as being conveyed from an island, sleeping
    on a corn-ship, with his mother as his wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that the Sampsa ideas seem to derive from the Scandinavian
    cult of Frey, and explains Sampsa as a Teutonic loan-word naming an early spring
    fodder-grass.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'Agricola is cited for Karelian worship of deities linked to different grains
    and crops: Rongoteus, Pellon Pekko, Virankannos, Egres, and Kondos.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Rye god’s name is connected with old songs, interpreted as a Teutonic
    loan-word, and later associated with St. Stephen.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Agras or Agroi is identified in current folk usage with two turnips growing
    together, which must be carried separately to the turnip-cellar with repeated
    kneeling or falling and an exclamation about its heaviness.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Prayers recited at the turnip-cellar ask for a good turnip year.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Agroi is described as originally not only a turnip deity but a god of twins
    in general.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: A Votiak ceremony for a double ear of grain involves hanging the ear over
    a white-linen-wound stick, carrying it by two men to an empty granary chest while
    acting as if it were heavy, avoiding bystanders, and expecting gradual wealth.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Pekko, the barley god, is said to have been worshipped by orthodox Esthonians
