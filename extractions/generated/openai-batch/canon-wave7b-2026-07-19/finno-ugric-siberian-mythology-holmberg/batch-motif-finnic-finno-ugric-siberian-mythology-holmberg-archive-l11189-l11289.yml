candidate_motifs:
- id: motif:1
  label: pasture guardian receiving first-turnout cattle sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The spirit protects animals in pastures and receives a sacrifice when cattle
    first go out to pasture.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The spirit’s name is not present in this passage.
- id: motif:2
  label: Earth Mother receives black sheep milk for field fertility
  taxonomy_refs:
  - mother_goddess
  - sacrifice
  basis: The Earth Mother appears in Baltic Finnic folklore, and black sheep milk
    is sacrificed when a field produces too little.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports a belief rather than narrating a performed rite.
- id: motif:3
  label: Earth Mother honored through wedding with Earth bridegroom
  taxonomy_refs:
  - sacred_marriage
  basis: The author says the Earth bridegroom may be a relic of an ancient ceremony
    in which the Earth Mother was honored with a wedding.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage explicitly phrases this as a possibility, not a demonstrated
    ceremony.
- id: motif:4
  label: absent vegetation deity whose return permits growth
  taxonomy_refs:
  - departure
  - return
  - seasonal_cycle
  basis: Sampsa/Pellervo is absent and nothing grows until the successful return or
    bringing by the Summer son.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage summarizes a song and does not give the full narrative.
- id: motif:5
  label: seasonal opposition of Winter son and Summer son
  taxonomy_refs:
  - duality
  - seasonal_cycle
  basis: Winter son’s attempt brings disaster and death, while Summer son succeeds
    in bringing the vegetation deity.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not state that the two sons are siblings or give a complete
    mythic genealogy.
- id: motif:6
  label: vegetation god conveyed from island on corn-ship with mother-wife
  taxonomy_refs:
  - divine_parent_child
  - sacred_marriage
  basis: The Finnish version has Sampsa conveyed from an island, asleep on a corn-ship,
    with his mother as his wife.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The relationship is reported briefly and without explanation of ritual
    or doctrinal meaning.
- id: motif:7
  label: specialized crop deities for individual grains and field labor
  taxonomy_refs: []
  basis: Agricola’s list assigns different deities to rye, barley, oats, other crops,
    and land reclamation or tilling.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This motif is a classificatory cult pattern rather than a narrative episode.
- id: motif:8
  label: double crop as twin sign carried with exaggerated heaviness
  taxonomy_refs:
  - sacred_twins
  basis: A double turnip associated with Agroi and a Votiak double ear of grain are
    each carried ritually as if unusually heavy; Agroi is described as a god of twins.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not define whether the ritual object is itself a deity,
    offering, omen, or embodiment.
- id: motif:9
  label: ritual handling of double crop for agricultural increase or wealth
  taxonomy_refs:
  - sacred_exchange
  basis: The double turnip rite includes prayers for a good turnip year, and the Votiak
    double-ear rite is said to bring gradual wealth if performed correctly.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: No explicit offering-exchange formula is stated for the Votiak example.
