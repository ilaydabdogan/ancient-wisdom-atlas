  summary: The passage discusses world-pillar, marked post, and world-tree imagery
    in Finno-Ugric and Siberian materials. It mentions a world-bearing tortoise represented
    by a stone foundation, seven animals or reindeer tied to a pillar or iron tree,
    Ostiak sacrificial posts marked with seven cuts or branches, a Vogul heavenly
    silver pillar, Altai Tatar shamanic ascent by a notched birch through nine heavens,
    and an Abakan Tatar seven-branched birch on an iron mountain at the center of
    the earth.
