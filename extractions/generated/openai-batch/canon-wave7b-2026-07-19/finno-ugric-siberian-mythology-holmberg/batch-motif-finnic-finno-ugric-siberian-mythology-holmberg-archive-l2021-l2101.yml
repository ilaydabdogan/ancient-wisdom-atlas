canonical_text:
  quote: ''
  summary: 'The passage describes Ugrian and Samoyed memorial practices: food and
    liquids are placed or poured for the dead; grave-side meals are held on stated
    days; Northern Ugrians make and care for wooden memorial dolls of deceased persons
    before burying, burning, or placing them in grave-houses; and some Samoyed/Yurak
    groups make a shamanic image representing the shaman''s shadow or soul in reindeer-bull
    form.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cooked food and meat are placed in vessels either near the house door or at
    the cemetery near the grave or grave-house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tea, gravy, gin, and cold water are poured on the ground, and the practice
    is called water-pouring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Northern Voguls are described as holding memorial feasts on the third day
    after death, at the end of a holy week, and later three times a year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a Northern Vogul grave-side observance, a fire is made, food is cooked,
    a small portion is put in a vessel by the grave, and words are addressed to the
    dead asking not to be remembered with evil thoughts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Southern Ugrian memorial days are listed as the ninth, sixteenth, thirty-sixth
    day, and a half-year or whole year after death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A widow may carve a wooden human-like doll to represent her dead husband,
    dress it in his clothes and ornaments, set it in his former place, and cook dishes
    for it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The widow may place the image beside her at a meal, embrace and kiss it as
    if living, and believe the deceased sees this and that his soul sometimes enters
    the image.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The widow keeps the doll for a year or longer and then buries it clothed in
    the earth while weeping and wailing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Memorial images were also said to be made for important persons, kept in the
    deceased person's tent, honored, fed at every meal, dressed in the morning, and
    undressed in the evening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: One account says the image was worshipped for three years and then buried,
    with the belief that the body had disintegrated during those three years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other accounts mention keeping the image for five years for a man and four
    for a woman; later it may be burned, buried in the grave, or placed in a grave-house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Finsch observed small grave buildings with doors containing dolls dressed
    in Ugrian garments.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Among some Samoyed/Yurak groups, a wooden image of a shaman's shadow resembles
    a reindeer-bull and is kept by the wife or son in a case made from a young calf's
    whole-flayed skin.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage explains the shaman image by saying Samoyeds hold that the shaman's
    soul, when leaving the body, takes the form of a reindeer-bull.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Karjalainen is reported as suggesting that Northern Ugrian image-making for
    the dead developed from a usage retained among Southern Ostiaks and Voguls.
  category: relationship
  evidence_refs:
  - ev:8
