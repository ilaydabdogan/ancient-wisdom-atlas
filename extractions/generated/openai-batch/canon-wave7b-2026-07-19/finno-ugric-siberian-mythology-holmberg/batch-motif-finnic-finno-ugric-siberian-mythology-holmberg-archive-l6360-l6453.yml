canonical_text:
  quote: ''
  summary: The passage describes Cheremiss, Estonian, and related Finno-Ugric family-god
    or household-spirit practices centered on a kudo or sacrifice case, including
    offerings, illness attributed to neglected or offended spirits, ritual specialists,
    wooden or doll-like images, and distinctions between smaller family and larger
    family or village cults.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies a little kudo or dwelling of the kudo-s^n'it inside
    a Cheremiss hut or great kudo, and also identifies a Cheremiss kudo.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Hill Cheremiss, the kudo-odyz is said to continue living at the place
    of the former kudo, and quarrelling or soiling that place is said to cause illness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After marriage, a Cheremiss woman may continue going to the kudo of her former
    home to sacrifice when illness or misfortune is attributed by a sorcerer to spirits
    of the old place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Scattered younger families are described as turning to the spirits of older
    kudo, so that the little family remains dependent on the great family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A reported material image of the family god is a coarse wooden doll dressed
    in male attire and kept in a case in a corner of the house.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Cheremiss wedding-house account, the family god is placed on the table,
    and the village sacrificing priest prays in front of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For Estonian Tonni or Antony's day, beer is brewed or an animal is slaughtered;
    at nightfall the Tonni vakk is taken from its recess, candles are lit on its rims,
    and it is carried around the dwelling house, cattle sheds, and yard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pieces of meat from the sacrificial animal are offered to Tonni, gravy is
    sprinkled on nearby paths, and the people then eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tonni's case is said to be made by a sorcerer and kept in a place known only
    to the master, generally in the attic of the storehouse.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Offerings are placed in the Tonni case throughout the year on occasions such
    as threshing corn, brewing beer, milking a newly calved cow, shearing sheep, spinning
    yarn, weaving cloth, and slaughtering animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Illness among humans or animals is described as resulting from damage to the
    case, noise made while passing it, or forgetting to sacrifice to it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A report says the case could contain a doll-like image, and a tradition says
    every family and every village had a common sacrifice case.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says there are no reliable statements about corresponding Finnish
    family worship, but notes Karelian indications of smaller and larger families,
    descent of chieftainship in the eldest branch, and married women keeping their
    family name.
  category: other
  evidence_refs:
  - ev:7
