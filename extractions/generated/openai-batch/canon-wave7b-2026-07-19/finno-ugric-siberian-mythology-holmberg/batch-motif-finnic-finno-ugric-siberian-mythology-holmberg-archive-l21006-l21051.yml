canonical_text:
  quote: ''
  summary: The passage surveys burial and after-death beliefs among Siberian and Altaic
    peoples. It describes tree and raised wooden burials, special non-earth burial
    for shamans, a Yenisei Ostiak tale in which the Heaven god Es sends a dog with
    resurrection instructions that the dog corrupts, later body-disposal practices,
    and beliefs in rebirth, animal soul-dwelling, and a Buriat three-soul doctrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a custom of placing bodies of children, and sometimes
    adults, in hollow trees or on branches of a growing tree; it also states that
    present burial structures are mostly made of wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Tungus, Yakuts, and others, a shaman's body is said not to be buried
    in the earth and is generally placed in a wooden box borne on two or four posts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Tungus informant states that if a shaman is buried in the earth, the shaman's
    soul-bird will never return to a new shaman of the same family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Yenisei Ostiak tale, the first man's relatives think he is asleep,
    cannot awaken him, become afraid, and cry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Heaven god Es sends down a dog to say that the body should be bound with
    grass and hung in a tree so that it would come to life within seven days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dog deceives the people into burying the body in the ground, and the tale
    states that afterwards humans began to die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage notes cremation among the Chukchee, Koriaks, and Buriats, and
    a later Mongol practice of throwing a body into fields as food for dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that, alongside the idea that the soul wanders after death
    in the other world, there is a belief that souls of the dead may be born again
    on earth in a child of the same family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Yenisei Ostiaks are said to believe that the soul can dwell or live again
    in an animal, especially a bear, and also vice versa; the passage distinguishes
    this from temporary metamorphoses of dead souls.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'A Buriat view is described in which human beings have three souls: one captured
    by the Prince of Death, one remaining as a ghost in this world, and one born again
    as a living person.'
  category: relationship
  evidence_refs:
  - ev:7
