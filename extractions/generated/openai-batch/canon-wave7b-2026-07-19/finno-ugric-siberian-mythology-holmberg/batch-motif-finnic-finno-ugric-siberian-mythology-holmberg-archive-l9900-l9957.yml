canonical_text:
  quote: ''
  summary: 'The passage describes Finno-Ugric water-spirit beliefs and rituals: a
    river sacrifice seeking prosperity and averting weather or flood harm; Cheremiss
    beliefs that water has a soul or master whose departure spoils or dries the water;
    spring taboos enforced by Pamas-oza; and Finnish practices of renewing wells or
    lakes by adding new water and thereby securing a new Haltia.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People kneel facing the water while an officiating priest reads a long prayer
    asking the river for prosperity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bones, hide, small carcass pieces, the animal's new halter, and drained blood
    are put into the water as part of the sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sacrificed animal alternates yearly between a brown foal and a black bull.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people believe that failure to sacrifice to the river can result in flooded
    cornfields, damaged banks, fogs, storms, and hail-storms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A neglected sacrifice in one village is said to have been followed by hail
    ruining the cornfields.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Cheremiss believe that water has a soul, called ort, which can depart
    to other places.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the water's soul disappears, the water becomes muddy and foul, and drinking
    it causes illness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the Water master leaves, the water dries up; one spirit can rule two different
    waters, causing each to fill or dry as it moves between them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pamas-oza, the Spring's master, is angered by unclean vessels, shouting, quarrelling,
    indecent speech, or spilling water over one's clothes at the spring.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pamas-oza punishes offenders with boils or other skin disease; they then cook
    porridge at the spring edge and ask pardon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among Finns, fresh water is brought from another well to a spoiled or dry
    well in the belief that a new Haltia is thereby secured.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage concludes that water itself, furnished with a soul, is included
    among Finno-Ugric water gods.
  category: attribute
  evidence_refs:
  - ev:6
