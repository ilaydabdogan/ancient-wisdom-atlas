canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and related beliefs about souls: a post-mortem
    shadow remains connected to the corpse and burial place; a breath-soul leaves
    through the mouth or nostrils at death; detachable souls may appear as vapor or
    as animals during sleep or illness, including mouse, bat, and butterfly forms.
    Several traditions describe observed animal movements corresponding to dreams
    or to ritual recovery of a lost soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Death is described as not severing the union between the soul and the corpse,
    and the post-mortem shadow is said to dwell where the body is buried.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finnish Lapp informants explain unbroken sacrificial bones by saying that
    offered victims wander as shadows from burial-place to burial-place with the folk
    of the underworld on certain nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second soul called breath can release itself from the body; at death it
    leaves through the mouth or nostrils, and in Siryan belief it evaporates in the
    air like vapor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the liberated soul can appear in quasi-human shape
    or in another guise, often that of an animal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a Siryan tradition, a sleeping woman’s lol comes forth as a little mouse,
    dances on her breast, transforms into vapor, re-enters the body, and the sleeper
    wakes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Votiak belief and tradition, the soul during sleep can appear as a bat
    or soul-bird; a bat’s observed flight around certain places is matched by the
    sleeper’s reported dream of wandering to those places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Circle of Birsk, when a man’s urt leaves because of severe fright,
    a witch searches with a white cloth, catches a little grey butterfly, binds the
    cloth and butterfly around the sufferer’s neck, and later uses molten tin dropped
    into water to determine whether the butterfly is the sick man’s urt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a Circle of Mamadysh tradition, a sleeping man’s lul issues from his mouth
    as a butterfly, flies to a pail of water, a linden cavity, back to the water-vessel,
    and then to the sleeper’s mouth; the man reports a dream of floating over a river
    to a tree hollow containing gold.
  category: sequence
  evidence_refs:
  - ev:6
