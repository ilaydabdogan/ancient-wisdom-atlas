canonical_text:
  quote: ''
  summary: The passage surveys birth and fertility deities among Lapp, Yurak Samoyed,
    Finnish, Esthonian, Cheremiss, Votiak, and Mordvin traditions. It describes earth-dwelling
    and heavenly birth helpers, triadic Finnish Luonnotars, milk imagery in origin
    and healing songs, animal sacrifices at childbirth, and named female deities associated
    with childbirth, marriage, fertility, and the carrying of the soul to a child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Madderakka is described as a mother figure more widely known among the Finnish
    Lapps.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Swedish Jordegumma is said to mean “Old woman of the earth”; the passage
    says the term now means midwife and may earlier have named an earth-dwelling childbirth
    deity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Gellivara, the word sarak is reported as also meaning “midwife.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Yurak Samoyeds are said to worship a deity living in the earth and assisting
    births, and to bury a dog alive to secure her help at birth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ancient Finnish birth deities are called Luonnotar or Synnytar and are described
    as three in number.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A magic song is summarized as saying that a man was created by three Luonnotars.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Songs on the origin of iron describe three deities letting black, white, and
    blood-red milk run into the earth, producing smithy-iron, steel, and refuse iron.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Virgin Mary is said to be called Luonnotar and Luojatar in magic songs, to
    be appealed to in childbirth, and to have sweet milk that cures sickness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mary is at times imagined with many breasts and is said in magic songs to
    spin a blue thread with a blue spindle; the passage says older and Catholic-period
    elements are difficult to distinguish.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Esthonian Rougutaja is known in the passage only as a being believed to
    help at births, while her origin and name are uncertain.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Cheremiss and Votiaks are said to sacrifice a white sheep at the birth
    of a child to a deity of birth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An eighteenth-century account says Votiak women prayed to Kaldyni-mumas for
    children and virgins for a happy marriage; another account calls the deity a fructifier
    of women and animals.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says Votiaks and Cheremiss also speak of separate fertility deities
    for domains such as earth, corn, children, animals, and bees, with special sacrifices.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: From the white sheep sacrifice, the author concludes that Cheremiss and Votiak
    birth deities who carried the soul to the child were heavenly deities; Kildisin
    is glossed as “procreating Heaven.”
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Ryckov is cited as saying the female Kildisin was the mother or wife of the
    Heaven god Inmar, and folklore is said to mention “Inmar mother.”
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Jumon-ava is said to receive female animal sacrifices in sacred groves and
    to be worshipped as a deity of childbirth and marriage.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: Nishke-ava is glossed as the “Great birth-giving mother” and is said to be
    probably identical with the little-known Azer-ava, glossed as “Mistress.”
  category: relationship
  evidence_refs:
  - ev:14
