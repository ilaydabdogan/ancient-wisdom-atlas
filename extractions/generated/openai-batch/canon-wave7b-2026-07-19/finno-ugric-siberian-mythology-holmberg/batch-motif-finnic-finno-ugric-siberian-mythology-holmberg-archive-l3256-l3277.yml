canonical_text:
  quote: ''
  summary: The passage reports Isaac Olsen’s account of Lapp belief in underground
    spirits whose life resembles that of living Lapps. These underground people urge
    the living to maintain the same dwellings, ceremonies, customs, clothing, and
    language, especially through instruction by shamans. The Lapp tongue is described
    as the language of the gods and as created by first shamans, spiritfolk, and ancient
    beings; adherence is linked with long life, happiness, trade success, and health
    of people and cattle.
