canonical_text:
  quote: ''
  summary: 'The passage describes Cheremiss remnants of the kuala or kudo family-god
    cult: a sacred case or corner shelf is treated as the dwelling-place of the kudo-spirit,
    certain people are barred from the sacred area, offerings and sacrificial meals
    are made there, the household spirit may appear in dreams and demand sacrifice,
    and a custom is reported in which dust from the spirit’s case is carried to a
    neighbor’s house when illness is understood as a demand for sacrifice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Cheremiss, a time-darkened case in the back of the hut is described
    as the dwelling of the kudo-spirit, comparable in this respect to Votiak practice.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The case may contain offerings and dried birch leaves; where the case is absent,
    the corner shelf in its former place remains sacred.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Strangers are not allowed to approach the sacrifice shelf, women are said
    not to approach it, and children fear and avoid it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In some areas, the sacred back part of the kudo is separated by a partition
    and is called the “little kudo”; it is more sacred than the rest and only grown
    men may enter it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The “little kudo” formerly held sacrificial objects, arms, hunting implements,
    firewood for forest sacrifice, and the pan in which a victim was to be boiled.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kudo-spirit appears in human form in dreams when requiring sacrifice,
    after which offerings are placed in the case or on the sacred corner shelf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sacrificial vows involve placing meal, honey, cakes, or other foods on the
    shelf; later the flour and honey are made into sacrificial bread for the family.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sacrificial meal is prepared and eaten in the kudo by family members only,
    and strangers are not allowed any part of it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the beginning of the meal, pieces of food are placed on the shelf, and
    the head of the family prays for forgiveness and protection for the family and
    home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bones of a sacrificial victim are buried in the earth under the building
    rather than burned, and portions from each part of a sheep’s body are placed on
    the sacrifice shelf.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When illness is taken to show that the household spirit requires sacrifice,
    a person may carry dust from the spirit’s case to a neighbor’s house and secretly
    throw it into a corner after being received with bread and salt.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
