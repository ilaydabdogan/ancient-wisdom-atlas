canonical_text:
  quote: ''
  summary: 'The passage describes Esthonian Nakk and Finnish Nakki water spirits:
    their drowning of humans, enticement and shapeshifting, protective countermeasures,
    Finnish giant/dwarf/hybrid/object forms, female water-maid forms, and water cattle
    emerging from the sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people believe that in waters where a Nakk dwells, one man is drowned
    every summer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the drowning time approaches, a voice is heard from the water announcing
    that a man is wanted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the victim drowns, the water becomes agitated, boils, and seethes,
    then calms after receiving the victim.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Nakk is said to drown people in both deep water and water only a foot
    deep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Nakk takes victims by enticement, bewitching songs, appearing as desired
    animals or objects, and confusing their sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Nakk entices cattle by changing into an animal, mixing with them, and
    leading them toward the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Mentioning the Nakk's name is described as an effective remedy that makes
    him flee into the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Inhabitants of Mohn throw a spit-on beach stone into the sea as a 'cake' to
    the Nakk before entering the sea; women also do this to protect themselves and
    cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Finnish Nakki is said to closely resemble the Esthonian Nakk, with some
    additional features.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In West Finland, the Water spirit is represented as an unusually large man
    standing across water or a waterfall.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Water spirit is also reported as a dwarf-like small human old man found
    in a net.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Finnish Nakki is described in hybrid, animal, and object forms, including
    half-man with horse-feet, a bearded dog, a buck with net-pouches, a log, and a
    fallen tree in water.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The female Nakki is known by several names meaning Nakki maid, Water maid,
    Sea maid, or Water mistress, and is described as beautiful with a white body and
    long curly hair.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Water maid is described as washing, combing her hair, splashing, washing
    clothes on shore or rock, and watching water cattle on land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says a belief is widespread in Finland that the Water spirit possesses
    magnificent cattle in the water, and that stately cows emerge from the sea and
    return when a man approaches.
  category: relationship
  evidence_refs:
  - ev:9
