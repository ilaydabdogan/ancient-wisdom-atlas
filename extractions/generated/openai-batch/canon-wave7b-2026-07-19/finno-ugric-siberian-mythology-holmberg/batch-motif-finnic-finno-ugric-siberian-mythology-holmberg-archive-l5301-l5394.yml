canonical_text:
  quote: ''
  summary: The passage describes the Votiak kuala as a family or village sanctuary
    with a sacrifice shelf and a linden-bark sacrifice case associated with the Luck-protector
    Vorsud. It notes restrictions on entry, offerings and ritual objects kept near
    the shelf, reports older accounts of objects found in the case, and cautiously
    compares the Votiak case to Ostiak and Vogul god-chests containing tutelary images.
    It further discusses possible wooden images of family spirits, comparison with
    Siryan images destroyed by St. Stephen, Christian placement of saint pictures
    on the shelf, and the use of green or pine twigs when sacrifice begins.
  language: English
  quote_policy: summarized
