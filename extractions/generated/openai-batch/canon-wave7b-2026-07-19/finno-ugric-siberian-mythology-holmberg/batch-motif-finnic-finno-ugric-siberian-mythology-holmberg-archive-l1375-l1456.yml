canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and related burial customs involving roadside
    trees, stumps, posts, offerings, and deposited objects between cemetery and village.
    Several customs are described as preventing the dead or their souls from returning
    home, while others provide places for offerings or memorials, especially for those
    who died away from home. The author also distinguishes funerary karsikko customs
    from other tree customs such as the elattipuu and non-funerary karsikko markings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eastern Cheremiss people are described as felling a tree on the return from
    a burial and leaving a stump about a yard high, generally halfway between cemetery
    and village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the Eastern Cheremiss stump is that the dead person
    may notice it, realize the old home is still far away, and return to the grave.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Volga Finns, a wayside place about halfway between cemetery and
    village contains objects and clothes placed on the ground or hung in trees.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Items taken to the wayside place include the deceased person's death-clothes,
    the bark-sponge used in washing the body, coffin shavings, and objects regarded
    as infected with death.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cheremiss are reported to say that burning coffin shavings would cause
    the deceased to break out in blisters or an eruption on the face.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Votiaks are described as sacrificing at these feared places during serious
    illness and hanging bones of sacrificed animals in the trees there after some
    memorial feasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the District of Mamadysh, Votiaks erected little posts with a small table
    in front for those who died in strange places, and placed sacrificial food on
    the table on death anniversaries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among Finns in Savolax and Karelia, a karsikko tree on the road to the cemetery
    was stripped of its lowest branches and could be marked with a cross, initials,
    and year of death.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The carving of a cross for each corpse borne past was said to prevent the
    dead from coming nearer to their former home; offerings, drinking spirits, and
    hanging strips of clothing are also described at the site.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A similar Esthonian custom is described in which a young tree's crown was
    chopped off, a cross carved in a wayside tree, or a nail hammered into it so that
    the dead person's soul would not come nearer home from the cemetery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A reported Savolax custom of a near-home fir thicket for memorial trees is
    stated by the author to be unsupported by actual folk custom and likely confused
    with the elattipuu.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The elattipuu is described as a tree planted near a newly built house, receiving
    first-fruit sacrifices and an autumn sheep sacrifice, while its branches were
    never cut.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A growing fir or pine in Finland could have its branches removed except the
    top in honor of someone beginning a first long journey or important enterprise;
    in Russian Karelia this was also done for a bride, and no sacrifices were offered
    to this karsikko tree.
  category: action
  evidence_refs:
  - ev:6
