  summary: The passage describes a Cheremiss memorial feast in which guests bring
    food, drink, and wax tapers for the deceased; separate vessels and a seat are
    prepared for the dead man; participants invite him to eat, pray for his protection,
    dance, and receive a living substitute dressed in the dead man's clothes as his
    representative, who speaks about life beyond the grave and advises the survivors.
