canonical_text:
  quote: ''
  summary: The passage surveys a world-mountain and world-ocean complex. It recounts
    an Altaic creation idea in which mountain and ocean pre-exist the human earth,
    a Mongol tale in which Otshirvani ascends Sumer and becomes the Garide bird to
    defeat the giant oceanic snake Losy, and a comparison with the Scandinavian Midgard
    snake and Thor. It then describes Sumeru cosmography in Kalmuck/Lamaist teaching,
    including fixed measurements, surrounding rings of mountains and seas, a turtle-supported
    foundation, and colored sides of the mountain.
  language: English
  quote_policy: summarized
