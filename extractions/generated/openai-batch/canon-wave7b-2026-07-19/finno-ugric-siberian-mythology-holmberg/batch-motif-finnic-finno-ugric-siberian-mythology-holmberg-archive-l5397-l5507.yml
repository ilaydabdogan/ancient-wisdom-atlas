canonical_text:
  quote: ''
  summary: The passage describes Votiak kuala sanctuary practices involving green
    twigs on the sacrifice shelf, the priestly handling of these twigs, and inaugural
    ceremonies by which a household obtains and installs its own Vorsud through ashes
    taken from an older family kuala. It also notes a comparable Lapp practice of
    placing seasonal twigs under images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Green twigs are placed on the sacrifice shelf, and Lapp practice is reported
    as using birch twigs under images in summer and fir twigs in winter.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Eastern Votiaks, sacrifice shelves may retain twigs even where sacrifice
    cases or images are absent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Only the officiating priest is said to touch the twigs; on holy days he burns
    old twigs and replaces them with fresh ones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The kuala cult is described as concentrated around the sacrifice shelf and
    the case, with the sacrificing priest praying while facing the shelf.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Votiak kuala becomes a sanctuary through particular inaugural ceremonies,
    generally performed in summer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person seeking a Vorsud invites guests and goes with bread and gin to
    the head of the family, who is also guardian of the Vorsud kuala.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The guests feast, wedding songs are sung, hospitality is sought from neighbors,
    and porridge is later cooked by the guardian of the family kuala.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The person seeking the Vorsud takes ashes from the kuala fireplace, wraps
    them in a clean white cloth, says a formula about taking the smaller and leaving
    the greater, and places the bundle on the kuala shelf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After eating sacrificial porridge, the person takes the ashes from the shelf
    and sets out home with the guests.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: During the journey home, the escort plays and sings, while the mistress of
    the new kuala keeps a copper coin in her mouth and dances to a stringed instrument
    at specified points of the journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ashes are placed on the shelf of the new kuala, and the master addresses
    the being as one brought with reverential ceremonies and asks it to hear prayers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: An older custom is described in which the feast is held in the kuala and a
    functionary, holding a loaf, asks the Vorsud to come to another place and asks
    the old and deceased ones not to take offence.
  category: speech
  evidence_refs:
  - ev:7
