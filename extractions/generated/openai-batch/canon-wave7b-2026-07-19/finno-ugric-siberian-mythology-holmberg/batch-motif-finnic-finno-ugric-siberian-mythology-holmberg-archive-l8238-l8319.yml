canonical_text:
  quote: ''
  summary: The passage surveys several Finno-Ugric and Siberian forest spirits and
    then describes Votiak beliefs and rites concerning the Forest spirit or “Forest
    man.” The Forest spirit is humanlike but variable in size, sometimes one-eyed,
    associated with whirlwinds, forest wealth, lost children or cattle, hunting luck,
    and cattle protection. Votiak rites include autumn hunter offerings, spring and
    autumn livestock offerings, prayers, animal and food sacrifices, odd-numbered
    pancakes in illness cases, omens, silence, and washing hands in ashes at the fireplace
    after sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mis-khum of the Voguls can appear as tall as a tree and leads wanderers
    astray in the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mengk is described as a more evil spirit, with many male and female beings
    in the forests; their way of living resembles that of humans, they are often regarded
    as people from older times, and tales describe their strength.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The evil Parne is known over a wide territory and among the Yuraks, dwells
    deep in forest fastnesses, and is said to have three fingers on each hand and
    three toes with sharp nails on each foot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Votiak Forest spirit, ftules-murt or “Forest man,” is humanlike in appearance
    and customs, often imagined as one-eyed, and believed able to lengthen or shorten
    his body at will.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Votiak Forest spirit is generally described with his head level with the
    highest tree and is called “Great uncle” in the Glazov district because of his
    height.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the forest where he lives, the Votiak Forest spirit has a household, family,
    and treasures including gold, silver, and cattle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Votiak Forest spirit moves from place to place in the guise of a whirlwind,
    and forest-spirit weddings are associated with whirlwinds that uproot great trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Votiak Forest spirit entices people, especially children, into his power
    and can also entice cattle to become lost or drag cattle long distances in whirlwinds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Votiak Forest spirit is described as enormously strong but stupid, not
    dangerous or dreaded, and often helpful by giving game to hunters and protecting
    cattle in the forest.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:10
  text: The Votiaks make autumn offerings to the Forest spirit in the forest, preferably
    under a fir-tree; hunters participate, and offerings include brandy, bread, and
    a bull or goat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: In some districts, bread is placed on a tree branch for the “Forest man.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: A prayer to the Forest spirit asks him to give forest animals and bees and
    promises gifts in return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:13
  text: The Votiaks sacrifice to the Forest spirit for cattle prosperity; in spring,
    the head of the family prays for protection of cattle from beasts of prey, evil
    people, disease, and all evil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The spring cattle prayer says the cattle go over twelve rivers and behind
    twelve meadows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: Porridge prepared for the Forest spirit is taken into the forest in a birch-bark
    basket, and in autumn a goose offering thanks the spirit for caring for the cattle
    during summer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: Occasional offerings to the Forest spirit are made when foresters go hunting,
    during stormy weather, and in sudden illness cases according to magicians’ directions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: During stormy-weather offerings, the offering is an animal, generally a duck.
  category: object
  evidence_refs:
  - ev:5
- id: obs:18
  text: 'For illness-related offerings, pancakes made by the hostess must be an odd
