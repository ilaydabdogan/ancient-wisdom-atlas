candidate_motifs:
- id: motif:1
  label: Hearth fire treated as a living divine being
  taxonomy_refs: []
  basis: The passage repeatedly describes fire itself as worshipped, named as Mother
    Ut or other Fire gods, and needing to be tended and fed like a living being.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:11
  confidence: high
  cautions: The passage is a comparative survey rather than a single narrative myth.
- id: motif:2
  label: Sacrificial feeding of fire in exchange for household or wedding luck
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Mongol fire worship includes offerings of butter, sheep, wine, and fat, and
    the wedding prayer asks Mother Ut to give luck to the couple and wedding-folk.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The exchange is explicitly ritual and prayerful; the passage does not
    narrate a completed bargain.
- id: motif:3
  label: Sacred birth and genealogy of a fire goddess
  taxonomy_refs:
  - sacred_birth
  basis: The prayer says Mother Ut was born when Heaven and Earth parted, came from
    Mother Otygen’s footprints, was created by Tengeri-Khan, and has steel, flint,
    and elm-tree ancestry.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is embedded in a ritual prayer, and the passage does not present
    a full birth myth.
- id: motif:4
  label: Divine punishment for neglecting or abusing fire
  taxonomy_refs:
  - divine_judgment
  basis: The passage says neglected or improperly treated fire sends skin disease
    or burns a building, and the Buriat tale has a mistreated Fire master threaten
    punishment before the rich man’s house burns down.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: The punishment is attributed to fire beings in belief and legend, not
    to a judicial scene with formal judgment.
- id: motif:5
  label: Male and female pairing of fire deities
  taxonomy_refs:
  - duality
  basis: The passage lists traditions with both masculine and feminine Fire gods,
    including Mother fire and Father fire and several named male-female pairs.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not describe these pairs as spouses or a sacred marriage.
- id: motif:6
  label: Fire being leaves flames and appears in human form
  taxonomy_refs:
  - shapeshifter
  basis: The Master of fire is said to live in the flames but also to extricate himself
    from the fire and appear in human shape.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Only one direction of transformation is described; the passage does not
    use a shapeshifter label.
- id: motif:7
  label: Household fire spirit’s appearance reflects treatment by the household
  taxonomy_refs: []
  basis: Yakut belief and Ostiak tales link the condition or appearance of a household
    fire being to whether the household feeds and treats the fire well.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: 'The form varies across traditions: Master of fire in Yakut/Buriat material
    and Fire maid in Ostiak material.'
comparison_claims:
- id: claim:1
  claim: The passage itself compares Mongol new-home fire rites with rites of Finno-Ugric
    peoples on the Volga by saying the latter observe rites akin to these.
  claim_level: same_function
  target: Mongol new-home fire worship and Volga Finno-Ugric fire rites
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The Volga rites are not described in this passage, so the shared function
    cannot be specified beyond the author’s statement that they are akin.
- id: claim:2
  claim: The passage supports a cautious comparison of Chuvash, Yakut, and Buriat
    fire traditions as sharing a pattern of paired masculine and feminine fire deities.
  claim_level: same_motif
  target: Chuvash Mother fire/Father fire, Yakut Old Man Ulakhany/Mistress Sabaga,
    and Buriat Lord Sakhadai/Mistress Sakhala
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage lists names and gender pairing but does not describe narrative
    relations between the paired figures.
- id: claim:3
  claim: The passage supports a comparison across Yakut, Buriat, and Ugrian Ostiak
    material of household fire beings whose bodily condition or appearance reflects
    how the household treats the hearth fire.
  claim_level: same_motif
  target: Household Fire master or Fire maid reflecting treatment of fire
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage also says such tales occur even in Eastern Europe, but
    it gives no specific Eastern European example in this excerpt.
- id: claim:4
  claim: The passage presents a broad Central and North Asian pattern in which a Master
    or Ruler of fire inhabits the flames and receives or lacks household offerings.
  claim_level: same_function
  target: Central and North Asian Master/Ruler of fire traditions
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to the survey’s summary; named culture-specific
    examples are fuller only for Yakut and Buriat material.
