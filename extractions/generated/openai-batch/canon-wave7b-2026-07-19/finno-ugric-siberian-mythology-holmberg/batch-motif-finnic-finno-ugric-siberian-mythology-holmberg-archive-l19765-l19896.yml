- id: obs:11
  text: Yakut belief links the condition of a household’s Fire god to the household’s
    sacrifices, with a well-remembered Fire god fat and thriving and a neglected one
    thin and withered.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A Buriat legend describes two household Fire masters whose conditions differ
