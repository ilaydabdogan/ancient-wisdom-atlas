canonical_text:
  quote: ''
  summary: The passage presents a plate caption for a Mongol shaman with a drum, then
    surveys fire worship among Mongol, Altaic, Chuvash, Yakut, Buriat, and Ugrian
    Ostiak peoples. It describes offerings made to fire in a new home and at a wedding
    hearth, a prayer to Mother Ut as Mistress of fire, fire treated as a living being
    needing food, paired male and female fire deities, Masters of fire living in flames,
    and tales in which neglected or mistreated hearth-fire beings punish a household.
  language: English
  quote_policy: summarized
