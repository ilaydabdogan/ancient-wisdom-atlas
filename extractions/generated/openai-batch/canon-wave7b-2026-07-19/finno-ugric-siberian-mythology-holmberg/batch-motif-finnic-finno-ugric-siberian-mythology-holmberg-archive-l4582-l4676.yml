canonical_text:
  quote: ''
  summary: The passage describes rules for passing Lapp Seide holy places, including
    offerings and behavioral precautions; punishments such as blizzards or immobilization;
    restrictions concerning women near holy stones; awe surrounding the Rastekaise
    holy mountain; uses of Seides for luck, food, reindeer health, healing, and protection;
    and reports linking Seide worship to family, clan, village, inherited holy mountains,
    and sacrifices to Saivo spirits near stones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When passing a holy place in winter, the traveler is instructed to proceed
    slowly, not glance aside, and look straight ahead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After passing about three hundred yards beyond the place, the traveler is
    to drink spirits in the god’s honour and, earlier, spill a little on the ice as
    an offering; only then may the reindeer run.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Neglecting the precautions or insulting the god is said to bring punishment
    in the form of a fateful blizzard or by binding the culprit, reindeer, and belongings
    to the spot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the Mutenia River Seide, women were said not to sit in boats when passing
    the holy stone, but to pass along the shore on foot and dress in trousers near
    the stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Russian Lapps were said to believe that women nearing holy places were stricken
    with a certain illness that could indicate the nearness of such places.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rastekaise in Utsjoki is described as a holy mountain with two large stones
    on its top and as still regarded with awe by superstitious people.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A storm on Rastekaise is regarded as a sign of the god’s wrath, and the mountain
    is said to hide itself in mists from strangers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Lapp turns to Seides for journey luck, plentiful fish or game, the health
    and increase of reindeer, and help in sickness or other misfortunes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Promises of offerings are made to Seides and redeemed when the sick become
    well again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that Seides had the power of raising storms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that signs point to the Seide-cult having roots in ancestor
    worship and that the Seide is a protecting spirit of a family or clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Reports cited in the passage say that every family and clan has its own Seide,
    that a larger clan’s Seide is mightier, and that the power of such stones is judged
    by the number of worshippers and offerers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A cited missionary account describes many household and family gods, one highest
    and mightiest village god on a hill or high place, and other household and family
    gods in lower places.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The duty of making offerings is said to pass from father to son, and children
    are said to inherit holy mountains and mountain gods from deceased parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Among Scandinavian Lapps, the Seide-cult is described as connected with beliefs
    in holy mountains with underground inhabitants, and sacrifices to Saivo spirits
    are said to have been made near a stone.
  category: relationship
  evidence_refs:
  - ev:7
