canonical_text:
  quote: ''
  summary: The passage surveys Altaic and Siberian traditions of supernatural clan
    and tribal origins, especially descent from animal ancestors, animal nourishment
    of ancestral children, and clan animals treated as sacred or taboo. It includes
    Bersit, Mongol, Kirghis, Buriat, Yakut, North Siberian, and Yenisei Ostiak examples,
    and notes a possible relation to European tales and to totemistic ideas.
  language: English
  quote_policy: summarized
