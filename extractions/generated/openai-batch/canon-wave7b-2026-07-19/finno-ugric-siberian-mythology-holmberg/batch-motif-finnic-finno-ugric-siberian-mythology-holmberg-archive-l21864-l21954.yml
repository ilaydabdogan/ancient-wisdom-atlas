- id: obs:3
  text: In Potanin's Altai notes, the Bersit clan forefather is a wolf living near
    a lake with a deer; their son becomes the clan ancestor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mongol origin variants include an ancestor who is a dog, an ancestor born
    from a tree and nourished by a dog, a last woman who bears children by a bull,
    and a bull-son who first walks on all fours.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kirghis are said to derive from a wild boar and therefore not to eat pork;
    another tale has Jenghiz Khan's son living with a wild boar that bears several
    sons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Buriat myth, Bukha-Nojon is changed into a blue-grey bull to wrestle
    Taizhi-Khan's mottled bull.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the same Buriat myth, Bukha-Nojon wrestles by day as a bull and keeps company
    by night as a fair youth with Taizhi-Khan's daughter, who becomes pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bukha-Nojon removes the child, casts it across Baikal with his horns, later
    swims across the lake, finds the child, and begins to nourish it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A shaman woman finds the child sucking at a blue-grey bull, adopts him, and
    calls him Bulagat; Bulagat's two sons become ancestors of Khori and Buriat clans.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ekerit is described as another ancestor whose father is the burbot and whose
    mother is the shore.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Another Buriat myth says the forefathers came down from Heaven and were nourished
    by a wild boar; Khurmusta's daughter came down to earth as a goat and gave birth
    to two sons and a daughter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Yakut families or clans are described as regarding particular creatures as
