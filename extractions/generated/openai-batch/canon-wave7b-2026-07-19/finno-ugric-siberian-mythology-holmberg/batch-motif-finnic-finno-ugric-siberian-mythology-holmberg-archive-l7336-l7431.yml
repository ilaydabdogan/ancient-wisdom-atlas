canonical_text:
  quote: ''
  summary: 'The passage describes Plate XIX images and then surveys hero and spirit
    cults among Cheremiss, Mordvins, and Baltic Finns: keremet sanctuaries, sacrifices
    during sickness, omen-taking by sound, worship of heroes and alien ruler spirits,
    Mordvin heavy gods, and Baltic Finnish hiisi groves and image-houses.'
  language: English
  quote_policy: summarized
