- id: obs:1
  text: Plate XIX identifies a Samoyed “Master of the Forest” image carved on a tree-trunk.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plate XIX identifies a Cheremiss horse-sacrifice to the keremet-spirit in
    time of sickness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dead hero is said to have directed something through the air, producing
    a whistling sound and destroying an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the place where the hero died, a keremet was established, and the Cheremiss
    sacrificed a foal there in cases of sickness.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A stone was cast into the air in the sick person’s name, and its whining sound
    was used to learn the chances of recovery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss, like the Votiaks, sacrifice to a spirit called Sultan, who
    has special sanctuaries separate from those of a Cheremiss chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that the Cheremiss keremet cult corresponds with the Votiak
    lud-sacrifices and preserves memory of former Volga Finnish princes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mordvins worshipped their heroes and the dwelling-places of these heroes
    under the name keremet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mordvin keremet is described as apparently a fenced-in forest-grove, with
    sacrifice store-houses and probably images kept in sacred places.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Mordvins are said to have sacrificed to spirits of alien rulers under
    names such as Soltan or Salhta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Erza, Staka Pas, the “heavy god,” is honoured with sacrifices and
    entreated not to launch heaviness or evil on the people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: In some places, a divine couple supposed to be husband and wife, such as Onto
    and Bonto, are invoked by the epithet Staka Pas.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Elsewhere the heavy god is addressed as Kan Pas or Kuvan Pas and is regarded
    as living in the black earth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage interprets Kan as a Tatar word for prince and Kuvan as probably
    derived from a Turkish title, kagan.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Esthonians and Finns preserve the name hiisi, said to have meant forest
    and later sacrificial grove; Hiisi as a spirit is generally regarded as evil,
    like the Votiak lud.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: An Esthonian tale says the Thunder god thrived best in a forest of leaf-trees,
    while Hiisi thrived best among coniferous trees.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: The author compares the Thunder god and Hiisi contrast to the distinction
