canonical_text:
  quote: ''
  summary: The passage describes Cheremiss Utum memorial feasts, including a wedding-like
    village procession around fields, offerings to the dead, black ox sacrifice at
    the burial-ground, vow ropes wound around a tree dedicated to the Utumo, family
    versions of the rite, and a general belief that ancestors protect, watch, and
    punish descendants who neglect ancestral customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The communal rite is associated with the appearance of many insects and larvae
    in fields that hinder crop growth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants wear holiday attire, and the ceremonies are said to resemble
    those at a wedding, with a host called the “head of the wedding,” wedding-women,
    wedding-dancers, musicians, and other functionaries.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Villagers carry pancakes, bread, beer, and brandy to the corn-field and drive
    or walk around it three times, following the sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the field procession, a wax-taper is lit, festival food is tasted,
    part of the food is sacrificed to the dead, music is played, and wedding-songs
    are sung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old people go to the burial-ground, where a black ox is sacrificed to the
    Utumo; the killing, cooking, and eating take place outside the burial-ground enclosure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the graveyard, people place wax-tapers on the fence and address Utum man
    and Utum woman, asking them to protect the fields from larvae and butterflies,
    to eat the ox with their family, and not to touch the corn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the meal, the ox-hide is cut into one narrow strip long enough to surround
    the burial-ground, and the ox bones and certain meat parts are buried in the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A sacrifice may be deferred by winding a bast-rope around a tree dedicated
    to the Utumo in the graveyard; one, three, five, or seven windings indicate the
    number of years until the sacrifice, and the number must be odd.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The memorial feast is called “Utum-wedding” because of its similarity to wedding
    ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A single-family Utum-sacrifice may be required when many mice appear in the
    store-house, which is interpreted as a sign that the Utumo claim a memorial feast.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the family rite, the father makes a lime-bark rope and winds it nine times
    around the dedicated tree, postponing the sacrifice for nine years; family members
    later circle the farm-yard three times and enter the store-house, larder, and
    cow-house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The family sacrifice also consists of a black ox, performed, cooked, and eaten
    at the burial-place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that only a few dead avoid the fate of becoming Utumo;
    Samoyed shamans, famous ancestors, princes, and heroes may remain longer in memory
    and be worshipped as household-gods and heroes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Finno-Ugric ancestors are believed to have created
    customs and founded religion and still protect and watch over descendants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Votiaks are said to believe that neglecting ancestral customs and usages
    brings punishment through diseases and years of famine.
  category: relationship
  evidence_refs:
  - ev:9
