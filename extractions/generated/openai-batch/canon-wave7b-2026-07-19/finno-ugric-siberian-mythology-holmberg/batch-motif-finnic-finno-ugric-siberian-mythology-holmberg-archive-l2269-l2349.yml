canonical_text:
  quote: ''
  summary: The passage surveys memorial feast customs among North Karelians, Volga
    Finns, Votiaks, Siryans, Mordvins, Votes, Karelians, and Russians. It describes
    offerings of animals, food and drink given to clergy or to the dead, invitations
    of the deceased soul to meals, objects reserved for the deceased in the household,
    and beliefs that the deceased remains near or in the old home for forty days or
    six weeks before passing to the realm of the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the death of a host or hostess, an ox or cow could be taken to the clergyman;
    in North Karelia a cow due to the clergyman could be tied to a tree in the graveyard
    until he took it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Votiaks, the third-day memorial feast involved pancakes and beer,
    with some beer poured out in the yard for the dead; on the seventh day a sheep
    was killed, and on the fortieth day a cow or horse was killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Siryan third-day memorial feast, wax tapers were lit in the window
    and on both sides of the threshold, and the door was opened to invite the deceased
    soul to the feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the Siryan third-day feast, a hat or kerchief was placed in the farthest
    corner according to the sex of the deceased, and no one sat in that place.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bowl beside the deceased person's place was filled with pancakes, porridge,
    milk, and gin, and each guest added some of the table food to it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the seventh day, a relative could go to the grave, a candle could be lit
    on the rim of the deceased person's food vessel, and words of remembrance were
    spoken as food was dropped into the vessel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In some places the seventh-day rite included going to the grave with two horses
    to invite the deceased, killing a hen or sometimes a sheep, going to the bath-house
    with the deceased, regaling the deceased all night, and taking the deceased back
    to his new home at dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that Volga Finns and many other East European peoples held
    that the deceased remained in close relation to the old home for forty days; Votiaks
    said the soul lived at home for forty days.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the forty-day period, some places set down a bowl for the deceased
    whenever the family and servants sat down to a meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Siryans believed that after the funeral the deceased returned with the funeral
    guests to the old home and remained there for the same period.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Siryans hung a towel in a fixed place so the deceased could wipe his face
    after washing, and living people were forbidden to touch it because death might
    result.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mordvins said that the deceased passed to the realm of the dead forty days
    or six weeks after death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Votes avoided speaking ill of the dead for six weeks and avoided stretching
    their legs under the table, because they believed the deceased soul stayed at
    home, mostly under the table.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Karelians in the Government of Tver hung a towel for six weeks on the back
    wall of the hut for the deceased to use when coming home; the passage compares
    this with a similar Russian custom.
  category: relationship
  evidence_refs:
  - ev:9
