canonical_text:
  quote: ''
  summary: The passage describes Volga memorial feasts, especially Votiak and Cheremiss
    practices. Living participants entertain and feed dead relations, observe taboos
    during the dead's wandering night, provide food, vessels, tapers, and spoons for
    spirits, address the dead with petitions for health, prosperity, fertility, and
    protection, remember named relations and the ruler of the graveyard, and perform
    protective ceremonies including noisy armed activity in the forest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a day-and-night memorial feast, the family must prevent the dead from being
    bored or leaving hungry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Votiaks amuse dead relations by, among other things, taking them for a
    walk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Votiaks believe that near every feast participant is a dead person of
    the same age who had been especially intimate with that participant in life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Votiaks believe the deceased does whatever the living relation of equal
    age does; cheerfulness and fullness in the living participant are mirrored by
    the dead companion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: People eat and drink as much as possible at the memorial feast so that the
    dead do not go away hungry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: People do not work during the memorial feast because work would vex the deceased
    and compel the deceased to work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: People do not go to bed during a memorial feast because a deceased companion
    might sleep too long and remain among the living when the other dead are taken
    to the burial ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The night before Maundy Thursday is called by the Votiaks the wandering-night
    of the dead, when all the dead move about, rise from graves after sunset, and
    go toward the villages.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage says the dead can be seen at this time by turning clothes inside
    out, placing a horse-collar around one's neck, and going onto the roof of the
    house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: During the wandering period the Votiaks avoid work, heating the oven, bringing
    things into the house, and taking things away from it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In many places cattle are not fed by hand during this period; food may be
    pushed before the animals with the feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In some parts young people are warned not to take a stick or distaff in hand,
    because the person who does so will be bitten by a snake the following summer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: At night everything must be still, food must be set on every table, and food
    is also carried to the bath-house where the dead go to bathe.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: During the feast, pancakes, pies, bread, cheese, eggs, and other foods are
    placed on a bench by the door for the dead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: Two empty vessels are set out with home-made wax tapers fixed to their brims
    for dead relations retained in memory.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: Spoons are placed on the bench for the invisible hands of the spirits.
  category: object
  evidence_refs:
  - ev:5
- id: obs:17
  text: When throwing food and pouring drink into vessels for the dead, the Cheremiss
    address the dead and ask for health, peace, success, wealth, increased cattle,
    growing corn, good wind for cleaning corn, and protection from fire, water, and
    evil spirits.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:18
  text: In other places the door is opened and food is thrown over the threshold with
    a request that the deceased eat, drink, not be angry, not go away hungry, live
    in light in the other world, and not afflict survivors or cattle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The names of all remembered relations are mentioned at the feast, and the
    ruler of the graveyard is also remembered.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: For dead persons without surviving relations, a shared taper is lit and morsels
    of food are thrown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: After the ceremonies, the food of the dead is carried into the yard and eaten
    by dogs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: Protective ceremonies may accompany the feast; one described Votiak practice
    involves collecting weapons, going to the nearest forest, and shooting and shouting
    to chase away wolves and other beasts of prey.
  category: action
  evidence_refs:
  - ev:9
