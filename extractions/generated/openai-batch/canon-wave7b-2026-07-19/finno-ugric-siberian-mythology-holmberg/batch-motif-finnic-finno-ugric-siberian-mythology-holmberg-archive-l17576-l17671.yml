  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In some places, a live domestic animal such as a horse or reindeer is consecrated,
    not worked, and well cared for; in older times such an animal was driven far eastward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: In a Yakut custom, several trees are erected before the victim; seven bear
