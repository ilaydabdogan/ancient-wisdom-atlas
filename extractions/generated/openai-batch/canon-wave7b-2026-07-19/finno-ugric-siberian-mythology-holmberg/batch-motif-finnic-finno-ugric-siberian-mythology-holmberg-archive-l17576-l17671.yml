  text: Ajysit is generally described as feminine and is said to bring the soul from
    heaven to a child being born while also helping the woman in childbirth pains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Prayers often refer to Ajysit as Ajysit-Ijaksit, glossed as Procreating-Nourishing,
