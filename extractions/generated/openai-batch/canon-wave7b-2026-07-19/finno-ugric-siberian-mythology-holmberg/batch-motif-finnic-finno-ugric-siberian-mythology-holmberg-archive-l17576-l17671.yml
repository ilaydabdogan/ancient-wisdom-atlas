canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric, Turkic, Tungus, Yakut, Dolgan, and related
    ideas about a Heaven god, a feminine birth deity who brings souls from heaven,
    heaven as a giver of life and goods, dawn-facing sacrifices with white or consecrated
    animals, ritual trees or stumps representing layered heavens, sky purity and pollution
    taboos, lightning striking hidden evil or filth, anthropomorphic stories of God’s
    heavenly dwelling, and a comparison to the Babylonian idea of multiple storeys
    of heaven.
  language: English
  quote_policy: summarized
