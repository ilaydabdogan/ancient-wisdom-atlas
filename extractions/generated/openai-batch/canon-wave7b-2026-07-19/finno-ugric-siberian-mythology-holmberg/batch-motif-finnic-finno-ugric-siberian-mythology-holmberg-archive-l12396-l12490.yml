canonical_text:
  quote: ''
  summary: 'The passage describes a Cheremiss sacrificial rite in a grove: a foal
    is accepted when it shivers, slaughtered with its head toward a tree, and its
    blood, meat, hide, and ritual objects are handled in prescribed ways. The kart
    offers blood to the tree and to Fire-mother, asks the great god for peace and
    justice, girds a tree with a blood-drenched sacrificial girdle, and begins a separate
    sheep sacrifice to the messenger of Jumo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The animal is sprinkled until it shivers; if it does not shiver after a ninth
    attempt, it is removed and replaced, and when it does shiver the people thank
    the god and slaughtering begins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victim’s feet are bound with lime-bark rope, it is laid on its left side,
    and its head is kept in the direction of the tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hole is dug at the animal’s head and covered with lime-branches so the blood
    will run into the hole rather than onto the ground.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The kart stands before the tree and asks the god to accept the sacrifice and
    let the rising soul be a shining-haired foal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The slaughterer cuts the neck veins with an old-fashioned knife used only
    at sacrifices, and the blood streams through the lime-branches into the hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kart collects the first warm drops of blood in a wooden spoon, prays to
    the great god for peace and justice, and throws the blood up into the tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The kart addresses Fire-mother, asks her to carry the sacrifice up to the
    great god, and throws blood into the fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The offering-girdle is drenched with blood by drawing both sides of it over
    the wound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bridle and footsnare are removed from the foal and hung on the post where
    the foal had been tied.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Four men take part in flaying the foal, and the victim’s head must continue
    to face the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A candle at the foot of the tree burns throughout this phase and is replaced
    when needed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The nose or lip-containing part is cut off as a special sacrifice and purified
    by scorching in the fire; the head is also scorched after removal of the lower
    jaw.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Specific body parts are placed separately as so-called Jumo-pieces in the
    cauldron nearest the sacrifice tree, while the remainder is boiled in other cauldrons.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: The hide is spread on the ground to the right of the sacrificial altar with
    its head toward the tree, resembling a horse lying on its left side.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Parts unfit to eat are placed in the blood-hole and later burned in a fire
    built over it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: While the flesh cooks, the people remain in the forepart of the grove and
    new people arrive from surrounding villages, while only the kart and assistants
    remain at the sacrificial fire.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: The little tree is girded with the sacrificial girdle three, five, seven,
    or nine times, and green twigs, a tassel, and a pewter figure are fastened with
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: A separate sacrifice is begun for the messenger of Jumo, with a white sheep
