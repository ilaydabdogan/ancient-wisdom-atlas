canonical_text:
  quote: ''
  summary: 'The passage describes Votiak family-spirit rites connected with the kuala
    sanctuary: sacred donations, occasional sacrifices prompted by illness or misfortune,
    marriage-related vows and offerings by a bride or young wife, and the relationship
    of Vorsud worship to ancestor and memorial rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Money is placed in a money box or pressed into sacrificial cake or bread and
    is reserved for sacred purposes such as sanctuary repair, ritual necessities,
    and sacrificial animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Occasional sacrifice festivals are held in the great or little kuala when
    illnesses or misfortunes are declared by a sorcerer to originate from spirits
    living in the kuala.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sacrificial vow may be made before the actual killing of the sacrifice;
    it may be renewed if resources are lacking, but it must not be forgotten or indefinitely
    postponed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a bride leaves for a new home in the Sarapul district, she is taken around
    the fireplace in her old home while her father prays with gin and beer and promises
    an animal sacrifice to the family spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Mamadysh district, a young wife makes a sacrificial vow on the wedding
    day, and the sacrifice commonly occurs the following autumn when she returns to
    her native village with a duck.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The duck is killed and boiled in the great kuala, and the guardian says the
    sacrificial prayer, identifying the married daughter who has moved to another
    family and is making an offering to the family spirits of her native home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Only the sacrificing priest and the sacrificer herself may take part in the
    performance of the young wife’s sacrifice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After this sacrifice, the wife may perform sacrifices in her husband’s family
    kuala; in illness or misfortune, on the sorcerer’s advice, she may need to sacrifice
    to the kuala of her own family.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Votiaks turn to the Vorsud and to deceased family
    members in the same matters, especially illness, and may name them side by side
    in the same prayer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Votiak memorial festivals are described as occurring at home, in a greater
    family circle, or at the ancestors’ home, where deceased family members, especially
    important ones, are remembered.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that the timing of regular kuala festivals and regular
    memorial festivals falls close together and that both forms have been retained
    side by side.
  category: relationship
  evidence_refs:
  - ev:8
