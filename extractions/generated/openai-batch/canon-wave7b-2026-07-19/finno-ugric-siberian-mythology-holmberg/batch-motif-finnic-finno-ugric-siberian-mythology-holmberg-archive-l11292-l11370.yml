canonical_text:
  quote: ''
  summary: The passage describes spring and Whitsuntide rites for Peko/Pekko, including
    a village-held image, beer, bread, candles, prayers for families and protection
    from hail, wax added to the image, an alternate nocturnal rite transferring the
    image to a new guardian after wrestling, and related notes on plant-field rulers,
    cornfield tutelary spirits, agricultural taboos, and a Cheremiss ceremony with
    wooden horns, a tree, cakes, beer, and hail omens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Peko is represented by an object or image preserved as common village property
    and kept by farms or guardians in yearly turns.
  category: object
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:2
  text: The feast of Peko is held in spring, when vegetation is said to awaken, and
    worshippers bring corn from which festival beer is prepared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At one described feast, Peko stands on a beer-barrel in a room corner, surrounded
    by burning wax candles, with beer-vessels and loaves of bread arranged nearby.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The host takes a little beer from each vessel, pours it back with a blessing
    for the vessel owner and family, and the congregation eats and drinks in honour
    of Peko.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A communal prayer against hail is sung at dawn, and the remains of the feast
    are divided among the poor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Remaining candle wax is added to Peko’s head, and a larger accumulation of
    wax is associated in the passage with a more prosperous summer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In another report, Peko is kept in a granary, wrapped in a sheet, carried
    into the guardian’s house after sunset, and placed under a hanging lamp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Participants sit with their backs to Peko while eating and rise without turning
    toward Peko.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Participants march nine times around Peko while singing a request for Peko
    to shepherd herds, look after horses, and protect corn from snow and hail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the procession, participants wrestle; the first person to receive a
    bruise announces bloodshed and is acclaimed as Peko’s guardian for the next year.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The image of Peko is taken that same night in the dark to the new guardian’s
    granary.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage traces the name Pekko or Peko to a Scandinavian word connected
    with Beyggvir or Byggvir and Swedish bjugg, glossed as barley.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage reports plant-specific figures or rulers for hop-fields and flax,
    including a Hop king or Hop-field master and a Flax mother kept in a linen-chest
    so linen should flourish.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that many European peoples believe a cornfield is protected
    by a tutelary spirit, especially during ripening.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: During rye ripening, Volga Finns are described as avoiding digging, entering
    rye-fields, noisy or foul-smelling work, startling colours, and loud speech at
    noon.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Hailstorms and thunder that ruin crops are feared as punishment for unseemly
    behaviour.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: A Cheremiss ceremony concluding the hot evil time includes blowing special
    wooden horns, carrying them to a tree, processing around the tree, and a priest
    praying with cakes and beer.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: If one of the wooden horns breaks during the Cheremiss ceremony, it is regarded
    as a sign of hail.
  category: relationship
  evidence_refs:
  - ev:11
