  quote: ''
  summary: The passage describes Lapp sun and moon worship involving prayers, sacrifices,
    ritual silence, copper rings or apertures for celestial light, reindeer-related
    fertility concerns, February moon rites, and comparative notes linking some practices
    or sayings to Scandinavian, Icelandic, Finnish, and Teutonic material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men and their wives bow their knees and pray to the sun for merciful rays
    over reindeer and other necessities, and after the meal pray for a good milking-summer
    and luck for the herds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reindeer, sheep, and goats are described as possible sun-sacrifice animals;
    a spinning-wheel and flax could also be set on the altar to the Sun goddess.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lapps lost in the mountains are described as kneeling, calling to the sun
    not to set, and holding up a handled wooden object with a round hole so that sunlight
    shines through it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that some Lapp sun-worship customs correspond to those of
    Scandinavian neighbours and identifies sun-porridge, spinning-wheel, and flax
    as signs of foreign influence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Christmas new moon, called the holy moon, is worshipped with ceremonies
    including household silence, women not spinning, and men avoiding noisy labour.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A copper ring is placed in the tent roof-hole so moonlight can shine through
    it; breaking the custom is said to anger the moon and require sacrifices.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In some districts a half-year-old reindeer calf is sacrificed, and its hide
    is hung in the tent in honour of the moon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An cited explanation says the moon can help reindeer-cows give birth easily
    and protect them from injury while pregnant.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The February moon, called Kuova-manno, is worshipped with special ceremonies;
    hay is bound to reindeer horns and the moon is adjured with alarm and noise to
    eat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that the first and second new moons of the year also received
    marks of honour in Iceland.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Finnish tale names January as the great oak and February as the little oak,
    and gives February speech about freezing a foal, a housewife's hands, and swine's
    feet, while also saying water runs from its eye during the day.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage reports a similar Teutonic proverb in which the little Horn, identified
    as February, says to the great Horn, identified as January, that it would freeze
    the calf in the cow if it had January's power.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: When Scandinavian Lapps sacrifice to the moon, they act as in sun-sacrifice;
    the sacrificial animals are similar, never black, and never males.
  category: attribute
  evidence_refs:
  - ev:13
