canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and Siberian beliefs about the dead dwelling
    in mountains or hills, the land of the dead lying toward the sunset, north, under
    the earth, or in the Northern Arctic Ocean, divided roads and underworld levels
    assigned according to deeds, boat passage across water, and Finnish poetic names
    for a northern home of the dead with a gloomy death-river or vortex.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some dead were hoped to be received into a mountain whose inmates had protected
    them in life; there they became spirits able to keep death from relatives and
    friends for a time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In southern districts, mountain spirits called Saivo man and Saivo maiden
    are said to have borrowed characteristics from the Huldre-folk of southern neighbours.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some West Finnish accounts, gods carry a dead man from the grave to an
    adjacent forest-hill, where he must live as penance for a crime committed in life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The word hiisi is connected in the passage with forest and hill, and Hiiden
    väki is said often to mean the same as Swedish Huldre-folk.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because night is described as the time when many spirits move about, the passage
    links the underworld of the dead with the sunset and the dark north, directions
    in which offerings to the dead are made.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Northern Ostiaks and Voguls are described as locating the land of the
    dead in the Northern Arctic Ocean; the Voguls place the entrance far north where
    the River Ob flows into the sea.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the Vogul entrance to the land of the dead, the road divides into three
    branches with signposts indicating which way each soul must go according to deeds
    done in life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ruler of the land of the dead is named Khulater and is described as greatly
    feared.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Northern Ostiak underworld is said to have three storeys; those who sinned
    most live in the lowest, a level described as the height of a dog’s tail.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Songs and sagas describe the journey to the world of the dead as crossing
    water by boat, with the dead placed in the boat of Khin-ort’s son and assistants
    sent by the Prince to bring the dead over.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Finnish poetry identifies Pohjola, the northern home, as a home of the dead,
    with related names including Pimentola, Sarajas, and the Estonian Maksameri.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Finnish folk-poetry describes a gloomy river or death-river in Pohjola or
    Tuonela, also imagined as turbulent rapids in the far north that swallow waters
    and make trees and reeds fall downward.
  category: setting
  evidence_refs:
  - ev:7
