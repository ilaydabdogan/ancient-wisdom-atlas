canonical_text:
  quote: ''
  summary: 'The passage describes Lapp bear-rite practices after the killing of a
    bear: friendly speech to the buried bear, protection and marking of the grave,
    variant arrangements of the bones, decoration and display of the skin, a veiled
    women''s aiming game treated as an omen, post-feast abstinence and purification
    of hunters, commemorative copper nails for bears killed, and a shorter parallel
    description of polar-bear worship and post-kill celebration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After ceremoniously burying the bear, the Lapps speak to it in a friendly
    way and ask it to tell other bears about the honour it received so they will not
    fear or resist capture.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear's grave is carefully covered with logs and fir branches to keep dogs
    or beasts of prey from seizing or disturbing the dead bear; in some districts
    a small wooden spear is set on the grave as a monument.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some bear graves are made smaller and deeper, with the bones placed upright
    in order and the head at the top beside a bark-vessel containing alder-bark juice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other reports say the Lapps tied the bear bones together and hung them in
    trees at the place where the bear was killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the meal, the bear's skin, decorated especially at the head with brass
    ornaments and rings and sprinkled with alder-bark juice, is hidden under fir branches
    and later displayed on a snowdrift or against a tree near the tent.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Veiled women are led from the tent, given a bow or alder twig, and directed
    by the men to aim at the bearskin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that a woman hitting the bearskin is regarded as receiving
    a sign that her husband will be the next bear-killer, or, if unmarried, that she
    will become the wife of a celebrated bear-hunter.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman who hits the bearskin also receives the honour of sewing metal-wire
    crosses on cloth pieces hung around the neck of each man who joined the bear hunt;
    the reindeer used to drag the bear also receives one.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the veils are removed, the women may look at the bear's skin only through
    a brass ring, and the brass ornaments remain on the skin until it has dried and
    is ready for use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the bear feast, the men delay in the cutting-up tent; hunters avoid
    approaching their wives for three days, and the expedition leader abstains for
    five days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the third day after the kill, the hunters wash with birch-ash in water,
    run three times around the cutting-up tent, jump in and out of the dwelling-tent
    through the door and holy backdoor, and imitate the bear's growling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wife of the bear-killer catches the men during the rite and asks when
    the next bear feast will be; the passage says she always has mittens on her hands
    on these occasions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In Rheen's account, the men run singing around the fire, jump through the
    door, and an old woman throws hot ashes after each of them; afterward they remove
    their brass ornaments and may return to their wives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: For each bear killed, the Lapps hammer a copper nail into a spear, gun, or
    magic drum, because killing a bear is regarded as a great honour.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage says the polar bear, like the forest bear, is an object of worship
    among the Lapps; when one is brought by spring drift-ice to the Kola Peninsula,
    they capture and kill it, play merrily, creep over it roaring, make a log-fire,
    sit around it, and sing.
  category: sequence
  evidence_refs:
  - ev:7
