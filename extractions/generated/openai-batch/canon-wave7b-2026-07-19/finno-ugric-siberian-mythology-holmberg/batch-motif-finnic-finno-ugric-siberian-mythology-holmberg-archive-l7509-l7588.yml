canonical_text:
  quote: ''
  summary: The passage describes Votiak rites for household and cattleyard spirits,
    including sacrifices and promises of sacrifice at entry into a new house, under-floor
    ceremonies involving food, spirits, and a fir tree, and seasonal or occasional
    offerings to a cattle-protecting spirit. It also records beliefs about the Cattleyard
    man caring for favored horses and tormenting disliked ones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Votiaks regard sacrifice to the House man as a duty when first establishing
    themselves in a new house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moving into a new house can become a festival called the house-wedding, attended
    by relatives and friends who bring gifts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The central new-house ceremony is the killing of a sacrifice under the floor
    of the dwelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Sarapul District, the master of the house and his wife go under the
    floor with pancakes, home-distilled spirits, and a young fir, and the master promises
    a black sheep sacrifice.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: During the under-floor rite, the master sets up the fir, holds a branch, kneels,
    receives a goblet from his wife, prays for comfortable life in the dwelling until
    old age and death, drinks, and tastes the pancake.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: When the promised sacrifice is later fulfilled, the master prays on his knees
    for happiness, riches, and good things for the new home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: On the day of the house sacrifice, nothing may be given away from the homestead,
    and the sacrificial animal must be killed on fir twigs rather than bare earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Cattleyard man is described as an anthropomorphic, kindly spirit in the
    sheds who looks after cattle, encourages their increase, and protects them from
    beasts of prey and sickness.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Cattleyard man is believed to protect cattle provender by driving away
    strange spirits that come to steal it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The Cattleyard man dwells chiefly in the stables, cares for horses that please
    him, and may plait their manes and tails.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: The Cattleyard man may torture disliked horses by riding them to exhaustion
    during the night.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A folk-tale says a farmer put resin on a horse’s back and later found a little
    old man stuck there.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Occasional and regular sacrifices are offered to the Cattleyard man, including
    a capercailzie for a sick cow and a brace of pike for horses among Eastern Votiaks.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: In some districts, a fish sacrifice is offered once for each foal so that
    the foals may shine like pike when they become horses; the fish is burned uncooked
    in the cattleyard.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Yearly sacrifices to the Cattleyard man occur in spring when cattle are let
    to pasture and in autumn when they are shut into cattlefolds again.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: In many places, a spring promise of sacrifice with bread or porridge is fulfilled
    in autumn if the cattle remain healthy and increase.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Only family members may take part in the Cattleyard man sacrificial ceremony,
    and the sacrifice is burned in the cattleyard.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Prayers to the Cattleyard man ask for fat horses, milch-cows, protection of
    cattle, expulsion of the strange spirit, and removal of evil from the yard.
  category: speech
  evidence_refs:
  - ev:18
