canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and Siberian water-spirit beliefs: a plate
    caption notes an Ostiak white-animal sacrifice to the Heaven-god; drowned persons
    receive offerings and are escorted to a god-house; water spirits are described
    as fish souls, fish-like masters, rare fish, pikes, flounders, horned beings,
    and fish-human hybrids; water, rivers, lakes, and seas are personified as living,
    mobile, maternal, and capable of receiving offerings; moving lakes or seas may
    follow offense or pollution, and a black bull precedes a wandering sea; Cherlak
    Lake is personified as a young sister visiting two older sister lakes.'
  language: English
  quote_policy: summarized
