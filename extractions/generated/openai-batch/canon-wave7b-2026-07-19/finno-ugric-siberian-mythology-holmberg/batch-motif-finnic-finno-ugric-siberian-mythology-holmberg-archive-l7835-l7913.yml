canonical_text:
  quote: ''
  summary: 'The passage describes Cheremiss, Mordvin, and Baltic Finn beliefs about
    household and building spirits: houses and outbuildings possess an indefinite
    soul; bee-gardens have named protectors; the Baltic Finn Haltia or Haldja is a
    household ruler who receives greetings and permission requests, may dwell in roof-structures
    or building materials, may appear as an animal omen, and may be identified with
    a first deceased householder or first fire-lighter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cheremiss are described as treating a house as having a soul whose departure
    makes the house unhappy, wearisome, or hurt; night creaking is said to indicate
    the building soul moving, and long-deserted dwellings lack such a soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The building soul is described as indefinite and as the prosperity, happiness,
    or comfort of the house; cattleyards and threshing-barns are also said to have
    an indefinite soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says building souls were believed able to leave their material
    dwelling-place and might become visible in the shape of a domestic animal, such
    as a cat or dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cheremiss and Mordvin bee-gardens are described as having special named tutelary
    or protective beings connected with bees or beehives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Baltic Finn household spirit is called the Ruler, Finnish Haltia and Esthonian
    Haldja; it is described as needing no food but requiring honor.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before settling in a new dwelling or staying somewhere overnight, permission
    must be asked of the Ruler; a rapping sound is treated as permission, and a daily
    greeting to the Ruler is also answered by a rap.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Every room with a roof-tree is said to have its own Haltia, which is supposed
    to live in the roof-tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another report says the Haltia takes possession of a house when three logs
    have been crossed; when a house is demolished and the logs piled, the Haltia cries
    from fear of homelessness, but if one log is reused it moves with that log into
    the new house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ashes from all the hearths are taken to new fireplaces so that the Haltia
    will not feel lonely in the new house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Haltia is said to become visible before misfortune; in Ingria it appears
    as a dog or as a mottled or striped cat, which is a sign of fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Haltia is also pictured as human; a Finnish belief says the first person
    who died in the house, or the one who lit the first fire there, became the house
    Haltia, especially as the first departed master or mistress.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: As first departed master or mistress, the Haltia is generally kind, cares
    especially for provisions, and is associated with gendered ranks and tasks affecting
    children, horses, and domestic animals; other buildings and vessels also have
    Haltia, with the vessel Haltia connected to the keel.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
