canonical_text:
  quote: ''
  summary: 'The passage first describes a Cheremiss practice in which a sacrifice
    girdle with attached objects is fastened to a living sacrifice tree as a pledge
    until the next festival. It then describes Lapp practices concerning the magic
    drum: concealment and taboos around it, a compensatory brass-ring offering if
    a woman must cross a road used by the drum, special transport precautions, broad
    use of drums for divination and advice, a formal divination rite using a brass
    ring on drum images, interpretation of the ring’s movement, testing whether gods
    accept sacrificial animals, death omens from underworld signs, and earlier accounts
    of shamanic trance induced by violent drumming.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some Cheremiss places, a sacrifice girdle with attached objects is fastened
    to a living sacrifice tree and remains there as a pledge until the following festival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman’s drum is described as highly respected and often kept in a skin
    case in the inner part of the tent so that others would not look at it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: According to the passage, Lapps held that a woman’s touch would desecrate
    the drum, and women were not allowed to cross a road along which a drum had been
    transported for the next three days.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If such a road-crossing by a woman could not be avoided, she was required
    to sacrifice a brass ring to the drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The drum was transported through the backdoor, placed in the last sleigh,
    and, where possible, carried along unused roads; violation of its sanctity made
    it useless, and an angered drum was believed able to show displeasure by weeping
    or threats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that many Lapp families possessed magic drums, though not
    every owner was a shaman, and that the drum was used for divination and advice
    about travel, hunting, fishing, lost reindeer, troubles, and sacrifice to the
    gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before divining the future, the questioner and other participants washed,
    dressed in their best clothes, and gathered as for a feast or holy act.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The divination rite began with the questioner kneeling on the left knee, holding
    the drum horizontally in the left hand, placing the ring on the picture of the
    sun, tapping around it with a hammer, and singing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Movement of the ring in the direction of the sun was read as a good sign,
    while the opposite direction foretold accident, sickness, or other misfortune;
    the figure on which the ring lingered supplied the answer to the question asked
    of the spirits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A pause at figures of a forest animal or fishing-water indicated success in
    hunting or fishing, while a pause at the drawing of a god indicated that the god
    wanted a sacrifice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: To test whether a sacrificial animal pleased a god, hair from the animal’s
    neck was wound around the ring and animals were tried until the ring indicated
    acceptance; movement to underworld figures or off the drum meant death or major
    misfortune.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Missionary accounts cited in the passage say that in an earlier form of the
    practice the shaman beat the drum violently with a hammer until falling into trance,
    and a Swedish Lapmark account describes placing the brass ring on the sun figure
    and beating the drum with a forked drumstick to learn about distant events.
  category: action
  evidence_refs:
  - ev:8
