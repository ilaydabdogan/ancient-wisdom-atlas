  summary: The passage surveys Altaic, Kalmuck, Central Asian shamanic, Mongolian,
    Votiak, Buriat, and Torgout accounts concerning the sun and moon. It describes
    traditions in which the sun and moon appear late as metal mirrors, beliefs linking
    them to shamanic divination, tales of sun and moon as sisters, flood-era earth
    formation, and stories of multiple suns reduced to one.
