comparison_claims:
- id: claim:1
  claim: The passage explicitly links the Altaic image of sun and moon as metal mirrors
    with Central Asian and North Siberian shamanic practices in which celestial bodies
    and magic mirrors function as reflective media for prophecy.
  claim_level: same_function
  target: Central Asian and North Siberian shamanic mirror divination
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage itself states uncertainty about whether the belief and
    related costume custom are original to the Altaic peoples or borrowed from elsewhere.
- id: claim:2
  claim: The Buriat and Torgout accounts are variants of a multiple-suns pattern in
    which excess suns threaten the earth and the cosmos is restored to one sun.
  claim_level: same_motif
  target: multiple suns reduced to one
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The Buriat version centers on a heroic archer, while the Torgout version
    frames the extra suns as the devil's attack and God's response.
- id: claim:3
  claim: The Mongolian and Votiak materials both concern the condition or shaping
    of earth amid primeval water, but the Votiak tale provides an explicit earth-scattering
    episode while the Mongolian tale does not continue to explain earth's origin.
  claim_level: same_function
  target: primeval-water earth formation and topography traditions
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The similarity is functional and contextual; the passage warns that
    the Mongolian tale does not state how the inhabited earth came into being.
- id: claim:4
  claim: The Mongolian sun-and-moon sisters exemplify a nearby-tradition form of the
    sibling-pair and duality pattern, with paired luminaries assigned contrasting
    day and night movement.
  claim_level: same_motif
  target: sibling_pair and duality motif families
