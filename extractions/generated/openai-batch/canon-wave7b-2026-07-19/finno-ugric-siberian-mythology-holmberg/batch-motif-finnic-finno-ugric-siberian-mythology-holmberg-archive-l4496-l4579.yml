canonical_text:
  quote: ''
  summary: 'The passage describes Lapp practices surrounding Seide stone gods and
    holy places: decorating the Seide site with greenery, consulting portable or immovable
    stones for wishes or future knowledge, making offerings, naming surrounding mountains,
    rivers, and lakes as holy, and observing numerous restrictions near these sacred
    places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The place where the Seide stood was decorated with birch leaves in summer
    and fir branches in winter, and the foundation had to be kept green by renewal
    when the greenery withered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Lapp wishing to ask something of his stone god or inquire into the future
    went to the holy place, bared his head, took the god in his hand, and spoke to
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While stating wishes, the petitioner attempted to lift the stone; if it could
    not be lifted and grew heavier, this was treated as a negative answer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the petitioner received what he wished for, he made an offering of thankfulness
    to the stone, and the nature of the offering was also inquired about through the
    same lifting procedure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a large rock or a stone embedded in the earth, the petitioner laid his
    hand on the rock and asked questions, believing the hand would remain stuck until
    the exact future event was named.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Seide place and its nearest surroundings were described as holy, and mountains,
    rivers, and lakes associated with Seides were called Holy Mountain, Holy River,
    or Holy Lake.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Approach to holy places involved caution, festival clothes, genuflections
    from a distance, yearly journeys, and either new offerings or movement of bones
    from former offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: People avoided disturbing the gods at holy places by dwelling nearby, sleeping
    while passing a holy mountain, speaking loudly, or shooting birds or game within
    the precincts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Blue-colored clothing was removed when approaching a holy place; women hid
    their faces or turned their heads when passing; and restrictions also concerned
    garments or footwear associated with women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A woman who passed to one side of a holy place during a journey had to return
    by the same side, even if this required a long detour.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A person going aside to make an offering tied up dogs carefully because a
    dog crossing his track might bring misfortune, such as wolves killing his reindeer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: On offering errands, Lapps used a little backdoor of the tent, regarded as
    holy and not permitted for women to enter or leave through.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports a Kola Lapmark holy place near the Finnish frontier, a
    narrow steep mountain spur, where people rowing past in summer had to make as
    little noise as possible.
  category: setting
  evidence_refs:
  - ev:8
