canonical_text:
  quote: ''
  summary: 'The passage surveys several Finno-Ugric and neighboring water-spirit beliefs:
    a comparison of Kul or Vasa with the Russian Vodyanoy; Cheremiss beliefs about
    a dangerous Water master, his female counterpart or daughter, shapeshifting appearances,
    omens, and offerings connected with fishing; Mordvin malignant water dwellers;
    and the Estonian Nakk, linked by the source to the Swedish Nacken and Germanic
    influence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the developed characteristics of the spirit Kul correspond
    to those of the Great Russian Water spirit, and that the name Vasa seems to translate
    Russian Vodyanoy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cheremiss Water master is said to dwell in waters that do not dry up during
    the hot season.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cheremiss Water spirit is described as evil and feared; swimming at midday
    is especially dangerous, and if he cannot kidnap a man he may take cattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male Cheremiss Water spirit is usually seen as an old man near the shore
    before dawn, with clothing varying from rags to splendid dress or nakedness; larger
    rivers are said to have richer Water spirits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When seen by a human being, the Cheremiss Water spirit throws himself into
    the water, and seeing him is said to denote disaster, often death, for the viewer
    or someone connected to the viewer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss Water spirit can appear as a horse, bullock, sea bull, fish,
    or miscellaneous object; the bellowing of the sea water bull is said to have been
    heard.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The female Water spirit, called the Water master's daughter, has been seen
    on the shore combing long hair with a gold or silver comb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A netting episode describes fishers catching a great being that appears as
    a pretty dark maid, disappears, and leaves the net empty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: People can get a Water master's daughter into their power by throwing a piece
    of iron at her or touching her with their hands, after which she cannot move.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In prayer the Cheremiss Water spirit is addressed as Water old man and Water
    old woman, and these beings are worshipped when people go swimming or fishing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fishermen offer bread, brandy, ducks, geese, or hens to the water spirits
    because the spirits are believed to drive fish into fishing tackle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the first spring fish is caught, Eastern Cheremiss boil and eat it without
    breaking the bones, then throw the bones back into the water while asking the
    Water man for more fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Mordvin water dwellers are described as many malignant human-like spirits
    who lie in wait for newborn children and devour grain cursed by an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Estonian Nakk is said to live in deeper waters, especially the deepest
    spot or a whirlpool, and to present itself as a human, animal, or inanimate object.
  category: attribute
  evidence_refs:
  - ev:7
