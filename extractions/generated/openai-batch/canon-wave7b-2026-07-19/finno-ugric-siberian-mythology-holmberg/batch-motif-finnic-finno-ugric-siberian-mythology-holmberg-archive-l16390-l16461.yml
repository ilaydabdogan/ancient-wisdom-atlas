canonical_text:
  quote: ''
  summary: 'The passage surveys world-conflagration traditions: a fireproof covering
    used for escape; Vogul tales of the Earth-watching man riding through fire on
    a magic horse; comparisons with Tungus, East Indian, Central Asian, Altai Tatar,
    and Buriat end-world fire narratives; and motifs of hidden survivors, resurrection,
    destruction of evil, and a new earth.'
  language: English
  quote_policy: summarized
