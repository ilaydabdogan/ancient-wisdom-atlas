comparison_claims:
- id: claim:1
  claim: The passage states that belief in Masters animating nature is not confined
    to Altaic peoples and is also found among other Siberian peoples, including the
    Yukagirs and Chukchee.
  claim_level: same_motif
  target: Altaic and other Siberian peoples, including Yukagirs and Chukchee
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives this as a survey assertion and does not provide detailed
    Yukagir or Chukchee examples here.
- id: claim:2
  claim: The passage compares Yakut dwelling-place Master beliefs with ancient Finnic
    belief by saying ancient Finns had the same belief about a deceased oldest inhabitant
    becoming the Master of a home.
  claim_level: same_motif
  target: Yakut dwelling-place Master and ancient Finnic home-Master belief
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is brief and depends on the author’s statement; no Finnic
    narrative is quoted in this passage.
- id: claim:3
  claim: The passage explicitly says the conception of the Forest Master as a tree-height
    being is found in Europe and is general among Asiatic peoples.
  claim_level: same_motif
  target: European and Asiatic conceptions of a tall Forest Master
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: No specific European examples are supplied in the passage.
- id: claim:4
  claim: The passage places Mongol Mani-Khan, the Buriat Forest Master, the Tungus
    Forest Master, and Yakut Bajanai in a comparable functional pattern as forest
    or forest-animal Masters.
  claim_level: same_function
  target: Mongol, Buriat, Tungus, and Yakut forest/game Masters
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples share forest or game functions, but their forms and actions
    differ.
