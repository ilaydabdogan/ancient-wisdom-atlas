canonical_text:
  quote: ''
  summary: The passage surveys beliefs about “Masters” of natural phenomena, objects,
    dwelling-places, forests, water, and animals. These beings are described as dwelling
    in or appearing in the forms of the things they govern; some are represented by
    shaped images. The passage also reports traditions in which dead persons become
    dwelling-place, forest, or water Masters, and gives several descriptions of Forest
    Masters as oversized, human-like, animal-shaped, or rock-shaped owners of game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Masters are often believed to dwell in the phenomena or objects they represent,
    including fire, water, and trees, though they can sometimes separate from them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Images of the Masters of the sun and moon are made in the shape of those heavenly
    bodies.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Masters of animals are said to appear to humans in the shapes of the corresponding
    animals; examples include a reindeer image for the Reindeer’s Master and a fish
    image for the Fish Master.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Buriat Master-tree is recognized by blood-red pith, and the passage describes
    the tree as the body of the Master dwelling in it, from which blood can run.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the conception of Masters animating nature is found
    among Altaic peoples and also among other Siberian peoples, including the Yukagirs
    and Chukchee.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some anthropomorphic Masters of dwelling-places, forests, and water are associated
    with spirits of the dead said to dwell in those places.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Yakut dwelling-place Master may appear in the form of former dwellers,
    and an oldest inhabitant may become Master of a home after death; the passage
    says ancient Finns had the same belief.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Masters of forests and water are sometimes said to originate from spirits
    of persons lost or drowned there; a Buriat tale says a hunter lost in the forest
    died of hunger and became the Forest Master.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tales are said to explain why forest and water Masters seek human company
    and aspire to marriage or other ties with humans, while the passage cautions against
    concluding that all Masters are spirits of the dead.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Forest Master may be conceived as a tree-height being; the Mongols’ Mani-Khan
    is described as a man-like being of more than ordinary size.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Buriat Forest Master is described as a long, dark, human-like being that
    halloes and weeps in the forest, leads wanderers astray, and gives game to hunters.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The large-sized Tungus Forest Master can take the shape of a strange rock
    resembling a human or an animal, and forest dwellers fear approaching such rocks.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Yakut Bajanai is described as a similar spirit, the owner of valuable
    forest game, and is called rich Bai-Bajanai.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: As Master of forest animals, the same spirit is also conceived in animal shape,
    sometimes with the size of a year-old calf, a dog muzzle, little moist eyes, long
    whiskers, a grey coat, and forked hoofs.
  category: attribute
  evidence_refs:
  - ev:14
