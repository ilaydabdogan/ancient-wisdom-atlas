candidate_motifs:
- id: motif:1
  label: Indwelling master of natural phenomenon or object
  taxonomy_refs: []
  basis: Masters are said to dwell in the things they represent, such as fire, water,
    and trees; the Master-tree is explicitly described as the body of its indwelling
    Master.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage is a comparative survey description, not a single narrative
    episode.
- id: motif:2
  label: Likeness-image represents the Master
  taxonomy_refs: []
  basis: Sun and moon Masters are imaged in the shape of heavenly bodies, and animal
    Masters are represented or seen in corresponding animal forms such as reindeer
    and fish.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives representative examples without detailing ritual use.
- id: motif:3
  label: Dead person becomes local place or nature Master
  taxonomy_refs: []
  basis: The passage reports former dwellers, an oldest inhabitant, a lost hunter,
    and drowned or lost persons as origins for dwelling-place, forest, or water Masters.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The author explicitly warns not to generalize this origin to all Masters
    of natural phenomena and objects.
- id: motif:4
  label: Forest Master as oversized tree-like or man-like being
  taxonomy_refs: []
  basis: The Forest Master is described as tree-height; Mani-Khan is man-like and
    larger than ordinary size, and the Buriat Forest Master is long, dark, and human-like.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: Descriptions vary by group and example.
- id: motif:5
  label: Forest Master misleads wanderers but gives game
  taxonomy_refs: []
  basis: The Buriat Forest Master is said to lead wanderers astray while also giving
    game to hunters.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This action is stated for the Buriat example in this passage, not for
