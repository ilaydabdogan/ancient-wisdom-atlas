comparison_claims:
- id: claim:1
  claim: The Siberian seven sons or gods are compared with the Amesha Spentas and
    originally seven Adityas because all are presented as sevenfold divine groups
    with duties of watching over or controlling heavenly laws of nature.
  claim_level: same_function
  target: Iranian Amesha Spentas and Rgvedic Adityas
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports similarity in number and stated function but does
    not provide detailed narrative or ritual parallels for the Iranian and Rgvedic
    groups.
- id: claim:2
  claim: The author infers that the sevenfold Asiatic divine groups may have the same
    origin.
  claim_level: common_inheritance
  target: Siberian sons of God, Amesha Spentas, and Adityas
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The passage presents this as an assumption following from number and
    function; it does not demonstrate a historical pathway or shared source.
- id: claim:3
  claim: The Ostiak Karevel arrangement is reported to have reached the Ostiaks from
    the Tatars, with related terms also identified as Tatar borrowings.
  claim_level: historical_contact
  target: Tatar Karevel/Tolmats/Karavel terminology and arrangement
  evidence_refs:
  - ev:5
