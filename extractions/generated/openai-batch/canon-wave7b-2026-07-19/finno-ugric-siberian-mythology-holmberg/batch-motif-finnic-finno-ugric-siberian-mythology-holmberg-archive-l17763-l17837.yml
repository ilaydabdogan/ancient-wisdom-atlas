canonical_text:
  quote: ''
  summary: The passage lists Vogul and Ostiak named gods or spirits associated with
    districts and with the sons of the Heaven god. It highlights a sevenfold group,
    compares the number and function with Amesha Spentas and Adityas, describes Vasyugan
    Ostiak seven-storeyed heavens with Num-Torem in the top storey and his sons or
    heaven-watchers below, and lists sacrifice-named Torem figures with their offerings.
    It also notes Tatar influence on the Karevel arrangement.
  language: English
  quote_policy: summarized
