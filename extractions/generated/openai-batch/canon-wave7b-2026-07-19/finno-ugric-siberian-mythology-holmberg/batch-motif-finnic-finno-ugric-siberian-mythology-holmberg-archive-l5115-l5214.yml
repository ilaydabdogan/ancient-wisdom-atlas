canonical_text:
  quote: ''
  summary: The passage presents plate captions for Samoyed and Ostiak family-gods,
    then describes the Votiak kuala as a former dwelling and continuing family sanctuary.
    It details the kuala's sacred interior, domestic furnishings, a sacred case through
    which the living approach departed generations, family-only sacrifices, obligations
    of foster-sons and married women to their own kuala, and the cult's role in maintaining
    family identity, origin knowledge, exogamy, and family-village naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate captions identify a Samoyed stone Family-god as clothed and lifted
    on a tree trunk, and also identify Family-gods of the Ostiaks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kuala includes features such as a fireplace, smoke opening, wooden roof,
    and formerly a low south-side door; it may be divided, and its inner part is generally
    held sacred with women not allowed to enter.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Votiaks now use the kuala mainly as a depository for household utensils,
    but the passage says it was formerly the only dwelling-house of the Votiak family
    and is still sometimes used for cooking and eating.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wooden shelf in a cupboard may hold a little case with a lid; the passage
    calls this case the most sacred object of the Votiaks and says the living believe
    they can approach departed generations near it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kuala sacrifices must be performed within the particular family, and a person
    from one family will not enter another family's sanctuary to perform a sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A foster-son belonging to another family must go to the iprzymg-kuala of his
    own family during kuala sacrifice, even if it is in another village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A married woman is described as having an alien position in her husband's
    family; early in married life she is obliged for a time to frequent her own family
    kuala to sacrifice there when sickness or other troubles occur.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the kuala cult acts as an uninterrupted tie among members
    of the same family or tribe, between the living and the departed, and between
    the present and primeval time.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Each Votiak family has a particular name by which kinsfolk may recognize each
    other, and marriage within the same kuala family is considered a crime.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that Votiak villages were originally family villages, so
    a village and the family living in it often bear the same name.
  category: setting
  evidence_refs:
  - ev:10
