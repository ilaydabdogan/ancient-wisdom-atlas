canonical_text:
  quote: ''
  summary: The passage describes Votiak kuala sanctuaries, festival offices, sacrificial
    seating and songs, changing blood-sacrifice practice, offerings placed on a shelf
    or burned in fire, retained food offerings, gifts and coins kept for spirits,
    and an authorial comparison concerning fire sacrifice among Finno-Ugric peoples
    and Lapp customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate captions identify remains of an old Votiak sacrificial kuala and
    a Votiak Vorsud case with other sacrificial apparatus.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At kuala festivals, representatives from each sex may be chosen in addition
    to the ordinary kuala guardian to arrange ceremonies; these become the festival
    host and his wife, seated at different tables in different corners, and the host
    keeps his cap on while officiating.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Guests arrive at the sanctuary in white holiday costume; men take places to
    the left of the fireplace and women to the right.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Music, singing, and other amusements often follow the sacrifice, and the sacrificial
    priest sings improvised sacrifice songs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Blood sacrifices at kuala festivals have become scarce; special occasions
    may still require them, regular festivals often use bread or porridge, the sacrificial
    fire is still lit, and a blood sacrifice is still performed at least once a year
    with mutual contributions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During sacrifices, one part of the sacrificial gifts is placed on the shelf
    and another part is burned in the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bread offerings are placed on a corner shelf laid with a white cloth; sometimes
    a regular sacrifice bread made by the kuala guardian's wife from spring corn is
    accompanied by small bread pieces from other participating families.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Butter, honey, drink, meat porridge, or portions of important organs from
    a large domestic animal may be placed on the Vorsud shelf.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some shelf offerings remain only during prayer, while others remain longer,
    such as a duck head, an Easter cake, or a cup of water; afterward the priest or
    family members eat them, and women generally do not eat food placed on the sacrifice
    shelf.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage presents shelf placement and fire burning as a dual sacrificial
    custom and cites Aminoff's view that shelf placement is older while throwing into
    fire is more recent; it also says Lapp customs show fire sacrifice to be later
    among Finno-Ugric peoples.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Formerly, Votiaks brought gifts to kuala sanctuaries intended to serve spirits
    as clothing, ornaments, or holy property; objects such as skins, feathers, and
    coins have been found in ancient sacrifice cases, and some great kualas became
    treasuries needing closed doors and a guardian.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sacrificial coins are kept in the Votiak kuala sanctuary, and a collection
    of money is included in the sacrificial ceremonies, generally after the feast.
  category: action
  evidence_refs:
  - ev:10
