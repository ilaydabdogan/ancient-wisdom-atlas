- id: ev:10
  type: summary
  locator: lines 20916-20921
  quote_or_summary: A Yakut belief says the soul can die and that on burial night
    spirits take it to places where its former owner lived and punish it for misdeeds,
    with cries and plaints heard.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized evidence.
- id: ev:11
  type: summary
  locator: lines 20923-20933
  quote_or_summary: A more northern idea says the soul remains among relatives, the
    deceased's property may not be touched, and the soul must receive food and drink;
    some peoples prepare images or associate the soul with an object of the deceased
    until it moves to the kingdom of the dead.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized evidence.
