candidate_motifs:
- id: motif:1
  label: Soul-loss causing sickness and death
  taxonomy_refs: []
  basis: The passage states that death follows when the spirit-soul disappears and
    that a sick person whose soul is in the Prince of Death’s hands is fated to die.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage reports beliefs from several groups rather than one unified
    narrative cycle.
- id: motif:2
  label: Death ruler captures and imprisons wandering souls
  taxonomy_refs:
  - divine_judgment
  basis: Erlen-Khan sends servants to capture wandering souls and keeps them in captivity;
    imprisoned souls are described as chained.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage emphasizes captivity more than formal judgment, so the taxonomy
    reference is broad and should be reviewed.
- id: motif:3
  label: Shamanic soul-retrieval journey across cosmic regions
  taxonomy_refs:
  - afterlife_journey_map
  - hero_descent
  - ascent
  basis: Mergen-khara searches for the sick person’s soul in the death kingdom, under
    the earth and sea, in mountain chasms and forests, and then flies to heaven on
    his drum.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage calls Mergen-khara a shaman rather than a hero; 'hero_descent'
    is used only as a comparative motif-family label for the descent/search pattern.
- id: motif:4
  label: Soul hidden in a container by a heavenly being
  taxonomy_refs: []
  basis: The Heaven god hides the soul in a bottle in heaven and stops the bottle
    with his thumb.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly matches soul-in-container.
- id: motif:5
  label: Shapeshifting trick to release a captive soul
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: The shaman transforms into a wasp and stings God, making him remove his hand
    so the soul escapes.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The text does not label the shaman a trickster; the taxonomy reference
    reflects the boundary-crossing and deceptive strategy only.
- id: motif:6
  label: Mythic reduction of former shamanic power
  taxonomy_refs: []
  basis: After the shaman retrieves the hidden soul, God becomes angry and decreases
    the power of shamans, so they can no longer save souls in the Prince of Death’s
    hands.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an etiological motif inferred from the described sequence; the
    passage does not use the word 'etiology'.
- id: motif:7
  label: Recently dead soul lingers at home before recognizing death
  taxonomy_refs:
  - afterlife_journey_map
  basis: The soul of a recently dead person remains in the home for a few days and
    realizes it belongs to the spirit world when it leaves no trace in the hearth
    ashes.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The afterlife journey is only beginning in this passage; later stages
    are summarized briefly.
- id: motif:8
  label: Material needs of the dead soul and funerary provisioning
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says the soul feels hunger and cold without food and clothing,
    and a northern idea requires relatives to provide food and drink.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The exchange is practical ritual care rather than an explicitly reciprocal
    bargain.
- id: motif:9
  label: Postmortem punishment at sites of earthly misdeeds
  taxonomy_refs:
  - divine_judgment
  basis: A Yakut belief says spirits take the soul to places where its former owner
    lived and punish it for misdeeds on the spot.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage says this belief is probably of later origin and does not
    identify a judge figure.
- id: motif:10
  label: Restless dead disturbing the living
  taxonomy_refs: []
  basis: The passage states that besides souls at peace in the land of the dead, other
    souls wander restlessly and disturb the living with misfortunes.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage segment ends before elaborating the kinds of misfortunes.
comparison_claims:
- id: claim:1
  claim: The passage presents Buriats and Altai Tatars as sharing a belief that if
    a sick person’s soul is in the hands of the Prince of Death, death is fated and
    the shaman cannot help.
  claim_level: same_motif
  target: Buriat and Altai Tatar soul-loss and Prince of Death belief
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison reported by the source passage; it does not establish
    historical contact or origin.
- id: claim:2
  claim: The passage groups Altai Tatars, Buriats, Yakuts, and others together around
    the pattern that a newly dead soul remains in its old home for three days before
    recognizing its postmortem condition.
  claim_level: same_motif
  target: Altai Tatar, Buriat, Yakut, and other beliefs about the recently dead soul
    at home
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The phrase 'and others' is not specified further in the passage.
- id: claim:3
  claim: The passage identifies a more northern pattern in which the dead person’s
    soul remains among relatives, must receive food and drink, and may be cared for
    through an image or personal object before going to the kingdom of the dead.
  claim_level: same_function
  target: Yakut, Dolgan, Golde, earlier Mongol, Kirghis, and related northern funerary
    provisioning practices
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage lists multiple peoples and practices together, but the
    duration and exact ritual forms vary and are not detailed here.
- id: claim:4
  claim: The Mergen-khara tale combines descent or search in deathly and lower-world
    regions with ascent to heaven as part of a shamanic soul-retrieval pattern.
  claim_level: same_function
  target: Shamanic afterlife or soul-retrieval journey pattern
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself gives only one tale for Mergen-khara and does not
    compare it directly to named external tale types.
