canonical_text:
  quote: ''
  summary: The passage describes a plate of a Yenisei Ostiak shaman with a drum, then
    surveys beliefs about sickness, soul-loss, death, postmortem souls, and shamanic
    soul-retrieval among Buriats, Altai Tatars, Yakuts, and other Siberian or Inner
    Asian peoples. It includes a tale in which the first shaman Mergen-khara retrieves
    a hidden soul from heaven by transforming into a wasp, after which God reduces
    shamans’ power. It also describes beliefs that the dead soul remains at home briefly,
    needs provisions, may be punished after burial, and eventually goes to the kingdom
    of the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies a Yenisei Ostiak shaman with a drum and says front
    and back views are shown.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that death follows when the spirit-soul disappears, and
    that among Buriats and Altai Tatars a sick person whose soul is in the hands of
    the Prince of Death is fated to die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Erlen-Khan, called the Prince of the Death-kingdom, sends servants to capture
    wandering souls and bring them to him in sacks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The servants ignore the captured souls’ cries and prayers, and the Prince
    of Death places the souls in captivity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a tale about the first shaman Mergen-khara, he is said to free souls from
    the Prince of Death’s prisons, where they sit chained by neck, hands, and feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Prince of Death complains to the Heaven god Esege-Malan-Tengeri, who tests
    the shaman by taking a soul to heaven and hiding it in a bottle stopped with his
    thumb.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The person whose soul has been hidden becomes dangerously ill, and the shaman
    searches for the soul in the death kingdom, under the earth and sea, in mountain
    chasms and deep forests, and finally in heaven.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The shaman sits on his drum, flies to heaven, finds the soul in the bottle,
    transforms into a wasp, stings God, and the soul escapes when God moves his hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: God sees the bottle is empty and the shaman descending toward earth on the
    drum with the soul; God becomes angry and decreases the shamans’ power.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After this reduction of power, the passage says no shaman can save a soul
    that has come into the hands of the Prince of Death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After death, the soul is said to remain in the home for a few days, and in
    several traditions the newly dead soul wanders in its old home for three days
    before realizing it has left the body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The soul realizes it belongs to the spirit world when it notices that it leaves
    no trace in the ashes of the hearth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Stories still describe the dead soul as having a material body that can burn,
    be wounded, bleed, feel hunger, and feel cold.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sharpened objects can prevent the soul of a dead person from returning home.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: A Yakut belief says that spirits take the soul around on the night of burial
    to places where the person lived and punish it for misdeeds there.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: According to a more northern idea, the soul remains among relatives after
    death, property of the deceased may not be touched, and the soul must be given
    food and drink.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: Some peoples prepare images of the deceased or care for the soul in connection
    with an object owned by the deceased, and only after such periods does the soul
    move to the kingdom of the dead.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage distinguishes peaceful souls in the land of the dead from other
    souls that wander restlessly and disturb the living with misfortunes.
  category: relationship
  evidence_refs:
  - ev:12
