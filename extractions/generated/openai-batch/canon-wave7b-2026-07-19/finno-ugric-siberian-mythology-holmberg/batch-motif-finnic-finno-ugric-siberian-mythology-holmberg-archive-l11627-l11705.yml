canonical_text:
  quote: ''
  summary: 'The passage describes Lapp birth-related deities and rituals: Sarakka
    is honored with holy cleft wood, assists childbirth, menstruation, and infant
    formation, and is associated with ritual meals and black/white stick omens. Juksakka
    is associated with the bow, childbirth aid, prenatal change of a girl-child to
    a boy, and a boy’s future hunting skill. Uksakka is associated with the tent door,
    receiving the newborn, guarding movement, and drink sacrifice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cleft pieces of wood made in honor of Sarakka during birth were regarded as
    holy, were not used as fuel, and were not allowed to be touched.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sarakka was chiefly worshipped in childbed and was said to help both women
    and reindeer during births by assuaging pains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lapps believed Sarakka felt the same agony as the person in childbed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sarakka, like Madderakka, was believed to create the body of the infant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women took off collars and belts during menstruation in honor of Sarakka,
    and the passage connects this with a belief that nothing knotted should be worn
    during menstruation or childbirth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After menstruation a woman washed her head in water, scoured the pan with
    meal, and used it to bake a cake that only women could eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After successful childbirth, women drank Sarakka’s brandy before delivery
    and ate Sarakka’s porridge after giving birth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Three sticks were placed in Sarakka’s porridge: a cleft stick with three
    rings, a black stick, and a white stick; the sticks were then laid at the tent
    door for three days.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the black stick disappeared, it was believed to indicate that either the
    mother or child would die; if the white stick was lost, both would live.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In some districts a miniature bow and arrow, or weapon parts, were placed
    in porridge so that a boy child would become a good hunter; the bow was later
    hung on the child’s cradle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The cleft stick is connected with Sarakka, while the bow placed in the porridge
    is connected with Juksakka, whose name is glossed as “Bow old woman.”
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Juksakka was said to help women at the production and birth of children and
    to change a girl-child in the womb into a boy-child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sacrifices were offered to Juksakka because boys were desired for the chase;
    she is sometimes pictured on magic drums with a bow in her hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Uksakka, glossed as “Door woman,” was believed to live in the ground under
    the tent door, protect people going in and out, receive the newborn at childbirth,
    and watch over the child’s first steps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that the Lapps sacrificed drink to Uksakka.
  category: action
  evidence_refs:
  - ev:7
