candidate_motifs:
- id: motif:1
  label: personified fire as female hearth being
  taxonomy_refs: []
  basis: Fire is repeatedly named Fire mother, Fire girl, Fire woman, or Fire maiden
    and treated as an animated being associated with the hearth and with offerings
    or prayers.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:14
  confidence: high
  cautions: The passage is a survey using several ethnonyms; it does not present one
    single narrative version.
- id: motif:2
  label: fire offended by impurity or mistreatment
  taxonomy_refs: []
  basis: Spitting into fire, wounding it, defiling it with an unclean stick, careless
    wood-throwing, and evil words are listed as causes of fire’s anger.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames purity partly as the author’s probable inference.
