evidence:
- id: ev:1
  type: summary
  locator: 10869-10875
  quote_or_summary: Cheremiss say fire is a friend of humans that warms the house
    and cooks food, but if angered it can jump from the fireplace and burn the house
    and village.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 10875-10882
  quote_or_summary: Causes of fire’s anger include spitting into it, wounding it with
    a sharp instrument, stirring it with an unclean stick, throwing wood onto the
    hearth, and speaking evil words to it.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 10882-10885
  quote_or_summary: The passage says fire was probably regarded from early times as
    pure and unable to endure defilement.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 10885-10888
  quote_or_summary: A frequent punishment for offending fire is skin disease, and
    the fire must then be appeased by small sacrifices.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: quote
  locator: 10888-10892
  quote_or_summary: 'Cheremiss prayer: “Forgive me, ‘Fire mother,’ perhaps I have
    spat in thee or wounded or defiled thee. Make me well again.”'
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; short excerpt.
- id: ev:6
  type: summary
  locator: 10892-10900
  quote_or_summary: During fire breaking loose, Cheremiss people go around the fire,
    sacrifice a black hen or milk from a black cow to Fire mother, and pray for the
    village not to be destroyed and for future protection from loss by fire.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 10901-10908
  quote_or_summary: Ostiaks call fire Fire girl or Fire woman in prayers and sacrifice
    food, red or fire-colored cloths, and pieces of stuff to appease it.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 10908-10912
  quote_or_summary: The sacrifices are intended as clothing for the Fire girl or Fire
    mother, but the passage says the object of worship is the animated fire itself.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 10912-10918
  quote_or_summary: Mordvins say Fire mother flames; Ostiaks speak of the many-tongued
    Fire mother; a Cheremiss prayer describes Fire mother as having long smoke and
    a sharp tongue.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 10919-10925
  quote_or_summary: Cheremiss sometimes speak of the soul of fire, which disappears
    if water is poured over the fire; putting fire out with water is unseemly, so
    wood is drawn aside to let it go out naturally.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 10925-10932
  quote_or_summary: The soul of fire can appear to humans; Finns say the Ruler of
    fire appeared at night as glittering sparks before an accident, and Esthonians
    believe Fire mother appears as an animal warning before a coming fire.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 10932-10936
  quote_or_summary: An Esthonian Fire cock or Fire cat has been seen moving over a
    roof shortly before a destructive fire.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 10937-10943
  quote_or_summary: Ostiak tales say the Fire spirit can take human form; a man who
    had used fire badly saw the Fire girl sitting naked and covered with wounds on
    a stone.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 10943-10947
  quote_or_summary: Another Ostiak tale says every hearth has its own Fire maiden,
    and these can visit one another, share experiences, and ask advice.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 10950-10957
  quote_or_summary: The domestic hearth’s holiness is shown by carrying fire, burning
    brands, or ashes from an old home to a new one; an earlier view held that fire
    should never go out, and Cheremiss light sacrificial fires with hearth brands.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 10957-10959
  quote_or_summary: If fire went out by itself, it was deemed an omen of misfortune.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 10959-10965
  quote_or_summary: Volga Finns believed fire’s power diminished if it burned too
    long and therefore renewed fires once a year by kindling new fire or wood fire
    through rubbing two dry sticks together.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 10965-10968
  quote_or_summary: The new fire is supposed to contain specially purifying magic
    power.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: 10968-10974
  quote_or_summary: Cheremiss extinguish all village hearth fires on an agreed date
    in the hottest part of summer, at the close of the evil time, draw forth a new
    fire, and make a log fire at the village edge.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: 10974-10982
  quote_or_summary: People jump over the village-edge log fire; cattle are driven
    through it; the fire site is often a meadow gateway, with rowan branches bound
    to the gate for magical reasons.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: 10982-10987
  quote_or_summary: The log fire burns for two or three days, and each householder
    carries new fire from it home to the hearth while smoking out the stockyard.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: 10988-10993
  quote_or_summary: Mordvins sometimes lit similar fires at the forty days’ feast
    for the dead, where those present cleansed themselves by jumping over the fire.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:23
  type: summary
  locator: 10993-10999
  quote_or_summary: A more widespread custom uses similar purification during an epidemic;
    a furrow is also ploughed around the village or a plough carried around it.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:24
  type: summary
  locator: 10999-11004
  quote_or_summary: The passage says Finnish Spring and Midsummer-Eve bonfires originally
    had prophylactic significance; an Ingrian account says they were made on pasture
    land visited by cows.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
  rights_note: Public domain source; summarized.
- id: ev:25
  type: summary
  locator: 10947-10949
  quote_or_summary: The passage states that similar tales are found among the Turco-Tatars.
  source_text_path: texts/public-domain/finnic/internet-archive/finno-ugric-siberian-mythology-holmberg.md
