canonical_text:
  quote: ''
  summary: The passage surveys beliefs and customs concerning fire among Cheremiss,
    Ostiaks, Mordvins, Finns, Esthonians, Volga Finns, and related groups. Fire is
    treated as a helpful but easily angered and pure being, often addressed as Fire
    mother, Fire girl, Fire woman, or Fire maiden. Offenses against fire include spitting
    into it, wounding it with sharp instruments, defiling it with unclean sticks,
    throwing wood carelessly, or speaking evil words. Fire can punish offenders with
    disease or destructive outbreak and can be appeased with prayers and offerings.
    The passage also describes fire’s soul or spirit appearing as sparks, animals,
    or human-like beings, the holiness and continuity of the domestic hearth, annual
    renewal of fire by friction, and purificatory uses of new fire in seasonal, funerary,
    and epidemic contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cheremiss say fire is a friend of humans because it warms the house and
    cooks food, but it can become angered and burn a house or village.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Acts said to anger fire include spitting into it, wounding it with a sharp
    instrument, stirring it with an unclean stick, throwing wood onto the hearth,
    and addressing it with evil words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that fire was probably regarded as pure and unable to endure
    defilement.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A common punishment for offending fire is described as a skin disease, after
    which the fire must be appeased by small sacrifices.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Cheremiss prayer asks Fire mother for forgiveness for possibly spitting
    in, wounding, or defiling her and asks to be made well again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: During a dangerous outbreak of fire, Cheremiss people go around the fire and
    sacrifice a black hen or milk from a black cow to Fire mother while praying that
    the village not be destroyed and that people be protected from future loss by
    fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Ostiaks call fire Fire girl or Fire woman in prayers and offer victuals,
    red or fire-colored cloths, and pieces of stuff to appease it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the offerings to the Ostiak Fire girl or Fire mother are
    intended as clothing, but that the worshiped object is the animated fire itself.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mordvin, Ostiak, and Cheremiss expressions describe Fire mother with flames,
    many tongues, smoke, and a sharp tongue.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Cheremiss people sometimes speak of the soul of fire, which disappears if
    water is poured over the fire.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Among the Cheremiss, putting out fire with water is described as unseemly;
    instead, wood is drawn aside so the fire goes out by itself.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The soul or ruler of fire can appear to humans, including as glittering sparks
    before an accident in Finnish belief and as an animal warning before a coming
    fire in Esthonian belief.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Esthonian examples name a Fire cock or Fire cat seen moving over a roof shortly
    before a destructive fire.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Ostiak tales say the Fire spirit can take human form; one tale has a man who
    treated fire badly see the Fire girl sitting naked and wounded on a stone.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Another Ostiak tale says every hearth has its own Fire maiden, and these maidens
    can visit one another, share experiences, and ask advice.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:16
  text: The holiness of the domestic hearth is shown by carrying fire, burning brands,
    or ashes from an old home to a new one.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: An earlier view held that fire should never be allowed to go out, and the
    Cheremiss still light sacrificial fires with brands from the hearth.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: If a fire went out by itself, it was considered an omen of misfortune.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:19
  text: The Volga Finns renewed their fires once a year by kindling a new fire or
    wood fire through rubbing two dry sticks together.
  category: action
  evidence_refs:
  - ev:17
- id: obs:20
  text: The new fire is said to contain specially purifying magic power.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:21
  text: At an agreed summer date after the evil time, Cheremiss villagers extinguish
    all village hearth fires, draw forth new fire, and make a log fire at the village
    edge.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:22
  text: People jump over the log fire, cattle are driven through it, and rowan branches
    are bound to a meadow gateway for magical reasons.
  category: action
  evidence_refs:
  - ev:20
- id: obs:23
  text: From the log fire, each householder carries new fire home to the hearth and
    smokes out the stockyard.
  category: sequence
  evidence_refs:
  - ev:21
- id: obs:24
  text: Mordvins sometimes made similar fires at the forty days’ feast for the dead,
    where attendees cleansed themselves by jumping over the fire.
  category: action
  evidence_refs:
  - ev:22
- id: obs:25
  text: During an epidemic, a similar purifying fire may be used, and a furrow may
    be ploughed around the village or a plough carried around it.
  category: action
  evidence_refs:
  - ev:23
- id: obs:26
  text: An Ingrian account says Finnish Spring and Midsummer-Eve bonfires were intended
    to be made on pasture land visited by cows.
  category: setting
  evidence_refs:
  - ev:24
