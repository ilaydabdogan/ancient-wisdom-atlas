canonical_text:
  quote: ''
  summary: 'The passage surveys Volga and Baltic Finnic memorial feast customs: verbal
    invitations to the dead, food and drink offerings at coffins, gates, tables, doorways,
    and graves, dog-omen interpretations, and former funeral sacrifices of domestic
    animals, especially horses and cows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The names of the dead are mentioned with an appeal to eat, drink, and receive
    the lately deceased into their company.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Esthonians preparing to take a dead person to the grave cook beans or peas,
    pour ladlefuls onto the coffin, and place other food such as white bread on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In some Esthonian places, beer or gin is poured on the ground by the gate
    while the deceased is being taken away, so that the deceased should not suffer
    thirst in the life to come.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Volga Finn funeral meals are often prepared after return from the graveyard;
    attendees bring food, and the dead are told what each person has brought.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dish is set at the table for the newly buried where he is supposed to sit,
    while a trough is placed by the door for those who died earlier.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wax tapers are lit for remembered dead, including near and distant relations,
    and the ruler of the kingdom of the dead and the ruler of the graveyard are also
    remembered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first cup and first morsels belong to the dead, and anything that falls
    under the table is not to be picked up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food sacrificed to the deceased is later taken into the yard for dogs; refusal
    to eat is taken to mean the dead are dissatisfied, and fighting dogs are taken
    to mean the dead disagree among themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Earlier deceased relations are said to arrive to meet the newly deceased,
    and the place by the door is believed to be their residence during the memorial
    feast.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Food is taken to the graveyard and crumbled over the grave; in some places
    a pit above the head of the dead is filled with gin, honey-drink, or water while
    the Siryans say, “Drink, drink.”
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Volga Finns now seldom kill larger animals than poultry
    for memorial feasts, but cites older reports of Cheremiss horse killing at rich
    men's burials.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A reported Chuvash and Cheremiss rite for an important deceased person includes
    shooting at a ring, the successful shooter riding a horse three times to the grave
    and back, after which the horse is killed, boiled, and eaten in memory of the
    deceased.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that Baltic Finns formerly killed large domestic animals
    in honour of the dead and notes cow-related funeral customs among Finns and Esthonians.
  category: action
  evidence_refs:
  - ev:9
