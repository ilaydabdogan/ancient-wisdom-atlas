canonical_text:
  quote: ''
  summary: The passage describes duties of the living toward the dead, including memorial
    feasts, drink rites, offerings at graves, and reindeer sacrifices. It reports
    that neglected dead may return as home-visitors, and it distinguishes some Lapp
    practices as later Scandinavian customs while treating the reindeer sacrifice
    as an original Lapponian usage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the dead continue to need help and care from the living
    after burial.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a dead person is not given his rights, he may resent it, return, disturb
    survivors, make noises, or attack children when a memorial feast has not been
    arranged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Esthonians call dead persons who haunt old homes “home-visitors” or Kodukaiat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Memorial feasts may be general for deceased relations or special for a particular
    deceased relative; the first such feast occurs on the burial day and is also a
    burial feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Lundius’s report on Swedish Lapps, mourners drink funeral beer, dip their
    fingers into it, smear their faces, and praise the dead man’s qualities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Randulf’s report on Norwegian Lapps, people dip three fingers into beer
    or gin and make a cross on the forehead or three dots on the breast in order to
    get dead relations to protect them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage identifies the memorial drink and three finger-marks among the
    Lapps as a later Scandinavian custom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The reindeer that conveyed the dead man to the cemetery is killed three days
    after the funeral, in his honour, and eaten with relations and dependants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sacrificed reindeer’s bones are collected in a chest, buried in the earth,
    and marked by a wooden image sized according to the dead man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Three blood-smeared rods with pieces of the reindeer’s heart and lungs are
    also described as buried with the bones.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the funeral feast, tobacco or other things liked by the deceased may
    be taken to his grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: For a rich deceased man, reindeer may be killed in his honour one, two, or
    three years after death; the bones are hidden in the earth, and a black thread
    is sewn into the ear of the reindeer chosen for sacrifice.
  category: sequence
  evidence_refs:
  - ev:7
