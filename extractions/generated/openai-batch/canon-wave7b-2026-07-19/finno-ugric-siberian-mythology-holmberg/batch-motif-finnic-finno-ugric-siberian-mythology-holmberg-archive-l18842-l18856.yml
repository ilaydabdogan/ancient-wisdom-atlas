canonical_text:
  quote: ''
  summary: 'The passage surveys several interpretations of the Pleiades: as openings
    or a sieve through which cold upper air passes, as a group of animals, as a bird
    or duck nest among northern Siberian peoples, and as monkeys or a monkey among
    some Central Asian peoples. It then begins an Altai Tatar story in which Metshin
    lived on earth in a time of severe cold, leading the camel and the cow to decide
    to kill him.'
