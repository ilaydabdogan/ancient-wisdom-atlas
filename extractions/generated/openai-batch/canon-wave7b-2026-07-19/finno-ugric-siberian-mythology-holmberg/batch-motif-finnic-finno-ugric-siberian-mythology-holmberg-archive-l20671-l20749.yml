canonical_text:
  quote: ''
  summary: The passage surveys beliefs attributed to Yenisei Ostiaks, Yakuts, and
    Buriats concerning souls as small beings, divine souls descending during the sleep
    of Tengeris, dream travel by the shadow-soul, animal forms of the sleeper's soul,
    sickness as involuntary soul absence, soul capture by malicious spirits, shock-induced
    soul loss, and recovery through ceremonies or shamanic soul-finding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that the Yenisei Ostiaks, like the Yakuts and Buriats, imagine
    the referenced soul-entity as a little being visible especially to shamans.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Buriats, Tengeris are said to sleep for long periods, and their
    souls appear on earth and are born as human beings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The timing of a Tengeri soul's descent is said to affect whether the human
    host soon dies or lives to old age, because the soul must return to its heavenly
    owner before the owner awakens.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The human shadow-soul is said to leave its dwelling-place during life and,
    in dreams, travel to distant places, strange races, through locked doors, and
    among deceased companions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buriats are said to treat the soul's dream experiences as remembered events
    that allow the awakened person to report what the soul saw or heard.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wandering released soul is described as an actual, partly material being
    that may be visible and audible to others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The sleeper''s soul may take animal form: Yakuts say it wanders as a little
    bird or butterfly, and a Buriat tale has it leave the mouth as a bee or wasp.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sickness is said to be caused by the temporary absence of the soul from the
    body, with the soul driven out against its will.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A malicious spirit may carry off the soul, often to obtain a sacrifice, and
    evil spirits are said to hunt souls during the stillness and darkness of night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A threatened soul may seek help from deceased friends or protecting spirits,
    or hide in animal fur, leafy trees, or other objects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A soul pursued too long may lose its way in deep forests or other strange
    places, and a seized soul may be heard weeping and crying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A shock may drive the soul unwillingly from the body; if the soul is not attended
    to quickly, it wanders farther away and the victim becomes increasingly ill and
    may die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Children's souls are said to be easily driven away by fright, with symptoms
    including fatigue, paleness, tears, and restless sleep.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The place where the soul left its dwelling-place is to be sought; if the soul
    is won back by special ceremonies, the sick person recovers, while a shaman may
    be needed to find lost and wandering souls.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
