  summary: The passage describes Yakut and Ostiak beliefs about a birth-giving mother
    deity who grants children, life, and fate, along with post-birth rites for the
    goddess. It then begins a chapter on stars, describing the Great Bear, Pole Star,
    and Pleiades as guides and signs for time, seasons, and weather among Altaic and
    other peoples.
