literal_observations:
- id: obs:1
  text: Yakut prayers name the goddess of birth Ajysyt, Ajy-Khotun, or Ajysyt-Ijaksit-Khotun,
    and children are prayed for from her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goddess is described as birth-giving and nourishing, and in some districts
    she is believed to pour a white elixir of life down from Heaven to someone in
    the throes of death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tale says that during severe birth-cramp a woman prays to the Heavens; two
    Ajysyts descend to earth, assist her, and she gives birth to a son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says people generally speak of one goddess who brings the child’s
    soul from Heaven; mortals produce only the embryo, while life is furnished by
    Ajysyt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A prayer addresses a mild Creatress who let the speaker down to the central
    place, identified as earth, and provided breathing, eternal life, flourishing
    cattle, and many children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ostiaks believe that the great Birth-giving mother dwells in Heaven on
