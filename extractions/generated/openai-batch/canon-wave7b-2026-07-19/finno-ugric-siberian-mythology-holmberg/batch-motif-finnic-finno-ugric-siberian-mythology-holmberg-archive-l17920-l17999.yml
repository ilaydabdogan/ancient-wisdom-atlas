canonical_text:
  quote: ''
  summary: The passage surveys sacred numbers seven and nine in Asian, Finno-Ugric,
    and Siberian religious traditions. It describes number-marked sacrifices, seven
    heavenly gods or planetary interpreters, the heavens and fate-books as sources
    of future knowledge, and Ostiak and western Tatar beliefs in divine assistants,
    Kudai, and a “Writer man” who record births, deaths, lifespans, and human fate
    under the Heaven god.
  language: English
  quote_policy: summarized
