canonical_text:
  quote: ''
  summary: 'The passage describes Siberian and Finno-Ugric ideas of the realm of the
    dead: difficult soul journeys, shamanic escort and rescue, animal transport, mapped
    routes through rivers, mountains, swamps, monster bodies, seas, northern or downward
    regions, villages of the dead, and hostile rulers or spirits who seize souls and
    may be appeased by sacrifice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul may fail on its final journey; if it does, the shaman is blamed, and
    a better shaman may locate the place of failure, wake the soul to life again,
    and escort it to the village of deceased relations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'For reindeer-keeping Goldes, nine reindeer escort the deceased to the underworld:
    eight carry the deceased''s property and the deceased rides the ninth.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The saddle on the ninth reindeer is made so that the soul cannot fall off,
    and the shaman is said to take the form of this reindeer or represent its soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman describes the districts of the afterlife journey in songs and ceremonies,
    leading the soul through river source, mountains, forest, swamp, torrent, and
    signs of habitation before the village of the dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The village of the dead is described with rising smoke, rows of tents, and
    feeding reindeer, resembling the life of living Reindeer-Tungus.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Yakut account says spirits in the realm of the dead live in circumstances
    similar to earthly life and, in one district's information, are divided into six
    clans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In certain Yakut tales, the soul reaches the other world by entering the throat
    of a snake-like monster, passing through its body, and coming out from its tail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The monster's gullet and intestines are said to be covered with sharp spikes;
    the soul therefore needs clothes and shoes, and a horse is supplied to make the
    passage quicker.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yakut shaman songs describe the underworld road as passing through stormy
    rivers, bloody streams, burning forests, and icy winds.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A common Yakut idea places the other world beyond the death-sea, and many
    North Siberian peoples place the realm of the dead in the north, often at river
    mouths flowing into the Arctic Ocean.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yakut tales locate Arsan-Duolai down in the north, in a chasm with frozen
    fields, cold summer dwellings, and gloomy huts; he has a mouth in the middle of
    his forehead and eyes at his temples.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Abasy serve Arsan-Duolai and sometimes raid villages of the living, carrying
    off or swallowing souls and spreading sickness; shamans appease them with bloody
    sacrifices.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ugrians and Yenisei Ostiaks are said to speak of an evil Prince of the dead
    in the north who carries off or devours souls.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Yenisei Ostiak beliefs mentioned in the passage place the dead at naked rocks
    in the Arctic Ocean and also in an under-earth grotto or in seven grottoes under
    one another.
  category: setting
  evidence_refs:
  - ev:9
