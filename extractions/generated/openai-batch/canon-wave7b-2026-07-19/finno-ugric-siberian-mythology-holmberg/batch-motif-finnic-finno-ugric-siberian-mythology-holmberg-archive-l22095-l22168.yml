canonical_text:
  quote: ''
  summary: The passage surveys Yakut, Dolgan, Goldes, Buriat, and Tungus material
    concerning shaman animals, soul-animals, animal helping spirits, and images of
    such beings. It describes life-dependence between a shaman and a single animal
    counterpart, animal conflicts corresponding to shaman conflicts, animal escorts
    to the other world, taboos on killing certain animals, a Buriat story of a blind
    fish identified as a shaman’s soul, and animal images including a winged iron
    deer or reindeer with a human rider.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yakuts call this kind of shaman animal ija-kyl, glossed as “mother-animal”;
    the animals may be of varying species, with stag, stallion, bear, and eagle named
    as mighty examples, while wolf and dog are described as unlucky.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that the dog as a shaman animal does not leave the shaman
    in peace but gnaws at his heart and tortures his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The appearance of a new ija-kyl is said to indicate the appearance of a new
    shaman, and only shamans can see these animals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When shamans quarrel, their animals fight; an animal war may last months or
    years, and the shaman whose animal wins emerges whole, while the death of an animal
    causes the death of its shaman owner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among Dolgans described as under Yakut influence, each shaman has only one
    ija-kyl on which his life and death depend, despite having many animal-shaped
    helping spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The Dolgan ija-kyl is said to appear to the shaman at most three times: at
    his call to shaman office, in the middle of his activity, and immediately before
    his death, when the spirit also dies.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Dolgan mother-animal remains in the same place; a strange enemy shaman
