canonical_text:
  quote: ''
  summary: The passage describes Finno-Ugric and Siberian rites and deities connected
    with fertility, animal increase, childbirth, soul-giving, and lifespan. Cheremiss
    rites address Earth-, Cattle-, and Sheep-fructifiers through sacrifice, water
    sprinkling, milk feasts, and mimetic sheep behavior. Ostiak and Vogul traditions
    describe heavenly female birth deities who create souls, protect childbirth, and
    determine or record a child's fate and length of life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deities of fruitfulness are said to receive sacrifices in the same manner
    as the souls of the things they fructify; a black sheep is offered to the Earth-fructifier
    and its bones are buried in the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cheremiss worship the Cattle-fructifier especially after cows have borne
    calves, inviting others to a cow's-milk feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the cattle rite, the host pours water on the oven, sprinkles bystanders
    with water, and prays for the calf's growth, abundant milk, and a large herd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In an Eastern Cheremiss sheep-increase rite, a wild bird, or alternatively
    a hen, is used as a sacrifice, and the participants go to the sheepfolds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Boys and girls follow the host and hostess on all fours, imitate the movements
    and voices of sheep, and boys butt at girls in imitation of rams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the sheepfold, the host makes a fire, the children crawl around it baaing
    three times, the bird is cooked and eaten, the bones are thrown onto the roof,
    and prayers are offered to the Sheep-fructifier.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The account states that chiefly girls, rather than many boys, are invited
    to the sheep ceremony so that too many rams will not be born in the flock.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Ostiaks and Voguls pray for children and aid in childbed to a being dwelling
    in Heaven.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Vasyugan, Puges is called the daughter of the Heaven god and is said to
    live in a golden house whose roof holds seven cradles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: When Puges rocks one of the cradles seven times a soul is created; if the
    cradle overturns, the soul born will not live long.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The road to Puges's dwelling is described as passing over seven seas to a
    mountain made of seven stories.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:12
  text: Around Surgut, Vagneg-imi is associated with seven cradles and is described
    in old stories as the mother of the seven sons of the Heaven god.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Vagneg-imi holds a wooden staff with threads for each person born; at a child's
    birth she knots one thread, and the distance from knot to staff indicates the
    child's unalterable length of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The Kaltas or Kaltes mother protects the one giving birth and the child and
