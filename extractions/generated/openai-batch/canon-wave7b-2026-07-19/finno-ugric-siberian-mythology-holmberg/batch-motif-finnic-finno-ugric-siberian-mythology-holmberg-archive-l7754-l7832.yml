canonical_text:
  quote: ''
  summary: The passage describes Cheremiss and Mordvin household, yard, bath-house,
    mill, threshing-barn, dwelling-place, and village spirits. It notes offerings
    made to some of them, their anthropomorphic or gendered forms, their locations
    within domestic or work buildings, and a belief that buildings and dwelling-places
    themselves may be animated or possess a soul. It also states that Cheremiss household
    spirit beliefs show Russian influence and notes related East European Turco-Tatar
    beliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cheremiss spirit called Vit'sa-oza, translated as “Cattleyard ruler,” is
    said not to be named in prayers, where the Cheremiss instead address the “man”
    and “woman.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cheremiss bath-house spirit Mot'sa-oza is most often regarded as an evil
    spirit that disturbs bathers and is not worshipped, but butter is set on the benches
    when a new bath-house is heated for the first time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the first-heating butter ceremony, the person making the offering addresses
    the “Bath-house man” and tells him to eat the butter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The watermill spirit Vaks-oza can appear in human form, sometimes male and
    sometimes female; the female form is described as decorated over the breast with
    silver coins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mill spirit lives in the mill under the floor or behind the water-wheel
    and is described as friendly to the miller, whom it helps.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the mill spirit is angry and grinding goes badly, the miller sets out
    porridge as a sacrifice, with a pat of butter and a spoon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Cheremiss say the miller can interpret the current needs of the mill spirit
    from the difficulties affecting him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A human-shaped spirit is said to dwell in the threshing-barn; the “Threshing-barn
    man” or “woman” appears early in the morning and disappears when approached.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Drink-offerings are made to the threshing-barn man and woman in sacred-grove
    ritual, they are remembered at harvest festivals, and a blood-offering may be
    made to them at the threshing-barn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Cheremiss household spirits show plain marks of Russian
    influence and that similar influence is evident in corresponding East European
    Turco-Tatar beliefs.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Erza Mordvin Kardas-sarko, or “Yard-sarko,” lives beneath a courtyard
    stone and is generally represented as male, though sometimes female.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that Cheremiss and Mordvin beliefs include the animation
    of buildings themselves.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Mordvinian examples address the house as a being: a newly married girl speaks
    to the house, and magic prayers address the “House mistress” and “House mother.”'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Mordvin household spirit Kud-ava or Kudazerava is said to be originally
    the house itself, though the terms may sometimes be used similarly to the Russian
    Domovoy.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Mordvins also speak of a dwelling-place mother or mistress, bath-house
    mother, mill mother, and village mother.
  category: other
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Cheremiss regard the dwelling-place and connected objects as animated,
    impressionable, and capable of feeling.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: The Cheremiss believe the ancient dwelling-house kudo and the more modern
