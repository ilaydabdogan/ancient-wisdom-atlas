  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The fence may be made of sticks, boards, or plaited branches, and a small
    board gate is open only during sacrifices.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: One observed lud was divided into an inner area for the guardian and assistants
