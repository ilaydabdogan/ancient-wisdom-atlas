  text: The Votiaks are said to have forest copses consecrated to ancient heroes and
    called lud.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earlier lud were hidden in forests, often fir forests; later, as forests diminished,
    some consecrated groves stood visibly on open plains.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tall trees of the sacrificial groves are described as sacred from generation
    to generation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lud are always fenced, whether located in forests or on open plains.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: No one is to enter a lud without due reason and without bringing an offering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cattle may not enter; branches may not be broken; sticks may not be taken;
    disturbance and shooting game that seeks shelter there are forbidden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women and children avoid the lud altogether, and strangers are not permitted
    to enter the sacred area.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: An angered spirit associated with the sacred area is said to cause severe
