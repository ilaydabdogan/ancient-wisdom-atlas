canonical_text:
  quote: ''
  summary: The passage surveys Central and Northern Asian accounts and beliefs about
    the sun, moon, and stars. It includes a Buriat tale in which the Lord of the Earth
    obtains the sun and moon from the god of Heaven, confines them in a box, and darkens
    nature until a porcupine wins them back. It also describes Turco-Tatar porcupine
    traditions, Altaic Tatar and Dolgan accounts of the creation of the sun and moon,
    gendered and living conceptions of the heavenly lights, worship and oath practices,
    calendrical use of lunar phases, and weather omens involving the moon.
  language: English
  quote_policy: summarized
