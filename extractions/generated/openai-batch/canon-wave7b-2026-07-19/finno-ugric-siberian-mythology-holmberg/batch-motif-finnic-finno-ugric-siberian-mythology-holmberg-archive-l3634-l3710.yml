canonical_text:
  quote: "“the dead in battle, who, as spirits, still continue battling with one another
    in the air”"
  summary: 'The passage surveys Finno-Ugric, Sámi/Lapp, Ostiak, Estonian, Karelian,
    Chukchee, Tlingit, and Scandinavian-related beliefs about the Life Beyond: violent
    or battle-dead may go to heaven, the sky, or the Northern Lights and continue
    fighting; natural deaths may pass through worship of a stern under-earth god;
    a hero''s soul ascends and returns; a great oak or Milky-Way-like tree trunk may
    serve as a bridge for the battle-dead; and unburied, hidden, drowned, or forest-lost
    dead may remain as restless ghosts.'
