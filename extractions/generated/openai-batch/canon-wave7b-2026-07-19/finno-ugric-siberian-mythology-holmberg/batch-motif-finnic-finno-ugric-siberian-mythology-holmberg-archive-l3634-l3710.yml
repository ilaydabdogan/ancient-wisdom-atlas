literal_observations:
- id: obs:1
  text: Those who meet violent death or are killed in a fight with a bear are said
    to go immediately to heaven, while those who die natural deaths must worship a
    stern god under the earth before they can go to heaven.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an Ostiak song, an unconscious hero's soul leaves the body, climbs a narrow
    stairway to heaven, meets three red-legged squirrels, is told to go back, and
    returns to the body as consciousness returns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another story says that a hero in heaven receives permission from the Heaven
    god to return to earth to help comrades in difficulty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Finnish Lapps identify the Aurora Borealis with the dead in battle continuing
    to fight in the air, and Russian Lapps identify it with spirits of the murdered
    who gather in a house and begin slaughtering one another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Lapps fear the Aurora Borealis, and that the murdered
    spirits associated with it are afraid of the sun and hide from its rays.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Esthonians see the Northern Lights as a heavenly war; on Osel, two armed fighting-men
    are said to appear during holy nights when the heavens open, but God separates
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Karelian magic songs sometimes name Pohjola as the residence of those killed
    without sickness, whose inhabitants have blood-dripping garments.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a variation on the Great Oak song, the oak grows so high that sun and moon
    cannot shine on earth, is chopped down, and falls across Pohjola's river as an
    everlasting bridge for those killed without sickness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author connects the Great Oak bridge to an idea of the Milky Way as the
    trunk of a great tree along which those killed in battle wander.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Chukchee are said to regard the Northern Lights as a dwelling chiefly
    for those who died violently, and the Tlingits are said to place battle-killed
    souls in the sky, where they battle as flames of the Northern Lights.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Not all dead attain the Life Beyond; the souls of hidden killed children,
    and those lost in forests or drowned without peaceful burial, become homeless,
    restless spirits.
  category: relationship
  evidence_refs:
  - ev:9
