canonical_text:
  quote: Its roots stretch through Hades and its crown pierces the nine heavens.
  summary: The passage presents a Yakut account of Ar-soghotoch, the Lonely Man, dwelling
    near a vast tree of life whose roots extend to Hades and whose crown reaches the
    nine heavens. Water, sap, and resin from the tree restore youth and health. A
    white-haired tree-spirit goddess reveals the Lonely Man's divine parentage, gives
    him water from beneath the roots in a bladder, and this water later heals him
    after a dragon wounds him during a courtship journey. The author also compares
    these ideas with tree- and water-of-life traditions in the Bible and other ancient
    cultures.
  language: English
  quote_policy: quoted
