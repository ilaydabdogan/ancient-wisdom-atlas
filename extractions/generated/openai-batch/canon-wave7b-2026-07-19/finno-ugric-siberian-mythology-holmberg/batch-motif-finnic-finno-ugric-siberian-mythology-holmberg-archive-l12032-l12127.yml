canonical_text:
  quote: ''
  summary: 'The passage describes Cheremiss sacrifice-groves and communal sacrificial
    festivals to Nature gods: their political and communal role, timing, planning
    by priests, selection and marking of sacrificial animals, collection of funds,
    and the duties and hierarchy of priests called kart.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each sacrifice-area has a special name, often taken from the village near
    its grove, and the term tiste-kerge also has communal significance among the Cheremiss.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During periods of great trouble, war, or famine, several sacrifice-areas may
    assemble, according to a seer's directions, for larger mutual sacrificial feasts
    in an old grove.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says such large gatherings may last one or two weeks, involve
    as many as a hundred sacrificed animals, and include about a thousand members
    of the sacrificing congregation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The groves sacred to Nature gods contain no buildings for preserving sacrificial
    offerings or idols, and the passage states that images of Nature gods were probably
    never made by these peoples.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Great festivals for Nature gods are generally held in summer before hay-making
    or after harvest, and may recur after longer intervals such as three or five years
    rather than annually.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before a mutual sacrificial festival, villages in the area send priestly representatives
    to decide the day, the sacrificial animals, and how those animals will be procured.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sacrificial animals must be one colour, healthy, not too old, and untainted
    by labour or procreation; even a goose or duck that has sat on eggs may not be
    used.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a prospective sacrificial animal shivers when looked at, this is treated
    as a good omen.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the sacrificial animal is chosen, a long narrow towel is tied around
    its neck to mark it as set aside for a sacred purpose, and during the sacrifice
    the towel is hung in the sacrifice tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Funds for the victim are collected from all farmers in the area as voluntary
    gifts, and each head of a family considers it a duty to contribute according to
    means and condition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A special functionary called the cashier handles and accounts for the sacrificial
    funds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The number of sacrifices depends on the people's prosperity, and the sacrificing
    priests decide together which gods will receive sacrifices in each separate case.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cheremiss priests are called kart, meaning old man, and are chosen with regard
    to trustworthiness, knowledge of sacrificial ceremonies, and ability to recite
    prayers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Where there are several priests, the oldest or most capable is called the
    great karty and the others small kart; at multi-village sacrifices, priests discuss
    ritual order and which god each priest will pray to.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: During the ceremony the priests stand in line in the sacred grove, each under
    his own sacrifice tree.
  category: setting
  evidence_refs:
  - ev:7
