canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and neighboring beliefs about forest spirits.
    It describes forest spirits that change apparent height, female forest virgins
    with beautiful fronts and nonhuman backs, named Karelian game spirits, ant-hill
    offerings and under-earth ant-like beings, forest-bewitchment causing people or
    cattle to become lost, Cheremiss beliefs that those who die in the forest become
    dangerous forest spirits, and Votiak offerings in which the dead are remembered
    together with forest spirits.
  language: English
  quote_policy: summarized
