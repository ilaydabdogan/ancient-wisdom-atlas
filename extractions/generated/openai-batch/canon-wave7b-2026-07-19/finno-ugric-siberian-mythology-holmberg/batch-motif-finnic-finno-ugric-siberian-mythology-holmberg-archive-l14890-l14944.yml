  summary: The passage contrasts primordial-ocean earth-origin tales with Altaic and
    Siberian local explanations for landscape features. It recounts a Kirghis tale
    in which a great ox digs for water and forms lakes and rivers; a northern Siberian
    mammoth tale in which a giant animal makes the earth uneven and is drowned by
    God; and a North-East Siberian tale in which God bends the thin earth while traveling
    on skis.
