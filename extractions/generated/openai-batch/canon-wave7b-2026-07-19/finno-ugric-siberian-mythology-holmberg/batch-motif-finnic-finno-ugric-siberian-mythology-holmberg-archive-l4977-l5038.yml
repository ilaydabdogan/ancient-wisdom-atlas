canonical_text:
  quote: ''
  summary: 'The passage describes Lapp sacrificial customs connected with Seides:
    reindeer sacrifices with eastward orientation, ritual cleansing, holy sacrificial
    food, stuffed reindeer hides, offerings of other animals and fish, votive interaction
    with stones, later offerings of money and small objects, and an authorial comparison
    of Seides with house/family gods and hero-like spirits among related peoples.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Russian Lapp sacrifice was to begin early in the morning; prayer was made
    facing east, the flesh was eaten, and the hide with horns and hoofs was arranged
    with birch branches on a pole like a living reindeer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large reindeer sacrifices could involve many animals over several days; participants
    cleansed themselves, wore clean garments, avoided spilling holy food, and the
    shaman stood apart facing east while the prepared hides also faced east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Besides reindeer, Lapps are described as offering birds, game, domestic animals,
    dogs, living animals placed in chasms, grottoes, or islands, and there are reports
    of child sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fisher Lapps are described as feeding Seides with fish; a fisherman kissed
    the stone three times, promised intestines and livers if successful, and fulfilled
    the promise after a catch.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Later reports describe Norwegian Lapps secretly smearing stones and offering
    money, brass rings, tobacco, and similar objects in small hollows in stones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The passage states that, among related peoples, open-air Seide worship contains
    two classes of spirits: house or family gods that move into dwellings and hero-like
    spirits for whom small bothies are built.'
  category: relationship
  evidence_refs:
  - ev:6
