canonical_text:
  quote: ''
  summary: 'The passage discusses thunder-related beliefs and tales: Indo-Iranian
    stories of an eagle bringing Haoma or Soma from the sky for Indra; a comparison
    with Buriat and Northern Siberian ideas in which thunder may be regarded as a
    giant eagle-like bird; a Yakut tale in which a storm is followed by the descent
    of a fire-and-iron man resembling a personified thunderbolt; and Siberian and
    Buriat rain-related figures, including rainmakers, river-spring gods, and Khuran-Nojon
    with nine heavenly water-barrels.'
