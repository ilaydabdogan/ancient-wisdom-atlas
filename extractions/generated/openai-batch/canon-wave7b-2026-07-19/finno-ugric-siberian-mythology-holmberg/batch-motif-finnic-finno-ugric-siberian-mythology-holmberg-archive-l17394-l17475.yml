canonical_text:
  quote: ''
  summary: A scholarly survey describes Mongol, Altai Tatar, Chuvash, Tungus, and
    other Siberian beliefs concerning birth spirits, personal fate, stars linked with
    human life, Heaven as all-seeing judge and avenger, celestial or meteorological
    signs of Heaven's will, and rulers responding to such signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mongols call a birth-associated protective spirit Dzol-Dzajagatsi, and
    it remains with a person while he is in favor with the heavens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mongol protective spirit is said to watch over health, property, prosperity,
    and protection from dangers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: According to the Altai Tatars, each mortal has a Jajutsi that receives orders
    from above, brings life-force from a lake of milk in the third storey of Heaven,
    brings the embryo alive into the world, and follows the person as a good spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each mortal is also said to have a lifelong evil companion, Kormos, which
    tries to harm him from birth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Jajutsi is said to write down good deeds on a person's right shoulder,
    while Kormos notes evil deeds on the left.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Jajutsi are said to live, like the blessed dead, in paradise lands in
    the third storey of Heaven.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that beliefs in good and bad angels reached the Tatars
    from the Iranians.
  category: other
  evidence_refs:
  - ev:2
- id: obs:8
  text: A belief in a special heavenly arbiter of each mortal's fate is presented
    as closely related to the idea that each mortal has a star in the sky.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The appearance of a new star signifies birth, while the falling of a star
    signifies death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: When the Chuvash see a shooting star, they shout that their own star is still
    above.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Several North Siberian peoples, including the Tungus, are said to speak of
    the stars of each mortal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: Plano Carpini is cited as saying that the Mongol Heaven god is also the avenger.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Mongols are said to believe that Heaven sees everything and that no one
    can conceal actions from it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Mongol oaths invoke Heaven's knowledge or judgment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: The revenge of Heaven is described as occurring in this life, falling neutrally
    on princes and peasants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:16
  text: The passage compares Mongol sky signs with ancient Babylonian interpretations
    of signs in the sky as divine dissatisfaction.
  category: other
  evidence_refs:
  - ev:5
- id: obs:17
  text: For the Mongols, heavenly demonstrations include comets, meteors, years of
    famine, floods, and similar events that require rulers and subjects to review
    plans and submit to the eternal sky.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: A chronicle example says Mogan-Khan freed Chinese ambassadors and made peace
