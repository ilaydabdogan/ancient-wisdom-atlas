canonical_text:
  quote: ''
  summary: 'The passage describes thunder and wind deities in Finno-Ugric and Siberian
    comparative survey material: a thunder god armed with hammer or bow and arrow,
    Lapp/Sámi rites to Thor involving reindeer, blood, birch images, and hammer offerings,
    and several wind deities or personifications receiving sacrifices for mild weather,
    crops, livestock, flax, or travel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thunder god is described as having a hammer, or a bow and arrow, as arms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thunder god is regarded as driving away evil spirits, and the Lapps invoke
    thunder by beating drums and shouting to frighten such beings away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hora-galles is said at times to have a man-servant as assistant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rheen reports that a magic drum may indicate that a sacrifice to Thor must
    be made; the chosen reindeer-bull is bound behind the tent in an area where women
    are not allowed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The votive reindeer is killed by a knife-stab to the heart, and its blood
    is preserved to be smeared on Thor's image.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Images of Thor are made from birch stumps, with the root as head and trunk
    as body, and a hammer is placed in the image's hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: After slaughter, an offering-board is built behind the tents, birch branches
    are set around and strewn from the tent to the board, blood-smeared images are
    set up, cross-like marks are made on the images, and parts of the reindeer are
    arranged behind or before them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A grey woollen thread is sewn into the right ear of a reindeer chosen for
    sacrifice to Thor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: Large carved wooden hammers are sometimes offered to the Thunder god, smeared
    with sacrificial blood, and laid in mountain grottoes or sacrificed in mountain
    clefts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Votiaks sacrifice a goose to the Wind in sown fields and appeal to it
    to blow mildly over the seed; black or white victims are considered unsuitable,
    blood may be sprinkled in the air, and sacrifices may also occur during storms
    or in stock-yards to protect cattle-sheds and cattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Cheremiss and Mordvins sacrifice to Mother wind or Wind mother; the Mordvins
    say that when Wind mother's children are noisy, the storm begins.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Esthonians say the Wind god dwells in the forest on a shaded branch and
    is called Metsmees, or Forest man; Wind mother is said to weep when rain falls
    during a storm and to dance in whirlwinds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: At flax sowing, doves or a cock are sacrificed to Wind mother; Finnish prayers
    may address the wind, Wind woman, or Ilmarinen, who is described as later worshipped
    as Wind god, while a figure of Ilmaris is also reported on a Finnish Lapp magic
    drum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Lapps usually call the Wind god the Wind man, and the passage states that
    Scandinavian influence can be discerned in this cult.
  category: relationship
  evidence_refs:
  - ev:5
