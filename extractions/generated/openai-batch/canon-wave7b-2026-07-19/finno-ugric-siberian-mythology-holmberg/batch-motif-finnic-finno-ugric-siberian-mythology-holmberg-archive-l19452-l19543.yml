canonical_text:
  quote: ''
  summary: 'The passage surveys Siberian and Central Asian beliefs and rites concerning
    thunder and lightning: lightning is described as a fiery snake; several peoples
    address, fear, or propitiate thunder with speech, shooting, milk, kumiss, or sacrifice;
    Buriat rites treat lightning victims and struck places as sacred, return thunderbolts
    to the sky through a ritual called “the raising,” and describe heavenly first-milk,
    urak, as a rare blessing that must also be returned to heaven.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A winding streak of light across the sky is described as a fiery snake falling
    from Heaven, and the passage states that the same idea occurs in a Finnish poem
    on the origin of fire.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The most northerly Siberian peoples, except the Yakuts, are said not to sacrifice
    to the Thunder god; the Yenisei Ostiaks ask him during a storm to pass quietly
    without raising a tempest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Chinese chronicles are reported as saying that Northern Uigurs fear thunder,
    cry out and shoot toward the sky at each crash, leave and separate, then assemble
    the following spring at the lightning-struck spot and slaughter a ram there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Persian historian is reported as saying that Mongolians feared thunder and
    poured milk and kumiss on the ground while begging it not to harm dwellings or
    cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Altai Tatars are said to assemble village by village on high mountains at
    the first spring thunder and sprinkle milk toward the four points of the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lightning-struck human beings, domestic animals, and struck places are regarded
    as sacred in the passage.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: According to the Buriats, people and animals killed by lightning must be buried
    in the air on a platform built on four posts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If lightning strikes a house, the house must be moved, or rites called “the
    raising” must be performed to send the thunderbolt back into the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The raising rites occur on the third day after a thunderstorm and are conducted
    by a magician and eight assistants, who ride around the dwelling three times on
    horseback and stop at the door each round.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the raising rite, the magician holds a silver-fir branch and repeats
    a prayer while the assistants hold drinking-cups and sprinkle liquid from them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A felt carpet spread before the tent is raised by the eight assistants; an
    article resembling or representing a thunderbolt has been placed on the carpet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Molten tin is dropped into wine or milk to test whether the raising has succeeded;
    a single lump is treated as a favorable sign.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Buriats identify Tengeris as senders of thunderbolts and also say that
    they sometimes pour urak, or first-milk, down from the sky.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Urak is described as a thick yellowish-white liquid falling during a thunderstorm;
    receiving it is considered very rare and fortunate, and the recipient is believed
    to remain rich forever.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: When urak appears as a sign of heavenly favor, a magician witnesses it and
    determines from which Tengeri it came.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The urak is poured into a birch-bark vessel and placed on a high place so
    it is not defiled by the earth; it is believed able to rise into the sky again
    and, like a thunderbolt, must be returned to heaven.
  category: sequence
  evidence_refs:
  - ev:7
