comparison_claims:
- id: claim:1
  claim: The passage presents Mongol, Altai Tatar, Kirghis, and Northern Caucasian
    accounts as variants in a widespread complex involving the Great Bear figures,
    theft or protection of a child or maiden, and conflict with the Pleiades.
  claim_level: same_motif
  target: Great Bear theft/abduction and Pleiades pursuit variants across Mongol,
    Altai Tatar, Kirghis, and Northern Caucasian materials
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes the variants briefly, and the Northern Caucasian
    example reverses the emphasis by having the seven brothers save a child from the
    Pleiades rather than steal from them.
- id: claim:2
  claim: The passage explicitly connects the Buriat tale of seven heroes winning a
    maiden and becoming the Great Bear with the broader series of seven brothers and
    a little sister or star-maiden taken into the sky.
  claim_level: same_motif
  target: Buriat seven heroes and maiden catasterism within the seven brothers/little
    sister story series
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is based on the author's grouping within this survey passage;
    no independent parallel text is provided here.
- id: claim:3
  claim: The passage cautiously suggests that an ancient Greek Elektra tale shares
    the same story-motif as the Buriat and other Great Bear/Pleiades accounts because
    it explains the Pleiades as six stars and places a small displaced Pleiad near
    the Great Bear.
  claim_level: same_motif
  target: Greek Elektra as lost Pleiad beside the Great Bear compared with Alcor as
    stolen maiden-star
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The passage phrases the comparison cautiously and notes that the Greek
    account may have mixed two tales, including the robbing of a maid connected with
    the Trojan war and the robbing of a star.
