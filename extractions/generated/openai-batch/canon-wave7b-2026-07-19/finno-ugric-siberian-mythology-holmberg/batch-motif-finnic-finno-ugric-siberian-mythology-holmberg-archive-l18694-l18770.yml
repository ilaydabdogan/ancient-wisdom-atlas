canonical_text:
  quote: ''
  summary: The passage surveys tales and cultic notices about the Great Bear, the
    Pleiades, and Alcor. It describes the Great Bear as seven stars, old men, Burkhans,
    Khans, thieves, brothers, or heroes; explains Alcor as a stolen star, daughter,
    maiden, or Elektra; gives variants in which the Pleiades pursue or attack the
    Great Bear figures; recounts a Buriat tale of a bird-language healer and six gifted
    companions who win a Khan's daughter and are taken into the sky; and compares
    this with a Greek tale about Elektra leaving the Pleiades for the Great Bear.
  language: English
  quote_policy: summarized
