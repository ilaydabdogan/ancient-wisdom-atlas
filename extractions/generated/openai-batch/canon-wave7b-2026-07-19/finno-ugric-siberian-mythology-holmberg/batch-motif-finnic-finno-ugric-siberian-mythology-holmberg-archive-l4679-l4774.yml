- id: obs:3
  text: Rheen is cited as saying that Seide stones were set up on mountains, in clefts
    between rocks, or by rivers and seas, at places where ghostly noises had been
    heard.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Finnish Lapp report says that a man sleeping near a holy place dreamed of
    ghosts, animals, and human beings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that near these holy places one must not speak ill of the
    dead, because those underground become angry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lapps are said to believe that the Seide can appear to its worshipper
    in human form.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: An eighteenth-century sacrifice account says that a human-form being appears,
    joins the meal, speaks with the people, teaches new arts, and says he lives in
    the stone or mountain to which they sacrifice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lule Lapps are said to have seen the Seide as a well-built tall man in
    black, like a gentleman, holding a gun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Finnish Lapp story says a man intended to destroy his Seide because of poor
    fishing luck but stopped when it appeared before him in human form.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states a belief that the Seide is a human being turned to stone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Russian Lapmark account, an old woman's dead husband visited her at
    night after his death; she locked her door and smoked out the house, but did not
    gain peace from him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old woman told her troubles to a shaman, who promised to remain overnight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The shaman tidied the bothie, separated the woman's belongings, swept a clean
    place, and placed fish-bones in the corner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The deceased came in, placed himself on the swept place, and gnawed the fish-bones;
    the shaman took him by the hand and led him into the yard.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After returning, the shaman told the woman the deceased would no longer trouble
    her and told her to look at the sky the next morning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The next day the woman saw something black moving in the sky and sinking to
    the opposite shore of Puljarvi Lake; the visits ceased, and a Seide appeared near
    Puljarvi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Russian Lapps are said to have generally held the same views of Seides as
    of their dead.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: According to the reported Russian Lapp ideas, Seides live a life similar to
