canonical_text:
  quote: ''
  summary: The passage describes Seide stones and holy places among Lapp groups, including
    mountain and waterside locations, appearances of the Seide in human and animal
    forms, links between Seides and the dead, a Russian Lapmark account in which a
    shaman stops a dead husband's visits and a Seide appears near Puljarvi, and reported
    Russian and Swedish Lapp views of Seides as bird or stone spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption describes the holy Rastekaise mountain in Utsjoki in Finnish
    Lapland, with two large stones on its top, and says it is still regarded with
    awe by some people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seides are described as worshipped by Lapp families or clans as guardian-spirits.
  category: relationship
  evidence_refs:
