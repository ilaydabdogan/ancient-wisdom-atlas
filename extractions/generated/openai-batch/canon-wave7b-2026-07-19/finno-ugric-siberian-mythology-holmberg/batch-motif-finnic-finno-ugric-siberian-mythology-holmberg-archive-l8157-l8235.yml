  quote: ''
  summary: 'The passage surveys forest spirits among Lapp, Samoyed, and Ostiak groups:
    bird and forest masters, tailed forest beings, underground cattle-owners, child-changing
    beings, offerings, holy places, carved images, and comparisons with Russian and
    Scandinavian figures.'
