literal_observations:
- id: obs:1
  text: A protecting spirit of birds is named Loddis-edne, glossed as Birdmother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eastern Lapps' Miehts-hozjin, also called Vare-jielle, is described as
    a black being with a tail and as a Master or Dweller of the forest.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Miehts-hozjin does not harm humans unless provoked; shouting, singing, or
    making noise in the forest offends him, after which he bewilders the culprit so
    that the person cannot find the way out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Western Lapp Ganis or Gidne appears in the forest; from the front it resembles
    a beautiful maiden, while behind it has a long tail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Forest maiden serves Lapps by gathering scattered reindeer and assisting
    with the milking of reindeer-cows, and is sometimes said to desire sexual intercourse
    with a Lapp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gufittar is described as an underground dwarfish being living in the forest
    or on mountains, sometimes appearing on earth with fine cattle herds and bells
    on the cattle.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person can approach Gufittar boldly without looking aside and show or throw
    iron over the cattle; the spirit then disappears underground and the cattle become
    the person's property.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Uldda is an underground being that appears with cattle, changes children left
    alone, disturbs people settled on its territory, and receives drink-offerings
    poured on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that it is uncertain whether Lapp forest spirits had a
    special sacrificial cult; preserving game bones by burying them or hanging them
    in trees is not treated as an offering, while offerings to Seides were made for
    hunting luck.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Samoyed groups know a Forest spirit called the Master of the forest; Ostiak
    Samoyeds sacrifice peculiarly shaped arrows to this spirit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A human-like image of the Samoyed Master of the forest is often carved on
    an old tree, and edible offerings are rubbed into the image's mouth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among Yuraks, a person may wander freely in the forest, but must sacrifice
    something when passing a holy place, otherwise the Master of the forest is offended.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Ostiak Unt-tongk or Wood spirit resembles a human being but is hairy like
    a wild animal; one such spirit lives in every forest.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Ostiak Wood spirit gives game to those who remember him with offerings,
    usually in autumn or early spring at the beginning of the hunting periods.
  category: relationship
  evidence_refs:
  - ev:9
