canonical_text:
  quote: ''
  summary: The passage describes offerings to water spirits, especially among the
    Siryans, and gives names, appearances, actions, dangers, transformations, ritual
    obligations, and an origin account for Siryan Water spirits. It includes male
    and female forms, a Water maid comb tale, child and pike forms, spirit weddings,
    fishing and crossing-water taboos, and the belief that water spirits derive from
    drowned people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blood, bones, meat, and bread are thrown into the water; sacrifices are also
    made during sickness, and offerings are made to the “Water man” when a mill sluice
    is out of order or flood is feared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Siryans, the Water spirit is usually named Kul and is also called
    Vasa, meaning “Water dweller.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Siryan Water spirit is described as having male and female forms with
    distinct characteristics.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male Water spirit is described as black, hairy, wet, sometimes big-headed
    and round-eyed, with dark green hair, and either green-robed or naked.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The male Water spirit sits on the shore, shakes himself, seizes the mill-wheel,
    comes ashore to comb his hair, and when he throws himself into the water a tempest
    arises and waves rise high.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The male Water spirit is also seen rocking on water or fishing nets, standing
    on a pier, haunting at night, slapping drying washing, crying on the river-bank,
    and disappearing with a boat and torch at fish-spearing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The female Water spirit is long-haired and combs her hair with large paws.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A tale says a peasant found a naked Water maid combing her hair on a hill;
    when frightened she leapt into the water and left her comb behind, which the peasant
    took home before she came at night to reclaim it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Water spirit may appear as a small child, and the children of the Water
    spirit are hairy and unusual while young, often fish-like, later becoming more
    human in shape.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A child of the Water spirit may stray into a fisherman’s net.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Siryans know “stony fingers” of the Water spirit, identified in the passage
    as belemnites found near beaches.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Water spirit may take non-human form, including the form of a big pike;
    one account mentions a speaking pike with long white hair that entered a fisherman’s
    net by mistake.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Siryans believe Water spirits have weddings, make much noise, break down
    mill sluices, and go to dwell among human beings at Epiphany.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Siryan Water spirit is feared; seeing him is said to mean tempest, death,
    or another disaster, and he entices humans and animals to his home.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wichmann’s notes say the Siryans offered butter and bread to the “Sea spirit”
    so that he would give them fish.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: While fishing, people had to avoid bad words because they angered the Water
    spirit, who could seize the net so firmly that the fisherman could not move it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Millers must remain on good terms with the Water spirit, and a Siryan crossing
    water gives a gift, at minimum throwing a thread from his belt into the water.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: According to the Siryans, Water spirits originate in the spirits of the drowned,
    which continue living in water and serve the Water spirit.
  category: relationship
  evidence_refs:
  - ev:11
