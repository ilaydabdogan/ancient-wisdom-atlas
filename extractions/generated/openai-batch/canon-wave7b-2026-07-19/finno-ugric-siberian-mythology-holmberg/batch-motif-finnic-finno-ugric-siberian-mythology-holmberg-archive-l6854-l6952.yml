canonical_text:
  quote: ''
  summary: 'The excerpt gives plate captions for a Votiak sacred grove and an Ostiak
    idol storehouse, then describes Votiak lud-spirit sacrifice: promises made during
    illness, annual preparation, entry into the sanctuary, testing whether the offering
    is accepted, and beginning the slaughter of the sacrificial animal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate captions identify a Votiak sacred grove or lud with a surrounding
    fence and gate, and a storehouse of Ostiak idols near Vasyagan.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Offerings are described as being made chiefly before hay-making in summer
    and after field-work in autumn, with the ceremony performed in the evening by
    ancient custom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Occasional offerings are made after misfortune, especially during severe illness,
    when the magician says the lud-spirit demands a sacrifice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The magician is said to find out what the spirit wishes as a sacrifice on
    different occasions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A preliminary promise of sacrifice can be made with copper coins, silver coins,
    and meal in a rag bundle, accompanied by words asking that the sick person not
    lose life and regain health.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The rag bundle is hung in a secret place, and lack of improvement is taken
    as a sign that the spirit wants the actual sacrifice immediately.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The guardian may make or renew the promise while holding bread or porridge,
    praying that the lud-spirit be appeased and wait until the sick person can offer
    the sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the guardian prays in his own yard, he faces the direction of the sanctuary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The annual sacrifice day is determined by the lud-family or lud-clan; participants
    cleanse themselves, wear clean clothing, and collect sacrifice-money by marking
    family contributions on a stick.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The lud-spirit is described as always demanding blood-offerings; a foal is
    generally the victim, though sometimes a black sheep is used.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Only older males enter the sanctuary, carrying vessels, cauldrons, dishes,
    provisions, and the sacrificial animal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the sanctuary gate, the crowd greets the spirit by removing head-dress;
    the guardian opens the door and enters the grove first, followed silently by the
    others.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Fire is made on the site of old fires using fallen trees, stumps, or fallen
    branches as fuel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Towels are hung in tree branches, and an altar-table is decked with green
    boughs and white cloths for loaves and pancakes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Before sacrifice, fresh spring-water is poured with a bundle of twigs over
    a flawless, one-colour sacrificial animal to see whether the lud-spirit will accept
    the offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The water-pouring is repeated while the lud-guardian prays softly until the
    animal shivers, which is described as a sign that the sacrifice pleases the god.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the sign, sacrificing priests bind the animal’s feet, turn it onto its
    left side, and cut the throat veins without previous stunning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: A few drops of warm blood are thrown into the fire with a sacrifice ladle
    while the lud-guardian reads a prayer holding sacrificial bread.
  category: action
  evidence_refs:
  - ev:8
