canonical_text:
  quote: ''
  summary: The passage surveys beliefs that body parts, blood, hair, nails, teeth,
    and contact objects can contain or transmit soul-power. It then describes detachable
    shadow-souls, called ort among the Cheremiss and urt among the Votiaks, that may
    leave during dreams, fright, unconsciousness, or shamanic journeys; soul-loss
    causes illness, and shamans may retrieve souls or seek aid in the underworld.
    It also recounts an Ostiak hero’s shadow ascending to heaven and returning, and
    a Lapp shamanic account in which injury to a shadow is visible in the body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient Vogul heroes are said to have eaten the hearts and livers of slain
    enemies so that the enemies' strength would pass into their bodies and the foe
    would not rise from the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage cites accounts of Hungarians cutting and eating captives' hearts,
    a Cheremiss priestly prayer against people who cut out heart and liver, and Sakkala
    peasants eating a roasted Danish Crusader's heart for bravery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drinking another person's blood is described as a means by which Voguls and
    others believe soul-powers pass from one body to another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hair, nails, and teeth are described as insignificant body parts in which
    a soul or soul-power may be concealed; cutting hair or scalping is linked to harm
    or control of the soul or ghost.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Objects that have touched a person, such as cap, gloves, or boots, are described
    as maintaining a relation to the soul and as usable in illness-causing acts by
    an underworld dweller.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss say that a person's shape or shadow, called ort, can leave the
    body during unconsciousness, fright, or dreaming and return when the person wakes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Votiak urt is said to correspond to the Cheremiss ort; if it does not
    return before a sleeper wakes, the person becomes ill, pale, and wastes away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Soul disappearance is described as a cause of grave illness, and a magician
    or shaman may be asked to seek the lost soul and bring it back to the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The soul of a dying person may go to the nether world and later return, after
    which the person recovers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: An Ostiak song tells of a wounded hero whose shadow ascended to heaven and
    returned after his dead brother's shadow said his time had not yet come.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A shaman's shadow is said to be able to go to the underworld for aid; a Lapp
    shamanic account describes a hostile shadow injuring the shaman's shadow, with
    the injury visible in the shaman's body in the tent.
  category: action
  evidence_refs:
  - ev:7
