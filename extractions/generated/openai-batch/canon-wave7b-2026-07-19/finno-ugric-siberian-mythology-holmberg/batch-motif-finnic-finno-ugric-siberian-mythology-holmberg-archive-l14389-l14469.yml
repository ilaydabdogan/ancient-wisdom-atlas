canonical_text:
  quote: ''
  summary: The passage surveys several creation-tale variants in which God or a creator
    brings forth a small earth on primordial water, a devil attempts to damage or
    destroy the new earth or drown the creator, and the earth grows or is altered
    into present landscape features. It also describes a Central Asian variant involving
    Otshirvani, Chagan-Shukuty, a frog or turtle, and Shulmus, and notes parallels
    among Yakut, Bulgarian, Buriat, Vogul, Siberian, and East European traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Yakut tale summarized here, God creates a small, smooth, even earth;
    the devil kicks and tears it; God urges it to grow, and the devil’s injuries become
    mountains, valleys, and lakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: The passage recalls an earlier creation tale in which the devil intends to
    drown God, who is seated on a newly formed little earth-disc on the surface of
    the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: In the Bulgarian counterpart, the devil tries to get God to sleep on the earth-disc
    so he can push him into the sea; when he carries God toward the edge, the earth
    expands so that he cannot reach the shore in any direction.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Central Asian tale, earth is brought from under the water and placed
    on the ocean’s surface, but the devil is not involved in the act of creation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Otshirvani and Chagan-Shukuty descend from heaven, see a frog or turtle diving
    in the water, and Chagan-Shukuty raises it from the depths and places it on its
    back on the water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chagan-Shukuty dives twice; on the second dive he brings up earth, which is
    sprinkled on the stomach of the frog or turtle; the animal sinks out of sight
    and only the earth remains visible above the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Otshirvani and Chagan-Shukuty fall asleep on the small new earth, Shulmus
    arrives, tries to drown them with their earth, but the earth grows as he runs
    and he abandons the attempt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that according to Buriat tradition the devil creates many
    useless and harmful animals, and that in a Vogul version the devil makes a hole
    in the earth with his staff from which small animals and insects emerge until
    God closes it with a fiery stopper.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that these Asiatic stories correspond in detail to East
    European creation tales and are connected with a common cycle of variants, with
    limited western distribution outside the former Russian Empire except certain
    Balkan States and Gypsy groups influenced by Slavs of Austria.
  category: other
  evidence_refs:
  - ev:8
