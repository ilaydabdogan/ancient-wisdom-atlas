canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric burial customs: cremation is presented
    as non-original and externally borrowed where found; the dead are buried in village
    or family cemeteries, sometimes with separate burial areas for strangers; cemeteries
    may be consecrated fir woods where gifts are hung on trees; some graves are ringed,
    and some Eastern Cheremiss graves carry a wooden cuckoo on a pole. The passage
    also notes comparable Siberian grave-bird figures and Lapp practices of temporary
    summer burial followed by winter removal to a churchyard.'
  language: English
  quote_policy: summarized
