canonical_text:
  quote: ''
  summary: 'The passage surveys Finno-Ugric and neighboring water-spirit traditions:
    water spirits teach wondrous music, seize humans or animals, receive or cause
    sacrifices, give fishing luck, appear as human-shaped omens, and are sometimes
    understood as drowned dead transformed into spirits. It lists named beings including
    Vetehinen, Nakki/Nakk, Ahti, Vedenhaltija, Kull/Koll, Pele kolese, and Soiem tongk,
    with several reported correspondences to Russian, Swedish, Vote, Mordvinian, Scandinavian,
    Siryan, and Lapp traditions.'
  language: English
  quote_policy: summarized
