canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugrian and Siberian beliefs concerning souls
    or shadows in persons, images, plants, natural elements, dwellings, objects, offerings,
    and names. It describes injury through an effigy, survival of important persons
    in images or shadows, souls of corn, earth, fire, water, huts, farmyards, and
    threshing-floors, and practices for releasing object-souls for the dead or in
    offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A report attributed to Randulf describes a Lapp using a small reindeer-horn
    bow and two arrows on an image representing an enemy, whether the enemy is nearby
    or far away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described procedure, a blunt arrow shot into the corresponding part
    of the effigy is said to make that body part useless, while a pointed arrow is
    said to cause a wound or persistent internal pain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Persons of superior importance, named as primal ancestors, shamans, and heroes,
    are said generally to survive their bodies in images or shadows made after them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that things, like humans and animals, may possess souls
    that can free themselves from the objects to which they belong.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: According to the Votiaks, the soul of corn can assume the form of a little
    butterfly, like the soul of a human being.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss are described as speaking of souls of earth, fire, water, and
    other entities; when earth-souls vanish vegetation ceases, and when a water-soul
    disappears the water becomes sick, turbid, nauseous, and harmful to drinkers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A hut or bothie is said to have a soul that flees when people are noisy or
    quarrelsome, and a deserted house is said to have no soul.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When asked about the bothie-soul, the Cheremiss explanation given is that
    it is not a distinct entity but the luck, joy, or health of the hut.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Farm-yard and threshing-floor souls are associated with cattle thriving and
    multiplying, and with seed yielding well; when such a soul leaves, the productive
    usefulness of seed is lacking.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Objects intended for the dead, such as wooden spoons, bowls, and clay pots,
    are broken so that the departed may take them to the invisible world; in Mordvinian
    usage an object may instead be scraped with a knife to release its soul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At grove offerings the Cheremiss violently shake objects used for the occasion,
    and the passage connects this with the belief that a shivering sacrificial victim
    loses its shadow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that, as a human shadow has a tutelary genius, a nature
    soul has a nature god; water, earth, forest, tree, house, and similar entities
    possess a Haltia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The name is included in the category of soul-belief, and the Votiaks are said
    to call the choosing of a name the seeking of the soul.
  category: attribute
  evidence_refs:
  - ev:8
