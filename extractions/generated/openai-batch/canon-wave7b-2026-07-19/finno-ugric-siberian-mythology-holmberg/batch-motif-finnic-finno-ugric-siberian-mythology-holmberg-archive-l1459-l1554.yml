canonical_text:
  quote: ''
  summary: 'The passage surveys funerary and mourning customs among Ostiaks and other
    Finno-Ugric/Siberian groups: a memorial tree with offerings, mourning dress and
    loosened belts, self-wounding and lamentation, divination about who will die next,
    and the coffin as the dead person’s house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption describes a Karsikko or memorial tree on the way to a cemetery
    in Finnish Karelia, hung with offerings and stripped of its lower branches in
    memory of the dead.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Ostiaks regard it as incorrect for relatives to go
    barefoot during the first week after a death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One report says Ostiak women wear linen and head-kerchiefs inside out for
    a period whose length depends on whether the deceased is male or female.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ostiak refusal to gird the belt for five or four days is described as
    a mourning custom, with the duration depending on the sex of the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In some districts, the ungirded belt is explained as allowing the dead to
    feel lighter and freer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Lapps have the same custom during shamanic trance and
    childbirth, and that Samoyed and Ugrian women allow their hair to fall unbound
    during burial.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ostiak relatives are described as tearing their hair, scratching bleeding
    wounds on their faces, and throwing bleeding locks of hair onto the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Mordvins, wounding one’s face is described as a way of expressing
    sorrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mordvins, Orthodox Finns, and Siryans are said to have sung weeping-songs
    for the dead, and some villages had women who professionally wept at graves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports that Voguls wailed and cried greatly after the dead, and
    that Ostiaks customarily used relatives of the dead as weepers who praised the
    dead person and admired his works.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cheremiss participants place pieces of thread of varying lengths on the coffin
    and each draws one while saying that the dead should not take them and that their
    life should be as long as the thread.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Esthonians are described as looking in the ashes of burned straw from the
    deathbed for footprints indicating whether a human being or an animal will next
    die from the same farm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Finns are described as watching the horse that draws the hearse; if it lifts
    its left foot first, this is taken as a sign that someone from the village will
    soon follow the dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ostiaks are described as tying a rope around the coffin near the corpse’s
    head and trying to lift it while asking the deceased questions; heaviness is treated
    as a negative answer and lightness as assent.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage states that survivors must take care of the dead person’s dwelling-place,
    and that the coffin is called the house of the dead.
  category: relationship
  evidence_refs:
  - ev:10
