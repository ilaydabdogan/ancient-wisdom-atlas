canonical_text:
  quote: ''
  summary: The passage surveys Central Asian and Siberian ideas of a central world-mountain
    named Sumur, Sumer, or Sumbur, describing it as a cosmographic center, divine
    dwelling, heavenly or storeyed mountain, sky-axis point near the North Star, and
    northern locus. It also summarizes a Goldes tale of a stone Heaven-arch hidden
    by air and notes the author's comparison of Central Asian mountain names and beliefs
    with Indian Sumeru/Meru. The final quoted Buriat cosmogony fragment begins with
    primordial water and a frog or turtle but is cut off in the supplied passage.
  language: English
