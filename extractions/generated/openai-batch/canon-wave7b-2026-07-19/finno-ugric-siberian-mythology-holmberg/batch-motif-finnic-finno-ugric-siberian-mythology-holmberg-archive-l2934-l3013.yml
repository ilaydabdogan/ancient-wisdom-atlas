canonical_text:
  quote: ''
  summary: 'The passage describes seasonal memorial feasts and rites involving wandering
    spirits or the dead: protective household measures, fire purification, spring
    and autumn dead observances, Esthonian offerings to dead relatives, Baltic Finnic
    autumn spirit days, and the Finnish Kekri feast in pagan and Catholic forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ring is made around houses to protect them from evil spirits said to be
    abroad at this time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before going to bed, people burn juniper in the hut and close windows, the
    smokehole, and floor openings to keep spirits out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some places young men sit armed all night on the roof of the hut or store-house
    to watch for spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The spirits generally appear in the shape of a cat or dog, and sometimes as
    a wolf.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The next morning a straw fire is made in the yard, and family members jump
    over it one after another to purify themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage states that the idea of spirits of the dead walking about early
    in spring is common among Slavic and other East European peoples.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says the Cheremiss retained a spring timing for the festival at
    the first new moon in March in some places.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: Orthodox Esthonians are described as holding a similar memorial feast on Easter
    morning, with the hostess spreading a clean table-cloth near the gate and placing
    foods on it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Esthonian hostess calls dead relations by name and invites them, with
    their children, to partake of food and drink.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: After a silence to allow the dead time to eat and drink, the hostess tells
    them to go away, each to his place, and to lead the children by the hand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Food from which the deceased had received their portion is brought back into
    the hut and eaten by the family.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: Among the Baltic Finns, the dead are generally believed to move about in autumn,
    and Esthonian October is called the time or month of the spirits.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: During the autumn dead days, shouting or noise is not permitted, huts are
    cleaned, and food is set out at night for the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: 'The Kekri feast is described as being celebrated in two ways: a pagan manner
    honoring the ancient Finnish god Kekri and a Catholic manner honoring all saints.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: In the heathen Kekri custom, a half-year-old sheep is killed, boiled with
    bones intact, served whole, and eaten completely without leftovers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Other spirits called Kekri receive prepared food and drink in the cow-house,
    stable, under big trees, by huge stones, or in all these places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: In the Catholic manner, the host receives the saints outside in the evening
    darkness and takes them to a cleaned and heated bath-house with water, bath-brooms,
    meat, and drink.
  category: action
  evidence_refs:
  - ev:7
