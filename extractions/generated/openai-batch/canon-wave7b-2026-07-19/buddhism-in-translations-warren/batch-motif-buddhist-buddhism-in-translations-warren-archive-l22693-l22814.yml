canonical_text:
  quote: ''
  summary: 'A king hears that Mendaka of Bhaddiya and members of his household possess
    magical powers of abundance: grain falls from the sky for Mendaka, food and rice
    do not run out for his wife and daughter-in-law, money does not run out for his
    son, and a slave can plow seven furrows at once. The king sends a minister with
    a fourfold army to verify the reports. Several powers are demonstrated for the
    army, and the minister returns to report to the king. The supplied excerpt then
    begins the Story of Visakha with a verse comparing flowers made into many garlands
    to a mortal life fruitful in good works.'
  language: English
  quote_policy: summarized
