canonical_text:
  quote: ''
  summary: The king is told that four signs would cause his son to retire from the
    world, so he orders such persons kept away and guards placed around the prince.
    Clansmen dedicate sons to follow the prince whether he becomes a Buddha or a king.
    During a royal Sowing Festival, the young Future Buddha is left under a rose-apple
    tree, sits cross-legged, controls his breathing, and enters the first trance;
    the tree's shadow remains circular while other shadows move. The king sees the
    miracle and bows to his son. Later, the prince lives in seasonal palaces with
    dancers and a principal queen, while relatives question his lack of martial training.
  language: English
  quote_policy: summarized
