canonical_text:
  quote: ''
  summary: The passage lists former Buddhas, states that the Future Buddha received
    recognition under twenty-four Buddhas beginning with Dipamkara, gives eight conditions
    for becoming a Future Buddha, describes blessings and exclusions attached to Future
    Buddhas, and illustrates the Ten Perfections through past lives, including the
    Wise Hare’s self-gift as alms and a precept-keeping episode under bodily violence.
  language: English
  quote_policy: summarized
