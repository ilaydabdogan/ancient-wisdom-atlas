canonical_text:
  quote: ''
  summary: Visakha asks that accusations against her be investigated by eight householders
    appointed by her father. The treasurer accuses her of insulting him while he ate
    and of going outside at night with servants. She explains that she referred to
    his failure to give alms as eating old merit and that she went out to care for
    a foaling mare. The treasurer then asks for the meaning of her father's ten hidden
    admonitions. Visakha explains them as rules about guarding household speech, lending
    and giving, serving household elders and husband, and regarding them as fire,
    a royal serpent, and household divinities. The treasurer admits there is no sin
    in her.
  language: English
  quote_policy: summarized
