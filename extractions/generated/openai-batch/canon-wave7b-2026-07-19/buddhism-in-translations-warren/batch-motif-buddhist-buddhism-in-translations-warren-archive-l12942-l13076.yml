canonical_text:
  quote: ''
  summary: The passage explains that insight into dependent causation removes doubts
    about past, present, and future; denies a lasting actor or experiencer behind
    deeds and their fruits; describes karma and rebirth as causal continuity without
    any element passing between existences; and illustrates this with images including
    tree and seed, fire and fuel, teacher and pupil, holy water, mirror reflection,
    lamp flame, and a sequence of thoughts at conception.
  language: English
  quote_policy: summarized
