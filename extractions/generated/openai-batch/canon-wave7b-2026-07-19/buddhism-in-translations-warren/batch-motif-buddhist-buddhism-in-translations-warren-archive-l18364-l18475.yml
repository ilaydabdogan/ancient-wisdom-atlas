canonical_text:
  quote: '"Verily, my body also has this nature, this destiny, and is not exempt."'
  summary: The passage instructs priests to contemplate the body as an assemblage
    of impure parts and fluids, then as composed of earth, water, fire, and wind.
    It uses analogies of a grain-filled vessel and a butchered heifer to illustrate
    analysis into parts. It then presents cemetery contemplations in which a priest
    sees corpses in stages of decay and compares his own body to them.
  language: English
  quote_policy: quoted
