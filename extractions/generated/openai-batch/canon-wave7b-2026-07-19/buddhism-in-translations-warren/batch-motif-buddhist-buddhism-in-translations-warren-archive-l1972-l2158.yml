canonical_text:
  quote: ''
  summary: 'The first-person speaker, identified in the note as Sumedha, sits cross-legged
    in joy, reflects on his trance and powers, and is acclaimed by the dwellers of
    ten thousand worlds as destined to become a Buddha. The speakers list many presages:
    climatic moderation, cosmic quiet, ceased winds and rivers, spontaneous flowering
    and fruiting, radiant gems, music, flower rain, oceanic and terrestrial tremors,
    extinguished hell-fires, celestial visibility, springs, animals emerging, universal
    contentment, removal of sickness, hunger, fear, passions, dust, and foul odors,
    visibility of gods and hells, passable barriers, and a temporary pause in death
    and rebirth. They urge continued effort, and the narrator responds with delight.'
  language: English
  quote_policy: summarized
