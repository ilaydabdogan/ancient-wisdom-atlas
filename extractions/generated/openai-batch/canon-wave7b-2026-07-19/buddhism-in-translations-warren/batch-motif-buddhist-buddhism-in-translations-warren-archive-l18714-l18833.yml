canonical_text:
  quote: ''
  summary: A doctrinal discourse instructs priests to comprehend the sense organs,
    their objects, and the bondage arising from them; to observe and develop the seven
    constituents of enlightenment; and to know the four noble truths. It defines misery
    through birth, old age, disease, death, sorrow, lamentation, grief, despair, unattainable
    desire, and the five attachment-groups, then begins defining birth, old age, death,
    sorrow, and lamentation.
  language: English
  quote_policy: summarized
