canonical_text:
  quote: ''
  summary: The Future Buddha bathes in the Neranjara, eats forty-nine pellets of milk-rice,
    casts a golden dish into the river as a sign of Buddhahood, and proceeds toward
    the Bo-tree. The dish runs upstream and joins dishes of previous Buddhas in the
    black snake-king's palace. After divine homage and a grass offering from Sotthiya,
    the Future Buddha tests positions around the Bo-tree; the earth tilts at other
    sides, but the eastern side is immovable, and the grass becomes a seat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Future Buddha rises, walks around the tree with his right side toward
    it, goes to the Neranjara, and descends into the water to bathe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bathing place is described as a later pilgrimage place named Suppatitthita,
    where he deposits the dish on the bank before entering the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: After bathing, he dresses in the garb of saintship, faces east, divides the
    milk-rice into forty-nine pellets, and eats it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: He takes no further nourishment for seven weeks, or forty-nine days, and is
    described as wholly occupied with the delights of Trances, Paths, and Fruits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: He throws the golden dish into the river after saying that if he is to become
    a Buddha that day it should go upstream, otherwise downstream.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The golden dish moves upstream for eighty cubits, dives into a whirlpool,
    reaches the palace of the black snake-king, strikes the dishes used by the last
    three Buddhas, and takes its place at the end of the row.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The black snake-king hears the sound, declares that another Buddha has been
    born, and recites many laudatory verses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Future Buddha rests in a blooming sal-tree grove and at nightfall goes
    toward the Bo-tree along a road decked by gods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Snakes, fairies, birds, other beings, and celestial choruses honor him with
    perfumes, flowers, offerings, music, garlands, and acclaim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sotthiya, a grass-cutter, sees the Great Being as a holy man and gives him
    eight handfuls of grass.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the Future Buddha stands on the southern, western, and northern sides
    of the throne of wisdom, the earth sinks and rises in opposite halves; he says
    those places cannot be the place for attaining supreme wisdom.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:12
  text: On the eastern side of the Bo-tree, where all Buddhas sit cross-legged, the
    side neither trembles nor quakes; he identifies it as the immovable spot and shakes
    out the grass, which becomes a symmetrical seat fourteen cubits long.
  category: sequence
  evidence_refs:
  - ev:9
