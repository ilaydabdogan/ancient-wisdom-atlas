canonical_text:
  quote: The ground in worlds ten thousand shakes, / In all the realms of gods and
    men.
  summary: A Buddha says that the one proclaimed as a future glorious Buddha is pondering
    the conditions fulfilled by former Conquerors. The earth shakes across ten thousand
    worlds. The first-person aspirant rises, reverences Dlpamkara, receives flower
    offerings and blessings from gods and men, is urged to complete the Ten Perfections
    and repeat the acts of former Buddhas, then begins the ten conditions of his quest
    and re-enters the wood.
  language: English
  quote_policy: quoted
