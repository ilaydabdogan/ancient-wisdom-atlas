canonical_text:
  quote: ''
  summary: At Savatthi, the Blessed One dwells in Jetavana monastery. Malunkyaputta,
    while secluded in meditation, becomes dissatisfied that the Blessed One has not
    answered a set of metaphysical questions about the world, soul and body, and the
    saint after death. He resolves to ask directly and to abandon religious training
    if no answer is given. He approaches, repeats the demand, and the Blessed One
    asks whether he had ever promised such elucidations as a condition of religious
    life.
  language: English
  quote_policy: summarized
