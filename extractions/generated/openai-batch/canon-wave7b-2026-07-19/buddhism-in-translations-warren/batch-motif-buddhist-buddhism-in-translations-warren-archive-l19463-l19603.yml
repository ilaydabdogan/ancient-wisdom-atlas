canonical_text:
  quote: ''
  summary: The passage narrates Godhika the Elder using a knife and The Teacher declaring
    that Godhika, having uprooted desire, attained Nirvana. The Slayer or Wicked One
    searches for Godhika’s rebirth-consciousness, appears as smoke or darkness and
    later as a youth with a lute, but cannot find any place, track, or path for him.
    The passage then begins a doctrinal section classifying bodily, vocal, and mental
    karma and describing the gradual cessation of functions through meditative attainments.
  language: English
  quote_policy: summarized
