canonical_text:
  quote: ''
  summary: The Future Buddha sits under the Bo-tree facing east and vows not to rise
    until attaining supreme wisdom. Mara gathers a vast army to prevent Siddhattha
    from passing beyond his control. Deities praise the Great Being but flee as Mara's
    army approaches, leaving him alone. The Great Being reflects on the Ten Perfections
    as his shield and sword. Mara sends wind, flood, rocks, and weapons; the wind
    and water fail to affect him, while rocks and weapons become celestial flowers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Future Buddha turns his back to the trunk of the Bo-tree, faces east,
    vows not to stir until attaining supreme and absolute wisdom, and sits cross-legged
    in an unconquerable position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mara says Siddhattha wants to pass beyond his control and that he will not
    allow it, then announces the news to his army and draws out for battle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mara's army is described as extending many leagues in several directions,
    reaching the confines of the world to the rear, and roaring like an earthquake
    over a thousand leagues.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mara mounts an elephant named Girded-with-mountains, causes a thousand arms
    to appear on his body, and grasps many weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Deities throughout ten thousand worlds sing praises of the Great Being; Sakka
    blows the conch-shell Vijayuttara, the black snake-king sings laudatory verses,
    and Maha-Brahma holds aloft the white umbrella.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: As Mara's army approaches the throne of wisdom, the gods flee; the Great Being
    is left sitting alone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mara tells his followers that Siddhattha is too great to fight in front and
    that they will attack him from behind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Great Being sees that no relatives or helpers are present and says that
    the Ten Perfections are like long-cherished retainers, to be made his shield and
    sword.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mara causes a whirlwind intended to drive Siddhattha away, but the winds cannot
    even flutter the edge of his priestly robe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mara causes a rainstorm and inundation meant to drown Siddhattha, but the
    water cannot wet his robes as much as a dew-drop.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mara causes a shower of rocks in which flaming mountain-peaks fly through
    the sky, but they become celestial bouquets of flowers when they reach the Future
    Buddha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mara causes a shower of weapons, including swords, spears, and arrows, but
    they become celestial flowers when they reach the Future Buddha.
  category: sequence
  evidence_refs:
  - ev:8
