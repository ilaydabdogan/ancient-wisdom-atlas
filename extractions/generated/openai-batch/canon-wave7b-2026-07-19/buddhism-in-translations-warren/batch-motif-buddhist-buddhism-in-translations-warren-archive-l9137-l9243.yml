canonical_text:
  quote: "“Both these extremes, O priest, have been avoided by The Tathagata, and
    it is a middle doctrine he teaches.”"
  summary: The passage explains a Buddhist middle doctrine that avoids identity and
    difference claims about soul and body, connects ignorance with karma, describes
    the cessation of ignorance as uprooting speculative views, and expounds Dependent
    Origination as a middle course rejecting persistence, annihilation, nihilism,
    and ineffective karma. It then begins a section defining ignorance in relation
    to Sutta-Pitaka and Abhidhamma-Pitaka accounts.
  language: English
  quote_policy: quoted
