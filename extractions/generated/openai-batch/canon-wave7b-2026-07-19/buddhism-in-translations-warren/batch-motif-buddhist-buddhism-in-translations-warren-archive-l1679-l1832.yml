canonical_text:
  quote: ''
  summary: In a first-person account, an ascetic narrator encounters preparations
    for the arrival of Dipamkara Buddha, joins in clearing the path, lies face-down
    in the mud so the Buddha and his disciples may pass without mire, resolves to
    attain omniscience and Buddhahood in order to convey beings across rebirth, and
    receives Dipamkara's prophecy that he will become a Buddha after unnumbered cycles.
  language: English
  quote_policy: summarized
