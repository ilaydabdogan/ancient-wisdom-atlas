canonical_text:
  quote: ''
  summary: The passage explains meditative knowledge that recalls former existences,
    defines a birth as a series from conception to death, describes world-cycle destruction
    and renovation, lists elemental destructions by water, fire, and wind, defines
    three Buddha-domains, and begins an account of world-cycle destruction by fire
    with rain followed by prolonged drought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Knowledge covering events from the last sitting down to conception is classified
    as preliminary concentration or knowledge of past time, not as knowledge of former
    existences.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the priest passes beyond conception and considers the name-and-form present
    at death, a sequence of swiftnesses culminates in an attainment-thought of the
    fourth trance; the accompanying knowledge is called knowledge that calls to mind
    former states of existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Possessing this knowledge, the practitioner can call to mind many former states
    of existence, from one birth to many births and many destructions and renovations
    of a world-cycle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The recalled former existences are characterized by place, name, family, caste,
    maintenance, happinesses and miseries, lifespan, passing away, and rebirth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: One birth is defined as the series of groups beginning at conception and ending
    at death within one existence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A world-cycle on the wane is called destruction, and a world-cycle on the
    increase is called renovation; the four immensities named are destruction, continuance
    of destruction, renovation, and continuance of renovation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage lists three destructions: by water, by fire, and by wind.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fire consumes the world from the Heaven of the Radiant Gods down; water engulfs
    it from the Heaven of the Completely Lustrous Gods down; wind demolishes it from
    the Heaven of the Richly Rewarded Gods down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In lateral expansion, the world perishes to the extent of a Buddha's domain.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'A Buddha''s domain is threefold: birth-domain, authority-domain, and knowledge-domain.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The birth-domain comprises ten thousand worlds, and these worlds quake at
    various periods in the life of a Tathagata, including conception.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The authority-domain is the domain that perishes; when it perishes, the birth-domain
    perishes likewise, and the two perish and exist coincidently.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the beginning of a world-cycle perishing by fire, a cycle-destroying great
    cloud arises and great rain falls throughout a vast number of worlds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: People rejoice at the rain, bring out seed, and sow it; after the crops grow
    to the size of cow-fodder, the clouds make noise but no rain falls, and rain is
    cut off for very long periods.
  category: sequence
  evidence_refs:
  - ev:7
