canonical_text:
  quote: When in his meditation the circle appears equally visible, whether his eyes
    are open or shut, that is the securing of the mental reflex.
  summary: 'The passage gives procedural instructions for earth-kasina meditation:
    the practitioner receives a meditation subject from a preceptor, prepares a light-red
    clay circle in a secluded place, sits at a specified distance, reflects on the
    defects of sensual pleasures and on Buddhist virtues, gazes with controlled eyes
    while repeating earth epithets, develops a mental reflex of the circle, and then
    continues the practice in his lodging, returning to the kasina place if concentration
    is lost.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A preceptor gives the practitioner a meditation subject, and the practitioner
    is instructed to avoid dark-blue, yellow, blood-red, and white clay, using light-red
    clay instead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practice is to be done in a concealed spot on the outskirts of the monastery,
    not in the middle of the monastery, and may take place in a cave or a leaf-hut.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A movable frame is made by stretching cloth, skin, or mat over four sticks,
    making a clay circle on it, placing it on the ground, and gazing at it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A fixed frame is made by driving stakes into the ground, spreading them in
    the shape of a lotus-calyx, and weaving them together with vines.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The clay circle is to have an outline, a specified diameter, and a smooth
    surface made with water from a rock rather than vegetable juices.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before gazing, the practitioner sweeps the place, bathes, and sits on a prepared
    seat of specified height and distance from the kasina-circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The practitioner reflects on the wretchedness of sensual pleasures, longs
    for indifference to them, reflects on the virtues of The Buddha, the Doctrine,
    and the Order, and resolves to obtain the blessings of isolation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The practitioner is told to develop the mental reflex with partially and evenly
    opened eyes, compared to looking at his face in a mirror.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The practitioner repeats names or epithets of the earth, especially the phrase
    “broad one.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The practitioner alternates contemplating the circle with eyes open and shut
    until the circle appears equally visible in both conditions; this is called securing
    the mental reflex.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After securing the mental reflex, the practitioner leaves the spot, returns
    to his lodging, and continues meditation there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The practitioner is advised to keep single-soled sandals and a walking-stick
    available so that, if concentration is disturbed, he can return to the place,
    regain the mental reflex, and resume meditation.
  category: object
  evidence_refs:
  - ev:8
