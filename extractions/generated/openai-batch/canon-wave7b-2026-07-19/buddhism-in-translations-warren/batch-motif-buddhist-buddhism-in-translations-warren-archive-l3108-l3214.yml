canonical_text:
  quote: ''
  summary: 'The passage describes the Middle Country and Kapilavatthu as the fitting
    birthplace of Buddhas. The Future Buddha chooses his country, city, warrior family,
    father King Suddhodana, and mother Queen Maha-Maya, then promises the gods that
    the time for Buddhahood has come. After dwelling among Tusita deities, he dies
    and is conceived in Maha-Maya. The account then narrates Maha-Maya''s full-moon
    festival observances and dream: guardian angels carry her to the Himalayas, she
    is ritually bathed and adorned, and the Future Buddha appears as a white elephant
    bearing a white lotus, circles her couch, and seems to enter her womb.'
  language: English
  quote_policy: summarized
