canonical_text:
  quote: ''
  summary: The passage addresses priests and defines lamentation, bodily misery, grief,
    despair, the misery of wishing for what cannot be obtained, and the five attachment-groups
    as misery. It then states the noble truth of the origin of misery as desire leading
    to rebirth, connected with pleasure and passion, and describes desire as taking
    root wherever sensory and mental phenomena are delightful and agreeable.
  language: English
