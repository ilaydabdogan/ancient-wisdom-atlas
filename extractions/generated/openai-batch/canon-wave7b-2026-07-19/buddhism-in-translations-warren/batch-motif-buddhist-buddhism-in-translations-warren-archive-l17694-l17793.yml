canonical_text:
  quote: ''
  summary: The speaker recounts that the band of five priests attained Nirvana free
    from birth and corruption and recognized that they would not be born again. The
    passage then lists the five sensual pleasures, contrasts practitioners immersed
    in them with practitioners who know the way of escape, and illustrates the contrast
    through deer, snare, and hunter similes. It then describes a priest entering the
    first, second, and third trances, each time said to have blinded Mara and gone
    out of the Wicked One's sight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The band of five priests, after being exhorted and instructed by the speaker,
    attained Nirvana described as free from birth and corruption, and knowledge and
    insight arose in them that this was their last existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies five sensual pleasures as forms, sounds, odors, tastes,
    and tangible things perceived by the corresponding sense faculties and described
    as delightful and passion-exciting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Monks and Brahmans who are enveloped, besotted, and immersed in sensual pleasures,
    and who do not perceive their wretchedness or know the way of escape, are said
    to be in misfortune, destruction, and the power of the Wicked One.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A forest deer that steps into a snare and is caught is described as being
    in the hunter's power and unable to escape when the hunter comes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Practitioners who are not enveloped, besotted, and immersed in sensual pleasures,
    and who perceive their wretchedness and know the way of escape, are said not to
    be in the power of the Wicked One.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A forest deer that steps into a snare but is not caught is described as not
    being in the hunter's power and as able to escape when the hunter comes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A forest deer roaming the woods and mountain slopes can walk, stand, squat,
    and lie down in confident security because it is out of the hunter's reach.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A priest isolated from sensual pleasures and demeritorious traits enters the
    first trance, characterized by joy and happiness, and is said to have blinded
    Mara and gone out of the Wicked One's sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A priest enters the second trance through the subsidence of reasoning and
    reflection, retaining joy and happiness, and is again said to have blinded Mara
    and gone out of the Wicked One's sight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A priest enters the third trance after the paling of joy, in a state described
    as indifferent, contemplative, conscious, and living happily, and is again said
    to have blinded Mara and gone out of the Wicked One's sight.
  category: action
  evidence_refs:
  - ev:7
