canonical_text:
  quote: ''
  summary: A Dhammapada stanza on curbing anger is illustrated by a story in which
    a forest-dwelling priest cuts down a tree inhabited by a goddess and injures her
    child. The goddess restrains her anger, reports the matter to the Teacher, receives
    praise and a new tree residence, and the Teacher lays down a precept concerning
    vegetation. The passage then begins another section with verses on guarding the
    senses, body, voice, and mind, followed by the opening of a story about two ordained
    friends, wild geese, and a younger priest's boast about striking a gosling.
  language: English
  quote_policy: summarized
