canonical_text:
  quote: ''
  summary: The passage states strict qualifications for making a successful wish for
    Buddhaship, including human male status, renunciation, powers, attainments, and
    life-sacrificing resolve. It illustrates the required zeal through ordeals of
    crossing a world of water, bamboo, javelins, or live coals. It then gives Dipamkara’s
    prophecy of Gotama’s future Great Retirement, austerities, meal by the Neranjara,
    approach to the Tree of Wisdom, rightward circumambulation of Wisdom’s Throne,
    and attainment of Buddhaship. The prophecy names his parents, disciples, attendant,
    female chief disciples, and Bo-tree. Men, gods, serpents, and demigods rejoice,
    honor the narrator, and compare future access to Gotama’s teaching with finding
    another river landing-place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A successful wish for Buddhaship is restricted to a human male who is fit
    for saintship in the same existence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wish must be made in the presence of a living Buddha; the passage says
    a wish after a Buddha’s death at a relic-shrine or at the foot of a Bo-tree will
    not succeed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The successful wish-maker must have retired from the world, possess the Five
    High Powers, master the Eight Attainments, and have firm resolve to sacrifice
    his life for the Buddhas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The required zeal is compared to readiness to cross a world become water,
    force a way through a bamboo jungle, walk over thick-set javelins, or tread over
    live coals to reach the further side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dipamkara’s prophecy says the future Buddha will make his Great Retirement
    from Kapila, then complete a fierce Struggle and stern austerities.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prophecy says the future Buddha will sit beneath the Ajapala-tree, receive
    rice pottage, and go to the stream Neranjara.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The prophecy says he will eat the pottage beside the Neranjara, go to the
    Tree of Wisdom, walk rightward around Wisdom’s Throne, and achieve Buddhaship
    while seated at the fig-tree’s root.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The prophecy names Maya as the mother, Suddhodana as the father, Gotama as
    the future Buddha’s own name, Kolita and Upatissa as chief disciples, Ananda as
    servitor, Khema and Uppalavanna as female chief disciples, and Assattha as the
    Bo-tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the prophecy, men and gods rejoice and call the narrator a Buddha-scion;
    ten thousand worlds of men and gods pay him homage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gathered beings say that if they fail to grasp Dipamkara’s Doctrine, they
    will later stand face to face before this other Buddha, comparing this to finding
    a lower landing-place when crossing a river.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: After prophesying the narrator’s future, Dipamkara raises his right foot and
    departs; the Conqueror’s sons walk rightward around the narrator, and serpents,
    men, and demigods salute him before leaving.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the Leader of the World and his train pass from sight, the narrator,
    filled with rapturous transport, rises from where he lay.
  category: action
  evidence_refs:
  - ev:5
