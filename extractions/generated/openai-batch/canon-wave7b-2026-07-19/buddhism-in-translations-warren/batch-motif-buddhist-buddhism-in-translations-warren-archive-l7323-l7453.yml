canonical_text:
  quote: But in the absolute sense there is no Ego here to be found.
  summary: A dialogue and subsequent exposition use the chariot and other composite
    objects to argue that a person or ego is only a conventional designation for constituent
    groups. The passage also rejects both persistence and annihilation views as errors.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Nagasena asks whether individual chariot parts, their union, or something
    besides those parts is the chariot, and Milinda denies each alternative.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena says that close questioning fails to discover any chariot and challenges
    Milinda’s claim before the assembled audience.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The five hundred Yonakas applaud Nagasena and tell Milinda to answer if he
    can.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Milinda says that the word 'chariot' is a way of counting, term, appellation,
    convenient designation, and name for the chariot’s parts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena applies the same analysis to his own name, saying it is a designation
    for bodily elements and the five groups, and that no Ego is found in the absolute
    sense.
  category: speech
  evidence_refs:
  - ev:4
