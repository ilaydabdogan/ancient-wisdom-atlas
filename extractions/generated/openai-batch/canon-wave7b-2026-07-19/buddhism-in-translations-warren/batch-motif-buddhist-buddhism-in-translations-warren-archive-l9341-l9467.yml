canonical_text:
  quote: "“On ignorance depends karma; on karma depends consciousness.”"
  summary: 'The passage explains dependent origination through the Wheel of Existence.
    It states that ignorance and desire condition further factors of existence, that
    sorrow and similar states are the fruition of ignorance and depravity, and that
    the wheel rolls without known beginning. It uses a serpent simile: grasping ignorance
    is like seizing a serpent’s head and being bound by its coils, while cutting off
    the serpent’s head is like the cessation of ignorance and release.'
  language: English
  quote_policy: quoted
