canonical_text:
  quote: ''
  summary: A doctrinal exposition describes the Wheel of Existence as causally conditioned
    by factors such as ignorance, karma, and desire, not by Brahma or an Ego. It explains
    the wheel’s twelvefold emptiness, its roots in ignorance and desire, its division
    across past, present, and future, its causal connections, divisions, component
    spokes, and its relation to former karma-existence and conception into present
    existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that factors of being, including karma, exist by reason
    of their own causes, such as ignorance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wheel of Existence is said to lack any other cause for the round of rebirth,
    including Brahma-like causes, and to lack a passive Ego receiving happiness and
    misery.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ignorance and the other terms are described as empty of stability, loveliness,
    happiness, and a self-determining Ego; the Wheel of Existence is therefore described
    as empty with a twelvefold emptiness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After learning this analysis, a person perceives ignorance and desire as the
    root of the Wheel, the past, present, and future as its three times, and two,
    eight, and two members in those times.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:5
  text: 'The root of the Wheel is described as twofold: ignorance deriving from the
    past and ending with sensation, and desire continuing into the future and ending
    with old age and death.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the ignorance of those inclined to heresy and the desire
