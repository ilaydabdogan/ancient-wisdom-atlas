canonical_text:
  quote: ''
  summary: The passage explains Name and Form as mutually dependent by comparing them
    to a blind man and a cripple who can travel only by supporting one another. It
    then explains the arising and cessation of Name and Form through the simile of
    sound produced by a lute. It defines the six organs of sense, describes contact
    by similes of collision between rams, hands, and cymbals, and briefly classifies
    sensation and desire.
  language: English
  quote_policy: summarized
