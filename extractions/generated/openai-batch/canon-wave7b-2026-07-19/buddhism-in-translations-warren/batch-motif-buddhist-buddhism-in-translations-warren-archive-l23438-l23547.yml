canonical_text:
  quote: ''
  summary: The passage recounts Visakha's public entry into Savatthi, her redistribution
    of gifts to the city's families, her night care for a mare that has given birth,
    and a household conflict in which Migara honors naked ascetics while neglecting
    the Buddha and later ignores a Buddhist elder on begging rounds. Visakha rejects
    the ascetics as true saints, redirects the elder, and is threatened with expulsion,
    but the servants belong to her and do not act against her.
  language: English
  quote_policy: summarized
