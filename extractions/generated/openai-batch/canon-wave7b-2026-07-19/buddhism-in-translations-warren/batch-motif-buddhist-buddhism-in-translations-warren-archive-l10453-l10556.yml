  quote: ''
  summary: A doctrinal exposition classifies kinds of existence by realms, perception-status,
    and attachment-groups; explains why karma and existence are discussed again in
    dependent relation to ignorance and attachment; and gives divisions and summings-up
    of existences dependent on attachment.
  language: English
