literal_observations:
- id: obs:1
  text: The passage classifies existence into realms of sensual pleasure, form, formlessness,
    perception, non-perception, and neither perception nor non-perception.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Existence in the realm of perception is explained by the presence or constitutive
    role of perception; existence in non-perception is described as the converse;
    and the realm of neither perception nor non-perception is said to have only subtle
    perception.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Existence in the realms of sensual pleasure and form is identified with five
    attachment-groups; formlessness and neither perception nor non-perception with
    four attachment-groups; and non-perception with one attachment-group.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The exposition distinguishes karma of a previous existence, which is a condition
    for conception into the present existence, from present karma, which is a condition
    for conception into a future existence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts the statement that ignorance conditions karma with the
    statement that attachment conditions existence, explaining that the latter includes
    all elements of being because originating-existence is included.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Karma depending on attachment is said to produce existence, and the groups
    arising from it are called originating-existence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage counts twenty-four divided existences dependent on attachment,
    and then sums them as twelve existences when karma-existence and originating-existence
    are put together.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
