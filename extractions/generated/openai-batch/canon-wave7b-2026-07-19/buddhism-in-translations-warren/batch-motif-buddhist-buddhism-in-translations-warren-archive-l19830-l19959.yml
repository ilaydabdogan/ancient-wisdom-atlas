canonical_text:
  quote: ''
  summary: The passage distinguishes a dead man from a priest in the trance of the
    cessation of perception and sensation, explains that this trance cannot simply
    be called conditioned or unconditioned, and presents the development of wisdom
    through four paths as leading to trance, honor, rebirth outcomes, non-return,
    liberation, powers, and the disentangling of the snarl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mind of a priest risen from the trance of cessation is described as inclined,
    tending, and impelled to isolation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dead man is described as having bodily, vocal, and mental karma ceased,
    vitality exhausted, natural heat subsided, and senses broken up.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A priest in the cessation of perception and sensation is described as having
    bodily, vocal, and mental karma ceased, while vitality, natural heat, and senses
    remain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The trance of cessation is said not to be classifiable as conditioned or unconditioned,
    worldly or transcendent; because it can be entered, it is called brought about.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wise cultivators of saint-making wisdom are said to reach the holy trance,
    which saints prize and regard as Nirvana in the present life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One who develops fourfold path-wisdom is described as worthy of worship, veneration,
    votive offerings, and reverence from gods and men, and as a source of merit for
    the world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Developers of the first path are grouped by faculties and insight, with rebirth
    limits of seven, two or three, or one human birth before making an end of misery.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: One who develops the second path is said to return once more to this world
    and then make an end of misery.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: One who develops the third path never returns and has a fivefold destiny involving
    Nirvana in the Pure Abodes, with or without instigation, or ascent to the Sublime
    Gods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Developers of the fourth path include those freed by faith, freed by wisdom,
    doubly freed, possessors of threefold knowledge, possessors of the Six High Powers,
    and the greatest who has analytical sciences and no depravity.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The final liberated figure is described as disentangling the snarl while in
    the paths and as having disentangled it in the fruits.
  category: action
  evidence_refs:
  - ev:10
