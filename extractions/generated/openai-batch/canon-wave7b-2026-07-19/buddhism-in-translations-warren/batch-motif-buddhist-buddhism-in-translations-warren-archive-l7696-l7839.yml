canonical_text:
  quote: ''
  summary: Sariputta visits Yamaka and questions him about a view that an undefiled
    priest is annihilated after death. Through a series of questions about form, sensation,
    perception, predispositions, and consciousness, Sariputta teaches that these are
    transitory and not self. He then questions whether the saint can be identified
    with or apart from the aggregates, leading Yamaka to abandon his stated view and
    accept the doctrinal instruction.
  language: English
  quote_policy: summarized
