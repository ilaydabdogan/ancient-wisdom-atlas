canonical_text:
  quote: ''
  summary: 'The passage closes a wish-free Birth-Story by explaining that desire remains
    unsatisfied and by identifying past-life characters. It then begins an analysis
    from the Visuddhi-Magga explaining the five groups and five attachment-groups:
    form, sensation, perception, predispositions, and consciousness. These groups
    are said to classify the constituents of being and to provide the basis for the
    mistaken persuasion of an Ego.'
  language: English
  quote_policy: summarized
