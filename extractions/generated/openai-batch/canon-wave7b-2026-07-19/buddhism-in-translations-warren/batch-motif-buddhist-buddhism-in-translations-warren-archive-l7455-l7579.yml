canonical_text:
  quote: ''
  summary: A Buddhist doctrinal discourse contrasts delight in existence with attachment
    to non-existence as two ways of missing truth. It defines intelligent knowing
    as seeing things as they really are, leading toward aversion, absence of passion,
    and cessation. A following dialogue with Ananda analyzes views about the Ego in
    relation to sensation and rejects identifying sensation with an enduring Ego.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gods and men are said to delight in existence, take pleasure in existence,
    and fail to adopt the doctrine for cessation of existence when it is preached.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The discourse labels this failure to adopt the doctrine of cessation as falling
    short of the truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some are described as distressed by and loathing existence, welcoming non-existence,
    and approving the claim that the Ego is annihilated after bodily dissolution.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The discourse labels this welcome of non-existence as outrunning the truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The intelligent are said to know the truth through knowing things as they
    really are.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A priest who knows things as they really are is described as being on the
    road to aversion for things, absence of passion for them, and cessation from them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The dialogue with Ananda lists three views concerning the Ego: sensation
    is the Ego; sensation is not the Ego and the Ego has no sensation; or the Ego
    has sensation and a faculty of sensation.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The teacher distinguishes three sensations: pleasant, unpleasant, and indifferent.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that when a person experiences one of the three kinds of
    sensation, the other two are not experienced at the same time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pleasant, unpleasant, and indifferent sensations are each described as transitory,
    causally conditioned, dependently originated, and subject to decay, disappearance,
    effacement, and cessation.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The discourse argues that identifying sensation with the Ego would make the
    Ego transitory and subject to rise and disappearance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The teacher states that it is not possible to hold the view that sensation
    is the Ego, and also rejects the view that the Ego has no sensation by asking
    whether there is any 'I am' where there is no sensation.
  category: speech
  evidence_refs:
  - ev:8
