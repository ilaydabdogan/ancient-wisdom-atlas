canonical_text:
  quote: "“The deathless has been gained, and I will instruct you, and teach you the
    Doctrine.”"
  summary: After Upaka departs by another road, the narrator approaches the deer-park
    Isipatana near Benares, where the band of five priests first resolves not to honor
    him but then receives him with ordinary services. The narrator, identified as
    Gotama and self-designated as the Tathagata, declares that the deathless has been
    gained, rejects the charge of luxury, teaches the priests, wins them over, and
    arranges instruction while the others go for alms to support all six.
  language: English
  quote_policy: quoted
