canonical_text:
  quote: ''
  summary: After Channa returns grieving over Kanthaka's death, the Future Buddha
    retires from the world, begs in Rajagaha, refuses royal glory, pursues and rejects
    meditation training that does not lead to enlightenment, and begins the six-year
    Great Struggle at Uruvela with five attendants serving him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Channa's grief is increased by the death of Kanthaka, and he returns to the
    city weeping and wailing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Future Buddha retires from the world, spends a week in joy at the Anupiya
    mango-grove, then walks to Rajagaha and begs house to house without passing any
    by.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Future Buddha's beauty throws the whole city into commotion, compared
    in the passage to other entrances that caused commotion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king's men report an unidentified being begging in the city and say they
    do not know whether he is a god, man, serpent, or bird.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king watches from his palace roof and orders his men to investigate by
    observing whether the being vanishes, departs through the air, sinks into the
    ground, or eats alms-food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Great Being collects scraps, leaves by the same gate, sits facing east
    in the shade of Pandava rock, and struggles with disgust before eating.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Great Being admonishes himself by recalling his former wish to live like
    a monk and eat begged food; after this, his disgust subsides and he eats.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king approaches the Future Buddha, is pleased with his deportment, and
    offers him all his kingly glory.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Future Buddha refuses the king's offer, saying he does not seek sense
    or passion gratification but has retired for supreme and absolute enlightenment.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king predicts that the Future Buddha will become a Buddha and asks that
    his first journey then be to the king's kingdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Future Buddha studies with Alara Kalama and Uddaka, disciple of Rama,
    and acquires the eight stages of meditation, but stops practicing them after deciding
    they do not lead to enlightenment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Future Buddha goes to Uruvela, calls the spot delightful, takes up residence
    there, and begins the Great Struggle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Five persons, Kondanna and others, meet the Future Buddha and serve him during
    the six years of the Great Struggle while repeatedly expecting him to become a
    Buddha.
  category: relationship
  evidence_refs:
  - ev:8
