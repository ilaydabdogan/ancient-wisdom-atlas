canonical_text:
  quote: ''
  summary: 'The passage ends a verse tale in which personified Death treats lameness,
    blindness, and deafness as sufficient warnings before touching old Dobson with
    a dart. It then gives the Jataka tale of an ass dressed in a lion''s skin: a peddler
    uses the disguise to frighten field-watchers until the ass brays, is exposed,
    beaten, and dies; the Teacher identifies the ass as Kokalika and the wise farmer
    as himself. The next section begins the story of Husband-honorer: a Dhammapada
    verse says Death overpowers one absorbed in pleasures; a goddess in the Heaven
    of the Thirty-three falls from that existence, is reborn in Savatthi with memory
    of former lives, and makes offerings and alms hoping to be reborn again with her
    divine husband Garland-wearer.'
  language: English
  quote_policy: summarized
