canonical_text:
  quote: ''
  summary: Sujata prepares a milk-rice offering on the full-moon day of Visakha. Miraculous
    signs accompany the milking and cooking, and guardian deities assist. Punna finds
    the Future Buddha radiant at the foot of the tree and reports that the presumed
    tree-deity is ready to receive the offering. Sujata brings milk-rice in a golden
    dish with flower-scented water, gives it to the Future Buddha, recognizes him
    as a holy man, and departs without reclaiming the costly dish.
  language: English
  quote_policy: summarized
