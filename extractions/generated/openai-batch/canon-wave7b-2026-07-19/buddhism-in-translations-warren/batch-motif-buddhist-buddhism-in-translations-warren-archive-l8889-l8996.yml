  quote: ''
  summary: The passage presents Buddhist doctrinal excerpts on consciousness becoming
    free when it has no resting-place and no longer accumulates karma; the Blessed
    One teaching priests at Jetavana to abandon attachment to form, sensation, perception,
    predispositions, and consciousness; a verse stating that desire causes existence
    and that sentient life endures rebirth and misery; and a Visuddhi-Magga example
    in which the changing colors and falling of an Asoka leaf are used by a meditative
    priest to apply the Three Characteristics to inanimate nature.
