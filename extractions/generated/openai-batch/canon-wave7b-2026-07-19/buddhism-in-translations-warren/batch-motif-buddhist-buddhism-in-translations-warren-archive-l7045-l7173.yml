canonical_text:
  quote: ''
  summary: Gotama questions Vaccha about a fire that depends on fuel and becomes extinct
    when fuel is gone, then applies the analogy to the saint released from form and
    consciousness, for whom rebirth predicates do not fit. Vaccha praises Gotama’s
    doctrine through images of a clean sal-tree, disclosure, guidance, and a lamp
    in darkness, then takes refuge as a disciple. A following passage introduces King
    Milinda and Nagasena, who agree to converse in the manner of the wise rather than
    in the coercive manner of kings.
