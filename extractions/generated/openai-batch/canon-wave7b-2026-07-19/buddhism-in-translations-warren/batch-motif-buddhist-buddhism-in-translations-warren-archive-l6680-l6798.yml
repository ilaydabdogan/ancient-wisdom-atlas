canonical_text:
  quote: ''
  summary: The Blessed One addresses Malunkyaputta about speculative questions concerning
    the eternity or finitude of the world, the relation of soul and body, and the
    post-mortem status of the saint. He compares delaying religious life until such
    questions are answered to a wounded man refusing removal of a poison-smeared arrow
    until he learns irrelevant details about the attacker and weapon. He states that
    religious life does not depend on these dogmas and that birth, old age, death,
    sorrow, and related suffering remain to be extinguished.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Malunkyaputta denies that the Blessed One promised to answer certain metaphysical
    questions as a condition of his leading the religious life, and denies that he
    himself made such a condition.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One says that anyone refusing to lead the religious life until
    the Tathagata answers such questions would die before the questions were elucidated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One introduces a simile in which a man has been wounded by an
    arrow thickly smeared with poison, and the man’s friends, companions, relatives,
    and kinsfolk obtain a physician or surgeon for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the simile, the sick man refuses to have the arrow removed until he learns
    details about the man who wounded him, including caste, name, clan, height, skin
    color, and place of origin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the simile, the sick man also refuses removal until he learns details about
    the bow, bowstring, shaft, feathering, binding sinews, and arrow type.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One says the wounded man would die without having learned these
    details.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One says the religious life does not depend on dogmas about whether
    the world is eternal or not eternal, finite or not finite, whether soul and body
    are identical, or whether the saint exists after death.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The Blessed One states that, regardless of such dogmas, birth, old age, death,
    sorrow, lamentation, misery, grief, and despair remain, and he prescribes for
    their extinction in the present life.
  category: speech
  evidence_refs:
  - ev:7
