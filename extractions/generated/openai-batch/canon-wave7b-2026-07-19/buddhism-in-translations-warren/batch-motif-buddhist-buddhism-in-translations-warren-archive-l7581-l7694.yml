  quote: ''
  summary: The passage first continues a doctrinal exchange with Ananda about sensation,
    ego-views, non-attachment, Nirvana, and the inapplicability of postmortem existence
    claims to a freed saint. It then introduces a Samyutta-Nikaya episode in which
    the priest Yamaka holds that an undefiled saint is annihilated after death; other
    priests admonish him, fail to change his view, and ask Sariputta to intervene.
