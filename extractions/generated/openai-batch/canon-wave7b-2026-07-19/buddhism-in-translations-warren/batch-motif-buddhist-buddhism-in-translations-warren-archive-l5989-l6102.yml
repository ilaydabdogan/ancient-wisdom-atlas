  summary: Subhadda, a wandering ascetic, seeks to see Gotama before Gotama’s expected
    passing into Nirvana. Ananda initially refuses because the Blessed One is weary,
    but the Blessed One hears the exchange and permits Subhadda to come. Subhadda
    respectfully approaches and asks whether several renowned sect leaders have discovered
    truth; the Blessed One sets that question aside and says he will teach the Doctrine.
