canonical_text:
  quote: ''
  summary: 'A memorial passage describes Henry Clarke Warren''s scholarly exchange
    with a king, his role in the Harvard Oriental Series, and the Editor''s stated
    purpose for that series: diffusing knowledge, supporting study of India and non-Christian
    religions, correcting errors about Buddhism and other Oriental systems, and promoting
    East-West mutual understanding. In the context of world war, the passage presents
    mutual understanding and goodwill, identified with Buddha''s preaching, as urgent
    tasks for the world''s peoples and for Orientalist scholarship.'
  language: English
  quote_policy: summarized
