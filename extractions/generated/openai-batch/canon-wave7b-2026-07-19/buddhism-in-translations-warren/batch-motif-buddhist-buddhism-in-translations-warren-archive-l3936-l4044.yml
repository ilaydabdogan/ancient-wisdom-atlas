canonical_text:
  quote: "“It behooves me this very day to quit the household life”"
  summary: The passage narrates the Future Buddha’s divine adornment, the birth and
    naming of Rahula, Kisa Gotami’s praise-song, the Future Buddha’s reflection on
    Nirvana as extinction of the fires of passion, his resolve to leave household
    life, his gift to Kisa Gotami, and his disillusionment with palace entertainment
    after seeing the sleeping women.
  language: English
  quote_policy: quoted
