canonical_text:
  quote: for there is no Ego here to be found.
  summary: King Milinda approaches the venerable Nagasena and questions him about
    his name and his statement that no Ego can be found. Milinda challenges the moral
    and doctrinal consequences of this claim, asks whether Nagasena is identifiable
    with bodily parts or the five aggregates, and accuses him of falsehood. Nagasena
    responds by beginning an analogy based on Milinda's chariot and its parts.
  language: English
  quote_policy: quoted
