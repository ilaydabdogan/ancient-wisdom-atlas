canonical_text:
  quote: ''
  summary: The passage and notes describe defects and advantages of ascetic clothing
    and lodging, including bark dress, a leaf-hut, and living at the foot of trees.
    Sumedha rejects cultivated grain, lives on wild fruit, makes strenuous effort
    while sitting, standing, and walking, and attains the Powers High within seven
    days. Dipamkara is born and associated with signs at conception, birth, Buddhahood,
    and first preaching. A community clears the path for Dipamkara, while Sumedha
    leaves his hermitage and passes through the air in bark garments.
  language: English
  quote_policy: summarized
