canonical_text:
  quote: ''
  summary: The Blessed One, dwelling among the Kurus at Kamma-sadhamma, speaks with
    Ananda about Dependent Origination. Ananda calls it profound yet clear to him;
    the Blessed One warns that it is profound and that lack of understanding leaves
    mankind entangled and unable to escape suffering and rebirth. The discourse enumerates
    dependencies from consciousness and name-and-form through contact, sensation,
    desire, attachment, existence, birth, and old age and death, concluding that the
    aggregation of misery arises in this way. The passage then explains that if birth
    did not occur in any world for any class of beings, old age and death would not
    occur, so birth is the cause and dependence of old age and death.
  language: English
  quote_policy: summarized
