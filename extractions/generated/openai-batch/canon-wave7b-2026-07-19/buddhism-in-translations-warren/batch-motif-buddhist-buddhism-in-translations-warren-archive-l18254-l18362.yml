canonical_text:
  quote: it is no living entity or Ego that walks
  summary: The passage analyzes walking, standing, sitting, and lying down as conditioned
    bodily processes produced by mind and the windy element rather than by a living
    entity or Ego. It uses analogies of a cart, oxen, driver, ships, arrows, machines,
    and ropes to explain conventional speech about bodily action, and it instructs
    priests to maintain accurate comprehension of bodily actions and states.
  language: English
  quote_policy: quoted
