canonical_text:
  quote: ''
  summary: A wealthy child identified in the passage as Nalaka renounces household
    wealth, takes monastic signs, reveres the Future Buddha, and later receives a
    course of conduct, attains saintship, and passes into final extinction. The royal
    infant Future Buddha is then given a naming rite; Brahmans inspect his bodily
    marks and prophesy his future. Seven Brahmans give a double prediction of Universal
    Monarch or Buddha, while Kondanna predicts only Buddhahood. Later, after Siddhattha
    retires from the world, Kondanna leads four sons of the earlier Brahmans into
    retirement, forming the Band of Five Elders.
  language: English
  quote_policy: summarized
