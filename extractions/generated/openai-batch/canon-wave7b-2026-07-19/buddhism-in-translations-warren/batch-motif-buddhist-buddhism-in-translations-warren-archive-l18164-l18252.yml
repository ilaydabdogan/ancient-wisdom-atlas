canonical_text:
  quote: ''
  summary: The passage describes contemplative analysis of respiration, trance, body,
    and bodily postures. A priest investigates expirations and inspirations as based
    on matter, material body, four elements, name, contact, and Dependent Origination;
    by applying the Three Characteristics to dependent name and form he proceeds toward
    saintship. A discourse section compares the priest’s comprehension of long and
    short breaths to a turner’s comprehension of long and short wheel-turns, then
    describes observing the body, its origination and destruction, and living without
    attachment. Notes explain that only a body is recognized, with no living entity
    or Ego, and contrast ordinary animal awareness of walking with the priest’s contemplative
    knowledge.
  language: English
  quote_policy: summarized
