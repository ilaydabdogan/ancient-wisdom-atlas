canonical_text:
  quote: ''
  summary: After a long interval, rain fills burned worlds, winds gather and restrain
    the water, and earth and heavens reappear. Beings formerly in the Heaven of the
    Radiant Gods are reborn on earth, taste the savory earth, lose their own light,
    and become afraid. The sun, moon, stars, time cycles, Mount Sineru, mountains,
    oceans, and continents then appear. Later, differences of appearance and contempt
    among beings are followed by the disappearance of savory earth and the emergence
    of plants, rice, pots, and spontaneous fire for cooking.
  language: English
  quote_policy: summarized
