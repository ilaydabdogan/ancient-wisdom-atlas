  summary: The passage describes the Dhammapada Commentary as a Ceylonese work that
    explains the circumstances of Buddha's Dhammapada stanzas through 299 stories
    or legends. It compares these tales to the Jataka Book, Christian saints' legends,
    and medieval Oriental and European literature, lists several attractive story
    titles, and summarizes E. W. Burlingame's Harvard translation work.
  language: English
  quote_policy: summarized
