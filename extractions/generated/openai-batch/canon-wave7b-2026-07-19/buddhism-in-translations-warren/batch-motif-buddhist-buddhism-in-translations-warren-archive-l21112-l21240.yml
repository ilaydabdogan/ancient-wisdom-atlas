canonical_text:
  quote: ''
  summary: 'The passage gives monastic disciplinary instructions attributed to the
    Blessed One: priests who have begun residence must not wander before completing
    the prescribed three-month period; at the end of residence they invite criticism
    from the congregation concerning what has been seen, heard, or suspected, with
    senior and junior priests using prescribed gestures and formulas. A later section
    set at Savatthi in Jetavana presents the Blessed One teaching the mendicant ideal,
    telling priests to take the moon as a pattern when begging, to remain aloof in
    body and mind, and to be unattached like a hand moving through air. Kassapa is
    named as an example of this conduct, and the passage closes with a question about
    worthy and unworthy teachers of the Doctrine.'
  language: English
  quote_policy: summarized
