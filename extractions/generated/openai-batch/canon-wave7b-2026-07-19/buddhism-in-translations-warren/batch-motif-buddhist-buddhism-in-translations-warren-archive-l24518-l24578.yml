canonical_text:
  quote: ''
  summary: The passage summarizes contents of a Metteyya recension, including the
    destruction of the world-cycle, episodes in Metteyya's life, and a sacred tree.
    It then states which beings will or will not behold Metteyya, promises saintship
    after hearing his doctrine, and lists ten figures as future Buddhas who will attain
    Supreme Wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The recension is said to include an account of the destruction of the Kappa,
    or World-Cycle, and prose insertions about Mahapanada and the capital of King
    Sankha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The recension is said to describe Metteyya's attainment of the Perfections,
    conception, birth, palaces, life there, departure from home, death, and a depiction
    of the sacred tree and the body of the future teacher.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The closing section frames its teaching with the question of who shall and
    shall not behold Metteyya, the Blessed One.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who create schism, those born in Avici hell from the five proximate-karma
    crimes, those holding wholly heretical views, those slandering noble disciples,
    and naked ascetics who create schism are said not to see Metteyya.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other beings who give gifts, keep precepts and fast-days, fulfill religious
    duties, found shrines, plant sacred fig-trees, make parks and groves, make bridges,
    clear highways, stand in the precepts, and dig wells are said to see Metteyya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Those who give even a handful of flowers, a single lamp, or a mouthful of
    food out of longing for a Blessed One are said to see Metteyya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those who support the Buddha's religion, aid preachers of the Doctrine, make
    offerings, sustain doctrinal ministrations, listen to the Vessantara Birth-Story,
    or give food to the congregation are said to see Metteyya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those who serve parents, honor elders among kin, give named kinds of food,
    and practice the ten means of acquiring merit are said to see Metteyya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After listening to the Doctrine of the Blessed Metteyya, the beings in view
    are said to attain saintship.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Blessed One names ten figures and states that they are future Buddhas
    who, in due course, will attain Supreme Wisdom.
  category: speech
  evidence_refs:
  - ev:5
