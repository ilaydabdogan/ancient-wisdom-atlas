canonical_text:
  quote: ''
  summary: 'Ananda weeps because he remains a learner while his compassionate Teacher
    is about to pass into Nirvana. The Buddha summons him, tells him not to grieve,
    teaches that all born and conditioned things are perishable, praises Ananda''s
    long devoted service, and tells him to exert himself. The Buddha then praises
    Ananda before the priests as a wise attendant of a Buddha and as possessing four
    wonderful qualities, likened to the qualities of a Universal Monarch: assemblies
    delight in seeing and hearing him and remain unsated when he stops speaking.'
  language: English
  quote_policy: summarized
