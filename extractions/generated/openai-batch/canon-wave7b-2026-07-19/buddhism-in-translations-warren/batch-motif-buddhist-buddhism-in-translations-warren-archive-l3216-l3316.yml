canonical_text:
  quote: ''
  summary: Queen Maha-Maya reports a dream to King Suddhodana. The king honors sixty-four
    Brahmans and asks them to interpret it. They predict that a male child is in the
    queen's womb and will become either a Universal Monarch or a Buddha. At the Future
    Buddha's conception, the ten thousand worlds quake and many extraordinary signs
    occur. Angelic guardians protect the mother and child. The mother is described
    as pure, well, and able to perceive the child in her womb. The passage also states
    special characteristics of a Future Buddha's mother, including a ten-month gestation
    and standing birth, and ends with the queen's request to visit Devadaha and the
    king's elaborate travel preparations.
  language: English
  quote_policy: summarized
