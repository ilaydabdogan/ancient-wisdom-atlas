  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the instant the Future Buddha was conceived, the ten thousand worlds quaked,
    quivered, and shook.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Thirty-two Prognostics included immeasurable light spreading through the
    ten thousand worlds and changes to human bodies and capacities, such as the blind
    seeing, the deaf hearing, the dumb speaking, the hunchbacked straightening, and
    the lame walking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The prognostics included prisoners being freed, fires in the hells going out,
    the hunger and thirst of the Manes being stilled, wild animals losing timidity,
    diseases ceasing, and mortals becoming mild-spoken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The prognostics included sweet-sounding animal cries, musical instruments
    sounding without being played, ornaments jingling, fair weather, a cool breeze,
    out-of-season rain, water issuing from the earth, birds ceasing to fly, rivers
    checking their flow, and the ocean becoming sweet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The prognostics included lotuses and flowers blooming in many places, flowers
    falling like a shower, celestial music playing in the sky, and the ten thousand
    worlds appearing like garlands or a decorated altar of flowers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: From the conception onward, four angels with swords guarded both the Future
    Buddha and his mother from harm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: No lustful thought arose in the Future Buddha's mother; she felt comfortable
