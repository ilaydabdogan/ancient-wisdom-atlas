canonical_text:
  quote: ''
  summary: A wife turns her husband against his blind parents by blaming them for
    household filth. He tricks the parents into traveling by cart into a forest, imitates
    robbers, and kills them while they urge him to save himself. The Teacher explains
    that Moggallana’s later suffering, including hell and repeated deaths by pounding,
    is the fruit of that former deed, and teaches verses on punishments for harming
    the harmless. A new discourse begins in which King Pasenadi visits the Blessed
    One and reports confiscating the wealth of a deceased sonless treasurer who had
    lived in extreme frugality despite great riches.
  language: English
  quote_policy: summarized
