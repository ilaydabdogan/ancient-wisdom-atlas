canonical_text:
  quote: If any suppliant comes, I will give him of my own flesh.
  summary: A Jataka passage tells of an otter, jackal, monkey, and the Future Buddha
    as a hare keeping precepts and preparing offerings. Sakka, whose throne grows
    hot from the hare's zeal, disguises himself as a Brahman and asks for food. The
    first three animals offer gathered food; the hare offers his own body, asks for
    live coals, shakes himself to spare insects, and jumps into the fire, which does
    not burn him.
  language: English
  quote_policy: quoted
