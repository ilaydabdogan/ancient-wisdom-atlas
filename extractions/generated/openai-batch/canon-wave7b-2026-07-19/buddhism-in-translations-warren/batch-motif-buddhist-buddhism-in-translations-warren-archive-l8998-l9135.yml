canonical_text:
  quote: ''
  summary: The passage teaches that views of being and non-being fall away when arising
    and ceasing are understood through highest knowledge. It defines Right Belief,
    states that the Tathagata avoids doctrinal extremes, and presents a middle doctrine
    of dependent arising and cessation from ignorance through birth, old age, death,
    and misery. A second discourse at Savatthi has the Blessed One address priests,
    reject questions that posit a separate holder of old age and death, birth, or
    karma, reject both soul-body identity and soul-body separation as extremes, and
    restate dependent conditions.
  language: English
  quote_policy: summarized
