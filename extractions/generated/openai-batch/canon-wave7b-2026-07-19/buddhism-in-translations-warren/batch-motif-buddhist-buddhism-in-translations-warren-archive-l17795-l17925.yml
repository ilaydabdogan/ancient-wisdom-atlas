canonical_text:
  quote: ''
  summary: 'The passage first describes a priest passing through advanced meditative
    attainments until he is beyond Mara''s reach. It then begins the sermon headed
    “Mara as Plowman”: at Savatthi, the Blessed One teaches Nirvana, Mara decides
    to perplex him, appears as a plowman, claims dominion over the sense faculties
    and their objects, and the Blessed One replies that Mara cannot come where these
    sense domains are absent.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest enters the fourth trance through abandoning happiness, misery, and
    antecedent gladness or grief; the fourth trance is described as neither misery
    nor happiness and as contemplation refined by indifference.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Of such a priest it is said that he has blinded Mara, made Mara's eye useless,
    and gone out of the Wicked One's sight.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A priest overpasses perceptions of form, inertia, and diversity, says that
    space is infinite, and dwells in the realm of the infinity of space.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A priest overpasses the realm of the infinity of space, says that consciousness
    is infinite, and dwells in the realm of the infinity of consciousness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A priest overpasses the realm of the infinity of consciousness, says that
