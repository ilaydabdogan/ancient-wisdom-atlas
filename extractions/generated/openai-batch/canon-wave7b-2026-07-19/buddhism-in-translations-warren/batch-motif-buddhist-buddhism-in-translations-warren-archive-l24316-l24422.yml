  quote: ''
  summary: The excerpt opens with a simile comparing Visakha's inclination toward
    noble deeds to a garland-maker making many garlands from many flowers. It then
    introduces a manuscript account of the Anagata-Vamsa, or History of Future Events.
    In the narrative, the Blessed One dwells at Kapilavatthu by the Rohani River;
    Sariputta asks about the future Conqueror. The Blessed One names earlier Buddhas,
    identifies himself as the present Supreme Buddha, says Metteyya will come after
    him, and describes future decline of the holy religion through five disappearances,
    with details on the disappearance of attainments and the method.
