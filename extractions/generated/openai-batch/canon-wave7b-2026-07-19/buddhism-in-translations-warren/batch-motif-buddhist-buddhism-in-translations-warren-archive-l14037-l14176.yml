  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The Teacher applies the moral and identifies the Birth-Story characters:
    the Brahman and his wife were the Brahman and Brahman woman of those existences,
    and the son was the Teacher himself.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the next story, the Teacher, while first visiting Kapilapura, induces his
    youngest brother prince Nanda to join the Order and later comes to Savatthi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: As Nanda leaves home with the Blessed One's bowl, Belle-of-the-Country looks
