  text: The aged Brahman falls at the Teacher's feet, seizes his ankles, calls him
    his dear boy, asks why he has not cared for his aged parents, and takes him home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahman's wife falls at the Teacher's feet, weeps, addresses him as her
    dear boy, asks why he has been away so long, and tells her sons and daughters
    to bow to their brother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brahman and his wife offer a meal; the Teacher preaches the Discourse
    on Old Age; both become established in the fruit of never returning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The priests discuss that the Brahman knows the Tathagata's father is Suddhodana
