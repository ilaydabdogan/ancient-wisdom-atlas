canonical_text:
  quote: ''
  summary: 'The passage first narrates the Saketa Birth-Story: an aged Brahman and
    his wife recognize the Buddha as their son, host him, and attain the fruit of
    never returning after his teaching. When priests question why the Buddha accepts
    this filial address despite his known parents, he explains that the couple had
    been his parents and other close kin through many former existences; a stanza
    explains instinctive trust through previous friendship. The passage then begins
    another Jataka episode concerning Nanda, who is induced to join the Order but
    becomes love-sick for Belle-of-the-Country, prompting the Teacher to visit him
    and propose a journey through the Himalaya Mountains.'
  language: English
  quote_policy: summarized
