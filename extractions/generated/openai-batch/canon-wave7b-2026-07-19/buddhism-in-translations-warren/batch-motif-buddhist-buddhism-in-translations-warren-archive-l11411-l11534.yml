canonical_text:
  quote: ''
  summary: 'The passage explains karma through doctrinal statements and similes. Deeds
    performed without covetousness, hatred, or infatuation are abandoned and unable
    to arise again, like seed burned to soot and dispersed. A verse states that deeds
    from former births bear consequences, but the wise priest avoids covetousness,
    hatred, and infatuation. A further discourse distinguishes between saying one
    must reap exactly according to deeds and saying the reward accords with deeds,
    allowing religious life and the extinction of misery. It compares two people who
    commit the same slight wicked deed: one, limited and undeveloped, is brought to
    hell; the other, disciplined and wise, expiates it in the present life. This difference
    is illustrated by a lump of salt making a small cup undrinkable but not salting
    the river Ganges.'
  language: English
  quote_policy: summarized
