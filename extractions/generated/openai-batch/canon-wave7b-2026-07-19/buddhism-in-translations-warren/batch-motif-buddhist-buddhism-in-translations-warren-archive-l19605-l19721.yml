canonical_text:
  quote: It is the stoppage of all mentality by a gradual cessation.
  summary: 'The passage describes the trance of cessation: a priest prepares for meditation,
    passes through successive trances and formless realms, practices insight into
    the constituents of being, and performs preliminary duties before entering cessation.
    It also explains protective resolves for belongings, gives the tradition of Elder
    Naga the Great remaining unharmed during a fire while in cessation, distinguishes
    articles protected by the trance itself, and explains the practitioner’s duty
    to arise if summoned by the Order.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Cessation is defined as the stoppage of all mentality by gradual cessation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A priest wishing to enter cessation takes breakfast, washes hands and feet,
    sits cross-legged on a well-strewn seat in a retired spot, keeps the body erect,
    and activates the contemplative faculty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest enters the first trance and, after rising from it, gains insight
    into the transitoriness, misery, and lack of an Ego of the constituents of being.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage distinguishes three kinds of insight: insight into the constituents
    of being, insight belonging to attainment of the Fruits, and insight belonging
    to the trance of cessation.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the trance of cessation, the practitioner is instructed to contemplate
    with insight that is neither very dull nor very keen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner successively enters the second, third, and fourth trances,
    the realms of the infinity of space and consciousness, and the realm of nothingness,
    rising after each to obtain insight as before.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'After rising from the realm of nothingness, the practitioner performs four
    preliminary duties: protection of less intimate belongings, respect for the Order,
    a summons from The Teacher, and limitation of time.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Less intimate belongings include items such as bowl, robes, couch, bench,
    dwelling, and requisites; these are to be protected from fire, water, wind, robbers,
    rats, and similar dangers by a firm resolve.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The firm resolve is formulated for a seven-day period; if it is made, no harm
    touches the articles during that period, but if it is not made the articles are
    liable to perish.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the tradition about Elder Naga the Great, he receives rice-gruel from his
    mother, sits in a reception-hall, and enters cessation; while he is sitting there,
    the hall catches fire and other priests flee with their mats.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the same tradition, the villagers call Elder Naga lazy, the fire surrounds
    him, the villagers extinguish the fire with water, clean the ground, scatter flowers,
    and stand worshiping him; when the fixed term has elapsed, he rises from trance,
    springs into the air, and goes to the island Piyangu.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Articles intimately joined to the priest, such as tunic, upper garment, or
    the seat on which he sits, do not require a special resolve because the trance
    itself protects them.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says the concentration of the venerable Sanjiva and the venerable
    Sariputta possesses magical power.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Before entering cessation, the practitioner should reflect that if the Order
    needs to pass a resolution or perform another ecclesiastical function, he will
    arise before being summoned; if he has not reflected and is summoned by authority
    of the Order, he must rise when the messenger is within hearing and calls him.
  category: sequence
  evidence_refs:
  - ev:10
