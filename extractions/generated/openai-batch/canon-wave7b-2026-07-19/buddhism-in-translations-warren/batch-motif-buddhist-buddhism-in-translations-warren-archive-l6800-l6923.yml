canonical_text:
  quote: ''
  summary: The passage ends a discourse to Malunkyaputta in which The Blessed One
    says he has not elucidated speculative views about the eternity or finitude of
    the world, the relation of soul and body, or the saint's status after death, because
    they do not profit the religious life. He says he has elucidated misery, its origin,
    its cessation, and the path to its cessation because these lead toward wisdom
    and Nirvana. The next sermon begins with Vaccha the wandering ascetic visiting
    The Blessed One at Jetavana and asking whether he holds several exclusive metaphysical
    views; The Blessed One denies holding them.
  language: English
  quote_policy: summarized
