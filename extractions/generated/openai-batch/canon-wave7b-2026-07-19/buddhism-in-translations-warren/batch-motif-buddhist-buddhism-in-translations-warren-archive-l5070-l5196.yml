canonical_text:
  quote: ''
  summary: The Blessed One contemplates Dependent Origination forward and backward
    during the three watches of the night and utters verses on knowing causes and
    their ending. After seven days he moves from the Bo-tree to the Ajapala banyan-tree,
    where he sits in emancipation and answers a Brahman about what makes a true Brahman.
    After another seven days he moves to the Mucalinda tree; during unseasonable rain
    and cold wind, Mucalinda the serpent-king coils around him and spreads his hood
    to protect him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the first watch of the night, The Blessed One thought over Dependent
    Origination forward and backward, including a chain from ignorance through karma,
    consciousness, name and form, sense organs, contact, sensation, desire, attachment,
    existence, and birth to old age, death, and forms of misery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage states the reverse cessation sequence: with the fading and cessation
    of ignorance, the subsequent links cease, ending the aggregation of misery.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the first watch, The Blessed One uttered a verse saying doubts vanish
    when the elements of being come to light and their causes are known.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the middle watch and last watch, The Blessed One again thought over
    Dependent Origination forward and backward and uttered verses on causes ending
    and on scattering Mara's army like the sun lighting the heavens.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: After seven days, The Blessed One left the foot of the Bo-tree, went to the
    Ajapala banyan-tree, and sat cross-legged there for seven days experiencing the
    bliss of emancipation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: A Brahman described as proud and contemptuous approached The Blessed One,
    exchanged greetings, stood respectfully to one side, and asked what constitutes
    a Brahman and what the Brahman-making qualities are.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: The Blessed One replied in verse that the Brahman who has banished evil traits,
    is free from pride, self-restrained, spotless, learned, and has followed the holy
    life may claim the name Brahman.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: After another seven days, The Blessed One left the Ajapala banyan-tree, went
    to the Mucalinda tree, and sat cross-legged there for seven days experiencing
    the bliss of emancipation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: At that time a great cloud appeared out of season, and for seven days there
    was rainy, cloudy weather with a cold wind.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:10
  text: Mucalinda the serpent-king came from his abode, wrapped The Blessed One's
    body seven times with his folds, spread his great hood above The Blessed One's
    head, and spoke a protective wish against cold, heat, insects, wind, sunshine,
    and creeping creatures.
  category: action
