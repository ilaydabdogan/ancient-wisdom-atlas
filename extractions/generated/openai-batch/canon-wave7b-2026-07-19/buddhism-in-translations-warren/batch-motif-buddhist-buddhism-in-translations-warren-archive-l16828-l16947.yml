canonical_text:
  quote: ''
  summary: 'The passage describes a world-cycle perishing by wind: dust, sand, stones,
    trees, earth, mountains, heavens, and worlds are lifted, shattered, and destroyed.
    It then gives a cyclical scheme of destructions by fire, water, and wind, links
    these modes to preponderant defilements, notes rebirth in heavens after destruction,
    describes recollection of former existences and world-cycles, and defines wisdom
    as insight into the truths concerning misery, its origin, cessation, and the path.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wind that destroys a world-cycle first lifts dust, sand, grit, stones, boulders,
    and mighty hill-top trees from the earth to the zenith, where they are pulverized
    and annihilated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wind arises from beneath the earth, overturns the ground, throws large
    regions upward, and destroys them in the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wind throws the mountains encircling the earth and Mount Sineru into the
    sky, where they meet, grind together, and are destroyed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Earthly mansions, sky mansions, the six heavens of sensual desire, and a vast
    number of worlds are destroyed as worlds and mountains collide with one another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wind extends upward through heavens accessible by the third trance, destroys
    three Brahma-heavens, and stops at the Heaven of the Richly Rewarded Gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the destruction, upper and lower space become one and dark; the Heaven
    of the Completely Lustrous Gods appears, and beings leave the Heaven of the Richly
    Rewarded Gods to be reborn there or in a lower heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Four immensities make one great world-cycle: from the cycle-destroying great
    cloud to the end of the destroying wind, from the wind to the salutary great cloud,
    from that cloud to the appearance of the sun and moon, and from the sun and moon
    to the next cycle-destroying great cloud.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage explains world-destruction modes by the preponderance of wickedness:
    passion is linked with destruction by fire, hatred with destruction by water,
    and infatuation with destruction by wind; it also reports a variant that reverses
    fire and water for passion and hatred.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The world is said to perish seven times by fire and the eighth time by water
    in repeated sequence; after sixty-three world-cycles, wind takes its turn, and
    the Heaven of the Completely Lustrous Gods is destroyed when its beings reach
    a sixty-four-cycle term.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A priest who can call to mind former existences and former world-cycles can
    remember many destructions, renovations, and destruction-renovation sequences
    of a world-cycle.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wisdom is defined as knowledge consisting in insight and conjoined with meritorious
    thoughts.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Elevated wisdom is described as knowing the truth concerning misery, its origin,
    its cessation, and the path leading to its cessation.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Training in insight develops wisdom, and the development of wisdom abandons
    ignorance.
  category: relationship
  evidence_refs:
  - ev:11
