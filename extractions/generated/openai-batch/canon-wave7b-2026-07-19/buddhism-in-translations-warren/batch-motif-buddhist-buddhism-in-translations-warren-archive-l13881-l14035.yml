canonical_text:
  quote: Death comes and overpowereth him.
  summary: A woman called Husband-honorer serves the priests, gives alms, observes
    the precepts, dies suddenly, and is reborn beside her celestial husband Garland-wearer
    among the Gods of the Suite of the Thirty-three. Her account of human life causes
    the god to reflect on the brevity and recklessness of human existence. The priests
    ask The Teacher about her rebirth, and The Teacher explains her return to her
    former divine husband and teaches that death overpowers beings while they still
    pursue pleasures.
  language: English
  quote_policy: quoted
