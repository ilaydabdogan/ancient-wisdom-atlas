canonical_text:
  quote: ''
  summary: The passage first explains karma as an informing principle needing embodiment,
    describes passionless action as barren, and introduces Jataka Birth-Stories as
    accounts of prior existences of the Buddha and as traveling folklore. It then
    presents a Samyutta-Nikaya dialogue in which King Pasenadi tells the Blessed One
    that those who do evil by body, voice, and mind do not truly love themselves,
    while those who do good do love themselves; the Blessed One affirms this teaching.
  language: English
