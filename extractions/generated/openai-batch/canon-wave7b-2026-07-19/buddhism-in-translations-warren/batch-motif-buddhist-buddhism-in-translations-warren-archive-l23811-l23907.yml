canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from the story of Visakha: her household
    becomes connected with the Buddha''s religion; she is honored with a light parure
    after benefiting her father-in-law; she gives alms, receives boons, has many descendants,
    remains youthful, and is reputed to bring good luck; her great strength is tested
    by a king with an elephant; and at a festival she removes her ornaments before
    proceeding at the monastery.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visakha invites The Teacher again, her mother-in-law attains the fruit of
    conversion, and the house thereafter keeps open doors for the religion of The
    Buddha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The treasurer thinks Visakha is a great benefactress and decides to give her
    a light ornament suitable for everyday wear in all four postures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The treasurer has a highly polished parure made, worth a thousand pieces of
    money.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The treasurer invites The Buddha and the congregation of priests, serves them
    breakfast, has Visakha bathed with sixteen pitcherfuls of perfumed water, places
    her before The Teacher, puts the parure on her, and has her perform obeisance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Visakha continues to give alms and perform deeds of merit, and she receives
    eight boons from The Teacher.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Visakha's descendants are said to increase through successive generations
    until they number eight thousand four hundred and twenty persons.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Visakha lives to one hundred and twenty years old, has no gray hair, and appears
    about sixteen.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: People admire Visakha in the four postures of walking, standing, sitting,
    and lying.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Visakha is said to be as strong as five elephants, and the king releases an
    elephant against her to test this report.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Visakha takes the elephant's trunk with two fingers, presses him back, and
    the elephant falls back on his haunches in the royal court.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Savatthi, Visakha has many children and grandchildren who are free from
    disease, and she is considered to bring good luck.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: On holidays and festivals, Visakha is invited and feasted first.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: During a merry-making at Savatthi, people in fine clothes and ornaments go
    to the monastery to listen to the Doctrine.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Visakha, in gorgeous array and wearing the great creeper parure, goes to the
    monastery, takes off her ornaments, ties them in a bundle in her cloak, and gives
    the bundle to her slave-girl.
  category: action
  evidence_refs:
  - ev:8
