canonical_text:
  quote: "“whatever is subject to origination is subject also to cessation”"
  summary: Sariputta tells Moggallana how he encountered Assaji, heard a brief statement
    of the Buddha’s doctrine of causation and cessation, and attained the deathless.
    Moggallana, hearing the account, gains a clear perception of the doctrine and
    calls it a sorrowless state. The following section begins a description of the
    Buddha’s daily habits, including reference to saintship under the Bo-tree and
    the before-breakfast alms routine.
