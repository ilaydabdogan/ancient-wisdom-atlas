canonical_text:
  quote: '"These austerities are not the way to enlightenment"'
  summary: The Future Buddha practices severe austerities, collapses, is mistakenly
    reported dead, and then recovers. King Suddhodana refuses to believe his son could
    die before enlightenment. After six years, the Future Buddha decides austerities
    are not the path, resumes ordinary food, and regains his auspicious physical qualities.
    The five priests leave him, thinking he has abandoned the struggle. The passage
    then introduces Sujata of Uruvela, who had vowed an annual offering to a banyan-tree
    if she gained a suitable husband and a first-born son; her wish succeeds, and
    she prepares a full-moon offering by arranging milk from successive groups of
    cows.
  language: English
  quote_policy: quoted
