canonical_text:
  quote: ''
  summary: The passage describes sequences of consciousness in relation to sense-
    and mind-apertures, identical object, existence-substratum, death, conception,
    rebirth, and cessation for one who has attained saintship. It then classifies
    karma into kinds depending on ignorance and other kinds, with examples from quoted
    doctrinal phrases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an object is defined, six or seven swiftnesses occur; these may be composed
    of meritorious, demeritorious, action, path, or fruition consciousnesses according
    to dependence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the end of swiftnesses, a fruition-consciousness can occur as a result
    of desirable objects, previous karma, swiftnesses, thoughts, and related dependences.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage compares fruition-consciousness following a spent swiftness to
    water pursuing the stern of a vessel going upstream.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fruition-consciousness that can exist both in an existence-substratum-object
    and in an object of swiftness is called identical object.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the end of identical object, existence-substratum occurs again; when it
    is interrupted, attention and the rest occur again in a regular round.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passing away of existence-substratum-thought in the last existence is
    called passing away or death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After passing-away comes conception, and after conception existence-substratum
    again; the thought series of beings in rounds of rebirth is described as uninterrupted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: For one who has attained saintship, the series of thoughts ceases when passing-away-consciousness
    ceases.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Karma is defined as that which makes whatever is made and is divided into
    karma depending on ignorance and other karmas.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The six karmas depending on ignorance are meritorious karma, demeritorious
    karma, karma leading to immovability, bodily karma, vocal karma, and mental karma.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Other karmas are listed as static karma, constituent karma, active karma,
