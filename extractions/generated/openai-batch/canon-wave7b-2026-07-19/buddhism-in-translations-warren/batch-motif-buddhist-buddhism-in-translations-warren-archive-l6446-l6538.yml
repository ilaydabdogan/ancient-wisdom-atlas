canonical_text:
  quote: ''
  summary: The passage gives an expository account of Buddhist sentient existence
    as five groups made of transient elements; illustrates change with milk becoming
    sour cream; distinguishes present-life Nirvana for mental groups from death-related
    deliverance from form; explains Dependent Origination as a middle doctrine without
    a First Cause; discusses the formula’s repetition, possible compilation, and relation
    to ignorance, desire, wisdom, concentration, and the threefold fire of lust, hatred,
    and infatuation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the human being is composed of five groups, each consisting
    of many independent elements.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elements that form a group are described as independent existences and
    as real while they last.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Milk changing into sour cream is described as the passing away of former form-elements
    and the coming into being of new ones, rather than as one underlying substance
    entering a new phase.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Nirvana can be obtained in the present life with respect
    to the mental groups, while deliverance from the form-group can only be attained
    at death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The causes and perpetuation of the five groups are to be explained without
    recourse to a First Cause.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dependent Origination is called the middle doctrine because it avoids both
    a doctrine of being and nihilism or denial of the reality of existence.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:7
  text: The Buddhist Sacred Books are said to claim Dependent Origination as the peculiar
    discovery of The Buddha.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The formula is described as repeating itself by bringing the human being
    into existence twice: first through consciousness and name-and-form by ignorance
    and karma, and second through birth by desire, attachments, and karma.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Buddhaghosa is said to explain the formula’s repetition as purposeful for
    practical ends, while the author surmises the full formula may be a patchwork
    of two or more formulas current in The Buddha’s time.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ignorance is described as the opposite of wisdom; wisdom, as the method for
    getting rid of ignorance, is described as The Buddha’s particular contribution
    to meditation, while concentration opposing desire is said to have been learned
    from his teachers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The antithesis of ignorance and desire is said to appear in the threefold
    fire of lust, hatred, and infatuation, with lust and hatred standing for desire
    and infatuation for ignorance.
  category: relationship
  evidence_refs:
  - ev:9
