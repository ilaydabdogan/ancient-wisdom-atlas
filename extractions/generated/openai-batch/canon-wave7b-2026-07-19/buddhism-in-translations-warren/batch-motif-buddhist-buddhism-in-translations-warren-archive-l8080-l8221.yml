canonical_text:
  quote: "“This is not mine; this am I not; this is not my Ego.”"
  summary: The passage first presents a discourse in which the five aggregates are
    declared transitory, not-self, and objects of liberating insight; the five priests
    become free from attachment. It then gives a Milindapanha dialogue in which Nagasena
    explains personal continuity as neither strict sameness nor complete difference,
    using life stages and a lamp-flame analogy.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Form, sensation, perception, predispositions, and consciousness are described
    as transitory; what is transitory, evil, and liable to change is denied as a proper
    object of the statements “mine,” “I,” or “my Ego.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The correct view of all form, sensation, perception, predispositions, and
    consciousness—past, future, present, internal or external, gross or subtle, low
    or high, far or near—is stated as: not mine, not I, not my Ego.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A learned and noble disciple who perceives this becomes averse to the aggregates,
    loses passion, becomes free, knows he is free, and knows rebirth is exhausted
    and the holy life completed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the Blessed One’s speech, the five priests applaud; while the exposition
    is delivered, their minds become free from attachment and delivered from the depravities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that at that time there were six saints in the world.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king asks Nagasena whether a person just born is the same person or someone
    else; Nagasena answers that he is neither that person nor someone else.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena uses the example of an infant and a grown-up self, and says different
    periods are unified through connection with the embryonic body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nagasena’s lamp example says that a light may shine all night, though the
    flames of the first, middle, and last watches are not the same and yet are not
    separate lights.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Nagasena says the elements of being join one another in serial succession:
    one element perishes and another arises, so the latest aggregation of consciousnesses
    is reached neither as the same nor as a different person.'
  category: sequence
  evidence_refs:
  - ev:8
