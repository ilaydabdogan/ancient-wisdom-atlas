canonical_text:
  quote: ''
  summary: 'The passage first concludes the story of an unnamed priest who kills a
    goose with pottery fragments and is rebuked by other priests and by The Tathagata,
    who teaches restraint of hand, foot, and voice. It then introduces a Visuddhi-Magga
    example in which a young priest''s mother and father are not hindrances: he travels
    between Rohana and his home monastery, is unknowingly hosted by his parents for
    three months, receives gifts from them, and later gives those gifts to his elder/preceptor
    before returning to Rohana.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed priest boasts that he can hit the eye on the far side of a goose
    and throws a triangular pottery fragment toward the goose's hinder parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the goose turns its head, the priest uses a round pottery fragment to
    strike the further eye; the goose screams, rolls over, and falls at the observers'
    feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other priests who saw the incident rebuke the priest for taking life after
    retiring from the world under a Buddha's dispensation and take him to The Tathagata.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Teacher asks whether the priest has taken life; the priest admits it,
    and The Teacher calls it a serious sin and teaches restraint of hand, foot, voice,
    and all conduct.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The next section states that for some persons even mother and father are no
    hindrances and introduces a young priest, nephew on his mother's side of an elder
    at Korandaka monastery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The young priest leaves Rohana to see his preceptor and learn how the lay
    woman is doing, while the elder sets out to fetch him; they meet on the banks
    of the Ganges at the foot of a tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder says the lay woman always asks about the young priest and dismisses
    him to go home while the elder stays to keep residence there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the home monastery, the young priest is assigned a cell built by his father;
    the father, not recognizing him, asks him to beg food at the family house for
    three months.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The father tells his wife to wait attentively on the reverend stranger, and
    she prepares excellent food.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The young priest eats alms at his parents' house for three months, but no
    one recognizes him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When residence is over, the parents feed the young priest and give him sesamum
    oil, a lump of sugar, and nine cubits of cloth before he departs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The young priest meets his preceptor again at the earlier meeting place, reports
    the news, anoints the elder's feet with the oil, makes him a drink with the sugar,
    gives him the cloth, does obeisance, and departs toward Rohana.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
