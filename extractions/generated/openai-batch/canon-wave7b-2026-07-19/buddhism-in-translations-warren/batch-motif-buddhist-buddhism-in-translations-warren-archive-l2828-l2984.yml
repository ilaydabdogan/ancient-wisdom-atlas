canonical_text:
  quote: ''
  summary: 'The passage summarizes former existences of the Future Buddha in which
    he fulfills perfections: precepts through giving up life, abnegation through renouncing
    a kingdom, wisdom through exposing a hidden serpent and freeing a Brahman, courage
    while crossing the ocean, patience under bodily violence, truth by keeping a promise
    at the cost of life and freeing warriors, resolution for omniscience, good-will
    and fearlessness, indifference amid mockery and praise, and generosity as Vessantara,
    whose merit causes the earth to quake before his rebirth in Tusita heaven. The
    passage frames these examples as an abridgment related to Birth-Stories and the
    Cariya-Pitaka.'
  language: English
  quote_policy: summarized
