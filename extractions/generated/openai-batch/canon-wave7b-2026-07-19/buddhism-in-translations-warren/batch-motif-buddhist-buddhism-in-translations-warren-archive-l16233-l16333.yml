canonical_text:
  quote: ''
  summary: 'The passage opens with praise of Moggallana''s power to see a demon, followed
    by the Blessed One hearing the conversation and uttering a verse on a mind unmoved
    like rock. It then explains the fourth high power: recollection of former states
    of existence across world-cycles. Different classes of practitioners have different
    capacities to remember past existences; the length of a world-cycle is illustrated
    by a mountain slowly worn away by silk. The passage describes the round of existence
    as beginningless, with beings moving from birth to birth through ignorance and
    desire, and contrasts limited methods of recollection with the Buddhas'' unlimited
    direct recollection.'
  language: English
  quote_policy: summarized
