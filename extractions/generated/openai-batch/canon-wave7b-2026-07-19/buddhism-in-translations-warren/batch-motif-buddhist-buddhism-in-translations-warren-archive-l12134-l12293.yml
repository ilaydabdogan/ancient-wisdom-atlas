canonical_text:
  quote: '"to be born here and die here, to die here and be born elsewhere"'
  summary: A speaker praises the Blessed One's teaching as clarification and takes
    refuge. In a sequence of Milindapanha dialogues, the king asks Nagasena about
    the round of existence, causes of rebirth, knowing one's last existence, and rebirth
    without transmigration. Nagasena explains repeated birth and death, rebirth conditioned
    by corruptions and attachment, cessation of rebirth through cessation of causes,
    and continuity without anything passing over, using analogies of mango seeds and
    trees, a farmer's granary, one light kindled from another, and a verse learned
    from a teacher.
  language: English
  quote_policy: quoted
