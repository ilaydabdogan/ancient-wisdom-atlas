canonical_text:
  quote: ''
  summary: The excerpt first closes a dialogue in which existence is described as
    misery and the non-existent as happiness, and the king praises Nagasena's explanation.
    It then lists several named punishments involving bodily injury. The main narrative
    section begins with the Buddha at Kapilavatthu, where Maha-Pajapati the Gotamid
    asks three times for women to be allowed to retire from household life to the
    houseless life; the Buddha refuses each time. Later, at Vesali, Maha-Pajapati
    cuts off her hair, puts on yellow garments, travels with Sakka women, and stands
    weeping at the entrance porch. Ananda sees her, asks why she is distressed, hears
    her explanation, and offers to petition the Buddha.
  language: English
  quote_policy: summarized
