canonical_text:
  quote: ''
  summary: The passage describes beings dying during the drying of the world and being
    reborn in the Brahma-world, explains this through prior attainment of trances,
    presents Loka-byuhas gods warning that the cycle will be renewed and the world
    destroyed, and narrates the successive appearance of suns that dry waters, fill
    worlds with smoke, and culminate in a seventh-sun conflagration that burns Mount
    Sineru and many heavens before leaving darkness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creatures dependent on rain, divinities living on flowers and fruits, fishes,
    turtles, and inhabitants of hells are described as dying during the drying process
    and being reborn in the Brahma-world; a variant view says hell inhabitants perish
    with the seventh sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage answers an objection that Brahma-world rebirth requires trances
    by saying these beings attained the trances in lower heavens.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loka-byuhas gods wander through the world disheveled and weeping before the
    renewal of the cycle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Loka-byuhas announce that after one hundred thousand years the world,
    ocean, earth, and Sineru will be destroyed, and they exhort hearers to cultivate
    friendliness, compassion, joy, indifference, and family respect.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: People and terrestrial deities who hear the warning are mostly agitated, soften
    toward each other, perform meritorious deeds, are reborn among gods, and attain
    trances that lead to rebirth in the Brahma-world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: With the appearance of the second sun, day and night cease to be distinct,
    heat is incessant, the sky is cloudless, and streams dry except for the five great
    rivers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The third, fourth, and fifth suns dry the great rivers, the Himalayan sources
    and seven great lakes, and then the mighty ocean.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sixth sun fills this world and many worlds with smoke.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The seventh sun causes this world and many worlds to break into flames; Mount
    Sineru's peaks crumble and disappear, and the fire burns heavens up to three Brahma-heavens
    before stopping at the Heaven of the Radiant Gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After everything has disappeared, the fire goes out without ashes, and upper
    and lower space become wholly dark.
  category: setting
  evidence_refs:
  - ev:7
