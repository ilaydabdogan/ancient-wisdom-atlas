canonical_text:
  quote: ''
  summary: The passage describes hell guardians torturing a wrongdoer in a heated
    iron kettle and then casting him into the chief hell, which is square, four-gated,
    and made of glowing iron. King Yama reflects on the suffering of those guilty
    of wicked deeds and wishes to become human so that he may hear a Buddha teach
    the Doctrine. The discourse speaker states that this knowledge is firsthand, then
    verses contrast the thoughtless who ignore death's messengers with the holy who
    heed them, see attachment as the source of birth and death, and become free. A
    following reprinted tale, 'The Three Warnings,' personifies Death, who interrupts
    Dobson on his wedding day, grants him a reprieve, promises three warnings before
    the grave, and later returns when Dobson is eighty; Dobson objects that the promised
    warnings have not been given.
  language: English
  quote_policy: summarized
