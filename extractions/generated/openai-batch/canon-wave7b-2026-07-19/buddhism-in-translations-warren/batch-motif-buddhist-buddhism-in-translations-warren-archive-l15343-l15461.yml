canonical_text:
  quote: ''
  summary: The passage explains the emergence of an imitative mental reflex in concentration,
    distinguishes neighborhood- and attainment-concentration, defines guarded visual
    perception that does not attend to passion-arousing signs or tokens, and gives
    the story of the elder Maha-Tissa attaining saintship after seeing an ornamented
    woman's teeth and contemplating bodily impurity. It closes with a detailed description
    of the living body as repulsive beneath adornment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the described practice, hindrances are checked, corruptions are assuaged,
    the mind concentrates by neighborhood concentration, and an imitative mental reflex
    is obtained.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The securing of the mental reflex perceives imperfections of the kasina-circle,
    while the imitative mental reflex is described through images of a mirror, a polished
    conch-shell, the moon disk emerging from clouds, and cranes in clouds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The imitative mental reflex is said to have no color or shape and to exist
    only in the perception of the person practicing concentration.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Concentration is divided into neighborhood-concentration and attainment-concentration.
  category: other
  evidence_refs:
  - ev:2
