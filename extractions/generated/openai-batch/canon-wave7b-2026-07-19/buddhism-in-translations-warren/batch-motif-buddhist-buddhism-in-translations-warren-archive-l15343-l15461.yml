  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The practitioner is also instructed not to note minor tokens such as hand,
    foot, smile, laugh, conversation, looking, or gazing, but only what is real.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman from a family of rank, after quarreling with her husband, leaves Anuradhapura
    ornamented and meets the elder Maha-Tissa on the road.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman laughs loudly; the elder looks up, observes her teeth, realizes
    the impurity of the body, and attains saintship.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the husband asks whether a woman passed by, the elder says he cannot
