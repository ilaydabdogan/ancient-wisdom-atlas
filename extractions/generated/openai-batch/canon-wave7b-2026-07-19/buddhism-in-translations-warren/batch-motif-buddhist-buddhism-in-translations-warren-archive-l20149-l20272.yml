canonical_text:
  quote: ''
  summary: 'The passage gives part of a Buddhist admission and ordination service:
    the candidate recites trust in Buddha, the Law, and the Priesthood; receives ten
    precepts of abstinence; makes obeisance and shares merit; then, for priestly ordination,
    seeks sanction from the President, vows mutual assistance, is positioned before
    the assembly with alms-bowl and robes, and is examined by tutors concerning name,
    superior, and required items.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker repeats trust in Buddha, the Law, and the Priesthood in three
    successive sets.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists ten precepts, each framed as abstinence from a prohibited
    action or possession, and calls them means of leading a moral life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The candidate states that he has received the ten precepts, asks permission,
    makes obeisance to his Tutor, asks forgiveness, and speaks of sharing merit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the preceding ceremony completes the ordination of
    a deacon and is also performed before priestly ordination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A qualified candidate returns with his tutor, approaches the President of
    the chapter, presents an offering, makes obeisance, and asks for sanction and
    support repeatedly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The President accepts, the candidate replies that he is content, and a vow
    of mutual assistance is repeated three times.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The candidate goes to the foot of the assembly, has his alms-bowl strapped
