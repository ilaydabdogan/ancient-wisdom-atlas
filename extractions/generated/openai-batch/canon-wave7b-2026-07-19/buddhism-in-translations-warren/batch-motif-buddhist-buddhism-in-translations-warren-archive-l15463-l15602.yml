canonical_text:
  quote: ''
  summary: The passage first argues that bodily adornment conceals the body's repulsiveness
    and supports attachment to self, using examples of detached body parts, a jackal
    mistaking kimsuka flowers for meat, and verses comparing the body to carrion,
    dung, and a wound with nine outlets. It then instructs a priest to meditate on
    impurity. A new section describes the Blessed One as a teacher of animals and
    recounts a frog who hears the Buddha's voice, is crushed by a cowherd, is reborn
    in the Heaven of the Thirty-three in a golden palace, returns to worship the Buddha,
    and identifies his former frog life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king who neglected grooming, bathing, anointing, and garments would be bodily
    offensive and, in respect of uncleanness and malodor, would not differ from a
    candala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cleansing, garments, unguents, flowers, and ornaments are described as concealing
    the body's repulsiveness and enabling belief in an "I" and a "mine."
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Detached substances such as hair, nails, teeth, phlegm, snot, faeces, and
    urine are said to be loathed, while the remaining body is still treated by people
    as desirable, lasting, pleasant, and an Ego.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old forest jackal is said to mistake flowers on a kimsuka tree for meat
    and to bite fallen flowers greedily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Verses contrast the sage, who rejects fallen body particles and the rest of
    the body as vile, with fools who find the body pleasant and become infatuated
    with it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Quoted verses call the body loathsome, unclean, carrion-like, dung-like, and
    a monstrous wound with nine outlets, and imagine it turned inside out so that
    dogs and crows would need to be kept away.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The undisciplined priest is instructed to acquire the mental reflex wherever
    impurity appears, whether in a living or dead body, and to bring meditation to
    attainment-concentration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One is called The Teacher because he instructed animals; animals
    listening to his Doctrine became destined to conversion and would later enter
    the Paths.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: While the Blessed One taught the inhabitants of Campa on the banks of Lake
    Gaggara, a frog obtained the mental reflex at the sound of his voice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A cowherd leaning on his staff pinned the frog down by the head; the frog
    died and was reborn in the Heaven of the Thirty-three in a golden palace, surrounded
    by houris.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The reborn frog considered the cause of his heavenly birth, perceived only
    that he had obtained the mental reflex at the sound of the Blessed One's voice,
    and came with his palace to worship at the Blessed One's feet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In verse dialogue, the Blessed One asks who worships at his feet, and the
    worshipper replies that he had formerly been a frog in the waters and died when
    a cowherd crushed him while he listened to the Law.
  category: speech
  evidence_refs:
  - ev:10
