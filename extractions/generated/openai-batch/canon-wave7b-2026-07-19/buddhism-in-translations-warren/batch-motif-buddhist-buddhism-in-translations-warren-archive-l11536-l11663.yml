canonical_text:
  quote: ''
  summary: The passage concludes a discourse on karma with analogies from imprisonment
    for debt and punishment for ram-theft, contrasting poor and wealthy offenders,
    then applies these analogies to differing results of the same slight wicked deed.
    It states that karmic reward accords with deeds in a way that still allows religious
    life and the extinction of misery. The next section begins the story of Moggallana
    with Dhammapada verses on punishments for harming the harmless, including rebirth
    in hell, and introduces the Teacher at Bamboo Grove, Moggallana, and members of
    other sects discussing Gotama's increased alms and honor.
  language: English
  quote_policy: summarized
