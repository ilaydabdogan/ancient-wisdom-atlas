canonical_text:
  quote: This repeats itself, as does the stream of a river
  summary: The passage classifies types of consciousness that arise at conception,
    in the continuing existence-substratum, and during sensory and mental cognition.
    It explains rebirth in different realms as conditioned by meritorious or demeritorious
    consciousnesses and by karmic objects present at death, then describes the interruption
    of the existence-substratum by sense contact and the sequence of attention, sense-consciousness,
    noticing, cognizing, and defining.
  language: English
  quote_policy: quoted
