canonical_text:
  quote: ''
  summary: 'The passage classifies karma into meritorious, demeritorious, and immovability-producing
    forms, and also into bodily, vocal, and mental avenues. It argues that all karma
    depends on ignorance: an ignorant person mistakes suffering, rebirth, sensuality,
    and impermanent states for happiness or cessation, and therefore performs karma.
    A series of similes compares these mistaken pursuits to dangerous actions involving
    a precipice, lamp flame, knife, filth, poison, and mirage. The quoted teaching
    concludes that when ignorance fades and wisdom arises, even meritorious karma
    is no longer performed. The next section begins with a question about consciousness.'
  language: English
  quote_policy: summarized
literal_observations:
