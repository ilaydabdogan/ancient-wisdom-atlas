  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The pursuit of meritorious fruition is compared to a man throwing himself
    down a precipice for a heavenly nymph, a locust flying into a lamp flame, and
    a honey-seeker licking a honey-smeared knife edge.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Demeritorious karma through the three avenues arises when sensuality and its
    fruition are mistaken for happiness; it is compared to a child playing with filth
    and a person eating poison.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mental karma leading to immovability arises when change in the constituents
    of being, even in the formless realm, is not perceived; it is compared to a lost
    man following a mirage.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The quoted teaching says that an ignorant, uninstructed man performs the three
    karmas, but that after abandoning ignorance and acquiring wisdom he does not perform
    even meritorious karma.
  category: speech
  evidence_refs:
  - ev:10
