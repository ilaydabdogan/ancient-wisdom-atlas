  quote: ''
  summary: The passage explains a Buddhist meditation system in which Concentration
    leads to trances and formless states, while Wisdom applies doctrines such as the
    Four Noble Truths, Dependent Origination, and the Three Characteristics to overcome
    ignorance, desire, and attachment to existence. It discusses the Visuddhi-Magga’s
    division into Conduct, Concentration, and Wisdom; the nine attainments including
    the Trance of Cessation; the Four Intent Contemplations; cemetery and impurity
    contemplation as a correction to attachment to beauty; and the practitioner’s
    preparation to regard Nirvana as good.
  language: English
  quote_policy: summarized
