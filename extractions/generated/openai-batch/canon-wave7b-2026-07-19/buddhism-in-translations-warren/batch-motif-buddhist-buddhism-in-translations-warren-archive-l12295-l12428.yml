canonical_text:
  quote: ''
  summary: A king asks whether the same “name and form” is born in the next existence.
    An elder replies that it is not the same, but that deeds done with the present
    name and form condition another name and form in a next existence, so evil deeds
    are not escaped. The elder supports this with analogies of mangoes, rice, sugar-cane,
    fires spreading from earlier fires, and a girl who grows from childhood into marriageable
    age.
  language: English
  quote_policy: summarized
