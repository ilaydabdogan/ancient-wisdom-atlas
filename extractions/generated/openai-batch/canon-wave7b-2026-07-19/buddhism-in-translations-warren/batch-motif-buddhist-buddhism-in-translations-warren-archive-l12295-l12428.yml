  text: The king asks whether the same name and form is born into the next existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder answers that the same name and form is not born into the next existence,
    but a deed done with this name and form causes another name and form to be born
    there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king asks whether a person would therefore be freed from evil deeds; the
    elder answers that because one is born into another existence, one is not freed
    from evil deeds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the mango illustration, a man takes another man's mangoes and argues that
    the mangoes taken differ from the mangoes originally planted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king says the mango-taker is liable to punishment because the later mangoes
    derived from the first mangoes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder briefly adds similar illustrations involving another man's rice
