canonical_text:
  quote: ''
  summary: The passage presents teachings attributed to The Blessed One on laying
    down the burden of the five groups, ending desire, and attaining Nirvana. A priest
    asks for a brief teaching, understands non-cleaving in relation to the five aggregates,
    departs to solitary practice, and is said to realize the highest good and become
    a saint. A following discourse teaches that seeking makes consciousness abide
    and grow through support in the aggregates, while abandonment of passion cuts
    off that support.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One describes the laying down of the burden as absence, cessation,
    giving up, relinquishment, forsaking, and non-adoption of desire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A verse states that the five groups are a heavy load borne by man, that taking
    up the load is misery, and that laying it down is bliss.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same verse says that one who lays down the heavy load, takes up no other,
    and extirpates all desire loses hunger and gains Nirvana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Blessed One is located at Savatthi, in Jetavana monastery in Anathapindika's
    Park.
  category: setting
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: A certain priest approaches The Blessed One, greets him, sits respectfully
    to one side, and asks to be taught the Doctrine in brief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Blessed One teaches that by cleaving to anything one comes to be, and
    by not cleaving to anything one does not come to be.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The priest interprets the teaching in relation to form, sensation, perception,
    predispositions, and consciousness, and The Blessed One confirms his understanding.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After applauding and thanking The Blessed One, the priest rises, salutes him,
    keeps his right side toward him, and departs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The priest later practices as solitary, retired, vigilant, strenuous, and
    earnest, realizes the highest good in his lifetime, becomes conscious that rebirth
    is exhausted, and is counted among the saints.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In another discourse at the same location, The Blessed One tells the priests
    that not seeking anything is freedom and seeking anything is not freedom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Blessed One teaches that consciousness abides, grows, increases, and develops
    when it seeks and is supported by form, sensation, perception, or predispositions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Blessed One says that the coming, going, passing out, springing up, growth,
    increase, or development of consciousness cannot be declared apart from form,
    sensation, perception, and predispositions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Blessed One teaches that abandoning passion for form, sensation, perception,
    and predispositions cuts off support and leaves no resting-place for consciousness.
  category: speech
  evidence_refs:
  - ev:7
