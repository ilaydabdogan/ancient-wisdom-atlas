canonical_text:
  quote: ''
  summary: The passage presents Buddhist doctrinal instruction on the absence of an
    Ego in the five attachment-groups, the recognition of their transitory and conditioned
    nature, the fourfold emptiness, and the absence of any agent, seeker, or traveler
    apart from deed, Nirvana, and Path. It includes Sariputta instructing Yamaka,
    Visuddhi-Magga explanations, and the Blessed One addressing the band of five priests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learned and noble disciple does not regard form, sensation, perception,
    predispositions, or consciousness as an Ego or as possessed by an Ego.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciple recognizes form, sensation, perception, predispositions, and
    consciousness as transitory, evil, not an Ego, due to causes, and a murderer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The five attachment-groups, when not sought after and not attached to, are
    said to conduce to welfare and happiness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yamaka says that after hearing Sariputta's doctrinal instruction, his mind
    lost all attachment and became released from the depravities.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Visuddhi-Magga section explains fourfold emptiness through the statement
    that one is nowhere a somewhatness for anyone, and nowhere is there a somewhatness
    of anyone for oneself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The explanation says that there is no Ego anywhere, neither in oneself nor
    in anyone else, to assume roles such as brother, friend, or follower.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A verse states that misery exists without a miserable person, deed exists
    without a doer, Nirvana exists without a man seeking it, and the Path exists without
    a traveler on it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Blessed One addresses the band of five priests and says that form, sensation,
    perception, predispositions, and consciousness are not an Ego because they tend
    toward destruction and cannot be commanded to be this way or that way.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: When asked whether form is permanent or transitory, the priests answer that
    it is transitory.
  category: speech
  evidence_refs:
  - ev:9
