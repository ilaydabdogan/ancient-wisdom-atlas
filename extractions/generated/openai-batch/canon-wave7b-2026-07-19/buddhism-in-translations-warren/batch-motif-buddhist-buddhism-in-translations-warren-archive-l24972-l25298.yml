  quote: ''
  summary: The passage presents part of a table of the eighty-nine consciousnesses,
    especially indeterminate consciousnesses. It lists consciousnesses connected with
    fruition of karma and action, including sense-consciousness, mind-consciousness,
    qualities such as gladness, indifference, knowledge, reasoning, reflection, joy,
    happiness, concentration, the four immaterial trance realms, and four paths. It
    then states that consciousnesses are eighty-nine in number and occur on fourteen
    occasions, including conception, attention, sense activities, cognizing, and passing
    away.
