canonical_text:
  quote: ''
  summary: 'The passage explains three world-wide divine announcements called uproars:
    the Cyclic-Uproar, the Buddha-Uproar, and the Universal-Monarch-Uproar. It describes
    gods warning of future world destruction and ethical duties, guardian angels announcing
    a future Buddha, and terrestrial deities announcing a future Universal Monarch.
    After the Buddha-Uproar, gods from ten thousand worlds assemble in Tusita and
    petition the Future Buddha to accept Buddhaship for the salvation of the world.
    Before consenting, the Great Being makes five observations concerning the time,
    continent, country, family, and mother, and determines the suitable time and place
    for his birth.'
  language: English
  quote_policy: summarized
