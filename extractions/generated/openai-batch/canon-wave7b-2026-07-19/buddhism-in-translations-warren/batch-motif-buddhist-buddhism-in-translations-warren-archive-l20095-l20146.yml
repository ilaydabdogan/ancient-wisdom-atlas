canonical_text:
  quote: ''
  summary: An ordination service opens with praise to the Blessed One. A candidate,
    accompanied by his Tutor and carrying yellow robes, approaches the President of
    the chapter, repeatedly asks for admission to deacon's orders, hands over and
    receives back the robes, undergoes a robe-related ritual with a meditation formula
    on bodily perishability, changes from lay dress into yellow robes, declares the
    humble practical use of the robes, and then asks the Tutor for the three refuges
    and precepts, repeating them while kneeling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The service begins with praise to the Blessed One, described as holy and as
    having arrived at knowledge of all Truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The candidate is accompanied by his Tutor, wears the dress of a layman, carries
    yellow robes, and makes obeisance and an offering to the President of the chapter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The candidate asks for admission to deacon's orders while kneeling and repeats
    the request three times.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The candidate asks that the yellow robes be taken and that he be ordained
    for the destruction of sorrow and attainment of Nirvana; this request is to be
    repeated three times.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The President takes the bundle of robes, later gives it back, and ties the
    yellow band around the candidate's neck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the robe action, the President recites the tacapancakam, a formula
    of meditation on the perishable nature of the human body listing hair, nails,
    teeth, and skin in forward and reverse order.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The candidate rises, retires, removes the dress of a layman, and puts on the
    yellow robes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While changing dress, the candidate recites that he puts on the robes in wisdom
    for protection from weather, insects, wind, sun, serpents, and nakedness, and
    not for ornament or show.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After putting on the yellow robes, the candidate returns to the side of his
