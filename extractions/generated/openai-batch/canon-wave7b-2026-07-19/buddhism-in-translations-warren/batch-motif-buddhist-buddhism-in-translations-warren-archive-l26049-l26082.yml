canonical_text:
  quote: Vikrama is one of the most noted quasi-historical heroes of his times. His
    magic throne, hidden upon his death, is discovered by a later king, Bhoja.
  summary: The passage is a catalog description of Harvard Oriental Series volumes.
    It describes Vikrama's Adventures as a medieval Indian story collection about
    King Vikrama, whose hidden magic throne is later discovered by King Bhoja. Thirty-two
    statuettes supporting the throne each tell Bhoja a story. The tales present Vikrama
    as an exemplary royal hero, compared in the passage to a Hindu King Arthur. The
    passage also describes Edgerton's comparative presentation of four Sanskrit recensions
    and then introduces Buddhist Legends translated from the Pali Dhammapada Commentary.
  language: English
  quote_policy: quoted
