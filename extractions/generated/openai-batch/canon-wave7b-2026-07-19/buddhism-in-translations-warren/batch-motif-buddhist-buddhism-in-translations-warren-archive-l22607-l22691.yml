canonical_text:
  quote: ''
  summary: The passage first records a speech to Ananda stating that women retiring
    from household life to the houseless life will shorten the endurance of the Good
    Doctrine, with similes of vulnerable households, diseased crops, and a dike restraining
    pond water; it says eight weighty regulations have been laid down. It then begins
    a section on Mendaka of Bhaddiya and his household, describing magical powers
    that produce or preserve grain, food, money, rice, and plowing labor, and reports
    that King Seniya Bimbisara hears of these powers and addresses a minister.
  language: English
  quote_policy: summarized
