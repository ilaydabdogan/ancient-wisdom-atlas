  quote: ''
  summary: A narrator describes attending a Buddhist chapter-house service in Ceylon.
    Priests confess faults in pairs, sit by seniority, exchange absolution and obeisance,
    and recite praises and refuge formulas directed to Buddha and the Law, including
    trust until Nirvana.
  language: English
  quote_policy: summarized
