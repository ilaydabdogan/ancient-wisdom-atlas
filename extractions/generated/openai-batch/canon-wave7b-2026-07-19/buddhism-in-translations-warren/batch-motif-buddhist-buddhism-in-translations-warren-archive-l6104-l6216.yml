canonical_text:
  quote: "“The Doctrine and Discipline, Ananda, which I have taught and enjoined upon
    you is to be your teacher when I am gone.”"
  summary: The Buddha tells Subhadda that the noble eightfold path is found in his
    Doctrine and Discipline, and that true monks and saints are found there. Subhadda
    praises the teaching through images of restoration, disclosure, guidance, and
    light; he takes refuge and requests ordination. The Buddha explains probation
    for former adherents of other sects, then instructs Ananda to receive Subhadda
    into the Order. Subhadda is ordained, practices zealously in solitude, realizes
    the highest good, knows rebirth to be exhausted, becomes a saint, and is identified
    as the Buddha’s last direct disciple. The Buddha then tells Ananda that after
    his departure the Doctrine and Discipline will serve as teacher.
  language: English
  quote_policy: quoted
