canonical_text:
  quote: ''
  summary: The Teacher takes Nanda by magical power through the air, shows him a burned
    she-monkey, the Himalaya region, and the Heaven of the Thirty-three with celestial
    nymphs. Nanda agrees to perform monastic duties in exchange for those nymphs,
    taking the Teacher as guarantor. The Teacher publicizes the bargain, and Sariputta
    and other disciples shame Nanda for practicing for the sake of women and passion.
    Nanda experiences shame and remorse, applies himself, attains insight and saintship,
    and releases the Teacher from the promise. The Teacher says Nanda was also formerly
    amenable to admonition and begins a by-gone story about the Future Buddha as an
    elephant-trainer.
  language: English
  quote_policy: summarized
