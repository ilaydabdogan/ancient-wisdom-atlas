canonical_text:
  quote: ''
  summary: The passage presents regulations for priestesses and female novices. The
    Blessed One states that Maha-Pajapati the Gotamid's acceptance of eight weighty
    regulations will count as her ordination. Ananda receives these regulations, transmits
    them to Maha-Pajapati, and she accepts them with a simile of placing a flower
    wreath on the head. Ananda then reports to the Blessed One that she has accepted
    the regulations and become ordained.
