canonical_text:
  quote: ''
  summary: The passage gives instructions for a priest entering the trance of cessation.
    Before entering, he should reflect on possible interruption by a summons from
    The Teacher and on whether his life-span will last through the intended seven-day
    period. It describes the staged passage from the realm of nothingness through
    the realm of neither perception nor non-perception into cessation, explains that
    failure to perform preliminary duties causes a fall back, and illustrates this
    with a simile of travelers crossing a ravine or hot stepping-stone. It closes
    by stating how long the priest remains, how he rises, and that his mind is inclined
    to Nirvana after rising.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before sitting in a trance of cessation, the priest is instructed to reflect
    that if The Teacher lays down a precept or teaches the Doctrine during the seven
    days, he will rise before being summoned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the priest has not made this reflection and The Teacher sends another priest
    to summon him, he must rise when the messenger comes within hearing and calls
    him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes the summons from The Teacher as imperative.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The priest should not enter the trance without first reflecting whether his
    span of life will last seven days longer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the trance of cessation cannot ward off death and
    that death cannot take place during cessation, so the priest would have to rise
    from the midst of the trance if his vital powers were to break up within the limit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After entering and rising from the realm of nothingness and performing preliminary
    duties, the priest enters the realm of neither perception nor non-perception,
    passes beyond one or two thoughts, stops thinking, and reaches cessation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes progress in gradual cessation as an ascent through eight
    attainments using both quiescence and insight methods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the priest enters the realm of neither perception nor non-perception without
    the preliminary duties, he cannot lose all thought and falls back into the realm
    of nothingness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage presents a simile of an unprepared traveler on an unfamiliar road
    who encounters a deep ravine containing water or a slough with an overheated stepping-stone
    and is forced to retreat.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The unprepared traveler retreats because he has not adjusted his garments,
    fears wetting his requisites, or scorches his feet on the hot stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage contrasts this with another traveler who has used the road before,
    adjusts his tunic, carries the other garment, and crosses or touches the stone
    as little as possible to reach the further bank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A priest who has performed the preliminary duties passes beyond the realm
    of neither perception nor non-perception, loses all thought, and dwells in cessation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The priest remains in cessation for the time he has set, unless the termination
    of life, respect for the Order, or a summons from The Teacher interferes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After rising from cessation, the priest's mind is said to be inclined to Nirvana.
  category: attribute
  evidence_refs:
  - ev:6
