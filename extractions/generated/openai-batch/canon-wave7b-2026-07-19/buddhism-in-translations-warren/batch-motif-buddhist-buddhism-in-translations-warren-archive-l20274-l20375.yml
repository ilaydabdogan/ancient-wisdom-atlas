canonical_text:
  quote: ''
  summary: The passage presents part of a Buddhist ordination procedure. A candidate
    is instructed to answer truthfully, examined for diseases and eligibility, named
    as Naga under the superior Tissa, brought before the assembly, and made to request
    ordination three times. Tutors report his qualifications, the assembly is asked
    three times to approve by silence or object by speech, and the candidate is declared
    ordained. The passage then begins a separate section about a serpent distressed
    by serpent existence and wondering how to gain release from that state and quickly
    become human.
  language: English
  quote_policy: summarized
