canonical_text:
  quote: ''
  summary: 'The passage first describes the Buddha’s evening and night habits: bathing,
    sitting in the perfumed chamber, meditating, instructing priests, answering deities,
    pacing, lying in the lion posture, and surveying the world with the eye of a Buddha.
    It then begins the account of the Buddha’s death: he goes with Ananda and a large
    congregation to the further bank of the Hirannavati river, Kusinara, and the Mallas’
    sal-tree grove, asks for a couch between twin sal-trees, lies down mindful and
    conscious, and receives miraculous floral, fragrant, musical, and choral worship
    from trees and heavenly sources.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After his after-breakfast duties, the Buddha may enter the bath-house, where
    water has been prepared by his body-servant; the body-servant also fetches and
    spreads the Buddha-seat in the perfumed chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha puts on a double red tunic, binds his girdle, throws his upper
    robe over his right shoulder, goes to the perfumed chamber, sits down, remains
    solitary, and meditates.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Priests come to wait on the Buddha; some ask questions, some ask for meditation
    exercises, and some ask for a sermon, and he grants their requests during the
    first watch of the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the middle watch of the night, deities from the entire system of ten
    thousand worlds draw near and ask the Buddha questions, which he answers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The Buddha divides the last watch of the night into three parts: pacing to
    relieve bodily discomfort, lying down mindful and conscious on his right side
    in the manner of a lion, and then rising to gaze over the world with the eye of
    a Buddha.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the death account, the Buddha tells Ananda that they will go to the further
    bank of the Hirannavati river, Kusinara, and the Mallas’ sal-tree grove Upavattana;
    he travels there with a large congregation of priests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Buddha asks Ananda to spread a couch with its head to the north between
    twin sal-trees because he is weary and wishes to lie down; Ananda does so.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Buddha lies down on his right side in the manner of a lion, places foot
    on foot, and remains mindful and conscious.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The twin sal-trees burst into bloom outside the flowering season, and their
    blossoms scatter over the Tathagata’s body in worship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Heavenly Erythrina flowers and heavenly sandal-wood powder fall from the sky
    over the Tathagata’s body, and music and choruses are heard in the sky in worship.
  category: action
  evidence_refs:
  - ev:7
