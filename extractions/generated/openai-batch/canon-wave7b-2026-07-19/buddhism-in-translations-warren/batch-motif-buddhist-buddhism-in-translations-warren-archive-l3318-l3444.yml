canonical_text:
  quote: ''
  summary: 'The passage describes the Future Buddha''s birth in Lumbini Grove: the
    queen gives birth while standing and holding a sal-tree branch; divine beings
    receive the child, heavenly water refreshes mother and child, and gods and men
    honor him. The newborn surveys the directions, takes seven steps, and proclaims
    his supremacy. The passage also recalls two prior existences in which he spoke
    immediately at birth, as Mahosadha with medicine and as Vessantara desiring to
    give alms, and notes the appearance of the Thirty-two Prognostics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lumbini Grove is described as a sal-tree pleasure-grove between two cities,
    filled with flowers, bees, and birds, and compared in appearance to Indra's Cittalata
    Grove and to a royal banqueting pavilion.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The queen desires to enter the grove, and the courtiers take her into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the foot of the monarch sal-tree, the queen wishes to hold a branch; the
    branch bends within reach, and she seizes it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The queen's delivery takes place while she is standing and holding the sal-tree
    branch, after people hang a curtain and retire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four pure-minded Maha-Brahma angels arrive with a golden net, receive the
    Future Buddha, place him before his mother, and announce that a mighty son has
    been born to her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Future Buddha is described as issuing from the womb unsmeared by impurity,
    pure and spotless.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two streams of water come from the sky and refresh the Future Buddha and his
    mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The newborn is passed from the Brahma angels to the four guardian angels on
    an antelope-skin rug, then to men on fine cloth, and then stands on the ground
    facing east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many thousands of worlds lie before the newborn, and gods and men make offerings
    and say that none is his equal or superior.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Future Buddha surveys the ten directions, finds no equal, takes seven
    paces, is followed by divinities carrying royal objects, and utters a victory
    proclamation beginning with his primacy in the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The passage states that in three existences the Future Buddha uttered words
    immediately after birth: as Mahosadha, as Vessantara, and in the present birth.'
  category: sequence
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:12
  text: In the Mahosadha existence, Sakka places sandal-wood in the newborn's hand;
    the child identifies it as medicine, and it becomes a remedy associated with the
    names Osadha-Daraka and Mahosadha.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Vessantara existence, the newborn asks if there is anything in the
    house because he wants to give alms; his mother has a purse of money placed in
    his hand.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the moment of this birth, as at conception, the Thirty-two Prognostics
    appear.
  category: other
  evidence_refs:
  - ev:10
