comparison_claims:
- id: claim:1
  claim: The passage explicitly likens the flower-filled Lumbini Grove to Cittalata
    Grove in Indra's paradise and to a magnificently decorated royal banqueting pavilion.
  claim_level: visual_similarity
  target: Cittalata Grove in Indra's paradise; royal banqueting pavilion
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This is a direct descriptive comparison within the passage; it does
    not establish historical contact, common inheritance, or identity of setting.
- id: claim:2
  claim: The passage explicitly compares the Future Buddha's spotless emergence from
    the womb to a preacher descending from a seat, a man coming down a stair, and
    a jewel on Benares cloth.
  claim_level: visual_similarity
  target: Preacher descending from a preaching-seat; man descending stairs; jewel
    on Benares cloth
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal simile about appearance and manner of emergence,
    not a broader comparative-mythology claim.
