canonical_text:
  quote: ''
  summary: 'The passage describes an ascetic using insight into the Three Characteristics
    to become indifferent to the constituents of being, illustrated by similes of
    a man letting go of a wife, water on a lotus leaf, a feather in fire, and a sailor''s
    crow seeking land. It then explains knowledge that turns toward Nirvana and the
    three starting-points of deliverance: the unconditioned, the desireless, and the
    empty.'
  language: English
  quote_policy: summarized
