canonical_text:
  quote: ''
  summary: Visakha removes a costly parure before entering the monastery, later refuses
    to reclaim it after Ananda has handled it, converts its value into money, and
    begins building a dwelling-place for the congregation at the Teacher's direction.
    A related episode within the passage recounts Suppiya providing flesh from her
    own thigh for a sick priest's broth and being made whole by the favor of the Teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visakha removes her costly parure on the way to the monastery, bundles it,
    and gives it to a slave-girl to carry until her return from the Teacher.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The slave-girl is described as having been born with the strength of five
    elephants as the result of former good deeds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visakha approaches the Teacher, listens to the Doctrine, makes obeisance to
    the Blessed One, and departs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The slave-girl forgets the parure, and Ananda, following his custom of putting
    away forgotten items, places it by the staircase after the Teacher tells him to
    lay it aside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Visakha and Suppiya move about the monastery to see what should be done for
    incoming, outgoing, sick, and other persons; young priests and novices approach
    with basins for medicaments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Suppiya asks a sick priest what he needs, and he answers that he needs meat
    broth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Suppiya cannot obtain suitable meat, she prepares the broth with flesh
    from her own thigh; afterward her body is made whole by the favor of the Teacher.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Visakha tells the slave-girl not to fetch the parure if Ananda has taken it
    up and laid it away, saying it is a present to her master.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The slave-girl tells Ananda that an article touched by his hand is not to
    be reclaimed by her mistress, and returns empty-handed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Visakha declares that she will never wear an article touched by her master
    and says she will sell it to give the priests more suitable things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Goldsmiths appraise the parure at ninety millions, with workmanship worth
