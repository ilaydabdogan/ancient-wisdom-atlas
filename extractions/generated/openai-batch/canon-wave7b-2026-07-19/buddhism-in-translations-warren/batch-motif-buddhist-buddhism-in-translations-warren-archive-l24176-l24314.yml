canonical_text:
  quote: ''
  summary: Visakha completes a monastery, walks around it with her descendants, and
    utters verses saying that her former prayer to give a monastery, furnishings,
    food, robes, and medicines has now been fulfilled. Priests ask The Teacher whether
    she is singing from disorder or madness. The Teacher explains that she is uttering
    a solemn statement of fulfilled aspiration and recounts her former prayers, offerings,
    rebirths, and predicted future status as chief benefactress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the day the monastery was completed, Visakha walked repeatedly around the
    building with her children and grandchildren at evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visakha's five stanzas say that earlier wishes to give a monastery, household
    goods, provisions, robes, and medicines are now fulfilled.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priests report to The Teacher that they have not known Visakha to sing
    and ask whether her bile is disordered or she has become mad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Teacher states that Visakha is not singing, but is uttering a solemn statement
    because the desire of her heart has come to pass.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Teacher narrates that a hundred thousand cycles earlier, a Buddha named
    Padumuttara lived, with a large retinue, city, father, mother, and a chief benefactress
    who provided the four reliances.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A female friend asks how one becomes chief benefactress, and Padumuttara says
    it is by praying for a hundred thousand world-cycles to become one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The female friend invites Padumuttara and his priests to receive alms for
    seven days, gives food and robe-cloth, bows at his feet, and prays not for divine
    rule but for eight boons, the position of mother, and the ability to provide the
    four reliances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Padumuttara looks into the future and predicts that, under a future Buddha
    named Gotama, she will be named Visakha and will obtain the eight boons, the position
    of mother, and chief benefactress status.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same aspirant is described as being reborn in the worlds of gods and humans,
    later born in Kassapa Buddha's time as the youngest of King Kiki's seven daughters,
    praying again, and finally born in the present as Dhananjaya's daughter.
  category: sequence
  evidence_refs:
  - ev:5
