canonical_text:
  quote: '"these five attachment-groups, sought after and become attached, long inure
    to his detriment and misery."'
  summary: A dialogue with Yamaka states that the aggregates are transitory and have
    ceased. An unnamed brother then gives a parable of a hostile man who enters a
    wealthy householder's service, gains his confidence, and kills him. The speaker
    applies the parable to the ignorant person who treats form, sensation, perception,
    predispositions, and consciousness as Ego, fails to recognize their impermanence
    and danger, and attaches to them to his own detriment.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Yamaka says that, if asked what becomes of a saintly priest after death, he
    would answer that form, sensation, perception, predispositions, and consciousness
    were transitory, evil, and have ceased and disappeared.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed brother praises Yamaka and says he will give an illustration so
    that Yamaka may better understand the matter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The illustration introduces a householder, or son of a householder, who is
    rich, wealthy, affluent, and thoroughly well guarded.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hostile man wishes to kill the householder and decides that, since violence
    would not be easy, he will ingratiate himself before killing him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hostile man asks to enter the householder's service, behaves as an obliging
    and pleasant-spoken servant, gains the householder's confidence, leads him to
    a secluded spot, and kills him with a sharp weapon.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The speaker asks Yamaka whether the man was a murderer even when he was not
    recognized as such, including while entering service, behaving as servant, and
    finally killing the householder.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The doctrinal application describes an ignorant, unconverted man who regards
    form, sensation, perception, predispositions, and consciousness in relation to
    an Ego.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same man does not recognize that the five listed aggregates are transitory,
