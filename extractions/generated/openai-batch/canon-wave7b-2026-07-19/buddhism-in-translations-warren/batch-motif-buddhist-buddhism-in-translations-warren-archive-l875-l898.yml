  quote: ''
  summary: 'A discourse titled “The Three Characteristics” states that whether Buddhas
    arise or not, the constitution of being remains fixed: constituents are transitory,
    constituents are misery, and elements lack an Ego. A Buddha discovers and masters
    each fact and then announces and explains it to priests.'
