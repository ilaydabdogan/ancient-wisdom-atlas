  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The visiting elder expects provisions from his resident friend, but he receives
    nothing at night, and in the morning they obtain only a ladleful of rice-gruel
    before later receiving similarly meager food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The resident elder says he has put back the congregation's bed and bench and
    has nothing else, while the visiting elder says he is leaving behind a walking-stick,
    sesamum oil, sandals, and a scrip accumulated in one day.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The visiting elder praises the resident elder as one for whom every place
    is like forest, relic-shrine, temple, holy elder, and the living presence of the
