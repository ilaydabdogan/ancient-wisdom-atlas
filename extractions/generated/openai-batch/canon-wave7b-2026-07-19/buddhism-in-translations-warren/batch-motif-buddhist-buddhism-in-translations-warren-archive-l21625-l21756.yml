canonical_text:
  quote: ''
  summary: 'The passage first recounts Sakka, leader of the gods, humbling himself
    before an anger-eating demon; as Sakka repeatedly names himself as an obedient
    servant, the demon weakens and disappears, after which Sakka teaches the gods
    about restraint from anger. The next section explains that a dwelling-place hinders
    a monk only when he becomes attached to building, goods, or a house. A story of
    two elders illustrates this: one resident elder possesses nothing beyond communal
    furnishings returned to their place, while the visiting elder accumulates items
    in one day, recognizes the resident elder''s contentment, praises him, and departs
    with only bowl and robe.'
  language: English
  quote_policy: summarized
