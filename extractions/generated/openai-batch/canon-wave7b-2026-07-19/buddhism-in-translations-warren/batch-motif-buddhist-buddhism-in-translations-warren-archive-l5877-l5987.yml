canonical_text:
  quote: ''
  summary: Ananda objects to the Buddha passing into Nirvana in Kusinara because it
    seems a small jungle town, but the Buddha recalls its former greatness as Kusavati,
    capital of the universal monarch Sudassana. The Buddha sends Ananda to notify
    the Kusinara-Mallas of his impending Nirvana. The Mallas and their families mourn,
    come to the sal-tree grove, and are organized by Ananda to pay reverence by families.
    The passage ends with Subhadda, a wandering ascetic at Kusinara, hearing the report.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ananda says Kusinara is a wattle-and-daub jungle branch village and proposes
    that the Buddha pass into Nirvana in one of several greater cities whose wealthy
    believers can perform funeral rites.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha tells Ananda not to speak of Kusinara in that way and says it was
    once Kusavati, the capital of king Sudassana the Great.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sudassana the Great is described as a Universal Monarch, a virtuous king of
    justice, ruler of the four quarters, securely ruling his territory and possessing
    seven precious gems.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Kusavati is described as twelve leagues long and seven leagues broad, prosperous,
    populous, and well supplied with food, like Alakamanda, the capital of the gods.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kusavati is said to have been continuously filled by day and night with ten
    noises, including animals, vehicles, music, and people calling others to eat and
    drink.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buddha instructs Ananda to enter Kusinara and announce to the Kusinara-Mallas
    that the Tathagata will pass into Nirvana that night in the last watch.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ananda assents, puts on his tunic, takes his bowl and robes, and goes to Kusinara
    with another member of the Order.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Kusinara-Mallas are assembled in the town-hall on business when Ananda
    arrives and gives the announcement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Mallas, together with their children, daughters-in-law, and wives, grieve,
    cry aloud, let their hair loose, stretch out their arms, fall to the ground, roll
    to and fro, and lament the Buddha's impending Nirvana.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The grieving Mallas and their families go to the sal-tree grove Upavattana
    of the Mallas, where Ananda is.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ananda decides to marshal the Mallas by families so they can pay reverence
    to the Blessed One before dawn, and he succeeds before the end of the first watch
    of the night.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Subhadda, a wandering ascetic dwelling at Kusinara, hears the report.
  category: action
  evidence_refs:
  - ev:10
