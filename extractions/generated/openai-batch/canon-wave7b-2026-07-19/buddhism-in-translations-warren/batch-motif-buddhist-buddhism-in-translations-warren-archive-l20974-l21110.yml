canonical_text:
  quote: ''
  summary: 'A Rajagaha treasurer dedicates sixty monastery cells to the Order, and
    the Blessed One thanks him in verses praising monasteries as protective refuges
    and meritorious gifts that support meditation, teaching, and Nirvana. The passage
    then narrates the institution of rainy-season residence: after public criticism
    that monks wandering in the rains harm grass and small creatures, the Blessed
    One prescribes residence during the annual rains with two possible starting dates.
    A band of six priests later violates residence by wandering, causing renewed criticism.'
  language: English
  quote_policy: summarized
