- id: obs:1
  text: The Rajagaha treasurer assents to the Blessed One and dedicates sixty monastery
    cells to the Order, including present and future members throughout the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One thanks the treasurer in stanzas that describe monasteries
    as protection against cold, heat, beasts, snakes, gnats, heavy rains, and hot
    winds.
  category: speech
  evidence_refs:
