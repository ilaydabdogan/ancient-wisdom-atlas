- id: obs:3
  text: The stanzas describe monasteries as places of refuge and ease for meditation
    and insight, and as gifts highly praised by the Buddha.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stanzas urge a wise person to build monasteries, lodge the erudite, and
    give food, drink, clothes, and bedding to holy men with a believing heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The stanzas state that holy men will teach the Doctrine, put miseries to flight,
    and that the donor who sees the truth gains Nirvana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Rajagaha in Bamboo Grove, rainy-season residence had not yet been prescribed,
    and priests wandered during cold, hot, and rainy seasons.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: People object that wandering monks crush green grass, injure beings with one
    sense, and destroy many small animals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people contrast the monks with followers of heretical sects who reside
    during the rainy season and with birds that nest in tree tops during the rainy
    season.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After priests report the public criticism, the Blessed One prescribes that
    priests enter upon residence during the annual rains.
