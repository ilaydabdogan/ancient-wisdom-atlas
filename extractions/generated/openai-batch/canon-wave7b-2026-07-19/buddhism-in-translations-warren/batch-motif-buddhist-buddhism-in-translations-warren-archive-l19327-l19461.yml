canonical_text:
  quote: '"becomes like a fire without fuel, and passes into Nirvana without attachment."'
  summary: The passage explains insight into transitoriness, misery, and non-ego as
    leading to three deliverances; compares the Four Paths to poison applied to a
    tree so it can no longer bear fruit; describes the cessation of rebirth as like
    a fire without fuel; gives verses on the fragrance of virtue; and begins the story
    of Godhika, whose meditative release is repeatedly broken by disease before he
    resolves to use a knife, which Mara perceives.
  language: English
