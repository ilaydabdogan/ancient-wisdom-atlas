canonical_text:
  quote: ''
  summary: A teacher questions Ananda about whether name-and-form could arise if consciousness
    descended into the maternal womb and then departed, or if consciousness were severed
    from a child. Ananda answers no. The teacher states that consciousness is the
    cause and dependence of name-and-form, and that name-and-form is the cause and
    dependence of consciousness. The passage concludes that name-and-form coupled
    with consciousness is what is born, ages, dies, leaves one existence, springs
    up in another, and appears in its present shape.
