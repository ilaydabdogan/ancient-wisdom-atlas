canonical_text:
  quote: '"The Tathagata, O Vaccha, is free from all theories"'
  summary: Vaccha questions Gotama about why he refuses to affirm several speculative
    positions about the world, soul and body, the saint after death, and rebirth.
    Gotama says such theories are obstructive and do not tend toward knowledge, supreme
    wisdom, or Nirvana. He says the Tathagata is free from theories but knows the
    arising and perishing of form, sensation, perception, predispositions, and consciousness.
    He rejects four alternatives about the rebirth of a liberated priest as not fitting
    the case. When Vaccha becomes confused, Gotama describes the doctrine as profound
    and begins an analogy involving a fire burning in front of Vaccha.
  language: English
  quote_policy: quoted
