  quote: ''
  summary: The passage introduces the Buddha chapter, explains the selected materials
    on the Buddha's ministry, enlightenment, daily routine, and death, and begins
    the Jataka Introduction's Story of Sumedha. It describes the prosperous city of
    Amara and the learned, wealthy Brahman Sumedha, identified in a note as a former
    existence of the Buddha. Sumedha privately reflects on rebirth, decay, disease,
    death, Nirvana, and the search for release, using analogies of a lake for cleansing,
    an escape from foes, and a physician for disease.
  language: English
