canonical_text:
  quote: ''
  summary: The passage reports the Blessed One teaching the Doctrine, resulting in
    many conversions and the establishment of a frog-born god in the fruit of conversion.
    It then presents an instruction on friendliness toward snakes and other creatures
    after a priest dies from a snakebite, including a protective chant. The passage
    next begins a discourse on powers a priest may wish for, such as magical bodily
    powers, divine hearing, and discernment of others' minds, all conditioned on precepts,
    quieted thought, trances, insight, and solitude.
  language: English
  quote_policy: summarized
