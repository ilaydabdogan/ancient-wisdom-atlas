- id: obs:3
  text: A priest has been killed by the bite of a snake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One says the priest did not suffuse the four royal families of
    snakes with friendliness, and that such friendliness would have prevented the
    death by snakebite.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Four royal families of snakes are named: Virupakkhas, Erapathas, Chabyaputtas,
    and Kanhagotamakas.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One enjoins priests to suffuse the four royal families of snakes
    with friendliness and to sing a song of defence for protection and safeguard.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The song states love for the named snake families and for creatures without
    feet, with two feet, with four feet, and with many feet.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The song asks that creatures of various foot-counts not harm the chanter and
    that no evil come to living beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The song declares the Buddha, Doctrine, and Order to be infinite, creeping
    things to be finite, and identifies snakes, scorpions, centipedes, spiders, lizards,
    and mice as creeping things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The song states that protection has been made and a song of defence sung,
    asks all living beings to retreat, and reveres the Blessed One and the seven Supreme
    Buddhas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A priest may wish to exercise magical powers including becoming multiform
    or one, becoming visible or invisible, passing through barriers and mountains,
    moving through ground as through water, walking on water, traveling through the
    air, touching the moon and sun, and going bodily to the Brahma-world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: To obtain the listed powers, the priest must be perfect in precepts, quiet
    his thoughts, diligently practise trances, attain insight, and frequent lonely
    places.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A priest may wish to hear celestial and human sounds, far and near, with divinely
