canonical_text:
  quote: If any one have sinned, let him reveal the fact; if he have not sinned, let
    him remain silent.
  summary: The passage explains how priests are prescribed to meet on specified half-month
    days, recite the Doctrine, and perform the Patimokkha confession as a fast-day
    duty. It then gives the announcement procedure for confession and includes a later
    note describing an 1874 Patimokkha recitation in Anuradhapura under a sacred Bo-tree
    linked by tradition to the Buddha Gaya tree.
  language: English
  quote_policy: quoted
