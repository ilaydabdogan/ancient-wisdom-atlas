  quote: ''
  summary: 'The passage defines four kinds of attachment: attachment to sensual pleasure,
    heresy, fanatical conduct, and the assertion of an Ego. It explains attachment
    as tenacious grasping, gives a robber simile for desire and attachment, and provides
    longer doctrinal descriptions of heretical views, purity-by-conduct views, and
    ego-identification with the aggregates.'
