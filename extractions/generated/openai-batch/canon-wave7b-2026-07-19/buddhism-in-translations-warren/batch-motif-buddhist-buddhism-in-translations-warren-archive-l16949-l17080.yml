canonical_text:
  quote: ''
  summary: The passage opens a translated Majjhima-Nikaya discourse. The Blessed One
    is at Savatthi, goes for alms, rests with Ananda, bathes at Eastern Tank, and
    then visits Rammaka the Brahman's monastery, where priests have been discussing
    him. He commends doctrinal discourse or noble silence and begins teaching about
    two cravings, noble and ignoble, describing ignoble craving as seeking things
    subject to birth, old age, disease, death, sorrow, and corruption.
  language: English
  quote_policy: summarized
