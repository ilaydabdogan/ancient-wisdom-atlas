canonical_text:
  quote: ''
  summary: The passage first presents the Blessed One distinguishing an unworthy teacher,
    who teaches for personal approval, from a worthy teacher, who teaches the Doctrine
    because of its goodness and out of compassion; Kassapa is named as an example.
    It then records a dialogue in which the king asks Nagasena what happens if a layman
    reaches saintship but cannot obtain ordination assistance or requisites that day.
    Nagasena answers that such a layman cannot remain a layman until another day and
    must either retire from the world with proper assistance or pass into Nirvana
    that same day. He explains this through analogies of weak digestion, grass under
    a stone, and a weak man unable to sustain royal power. The passage closes with
    the king's assent and the opening of another question about passion.
  language: English
  quote_policy: summarized
