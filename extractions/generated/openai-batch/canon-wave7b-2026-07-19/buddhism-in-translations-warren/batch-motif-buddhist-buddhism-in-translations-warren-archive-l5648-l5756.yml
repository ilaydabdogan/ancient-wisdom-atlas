canonical_text:
  quote: ''
  summary: The Blessed One tells Ananda that the sal-trees and heavenly offerings
    honor the Tathagata, but that the best worship is proper conduct according to
    the precepts. Upavana is told to step aside because deities from ten worlds have
    gathered to see the Tathagata before his passing into Nirvana. Some deities grieve
    dramatically, while passion-free deities remain mindful and reflect on impermanence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One addresses Ananda and says the twin sal-trees have bloomed
    out of season and scattered blossoms over the body of the Tathagata in worship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heavenly Erythrina flowers and sandalwood powder fall from the sky, and music
    and heavenly choruses are heard in the sky in worship of the Tathagata.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One says the Tathagata is best honored by priests, priestesses,
    lay disciples, and female lay disciples who fulfill duties and conduct themselves
    according to the precepts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Upavana stands in front of the Blessed One and fans him; the Blessed One tells
    him to step aside and not stand in front of him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ananda notes that Upavana has long been the Blessed One's body-servant and
    asks why the Blessed One spoke harshly to him near his last moments.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Blessed One explains that deities from ten worlds have gathered to behold
    the Tathagata, filling the area around Kusinara and the sal-tree grove, and that
    they are angered because Upavana conceals him from view.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some deities in the air and on the earth mourn by letting their hair fly,
    crying aloud, stretching out their arms, falling headlong, and rolling to and
    fro while saying the Blessed One will pass into Nirvana too soon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Deities free from passion remain mindful and conscious, bear the event patiently,
    and state that all things are transitory and perishable.
  category: speech
  evidence_refs:
  - ev:6
