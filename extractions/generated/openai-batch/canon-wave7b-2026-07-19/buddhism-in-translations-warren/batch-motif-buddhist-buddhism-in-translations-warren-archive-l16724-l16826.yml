canonical_text:
  quote: ''
  summary: The passage describes a primordial sequence in which bodily functions,
    sexual differentiation, lust, houses, food storage, altered rice, boundaries,
    theft, violence, and political authority arise among beings. A Future Buddha is
    elected chief and receives titles connected with election, fields, and kingship.
    The passage then outlines great world-cycles destroyed and renewed by fire or
    by water, with four immense periods in each cycle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating food, beings develop excretory openings and male and female sexual
    characteristics.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman and the man meditate excessively on one another; lust arises, and
    they have carnal connection.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wise reproach the beings for their conduct, and houses are built to conceal
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After beings begin dwelling in houses, they follow a lazy example and store
    food; thereafter rice grains acquire red granules and husks, and mown crops do
    not spring up again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The beings gather and lament that wickedness has arisen among men, saying
    they formerly were made of mind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: Boundary lines are instituted; one being steals another's share; reproof,
    lying, and violence arise, including beating with fists, clods of earth, and sticks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The group proposes electing someone who will get angry with those who merit
    anger, reprove those who merit reproof, banish those who merit banishment, and
    receive a share of rice in return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Blessed One, identified as a Future Buddha at that time, is described
    as the handsomest, most pleasing in appearance, highly influential and wise, and
    able to raise up and put down.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The beings gain the Future Buddha's assent and elect him chief; he receives
    the appellations Great Elect, khattiya, and raja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: With the Future Buddha at the head of the association of warriors, Brahmans
    and other castes arise by degrees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'For a world-cycle perishing by fire, four immensities are named: the period
    of destruction, the continuance of destruction, the period of renovation, and
    the continuance of renovation.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: For a world-cycle perishing by water, a cycle-destroying great cloud of salt
    water produces rain that grows into torrents, fills vast numbers of worlds, floods
    mountain-peaks, rises into heavens, and finally settles and disappears after everything
    is impregnated with water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After water destruction, space becomes dark; the world begins to appear again
    at the Heaven of the Radiant Gods, and beings leave the Heaven of the Completely
    Lustrous Gods to be reborn in the Heaven of the Radiant Gods or a lower heaven.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: For a world-cycle perishing by water, four immensities run from the destructive
    cloud to the end of the rain, from the end of the rain to salutary rains, from
    those rains to the appearance of the sun and moon, and from the sun and moon to
    the next destructive cloud.
  category: sequence
  evidence_refs:
  - ev:8
