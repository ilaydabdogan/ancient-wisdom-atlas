canonical_text:
  quote: ''
  summary: Mara attacks the Future Buddha with destructive showers, darkness, weapons,
    and an army while disputing his right to the enlightenment seat. The assaults
    are transformed or dispelled. The Future Buddha answers Mara's claim by citing
    his fulfilled Perfections and donations, calls the earth as witness to his Vessantara
    donation, and the earth thunders assent. Mara's elephant kneels and his followers
    flee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Showers of live coals, hot ashes, sand, and mud fly through the sky but fall
    at the Future Buddha's feet as celestial flowers, sandal-wood powder, celestial
    flowers, and celestial ointment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mara creates a fourfold dense darkness in order to frighten Siddhattha and
    drive him away, but it disappears on reaching the Future Buddha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mara commands his followers to seize, kill, and drive away the prince, arms
    himself with a discus, rides the elephant named "Girded-with-mountains," and tells
    Siddhattha to arise from the seat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Great Being replies that Mara has not fulfilled the Ten Perfections, made
    the great donations, striven for knowledge, striven for the welfare of the world,
    or striven for enlightenment; therefore the seat belongs to the Great Being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mara hurls a discus, but when the Great Being reflects on the Ten Perfections
    it changes into a canopy of flowers suspended over his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mara's followers hurl immense mountain-crags, but while the Great Being keeps
    his thoughts on the Ten Perfections the crags become wreaths of flowers and fall
    to the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gods stand on the rim of the world, look on, and say that prince Siddhattha's
    handsome form will surely be destroyed unless he saves himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mara claims that his army are witnesses to his donations, and the army roars
    that they are his witnesses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Great Being says he has no animate witnesses present, declares that the
    solid earth shall testify to his Vessantara donation, stretches his right hand
    toward the earth, and asks whether she is witness.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mighty earth thunders that she bears witness, with many roars described
    as overwhelming Mara's army.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The elephant "Girded-with-mountains" falls on its knees before the Great Being,
    and Mara's followers flee in all directions, leaving head-ornaments and cloaks
    behind.
  category: sequence
  evidence_refs:
  - ev:10
