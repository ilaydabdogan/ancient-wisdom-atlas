canonical_text:
  quote: ''
  summary: The passage presents the Buddha’s final instructions to Ananda and the
    assembled priests, his invitation for unresolved questions, Ananda’s statement
    of faith in the congregation’s certainty, the Buddha’s confirmation of their attainment,
    his final words on transience and diligence, and his ordered entry into meditative
    states before passing into Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One gives instructions about forms of address among priests, permits
    the Order after his departure to abrogate lesser and minor precepts if it wishes,
    and states that a higher penalty is to be inflicted on Channa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Ananda asks what the higher penalty is, the Blessed One says that Channa
    may say what he likes but is not to be spoken to, admonished, or instructed by
    the priests.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One asks the priests to raise any doubt or perplexity concerning
    the Buddha, the Doctrine, the Order, the Path, or the course of conduct; the priests
    remain silent through repeated invitations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ananda says he has faith that no priest in the congregation has doubt or perplexity
    about the Buddha, the Doctrine, the Order, the Path, or the course of conduct.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tathagata says that Ananda speaks from faith, while the Tathagata knows
    that none of the five hundred priests has such doubt; he says even the most backward
    has become converted and is destined to attain supreme wisdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One takes leave of the priests and gives as his last word that
    all constituents of being are transitory and that they should work out their salvation
    with diligence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One enters a sequence of meditative states from the first through
    fourth trance, then through realms named as infinity of space, infinity of consciousness,
    nothingness, neither perception nor non-perception, and the cessation of perception
    and sensation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ananda tells Anuruddha that the Blessed One has passed into Nirvana; Anuruddha
    replies that he has not passed into Nirvana but has arrived at the cessation of
    perception and sensation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Blessed One rises from the cessation of perception and sensation, passes
    through the named meditative states in reverse and then again through the first
    to fourth trances, and immediately after rising from the fourth trance passes
    into Nirvana.
  category: sequence
  evidence_refs:
  - ev:9
