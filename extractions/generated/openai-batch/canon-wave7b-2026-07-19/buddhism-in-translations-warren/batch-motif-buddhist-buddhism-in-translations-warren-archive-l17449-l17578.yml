canonical_text:
  quote: "“the door stands open to the deathless”"
  summary: The Buddha compares people of differing spiritual capacities to water-grown
    blossoms at different levels, announces readiness to teach the Doctrine, considers
    several possible first recipients, chooses the band of five priests at Benares,
    journeys toward them, and answers Upaka by declaring himself teacherless, awakened,
    and a conqueror of evil.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Blossoms growing in water are described as remaining below the surface, reaching
    the surface, or rising above the water untouched by it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says that with the eye of a Buddha he saw people of many varieties,
    including differences in moral defilement, faculties, disposition, docility, and
    awareness of blameworthy actions and the hereafter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator addresses Brahma Sahampati in a stanza saying that people with
    ears may give credence and that the door stands open to the deathless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahma Sahampati thinks that the Blessed One has granted his request to teach
    the Doctrine, salutes him, turns his right side toward him, and disappears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator considers teaching Alara Kalama first, but a deity announces
    and the narrator also knows that Alara Kalama has been dead for seven days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator considers teaching Uddaka, the disciple of Rama, first, but a
    deity announces and the narrator also knows that Uddaka died the previous night
    at nightfall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator decides that the band of five priests had served him during his
    struggle and uses divinely clear vision to see them dwelling at Benares in the
    deer-park Isipatana.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After dwelling at Uruvela as long as he wished, the narrator proceeds toward
    Benares; Upaka, a naked ascetic, sees him on the highway between the Bo-tree and
    Gaya.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Upaka observes the narrator’s placid sense organs and clear, bright skin color,
    then asks whom he follows, who his teacher is, and whose doctrine he approves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator answers in stanzas that he is all-conquering, all-knowing, without
    teacher or equal, the unsurpassed Teacher and supreme Buddha, with lust’s fire
    quenched and Nirvana gained.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator says he seeks Benares to found the Doctrine’s reign and beat
    the drum of deathlessness for a blinded world.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Upaka says this amounts to claiming to be a saint and immeasurable Conqueror;
    the narrator replies that he has conquered every evil trait.
  category: speech
  evidence_refs:
  - ev:6
