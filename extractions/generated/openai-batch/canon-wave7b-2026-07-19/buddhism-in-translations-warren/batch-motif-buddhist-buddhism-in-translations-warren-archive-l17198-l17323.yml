canonical_text:
  quote: ''
  summary: In a first-person discourse to priests, the speaker recounts being honored
    as equal by Alara Kalama, rejecting Alara's doctrine as leading only to the realm
    of nothingness, then approaching Uddaka, the disciple of Rama. The speaker learns
    and realizes Uddaka/Rama's doctrine leading to the realm of neither perception
    nor non-perception, is honored and made teacher, but again rejects the doctrine
    as not leading to Nirvana. Continuing the search for the summum bonum and incomparable
    peaceful state, he journeys to Uruvela and notices a grove of trees, a flowing
    river, and a nearby village for begging.
  language: English
  quote_policy: summarized
