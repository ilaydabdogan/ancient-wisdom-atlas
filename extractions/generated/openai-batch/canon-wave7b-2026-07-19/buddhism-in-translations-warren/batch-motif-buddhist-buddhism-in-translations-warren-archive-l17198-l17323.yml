    in possession of that doctrine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Uddaka praised the speaker, equated him with Rama, invited him to lead the
    following, made him his teacher, and honored him greatly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker judged the Uddaka/Rama doctrine as not leading to Nirvana but
    only to the realm of neither perception nor non-perception, did not adhere to
    it, and departed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During his journey among the Magadhans, the speaker came to Uruvela, the General's
    Town, and perceived a grove of trees, a flowing river, and a nearby village for
    begging.
  category: setting
  evidence_refs:
