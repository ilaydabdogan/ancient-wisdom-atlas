- id: obs:3
  text: The speaker did not adhere to Alara's doctrine and departed on his journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Seeking the summum bonum and incomparable peaceful state, the speaker approached
    Uddaka, the disciple of Rama, and asked to live the religious life under his doctrine
    and discipline.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Uddaka said that an intelligent man could quickly learn and realize what his
