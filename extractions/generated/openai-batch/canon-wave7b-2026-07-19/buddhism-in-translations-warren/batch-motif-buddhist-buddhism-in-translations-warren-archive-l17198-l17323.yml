- id: obs:2
  text: The speaker judged Alara's doctrine as not leading to aversion, absence of
    passion, cessation, quiescence, knowledge, supreme wisdom, and Nirvana, but only
    to the realm of nothingness.
  category: attribute
  evidence_refs:
