canonical_text:
  quote: ''
  summary: The passage ends a dialogue with Mara in which sensory and mental domains
    are assigned to the Wicked One, while their absence and non-identification are
    said to be beyond his reach. Mara recognizes that the Blessed One has recognized
    him and disappears. The Blessed One then travels to Gaya Head with one thousand
    former matted-hair monks and delivers the Fire-Sermon, teaching that the senses,
    their objects, consciousness, impressions, and sensations are on fire with passion,
    hatred, infatuation, and the conditions of suffering. A noble disciple who perceives
    this becomes disenchanted, free, and knows rebirth is exhausted; the thousand
    priests are liberated while hearing the exposition. The next section begins with
    the Blessed One at Kammāsadhamma among the Kurus addressing priests.
  language: English
  quote_policy: summarized
