canonical_text:
  quote: ''
  summary: At the Future Buddha's birth in Lumbini Grove, several persons and objects
    come into existence with him and are called Connate Ones. The child is taken to
    Kapilavatthu. Gods in the Heaven of the Thirty-three celebrate his birth and announce
    his future Buddhahood. The ascetic Kaladevala hears this, visits the king, recognizes
    the child's destiny through marks and vision, reveres him, and grieves that he
    will not live to see his enlightenment. He then tells Nalaka to retire from the
    world because Nalaka will have the opportunity to see the coming Buddha.
  language: English
  quote_policy: summarized
