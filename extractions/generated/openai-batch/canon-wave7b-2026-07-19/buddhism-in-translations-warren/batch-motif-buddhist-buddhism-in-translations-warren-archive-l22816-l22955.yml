canonical_text:
  quote: ''
  summary: A narrative concerning Visakha recounts the Teacher’s visit to Bhaddiya,
    Visakha’s respectful welcome with a large retinue, her conversion after hearing
    the Doctrine, Mendaka’s conversion and hospitality to the Buddha and priests,
    a royal transfer of Dhananjaya from Bimbisara’s territory to Pasenadi’s, the founding
    and naming of Saketa, and the opening of a marriage discussion involving Punnavaddhana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The doctrinal instruction is said to have been given by the Teacher while
    dwelling near Savatthi in Eastern Monastery, and it concerns Visakha, a female
    lay disciple.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visakha is described as born in Bhaddiya in Bengal, the daughter of Dhananjaya
    the treasurer and Sumana.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Teacher, perceiving that Sela and others in the city were competent to
    attain salvation, went there with a great congregation of priests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mendaka is described as a treasurer, head of a household of five persons of
    great merit, and one of several persons of illimitable wealth in Bimbisara’s territory.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mendaka told the seven-year-old Visakha to go with five hundred girl-attendants,
    five hundred chariots, and five hundred female slaves to welcome the Teacher.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Visakha rode only as far as was proper for carriages, then alighted, approached
    the Teacher on foot, made obeisance, and stood respectfully at one side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Teacher taught Visakha the Doctrine, and at the end of the discourse she
    and her five hundred maidens attained the fruit of conversion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mendaka approached the Teacher, listened to a sermon, attained the fruit of
    conversion, invited the Buddha for the next day’s breakfast, and served the Buddha
    and the congregation of priests with food for half a month.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pasenadi observed that Bimbisara’s territory had five men of illimitable wealth
    and asked Bimbisara to let him take one of these persons of great merit back with
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bimbisara asked Dhananjaya to go with Pasenadi, and Dhananjaya agreed to go
    if the king sent him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: During the journey, Dhananjaya asked whose territory they were in, learned
    that Savatthi was seven leagues away, and asked to dwell at the pleasant stopping
    place because his suite was large.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Pasenadi mapped out a city for Dhananjaya and gave it to him; because the
    settlement was made in the evening, the city received the name Saketa.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Savatthi, Punnavaddhana’s parents told him to choose a wife; he resisted,
    and they replied that no family can last without children.
  category: speech
  evidence_refs:
  - ev:10
