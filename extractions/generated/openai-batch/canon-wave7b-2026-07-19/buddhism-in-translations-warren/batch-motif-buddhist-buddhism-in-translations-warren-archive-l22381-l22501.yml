canonical_text:
  quote: ''
  summary: Ananda petitions the Blessed One to allow women, represented by Maha-Pajapati
    the Gotamid, to leave household life for the houseless life under the Doctrine
    and Discipline. After three refusals, Ananda asks whether women are capable of
    attaining the four stated spiritual fruits, and the Blessed One says they are.
    Ananda then invokes Maha-Pajapati's former care for the Blessed One as foster-mother
    and giver of milk. The Blessed One says her acceptance of eight weighty regulations
    will be reckoned as her ordination; the passage lists the first five regulations
    concerning priestesses' relations to priests and congregations.
  language: English
  quote_policy: summarized
