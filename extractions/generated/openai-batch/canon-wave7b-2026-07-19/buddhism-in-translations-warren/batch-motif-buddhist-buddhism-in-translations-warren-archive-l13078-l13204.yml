canonical_text:
  quote: ''
  summary: The passage explains knowledge of dependent name-and-form as the purity
    following removal of doubt, identifies related terms for insight, and classifies
    death into natural and untimely kinds governed by merit, life span, and karma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Understanding the elements at death and conception, together with the dependence
    of name and form, leads to the abandonment of sixteen doubts, eight doubts concerning
    the Teacher and related matters, and sixty-two heresies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The knowledge gained by grasping the dependence of name and form and removing
    doubt across three divisions of time is called the purity ensuing on the removal
    of doubt; other names are knowledge of the continuance of the factors of being,
    knowledge of the truth, and correct insight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage defines knowledge of the continuance of the factors of being as
    wisdom gained by grasping dependence, with ignorance and karma given as an example
    of dependent origination.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Considering the factors of being as transitory, misery, and lacking an Ego
    produces knowledge of truth, correct insight, and the abandonment of doubt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The expressions knowledge of the truth, correct insight, and removal of doubt
    are stated to be different expressions for one truth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man of insight who has gained confidence and footing in the dispensation
    of The Buddha and whose destiny is established is called newly converted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A mindful priest who wants his doubts removed is instructed to search everywhere
    in order to grasp what name and form depend on.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Death is defined as the cutting off of vitality comprised in any one existence.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage excludes the death of the saint, incessant death, and popular
    uses such as a dead tree or dead iron from the specific meaning of death under
    discussion.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The intended kinds of death are natural death and untimely death.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Natural death occurs through exhaustion of merit, exhaustion of the natural
    term of life, or exhaustion of both, while untimely death occurs by karma cutting
    off karma.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Death by exhaustion of merit occurs when the karma that caused conception
    has ripened to termination; death by exhaustion of the natural term occurs when
    the span of life and nutritive powers for a grade of existence end.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: DusT Mara, king Kalabu, and unnamed persons dying bloody deaths are presented
    as examples of untimely death caused by karma, including karma from a previous
    existence.
  category: sequence
  evidence_refs:
  - ev:12
