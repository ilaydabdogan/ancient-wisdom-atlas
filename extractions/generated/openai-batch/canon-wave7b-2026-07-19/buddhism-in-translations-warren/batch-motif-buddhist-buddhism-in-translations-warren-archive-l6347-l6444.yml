canonical_text:
  quote: The Buddha's system was a religious one, his philosophy an applied philosophy
  summary: An introductory editorial discourse explains the translation of Ego/Self,
    interprets the Buddha’s refusal to answer certain metaphysical questions, emphasizes
    his practical teaching about misery and its cessation, frames sentient existence
    through suffering and rebirth, and draws an explicit parallel with modern science
    on self-integration while distinguishing Buddhist self-inheritance from heredity.
  language: English
  quote_policy: quoted
