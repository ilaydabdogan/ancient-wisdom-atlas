canonical_text:
  quote: ''
  summary: The passage recounts Dhananjaya giving cattle and other wealth to his daughter
    Visakha before her departure to her husband’s family. When the cattle-fold is
    shut, large numbers of cattle still escape, which the narration explains as the
    effect of Visakha’s merit from a previous existence in which she continued giving
    cow-products to priests despite attempts to stop her. Dhananjaya gives Visakha
    a tenfold household admonition, appoints householders to hear charges against
    her, outfits her richly, and proclaims that anyone wishing to follow her may go.
    A large retinue follows; Migara objects, but Visakha prevents them from being
    driven away.
  language: English
  quote_policy: summarized
