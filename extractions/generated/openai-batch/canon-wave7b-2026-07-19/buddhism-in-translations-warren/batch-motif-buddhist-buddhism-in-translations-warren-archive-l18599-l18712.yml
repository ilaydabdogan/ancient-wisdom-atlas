canonical_text:
  quote: he lives unattached, nor clings to anything in the world
  summary: The passage concludes contemplation of mind and begins contemplation of
    the elements of being. A priest observes mind and elements in himself and others,
    attends to origination and destruction, comprehends the presence, arising, abandonment,
    and prevention of five obstacles, and examines the nature, arising, and perishing
    of the five attachment-groups. The passage then introduces observation of the
    six organs of sense and six objects of sense.
