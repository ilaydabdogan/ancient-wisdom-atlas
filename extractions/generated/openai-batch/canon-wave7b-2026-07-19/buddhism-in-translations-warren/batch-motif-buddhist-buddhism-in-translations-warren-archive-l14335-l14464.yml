canonical_text:
  quote: ''
  summary: 'The passage closes one Jataka episode in which an elephant, urged by its
    trainer, overcomes fear and breaks into Benares, after which the Teacher identifies
    the past-life characters. It then begins the Jataka of the Hare-Mark in the Moon:
    a Savatthi householder gives repeated donations to the Buddha and Order; the Teacher
    praises almsgiving and begins a past-life tale in which the Future Buddha is a
    wise hare who teaches a monkey, jackal, and otter to give alms, keep precepts,
    and observe fast-days.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king takes the Future Buddha with him, mounts a state elephant, leads an
    army to Benares, surrounds the city, and demands either the kingdom or battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahmadatta chooses to give battle and mans the walls, watch-towers, and gates.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The attacking king arms the state elephant with mail, puts on armor himself,
    mounts the elephant, and intends to break into the city, kill his enemy, and take
    the kingdom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elephant sees hot mud, stones from catapults, and missiles thrown by defenders,
    and retreats in terror.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elephant-trainer addresses the elephant as a hero and urges it to break
    the cross-bar, remove the city-pillars, and enter through the gateway arch.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the trainer's admonition, the elephant pulls up the city-pillars, breaks
    the gateway arch and cross-bar, enters the city, captures the kingdom, and gives
    it to his master.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Teacher identifies the elephant as Nanda, the king as Ananda, and the
    elephant-trainer as himself in that existence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A householder of Savatthi prepares a donation for the Buddha and the Order,
    invites them repeatedly, and on the seventh day donates requisites to the Buddha
    and five hundred priests.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The Teacher says that almsgiving was practiced by wise people of old, who
    surrendered their lives to suppliants and gave their own flesh to be eaten.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the by-gone occurrence, while Brahmadatta rules at Benares, the Future
    Buddha is born as a hare dwelling in a wood bordered by a mountain, a river, and
    a village.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: 'The hare has three animal comrades: a monkey, a jackal, and an otter.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The wise hare exhorts the other animals to give alms, keep the precepts, and
    observe fast-days.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The hare sees the moon and concludes that the next day will be fast-day, then
