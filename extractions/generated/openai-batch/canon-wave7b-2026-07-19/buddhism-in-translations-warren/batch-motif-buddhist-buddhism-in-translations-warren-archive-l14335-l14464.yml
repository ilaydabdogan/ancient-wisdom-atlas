  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: On the next day, the otter goes to the Ganges to hunt; a fisherman has caught
    seven red-fish and strung them on a vine.
  category: action
  evidence_refs:
  - ev:11
