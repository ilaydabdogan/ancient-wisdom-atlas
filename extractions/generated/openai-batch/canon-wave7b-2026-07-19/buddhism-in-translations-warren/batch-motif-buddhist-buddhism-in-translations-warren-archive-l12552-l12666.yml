  text: The passage rejects both absolute sameness and absolute diversity in causes
    and effects, using milk and sour cream as an example.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unidentified speaker objects that, without transmigration, the fruit of
    karma would be experienced by something different from what produced it.
  category: speech
  evidence_refs:
  - ev:2
