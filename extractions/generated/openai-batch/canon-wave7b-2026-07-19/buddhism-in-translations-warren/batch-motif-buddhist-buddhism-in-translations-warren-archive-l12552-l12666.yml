  text: A lack of clear understanding of death leads to the conclusion that a living
    entity dies and transmigrates into another body.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Death is defined as the dissolution of the Groups, and rebirth is defined
    as the appearance of the Groups.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wise are said to say that only the Groups break up, and the thoughtful
