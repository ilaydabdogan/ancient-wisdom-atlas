canonical_text:
  quote: ''
  summary: 'The passage argues that rebirth is causal continuity without transmigration:
    karmic fruit arises in a conditioned series that is neither absolutely the same
    nor wholly different. It explains death as dissolution of the Groups and rebirth
    as their appearance, and introduces a priest’s search for the dependent causes
    of name and form as the removal of doubt.'
  language: English
  quote_policy: summarized
literal_observations:
