canonical_text:
  quote: ''
  summary: The passage explains the proposition that sensation conditions desire by
    classifying desire according to six sense objects, three modes, subjective and
    external occurrence, and past, future, and present time, yielding one hundred
    and eight desires. It uses an analogy of honoring a nurse to explain how beings
    honor providers of sense objects. It then turns to attachment, describing how
    a meditative priest contemplates the groups as impure, miserable, not-Ego, and
    transitory, thereby abandoning mistaken views, crossing torrents, breaking yokes,
    severing bonds, and avoiding four forms of attachment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage names six desires according to their objects: forms, sounds,
    odors, tastes, tangible things, and ideas.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each desire is described as triple according to whether it manifests as desire
    for sensual pleasure, desire for permanent existence, or desire for transitory
    existence.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Desire for forms is described differently when joined to sensual relish, belief
    in persistent existence, or belief in annihilation; the same scheme is applied
    to sounds and the other sense objects.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The calculation expands eighteen desires into thirty-six by distinguishing
    subjective and external objects, and then into one hundred and eight by applying
    past, future, and present time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Living beings are said to honor painters, musicians, perfumers, cooks, weavers,
    elixir-prescribing physicians, and similar persons because they furnish objects
    of sense.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage compares this honoring of sense-object providers to honoring a
    nurse because of love and devotion to children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Verse lines state that sensation gives rise to desire by dependence, that
    three sensations form a threefold dependence for desire, and that the Sage said
    sensation depends on desire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Desire is said to produce baleful karma and to find no lodgment in the mind
    of a wise Brahman.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: A meditative priest is described as looking upon Form and the other Groups
    as having a nature like bubbles of foam, so that he ceases to look upon the unsubstantial
    as substantiality.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: By looking upon subjective Form as impure, the meditative priest understands
    material food, abandons the mistaking of the impure for the pure, crosses the
    torrent of sensual pleasure, breaks loose from its yoke, severs bonds of covetousness,
    and does not attach himself by the Attachment of Sensual Pleasure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: By looking upon Sensation as misery, the meditative priest understands contact
    as nutriment, abandons the mistaking of misery for happiness, crosses the torrent
    of existence, breaks loose from its yoke, severs bonds of malevolence, and does
    not attach himself by the Attachment of Fanatical Conduct.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: By looking upon Perception and the Predispositions as not an Ego, the meditative
    priest understands karma as nutriment, abandons the mistaking of what is no Ego
    for an Ego, crosses the torrent of heresy, breaks loose from its yoke, severs
    bonds of dogmatism, and does not attach himself by the Attachment of the Assertion
    of an Ego.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: By looking upon Consciousness as transitory, the meditative priest understands
    consciousness as nutriment, abandons the mistaking of the transitory for the permanent,
    crosses the torrent of ignorance, breaks loose from its yoke, severs bonds, and
    does not attach himself by the Attachment of Heresy.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The next proposition states that attachment depends on desire, and the passage
    says attachments are four in number.
  category: sequence
  evidence_refs:
  - ev:10
