canonical_text:
  quote: '"Reverend sirs, I am a serpent."'
  summary: A serpent, disguised as a youth, seeks ordination among the Sakyaputta
    monks in order to gain release from serpent existence and become human. After
    his serpent form is revealed in a monastery cell, the Blessed One declares him
    incapable of growth in the Doctrine and Discipline, tells him to remain a serpent,
    and prescribes fast-day observance on specified lunar days. The passage then describes
    rival wandering ascetics who meet and recite doctrine on the same days, King Bimbisara’s
    suggestion that Buddhist priests also meet then, and the Blessed One’s prescription
    of such meetings.
  language: English
  quote_policy: quoted
