canonical_text:
  quote: ''
  summary: The passage introduces the Buddhist Order and its regulations, gives a
    short canonical definition of elevated conduct for priests, and reports J. F.
    Dickson's description of an ordination ceremony at the Malwatte Monastery in Kandy
    on the full-moon day of Wesak. It describes the chapter house, participants, seating,
    quorum rules, ritual attention to formulas, prior examination of candidates, and
    the Upasampada-Kammavaca manual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory discourse states that the Buddha instituted an Order or Church
    during his lifetime and made many regulations for its guidance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chapter is presented as illustrative of Buddhist understandings of monastic
    life and the duties and position of laity.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The introduction says the Buddha showed aversion to having women as members
    of the Order and states that nuns did not play an influential historical role
    and were absent in Ceylon at the time described.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the conduct discourse, elevated conduct is defined by correct conduct,
    restraint under the Patimokkha, careful habits and associations, fear of even
    small faults, and discipline in the precepts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dickson reports being invited by Kewitiyagala Unnanse of the Malwatte Monastery
    in Kandy to attend an ordination service.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ordination service was held on the full-moon day of Wesak, described as
    the anniversary of the day on which Gautama Buddha attained Nirvana.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The observer describes the proceedings as orderly, solemn, and apparently
    conducted as in antiquity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chapter house is described as an oblong hall with rows of pillars forming
    an inner space and leaving broad aisles at the sides.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The aged Abbot sat at the top of the inner space as president, elder priests
    sat on either side of him, and other priests sat down the sides.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Candidates stood at the fourth side, deacons stood behind pillars on the right,
    visitors were on the left, and Buddhist laymen were behind the candidates.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The assembly formed three sides of an oblong; the president sat on cushions
    and a carpet, other priests sat on mats covered with white calico, and all sat
    cross-legged.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A valid chapter for the rite required at least ten duly ordained priests,
    and the president had to be at least ten years from his Upasampada ordination.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Priests attending the chapter were required to give undivided and devout attention,
    join in exhortations, responses, and formulas, and correct every error.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The reason given for correcting every error is that overlooking a single mistake
    could vitiate the efficacy of the rite.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Before ordination, candidates underwent strict examination concerning their
    knowledge of the discourses of Buddha and the duties of a priest.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Examination and ordination were held on the full-moon day in Wesak and on
    the three succeeding Poya days.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: After witnessing the rite, Dickson read and translated the Upasampada-Kammavaca,
    described as a book setting forth the form and manner of ordering priests and
    deacons.
  category: action
  evidence_refs:
  - ev:12
