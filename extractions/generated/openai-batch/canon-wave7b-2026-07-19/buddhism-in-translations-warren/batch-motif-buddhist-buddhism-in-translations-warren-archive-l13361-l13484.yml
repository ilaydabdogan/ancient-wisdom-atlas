canonical_text:
  quote: ''
  summary: King Yama questions a man about death's messengers, especially visible
    examples of disease and death. The man admits seeing them but says he did not
    reflect or act nobly with body, voice, and mind. Yama states that the man's wickedness
    was his own and that he alone will feel its consequences. After the questioning,
    guardians of hell subject him to a sequence of torments involving heated iron
    stakes, cutting weapons, a chariot over blazing ground, and a burning mountain
    of live coals, while he does not die until his wickedness is exhausted.
  language: English
  quote_policy: summarized
