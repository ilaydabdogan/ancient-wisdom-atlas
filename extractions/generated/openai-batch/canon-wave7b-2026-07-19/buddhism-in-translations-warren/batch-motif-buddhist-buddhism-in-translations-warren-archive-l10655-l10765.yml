canonical_text:
  quote: ''
  summary: 'The passage explains dependent-origination terms from the Visuddhi-Magga:
    attachments to annihilation views, Ego views, and fanatical conduct lead to karma-existence
    and originating-existence in the three realms; attachment is analyzed as different
    kinds of dependence; karma-existence conditions birth; karma accounts for differences
    among beings; and birth conditions old age, death, sorrow, and related states.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who adopts the heresy of annihilation of existences thinks of the
    Ego undergoing annihilation in the realm of sensual pleasure, form, or formlessness,
    and performs karma leading to those existences.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the karma performed in that case as karma-existence
    and the groups springing from it as originating-existence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who asserts an Ego and thinks it is happy in one of the three realms
    performs karma leading to those existences.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who thinks fanatical conduct attains happy fulfilment in one of the
    three realms adopts that attachment and performs karma leading to those existences.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that attachment is the proximate dependence of existence
    in the realms of form and formlessness and a connate-related dependence of existence
    in the realm of sensual pleasure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For a being in the realm of sensual pleasure, the four attachments are described
    as dependence for meritorious karma and originating-existence in the realms of
    form and formlessness by proximate dependence alone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the section on birth, existence is specified as karma-existence, not originating-existence,
    when it is called the dependence of birth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Differences in progeny, including twins, are said to be observable even when
    external dependences such as seed, blood, food, and parents are the same.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage attributes differences among beings in meanness and greatness
    to karma and cites the Blessed One as saying that karma allots beings to meanness
    or greatness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that when there is no birth there is no old age, death,
    sorrow, and related elements of being.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that when there is birth, old age, death, sorrow, and related
    states occur for the afflicted fool.
  category: sequence
  evidence_refs:
  - ev:8
