canonical_text:
  quote: ''
  summary: Visakha is declared guiltless and agrees to remain in her father-in-law
    Migara's household only if she may serve the Buddhist monastic congregation. She
    invites the Buddha and his followers, while naked ascetics try to keep Migara
    away and place him behind a curtain. The Buddha teaches so that Migara can hear
    despite the barrier. The passage describes the Buddha's universal manner of address,
    likened to the moon appearing before all beings, and attributes this capacity
    to past liberality. Migara hears the teaching, attains conversion and faith in
    the three refuges, honors the Buddha, and publicly credits Visakha as his benefactor
    and symbolic mother.
  language: English
  quote_policy: summarized
