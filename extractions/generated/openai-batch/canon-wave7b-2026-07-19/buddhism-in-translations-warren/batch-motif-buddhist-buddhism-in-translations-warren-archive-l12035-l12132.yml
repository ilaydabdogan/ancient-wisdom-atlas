canonical_text:
  quote: ''
  summary: 'The Blessed One explains to Mallika several combinations of prior conduct
    and resulting rebirth: anger is associated with ugliness, non-anger with beauty,
    almsgiving with wealth, lack of almsgiving with poverty, and envy with low social
    standing. Mallika applies the teaching to her own former actions and present condition,
    then vows to avoid anger and envy and to give alms.'
  language: English
  quote_policy: summarized
