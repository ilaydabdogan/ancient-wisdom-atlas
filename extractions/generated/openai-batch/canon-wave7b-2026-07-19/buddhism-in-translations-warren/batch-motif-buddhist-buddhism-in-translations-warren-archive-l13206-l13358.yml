canonical_text:
  quote: He does not die so long as that wickedness is unexhausted.
  summary: 'The king questions how hell-fire can consume great stones instantly while
    beings in hell remain unconsumed for thousands of years. Nagasena replies with
    analogies of embryos surviving in bellies while hard substances are consumed,
    attributing this to the potency of former deeds. A subsequent discourse says that
    a person who does evil by body, voice, and mind reaches hell after death, is seized
    by hell guardians, and is brought before Yama, who questions him about the first
    of death''s messengers: visible old age.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The king says priests teach that hell-fire is much hotter than ordinary fire
    and can consume a pagoda-sized stone instantly, while ordinary fire does not consume
    a small stone in a day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king also says he cannot believe that beings born in hell are not consumed
    though they are cooked in hell-fire for many thousands of years.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena asks whether females of sea-monsters, crocodiles, turtles, pea-fowl,
    and pigeons eat hard stones and gravel, whether those substances are consumed
    in the belly, and whether the embryo in the belly is consumed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king answers that the embryo is not consumed and supposes this is due
    to the superior potency of its former deeds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nagasena applies the embryo analogy to hell inhabitants, saying they are not
    consumed in hell-fire because of the superior potency of their former deeds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage cites the Blessed One as saying that a person does not die as
    long as that wickedness is unexhausted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena gives further illustrations involving females of lions, tigers, panthers,
    and dogs, and women of several social groups, where hard food or meat is taken
    into the belly but the embryo is not consumed.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A discourse states that Death has three messengers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A person who does evil with body, voice, and mind arrives after death at a
    place of punishment, suffering, perdition, and hell.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Guardians of hell seize the wrongdoer by the arms and show him to Yama, ruler
    of the dead.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The guardians tell Yama that the man neglected duties to friends, parents,
    monks, Brahmans, and elders, and ask Yama to inflict punishment.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Yama questions the man about the first messenger of death, and the man first
    says he did not see it.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Yama identifies the first messenger as an aged woman or man, eighty, ninety,
