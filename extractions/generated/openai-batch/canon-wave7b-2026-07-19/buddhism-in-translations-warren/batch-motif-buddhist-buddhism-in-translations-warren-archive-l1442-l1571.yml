  quote: ''
  summary: In a first-person passage headed as the story of Sumedha, the speaker compares
    the body to rejected or dangerous things and states an intention to cast it off
    without regret. He gives away his possessions, travels to Himavant, builds a hermitage
    and leaf hut near Dhammaka hill, lays out a walking-place, gains the Six High
    Powers, adopts a bark garment, and later lives at the foot of trees.
