- id: obs:3
  text: Visakha asks The Teacher to turn back because she is having a monastery built
    for him, but he says the journey does not allow him to turn back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Visakha asks that a priest be left behind to know how the building work should
    be done, and The Teacher tells her to take the bowl of any priest she chooses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Visakha chooses Moggallana the Great because of his magical power and the
    expected speed of the work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moggallana is instructed to take five hundred priests and turn back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: By Moggallana's supernatural power, the group obtains very large logs and
    stones from fifty or sixty leagues away and brings them back the same day without
    exhausting the workers or breaking the carts' axles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The monastery is described as a two-story building on high foundations, approached
    by steps, with a thousand apartments divided equally between the lower and upper
    stories.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: After nine months of travel, The Teacher returns to Savatthi, while Visakha
    has built the monastery and is completing a red-gold peak intended to hold water-pots.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Visakha asks The Teacher to live in her monastery for four months with the
    congregation of priests, and he consents.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: A female friend brings a valuable piece of cloth to replace some floor-covering,
    but she cannot find a place where the existing material is less valuable and weeps
    because she fears she will have no share in the building's merit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ananda advises the female friend to make the cloth into a door-mat between
    the foot-washing place and the staircase so priests will wipe their feet on it
    before entering, producing a great reward for her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: For four months Visakha gives alms to The Buddha and the congregation, then
