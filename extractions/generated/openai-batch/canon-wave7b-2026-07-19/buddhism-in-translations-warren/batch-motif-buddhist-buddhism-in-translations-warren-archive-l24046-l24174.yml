    been born from heaven into a treasurer's family and is competent to attain salvation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Teacher goes toward the north gate after breakfast at Anathapindika's
    house; people understand his north-gate departure at sunrise as a sign that he
    is setting out on travels.
  category: sequence
  evidence_refs:
