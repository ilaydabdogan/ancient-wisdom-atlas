canonical_text:
  quote: ''
  summary: The Teacher perceives at dawn that Bhaddiya has been born from heaven and
    is able to attain salvation, then sets out by the north gate. Visakha asks him
    not to go because she is building a monastery, but he says the journey cannot
    be turned back. She chooses Moggallana to remain and assist, and by supernatural
    power he and five hundred priests gather large materials and the monastery is
    quickly constructed. After the Teacher returns, Visakha hosts him and the congregation,
    completes the building, and gives extensive alms, robes, and medicines. A female
    friend seeking merit donates a costly cloth as a door-mat after Ananda advises
    her where it can be used.
  language: English
  quote_policy: summarized
