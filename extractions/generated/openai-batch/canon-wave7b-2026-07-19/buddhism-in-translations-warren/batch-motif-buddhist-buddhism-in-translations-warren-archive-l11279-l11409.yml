canonical_text:
  quote: ''
  summary: The passage teaches that good and bad deeds are what accompany a person
    at death and yield future results. A dialogue between a king and the elder Nagasena
    explains human inequality through differences in karma, using trees and seed as
    an analogy and citing the Blessed One on beings as heirs of karma. A further discourse
    describes deeds rooted in covetousness, hatred, and infatuation as ripening in
    present or later lives like seed in fertile soil with timely rain, while deeds
    arising without those roots are abandoned and uprooted like a palmyra-tree that
    cannot grow again.
  language: English
  quote_policy: summarized
