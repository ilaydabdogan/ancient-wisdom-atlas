canonical_text:
  quote: ''
  summary: At Rajagaha, before the Buddha has permitted dwelling-houses for priests,
    the priests live in outdoor and marginal resting places. A Rajagaha treasurer,
    impressed by their deportment, offers to build monastery cells. The priests consult
    the Buddha, who permits five kinds of places of retreat. The treasurer builds
    sixty cells, offers a meal to the Buddha and the congregation of priests, and
    is instructed to dedicate the cells to the Order, present and future, throughout
    the world.
  language: English
  quote_policy: summarized
