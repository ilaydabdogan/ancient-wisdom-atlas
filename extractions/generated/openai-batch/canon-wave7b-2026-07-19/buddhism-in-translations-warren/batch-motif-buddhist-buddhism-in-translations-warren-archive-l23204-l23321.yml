canonical_text:
  quote: ''
  summary: Visakha arranges hospitality for royal guests and their animals. Her father
    Dhanañjaya commissions a costly jeweled great creeper parure for her, sustains
    the king and army through the rainy season despite shortages, and later gives
    her an extensive dowry. The passage explains the parure as the karmic result of
    Visakha's prior-life gift of robe materials to priests in the time of Kassapa
    Buddha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visakha is described as clever, with a fully matured and keen intellect attributed
    to aspiration over a hundred thousand world-cycles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visakha orders houses prepared for her father-in-law, the king, and deputy
    kings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visakha assigns slaves, servants, and hostlers to attend the king, deputy
    kings, elephants, horses, and other beasts so the guests will have a merry stay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dhanañjaya summons five hundred goldsmiths and gives them red gold, silver,
    gems, pearls, coral, diamonds, and other materials to make the great creeper parure
    for his daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king requests that a time be appointed for the maiden's departure, but
    Dhanañjaya asks the king to remain through the rainy season and says he will care
    for the army.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the royal stay, Saketa is described as being like a continual festival,
    with people receiving garlands, perfumes, garments, and other gifts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: When cooking wood runs short, Dhanañjaya directs that dilapidated buildings
    be used as fuel; when wood again runs out, he orders coarse cloths made into oil-soaked
    wicks for cooking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The finished parure uses silver instead of thread, extends from head to foot,
    and has gold medals and silver dies at specified places on the body.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Part of the parure is a peacock with five hundred red-gold feathers in each
    wing, a coral beak, jeweled eyes, jeweled neck and tail-feathers, and silver feather
    midribs and leg shanks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When placed on Visakha's head, the peacock ornament appears like a peacock
    dancing on a mountain summit and makes sounds compared to celestial choruses and
    orchestras.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the parure was worth ninety millions, with a hundred
    thousand spent on workmanship.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage explains the parure as the result of Visakha's previous-life gift
    of cloth, thread, needles, and dyeing material for robes to twenty thousand priests
    in the time of Kassapa Buddha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dhanañjaya gives Visakha a dowry of carts filled with money, metal dishes,
    silk garments, clarified butter, husked rice, implements, and fifteen hundred
    waiting-maids.
  category: action
  evidence_refs:
  - ev:7
