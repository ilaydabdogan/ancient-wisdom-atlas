canonical_text:
  quote: I have no other Refuge, / The Law is my best Refuge
  summary: A liturgical passage declares refuge in the Law and the Church, includes
    bowing worship and requests for forgiveness, praises the Church as a merit-producing
    congregation, invokes Buddha, the Law, Pacceka-buddhas, the Church, three refuges,
    three symbols, equanimity, and Nirvana, and then gives procedural and editorial
    notes on the priests, interrogatories, the Patimokkha, priestesses, manuscript
    source, chapter divisions, offenses, and precepts.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The first-person speaker declares having no other refuge, calls the Law the
    best refuge, and asks to conquer and win victory by the truth of those words.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says they bow their head to the ground, worship the Law as the
    noble doctrine of the Three Baskets, and asks the Law to forgive any sin against
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Church is described as Buddha's holy Church, a congregation of righteous
    men walking in a straight way and in the way of wisdom, associated with four paths
    of holiness and eight orders of the elect.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Church is described as worthy of offerings and of respectful salutation
    with joined hands raised to the forehead, and as producing merit like a rich field
    yielding increase for the benefit of the human world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker states that through life until Nirvana they will put trust in
    the Church and will worship the Church of past, future, and present ages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker calls the Church their noble refuge, bows to the ground to worship
    it, and asks the Church to forgive any sin against it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage names Buddha, the Law, Pacceka-buddhas, and the Church as the
    speaker's lords, and the speaker says, 'I am their slave.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says they will worship the three refuges, the three symbols, equanimity,
    and Nirvana with bowed head, and asks the three refuges, three symbols, peace,
    and Nirvana to rest on their head.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker worships the Buddhas, the Law, the Pacceka-buddhas, the Church,
    the three sages, every saying and word of the Great Teacher, every shrine, the
    spiritual superior, and the tutor, and asks that their thoughts be freed from
    sin.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the worship passage, the priests rise from their knees and resume their
    seats; a senior or deputed officiant sits at the top between two rows; interrogatories
    proceed; and the Patimokkha is intoned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The office for priestesses is stated to have been omitted in the edition because
    the order of priestesses is not then recognized by orthodox Buddhists.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The edition is said to derive from manuscripts in use at the Malwatte Monastery
    in Kandy and to be divided into ten chapters, including chapters on interrogatories,
    deadly sins, faults, offenses, conduct rules, and rules for settling cases; the
    whole is sometimes called the two hundred and twenty-seven precepts.
  category: other
  evidence_refs:
  - ev:8
