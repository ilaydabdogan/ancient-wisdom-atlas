canonical_text:
  quote: ''
  summary: 'The passage first concludes a dialogue in which Nagasena uses rebirth
    and bird-shadow analogies to explain that different destinations need not imply
    different times. It then begins a Kevaddha-Sutta episode: a priest wonders where
    the four elements utterly cease, enters trance, gains access to divine realms,
    and repeatedly asks increasingly exalted gods, who do not know and direct him
    further, ultimately toward the Brahma-world and the Retinue of Brahma within the
    supplied excerpt.'
  language: English
  quote_policy: summarized
