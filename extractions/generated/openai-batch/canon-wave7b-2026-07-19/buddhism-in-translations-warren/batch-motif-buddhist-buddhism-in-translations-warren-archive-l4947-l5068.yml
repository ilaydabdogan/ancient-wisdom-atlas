canonical_text:
  quote: ''
  summary: After Mara's army flees, gods and other beings celebrate Prince Siddhattha's
    victory and bring offerings to the Great Being on the throne of wisdom. Before
    sunset he vanquishes Mara's army; during the three watches of the night he gains
    knowledge of previous existences, the divine eye, and insight into Dependent Origination.
    At dawn his attainment of omniscience is accompanied by earthquakes, cosmic adornment,
    flowers, radiance, transformed waters, healings, and broken fetters. He utters
    verses about the end of birth and rebirth through discovering the builder and
    demolishing the edifice. The passage then begins the account of the Buddha dwelling
    at Uruvela under the Bo-tree by the Neranjara, sitting cross-legged for seven
    days in the bliss of emancipation.
  language: English
  quote_policy: summarized
