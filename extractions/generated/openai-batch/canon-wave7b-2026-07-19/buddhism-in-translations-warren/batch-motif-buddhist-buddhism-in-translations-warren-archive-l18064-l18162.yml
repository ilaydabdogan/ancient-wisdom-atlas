canonical_text:
  quote: Priests, there is but one way open to mortals ... and that is the Four Intent
    Contemplations.
  summary: The passage introduces the Four Intent Contemplations as the single way
    to purity, relief from sorrow and grief, correct conduct, and realization of Nirvana.
    It defines four contemplative domains and begins instruction on bodily contemplation
    through secluded sitting and awareness of breathing. Commentary adds similes of
    a basket-maker dividing bamboo and a cowherd tethering a calf to explain the fourfold
    division and the training of the mind.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The speaker tells priests that one way is open to mortals for purity, overcoming
    sorrow and lamentation, abolishing misery and grief, acquiring correct conduct,
    and realizing Nirvana: the Four Intent Contemplations.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four contemplative domains are body, sensations, mind, and elements of
    being; in each case the priest is described as strenuous, conscious, contemplative,
    and rid of lust and grief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For contemplation of the body, the priest retires to the forest, to the foot
    of a tree, or to an uninhabited spot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The priest sits cross-legged with body erect and contemplative faculty intent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The priest contemplates expirations and inspirations, comprehends long and
    short breaths, trains to be conscious of all expirations and inspirations, and
    trains to quiet them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A commentary says the Blessed One divides one Right Contemplation into four
    parts according to subject matter, using the comparison of a basket-maker dividing
    a large bamboo stalk into four parts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A commentary explains that secluded dwelling-places are chosen because the
    mind, long occupied with sense objects, does not readily apply itself to meditation.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: A commentary compares breaking in the mind to a cowherd leading a calf away
    from its mother and tying it with a halter to a post.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A commentary states that by this training the practitioner obtains four trances
