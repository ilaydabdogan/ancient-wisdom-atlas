canonical_text:
  quote: Accordingly, Ananda, here we have in existence the cause, the occasion, the
    origin, and the dependence of birth.
  summary: 'A speaker addresses Ananda and explains a sequence of dependent conditions:
    birth depends on existence; existence on attachment; attachment on desire; desire
    on sensation; sensation on contact; contact on name and form; and name and form
    on consciousness descending into the maternal womb. Each point is tested through
    a hypothetical absence of the prior condition, to which Ananda assents negatively.'
  language: English
  quote_policy: quoted
