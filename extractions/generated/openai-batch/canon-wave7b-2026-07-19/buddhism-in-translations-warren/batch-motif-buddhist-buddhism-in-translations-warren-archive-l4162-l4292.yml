canonical_text:
  quote: ''
  summary: During the Great Retirement, the Future Buddha leaves the city at night
    with Channa and Kanthaka, aided by gods and a gate divinity. He sends Channa and
    Kanthaka home, cuts off his top-knot and diadem, receives monastic requisites
    from Ghatikara, puts on the vesture of retirement, and Kanthaka dies of grief
    and is reborn in the Heaven of the Thirty-three.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gods muffle the sound of Kanthaka's neighing and place their hands under his
    feet at every step.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Future Buddha rides on Kanthaka; Channa holds on by the horse's tail;
    they arrive at the great city gate at midnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king had made the gate leaves extremely heavy to prevent the Future Buddha
    from leaving the city unnoticed; the passage attributes enormous strength to the
    Future Buddha.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Future Buddha, Channa, and Kanthaka each think of carrying the others
    over the wall if the gate does not open, but the divinity inhabiting the gate
    opens it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mara appears at this moment; the accompanying note identifies Mara as ruler
    of the highest heaven of sensual pleasure and as the Buddha's natural enemy.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Future Buddha tells Channa to take the ornaments and Kanthaka home; Channa
    asks to retire from the world, but the Future Buddha refuses him three times.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Future Buddha cuts off his top-knot together with the diadem using a sword;
    his hair remains short and curled to the right thereafter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Future Buddha throws his top-knot and diadem into the air with a conditional
    statement about becoming a Buddha; they remain in the sky, and Sakka receives
    them in a jewelled casket and establishes the Shrine of the Diadem in the Heaven
    of the Thirty-three.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ghatikara, a Maha-Brahma god and former friend from the time of Buddha Kassapa,
    brings the eight requisites of a monk and gives them to the Future Buddha.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Future Buddha puts on the vesture described as the symbol of saintship
    and retirement from the world, sends Channa to tell his parents he is well, and
    Channa departs after obeisance while keeping his right side toward him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kanthaka grieves at separation from his master, dies when the Future Buddha
    passes out of sight, and is reborn in the Heaven of the Thirty-three as the god
    Kanthaka.
  category: sequence
  evidence_refs:
  - ev:11
