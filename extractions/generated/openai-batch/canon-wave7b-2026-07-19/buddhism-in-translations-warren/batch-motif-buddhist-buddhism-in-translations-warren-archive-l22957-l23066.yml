canonical_text:
  quote: ''
  summary: An unnamed son states that he will comply with his parents if they can
    find him a girl endowed with five beauties. The passage defines those beauties,
    then narrates how his parents commission Brahmans to search for such a girl. The
    Brahmans arrive at Saketa on Public Day, when women go publicly to the river and
    young men garland suitable girls. Visakha arrives with five hundred attendants,
    a rainstorm sends the attendants running to shelter, and the Brahmans observe
    Visakha while trying to confirm her remaining beauty by making her speak.
  language: English
  quote_policy: summarized
