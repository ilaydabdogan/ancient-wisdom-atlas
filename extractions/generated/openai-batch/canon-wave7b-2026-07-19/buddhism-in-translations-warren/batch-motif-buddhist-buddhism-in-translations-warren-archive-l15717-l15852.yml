canonical_text:
  quote: ''
  summary: 'The passage describes a priest’s wished-for high powers: recollection
    of many former births and world-cycles, divine vision of beings dying and being
    reborn according to deeds, and liberation through wisdom. It then gives a dialogue
    between King Milinda and Nagasena about the distance to the Brahma-world, the
    rapidity of magical movement there, and analogies from memory and rebirth timing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest may wish to remember many previous states of existence, including
    repeated births and many destructions and renovations of a world-cycle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The remembered former lives are to be characterized by place, name, family,
    caste, maintenance, pleasures and pains, lifespan, death from one existence, and
    rebirth in another.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For such a wish to be fulfilled, the priest must be perfect in the precepts,
    according to the repeated formula in the passage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A priest may wish for divinely clear vision surpassing that of humans, by
    which he sees beings pass from one existence and arise in another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The vision distinguishes beings as base or noble, handsome or ugly, in higher
    or lower states, and undergoing the results of their deeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Beings described as wicked in body, voice, and mind, holding wrong views,
    arrive after death at a place of punishment, suffering, perdition, or hell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Beings described as righteous in body, voice, and mind, holding right views
    and acquiring merit, arrive after death at a place of happiness, a heavenly world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A priest may wish to attain freedom from depravity, deliverance of mind, and
    deliverance by wisdom in the present life and in his own person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For deliverance, the priest must be perfect in precepts, calm his thoughts,
    practice trances diligently, attain insight, and frequent lonely places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: King Milinda asks Nagasena how far it is from here to the Brahma-world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nagasena says the Brahma-world is so distant that a pagoda-sized rock falling
    from it at forty-eight thousand leagues per day and night would reach earth in
    four months.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king reports a teaching that a priest with magical power and mastery over
    mind can disappear from India and reappear in the Brahma-world as quickly as a
    strong man bends or stretches his arm, and he says he cannot believe it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nagasena asks the king to call to mind something done in Alexandria, and concludes
    that the king has gone two hundred leagues very nimbly through recollection.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: When asked whether a man reborn in the Brahma-world or a man reborn in Cashmere
    would arrive first, Nagasena replies that they would take the same length of time.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Nagasena illustrates equal rebirth timing by asking the king to think first
    of Kalasi, about two hundred leagues away, and then of Cashmere, about twelve
    leagues away.
  category: action
  evidence_refs:
  - ev:9
