canonical_text:
  quote: craves the incomparable security of a Nirvana free from birth
  summary: The passage distinguishes ignoble from noble craving. It defines noble
    craving as the desire for Nirvana free from birth, old age, disease, death, sorrow,
    and corruption. The speaker recounts that, before Buddhahood, he recognized the
    problem of craving what is itself subject to these conditions, left household
    life despite his parents' distress, and sought instruction from Alara Kalama.
    He quickly learned Alara Kalama's doctrine, asked its extent, was told it led
    to the realm of nothingness, and realized that doctrine for himself.
  language: English
  quote_policy: quoted
