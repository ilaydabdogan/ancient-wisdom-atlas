  summary: The passage first discusses the difficulty of defining Nirvana, describing
    it as release from rebirth and from the fires of lust, hatred, and infatuation,
    while denying that it is simple annihilation. It then translates and comments
    on a Visuddhi-Magga passage in which the Blessed One presents the Way of Purity
    through conduct, concentration, and wisdom, including avoidance of extremes and
    adoption of a middle course.
