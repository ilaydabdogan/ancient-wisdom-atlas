canonical_text:
  quote: ''
  summary: 'The passage presents Buddhist instructional dialogues and sermons: Nagasena
    distinguishes tasting food from passion for taste; Sariputta teaches that a noble
    disciple may be bodily afflicted without mental distress by not identifying the
    aggregates as Ego; Nagasena compares care for the body to treating an arrow wound
    and cites the body as a wound with nine outlets; an instructor tells priests that
    heavenly rebirth is not the aim of the holy life and that evil acts of body, voice,
    and mind should be loathed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nagasena says one person clings or covets while another does not, and explains
    that a person with passion experiences both food taste and passion due to taste,
    while one free from passion experiences taste without passion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sariputta describes a learned noble disciple who does not regard form, sensation,
    perception, predispositions, or consciousness as Ego or as belonging to the Ego.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The teaching states that when form or consciousness alters and changes, a
    person not possessed by Ego-identification does not give rise to sorrow, lamentation,
    grief, and despair.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The householder Nakulapita is delighted and applauds Sariputta's speech.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king asks Nagasena whether those who have retired from the world are fond
    of their bodies and why they attend to their bodies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nagasena asks the king about an arrow wound received in battle and its treatment
    with ointment, oil, and a bandage.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king says he treated his wound not from fondness for it but so that his
    flesh might heal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nagasena says renunciants care for their bodies without attachment in order
    to advance in the religious life.
  category: speech
  evidence_refs:
