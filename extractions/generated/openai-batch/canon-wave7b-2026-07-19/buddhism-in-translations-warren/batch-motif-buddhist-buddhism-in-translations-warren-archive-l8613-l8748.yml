canonical_text:
  quote: ''
  summary: The passage states that five groups include other classifications, then
    gives a doctrinal analysis of the human body as a combination of earthy, watery,
    fiery, and windy elements. It applies analysis of body parts, elements, aggregates,
    senses, and consciousnesses as a remedy for anger, and begins a discourse in which
    the Blessed One teaches the burden, its bearer, and the taking up of the burden
    through desire leading to rebirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that other groupings are included in the predisposition-group,
    so only five groups are laid down because they include all other classifications.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body’s earthy element is described as about a bushel of very fine powder
    in a medium-sized person, held together by the watery element, preserved by the
    fiery element, and propped up by the windy element.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The watery element is described as juicy and as holding the body together,
    giving the body plumpness or leanness when prevented from flowing away.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fiery element is described as hot and vaporous; it digests what is eaten
    and drunk, cooks the body, gives complexion, and keeps the body free from decay.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The windy element is described as active, able to prop up the body, coursing
    through every member, and impelling walking, standing, sitting, lying down, and
    limb movements.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The body is described as a machine made of four elements that moves like a
    puppet and deceives foolish people with femininity, masculinity, and related appearances.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: An addressed renunciant who is angry with a man is asked whether the anger
    is toward hair, nails, the four elements, the five groups, sense organs, sense
    objects, or sense-consciousnesses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: For a person who has made the analysis, the passage says there is no hold
    for anger, using the images of a mustard seed on an awl point and a painting in
    the sky.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Blessed One is located at Savatthi in Jetavana monastery in Anathapindika's
    Park and addresses the priests.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Blessed One defines the burden as the five attachment-groups, the bearer
    as the individual, and the taking up of the burden as desire leading to rebirth
    and delighting in forms of existence; the excerpt ends as he asks what laying
    down the burden is.
  category: speech
  evidence_refs:
  - ev:10
