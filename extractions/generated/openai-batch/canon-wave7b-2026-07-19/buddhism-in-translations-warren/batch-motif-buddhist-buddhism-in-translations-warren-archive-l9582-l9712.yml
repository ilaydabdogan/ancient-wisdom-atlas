  quote: ''
  summary: A doctrinal exposition defines initiatory karma, longing desire, attachment,
    thought-existence, the five present and future fruitions, and the causal structure
    by which karma and corruptions sustain rebirth. It describes the Wheel of Existence
    as having twenty component spokes, three rounds, and revolving without interruption
    while corruptions continue.
