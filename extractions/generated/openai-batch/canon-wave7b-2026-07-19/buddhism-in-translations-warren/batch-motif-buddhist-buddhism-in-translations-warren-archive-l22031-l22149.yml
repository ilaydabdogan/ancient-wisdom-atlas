canonical_text:
  quote: ''
  summary: A lay woman sees an elder return without her son and laments, then learns
    of her son’s renunciant conduct and worships in the direction he went. A later
    dialogue from the Milindapanha presents a dilemma about the Buddha’s prohibition
    of self-destruction alongside teaching the ending of birth, old age, disease,
    and death. Nagasena explains that virtuous people should not perish because they
    benefit others, using images of medicine, water, jewel, ship, caravan-leader,
    wind, cloud, teacher, and preceptor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An elder comes to the monastery and enters the village of Korandaka on the
    next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lay woman watches the road expecting her brother with her son; when she
    sees the elder alone, she falls at his feet, weeps, and says her son must be dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder thinks the lad must have gone away without announcing himself, comforts
    the lay woman, tells her the story, and shows her a cloth from his scrip.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lay woman lies prostrate with her face toward the direction in which her
    son went and worships.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lay woman praises her son for eating for three months in the house of
    his birth mother without saying that she was his mother or that he was her son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that for such a person mother and father are not hindrances,
    and neither are other lay devotees.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'A questioner addresses Nagasena with a dilemma: the Buddha forbade self-destruction,
    yet Buddhist teachers praise the overcoming of birth, old age, disease, and death.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nagasena affirms both the prohibition of self-destruction and the teaching
    of the extirpation of birth, old age, disease, and death, saying there was a reason
    for both.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nagasena describes the virtuous and well-conducted man through similes including
    medicine, healing herb, water, magic jewel, ship, caravan-leader, wind, great
    cloud, teacher, and preceptor.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nagasena says the prohibition was laid down from compassion so that the virtuous
    person, a cause of welfare to people, might not perish.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kumara-Kassapa is cited as saying that the longer virtuous and noble monks
    and Brahmans live, the more they benefit the multitude, the world, gods, and men.
  category: speech
  evidence_refs:
  - ev:7
