canonical_text:
  quote: ''
  summary: 'The passage describes the Buddha''s daily before- and after-breakfast
    habits: miraculous signs accompany his alms-entry, laypeople make offerings and
    feed him and priests, he teaches the Doctrine with results suited to listeners,
    returns to the monastery, exhorts priests, assigns meditation exercises, rests
    mindfully, surveys the world, and teaches an assembled audience again.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Winds clear the Buddha's path, clouds drop water to settle dust and form a
    canopy, and other winds scatter flowers before him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ground becomes level and pleasant where the Buddha walks, and lotus-flowers
    receive his tread.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Buddha enters the city-gate with his right foot, six-colored rays
    issue from his body and spread over palaces and pagodas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Elephants, horses, birds, other animals, musical instruments, and ornaments
    give forth melodious sounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people understand the signs as indicating that the Blessed One has entered
    for alms, dress in their best clothing, and come into the street with perfumes,
    flowers, and other offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some people ask the Buddha to give them groups of priests to feed, take his
    bowl, prepare a seat, and place food in the bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the meal, the Buddha teaches the Doctrine according to listeners' dispositions,
    and different listeners become established in refuges, precepts, conversion, higher
    fruits, sainthood, or retirement from the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After returning to the monastery, the Buddha sits on a prepared Buddha-mat
    in a pavilion, waits for the priests to finish eating, receives notice from the
    body-servant, and enters the perfumed chamber.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After his before-breakfast duties, the Buddha sits in the perfumed chamber,
    washes his feet, stands on the landing of the jeweled staircase, and exhorts the
    priests to work diligently for salvation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some priests ask for meditation exercises; the Buddha assigns exercises suited
    to their characters, and they go to forests, trees, hills, and various heavens.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Buddha may lie down mindfully on his right side in the manner of a lion,
    rise refreshed, and gaze over the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After people assemble at the monastery with offerings, the Buddha approaches
    miraculously, sits on the Buddha-mat in the lecture-hall, teaches according to
    the occasion, and dismisses the audience.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
