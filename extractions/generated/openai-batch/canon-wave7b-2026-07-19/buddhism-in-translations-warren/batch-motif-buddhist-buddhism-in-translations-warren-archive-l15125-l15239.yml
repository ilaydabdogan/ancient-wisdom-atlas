canonical_text:
  quote: ''
  summary: The passage catalogs forty Buddhist meditation subjects, classifies them
    by their relation to trance attainments, and introduces the earth-kasina as a
    bounded earth object or earth-derived mental image by which a practitioner may
    enter trance and seek release from old age and death. It also gives Mallaka the
    elder as an example of gaining a mental reflex from a plowed field and attaining
    saintship.
