  summary: The passage explains classifications of karma and their effects across
    present life, rebirth, and future lives. It describes karma and fruit as a continuing
    round in which name and form arise dependently, rebirth springs from karma, and
    insight into this causal pattern is fully possessed by Buddhas and generally discerned
    by a person of insight.
