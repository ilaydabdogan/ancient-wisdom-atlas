canonical_text:
  quote: ''
  summary: The passage contrasts Protestant Christian salvation by faith with Buddhist
    reliance on meditation for release from karma and rebirth. It summarizes the Buddha’s
    analysis of impermanence, karma, greed, hatred, and delusion, then describes meditation
    as a movement from concrete phenomena toward abstraction, negation, trance, and
    Nirvana. The author uses a mathematical analogy of setting karma equal to nullity
    or zero, and notes that the search for Nirvana was a common striving in Gotama’s
    age and country.
