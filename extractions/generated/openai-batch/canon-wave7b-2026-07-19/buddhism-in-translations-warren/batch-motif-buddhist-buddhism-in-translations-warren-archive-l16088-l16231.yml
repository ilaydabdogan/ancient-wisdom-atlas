canonical_text:
  quote: ''
  summary: 'The passage first concludes a discourse in which the Blessed One compares
    a priest’s failed search to the Brahma-world with a land-sighting bird returning
    to a ship, then gives verses on the cessation of elements, name and form, and
    consciousness. It then begins the account of Sariputta and two demons: Sariputta
    sits in trance under the moonlit sky, one demon ignores another’s warnings and
    strikes him, the attacker falls into hell, and Moggallana confirms that Sariputta
    is only slightly troubled.'
  language: English
  quote_policy: summarized
