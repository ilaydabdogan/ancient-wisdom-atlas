canonical_text:
  quote: ''
  summary: The passage explains rebirth through causal continuity rather than transmigration.
    A milk-to-sour-cream dispute illustrates how something different may still spring
    from an earlier condition. A Visuddhi-Magga section states that no entity or living
    principle transmigrates; at death, consciousness is conditioned by karma, desire,
    ignorance, and objects, with further similes of swinging over a ditch, echoes,
    light, seal impressions, and mirror reflections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that the name-and-form born into the next existence is
    different from the name-and-form ending at death, yet springs from it, so a person
    is not freed from evil deeds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hypothetical man buys a pot of milk from a cowherd, leaves it with him,
    and returns after it has turned into sour cream.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The royal interlocutor says he would sustain the cowherd's cause because the
    sour cream sprang from the milk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Visuddhi-Magga passage says that dependent elements of being arrive at
    a new existence, while no entity, living principle, or elements of being transmigrate
    from the last existence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: At death, the body is described as afflicted by pains, drying up, losing the
    senses, and having feeling, thinking, and vitality make their last stand in the
    heart.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Consciousness in the heart is said to continue by virtue of karma, also called
    predispositions, connected with former deeds or a reflex of the new mode of life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: While consciousness subsists, desire inclines it toward an object and karma
    impels it toward that object.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The movement of consciousness is compared to a man swinging over a ditch by
    a rope hanging from a tree and leaving a first resting-place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The former consciousness is called passing away, and the latter consciousness
    is called rebirth; the latter is said not to have come from the previous existence
    but to arise through causes in the old existence.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Echoes, light, seal impressions, mirror reflections, and shadows are given
    as illustrations of effects that have causes and exist without coming from elsewhere.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says that neither absolute sameness nor absolute diversity can
    be derived from the causal series, and uses milk and sour cream to illustrate
    this point.
  category: relationship
  evidence_refs:
  - ev:10
