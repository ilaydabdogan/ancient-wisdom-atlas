canonical_text:
  quote: ''
  summary: A memorial passage by C. R. Lanman reflects on the scholarly value of technical
    Orientalist publications, recounts Henry Clarke Warren's support for a Sanskrit
    text publication series, praises Warren's detached service and insight, and expresses
    renewed hope of completing Warren's work on Buddhaghosa's Way of Salvation. The
    passage closes with an explanation of a Pali word meaning both to clear a jungle
    path and to edit a text.
  language: English
