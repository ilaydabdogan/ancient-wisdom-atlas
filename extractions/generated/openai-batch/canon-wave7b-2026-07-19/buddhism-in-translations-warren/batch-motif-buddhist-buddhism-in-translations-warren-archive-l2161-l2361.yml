canonical_text:
  quote: ''
  summary: 'In a first-person verse narrative, the speaker affirms the truth of Buddhas''
    words and the certainty that he will become a Buddha. He then searches throughout
    all directions for conditions that make a Buddha and successively identifies five
    perfections: Alms, Precepts, Renunciation, Wisdom, and Courage. Each perfection
    is explained through a simile: an overturned jar emptying all water, a yak cow
    guarding its tail even at risk of death, a prisoner longing for release, a priest
    begging from all ranks, and a lion acting with courage and alertness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Buddhas do not lie, that a Conqueror's word is not
    vain, and that Buddhas speak only truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person speaker repeatedly states that he will surely be a Buddha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The certainty of Buddhas'' speech is compared with sure events: clods falling
    back to earth, death approaching living beings, sunrise after night wanes, a lion
    roaring when leaving its den, and childbirth after conception.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker resolves to search above, below, and to all ten points for conditions
    that make a Buddha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first perfection found is Alms, described as a great highroad formerly
    walked by seers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The instruction on Alms tells the speaker to give all to suppliants of mean,
    high, or middling rank, like an overturned brimming jar giving all its water and
    keeping nothing back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second perfection found is Precepts, which the speaker is told to keep
    whole and guard as a yak cow guards its tail even when caught by a bush or thorn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The third perfection found is Renunciation; every mode of being is to be viewed
    as a prison, and release from existence is sought.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fourth perfection found is Wisdom; the speaker is told to resort to the
    learned and increase wisdom, like a priest who begs from people of all ranks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fifth perfection found is Courage; the lion is presented as courageous,
    watchful, and alert, and the speaker is told to display courageous energy in repeated
    births.
  category: attribute
  evidence_refs:
  - ev:7
