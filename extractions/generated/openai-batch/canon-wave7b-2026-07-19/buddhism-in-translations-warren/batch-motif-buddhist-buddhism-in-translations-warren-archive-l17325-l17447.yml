canonical_text:
  quote: ''
  summary: The narrator settles in a suitable grove by a river near a village, attains
    Nirvana free from birth and corruption, and realizes that this is his last existence.
    He then hesitates to proclaim the profound Doctrine because mankind is bound by
    lusts and may not understand. Brahma Sahampati perceives this hesitation, appears
    from the Brahma-world, and asks him to teach because some beings will understand.
    The narrator, moved by compassion, surveys the world with the eye of a Buddha
    and sees beings of varied moral condition and capacity, introduced with a lotus-pond
    image.
  language: English
  quote_policy: summarized
