canonical_text:
  quote: ''
  summary: The passage gives a sequence of cemetery contemplations in which a priest
    sees progressively decayed human remains and compares his own body to them, saying
    it has the same nature and destiny. It then describes intent contemplation of
    sensations through comprehension of pleasant, unpleasant, indifferent, interested,
    and disinterested sensations, with attention to origination and destruction and
    non-clinging. It begins the intent contemplation of mind by listing mental states
    to be comprehended, including passionate, hateful, infatuated, concentrated, emancipated,
    and opposite states.
  language: English
  quote_policy: summarized
