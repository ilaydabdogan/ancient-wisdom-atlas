canonical_text:
  quote: ''
  summary: 'After a storm ends, Mucalinda the serpent-king unwinds from the Blessed
    One, assumes the appearance of a young man, and reveres him. The Blessed One utters
    verses praising solitude, harmlessness, restraint, freedom from passion, and the
    abandonment of the false notion ''I am.'' The passage then introduces the conversion
    narrative of Sariputta and Moggallana: they live under Sanjaya at Rajagaha and
    agree that whichever first attains the deathless will tell the other. Sariputta
    sees the monk Assaji on alms round, is impressed by his deportment, follows him
    after the alms round, asks about his teacher and doctrine, hears a brief statement
    of the Buddha''s teaching on causes and cessation, and gains a clear perception
    that whatever originates also ceases.'
  language: English
  quote_policy: summarized
