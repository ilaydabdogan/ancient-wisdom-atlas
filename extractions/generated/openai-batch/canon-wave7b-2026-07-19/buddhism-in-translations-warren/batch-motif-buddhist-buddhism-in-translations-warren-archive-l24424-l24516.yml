canonical_text:
  quote: ''
  summary: 'The passage describes successive disappearances in the Buddhist dispensation:
    learning declines through irreligion, drought, loss of support for priests, and
    loss of textual memory; monastic symbols are degraded and abandoned; finally the
    Buddha relics assemble at the Great Bo-tree, make a Buddha effigy, teach the Doctrine
    to gods, and burn the effigy with fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the disappearance of learning has not occurred as
    long as the text of the Three Baskets and their commentaries remain extant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sequence is described in which irreligious rulers, officials, and people
    are followed by untimely rain, poor crops, inability to supply reliances to priests,
    and priests no longer teaching novices.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists a staged disappearance of Buddhist textual collections,
    beginning with the Great Work and proceeding through named Abhidhamma, Suttanta,
    Jataka, and Vinaya materials.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A pious king offers a purse of a thousand coins in a golden casket on an elephant
    to anyone who knows a stanza spoken by the Buddhas, but no one who knows a four-line
    stanza is found.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The last priests are said to carry robes, bowls, and tooth-sticks like naked
    ascetics, and to make a bottle-gourd into a begging-bowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A priest cuts a small piece of yellow cloth and ties it around his neck, ears,
    or hair while turning to husbandry, trade, wife, and children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The priests later throw away the yellow cloth and persecute wild animals and
    birds, after which the disappearance of the symbols is said to have occurred.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the dispensation is five thousand years old, the relics begin to lack
    honor and worship and go wherever they can receive it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the dispensation has disappeared, relics come from every place, including
    the serpent world, the world of the gods, and the Brahma-world, and gather at
    the throne under the Great Bo-tree.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The relics make an effigy of the Buddha, perform a miracle resembling the
    double-miracle, and teach the Doctrine.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: No human being is found at the place, while gods from ten thousand worlds
    come to listen to the Doctrine and many attain to it.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The gods announce that in seven days the One Possessing the Ten Forces will
    pass into Nirvana, weep that they will be in darkness, and the relics emit flames
    that burn the effigy completely.
  category: sequence
  evidence_refs:
  - ev:11
