canonical_text:
  quote: ''
  summary: A treasurer's past almsgiving to a Private Buddha, later regret, and murder
    of his nephew are explained as causes of heavenly rebirths, repeated treasurership,
    aversion to luxury, hell-suffering, and repeated sonless deaths. A verse states
    that possessions and kin do not follow a person after death, but deeds of body,
    speech, and mind do. A new discourse begins in which Mallika the queen asks the
    Blessed One why women differ in beauty, wealth, and social position; the Blessed
    One begins by linking anger, lack of almsgiving, and envy to an ugly, poor, low-status
    rebirth.
  language: English
  quote_policy: summarized
