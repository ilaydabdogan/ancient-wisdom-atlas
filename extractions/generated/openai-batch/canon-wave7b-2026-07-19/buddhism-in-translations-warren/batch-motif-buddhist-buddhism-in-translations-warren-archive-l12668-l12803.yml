canonical_text:
  quote: ''
  summary: A contemplative practitioner investigates the dependent arising of form/body
    and name. The body is described as arising in an impure bodily interior rather
    than among beautiful flowers or jewels. Ignorance, desire, attachment, karma,
    and food are named as causes or supports. The passage then outlines ways of understanding
    name and form through sense conditions, karma, thoughts, seasons, nutriment, and
    Dependent Origination, leading to the abandonment of questions about existence
    in past, future, and present.
  language: English
  quote_policy: summarized
