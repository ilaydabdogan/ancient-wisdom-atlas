  text: The body is said not to arise among aquatic flowers, jewels, or pearl-necklaces,
    but in a contracted, ill-smelling, disgusting bodily location between stomach
    and intestines, with entrails and mesentery nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is compared to a worm in rotten fish, carrion, rancid gruel, or a
