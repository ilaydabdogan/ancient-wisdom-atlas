- id: obs:3
  text: Ignorance, desire, attachment, and karma are named as causes that produce
    the body, while food is named as its supporting dependence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ignorance, desire, and attachment are compared to a mother as basis; karma
    is compared to a father as begetter; food is compared to a nurse as sustainer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Name is described as arising dependently, with eye-consciousness arising in
    dependence on the eye and in respect to form.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Insight into the dependent existence of name and form across present, past,
