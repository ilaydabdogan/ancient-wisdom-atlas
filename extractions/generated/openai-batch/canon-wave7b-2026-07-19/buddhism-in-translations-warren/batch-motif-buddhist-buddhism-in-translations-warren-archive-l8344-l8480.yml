canonical_text:
  quote: '"If you except the water, the sand, the hither bank, and the further bank,
    where can you find any Ganges?"'
  summary: The passage first uses the arising and ceasing of fire from two sticks
    as a simile for sensations arising from contact and ending when contact ends.
    It then presents a Jataka frame in which the Teacher silences a wandering ascetic
    with a question about unity, and recounts a past life in which the Future Buddha
    similarly defeats an ascetic’s abstract questioning about the Ganges. The passage
    concludes with verses on insatiable wishes and a commentary comparing the search
    for a Ganges apart from its components to the search for an Ego apart from form
    and other aggregates.
  language: English
  quote_policy: quoted
