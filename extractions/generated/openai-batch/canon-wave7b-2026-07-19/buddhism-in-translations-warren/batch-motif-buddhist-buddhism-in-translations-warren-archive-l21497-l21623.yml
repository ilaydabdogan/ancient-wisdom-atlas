canonical_text:
  quote: ''
  summary: 'The passage first contrasts Sakka, leader of the gods, with a liberated
    saintly priest: Sakka recites a stanza about fast days and eight vows, but the
    discourse says the claim is ill-spoken because Sakka is not free from defilements
    or from birth, old age, death, and misery, whereas a saintly priest released by
    perfect knowledge could truly say it. The passage then begins a separate narrative
    in which the Blessed One at Jetavana tells priests of a sickly demon who sits
    on Sakka’s throne and grows more attractive as the Gods of the Thirty-three become
    angry, leading them to report to Sakka that it must be an anger-eating demon.'
  language: English
  quote_policy: summarized
