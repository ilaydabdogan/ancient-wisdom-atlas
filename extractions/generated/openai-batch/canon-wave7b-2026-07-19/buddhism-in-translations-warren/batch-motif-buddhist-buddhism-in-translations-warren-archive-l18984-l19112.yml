canonical_text:
  quote: ''
  summary: The passage defines the noble truth of the cessation of misery as the fading
    out and cessation of desire, explains that desire wanes where sense-related things
    had been delightful, and introduces the noble eightfold path as the path leading
    to the cessation of misery. It then defines several path factors, including right
    belief, right resolve, right speech, right behavior, right occupation, and right
    effort. A note identifies the listed terms for cessation with Nirvana and gives
    additional names such as the unconditioned, the desireless, the unborn, and the
    deathless.
