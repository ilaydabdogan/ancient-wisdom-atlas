canonical_text:
  quote: ''
  summary: A priest asks where the four elements utterly cease. Divine interlocutors
    say they do not know and direct him to Great Brahma, whose arrival is preceded
    by radiance. Great Brahma publicly recites his exalted titles instead of answering,
    then privately admits he does not know and sends the priest back to the Blessed
    One. The priest returns instantly from Brahma-heaven and asks the Blessed One
    the same question.
  language: English
  quote_policy: summarized
