canonical_text:
  quote: ''
  summary: Moggallana the Great is described as visiting heaven and hell to question
    beings about their previous karma and then reporting this to humans. Rival naked
    ascetics, jealous of the alms and honor he receives, hire highwaymen to kill him.
    Moggallana repeatedly escapes through miraculous means, but previous karma eventually
    prevents his flight; he is beaten, left for dead, visits the Teacher through the
    air, recites the Doctrine, performs miracles, and passes into Nirvana at Black
    Rock. The murderers are discovered and punished by King Ajatasattu. The Teacher
    explains that Moggallana's death accords with karma from a previous existence
    and begins a former-life story.
  language: English
  quote_policy: summarized
