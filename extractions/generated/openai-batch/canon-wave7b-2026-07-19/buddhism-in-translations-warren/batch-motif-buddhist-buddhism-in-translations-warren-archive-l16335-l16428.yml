- id: obs:2
  text: 'The passage compares powers of calling former existences to mind with modes
    of movement: blind groping with a stick, walking with a staff, walking without
    a staff, riding in a cart, riding on camel-back, and rolling in a chariot on a
    great highway.'
  category: relationship
  evidence_refs:
  - ev:2
