canonical_text:
  quote: ''
  summary: The passage ranks powers of perceiving and recollecting former existences
    through similes of increasing light and increasingly effective movement. It then
    instructs a priest to enter meditative trances and review actions in reverse order,
    extending recollection back through the present life to conception and the previous
    death. The difficulty of crossing this point is compared to thick darkness, and
    persistence is illustrated by a strong man repeatedly sharpening an axe while
    cutting down a mighty tree.
  language: English
  quote_policy: summarized
