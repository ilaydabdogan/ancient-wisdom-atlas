candidate_motifs:
- id: motif:1
  label: Doubted royal proficiency publicly demonstrated
  taxonomy_refs: []
  basis: The Future Buddha answers accusations that he is not training by announcing
    and performing a public twelvefold display of skill before his relatives, who
    then stop doubting him.
  evidence_refs:
  - ev:1
  - ev:12
  confidence: high
  cautions: The passage only briefly describes the twelvefold skill and refers details
    to another birth-story.
- id: motif:2
  label: Four life signs awaken renunciant resolve
  taxonomy_refs:
  - departure
  - wisdom
  basis: Old age, disease, death, and a monk are shown to the Future Buddha; after
    these encounters, retirement from the world becomes pleasing to him and the narrative
    moves toward the Great Retirement.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage includes a variant on whether the four signs occur over several
    outings or one day.
- id: motif:3
  label: Divine apparitions guide the hero toward departure
  taxonomy_refs:
  - departure
  basis: The gods create the signs and inspire the charioteer so that the Future Buddha
    encounters and understands old age, disease, death, and monastic retirement.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not describe the complete departure, only the preparations
    and its imminence.
- id: motif:4
  label: Pleasure and guarded enclosure used to delay renunciation
  taxonomy_refs:
  - departure
  basis: After signs disturb the Future Buddha, the king orders plays and repeatedly
    expands the guard in an attempt to keep him enjoying pleasure and prevent retirement
    from the world.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motive is stated in relation to preventing retirement; the passage
    does not yet narrate escape through the guards.
- id: motif:5
  label: Final adornment before sacred departure
  taxonomy_refs:
  - departure
  basis: Sakka identifies the prince's adornment as his last before going forth on
    the Great Retirement and sends Vissakamma with celestial ornaments.
  evidence_refs:
