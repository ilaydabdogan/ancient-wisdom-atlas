  - ev:6
- id: obs:10
  text: On another outing to the park, the Future Buddha sees a dead man fashioned
    by the gods, asks about him, and returns agitated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On another outing, the Future Buddha sees a carefully and decently clad monk
