canonical_text:
  quote: ''
  summary: 'The passage first describes the Future Buddha publicly demonstrating his
    proficiency after relatives doubt his training. It then narrates the beginning
    of the Great Retirement: Prince Siddhattha rides toward the park, the gods show
    him signs of old age, disease, death, and monastic retirement, and his father
    attempts to distract and guard him. After the fourth sign he goes to the park,
    bathes, sits for adornment, and Sakka sends Vissakamma to adorn him with celestial
    ornaments before his departure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives say the prince is not training himself and is given over to pleasure;
    he replies that he needs no training and asks for a public announcement of a future
    display of proficiency.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Future Buddha gathers expert bowmen and displays a twelvefold skill before
    the populace and his kinsfolk; the kinsfolk cease doubting him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Future Buddha tells his charioteer to prepare a chariot for a trip to
    the park; the charioteer prepares an ornate chariot with four white Sindhava horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods decide that Prince Siddhattha's enlightenment is near and that they
    must show him a sign.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods change one of their number into a decrepit old man visible only to
    the Future Buddha and the charioteer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man is described as broken-toothed, gray-haired, crooked and bent,
    leaning on a staff, and trembling.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: After asking who the old man is, the Future Buddha says that old age must
    come to everyone born and returns to the palace agitated.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the king hears that his son has seen an old man and may retire from the
