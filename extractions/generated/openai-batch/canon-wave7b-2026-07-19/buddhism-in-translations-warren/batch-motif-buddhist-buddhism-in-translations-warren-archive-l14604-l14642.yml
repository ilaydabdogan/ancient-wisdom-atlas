canonical_text:
  quote: ''
  summary: At the close of the Hare Birth-Story, Sakka reveals that he had come to
    test the Future Buddha, who appears as a wise hare and declares his complete willingness
    to give. Sakka proclaims the hare’s virtue, draws a hare outline in the moon,
    and departs. The four wise creatures keep precepts and pass away according to
    their deeds. The Teacher expounds the truths and identifies the past-life characters
    with named disciples and himself.
  language: English
  quote_policy: summarized
