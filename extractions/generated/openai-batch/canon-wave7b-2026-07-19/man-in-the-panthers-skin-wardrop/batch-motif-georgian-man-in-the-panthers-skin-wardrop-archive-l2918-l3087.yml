canonical_text:
  quote: ''
  summary: 'Avt’handil, wandering in search of a mysterious knight, camps, hunts,
    and lights a fire. He meets distressed horsemen: three brothers from Khataet’hi,
    one wounded, who recount a hunting expedition that led to an encounter with a
    radiant knight clad in panther skin on a black horse. The brothers tried to seize
    or challenge him; he answered little and wounded the youngest with a whip before
    riding away. The brothers point out the departing knight. Avt’handil recognizes
    him as the object of his quest, blesses the brothers, rides after him, and considers
    how to approach him calmly.'
  language: English
  quote_policy: summarized
