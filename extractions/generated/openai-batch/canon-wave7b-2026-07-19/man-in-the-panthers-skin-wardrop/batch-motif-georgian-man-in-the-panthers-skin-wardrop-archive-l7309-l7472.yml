canonical_text:
  quote: ''
  summary: The passage follows Avt'handil in lovesick distress, then at dawn to the
    vizier's house. After being ceremonially received, he dismisses the household
    and asks Vizier Ustasra to intercede with King Rostevan/Rosten so that he may
    leave to fulfill his oath to return to Tariel and seek help or light for him.
    He describes Tariel's suffering as a fire that burns him, calls Asmat'h more than
    a sister, asks that the king not grieve his going, invokes God's will, and offers
    the vizier a large bribe to secure leave.
  language: English
