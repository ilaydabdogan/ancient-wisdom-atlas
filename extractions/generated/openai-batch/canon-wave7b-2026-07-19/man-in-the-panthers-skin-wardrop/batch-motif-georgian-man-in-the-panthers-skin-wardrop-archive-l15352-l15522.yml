canonical_text:
  quote: ''
  summary: Tariel prepares to depart with Avt’handil and P’hridon after Avt’handil
    summons a large Arab army. Nestan-Daredjan and T’hinat’hin, described as oath-bound
    adopted sisters, grieve at their parting. Rostan and the soldiers also mourn Tariel’s
    departure. The three heroes travel with troops, feast on the way, and later Tariel
    and his wife receive royal thrones; Tariel is proclaimed king, Avt’handil and
    P’hridon are honored, wedding celebrations take place, gifts and treasure are
    distributed, and the Indians honor the two allies.
  language: English
  quote_policy: summarized
