canonical_text:
  quote: ''
  summary: Avt’handil sends Tariel a message of devoted service, wishing to see Tariel
    restored as king in India with Nestan beside him. Tariel refuses delay and intends
    to go with Avt’handil to seek forgiveness and request the king’s daughter for
    him. Avt’handil kneels and objects that this may break loyalty to Rosten, his
    foster-father and master, and anger his beloved. Tariel raises him, argues for
    frank friendship, and says he will respectfully ask the king to give his daughter.
    Avt’handil accepts; P’hridon selects a convoy. A new heading announces Tariel’s
    return to the cave and treasure, followed by a theological maxim and the departure
    from P’hridon’s country with a sun-faced maiden.
  language: English
  quote_policy: summarized
