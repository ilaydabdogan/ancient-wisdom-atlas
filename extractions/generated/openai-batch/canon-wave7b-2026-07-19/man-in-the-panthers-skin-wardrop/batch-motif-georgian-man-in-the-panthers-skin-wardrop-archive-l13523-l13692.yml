canonical_text:
  quote: ''
  summary: P’hridon greets Avt’handil and Tariel, hosts them, receives armour as a
    gift, and urges a swift expedition against Kadjet’hi with a small chosen force.
    The company leaves Asmat’h behind, crosses the sea, travels by night, and reaches
    a heavily guarded rock-surrounded city. In council, P’hridon proposes entering
    by rope from a tower, but Avt’handil rejects this as too noisy and proposes instead
    an ambush and merchant disguise with arms carried on a mule.
  language: English
  quote_policy: summarized
