  text: P'hatman commands that, if the men will not give up the maiden, her servants
    should capture the maiden, kill the men, and bring the maiden to her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The servants bargain unsuccessfully, seize the men, cut off their heads, throw
    them into the sea, and guard the maiden until P'hatman comes down to take her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden is repeatedly described through celestial imagery, including moon,
    sun, rays, and the Pleiads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: P'hatman and Avt'handil weep together for Nestan, and Avt'handil asks P'hatman
    to continue her account.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: P'hatman says she kissed, caressed, and loved the maiden after receiving her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When asked who she is and where she was being taken, the maiden does not give
    her story and warns P'hatman not to ask further, invoking the All-seeing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: P'hatman wraps the maiden in heavy brocade, brings her home, places her secretly
    in a furnished house, tells no one, and assigns a servant to her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The maiden weeps day and night; her tears are described as springs, pools,
    streams, and, when questioned, as a fountain or rivulet of blood.
  category: attribute
  evidence_refs:
  - ev:6
