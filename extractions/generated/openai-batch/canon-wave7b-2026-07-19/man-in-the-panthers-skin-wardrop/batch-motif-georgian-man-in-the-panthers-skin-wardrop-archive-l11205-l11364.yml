canonical_text:
  quote: ''
  summary: P'hatman narrates to Avt'handil how she ordered her servants to obtain
    a radiant maiden. When the men with the maiden would not sell her, the servants
    killed them and cast them into the sea. P'hatman took the maiden home, praised
    her with sun, moon, and star imagery, questioned her unsuccessfully, hid her secretly
    with a servant, and describes her ceaseless weeping, refusal of comfort, and wondrous
    veil and cloak.
  language: English
  quote_policy: summarized
literal_observations:
