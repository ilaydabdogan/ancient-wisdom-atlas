canonical_text:
  quote: ''
  summary: Avt'handil answers P'hatman's invitation to a secret meeting. A later message
    tells him not to come, but he continues. While Avt'handil and P'hatman are together,
    an elegant youth enters with an armed slave, threatens P'hatman with vengeance
    and with making her devour her children, and departs. P'hatman laments that she
    has doomed her household and asks Avt'handil either to kill the threatening man
    secretly that night and retrieve her ring, or to flee. Avt'handil takes a mace
    and asks for a guide to show him the road.
  language: English
  quote_policy: summarized
