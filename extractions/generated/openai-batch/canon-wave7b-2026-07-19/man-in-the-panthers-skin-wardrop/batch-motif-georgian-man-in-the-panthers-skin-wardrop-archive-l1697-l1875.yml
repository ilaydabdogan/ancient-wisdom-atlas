canonical_text:
  quote: "“Whoever shall be beaten, let him go bareheaded for three days.”"
  summary: Avt’handil and the king arrange a publicly witnessed archery and hunting
    wager. Huntsmen drive game into a ringed field, and the two mounted contestants
    shoot large numbers of animals. Servants count the shots and kills, declare Avt’handil
    the winner by a score, and the king rejoices in the victory of his foster-son.
    The two then rest beneath trees near a stream while soldiers and servants stand
    around them.
  language: English
  quote_policy: quoted
