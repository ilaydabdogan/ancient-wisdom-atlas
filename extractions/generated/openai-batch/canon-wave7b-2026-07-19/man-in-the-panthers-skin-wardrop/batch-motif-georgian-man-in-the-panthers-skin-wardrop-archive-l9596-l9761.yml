- id: obs:1
  text: The knight travels weeping for seventy days along the road to the seashore
    and questions approaching sailors about the realm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sailors answer that the place is at the boundary of the Turks and near
    P'hridon's border, and they identify themselves as P'hridon's men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sailors describe Nuradin P'hridon as king of their land and praise him
    as brave, generous, mighty, and swift on horseback.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The knight says he seeks P'hridon, and the sailors direct him toward Mulghazanzar,
    saying he should arrive in ten days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the knight continues, strangers on the road serve him, gaze at him, guide
    him, and answer his questions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Near Mulghazanzar the knight sees an army hunting: soldiers encircle a field,
    shoot, shout, and kill game.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man tells the knight that P'hridon, king of Mulghazanzar, is hunting on
    the sedgy plain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: An eagle soars in the midst of the host; the knight urges on his horse, shoots
    the eagle with an arrow, dismounts, clips its wings, and remounts calmly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After seeing the knight, the archers stop shooting, break the circle, and
    surround him, but they do not ask who he is.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: P'hridon stands on a hill in the meadow with forty men worthy to shoot with
    him and sends a slave to see what the armies are doing.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The slave sees the knight's cypress-like, sapling form, becomes dazed, and
    forgets the words he was sent to say.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Avt'handil asks the slave to tell P'hridon that he is a lonely stranger far
    from home, sworn brother to Tariel, and sent to P'hridon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The slave reports to P'hridon that he has seen someone like a sun and says
    the man claims to be Tariel's brother coming to P'hridon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: When P'hridon hears Tariel's name, he weeps; he descends from the ridge to
    meet Avt'handil, and both dismount as joy brings tears.
  category: sequence
  evidence_refs:
