canonical_text:
  quote: ''
  summary: Avt'handil, after parting from Tariel, travels weeping toward P'hridon.
    At the seashore he questions sailors, who identify P'hridon's realm and direct
    him to Mulghazanzar. Near P'hridon's hunt, Avt'handil shoots a soaring eagle,
    drawing the astonished attention of the host. He sends word that he is Tariel's
    sworn brother; P'hridon, moved by Tariel's name, descends from the hill and meets
    him with tears and joy.
  language: English
  quote_policy: summarized
