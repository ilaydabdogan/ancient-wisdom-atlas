  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The maiden tells the eunuchs that she is not suited to be their queen and
    that her path leads elsewhere.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The maiden threatens to strike a knife into her heart and offers her girdled
    treasure in exchange for being allowed to go free.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The maiden gives the eunuchs her pearls, gems, and ruby crown; the slaves
    desire the treasure and let her escape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A didactic comment states that gold gives no joy to those who love it and
    binds the soul in this world.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: One guard gives the maiden a garment, and the group passes through other doors
    because the main hall is full of drunken men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The escape is expressed with the image of a full moon not swallowed by a serpent.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The maiden knocks at P'hatman's door and asks for her, but refuses to come
    inside.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The maiden says she has bought herself with what P'hatman had given her and
