  text: The maiden is described as emotionally detached from joy and sorrow, with
    her mind compared to a dove.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king wants his son to return victorious and plans to keep the maiden ready
    for the son's homecoming.
  category: action
