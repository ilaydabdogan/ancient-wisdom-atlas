canonical_text:
  quote: ''
  summary: A king prepares a beautiful captive maiden as a bride for his absent warrior
    son, dresses her in jewels, places her in a royal chamber, and sets eunuchs to
    guard her. The maiden laments her fate, decides to act rather than die, persuades
    the eunuchs with a threat of suicide and a gift of jewels, escapes through other
    doors, goes to P'hatman, and is sent away on horseback before pursuers can find
    her. The palace searches and mourns after her disappearance.
  language: English
  quote_policy: summarized
