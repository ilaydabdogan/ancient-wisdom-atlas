- id: obs:3
  text: The king's son is described as a fearless, beautiful youth who has been away
    at war for a long time.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden is dressed in gemmed maidenly clothing, crowned with a whole ruby,
    and placed on a gold couch in a decorated royal chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nine eunuchs are ordered to guard the chamber door while the king feasts and
    gives Usen large gifts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden laments to Fate, asks where she has come from and to whom she will
    belong, and calls her life very hard.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden decides not to slay herself before death comes and says that intelligence
