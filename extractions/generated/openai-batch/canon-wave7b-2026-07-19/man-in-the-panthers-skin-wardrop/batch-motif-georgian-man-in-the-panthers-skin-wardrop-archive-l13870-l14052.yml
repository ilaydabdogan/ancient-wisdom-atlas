canonical_text:
  quote: ''
  summary: After the battle at Kadjet’hi, Avt’handil and P’hridon find signs of Tariel’s
    victory and discover Tariel reunited with Nestan. The companions greet one another,
    gather treasure, secure the castle, and depart toward the City of the Seas. Tariel
    sends word to the King of the Seas, credits P’hatman with freeing Nestan, offers
    the conquered Kadji kingdom, and the king comes with P’hatman while preparing
    for the wedding.
  language: English
  quote_policy: summarized
