canonical_text:
  quote: ''
  summary: The passage moves from a lover’s letter using solar imagery and exchanged
    tokens to a royal council about succession. The aging royal pair, lacking a son,
    seek a husband for their daughter who can receive the throne and guard the realm.
    A foreign king’s son is selected as bridegroom, causing the first-person speaker
    distress. The speaker is then secretly summoned by a radiant woman through intermediaries
    to a garden tower, where he finds Asmat’h weeping and the woman veiled, tearful,
    furious, and accusing him of breaking his oath.
  language: English
  quote_policy: summarized
