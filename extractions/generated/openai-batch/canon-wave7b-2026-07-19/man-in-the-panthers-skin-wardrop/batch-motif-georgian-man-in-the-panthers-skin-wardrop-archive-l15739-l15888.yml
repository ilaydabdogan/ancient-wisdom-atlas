canonical_text:
  quote: ''
  summary: 'An appendix renders the introductory quatrains: God creates the firmament,
    gives earth to humanity, and ordains kings; David Soslan and Queen T''hamara are
    praised with martial, solar, and jewel imagery; the poet says poetry should serve
    one beloved, asks for aid in composition, frames the tale as Persian material
    transferred into Georgian verse, and invokes the three heroes and fellow-sufferers
    of Tariel.'
