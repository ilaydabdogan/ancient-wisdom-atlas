  text: Avt'handil travels while thinking of T'hinat'hin, speaks of distance from
    her, and describes his grief as burning and envenoming the world for him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Avt'handil goes alone to the seashore with four slaves, seeking balm for Tariel,
    and weeps by day and night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Along the shore Avt'handil questions travellers for tidings of Nestan, described
