canonical_text:
  quote: ''
  summary: The passage closes one episode in which a sunlike woman is brought by ship
    and pursued, then describes the parting of sworn brothers. Avt'handil departs
    from P'hridon to seek Nestan-Daredjan, laments separation from T'hinat'hin, and
    travels to the seashore. After questioning travellers for many days, he meets
    distressed Bagdad merchants led by Usam. They report a survivor's warning about
    pirates who destroyed a caravan from Egypt. Avt'handil pledges to protect them,
    escorts them by sea, and encourages them when a pirate ship approaches.
  language: English
  quote_policy: summarized
