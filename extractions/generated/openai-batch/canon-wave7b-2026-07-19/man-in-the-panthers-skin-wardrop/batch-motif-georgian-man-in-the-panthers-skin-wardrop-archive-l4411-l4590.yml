canonical_text:
  quote: ''
  summary: Tariel gives Asmat'h gifts, sends an ultimatum to Khatavethi, is summoned
    through Asmat'h to see his silent beloved behind a curtain, laments love-sorrow
    after being dismissed, receives defiant replies from Khatavethi and Ramaz, and
    musters the Indian army.
  language: English
  quote_policy: summarized
