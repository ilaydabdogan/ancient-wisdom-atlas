canonical_text:
  quote: ''
  summary: Tariel answers the king by renouncing desire for the king's daughter while
    asserting his hereditary right to India. He then recounts learning from the wounded
    Asmat'h that, after the bridegroom was killed, the king swore to kill his sister
    Davar. Davar, warned of the oath, accused and beat Nestan-Daredjan, had her placed
    in a litter by two Kadj-like slaves and carried toward the sea, then killed herself
    with a knife.
  language: English
  quote_policy: summarized
