canonical_text:
  quote: ''
  summary: A war council considers a plan for one man to enter a guarded city in merchant
    guise and open the gate from within. Tariel proposes instead a three-pronged dawn
    assault so he is not seen inactive by the woman who maddens him. The heroes prepare,
    divide their men, reconnoiter at night, approach in disguise, then charge the
    gates with battle sounds. The narrator describes divine and celestial wrath against
    Kadjet'hi, many corpses, Tariel's terrifying voice, and the destruction of the
    city and castle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed first-person speaker says that all three should not enter, proposes
    to go alone as a merchant, secretly put on armour, deceive the defenders, and
    make blood flow inside.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker says he will remove the guards inside, break or shatter the
    locks, open the gate, and have the others strike outside the gate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tariel praises the counsel and heroism of the speaker but objects that the
    woman who maddens him will hear the sound, stand aloft like the sun, and see him
    as a non-combatant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tariel proposes dividing the men by hundreds and having the three heroes start
    from three places when night turns to dawn, urging on their horses and engaging
    the defenders quickly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: P'hridon jokes about a horse he had given away, saying he would not have given
    it if he had known they would need it while dealing with the Kadjis in Kadjet'hi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The heroes laugh, dismount, array themselves, mount excellent steeds, adopt
    Tariel's plan, divide the men by hundreds, and raise their helmets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator says the three heroes shine with rays exceeding the sun and are
    covered by the seven planets with a column of light; Tariel is seated on a black
    horse.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator compares their image to rain-fed streams pouring from mountains
    through glens and becoming calm when united with the sea.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: That night the three groups make a reconnaissance; at dawn they appear with
    shields, then go quietly in the guise of travellers while their helmets are covered.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The heroes suddenly spur their horses; the gates open, tumult comes from the
    city, the three move in different directions, and fifes, drums, and trumpets sound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator states that the wrath of God strikes Kadjet'hi, Cronos looks
    down in anger, the sweetness of the sun is removed, and the wheel and circle of
    heaven turn wrathfully toward the Kadjis.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fields cannot contain the corpses, and the army of the dead increases.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tariel's mighty voice makes unwounded men faint; armour and chain-mail fail;
    the gates are attacked on three sides; the attackers enter the city and begin
    destroying the castle.
  category: action
  evidence_refs:
  - ev:8
