canonical_text:
  quote: ''
  summary: Tariel arrives with P’hridon, honors the king, and petitions on behalf
    of Avt’handil, asking that the king give his daughter to him because they love
    each other. Tariel kneels in supplication with a handkerchief tied around his
    neck. The king is moved, consents to the marriage, states that Avt’handil is a
    worthy son-in-law and that the realm belongs to his daughter, and then receives
    Avt’handil when P’hridon brings him. The king comforts Avt’handil, embraces him,
    and promises to unite him with the daughter the next day.
  language: English
  quote_policy: summarized
