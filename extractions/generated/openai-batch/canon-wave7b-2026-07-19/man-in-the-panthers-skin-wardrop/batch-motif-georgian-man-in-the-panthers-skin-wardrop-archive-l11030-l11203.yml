canonical_text:
  quote: ''
  summary: Avt'handil secretly kills the youth identified by the section heading as
    Chachnagir, cuts off the ring-bearing finger, disposes of the body toward the
    sea, and returns to P'hatman with proof. P'hatman says her household is delivered
    and begins recounting a New Year court festival, a garden banquet by the sea,
    and the secret arrival of two black-clad men in a boat carrying a wondrous captive
    maiden in a chest.
  language: English
  quote_policy: summarized
