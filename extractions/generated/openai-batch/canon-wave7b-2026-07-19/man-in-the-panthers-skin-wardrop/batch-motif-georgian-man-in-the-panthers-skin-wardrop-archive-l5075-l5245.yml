  text: Ramaz thanks the king, bows in homage, repents his treachery, and departs
    with his people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The king summons Tariel after three months of separation and invites him to
    come out hunting.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The hall contains harriers and falcons, and the hunt ranges over plain, mountain-foot,
