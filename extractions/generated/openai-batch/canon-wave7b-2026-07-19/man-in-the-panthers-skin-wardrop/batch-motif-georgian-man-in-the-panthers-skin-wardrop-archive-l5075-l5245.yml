  quote: ''
  summary: Tariel recounts writing to the King of the Indians after defeating the
    Khatavians, returning with spoil and prisoners, receiving royal welcome, advising
    mercy toward the captive King Ramaz, joining a royal hunt, and being brought to
    see Nestan, the nominated royal maid, before the queen greets him as a son.
  language: English
  quote_policy: summarized
