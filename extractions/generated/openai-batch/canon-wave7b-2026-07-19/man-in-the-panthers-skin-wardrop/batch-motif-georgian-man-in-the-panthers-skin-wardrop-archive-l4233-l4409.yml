canonical_text:
  quote: ''
  summary: After being bled, the first-person narrator lies melancholy, receives messages
    connected with Asmat'h, attends court, a hunt, and a feast, then meets a veiled
    female messenger. Nestan-Daredjan's letter declares herself his, rebukes fainting,
    urges heroic action and battle against the Khatavians, and frames his despair
    as darkness turned to dawn. Tariel replies with celestial praise, says she has
    revived him from death, vows service, and accepts a secret plan conveyed by Asmat'h.
  language: English
  quote_policy: summarized
