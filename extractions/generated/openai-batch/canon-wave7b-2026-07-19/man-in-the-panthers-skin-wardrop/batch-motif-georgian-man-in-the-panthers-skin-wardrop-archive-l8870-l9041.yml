  quote: ''
  summary: Avt'handil persuades the grief-stricken Tariel to mount and ride, speaks
    consoling and admonitory words, questions him about an armlet belonging to the
    absent beloved, urges him to value Asmat'h as a living intermediary, and hears
    Tariel begin to recount seeing a lion and panther appear like lovers before fighting.
  language: English
