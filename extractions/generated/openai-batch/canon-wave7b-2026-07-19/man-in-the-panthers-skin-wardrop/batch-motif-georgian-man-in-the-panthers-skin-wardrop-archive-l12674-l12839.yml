  quote: ''
  summary: Nestan-Daredjan writes a tearful letter to her beloved. She laments separation
    by Fate, says she has been taken from sorcerers and delivered to the Kadjis, describes
    her confinement in a lofty guarded castle, refuses life without the beloved, imagines
    death or ascent with wings, asks him to help her father in India, and vows to
    suffer and die for his sake.
