canonical_text:
  quote: ''
  summary: A despairing lover, identified in the passage as Tariel, asks to be left
    to die and buried. A knight, later identified as Avt'handil, repeatedly counsels
    him against self-destruction, using maxims about endurance and images of the furnace,
    the thorned rose, and the sweet mixed with the bitter. Tariel rejects the counsel,
    describes himself as mad and near death, imagines reunion with his beloved beyond
    this life, speaks of his elements dissolving into the ranks of spirits, and asks
    his friends for burial. Avt'handil finally acknowledges that speech cannot move
    him and, in tears, makes one further request.
