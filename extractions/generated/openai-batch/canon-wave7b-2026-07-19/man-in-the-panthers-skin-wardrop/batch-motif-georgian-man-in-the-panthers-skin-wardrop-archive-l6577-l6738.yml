canonical_text:
  quote: ''
  summary: Tariel recounts leaving P’hridon to seek the lost Nestan, receiving a horse,
    parting tearfully, searching land and sea without news, withdrawing from human
    society, fighting Devis in caves, living among beasts, wearing a panther skin
    as Nestan’s image, longing for death, and then receiving counsel from Avt’handil
    not to abandon one another.
  language: English
