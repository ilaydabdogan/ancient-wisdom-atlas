canonical_text:
  quote: ''
  summary: Two companions spend a grief-stricken night by the seashore, then part
    at dawn with embraces, tears, and gestures of mourning. Avt’handil, separated
    from Tariel and grieving also for T’hinat’hin, laments Fate, appeals to God’s
    protection, compares T’hinat’hin to the sun, and invokes the sun, planets, moon,
    and stars as witnesses and messengers of his suffering.
  language: English
  quote_policy: summarized
