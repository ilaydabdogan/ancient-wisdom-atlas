canonical_text:
  quote: ''
  summary: P’hatman writes a love letter to Avt’handil, praising him with solar and
    floral imagery and asking for a response that will decide her life or death. Avt’handil
    reads the letter, rejects its love because his heart belongs to another beloved,
    and compares the proposed attachment to an unfitting raven-and-rose pairing. He
    then decides to feign consent because P’hatman receives many travellers and may
    help him find Nestan, the hidden beloved he seeks. He reflects on women in love
    revealing secrets and on fate, twilight, and the pitcher proverb.
  language: English
  quote_policy: summarized
