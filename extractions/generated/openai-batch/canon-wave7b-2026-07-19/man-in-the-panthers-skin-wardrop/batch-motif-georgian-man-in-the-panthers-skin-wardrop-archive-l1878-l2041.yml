canonical_text:
  quote: ''
  summary: A king's party sees a splendid stranger knight weeping by a stream, dressed
    in panther skin and holding a black horse. A slave cannot get his attention; the
    knight is absorbed in grief. The king sends armed slaves to bring him, but the
    stranger mounts, resists, kills or wounds pursuers, and then disappears without
    a trace while the king and Avt'handil pursue. The king interprets the event as
    divine reversal of his former happiness.
  language: English
  quote_policy: summarized
