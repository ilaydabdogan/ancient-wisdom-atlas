canonical_text:
  quote: ''
  summary: A first-person narrator recounts standing outside a curtained chamber,
    seeing the maiden Nestan when Asmat'h draws the curtain, handing over partridges,
    and then being overcome by burning lovesickness. He faints repeatedly, is tended
    by Asmat'h, the king, queen, mullahs, and doctors, prays to the Creator for endurance,
    briefly recovers enough to leave the palace, returns home worse, and receives
    a love-letter through Asmat'h's slave.
  language: English
  quote_policy: summarized
