  summary: After a report of grief and questing, T’hinat’hin rejoices and summons
    the knight. In a throne-room conversation, he says he has found the sought man,
    Tariel, and recounts Tariel’s suffering, wilderness wandering, cave dwelling,
    and care by a damsel. The knight vows to return and sacrifice himself for his
    friend, and T’hinat’hin approves his fidelity while fearing his absence.
