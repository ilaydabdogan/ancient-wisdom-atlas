  summary: The preface discusses Georgian phonetics, literary refinement, philosophical
    translation practice, Rust’haveli’s artistry, controversies about whether the
    epic came from a Persian tale or a pre-existing fable, the use of Persian names
    and words, theories about oral ballads concerning Tariel and Avt’handil, the queen’s
    elevation to the throne as a preface to the story, and the possible importance
    of keba, or eulogy, in the poem’s form.
  language: English
