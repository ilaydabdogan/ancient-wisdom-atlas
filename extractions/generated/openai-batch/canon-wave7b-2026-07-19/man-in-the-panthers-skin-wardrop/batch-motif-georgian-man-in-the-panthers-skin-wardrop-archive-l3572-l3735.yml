canonical_text:
  quote: "“But such is the law: lover pities lover.”"
  summary: Asmat'h brings Avt'handil to Tariel. The two knights greet one another
    with embraces and tears. Avt'handil explains that he is an Arabian lover sent
    by his beloved to seek news of Tariel, the vanished knight previously encountered
    in battle. Tariel recalls the encounter and explains his flight. The two exchange
    praise, and Avt'handil pledges to remain near Tariel, while Tariel identifies
    their bond through shared suffering in love.
