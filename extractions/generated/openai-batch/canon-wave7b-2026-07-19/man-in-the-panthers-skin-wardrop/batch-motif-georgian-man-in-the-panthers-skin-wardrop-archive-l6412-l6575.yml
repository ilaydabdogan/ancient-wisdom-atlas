canonical_text:
  quote: ''
  summary: P'hridon tells the first-person narrator how he once saw a swift covered
    boat at sea, carrying a radiant maiden attended by two black slaves. He tried
    to approach but she disappeared over the sea. The narrator, recognizing her as
    his beloved, is overcome with grief. P'hridon comforts him, offers hope in God's
    mercy, and arranges a maritime search through sailors and ports, but the seekers
    return without news.
  language: English
  quote_policy: summarized
