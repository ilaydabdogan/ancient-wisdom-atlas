  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king asks for T'hinat'hin, calls her his solace, jewel, and water of life,
    and says he will tell her why his joy has fled.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: T'hinat'hin comes to her father; he seats her beside him and kisses her tenderly,
