- id: obs:12
  text: The searchers wander for a year, repeatedly seek and inquire, find no one
    who has seen the youth, and return dissatisfied.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king concludes that he saw a hideous, unclean spirit sent as his foe,
