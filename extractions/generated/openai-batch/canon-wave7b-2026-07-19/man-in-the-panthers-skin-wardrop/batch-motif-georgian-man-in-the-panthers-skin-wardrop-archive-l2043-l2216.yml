canonical_text:
  quote: ''
  summary: After encountering a strange radiant knight, the king withdraws in grief.
    T'hinat'hin learns the cause, comes when summoned, and advises him to test whether
    the stranger was mortal by sending searchers everywhere. Men search for a year
    and find no one who has seen the youth. The king concludes the apparition was
    an unclean spirit, resumes rejoicing, and later T'hinat'hin sends a slave to summon
    Avt'handil.
  language: English
  quote_policy: summarized
