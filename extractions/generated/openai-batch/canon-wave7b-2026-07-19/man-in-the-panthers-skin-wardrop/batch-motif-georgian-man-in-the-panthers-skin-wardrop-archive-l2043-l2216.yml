  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king describes a beautiful and wondrous youth whose radiance lit the firmament
    and earth, and says the youth was afflicted and weeping.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king says the stranger mounted his horse, wiped away tears, destroyed
    the men sent to seize him, and disappeared, leaving the king unsure whether he
    was real or a vision.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: T'hinat'hin says that if the knight is flesh, others must have seen him, but
    if not, he is a devil who appeared to disturb the king's joy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: T'hinat'hin advises the king to send men everywhere with the story to learn
    whether the youth is mortal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The king sends men to the four corners of the heavens to search for the youth
