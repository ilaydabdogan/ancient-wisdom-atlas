canonical_text:
  quote: ''
  summary: The introductory quatrains invoke God as creator and source of kingship,
    ask divine aid against Satan and sin, praise T'hamara, describe the poet's task,
    and set out a doctrine of true love as constant, secret, suffering, and distinct
    from lust. Rust'haveli names himself, frames the tale as a Persian story rendered
    into Georgian verse, and presents the poem and tale through pearl, spear, fire,
    and bodily suffering imagery.
  language: English
  quote_policy: summarized
