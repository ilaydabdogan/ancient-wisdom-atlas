canonical_text:
  quote: Hereupon they swore
  summary: Avt’handil and Tariel exchange vows of loyalty and return. Tariel responds
    to Avt’handil’s affection, invokes God, and speaks in images of the nightingale
    and rose, the tree, and divine judgment. The friends swear, love each other, and
    spend the night together. At dawn Avt’handil departs in tears, leaving Tariel
    grieving. Asmat’h kneels, weeps, and begs Avt’handil to return soon; he promises
    not to forsake them and sets a two-month limit.
