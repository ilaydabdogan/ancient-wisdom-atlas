canonical_text:
  quote: ''
  summary: The first-person narrator prepares a military expedition while grieving
    separation from his beloved. A slave brings a letter from Asmat'h saying the beloved
    calls him. At twilight he enters a garden and house, where Asmat'h mediates his
    meeting with the radiant beloved. The beloved explains her earlier reserve, asks
    for his undivided heart, urges him to attack the Khatavians, and exchanges solemn
    oaths with him on a book of oaths. After a tearful departure, the narrator leads
    his army toward Khataet'hi. Ramaz, khan over Khataet'hi, sends a conciliatory
    envoy with treasures, asking mercy and offering oath-bound submission, possessions,
    castles, and cities.
  language: English
  quote_policy: summarized
