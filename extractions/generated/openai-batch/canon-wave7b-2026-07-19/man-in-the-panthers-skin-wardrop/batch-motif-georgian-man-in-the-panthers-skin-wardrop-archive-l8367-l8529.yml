canonical_text:
  quote: ''
  summary: A knight laments separation from his beloved, invokes the sun, stars, and
    moon while traveling, pauses by a stream and rocky place, reaches caves, and is
    greeted by Asmat'h. He asks about her lord and is distressed to hear that the
    lord has wandered away. Asmat'h explains the lord's extreme suffering and reports
    his vow not to break his promise but to wait, even if he is found dead.
  language: English
  quote_policy: summarized
