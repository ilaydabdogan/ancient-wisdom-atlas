canonical_text:
  quote: ''
  summary: Avt’handil meets P’hridon, identifies himself, and recounts his search
    for Tariel. He describes Tariel’s first appearance during King Rosten’s hunt,
    Tariel’s cave life with Asmat’h, Tariel’s grief for his beloved, and Avt’handil’s
    own departure to seek a remedy and find the woman described as a heavenly sun.
    P’hridon and the soldiers lament Tariel and praise him with solar and celestial
    imagery.
  language: English
  quote_policy: summarized
