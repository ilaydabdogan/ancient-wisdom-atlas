canonical_text:
  quote: ''
  summary: Tariel, Avt'handil, and Asmat'h give thanks and enter the caves. Tariel
    reveals that treasure remains from the Devis he slew; the companions open forty
    chambers, find treasure and a sealed coffer, and discover three exceptional suits
    of armour. They interpret the armour as a fortunate sign, take one set for P'hridon,
    and depart toward him. Tariel proposes a joking raid on P'hridon's horse herd;
    the herdsmen raise an alarm, P'hridon arms himself and rides out, and Tariel reveals
    himself by raising his helm.
  language: English
  quote_policy: summarized
