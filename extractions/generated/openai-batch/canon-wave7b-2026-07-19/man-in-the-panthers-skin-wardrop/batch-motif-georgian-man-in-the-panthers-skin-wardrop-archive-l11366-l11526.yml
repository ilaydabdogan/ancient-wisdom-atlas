canonical_text:
  quote: ''
  summary: A woman hides a radiant, grief-stricken maiden in her house, fears her
    husband Usen will reveal the secret at court, then makes him swear secrecy and
    shows him the maiden. Usen is overwhelmed by her beauty; together they try unsuccessfully
    to learn her identity and comfort her. Later Usen goes to the king with pearls
    and gems, drinks at the royal feast, forgets his oaths, and is questioned by the
    king about the source of the treasure.
  language: English
