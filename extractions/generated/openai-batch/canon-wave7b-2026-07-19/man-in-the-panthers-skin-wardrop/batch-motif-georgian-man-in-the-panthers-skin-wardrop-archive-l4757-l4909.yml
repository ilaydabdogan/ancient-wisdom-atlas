canonical_text:
  quote: "“Those who die for their kings, upwards their spirits fly!”"
  summary: Tariel recounts how his viziers advised caution before meeting King Ramaz
    or the khan. He travels with a selected force while the main army follows, receives
    gifts and friendly messages, and camps near a deep forest. A messenger secretly
    warns him of a planned ambush by hidden troops. Tariel keeps the warning secret,
    summons his army, accepts the risk under providence, observes signs of the approaching
    force from a peak, arms his men, exhorts them, forms squadrons, and prepares for
    combat.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The viziers advise the narrator to go forth only with brave heroes, have soldiers
    follow nearby, test the other side by oath to God and heaven, and punish non-submission
    with wrath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator accepts the viziers' advice, says he does not trust stone walls,
    takes three hundred brave knights, and leaves the rest of the army to follow and
    assist if called.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Messengers connected with the khan bring the narrator beautiful robes and
    later fair steeds, along with messages inviting a meeting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator reaches the bounds of a deep forest, pitches a felt tent without
    patrols, and receives the messengers amiably.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: One messenger secretly tells the narrator that he owes him a debt because
    he was partly brought up by the narrator's father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The secret messenger reports that the visitors are traitors and that large
    hidden troop bodies, described as one hundred thousand and thirty thousand, are
    waiting to overwhelm the narrator.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The reported plan includes a partial royal approach, concealed armor, cajoling,
    smoke made by soldiers, surrounding the narrator on all sides, and many attacking
    one.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator keeps the warning secret and sends men to order the armies to
    come quickly over mountain and hill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator tells the messengers he is coming to meet King Ramaz and reflects
    that if he is to be killed there is nowhere below to hide.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: From a peak, the narrator sees dust in the plain, interprets it as Ramaz's
