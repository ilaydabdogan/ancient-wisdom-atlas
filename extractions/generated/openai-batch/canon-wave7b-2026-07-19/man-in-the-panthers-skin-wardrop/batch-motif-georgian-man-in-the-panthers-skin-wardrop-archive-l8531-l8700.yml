canonical_text:
  quote: I go, I will seek, either shall I find him or bring death early upon me
  summary: A grieving knight explains that he left home, beloved, and patron to seek
    an absent friend. After counsel to seek the friend, he travels through difficult
    terrain, complains to God and Fate, searches for three days, sees a black horse
    near rushes, and finds Tariel near death beside a slain lion, a blood-smeared
    sword, and a slain panther. He wipes Tariel's tears, calls him by name, and restores
    him to recognition and brotherly embrace.
  language: English
  quote_policy: quoted
