canonical_text:
  quote: "“they saw the moon (i.e., Tariel) come forth from the water”"
  summary: Avt'handil appeals to Asmat'h for help in gaining knowledge from Tariel.
    Asmat'h identifies Tariel and herself, hides Avt'handil in the cave, and receives
    the grieving Tariel. Tariel weeps, refuses food, wakes in terror, reports avoiding
    a hunting king, and declares himself beyond remedy. Asmat'h counsels him against
    extremes and asks whether he would spare a willing companion who might come to
    him.
