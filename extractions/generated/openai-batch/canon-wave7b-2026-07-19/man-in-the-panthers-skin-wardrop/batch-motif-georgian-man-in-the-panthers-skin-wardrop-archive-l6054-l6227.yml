canonical_text:
  quote: ''
  summary: Tariel responds to grief and disastrous tidings by refusing death and vowing
    to seek Nestan wherever he can. He arms himself, leaves with knights, searches
    by sea for a year without news, loses or is separated from most attendants, and
    lands by night near gardens, hollowed rocks, and trees. On the seashore he encounters
    a wounded mounted knight, has him treated, and learns that the knight is Nuradin
    P'hridon, king of Mulghazanzari, who was wounded by hostile kinsmen in a dispute
    over an island share and hunting rights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A weeping woman says she remains alive and unpierced, asks to be delivered
    from unbearable life, and continues to shed tears.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tariel refuses to kill the woman addressed as sister and says he will seek
    the absent woman wherever rock and water are found.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tariel describes horror, fever, and trembling, then tells himself not to die
    but to roam and seek the woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tariel quickly arrays himself, mounts his horse, leaves the gates with one
    hundred and sixty knights in battle order, reaches the seashore, and sees a ship
    and skipper.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tariel enters the ship, cruises the sea, watches passing ships, and after
    a year finds no one who has seen the sought woman; his attendants die or perish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tariel comes ashore weary; his remaining followers are scattered, while Asmat'h
    and two slaves remain with him as comforters and counsellors, and he still has
    no news of Nestan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night Tariel lands near gardens and what seems to be a city; on one side
    are hollowed rocks, and he rests and sleeps beneath lofty trees while slaves break
    bread.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tariel hears a shout and sees a wounded knight galloping along the seashore
    on a black steed, with broken soiled sword and flowing blood, angrily threatening
    his foes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tariel sends a slave to call the wounded knight, then rides after him, asks
    him to stop and explain his affair, and the knight checks his course.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wounded knight says enemies he had considered weak attacked him traitorously
    while he was unready and unable to put on armor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tariel leads the wounded knight to the foot of the trees, and a surgeon among
    Tariel's slaves binds the wounds and removes arrowheads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wounded knight identifies himself as Nuradin P'hridon, king of the nearby
    city of Mulghazanzari, and says the place where Tariel is stationed is his boundary.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: P'hridon says his grandfather divided territory, an island in the sea was
