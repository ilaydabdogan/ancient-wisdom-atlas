canonical_text:
  quote: "“The sovereign of the Kadjis has that sun; she is captive in Kadjet’hi.”"
  summary: A woman sends a veil-token with a letter to her beloved. Avthandil receives
    news, thanks God, prepares to go toward Kadjet’hi, and sends P’hridon a letter
    requesting brotherly aid. The letter reports that the woman called a sun is captive
    under the sovereign of the Kadjis. Avthandil rewards messengers with treasure,
    prepares a ship, and departs while P’hatman, Usen, and others lament.
  language: English
  quote_policy: quoted
