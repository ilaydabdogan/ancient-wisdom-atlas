  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator's soldiers, who had not initially accompanied him, travel day
    and night, arrive, beat the kettledrum, and sound the trumpet.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The enemy flees; the narrator and his forces pursue, the narrator unhorses
    King Ramaz, and all Ramaz's armies are captured but not slain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The rearguard overtakes fleeing enemies, prisoners wail, the narrator rests
    on the battlefield, treats an arm wound as a slight scratch, and receives praise
    from his armies.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:11
  text: Soldiers are sent to gather booty; the narrator says he has dyed the plain
    with the blood of those who sought to slay him and has seized cities without battle
    at their gates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The narrator confronts Ramaz about treachery; Ramaz says he has no power left
