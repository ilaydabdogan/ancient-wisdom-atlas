canonical_text:
  quote: ''
  summary: A first-person warrior-narrator challenges enemies who have plotted against
    him, meets their ambush in battle, breaks their ranks, and is later reinforced
    by his own troops. The enemy flees; King Ramaz is unhorsed and captured, and the
    narrator takes armies, fortresses, cities, booty, and treasuries while sparing
    captives. He settles Khataet'hi, receives treasury keys, finds a marvellous mantle
    and veil described as a divine miracle, reserves them for a radiant woman, and
    sends rich gifts to a king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The warrior-narrator sends a message that he knows the opponent's plans, says
    they will not succeed, and calls for combat according to law and custom while
    holding a sword.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enemy makes smoke for the soldiers, reveals what had been hidden, comes
    out of ambush, advances from both sides, and forms many ranks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The warrior-narrator takes a lance, arms or helmets himself, extends his line,
    and advances toward innumerable enemy cohorts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When he reaches the main body of the army, the narrator pierces a man with
    his lance, overturns the man's horse, breaks the lance, and takes up the sword.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator compares his attack to a falcon among grey partridges and says
    he made a hill of men and horses and destroyed the two front squadrons in one
    onslaught.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The enemy crowds around the narrator, but he says that those he strikes cannot
    stand, blood spurts out, and enemies flee from or avoid him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A watchman cries from a summit that the enemy should not stand longer, warning
