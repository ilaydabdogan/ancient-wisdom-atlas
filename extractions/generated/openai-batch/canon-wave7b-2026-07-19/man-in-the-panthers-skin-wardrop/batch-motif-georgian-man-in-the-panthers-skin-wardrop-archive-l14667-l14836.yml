canonical_text:
  quote: ''
  summary: The travelling companions reach Tariel’s former cave, where Asmat’h hosts
    them. They find and distribute abundant treasure; Tariel offers the treasure to
    P’hridon in repayment. The party then travels toward Arabia, where Avt’handil
    longs for T’hinat’hin. Tariel sends a message to King Rosten asking pardon and
    announcing Avt’handil’s return. The Arabian court rejoices and comes to meet them,
    while Avt’handil remains ashamed to face his foster-father; Tariel goes ahead
    to mediate.
  language: English
  quote_policy: summarized
