canonical_text:
  quote: ''
  summary: Tariel finishes recounting an episode in which he killed a lion and a panther,
    connects it to his grief for his beloved, and weeps. Avt'handil consoles him.
    The two return to the cave, where Asmat'h greets them with tears and prayer. The
    companions lament absent beloveds through images of fire, water, sun, rose, pearl,
    and stone; they share a sparse meal, converse through the night, recall their
    oath, and Tariel urges Avt'handil to return to his own beloved.
  language: English
  quote_policy: summarized
