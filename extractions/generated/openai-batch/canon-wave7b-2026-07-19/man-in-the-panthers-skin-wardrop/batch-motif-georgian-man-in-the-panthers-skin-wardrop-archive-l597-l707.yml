canonical_text:
  quote: ''
  summary: The preface describes the English translator’s aim of fidelity, the long
    preparation and revision of the translation, the difficulty of the corrupt and
    under-edited Georgian text, other reported translations or paraphrases, acknowledgments
    to scholarly helpers, and a memorial account of the translator’s Georgian studies,
    travels, character, and legacy.
  language: English
  quote_policy: summarized
