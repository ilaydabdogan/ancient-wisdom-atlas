canonical_text:
  quote: ''
  summary: A departing knight gives Shermadin charge over household, troops, and frontier
    defense, refuses to let him accompany the journey, and writes a testament to King
    Rostevan explaining that he has stolen away in quest of an indispensable beloved
    friend. The testament justifies the departure through loyalty, love, philosophical
    and apostolic teaching, and trust in divine providence.
  language: English
  quote_policy: summarized
