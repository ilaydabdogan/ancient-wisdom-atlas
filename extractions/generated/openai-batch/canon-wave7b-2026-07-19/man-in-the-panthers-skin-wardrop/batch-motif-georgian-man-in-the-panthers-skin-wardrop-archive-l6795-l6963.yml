canonical_text:
  quote: ''
  summary: Avt’handil returns after leaving Tariel, is received by Shermadin, the
    king, T’hinat’hin, and the court, and recounts his search, trials, and what he
    learned about Tariel, including Tariel’s cave dwelling, panther-skin clothing,
    attendant, and consuming grief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After leaving, Avt’handil is described as overcome by sadness, wounding himself
    until beasts lick his blood, while he travels swiftly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avt’handil returns to the place where he had parted from his armies; they
    recognize him and rejoice, and men run to tell Shermadin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shermadin meets Avt’handil with embraces, kisses, tears, and a statement of
    wonder that he sees him safe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Avt’handil greets Shermadin and thanks God that no grief afflicts him; magnates
    do homage and rejoice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A city assembly comes to see Avt’handil, and he sits at a feast.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Avt’handil tells Shermadin what he has seen, including that he found a knight
    whom he likens to the sun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shermadin reports that no one knows of Avt’handil’s departure and says he
    has carried out Avt’handil’s instructions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shermadin goes ahead to announce Avt’handil’s arrival, and Avt’handil sends
    the king a message that he has learned about the knight and comes in safety.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rostevan receives the report that Avt’handil has found the knight and says
    he now knows what he had prayed to God for.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shermadin reports Avt’handil’s coming to T’hinat’hin, who is described with
