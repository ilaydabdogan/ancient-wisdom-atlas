  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king goes to meet Avt’handil; Avt’handil alights, does homage, and enters
    the royal hall amid rejoicing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Avt’handil does homage to T’hinat’hin, who is described as the sun of suns
    and as too splendid for a mere dwelling-house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The court holds a feast, gives gifts including pearls, and afterward the king
    asks Avt’handil to tell of his trials and the stranger.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Avt’handil says that when he speaks of the stranger he continually laments
