canonical_text:
  quote: ''
  summary: A knight completes a testament to the king, affirms loyalty and courage,
    reflects on unavoidable death, orders wealth distributed to the poor, slaves,
    orphans, orphan homes, and bridges, commends Shermadin, prays to God for aid on
    a perilous road and preservation of love, secretly rides out through the gates,
    while Shermadin laments and Rostevan angrily summons the vizier.
  language: English
  quote_policy: summarized
