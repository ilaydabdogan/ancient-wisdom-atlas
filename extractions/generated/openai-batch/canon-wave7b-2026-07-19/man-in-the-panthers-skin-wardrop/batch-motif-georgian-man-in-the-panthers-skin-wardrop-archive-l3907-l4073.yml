canonical_text:
  quote: ''
  summary: Tariel recounts Nestan-Daredjan’s birth celebration, shared royal upbringing,
    her beauty and seclusion in a jeweled residence, his own martial youth, his father’s
    death and succession to office, and the beginning of the episode in which he first
    approaches the maiden and experiences love as burning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the birth festivities, kings arrive from many places with gifts, and treasure
    is distributed to soldiers and others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tariel and the maiden are reared together, and the king and queen love and
    regard them alike.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tariel swoons when trying to say the maiden’s name; Avt’handil weeps, and
    an attending maiden revives Tariel by sprinkling water on his breast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden is named Nestan-Daredjan and is described at seven years old as
    gentle, moonlike, and exceptionally beautiful.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king regards the maiden as heir to the kingship, returns Tariel to his
    father, and Tariel describes youthful martial and sporting feats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king builds a jeweled dwelling for the maiden, with a small garden and
    a fountain of rose-water for bathing.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden’s residence includes incense, a tower, shaded garden access, cloth-of-gold
    curtains, attendants, and backgammon; Davar is given charge of the child to teach
    wisdom.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: At fifteen, Tariel is raised as the king’s son and praised for archery, the
    lists, hunting, ball-play, and feasting.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tariel’s father dies, and Tariel mourns in darkness for a year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king orders Tariel to stop wearing black mourning clothes, gives him his
    father’s lordship, and appoints him Amirbar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After a hunt, the king takes Tariel by the hand and proposes that they go
    see his daughter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The garden is described with birds, rose-water fountains, and gold curtains;
    Tariel carries wood-partridges to the maiden and describes the approach as going
    to burn himself at a flame.
  category: setting
  evidence_refs:
  - ev:7
