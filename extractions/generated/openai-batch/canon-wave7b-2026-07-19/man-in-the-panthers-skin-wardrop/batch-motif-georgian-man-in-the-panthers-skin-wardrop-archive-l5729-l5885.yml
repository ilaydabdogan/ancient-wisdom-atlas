canonical_text:
  quote: "“I could never let India be food for the Persians; it is mine own heritage”"
  summary: A royal woman advises the narrator to kill the Khvarazmian bridegroom and
    frame the act as defense of India as her heritage rather than as a love claim.
    Wedding preparations proceed with treasure distribution and red satin tents. After
    a summons and rebuke from the woman, the narrator secretly goes with servants
    to the bridegroom’s tent, kills him, flees pursuit, and reaches a strong city.
    The king later sends lords to accuse him of betraying foster-sonship and bringing
    innocent blood upon the royal house.
  language: English
  quote_policy: quoted
