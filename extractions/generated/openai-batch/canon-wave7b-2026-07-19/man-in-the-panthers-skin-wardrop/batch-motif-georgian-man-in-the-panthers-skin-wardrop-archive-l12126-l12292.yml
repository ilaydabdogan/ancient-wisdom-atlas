canonical_text:
  quote: ''
  summary: A report describes a hostile, weeping captive damsel being taken to Kadjet'hi
    as a gift for Queen Dulardukht. Avt'handil hears the report, recognizes signs
    of the woman, sends invisible sorcerous slaves for news, and learns that the queen
    has taken the captive, betrothed her to the boy Rosan, and set her in a castle.
    P'hatman explains that the Kadjis are not fleshless beings but human sorcerers
    in a fortified rock-city, able to blind foes and manipulate wind, sea, water,
    day, and darkness.
  language: English
  quote_policy: summarized
