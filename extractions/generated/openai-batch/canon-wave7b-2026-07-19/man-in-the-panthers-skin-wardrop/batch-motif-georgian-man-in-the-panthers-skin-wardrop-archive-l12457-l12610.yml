canonical_text:
  quote: ''
  summary: P’hatman sends a sorcerer slave with a letter to Nestan-Daredjan in Kadjet’hi.
    The letter tells Nestan that Tariel suffers for her, that Avt’handil has come
    in quest of her, and asks for intelligence about Kadjet’hi and a token for her
    lover. The sorcerer dons a green mantle, becomes unseen, flies to Kadjet’hi, passes
    the guarded gates, and gives the letter to the frightened maiden. Nestan reads
    it with tears, asks who seeks her, hears that a heroic knight has come, and agrees
    to write back.
  language: English
  quote_policy: summarized
