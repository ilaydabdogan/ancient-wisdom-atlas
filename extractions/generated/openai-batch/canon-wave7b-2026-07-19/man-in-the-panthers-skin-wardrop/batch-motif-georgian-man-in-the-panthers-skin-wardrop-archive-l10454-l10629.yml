canonical_text:
  quote: ''
  summary: Avt'handil travels by sea with a caravan to Gulansharo, a flower-girt city
    in the Sea Realm. He conceals himself as a caravan chief, questions a gardener
    about local rule, commerce, and hospitality customs, and is received by P'hatman,
    wife of the chief merchant Usen. His radiant appearance draws public admiration
    and desire.
  language: English
  quote_policy: summarized
