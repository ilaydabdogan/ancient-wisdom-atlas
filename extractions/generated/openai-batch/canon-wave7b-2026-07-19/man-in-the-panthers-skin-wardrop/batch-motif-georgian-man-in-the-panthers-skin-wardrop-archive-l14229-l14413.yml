canonical_text:
  quote: "“They made the wedding”"
  summary: Nestan-Daredjan is carried in a palanquin as the party travels along the
    coast to P’hridon/Nuradin’s land. Asmat’h joyfully reunites with Nestan; Nestan
    thanks her and God. P’hridon’s magnates give homage and praise God, while Tariel
    mourns those who died for him and speaks of their eternal joy. The group enters
    Mulghazanzar with music, crowds, palace hospitality, gold, and rich textiles.
    P’hridon seats the couple and Avt’handil on jeweled thrones and holds the wedding
    of Tariel and Nestan.
