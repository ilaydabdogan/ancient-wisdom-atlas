canonical_text:
  quote: ''
  summary: Usen praises the king and reports the finding of a radiant maid as a proposed
    bride for the king's son. The king orders her brought to court. Royal slaves come
    to P'hatman's house and demand the maid. P'hatman tells the weeping maid, gives
    her jewels, and hands her to the slaves. The maid is brought publicly before the
    king, who marvels at her beauty, seats her beside him, and questions her. She
    remains sorrowful and silent, and the king wonders whether she is in love with
    someone or is a lofty sage.
  language: English
  quote_policy: summarized
