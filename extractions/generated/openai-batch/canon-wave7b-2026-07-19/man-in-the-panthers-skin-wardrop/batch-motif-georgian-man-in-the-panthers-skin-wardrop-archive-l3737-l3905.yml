canonical_text:
  quote: "“If I speak of it, hot fire will burn me; I shall become a flame, a smoke.”"
  summary: 'Tariel tells Avt''handil and Asmat''h that speaking of his wandering and
    grief may overwhelm him. He asks Asmat''h to revive or bury him if needed, laments
    his lost beloved, and begins recounting his lineage: India has seven kings; P''harsadan
    rules six kingdoms, while Tariel''s father Saridan rules the seventh. Saridan
    enters P''harsadan''s service and is honored. The childless king and queen foster
    Tariel as their son and raise him for royal command; later the queen bears a daughter,
    identified by Tariel as the beloved whose memory burns him.'
  language: English
  quote_policy: quoted
