  text: The father counsels mercy toward both great and small, using images of the
    sun shining on roses and middens and seas returning floods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father says munificence in kings is like an aloe planted in Eden and states
    that what one gives away is retained while what one keeps is lost.
