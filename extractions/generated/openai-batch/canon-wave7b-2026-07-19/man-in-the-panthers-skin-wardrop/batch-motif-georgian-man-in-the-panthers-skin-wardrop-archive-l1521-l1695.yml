canonical_text:
  quote: ''
  summary: A king teaches his daughter that mercy and generosity should be shown to
    both great and small. The daughter listens and gives away her treasure and animals
    without measure. At a banquet the king appears sad; Avt'handil and the vizier
    Sograt approach him and ask why. The king says he is troubled by old age, lack
    of a son, and the absence of a man trained in his knightly arts, though Avt'handil
    somewhat resembles him. Avt'handil asks leave to speak and warns the king not
    to boast of his archery.
  language: English
  quote_policy: summarized
