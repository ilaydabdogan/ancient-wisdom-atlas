canonical_text:
  quote: ''
  summary: 'The passage closes the romance: Asmat''h is rewarded with rule over part
    of Indis; the three sworn companions exchange farewells and gifts; Avt''handil
    returns to Arabia, rejoins T''hinat''hin, and receives royal sovereignty; the
    allied rulers establish just and peaceful kingdoms; the narrator reflects on time
    and dedicates the versified tale to the Georgian sovereign.'
  language: English
  quote_policy: summarized
