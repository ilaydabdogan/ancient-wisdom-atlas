canonical_text:
  quote: ''
  summary: A knight urges a king to meet a radiant lady. The king and Tariel go to
    meet her, praise her beauty as sun-like, and return to the royal dwelling. There
    T'hinat'hin receives Tariel and his wife. Avt'handil is seated beside T'hinat'hin,
    blessed by the king, publicly acknowledged as king by divine will, and accepted
    by the armies and magnates. Tariel affirms the couple's union and his protective
    kinship with them.
  language: English
  quote_policy: summarized
