canonical_text:
  quote: ''
  summary: Avt’handil follows a sorrowful panther-skin-clad knight to a cave among
    rocks, streams, rushes, and tall trees. At the cave, a black-clad maiden named
    Asmat’h and the knight mourn an absent woman. The next morning Asmat’h prepares
    the knight’s horse and armor, and he departs. Avt’handil then seizes Asmat’h to
    learn the knight’s story, but she resists and refuses to tell it.
  language: English
  quote_policy: summarized
