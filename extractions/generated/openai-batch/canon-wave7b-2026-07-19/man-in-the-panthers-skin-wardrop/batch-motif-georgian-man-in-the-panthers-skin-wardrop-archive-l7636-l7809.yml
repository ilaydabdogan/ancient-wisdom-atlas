  summary: A king reacts violently to a vizier’s report concerning Avt'handil’s desire
    to depart. The disgraced vizier reports the king’s anger to Avt'handil. Avt'handil
    insists he cannot remain without Tariel, vows to seek leave once more or steal
    away, and later instructs Shermadin about friendship, loyalty, and the necessity
    of secret departure.
