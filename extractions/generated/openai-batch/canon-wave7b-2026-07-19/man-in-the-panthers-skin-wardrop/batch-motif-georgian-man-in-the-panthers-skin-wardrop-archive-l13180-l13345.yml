canonical_text:
  quote: Good hath overcome ill; the essence of (good) is lasting.
  summary: Tariel blames himself for hasty action and lies unconscious. Avt'handil
    searches for water, finds lion's blood, sprinkles it on Tariel's breast, and Tariel
    revives. Avt'handil urges him to stop weeping and to set out toward Kadjet'hi
    in quest of the lost beloved. Tariel thanks Avt'handil and invokes God to repay
    him. They return to the cave rejoicing, where Asmat'h is startled to see Tariel
    singing instead of weeping. They announce that God's mercy has come, the lost
    moon has been found, and sorrows have turned to joy. Avt'handil gives Asmat'h
    the beloved's letter; she recognizes the hand, trembles in wonder, and is reassured
    that the news is true.
  language: English
  quote_policy: quoted
