canonical_text:
  quote: ''
  summary: Avt'handil counsels Tariel to endure grief and trust that God can heal
    and reunite separated lovers. He explains that he received leave from his own
    beloved to aid Tariel, asks for a year and a week to gather news, sets the cave
    and the blooming of roses as signs for his return, and says Tariel should presume
    him dead if he does not return. Tariel accepts the plan. The friends part tearfully,
    Asmat'h laments their departure from the caves, and Avt'handil asks directions
    to P'hridon, Tariel's sworn brother, as a source of tidings about the beautiful
    sun.
  language: English
  quote_policy: summarized
