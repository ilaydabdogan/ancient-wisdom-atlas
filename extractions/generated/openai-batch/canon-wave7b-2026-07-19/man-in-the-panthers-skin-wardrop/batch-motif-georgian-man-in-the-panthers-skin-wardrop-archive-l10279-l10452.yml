canonical_text:
  quote: ''
  summary: Avt'handil tells the merchants to shut themselves in while he fights alone.
    Armed with armor, mace, and sword at the front of the ship, he defeats the corsair
    crew, casting some into the sea and sparing or enslaving those who beg. The narrator
    and speakers frame the victory as dependent on God rather than human strength.
    The caravan praises Avt'handil and thanks God. Avt'handil gives the captured ship
    and treasure to the merchants, refuses reward, and asks them to keep his identity
    secret while he dresses and trades as a merchant.
  language: English
  quote_policy: summarized
