canonical_text:
  quote: ''
  summary: At the court of the King of the Seas, Tariel, Nestan-Daredjan, Avt’handil,
    and P’hridon are received with honor. P’hatman rejoices over Nestan-Daredjan,
    a great wedding is celebrated, and gifts of jewels, garments, a crown, a throne,
    horses, and treasure are distributed. Tariel adopts P’hatman as his sister and
    gives her Kadji treasure. The party requests a ship, departs amid tears, crosses
    the sea, renews sworn brotherhood, and sends a messenger with good tidings to
    Asmat’h and P’hridon’s households.
  language: English
  quote_policy: summarized
