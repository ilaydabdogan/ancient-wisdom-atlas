canonical_text:
  quote: ''
  summary: Avt’handil travels beyond Arab lands into foreign regions while grieving
    separation from his beloved. He searches for the absent man, asks for tidings,
    crosses strange and deserted places, and reaches a wilderness of mountain, plain,
    river, and forest. After finding no news, he debates whether to return or continue,
    invokes God and fate, and finally turns back through river, woods, and plain.
  language: English
  quote_policy: summarized
