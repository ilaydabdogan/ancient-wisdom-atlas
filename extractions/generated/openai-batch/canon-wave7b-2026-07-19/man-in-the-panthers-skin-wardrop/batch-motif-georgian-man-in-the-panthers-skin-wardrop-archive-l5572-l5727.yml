canonical_text:
  quote: ''
  summary: A first-person knight recounts a confrontation with a woman who accuses
    him of treachery and broken oath because he consented at council to Khvarazmsha
    being brought to wed her. He defends himself before an open Koran, invoking divine
    punishment if he lies, and explains that the rulers had already arranged the marriage.
    She softens, speaks of joint sovereignty over India, then reasons through the
    danger of civil conflict, foreign sway, and separation. The passage ends with
    a plan that the rival bridegroom should be killed stealthily while his armies
    and innocent blood are spared.
  language: English
  quote_policy: summarized
