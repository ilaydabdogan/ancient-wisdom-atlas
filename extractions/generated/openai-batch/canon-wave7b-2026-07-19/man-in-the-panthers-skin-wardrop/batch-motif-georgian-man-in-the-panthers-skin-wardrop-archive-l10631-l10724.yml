  summary: Avt’handil, appearing as a merchant rather than in his proper knightly
    dress, accepts P’hatman’s hospitality, gives gifts, displays wares, sets aside
    the finest for the king, and orders merchants not to reveal his identity. P’hatman
    becomes increasingly enamoured of him, experiences love as burning and tearful
    suffering, debates whether to confess it, and finally writes a piteous letter
    revealing her love.
