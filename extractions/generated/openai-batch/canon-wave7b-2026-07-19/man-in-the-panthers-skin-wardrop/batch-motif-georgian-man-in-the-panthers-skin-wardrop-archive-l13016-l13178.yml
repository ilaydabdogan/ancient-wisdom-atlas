canonical_text:
  quote: ''
  summary: Avt’handil leaves Gulansharo, crosses the sea, and rides alone toward Tariel.
    In summer weather he addresses the rose while thinking of T’hinat’hin, then travels
    through pathless regions to Tariel’s caves. He finds Tariel near the rushes after
    Tariel has slain a lion. The two sworn brothers embrace. Avt’handil produces a
    veil and letter belonging to Tariel’s absent beloved; Tariel recognizes them,
    presses them to his face, and falls lifeless. Avt’handil mourns, tries to help
    him, and blames himself for showing the tokens too suddenly.
  language: English
  quote_policy: summarized
