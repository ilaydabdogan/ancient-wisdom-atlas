canonical_text:
  quote: ''
  summary: Avt’handil meets the mournful maiden alone. She recalls the weeping stranger
    seen after the hunt with Rostan and asks Avt’handil to search for him, even to
    the bounds of the earth and sky, for three years. She links the service to Avt’handil’s
    knightly status and his love for her, vows not to marry another, and exchanges
    an oath with him. Avt’handil accepts the command, they converse joyfully, and
    he departs in grief at separation.
  language: English
  quote_policy: summarized
