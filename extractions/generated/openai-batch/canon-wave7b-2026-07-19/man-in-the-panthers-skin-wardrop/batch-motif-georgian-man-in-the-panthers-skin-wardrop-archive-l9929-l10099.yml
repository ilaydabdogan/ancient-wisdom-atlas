canonical_text:
  quote: ''
  summary: P'hridon laments separation and hosts Avt'handil in an adorned palace with
    courtly banquet, garments, hunting, and gifts. Avt'handil declares he must depart
    on an urgent road connected with the seashore where P'hridon saw Nestan. P'hridon
    equips him with attendants, armour, animals, bedding, gold, and a stallion. The
    city grieves at Avt'handil's departure, and the party reaches the seashore, where
    P'hridon recounts the story of the shining captive.
  language: English
  quote_policy: summarized
