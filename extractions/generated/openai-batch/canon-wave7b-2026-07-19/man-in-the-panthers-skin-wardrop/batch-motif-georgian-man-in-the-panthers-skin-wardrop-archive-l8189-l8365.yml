canonical_text:
  quote: ''
  summary: The king receives and rejects the vizier's report, then learns that Avt'handil
    has secretly departed alone. The king, slaves, courtiers, and magnates lament
    him as an absent sun and mourn with tears, torn hair, and torn beards. Shermadin
    brings Avt'handil's written testament, and the king orders public mourning, charity
    to the vulnerable, and prayers that God give Avt'handil peaceful paths. Introductory
    quatrains then frame absence through sun, moon, and rose imagery, and the knight
    rides away weeping, looking back, praying to find his sun-like beloved, and losing
    awareness of where his horse carries him.
  language: English
  quote_policy: summarized
