canonical_text:
  quote: ''
  summary: 'Tariel recounts sitting opposite his beloved at a royal feast, exchanging
    only hidden looks with her. Later, in his chamber, Asmat''h arrives as messenger
    with Nestan-Daredjan''s letter and love-token instructions involving veils and
    a bracelet. Tariel''s recollection of the armlet overwhelms him: he kisses it,
    falls corpse-like, and is revived by Asmat''h with water while Avt''handil witnesses
    his grief.'
  language: English
  quote_policy: summarized
