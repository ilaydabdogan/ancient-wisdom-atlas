canonical_text:
  quote: ''
  summary: Avt'handil confronts a maiden who refuses to disclose what she knows. After
    pleading fails, he threatens her with violence, but she continues to resist and
    says death would release her from grief. He releases her, weeps, apologizes, and
    appeals as a lover. The maiden softens, recognizes love as his aid, promises help
    if he obeys her, and Avt'handil answers with a brief parable about a man fallen
    into a well who cannot flee while his companion goes for ropes.
  language: English
  quote_policy: summarized
