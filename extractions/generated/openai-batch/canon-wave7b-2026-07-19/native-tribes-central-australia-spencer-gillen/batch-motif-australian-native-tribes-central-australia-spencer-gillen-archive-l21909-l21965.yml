canonical_text:
  quote: ''
  summary: 'The passage describes traditions about the Iriintarinia: they may take
    wounded game that disappears, seize women who wander after dark and confine them
    in caves, attack travelers, possess and sometimes give Churinga, communicate with
    some men and medicine men, impart sacred ceremonies, and have totems like the
    men whose doubles they are said to be.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter who loses the track of a speared but living kangaroo is said to know
    that the Iriintarinia have taken it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tradition says that Iriintarinia have carried off women who wandered too far
    from camp after dark and may imprison them in the depth of a cave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Undoolya, a husband heard his wife's cries and arrived while Iriintarinia
    had seized her and were dragging her away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A party traveling south from the Macdonnell Ranges was said to have been met
    near the Edith Range by many Iriintarinia and driven back with great slaughter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Iriintarinia are supposed to possess Churinga made of wood and stone and
    sometimes present one or two to specially favoured individuals.
