  summary: The passage describes Central Australian steppe and desert country, emphasizing
    scarce water, rock holes, rare native wells, salt plains, subsistence by hunting
    and gathering, distinct tribal dialects and country affiliation, and the disruptive
    effects of white settlement on customs and tradition transmission. A footnote
    notes practiced Aboriginal methods of obtaining water from tree roots.
  language: English
