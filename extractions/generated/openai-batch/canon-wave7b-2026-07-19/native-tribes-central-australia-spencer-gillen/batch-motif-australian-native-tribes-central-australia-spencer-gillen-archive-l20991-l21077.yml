canonical_text:
  quote: ''
  summary: 'A returned Atninga avenging party performs arrival and corroboree ceremonies:
    body painting with charcoal and twigs, shield movements and dancing against the
    dead man''s spirit, shield-striking whose sound diagnoses danger from magic, post-expedition
    silence followed by permission to speak, and a belief that the dead man''s spirit
    follows in the form of a small bird.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Alknalarinika are described as those who acted as decoys and took a passive
    part, with the name glossed as “onlookers.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Travelling back to Arunta country, the Atninga party separated into contingents,
    each returning to its own locality.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Alice Springs contingent halted away from the main camp, painted their
    bodies with powdered charcoal, and placed small Eremophila twigs on their foreheads
    and through the nose septum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On coming into sight of the main camp, the contingent performed an excited
    war-dance in square formation, moving shields as if warding off something thrown
    at them; the action was intended to beat off the Ulthana, the spirit of the dead
    man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Immirinja men led, separated from the others, formed a single extended
    line, held spears at rest and shields in front with the convex side outward, and
    remained silent and still.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Alknalarinika formed an irregular square behind the Immirinja and shouted
    out the result of the expedition.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old women approached with fighting clubs, performed an exulting skipping movement,
    and struck each Immirinja shield; men who had not gone on the expedition then
    struck the shields with boomerangs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The shield-striking ceremony was called ilquita atuma, and listeners interpreted
    a hollow shield sound as indicating malignant influence and likely death, while
    a firm strong sound indicated safety from magic.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the first shield-striking, the women and children returned to camp and
    the Atninga party went silently to the corroboree ground, with Immirinja in front
    and Alknalarinika behind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the corroboree ground, the Immirinja performed in pairs, running around
    the gathering with exaggerated knee action and imitating attitudes of attack and
    defence before having their shields struck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The paired performance and shield-striking were said to be effective for frightening
    the Ulthana, the spirit of the dead man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: One shield produced a hollow sound, causing distress; after the man was told
    to hold it straight up and the shield was struck again, it produced the desired
    sound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: For that night and several days afterward, the Immirinja would not speak of
    the expedition and continued wearing charcoal and green twigs; later, after painting
    themselves with bright colours, they were free to talk about it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Ulthana was believed to follow the party in the form of a small bird called
    Chichurkna, making a sound like a distant crying child; failure by one of the
    men to hear it would result in paralysis of his right arm and shoulder.
  category: relationship
  evidence_refs:
  - ev:7
