canonical_text:
  quote: ''
  summary: The passage introduces traditions concerning Alcheringa ancestors of the
    Arunta, then describes the Udnirringita or Witchetty Grub totem near Alice Springs.
    It explains the totem name, the associated country of hills and gaps, ancestral
    origins and deposited Churinga, ancestral eggs represented by stones, and particular
    landscape features marking the emergence, death, spirit-presence, and reincarnation
    of ancestral beings. Emily Gap is identified as a central important site.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Udnirringita or Witchetty Grub totem group is located near Alice Springs
    and is described as the most important group of that totem.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The totemic name is derived from a grub or larva, and the grub’s name is derived
    from the Udnirringa bush on which it feeds and lays eggs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Udnirringita country is described as about 100 square miles, crossed by
    a range of hills with gaps or gorges especially associated with the group.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At various places in the district, Udnirringita people originated in the Alcheringa
    from their animal ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Alcheringa Udnirringita people deposited Churinga at places during their wanderings
    or where they originated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Alcheringa Udnirringita men and women are said to have been full of eggs,
    now represented by rounded water-worn stones called Churinga Unchuhna and stored
    in Ertnatuhinga at various gaps.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Natural features throughout the Udnirringita country are said to have histories
    attached to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A gum tree marks the place where an Alcheringa man full of eggs arose after
    being transformed out of a witchetty grub.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the Alcheringa man died, his spirit part remained with his Churinga
    and especially frequented the gum tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The spirit of the Alcheringa man later entered a woman of the local group
    and was reincarnated as a man; the gum tree was that man’s Nanja tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A splinter of black gneissic rock marks the place where an Alcheringa woman
    arose, and her living reincarnation is described as an old woman at Alice Springs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Emily Gap, called Unthurqua, is described as probably the most important spot
    in Udnirringita country because of its central position.
  category: setting
  evidence_refs:
  - ev:9
