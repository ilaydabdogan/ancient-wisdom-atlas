canonical_text:
  quote: ''
  summary: The passage describes Arunta ceremonial decorations, especially head-dresses
    and body designs, connected with totems and Alcheringa figures. It gives examples
    from emu, frog, and sun totem ceremonies, explains symbolic uses of down, Churinga,
    cords, feathers, and painted patterns, and notes that similar objects may represent
    animal features, trees and roots, skulls, the sun, or ancestral paths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the designs are associated with special men or women
    of the Alcheringa, with exceptions, and that all are connected with totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Special attention is usually paid to the head-dress; hair is tied up and a
    helmet can be made from twigs or grass stalks wound with human hair-string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one emu performance, a slightly tapering head-dress about five feet high
    is tipped with emu feathers and moves as the performer walks, imitating the up-and-down
    movement of an emu's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In emu ceremonies, down lines run along the body, arms, and legs; the passage
    suggests these may derive from longitudinal markings on young emus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Frog totem ceremonies use decorations such as alternate white and red circles
    around the head-dress and body, and red patches encircled by white down.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the frog totem decoration, the head-dress with a Churinga represents a
    large tree, longitudinal lines represent roots, and small circular patches represent
    frogs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explains the frog imagery by describing frogs burrowing in sandy
    ground among red gum roots near creeks that only rarely contain water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: One elaborate frog decoration covers the performer's body with frog representations,
    uses feather tufts and a down-wrapped Churinga, and has ringed strings hanging
    from the head-dress to indicate roots, nearly concealing the performer.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a sun totem ceremony, one performer wears a large flat disc with alternate
    concentric circles of red and white down; the disc is said to represent the sun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Circles of white down enclosing a bluish grey or black patch represent skulls
    of men who have been killed and eaten.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A long cord made of human hair-girdles can be stretched between the heads
    of seated performers to represent the path followed by ancestors of a totemic
    group in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A similar cord can connect standing men at their waist girdles and, in that
    use, represents roots of trees indicated by some of the men.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage begins to describe another decoration made from red-barred black
    cockatoo tail feathers fixed to short sticks and tipped with masses of red or
    white down.
  category: object
  evidence_refs:
  - ev:9
