canonical_text:
  quote: ''
  summary: The passage argues that named kinship terms in the described Central Australian
    tribes are not merely polite address forms but relationship terms within a classificatory
    system. It describes restrictions on speech between people in the Mura relation,
    group-based marriage categories, broad kinship terms such as Mia, naming after
    a place of imagined conception, nicknames from personal or animal/plant resemblances,
    sacred names associated with churinga or sacred emblems, and separate address
    terms for men involved in initiation ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Individuals have personal names by which they may be freely addressed, except
    that a member of the opposite sex in the Mura relationship may only rarely speak
    to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the example given, a man named Oriaka is called the speaker's Okilia, and
    further inquiry is needed to know whether this means blood brother or tribal brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that the relationship terms in the tribes they know depend
    on a classificatory system in which women of certain groups marry men of other
    groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One term may apply both to a man's actual wife and to all women he could lawfully
    marry; another may apply both to his actual mother and to all women his father
    might lawfully have married; another may apply to his actual brother and to sons
    of his father's brothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A child is often named after the place where the mother imagines she conceived
    it, understood as the place where she first becomes aware of pregnancy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The example name Atthuriira-rinia is explained as connected with Alice Springs,
    whose native name is given as Atthuriira, with rinia meaning 'of' or 'belonging
    to'.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nicknames are described as popular and as derived from personal peculiarity
    or fanciful resemblance to a particular animal or plant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Every individual is said to have a sacred name especially associated with
    his or her churinga or sacred emblem, known only to the men of the individual's
    own local totemic group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Arunta term Mia includes the relationship called mother in English but
    extends beyond it, and the passage says the described languages have no exact
    equivalents for English kin terms such as father, mother, and brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A grown man may call a little girl child his Mia if she belongs to the same
    group, while still using her personal name in direct speech or explanation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Terms such as Tapunga and Urinthantinia are described as terms of address
    applied by a man to particular men who took part in his initiation ceremonies,
    and they are distinguished from relationship terms.
  category: speech
  evidence_refs:
  - ev:6
