canonical_text:
  quote: ''
  summary: The passage describes how a local totemic group’s land and Churinga are
    handled if the group dies out, how Churinga and associated spirit individuals
    remain at the place so that the group may come into human existence again through
    conception, examples involving wild dog and lizard groups, and rules for custody
    and inheritance of Churinga under the Alatunja and male kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If all individuals associated with a locality die, a neighbouring group may
    possess the land only if its members are Nakrakia to the extinct group, belonging
    to the same tribal moiety or relevant sub-classes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group described as temporarily extinct may be resuscitated because the Churinga
    of the Alcheringa and their associated spirit individuals still inhabit the spot,
    and one may enter a woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a group becomes extinct, its Churinga may be cared for by the newcomers
    or handed to another local group of the same totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one wild dog case, a contiguous group of the same sub-classes but a different
    totem took the land and sent the Churinga to a distant wild dog group.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the lizard case, a neighbouring Bulthara and Panunga group of the Unchalka
    totem took the locality and left the Churinga undisturbed in the Ertnatulunga,
    with old men periodically examining them and rubbing them with red ochre.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After a child was conceived in the old lizard locality, the local totemic
    group was again brought to life, and the boy later received charge of the Churinga
    of his totemic ancestors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Churinga are always under the immediate charge of the Alatunja, the head man
    of the local totem group, while various individuals may have special proprietary
    rights in particular Churinga.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man’s Churinga may pass to his mature eldest son, or, if no son is mature,
    to a younger brother until the son is old enough; the Alatunja’s consent remains
    required for touching them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman’s Churinga do not descend to her son but to a younger brother, or
    to a younger man in the Witia relationship chosen by men standing as Oknia and
    Aniiiga; the passage concludes that Churinga remain in the custody of a man.
  category: relationship
  evidence_refs:
  - ev:8
