canonical_text:
  quote: with them the spiritual part of their former possessors is associated
  summary: The passage describes Churinga and equivalent sacred objects among several
    Central Australian tribes, noting differences in form, decoration, concealment,
    and ritual use. It also describes lending Churinga between friendly groups as
    an act of goodwill connected with good fortune, prestige, expected return gifts,
    and messenger protocol. A Urabunna equivalent object, the Chimbaliri, is described
    as being given to a youth after initiation until his wound heals.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The authors state that they had found sacred objects buried with men only
    in the case being discussed, applying specifically to men of the witchetty grub
    totem, while allowing that similar objects might exist in other totems.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stones described as evidently Churinga are reported among other Central Australian
    tribes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Ilpirra and Luritcha, the use and meaning of the stones are described
    as precisely similar to those already described among the Arunta.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kaitish and Warramunga Churinga are described as flat, pear-shaped micaceous
    slabs with a small lump of resin at the narrow end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some Kaitish or Warramunga stones may be plain, ornamented with designs, or
    painted after being red-ochred, and examples are enclosed in emu feathers to protect
    them and keep them from being seen by women.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the W'aagai, both flat and somewhat spherical stones are known; a flattened
    stone has serrated edges, concentric circles, a bored hole, and attached hair
    string.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The authors state that the same essential idea underlies the Churinga in the
    tribes discussed and connect this with similar social organization and totemic
    systems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Urabunna tribe, the equivalent of the Arunta sacred stick is called
    Chimbaliri and is a plain piece of rounded wood, concavo-convex in section, without
    incised pattern or red ochre.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After an initiation ceremony, a Chimbaliri is given to a youth to carry until
    the wound has healed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One group may lend Churinga to a neighboring friendly group as a special mark
    of goodwill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Possessing many Churinga is described as desirable because the spiritual part
    of former possessors is associated with them and because possession is thought
    vaguely to bring good fortune.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The lending group gains dignity from having many Churinga to lend, and the
    borrowing group is expected to give presents when the Churinga are returned.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The two groups involved in lending Churinga do not need to belong to the same
    totem.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the example given, an Erlia or emu totem group from the Strangway Range
    lent Churinga to another Erlia group east of Alice Springs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The borrowing group's Alatunja sends an accredited messenger, called Inwirra,
    to the lending group's Alatunja; the messenger carries a few Churinga as credentials.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: On reaching the other group's country, the messenger remains at a distance
    from the main camp until the Alatunja and older men come out to him.
  category: sequence
  evidence_refs:
  - ev:8
