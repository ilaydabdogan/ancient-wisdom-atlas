canonical_text:
  quote: ''
  summary: 'The passage describes part of a Witchetty Grub Intichiuma ceremony near
    Emily Gap: men go unarmed and undecorated, fast, proceed under the Alatunja, gather
    gum twigs, visit a shallow cave and rocks associated with Intwailiuka, tap stone
    representations of the adult animal and its eggs, chant invitations for egg-laying,
    and reenact actions attributed to Intwailiuka in the Alcheringa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The men leave weapons, decorations, and even the hair girdle in camp before
    proceeding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men walk in single file while the Alatunja leads or monitors the line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men other than the very old are forbidden to eat until the ceremony is over,
    and game caught on the way is given to the old men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The party reaches a special camping ground near Emily Gap at dusk and lies
    down there for the night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: At daylight the party plucks twigs from gum trees; every man carries two twigs
    except the Alatunja, who carries a small pitchi or wooden trough.
  category: object
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:6
  text: The procession follows the path attributed to Intwailiuka, described as the
    great leader of the Witchetty grubs in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A shallow cave high on the western wall of the Gap contains a large quartzite
    block and smaller rounded stones; the large block represents the adult animal
    and the small stones represent its eggs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Alatunja and the other men tap the stones while chanting invitations for
    the animal to lay eggs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Alatunja strikes each man in the stomach with a small stone while saying,
    "You have eaten much food," then strikes each man's stomach with his forehead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the rock called Alknalinta, associated with Intwailiuka cooking, pulverising,
    and eating the grub, the Alatunja and men again strike the rock and chant invitations
    for the animal to come and lay eggs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says Intwailiuka threw Churinga muchima up the face of the rock
    and that the Alatunja does the same with some Churinga.
  category: action
  evidence_refs:
  - ev:7
