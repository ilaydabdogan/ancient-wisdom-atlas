literal_observations:
- id: obs:1
  text: An elopement of a woman with a man is described as a frequent cause of serious
    trouble between different local groups; if caught, the woman may be killed or
    harshly treated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the eloping couple escapes to a distant place, the original husband may
    later go with friends to search for the woman and the man who took her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dispute over elopement may become a fight between the interested parties
    or a broader quarrel between local groups.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain kin categories are said to be bound to help a man in such a quarrel,
    while totem affiliation is stated to have no role in the matter among these Central
    Australian tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Two fighting procedures are described: a real fight if the aggrieved man
    wants to regain the woman, or a non-retaliatory defense by the other man if the
    aggrieved man is willing to hand her over.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the reported case, a man from west of Alice Springs persuaded another man's
    wife to run away; the couple lived away for a year and then returned to Alice
    Springs with some of the man's friends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On return, the man went to the men's camp, the woman went to the women's camp,
    and a long discussion took place while the two interested men remained silent.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man who had taken the woman brought spears and a shield to a clear space
    and called to the aggrieved man to confront him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The aggrieved man threw spears and boomerangs while the other man used a shield
    and did not retaliate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The aggrieved man then tried to cut the other man's thighs and back with a
    large stone knife until onlookers separated them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The aggrieved man caught his former wife, cut her about the legs and body
    while avoiding vital parts, waved his knife, verbally renounced her, and she then
    became the property of the man with whom she had eloped.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage describes Tualcha mura as the most usual method of obtaining a
    wife, established by arrangement between two men for their children, one a boy
    and the other a girl.
  category: relationship
  evidence_refs:
  - ev:8
