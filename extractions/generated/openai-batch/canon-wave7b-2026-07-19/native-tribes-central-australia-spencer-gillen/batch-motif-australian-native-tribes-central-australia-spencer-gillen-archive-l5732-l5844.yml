canonical_text:
  quote: ''
  summary: The passage discusses sexual jealousy, unlawful intercourse, tribal law,
    and wife lending among Central Australian groups, with special attention to Arunta
    rules. It distinguishes private wife lending from obligatory access at corroborees
    and evaluates Westermarck’s comparative explanations involving phallic worship,
    wedding hospitality, and wife lending.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that, among Australian natives with whom they had contact,
    sexual jealousy is less developed than in many other groups and that reactions
    to unlawful intercourse chiefly concern infringement of tribal custom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who has intercourse with a woman from the class from which his wife
    comes is called atna nylkna, translated by the authors as “vulva-thief”; one who
    has intercourse with a woman unlawful for him is called itirka.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage distinguishes between stealing property and offending against
    tribal law in cases of unlawful intercourse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The authors say tribal custom can require a man to allow other men access
    to his wife at certain times or direct him to lend his wife to another individual
    as a personal favour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that a man may be put to death for wrongful intercourse,
    but interprets this punishment as enforcement of tribal law rather than proof
    of sexual jealousy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors define “lending of wives” here as private lending by the man to
    whom a woman has been allotted, distinct from obligatory access at corroborees.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage summarizes Westermarck’s attempt to explain similar customs while
    arguing against a hypothesis of promiscuity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The authors reject an explanation from phallic worship, including a Ganges/Juggernaut
    example, as belonging to a different and more advanced social condition than that
    found among Australian natives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The authors reject the wedding-feast hospitality explanation for Australian
    tribes, saying that regular marriage ceremonies with assembled guests do not occur
    and that access is limited to individuals in particular relationships to the woman.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: For the Arunta, the passage says a man lends his wife only to someone from
    the group with which it is lawful for her to have marital relations; she calls
    such a man Unawa, as she calls her own husband.
  category: relationship
  evidence_refs:
  - ev:8
