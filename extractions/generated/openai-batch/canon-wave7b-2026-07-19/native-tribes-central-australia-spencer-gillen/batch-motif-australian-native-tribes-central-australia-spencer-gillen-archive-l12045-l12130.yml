canonical_text:
  quote: ''
  summary: 'The passage describes phases of an initiation sequence: women are cut
    by a female relative of the boy; cicatrices and Churinga are mentioned; some men
    undergo a further genital operation; the Ertwa-kurka carries Churinga until recovered;
    officials remove decorations, impose speech and food-gift restrictions, sing,
    and return the initiate to women. The young man is adorned, approaches with a
    shield, receives actions from elder sisters including thrown pitchis, touching,
    face-rubbing, and cutting of hair locks, and then enters a restricted post-ceremony
    status.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women assemble at the women's camp after hearing sounds from the men's ceremony,
    and a designated female relative of the boy cuts the Unchalkulkna woman and other
    specified women across the stomach and shoulders while imitating the Ariltha party
    sound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cuts generally leave definite cicatrices called irpma, and these are often
    represented by definite lines on Churinga.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the operation on an Arakurta, previously operated younger men may voluntarily
    request a second operation, saying that the earlier incision did not go far enough.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the second operation, one Mura man holds the volunteer from behind while
    another cuts an oval piece of skin and extends the slit to the root.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ertwa-kurka carry Churinga with them until they have completely recovered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After recovery is announced, the men assemble in the bush, officials appoint
    an Irkoa-artha, and that person removes the decorations from the Ertwa-kurka.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Ertwa-kurka lies face down while men sing a chant said to promote hair
    growth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The initiate is told not to speak for some time to the Irkoa-artha, and later
    only after presenting food called Chanrilia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men sing near the main camp; women assemble and dance as at the Apulia; the
    men halt and shout 'tirra,' a sound compared in the passage to whirling bull-roarers,
    and the women repeat it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The undecorated young Ertwa-kurka runs close to the dancing women, suddenly
    turns, runs into the bush, and is followed by men who camp with him while singing
    continues until daybreak.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Before daylight, Okilia and Umbirna men dress the Ertwa-kurka with ornaments,
    provide a shield and spear-thrower, and the group returns toward the main camp
    shouting 'tirra.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Near the women, the Irkoa-artha leads the Ertwa-kurka briefly; the young man
    then approaches alone, holding his shield in front to hide his face.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: One or two Uugaraitcha throw pitchis at his shield, press their hands on his
    shoulders from behind, rub their faces on his back, and cut off locks of his hair
    for hair-string ornaments.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The ceremony is called anainthalilima; after it the Ertwa-kurka may go into
    the presence of various officials, but speech restrictions toward them continue
    for months.
  category: sequence
  evidence_refs:
  - ev:13
