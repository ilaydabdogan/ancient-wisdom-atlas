canonical_text:
  quote: ''
  summary: 'The passage describes several forms of magic associated with Central Australian
    groups: dead men''s hair and ornaments made into war or charm objects; mortuary
    necklets distributed according to moiety and local-group rules; a string implement
    called Ililika used as a feared magical weapon; and a Wyingurri magic object sharing
    its name with the sun.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girdle made from a dead man's hair is described as a valued possession worn
    for tribal fighting or when going out as a Kjirdaitcha.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hair girdle is said to be endowed with magic power, to add the dead man's
    war-like attributes to its possessor, to ensure the possessor's accuracy of aim,
    and to impair an adversary's aim.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small piece of hair cut from a dead man's body after death may be placed
    inside an ordinary hair necklet and worn by men as a charm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Placing one of the magic girdles or necklets beside a woman or child is said
    to produce serious evil for her.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: A dead man's opossum fur-string girdle and head-bands are preserved and, after
    a grave ceremony, made into named necklets understood as connected with the dead
    man's attributes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dead man's hair must go to a member of his own moiety, while the Irnilknakinna
    necklets must go to a member of the other moiety and another local group; they
    are tabu to men of the dead man's own local group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men of a neighbouring group are summoned to the men's camp, women may not
    come there, and the dead man's son or younger brother places the necklets around
    the chosen recipients' necks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Regional forms of the special necklet differ: central and northern Arunta
    examples are described as four or five circles of hair-string, while western Arunta
    examples are described as a single circle or horseshoe-shaped coil tied with opossum
    fur-string.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ililika is a magic-associated string implement made of many tightly strung
    vegetable-fibre strands and is compared in use to a knout.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sight of an Ililika is said to greatly frighten an offending woman, its
    stroke is said to cause death or lifelong maiming, and it may be cracked toward
    a target so that evil influence travels through the air to the victim.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ililika is used among the Arunta, Ilpirra, Kaitish, and Warramunga, but
    is said to be manufactured and endowed with magic power only by the Warramunga.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Wyingurri, the name of the sun is also applied to a magic object
    made of porcupine grass resin, rat teeth, hair-string, red down, and paper-bark
    wrapping.
  category: object
  evidence_refs:
  - ev:8
