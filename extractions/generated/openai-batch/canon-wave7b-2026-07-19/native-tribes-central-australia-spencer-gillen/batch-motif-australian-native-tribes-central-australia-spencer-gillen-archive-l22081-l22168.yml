canonical_text:
  quote: ''
  summary: The passage describes an Alice Springs account of how Iruntarinia spirit
    individuals make a medicine man. A man goes alone to the mouth of the Okalparra
    cave and sleeps there. An Iruntarinia pierces his tongue and head with invisible
    lances; he dies and is carried into the cave. Inside, his internal organs are
    removed and replaced. He comes back to life temporarily insane, is led back to
    his people by the spirit, later paints a charcoal-and-fat band across his nose,
    and is recognized as a new medicine man. The cave is also described as a dreaded
    spirit dwelling with perpetual sunshine and running water; two men who entered
    it seeking water disappeared.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cave about fourteen miles south of Alice Springs, in a range north of the
    Emily plain, is said to be occupied by the Iruntarinia.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Iruntarinia are described as spirit individuals, doubles of Alcheringa
    ancestors or of living members understood as reincarnations of those ancestors,
    and as possessing the power to make medicine men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who feels capable of becoming a medicine man goes alone to the mouth
    of the cave and lies down to sleep there, without entering the cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that if the man entered the cave instead, he would be spirited
    away forever rather than receive magic power.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At daybreak an Iruntarinia throws an invisible lance that pierces the sleeping
    man from the back of the neck through the tongue and out of the mouth, leaving
    a lifelong hole in the tongue.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:6
  text: A second invisible lance pierces the man's head from ear to ear; he falls
    dead and is carried into the depths of the cave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cave is named Okalparra and is said to be feared; the Iruntarinia are
    said to live in it in perpetual sunshine among streams of running water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A tradition says that two natives entered the cave in search of water and
    were never heard of again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Inside the cave, the Iruntarinia removes all the man's internal organs, gives
    him a completely new set, and he comes to life again in a temporary condition
    of insanity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After partial recovery, the Iruntarinia, described as invisible except to
    a few gifted medicine men and to dogs, leads the man back to his own people and
    then returns to the cave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: For several days the man appears and behaves strangely; later he paints a
    broad band of powdered charcoal and fat across the bridge of his nose, all signs
    of insanity disappear, and he is recognized as a new medicine man.
  category: sequence
  evidence_refs:
  - ev:7
