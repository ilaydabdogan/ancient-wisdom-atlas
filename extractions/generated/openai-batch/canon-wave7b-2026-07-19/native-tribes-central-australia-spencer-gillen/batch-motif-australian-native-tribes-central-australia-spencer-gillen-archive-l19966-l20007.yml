canonical_text:
  quote: ''
  summary: The passage describes birth-related customs involving a hair-girdle, a
    restricted place called Erhikwirra, the husband’s silent walking to induce an
    unborn child to follow him, postnatal treatment of the umbilical cord and afterbirth,
    a child’s cord-necklace called Akurlaitcha, a painted eyebrow mark imitating the
    Erathippa stone, and totemic food restrictions among the Urabunna and other Australian
    groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hair-girdle is taken to the Erhikwirra, a place near which men generally
    may not go, and is tied tightly around the woman’s body just under the breasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The action at the Erhikwirra is performed without speech, and the actor returns
    to the husband’s camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the birth is not announced after some time, the husband remains unadorned
    and walks slowly once or twice near the Erhikwirra to induce the unborn child
    to follow him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After birth, the umbilical cord is cut with a stone knife or the pointed end
    of a digging-stick, without a ligature, and the cut end is often dressed with
    hot ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The afterbirth is burnt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a few days the mother cuts off the attached part of the cord, swathes
    it in fur-string, and makes it into a necklace called Akurlaitcha for the child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Akurlaitcha necklace is said to help the child grow, keep the child quiet
    and contented, avert illness, and deaden the noise of barking camp dogs for the
    child.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A black line is painted over the eyebrow in imitation of a mark on the Erathippa
    stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among the Urabunna, an individual is strictly forbidden to eat or injure the
