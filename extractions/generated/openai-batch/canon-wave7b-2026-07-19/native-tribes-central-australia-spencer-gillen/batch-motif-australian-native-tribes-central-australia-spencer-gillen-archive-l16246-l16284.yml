canonical_text:
  quote: '"not a word being spoken when once the ceremony had begun"'
  summary: Men led by ab-moara proceed in a linked line to smoky fires where women
    and children stand. Women beckon and call, men run forward, and Illpongwurra kneel
    briefly in smoke while women press their shoulders. The group returns silently
    to camp; newly-made Urliara gather around the Kauaua, which is dismantled, and
    Churinga are returned. Newly-made Urliara remain in the bush until a later ceremony
    lifts a ban of silence, and the Engwura ground remains forbidden to women and
    children for months.
  language: English
  quote_policy: quoted
