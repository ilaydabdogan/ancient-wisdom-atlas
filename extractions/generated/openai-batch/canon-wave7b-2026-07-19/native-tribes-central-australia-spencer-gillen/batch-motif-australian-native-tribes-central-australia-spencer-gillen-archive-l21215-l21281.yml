canonical_text:
  quote: ''
  summary: 'The passage describes mortuary and mourning restrictions: some relatives
    must not name the dead or approach the grave, affinal relatives have special avoidance
    and cutting obligations, widows whiten themselves and remain silent, and northern/Warramunga
    widows may observe extended speech restrictions and bodily mourning practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Uwidia or Mura of a deceased person may never mention the deceased's name
    and may never go near the grave after the ceremony called Urpmilchinna has been
    performed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other named kin categories may, after the mourning period ends, speak of the
    dead and mention the name without fear of angering the Ulthana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A grave is rarely visited for a long time after burial, and no camp is formed
    close to a grave for at least two years because of fear of disturbing the Ulthana.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Gammona of the deceased must never mention the deceased's name, do not
    attend the burial, and do not take part in mourning ceremonies carried on at the
    grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Gammona is expected to cut himself on the shoulder when his Ikuntera or
    father-in-law dies; this cutting rite is called Unangm-a.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a son-in-law fails to perform the cutting rite properly, an Ikuntera may
    punish him by giving away his special Unawa or wife to another man to appease
    the Ulthana of the dead father-in-law.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a Gammona hears the dead father-in-law's name mentioned in camp, he rattles
    his boomerangs together to prevent himself from knowing what is being said.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men bear raised shoulder cicatrices described as permanent records that they
    have fulfilled their duty to a dead father-in-law.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a man dies, his special Unawa or Unawas smear their hair, faces, and
    breasts with white pipeclay and remain silent until the ceremony called Aralkililima
    has been performed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The widow is called Inpirta, meaning the whitened one, in reference to the
    pipeclay; if ashes from a fire are smeared over the pipeclay she is called Ura-inpirta.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among some northern tribes, including the Warramunga on Tennant's Creek, widows
    may be forbidden to speak for as long as twelve months and communicate by gesture
    language.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says women can conduct brisk conversation in near silence by signs
    made with fingers, hands, and arms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note states that among the Warramunga the widow crops her hair short, cuts
    open the middle line of the scalp, and runs a fire-stick along the wound, sometimes
    with serious results.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage includes a figure caption identifying a tree burial in the Warramunga
    tribe.
  category: object
  evidence_refs:
  - ev:9
