canonical_text:
  quote: ''
  summary: 'The passage describes several Central Australian ritual performances within
    an initiation context: decorated performers representing Achilpa men, a performance
    involving Churinga, shield, Hakea twigs, water, circling men, and chanting; a
    third-day Wild Cat/Urapitchera ceremony involving Nurtunjas and ancestral precedent
    in the Alcheringa; an exceptional Kurdaitcha-men performance; and the beginning
    of a fourth-day examination of Churinga linked to an extinct large-lizard group
    and its sacred storehouse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two performers were decorated with broad bands around the waist and over the
    shoulders, rubbed first with grease and then powdered manganese ore, edged with
    white down, and with rabbit-bandicoot tail-tip tufts suspended over the ears.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the two decorated men carried a large Churinga on his head, fixed in
    a twig-and-string helmet, while chants referred to the Kaiiaua and to carrying
    the Nurtunja around.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two performers represented Achilpa men and sat facing one another near
    the Parra.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Churinga-carrying performer held a shield and twigs representing flowering
    Hakea, pretended to steep them in water to make a drink, and the opposite performer
    pretended to suck up the drink with a small fur-string mop on a twig.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other men ran around the two performers shouting; the drinking performer turned
    his back toward the other, the shield was placed behind him, the two swayed from
    side to side, and the circling men reduced to three who put hands on the performers'
    shoulders.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the third morning the Ouabara Achilpa of Urapitchera was performed, described
    as concerning wild cat men who in the Alcheringa walked from south to north on
    the eastern side of Arunta country and camped at Urapitchera on the Finke River.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Wild Cat/Urapitchera ceremony is described as being in the possession
    of an Alatunja of the Imanda emu group, received from his father who was a wild
    cat man, and performed at the owner's request by an old Purula man associated
    with the white bat totem.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two Nurtunjas about ten feet long were made without a central spear, using
    many flexible grass stalks bound with hair string and decorated with rings of
    red and white down.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Wild Cat/Urapitchera performance, the Nurtunjas were arranged with
    one end under the performer's waist-girdle and the feathered ends resting on the
    ground, after which men ran around and passed under them while helping support
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage explains the men supported the Nurtunjas in that way because they
    had been carried that way in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the end of the Wild Cat/Urapitchera performance, an old Purula man described
    as one to whom the ceremony belonged embraced the old performer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: An afternoon ceremony represented the doings of certain Kurdaitcha men, was
    owned by the head man of the little hawk totem, and is stated to have no special
    relationship to the Engwura or to any totemic subject.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Early on the fourth morning a special examination of Churinga began; the passage
    introduces an extinct group of Echunpa or large-lizard men who had formerly lived
    west of Alice Springs and whose sacred storehouse lacked a remaining male custodian.
  category: sequence
  evidence_refs:
  - ev:6
