canonical_text:
  quote: ''
  summary: 'The passage describes the custom of Illapurinja: a woman is decorated
    and goes out at night to attack a selected man or woman with a Churinga or charmed
    stick. Her husband watches an upright stick with Alpita or rat tails tied to it
    as a sign of her fate. If the attack succeeds, she returns in darkness to her
    husband''s camp, where he receives her silently, removes decorations, rubs her
    with fat and red ochre, and questions her under restrictions. The victim may suffer
    unconsciousness, pain, death, or possible cure by a medicine man extracting Churinga
    fragments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small tuft of Alpita or rat tails is tied to the upper end of an upright
    stick, and the husband watches it while the woman is away.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the woman is killed, the Alpita falls to the ground by itself; the husband
    understands the sign, destroys his camp and her belongings, moves away, and leaves
    the digging stick and Alpita untouched.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The illustrated woman is described as carrying a charmed stick in her right
    hand and a decorated fighting club in her left while throwing the charmed stick
    at an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman sets out at night after being decorated, lies down in camp as if
    nothing unusual is happening, and leaves quietly alone while her husband sleeps.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the quarry is a man, she conceals herself until his attention is occupied
    in stalking kangaroo or emu; if the quarry is a woman, she hides near a favored
    yam ground and creeps up while the woman digs tubers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Churinga is thrown from behind to strike the victim's neck; it enters
    the body and breaks into many small pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The victim becomes insensible for a time and then suffers great pain; an old
    woman is said to die, while a man or younger woman may recover.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A clever medicine man may recover the victim by prolonged rubbing and sucking
    to extract the broken pieces of Churinga from the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If successful, the woman returns to her husband's camp but waits until dark
    before coming close; the husband has kept a small fire burning nearby, and she
    lies beside it until he finds her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The husband takes the returned woman by the arm, leads her into camp, and
    both sit without speaking while he removes her decorations and rubs her with fat
    and red ochre.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the reception, the woman takes up the stick with Alpita tied to it;
    she answers the husband's questions but must not volunteer information.
  category: speech
  evidence_refs:
  - ev:8
