canonical_text:
  quote: ''
  summary: The passage compares Central Australian, Western Australian, and south-eastern
    bull-roarers and Churinga designs. It states that coastal bull-roarers differ
    in significance from Central ones; contrasts Central concentric-circle Churinga
    designs with Western zig-zag designs; describes a western Arunta bell-bird totem
    Churinga whose circles have become rounded squares; and suggests a possible graphic
    development from spiral and concentric forms toward straight-line Western patterns.
    It concludes that Central and Western bull-roarers are allied in form and design
    and differ from the south-eastern Tundun.
  language: English
  quote_policy: summarized
