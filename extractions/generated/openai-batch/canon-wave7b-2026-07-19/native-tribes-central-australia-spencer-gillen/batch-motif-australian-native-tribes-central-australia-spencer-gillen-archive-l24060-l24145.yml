canonical_text:
  quote: ''
  summary: 'The passage describes Central Australian clothing, ornaments, and weapons:
    waist-girdle ornaments, shell pendants, emu-feather head pads, flaked sticks used
    as either head ornaments or fighting signs, disposal of such sticks after an avenging
    killing, spear flakes signaling intent to shed blood, women’s forehead ornaments,
    nose bones, and common weapons carried on the march.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men sometimes wear black and white tail-tips of Peragale lagotis suspended
    from the waist-girdle, especially during corrobborees; women commonly wear the
    same tail-tips over the ears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lonka-lonka is a shell ornament suspended from the waist-girdle, traded
    from the north and widely used in the Centre; the authors report no incised design
    on local examples, while similar West Australian articles sometimes have a zig-zag
    line pattern.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Arunta and Luritcha men frequently wear an emu-feather pad called Imampa on
    the back of the head, fastened with fur-string and bone pins, with feather tufts
    fixed at the upper corners.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Flaked sticks called Inkulta are used by some groups as head ornaments, while
    among other groups the same objects worn in the same way indicate that the wearer
    is bent on fighting.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inkulta are described as men’s objects worn fixed in the hair like feather
    tufts and made by chipping curved flakes in a roughly spiral line.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an avenging party kills a man, those who spear him break up the Inkulta
