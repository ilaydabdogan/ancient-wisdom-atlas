canonical_text:
  quote: ''
  summary: A list of illustrations, figures 84-111, naming ritual scenes, totemic
    ceremonies, sacred and magical objects, mortuary practices, named places, ornaments,
    and weapons associated with Central Australian ethnographic material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One illustration is titled as the erection of the Sacred Pole, or Kauaua,
    with a man who has climbed up arranging the Churinga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Illpongwurra are listed as being on the fire, gathered around the Kauaua,
    and painted with totemic designs on their backs.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Two illustrations concern release from the Ban of Silence by touching the
    mouths of younger men or a younger man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: The mouth-touching in the release scenes uses a sacred object in one caption
    and a fragment of food presented by the younger man to the older man in another
    caption.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rocks at Quiurnpa are described as having arisen to mark the spot where the
    Illpongwurra were burnt during the Engwura.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Xanja rock of Kukaitcha is identified with Kukaitcha as leader of the
    Ulpmerka men of the Plum Tree Totem at Quiurnpa.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Emily Gap is listed in illustrations from both the south side and the north
    side.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: A White Bat Totem ceremony is described as concerned with cannibalism.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Emu feather shoes are listed as worn by the Kurdaitcha, and another illustration
    shows a Kurdaitcha creeping up to his enemy.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mortuary-related illustrations include tree burial, a widow smeared with kaolin
    and wearing the Chimurilia, and Chimurilia with fur string bands and feathers
    worn by the widow during the Urpmilchima ceremony at the grave.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Iruntarinia ceremonies are listed for the Unjiamba, or Hakea Tree, Totem of
    Urthipita showing the Umbalinyara Cross, and for two Gruncha of Atnurtinya Kinya.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Medicine-man and magic-related illustrations include a medicine man showing
    a hole in his tongue, a medicine man made by the Oruncha with the Oruncha Marilla
    design, and various magical implements.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Other listed illustrations include a drawing of a woman lying on her back,
    a Sun Totem ceremony, clothing and personal ornaments, spear-heads, and spear-throwers.
  category: object
  evidence_refs:
  - ev:13
