canonical_text:
  quote: ''
  summary: A fourth party of Achilpa or wild cat people, led by a powerful Purula
    man, travels through named places, opens bundles containing men, performs ceremonies,
    encounters other totemic groups, leaves men behind, creates or marks landscape
    features, and eventually mixes with resident groups after the leader’s abnormal
    bodily feature disappears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stones arise to mark a spot, while Churinga with associated spirit individuals
    remain behind and are kept in a store-house at Unjiacherta.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fourth Achilpa or wild cat party is led by a Purula man described as very
    strong and abnormally developed; he comes from the south-west and brings two Panunga
    women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Purula leader has a Kauaua and carries a large Unkapera bundle under each
    arm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Erloacha the leader opens the Unkapera bundles, which contain many men
    of different ages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the bundles are opened, a great Engwura is made; after a long stay two
    men, one Panunga and one Purula, are left behind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During travel the old Purula leader moves to one side of the main party, and
    his penis repeatedly strikes the ground and digs furrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Yapilpa the Achilpa men meet Unthippa dancing women approaching from the
    west, dancing as they go; the Achilpa do not interfere with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The party crosses the range, camps at the Ulpmaltwitcha waterhole, and makes
    quabara tindattha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While crossing Mount Sonder the party sees an old Illuta or bandicoot man
    making large wooden pitchis, and the place is called Urichipma, “the place of
    pitchis.”
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After pausing on Mount Sonder and looking back at their tracks, a row of stones
    arises and remains to mark the spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Kurupma the party holds an Engwura and leaves an old Purula man named Kurupmarinia;
    his aged descendant is said to have charge of the store-house and Engwura ceremonies
    there.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Poara the party performs Ariltha and makes Engwura, and finds Kakwa or
    hawk women who possess a Nurtunja and sacred ceremonies that they show to the
    Achilpa men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Poara the old leader has intercourse with many women, several younger women
    die, and fully initiated Urliara men are also allowed access to them; afterwards
    the men depart before daylight, ashamed of their excesses.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Irpungarthra the party finds a Purula woman of the Arawa totem who has
    no Nurtunja but owns wooden Churinga, which she hides when the party approaches;
    she is allowed to see quabara tindattha, and Ariltha is performed on some party
    members.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At Al-lemma the Achilpa find Kakwa men and women but camp apart from them;
    later at Ariltha they change their language to Ilpirra, the leader’s abnormal
    development disappears, and the travelling and resident groups mix.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: After Ariltha, a big Engwura is made, and the women make fur-string necklaces
    and armlets.
  category: action
  evidence_refs:
  - ev:11
