candidate_motifs:
- id: motif:1
  label: Travelling ancestors map country with ceremonies, place names, and enduring
    marks
  taxonomy_refs:
  - culture_hero
  basis: The Achilpa party moves through named places, performs ceremonies, names
    Urichipma from an observed craft activity, and leaves a row of stones marking
    their tracks.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:11
  confidence: medium
  cautions: The passage calls them ancestors and totemic people rather than using
    the term hero; the taxonomy reference is functional and should be reviewed.
- id: motif:2
  label: Initiation ceremonies structure the journey
  taxonomy_refs:
  - initiation
  basis: Engwura and Ariltha recur at multiple stops, and the passage identifies Urliara
    as fully initiated men who had been through the Engwura.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage reports ritual performance but does not explain the full ritual
    meanings.
- id: motif:3
  label: People emerge from carried bundles
  taxonomy_refs: []
  basis: The leader carries two Unkapera bundles under his arms and opens them at
    Erloacha, revealing many men of various ages.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No available taxonomy reference directly matches this motif without overinterpretation.
- id: motif:4
  label: Sacred objects and ceremonies are shown, hidden, or stored
  taxonomy_refs: []
  basis: Churinga remain in store-houses, Kakwa women show a Nurtunja and sacred ceremonies
    to the Achilpa, and an Arawa woman hides wooden Churinga when the party approaches.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage does not state a single explicit rule governing concealment
    or disclosure across all objects.
- id: motif:5
  label: Extraordinary body marks or transforms social and physical landscape
  taxonomy_refs: []
  basis: The leader’s body digs furrows during travel, and later his abnormal development
    disappears, after which he becomes like an ordinary man and groups mix.
  evidence_refs:
  - ev:4
  - ev:11
  confidence: medium
  cautions: The passage gives the events but does not explicitly interpret the bodily
    change as symbolic.
- id: motif:6
  label: Boundary between travelling and resident groups followed by mixing
  taxonomy_refs: []
  basis: At Al-lemma the Achilpa camp apart from Kakwa men and women, but later at
    Ariltha, after language change and the leader’s bodily change, the travelling
    and resident groups mix.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The cause of the later mixing is not fully explained in the passage.
- id: motif:7
  label: Dangerous sexual excess by a powerful ancestor
  taxonomy_refs: []
  basis: The old leader has intercourse with many Kakwa women at Poara, younger women
    die, initiated men are allowed access, and the men leave before daylight ashamed
    of their excesses.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage reports consequences but does not frame the event as punishment
    or moral law beyond the men’s shame.
