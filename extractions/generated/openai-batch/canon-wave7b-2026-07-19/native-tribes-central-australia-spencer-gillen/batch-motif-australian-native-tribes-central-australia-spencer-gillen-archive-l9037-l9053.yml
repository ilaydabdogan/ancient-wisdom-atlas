  quote: ''
  summary: A group of men sit with Churinga during an Intichiuma ceremony. An unnamed
    man explains parts of a drawing during intervals in a long chant; the drawing
    is then covered, and the men return to a meeting place and chant around the Churinga
    through the night. Three large wooden Churinga are decorated with concentric designs.
