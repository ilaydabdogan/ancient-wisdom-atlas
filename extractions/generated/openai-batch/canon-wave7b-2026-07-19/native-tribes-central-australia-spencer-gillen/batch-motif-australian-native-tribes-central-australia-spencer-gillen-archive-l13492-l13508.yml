  summary: A performer stops quivering and wriggling when three men place their hands
    on his shoulders, while other men dance around him. He then embraces older men
    to calm their emotion. In the evening, people sing on the ground near the Parra;
    during the first six weeks of the Engwura, young men undergoing it for the first
    time form lines, are led by older men, and shout repeated vocalizations.
