canonical_text:
  quote: ''
  summary: 'The passage outlines Alcheringa periods in which rites and social organization
    were introduced, then gives an early tradition: the country was once covered with
    salt water that withdrew northward. Two self-existing beings dwelt in the western
    sky and saw incomplete human creatures by the shores of the salt water. These
    beings descended with stone knives, with the stated mission of making the incomplete
    creatures into men and women.'
