canonical_text:
  quote: ''
  summary: 'The passage describes several customs: a post-operation silence restriction
    lifted by a meat offering and red ochre rubbing; practices involving animal reproductive
    organs sung over and swallowed or applied for strengthening or sexual desire;
    rules governing the distribution, cutting, and exchange of hair; cutting locks
    at the close of an initiation; and childbirth-related notification and actions
    by the husband during difficult labor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the recovering man has undergone the described operation, he must not speak
    to the women who took part, except his own Unazva, until he has given them meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women assemble away from the women's camp; the man, accompanied by male
    kin, silently places meat before them; the women rub him with red ochre, removing
    the silence ban; the meat is cooked and eaten at the women's camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For strengthening a delicate woman, animal ertoacha is placed on her body
    by her husband, sung over, and swallowed whole by the woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For promoting sexual desire, the same animal part may be half-cooked, greased,
    sung over, and given to a wife without her knowing its nature; fluid from it may
    also be applied to her body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man's hair is assigned to specific kin categories, including persons described
    as Ikuntera, Umbirna, mother-in-law, son-in-law, and brother-in-law relations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hair-string can be given as a valuable present or return for a favor, including
    to persuade the head man of a father's local totemic group to allow temporary
    removal of inherited Churinga.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a man cuts or has his hair cut, he squats facing the direction of the
    Alcheringa camp of his mother; failure to do so is said to bring calamity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the close of the Northern Arunta Ariltha initiation ceremony, the boy's
    elder sisters cut off a few locks of his hair and keep them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the distribution of a dead man's hair has already
    been mentioned, and that these hair-giving customs prevent the development of
    a strong rule that no stranger may obtain any hair fragment.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: At childbirth, a father is notified by an actual or tribal Mia; before birth
    the woman goes to the women's camp, and if labor is difficult the husband silently
    removes adornments and empties his bag or wallet onto the ground.
  category: sequence
  evidence_refs:
  - ev:9
