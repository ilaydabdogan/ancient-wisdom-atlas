canonical_text:
  quote: ''
  summary: 'The passage describes part of an Ambilyerikirra ceremony within initiation
    rites: Illpongwurra rush across a river and throw fire-sticks over women and children,
    then lie still overnight while a sacred Churinga is lifted repeatedly. In the
    morning the sacred object is carried toward the women''s camp, hidden beneath
    bodies, and returned. The passage reports local explanations for the fire-stick
    rush and the lying still, and notes that no explanation is given for the final
    carrying of the Churinga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Older men went to the women and children, held sticks and boughs over their
    heads, and told the women to do the same for protection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: At a signal, the Illpongwurra took bundles of fire-sticks, crossed the river,
    and divided into three parties around the women.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At another signal, the Illpongwurra threw fire-sticks over the heads of the
    women and children; shouting, screaming, and dogs' howling are described as producing
    confusion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the fire-stick throwing, the men returned to the Parra, lay down, and
    were not allowed to move.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The leader remained on the Engwura ground and, with two supporters, lifted
    the Ambilyerikirra up and down through the night; old men hid him from the returning
    Illpongwurra until morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the night, an old man watched the line of Illpongwurra, sometimes sang
    with the old men, and sometimes whispered instructions or information about the
    Alcheringa to the young men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shortly after five o'clock, the Illpongwurra were roused; the leader and supporters
    stopped lifting the Ambilyerikirra, and the Illpongwurra took boughs and formed
    a solid square behind the leaders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The main party, headed by three men bearing the Ambilyerikirra, crossed to
    the women, who beckoned and quietly called “kutta, kutta, kuttar.”
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Near the women, the carriers threw themselves down to hide the sacred object;
    the Illpongwurra piled on top, then rose, formed a square facing away from the
    women, and returned to the Engwura ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The passage identifies three leading incidents: fire-sticks thrown over the
    women, the Illpongwurra lying down all night before the rising and falling Ambilyerikirra,
    and the carrying of the sacred Churinga to the women''s camp.'
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports that the rush to the women's camp represents an attack
    by wild cat men, identified with the Illpongwurra not yet made Urliara, upon another
    party.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports that lying quietly before the Ambilyerikirra represents
    the taming of the wild Illpongwurra under the sacred Churinga, and that if the
    lifters' strength failed the Illpongwurra would die.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says the people had no idea of the meaning of the third incident,
    the carrying of the Churinga to the women's camp.
  category: other
  evidence_refs:
  - ev:9
