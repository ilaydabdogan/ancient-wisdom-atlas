literal_observations:
- id: obs:1
  text: An emu is prepared by plucking, cutting an incision, removing intestines,
    stuffing the inside with feathers, and closing the cut with a wooden skewer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pit is dug, a fire is lit in it, and the emu body is singed over the fire
    before being cooked with feathers and hot ashes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After cooking, the bird is removed, cut open around both sides, turned over,
    and the legs and meat are cut up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that Aboriginal people know tracks of beasts and birds
    and can infer from a burrow and the last track whether an animal is present.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Boys and girls are trained from early childhood to notice tracks made by living
    things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women are described as imitating animal tracks in sandy ground with their
    hands as an amusement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that individuals can distinguish tracks of particular men
    and women and can recognize footprints of acquaintances.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A cited observer, Dr. Eylmann, reported that tested sight and hearing were
    not on average better developed in Aboriginal people than in Europeans.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage contrasts strong ability in practical tracking with reported limitations
    in counting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Alice Springs, counting is described as sometimes reaching five, with quantities
