canonical_text:
  quote: ''
  summary: 'A section on initiation ceremonies describes Churinga associated with
    status, custody, hair growth, and ritual performance. It then describes two Oruncha
    ceremonies: one in which two decorated performers wearing Churinga move on all
    fours before old men, and another in which a performer wears a massive head-dress
    representing a man killed and carried by an Oruncha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The presentation of Churinga marks a young man as the recognised head of the
    local group of lizard people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Churinga at the Engwura is described as the only stone one present, elongate-oval,
    and about six inches long.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stone Churinga has a black charcoal band from end to end, with red ochre
    on either side; the black band represents long whiskers of a Jerboa-rat totem
    animal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rubbing the Jerboa-rat Churinga on a young man's chin is said to be beneficial
    for promoting hair growth on the touched part.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lizard man is said not to have absolute possession of the Churinga until
    he later gives a considerable quantity of hair-string to the Alatunja of the Unchalka
    or little grub group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two ceremonies are described as concerned with the Onmcha or Orunchertwa,
    with the word ertzva glossed as meaning man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Kulparra ceremony, two performers wear four Churinga fixed into their
    head-dresses and have bodies decorated with charcoal bands edged with white down.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Kulparra ceremony, old men beat boomerangs on the ground while the
    two performers run on all fours, chase one another, face one another, pretend
    to growl and frighten one another, then lie down before the old men and later
    embrace them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Chauritchi ceremony, the performer wears a massive head-dress made
    of Cassia bush twigs bound with human hair-string into a solid mass about two
    feet six inches in diameter and weighing at least thirty pounds.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Chauritchi performer's front head-dress and face are covered with white
    down, blue-gray wad bands ornament the shoulders and chest, and two down-ringed
    sticks project from the front of the head-dress.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Chauritchi performer sits on small gum-tree boughs, sways from side to
    side, brushes off flies with twigs, peers about, and sometimes crouches among
    the boughs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stated idea of the Chauritchi performance is that the performer is searching
    for men to catch and eat; the head-dress represents a killed man carried on the
    Oruncha's head.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
