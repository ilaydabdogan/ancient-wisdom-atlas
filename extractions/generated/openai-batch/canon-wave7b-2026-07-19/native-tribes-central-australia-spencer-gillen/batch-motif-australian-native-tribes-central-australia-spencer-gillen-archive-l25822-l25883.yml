canonical_text:
  quote: ''
  summary: The passage describes decorated objects and body ornaments used in ordinary
    corrobborees, notes that meanings of such designs are difficult to assign because
    performances circulate between groups and tribes, and contrasts them with sacred
    quabara undattha ceremonies. In the sacred ceremonies birds' down is characteristic,
    women and uninitiated youths are generally excluded, designs have definite significance,
    and some ceremonies or decorations are said to derive from the Alcheringa, spirits,
    or inheritance as private property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One rain-dance decoration uses a flat wooden piece shaped like a large Churinga,
    fixed to the top of a helmet and ornamented with lines and concentric circles
    of spots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some corrobborees use decorated objects such as hand-carried sticks or a specially
    formed pole painted with spiral yellow lines and white and yellow spots on a red
    ground.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A frequent decoration consists of green tree twigs tied to the leg just above
    the ankle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that it is impossible to assign a meaning to the ordinary
    designs because corrobborees circulate from group to group and tribe to tribe,
    and performers may not know the meanings of the chanted words.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Corrobborees performed at Alice Springs are described as derived from the
    north and filtering gradually southward.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ordinary body designs are described as generally accentuating the curves
    of the body, with no certain special significance beyond that.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: In sacred ceremonies, birds' down called midattha is the characteristic decorative
    material.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sacred performances called quabara undattha are not to be seen by women or
    uninitiated youths except on rare occasions and then only distantly and indistinctly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Only a limited number take part as actual performers in the sacred ceremonies,
    and the performances usually last only a few minutes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Unlike ordinary dances, the design used in sacred ceremonies is said always
    to have a definite significance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some sacred designs are said to have been handed down from the Alcheringa,
    while others are said to have been shown to the ceremony owner by Inmtarinia spirits.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sacred ceremonies are described as not being passed from tribe to tribe, but
    as belonging to certain individuals by inheritance and as private property.
  category: relationship
  evidence_refs:
  - ev:10
