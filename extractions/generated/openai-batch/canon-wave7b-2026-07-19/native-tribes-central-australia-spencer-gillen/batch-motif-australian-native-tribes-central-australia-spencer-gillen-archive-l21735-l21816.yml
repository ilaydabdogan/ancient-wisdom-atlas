canonical_text:
  quote: ''
  summary: The passage describes Alcheringa beings who possess extraordinary powers
    over movement and landscape formation, carry sacred Churinga objects associated
    with their spirit parts, and upon death go into the earth while the Churinga and
    spirit part remain. Natural rocks or trees become Nanja markers for particular
    individuals, and from a Nanja issues an Arumburinga, described as a spirit double
    or watcher. Groups of Iruntarinia are associated with local totem centres; they
    wander in summer and dwell in underground caves in winter. The passage also describes
    Arumburinga attending spirits entering women, assisting favored hunters, warning
    humans of danger, visiting human representatives, and the Uthana or ghost of a
    dead person haunting a burial place, camp, or old Nanja.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Alcheringa beings are described as able to travel on, above, or beneath the
    ground and to alter the landscape by producing floods, plains, pools, gorges,
    gaps, rocks, or trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each Alcheringa being carried a sacred object, a stick or stone called a Churinga,
    associated with that being's spirit part.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: When such a being died and went into the earth, the Churinga and spirit part
    remained behind, and a natural rock or tree arose to mark the spot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The natural rock or tree marking the place was called the Nanja of the spirit
    of the individual it represented.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: From the Nanja there issued another spirit being called the Arumburinga of
    that individual.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The spirit resident in the Churinga is closely associated with, and watched
    over by, an Arumburinga.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At each local totem centre there is a group called the Iruntarinia, consisting
    of spirits associated with Churinga or Arumburinga spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Iruntarinia wander especially in summer and spend much of the winter in
    underground caves with running water and perpetual sunshine.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: An ancient hollow tree near Alice Springs is said to be a favored entrance
    of district Iruntarinia into caves stretching underground for many miles.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a spirit individual goes into a woman, its Arumburinga remains and may
    dwell with the Iruntarinia, follow the spirit in the woman, or attend the woman's
    husband while hunting.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Spirit people may follow favored men during hunting and assist them by driving
    prey toward them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In an example, a hunter suddenly looks down and sees a snake where he was
    about to step, and this is taken as a sign that his Arumburinga prompted him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Arumburinga can travel long distances, spend time at the Nanja tree or rock,
    visit a human representative, become visible to spirit-seers, or send messages
    through gifted men.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: After a man or woman dies and the body is buried, the Uthana or ghost is said
    to haunt the burial place, come into camp at night, or return to its old Nanja
    rock or tree.
  category: sequence
  evidence_refs:
  - ev:12
