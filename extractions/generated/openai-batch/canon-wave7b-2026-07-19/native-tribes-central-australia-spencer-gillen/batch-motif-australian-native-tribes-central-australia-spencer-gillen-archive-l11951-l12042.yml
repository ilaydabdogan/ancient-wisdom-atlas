canonical_text:
  quote: ''
  summary: 'The passage describes part of an Ariltha initiation sequence: dancing
    with the Nurtunja, the two Arakurta embracing the Nurtunja before the operation,
    selection of men to serve as Tapunga, the sub-incision performed by the Pininga
    with a stone knife, the transition of the initiands to Ertwa-kurka status, blood
    draining into shields and then into a fire, post-operative relief practices, and
    food restrictions during recovery.'
  language: English
  quote_policy: summarized
