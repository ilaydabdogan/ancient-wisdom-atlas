    fighting like a pick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage gives local names and circulation: Kaitish call the weapon Wialka,
    Warramunga call it Wartilkirri, and Arunta obtain theirs from the Warramunga and
    call them Ilya ilporkita.'
  category: relationship
  evidence_refs:
  - ev:6
