literal_observations:
- id: obs:1
  text: A distinct boomerang type is reported across a broad central region, from
    the Gulf of Carpentaria southward at least to Charlotte Waters and probably farther
    south.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The weapon has a flattened blade and a long beak or hook at the distal end;
    it is made from one piece of wood selected from a tree branch or root set at a
    suitable angle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The beak varies in length and width, and the convex side of the weapon is
    ornamented with grooves following the concave edge of the beak.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The weapon may be coated with red ochre and decorated on the beak/head end
    with white, black, and yellow bands and lines of spots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage notes a constant discontinuity between the curve of the beak and
    the curve of the blade, forming a small projection or notch near the head end.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Roth explains the hook as catching a defender’s stick or boomerang, causing
    the weapon to swing around and strike the person at whom it was thrown.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The authors state that they did not observe Roth’s described action in the
    Arunta, but did see the hooked weapon thrown so that the beak made a severe wound
    on a man’s neck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Broken hooked boomerangs could be trimmed to remove the remains of the beak
