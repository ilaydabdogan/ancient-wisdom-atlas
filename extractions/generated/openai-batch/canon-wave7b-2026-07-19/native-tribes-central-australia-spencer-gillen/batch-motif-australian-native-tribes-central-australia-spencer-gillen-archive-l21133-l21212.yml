canonical_text:
  quote: ''
  summary: 'The passage describes Arunta burial and mourning practices: the body is
    buried soon after death in a seated posture in a round grave with a mound depression
    facing the deceased person''s Alcheringa camping ground; this depression is said
    to permit movement of the Ultiana spirit. The passage also describes handling
    of hair, ornaments, and occasional grave objects; burning and abandoning the death
    camp; Warramunga tree-platform exposure followed by bone burial; and restrictions
    on speaking the dead person''s name during mourning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Arunta tribe, the body is buried shortly after death in a sitting position
    with knees doubled up against the chin, in a round hole covered by a low mound
    with a depression on one side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grave depression is made on the side facing the direction of the deceased
    person's Alcheringa camping ground, described as the place inhabited while in
    spirit form.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated purpose of the depression is to allow easy ingress and egress for
    the Ultiana spirit, which is said to spend time in the grave, near relatives,
    and with its Aruniburinga at the Nanja spot until the final mourning ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a dead man, the hair is cut from his head, and necklaces, armlets, and
    fur string used around the head are preserved for later use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that objects ordinarily used are generally not buried,
    except that the Eastern Arunta may sometimes bury a small wooden vessel, and the
    Udnirringita people may bury round stone Churinga representing witchetty grub
    eggs in the Alcheringa.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: After burial, the camp in which death occurred is burnt down, its contents
    are destroyed, and the local encampment is moved to a new place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Warramunga and northern tribes, the body is placed on a bough platform
    in a tree until the flesh has disappeared; the bones are then taken down and buried,
    except smaller arm bones used for pointing bones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the mourning period after a man's death, lasting twelve to eighteen
    months, the deceased person's name should not be mentioned except when necessary,
    and then only in a whisper.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says that if the Ultiana hears its name mentioned, it concludes
    that relatives are not mourning properly and may trouble them in their sleep.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that degrees of silence vary according to the relationship
    between the dead person and the living person.
  category: relationship
  evidence_refs:
  - ev:7
