    be used as a substitute.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The decorations of the Kauana consist of ornaments worn on a fully decorated
    man's head, so that the upper end of the wooden pole represents a human head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Kauana is erected only toward the close of the Engwura, when men gather
    around it and old men paint the backs of younger men with designs of various totems.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Unlike the Nurtunja and Waninga, the Kauana has only one form and is common
    to all the totems.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The authors state that they could not discover an Indigenous account of the
    Kauana's origin or meaning, so its exact significance is conjectural in the passage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that among the Arunta, trees are associated with particular
    celebrated individuals of the Alcheringa, whose spirits especially frequent their
    Nanja trees.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that offerings are not made to the tree or to its spirit
