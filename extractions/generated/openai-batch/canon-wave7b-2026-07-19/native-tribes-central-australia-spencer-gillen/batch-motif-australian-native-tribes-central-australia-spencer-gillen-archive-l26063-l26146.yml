canonical_text:
  quote: ''
  summary: 'The passage explains that Nurtunja and Waninga objects have context-dependent
    totemic meanings rather than fixed resemblance. It then describes the Kauana as
    the tribe''s most sacred ceremonial object: a wooden pole cut and carried without
    touching the ground, smeared with human blood or sometimes red ochre, decorated
    like a man''s head, and erected near the end of the Engwura while older men paint
    totemic designs on younger men''s backs. The authors add conjectural interpretations
    linking the Kauana to trees, spirit individuals, collective totemic identity,
    and possibly a great ancestor, while noting that the Indigenous explanation of
    its origin or meaning was not obtained.'
  language: English
  quote_policy: summarized
