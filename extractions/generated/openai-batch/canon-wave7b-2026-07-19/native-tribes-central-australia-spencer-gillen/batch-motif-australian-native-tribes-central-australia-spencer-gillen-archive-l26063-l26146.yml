- id: obs:1
  text: The Nurtunja and Waninga can be identical in form in different ceremonies
    while representing different animals or plants associated with the relevant totem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A part of a Waninga may represent a kangaroo head in one ceremony and a lizard
    tail in another ceremony.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a ceremony, the Nurtunja or Waninga represents the animal or plant that
    gives its name to the totem concerned in that ceremony.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the decorations of the Nurtunja and Waninga appear
    arbitrary and are not evidently meant to resemble the represented object.
  category: attribute
  evidence_refs:
