canonical_text:
  quote: ''
  summary: A messenger’s whispered offer of a few Churinga initiates an understood
    request to borrow more. After acceptance, a deputation visits the Strangway Range
    emu men, is received with silence, embraces, whispers, and ceremonial hospitality.
    Women and younger recent initiates are excluded from parts of the proceedings.
    Selected Churinga are prepared, placed in a decorated shield, solemnly lent with
    low-voiced speeches, taken back by a guarded route, hidden in a sacred store-house,
    and later returned after more than two years amid emu-totem ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger asks the Alatunja to take care of a few Churinga, and the unspoken
    purpose of requesting a larger loan is understood from this action.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Alatunja may refuse by declining to keep the offered Churinga; in this
    case he accepts them, implying willingness to lend Churinga in return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the messenger reports success, the borrowing group’s Alatunja organizes
    and leads a deputation to the Strangway Range group of emu men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deputation halts before the main camp, sends a messenger ahead, and is
    met by the local Alatunja and older men, who sit silently, embrace the visitors,
    and discuss the Churinga in whispers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Recently initiated men may accompany such deputations but are not yet allowed
    to see everything, including close viewing of stone Churinga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitors are taken to the corroboree ground after dark, where a performance
    is given in their honor, including a performance associated with the visitors’
    district.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of the visit, after women have been sent away from the corroboree
    ground, the local Alatunja and older men go to the sacred store-house and choose
    Churinga to lend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Churinga are inspected, greased, rubbed with red ochre, and stacked in
    an elaborately decorated shield.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: At daylight the Churinga are handed to the visiting Alatunja with low-voiced
    statements that they are to be kept safely and need not be returned quickly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The leader of the visiting deputation replies in low tones that the Churinga
    will be watched over carefully and returned later, praising the emu Churinga and
    emu men.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The deputation departs waving spears and shouting an exclamation used to denote
    fear or danger and to frighten women and children away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The return journey follows the least frequented path to reduce the chance
    of meeting women; after arrival, old men inspect the Churinga and hide them with
    their own in the sacred store-house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After more than two years, the borrowed Churinga are returned, with the return
    ceremony arranged at a place on the Todd River within the borrowing group’s district.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: While awaiting the returning party, the Strangway Range Alatunja and his men
    perform night ceremonies concerned with the emu totem in a specially cleared space.
  category: action
  evidence_refs:
  - ev:10
