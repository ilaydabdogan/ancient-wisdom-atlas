canonical_text:
  quote: ''
  summary: The passage describes Arunta initiation performances called Quabara in
    which dog and kangaroo figures enact ancestral incidents before a novice. The
    novice is instructed about the Alcheringa meaning of the performances, sacred
    totemic objects such as the Waninga, and the broader connection between totemic
    animals, ancestors, and reincarnated spirit-parts. The passage also notes local
    variation in ceremonial objects and compares Arunta and Ilpirra initiation performances
    with other Australian initiation ceremonies involving totemic animal dances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dog performer is shaken, his head is pretended to be dashed against the
    ground, he howls as if in pain, and the action is repeated until the dog is supposed
    to be killed by the kangaroo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the dog-kangaroo action, the dog lies on top of the novice and the kangaroo
    lies on top of both, so that the novice bears the weight of two men for about
    two minutes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old men tell the novice that the Quabara represents an Alcheringa incident
    in which a wild dog-man attacked a kangaroo-man and was killed by him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The kangaroo performer wears a Waninga on his head; the passage states that
    it is sacred, belongs to the kangaroo totem, represents a kangaroo, and must not
    be mentioned before women and children.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The performed Quabara vary according to locality and the men leading the ceremony;
    the presiding old man’s totem and ritual rights shape which Quabara are performed,
    while the novice’s totem does not.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage contrasts districts where the Waninga is used with northern Arunta
    and Ilpirra districts where a sacred pole called a Nurtunja has the same significance.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the fifth day, two kangaroos and one dog perform; the kangaroos wear small
    Waninga and carry blood-soaked wooden shavings that are said to represent bite
    wounds from dogs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the fifth-day performance, the dog and then the two kangaroos get on top
    of the novice, after which he is instructed, cautioned, and returned to his brake.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On the sixth day, the novice is taken hunting by Okilia and Uuibirna men,
    and at night he listens to songs about wanderings of Alcheringa ancestors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says the novice is hearing these traditions and seeing these ceremonies
    for the first time, and that the ceremonies represent tribal ancestors as they
    were and acted during life.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that initiation ceremonies in many Australian tribes include
    performances representing different animals or the actions of special totemic
    animals.
  category: other
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: The passage states that in the Arunta case each performer represents an ancestral
    individual who lived in the Alcheringa and belonged to a group descended from
    or transformed from animals, plants, or other named beings.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that each tribal member is born as a reincarnation of the
    never-dying spirit part of one of these semi-animal ancestors.
  category: relationship
  evidence_refs:
  - ev:12
