canonical_text:
  quote: ''
  summary: A water-totem Intichiuma ceremony is convened by the Chantchwa, who summons
    surrounding groups through accredited messengers carrying specified objects. The
    men of the totem assemble with paint and feather ornaments, sing, leave camp in
    single file, hunt and eat game while abstaining from water, and repaint with bird
    down fixed by blood. Older men build a bough hut called nalyilta near the main
    camp. At sunset the participants return; young men lie face downward inside the
    hut, while older men decorate the Chantchwa. The Chantchwa stands near the hut
    opening and a shallow trench, while old men sing; he then walks twice along the
    trench with pronounced quivering movements, and the young men join the singing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Chantchwa sends messengers called Inwirra to surrounding groups to announce
    the ceremony and call members of the totem together; other men are invited but
    are not allowed to take part in the actual ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each messenger carries a human hair girdle, black cockatoo tail feathers,
    and a hollow nose bone stopped with porcupine-grass resin and ornamented with
    owl feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Refusing the request of such an accredited messenger is described as a grave
    discourtesy and as churlish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men of the totem march into camp painted with red and yellow ochre and
    pipeclay, wearing eagle-hawk feathers on the crown and sides of the head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a signal from the Chantchwa, the men sit in a line with arms folded and
    sing; at another signal they rise and silently march out of camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men walk in single file, camp some miles away, scatter at daybreak to
    find game, cook and eat it, and must not drink water because the ceremony would
    fail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After eating, the men paint themselves again with broad white bands of bird
    down fixed with human blood around the stomach, legs, arms, and forehead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some older Purula and Kumara men build a special bough hut or wurley called
    nalyilta near the main camp, with a floor softened by a thick layer of tium leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women and men not taking part in the ceremony remain behind at the main camp.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At sunset the decorated men return silently in single file to the hut, and
    the young men enter first and lie face downward at the inner end until the ceremony
    is over.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Older men outside the hut decorate the Chantchwa with white-down-covered hair
    girdles, pipeclay on cheeks and forehead, white-down bands across the face, a
    pipeclay band on the body, and rings on the arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The decorated Chantchwa takes a position near the hut opening, from which
    a shallow trench extends for thirty yards.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old men sitting around the Chantchwa sing a set of ceremonial words.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the singing ends, the Chantchwa comes out of the hut, walks slowly twice
    up and down the trench, and quivers his body and legs while the young men and
    old men sing.
  category: action
  evidence_refs:
  - ev:7
