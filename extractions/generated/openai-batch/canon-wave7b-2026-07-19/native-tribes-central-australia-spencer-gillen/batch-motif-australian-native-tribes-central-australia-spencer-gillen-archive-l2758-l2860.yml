canonical_text:
  quote: ''
  summary: The passage describes Spencer and Gillen's terminology for Australian social
    divisions, presents the Urabunna tribe as organized into two exogamous intermarrying
    classes called Matthurie and Kirarawa, lists selected totemic groups associated
    with those classes, states rules for interclass and intertotemic marriage, and
    says descent in class and totem is counted through the mother. It also compares
    the Urabunna organization with that of the neighboring Dieri and notes uncertainty
    about the exact range of intermarrying totems.
  language: English
  quote_policy: summarized
