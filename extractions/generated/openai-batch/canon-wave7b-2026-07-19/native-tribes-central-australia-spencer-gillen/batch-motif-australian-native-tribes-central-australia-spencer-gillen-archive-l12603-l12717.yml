canonical_text:
  quote: ''
  summary: The passage introduces the Engwura or Urumpilla as a long sequence of ceremonies
    concerned with totems and ending in ordeals by fire. It describes the ceremony
    as the last initiatory process through which a man becomes a fully developed member
    of the tribe, explains stated effects and aims, notes the gathering of tribal
    members and elders, and outlines the first three of five phases, including messengers,
    dances, separation from women, sacred ceremonies, abmoara relationships, Illpongwurra
    status, twigs, a frog-totem ceremony, and bull-roarers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Engwura, also called Urumpilla in some parts of the tribe, is described
    as a long series of ceremonies concerned with totems.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Engwura is said to terminate in ordeals by fire that form the last initiatory
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After passing through the ceremonies, a native becomes Urliara, described
    in the passage as a perfectly developed member of the tribe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The terms discussed are said to be formed partly from the word ura, meaning
    fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The natives are reported to say that the ceremony strengthens those who pass
    through it and imparts courage and wisdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stated main objects include bringing young men under the control of old
    men, teaching self-restraint and hardihood, and showing sacred secrets concerning
    Churinga and associated totems.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men and women gather for the ceremony from all parts of the tribe, and sometimes
    from other tribes, with a central position preferred for large performances.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old men meet during the gathering to discuss tribal matters, repeat traditions,
    and pass on unwritten history from generation to generation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The witnessed ceremony lasted from the middle of September to the middle of
    the following January and included ceremonies every day, sometimes several within
    twenty-four hours.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first phase includes sending messengers, assembling the tribe, introductory
    corrobborees, building the Parra on the Engwura ground, and beginning sacred ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the first phase, ordinary dancing corrobborees at night include women,
    after which women take no further share until near the end of the ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the second phase, men are separated from women and live on the Engwura
    ground while sacred ceremonies are performed day and night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During the second phase, men being initiated are made abmoara to certain elder
    men who take charge of them, after which they are called Illpongwurra.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the third phase, the Illpongwurra wear twigs of a special shrub and may
    not speak to their abmoara men.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: The third phase continues until a special ceremony connected with the frog
    totem; young men are brought onto the Engwura ground with the sound of bull-roarers,
    which are then much used.
  category: sequence
  evidence_refs:
  - ev:8
