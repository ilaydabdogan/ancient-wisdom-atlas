canonical_text:
  quote: ''
  summary: 'The passage describes part of an initiation-ceremony sequence: ten men
    are connected by a decorated human-hair rope and represent gum trees and bats;
    an eleventh bat-like dancer performs before them; a spear signal stops the performance;
    performers touch down to two men''s stomachs; later the Illpongwurra are driven
    with bull-roarers and have fire thrown over them; news arrives of a medicine man''s
    death attributed to evil magic.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten men stood in a row parallel to the Parra and were connected by a decorated
    rope of human hair-string passed through each man's hair waist-girdle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four of the connected men had Churinga on their heads and were said to represent
    special gum trees near Imanda; the long rope was said to be the roots of the trees.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other six connected men were said to be bats resting in the trees.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: An eleventh man was not attached to the rope and had different body decoration,
    including charcoal bands outlined with red down.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eleventh man danced in a stooping posture, made a shrill whistling noise
    compared to a small bat, and carried twigs that he rubbed together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ten connected men moved in line first to the right and then to the left
    while the eleventh man danced in front of them in the light of the camp fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At a signal from the leader of the Engwura, two men from the audience held
    long spears behind the performers so that the spears touched each man's back as
    a signal to stop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each performer touched a piece of down first to the stomach of the leader
    and then to the stomach of the old white bat man to whom the ceremony belonged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the next day ceremonies were held as usual, but there was no fire-throwing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At sunrise on the following morning the Illpongwurra were driven out of camp
    to the sound of bull-roarers by way of the women's camp, where fire was again
    thrown over them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the evening the same ceremony was repeated at sunset when the Illpongwurra
    were brought into camp over the ranges on the eastern side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The following day the Illpongwurra were taken west and did not go near the
    women's camp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: News was brought of the death of a very old and celebrated medicine man living
    far to the west, and the speakers said that his death was due to evil magic.
  category: speech
  evidence_refs:
  - ev:5
