canonical_text:
  quote: ''
  summary: The passage describes a segment of the Arunta Lartna initiation ceremony.
    Men position themselves by the fire and Apulia path; a shield bearer kneels with
    a shield while bull-roarers sound. Women and children are said to believe the
    sound is the voice of the spirit Twanyirika. The novice is carried feet foremost
    and placed on the shield; the Lartna song is sung; the operation is performed.
    Afterwards the novice is supported, praised for not crying out, and blood is allowed
    to flow into a shield connected with a later food offering. An Okilia shows him
    the bull-roarers, telling him that they, not Twanyirika, made the sound, and that
    they are sacred Churinga not to be shown or mentioned to women. Officials are
    then signaled back, named with a prohibition on mentioning their names, and embrace
    the novice.
  language: English
  quote_policy: summarized
