canonical_text:
  quote: ''
  summary: Glossary entries define terms for Arunta and neighboring ritual, totemic,
    kinship, magical, punitive, and ceremonial practices, including Engwura initiation
    terms, totemic designs and ceremonies, ceremonial messengers, protective markings,
    magical objects, avenging parties, medicine men, and spirit representation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A part of the internal reproductive organs of male animals such as kangaroo
    or opossum is identified as an object used for magic purposes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An offering of food called Ertwa-kirra is made by men who have passed through
    the Engwura to old men who had charge of them during the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some terms distinguish men who have been circumcised and subincised but have
    not passed through Engwura, and men who are passing through Engwura.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A black line painted above the eye of a newborn child is said to prevent sickness;
    the same term also names a line above a hole in the Eratliipa stone through which
    children are supposed to peer out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Special messengers summon local groups to Engwura or other ceremonies; one
    messenger type carries one or more Churinga.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A knout made by the Warramunga is described as endowed with magic power and
    used to frighten women, while whittled sticks worn in the hair indicate men are
    going to fight.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sacred designs are associated with different totems, including a special ground
    design for the emu totem.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: During the emu totem Intichiuma ceremony, named men represent descendants
    or ancestors of the totemic group.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman may go out to kill another woman who has offended against tribal custom;
    other terms identify a punishment party and men taking part in killing during
    an avenging expedition.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Animals, usually birds, may be described as mates specially associated with
    members of particular totems.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A shallow cave or hole may contain a sacred stone representing a stage in
    the development of the witchetty grub.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Bark throwing is named as part of circumcision ceremonies, and a grass ring
    bound with human hair and decorated with down is used in a sacred Irriakura totem
    ceremony.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Incomplete human beings are described as having been transformed into men
    and women.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Pointing sticks worn like horns on the head of a performer represent an Ortuicha,
    described as a mischievous spirit.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: A medicine man is named for the southern part of the Arunta tribe, with an
    equivalent term in the northern part.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:16
  text: A ceremonial running style with exaggerated high knee action is named, and
    a named individual takes charge of the newly initiated man when the women’s camp
    is visited after subincision.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Several animals and plants give their names to totems, including wild turkey,
    beetle grub, lizard, rat, fish, pigeon, and a Claytonia seed.
  category: relationship
  evidence_refs:
  - ev:15
