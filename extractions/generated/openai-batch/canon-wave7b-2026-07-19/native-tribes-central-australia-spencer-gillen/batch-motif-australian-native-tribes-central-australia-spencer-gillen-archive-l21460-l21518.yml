canonical_text:
  quote: ''
  summary: After the widow's Chimurilia and related adornments are put on, a led party
    proceeds first to the deceased man's burned camp and then to his grave. At the
    camp and grave, participants shout, dance, beat the air with spear-throwers or
    hands, and stamp on the grave covering. The stated aim is to drive or frighten
    the dead man's spirit from its former camp and down into the grave, while specified
    women mourn differently by wailing and lying on the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the putting on of the Chimurilia and related items was complete, the
    party was led by the man who had superintended that part of the proceedings; each
    man carried a shield and spear-thrower.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: No words were spoken during the movement, and the only sound noted was the
    wailing of the women.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party first visited the camp where the man died, and the passage states
    that a dead person's camp is at once destroyed by fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the old camp, participants danced around the charred remains and shouted;
    men beat the air with spear-throwers while women beat the air with their palms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated idea of the action at the old camp was to drive away the spirit,
    which was supposed to haunt that camp.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women identified as Alia, Uzuiujia, and Mura of the dead man did not shout
    or move their arms, but wailed loudly and threw themselves on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the dancing at the camp, the whole party proceeded to the grave at a
    run while the leader made a circuit away from the main party and shouted prolonged
    calls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the circling movement may have been meant to prevent the
    spirit from returning to the camp, though the natives gave no explanation for
    it.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the spirit is thought to be frightened by the noise
    and by seeing the widow approaching in Chimurilia, and that it takes refuge at
    the bottom of the grave.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the grave, the leader jumped onto it and danced wildly, and the others
    danced on and around the grave except for the Alia, Uzuiujia, and Mura women,
    who lay nearby.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Participants shouted and beat the air downward as if to drive the spirit down,
    while stamping on and breaking the twigs covering the newly made grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the grave-covering twigs were thoroughly broken, the dancing ceased and
    the men separated from the women.
  category: sequence
  evidence_refs:
  - ev:8
