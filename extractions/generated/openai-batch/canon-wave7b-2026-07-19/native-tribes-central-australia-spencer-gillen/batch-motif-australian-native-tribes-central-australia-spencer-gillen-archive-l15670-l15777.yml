canonical_text:
  quote: ''
  summary: The passage describes parts of the Engwura ceremonies, including fire-throwing,
    totem ceremonies, the making and display of different Nurtunja, preparation and
    concealment of the Ambilyerikirra, cutting and hiding of a gum-tree Kauaua or
    sacred pole, and a silent evening sequence involving the Illpongwurra, the leader,
    assistants, branches, fires, and arranged sticks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men as well as women took part in fire-throwing, and some men were scorched
    when they did not shield themselves effectively with boughs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ceremonies of the kangaroo, wild cat, and bandicoot totems were performed
    during the next two days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A kangaroo ceremony associated with Undiara used a Nurtunja made from twenty
    long spears lashed together, eighteen feet high, with fourteen Churinga attached,
    and was performed at daylight.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Night singing was mainly concerned with putting up the Kauaua or sacred pole,
    whose erection marked the close approach of the end of the Engwura.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wild cat ceremony used a Nurtunja representing one said to have belonged
    in the Alcheringa to wild cat men near Imanda and later to have been carried north
    to Arapera.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Northern Bukhara and Panunga men made the wild cat Nurtunja without southern
    men present, then called the southern men and showed it to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A wild cat man from near Imanda and the leader of the Engwura were embraced
    and had their hands pressed or placed on the Nurtunja to assuage grief caused
    by seeing an object that had passed from their country to another wild cat group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The leader of the Engwura and men of his locality prepared the Ambilyerikirra
    from two large wooden Churinga bound with human hair-string, covered with white
    down, ornamented with owl feathers, and hidden in the creek bed from the Illpongwurra.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Three older men cut a young gum tree about twenty feet high to serve as the
    Kauaua; it was not allowed to touch the ground before reaching the Engwura ground,
    and it was then hidden in the creek bed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At sunset the Illpongwurra returned from the west, did not go to the women's
    camp, and after another ceremony came to the Parram, where silence was maintained.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men placed branches of Eremophila on a long heap and lay with their heads
    on the Parram while the leader sat in front with a Bukhara man and a Kumara man
    assisting him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Shortly before nine o'clock, after a period of silence and whispers, small
    fires were made and bundles of sticks were arranged in radiating groups.
  category: sequence
  evidence_refs:
  - ev:7
