canonical_text:
  quote: ''
  summary: The passage describes restrictions on certain female kin visiting a brother's
    camp and speaking with his wife only in darkness, notes an unexplained younger-sister
    tabu affecting inheritance of Churinga, and summarizes tables of intermarrying
    groups and equivalent named social categories across several Central Australian
    tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uvgaraitcha and Qiiitia may go at night to their brother's camp if the brother
    is present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When sitting in darkness where their faces are not distinguishable, Uvgaraitcha
    and Qiiitia may converse with the brother's Unazi'a or wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that they cannot discover an explanation for the restriction
    concerning the younger sister and question whether it is related to fear of incest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies a form of tabu, called ckirinja by Arunta people, in
    regard to the younger sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man can never inherit the Churinga of a deceased younger sister but does
    inherit those of a deceased elder sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The following tables are said to give intermarrying groups of seven other
    tribes corresponding to those of the Arunta tribe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Ilpirra groups are identical with the Arunta groups
    and that the Arunta groups in their present form have been derived from the Ilpirra
    tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the tabular rule, men of column 1 marry women of column 2 and their children
    are arranged in column 3; men of column 2 marry women of column 1 and their children
    are represented in column 4.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Warramunga, Bingongina, and Walpari are said to add distinct female names,
    printed in brackets, to the system.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Warramunga examples state that a Thapanunga man marries a Naralu, with
    male children named ThajDungerta and female children named Xapungerta, and that
    a Chupilla man marries a Xapanunga woman, with male children named Thakomara and
    female children named Nakomara.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The tables are arranged to show equivalent groups across tribes at a glance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: An Ilpirra Panunga man is regarded as a Pungarinju among the Waagi and as
    a Tchana among the Bingongina; an Ilpirra Purula woman is regarded as an Upilla
    among the Iliaura and as a Xala among the Bingongina.
  category: relationship
  evidence_refs:
  - ev:6
