canonical_text:
  quote: This particular Waninga was emblematic of the Ouatcha, or water totem.
  summary: The passage describes a Waninga used in an initiation context, its construction
    from a long spear, crossbars, hair-string, fur string, feathers, down, ochre,
    and blood, and the meanings assigned to its parts in a water-totem ceremony. It
    also explains that Waninga and Nurtunja can serve the same totemic emblem function
    in different regions, that Waninga forms vary in meaning by totem, and that novices
    and younger men receive ritual instruction in this context.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Performers advanced slowly toward seated men; a Kumara man removed the Waninga
    and put it aside; the performers then sat down and were pressed on the shoulders.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Waninga was made from a ten-foot desert-oak spear, two transverse sticks,
    tightly strung human hair-string, opossum fur string, red ochre, black cockatoo
    feathers, white down, and other decorative elements.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described Waninga took several hours to prepare and is said to show ingenuity
    and artistic capacity by its makers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Ouatcha or water totem, the red string represented thunder, the white
    band lightning, the ordinary uncoloured string rain, white down clouds, and red
    feathers and blood dirty brown froth on flood waters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Waninga and Nurtunja may have the same significance
    as emblems of the particular totem associated with a ceremony, though their regional
    use differs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In some southern localities, when circumcision is practised, a Waninga is
    made, used in a sacred ceremony, fixed in the ground, and embraced by the novice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Charlotte Waters, several totems are said to use the Waninga, including
    lizard, kangaroo, euro, and water.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Irrunpa or lizard Waninga is similar in structure to the water Waninga
    but its parts represent lizard body parts, including head, neck, fore limbs, body,
    legs, and tail.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Old men instruct younger men during the Engwura about the doings and wanderings
    of ancestors in the Alcheringa.
  category: speech
  evidence_refs:
  - ev:7
