canonical_text:
  quote: ''
  summary: In an initiation ceremony, men decorate themselves and a Wurtja is painted
    on the back with an Okranina or carpet-snake totem design from Tharlinga. The
    design is explained as a snake hole with snakes around it. Arachitta poles are
    brought in, crossed in two parties, deposited on either side, and later fastened
    to legs. At dusk, ritual attendants reveal the crouching Wurtja, move with him
    on all fours to the Apulia, and he lies on an Urinthantinia man. The design is
    explained and then rubbed out by two old women with their foreheads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the council ended, the men decorated themselves with various patterns;
    the two Atwia atwia were marked prominently on the face and their cheeks were
    blackened with charcoal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wurtja remained crouching at his brake before a newly appointed painter
    and two men of the same name came to paint his back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The back design was identified as the Okranina or carpet-snake totem of Tharlinga;
    the passage notes that the painter was not obligated to paint either his own totem
    or the boy's totem.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before drawing, the newly appointed painter rubbed the boy with grease; the
    design was made in white pipe-clay and consisted of central concentric circles
    with corkscrew-like lines around them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The concentric circles were said to represent the snake's hole in the ground,
    while the surrounding lines were said to represent snakes playing around the hole.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: While the painting proceeded, an old Ipinunna man sang in a low monotonous
    voice about the snakes of Tharlinga.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the painting was finished, an Okilia placed two bunches of owl feathers
    in the Wurtja's hair and brought the two Atwia atwia to inspect the drawing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men who had made the Arachitta poles ran away shouting, brought the poles
    back, separated into two parties, crossed in front of the Wurtja in opposite directions,
    and deposited the poles on either side of him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports the native explanation for the pole movement as that it
    was done that way in the Alcheringa, and also notes that the authors found no
    evidence that the two parties were divided by moiety.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Just before dusk, two Okilias stood at the eastern ends of the raised banks
    with their arms bent so that each hand lay in the armpit, palm facing backward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Men sang a line translated as 'Hark to the lizards in the tree,' and women
    who had been waiting out of sight came to stand in two groups to the left and
    right of the Apulia.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The two Okilias came down, tore down the bushes hiding the Wurtja, knelt on
    either side of him, and the three moved quickly on all fours to the Apulia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the Apulia, the Wurtja lay on top of the Urinthantinia man, who was lying
    on his back, and the two remained in that position for about ten minutes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Some women sat behind Oknia figures while men and women helped fasten Arachitta
    poles to the legs of those who were about to wear them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After about ten minutes, the Urinthantinia man wriggled out from under the
    boy, who remained face down on the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The old Ipinunna man explained the design on the Wurtja's back and called
    two old women, also Ipinunna to the boy, to rub out the design; they effaced it
    by rubbing it with their foreheads.
  category: action
  evidence_refs:
  - ev:7
