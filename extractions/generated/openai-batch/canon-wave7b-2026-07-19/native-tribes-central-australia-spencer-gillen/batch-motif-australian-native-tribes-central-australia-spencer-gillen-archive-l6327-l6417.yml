canonical_text:
  quote: '"the totem of the child is simply determined by that of the mother"'
  summary: The passage contrasts Australian totemic systems across regions, emphasizing
    differences between central and eastern or south-eastern groups. It describes
    the Urabunna as organized by female-line descent, two classes named Matthurie
    and Kirarawa, class-specific totems, prescribed interclass and intertotem marriages,
    and children inheriting the mother's class and totem. It then notes that the Arunta,
    immediately north of the Urabunna, have a different organization.
  language: English
  quote_policy: quoted
