canonical_text:
  quote: ''
  summary: The passage recounts movements of several Alcheringa ancestor parties associated
    with the Udnirringita or witchetty grub tradition. Parties travel through named
    places, paint themselves with Ilkinia designs, eat grubs, perform ceremonies,
    leave named individuals, and are stopped by Intwailiuka at entrances to Emily
    Gap. Waterholes and stone groups mark certain stops, and some parties travel underground
    or enter and emerge from the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Unthurqua or Emily Gap, Intwailiuka warned a party not to come further,
    and they sat down at the northern entrance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A party from the west near Mount Heuglin included women and was led by a Panunga
    man named Ilpiriiwuka.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ilpiriiwuka became angry when Intwailiuka would not allow him into the sacred
    precincts of Emily Gap, left his party, and returned to Ulathirka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The western party painted their bodies with Ilkinia designs and made Intichiuma
    at Atnamala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Yia-pitchera and Nang-wulturra the party painted themselves, ate grubs,
    and waterholes were formed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Charles Creek, Ilpillachilla, and Kiula, the party performed sacred ceremonies
    or decorated themselves, and left named or described individuals behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a spot later indicated by a great heap of stones, the party stopped to
    listen for Intwailiuka and heard him singing about the coming of a Panunga man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After leaving a Panunga man named Ilpiriiwuka, the party met local Udnirringita
    people, joined them, went into the ground, and came out at the western entrance
    to the gap.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Where the joined party sat down after being warned, black stones arose to
    mark the spot.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Intwailiuka later led the party to Ilthura Oknira, where they assisted him
    to perform Intichiuma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A party from Wulpa was led by an old Panunga man named Akwithaintuya and first
    travelled underground to Yinthura.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Wulpa party made quabara nndattha, ate Udnirringita, travelled above ground
    to further places, left individuals, and made Engwura at a clay-pan.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The Wulpa party reached the southern entrance to Emily Gap, where Intwailiuka
    stopped them; a group of stones marks the spot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the Wulpa party arrived, Ariltha was performed on some members by a
    medicine man named Urangara.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Another party from Unthurkunpa was led by a Bukhara named Intwailiuka, whose
    living descendant is described as the present Alatunja of the Emily Gap group
    of Udnirringita.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Unthurkunpa party first travelled underground to Entukatira, ate witchetty
    grubs, painted themselves with Ilkinia, then continued to Iliarinia, painted again,
    and left a Bukhara man named Unchalka.
  category: sequence
  evidence_refs:
  - ev:9
