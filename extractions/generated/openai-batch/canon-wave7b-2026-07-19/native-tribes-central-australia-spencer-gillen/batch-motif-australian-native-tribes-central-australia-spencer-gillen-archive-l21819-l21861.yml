canonical_text:
  quote: ''
  summary: The passage describes Arunta beliefs about the Ultjiana spirit after death,
    its haunting and possible attacks, its return to the Nanja and association with
    the Arumburinga and Churinga before rebirth, and the ability of medicine men and
    certain people born with open eyes to see or communicate with Iruntarinia spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The name Ultjiana is given to the spirit until a mourning-related ceremony
    has been performed and it has ceased regularly haunting the camp and burial ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Ultjiana is said to be capable of hurting enemies; human teeth in a victim's
    body are treated as a sure sign of such an attack, and medicine men may extract
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After all mourning ceremonies are carried out, the Ultjiana is said to leave
    the grave, return to its Nanja, and rejoin and live with its Arumburinga.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a time the Ultjiana gets another Churinga, becomes associated with it,
    and may later be born again in human form after even the bones have crumbled away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage distinguishes the spirit part of an Alcheringa being connected
    with a Churinga, the Arumburinga arising from the Nanja tree or rock, and the
    Ultjiana as the spirit part of a dead man or woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Arumburinga is described as changeless and everlasting; the spirit part
    of the Alcheringa individual is also said to live forever and undergo incarnation
    from time to time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Medicine men are said to have the power of seeing and communicating generally
    with the Iruntarinia.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children born with their eyes open are said to have the power to see spirits
    at maturity if they grow up sedate; the Iruntarinia do not show themselves to
    scoffers, frivolous people, or chattering people.
  category: attribute
  evidence_refs:
  - ev:4
