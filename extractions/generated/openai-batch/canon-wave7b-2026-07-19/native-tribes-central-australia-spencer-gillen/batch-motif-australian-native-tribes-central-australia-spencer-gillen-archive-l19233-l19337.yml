canonical_text:
  quote: ''
  summary: 'The passage introduces Chapter XII and begins the section on tooth-knocking.
    It describes tooth removal as a rite for males and females in the rain country,
    especially associated with the rain or water totem and performed after the Water
    Intichiuma ceremony. The text gives a native explanation that the operation makes
    the face resemble Alailinga rain-portending clouds. It then details the procedure
    for a man: relatives hold him, fur-string is placed in his mouth, the tooth is
    struck out with wood and stone, displayed, and thrown toward the mother''s camp
    in the Alcheringa. The man then throws boomerangs at a shield, and reciprocal
    food offerings follow between his mother, the operator, and the operated man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tooth-knocking is described as a rite to which individuals of both sexes in
    the Kartivia Quatcha, or rain country, must sooner or later submit if they belong
    to the relevant groups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rite is generally performed before marriage, though not always, and delay
    may be explained by saying the boy or girl was too frightened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The operation always takes place after the Water Intichiuma ceremony; for
    a fully grown man it is performed on the Intichiuma ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rite is especially associated with the rain or water totem, though people
    of other totems may undergo it; for the one totem it is described as obligatory
    or nearly so.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says non-observance would not prevent a man from being admitted
    to tribal secrets, but would expose him to ridicule by other men and women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stated native explanation is that the rite produces a facial resemblance
    to Alailinga, dark clouds with a light margin that are said to portend rain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: For a male subject, he lies on his back with his head on the lap of a man
    classed as elder brother or mother's brother's son, who pins his arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Another elder-brother or mother's-brother's-son relative fills the subject's
    mouth with fur-string, said to absorb blood, deaden pain, and prevent swallowing
    the tooth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The tooth is removed by pressing a pierced piece of wood, often the hard end
    of a spear, against the tooth and striking it with a stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After removal, the tooth is briefly held up for all to see and then thrown
    as far as possible toward the Ilira Mia Alcheringa, identified as the camp of
    the man's mother in the Alcheringa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the tooth is thrown, the operated man throws boomerangs gently at a
    shield fixed upright in the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother of the operated man must send seed food or yams to the relative
    who performed the operation, and that relative must provide food for the operated
    man.
  category: action
  evidence_refs:
  - ev:6
