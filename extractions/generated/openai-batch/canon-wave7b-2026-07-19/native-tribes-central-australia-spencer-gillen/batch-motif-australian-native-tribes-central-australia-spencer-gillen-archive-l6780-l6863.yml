canonical_text:
  quote: ''
  summary: 'The passage reports Arunta traditions about totem centres: witchetty grubs
    at or near Emily Gap became witchetty men; Alcheringa ancestors carried Churinga
    associated with spirit individuals; at origins or camps, local totem centres formed
    when ancestors and Churinga went into the ground, with natural objects marking
    the spirit places. It then explains conception and totem identity through a local
    spirit entering a woman, so that a child’s totem depends on the locality where
    conception occurred.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a tradition that certain witchetty grubs near Emily Gap
    became witchetty men, formed a group there, and were later joined by others of
    the same totem who marched to the Gap.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each Alcheringa ancestor is represented as carrying one or more Churinga,
    described as sacred stones, and each Churinga is associated with the spirit part
    of an individual.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Oknanikilla are described as local totem centres formed at places where ancestors
    originated, stayed, or camped during wanderings.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:4
  text: At these places, some Alcheringa ancestors went into the ground carrying Churinga;
    their bodies died, a natural feature such as a rock or tree marked the spot, and
    the spirit part remained in the Churinga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: The passage says the country is dotted with Oknanikilla, each connected with
    one totem and containing Churinga associated with spirit individuals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: The exact spot where a Churinga was deposited was marked by a natural object
    such as a tree or rock, where the spirit was supposed especially to reside; this
    object was called the spirit’s Nanja.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: Near Alice Springs, a major witchetty grub totem centre contains Churinga
    deposited in the Alcheringa, and nearby rocks, boulders, and old gum-trees are
    described as the Nanja of those spirits.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: If a woman conceives after being near the Alice Springs gap, the passage says
    one of the local spirit individuals has entered her body, so the child must be
    of the witchetty grub totem and is described as a reincarnation of a witchetty
    grub person of the Alcheringa.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: An example states that an emu woman who conceived at Alice Springs would bear
    a child of the witchetty grub totem, while conception in her own emu locality
    would have made the child an emu.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: Another example states that the wife of a witchetty grub man conceived while
    visiting a Quatcha or water locality, and the child’s totem was water.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: A footnote identifies Churinga as the equivalent of the bull-roarer or whirler
    named by other authors, while stating that the local name will be used because
    of its special significance among these tribes.
  category: other
  evidence_refs:
  - ev:3
