canonical_text:
  quote: ''
  summary: The passage explains Arunta views of Alcheringa precedent and Churinga
    objects, describes a comparative Kurnai bull-roarer initiation example, and distinguishes
    ancestral traditions in which Churinga hold spirit parts from present-day Arunta
    understandings of Churinga as ancestral representatives connected with reincarnation
    and a spirit double.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The expression “It was so in the Alcheringa” is described as an explanatory
    formula replacing an appeal to fathers or ancestors as precedent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Churinga belief as a modification of an idea in which
    a soul is treated as a concrete object that can be placed apart from the body
    in a secure place.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the extension of this idea to reincarnation is, among
    known Australian tribes, especially associated with the Central tribes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children are said to be taught that the voice of the bull-roarer
    is the voice of a spirit such as Daramulun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Kurnai Jeraeil account, men in charge of novices use a cryptic phrase
    about showing the novices their grandfather, which is explained as the exhibition
    of the Tundun and revelation of ancestral beliefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kurnai Tundun is identified with a great ancestor or Weitwin, who conducted
    the first initiation ceremony and made the bull-roarer and a smaller one representing
    his wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Arunta tradition contains clear traces of the idea that Churinga
    are dwelling places of the spirits of Alcheringa ancestors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A group of Achilpa men are said to have carried a sacred pole, erected it
    at camp, hung Churinga on it while they went hunting, and kept their spirit part
    in those Churinga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that present-day Arunta people do not regard a Churinga
    kept in the Ertnatulunga as the abode of their own spirit part.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a Churinga is stolen, an Arunta person mourns deeply and fears possible
    harm, but does not necessarily believe damage to the Churinga entails his own
    destruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The present value of a Churinga is described as its intimate association with,
    and representation of, an Alcheringa ancestor whose attributes it possesses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the spirit part enters a woman and a child is born, the child is described
    as the reincarnation of that particular spirit individual.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each member of the tribe is said to have a Churinga nanja.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote states that the Aruinburinga, or spirit double, is thought to visit
    the storehouse where the Churinga is kept and may follow the Churinga if it is
    taken away.
  category: action
  evidence_refs:
  - ev:8
