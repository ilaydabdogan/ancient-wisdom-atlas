  summary: The passage describes customary sharing of food and possessions, social
    expectations around gifts, a mourning vow against a Kurdaitcha killer, evening
    gatherings around camp fires with singing, anxieties about evil magic and magical
    accusation, and an ethnographic claim that Central Australian tribes developed
    in isolation from other peoples while retaining traces of shared ancestral customs
    and social organization.
