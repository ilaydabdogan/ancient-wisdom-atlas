canonical_text:
  quote: ''
  summary: The passage discusses the rite of sub-incision among Central Australian
    and neighboring Aboriginal groups, its reported distribution, performance, possible
    origins, relation to marriage eligibility, rejection of procreation-control explanations,
    infanticide as a family-size practice, and beliefs that children may originate
    as pre-existing spirit children from local totem centres.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes sub-incision as a rite practiced across a large group
    of tribes in interior Queensland, New South Wales, South Australia, far northern
    regions, and parts of Western Australia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The operation is described as opening the penile urethra and being performed
    in native conditions with a sharp flint or hard flaked quartzite knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The authors state that Arunta people have no idea as to the ultimate origin
    of the practice, while Arunta tradition ascribes the custom to members of the
    wild cat totem.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The passage says the tradition indicates the rite was introduced after circumcision
    by members of a powerful group.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that a man in tribes where the rite is practiced must normally
    be sub-incised before he is allowed to take a wife, and that violating this rule
    could mean death if discovered.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The authors deny that the rite is understood by Arunta people as intended
    to prevent or check procreation.
  category: speech
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:7
  text: The passage attributes small family size not to sub-incision but to infanticide,
    especially when an older child still needs nourishment from the mother.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Among Arunta, Luritcha, Ilpirra, and probably Warramunga people, the passage
    reports a belief that a child is not the direct result of intercourse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage reports a belief that intercourse prepares the mother for receiving
    and giving birth to an already formed spirit child inhabiting a local totem centre.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage transitions to a note that ceremonies in the south of the Arunta
    tribe, such as at Charlotte Waters, differ from those in the west and east.
  category: setting
  evidence_refs:
  - ev:9
