  summary: The passage describes forms, manufacture, decoration, distribution, and
    use of stone knives, expedient chipped stones, and adze-like implements in Central
    Australian ethnographic description. It notes red ochre, resin hafting, wooden
    handle additions, tribal manufacture differences, ordinary use, fight use, raw-material
    locations, and a decorated adze obtained from a Luritcha woman.
  language: English
