literal_observations:
- id: obs:1
  text: One large knife form has a stone flake blade set into resin; the resin is
    rubbed with red ochre and a sheath is made like that for the flaked axe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second large knife form adds a flat wooden piece to the resin handle and
    may be decorated with charcoal and kaolin lines and dots on yellow ochre.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Smaller ordinary knives are described as rougher versions of the first kind,
    usually with trigonal blades, and are made in various places.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says large knives with wooden hafts are made by Kaitish and Warramunga
    tribes, while the Arunta make large knives without the wooden part; smaller knives
    are made universally.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that large knives are used during fights and that smaller
    ones are in constant use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chipped stones of suitable material are used for ordinary purposes, made as
    occasion requires, and sometimes kept for adze or spear-thrower cutting surfaces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rude chipped stones are said to be found by a water-hole or on a hill where
    suitable material exists.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The adze-like implement consists of hard heavy wood with sharp-edged opaline
    quartzite attached by porcupine-grass resin at one or both ends.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: One adze example obtained from a Luritcha woman has grooves, circular scratched
    lines, spiral cuts, and a surface polished by handling.
  category: attribute
  evidence_refs:
  - ev:6
