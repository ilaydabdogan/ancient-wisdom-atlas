canonical_text:
  quote: ''
  summary: The passage describes food prohibitions and related penalties for youths
    after circumcision and sub-incision, for women and husbands during early pregnancy,
    for uncircumcised boys, and for girls or young women before childbirth or mature
    breast development. It also records an unborn spirit child affecting hunting,
    and a practice in which an eagle-hawk leg bone is used to impart strength to boys'
    legs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A youth who has been circumcised is forbidden to eat the flesh of multiple
    animals until he has undergone and fully recovered from sub-incision; transgression
    is said to retard recovery and inflame wounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animal foods forbidden to the circumcised youth include snakes, opossums,
    echidna, lizards, mound birds and their eggs, bandicoots, wild turkey and their
    eggs, and eaglehawks and their eggs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the restriction disciplines the novice and compares
    it with Engwura restrictions in which younger men bring much of their game to
    older men in camp.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: During early pregnancy, a woman may eat meat, but the unborn child is said
    to resent it by causing sickness, so she initially eats vegetable food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For the first three or four months of pregnancy, the husband does not kill
    large game requiring spear or boomerang, and instead catches rats, opossums, and
    other small game.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The spirit of the unborn child is said to follow the husband, warn large game
    of his approach, and cause a thrown spear or boomerang to take a crooked course
    if the child is angry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the father persists in trying to kill large game despite the warning, the
    mother's sickness and sufferings are said to increase; the man may still eat game
    killed by other men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An Ulpmerka, defined in the passage as a boy who has not been circumcised,
    has a long list of forbidden foods with specified penalties for eating them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For an Ulpmerka boy, the passage links several forbidden foods to bodily penalties,
    including premature age, bleeding at circumcision, diseased sexual craving, abnormal
    penile development, head and chin deformities, and stunted growth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The eagle-hawk is forbidden to the boy except for the legs; the leg is said
    to impart strength, and boys are often struck on the calf with an eagle-hawk leg
    bone so that strength passes into the boy's leg.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Wild-cat is forbidden to the boy until very old age and is linked with a painful
    foul-smelling eruption; podargus and its eggs are linked with an enlargement of
    the mouth.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Girls and young women, until after childbirth or until their breasts become
    pendent, are subject to food restrictions with penalties involving menstruation,
    sexual craving, breast development, premature age, baldness, genital malformation,
    head and chin deformities, and absence of milk from the breasts.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
