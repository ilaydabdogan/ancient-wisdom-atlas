canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and procedures around Central Australian
    medicine men: ordinary illness treatment by sucking foreign objects from the body;
    serious diagnoses involving charmed bones or an Ullinka placed by spirits or magical
    individuals; counter-magic using Atnongara stones, cutting an invisible string,
    and extraction; explanations for failed cures; sorcerous functions of medicine
    men; and Mungaberra medicine men taking eagle-hawk form to attack people at night.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Failed cures are not blamed on the medicine man; non-success is attributed
    to hostile superior magic, while some medicine men are regarded as more capable
    than others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In ordinary treatment the patient lies on the ground while the medicine man
    bends over and sucks the affected part of the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The medicine man spits out supposed pieces of wood, bone, or stone, which
    are believed to be causing injury and pain.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pain in a body part is attributed to the presence of a foreign body that must
    be removed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among especially the Western Arunta, a medicine man is said to have Atnongara
    stones and a particular lizard distributed through his body, giving him strong
    suction power.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In serious cases the patient is supported while the medicine man examines
    him and consults other practitioners and close relatives in a solemn, whispered
    setting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A diagnosis may identify a charmed bone inserted by a magical individual such
    as a Kurdaitcha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A diagnosis may identify an Ullinka, a short barbed stick attached to an invisible
    string, placed in the body by an Inintarinia; pulling the string causes pain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For an Ullinka case, the medicine man jerks his arm outward to project Atnongara
    stones into the patient in order to counteract the evil influence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The medicine man finds and cuts an invisible string that only he can see,
    and the onlookers accept that he has done this.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The medicine man sucks the affected part until the Ullinka is extracted in
    fragments or, rarely, whole and shown to the onlookers; the Atnongara stones return
    unseen into his own body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: If death follows treatment, it is explained as the stick being in a vital
    part, aid having been called too late, or the medicine man's efforts having been
    thwarted by an Iruntarinia.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The medicine man's functions as wizard or sorcerer include bringing illness
    on people and ascertaining who is responsible for a death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Certain very old medicine men are said to bring disease not only on individuals
    but on whole groups.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Mungaberra medicine men are said to assume the form of eagle-hawks and travel
    long distances at night to camps of other tribes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: In eagle-hawk form, Mungaberra medicine men are said to cause suffering and
    death by digging sharp claws into people; claw fragments are reported as extracted
    from an Arunta victim.
  category: action
  evidence_refs:
  - ev:8
