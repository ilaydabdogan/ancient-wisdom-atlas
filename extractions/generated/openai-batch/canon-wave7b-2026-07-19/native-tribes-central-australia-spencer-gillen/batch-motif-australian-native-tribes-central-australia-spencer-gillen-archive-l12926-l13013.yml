canonical_text:
  quote: ''
  summary: 'The passage describes organization during the Engwura ceremony: camps
    are arranged by locality and division; Churinga are stored on separate platforms
    under custodians; the tribe is described in terms of moieties, local totem groups,
    Alcheringa-associated spirit individuals, sacred storehouses, and ceremonies transmitted
    by inheritance or by claimed gifts from spirits, sometimes through dreams.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the Engwura, camps of men, women, and children were formed on the eastern
    side of the creek, with camp positions roughly indicating the owners' localities.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bukhara and Panunga men camped close together, and Kumara and Purula men camped
    close together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Churinga belonging to Panunga and Bukhara men were placed together on a small
    platform built in a mulga tree on the south-west hill-side, under the charge of
    the Alatunja of the Alice Springs group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Churinga belonging to Purula and Kumara men were placed on a small platform
    at the northern end of the ground under the charge of a Purula man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The storage place of the Churinga during the Engwura is named tJiaiiunda in
    the passage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the tribe is divided into two moieties, each of which
    divided further; in the northern section eight divisions are noted.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The broader tribal area is described as divided into localities owned and
    inhabited by local groups, each identified with a totem or Oknanikilla.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Special Alcheringa men are said to be associated with particular localities
    where they became spirit individuals, each associated with a Churinga.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ceremonies associated with localities are described as having been performed
    in the Alcheringa and handed down to the present.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each totem is said to have ceremonies, and each ceremony may be the property
