canonical_text:
  quote: ''
  summary: The passage describes the Arunta practice of secret Aritna churinga names,
    their restriction to fully initiated men of the same local totem group, prerequisites
    for admission to the Ertnatulunga, a ceremony in which sacred Churinga are shown
    and interpreted, and a subsequent totemic body-painting connected with a sacred
    rock painting near Emily Gap. It also notes restrictions on women and the varied
    contents of an Ertnatulunga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each member of the tribe has a secret name, which may be newly given or may
    be the name of a celebrated Alcheringa man or woman preserved in tradition.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The secret name is only uttered on solemn occasions when the Churinga are
    being examined and is known only to fully initiated men of the individual's own
    local totem group.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Uttering a secret name before women or men of another group is described as
    a serious breach of tribal custom, and the name is spoken, if at all, in a whisper
    after precautions.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The passage states that a stranger who knows a person's secret name is believed
    to have special power to harm that person by magic.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Before a man may see the Ertnatulunga, he must have undergone circumcision
    and subincision and must have shown self-restraint and suitable conduct.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man judged too light, frivolous, or talkative may wait many years before
    being admitted to the tribal secrets.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When considered worthy, the man is taken by older men to the Ertnatulunga
    at a time appointed by the Alatunja of his local group.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the Ertnatulunga, sacred Churinga are examined carefully and reverently
    one by one while older men identify present or former owners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Low chants referring to the Alcheringa accompany the examination of the Churinga.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the close of the examination, the man is told his Churinga name and warned
    not to let anyone except men of his own group hear it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the witnessed witchetty group performance, the man is painted on face and
    body with pinkish soapstone and red ochre by the Alatunja and older men related
    to him as Okira, or father.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The body-painting pattern represents the totem's device and is copied from
    a sacred painting on a smooth rock surface in Emily Gap, the local centre of the
    witchetty grub totem.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the rite, the party returns to camp, and the painting remains on the
    man's body until it wears off.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Old women know the man has gone to the Ertnatulunga, but women do not know
    the nature of the ceremony, and women in the natural condition of the tribe dare
    not approach the gap with the sacred rock painting and nearby Ertnatulunga.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The contents of an Ertnatulunga vary by group and may include many stone Churinga
    and wooden Churinga, including Churinga associated with various totems through
    inheritance or lending between friendly groups.
  category: object
  evidence_refs:
  - ev:7
