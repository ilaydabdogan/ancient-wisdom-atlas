canonical_text:
  quote: ''
  summary: The passage describes Alcheringa men traveling through named places, performing
    rites and sacred ceremonies that become associated with those places and are said
    to correspond to present-day ceremonies. At Achilp-ilthunka they encounter a wild
    cat man from the salt water country, kill and mutilate him because of his violent
    conduct, and a stone marks his burial. They continue onward driving mosquitoes,
    eating Hakea flower, drinking their own blood when thirsty, passing unseen opossum-totem
    women, and smelling plum tree men near Aurapuncha.
  language: English
  quote_policy: summarized
