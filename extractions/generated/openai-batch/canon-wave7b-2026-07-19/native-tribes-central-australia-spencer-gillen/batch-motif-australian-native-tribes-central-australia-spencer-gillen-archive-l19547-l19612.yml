  summary: The passage discusses competing explanations for the origin and later development
    of tooth-knocking as a rite or custom. It notes Arunta traditions in which Alcheringa
    women carried sacred Nurtunja, possessed Churinga, and performed sacred ceremonies
    like men, contrasting this with later taboos excluding women from such objects.
    It then outlines theories about whether tooth avulsion began as a male initiation
    rite or as a practice shared by men and women before becoming associated with
    initiation, altered, replaced, or retained in different tribal settings.
