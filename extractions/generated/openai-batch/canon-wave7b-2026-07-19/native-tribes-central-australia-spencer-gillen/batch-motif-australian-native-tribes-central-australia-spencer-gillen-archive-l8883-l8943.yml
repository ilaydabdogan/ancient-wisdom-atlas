canonical_text:
  quote: ''
  summary: The passage describes the closing stages of a Witchetty Grub Intichiuma
    ceremony. After fasting, the participants receive food and water, spend the night
    singing around a fire while women keep watch, and the Alatunja extinguishes the
    fire as a release signal. At daylight the party removes ritual ornaments, gives
    them to men of the other moiety, eats food collected from the camps, is rubbed
    with red ochre to obliterate earlier markings, and returns to camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants return to the wurley, and an old man brings food and water; this
    is described as their first food or drink since leaving camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony is stated to require participants, except very old men, to avoid
    eating and drinking during the earlier part of the rite.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dusk the participants sit around a large fire and sing about the witchetty
    grub.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:4
  text: Women of the right moiety stand and watch in the darkness, checking both the
    women of the other moiety and the Intichiuma party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the singing ceases, the Alatunja quickly extinguishes the fire, and this
    is identified as the signal for release.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Purula and Kumara men and women rise, and the released men together with all
    the women run to the main camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At daylight the Intichiuma party goes near the Ungunja, makes a fire, removes
    ornaments and feathers, and throws away Udnirringia twigs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Alatunja states that the Miilyanuka must receive the removed things, otherwise
    the ceremony would not be successful and harm would come to the participants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Miilyanuka, identified as men of the other moiety, are called and the
    removed things are divided among them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old man collects vegetable food from women in the camps, and the food
    is cooked and eaten by the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before sundown the old man brings red ochre and fur string; older men rub
    red ochre on themselves and younger men, obliterating the Ilkinia and face painting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The men put on arm strings and return to their camps, bringing the main part
    of the ceremony to a close.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A note describes the Ungunja as a men’s area near which no woman may go, and
    the Erlukwina as a women’s area near which no man may go.
  category: setting
  evidence_refs:
  - ev:7
