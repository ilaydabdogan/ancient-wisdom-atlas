canonical_text:
  quote: ''
  summary: The passage introduces Intichiuma as sacred totemic ceremonies intended
    to increase the animal or plant connected with a totem. It describes the Arunta
    and other central Australian tribes as lacking an absolute ban on eating one's
    totem, while requiring limited ritual eating on special occasions. It then notes
    a special Achilpa or wild cat restriction, including disease and spirit-loss consequences
    for certain transgressors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Intichiuma is the name for certain sacred ceremonies associated with totems.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated object of the ceremonies is to secure the increase of the animal
    or plant that gives its name to the totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the natives have no tradition explaining when or how
    these ceremonies arose.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Arunta and other central tribes, a man is not absolutely forbidden
    to eat his totem.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Under ordinary circumstances, a man may eat only sparingly of his totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On special Intichiuma occasions, custom requires eating a small portion of
    the totem, or the supply is said to fail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Alatunja must take the lead in the Intichiuma ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Alatunja of the witchetty grub totem says that unless he eats a little
    of his totem, he cannot properly perform the Intichiuma ceremony.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Achilpa or wild cat totem is given as an exception to the more general
    rules about eating.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Only a very little Achilpa may be eaten, and only by old people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Achilpa restriction applies universally to every member of the tribe,
    not only to members of that totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that anyone other than an old man or woman who eats Achilpa
    is believed to be afflicted with a disease called Erkincha.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a man who has killed another person eats Achilpa, his spirit part, called
    Yoika, is believed to leave his body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the Yoika leaves, the man is expected soon to be killed by an enemy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: For a man who has ever killed another, Achilpa is taboo for life, regardless
    of his age.
  category: relationship
  evidence_refs:
  - ev:8
