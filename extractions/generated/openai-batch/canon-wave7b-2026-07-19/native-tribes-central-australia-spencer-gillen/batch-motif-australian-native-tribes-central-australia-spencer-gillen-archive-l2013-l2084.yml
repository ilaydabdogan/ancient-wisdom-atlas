canonical_text:
  quote: ''
  summary: The passage describes Central Australian social organization in which people
    may have animal or plant totemic names, but such totems do not necessarily regulate
    fighting alliances, marriage, or descent. It contrasts this with other Australian
    tribes, emphasizing diversity in descent rules, totemic functions, sex and individual
    totems, and initiation customs such as tooth removal, circumcision, and other
    mutilations. The authors caution against generalizing a single custom as universal
    among Australian peoples and state that broader developmental reconstruction is
    not yet possible.
  language: English
  quote_policy: summarized
