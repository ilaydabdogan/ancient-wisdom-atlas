- id: obs:4
  text: A mutual relationship based on a common totemic name is said to stand out
    prominently only during certain ceremonies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the tribes under discussion, the totem is said not to regulate marriage,
