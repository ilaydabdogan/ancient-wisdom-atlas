canonical_text:
  quote: ''
  summary: The passage describes male initiation procedures involving Lartna and Ariltha,
    including ritual objects, attendants, naming changes, treatment of blood and foreskin,
    seclusion, return to camp, silence restrictions, and an owl-totem ceremony. It
    then describes ceremonies for girls and women that the authors present as equivalents
    to some male initiation rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the Lartna operation, ceremonies are performed with a Waninga, and
    the boy is made to embrace it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy lies on the ground while an Okilia covers his eyes, and an Unkulla
    man goes some distance away before running back toward him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several men lie on the ground to form a kind of table; the Unkulla man places
    the boy on them, and an Ikuntera man performs the operation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Okilia stand by during the operation and shout an instruction translated as
    telling the boy to be quiet and not cry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Blood is collected in a shield, and the Okilia buries the blood and foreskin
    in a hole, covers them with stones and sand, and lays a short horizontal stick
    called Ultlia on the surface.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy who has been operated upon and women are not allowed to go near the
    Ultlia stick.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: After Lartna the boy is called Atmtrrinia; after Ariltha the novice is called
    Allalluniba.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: During Ariltha, the Unkulla man sits on the boy's chest, and the Ikuntera
    man performs the ceremony; a hair girdle is laid close beside the boy to prevent
    too great a flow of blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After Ariltha the novice is taken into the bush, later painted white, given
    a hair-string girdle and pubic tassel, brought to the men's camp, and then taken
    near the women waiting by the Erlukwirra.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage mentions a boomerang throwing, a meeting with the novice's Ungaraitcha
    who hit him on the back, smoking of the novice, a night ceremony concerned with
    the owl totem, and a temporary ban on speaking to officials until food offerings
    are given.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: For women, the passage identifies one ceremony in which a girl's breasts are
    rubbed with fat and red ochre, and another in which an operation of opening the
    vagina is performed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that there is no special name given to a female after any
    initiation rite and lists ordinary age-status terms for girls and women.
  category: attribute
  evidence_refs:
  - ev:5
