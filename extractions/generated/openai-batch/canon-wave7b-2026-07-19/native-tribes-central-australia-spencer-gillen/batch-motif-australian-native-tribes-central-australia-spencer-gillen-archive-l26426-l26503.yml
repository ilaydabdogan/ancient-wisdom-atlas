canonical_text:
  quote: ''
  summary: 'The passage describes Arunta naming practices: individuals are identified
    by sub-class, totem, ordinary personal names, and secret Churinga names. Secret
    names are linked to Churinga, may derive from an ancestor understood as reincarnated,
    may be assigned by the local head man, and are known only to fully initiated men.
    The passage also describes address terms, nicknames, and male and female status
    terms marking initiation or life stages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Every individual is described as belonging to a sub-class and totem and as
    having at least two individual names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first individual name is the ordinary personal name; the second is a secret
    or sacred name associated with the person’s Churinga.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a person is regarded as a reincarnation of an ancestor whose spirit part
    was associated with the Churinga, the person bears that ancestor’s name; if the
    ancestral name is not preserved, the local head man decides the secret name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The secret name is called the Churinga name, is given to men and women, and
    is known only to the fully initiated men of the local group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Alice Springs witchetty grub group example, the secret Churinga name
    is never uttered except during solemn ceremonies when Churinga are examined.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When speaking to or of a living person, speakers may use a relationship term,
    an ordinary personal name, or a special term connected with an official role in
    the speaker’s initiation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: An individual may also have a nickname based on a marked feature of the body
    or a perceived resemblance to an animal or plant.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men have seven status terms marking successive stages before, during, and
    after initiation ceremonies, including stages connected with circumcision, sub-incision,
    and Engwura.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women have three status terms marking stages before first menstruation, after
    first menstruation until full growth, and after that stage.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that women never know their secret names.
  category: relationship
  evidence_refs:
  - ev:8
