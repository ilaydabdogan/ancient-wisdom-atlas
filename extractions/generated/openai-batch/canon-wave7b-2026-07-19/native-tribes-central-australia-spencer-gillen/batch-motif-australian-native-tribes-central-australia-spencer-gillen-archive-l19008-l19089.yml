canonical_text:
  quote: ''
  summary: 'The passage recounts an Alcheringa tradition in which a grass-seed totem
    woman brings an enormous snake to punish people who steal her seed; the snake
    later inhabits a waterhole, remains dangerous, and is associated with caverns,
    descendants, and warning songs. It then gives fire-totem traditions: a spark of
    fire travels by sky and wind to Mount Hay, becomes a great fire, and fire-totem
    ancestors emerge from the ashes before being made into men and women by two wild
    duck men. A further origin of fire story tells of Algurawartna pursuing a gigantic
    euro that carries fire in its body, taking fire from it, killing it, and extracting
    red fire from its long penis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Imyunga, a woman of the grass-seed totem is described as skilled at gathering
    grass seed, while people of the same totem steal her grass seed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman travels far to the south-west beyond Erldunda and returns with an
    enormous snake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the woman’s camp, the snake eats the Ingwitchika thieves and then lives
    in the waterhole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The snake is said to have lived long after the Alcheringa and to have been
    killed by a flood that washed it out of its hole.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Great caverns in the range are said to be occupied by the snake’s spirit;
    some descendants are occasionally seen in the waterhole, and men avoid the eastern
    side because of the danger of being sucked under the ranges.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men approaching the waterfall stop and call out several times to warn the
    snake, because surprising it would anger it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Near the waterfall is a local storehouse containing stone Churinga; the woman’s
    Churinga is ornamented on one side with concentric circles said to represent her
    breasts, and her name is Urlatcha, meaning breasts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Fire Totem account, a spark of fire ascends into the sky at Urapuncha,
    is blown by the north wind to Mount Hay, falls to earth, and produces a great
    fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the great fire subsides, Inapertwa creatures come out of the ashes and
    are identified as ancestors of the fire totem people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two wild duck men, Erkung-ir-quilika and Mura-wilyika, discover the Inapertwa
    creatures and make them into men and women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The remains of the great fire are said still to smoulder on the mountain top
    near the fire totem’s sacred storehouse and to be visible at night from a long
    distance.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: A stone near the storehouse is identified as the former piece of wood used
    by Yarung-unterin-yinga, leader of the fire people, when making fire with an amera
    or spear-thrower; the amera is represented by a Churinga.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Origin of Fire account, Algurawartna, a man of the Arunga or euro totem,
    pursues a gigantic euro that carries fire in its body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Algurawartna carries two large Churinga and tries unsuccessfully to make fire
    with them while following the euro westward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: One night Algurawartna sees fire burning by the euro, takes some of it, and
    uses it to cook euro flesh.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Algurawartna eventually kills the euro at Ililkinja, examines its body, removes
    and cuts open its long penis, finds very red fire inside, and uses that fire for
    cooking.
  category: sequence
  evidence_refs:
  - ev:9
