- id: obs:4
  text: The Engwura messenger is called Ilchinkinija, explained from words meaning
    hand and to raise or lift up, and rendered as “the beckoning hand.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The summons is described as one that no native would dare disobey, because
    serious ill would follow neglecting to follow the Churinga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Churinga may pass from group to group, travel many hundreds of miles,
