canonical_text:
  quote: '"the beckoning hand."'
  summary: 'The passage describes the calling of an Engwura initiation: an Alatunja
    consults older men and sends messengers carrying concealed wooden Churinga to
    other groups. The messenger shows the Churinga as proof, gives a verbal message
    about the assembly, and groups gradually arrive at a secluded ground prepared
    so that women, children, and unauthorized people cannot see the proceedings.'
  language: English
  quote_policy: quoted
literal_observations:
