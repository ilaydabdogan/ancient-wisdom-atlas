canonical_text:
  quote: ''
  summary: The passage explains that Arunta totemic ceremonies are tied to specific
    totems, places, and often local custodians. It describes the Alcheringa as the
    remote ancestral past in which semi-human ancestors associated with animal or
    plant totems lived, formed totemic companies, were credited with the origins of
    landscape features, and were remembered in relation to moieties and local totem
    centres.
  language: English
  quote_policy: summarized
