  text: Named ceremonies are described as concerned with a particular totem and with
    a particular locality or special spot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ceremony was frequently, though not always, possessed by and presided over
    by an old man of the totem and locality with which it was concerned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that totems are strictly local and that local centres of
    one totem occur in various districts of the Arunta area.
  category: setting
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:4
  text: The whole past history of the tribe is said to be bound up with totemic ceremonies
    concerning mythical ancestors of the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Alcheringa ancestors are described as closely associated with the animals
    or plants whose names they bear, so that a kangaroo-totem person may be called
    a man-kangaroo or kangaroo-man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the identity of the human individual is often sunk in that
