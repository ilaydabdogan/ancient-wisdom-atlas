  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Alcheringa men and women are represented as semi-human creatures with powers
    not possessed by their living descendants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The origin of marked landscape features, including gaps and gorges in the
    Macdonnell Ranges, is attributed to mythical Alcheringa ancestors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Alcheringa ancestors are represented as collected in companies, each composed
    of individuals belonging to one particular totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage gives examples of ancestral totem groups associated with moieties,
