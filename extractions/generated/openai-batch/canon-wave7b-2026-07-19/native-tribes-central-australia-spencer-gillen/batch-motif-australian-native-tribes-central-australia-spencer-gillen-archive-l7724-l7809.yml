canonical_text:
  quote: ''
  summary: 'The passage explains figures on several Arunta Churinga: frog designs
    in which gum-trees, roots, frog tracks, small frogs, and limbs are marked by circles,
    lines, and dots; the Churinga nanja of Ilatirpa of the Yarumpa or honey-ant totem,
    with body-part designs and a bird mate''s intestines; an Achilpa or wild-cat Churinga
    showing Hakea trees, dancers'' tracks, Wanpa sticks, and Engwura use; and an Udnirringita
    or witchetty-grub Churinga with grubs and a ground hole.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the frog Churinga, concentric circles and attached straight or curved lines
    are explained as large and smaller gum-trees and their roots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that these trees are closely associated with the frog totem
    because frogs are supposed to come out of them, and it adds a naturalistic note
    about frogs in old gum-tree cavities before rain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dotted lines along the edge of the frog Churinga are identified as frog tracks
    in the sand of the river bed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the opposite side of the frog Churinga, double concentric circles joined
    by lines represent small frogs that have come out of the trees and the frogs'
    limbs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Figure B is described as the Churinga nanja of the celebrated Ilatirpa of
    the Yarumpa or honey-ant totem, kept in the storehouse at Ilyaba.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: On Figure B, circles and related markings are explained as an eye, intestines,
    stomach painting, and posterior part; on the reverse, circles represent the intestines
    of Alatirpa, a little bird regarded as the mate of Yarumpa.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Figure C is described as the Churinga of an Achilpa or wild-cat man, with
    circles representing Unjiamba or Hakea trees and spots or dots representing the
    tracks of dancing men.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lines on Figure C represent Wanpa sticks beaten together to keep time for
    dancing; this Churinga is said to be in the Imanda storehouse and to have been
    used during the Engwura ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Figure D is described as the Churinga of an Udnirringita or witchetty-grub
    man, kept in the Emily Gap storehouse; curved lines represent a large grub, and
    another marking represents many grubs in a hole scooped out in the ground.
  category: object
  evidence_refs:
  - ev:6
