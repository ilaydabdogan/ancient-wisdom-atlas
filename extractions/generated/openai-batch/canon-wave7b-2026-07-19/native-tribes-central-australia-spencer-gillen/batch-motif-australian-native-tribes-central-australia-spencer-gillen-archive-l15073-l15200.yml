canonical_text:
  quote: ''
  summary: The passage describes an Engwura ceremony after eight days of preceding
    rites. Young men are kept away while elder Urliara men prepare a ceremony connected
    with the frog totem centre of Imanda. A leader/performer is elaborately decorated
    with down, Churinga, feather ornaments, and body markings representing frogs,
    gum-tree roots, and a celebrated tree. The young men are driven to the ceremonial
    ground by old men using whirled Churinga/bull-roarers, circle the performer while
    shouting, and the ceremony ends when a young Purula man touches the performer’s
    shoulders. The performer then embraces selected men, touches an old Purula man’s
    navel with white down, and later removes the decorations; used Churinga or Nurtunja
    decorations are not reused.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eight days of ceremonies, the small gum boughs that had decorated the
    top of the Parra were removed, leaving the mound bare.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men were ordered away from the ground and spent much of the day
    in the river bed under the Alatunja of Alice Springs, while elder men who were
    already Urliara assembled near the Parra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ceremony was called the Quabara Unchichera of Imanda and was connected
    with an important frog totem centre at Imanda; the leader came from that locality
    and had inherited ceremonies concerning the frog and wild cat totems from his
    father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The performer wore a flat helmet covered with concentric circles of alternate
    pink and white down; the passage states that these represented roots of a special
    gum tree at Imanda.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The performer’s back and chest were covered with white spots encircled by
    down, described as indicating frogs of different ages, and white lines on his
    thighs represented legs of fully grown frogs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The performer wore a large frog Churinga on his head, decorated with down,
    owl feathers, eagle-hawk feathers, and pendant fur strings; the Churinga represented
    a celebrated tree at Imanda and the strings its small roots.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A shallow pit was scooped in the sand, and the decorated performer squatted
    in it with a short stick; the decoration concealed the man from easy view.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The performer sent three old Urliara men across the river; two whirled small
    Churinga attached to hair-string, producing the bull-roarer sound, and the young
    men were driven across the river to the Engwura ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the young men saw the performer swaying and digging the ground, they
    halted with raised hands, then ran to circle him while shouting, as old men with
    Churinga moved around them to press them closer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young Purula man, son of a dead man of the frog totem of Imanda, placed
    his hands on the performer’s shoulders; the performer stopped moving and the ceremony
    ended.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the ceremony the decorated man embraced the young Purula man, embraced
    various old Bulthara and Panunga men, touched an old Purula man’s navel with white
    down, and then called the young Purula man to help remove the decorations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After each ceremony down was removed from the body, and once a Churinga or
    Nurtunja had been used, its decorations were taken off; no Nurtunja was used more
    than once.
  category: sequence
  evidence_refs:
  - ev:8
