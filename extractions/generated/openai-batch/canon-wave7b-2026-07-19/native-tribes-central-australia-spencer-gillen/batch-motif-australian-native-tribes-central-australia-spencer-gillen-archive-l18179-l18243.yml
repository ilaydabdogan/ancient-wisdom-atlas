canonical_text:
  quote: ''
  summary: The passage describes sacred holes, stones, a cave, rock drawings, and
    landscape features at a gorge associated with Alcheringa witchetty ancestors,
    especially Intwailiuka. It records taboos around women and children, the Intichiuma
    increase ceremony for Udnirringita grubs, women watching the ancestral ceremony,
    and Intwailiuka throwing egg stones up the rock face in a way said to continue
    in present ritual practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Within two miles of the gap there are eight or ten holes, three to five feet
    deep, called Ilthura, attributed to Alcheringa men and taboo to women and children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each hole contains a covered large stone called Churinga Uchaqua, representing
    the witchetty in its chrysalis stage, and a smaller rounded stone called Churinga
    Unchima, representing the egg stage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Intwailiuka, described as the great Alcheringa leader of the witchetties,
    sprang into existence near the northern entrance to the gorge at a spot now marked
    by a large stone and a dead gum tree trunk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The large stone is associated with the spirit of the dead Intwailiuka and
    with men regarded as successive reincarnations of him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Smaller stones near the large stone represent men who sat with Intwailiuka.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: During his life, Intwailiuka spent much time at the spot so he could guard
    the approach to the gap and watch over the Churinga storehouse located in rock
    clefts that he made.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A sacred cave in the western wall, called Ilthura oknira or the great Ilthura,
    is where Intwailiuka performed the Intichiuma ceremony to increase the Udnirringita
    grub.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the eastern wall opposite the cave is a sacred rock drawing, Ikinia, believed
    to have sprung up spontaneously to mark where Alcheringa women painted themselves
    and watched Intwailiuka and his men perform Intichiuma.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The women’s spot is called Erlukwirra, the camp of the women, and one drawing
    is said to represent a woman leaning on her elbow and gazing upward.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that such traditions show women’s past association with
    sacred objects and ceremonies differed from the present, when women may not approach
    the sacred spot during Intichiuma.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A quartzite band called Alkwalinta, meaning “eyes painted around,” marks where
    Intwailiuka stood in the creek bed at the base of the rock.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Standing at Alkwalinta, Intwailiuka threw many Churinga Unchima, or eggs,
    up the rock face, as is said to be done in present Intichiuma practice.
  category: action
  evidence_refs:
  - ev:9
