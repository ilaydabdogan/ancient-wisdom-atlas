canonical_text:
  quote: ''
  summary: The passage describes an Untliippa-related initiation performance that
    imitates ancestral women, a tradition explaining Erkincha disease through a blood-mixed
    Hakea drink flood and a disease stone at Ooraminna, and the opening description
    of a gorge pool said to be inhabited by a great dead snake's spirit and living
    snake descendants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A long range feature in the Macdonnell Ranges is said to have arisen to mark
    the line of travel followed by the Untliippa women.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During lartna-related ceremonies, women approach carrying shields and spear-throwers
    and dance as the Untliippa women did in the Alcheringa while men repeatedly sing
    a refrain referring to the range and march.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Later in the ceremony, after the boy is painted and advanced to Wiirtja, a
    Mura woman lifts him onto her shoulders and runs off with him, imitating the Untliippa
    women; the men then seize the boy and bring him back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wandering party of Achilpa or wild cat men was guided by an old Oknirabata
    named Atnimma-la-truripa, who was noted for the size and decoration of his penis.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Achilpa party camped near the Ooraminna waterhole and made an Engwura.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Achilpa men discovered nearby wild cat men suffering from Erkincha disease,
    which smelled offensively, and the Achilpa men fled northward instead of settling
    there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men of the Arwarlinga or Hakea totem came to the top of the Ooraminna rockhole
    and made abmoara by steeping Hakea flowers in water held in wooden vessels.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Arwarlinga men opened veins in their arms and let blood mix with the abmoara
    until the vessels overflowed, flooding Ooraminna Creek and drowning all the Erkincha
    men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A stone arose where the diseased men perished and was known as Aperta atmimbira.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Since that event, Erkincha is said to have been prevalent, and old men can
    visit the stone, rub it, and mutter a request to the contained Arungquiltha to
    make the disease affect an individual or group.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A gorge north-north-west of Alice Springs contains a waterfall and small permanent
    pool said to be inhabited by the spirit of a great dead snake and by living snakes
    descended from it.
  category: setting
  evidence_refs:
  - ev:10
