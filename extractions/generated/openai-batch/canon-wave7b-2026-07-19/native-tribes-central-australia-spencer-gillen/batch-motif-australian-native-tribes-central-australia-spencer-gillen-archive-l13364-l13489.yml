canonical_text:
  quote: ''
  summary: The passage describes a formal examination of Churinga by men gathered
    in a creek bed, followed by preparations and performance of a Quabara associated
    with the Ulpmerka of Oorurnpa and the Akakia or plum tree totem. Attendance is
    restricted, a selected performer is ritually embraced so that he cannot refuse,
    decorated with a tall twig-and-hair-string head-dress using blood and down, and
    accompanied by songs concerning Kukaitcha’s top-knot. The performer moves to the
    Parra at sunset while a newly arrived southern contingent is welcomed by weapon-bearing
    dancers who then circle the performer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men from several groups gather in the creek bed with the Churinga placed in
    the middle of the group.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Churinga are bound in parcels with human hair string and are unpacked
    by sons of the Alatunjas while the men sing, whisper, and avoid loud talking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Alatunja examines the Churinga one by one and presses them against the
    stomachs of selected old men, who hold and look at them while whispered discussion
    concerns each object and its former possessor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: One Churinga associated with a wife of the Alatunja of the Alice Springs group
    is handed to the woman’s son for careful examination.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the examination, the Churinga are wrapped and returned to the store;
    most Purula and Kumara men leave, except for two old Gamniona invited by the head
    man to stay and watch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Quabara to be performed is associated with the Ulpmerka of Oorurnpa, a
    group belonging to the Akakia or plum tree totem, and they are said to be called
    Ulpmerka because in the Alcheringa they were left uncircumcised.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The singing for the Quabara includes repeated words glossed as “the sand hills
    are good,” and the Alatunja of Alice Springs invites a tribal son to perform.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Alatunja’s eldest son and then a Bukhara man perform rubbing and embracing
    actions with the selected performer; the passage says these actions make it impossible
    for him to continue refusing the duty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The performer’s head is decorated with Cassia twigs bound with hair string,
    white and red down is applied, and the performer’s father, the Alatunja of Undoolya,
    bleeds himself during the decoration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men sing about the hair top-knot of Kukaitcha, an Alcheringa figure associated
    with the plum tree totem, and the top-knot is explained as referring to the hair
    style worn before boys undergo circumcision.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When ready, the performer proceeds in a crouching attitude along the creek
    bed, runs across opposite the Parra, and squats close beside it at sunset.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A southern contingent arrives and is welcomed by men with spears, shields,
    and boomerangs who dance and shout, then set aside their weapons and circle the
    performer; two Purula men sit in front of and behind him.
  category: sequence
  evidence_refs:
  - ev:7
