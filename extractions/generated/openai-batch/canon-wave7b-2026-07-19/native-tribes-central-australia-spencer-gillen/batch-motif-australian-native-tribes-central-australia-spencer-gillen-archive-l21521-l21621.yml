  summary: The passage describes mourning and burial rites at a man's grave, including
    wailing, self-wounding, burial of mourning objects, bodily signs ending a widow's
    mourning, beliefs about the dead man's spirit, grave orientation toward an ancestral
    place, and a different Urpmilchima ceremony for a deceased woman involving painted
    women, a brother, Chimurilia, and a pitchi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The widow and other women clear material away from the grave area, and a space
    is cleared around the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named groups of women lie prostrate, wail loudly, strike the ground with their
    bodies, then rise and approach the grave.
