  text: Women gathered at the grave strike and cut their heads with fighting clubs,
    causing blood to flow onto the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men stand solemnly to one side while the widow and her blood and tribal
    sisters scratch a hole in the top of the grave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The widow and a younger woman remove Chimurilia from their heads, tear them
