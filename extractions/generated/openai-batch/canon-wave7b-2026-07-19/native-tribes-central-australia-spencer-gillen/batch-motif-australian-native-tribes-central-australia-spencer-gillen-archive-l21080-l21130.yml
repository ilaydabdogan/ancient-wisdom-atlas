canonical_text:
  quote: ''
  summary: The passage describes men guarding against the Chichiirkna by wakefulness,
    concealment of the right arm and shoulder, and wearing Alpita as a charm. It then
    describes testing shields, procedures by which elders authorize punishments or
    death for Iturka offenders through neighboring groups, and a Charlotte Waters
    case of a fugitive unlawful couple pursued by punishers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the Chichiirkna is flying over the camp, the men are said to stay wakeful
    and to conceal the right arm and shoulder while lying down so the bird will not
    look down and injure them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every man wears Alpita in his hair; the passage says it comes from a nocturnal
    rabbit-kangaroo and acts as a charm against being surprised by the Chichiirkna.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the voice has been heard, there is said to be no further fear because
    the UltJiana recognizes that it has been watched for and detected and is powerless
    to do harm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The shields of all the men are tested again to confirm that they are sound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes the killing of Iturka men by outsiders belonging to
    other groups as a common practice among the tribes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When such a case arises, old men of the offender's group meet, discuss the
    matter, and, if all vote for death, ask a neighboring group to carry out the sentence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists lesser punishments as cutting a man's legs or burning a
    woman with a fire-stick, followed by death if the pair continues to live together.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man who resists successfully is described as living away from camps in inaccessible
    places and in constant fear of being surprised and killed.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Charlotte Waters example, a man carried off a woman who was not his
    lawful Unawa, and both belonged to the Purula class.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Charlotte Waters pair lived wandering away from usual haunts for two or
    three years; several attempts were made to kill them, and the woman was severely
    wounded once.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man killed two men who tried to punish him and nearly killed the woman's
    proper husband; he was left alone but continued to be taunted with being Iturka.
  category: sequence
  evidence_refs:
  - ev:8
