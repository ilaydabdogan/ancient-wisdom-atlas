canonical_text:
  quote: ''
  summary: The passage describes two forms of Kurdaitcha killing. In one, a medicine
    man uses Atnongara stones and Ernia to heal the wounded victim, who revives without
    memory but later sickens and dies. In another, the Kurdaitcha acts alone, extracts
    blood through the tongue or with a lizard, plugs and closes the spear wound with
    ritual objects, chant, and fire, and causes amnesia by biting the tongue or using
    a charmed bone; the victim again returns to camp and later dies. A figure caption
    describes a Kurdaitcha with Churinga, shoes, and weapons, and the authors note
    uncertainty about mythical elements while reporting fear of Kurdaitcha.
  language: English
  quote_policy: summarized
