canonical_text:
  quote: ''
  summary: The passage describes Iruntarinia spirits as youthful, hairless, thin,
    shadowy beings who move mostly at night, may appear to solitary people, decorate
    themselves with down, give valued down to favoured individuals, steal and later
    return string or similar materials, and eat uncooked game because they have no
    fires. It also notes beliefs about children born with closed eyes, medicine men,
    camp dogs that can see spirits, and an Arumburinga thought to take and return
    a person's string.
  language: English
  quote_policy: summarized
