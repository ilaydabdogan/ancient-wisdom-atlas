canonical_text:
  quote: ''
  summary: The passage recounts traditions about Alcheringa ancestors who separated
    wrongly united couples, instituted or revised marriage classes, transformed prehuman
    creatures into humans, and introduced or ordered circumcision, sub-incision, Engwura,
    class names, and class divisions. It also notes that the eight group names originated
    in the north and were spreading southward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a ceremony, people stood with wives behind the men; wrongly united pairs
    were separated and women were allotted to their proper men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ungwurnalitha presided at the Engwura and was assisted by old emu men from
    named places who had agreed that the change should be introduced.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Intermarrying halves were described as reciprocal Unawa to each other, while
    other halves were Unkulla to each other; in the example given, only half of Purula
    women were eligible to a Panunga man and the other half were forbidden.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two individuals called Ungambikula were said to live in the western sky, come
    down to earth, and transform Inapertwa creatures into human beings with totem
    names derived from the animals or plants from which they were transformed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ungambikula performed circumcision on some men using a fire-stick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ullakupera, or little hawk men, introduced use of the stone knife during
    circumcision, continued transforming Inapertwa creatures into human beings, and
    introduced the class names Panunga, Purula, Bulthara, and Kumara.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says there is insufficient evidence to show exactly what marriage
    regulations accompanied the introduction of the class names.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Achilpa, or wild cat men, introduced Ariltha or sub-incision and arranged
    initiation ceremonies in the order circumcision, sub-incision, and Engwura.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Certain Erlia or emu people changed the marriage system so that Purula men
    might marry Panunga women and Bulthara men might marry Kumara women, and vice
    versa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a later period each of the classes was divided into two, so that only half
    of the corresponding class was eligible for marriage and the other half was forbidden.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The eight group names were said to have originated in the north and to be
    spreading southwards through the Arunta tribe.
  category: sequence
  evidence_refs:
  - ev:7
