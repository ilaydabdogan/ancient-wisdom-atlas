canonical_text:
  quote: ''
  summary: The passage describes an Intichiuma ceremony of the emu totem involving
    an Ilpintira ground drawing, decorated ritual objects, selection and painting
    of performers, a dawn movement to a chosen ceremonial ground, the bringing of
    women and children from their camp, and a visible performance in which Inniakwa
    impersonators imitate emus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage title identifies the Ilpintira as something drawn on the ground,
    and the opening describes circles made with red and yellow ochre and white pipe
    clay, with feather decorations.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Alatunja selected three older men to act as Inniakwa, who are said in
    the passage to represent ancestors of the emu totem of considerable antiquity,
    though not as far back as the Alcheringa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Younger men were chosen to act as Illinra, described as descendants of the
    Inniakwa, and were painted on their chests with totem designs in charcoal and
    white down.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At daylight, decorated Churinga were fixed on the heads of the Inniakwa; some
    Illinra were sent to the women's camp, while the remaining men assembled and sang
    around the drawing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sunrise, the party left the camping ground and went to a previously selected
    open space beyond a ridge of low scrub-covered hills.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Illinra drove the women and children out from their camp, and the women
    and children came running toward the ceremonial ground and took up a position
    at one end.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Inniakwa stood in the centre, visible to the women and children, and without
    moving their feet imitated the aimless gazing of emus while holding bunches of
    twigs.
  category: action
  evidence_refs:
  - ev:7
