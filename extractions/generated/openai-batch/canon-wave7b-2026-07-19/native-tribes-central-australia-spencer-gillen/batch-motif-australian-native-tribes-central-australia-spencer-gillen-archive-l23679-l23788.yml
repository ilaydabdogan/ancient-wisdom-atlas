canonical_text:
  quote: ''
  summary: The passage reports Arunta accounts in which the sun is female and originates
    as a spirit woman emerging from the earth at Ilparlinja, accompanied by two Panunga
    sisters and associated with a newborn child and a local sun-totem ceremony. It
    also reports moon myths in which the moon is male and originates from an opossum-totem
    man who dies, rises from his grave, warns his people, dies again, and reappears
    cyclically as the moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that throughout the Arunta tribe the sun is regarded as
    female and the moon as male.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tradition says the sun came out of the earth at Ilparlinja, at a spot marked
    by a large stone in bandicoot-people country north of Alice Springs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sun appeared in the form of a spirit woman and was accompanied by two
    Panunga women who were sisters and were also called Ochirka.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder of the two women is represented as carrying an Ambilyerikira, or
    newly-born child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After leaving the women at Ilparlinja, the sun ascended into the sky and is
    said to continue doing so every day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At night the sun is said to visit the old place from which it rises in the
    morning, and gifted persons such as medicine men may see it there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two women remained hidden in the country of the bandicoot people and gave
    rise to a local centre of the sun totem.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sun is described as having definite classificatory relationships to members
    of divisions, with terms implying that it belongs to the Panunga division.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A ceremony called the Quabara Alinga of Ilparlinja is associated with the
    two women and the newborn child left at Ilparlinja by the sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the ceremony, two old Panunga brothers performed, one of the lizard totem
    and one of the bandicoot totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The lizard-totem performer represented the elder woman and held an oblong
    decorated bundle that represented the child.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Strings hanging from the lizard-totem performer's head represented the kidneys
    and fat of the bandicoot on which the women fed.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bandicoot-totem performer represented the younger sister and carried a
    disc-shaped decorated bundle representing the sun.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The ceremony included quivering and swaying of the two performers while others
    ran around.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the performance, the sun head-dress was pressed against the stomachs
    of Panunga and Bukhara men, and later against a young Ungalla man while he was
    told about the woman.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The moon is described as male, as a big man, and by the name Atninja.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: One moon myth tells that before there was a moon, an opossum-totem man died,
    was buried, and rose shortly afterward from his grave in the form of a boy.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: The risen figure warned his people not to be frightened or run away, saying
    that if they did so they would die altogether, while he would die and rise again
    in the sky.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The figure later grew into a man, died, reappeared as the moon, and has since
    periodically died and come to life again.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:20
  text: The people who ran away died altogether, and when the moon is not visible
    the moon man is said to live with two wives far away in the west.
  category: sequence
  evidence_refs:
  - ev:12
