canonical_text:
  quote: ''
  summary: 'The passage describes several forms of magic: a Lonka-lonka ornament charmed
    to attract a woman through lightning; an Ulpirra horn charmed with fire and smoke
    to infatuate a woman; totem-related Churinga used for beard growth and eye afflictions;
    Mania stones used to kill a sleeper; and a pear-shaped Churinga-like stone used
    with linked hands, three jerks, and an incantation to kill a target.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man seeking to charm a particular woman sings over the Lonka-lonka ornament
    with words described as inviting lightning to dwell in it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Lonka-lonka is charmed, it is hung on a digging-stick at the corrobboree
    ground until night and then tied to the man's waist-belt while he dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the targeted woman alone sees lightning flashing on
    the Lonka-lonka, experiences bodily emotion, and may go to the man's camp or run
    away with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ulpirra horn is held over smoke from a small fire with green bush while
    the man sings, thrusts his head into the smoke, and swallows some of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night during the dance, the man blows the charmed Ulpirra horn and the
    woman is said to become much infatuated, with only she feeling the horn's influence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Churinga Unginia is described as belonging to a rat totem associated with
    very long whiskers; it has a lump of resin at one end and alternating red and
    black stripes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: For beard growth, a young man's chin is pricked with a pointed bone and then
    stroked with Churinga Unginia, with the passage saying a stimulus from the Churinga
    is supposed to pass to the chin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An Amunga or fly-totem Churinga is used as a charm for eyes affected by inflammatory
    growth after fly bites; the passage says it may withdraw something from the eyes
    or supply an antidote.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mania stones among the Kaitish and other tribes are described as small stones
    charged with magic power and used to cause a victim to die while asleep.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: One method using a Mania stone places a tiny fragment on a long stick or spear
    blade and drops it onto the face of a sleeping victim, who is then said never
    to wake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Arunta are described as not possessing Mania stones themselves but being
    aware of and frightened of them; one examined example proved to be a minute fragment
    of magnesium limestone.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the Kaitish and Warramunga, a pear-shaped flat stone object with resin
    and human hair-string is held with linked hands, jerked three times toward the
    intended victim, and accompanied by an incantation.
  category: action
  evidence_refs:
  - ev:7
