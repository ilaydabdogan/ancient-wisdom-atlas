canonical_text:
  quote: ''
  summary: The passage describes an Imaxda performance in which two performers represent
    men killed, eaten, revived, and searching for their slayers. It then reports a
    sequence of ceremonies at the Engwura ground, including an evening-star ceremony
    linked with Ulkni-wukulla and Auadaua, an Alcheringa woman of the evening-star
    totem. A local legend says the evening star descends nightly into a white stone
    where Auadaua sat; conception imagined at that stone is attributed to spirit individuals
    associated with Auadaua's Churinga and results in an evening-star totem child,
    while conception imagined in a nearby creek bed results in a lizard totem child.
    The passage also notes an emu ceremony and prolonged ritual singing by old men
    among a circle of young men.
  language: English
  quote_policy: summarized
