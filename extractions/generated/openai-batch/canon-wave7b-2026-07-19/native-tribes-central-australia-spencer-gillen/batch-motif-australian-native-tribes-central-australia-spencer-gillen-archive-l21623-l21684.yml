canonical_text:
  quote: ''
  summary: The passage describes a burial and mourning ceremony in which the mother
    and other women throw themselves on the grave, cut and strike themselves with
    digging sticks, wail, and are eventually drawn away. The authors explain the behavior
    as a customary display of grief and physical suffering, partly connected with
    fear of harm from the offended spirit of the dead man if grief is not sufficiently
    shown.
  language: English
  quote_policy: summarized
