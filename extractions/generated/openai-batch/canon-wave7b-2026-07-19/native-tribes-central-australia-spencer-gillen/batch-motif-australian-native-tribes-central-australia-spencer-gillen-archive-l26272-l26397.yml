canonical_text:
  quote: ''
  summary: The passage discusses Central Australian Churinga designs, especially spirals
    and concentric circles, their use in totemic designs and Engwura body painting,
    and a cautious comparison with Papuan Gulf designs on shields, bull-roarers, and
    ceremonial tablets. It also notes differences among Australian bull-roarer types.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spiral and concentric-circle designs can appear on the same Churinga, and
    the passage states that a large gum tree may be represented by either a spiral
    or a series of concentric circles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that smaller examples may be clearly spiral, while larger
    examples may appear circular but contain a central spiral; the authors report
    not finding an example with central circles and an outer spiral.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the internal part of the design is drawn first and
    concludes that the spiral is probably more primitive than the concentric-circle
    form in these Central Australian designs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the concluding Engwura ceremony, younger men had their backs painted
    with totemic designs without reference to each man’s particular totem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Back designs described in the passage include concentric circles with radiating
    lines and simpler straight lines running across the back.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The materials used for drawing the body designs are white kaolin, red ochre,
    yellow ochre, and charcoal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that the origin of the totemic designs is difficult to
    determine and that, if they derive from former zoomorphic forms, those forms have
    been modified beyond recognition.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports Haddon’s description of Papuan Gulf shield designs made
    of concentric circles and spirals, interpreted there as derivatives of drawings
    of the human face.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Papuan bull-roarers and ceremonial tablets are shown to young
    men for the first time during initiation, like Australian Churinga, and are decorated
    with designs representing the human face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage explicitly avoids claiming direct connection between Australian
    and Papuan bull-roarers, but suggests Papuan designs may offer a clue to the significance
    or possible origin of Australian circle and spiral designs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The passage states that at least two Australian bull-roarer types may exist:
    a south-eastern triangular form without incised ornamentation and interior or
    western Churinga forms with a fundamentally different shape and ornamentation.'
  category: relationship
  evidence_refs:
  - ev:6
