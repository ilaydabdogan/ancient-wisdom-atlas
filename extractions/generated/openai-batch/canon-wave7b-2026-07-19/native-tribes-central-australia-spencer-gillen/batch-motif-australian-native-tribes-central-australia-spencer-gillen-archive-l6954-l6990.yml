canonical_text:
  quote: ''
  summary: The passage describes the Arunta totemic system as based on reincarnation
    of Alcheringa ancestors, who are said to be transformations of animals, plants,
    or inanimate objects such as water and fire. It states that an animal or plant
    may be transformed into a human being, or that its spirit may remain associated
    with a Churinga after death and later arise as human. It also says Arunta accounts
    explain totemic names through myths of direct descent from animals or plants,
    and it identifies the central feature of totemism as an intimate association between
    an individual and the material object whose name the individual bears.
  language: English
  quote_policy: summarized
