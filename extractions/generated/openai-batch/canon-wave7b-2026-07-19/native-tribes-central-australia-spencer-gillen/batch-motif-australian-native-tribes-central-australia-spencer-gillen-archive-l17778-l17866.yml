canonical_text:
  quote: ''
  summary: The passage follows the Achilpa or Alcheringa ancestors through successive
    named places where they meet totemic persons or groups, perform ceremonies, leave
    men or objects behind, avoid or kill certain beings, and are said to form local
    totem centres as they travel. A following explanatory section contrasts middle
    Alcheringa traditions of people living together without current marriage restrictions
    with later or present Arunta marriage rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Macdonald, the traveling party found another group of hawk men and women,
    performed ceremonies, and left one Kumara man whose descendant is said to be living.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Irincha, a large clay pan, they found Ungunawungarinia, a Panunga man of
    the Irpunga fish totem, catching fish in water full of fish; they did not interfere
    and camped at a distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Alknalilika, they found Tulkara quail women who had no Nurtunja or Churinga
    and lived on Intwuta grass seed; the Achilpa men hid their Kauaua and had intercourse
    with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Inkuraru, Ariltha was performed upon members of the party, Churinga were
    deposited in a mulga tree near the camp, and a large stone arose at the place
    where Ariltha was performed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Irti-ipma, a place with a large waterhole, the party camped, made qiiabara
    undattJia, left one Bukhara man, and continued traveling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The party met a woman of the Tchanka bull-dog ant totem, described as an Onuicha
    or devil-devil creature; they feared she might bite them and avoided her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Kuntitcha, the party found many Ouirra bandicoot men unable to walk, killed
    all of them, performed Ariltha, held an Engwura, and left Kuntitcharinia, a Purula
    man whose descendant is said to be living.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The tradition says that the travelers journeyed north, stopped in salt-water
    country, and formed Oknanikilla or local totem centres as they travelled.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The later explanatory section states that middle Alcheringa traditions represent
    people living together in class and totem combinations that would not be permitted
    under present marriage restrictions.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that the Ullakupera men had given the class names before
    the arrival of the Achilpa and that the earlier marriage system appears different
    from the present Arunta system.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
