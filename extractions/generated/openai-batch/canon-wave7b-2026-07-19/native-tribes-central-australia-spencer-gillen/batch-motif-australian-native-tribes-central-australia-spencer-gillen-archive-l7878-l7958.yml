canonical_text:
  quote: ''
  summary: The passage describes conventional signs on Arunta Churinga, compares regional
    ornamentation and initiation rites, notes bull-roarers described by W. E. Roth,
    and discusses variation, loss, and possible theft of stone Churinga among local
    groups, followed by a fragment introducing Churinga ownership and local totem
    group extinction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Churinga designs are described as purely conventional and not attempts to
    depict the specific object in realistic form.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The most important feature in a design is usually indicated by concentric
    circles or spiral lines.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tracks of men and animals are said to be represented by dots arranged in circular
    or straight lines.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Individual men and women are said to be represented by semicircular lines
    and treated as subordinate to the animal or plant indicated by complete circles
    or spirals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that concentric circles appear to have derived from an
    earlier spiral form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The decoration of Central sacred objects is described as very different from
    that of tribes to the east coast and west.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The passage presents eastern and south-eastern coastal, Central, and western
    tribal groups as having distinct ornamentation schemes and as having diverged
    early.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Eastern coastal initiation rites are described as agreeing with one another
    in important points but differing markedly from Central tribal rites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bull-roarers described by Roth are said to be identical in form and ornamentation
    with Central examples, used in initiation ceremonies and as love charms, and not
    allowed to be seen by women; the passage also says they do not seem to have the
    same significance in Roth's studied tribes as in Central tribes.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Local groups differ in the number of Churinga they possess; in some southern
    groups stone Churinga may be absent and only wooden ones present.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports a native explanation that all totem groups originally
    had stone Churinga and that groups now lacking them lost them; groups without
    stone Churinga are described as regarded as inferior.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The passage says a local totem group can become extinct if no child is conceived
    in its totem locality for some time, leaving no men or women representing it.
  category: sequence
  evidence_refs:
  - ev:9
