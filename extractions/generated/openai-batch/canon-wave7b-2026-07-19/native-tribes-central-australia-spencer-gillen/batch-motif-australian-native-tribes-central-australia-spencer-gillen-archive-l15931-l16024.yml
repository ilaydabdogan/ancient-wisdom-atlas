canonical_text:
  quote: ''
  summary: The passage describes portions of an Engwura initiation ceremony involving
    Illpongwurra, women at the women's camp, concealed use of Churinga and Ambilyerikirra,
    preparation of ochred gum-tree sticks representing young frogs, night singing
    with sticks, and blood applied by a Kumara man to a sacred pole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ambilyerikirra ceremony is said to be associated with the Unchichera totem,
    and the wild Illpongwurra who rush with fire-sticks to attack women are represented
    as Achilpa men who have not been made into Urliara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the taming of the wild Illpongwurra, they are led across following old
    men and the sacred Churinga, by which their natures are supposed to have been
    changed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Instead of attacking the strange party, the Illpongwurra fall down in front
    of them as a sign that their fierce nature has changed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the represented strange camp includes men and women and represents
    Alcheringa individuals from a time when women saw and carried Churinga and Nurtunjas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Engwura, men live separated from women, and the women form the strange
    party for the Illpongwurra to attack; the affair is described as deeply mysterious
    to the women.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: When men come close to the women, they fall flat to hide the sacred object
    from view, then rise, turn rapidly, and are surrounded by other men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the fire-throwing in the women's camp, men carrying Churinga go close to
    women and children, but keep the Churinga in rapid continual motion so that they
    are not actually seen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women are present on two occasions when Churinga are used, although the passage
    states that severe punishment follows even accidental seeing of a Churinga by
    a woman in other circumstances.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The only explanation reported from the natives for the unusual presence of
    women when Churinga are used is that it had always been so in the Alcheringa;
    what little the women see adds to their mystification.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Early in the morning the Illpongwurra return from the women's camp to the
    Engwura ground and are sent away for two days after an exhausting night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: About thirty short gum-tree sticks are prepared, rubbed with red ochre, and
    hidden by the leader in the loose soil of the Parra mound.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sticks are called UncJiichera irnoipa, may not be seen by women, and are
    supposed to represent young frogs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: At dark, older men assemble by the Arrr^t from which the sticks are taken,
    treat them as frogs hiding in the ground, strike them with a clunking sound, and
    sing for two or three hours.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: On the next day, while the Illpongwurra are away in the bush, the sacred pole
    or Kaiiaiia is ornamented and erected in the middle of the ceremonial ground after
    lying overnight in the creek bed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A Kumara man opens a vein in his arm, lets a large amount of blood flow, and
    then walks beside the pole allowing blood to spurt over it in a thin stream.
  category: action
  evidence_refs:
  - ev:10
