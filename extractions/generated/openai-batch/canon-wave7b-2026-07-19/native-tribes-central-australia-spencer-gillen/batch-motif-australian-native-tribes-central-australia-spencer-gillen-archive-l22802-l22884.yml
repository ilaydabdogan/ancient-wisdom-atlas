canonical_text:
  quote: ''
  summary: 'The passage describes forms of magic: a Tchintu believed to contain the
    heat of the sun and to cause fever when placed on a person''s tracks; a Churinga
    or Namatwinna love-charm used with singing and humming to attract a distant woman
    within lawful marriage classes; social consequences when another man''s wife is
    obtained; related practices in named neighboring tribes; and the beginning of
    another love-charm method using a charmed Chilara head-band.'
  language: English
  quote_policy: summarized
