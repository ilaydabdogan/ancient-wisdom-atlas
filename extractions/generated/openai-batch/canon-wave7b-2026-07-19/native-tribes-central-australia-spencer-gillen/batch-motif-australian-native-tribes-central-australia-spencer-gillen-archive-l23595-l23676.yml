canonical_text:
  quote: ''
  summary: The passage describes a ceremony and associated kinship rules by which
    a girl or woman becomes a Tualcha imira, an actual or prospective mother-in-law,
    giving a male the right to marry her future daughter. It also describes hair obligations,
    possible transfer or waiver of the right, the Unjipinna relationship when a son
    is accepted instead of a daughter, initiatory duties toward that boy, a dispute
    scenario, a concrete Alice Springs example, and implications for class and local-group
    marriage patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a women's camp, each mother takes the other's child and rubs it with fat
    and red ochre while other women watch the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some of the girl's hair is cut off and given to the boy; this marks her future
    duty to provide him with her own hair for waist-girdles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The arrangement is made only between boys and girls in a definite relationship;
    the girl must be Miira to the boy and then becomes Tualcha imira, described as
    his actual or prospective mother-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tualcha imira relationship gives the man the right to take the woman's
    daughter as wife, and the daughter may be assigned many years before birth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman's daughters may be allotted to brothers in birth order, but the Tualcha
    imira relationship is said to exist only in the case of the eldest daughter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man may have more than one Tualcha imira woman and may hand on his right
    in one case to a younger blood or tribal brother while retaining his right to
    the mother-in-law's hair.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the allotted woman has a son and no daughter, the man may agree to take
    the boy as his Unjipinna instead of waiting for a girl to be born.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Unjipinna boy must give his hair to the man until he becomes circumcised,
    and the man must look after the boy in specified ways.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man must sometimes grease the Unjipinna boy's body and paint sacred designs
    on him at the ceremony of throwing-up, described as the first of the initiatory
    rites.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Lartiia, or circumcision, the man ties the boy's hair with fur-string and
    places the hair-girdle around his waist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When accepting the Unjipinna and waiving the right to the girl, the man still
    keeps his right to the hair of the Tualcha imira woman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A serious quarrel between contracting parties may lead to an attempt to give
    the girl to someone else, though the new holder may expect a later struggle over
    retaining her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Alice Springs example, two fathers consult and make a little Appungerta
    girl Tualcha imira to an Uknaria infant boy, who is described as the prospective
    husband of her future daughter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that a man need not marry outside his local group, but
    class and moiety distribution often result in his wife belonging to another local
    group.
  category: relationship
  evidence_refs:
  - ev:8
