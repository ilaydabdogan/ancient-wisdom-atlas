canonical_text:
  quote: ''
  summary: 'The passage describes head biting of an Arakurta while in bush seclusion,
    then describes preparations and performances connected with the Ariltha sub-incision
    ceremony: separation from women and children, lying down with heads covered, singing
    and Quabara performances concerning named totems, instruction in secrecy and ritual
    rights, preparation of a Nurtunja, and a dawn performance in which a personated
    Alcheringa man carrying the Nurtunja moves toward a personated Alcheringa woman
    who wards him off with bushes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the Arakurta is out in the bush, men visit him and he undergoes a painful
    rite called Koperta kakuma, or head biting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During head biting, the Arakurta lies face downward while men sit around,
    sing about biting his head, and urge the biters to bite deeply.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The biters are chosen by the oldest Okilia of the Arakurta and usually number
    from two to five.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The biters bite the scalp hard until blood flows freely; the passage says
    the stated object is to make the hair grow strongly, and the chin may also be
    bitten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Ariltha operation is said to occur generally five or six weeks after Lartna,
    depending on the boy's recovery from the earlier operation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ariltha is regarded as at least equal in importance to circumcision, and women
    are completely excluded from it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The described Ariltha ceremony involved two Arakurta, one Purula and one Kumura,
    though the passage says the operation is generally performed on one Arakurta at
    a time.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men assembled at the bush camp where the two Arakurta had been living apart
    since the previous operation, under the charge of an Okilia.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two Arakurta were told to lie flat on the ground with their heads covered;
    young men of the same two sub-classes lay beside them, and only initiated men
    were allowed to be present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Older Kumara and Purula men, with Bukhara and Panunga men, gathered and sang
    for hours of Achilpa men associated with a group that marched north by way of
    Henbury on the Finke River.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the night, a Quabara of the Achilpa or wild cat totem was performed;
    afterward the two Arakurta joined in a dance around the performers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the Achilpa Quabara, the Arakurta were told the individuals concerned,
    warned not to speak of it to women and children, and told that certain Quabara
    belonged to particular groups of men who alone had the right to perform them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Later in the night, another Quabara was performed, this time concerning the
    emu totem.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Arakurta were again made to lie down while old men went to a brake of
    boughs about fifty yards away; the rest of the night was spent singing a chant
    concerning the bandicoot totem and the Nurtunja.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Oknia and Okilia of the two Arakurta formed a kind of council directing
    the proceedings and requested an old bandicoot man to perform a sacred ceremony
    using a Nurtunja.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Nurtunja used here was made from a long spear with grass stalks, human
    hair string, alternating red and white bird down, and a tuft of eaglehawk feathers
    at the upper end.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage notes that Churinga are often hung on a Nurtunja on such occasions,
    but not in the ceremony described here.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: Two men, one the Oknia of the Purula boy and the other the Okilia of the Kumara
    boy, were decorated by the old bandicoot man to perform the ceremony.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: At daybreak the Arakurta were led from their camp and a Quabara began concerning
    an Alcheringa man from Yerapinthinga.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: The man personating the Alcheringa man carried the Nurtunja on his back and
    moved toward and away from another man personating an Alcheringa woman, who warded
    him off with bushes.
  category: action
  evidence_refs:
  - ev:10
