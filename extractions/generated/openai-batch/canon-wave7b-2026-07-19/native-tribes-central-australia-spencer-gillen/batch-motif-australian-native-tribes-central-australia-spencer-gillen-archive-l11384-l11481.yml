canonical_text:
  quote: ''
  summary: The passage describes part of an initiation ceremony involving the Wurtja,
    women dancing and shouting at the Apulia ground, removal and concealment of the
    Wurtja by male officials, preparation of Arachitta poles with fire and song, the
    return to the ground with bark thrown toward the women, and a council appointing
    a Wulya to paint a totemic Ilkinia design on the Wurtja. It also describes formal
    gestures honoring the appointed man and a later whispered request by an elderly
    circumcision operator to delegate his duty to his son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women came to the Apulia, danced between the lines in front of the Wurtja,
    made an invitation movement with their hands, and shouted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Urinthantima man lifted the Wurtja onto his shoulders and ran off with
    him, followed by younger men; the women ran back to their camp and the singing
    ceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Out of sight of the Apulia, the men made large fires, cut slender saplings
    for Arachitta poles, scorched branches in the flames, and sang a fire-song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wurtja helped by breaking off twigs and handing them around, but he did
    not prepare a pole himself and was not spoken to during the work.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: About thirty Arachitta poles, each about ten feet long, were prepared and
    then carried to a place near the Apulia, where they were stacked.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The Urinthantima man, assisted by the boy's Okilia, tied Eremophila twigs
    onto the Wurtja's body and head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women took possession of the Apulia with shields, faced the approaching party,
    danced with invitation movements, and later shielded their faces when men threw
    bark pieces toward them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A final volley of bark pieces signaled the women to leave; after they ran
    away, the bushes were removed from the Wurtja and he was told to remain crouching.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A council involving Oknia, Okilia, and Gammona appointed a Wulya whose duty
    was to paint a design on the Wurtja's back.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The design to be painted had to be one of the Ilkinia, described as designs
    emblematic of the totems, and the Wulya was expected to choose one belonging to
    a totem group of his own locality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: An Okilia used a boomerang to draw three times along the ground, made a small
    trench, scooped soil from it, and placed the soil in the hands of the selected
    Ipmunna man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The selected old man was embraced by the Okilia, the Gammona, and the Oknia,
    and his selection was described as a compliment to himself and his local group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: An elderly Ativia ativia man appointed to perform the circumcision operation
    privately requested permission to delegate his duty to his son because of age
    and failing eyesight.
  category: speech
  evidence_refs:
  - ev:7
