canonical_text:
  quote: ''
  summary: The passage describes the custodianship and formal handover of Churinga
    associated with an Echunpa, or lizard, group. After the earlier group had become
    extinct, a neighboring Unchalka, or little grub, group took charge of the storehouse
    and its contents. A child later conceived at the old lizard locality was treated
    as reviving the local Echunpa group; once mature, he received the Churinga of
    his ancestors during the Engwura. Messengers brought the Churinga into camp, elders
    conferred in whispers, the objects were laid out on shields and gum-tree boughs,
    and older men explained their meaning and former owners to the new possessor,
    who then performed respectful gestures toward an elder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says an extinct group had consisted mainly of Panunga and Bukhara
    men, and a contiguous group of the same moiety entered into possession of its
    Churinga-related property.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The contiguous group was identified as Unchalka, or little grub, and its head
    man took charge of the storehouse and contents because no other lizard men lived
    nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wife of an Alice Springs man conceived a child in the old lizard locality,
    and the passage says the local Echunpa group was resuscitated in the person of
    her son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the lizard man reached maturity, the Engwura was used as the occasion
    to hand over the Churinga of his ancestors in the presence of tribal representatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Special messengers brought the Churinga into camp in the morning and handed
    them to their custodian, who took them down into the creek where older and younger
    men were gathered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Alatunja of the Unchalka totem and the Alatunja of two important witchetty-grub
    groups knelt toward one another and held a lengthy whispered conversation while
    others remained in solemn silence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The whispered discussion concerned holding an Echunpa or lizard ceremony after
    the present business had been carried as far as intended for the day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: About sixty Churinga were laid on shields and on small boughs cut from the
    gum tree under which the men sat.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man receiving the Churinga was called up and seated with the older men
    next to the Churinga.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Two old men spoke in whispers to the recipient and told him what the Churinga
    meant and to whom they had belonged.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the explanation, the new possessor rubbed his hands over the forehead
