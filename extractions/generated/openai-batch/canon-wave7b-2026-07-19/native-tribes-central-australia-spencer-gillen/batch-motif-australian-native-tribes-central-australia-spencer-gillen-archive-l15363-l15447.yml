canonical_text:
  quote: ''
  summary: The passage describes nightly initiation-ground procedures involving the
    Illpongwurra lying silently by the Parra under supervision, followed by sung and
    danced sacred ceremonies representing Oruncha men, frog-totem, wild-cat-totem,
    and white-bat-totem events. It includes a simulated earth-oven cooking performance,
    a frog-totem figure sniffing for cooking, a daybreak performance in which an old
    white bat man represents a tree linked to a frog-totem ancestor who went into
    the ground, and repeated movement of the Illpongwurra with bull-roarers and fire-throwing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boughs of Eremophila were arranged in a line on the east side of and parallel
    to the Parra.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Illpongwurra first sat in a row by the Parra, then lay silently on their
    backs close together with their heads resting on it.
  category: action
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:3
  text: The Illpongwurra were not allowed to speak or move without consent from old
    men in charge; some used gesture language to ask permission to drink at a soakage
    in the sand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Later in the night, men sang, ran sideways along by the Parra, and shouted
    loudly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a ceremony associated with Oruncha men of Imanda, one performer lay in
    a body-sized hole while two others knelt at his legs and head and, using boomerangs,
    imitated basting him and raking embers over him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man lying in the hole imitated the hissing and spluttering noise of cooking
    meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A decorated man representing an Alcheringa man of the frog totem came from
    the darkness and sniffed as though detecting cooking but unable to locate it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At about two o'clock, three men performed a wild-cat-totem ceremony described
    as an ordinary dancing festival in the Alcheringa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At daybreak, an old white bat man was decorated to represent a particular
    tree at Imanda, which appeared full-grown where a frog-totem Alcheringa man went
    into the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tree was described as the Nanja tree of the spirit part that remained
    behind associated with the frog-totem man's Churinga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After sunrise, the Illpongwurra were driven out of the ceremonial ground amid
    whirling bull-roarers; at dusk they were driven back by way of the women's camp,
    where fire-throwing was repeated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The procedure of first sitting and then lying down by the Parra was repeated
    every evening during the next two weeks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At midnight the Illpongwurra were aroused to witness the beginning of a white-bat-totem
    ceremony involving eleven decorated men.
  category: action
  evidence_refs:
  - ev:6
