canonical_text:
  quote: ''
  summary: The passage describes the Erathipa stone, its round hole associated with
    spirit children and conception, related avoidance and fertility rites, an Iknula
    charcoal mark, and an opossum totem ceremony connected with two Purula women and
    an Alcheringa wild cat journey ending in death and re-emergence as uncircumcised
    boys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Erathipa stone has a round hole on one side, through which spirit children
    are believed to look for women passing near; visiting the stone is believed to
    result in conception.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young woman who passes near the stone and does not want a child disguises
    herself as an old woman, changes her posture and voice, and tells the spirit children
    not to come to her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A black charcoal line called Iknula is painted above the hole and renewed
    by visiting men; a line of the same name is painted above the eye of a newborn
    child to prevent sickness.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man may go alone to the stone, clear ground around it, rub it with his hands,
    and recite words to cause women or children at a distance to become pregnant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A husband who wants to punish his wife for supposed unfaithfulness may rub
    the stone and recite words intended to make the child remain long in the woman
    and cause her death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man and his wife want a child, the man ties his hair-girdle around the
    stone, rubs it, and recites words addressed to the stone or its agency.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that similar Erathipa stones are found near Hermannsburg,
    at the west end of the Waterhouse Range, and near Running Waters on the Finke.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Opossum totem ceremony of Arimurla concerns two Purula women of the opossum
    totem who originated at Arimurla and never left it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Each performer in the opossum ceremony wore a T-shaped Nurtunja on his head,
    with Churinga suspended from the cross-bars; the Churinga had belonged to the
    two women.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The opossum ceremony included performers swaying to and fro and other men
    running around and around.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Alcheringa account, a party of wild cat people began near Wilyunpa,
    travelled north, halted and formed Oloianikilla at different places, and passed
    near Arimurla without seeing the two Purula opossum women.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The wild cat people met a solitary man from the northern salt-water country,
    of their own totem and called atnabitta, and killed him; a stone in Paddy's Creek
    is said to represent the slain man.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: After killing the man, the wild cat people travelled on eating Hakea, driving
    mosquitoes before them, and drinking their own blood when they could not get water.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: At Irri-mi-wurra the wild cat people all died, then sprang up again as Ulpmerka,
    or uncircumcised boys, and continued travelling while eating plums.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The narrator comments that the eating of a totemic animal or plant appears
    as a notable feature in several traditions.
  category: other
  evidence_refs:
  - ev:13
