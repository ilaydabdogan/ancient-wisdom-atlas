canonical_text:
  quote: ''
  summary: The passage describes Central Australian marriage rules in which named
    groups of men and women stand in a reciprocal marriageable relation, with actual
    marriage restricted to a proper group. It discusses wife-lending only within permitted
    categories, sanctions for forbidden relations, a Kaitish marriage custom involving
    a sequence of temporary marital access, and the authors' inference that present
    individual marriage preserves evidence of earlier group marriage and still wider
    marital relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a group of women called Unazva to a group of men,
    and vice versa, are reciprocally marriageable.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta example, a Panunga man calls the Purula woman he actually marries
    Unaiva, but the same term applies to other Purula women whom he does not marry
    but could lawfully marry.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man is said to have no actual right of access to any woman except his own
    special Unazva woman or women, apart from occasions such as ceremonies or visits
    when a woman may be lent to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lent woman must belong to the category of women who are Unazva to the man
    receiving her.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that obtaining a woman of a forbidden class by charming
    would bring no help from the man's own group and could result in his death at
    their hands or by request to another group.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man will not lend his wife to a man outside the group of men to whom she
    stands as Unazva or possible wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives the example that a Panunga man may lend his wife to another
    Panunga, while marital relations with her by a man of any other class would be
    a gross offence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: For the Kaitish tribe, when marriage takes place, the operation called Atna-ariltJia-kiivia
    in the passage is performed by the woman's elder sister.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The passage lists an order of men who have access to the Kaitish woman at
    marriage: Ipmunna, mothers'' brothers'' sons, tribal elder and younger brothers,
    and lastly men whom she might lawfully marry but who lose right to her after she
    becomes the property of a member of their group.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage concludes that, for a given time, a woman has marital relations
    with men of both moieties of the tribe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that once a woman has become the special wife of an individual
    man, she may lawfully have marital relations with any man in the group to whom
    she is Unazva, but this depends on the husband's consent.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'The authors identify three grades of development: present individual marriage
    with occasional wider relations, a prior time of actual group marriage, and a
    still earlier time of still wider marital relations.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that present-day marriage choice confines a man of one
    group to women of a particular group, and that he may lawfully marry any woman
    of that group.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: After a man secures a woman, the passage describes her as his private property,
    though he may lend her to other men only if they belong to his own group.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: 'The passage distinguishes two terms: At)ia-uylkna for surreptitious connection
    with a woman from the proper wife-giving group who is not the man''s own wife,
    and Itnrka for connection with a woman from forbidden groups.'
  category: speech
  evidence_refs:
  - ev:8
