  quote: ''
  summary: Ethnographic prose argues that Australian class and totem systems share
    a common ancestral basis with regional divergence, then explains how observation
    of the Arunta Engwura initiation revealed individual totem-name origins and Ouabara
    ceremonies tied to totems and particular places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Arunta and Ilpirra totem regulations agree, and that
    several named northern tribes are believed to accord with them on important points.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts these tribes with other Australian tribes described
    by earlier investigators and says differences show development along different
    lines from a common basis.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Australia as having had little intercourse with outside
    peoples except for slight influence on a small coastal fringe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage presents the class and totem systems as best explained by ancestors
    spreading across the country, separating into local groups, and retaining features
    from a common ancestry.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The authors state that close watching and questioning during the Engwura ceremony
    enabled them to learn how individual totem names originate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Engwura ceremony is described as the last initiatory rite before an Arunta
    person becomes Urliara and is admitted to the tribe's most sacred secrets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Engwura is described as a long series of ceremonies occupying more than four
    months.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Between sixty and seventy totem-connected ceremonies were performed under
    the direction of old men, who instructed younger men how to perform them and what
    they represented.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The native name for these ceremonies is given as Ouabara, and each ceremony
    is said to be of a certain totem associated with a particular spot.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Examples given include a Hakea flower totem ceremony of Ooraminna and a wild
    cat totem ceremony of Urapitchera.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A footnote says tooth-knocking ceremonies vary in initiation significance
