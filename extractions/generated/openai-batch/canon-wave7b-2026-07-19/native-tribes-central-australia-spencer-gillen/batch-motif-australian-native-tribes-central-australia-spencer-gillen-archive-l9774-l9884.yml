canonical_text:
  quote: ''
  summary: 'The passage recounts a kangaroo tradition in which a worn-out kangaroo
    is attacked by kangaroo men and the Bukhara man, who is trampled to death. The
    kangaroo body is placed in a cave and its spirit becomes associated with a rock
    ledge, while men’s spirit parts enter a nearby water pool. The passage then describes
    the Okira or kangaroo totem Intichiuma ceremony at Undiara: restricted participants
    approach sacred places, uncover and rub a hidden sandstone object identified as
    the Alcheringa kangaroo’s tail, rub two blocks representing kangaroos, and paint
    a rock face with red and white stripes representing fur and bones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kangaroo reached Ulpmura worn out and lay down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Undiara men used gesture language to ask the Bukhara man about big spears,
    and both sides said they had only little spears.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men put down their spears and advanced on the kangaroo while the Bukhara
    man kept a shield and Churinga in his hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kangaroo tossed the men about; they jumped on him, and the Bukhara man
    underneath was trampled to death while the kangaroo appeared to be dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Bukhara man was buried with his shield and Churinga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The kangaroo body was taken to Undiara, placed in the cave, not eaten, and
    then died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A rock ledge in the cave arose where the kangaroo body was put, and the kangaroo’s
    spirit part went into it, making it the animal’s Nanja.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The men died shortly afterwards and their spirit parts went into the nearby
    water pool; later, many kangaroo animals came to the cave, went down into the
    ground, and their spirits also went into the stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Alatunja, a Purula head man, directs the Intichiuma ceremony and may delegate
    its performance to his eldest son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Before the ceremony, a camp is made west of the cave and out of sight of the
    water-hole, and a younger man is sent ahead to ensure that women, uninitiated
    men, and non-totem men are not nearby.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: A hidden underground grey sandstone block is uncovered by the leader, and
    the Alatunja rubs its exposed surface while the men stand silently around.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The uncovered stone is identified as the Churinga okira pura, the tail of
    the Alcheringa kangaroo, and nearby large sandstone blocks are said to represent
    dead wild dogs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the hidden stone is covered again, the party drinks at the water-hole
    and sits before the ceremonial stone with Panunga and Bulthara men on one side
    and Purula and Kumara men on the other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Purula head man and a Bulthara man climb to two special blocks of stone,
    one representing an old male kangaroo and the other a female, and rub them with
    stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The men decorate the rock ledge with alternate vertical red and white lines;
    Panunga and Bulthara men paint the left side and Purula and Kumara men paint the
    right side.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The red stripes are said to represent the red fur of the kangaroo, and the
    white stripes represent bones.
  category: relationship
  evidence_refs:
  - ev:8
