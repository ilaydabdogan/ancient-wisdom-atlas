canonical_text:
  quote: ''
  summary: The passage describes the Urabunna marriage system as having two classes,
    Matthurie and Kirarawa, whose members marry across class lines. It says that a
    Matthurie man stands in the relation called Niipa to a group of Kirarawa women,
    may have one or more Niipa women allotted as wives, and has first but not exclusive
    access to them. It also describes Piraungarii women as wives of other men of his
    own group, resulting in marital relations between a group of women and a group
    of men. The passage compares this situation with the neighbouring Dieri tribe.
  language: English
