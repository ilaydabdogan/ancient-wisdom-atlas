canonical_text:
  quote: ''
  summary: The passage describes a solemn return of Churinga to the Alatunja and his
    group. The visiting Inwurra leader unwraps the Churinga from opossum-fur bands
    and hair girdles, while friendship gestures are repeated. The Alatunja and old
    men examine and rub the Churinga on themselves and their group. Formal speeches
    accompany the return and reciprocal gifts of Imitnya and Uliara. The Alatunja
    divides a grass-seed cake with a Churinga and gives food to visiting leaders.
    The passage ends by noting that an emu totem Intichiuma ceremony is to follow
    but is not necessarily part of every Churinga return.
  language: English
  quote_policy: summarized
