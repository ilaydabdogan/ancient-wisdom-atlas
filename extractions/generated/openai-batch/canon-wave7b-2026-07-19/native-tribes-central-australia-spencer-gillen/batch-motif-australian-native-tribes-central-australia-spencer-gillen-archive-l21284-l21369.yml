canonical_text:
  quote: ''
  summary: 'The passage describes an Arunta widow''s ceremony for ending a mourning
    silence: she prepares a wooden vessel with food, renews white pipeclay, goes with
    women to the camp center, is joined by sons and younger brothers of the dead man,
    and participates in shouting and shield-striking actions after which she may speak
    again. The passage also explains the food as symbolizing a return to ordinary
    women''s work, the offering as a way to gain goodwill from the dead man''s sons
    and younger brothers, and the later rule that the widow may become the wife of
    one of the younger brothers after mourning ends.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage first notes that hand, elbow, and finger positions are used in
    varied forms, and that these finger positions can be difficult for a white observer
    to imitate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the widow wants the ban of silence removed, she gathers a large wooden
    vessel called a Tirna full of edible seed or small tuber and smears herself again
    with white pipeclay at the women's camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow carries the Tirna with accompanying women to the center of the encampment,
    at the dividing feature between two community sections.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women sit and cry loudly, and the sons and younger brothers of the dead
    man come and join the party.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The men take the Tirna from the widow, hold it together as much as possible,
    and shout; the women except the widow stop crying and join the shout.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tirna is held close to, but not touching, the widow's face, and passes
    are made to the right and left of her cheeks while the group shouts; the widow
    then stops crying and repeats the shout in subdued tones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men squat while holding shields and strike the shields heavily on the
    ground in front of the standing women; the widow rises and joins the shouting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the shield-striking, the men disperse to their camps and eat the food
    brought in the Tirna, and the widow is free to speak to them while still continuing
    to smear herself with pipeclay.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the tubers or grass seed symbolize that the widow
    is about to resume ordinary women's occupations after a period of deep mourning.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that the offering to the dead man's sons and younger brothers
    is meant to show that the widow has properly carried out the first period of mourning
    and to gain their goodwill.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the younger brothers are considered displeased with the widow
    for a time, and that a younger brother could spear the widow if he found her doing
    ordinary women's work in the bush too soon after her husband's death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that after the final stage of mourning the widow will become
    the wife of one of the younger brothers, whom she initially must avoid.
  category: sequence
  evidence_refs:
  - ev:8
