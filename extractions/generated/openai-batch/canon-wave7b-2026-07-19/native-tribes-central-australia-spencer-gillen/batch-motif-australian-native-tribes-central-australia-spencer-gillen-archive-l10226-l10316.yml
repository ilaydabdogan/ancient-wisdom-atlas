canonical_text:
  quote: changed himself into a kangaroo man
  summary: The passage discusses Arunta traditions and Intichiuma-related customs
    in which totemic identity, transformation, and eating of the totemic animal or
    plant are used to argue for an earlier state of totemic practice different from
    present custom. It also compares these statements with South-Western Australian
    reports of totem names derived from former subsistence and of bird totems transformed
    into men.
  language: English
  quote_policy: quoted
