canonical_text:
  quote: ''
  summary: The passage recounts movements of Alcheringa ancestral parties around Jessie
    Gap, Emily Gap, Emily Creek, and related places. Groups are warned or blocked
    from entering gaps, leave individuals at named places, paint themselves, eat totemic
    food, perform ceremonies, travel underground, and are marked by arising trees
    or other landforms. A footnote relates the warnings to territorial permission.
    The passage then begins a tradition of women travelling with Nurtunja and Churinga,
    performing ritual acts, and leaving a gully and stone marker before travelling
    underground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A travelling party reached the entrance to Jessie Gap, saw witchetty men,
    and was warned by Kakathurika not to approach nearer to the gap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same party travelled to Lalknika on Emily Creek, painted Ilkinia on their
    bodies, and left an unnamed Panunga woman there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The party left men and women at the Todd River, left the Panunga man Pitcha-arinia
    near the banks, and later sat on the eastern side of Emily Gap where a group of
    trees arose to mark the place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later immigrant party from Ungwia in the Hart Ranges, composed of both sexes,
    travelled underground to Ilpirulcha, painted themselves with Ilkinia, and ate
    witchetty grubs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Achilpa-interninja the immigrant party painted themselves and ate more
    totemic grub; the place is identified as one where an Achilpa travelling group
    lost a small Churinga.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The immigrant party halted on hearing Intwailiuka singing, left Bukhara individuals
    at several places including Chantunga, and performed sacred ceremonies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near the mouth of the gap, trees arose where the immigrant party stood; Intwailiuka
    objected to their passing through the gap, so they entered the ground and came
    up again on the south side at Ertichirticha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the immigrant party wished to continue to Wulpa, Intwailiuka told them
    to remain; they stayed at the gap, and gum trees mark where they sat down.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The note states that the warnings by Intwailiuka and Kakathurika indicate
    exclusive rights over country and the need for permission before entering another
    group's area.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that forty living individuals are regarded as descendants
    of the original Emily Gap resident group and immigrant parties.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Panunga woman of the Quirra bandicoot totem left Ilki-ira carrying a Nurtunja
    and Churinga, met a Panunga woman of the Unjiamba totem who also had a Nurtunja,
    and took her and her Nurtunja southward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Alkniara the two women camped, made quabara undattka, and the Quirra woman
    performed Atna ariltha-kuma on her companion; a great gully and a large stone
    arose to mark the place, after which the women went down into the ground and travelled
    southward.
  category: sequence
  evidence_refs:
  - ev:9
