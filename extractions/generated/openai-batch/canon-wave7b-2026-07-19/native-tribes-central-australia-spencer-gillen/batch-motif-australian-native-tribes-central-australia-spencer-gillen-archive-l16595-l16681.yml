canonical_text:
  quote: "“thus, out of the Inapertiva, men and women were formed.”"
  summary: The passage describes ancestral Ungambikula shaping Inapertiva beings into
    men and women associated with animal and plant totems, performing circumcision
    on most with a fire-stick, later transforming themselves into small lizards, and
    a subsequent episode in which Oruncha beings kill and eat several totemic peoples
    while two lizard brothers survive and prepare for conflict at Simpson Gap.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Inapertiva are formed into men and women by releasing or adding arms,
    fingers, legs, toes, nose, nostrils, mouth, eyelids, and other body parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Inapertiva are described as stages in the transformation of various animals
    and plants into human beings, with each individual associated with the animal
    or plant of which he or she was a transformation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The Ungambikula made Inapertiva into men belonging to named totems: plum
    tree, grass seed, large lizard, small lizard, Alexandra parakeet, and small rat.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For all named totems except the plum tree, the Ungambikula performed the rite
    of lartna or circumcision by means of a fire-stick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After completing their mission, the Ungambikula transformed themselves into
    little lizards called Ajnunga-quiniaquiiiia; the passage says no reason is given
    for this.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some plum tree men of Quiurnpa and certain grass seed men were made into human
    beings but not circumcised, and so remained Ulpinerka, the term applied to boys
    before the rite.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ungambikula intended to return to complete the work, but did not return
    after being annoyed by Oruncha or Onuncha beings at Atnuraquina near Temple Bar.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Oruncha killed and ate many lizard men and women, and also ate Alexandra
    parakeet, grass seed, and small rat people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only two lizard men survived the slaughter; the passage identifies them as
    brothers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger lizard brother and his lizard wife were away to the south when
    the slaughter occurred; after returning, he saw the tracks of the Oruncha and
    hid his wife in his Ilpilla feather bundle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger brother found the head of his elder brother, spoke to it, and
    the elder brother came to life and warned him about the Oruncha.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The two men armed themselves with heavy one-piece Urmupira spears and went
    to opposite sides of Simpson Gap, described as an important local centre of the
    lizard totem.
  category: action
  evidence_refs:
  - ev:7
