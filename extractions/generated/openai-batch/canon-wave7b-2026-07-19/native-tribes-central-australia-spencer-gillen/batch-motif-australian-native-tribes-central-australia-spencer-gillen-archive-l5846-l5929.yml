canonical_text:
  quote: ''
  summary: The passage discusses hypotheses for customs involving the lending of wives
    or sexual access to women in Australian tribes. It distinguishes hospitality toward
    men outside tribal law from regulated access among tribal members, rejects a chief-authority
    explanation for Australian evidence, and considers but cautions against drawing
    conclusions from reports of bride capture and privileges claimed by assisting
    captors.
  language: English
  quote_policy: summarized
