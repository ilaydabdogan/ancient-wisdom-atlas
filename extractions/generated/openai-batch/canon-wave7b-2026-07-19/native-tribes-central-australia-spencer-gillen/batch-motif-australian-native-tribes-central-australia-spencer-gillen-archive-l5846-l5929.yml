- id: obs:3
  text: A footnote states that broad claims about men having access to a woman are
    not useful unless exact conditions and relative status are known, and that the
    authors found such intercourse strictly regulated by custom in nine tribes examined
    by them.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
