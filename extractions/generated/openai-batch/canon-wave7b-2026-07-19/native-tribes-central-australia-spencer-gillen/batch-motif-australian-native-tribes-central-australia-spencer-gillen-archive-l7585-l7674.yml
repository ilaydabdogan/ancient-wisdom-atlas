  quote: ''
  summary: The passage describes Arunta Churinga as wooden or stone objects connected
    with totems, ceremonies, storehouse representations, ancestral traditions, manufacture,
    surface patterns, pigment rubbing, and restricted interpretation of incised designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Churinga are connected with totem ceremonies and differ from the majority
    by not being associated with the idea of a spirit individual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other Churinga in the storehouse represent objects such as witchetty eggs,
    a pitchi carried by an Alcheringa man, or a yam-stick carried by a woman.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Churinga vary greatly in size and shape, from a few inches to five feet or
    more, and are usually flattened, oval or elongated; five old wooden examples belonging
    to two lizard totems are described as curved-boomerang-shaped.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some small Churinga have a pierced hole at one end with a string, usually
    made from human or opossum hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small bored Churinga are used as bull-roarers during certain ceremonies by
    whirling them with a taut string so that rotation and string vibration produce
    a roaring sound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some stone Churinga are bored but are not used as bull-roarers at the present
    time; the passage connects this boring with traditions that Alcheringa men hung
    Churinga on the Xiirtiuija.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stone Churinga are usually made from micaceous stone split from rock and ground
    down; wooden ones are generally made from Mulga, or otherwise pine or certain
    Eucalyptus woods.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Most wooden and stone Churinga have incised patterns, usually made with an
    opossum incisor tooth, which is also used for boring holes when present.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some Churinga are plain, and on others earlier markings have become hard to
    read because of repeated rubbing by generations of people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When old men examine Churinga, they rub them carefully with their hands; dry
    red ochre is powdered on and rubbed in, while some stone examples are rubbed with
    charcoal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The patterns on Churinga are said to have definite meanings, and deciphering
    each one requires information from a man of the totem to which it belongs.
  category: speech
  evidence_refs:
  - ev:8
