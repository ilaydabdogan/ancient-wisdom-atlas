  summary: The passage discusses uncertainty in ranking descent systems as more or
    less primitive, explains hypothetical exogamous group descent reckoning, and gives
    ethnographic measurements and descriptions of Central Australian people, including
    stature, facial features, skin colour assessment, ceremonial grease and red ochre
    use, and infant skin colour changes.
