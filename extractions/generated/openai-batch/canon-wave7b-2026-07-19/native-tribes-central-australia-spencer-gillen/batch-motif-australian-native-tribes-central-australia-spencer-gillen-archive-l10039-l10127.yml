canonical_text:
  quote: ''
  summary: 'The passage describes several Intichiuma-related procedures for kangaroo,
    Irriakura, Idnimita grub, and bandicoot totems: offerings or captured totem substances
    are brought to the men''s camp, handled by the Alatunja and totem members, used
    in anointing, blowing, eating, or distribution, and followed by sparing consumption
    or restrictions. It explains that totemic animals or plants are nearly taboo to
    their members, that members claim power to increase them, and that at Undiara
    kangaroo spirits are associated with a rock, cave, and water hole, with present
    ceremonies said to drive out kangaroo spirits by pouring kangaroo men''s blood
    on the rock.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kangaroo meat is taken to the men's camp, where old men of the totem, with
    the Alatunja in the middle, eat a little and anoint ceremony participants with
    kangaroo fat before distributing the meat to assembled men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of the kangaroo totem paint their bodies with the totem design, called
    Ilkinia, in imitation of the painting on the rock at Undiara.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The night is spent singing about Alcheringa kangaroo people and animals; the
    next day young men hunt more kangaroo and the previous day's procedure is repeated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kangaroo proceedings end with sacred Ouabara connected with Undiara, after
    which kangaroo men eat the animal very sparingly and avoid certain choice parts
    such as the tail.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Irriakura totem, members do not eat the totem for some time after Intichiuma,
    while non-members bring a quantity of the tubers to the men's camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Alatunja and other Irriakura men rub tubers between their hands, put the
    tubers in their mouths, and blow them out in all directions; after this Irriakura
    people may eat sparingly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Idnimita totem, members do not eat the grub until it becomes plentiful;
    non-members collect it and bring it to the men's camp, where the Alatunja and
    totem men eat some smaller grubs, return the rest, and then may eat sparingly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Bandicoot totem, the animal is not eaten until plentiful; non-members
    catch one and bring it to the men's camp, where fat is put into the mouths of
    bandicoot men and rubbed over the bodies of those performing the action, after
    which bandicoot men may eat a little.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the totemic animal or plant is almost, but not quite,
    tabu or ekirinja to members of the totem.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports that a man may say his totem is the same thing as himself,
    while distinguishing this from a belief that killing one individual of the species
    would kill his nearest friend.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Members of each totem claim the power to increase the number of their associated
    animal or plant.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Undiara is described as the great centre of the kangaroo totem, just as Emily
    Gap is described as the great centre of the Witchetty grub totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Alcheringa account, a special kangaroo was killed by kangaroo men,
    its body was brought to Undiara and placed in a cave close to a water hole, a
    rocky ledge arose to mark the spot, and spirit parts entered the rock.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The rock is described as the Nanja stone of kangaroo animals and as full of
    spirit kangaroo animals, while the nearby water hole is described as full of spirit
    men and women.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The stated present-day purpose of the Intichiuma ceremony is to pour blood
    of kangaroo men upon the rock, driving kangaroo animal spirits out in all directions
    and increasing the number of kangaroos.
  category: action
  evidence_refs:
  - ev:8
