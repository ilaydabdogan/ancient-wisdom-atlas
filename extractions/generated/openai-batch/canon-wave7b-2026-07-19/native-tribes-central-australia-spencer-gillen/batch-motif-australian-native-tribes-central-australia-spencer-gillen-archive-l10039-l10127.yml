candidate_motifs:
- id: motif:1
  label: totemic increase ceremony
  taxonomy_refs: []
  basis: The passage states that members of each totem claim power to increase their
    animal or plant and explains the kangaroo ceremony as driving spirit kangaroos
    out to increase the number of animals.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage gives an ethnographic explanation rather than a mythic narrative
    alone; no external taxonomy ID directly names this motif.
- id: motif:2
  label: restricted consumption of the totem after ritual handling
  taxonomy_refs: []
  basis: Kangaroo, Irriakura, Idnimita, and Bandicoot totem members abstain, eat sparingly,
    or avoid selected portions after Intichiuma-related rites.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage says the totem is almost but not fully taboo, so the motif
    should not be coded as absolute food prohibition.
- id: motif:3
  label: non-totem members provide totem substance for ritual use
  taxonomy_refs:
  - sacred_exchange
  basis: For Irriakura, Idnimita, and Bandicoot rites, people who do not belong to
    the totem bring the relevant plant, grub, or animal into the men's camp, where
    totem members perform limited eating or handling and in one case return the remainder.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage describes transfer and return/distribution, but does not explicitly
    frame the act as an exchange in theological terms.
- id: motif:4
  label: blood on sacred rock releases animal spirits
  taxonomy_refs:
  - sacrifice
  basis: The present kangaroo Intichiuma ceremony is said to pour the blood of kangaroo
    men on the rock in order to drive out kangaroo animal spirits and increase kangaroos.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage mentions pouring blood but does not state that a life is offered
    or killed in the present ceremony; 'sacrifice' is therefore only a cautious taxonomy
    association.
- id: motif:5
  label: sacred totem centre as spirit reservoir
  taxonomy_refs:
  - world_center
  basis: Undiara is called the great centre of the kangaroo totem; the rock is described
    as the Nanja stone full of spirit kangaroo animals, and the nearby water hole
    is full of spirit men and women.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The centre is a local totemic centre, not explicitly a universal cosmic
    world center.
- id: motif:6
  label: directional dispersal to promote abundance
  taxonomy_refs: []
  basis: Irriakura tubers are blown out in all directions, and kangaroo spirits are
    driven out in all directions from the rock to increase animals.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The passage directly states the increase purpose for the kangaroo rite;
    for the Irriakura blowing, the increase function is implied only by placement
    within the Intichiuma description.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Undiara's function for the kangaroo totem
    with Emily Gap's function for the Witchetty grub totem, describing both as great
    centres of their respective totems.
  claim_level: same_function
  target: Emily Gap as great centre of the Witchetty grub totem
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: Only the status as a totemic centre is compared in this passage; detailed
    ritual procedures at Emily Gap are not included here.
- id: claim:2
  claim: 'The passage presents the kangaroo rock and the nearby water hole as analogous
    containers of spirits: the rock for kangaroo animal spirits and the water hole
    for spirit men and women.'
  claim_level: same_function
  target: nearby water hole as spirit place for men and women
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage analogy and should not be extended beyond
    the stated relationship.
- id: claim:3
  claim: The Irriakura, Idnimita, and Bandicoot sections share a pattern in which
    non-totem members bring the totemic substance to the men's camp and totem members
    may consume it only after a prescribed rite or condition.
  claim_level: same_function
  target: post-Intichiuma procedures for Irriakura, Idnimita, and Bandicoot totems
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The actions differ by totem: tubers are blown out, grubs are partly
    eaten and returned, and bandicoot fat is applied to mouths and bodies.'
