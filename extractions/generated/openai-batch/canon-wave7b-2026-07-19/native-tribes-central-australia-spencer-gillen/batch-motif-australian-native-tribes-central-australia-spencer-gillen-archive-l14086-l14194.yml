canonical_text:
  quote: ''
  summary: The passage recounts the west-to-east and circuitous wanderings of two
    kangaroo men carrying a Waninga, forming kangaroo totem Oknanikilla sites, traveling
    underground, making a clay plain with blood from their arms, and finally entering
    the Illara water-hole. It then describes how knowledge of Alcheringa ancestor
    wanderings is taught during the Engwura initiation, followed by sixth- and seventh-day
    ceremonial performances involving Ulpmerka grass-seed totem figures, Nurtunja
    construction, singing, armlets, a sacred pole, and decorated head-dresses with
    Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two kangaroo men came from the far west carrying a large Waninga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Umbera-wartna they formed an Oknanikilla by depositing Churinga in the
    ground, leaving behind spirit individuals of the kangaroo totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Urpunna they erected their Waninga and formed another Oknanikilla.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The kangaroo men went underground beneath Lilla Creek, emerged at Amanda or
    Mount Watt, rested, and formed an Oknanikilla.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After traveling underground beneath Wichinga/Hamilton Creek and the Alberga,
    they emerged at Marpinna and formed an Oknanikilla.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Marpinna they opened veins in their arms and let blood stream over the
    ground, making a large level clay plain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After further travel through southern, western, and northern country, they
    reached Tempe Downs and later went down with their Waninga into the Illara water-hole,
    forming an important kangaroo totem Oknanikilla.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the Engwura ceremony, elders impart knowledge of Alcheringa ancestor
    wanderings to younger men, and the ceremonies are associated with particular places
    and individuals or groups.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the sixth day, a ceremony concerned Ulpmerka men of the Inguitchika grass-seed
    totem of Imiunga on the Jay River.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sixth-day ceremony belonged to a Purula man and was performed by a Bulthara
    man with assistance from a Panunga man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Nurtunja was made from two sticks swathed in grass stalks, bound with hair-string,
    tied crosswise, and decorated with feathers and down.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the Nurtunja performance, two men squatted with gum-tree twigs while
    one bore the Nurtunja on his head; other men ran around them, and two old men
    sang about the Ulpmerka men walking in the Alcheringa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the evening of the sixth day, men beside the Parra sang about fur armlets
    for young men undergoing Engwura and about the Kauana sacred pole to be erected
    later.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: On the seventh day an important Quabara of the Ulpmerka of Ouiurnpa was performed
    by seven performers with top-knots, Churinga head-dresses, eagle-hawk feathers,
    a large head-dress, a bent stick, feather tufts, and suspended Ulpmerka Churinga.
  category: action
  evidence_refs:
  - ev:9
