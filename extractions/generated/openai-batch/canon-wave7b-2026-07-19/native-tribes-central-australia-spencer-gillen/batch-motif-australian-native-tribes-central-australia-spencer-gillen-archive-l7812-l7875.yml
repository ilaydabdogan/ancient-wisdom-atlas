canonical_text:
  quote: ''
  summary: The passage describes designs on several Churinga nanja. One preceding
    design includes a man preparing animals, a grub, eggs, and body marks. Figure
    E is associated with the elder of two women who accompanied Ulpmirka men of the
    Ukakia or plum-tree totem in the Alcheringa and were taken north by Kukaitcha;
    its marks represent frogs, women’s tracks, gum-tree bark, and an old woman collecting
    frogs. Figure F is associated with the younger of the same two women and represents
    frogs, seated women, frog holes in sand, and a vulva. Figure G is associated with
    an Echunpa or lizard man and maps lizard anatomy and tracks; the object is described
    as very old and worn.
  language: English
  quote_policy: summarized
