canonical_text:
  quote: ''
  summary: The passage first recounts travellers who encounter a wild dog man, open
    a bag containing Churinga, deposit it at Kurdaitcha, and see a Kumara man and
    a large stone arise there before one man goes into the ground on another's back.
    It then begins the wanderings of two Unjiamba or Hakea women, Abmoara and Kuperta,
    who spring up at Ungwuranunga, travel through the ground and above ground, encounter
    or pass other totemic women, erect and dismantle their Nurtunja, and eat Unjiamba.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Travellers find another wild dog man who has a Nurtiinja and ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Eri-quatcha the travellers open a bag, look at Churinga that flutter about,
    and close the bag again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travellers cross Hanson Creek at Urumbia and reach Kurdaitcha, west of
    Central Mount Stuart, where an Achilpa party is said to have camped long afterwards.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Kurdaitcha the travellers deposit the bag containing Churinga; a Kumara
    man named Kurdaitcharinia springs from it, and a large stone arises at the deposition
    spot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that only one wild dog man can arise at a time at the spot
    in the middle of an Achilpa locality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Churinga are deposited, one man mounts onto the back of another
    and goes into the ground; only far western people know where they came out again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two Unjiamba totem women, Abmoara and Kuperta, spring up at Ungwuranunga with
    a Nurtunja and Churinga and dwell alongside their Ertnatulunga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The two Unjiamba women enter the ground and come out again at Arapera, where
    they see a Purula wild cat woman named x'\rilthamariltha with a big Nurtunja.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The two Unjiamba women do not join the wild cat woman; they camp close by
    and eat Unjiamba.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Travelling above ground to Okillalatunga, the women erect their Nurtunja and
    look for Unjiamba, but do not see another Purula Unjiamba woman camped there with
    a large Nurtunja around which an Achilpa party danced.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The women take their Nurtunja to pieces, go to Atnyra-ungwurna-munia to camp
    and eat Unjiamba, then go to Unthipita, where they erect the Nurtunja again, play
    about, and continue looking.
  category: sequence
  evidence_refs:
  - ev:10
