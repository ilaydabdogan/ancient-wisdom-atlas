  quote: ''
  summary: The passage explains how kinship terms and relationship rules are learned
    and enforced, especially by elder men. It describes rules governing marriage,
    speech avoidance, food or hair obligations, and punishments. It then discusses
    how men moving between the neighboring Arunta and Urabunna are assigned equivalent
    class or moiety status, with spouses and children reclassified so that descent
    rules fit the receiving group's system.
  language: English
