canonical_text:
  quote: ''
  summary: The passage describes beliefs and practices concerning spirit-child conception,
    the dropped or made Churinga, the child's Nanja tree or stone, the sacred Ertnatulunga
    storehouses, and restrictions on women's access to these objects and places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tradition states that when a spirit child enters a woman, a Churinga is
    dropped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After birth, the mother tells the father the tree or rock near which she supposes
    the child entered her, and the father with older male relatives searches there
    for the dropped Churinga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Churinga is usually supposed to be a stone object marked with a design
    peculiar to the spirit child's totem, which is also the newborn child's totem.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the Churinga cannot be found, a wooden one is made from a hard-wood tree
    near the Nanja and carved with a totemic device or brand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Nanja tree or stone of the spirit becomes the child's Nanja, and the Churinga
    becomes the child's Churinga nanja.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person is described as having a definite relationship with the Nanja tree
    or stone, including fear that harm may follow if a particular Nanja tree is cut
    down.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Animals on a person's Nanja tree, such as an opossum or bird, are tabu to
    that person and must not be touched.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Nanja tree is described as the former home of the spirit whose reincarnation
    the person is.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Each local totem centre has an Ertnatulunga, a sacred storehouse usually formed
    as a small cave or crevice in an unfrequented place among hills and ranges.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The storehouse entrance is blocked with naturally arranged stones, and the
    storehouse contains bundled Churinga.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Every member of the tribe, men and women alike, is represented in one of the
    storehouses by a Churinga nanja.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: After a child's Churinga nanja is found or made, it is handed to the headman
    of the local totem group of the conception district and deposited in the Ertnatulunga.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Churinga nanja is said to belong in the storehouse of the locality from
    which the spirit child came, not in the place where the child was born or raised.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Men and women are both said to possess Churinga nanja, but men may eventually
    see and handle theirs while women may never see them.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Women are forbidden to pry into the Ertnatulunga and its contents at risk
    of death, and they avoid going near the storehouse localities.
  category: action
  evidence_refs:
  - ev:15
