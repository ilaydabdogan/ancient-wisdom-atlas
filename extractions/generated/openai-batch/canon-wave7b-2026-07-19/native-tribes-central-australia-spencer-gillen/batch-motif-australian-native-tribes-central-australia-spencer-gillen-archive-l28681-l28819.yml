canonical_text:
  quote: ''
  summary: Glossary entries define Arunta, Ilpirra, and related terms for totems,
    initiation and circumcision practices, spirit and mourning concepts, ancestral
    beings, magical objects, ceremonial places, and relationship terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several entries define animals, plants, seeds, flowers, grubs, frogs, bats,
    rats, and lizards as names that give their names to totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hill is said to have arisen to mark the place where wild dogs threw down
    the liver of a celebrated kangaroo from the mythical past.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hooked pointing stick is described as an implement supposedly used by spirits
    to insert into people's bodies in order to annoy them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hollow branch musical instrument is also described as an object of magic,
    and a magic stone is said to be in the body of a medicine man.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several entries concern circumcision and initiation, including the uncircumcised
    boy, burial marker for the foreskin, handing of a fire-stick, the novice sitting
    on a man's lap, and fully initiated men who have passed through Engwura.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The spirit part of a dead man is said to haunt the grave precincts until the
    final mourning ceremony is performed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The final mourning ceremony is conducted at a grave and is glossed as trampling
    twigs on the grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'In ceremonies connected with totems, objects may represent animal life stages
    or sounds: a bough shelter represents a chrysalis, small round stones represent
    witchetty grub eggs, and short sticks imitate frog croaking.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A cave is associated with the kangaroo totem and is a place where an Intichiuma
    ceremony is performed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two beings called Ungambikula are said to have transformed hiapertwa creatures
    into human beings, and their name is glossed as self-existing or made out of nothing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A mythical Arunta ancestor is described as carrying a bundle while journeying
    over the country; the bundle contained men and women.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Women of the mythical past called Unthippa are said to have danced across
    the country from west to east, and a circumcision dance commemorates them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Some sacred ceremonies using down are described as ceremonies that women,
    with rare exceptions, are not allowed to see.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: A special part of the main camp is described as the place where men assemble
    and near which women may not go.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: A boy may give his hair to a man who has relinquished a right to the boy's
    sister as wife.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Fire and a spark of fire are separately glossed, and a fire-stick or lighted
    bark is connected with circumcision before the stone knife.
  category: object
  evidence_refs:
  - ev:4
  - ev:12
