  quote: ''
  summary: The passage enumerates Arunta kinship terms, marriage categories, subclass
    affiliations, reciprocal relations, and differences in terminology depending on
    whether the speaker is represented as male or female. It describes who may or
    may not be married, how children of siblings are classified, how grandparent-grandchild
    relations are named, and several special terms for affinal and cross-related kin.
  language: English
