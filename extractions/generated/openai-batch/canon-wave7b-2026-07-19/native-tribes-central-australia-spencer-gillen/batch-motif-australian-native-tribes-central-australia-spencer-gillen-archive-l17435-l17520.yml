canonical_text:
  quote: ''
  summary: A party of Achilpa ancestors travels west and north, encounters named totemic
    people, suffers thirst on the Burt Plain, performs Ariltha and Engwura rites,
    and joins Ouirra men in an Engwura. At Inta-tella-warika an old Panunga Achilpa
    man opens a vein and floods the country with blood, drowning the Achilpa men;
    stones and Churinga mark the place. A third Achilpa party travels northwest under
    a Kumara leader, erects a Kauaua and makes Engwura at Urapitchera, encounters
    Inturrita pigeon people described as cannibals, and later changes language to
    that of the Arunta people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Achilpa party travels west through Ungunja, Harry Creek, and Apunga, reaching
    the Burt Plain north of the Macdonnell Ranges.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the Burt Plain there is no water; the old men are thirsty, dig without
    finding water, and the holes remain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young men bleed themselves, but the blood is too hot to drink; some are
    sent back to bring water in shields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: While the young men are away, the old men dig holes in the sand and lie down
    in them like wild dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Ilthwarra the group performs Ariltha on a number of young men and makes
    Engwura.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a gap in the Hamm Range they see Kapirla, an old Bukhara man of the Undathirka
    or carpet-snake totem, who lives on carpet-snakes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Ilchinia-pinna the Achilpa hear distant bull-roarers; at Utachuta they
    find Ouirra bandicoot men making an Engwura with a visible Kauaua.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Achilpa and Ouirra men mix together and join in the Engwura; old men send
    young men into the bush daily, and Ariltha is performed on Ouirra men and some
    Achilpa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Inta-tella-warika an old Panunga Achilpa man with a large Nurtunja opens
    a vein in his arm and floods the country, drowning the Achilpa men in blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Stones spring up to mark the spot where the men went into the ground, and
    many Churinga carried by the men are said to be in the sacred store-house at Inta-tella-warika.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: A third Achilpa party, directed by a Kumara man named Atnijuniala-truripa,
    travels northwest, crosses the Finke River, camps at Urapitchera, erects a Kauaua,
    and makes Engwura.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Urapitchera the Achilpa find Inturrita pigeon men and women of all classes
    described as cannibals; two large round Churinga represent heads of eaten men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Inturrita kill victims with long stone Churinga described as about the
    size and shape of Warramunga beaked boomerangs; the Achilpa then change their
    language to that of the Arunta people.
  category: sequence
  evidence_refs:
  - ev:8
