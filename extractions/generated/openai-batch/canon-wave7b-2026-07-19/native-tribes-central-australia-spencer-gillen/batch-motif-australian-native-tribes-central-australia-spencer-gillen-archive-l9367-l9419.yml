  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One important water-totem group is a local subdivision of the Arunta east
    of Alice Springs in a district called Kartwia quatcha, or “rain country.”
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains that Quatcha strictly means water, while rain is described
