canonical_text:
  quote: ''
  summary: The passage introduces the Ouatcha, or water-totem, Intichiuma in connection
    with rain-making. It distinguishes public dancing festivals from a sacred ceremony
    restricted to initiated men of the water totem. It says that Irtchwoanga imparted
    the rain-making secret and fixed the ceremonial places in the Alcheringa. A water-totem
    group east of Alice Springs inhabits Kartwia quatcha, the “rain country.” Its
    current Alatunja, also called Chantchwa, is a celebrated rain-maker; his office
    passed from his father to him rather than to his elder brother because he had
    water-totem identity, while the elder brother was linked to an opossum locality
    and an Alcheringa opossum individual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rain-making is associated with multiple ceremonies, including ordinary dancing
    festivals open to men and women of the tribe regardless of class or totem, and
    a special sacred Intichiuma restricted to initiated men of the water totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The majority of members of the water totem are said to belong to the Purula
    and Kumara.
  category: relationship
  evidence_refs:
