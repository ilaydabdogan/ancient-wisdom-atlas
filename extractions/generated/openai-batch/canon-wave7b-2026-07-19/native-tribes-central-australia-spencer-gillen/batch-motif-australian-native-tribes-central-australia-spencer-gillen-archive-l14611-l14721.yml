canonical_text:
  quote: ''
  summary: 'The passage describes portions of Central Australian initiation ceremonies
    involving Churinga: ordered seating, ceremonial display, application of red ochre,
    whispered explanations of ownership and markings, mourning over Churinga of dead
    men, display of an Oruncha or “devil-man” Churinga, beliefs about the Oruncha
    Chauritchi at a rocky hill near Alice Springs, and a later transfer of lizard
    Churinga to a new possessor with restricted elder participation and forehead-to-stomach
    contact.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men are described as occupying inner and outer circles, with the arrangement
    linked to moiety composition of the witchetty grub totem.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure caption describes an ant-totem ceremony in which lines of down represent
    roots of wattle trees, and performers represent women digging for ants.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A local Alatunja takes up a Churinga, places ground red ochre on it, and an
    old Alatunja presses and rubs a young man’s hand on it while whispering its owner,
    the dead man, and the meaning of its marks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Churinga is passed to a Purula man seated outside the group, and a second
    Churinga is treated in the same way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Churinga nanja of a dead brother of the local Alatunja is rubbed, pressed
    against another younger brother’s stomach, and mourned over in silence; other
    Churinga nanja of dead men are examined, ochred, and explained in whispers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Churinga belonging to an Oruncha or “devil-man” is shown, prompting general
    but subdued laughter; Oruncha are said to be a source of mirth in Churinga examination
    and related ceremonies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Oruncha individual Chauritchi is linked to a rocky hill near Alice Springs,
    where he is said to have gone into the earth and where his spirit still lives;
    people laugh in daylight but avoid the hill after dusk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Oruncha individuals are said to have Churinga and a spirit part associated
    with it, but to form no Oknanikilla, to remain at the place where they went into
    the earth, and not to undergo reincarnation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Oruncha is described as a bogey-like, mischievous spirit that may carry
    a victim into the earth, may sometimes transform a man into a medicine man, and
    is not characterized as permanently malevolent.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Several days later, lizard Churinga are brought to a restricted assembly of
    old men, whispered over, rubbed with red ochre, placed on a shield, handed to
    a new possessor, and followed by old men pressing their foreheads against the
    young man’s stomach.
  category: sequence
  evidence_refs:
  - ev:6
