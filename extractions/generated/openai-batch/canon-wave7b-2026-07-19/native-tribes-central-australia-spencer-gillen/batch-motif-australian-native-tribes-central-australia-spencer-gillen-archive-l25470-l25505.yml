canonical_text:
  quote: ''
  summary: 'The passage describes the construction and decoration of a string bag:
    its rim strand and loops, alternating loop attachments, wrapped handle, and red
    ochre coloring with red rings. It also notes a regional distribution claim concerning
    Charlotte Waters and northern tribes north of the Macdonnell Range.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the art of making these bags does not appear to have
    been acquired by northern tribes living north of the Macdonnell Range through
    the central area.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A strand runs around the rim of the bag, and loops are fixed onto it; the
    first loop is short, the second is about 10 cm long, and the others are at most
    about 1 cm long.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The attachment of the third loop to the second varies in alternate loops,
    with opposite twisting arrangements alternating along the structure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The loops are close together, so the alternating arrangement is not noticed
    until careful examination; the authors state there is no structural reason for
    the method and infer that the maker varied the design for pleasure.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The handle is made from multiple strands of string continuous with loops on
    either side and is enclosed by two layers of string wound around them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The upper edge of the bag is colored red with ochre to a depth of about 7
    cm, and below this are four red rings, each about 2 cm broad, running around the
    bag.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the red decoration at first appears to have been rubbed on
