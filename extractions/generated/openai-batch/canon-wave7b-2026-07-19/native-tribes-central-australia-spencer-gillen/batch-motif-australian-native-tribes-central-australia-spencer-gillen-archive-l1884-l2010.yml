canonical_text:
  quote: ''
  summary: The passage describes Central Australian weapons, carried objects, clothing
    and ornaments, red ochre use, camps by waterholes, spatial division of camps by
    social classes, daily work, fighting practices, kin protection during fights,
    and generally amicable relations within and between neighboring tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described Central Australian boomerang is not a returning boomerang; it
    has a wide open curve and a flat blade lying in one plane.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may carry a small wallet containing feathers, quartzite, red ochre,
    a knout-like skein of string, and possibly a charmed object such as hair from
    a dead man's head wrapped in hair or fur string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An old man may carry a sacred stick or bull-roarer, or a sacred stone, hidden
    from women.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women in the south of the Arunta tribe weave bags from fur or vegetable-fibre
    string for carrying food and other items; these bags are not found in the northern
    parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A notable feature of Central Australian implements and weapons is a coating
    of red ochre on everything except the spear and spear-thrower.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men's ordinary ornaments include a human-hair waist belt, a fur-string forehead
    band, neck rings, greased and red-ochred hair, feather adornments, a possible
    nose-bone ornament, and a small pubic tassel.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each local group has favorite camping grounds beside waterholes, with clusters
    of bough shelters that are replaced when they wither or burn.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: When many people camp together, the camp is divided into two halves separated
    by a natural feature such as a creek or a hill slope, and Panunga and Bukhara
    are separated from Purula and Kumara.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the day women search for food, while men may hunt larger game, sleep,
    or make and trim weapons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Quarrels may lead to fights; women may fight with clubs, men may observe or
    intervene, and in fights between men the mother and sisters of each man may try
    to shelter him and receive blows meant for him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that people are generally kindly disposed within their
    tribe and that constant enmity between tribes is not present among the Central
    tribes described, though occasional fights occur.
  category: relationship
  evidence_refs:
  - ev:11
