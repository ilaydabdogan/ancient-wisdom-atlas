canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Wurtja initiation sequence: a sacred
    fire-stick is kept alight and ritually handed to the boy with instructions; the
    boy and an older Mia woman guard their fire-sticks under threat; the boy undergoes
    partial seclusion with speech and food restrictions; on return he is placed behind
    a brake, hears songs about ancestral little-hawk totem men and stone knives, is
    blindfolded, and then watches a Quabara involving decorated men representing a
    wild dog and a kangaroo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The oldest Mia woman of the boy, whose actual mother is stated to be dead,
    brought a fire-stick from her camp and kept it alight through the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At daylight the oldest Mia woman lit a fire from the fire-stick, lit two longer
    sticks, and sat behind the UrintJiantima man while holding them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Uwinna, identified as the sisters of the boy's father, sat down with the
    oldest Mia woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: While men sang a special fire song, the oldest Mia woman handed one fire-stick
    to the Miira tualcha of the boy.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The Miira tualcha tied bands of fur string around the boy's neck and handed
    him the fire-stick while telling him to hold fast to his own fire; the account
    glosses this as not interfering with women assigned to other men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The handing of the fire-stick is named Unchalkulkna, and the fire is described
    in a note as sacred.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: At a signal from an old Okilia, the Wurtja got up and ran away, followed by
    shouting boys, who later returned with the women to the main camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The oldest Mia woman and the Wurtja each guarded a fire-stick, and the Wurtja
    was warned that if his fire-stick was lost or went out, he and his Mia would be
    killed by Kurdaitcha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the day when the Wurtja was taken back to camp, both he and the oldest
    Mia woman threw away their fire-sticks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Wurtja spent three days in the bush with Okilia and Unkulla men, during
    which he could not speak unless first spoken to and could not eat freely.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The account states that the main object of the partial seclusion was to mark
    the break between the boy's old life and his new one and to impress on him entry
    into the ranks of men and compliance with tribal rules.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the fourth day the Wurtja was placed behind a brake called Atuunibanta
    and was not allowed to move without permission from an Okilia guard.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the fourth night the men sang about the marchings of Ullakuppera, or little-hawk,
    totem men in the Alcheringa and about their Lialira stone knives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: A tradition in the passage says the Ullakuppera men first introduced the use
    of a stone knife at circumcision, replacing an earlier use of a fire-stick; a
    note gives an alternate southern tradition in which an aged woman showed men how
    to use a stone knife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Around midnight two Okilia bandaged the Wurtja's eyes, led him to the men,
    and placed him lying face down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: When told by his Okilia and Oknia to sit up and look, the boy saw a decorated
    man lying on his side, who was identified to him as representing a wild dog.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: At the other end of the Apulia a decorated man stood with legs apart, held
    Eucalyptus twigs in each hand, and wore a small Waninga that is described as a
    sacred object emblematic of a totemic animal, here a kangaroo.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: The kangaroo performer moved his head, uttered kangaroo-like sounds, and the
    dog performer barked, ran on all fours between the kangaroo man's legs, lay behind
    him, then ran between his legs again and was caught.
  category: action
  evidence_refs:
  - ev:9
