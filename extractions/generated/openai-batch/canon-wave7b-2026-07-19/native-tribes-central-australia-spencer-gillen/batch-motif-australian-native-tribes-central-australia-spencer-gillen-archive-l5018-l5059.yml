literal_observations:
- id: obs:1
  text: The passage states that a special term concerning the father or mother of
    a husband and wife is probably widespread among Australian tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In tribes studied by Roth where descent is counted in the female line, the
    terms imply a relationship between the husbands' and wives' mothers; in the tribes
    described here, where descent is counted in the male line, the corresponding term
    refers to a relationship between the husbands' and wives' fathers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man calls the particular father-in-law whose daughter has been assigned
    to him Ikuntera-tualcha, whether or not he has married her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The term Ikuntera-tualcha depends on a mutual agreement between the man's
    father and the girl's father that the girl should be the man's wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the mutual agreement was not made, the girl's father is not spoken of as
    Tualcha, even if the man has other wives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A special Mura woman whose daughter is betrothed to a man is called his Mura-tualcha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The person who is Ikuntera-tualcha to one man is Ujinkulla-tualcha to that
    man's father; the passage gives an Appungerta man and an Ungalla man as an example.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Distinct names are given to elder and younger brothers and elder and younger
    sisters, and these categories extend beyond blood siblings through the mother's
    kinship classifications.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: When two brothers marry two sisters, the usual arrangement is for the elder
    brother to marry the elder sister, but if the elder sister marries the younger
    brother, seniority is counted in the male line.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the exceptional sibling-marriage case, the sons and daughters of the younger
    daughter are classified as elder brothers and sisters of the elder sister's children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: A man may speak freely to his elder sisters by blood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: A man may speak to tribal elder sisters only at a considerable distance, with
    an example of about forty yards.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: A man may not speak to younger sisters, whether blood or tribal, except at
    a distance where facial features are indistinguishable, with an example of at
    least one hundred yards.
  category: speech
  evidence_refs:
  - ev:4
