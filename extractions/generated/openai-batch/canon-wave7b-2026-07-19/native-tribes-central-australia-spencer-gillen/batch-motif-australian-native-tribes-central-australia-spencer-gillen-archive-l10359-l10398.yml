canonical_text:
  quote: ''
  summary: The passage opens a chapter on initiation ceremonies. It states that Australian
    natives generally must pass through initiation before being admitted to tribal
    secrets and full membership, and it outlines a sequence of Arunta, Ilpirra, Finke
    River, northern Arunta, southern Arunta, and women's initiation topics, including
    novice rites, seclusion, ritual officials, bodily operations, ritual objects,
    fire, and restrictions on relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Initiation is presented as a prerequisite for access to tribal secrets and
    recognition as a fully developed member of the tribe.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Initiation ceremonies are said to vary widely by tribe; central tribal rites
    are described as more elaborate and spread over many years, with the first rite
    beginning around age ten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:3
  text: The chapter outline lists early novice rites including throwing a boy into
    the air, circumcision or Lartna, an Apulia ground, women dancing, decorating the
    boy, appointing officials, giving the boy the title Wurtja, handing him a firestick,
    and secluding him in the bush.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: The outline lists further ritual actions involving sacred ceremonies, Ohoara,
    the Watiunga, a woman running off with the Wurtja, a totemic design painted on
    the novice's back, Arachitta poles, women and men performing specified actions,
    fire set to brakes, and the actual ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: The outline lists later procedures including presentation of officials, giving
    Churinga to the novice, sending him into the bush, restrictions for relatives,
    head-biting, subincision or Ariltha, the Nurtimja, burning blood after Ariltha,
    second Ariltha, recovery, Ertwa-kirka actions, grades of initiation, northern
    and southern Arunta customs, and women's initiation.
  category: sequence
  evidence_refs:
  - ev:6
