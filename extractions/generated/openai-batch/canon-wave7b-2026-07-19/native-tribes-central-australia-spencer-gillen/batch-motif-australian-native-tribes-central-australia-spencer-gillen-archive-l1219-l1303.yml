canonical_text:
  quote: ''
  summary: The passage describes the Alatunja office, its male-line succession, the
    Alatunja's custodianship of a restricted sacred store-house containing sacred
    objects, and the Intichiuma ceremony performed by initiated men to increase the
    supply of the animal or plant associated with a group. It also discusses strict
    adherence to ancestral custom, punishment for ritual infringement, and the possibility
    that influential men can introduce changes during major ceremonial gatherings.
  language: English
  quote_policy: summarized
