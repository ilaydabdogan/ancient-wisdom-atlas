canonical_text:
  quote: ''
  summary: The passage recounts Alcheringa ancestral travel through named places,
    operations performed on Inapertwa beings of various totems, the arising of hills
    and sacred stones as markers, the use and exchange of Lalira stone knives, a cutting
    scene on an Apulia ground, the sending of cut beings into the ground to form an
    Oknanikilla, and an episode in which an Echidna man kills a married man with a
    knife and is then killed with spears, explaining the origin of echidna spines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A previously mentioned male went into the ground and was later said to have
    undergone reincarnation as a man who fathered a living woman at Alice Springs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At Bukhara, the travelling party divided into two halves at the suggestion
    of the old Bukhara man: Panunga and Bukhara on one side, Purula and Kumara on
    the other.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the divided groups faced east and looked back on their route, two hills
    arose to mark the places where they had stood.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party operated on Inapertwa of several totems, including eagle-hawk, small
    rat, emu, Marsdenia fruit, rat, and small hawk, at a sequence of named places.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
- id: obs:5
  text: Newly made beings were divided into two groups and made to stand apart in
    the same manner as the men had done earlier.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two men from Utiara returned stone knives, saying they were no use; after
    the old men agreed, the two men took other knives and asked the party to come
    quickly to their Apulia.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Curious stones, later regarded as sacred, arose to mark the place where the
    Lalira stone knives had been spread out.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Inferior Lalira deposited at Thungamina were later picked up by local people,
    regarded as sacred, and placed in the Ertnatidunga at Utiara.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Utiara the party waited to hear the Lartna song that would indicate the
    Apulia was ready; upright stones now mark the place where they waited.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the Apulia ground, two local men first operated with stone knives, but
    Intumpulla told them to stand aside and performed the cutting himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Intumpulla cut all the Ulpmerka previously transformed out of Inapertwa and
    told them to go to the Utiara Range, where they went into the ground and formed
    an Oknanikilla of the Arakurta of the Elonka totem.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An old Inarlinga or Echidna man drew a knife from a socket in his skull behind
    his ear and cut off a married man's penis and scrotum, causing the man to die.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Ullakupera and other men followed and killed the Echidna man by riddling
    his body with spears.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that after this event no Echidna men or women sprang up
    in the country, only animals covered with spines, and that the spines represent
    the spears that killed the Alcheringa Echidna man.
  category: attribute
  evidence_refs:
  - ev:8
