- id: obs:5
  text: On the morning of the fifth day a new form of ceremony was introduced, and
    the passage states that Arunta ceremonial features vary by region and by contact
    with neighboring tribes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: In southern Arunta ceremonies, the Waninga is said to take the place of the
    Nurtunja to a large extent; it is described as a framework of sticks, in its simplest
    form cross-shaped, with strings attached.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Waninga was used at the Engwura in connection with the Ouabara Ouatcha
    of Idracowra, described as a rain ceremony associated with Chambers Pillar near
    the Finke River.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two emu-totem men, one identified as Purula and the other as Bukhara, were
    decorated with white down bands and wore gum-tree parings smeared with human blood
    on their heads.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The front performer carried a blood-smeared gum stick across his shoulders
