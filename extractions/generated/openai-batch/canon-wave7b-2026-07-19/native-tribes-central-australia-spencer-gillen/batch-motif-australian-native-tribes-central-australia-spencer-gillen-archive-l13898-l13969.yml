canonical_text:
  quote: ''
  summary: The passage describes the close of a Thippa-thippa/lizard ceremony, a night
    of singing, and a fifth-day Engwura ceremony involving the Waninga among the southern
    Arunta. It explains regional variation in Arunta ceremonies, describes the Waninga
    as a stick-and-string framework replacing the Nurtunja in some southern ceremonies,
    identifies the occasion as a rain ceremony associated with Idracowra/Chambers
    Pillar, and details two emu-totem performers decorated with down, blood-smeared
    gum wood, feathers, and the Waninga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men who went to meet an unnamed participant represented little birds called
    Thippa-thippa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tradition links the Thippa-thippa with Alcheringa men who watched and
    ran around lizard men traveling toward Simpson's Gap.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Thippa-thippa changed into birds of the same name and afterwards became
    mates of the lizard people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The night was spent singing on the ground.
  category: action
  evidence_refs:
