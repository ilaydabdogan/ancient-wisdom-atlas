  summary: 'The passage describes Central Australian totemic relationships: each individual
    is said to be a reincarnation of an Alcheringa ancestor or animal spirit associated
    with a Churinga; a person’s totem is treated as the same as the person, and eating
    one’s totem is restricted or done only sparingly.'
