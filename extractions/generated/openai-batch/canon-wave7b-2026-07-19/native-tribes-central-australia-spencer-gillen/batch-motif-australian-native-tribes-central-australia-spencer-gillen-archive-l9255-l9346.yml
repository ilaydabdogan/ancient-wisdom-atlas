canonical_text:
  quote: ''
  summary: A group of men performs part of an Intichiuma ceremony connected with honey-ant
    Alcheringa beings. A messenger brings a stone Churinga; the men gather at a rocky
    sacred ground with stones, a pit, and mulga trees associated with ancestral beings.
    The Alatunja and older men uncover, rub, and replace sacred stones, then use a
    Churinga in a bodily rite on each man. The party later halts at Il-yaba creek
    and sings of Yarumpa men, honey, ant nests, Ilatirpa, and ancestral men transformed
    into Alpirlaka birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Alatunja sends one man to the Ertnatuhinga to bring a special stone Churinga
    needed for the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Intichiuma ground is in an elevated rocky depression with upright or leaning
    stone blocks, each associated with a honey-ant man of the Alcheringa.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men group around a pit-like depression in the rocks, surrounded by a horseshoe-shaped
    stone wall open at the western end.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: An ancient mulga tree on the east side is described as the abode of the spirit
    of an Alcheringa man whose duty was to guard the sacred ground.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A projecting central stone in the pit is the Nanja of an Alcheringa man who
    originated there and performed Intichiuma.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Alatunja enters the pit, clears debris, calls older men to assist, and
    the men sing while a sacred stone representing Erkiaka and a smaller pebble representing
    honey are taken from the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old men reverently rub the uncovered stone with their hands and with the
    smaller stone, then replace it in the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A large stone Churinga from the Ertnatuhinga represents a mass of honey carried
    by Ilatirpa, a celebrated Oknirabata of the Alcheringa and leader of the Yarumpa.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each man enters the pit and lies partly supported by older men while the Alatunja
    chants, strikes his stomach with the Churinga, and moves it with a kneading action;
    another old man butts the stomach with his forehead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After all men have undergone the rite, the Churinga is returned to the messenger,
    the column reforms, and the men march back past the women's camp, where women
    and children stand in silence.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the return journey, the men halt at a spot in the Il-yaba creek where the
    final act of the ceremony was performed in the Alcheringa and is performed now.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mulga trees and stones at the creek are associated with Alcheringa men who
    watched the performance.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the creek, the men sit and sing of the Yarumpa men, their Alcheringa marchings,
    honey, ant nests, Ilatirpa, and Yarumpa men who changed into Alpirlaka birds.
  category: speech
  evidence_refs:
  - ev:10
