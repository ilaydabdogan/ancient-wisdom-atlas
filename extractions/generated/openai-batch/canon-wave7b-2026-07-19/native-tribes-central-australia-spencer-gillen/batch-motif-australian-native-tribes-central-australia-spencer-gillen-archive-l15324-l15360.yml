canonical_text:
  quote: ''
  summary: The passage describes an initiation-related ceremonial sequence in which
    the Illpongivurra approach groups of women while carrying shields, boomerangs,
    and Eremophila boughs. The women gesture and call out from behind fires, then
    set dry grass and boughs alight and throw them at the men, while other men whirl
    bull-roarers. The men proceed to a second group, run toward and across the river
    bed, then go to the Engwura ground where they circle a decorated man seated beside
    the Parra, circle the Parra itself, shout, and lay down shields and boomerangs.
  language: English
  quote_policy: summarized
