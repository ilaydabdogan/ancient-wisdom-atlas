canonical_text:
  quote: ''
  summary: 'The passage describes several reported methods of harmful magic: charming
    a finger and pointing it at an enemy; making, singing over, and pointing a flint-studded
    stick; carrying a charmed flint flake under a fingernail and dropping it on a
    target; using pointing sticks or a charmed forehead band to cause blindness; and
    using arm bones from the dead as pointing bones. It also notes that magic using
    an enemy''s hair or nail clippings is said not to be practised among the groups
    discussed, unlike in some other Australian tribes, and connects this absence with
    local rules treating human hair as a valuable gift.'
  language: English
  quote_policy: summarized
