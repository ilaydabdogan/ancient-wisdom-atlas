canonical_text:
  quote: "“a reiterated invitation to the Unjiamba tree to flower much”"
  summary: The passage describes the close of one Intichiuma ceremony involving Churinga
    worn on performers’ heads, women and children being driven away, examination and
    ochring of Churinga, explanation and later obliteration of an Ilpintira ground
    design, and storage of returned Churinga. It then begins the Unjiamba or Hakea
    Flower Totem ceremony at Ilyaba, describing a shallow pit beside an ancient Hakea
    tree, a worn stone representing Hakea flowers, the tree as a Nanja tree of an
    Alcheringa woman whose reincarnation lives, and ritual sweeping, touching, chanting,
    and a captioned blood-pouring scene.
  language: English
  quote_policy: quoted
literal_observations:
