  text: Three performers wear Churinga on their heads with feather tufts intended
    to represent the long neck and small head of a bird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women watch the sacred ceremony from a distance; when the performers move
    toward them, the women cry out and later flee toward their camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The male audience moves its arms as if both urging the women to run away and
    calling the Inniakwa back toward the centre of the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the women and children are out of sight, the Inniakwa and other men
    return to camp, and the Churinga are removed from the performers’ heads and set
    upright in the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At midday the Churinga are brought to the ceremonial ground, examined, and
    rubbed with red ochre by the Alatunja and older men while other men chant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The participants gather at the Ilpintira, and the Alatunja explains its meaning
    again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before dusk, three newly appointed Inniakwa are decorated, the Illiura drive
    the women and children from camp to the ceremonial ground, and the morning performance
    is repeated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the second day the same programme is performed; afterward, the Churinga
