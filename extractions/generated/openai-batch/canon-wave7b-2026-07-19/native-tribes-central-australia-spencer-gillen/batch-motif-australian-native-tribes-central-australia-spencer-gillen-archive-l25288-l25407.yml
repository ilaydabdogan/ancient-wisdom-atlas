  text: Hard-wood pitchis are described as shallow troughs with edges that do not
    bend over; some are deep enough to carry water.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The surfaces of hard-wood pitchis are marked with lengthwise grooves, sometimes
