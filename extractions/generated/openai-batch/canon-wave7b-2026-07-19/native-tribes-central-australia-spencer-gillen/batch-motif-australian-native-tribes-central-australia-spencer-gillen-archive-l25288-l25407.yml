  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: One soft-wood pitchi form has an unmistakable boat shape, a rough internal
    surface, and an external surface ornamented with small parallel grooves running
    from end to end.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Another soft-wood pitchi form is rounded in transverse and longitudinal section,
