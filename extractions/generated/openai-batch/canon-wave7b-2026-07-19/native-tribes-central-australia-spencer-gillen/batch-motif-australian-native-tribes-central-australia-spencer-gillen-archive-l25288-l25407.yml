canonical_text:
  quote: ''
  summary: The excerpt describes the Ilpirra, a rudimentary trumpet made from a hollowed
    gum-tree branch and decorated with ochre, kaolin, and resin. It notes the trumpet's
    use in magic connected with obtaining wives and in corroborees. The passage then
    describes pitchis, wooden receptacles for carrying food, water, and sometimes
    babies, distinguishing hard-wood and soft-wood forms, including trough-like, boat-shaped,
    rounded, and variant grooved examples, as well as a smaller scoop called an Apniava.
  language: English
  quote_policy: summarized
