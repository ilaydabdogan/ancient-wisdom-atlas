canonical_text:
  quote: ''
  summary: The passage describes powers, restrictions, and modes of making medicine
    men. It says that spirit-made medicine men retain powers through implanted magic
    stones or crystals and may lose them through withdrawal or taboo violations. It
    compares Iruntarinia and Oruncha modes of initiation, notes rare women doctors,
    and gives a detailed account of a human-conducted initiation on the Upper Finke
    River involving silence, extracted crystals, bodily pressing, scoring, blood,
    projected crystals, and a crystal struck into the novice's head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After graduating, a medicine man observes a probationary period and may refuse
    to practise if the hole in his tongue closes, taking this as a sign that his virtues
    have departed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During probation, he cultivates other medicine men and learns craft secrets
    described as hiding and producing small quartz pebbles or bits of stick, along
    with a solemn appearance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Iruntarinia is said to provide a new set of internal organs and implant
    magic Atnongara stones in the medicine man's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The implanted Atnongara stones are said to let the medicine man project them
    into a patient's body to combat harmful influences.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the Atnongara stones leave or are withdrawn, they are said to return to
    the Iruntarinia, and the man feels his powers have departed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The medicine man must avoid certain foods, smoke from burning bones, the nest
    of the large bull-dog ant, and sometimes loud barking of camp dogs because these
    are associated with loss or flight of powers or stones.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Medicine men made by Oruncha are described as undergoing a procedure essentially
    similar to that of the Iruntarinia, except that the person is taken into the earth
    at the Oruncha's place rather than into a special cave.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A local example says that near Alice Springs an Oruncha living in a rough
    rocky hill may seize a man, take him into the earth, and make him a medicine man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women doctors are said to be rare and to be made usually by Oruncha, sometimes
    by Iruntarinia, with the same initiation method as men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a human-conducted initiation on the Upper Finke River, a young man asks
    two old medicine men for initiation; they take him with another man to a secluded
    place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The candidate is made to stand with his hands clasped behind his head and
    is told to maintain perfect silence regardless of what happens.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Nung-gara withdraw small clear crystals called Ulthunda from their bodies
    and place them in the hollow of a spear-thrower.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Another man clasps the candidate from behind and holds him tightly while the
    two Nung-gara apply crystals to his body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Nung-gara press crystals along the candidate's legs and up his body to
    the breast-bone three times, scoring the skin so that blood flows.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: This pressing and scoring is said to force the magic crystals into the candidate's
    body.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: After the candidate lies on his back, the Nung-gara stand some distance away
    and pretend to project crystals into his head with a jerking hand movement.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Nung-gara then score the legs, abdomen, and arms with stones, press a
    crystal on the novice's head, and strike it hard as if driving it into the skull,
    making the scalp bleed.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: A figure caption identifies a medicine man made by the Oruncha and says a
    forehead drawing represents the Oruncha's hand.
  category: other
  evidence_refs:
  - ev:14
