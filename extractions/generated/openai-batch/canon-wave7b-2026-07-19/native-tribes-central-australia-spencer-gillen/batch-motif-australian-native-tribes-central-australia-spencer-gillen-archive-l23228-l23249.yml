canonical_text:
  quote: ''
  summary: The passage describes Ungutnika's boils becoming the stones called Aperta
    tukira at Undiara, and a harmful rite in which small wooden imitation spears are
    thrown at those stones and then toward intended victims so that Ariingqiiiltha
    from the stones causes painful boils. A footnote adds that a related term is applied
    to a drawing, a ground-hole representation of a woman connected with a man targeted
    by an avenging party, and a circumcision rite in which dirt is placed in the operator's
    hands as the boy is handed over.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ungutnika is described as an old man who plucked boils from his body; each
    boil became one of the stones at Undiara called Aperta tukira, translated in the
    passage as stone sores.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who desire to harm others make small wooden imitation spears and go to
    the Aperta tukira stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men throw the imitation spears at the stones, taking care that the spear
    points strike the stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The spears are picked up and thrown one by one from a spear-thrower toward
    the person intended to be injured.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spears are supposed to carry Ariingqiiiltha from the stones and thereby
    produce painful boils in the individual or individuals toward whom they are thrown.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A skilful magic man is said sometimes to afflict a whole group of people in
    this way.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The footnote states that the same term, sometimes pronounced as if spelt oara,
    is applied to a drawing and to a hole made in the ground to represent a woman
    belonging to a man whom an avenging party is about to kill.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The footnote also describes a ceremony of Okoara during circumcision in which
    dirt is scraped up and emptied into the hands of the man who is to perform the
    operation, with the idea that the boy is handed over with as little misgiving
    as the dirt is.
  category: action
  evidence_refs:
  - ev:5
