  quote: ''
  summary: The passage argues that wife-capture expeditions and marriage-related access
    are regulated by defined kin and class relationships, not by a general captor
    right or promiscuity. It says arranged assignment by brothers or fathers is the
    common method of obtaining a wife, while capture is exceptional. It interprets
    certain marriage customs as rudimentary survivals of earlier social conditions,
    comparing them to rudimentary organs and to Maypole-associated customs.
