canonical_text:
  quote: ''
  summary: 'The passage describes several Central Australian stone implements and
    related hafting methods: ground axe-heads fixed with bent wood, resin, and human
    hair-string; pick-shaped flaked quartzite axe-heads, including the Kubingu; sheaths
    decorated with kaolin and red-ochred emu feathers; stone knives with differing
    hafts; and notes on material choice, manufacture, trade, distribution, and inherited
    local resource rights cited in a footnote.'
  language: English
  quote_policy: summarized
