canonical_text:
  quote: ''
  summary: 'The passage describes the Kurdaitcha custom: after a death, a culprit
    may be identified by signs and by a medicine man; elders may choose an avenger
    who wears special emu-feather shoes. It details the shoes'' materials, restrictions
    on viewing and storage, a toe-dislocation ordeal before wearing them, the body
    decoration of the Kurdaitcha and accompanying medicine man, and a chant sung while
    the shoes are put on.'
  language: English
  quote_policy: summarized
