canonical_text:
  quote: ''
  summary: The passage describes the Urpmilchima grave ceremony performed after a
    delay of about twelve to eighteen months. A widow prepares bone, hair, and feather
    chaplets, is painted with pipeclay, leads mourning women toward male kin, presents
    the chaplets in a wooden vessel, and participates in ritualized embraces and placements
    of mourning objects involving specified kin relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Urpmilchima ceremony is performed at the grave after about twelve or eighteen
    months; the term is glossed as trampling the twigs on the grave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the ceremony, the widow saves small animal bones and obtains additional
    bones from her tribal sisters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow obtains short locks of hair from female Itia, Allira, and Uniba
    of the dead man and fastens bones to the hair with resin from porcupine grass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bones and hair are hung in small groups on a women's hair head ring, and
    plumes are made from ring-necked parrot or black cockatoo tail feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The resulting bulky chaplet is called Araunurilia by women and Chinurilia
    by men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A younger brother of the dead man invites the widow to the grave, and the
    tribal brothers and sons of the dead man determine the date.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the appointed day the widow is painted all or nearly all over with fresh
    pipeclay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the described Alice Springs case, women assemble at the Erlukwirra to paint
    the widow while men sit on the route from camp to grave.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Certain male kin of the dead man are decorated on the front of the body with
    a Y-shaped figure in pipeclay; the passage states that white is the colour of
    mourning.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Gammona sit apart with bent heads, with their Allira, described as blood
    and tribal sons, nearest to them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the widow is painted, women approach from the Erlukwirra making a mournful
    wail, led by the widow carrying the Chinurilia in a wooden pitchi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The widow comes up behind each Gammona and places the pitchi under the arms
    and onto the lap of each man in turn, where it remains for several minutes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: During the lap presentation, women cry loudly, while the men bow their heads,
    shed tears, and make no sound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The widow and other women who were Unawa with the dead man and Aliira to the
    Gammona embrace the Gammona from behind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage explains the behind-the-back approach by noting that these women
    are prohibited from speaking to or having intercourse with the men, to whom they
    are tribally mothers-in-law, a relationship called Mura.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: After the Gammona are treated, their sons are treated in the same way, and
    then other men followed by women start toward the grave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: About midway to the grave, the party is met by the eldest son of the deceased's
    eldest brother, and a halt is made.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: The eldest son takes two Chinurilia from the pitchi, embraces named male kin
    categories of the dead man, and presses the Chinurilia against their stomachs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: He places one Chinurilia on the widow's head and another on the head of a
    younger sister of the dead man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: He removes fur string rings from the pitchi, tears off the string tags, and
    places the rings on the heads of women who are Allira or Umba of the dead man.
  category: action
  evidence_refs:
  - ev:8
