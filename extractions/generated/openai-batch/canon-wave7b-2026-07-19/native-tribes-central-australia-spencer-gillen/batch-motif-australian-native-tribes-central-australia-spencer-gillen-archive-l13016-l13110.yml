canonical_text:
  quote: ''
  summary: 'The passage describes how Engwura initiation ceremonies are organized:
    ceremonies depend on the totems and men present, are directed by a leading elder
    with advice from other elders, may involve invited owners and performers, and
    serve to transmit guarded tribal knowledge about totems and Churinga from older
    men to younger men. It also describes preparation rules, moiety separation during
    simultaneous performances, and the authority of elders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonies performed at an Engwura depend on which men and totems are
    present, and there is no fixed series that must always be performed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A leading man arranges the programme, has the final decision, often consults
    older men, invites ceremony owners, and no performance is done without his sanction
    and initiation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ceremony owner may perform himself or invite another person to perform;
    performers do not necessarily belong to the totem or moiety connected with the
    ceremony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Preparation attendance may be restricted by moiety in some cases, and in many
    cases men from the district associated with a ceremony are present during preparation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When two performances are prepared simultaneously, one may be associated with
    Panunga and Bukhara men and the other with Purula and Kumara men; the groups are
    placed apart in the creek bed so they cannot see one another.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men belonging to the specific totem concerned with a ceremony have the right
    to be present during preparation; others may come only by invitation of the owner.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that one main object of the Engwura is the handing on of
    older men's stored knowledge to younger men, especially knowledge about tribal
    past history, totems, and Churinga.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One special old man is described as a repository of tribal lore and as governing
    a camp of more than one hundred full-grown men taking part in the ceremony.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The leading old man and three elders meet as a small council, withdraw to
    a secluded spot in the creek bed, discuss ceremonies, and then the leader gives
    orders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the ceremonies heighten younger men's respect for older men
    and that old men reveal tribal secrets to young men only when the latter are considered
    worthy.
  category: relationship
  evidence_refs:
  - ev:6
