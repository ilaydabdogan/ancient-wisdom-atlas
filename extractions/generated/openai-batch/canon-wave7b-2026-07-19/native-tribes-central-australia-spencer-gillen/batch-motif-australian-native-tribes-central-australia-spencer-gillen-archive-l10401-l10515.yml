canonical_text:
  quote: ''
  summary: The passage introduces four Arunta and Ilpirra initiation ceremonies, notes
    regional variation, contrasts Central Australian tooth-knocking customs with eastern
    coastal initiation rites, and describes the first ceremony in which boys about
    ten to twelve are tossed in the air, caught by men, accompanied by women dancing
    and shouting, and then painted with ochre designs that are emblematic of totems
    but not necessarily the boys' own totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage lists four Arunta and Ilpirra initiation ceremonies: painting
    and throwing the boy up in the air, circumcision or Lartna, subincision or Ariltha,
    and the Engwura or fire ceremony.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The final and most impressive ceremony is said not to be undergone until the
    person is probably at least twenty-five, or perhaps thirty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The details and timing of the ceremonies vary across different parts of the
    tribes' territory.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Knocking out teeth is described as absent as a general custom associated with
    Central Australian initiation rites, although it may be performed outside initiation
    and by both men and women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among many eastern coastal tribes, knocking out teeth is described as a prominent
    feature connected with initiation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors state that tooth-knocking among Arunta and other central tribes
    is partly individual and partly local taste or fashion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The authors propose that tooth-knocking was probably once prevalent among
    common ancestors of central and eastern coastal tribes and later changed as tribes
    separated and customs developed differently.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first ceremony is said to take place when a boy is between ten and twelve
    years old.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men and women assemble at a central spot near the main camp for the first
    ceremony.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Boys of the proper age are taken one by one and tossed into the air several
    times by men, who catch them as they fall.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Women dance around the group, swing their arms, and shout during the tossing
    of the boys.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the tossing, the boys' chests and backs are painted with simple straight
    or curved bands outlined in red or yellow ochre.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The painted designs do not necessarily refer to the boys' own totems.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The painting is done by men standing to the boys in the relation of Umbinia,
    described as a brother of a woman whom the boy may marry.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Some designs are copied from old rock paintings, some of which are associated
    with particular totems.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: If a boy has an Unjipinna man, that man draws the design on him at the close
    of the throwing-up ceremony.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: In all initiation ceremonies described here, the youth or man has designs
    painted on his body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The body designs are called Ilkinia as a general term and are emblematic of
    totems.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:19
  text: The man who paints usually decides the nature of the design, and performers
    in sacred ceremonies are often decorated with designs of totems other than their
