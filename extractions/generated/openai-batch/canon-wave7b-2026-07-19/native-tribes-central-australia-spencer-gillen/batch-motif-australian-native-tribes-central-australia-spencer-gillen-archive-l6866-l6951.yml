  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person's totem never changes, but class may change; an initiated person
    may witness and take part in sacred ceremonies of the totem.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person outside the predominant moiety rarely becomes Alatunja of a local
    totem group unless every member of the Alcheringa-associated moiety has died.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Arunta district, and also the Ilpirra and Kaitish districts according
