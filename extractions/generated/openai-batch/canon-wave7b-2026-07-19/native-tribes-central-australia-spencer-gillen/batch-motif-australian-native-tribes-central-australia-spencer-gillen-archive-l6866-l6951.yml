  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Local totem centres are described as places where Alcheringa ancestors originated,
    camped, went down into the ground with Churinga, or deposited Churinga.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Churinga remained at these places, each associated with a spirit individual,
    and actual men and women are said to spring from them and bear the totem name
