canonical_text:
  quote: ''
  summary: The passage explains Arunta totem affiliation through spirit children,
    conception places, moiety rules, and local totem centres. Spirit children are
    said to enter women, prefer fat women, sometimes choose a mother of a different
    class, and may be reincarnations of Alcheringa ancestors. A child's totem follows
    the spot where the mother believes conception occurred, while moiety follows the
    father. Local totem centres mark places where Alcheringa ancestors originated,
    camped, went into the ground with Churinga, or deposited Churinga; these Churinga
    remain associated with spirit individuals from whom people continue to spring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman near water close to a gap in the Ranges where spirits dwell hears
    a child's voice calling a kinship term including mother and runs away because
    she does not want a child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that a spirit child entered the woman and that it was born
