canonical_text:
  quote: ''
  summary: An Iliaura group receives an Arunta/Atninga avenging party. A customary
    conciliatory offer of women is refused. After two days of discussion, two Iliaura
    old men agree that three condemned men may be killed and that no others should
    be harmed. Special fires called Thara are lit. Unarmed Arunta decoys engage the
    condemned men while armed Atninga men in war-paint ambush them, killing two; the
    third has fled. The killers dance around the bodies, break their Ilkunta sticks
    onto them, and have decoys remove the spears because the body and contacted objects
    are taboo to the killer. Afterward, an eligible Unawa woman and a girl child are
    taken; absent Iturka women are not taken as wives.
  language: English
  quote_policy: summarized
