canonical_text:
  quote: ''
  summary: The passage describes portions of an initiation ceremony involving Atnuta
    head-objects representing dead kangaroos, a double Waninga representing an old
    man kangaroo and his son, the novice Wurtja being shown and made to embrace the
    Waninga, warnings of secrecy, women’s dancing and removal of the novice, the men’s
    fire song, retrieval of the novice, and daybreak rubbing with red ochre and concealment
    of his hair with fur string.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four old men wore half-circles of grass stalks bound with fur string and decorated
    with white down; each object was called Atnuta and represented a dead kangaroo.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Alcheringa kangaroo ancestor carried dead kangaroos
    on his head while marching across the country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the performance, the Atnuta were removed, handed around, and pressed
    around the stomach by squatting men, including the Wurtja.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A double Waninga had a large part representing an old man kangaroo and a smaller
    attached part representing his son.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two men carried the Waninga along the Apulia path, advancing and retreating,
    quivering, and bending it toward the Wurtja.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Iknntera man fixed the Waninga upright in the path, and the boy was told
    to go up and embrace it; the showing was described as meaning that the child sees
    and knows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Afterward the Wurtja was instructed and cautioned not to reveal anything to
    women and children, made to lie down, and the men sang the Lartna song while striking
    the ground with shields.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At night the Wurtja’s head was decorated with cane-grass stalks, and the other
    men decorated themselves similarly, also placing stalks beneath their arm bands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women approached the Apulia ground shouting, took possession of it, danced,
    and later plucked grass stalks from the heads of the dancing men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The men danced with their faces turned east, with one or more women standing
    behind each man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Mura woman placed her head through the Wurtja’s legs from behind, lifted
    him onto her shoulders, ran off with him, placed him sitting on the ground, and
    sat behind clasping him in her arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Women danced in front of the Wurtja shouting and making a beckoning movement
    with their hands and fingers; the passage says this movement is associated with
    inviting men to come to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The men at the Apulia sang the fire song repeatedly; the passage glosses its
    words with references to a red flower made red by burning, a eucalyptus twig,
    blazing up, and a fire rushing along.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that the fire song is always sung on the night before preparation
    of the Arachitta poles, whose twigs are put through a blazing fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Urinthantima man, another Mura man, and the Okira in charge of the novice
    ran toward the women with shields before their faces, seized the Wurtja, and took
    him back to the Apulia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the Wurtja was returned, he was told to lie down, his face was covered,
    the fire song continued at intervals all night, and the women ran back to the
    main camp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: At daybreak the Urinthantima man rubbed the Wurtja all over with dry red ochre
    and wound fur string around his head so that his hair was hidden.
  category: action
  evidence_refs:
  - ev:6
