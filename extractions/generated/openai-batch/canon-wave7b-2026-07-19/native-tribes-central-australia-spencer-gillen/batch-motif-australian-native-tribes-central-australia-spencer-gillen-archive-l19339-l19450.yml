canonical_text:
  quote: ''
  summary: The passage describes tooth-extraction customs among central Australian
    groups, including procedures for boys, women, and girls; post-operation gestures,
    food offerings, and disposal of the extracted tooth toward the mother's Alcheringa
    camp. It then compares these customs with tooth-knocking rites reported for eastern
    and south-eastern Australian groups, including Victorian and New South Wales accounts
    involving woods seclusion, maternal custody of teeth, a gum tree, fire, weapons,
    and spear display.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For boys, the operation is performed away from the Intichiuma ground, near
    which they may not go; women may be present because the same restriction applies
    to them there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a woman or girl is to be operated on, a small space is cleared near the
    main camp, where men and women assemble except those who are Mtira to the girl.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tribal Okilia sits down, the girl places her head in his lap, and the operation
    is performed in the same way as for men and boys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After extraction, the tooth is lifted with a guttural sound and thrown toward
    the mother's Alcheringa camp.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the operation, the girl fills a small pitchi with sand, dances over
    the cleared space, agitates the pitchi as if winnowing seed, empties it, and returns
    to the women.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before the operation, the Okilia places a cockatoo-feather topknot in the
    girl's hair; it is later returned to him.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The girl, not her mother, must provide seed food for the operating Okilia,
    and he must send her meat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the Kaitish account, tribal Okilia operate on men, tribal Ungaraitcha operate
    on women and girls, and the extracted tooth is thrown toward the mother's Alcheringa
    camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that tooth extraction is not universal among the central
    tribes and does not have the same manhood-initiation significance there as in
    many eastern and south-eastern tribes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that circumcision and sub-incision are the characteristic
    initiation rites of the central tribes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Victorian account cited, a youth is conducted by three leaders into
    the woods, remains two days and one night, knocks out two upper front teeth, gives
    them to his mother, and returns to the woods for the same period.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Victorian account cited, the mother places the teeth in the fork of
    a young gum tree; the tree is held sacred, known only to certain persons, and
    hidden from the youth.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Victorian account cited, if the youth dies, the base of the tree is
    stripped of bark and the tree is killed by fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the New South Wales account cited, a throwing stick and stone are used
    in knocking out the tooth.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the New South Wales account cited, before the operation a man strikes a
    shield with a club while the party presents spears toward the shield at every
    third stroke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The New South Wales account says the extracted teeth indirectly came into
    the possession of certain women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: A note states that any food may be given except the recipient's totemic animal
    or plant, and suggests a possible comparison with food-giving to novices in the
    Kurnai Jeraeil.
  category: other
  evidence_refs:
  - ev:7
