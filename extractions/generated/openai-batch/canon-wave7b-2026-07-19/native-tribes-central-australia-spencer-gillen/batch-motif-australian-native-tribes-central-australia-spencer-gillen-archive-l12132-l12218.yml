  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a short time on the fire, he is taken off by the Irkoa-artha and handed
    to uninitiated boys, who are told to camp with him and not speak to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After three days in which he speaks to no one, men who are his Okilia invite
    him to join them in the men's camp, after which he becomes a permanent member
    of that camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before speaking to ritual officials who took part in the ceremonies, he must
    procure game as an offering to each of them; this gift is called Chaurilia.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At presentation of Chaurilia, the recipient performs a sacred ceremony, and
    the mouths of the Ertwa-kurka and all present are touched with a sacred object
    used in the ceremony, such as a Nurtunja.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mouth-touching removes the ban of silence, and after the ceremonies the
