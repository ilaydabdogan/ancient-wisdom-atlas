canonical_text:
  quote: ''
  summary: 'The passage describes stages near the close of an initiation sequence:
    a decorated young man is escorted to women, throws a boomerang toward his mother''s
    Alcheringa camp, is placed briefly on a leaf-covered fire prepared by women, observes
    silence, is later invited into the men''s camp, gives game offerings called Chaurilia
    to ritual officials, and has the ban of silence removed by mouth-touching with
    a sacred object. It also lists status names for grades of initiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At daylight, men with fire-sticks surround the young man and conduct him to
    women who are waiting to receive him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is fully decorated and carries a shield, a boomerang, and twigs
    of Eremophila.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near the women, the men throw down their fire-sticks and halt while the young
    man steps out and throws his boomerang high toward the place described as his
    mother's Alcheringa camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that similar throwing of the boomerang toward the mother's
    Alcheringa camp occurs in other ceremonies, including tooth-knocking ceremonies
    among eastern Arunta groups and the Ilpirra tribe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the boomerang throw, the Irkoa-artha man leads the Ertwa-kurka forward
    with the shield held before the young man's face.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ertwa-kurka is placed squatting on a fire prepared by women and covered
    with green leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women stand behind the fire, make a movement of invitation, shout “tirra,
