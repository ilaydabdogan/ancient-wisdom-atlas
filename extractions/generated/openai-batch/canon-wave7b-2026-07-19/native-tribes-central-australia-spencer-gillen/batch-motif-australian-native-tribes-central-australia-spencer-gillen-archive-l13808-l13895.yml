canonical_text:
  quote: ''
  summary: The passage describes part of an initiation sequence involving reverent
    examination and transfer of Churinga, formal deference to elders and neighboring
    group leaders, and a lizard totem ceremony in which an Oknirabata is decorated,
    carries Churinga, emerges from a creek bed, and is escorted to sit on spread gum
    boughs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man rubbed an old man's stomach with his forehead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During examination of the Churinga, young men do not speak unless addressed
    by elder men and no one speaks above a whisper.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the presence of the Churinga seems to produce reverent silence,
    as if the spirits of dead men to whom they once belonged were present.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old man is identified as an Oknirabata or great instructor, a rank applied
    to old men learned in tribal customs and traditions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the young man rubbed the Oknirabata's stomach, the Oknirabata rubbed
    the stomach of the Alatunja of the Unchalka in acknowledgment that he had safely
    kept the Churinga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Oknirabata also rubbed the stomach of an old Okira or kangaroo man, an
    act explained as courtesy to the head of a neighboring group to prevent jealousy
    and unfriendliness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The handing over of the Churinga was treated as important and was postponed
    for completion on another day after a long examination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For the lizard ceremony, the Oknirabata was decorated with a helmet, white
    down on head, face, upper body and arms, half-rings of white down on the thighs,
    eagle-hawk feathers, and seven large Churinga on his head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two of the Churinga carried on the Oknirabata's head were curved like boomerangs
    and described as very old, with ornamentation mostly obliterated by many rubbings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The decorated performer first went out of sight along the creek bed while
    other men assembled near the Parra at a small patch of gum boughs.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The performer, described in the scene as the lizard, came from the creek hiding
    place throwing up dust, moving slowly in a zig-zag course, stooping, taking varied
    attitudes, and using a high-knee action.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The young man appointed two men to meet the performer; when the performer
    pretended to turn back, they circled him with raised arms, cried out, and encouraged
    him toward the waiting group.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The audience spread gum boughs as if inviting the performer to sit, and he
    sat after a short time.
  category: action
  evidence_refs:
  - ev:8
