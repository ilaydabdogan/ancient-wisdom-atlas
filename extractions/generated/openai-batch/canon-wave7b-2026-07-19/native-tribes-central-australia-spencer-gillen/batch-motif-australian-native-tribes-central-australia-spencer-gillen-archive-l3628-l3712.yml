canonical_text:
  quote: ''
  summary: The passage explains a table of Arunta subclass marriage rules and child
    categories, notes that relationship terms fit the same arrangement, compares Arunta
    marriage and totemic practices with Urabunna and other Australian tribes, describes
    Alcheringa ancestry connected with totemic names, and discusses individual wives,
    the group relationship term Unawa, and limits on wife-lending within a man’s own
    group.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a table in which men of one set of subclasses marry
    women of corresponding subclasses, and their children pass into listed child subclasses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples given include a Panunga man marrying a Purula woman with Appungerta
    children, and an Uknaria man marrying an Ungalla woman with Bukhara children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the gender order is reversed in the table, examples include a Purula
    man marrying a Panunga woman with Kumara children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that tribal relationship terms also fall into an orderly
    arrangement in the same table.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares Arunta marriage with Urabunna marriage and says that
    Arunta marriage appears more restricted because a man may only marry a woman from
    one of eight divisions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that, in the Arunta tribe, totems do not impose marriage
    restrictions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Every Arunta native is described as thinking that his ancestor in the Alcheringa
    was descended from, or immediately associated with, the animal, plant, or object
    named by his totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage contrasts many Australian tribes, where a man must not eat or
    injure his totem, with the Arunta, where the totem is eaten on special occasions
    and otherwise only sparingly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After marriage, a particular woman is restricted to a particular man except
    on special occasions, and the man has an exclusive right to her while being able
    to lend her to other men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says there is no individual term for the specifically allotted
    wife; the term Unawa is applied both to her and to all women of the wife-eligible
    group.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wife-lending is said to occur only to a member of the husband’s own group,
    where the woman also stands in the relationship of Unawa.
  category: relationship
  evidence_refs:
  - ev:9
