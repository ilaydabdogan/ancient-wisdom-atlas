canonical_text:
  quote: ''
  summary: 'The passage recounts parts of several Alcheringa totemic traditions: Unjiamba-associated
    travellers enter the earth at Ooraminna, where stones and Churinga mark the place;
    emu people travel west from Erliunpa, shed feathers, enter and emerge from the
    ground, and form totem centres; honey-ant people depart from Ilyaba under the
    Oknirabata Abmyaungwirria, suffer thirst, drink blood, make Ilpirla, encounter
    local honey-ant people at an Engwura, and are drowned by a blood flood, after
    which a black hill, Churinga, and a spring mark the place.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unjiamba-associated travellers took their Nurtunja to pieces, travelled to
    the Ooraminna rock-hole, entered the earth, and two large stones arose to mark
    the place beneath which their Churinga were located.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The descendant of Abmoara is said to be living, and one of the two stones
    is her Nanja.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The descendant of Kuperta is said to have died recently and to be awaiting
    future reincarnation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator states that the following accounts of emu, honey-ant, and lizard
    men omit many details because they are closely similar to traditions already given
    for other totemic groups.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The emu people originated at Erliunpa, and a party of men with three women
    left there travelling nearly due west.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The emu party carried Nurtunjas on their heads and were initially covered
    with feathers, which they gradually shed along their route.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The emu party entered the ground at Oniara, came out at Ulpira, and travelled
    to Karpirakura, where they found emu people of both sexes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The emu party left some men at Karpirakura and continued westward along the
    Macdonnell Ranges, forming totem centres at various places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near Glen Helen the emu party entered the earth again and did not come out
    until Apaura, where they stayed with a local emu group and formed an important
    emu totem centre.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The honey-ant people originated at Ilyaba in the Mount Hay country, described
    as the great centre of the totem, and dispersed in various directions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Abmyaungwirria, a great Oknirabata, went north from Ilyaba, returned after
    many days, reported finding honey-ants far to the north-east, and led a party
    toward them after performing ceremonies that women were allowed to see.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The honey-ant party came to Inkalitcha, found the water-hole dry, suffered
    thirst, opened veins in their arms, and drank blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The honey-ant party travelled alternately above and under ground and came
    to a place on the Burt Plain where they made Ilpirla.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ilpirla is described as a drink made by steeping honey-ant bodies in water,
    kneading them until honey mixed with the water, and mixing the drink in the hafts
    of shields.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: After drinking Ilpirla, Abmyaungwirria left the party, found local honey-ant
    people at Koarpirla making an Engwura, returned, and led his party there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The local honey-ant people were angry, refused contact, opened veins in their
    arms, and made a flood that drowned all of the visiting party except Abmyaungwirria.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Abmyaungwirria returned to Ilyaba and finally died there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: A black hill covered with black stones arose where the honey-ant wanderers
    perished, their Churinga are said to be in the local group’s store-house, and
    a fresh-water spring marks the central spot of the Engwura ground.
  category: setting
  evidence_refs:
  - ev:9
