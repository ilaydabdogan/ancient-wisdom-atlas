- id: ev:7
  type: summary
  locator: lines 19855-19863
  quote_or_summary: Blood is sometimes given to strengthen the seriously ill; for
    a man, blood is drawn from female genital tissue, a witchetty grub is dipped in
    it and eaten, and the man's body is rubbed with blood, grease, and red ochre.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/native-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source text supplied; summarized.
- id: ev:8
  type: summary
  locator: lines 19863-19872
  quote_or_summary: For a very ill woman, a male Umba may give blood from the subincised
    urethra; she drinks part and he rubs the rest over her body, then adds red ochre
    and grease. If she recovers, she cannot speak to him or his companions until she
    sends food.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/native-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source text supplied; summarized.
