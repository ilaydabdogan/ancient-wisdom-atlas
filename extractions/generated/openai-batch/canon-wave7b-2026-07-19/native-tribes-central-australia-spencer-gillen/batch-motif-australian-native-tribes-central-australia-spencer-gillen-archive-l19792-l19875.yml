canonical_text:
  quote: ''
  summary: 'The passage describes customs involving blood and red ochre: a sacred
    pole and ceremonial body decoration are treated with blood; women are barred from
    seeing blood drawn from men for decoration; a post-conflict ceremony called the
    blood fading away is performed when men''s blood is shed before women; women''s
    blood is collected, smeared, and consumed in certain rites; initiation blood from
    a boy is taken to women relatives; traditions connect red ochre deposits with
    blood or bodily injury of ancestral women; blood and red ochre are used to strengthen
    seriously ill people; and the passage ends with women singing over a fat-and-red-ochre
    mixture used on a sick man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kauaiia sacred pole, erected at the close of the Engwura ceremony, is
    painted with blood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In sacred ceremonies and many ordinary corroborrees, down from birds or plants
    is attached to the human body with blood drawn from the arm or from the subincised
    urethra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are not allowed to witness blood being drawn for decorative purposes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When men's blood is shed in a quarrel before women, the first man whose blood
    is shed usually performs a ceremony connected with his own or a parent's totem;
    the ceremony is called Alua nparilima, meaning the blood fading away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a recent fight, an Apungerta man of the witchetty grub totem personated
    a Chankuna small-berry woman and wore a headdress representing digging-sticks
    and Chankuna bushes with berries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Kaitish and other northern tribes, during Atna ariltha ktana performed
    on a young woman by an Ungaraitcha or elder sister, blood is collected in a special
    pitchi made by the woman's elder brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The blood collected in the special pitchi is taken to camp, where named women
    and other women smear their bodies with it and drink some of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Blood from the operation of lartna on a boy is taken to the women's camp and
    rubbed over the breasts and foreheads of the elder sisters of the boy and of his
    mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Red ochre deposits are said to be associated with women's blood.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tradition says that two kangaroo women in the Alcheringa caused blood to
    flow in large quantities near Stuart's Hole on the Finke River, forming a red
    ochre deposit, and did the same farther west.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another account says the dancing Unthippa women, exhausted by dancing at Wankima,
    suffered bodily injury that gave rise to large red ochre deposits there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Blood is sometimes given to men and women to strengthen them when very ill.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: For a very ill man, blood is drawn from female genital tissue; a witchetty
    grub is dipped in the blood and given to him to eat; his body is rubbed with blood,
    then with grease and red ochre.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: For a very ill woman, a male Umba may volunteer to strengthen her with his
    blood; women and children are sent away, she drinks some of his blood, and the
    rest is rubbed over her body with red ochre and grease added afterward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: If the ill woman recovers after receiving blood from the male Umba, she must
    not speak to him or his companions until she has sent him an offering of food.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: When a man or woman feels ill, the first action described is rubbing red ochre
    over the body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The narrator states that red ochre may possibly be regarded as a substitute
    for blood, and notes that a ceremonial object may sometimes be rubbed with red
    ochre instead of blood.
  category: other
  evidence_refs:
  - ev:9
- id: obs:18
  text: In some serious illness cases, women charm a mixture of fat and red ochre
    by singing and rub it into the body of the sick man.
  category: action
  evidence_refs:
  - ev:10
