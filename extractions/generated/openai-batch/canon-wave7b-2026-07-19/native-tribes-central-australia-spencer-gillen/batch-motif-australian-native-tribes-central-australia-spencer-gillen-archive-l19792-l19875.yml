candidate_motifs:
- id: motif:1
  label: Blood-painted sacred object and blood-fastened decoration
  taxonomy_refs: []
  basis: The Kauaiia pole is painted with blood, and down is fastened to bodies with
    blood in ceremonies.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a passage-level ritual pattern; no broader taxonomy ref is asserted.
- id: motif:2
  label: Gender restriction on viewing men's ritual blood and post-bloodshed reconciliation
  taxonomy_refs: []
  basis: Women are barred from witnessing blood drawn for decoration; if men's blood
    is shed before them, a totem-linked blood-fading ceremony is performed.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes a local custom and does not itself compare it to
    wider traditions.
- id: motif:3
  label: Initiation or youth rite blood transferred to women relatives or camp
  taxonomy_refs:
  - initiation
  basis: The passage links blood from a young woman's rite and a boy's lartna operation
    with collection, transfer to camp, drinking, smearing, or application to female
    relatives.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The lartna material is explicitly described as part of initiation ceremonies;
    the young woman's rite is described as a rite but its broader classification should
    be reviewed.
- id: motif:4
  label: Ancestral women create red ochre deposits through blood or bodily injury
  taxonomy_refs: []
  basis: Two kangaroo women in the Alcheringa and dancing Unthippa women are each
    said to give rise to red ochre deposits.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives origin traditions but does not explicitly label the
    women as culture heroes or assign a broader mythic category.
- id: motif:5
  label: Healing or strengthening through blood ingestion and body rubbing
  taxonomy_refs: []
  basis: Blood is given to seriously ill men and women to strengthen them, including
    drinking or eating it with a grub and rubbing it over the body.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage presents this as ethnographic custom rather than narrative
    myth.
- id: motif:6
  label: Red ochre as a substitute or functional equivalent for blood
  taxonomy_refs: []
  basis: Red ochre is used in illness treatment and on ceremonial objects, and the
    narrator explicitly suggests it may be regarded as a substitute for blood.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The substitutive interpretation is phrased by the narrator as possible,
    not definitive.
- id: motif:7
  label: Food offering following healing blood transfer
  taxonomy_refs:
  - sacred_exchange
  basis: After an ill woman recovers from treatment with a male Umba's blood, she
    must send food before speaking to him or his companions.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The exchange is kinship-specific and tied to a speech restriction; the
    taxonomy link to sacred exchange is tentative.
comparison_claims:
- id: claim:1
  claim: Within the passage, the kangaroo women and Unthippa women accounts share
    the same motif of red ochre deposits originating from women's blood or bodily
    injury.
  claim_level: same_motif
  target: red ochre deposit origin accounts within the passage
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison only; no historical contact or external
    parallel is inferred.
- id: claim:2
  claim: The passage supports a same-function comparison between blood and red ochre
    as substances used to coat bodies and ceremonial objects, especially in illness
    and ritual treatment.
  claim_level: same_function
  target: blood and red ochre as ritual or healing coatings
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage's explicit substitution claim is qualified as possible
    by the narrator.
- id: claim:3
  claim: The young woman's rite and the boy's lartna initiation show a shared pattern
    in which blood from a youth-related rite is taken to a women's camp and applied
    to or consumed by women.
  claim_level: same_function
  target: blood transfer to women in youth rites described in the passage
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The two rites are not described as identical; one includes drinking
    and body smearing, while the other specifies application to elder female relatives.
