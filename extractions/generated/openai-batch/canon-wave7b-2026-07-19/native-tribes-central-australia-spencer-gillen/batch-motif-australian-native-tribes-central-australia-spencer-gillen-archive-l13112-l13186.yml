canonical_text:
  quote: ''
  summary: 'The passage describes phases of the Engwura proceedings at Alice Springs:
    opening corroborees, the intended handing over of one corroboree, construction
    of the Parra mound, seclusion and discipline of younger men by older men, and
    the start of sacred totemic ceremonies including the Quabara Unjiamba of Ooraminna
    connected with Hakea-totem women in the Alcheringa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first phase opens with an Alice Springs corroboree lasting ten evenings,
    and the group decides to hand it over to a leading Engwura man from a more southern
    group; after the handing over, it will not again be performed at Alice Springs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first performance concludes, the Illyonpa corroboree begins and
    lasts ten nights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two days after Illyonpa begins, the old leader of the Engwura digs loose sandy
    soil and makes a low mound called Parra, about thirty feet long, two feet wide,
    and one foot high, ornamented with a row of small gum-tree boughs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Parra is said to represent a tract of country; the exact meaning of its
    name is not known to the authors from their informants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Parra is always made to run north and south because, in the Alcheringa,
    the wild cat people marched in that direction.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sacred ceremonies begin on the level flat to the western side of the Parra.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Illyonpa ends, no more ordinary dancing festivals occur until the close
    of the proceedings, about three months later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The younger men passing through the Engwura must separate completely from
    women, remain under the control of older men, and obey them implicitly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The younger men spend days hunting, watching ceremonies, or taking part under
    older men's guidance, and spend nights on or near the Engwura ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The second phase is described as the start in earnest of sacred ceremonies
    concerned with totems.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Quabara Unjiamba of Ooraminna concerns women of the Unjiamba or Hakea
    totem who, in the Alcheringa, came from the north and marched south to Ooraminna.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The head man of the local group, six Purula men, and one Panunga man go to
    a small creek bed and sit under a small gum tree while other men remain away from
    the preparation place.
  category: action
  evidence_refs:
  - ev:8
