canonical_text:
  quote: ''
  summary: The passage describes night-time shouting around a mound at the Engwura
    ground, preparation by firelight, the second-day examination of Churinga, and
    the Quabara Iruntarinia Irritcha ceremony. It explains that this type of ceremony
    is said to be given by spirits to a selected person and may be passed on under
    totemic conditions. Two decorated men then perform as eagle-hawks quarrelling
    over a piece of flesh, using Churinga, feather and down decorations, shields,
    and stylized movements. The passage closes by introducing a later Quabara Unjiamba
    ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men bent forward and hurled sound at the Parra, or rushed around the mound
    in a single line while shouting; the cries were described as audible at a distance
    among surrounding rocky ranges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the singing ended around midnight, the men lay down around camp fires;
    some men remained awake preparing for ceremonies by the light of scattered fires.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The morning of the second day was occupied by examination of Churinga, and
    early in the afternoon the Quabara Iruntarinia Irritcha was performed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Iruntarinia ceremony is described as one supposed to have been imparted
    to a special individual by the Iruntarinia, or spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person to whom this ceremony was shown was a medicine man, the son of
    the Alatunja of an eagle-hawk locality, though himself identified as an Udnirringita
    or witchetty grub man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A recipient of such a ceremony may keep it or pass it on as a gift, but the
    next holder must belong to the totem with which the ceremony is concerned.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In this case, the medicine man had handed the ceremony to his father, head
    of the eagle-hawk group, and it was expected to descend in time to an eagle-hawk
    son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two sons of the Alatunja performed; they were respectively of the eagle-hawk
    and emu totems, and only Panunga and Bulthara men were present during preparations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The performers' hair was bunched up with conical Cassia-twig crowns and bound
    with hair string; blood was smeared on head-dress and body, and bands of pink
    down edged with white were applied.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eagle-hawk feathers and three decorated Churinga were fixed to each performer's
    head-dress; one performer held a small grass, hair-string, and down-covered cylindrical
    mass in his mouth.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The performers sat facing each other on shields, held eucalyptus twigs, and
    were said to represent two eagle-hawks quarrelling over flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The performers flapped their arms, circled, fought with their heads, had the
    heavy Churinga removed by two men, and then resumed until one seized the mouth-carried
    piece of meat with his teeth.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Later in the afternoon, the Quabara Unjiamba of Ooraminna was introduced;
    the passage notes a close connection between Unjiamba and Achilpa totems and says
    the two performers did not belong to those totems.
  category: sequence
  evidence_refs:
  - ev:9
