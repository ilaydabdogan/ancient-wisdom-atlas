canonical_text:
  quote: ''
  summary: The passage describes a ceremony centered on a cross called Umbalinyara,
    performed by three decorated men wearing Ullinka pointing sticks in their head-dresses.
    It then explains rules for transmitting the ceremony, dream communications from
    Inintarinia about Intichiuma ceremonies, attribution of plentiful animal or grub
    supplies to friendly Inintarinia, the powers and dangers of Inintarinia, and the
    protective but limited role of the Arumburinga toward a human representative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cross called Umbalinyara is described as the important feature of the ceremony,
    with two arms about six feet long, one fastened across the other and fixed upright
    in the ground.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three performers are decorated with lines of down and each wears two Ullinka
    pointing sticks in his head-dress, arranged like horns projecting in front.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performers sit beside, approach, and move around the cross while onlookers
    sing, laugh, rush around them, and shout until the performance closes with a prolonged
    quiver.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Iruntarinia can give the ceremony to a man of
    any totem, but if the recipient passes it on as a compliment, the next recipient
    must belong to the totem to which the ceremony refers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inintarinia are said to communicate in dreams to the Alatunja of a group the
    proper time to perform Intichiuma, though not always or necessarily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If plentiful supplies of a species such as witchetty grub or emu appear without
    the people of the relevant totems performing Intichiuma, the supplies are attributed
    to friendly Inintarinia performing Intichiuma.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Inintarinia is described as a real personage to the native, generally
    beneficent but sometimes capable of great cruelty, and as a man of the Alcheringa
    with powers attributed to such a being.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: If offended, an Inintarinia may place a pointing stick or Ullinka in the body
    of the offender; the passage says the stick is usually barbed, attached to a string,
    causes severe pain when pulled, and can only be removed by a very skilled medicine
    man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says people feel it is wise not to offend Inintarinia or go out
    too much after dusk, when spirits may seek lonely wanderers for unpleasant pranks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Arumburinga is said to watch over his human representative and not personally
    harm him, but cannot always shield him from another individual spirit's capricious
    malice.
  category: relationship
  evidence_refs:
  - ev:6
