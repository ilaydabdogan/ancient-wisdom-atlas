canonical_text:
  quote: ''
  summary: The passage describes Central Australian implements and weapons, including
    a double adze called Ankiira or Chalunka with flints set in resin at both ends
    and fire-charred ring ornamentation. It then describes common Central Australian
    boomerangs as open-curved, non-returning weapons with grooves, red ochre coating,
    and occasional kaolin or yellow ochre rings. It contrasts workmanship among groups,
    notes Luritcha examples as rougher, and describes an ornate boomerang associated
    especially with Urabunna and occasionally southern Arunta men, said to come by
    a trade route from interior Queensland. The ornate boomerang bears incised figure-eight
    patterns, slanting lines, marginal curved lines, grip scratches, and later-looking
    crosses.
  language: English
  quote_policy: summarized
