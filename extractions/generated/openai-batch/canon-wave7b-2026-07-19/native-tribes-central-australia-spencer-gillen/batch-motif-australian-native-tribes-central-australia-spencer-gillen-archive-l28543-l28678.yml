- id: obs:1
  text: A scarlet-fronted bird is described as the form into which men of the mythical
    past changed after continually painting themselves red.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ceremonial pole is defined as emblematic of the animal or plant that names
