  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A local totem centre is described as an area inhabited by spirits of ancestral
    individuals, with the spirits of each centre belonging to one totem.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Oruncha are described as mischievous individuals of the mythical past and
    as present-day spirit individuals.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A design representing the hand of an Oruncha is painted on the forehead of
