  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A spirit is described as having a voice that women suppose they hear when
    the bull-roarer sounds, and women are said to believe that this spirit carries
    off the boy.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Magic-related entries include throwing spittle to produce evil magic, a pointing
    stick, a pointing-stick magic involving flint, a magic object containing the heat
