canonical_text:
  quote: ''
  summary: Glossary entries define native terms for mythic human-to-bird transformation,
    totemic animals and ritual emblems, local totem centres inhabited by ancestral
    spirits, restricted sacred ceremonies, initiation and circumcision roles, medicine-men
    and spirits, magic practices, water containers, fire, pointing sticks, bull-roarers,
    and other ritual objects.
  language: English
  quote_policy: summarized
