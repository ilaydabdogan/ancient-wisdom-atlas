canonical_text:
  quote: ''
  summary: The passage describes a Yarumpa honey-ant totem Churinga storehouse at
    Ilyaba, lists its sacred objects and their associations, explains that Arunta
    Churinga are sacred stone or wooden objects rather than true message-sticks, and
    notes their messenger, protective, ancestral, and ceremonial values.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred storehouse of the Yarumpa or honey-ant totem at Ilyaba is described
    as a round hole in the side of a rocky hill, said to have been an ant nest in
    the Alcheringa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The storehouse contains a small wooden Churinga of Ilatirpa, a celebrated
    Alcheringa leader of the Yarumpa people who sent wandering Yarumpa bands out from
    Ilyaba.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A long stone Churinga represents a mass of honey carried and eaten by Ilatirpa,
    and a slender pointed stone Churinga represents wood he used for digging out honey-ants.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The storehouse also contains sixty-eight wooden Yarumpa Churinga, several
    lizard Churinga, and two wild cat Churinga, including objects described as borrowed
    or lent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The authors state that calling Churinga message-sticks is misleading, because
    true message-sticks elsewhere are marked mnemonic aids, while Churinga are sacred
    emblems carried by some messengers.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: An Arunta messenger carrying a Churinga is described as bearing a badge of
    office; the object demonstrates the bearer’s bona fides and makes the bearer’s
    person safe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Showing a Churinga is treated as a summons that cannot be neglected without
    risking a serious quarrel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Arunta Churinga are described as stone or wooden; wooden Churinga may be called
    Churinga irula, and the stone form is said to be no more sacred than the wooden
    form.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Churinga are especially valued when associated with an Alcheringa ancestor;
    old, patched, resin-filled, sinew-bound, and visually worn examples may be highly
    valued despite insignificant appearance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Storehouses usually include especially large Churinga made by Alcheringa men
    or by celebrated men of olden times for ceremonial use.
  category: object
  evidence_refs:
  - ev:5
