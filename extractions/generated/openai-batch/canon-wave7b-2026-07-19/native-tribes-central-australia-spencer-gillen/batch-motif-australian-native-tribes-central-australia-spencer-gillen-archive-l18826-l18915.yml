canonical_text:
  quote: ''
  summary: The passage recounts ancestral travels and transformations. At Conlon's
    lagoon an emaciated man dies and becomes a charged stone; the Illunja man travels
    to Simpson's Gap to gather animal peoples, and Alexandra parakeet people become
    an underground cave bird. Lizard people travel, dance, perform ceremonies, and
    some return underground; other emaciated members die and become charged stones,
    while the remainder join Iwutta people and deposit Churinga. A separate account
    describes Unthippa women as uncanny Oriuicha women who arise in the west, dance
    through country carrying weapons, transform from half male and half female into
    women, encounter carpet snake people at a circumcision setting, carry boys and
    perform lartna, change language and diet, produce red ochre deposits from exhausted
    organs, and finally enter the ground, with a womanland supposed far to the east.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Conlon's lagoon a thin, emaciated man was left; after he died a stone arose
    there, and rubbing it may cause emaciation because it is charged with Aningquiltha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Illunja man left the others and went ahead to Simpson's Gap to muster
    Alexandra parakeet people, small rat people, and Ilura lizard people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Alexandra parakeet people are said to have been changed into a bird that
    inhabits underground caves and comes out seeking grass seed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lizard party camped near Attack Gap, followed Ross Creek, met the Illunja
    man, and found a lizard man whose descendant was said to live at Alice Springs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Simpson's Gap the lizard people danced before assembled people, sacred
    ceremonies were performed, and the Illunja man with one Echunpa returned underground
    to Ulirra.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three thin and emaciated lizard party members died at the Gap, and stones
    marking the spot are described as charged with Arungquiltha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The remaining lizard party traveled north eating lizards, reached Painta Springs,
    passed Hanns' Range, joined the Iwutta people at Ilangara, and deposited Churinga
    near the Iwutta storehouse.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The Unthippa women are described as Oriuicha, translated as 'devil' women,
    but the passage explains this as more uncanny or mischievous than strictly malicious.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Unthippa women sprang into existence in the west country and danced through
    Arunta country carrying shields and spear-throwers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Unthippa women began as half women and half men, but their organs became
    modified and they became like other women.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near Glen Helen the Unthippa women encountered carpet snake people assembled
    at an ApitUa to perform circumcision on boys who had undergone preparatory rites.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Women who were Unawa to the boys carried the boys on their shoulders, left
    them at places along the route, and performed lartna on them; some women were
    also left.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: West of the River Jay the women changed their language to Arunta and began
    subsisting on mulga seed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Wankima the women's sexual organs dropped out from exhaustion caused by
    uninterrupted dancing, and these organs gave rise to red ochre deposits.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the red ochre episode the women entered the ground, and the passage
    reports a belief in a great womanland far to the east where they finally sat down.
  category: sequence
  evidence_refs:
  - ev:11
