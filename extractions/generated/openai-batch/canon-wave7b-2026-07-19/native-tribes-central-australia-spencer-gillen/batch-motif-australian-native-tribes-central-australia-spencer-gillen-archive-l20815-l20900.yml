canonical_text:
  quote: ''
  summary: The passage describes enforcement of a mourning custom in which a Mia is
    expected to cut herself for a deceased Umba, with punishment feared from an Illapurinja.
    It also describes a woman decorated with down fixed by blood who handles a sacred
    stick called a Churinga, said to be charged with harmful magic. The passage then
    defines the Atninga as an avenging party organized after intergroup quarrels,
    especially wife theft or deaths attributed to enemy magic, and narrates an Alice
    Springs/Macdonnell Range group summoned by messengers carrying Churinga for a
    raid against the Iliaura.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Mia who fails to cut herself as a sign of sorrow for a dead Umba is described
    as committing a grave offence against the dead Umba.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If one Mia omits the cutting, another may search for her and, if unable to
    kill her, may strike one of the offending woman's brothers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man at Alice Springs is said to have been injured by an Illapurinja, saved
    by a medicine man, and expected by local belief to die eventually from remaining
    parts of Churinga not extracted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage identifies this as the only known case to the authors in which
    a woman is decorated with down fixed on with blood and handles a Churinga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Churinga handled by the woman is not described as an ancestral Churinga
    but as a sacred stick that has been sung over and charged with magic and evil
    influence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The authors state that the practice makes some women believe that they or
    their brothers will suffer if certain ceremonies are not properly attended to.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Intergroup quarrels are said usually to arise either from a man stealing a
    wife from another group or from a death attributed by a medicine man to the magic
    of a distant group member.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: An aggrieved party may approach an enemy camp armed with spears, spear-throwers,
    boomerangs, and shields; the confrontation may remain verbal, become a fight,
    or involve ambush and spearing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men near Alice Springs in the Macdonnell Range were summoned by Inzmirra messengers
    carrying Churinga, sent by the Alatunja, to assemble for war upon the Iliaura.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Northern Arunta fear of the Iliaura is connected in the passage with threatening
    messages and deaths attributed by medicine men to Iliaura evil magic.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: After messengers and summoned men gathered at Alice Springs, a council of
    elder men decided to raid the Iliaura and organized an avenging party called an
    Atninga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Atninga travelled north for several days, found a group of Iliaura men
    with about a dozen families, and camped near them for two days.
  category: sequence
  evidence_refs:
  - ev:7
