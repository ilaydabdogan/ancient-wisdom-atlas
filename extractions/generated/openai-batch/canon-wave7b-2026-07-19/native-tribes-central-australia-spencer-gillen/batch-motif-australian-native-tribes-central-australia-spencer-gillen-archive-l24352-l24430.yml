canonical_text:
  quote: ''
  summary: The passage describes forms of Central Australian spear-throwers, including
    a Wambia example with a human-hair fringe and an Amera/Ajuera type used by several
    tribes. It details construction, materials, distribution, functions, and physical
    form, including ceremonial preparation uses, cutting with attached flint, fire-making,
    and rare decoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Wambia spear-thrower is described as a smooth rounded stick about 89 cm
    long, tapering toward the point end, with a broader hand-held end.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The broader end has a fringe made from human hair-string looped around fur-string,
    forming many close pendants that resemble a tuft of human hair.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The fringe is attached to the stick with human hair-string and resin and,
    when upright, forms a tassel enclosing the end; a resin circle helps the hand
    grip the implement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The opposite end of the Wambia spear-thrower has a blunt rounded wooden knob
    fixed with resin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A third type of spear-thrower is widely distributed in central Australia and
    is used by the Urabunna, Arunta, Luritcha, and Ilpirra tribes; in Arunta it is
    called Ajuera.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Amera is described as a highly useful implement, serving as a spear-thrower,
    a receptacle for blood, red ochre, kaolin, and other objects during ceremonial
    preparations, and as a carrier.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The flint usually attached to one end of the Amera serves as the chief cutting
    implement for fashioning wooden weapons and implements.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Amera is also used in making fire and sometimes as a primitive musical
    instrument, though the authors state they had not seen the latter use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each Amera has an ovate leaf shape with turned-up sides producing a concavity;
    examples vary in depth and are rarely ornamented.
  category: attribute
  evidence_refs:
  - ev:5
