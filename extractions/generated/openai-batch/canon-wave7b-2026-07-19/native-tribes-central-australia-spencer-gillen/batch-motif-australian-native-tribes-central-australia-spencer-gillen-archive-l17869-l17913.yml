canonical_text:
  quote: ''
  summary: The passage discusses early Alcheringa traditions as evidence for social
    relations around totems, marriage, and intercourse. It states that these traditions
    do not show totems regulating marriage in the exogamous way characteristic of
    many Australian tribes, but instead repeatedly show same-totem men and women living
    together and marrying. It distinguishes settled groups from wandering or powerful
    groups such as the Achilpa, who are described as moving across country, imposing
    rites and ceremonies, and having intercourse with women of other totems.
  language: English
  quote_policy: summarized
