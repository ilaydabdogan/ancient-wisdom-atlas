canonical_text:
  quote: ''
  summary: A travelling Achilpa ancestral party moves through named places, makes
    or encounters Engwura and other ceremonies, performs Ariltha on local groups,
    encounters men associated with ceremonial objects, changes language at one place,
    and leaves landscape markers including a sand hill, a steep bank, and a stone
    representing a broken Kanaua. After the Kanaua breaks, the party arrives tired
    and sad at Unjiacherta and dies there.
  language: English with Indigenous terms in transliteration/OCR form
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Udnirringintwa the party made a great Engwura; many died there from an
    OCR-corrupted named cause, and Churinga representing them were kept in the local
    store-house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large sand hill arose at Udnirringintwa to mark the place where the Parra
    mound of the Engwura ground was raised.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The surviving members went into the ground and came out again at Alkirra-lilima,
    where they camped for a long time and made Ampurtanurra.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Alkirra-lilima they found Alkaiya, an old Panunga man of the Unjiamba totem,
    who had a large Nurtunja/Xurtunja and owned quabara inidattha.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Achichinga they found Achichingarinia, an old Panunga man of the Unjiamba
    totem, who possessed a large Nurtunja/Xurtunja; the Achilpa leader tried to take
    it by force but desisted when the old man clung to it and made a loud arriinkiinia.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The party made quabara inidattha, changed its language to Achicha, looked
    back on its tracks, and said that they had come very far.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Near Appulya they saw an old Bukhara man of the Irritcha totem hunting without
    his Nurtunja; he ran back to his own country when he saw the Achilpa men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Appulya, Ariltha was performed on some young men and an Engwura was made.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Arrarakwa the party found a Panunga man of the Achilpa totem making a Nurtunja,
    performed Ariltha on him and others, and later camped higher up the creek making
    Ampurtanurra.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A steep high bank at the creek was said to have arisen to mark where the Kaumia
    rested against it before being erected.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: On Hanson Creek the party found an old Bukhara man of the Yarumpa totem beside
    a Kaumia; after the young men returned, the Achilpa and Yarumpa parties mixed,
    Ariltha was performed on all the Yarumpa, and an Engwura was begun but left for
    the Yarumpa to complete.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Kurdaitcha the party met many Achilpa of all classes who had originated
    there, performed Ariltha on all of them, mixed with them, and made a big Engwura.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The party camped near Intilyapa-yapa men and women of all classes but did
    not mix with them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Okinyumpa, while the party was pulling up a deeply implanted Kanaua, Oknirabata
    broke it just above the ground; a tall stone at the spot represents the broken,
    still-implanted end of the pole.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The party carried the broken Kanaua to Unjiacherta, arrived exhausted and
    sad, did not paint themselves or erect the inferior broken Kanaua, lay down together,
    and died where they lay.
  category: sequence
  evidence_refs:
  - ev:11
