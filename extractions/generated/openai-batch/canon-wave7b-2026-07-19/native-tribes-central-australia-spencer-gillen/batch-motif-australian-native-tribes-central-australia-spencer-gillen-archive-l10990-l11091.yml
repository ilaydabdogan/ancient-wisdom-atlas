canonical_text:
  quote: ''
  summary: A novice boy is brought blindfolded to an initiation ground, where a decorated
    performer enacts a kangaroo and the men sing of kangaroo wanderings in the Alcheringa.
    The performer then lies on the novice, who is instructed in a tradition about
    Alcheringa kangaroo men, the death of Unburtcha, his spirit remaining with a sacred
    Churinga, and later rebirth through a woman as a Purula kangaroo man. The passage
    explains that such performances introduce novices to sacred totemic matters. After
    the performance, men select the operator, assistant, and shield-bearer for the
    coming operation; a formal exchange of gestures follows, including whispering,
    singing, smoothing ground, use of a spear-thrower to transfer soil, and embraces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The performer’s body is decorated with ochre and lines of birds’ down, arranged
    as they were said to have been on the Alcheringa man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ball of fur string hangs from the performer’s waist and is said to represent
    the scrotum of the kangaroo.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performer comes out from behind the men’s brake, hopping and lying down
    to rest in imitation of a kangaroo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The novice boy is brought blindfolded onto the ground, first made to lie flat,
    and then told to get up and watch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Men seated around the Wurtja sing about the wanderings of the kangaroo in
    the Alcheringa while the performer enacts the animal’s movements.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: After a final hop around the Aptula ground, the performer lies on top of the
    Wurtja, who is then instructed in the tradition connected with the performance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The tradition says that a party of kangaroo men began at Ultainta, wandered
    to Karinga, and that one member named Unburtcha died there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Unburtcha’s body dies, but his spirit part remains in a sacred Churinga that
    he carried, and it remains behind when the party travels on.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The spirit later goes into a woman and is born again as a Purula man named
    Unburtcha, who is also a kangaroo man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Old men are said to know these matters and decide who has come to life again
    as a man or woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: A spirit child may be associated with a sacred Churinga; in that case, the
    child belongs to the same totem as the Alcheringa individual who carried the Churinga,
    and old men determine the child’s secret or sacred name.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: The passage states that the boy is first instructed in sacred totemic matters
    during initiation through performances concerning animals and Alcheringa individuals
    transformed from such animals.
  category: other
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the performance, the Wurtja is led back to his brake, and a council
    selects a man to perform the operation, another to assist, and another to hold
    the shield on which the boy will sit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The consultation is carried on in whispers while other men near the brake
    sing the Lartna song loudly and fiercely.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The selected offices carry honor and expected food offerings from the boy
    after the operation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Three Okilia seat themselves gravely in a line, bring the appointed officials
    before them, and form two facing rows of men.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:17
  text: The eldest Okilia smooths the ground, holds a spear-thrower, puts his beard
    in his mouth like the Mura man, glares at him, scoops up soil with the weapon,
    and places the soil into the Mura man’s hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The eldest Okilia embraces the Mura man, rubs their bodies together, and rubs
    his forehead against the Mura man’s stomach; he repeats the performance with the
    other two officials, while the other Okilia embrace the officials without presenting
    dirt.
  category: action
  evidence_refs:
  - ev:7
