canonical_text:
  quote: ''
  summary: The passage describes forms of harmful magic attributed to Arunta women,
    especially magic affecting male sexual organs. Methods include charming and throwing
    a spear-like grass seed, charming and sprinkling dust at a place where a man may
    urinate, and charming a finger inserted into the vulva before sexual contact.
    The passage also notes that syphilitic disease is often attributed to this form
    of magic and includes a footnote about a woman killed after being accused of causing
    her husband’s death by a pointing stick.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arunta women are described as generally not practicing magic to the same extent
    as men, but as being supposed to have special powers concerning sexual organs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman may obtain the spear-like seed of a long grass, charm it by singing
    over it, and point or throw it toward a man she wishes to injure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the seed magic, the man is said to feel pain like ant stings, have swelling,
    and attribute the suffering to a woman’s magic.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman may charm a handful of dust collected while digging yams or gathering
    seeds and sprinkle it at a place where the intended male victim is likely to urinate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the man urinates at the sprinkled place, he is said to experience a scalding
    sensation in the urethra and later severe pain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women are said to be able to produce disease in men by singing over a finger,
    inserting it in the vulva, and later having sexual connection with the man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man who has subsequent sexual connection with such a woman is said to
    become diseased and may lose his organs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Syphilitic disease among the Arunta is described as very frequently attributed
    to this form of magic.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote says that women are generally not thought to exercise much magic
    except regarding sexual organs, but also reports a case of a woman speared to
    death by her husband’s brother after being accused of killing the husband by a
    pointing stick.
  category: other
  evidence_refs:
  - ev:6
