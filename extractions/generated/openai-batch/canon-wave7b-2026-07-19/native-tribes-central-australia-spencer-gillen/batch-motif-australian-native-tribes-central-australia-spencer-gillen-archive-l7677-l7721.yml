canonical_text:
  quote: '"handed on from generation to generation"'
  summary: The passage describes how Churinga designs use conventional circular, spiral,
    curved, straight, and dotted markings whose meanings depend on totemic context
    and authorized knowledge. It states that reliable interpretation must come from
    an old man of the relevant local totemic group or the special individual in charge.
    At the Ertnatulunga, old men rub and explain Churinga to younger men, transmitting
    knowledge of ownership and design meanings. The passage begins an example of Figure
    A, a wooden Churinga nanja of a dead man of the frog totem with concentric-circle
    designs.
  language: English
