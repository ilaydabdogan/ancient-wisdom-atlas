canonical_text:
  quote: ''
  summary: The passage describes regional specialization and exchange of implements
    among Central Australian groups, including shields, boomerangs, spears, spear-throwers,
    pitchis, and stone axes. It includes a tradition in which wandering ancestral
    groups name Mount Sonder Urachipma, the place of pitchis, after finding an old
    bandicoot man making pitchis. It also describes shield construction, decoration,
    repair, the decline of stone axe manufacture, and local group control over stone
    axe quarries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Different high-quality implements are associated with different regions:
    spear-throwers with the south-west, boomerangs with the east and north-east, spears
    with the northern Arunta/Alice Springs district, and pitchis with western makers.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Western men obtain shields by exchange from the north, and Alice Springs people
    exchange spears for boomerangs from eastern natives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tradition reports that wandering ancestral groups named Mount Sonder Urachipma,
    meaning the place of pitchis, because they found an old bandicoot man making pitchis
    there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the distribution of work appears very old and generally
    independent of whether the needed raw material exists in a locality.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The shields described are highly symmetrical, shaped with flint cutting, and
    marked on both sides by regular shallow grooves running from end to end.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shields are generally coated with red ochre and may be decorated during performances
    with sinuous bands, black lines, and white spots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Broken shields are repaired by boring holes and lashing the pieces with dampened
    tendon; resin patches may be inserted, and the passage says shields and implements
    do not bear owner-identifying marks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Stone axes or hatchets are comparatively rare because iron tomahawks have
    been widely distributed by barter, and the passage says Arunta hatchet manufacture
    has died out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Illupa axe is described as a flattened, usually oval diorite pebble with
    a rounded and ground edge fixed into a wooden handle; stones for such axes came
    from special localities owned by local groups whose permission was required for
    removal.
  category: object
  evidence_refs:
  - ev:6
