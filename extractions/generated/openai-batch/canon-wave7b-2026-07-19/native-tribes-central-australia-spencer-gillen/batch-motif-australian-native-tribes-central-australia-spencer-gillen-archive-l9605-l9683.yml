canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which two Alcheringa women remove a
    large sacred pole from a water-hole site and take it north to Arapera; contrasts
    this with a later story in which a thirsty woman enters the restricted sacred
    water-hole at Undiara, sees the sacred pool and ceremonial stone, and is punished;
    and introduces Ungutnika, a kangaroo-totem man identified as the reincarnation
    of an Alcheringa kangaroo associated with Undiara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Alcheringa men arranged sacred poles close to a water-hole, with one large
    pole in the centre and smaller poles around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An illustration caption identifies a striped rock ledge as the Nanja of a
    kangaroo and says the dark colour above the stripes is blood poured on the rock
    during the ceremony.
  category: object
  evidence_refs:
  - ev:3
- id: obs:3
  text: While the men slept, two Alcheringa women of the Unjiamba totem came from
    the north and quietly took away the large sacred pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two women climbed a slit in the perpendicular rock face above the pool
    and went north to Arapera, where the pole was kept and used in ceremonies connected
    with that place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors state that this Alcheringa tradition may indicate that women once
    had greater privileges than they had in the authors' present.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: A later tradition says women were not allowed near Undiara, where the group's
    sacred Churinga were stored.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the later tradition, a thirsty woman went to the water-hole to drink and
    saw the sacred pool and ceremonial stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the woman was detected and verbally rebuked, the reported punishment
    was that she was made temporary common property to the men; the passage says men
    of all classes had intercourse with her and she was then returned to her proper
    Unmca man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the woman had seen the place, the passage says the spot's special sacredness
