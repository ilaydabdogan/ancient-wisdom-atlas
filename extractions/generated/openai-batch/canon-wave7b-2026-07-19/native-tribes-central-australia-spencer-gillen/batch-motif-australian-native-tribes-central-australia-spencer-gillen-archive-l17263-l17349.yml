canonical_text:
  quote: ''
  summary: The passage recounts movements of Achilpa or wild cat people and associated
    totemic beings through named places. It describes leaders, divisions of the travelling
    party, ceremonial performances, initiation rites, sacred objects, local beings,
    abandoned men establishing a site, a protected woman, a hidden observer, and marked
    landscape features.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed group in the opening fragment goes into the ground, escapes, emerges
    at Incharlinga on Stirling Creek, performs ceremonies, and is led north by Kukaitcha
    toward the country of salt water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second group of Achilpa or wild cat people comes from the Luritcha country
    to the south-west, camps at Yungurra, and is led by two Oknirabata or wise old
    men called Atninumi-la-tniripa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Yungurra the party divides into two groups, with one old man accompanying
    each group; the narrator labels them as the second and third groups of the Achilpa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The second Achilpa group crosses the Finke river, travels to Imanda on the
    Hugh river, changes its language to the Arunta tongue, and carries a sacred pole
    or Kauaua.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Imanda the Achilpa find frog, white bat, and little bat men performing
    an Engwura ceremony; the newcomers join the ceremony, and young men are sent daily
    into the bush with young men of other totemic groups.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Kartuputapa is identified as the head of the Unchichera totem at Imanda; the
    Achilpa remain near Imanda, leave some men behind, establish an important Oktianikilla,
    and later depart accompanied by Kartuputapa.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: At Itnuna-twuna in the James Range the Achilpa perform ceremonies and meet
    Umbalcha, a Purula woman of the frog totem who possesses a Nurtunja and sacred
    ceremonies and shows them to the Achilpa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Ooraminna the Achilpa make an Engwura, find men suffering from Ilykincha,
    see Unjiamba people, perform Ariltha on Unjiamba men and some Achilpa young men,
    and perform Atna ariltha-kunta on two Unjiamba women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Urthipata the Achilpa make Engwura and find an Unjiamba man and woman;
    each possesses a Nurtunja and quabara undattha, and the Achilpa cannot interfere
    with the woman because of her quabara.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After leaving Urthipata the Achilpa are seen by a Purula man of the witchetty
    grub totem who hides himself, so they do not see him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a small hill on the Emily Plains a stone arises to mark the spot; the Achilpa
    perform a long series of Achilpa ceremonies and then continue to Okirra-kulitha
    and Irpai-chinga, where they perform further ceremonies and Ariltha on young men.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Near Irpai-chinga the Achilpa notice many witchetty grubs feeding on grass
    but do not interfere with them.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
