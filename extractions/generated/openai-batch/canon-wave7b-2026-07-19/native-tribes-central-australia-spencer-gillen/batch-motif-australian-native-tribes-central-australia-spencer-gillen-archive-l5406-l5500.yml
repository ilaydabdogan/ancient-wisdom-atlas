canonical_text:
  quote: ''
  summary: The passage introduces a chapter on ceremonies connected with marriage
    and then describes an Arunta and Ilpirra custom performed when a girl reaches
    marriageable age. The allotted future husband speaks to Unkulla men; men in specified
    kin or marriage categories take the girl into the bush, where an operation called
    Atna-ariltha-kuma is performed with a stone knife and a small wooden Churinga.
    Afterward, named categories of men have access to her in a prescribed order. She
    is decorated with head bands, Alpita, necklaces, fur bands, fat, and red ochre,
    and is taken to the camp of her special Unawa. The passage explains this as a
    temporary exception to ordinary marriage restrictions and notes that the ceremony
    is, strictly speaking, a female initiation equivalent to a male sub-incision rite.
  language: English
  quote_policy: summarized
