canonical_text:
  quote: ''
  summary: The passage contrasts an earlier Alcheringa context of travelling men with
    a later Alcheringa period in which the current marriage and class organization
    is attributed to the wisdom of Erlia, or emu, people. Regional Oknirabata propose,
    debate, and adopt rules for marriage relations. A named northern Oknirabata, Ungwurnalitha,
    sends messengers bearing sacred Churinga to summon people to Urliipma, then leads
    them to Apaura/Belt Range, where a great Engwura is held.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the early-times context, the passage mentions a group of men marching across
    strange country and evidence of intercourse with women other than those of their
    own totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the later Alcheringa period, after the time of the Ungambihila, Ullakupera,
    and Achilpa, the organization then current among the Arunta is said to have been
    adopted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The present system of marriage and understanding of the class system are traditionally
    ascribed to the wisdom of Erlia, or emu, people from four widely separated localities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Oknirabata of the Thurathertwa group near Glen Helen proposed a system
    permitting Panunga men to marry Purula women and Bukhara men to marry Kumara women,
    and vice versa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Under the Thurathertwa leader's proposal, people in the relations called Unkiilla
    and Unawa could marry each other.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Thurathertwa leader's proposal was carried out locally and supported by
    the Oknirabata of the southern emu people at Umbachinga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Oknirabata of the Ulalkira and Urliipma groups to the north are described
    as Chariinka, meaning very wise, and they said that Unkiilla should not marry.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a meeting between the northern Oknirabata and the two other Oknirabata,
    the northern plan was judged better, was said to make things go straight, and
    was adopted as the new system.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Oknirabata of a northern emu group at Urliipma sent Inwurra, messengers
    carrying sacred Churinga, to summon people from all directions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The summoned people assembled at Urliipma and were led by the Oknirabata named
    Ungwurnalitha to Apaura, now called the Belt Range, where a great Engwura was
    held.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Named settings include Glen Helen in the Macdonnell Range, Umbachinga, Urliipma
