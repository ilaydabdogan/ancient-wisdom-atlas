canonical_text:
  quote: ''
  summary: 'The passage describes a staged operation in the making of a medicine man:
    Nung-gara/Niing-gara operators wound the novice’s finger with a pointing stick,
    pretend to insert a crystal, repeatedly score his body, give him meat, water,
    and tobacco said or shown to contain Ultunda crystals, and on the third day perform
    a tongue-related operation involving an Ultunda said to come from behind an operator’s
    ear or skull.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of the Niing-gara ties hair string around the middle joint of the first
    finger of the man’s right hand and forces a pointing stick under the nail into
    the flesh, making a hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The operator pretends to press a crystal into the hole, and the man is told
    to keep a finger pressed against it so the stone will not come out, then to remain
    quiet and sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man’s body is scored repeatedly during the day and evening, and he is
    then given meat said to contain Ultunda.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man is given water that actually contains small crystals called Ultunda,
    and he drinks it; on the next day he is again scored and given meat, crystal-containing
    water, and native tobacco containing the same.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the third day the scoring, eating, and drinking are repeated, and the man
    is told to stand with his hands behind his head and put out his tongue.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One of the Nung-gara says he keeps a thin, sharp Ultunda in his skull just
    behind his ear, withdraws it, takes dust from the ground, and dries the man’s
    tongue with the dust.
  category: action
  evidence_refs:
  - ev:3
