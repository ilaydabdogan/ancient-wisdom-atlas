  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: After several days, the implement is moved near camp and concealed until dark,
    when the user approaches the camp unseen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: By firelight, the user discerns the victim's features, turns his back, stoops,
