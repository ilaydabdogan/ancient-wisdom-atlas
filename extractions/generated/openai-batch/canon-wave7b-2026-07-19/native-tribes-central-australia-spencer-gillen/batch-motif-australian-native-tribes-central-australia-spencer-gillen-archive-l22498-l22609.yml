canonical_text:
  quote: the pointing of a bone or stick at some individual with the idea of injuring
    him
  summary: The passage describes medicine men identifying persons held responsible
    for deaths, assisting Kurdaitcha by magic, and the preparation and use of charmed
    pointing bones or sticks, especially Injilla and Irna, to injure, sicken, or kill
    a victim. It also describes secret incantations, nocturnal pointing toward a victim
    by firelight, possible rescue by a medicine man, and punishment if the act of
    pointing is discovered.
  language: English
  quote_policy: quoted
