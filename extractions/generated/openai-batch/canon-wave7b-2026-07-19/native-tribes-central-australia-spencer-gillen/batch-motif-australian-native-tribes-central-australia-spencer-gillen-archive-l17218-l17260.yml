canonical_text:
  quote: ''
  summary: A traveling ancestral group encounters men and boys eating plums, performs
    quabara uudattha, goes into the ground, dies, and later arises changed from Achilpa
    men into Ulpmerka of the Akakia or plum tree totem. The newly arisen Ulpmerka
    travel with local Akakia Ulpmerka, leave members behind to form Oknanikilla, meet
    Kukaitcha’s Nurtunja-carrying party, and later encounter two Urpura or magpie
    totem women who own ceremonies and show them to the men. The Ulpmerka perform
    sacred ceremonies hidden from women, then perform a public Altherta dance at a
    place where standing stones arise as markers. At Alawalla, near Central Mount
    Stuart, they perform Quabara while Akakia trees shed plums so densely that the
    fruit falls like rain and runs like a flood.
  language: English
  quote_policy: summarized
