- id: obs:3
  text: The newly arisen Ulpmerka took local Ulpmerka of the Akakia totem with them,
    traveled to Erlua, and left members at different places to form Oknanikilla.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Arwura-puncha they met Ulpmerka men from Otiurnpa led by Kukaitcha and
    carrying a large Nurtunja; the two parties joined forces, performed quabara uudattha,
    left two men behind, and went to Urangunja.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Urangunja they found two women of the Urpura or magpie totem who had a
    Nurtunja, owned certain ceremonies, and showed those ceremonies to the men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two women had their arms, heads, and necks covered with furstring and
    Alpita rabbit-kangaroo tail-tips, ornaments described as worn by women at special
    ceremonies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ulpmerka camped at Urangunja for a time and performed sacred ceremonies
    that women were not allowed to see.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Ilchartwa-nynga they made a great Altherta, described as an ordinary non-sacred
    corrobboree that women and uninitiated people may see and join.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the Altherta site, many stones standing on end arose and still mark where
    the Ulpmerka danced; the stones are called Ulpinerka atuimma, meaning the standing
    Ulpinerka.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Alawalla, east of Central Mount Stuart, they made Quabara while Akakia
    trees shed plums so thickly that the fruit seemed to rain down and run along the
    ground like a flood, threatening to drown the Ulpmerka before the passage breaks
    off.
  category: sequence
  evidence_refs:
  - ev:5
