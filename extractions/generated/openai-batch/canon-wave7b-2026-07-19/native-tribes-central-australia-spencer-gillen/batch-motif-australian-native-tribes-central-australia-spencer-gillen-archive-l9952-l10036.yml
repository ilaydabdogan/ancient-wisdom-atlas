canonical_text:
  quote: ''
  summary: The passage describes rules and ceremonies associated with Central Australian
    totemic groups and Intichiuma performances. It states that totemic groups are
    regarded as having control over the abundance of their totem animal or plant and
    first rights in relation to it. It gives examples involving a charmed stone Churinga
    made by a euro-totem man for a plum-tree-totem man, Witchetty grub food taboos
    and redistribution after Intichiuma, and a kangaroo-totem ceremony involving bloodletting
    over a stone ledge, red ochre, secrecy from women and children, and a subsequent
    hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each totemic group is said to have direct control over the numbers of the
    animal or plant whose name it bears, and in theory to have first right to that
    animal or plant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: People who do not belong to the totem must bring the totemic food into camp
    and cook it there rather than eating it outside camp; otherwise the men of the
    totem would be angry and the supply would fail or vanish.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: A man of the Akakia or plum-tree totem possessed a roughly circular stone
    Churinga wrapped in fur string so that women would not see it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone Churinga was made, sung over or charmed, and given by a euro-totem
    father-in-law to assist the plum-tree-totem man in hunting euro.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Churinga bore a euro-totem design with concentric circles described as
    intestines and two groups of semicircles indicating a male and a female euro.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the Intichiuma performance, Witchetty grub is taboo to members of the
    Witchetty grub totem until it is abundant and fully grown; breaking the rule is
    said to undo the ceremony’s effect and reduce the grub supply.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Witchetty grubs become plentiful and full-grown, Witchetty grub men,
    women, and children collect large quantities, bring them into camp, cook them
    dry and brittle, and store them in pitchis and bark; non-members also collect
    grubs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When grubs become less plentiful, stored cooked grubs are taken to the men’s
    camp, where all men assemble under instructions from the Matunja.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Non-members place their stores before the Witchetty grub totem men; the Alatunja
    and other totem men grind a portion, eat a little, and return what remains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Alatunja then grinds a portion from his own store with the totem men;
    they eat a little and pass most of the remainder to those who do not belong to
    the totem.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After this ceremony, Witchetty grub men and women may eat grubs only sparingly;
    eating too much, or eating none at all, is said to reduce their power to perform
    Intichiuma successfully and result in few grubs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Undiara kangaroo-totem ceremony, men let blood pour from their arms
    over a stone ledge, rub themselves with red ochre, and return to a main camp set
    far enough away that women and children cannot see the events at the rock.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the kangaroo-totem men return, younger men go hunting kangaroo and bring
    caught kangaroo to the older men.
  category: action
  evidence_refs:
  - ev:7
