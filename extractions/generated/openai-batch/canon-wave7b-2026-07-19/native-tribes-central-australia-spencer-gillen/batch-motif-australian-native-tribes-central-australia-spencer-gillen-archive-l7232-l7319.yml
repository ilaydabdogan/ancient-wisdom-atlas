canonical_text:
  quote: ''
  summary: The passage describes Arunta Churinga as sacred objects associated with
    living and dead persons, ancestral Alcheringa men, and spirit individuals. It
    describes their believed power in fighting and healing, the Ertnatulunga storehouse
    as a sacred refuge, secrecy and danger around the storehouse, mourning after loss
    of Churinga, occasional lending between friendly groups, and the unknown origin
    of original stone Churinga in the Alcheringa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Churinga are described as associated with living members and dead members
    of the tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tradition says special men of the Alcheringa wandered and descended into the
    earth at spots where their Churinga remained associated with their spirit part.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each Churinga is described as closely bound to a spirit individual and regarded
    as that spirit individual's representative in the Ertnatulunga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Churinga belonging to dead men are said to have the attributes of their owners
    and to impart those attributes to a person carrying them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Churinga is said to give its possessor courage and accuracy of aim and to
    deprive an opponent of those qualities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ertnatulunga and its immediate vicinity are described as sacred; a pursued
    man would not be touched while he remained there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the Engwura ceremony, temporary Churinga storehouses were made, and
    no display of arms was allowed near the Churinga stores.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A sick man might have a stone Churinga of his totem brought from the storehouse,
    scrape its edge, mix the dust with water, and drink the mixture.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The exact storehouse spot is said to be under the charge of the headman and
    older men and known only to initiated men of the group.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Interference by a stranger with another group's Churinga is described as likely
    to result in the stranger's death, with retaliation expected.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The few robberies of Ertnatulunga known to the authors are described as having
    been committed by white men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After Churinga were removed from one Ertnatulunga, the men of the group stayed
    in camp for two weeks, weeping, mourning, and plastering themselves with white
    pipeclay.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Churinga are said to be occasionally lent by one group to another friendly
    group as an act of courtesy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The original Churinga of the Alcheringa are said to have been all, or mostly,
    stone, and the passage says their origin could not be determined.
  category: attribute
  evidence_refs:
  - ev:8
