canonical_text:
  quote: ''
  summary: 'The passage gives a technical description of quartzite knife blades: their
    generally trigonal section, occasional fourth surface near the head end, resin
    hafting that can hide this surface, the desired tapering sharp point, measured
    blade sizes, and a simpler hafting form in which the flake head is embedded in
    a rounded mass of resin.'
  language: English
  quote_policy: summarized
