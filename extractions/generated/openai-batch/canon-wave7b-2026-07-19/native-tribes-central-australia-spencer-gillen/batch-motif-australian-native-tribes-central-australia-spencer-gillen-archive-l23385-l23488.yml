canonical_text:
  quote: ''
  summary: The passage classifies wife-obtaining methods among the Arunta and Ilpirra
    as magical charming, capture, elopement, and the custom named Tjiakha inura. It
    summarizes magical objects used for charming, emphasizes that capture is rare,
    describes an avenging-party allocation of a captured woman through ground holes
    called Aura and a handful of earth, and introduces elopement as a non-magical,
    consensual method.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage lists four methods of obtaining wives: charming by magic, capture,
    elopement, and an arrangement by which a man secures a wife for his son through
    another man''s daughter.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named objects, Lonka-lonka, Chilara, Ulpinira, and Namatwinna, are described
    as used in magical charming, and a man's claim is supported by his local group
    if the woman is in the relationship described as lawful wife.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Capture is described as much rarer than the other methods and as the rarest
    way for a Central Australian man to secure a wife.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Within a local group, a man may be aided in taking a woman when the man from
    whom she is taken is said not to have shown respect to his father-in-law by cutting
    himself after certain deaths.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman may also be captured from another group, especially by an avenging
    party; such captured women are said to be allotted to certain members of that
    party.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the described avenging-party example, the old leader scrapes two long shallow
    holes in the ground, called Aura, to represent the intended male victim and a
    woman.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The leader asks who wants the woman, selects one man, takes earth from the
    hole representing the woman, gives it to the selected man, and says that she belongs
    to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the woman is captured, the passage says she becomes the property of
    the selected man, with no dispute from the others and no stated right of access
    by the other men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says women captured in such cases are allotted to men who stand
    in an appropriate marriage relationship, and that equivalent groups across tribes
    regulate marriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Elopement is described as intermediate between magical charming and capture;
    it is said to involve no magic element and to differ from capture because the
    woman is consenting.
  category: attribute
  evidence_refs:
  - ev:7
