canonical_text:
  quote: ''
  summary: 'The passage describes episodes during an Engwura initiation sequence:
    mourning in the women''s camp, old men''s performances concerning wild cat ancestral
    people, plum-tree, frog, and emu totem ceremonies, fire-throwing and fire ordeal
    actions involving the Illpongwurra, a double-line Ilpirra-associated dance beside
    the Parra, and an emu-related performance in which two decorated men act as dead
    spirits arisen from bones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women in camp wailed throughout the day, struck each other with waddies, and
    cut themselves with knives after an old man's death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old men performed ceremonies concerning wild cat people who, in the Alcheringa,
    marched from south of present Oodnadatta northward across part of the Arunta country
    and through named places including Illamurta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sunset the Illpongwurra came from the west and first went to a ceremony
    in which a performer represented one of the Ulpmerka of the plum-tree totem sitting
    at the foot of a Nurtunja.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A second ceremony was associated with the frog totem of Imanda and was performed
    by two men wearing Churinga on their heads, with body decoration in down representing
    frogs and tree roots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Illpongwurra danced around the frog performers, ran around the Parra raising
    dust, followed the frog performers across the river to the women's camp for fire-throwing,
    and then returned to lie beside the Parra.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After dark the men formed a double line close to the Parra, bent their bodies,
    clasped their hands, moved parallel to the mound, stamped, and shouted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The double-line dance is said in the passage to be especially performed by
    members of the Ilpirra tribe during Engwura and was danced because Ilpirra men
    were present.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shortly before midnight a wild cat ceremony was performed, and the dancing
    and singing continued until early morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The next day, while in the bush, the Illpongwurra underwent the first performance
    of another form of fire ordeal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In camp the old men performed the Ingwurninga inkinja, associated with the
    emu totem near Imanda; two selected performers were decorated with white down
    and circular charcoal patches edged with down, said to represent skulls of slain
    and eaten men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The two decorated performers were called ulthana, spirits of dead men, and
    were supposed in this performance to have arisen from the bones of two eaten men;
    they emerged crouching, then walked with sticks as if decrepit and prowled toward
    the Parra.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At sunset the Illpongwurra again came by way of the women's camp, where fire-throwing
    took place, then stood in a long line by the Parra watching an emu ceremony involving
    a man with a tall head-dress tipped with emu feathers.
  category: sequence
  evidence_refs:
  - ev:9
