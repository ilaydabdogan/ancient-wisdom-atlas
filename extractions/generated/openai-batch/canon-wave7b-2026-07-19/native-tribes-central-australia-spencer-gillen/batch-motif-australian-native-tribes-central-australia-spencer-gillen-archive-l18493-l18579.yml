canonical_text:
  quote: ''
  summary: 'The passage recounts Alcheringa traditions in which ancestral women change
    totemic or class identity through sacred decoration and ritual action, travel
    through or under the ground, cause blood to inundate an Engwura ground and form
    a clay-pan, and join Ulpmerka people under Kukaitcha. It then begins a tradition
    of three wild dog men: two young men steal an old man''s bag containing Churinga,
    flee while he pursues them, kill and eat several figures, leave a Churinga from
    which a later man springs, and continue fleeing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bandicoot woman paints her Unjiamba companion with Quirra undattha, causing
    the companion to change to the Quirra totem.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The women enter the ground, travel to Urtiacha, and later one woman remains
    at a spot east of Owen Springs after changing into a Kumara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman who was originally Unjiamba and Panunga is named Illapurinja, glossed
    in the passage as 'the changed one.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Urapitchera, the remaining woman finds Achilpa people making Engwura and
    causes blood from her sexual organs to flow in great volume toward them, after
    which they flee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The blood covers the Engwura ground and forms a clay-pan; a nearby refuge
    place is marked by stones said to have sprung up there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The remaining woman finds a Kumara woman of the bandicoot totem, takes her
    as a companion, and travels underground with her toward the north-east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old Kumara man of the lizard totem named Yukwirta chases the two women
    but does not capture them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Inkila-quatcha, the two women find Ulpmerka of the plum-tree totem making
    Churinga by drawing designs with opossum teeth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Ouiurnpa, Kukaitcha decorates the Kumara woman with sacred down, causing
    her class to change from Kumara to Panunga and making her Qutia, the younger sister
    of the other woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The two women accompany the Ulpmerka north under Kukaitcha, and a wandering
    Achilpa party later joins them and changes into Ulpmerka men of the plum-tree
    totem.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'At Chilpma, three wild dog men are introduced: the old Bukhara man Kaltiwilyika
    and two young Panunga men, Kalterinya and Ulthulperinya.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kaltiwilyika owns a string bag called Inika or Apitnga containing two Churinga;
    the two young men steal the bag and flee while he follows carrying a Wallira spear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Uchirka, the two young men kill and eat an old wild dog woman and her newly-born
    child, leaving some meat for the old man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Uchirka, the young men leave a Churinga from which a man named Uchirkarinia
    later springs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: While fleeing, the young men pass Achilpa at Therierita, avoid interfering
    with Oruncha men at Itnuringa, and camp at the Ulkupiratakima rock-hole.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: At Ulkupiratakima, the young men kill and eat another old wild dog woman,
    hide the bag with the Churinga when the old man appears, give him meat, and remain
    afraid that he will kill them.
  category: sequence
  evidence_refs:
  - ev:10
