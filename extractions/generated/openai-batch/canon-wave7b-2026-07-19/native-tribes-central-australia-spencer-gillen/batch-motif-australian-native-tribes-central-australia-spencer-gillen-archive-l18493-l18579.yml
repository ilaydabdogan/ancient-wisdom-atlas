candidate_motifs:
- id: motif:1
  label: Ritual transformation of totemic or class identity through sacred decoration
  taxonomy_refs:
  - shapeshifter
  basis: The passage repeatedly describes figures changing totem or class identity
    after painting, sacred down, or related ritual action.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The transformations are specifically changes of totem, class, or group
    identity; the passage does not always describe bodily shape-changing.
- id: motif:2
  label: Ancestral action creates enduring landscape features
  taxonomy_refs:
  - culture_hero
  basis: The woman's blood covers an Engwura ground and forms a clay-pan, while stones
    spring up at the place where the Achilpa take refuge.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage presents landscape formation by an ancestral figure but does
    not explicitly label her a culture hero.
- id: motif:3
  label: Ceremonial making and use of sacred objects
  taxonomy_refs:
  - initiation
  basis: Achilpa are making Engwura; Ulpmerka make Churinga with opossum teeth; sacred
    down and Churinga are tied to ritual changes and later events.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: Engwura and Churinga are directly named, but the passage does not give
    full ceremonial details.
- id: motif:4
  label: Theft of sacred objects followed by pursuit
  taxonomy_refs:
  - sacred_theft
  basis: The two young wild dog men steal Kaltiwilyika's bag containing Churinga and
    flee while he follows them with a spear.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The stolen objects are Churinga; the passage does not state the motive
    for the theft.
- id: motif:5
  label: Person springs from a sacred object
  taxonomy_refs:
  - sacred_birth
  basis: A Churinga left at Uchirka is said to be the source from which Uchirkarinia
    subsequently springs.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The figure is described as a man rather than an infant, so the match to
    birth motifs is approximate.
