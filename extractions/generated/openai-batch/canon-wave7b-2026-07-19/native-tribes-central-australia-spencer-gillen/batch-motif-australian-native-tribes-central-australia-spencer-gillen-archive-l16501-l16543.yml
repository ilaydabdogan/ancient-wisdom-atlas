canonical_text:
  quote: ''
  summary: The passage is a chapter heading, synopsis, and opening paragraph for traditions
    about Alcheringa ancestors of the Arunta and particular customs. It lists episodes
    involving transformations into human beings, stone knives, circumcision, sub-incision,
    wanderings of totemic groups, deaths and returns to life, and the establishment
    of class and marriage arrangements. The opening paragraph explains that Alcheringa
    denotes the period of the mythical ancestors and that traditions distinguish multiple
    periods within it.
  language: English
