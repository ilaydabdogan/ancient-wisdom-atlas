canonical_text:
  quote: ''
  summary: The passage narrates how Ullakupera men seek Lalira stone knives, receive
    poor knives after older men hide the good ones, then bring good Lalira to ceremonial
    grounds where they perform circumcision/Lartna, transform Inapertwa beings into
    men and women, confer class names, and leave landscape markers such as clay-pans
    and gum trees. It also describes an Inarlinga man opposing the new stone knives
    and instances of ancestors or objects going into the ground, including Lalira
    becoming a Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed old man tells others not to cut with a fire-stick and says he will
    give them Lalira at Atnaturka; he then flies back to Atnaturka and reports what
    he has seen and said.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Intumpulla and Ungipurturinia hide the good Lalira and leave poor Lalira visible;
    the two Ullakupera men receive bark-wrapped Lalira and later find the stone knives
    rough and unlike what had been described.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After repeated unsuccessful visits for good Lalira, the two Ullakupera men
    invite old Ullakupera men to Utiara, where many Ulpmerka are ready to be operated
    upon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party of Ullakupera led by the named old men leaves Atnaturka with women
    and good Lalira, camps at Urtiacha, and has no Nurtunja or bird's down, only white
    pipe-clay and powdered charcoal for decoration.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: At an Apulia ground, men of the Ertwaitcha totem and other totems are assembled,
    and the Ullakupera perform the operation on young men and local men; the local
    men regard Lalira as an improvement over the fire-stick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near the Apulia ground, the Ullakupera use stone knives to make Inapertwa
    creatures into men and women and confer the class names Panunga, Bukhara, Purula,
    and Kumara upon them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Inarlinga, or Echidna, man arrives after the circumcision operation is
    over, becomes angry, and strongly disapproves of the introduction of stone knives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A clay-pan forms where the Apulia ground had been made, and several Ullakupera
    men go into the ground with their Churinga; men and women are said to have sprung
    from spirits associated with those Churinga.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Near Wurungatha, the party again operates upon men; the Inarlinga man again
    arrives too late and is angry, and another clay-pan arises to mark the spot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Iturkwarinia, the party finds Arwatcha men but does not operate on them
    because no Apulia is ready; they transform Inapertwa into Arwatcha men and women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Iturkwarinia, a Purula woman and a Kumara man are left behind; the Kumara
    man's Lalira is transformed into a Churinga when he goes into the ground and dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: East of what is now Mount Undoolya, Inapertwa of the Alchantwa seed totem
    are transformed into human beings, and a group of gum trees marks the spot where
    the operation was performed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Urwampina, the Arwatcha people have prepared an Apulia, so Lartna is performed
    upon them and Inapertwa creatures are also operated upon; the passage then notes
    that a Purula man remained behind before the excerpt breaks off.
  category: sequence
  evidence_refs:
  - ev:10
