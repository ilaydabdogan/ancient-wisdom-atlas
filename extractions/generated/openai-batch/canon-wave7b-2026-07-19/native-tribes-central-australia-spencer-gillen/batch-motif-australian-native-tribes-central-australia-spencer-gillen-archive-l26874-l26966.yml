canonical_text:
  quote: ''
  summary: The passage describes Wilyaru initiation actions involving restraint, a
    decorated procession, a mound fire, burning or steaming, body cuts, and seclusion;
    obligations of young Wilyaru men to old Wilyaru; a novice painted to resemble
    an eagle-hawk; Dieri avenging-party, initiation, animal-increase, rain-making,
    and sacred-tree customs as reported by Mr. Gason and compared with Urabunna and
    Arunta practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wilyaru novice is described as prisoner-like, loosely tied with string,
    and not joining the singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A decorated party returns at daylight to the men's camp in single file at
    a run, following a serpentine course; older Wilyaru men lead and close the file
    while carrying decorated spears with eagle-hawk feathers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the mound fire, decorated women stand aside while the men run around several
    times shouting a phrase rendered as “Fra ka kayawo.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Older men cover the fire with earth and green branches, and the novice is
    placed doubled-up on the steaming and smoking mound for a short time, sometimes
    long enough to burn him severely.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the mound episode, older men take the novice into the bush, make cuts
    on his body, and place him under the charge of old Wilyaru for perhaps three months,
    during which women and uninitiated men must not see him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that a man is fully grown before being made into a Wilyaru.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Young Wilyaru men are supposed to take all game they kill to old Wilyaru,
    who take what they want, touch the remainder with their lips, and return it; neglect
    is said to cause fatal fat accumulation in the body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: During the ceremony, the painted novice is supposed to resemble the eagle-hawk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Dieri Pinya or Finya avenging-party custom, women lay firesticks in
    a row and call names until the condemned man's name is called; men spear that
    firestick, and the leader buries it while declaring that the condemned man will
    be slain and buried like the stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Dieri Wilyaru ceremony described by Gason, blood is poured over the
    novice from older men's arms, the novice is cut on the neck and shoulders with
    flint, scars are raised as signs of passage through the ceremony, and a whirled
    wooden object called Yimtka is given afterward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Dieri animal-increase and rain-making rites are described as including
