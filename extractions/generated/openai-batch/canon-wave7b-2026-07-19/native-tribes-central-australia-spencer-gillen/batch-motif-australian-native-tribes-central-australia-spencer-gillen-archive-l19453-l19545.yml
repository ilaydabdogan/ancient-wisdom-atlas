canonical_text:
  quote: ''
  summary: The passage compares tooth-extraction customs among Arunta, Kaitish, Victorian,
    New South Wales, central Australian, and eastern coastal tribes. It describes
    tooth disposal toward or to a mother or female relative, shield-and-weapon actions
    marking male adulthood, extension of the rite to women, the emptying of a girl's
    pitchi as a sign of women's duties, and the authors' inference that central and
    coastal forms share a common origin, with tooth extraction being the more ancient
    ceremony.
  language: English
  quote_policy: summarized
