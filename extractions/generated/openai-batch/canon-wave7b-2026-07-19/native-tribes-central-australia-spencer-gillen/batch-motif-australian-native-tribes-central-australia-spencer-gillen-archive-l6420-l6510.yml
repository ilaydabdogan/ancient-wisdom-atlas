canonical_text:
  quote: ''
  summary: The passage describes Arunta totem names and their relation to class descent,
    family membership, local distribution, and marriage rules. It states that every
    individual has a totem name, but that totem names are not confined to a class
    or subclass and do not necessarily follow either parent. Five sampled families
    are listed to illustrate varied combinations of parental and child totems. The
    passage also notes that some totems predominate locally and that marriage is regulated
    by class rules rather than by totem.
  language: English
  quote_policy: summarized
