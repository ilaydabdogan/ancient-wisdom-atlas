canonical_text:
  quote: ''
  summary: Two young men travel through named places, camp, kill and eat several wild
    dog totem figures, flee an old man who is seeking to kill them, and eventually
    ascend into the sky with a bag after local men become angry. They continue to
    Ulthirpa and other places, encountering wild dog figures who possess, lack, or
    display named ritual objects, and after one killing their faces become blood-suffused
    and they suck one another's cheeks for relief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Pilyiqua, where there are small rock-holes, the two young men camped and
    killed and ate some small wild dog men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man overtook the two young men, accepted meat from them, ate only
    a little, remained sulky, and watched for an opportunity to kill them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two young men left before daylight, passed Irpalpa, travelled to Okniambantwa
    or Mount Gillen, camped on top of the range, and killed and ate an old woman of
    the wild dog totem.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man later arrived, the two young men hid, and he attacked wild dog
    men with his great spear, killing several before the wild dog men combined and
    killed him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because the local men were angry, the two young men were afraid to join them
    and went up into the sky with the bag, travelling northwest to Ulthirpa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ulthirpa the two young men encountered Ulthirpirinia, a Bukhara man of
    the wild dog totem, who lived on wild dog flesh and showed them a Niirtunja and
    quabara undattha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Erwanchalirika the two young men found a Bukhara wild dog man, killed and
    ate him, and the passage says he had no Xiirtunja or Churinga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After eating the Bukhara wild dog man at Erwanchalirika, the two young men's
    faces became suffused with blood, and they relieved each other by sucking one
    another's cheeks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After passing Johnston's Well and Harding's Soakage, they found a big XurUinja
    belonging to Kalterinia, an old Panunga wild dog with a broad white streak down
    the centre of his face, and he showed them his quabara undattha.
  category: sequence
  evidence_refs:
  - ev:7
