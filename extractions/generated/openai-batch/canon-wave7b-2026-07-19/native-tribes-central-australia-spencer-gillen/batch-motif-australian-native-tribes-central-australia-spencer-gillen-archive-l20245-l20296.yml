canonical_text:
  quote: ''
  summary: The passage records several restrictions concerning women, food, lactation,
    pregnancy, menstruation, and a mother's conduct while her son is away or recovering.
    It then discusses evidence for former cannibalism, citing Engwura-related ceremonies
    in which decorated performers represent slain and eaten men or their spirits,
    Achilpa men cook a human body in ceremony, and a White Bat totem ceremony uses
    a head-worn object representing a dead body to be eaten.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young women are said to be allowed to eat only the young nestlings of the
    bird mentioned in the passage, while the bird is described as ekirinja or forbidden
    to young women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a suckling woman sees one of these birds, she turns so that the bird cannot
    see her breast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that if the bird sees the breast, or if its shadow falls
    on it, the milk would fail and the breast would swell and burst.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women are said to believe that eating the old birds would cause their sons
    to have varicose veins on the forehead.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: While the Arrakiirta is out in the bush, his mother may not eat opossum, large
    carpet snake, large lizard, or fat of any kind, because doing so would retard
    her son's recovery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women during pregnancy or menstruation may not gather Irriakiira, a bulb described
    as part of a staple vegetable food, because breaking the rule would cause the
    supply of Irriakura to fail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The authors state that there is clear evidence that cannibalism was formerly
    a well-recognised custom.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a ceremony called Qiiabarra Ingwiiriiinga inkinja, two men have circles
    of white down on their bodies, said to represent the skulls of slain and eaten
    men.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The performers in that ceremony represent UltJiana, or spirits of dead men,
    wandering in search of those who killed and ate them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In another ceremony, two Achilpa men are described as cooking the body of
    a third man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The figure caption describes a White Bat totem ceremony concerned with cannibalism,
    in which an object worn on the standing man's head represents the dead body of
    a man who is to be eaten.
  category: object
  evidence_refs:
  - ev:6
