canonical_text:
  quote: ''
  summary: A glossary section defines Arunta and related terms for bodily ceremonies,
    initiation rites, sacred or secret names and objects, Churinga and bull-roarers,
    spirits and reincarnation, spirit children emanating from stones, taboos, sacred
    storehouses, offerings, magic objects, and totemic animals or plants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The glossary identifies Ariltha or Ariltha-kuma as the ceremony of sub-incision
    and Atna-ariltha-kuma as introcision or cutting open of the vulva.
  category: action
  evidence_refs:
  - ev:6
- id: obs:2
  text: A sacred or secret name is said to be given to each individual and associated
    with the individual’s Churinga, which belonged to an ancestor of whom the person
    is regarded as the reincarnation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aruinhurinira is defined as a spirit issuing from a natural object that marks
    where an Alcheringa individual died, while the original spirit remains in the
    Churinga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Churinga is defined as something sacred or secret and is applied both to an
    object and to the sacred or secret quality possessed by it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Churinga are most often sacred stones or sticks of the Arunta tribe and are
    described as equivalents of bull-roarers of other tribes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Churinga nanja is especially associated with each man and woman and is supposed
    to have belonged to and been carried by the spirit of whom that person is the
    reincarnation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Erathipa is a stone connected with a sacred pole and with a child going into
    the earth together with Churinga; spirit children are said to emanate from the
    stone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Several entries define initiation or circumcision elements: the novice lying
    behind boughs, a boy’s changed status after first hair-tying, embrace of a sacred
    pole, a shield supporting the novice, a design painted on the boy’s back, and
    Engwura as ceremonies associated with the last initiation rites.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ekirinja is defined as forbidden or tabu, and Ertnatulunga is a sacred storehouse
    whose ceremonial objects may not be seen by women and children.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chaurilia is an offering of food made to men who officiated at certain ceremonies,
    after which a prior ban of silence between donor and recipient is removed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Magic stones are said to be in the body of the medicine man, and a magic evil
    influence may be resident in a material object.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Rounded stones called Churinga unchima are supposed to be the eggs of witchetty
    grubs of the mythical past.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Several animals and plants give their names to totems, including the Euro,
    a small rat, an edible berry, a large lizard, and the emu.
  category: relationship
  evidence_refs:
  - ev:11
