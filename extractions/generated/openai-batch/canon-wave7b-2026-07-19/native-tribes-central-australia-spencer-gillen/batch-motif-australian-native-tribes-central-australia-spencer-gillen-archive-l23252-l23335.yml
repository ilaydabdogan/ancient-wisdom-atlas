canonical_text:
  quote: ''
  summary: The passage describes traditions and ritual practices involving Aningquiltha,
    an evil influence associated with certain stones and trees. An emaciated half-emu,
    half-man Alcheringa being travels through named places, leaves eggs and a Churinga,
    and becomes a stone charged with harmful influence. Similar charged stones and
    a blind tree are used through rubbing and muttering to afflict enemies with thinness
    or blindness. Erathipa stones are said to contain spirit children released by
    rubbing, and spittle-throwing is described as another way to make a person thin
    and weak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Alcheringa, a thin emaciated emu from Atnangara carries a Nurtunja
    on its head and a Churinga under its armpit; it is described as half emu and half
    man and as belonging to the Panunga class.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emu being deposits two eggs at Udnurringunia; the eggs turn into stone
    and are represented by two large round black stones at the spot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The emu being avoids emu men and women at Iralta because of shame over its
    poor condition, and later fraternises with emu men and women at Bond Springs before
    they drive it away because it is thin and miserable-looking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A slender column of stone marks a camp between Bond Springs and Undoolia.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: East of Jessie Gap the emu being deposits its solitary Churinga, from which
    Untwarntwa is said to descend; the being then becomes more emaciated and changes
    into a large stone charged with Aningquiltha, or evil influence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person wishing to harm another can rub the emu stone while muttering an
    exhortation to the evil influence, after which the target gradually becomes thinner
    and withers away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A stone near a clay pan not far from Alice Springs marks where a thin emaciated
    lizard man died; the stone is also charged with Aningquiltha and can be rubbed
    and muttered over to project the influence into an enemy.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage generalizes that stones marking where thin animals or men died,
    and other trees and stones associated with Alcheringa individuals, are connected
    with magic.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Near Charlotte Waters, the blind tree marks the spot where a blind man died;
    cutting it down is supposed to blind local men, and rubbing it while muttering
    can send Aningquiltha to blind an enemy.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: A stone near the Hugh River and Mount Conway marks where a blind man of the
    wild duck totem died, and a similar stone is said to stand near Temple Bar; the
    same ceremony may be performed at these stones.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Erathipa stones are said to be full of spirit children, and rubbing them
    can cause the spirit children to leave and enter women.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: To make a person thin and weak, spittle is put on the fingertips, the fingers
    are bunched together, and the hand is jerked toward the person; this is called
    Ptililhuuina, or spittle-throwing.
  category: action
  evidence_refs:
  - ev:12
