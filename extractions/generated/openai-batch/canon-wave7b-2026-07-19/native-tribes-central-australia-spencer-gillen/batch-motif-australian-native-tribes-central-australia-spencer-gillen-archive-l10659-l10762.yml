canonical_text:
  quote: ''
  summary: 'The passage describes the beginning of a boy''s initiation at the Apulia
    ground: the cleared east-west path, the placement of men and women, women''s shield
    dance said to imitate ancestral Unthippa women, ritual dressing and painting of
    the novice, instructions on secrecy and obedience, threats of death or removal
    by the great spirit if taboos are broken, and the novice being brought through
    the dancing women to sit on the lap of an appointed official.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Apulia is a cleared path about five feet wide and forty or fifty feet
    long, with soil banked on either side, made to run east and west.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A brake of boughs stood about forty feet from the eastern end, where the men
    assembled, while the women were grouped at another marked spot.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy ceased resisting once on the ground and sat among the men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women danced carrying shields, and the men sang about the marching of
    the Unthippa women across the country.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that the contemporary ceremony begins with an imitation
    of the Unthippa dance of the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Outside this ceremony, women may not carry shields, which are described as
    men's property.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Unkulla man wrapped strands of fur string around the boy's hair until his
    head resembled a tight-fitting skull cap.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Ganiniona man fastened a large Uliara, a human-hair girdle worn by men,
    around the boy's waist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A council of the boy's Oknia and Okilia appointed three men to take the boy
    away and paint him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The three appointed men built a second brake of bushes at the western end
    of the Apulia, corresponding to the eastern brake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy was led through the dancing women to his brake, rubbed with grease,
    and decorated with pinkish-white clay and bird's down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy was told he was no longer an Ulpmerka but a Wurtja.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The novice was instructed to obey, keep secrets from women and boys, speak
    little and quietly, remain crouched behind his brake, and not look toward the
    men's brake except when permitted.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: The novice was warned that revealing secrets would cause him and his nearest
    relations to die.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The novice was warned that if he tried to see forbidden proceedings, Twanyirika,
    the great spirit whose voice was heard when bull-roarers spoke, would carry him
    away.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: At dawn an Okilia brought the Wurtja through the dancing women, who opened
    out, and placed him sitting on the lap of the Urinthantima man.
  category: sequence
  evidence_refs:
  - ev:10
