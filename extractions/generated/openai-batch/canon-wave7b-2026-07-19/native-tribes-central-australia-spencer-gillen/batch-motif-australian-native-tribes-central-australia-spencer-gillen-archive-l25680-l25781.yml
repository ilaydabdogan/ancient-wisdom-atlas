canonical_text:
  quote: ''
  summary: The passage describes Central Australian rock paintings and ceremonial
    designs. It identifies one drawing as probably representing a stone knife with
    resin haft, notes the absence of complex narrative scenes among these tribes'
    rock paintings, contrasts ordinary geometrical rock drawings with similar but
    ritually significant totemic designs on ceremonial objects or sacred ground, discusses
    concentric circle and spiral patterns, and describes headdress decoration during
    ordinary Altherta/corrobboree dances.
  language: English
  quote_policy: summarized
