canonical_text:
  quote: ''
  summary: The passage discusses beliefs and explanations concerning the Kurdaitcha
    custom. It says some people falsely confess to going Kurdaitcha and that accusers
    and accused may each suspect the other while both are innocent. It rejects the
    idea that special shoes conceal tracks from skilled trackers, arguing instead
    that the shoes might only obscure the individual identity of the wearer. It describes
    the ability of experienced Aboriginal trackers to read faint signs and distinguish
    individual footprints. The passage suggests that fear of the Kurdaitcha's magical
    power may cause people to avoid a track or place associated with it, comparing
    this to a European peasant avoiding a ghost-haunted spot. The authors state their
    impression that Kurdaitcha is now largely mythical, while also noting continuing
    belief that others really go Kurdaitcha and that some may undergo toe dislocation
    to prove the status.
  language: English
  quote_policy: summarized
