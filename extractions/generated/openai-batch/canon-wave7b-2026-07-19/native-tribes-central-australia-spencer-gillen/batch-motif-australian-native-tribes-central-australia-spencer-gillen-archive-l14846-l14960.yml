canonical_text:
  quote: ''
  summary: The passage describes Oruncha pointing sticks, a hill-associated Oruncha
    who takes people underground and transforms a man into a medicine man, several
    initiation-related ceremonies involving Nurtunja objects, and the Erathipa tradition
    in which Inta-tir-kaka steals and breaks Unkara's Nurtunja, Unkara leaves her
    baby and Churinga in the ground, the Erathipa stone arises as a spirit home, and
    Unkara pursues the thief through the sky before dying in grief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two projecting front sticks are described as inwwima pointing sticks used
    by Oruncha to point at and kill prey.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oruncha is said to have gone in the Alcheringa into a hill near Alice Springs,
    called Mirra oruncha, the Oruncha's camp.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Oruncha is said to come out at times and seize men and women wandering after
    dusk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man taken down into the earth by Oruncha is later found dazed and transformed
    into a medicine man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ouabara Iruntarinia Unjiamba ceremony was said to have been imparted to
    a Purula man by the Iruntarinia of Apera-na-unkumna and was being presented by
    its owner to another man of the relevant totem.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the ceremony was being performed in the locality for the first time,
    only men of the Purula and Kumara moiety were to be present during preparation.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Nurtunja for this ceremony consisted of a long spear, grass stalks, hair-string,
    and an additional shorter pole, decorated with elongated pink and white down lines.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The large pole indicated a Hakea tree, the small pole a young tree, and the
    form matched a double Nurtunja carried by two Alcheringa Unjiamba men.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Ouabara Ambaquerka of Erathipa, the performer was supposed to be a
    woman with a newly-born child represented by an oval mass of twigs, grass stalks,
    hair-string, and down with two black eye spots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the Ambaquerka performance, the performer held the child-object while
    swaying and quivering, and other men danced and sang around him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the end of the Ambaquerka performance, the oval mass was pressed against
    the stomachs of the Alatunja and then the old Purula man presiding over the Engwura.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Erathipa is described as a rounded stone projecting from the ground in a plum-tree
    totem locality amid mulga scrub.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Inta-tir-kaka, a plum-tree totem man, traveled from Kulla-ratha waterhole
    to Uk-ang-wulla near Quiurnpa and found a Nurtunja standing there with no visible
    owners.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Inta-tir-kaka tried to appropriate the Nurtunja, loosened it, broke it off
    at the butt, and it fell with a loud crash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The broken Nurtunja belonged to Unkara, a plum-tree woman who lived with her
    baby boy and was away hunting plums when it was broken.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Unkara placed her baby boy into the hollow where the Nurtunja had been broken
    off, left many Churinga with him, and pursued the thief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The boy went into the ground with the Churinga, and the Erathipa stone arose
    to mark the spot and became the centre of an Oknanikilla and home of spirit individuals
    associated with the Churinga.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Unkara went up into the sky, followed Inta-tir-kaka's route, reached Kulla-ratha,
    could not recover her Nurtunja from among many Nurtunjas, and died in grief.
  category: sequence
  evidence_refs:
  - ev:8
