canonical_text:
  quote: ''
  summary: The passage explains that a Nurtunja or Churinga used in ceremony represents
    one specific object and must be newly made if another object is to be represented.
    It then describes a food gift from a young man to an elder as an indirect request
    to be shown a ceremony connected with his dead father’s totem. The narrative marks
    the beginning of the fourth phase of the Engwura, in which young men are subjected
    to stricter discipline and fire ordeals. The Illpongwurra are driven from camp
    with bull-roarers, hunt game for elders, return decorated with twigs and leaves,
    and are met as women prepare and light fires.
  language: English
  quote_policy: summarized
