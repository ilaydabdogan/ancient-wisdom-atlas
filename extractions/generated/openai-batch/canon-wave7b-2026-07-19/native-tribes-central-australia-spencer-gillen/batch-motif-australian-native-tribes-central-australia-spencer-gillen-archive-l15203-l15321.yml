- id: obs:4
  text: A young Purula man brought game as a food gift to the older man in charge
    of the Unchichera ceremonies of Imanda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man’s statement that food was waiting along the creek was understood
    as an indirect request to be shown a ceremony connected with his dead father’s
    totem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fourth phase of the Engwura begins with a series of fire ordeals and stricter
