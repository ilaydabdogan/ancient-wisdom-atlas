  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Illpongwurra were collected near the Parra at sunrise, and three elder
    men who were already Urliara were appointed to look after them during the day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Older men carrying small Churinga drove the Illpongwurra away from camp amid
    shouting and the sounds of bull-roarers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each Illpongwurra carried a shield, spear, and boomerang while going into
    the bush to hunt game for the old men remaining in camp.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young men were not supposed to eat the game they caught but were to bring
    it to the old men, who might or might not share it on their return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Illpongwurra avoided the women’s camp and were taken through a defile
    in the ranges west of the camp.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Women and children gathered on the east side of the river; Panunga and Bukhara
    separated from Purula and Kumara, and each group collected grass and sticks for
    a fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before returning to camp, the Illpongwurra deposited the game they had secured
    and decorated themselves with Eremophila twigs and leaves under head-bands, arm-bands,
    and through the nasal septum.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Illpongwurra returned in a dense square formation, were met by Urliara
    carrying Churinga, and bull-roarers began to swing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The women lit their fires as the Illpongwurra approached and were driven forward
    into the river bed.
  category: action
  evidence_refs:
  - ev:10
