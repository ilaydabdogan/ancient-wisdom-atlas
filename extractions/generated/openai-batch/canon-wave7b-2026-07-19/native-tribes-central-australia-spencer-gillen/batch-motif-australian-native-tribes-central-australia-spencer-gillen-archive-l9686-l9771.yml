canonical_text:
  quote: ''
  summary: The passage recounts episodes involving Ungutnika, a young kangaroo figure
    repeatedly chased, eaten, and bodily reconstituted after attacks by wild dogs,
    with body parts and events marked by stones, hills, a water-hole, and a Churinga.
    It then recounts pursuit episodes involving Ulpunta, a large kangaroo carrying
    a Nurtunja, and a Bukhara man who changes into a kangaroo man, with camps and
    ritual objects becoming stones, trees, a sand-hill, and a water feature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ungutnika pulled out hard-lump boils called Tukira and placed them on the
    ground, where they became stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ungutnika is described as not fully grown and as an Okira kurka, or little
    kangaroo, before setting out toward Okirilpa.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A group of wild dogs lying near their large mother saw Ungutnika, chased him,
    caught him at Chulina, tore him open, ate his liver, removed his skin, and stripped
    meat from his bones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ungutnika was not completely destroyed; his skin and bones remained, the skin
    covered the bones, and he stood up and ran away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wild dogs caught Ungutnika again at Ulima and Pulpunja; at Pulpunja he
    jeered at them before being caught, cut open, and reconstituting himself again.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Near the Undiara water-hole the dogs caught and ate Ungutnika, cut off his
    tail, and buried it where it remains as a stone called the Kangaroo-tail Churinga,
    shown and rubbed at the Intichiuma ceremony.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Churinga carried by Ungutnika is said to have been associated with his
    spirit part, which later entered a woman and was born in human form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ulpunta, a Kumara man, pursued a large kangaroo carrying a small Nurtunja,
    failed to catch it near Chuntilla, turned back, and a stone arose to mark the
    spot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Bukhara man of the Arunga or euro totem saw the kangaroo, changed himself
    into an Okira or kangaroo man, and chased it in order to kill and eat it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The large kangaroo made, carried, planted, and finally erected a Nurtunja;
    in later places the Nurtunja or its camp marks are represented by trees, including
    Apera Nurtunja.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
