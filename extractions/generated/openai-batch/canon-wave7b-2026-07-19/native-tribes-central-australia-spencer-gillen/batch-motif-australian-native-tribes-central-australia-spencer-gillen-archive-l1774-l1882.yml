canonical_text:
  quote: ''
  summary: The passage describes portable implements, clothing, ornaments, and weapons
    in a Central Australian camp. It details women’s wooden troughs, digging sticks,
    honey-ant digging, children’s imitation of mothers, women’s neck and head ornaments,
    and men’s shields, spears, boomerangs, and spear-throwers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is described as regularly having a pitchi, a wooden trough of varying
    length, used to carry food and sometimes a small baby.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman’s other implement is described as a “yam stick,” more precisely a
    digging stick or pick, commonly a straight staff with one or both ends bluntly
    pointed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: When digging, a woman holds the pick near the lower end with one hand and
    scoops loosened earth with the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women dig hard sandy soil in search of honey ants, sometimes using a small
    pitchi as a scoop and digging to depths of about six feet or more.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Children accompany women and begin imitating their mothers’ digging actions
    as soon as they can toddle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A small child may work with a diminutive pick near the mother; the passage
    states that, for a girl, this is the first lesson in what will be a main life
    occupation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women commonly wear neck rings of fur string coated with grease and red ochre;
    similar rings may be worn on the head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Younger women may wear long strings of bright red bean-tree beads, bored with
    a fire stick and worn in coils or across the shoulders and under the arms.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: North of the Macdonnell Ranges, women wear small fur-string aprons and forehead
    ornaments made from porcupine-grass resin with kangaroo incisor teeth or bright
    red seeds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A note states that head rings called Okillanina are usually made and presented
    to a woman by a son-in-law, to whom the woman gives her own hair.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men’s weapons consist of shield, spears, boomerang, and spear-thrower, all
    carried when on the march.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shields are described as similar in design over practically the whole Central
    area, made of light bean-tree wood, and especially associated with Warramunga
    production and trade.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The ordinary spear in the Ilpirra, Arunta, and Luritcha tribes is about ten
    feet or less, with a Tecoma wood body, mulga tip, tendon binding, and sometimes
    a curved barb.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The spear-thrower is described as a hollowed piece of mulga with a hard-wood
    fitting for the spear and a handle-end resin lump often holding a flint or quartzite
    cutting edge.
  category: object
  evidence_refs:
  - ev:10
