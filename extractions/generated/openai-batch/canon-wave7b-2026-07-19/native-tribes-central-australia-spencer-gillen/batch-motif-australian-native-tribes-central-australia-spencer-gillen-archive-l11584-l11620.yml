canonical_text:
  quote: ''
  summary: 'A night-time initiation-ceremony sequence is described: men with AracJiitta
    poles attached to their ankles dance and sing on the Apulia while women follow
    and strip leaves from the poles; two used bough-brakes are burned; an old Mura
    man roars, the dancing stops, women withdraw to camp amid menacing shouts and
    bull-roarers; Wurtja is laid on his back and covered with AracJiitta poles while
    Oknia and Okilia men sing. The song is glossed with terms for darkness, twilight,
    clear light, trees close together, sky-like appearance, and red sunrise.'
  language: English
  quote_policy: summarized
