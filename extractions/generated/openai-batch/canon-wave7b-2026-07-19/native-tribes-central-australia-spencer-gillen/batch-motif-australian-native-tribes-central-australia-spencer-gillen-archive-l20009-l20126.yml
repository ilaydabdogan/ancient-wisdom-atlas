canonical_text:
  quote: ''
  summary: The passage describes food restrictions connected with kobong or totemic
    animals and plants, including sparing or avoiding them, sacred exceptions for
    eating a totem, a special general restriction concerning the Achilpa wild cat,
    and rules governing food killed, handled, or seen by affinal and related persons.
    It also describes obligatory food sharing with fathers-in-law and other relatives,
    the belief that projected smell can spoil food and cause sickness, and further
    food restrictions by age, sex, and life stage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A family member connected with a kobong avoids killing an animal of the associated
    species; if the animal is asleep, he kills it only reluctantly and after giving
    it a chance to escape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for avoiding the animal is a belief that one individual
    of the species is the family's nearest friend, and killing that individual would
    be a great crime.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person whose kobong is vegetable may be prohibited from gathering it under
    certain circumstances and at particular times of year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Arunta and other Central Australian tribes, a man eats only sparingly
    of his totem, but on certain sacred ceremonial occasions partakes of his totemic
    animal or plant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Central Australian tribes generally share the restriction
    that the totem is tabooed, while also noting traditions in which totem members
    are represented as eating the totem and having a prior claim to it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Achilpa or wild cat is subject to a special restriction extending to every
    member of the tribe except the oldest men and women, not only to members of the
    Achilpa totem.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man may not eat an animal caught, killed, handled, or even seen by specified
    persons including his father-in-law, his sisters' children, female Mura and Ipmwina,
    and the father of his mother-in-law.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:8
  text: A man must share food with his father-in-law and other prescribed relatives,
    and the passage gives an ordered distribution sequence beginning with the Ikiuntera.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man avoids hunting with Ikiuntera or Umba men because they will appropriate
    whatever he kills while he is with them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When eating, a man must ensure that the named restricted persons are not close
    enough to identify his food, because they may spoil it by Equilla timma, described
    as projecting their smell into it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a man eats meat killed or seen by the restricted persons, the food is believed
    to disagree with him and cause severe sickness.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage interprets the affinal food rules as an association between a
    man and his wife's side of the tribe, described as a kind of lifetime tribute
    to his wife's group.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Another class of food restriction reserves the best things for older people,
    certain things for men rather than women, and certain foods for or from individuals
    at particular times of life.
  category: attribute
  evidence_refs:
  - ev:9
