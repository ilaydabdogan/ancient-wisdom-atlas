literal_observations:
- id: obs:1
  text: The Arunta are described as distributed into many small local groups, each
    occupying and being supposed to possess a known area of country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Local groups may be referred to by the name of the locality or camp they inhabit,
    with examples including Iturkawura and Waingakama camps.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several groups occupying a larger district may be named collectively, such
    as Finke River groups being called Larapinta men, and tribal divisions may also
    be described by direction of country.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each local group is said to be composed largely, but not entirely, of individuals
    who describe themselves by the name of an animal or plant.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage gives examples of animal and plant designations, including kangaroo
    men, emu men, Hakea flower men, witchetty grub people, and plum-tree people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The area occupied by a local Totemic group varies; the witchetty grub people
    of the Alice Springs district are described as forty individuals with about 100
    square miles, while one plum-tree group is represented by one individual with
    only a few square miles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Groups of the same totemic designation are found in many parts of the tribal
    district; each local group has a head man called Alatunja in one regional terminology.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Alatunja takes the lead within his own group, but no head man necessarily
    has special power outside his group, and the passage states that there is no chief
    of the tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: An Alatunja's wider authority is said to depend on factors such as size of
    group, personal skill in hunting or fighting, or knowledge of ancient traditions
    and customs; old age alone does not confer distinction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Alatunja calls together elder men, who consult about important matters
    including sacred ceremonies and punishment for breaches of tribal custom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Alatunja office is described as hereditary within limits, passing from
    father to son if the holder is of the proper designation, old enough for ceremonial
    leadership, and fully initiated.
  category: sequence
  evidence_refs:
  - ev:6
