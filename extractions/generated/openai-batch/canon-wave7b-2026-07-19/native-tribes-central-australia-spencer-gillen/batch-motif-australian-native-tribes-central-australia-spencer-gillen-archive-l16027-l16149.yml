canonical_text:
  quote: ''
  summary: The passage describes blood being obtained and smeared onto a long ritual
    pole, which is decorated with feathers, head-bands, tail tips, a nose bone, and
    Churinga, then implanted near the Parra. It then describes Illpongivurra young
    men undergoing a repeated fire ordeal under the Urliara, a frog-totem Quabara
    performed by two decorated men before the Kauaua, and an all-night scene in which
    fires burn around the pole while old men and women call to one another across
    the river about making a fire to burn the men.
  language: English
  quote_policy: summarized
