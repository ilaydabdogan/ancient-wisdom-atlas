canonical_text:
  quote: ''
  summary: The passage describes an initiation-related ceremony in which decorated
    performers enact Kukaitcha and Ulpmerka figures of the plum tree totem, using
    Nurtunja head-dresses, Churinga, song, dance, and staged actions involving boys
    and plum-gathering. It then recounts a tradition about plum tree Ulpmerka men,
    two bandicoot totem women, operations performed beside an upright Nurtunja with
    a stone knife, a headman named Kukaitcha, and a northern messenger named Kukaitcha
    who leads the group away toward northern places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Performers were decorated with ochre, charcoal or wad, and down, and the preparation
    was supervised by the Alatunja of Alice Springs, who had charge of the Churinga
    for this plum tree totem group.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During preparation, men sang about twigs on Kukaitcha's head, boys' top-knots,
    and Ulpmerka walking in the Alcheringa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man with the special head-dress was said to represent a great Alcheringa
    Kukaitcha; the head-dress was a Nurtunja representing a plum tree, with a stick
    representing branches.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Performers were arranged in several positions; three men represented boys,
    one Kukaitcha beat two Churinga as if teaching the boys to sing, and one Ulpmerka
    man pretended to knock plums from a tree for a boy to pick up and eat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other men emerged from the creek-bed as a mob of Ulpmerka men, danced and
    shouted around the Kukaitcha figures, laid hands on performers, and joined a dance
    around the great Kukaitcha before the ceremony ended with embracing old men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tradition locates a plum tree totem place about fifteen miles south-south-east
    of Alice Springs and says its Alcheringa group included uncircumcised Ulpmerka
    men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The plum tree Ulpmerka men had two women of the bandicoot totem who had joined
    them after wandering alone; the women were afraid until the men made and showed
    them a large Nurtunja.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The younger woman was decorated with down, given a small conical Nurtunja
    on her head, danced around by men shouting, laid beside a large upright Nurtunja,
    and subjected to an operation with a large stone knife that the passage calls
    equivalent to a male ceremony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the younger woman's operation, the passage says all the men had access
    to her.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The two women were taken to the camp of the local Kukaitcha, who was headman
    of the local Ulpmerka men and claimed the women as his own while allowing occasional
    access to the operated woman.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A special messenger, or Inunirra, also named Kukaitcha, came from the north,
    called the men to leave their country and follow him, took the two women from
    the local Kukaitcha, and began a journey north.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: At Wigley Springs the carried Nurtunja was erected and the elder woman was
    operated upon; the group later went toward Bond Springs, where a Kumara man named
    Kukaitcha was left behind and is said to have a present-day reincarnation at Alice
    Springs.
  category: sequence
  evidence_refs:
  - ev:11
