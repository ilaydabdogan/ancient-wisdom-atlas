canonical_text:
  quote: ''
  summary: 'The passage describes preparations during an Engwura ceremony: women remain
    in a separate camp and make fires in shallow pits, while the Engwura leader and
    older men decide which totemic brands will be painted on young men. The brands
    are applied by ab-moara men, usually on the back, using pigments and other materials;
    the decorated men observe a silence rule and may not know their own designs. At
    dawn, after the painting is complete, the leader signals the women, breaks through
    the Parra and bough line, and the ab-moara men lead their proteges in a final
    movement around the Parra before the men pass through the break in silence. A
    note links the Parra’s orientation with Alcheringa Achilpa north-south travel,
    while denying a solar explanation for the eastward facing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men in the camp kept up derisive speech toward the women about whether they
    would send the Kurdaitcha after them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the women's camp, Panunga and Ikilthara women on one side and Purula and
    Kuinara women on the other dug shallow pits and made fires in them toward daybreak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Engwura camp, the leader consulted older men and decided what brands
    would be painted on the young men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each painted brand was said to be distinctive of a special totem, but the
    passage states that it had no necessary relationship to the totem of the decorated
    man or of the painter.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:5
  text: The passage gives several examples of men of one totem painting men of another
