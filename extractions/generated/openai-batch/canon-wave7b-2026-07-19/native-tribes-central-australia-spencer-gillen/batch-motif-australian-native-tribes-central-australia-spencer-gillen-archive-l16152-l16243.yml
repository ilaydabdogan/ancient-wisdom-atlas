    man painted with the brand of his own totem.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The materials used for painting included charcoal, red and yellow ochre, white
    pipeclay, and wad; some cases also used bands of wad edged with white down.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The totemic brand was almost always confined to the back, and the young men
    were not to speak to or in the presence of the ab-moara men during the decorating.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Because of the placement of the brand and the speech rule, a decorated man
    generally did not know his own design unless he could detect it by touch, though
    he could see other men's brands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The decorated men wore arm bands of kulchia, waist-girdles, painted forehead
    bands, wupira necklets, and kangaroo-rat tail-tip tufts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: At about five o'clock in the morning, after the painting was complete, the
    leader shouted to the women that everything was ready, broke through the Parra
    and the line of boughs, and the ab-moara men led their proteges around the Parra.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the final circuit, the men grouped at the base of the Kanaua and walked
    in single file through the break in silence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A note states that the Parra lay between the men and women, that the men faced
