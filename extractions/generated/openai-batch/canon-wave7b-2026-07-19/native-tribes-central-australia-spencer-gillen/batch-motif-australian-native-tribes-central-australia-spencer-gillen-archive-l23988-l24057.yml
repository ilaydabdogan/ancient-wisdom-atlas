canonical_text:
  quote: ''
  summary: The passage describes limited clothing and personal ornaments in Central
    Australian groups, especially the Chilara forehead-band, its materials and geometric
    decorations, its visual resemblance but stated non-relationship to the sacred
    Churinga, and the use of pubic tassels and small aprons in some groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that clothing and personal ornaments allow little scope
    for artistic display, and that people are generally naked except for specified
    bands, necklets, armlets, a pubic tassel or shell, and, for some women, a small
    apron.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure caption lists personal ornaments including a Wupira neck ornament,
    a women's seed necklace, owl-feather and emu-feather tufts, flaked sticks worn
    on the head, Peragale tail-tip tufts, a Warramunga women's head ornament made
    with resin and kangaroo teeth, and an apron with a waist-string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The main decorative work described is connected with the men's Chilara forehead-band,
    and the passage says that most decorating is done by men and little by women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Chilara is described as a flattened skein of opossum fur-string plastered
    with kaolin or gypsum to create a flat surface for red or yellow ochre designs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Chilara designs include concentric circles, curved lines, straight lines,
    and spots; four examples are said to have been used by people in the northern
    part of the Arunta tribe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the patterns do not appear to have definite meaning, but
    are suggested by designs on sacred objects; it also says the decorated Chilara
    resembles the Churinga when laid flat, while denying a real relationship between
    the two objects.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some Chilara have a coat of white bird's down instead of an ochre pattern,
    and women may wear ordinary fur-string head bands or a flat band similar in form
    to the Chilara.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The pubic tassel is described as a small fan-shaped structure of short fur-string
    strands attached to the pubic hairs, often covered with white kaolin or gypsum
    at corrobborees, and serving as decoration rather than covering.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that Arunta and Luritcha women normally wear nothing, while
    Kaitish and Warramunga women further north wear a small apron that sometimes reaches
    the Arunta.
  category: relationship
  evidence_refs:
  - ev:8
