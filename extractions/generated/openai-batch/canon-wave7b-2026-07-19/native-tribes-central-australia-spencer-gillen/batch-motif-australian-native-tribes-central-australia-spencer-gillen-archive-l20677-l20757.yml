canonical_text:
  quote: ''
  summary: The passage first describes a staged combat in which an old man with a
    club defeats successive Kurdaitcha attackers, said to represent a far-past incident
    involving a warrior and five Kurdaitchas. It then describes Illapurinja, explained
    as a changed or modified female Kurdaitcha figure associated with mourning, rare
    secret vengeance, sudden illness, medicine-man diagnosis, and secret preparation
    with body decoration, blood, weapons, and a wooden Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man armed only with a fighting club walks about as if looking for tracks
    while Kurdaitcha men lie still.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kurdaitcha men creep up behind the old man and are about to kill him with
    a boomerang or spear before he turns and sees them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In repeated mock fights, each Kurdaitcha attacker is worsted, falls down,
    and receives a final tap from the old man's club.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The performance ends after a combined attack fails; the old man stands brandishing
    his club over the heaped bodies of the defeated Kurdaitcha men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the staged incident refers to a far-past tradition in which
    a noted warrior slew five Kurdaitchas who followed him while he tracked animals
    for food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Illapurinja is glossed as meaning "the changed one" and is described as a
    modified female Kurdaitcha and, at the present day, an entirely mythical personage
    connected with mourning customs for dead relatives.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: On rare occasions, a woman may at her own request be sent out by her husband
    to avenge an injury or supposed injury to her kindred.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Illapurinja preparation is secret and is said to be known only to the
    woman and her husband, without consultation of the old men.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:9
  text: A medicine man may identify sudden and unaccountable illness in a patient
    as the result of an Illapurinja attack.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In an anecdote near Alice Springs, a hunter is said to have been attacked
    by an Illapurinja, found insensible, brought to camp dazed, and treated by a medicine
    man who extracted pieces of a wooden Churinga from his body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When prepared, the Illapurinja is rubbed with grease and red ochre, decorated
    with white down fixed by blood drawn from her husband, ornamented with head rings
    and tail-tip tufts, and given a fighting club and a large wooden Churinga.
  category: attribute
  evidence_refs:
  - ev:9
