canonical_text:
  quote: no longer remain an Ulpmerka, but must be made into a man — an Ertwa-kurka
  summary: 'The passage describes a Central Australian initiation sequence for Lartna
    or circumcision: preparatory food and dancing, night awakening of the boy, preparation
    of the Apulia ground and path, women’s dances and stripping of poles, the boy’s
    movement down the path, the sound of a bull-roarer, the operation, and the boy’s
    subsequent seclusion with Churinga until recovery.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Early on the day the Lartna or circumcision ceremony is to begin, the Ulpmerka
    is taken away from camp on a pretext while men and women prepare collected food
    supplies, including acacia seeds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the day the camp periodically chants; women dance to the chant, but
    men do not.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At sundown the boy is brought back to camp and spends the evening at the men’s
    camp unaware of what is planned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Near midnight an elder brother checks that the boy is asleep, wakes the camp,
    and the men and women go to a previously selected nearby place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women stand on one side while men quietly clear grass and rubbish to prepare
    the Apulia ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Three brothers of the boy and two young women are selected to go to camp,
    awaken the boy, and bring him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The two young women carry Alparras, creep up to the Ulpmerka, strike him sharply
    with them, and cry out “Utchai! Utchai!”
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the boy rises startled, three men take hold of him and tell him the time
    has come for him no longer to remain an Ulpmerka but to be made into an Ertwa-kurka.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the cry of “Utchai” is heard, men begin singing and women begin dancing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The subsequent proceedings include painting by Uluilia men and the handing
    of a fire-stick by an Utichalkulkna woman or women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the day of the operation the boy is ornamented with Eucalyptus twigs, and
    two rows of spears are fixed upright on either side of the Apulia path, forming
    a grove-like passage.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: Women go between the spear lines, perform the Unthippa dance while older men
    sing, and then strip leaves from the poles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: As men approach with the boy, they throw pieces of bark at the women as a
    signal for the women to disperse to their camp and leave the Apulia out of sight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The boy is placed at one end of the path behind a single brake of boughs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: At night the women are brought back and sit on either side of the path at
    the base of the stripped spears.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: Two Okilia remove the boughs, accompany the Ulpmerka by hopping down the path,
    and then diverge halfway along the path.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The boy continues down the path until he collides with a man called Tapunga,
    who rolls onto his back so that the boy lies on top of him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Silence is maintained while the painting is rubbed off the Ulpmerka’s back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: Arachitta poles are brought in; men dance while women strip the poles, which
    are tied onto the legs as previously described.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: The women grow increasingly wild while singing a song transcribed in the passage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:21
  text: When a bull-roarer is heard, the dance suddenly stops and the women run away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: Shortly after the bull-roarer sound and women’s departure, the operation is
    performed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:23
  text: The shield holder is called the Urinthantima and must belong to the moiety
    opposite the boy’s moiety.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:24
  text: The operation is usually performed by a man who is Ikuntera to the boy, assisted
    by one or two Killarina, who also must belong to the other moiety.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:25
  text: After the operation the boy is given a bundle of Churinga and sent out in
    charge of a man until he has recovered and is ready for a further operation.
  category: sequence
  evidence_refs:
  - ev:8
