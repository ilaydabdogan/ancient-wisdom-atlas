canonical_text:
  quote: ''
  summary: The passage introduces the chapter on totems. It states that every individual
    belongs by birth to a totemic group named after and specially associated with
    a natural object. Totem names include animals, plants, and phenomena or objects
    such as wind, sun, water, and cloud. The chapter synopsis describes Alcheringa
    ancestral groups wandering with sacred Churinga linked to spirit parts; places
    where Churinga are deposited become local totem centres associated with one totem.
    It further says that at birth a spirit individual resident at a particular spot
    enters a woman, so the child’s totem is that of the spirits associated with that
    spot. The synopsis also notes variation among Australian tribes and an asserted
    fundamental unity of customs.
  language: English
  quote_policy: summarized
