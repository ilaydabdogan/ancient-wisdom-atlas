canonical_text:
  quote: ''
  summary: The passage describes an Intichiuma ceremony of the Erlia or emu totem
    at Strangway Range. After a borrowed emu Churinga is returned, the Alatunja decides
    to hold the ceremony. He, his sons, and other men clear a plot of ground, bleed
    from their arms to make a blood-hardened painting surface, and draw a sacred emu
    totem design with pigments. The design represents emu fat, eggs at different stages,
    intestines, excrement, feathers, and down. The Alatunja is treated with special
    deference and regulates the proceedings. The completed Churinga ilpintira is concealed
    with branches before the messengers arrive.
  language: English
  quote_policy: summarized
literal_observations:
