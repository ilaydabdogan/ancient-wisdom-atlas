  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony occurs on the occasion of the return of emu Churinga to Strangway
    Range men by members of another group to whom they had been lent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The decision to hold the Intichiuma is made by the Alatunja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
