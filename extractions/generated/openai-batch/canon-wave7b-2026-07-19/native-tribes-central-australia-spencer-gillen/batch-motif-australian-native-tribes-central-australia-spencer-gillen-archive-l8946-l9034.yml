  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ground design is called an Ilpintira in this context and is described
    as one of the Ilkinia or totemic designs drawn under these conditions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The drawing is made by the Alatunja, his blood brothers, and his two sons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The design is said to represent parts of the emu, including yellow fat and
    eggs in different stages before and after laying.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Small yellow circles indicate eggs in the ovary; black and concentric circles
    indicate eggs ready to be laid or already laid and incubated.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sinuous colored lines indicate intestines, black dots indicate excrement,
