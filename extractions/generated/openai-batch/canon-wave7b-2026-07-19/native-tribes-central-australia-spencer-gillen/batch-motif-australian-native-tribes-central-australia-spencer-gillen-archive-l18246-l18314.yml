canonical_text:
  quote: ''
  summary: The passage describes Emily Gap as a place marked by rocks, depressions,
    trees, boulders, and scrub associated with Alcheringa Udnirringita or Witchetty
    grub ancestors. Intwailiuka is linked with a rock, a pitchi used for pulverized
    grubs, and stored Churinga used for Intichiuma. The Churinga are said to represent
    eggs carried in ancestral bodies and to be buried with men of the totem. The central
    Udnirringita are said not to have wandered and to have transformed directly from
    grubs into human beings, while other groups immigrated to the site. One Urliipma
    group, led by the wise old Bulthara man Irpapirkirpirirrawilika, travels underground
    and then above ground, performing totemic acts and leaving stones.
  language: English
  quote_policy: summarized
