canonical_text:
  quote: ''
  summary: 'The passage describes several forms of magic: love-charms made by women
    with sung fur-string necklets or charmed food; a punitive Arungquiltha implement
    sent against a man who has stolen a wife; and another Arungquiltha procedure using
    a ground drawing, bark spirit-token, and miniature spears to punish a runaway
    woman, whose spirit is said to appear as a shooting-star.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that disease is treated as due to evil magic, with a suitable
    form of magic provided to account for each disease.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women may make and sing special fur-string necklets as love-charms and place
    them around a man's neck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women may charm food, such as a witchetty grub or lizard, and give it to a
    man to eat as a love-charm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A special form of magic is described for punishing a man who has stolen a
    wife, especially when the man belongs to a distant or powerful group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two men prepare a miniature implement made from a thin flake of flint or quartzite,
    resin, a miniature spear, and a small spear-thrower.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The punitive implement is painted with red ochre and then marked with white,
    yellow, and black cross-bars.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Arungquiltha is described as a term associated with supernatural evil power
    and may refer either to an evil influence or to an object in which that influence
    resides.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prepared implement is sung over, left in the sun for several days in a
    secluded place, and addressed with the request to go and kill the man who stole
    the woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the throwing ritual, one man kneels with his forehead to the ground
    while another throws the implement toward the enemy's home direction; both then
    remain silent until they hear the Arungquiltha speak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the Arungquiltha is successful, the men hear a thunder-like crash and understand
    that it has gone as a great spear to mutilate and kill the target.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: This form of Arungquiltha is said to be seen streaking across the sky like
    a ball of fire.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another form of Arungquiltha is said to produce comets and is used only for
    punishing women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: For a woman who runs away from her husband, men assemble at a secluded spot
    while a skilled man draws on smoothed ground a diagram representing the woman
    lying on her back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The ground drawing is called Aura and is described as an emblem.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Low chants exhort the Arungquiltha to enter the woman's body and dry up all
    her fat.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: A piece of green bark is placed on the drawing and is said to represent the
    spirit part of the woman.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: The men present stick sung miniature spears into the bark and throw the bark
    and spears in the direction where the woman is thought to be.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: After some time, the woman is said to dry up, die, and have her spirit appear
    in the sky as a shooting-star.
  category: sequence
  evidence_refs:
  - ev:9
