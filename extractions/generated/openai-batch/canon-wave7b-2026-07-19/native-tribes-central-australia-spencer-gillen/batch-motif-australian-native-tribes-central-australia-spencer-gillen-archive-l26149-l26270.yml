canonical_text:
  quote: ''
  summary: The passage describes sacred rock drawings called Churinga Ilkinia near
    sacred storehouses and at specific rock/cave sites. It notes restrictions on viewing
    them, records their physical setting and pigments, identifies associations with
    honey-ant, witchetty grub, and plum tree totems, and summarizes Indigenous explanations
    linking some designs to Alcheringa ancestors, ceremonies, initiation body painting,
    and inherited but unexplained meanings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Churinga Ilkinia are described as sacred rock drawings found near the Ertnatnhaiga,
    or sacred storehouse, of local groups.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women and children are not allowed to see the sacred drawings; they know the
    locality and avoid it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One described site is a small cave in a sandstone bank at the end of the Crawford
    Range, in country occupied by the Warramunga tribe.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cave floor is described as containing sand and charcoal, and the ceiling
    as blackened with smoke.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spring-fed rock hole opposite the cave reportedly never becomes dry, and
    additional rock holes are nearby.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Most drawings at the cave site are outside the cave on smooth sandstone near
    the inlet; only small circles are inside.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The drawings are painted on an artificial red ground with white or black pigment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The authors state that the meaning of the cave-site drawings was not ascertained
    beyond their sacred status and association with the honey-ant totem.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two important designs include a broad white band intersecting a series of
    circles, a feature the authors say they had not met with among Arunta examples.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Other designs are attributed to the Udnirringita, or witchetty grub, and to
    the Ulpmerka of the plum tree totem at Quiurnpa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Udnirringita designs are located on the rocky sides of Emily Gorge, while
    the Ulpmerka designs are on the Pirkintilia rock at Quiurnpa.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some designs are described by the authors as clearly zoomorphic or phytomorphic
    in origin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: One Udnirringita design’s curved band of bars is said to represent the shoulders
    of Alcheringa ancestors.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Another Udnirringita design is said to represent an Alcheringa woman with
    her hand to her head, looking upward while watching Intwailiuka perform the Intichiuma
    ceremony.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Several Ulpmerka designs are said to be painted on boys during the ceremony
    of throwing them up, described as the first initiation ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Some Ulpmerka designs represent the Nurtunja carried on the head by Kukaitcha,
    leader of the Ulpmerka; others represent a plum tree and an unripe plum.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage states that the explanations of the figures are those given by
    Indigenous informants at the time of writing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: The origins of the sacred totemic drawings are said to be unknown; they are
    supposed to have been handed down from Alcheringa ancestors, with knowledge of
    their meanings transmitted from generation to generation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The authors note that similar spiral or concentric-circle designs on different
    Churinga can have different meanings.
  category: other
  evidence_refs:
  - ev:8
