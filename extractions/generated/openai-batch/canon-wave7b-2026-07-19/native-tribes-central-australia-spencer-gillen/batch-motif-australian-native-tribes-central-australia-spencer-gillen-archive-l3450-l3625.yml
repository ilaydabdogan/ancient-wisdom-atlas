canonical_text:
  quote: ''
  summary: 'The passage describes Arunta social organization: male-line descent, four
    southern sub-classes and eight northern divisions, moiety pairing, camp separation,
    reciprocal terminology, marriage rules, child-class succession, finer distinctions
    between permitted and forbidden spouses, and recent adoption of eight-division
    names from the Ilpirra tribe.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Arunta are described as counting descent in the male line and as typical
    of a large central Australian group of tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists Arunta, Ilpirra, Iliaura, Kaitish, Walpari, Warramunga,
    Waagai, and Bingongina as tribes with known classificatory systems in a north-south
    range of about seven hundred and seventy miles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The southern Arunta are said to have four named sub-classes, while the northern
    part has eight divisions; the four southern sub-classes are said to be divided
    into two each, though without distinct names.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Panunga and Bukhara are grouped as one moiety, while Purula and Kumara are
    grouped as another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In camp, Panunga and Bukhara are said to camp together, separated from Purula
    and Kumara by a natural feature such as a creek.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The two paired groups use reciprocal terms: Panunga and Bukhara call themselves
    Nakrakia and call Purula and Kumara Alulyannka, with the terms being reciprocal.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The broad marriage rules state that Bukhara men marry Kumara women and have
    Panunga children; Purula men marry Panunga women and have Kumara children; Panunga
    men marry Purula women and have Bukhara children; Kumara men marry Bukhara women
    and have Purula children.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The diagrams are explained as using double arrows for marriage connections
    and single arrows for the class-name of children.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: For a Panunga man, Purula women are divided into one group whom he may marry
    and another group whom he may not marry.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each of the four sub-classes is described as divided into two, with members
    standing in the relationship called Ipniunna to each other.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the northern part of the tribe, distinct names are used for the two groups,
    and the passage gives Uknaria as the designation for a Panunga man's Ipniunna
    men and women.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the names for the four new divisions were recently
    adopted by the Arunta from the Ilpirra tribe and that their use was spreading
    southwards.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the Engwura ceremony witnessed by the authors, Ilpirra men and many men
    from the southern Arunta, among whom the four new names were not yet in use, were
    present.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: A relationship table was used by the authors to arrange and indicate marriage
    relationships and divisions.
  category: object
  evidence_refs:
  - ev:9
