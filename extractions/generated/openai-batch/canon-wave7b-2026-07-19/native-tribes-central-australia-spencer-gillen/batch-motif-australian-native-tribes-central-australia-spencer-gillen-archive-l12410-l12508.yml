canonical_text:
  quote: ''
  summary: 'The passage describes the first stages of a boy''s initiation: selected
    male relatives or guardians take charge of him, place a white stone under his
    arm, present him before assembled kin, supervise dancing, decorate and paint him,
    give him a new ritual status name, escort him to or from another camp, subject
    him to ritual handling by strangers, restrict women''s speech with him, and keep
    him apart while further dancing and temporary exchanges of women occur under class
    restrictions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy's Okilia arranges with two men who are Unibirna to carry out the first
    part of the proceedings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the two men takes hold of the boy while the other places a small white
    stone, called apcrta irrkurra, under the boy's armpit; the two then take him to
    the camp of his mother and father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the parents' camp, men sit in a roughly semi-circular group, with women
    related to the boy present.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy lies down before the group while women dance to the men's singing;
    afterward he sleeps under the watch of the two Umbirna, who are called Ukarkhija.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Early in the morning the two guardians tie up the boy's hair with whitened
    string, decorate it with eagle-hawk feathers, and after this the boy is called
    Auaritcha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women identified as the boy's Ungaraitcha and Itia bring him grass-seed food;
    he eats some and gives the remainder to the two Umbirna.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If present, the Mitra woman whose daughter has been allotted as the boy's
    wife paints him with red ochre; otherwise the Umbirna men do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the boy is taken to a different local group, he travels with the two Umbirna,
    wearing the hair-string and carrying the stone under his arm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When approaching the strange camp, the men cry out "Pan! Pan!" and swing back
    one of the boy's arms; the strangers recognize the event and come out while the
    women lie down in camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the strange camp, the boy's hair-string and stone are removed; strangers
    throw him into the air, catch him, and strike him as he falls; the stone is returned
    to him while the hair-string is kept by the strangers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the throwing ceremony, the boy must stay some distance away; women may
    not speak to him, but men may go near and speak freely.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the return route, the boy and the two Umbirna halt so his body can be painted
    with white pipeclay, his hair tied up, and a waist band put on him for the first
    time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the camp for the Lartna operation, the Auaritcha and the Umbirna take a
    position between the strangers and the resident group; the boy's Ungaraitcha give
    him food, after which he returns to the bush with his guardians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the evening and on the following evening, the same women dance; during
    the two days when the boy is out of camp, lending and interchange of women occur
    subject to the usual class restrictions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the described lending episode, two resident men give fire-sticks to their
    wives among the dancers as a signal, and then inform visiting men of the intended
    temporary lending.
  category: action
  evidence_refs:
  - ev:6
