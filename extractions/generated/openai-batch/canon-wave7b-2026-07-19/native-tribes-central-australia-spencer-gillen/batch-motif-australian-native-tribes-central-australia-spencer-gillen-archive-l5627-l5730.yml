canonical_text:
  quote: ''
  summary: The passage describes public ceremonial occasions in which women are sent
    to a corroboree ground, including an Arunta procedure involving a normally taboo
    son-in-law relation, ritual collection of down and twigs, sexual access under
    specified exclusions, and red ochre painting. It states that the practice is said
    to follow Alcheringa precedent and to ensure the performance goes properly. It
    also describes Urabunna messenger customs and peacemaking contexts where access
    to women functions as a sign of compliance or friendship, followed by an authorial
    distinction between private wife-lending, marriage-time relations, and wider public
    ceremonial relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two or three women are assigned each day to attend the corroboree ground;
    except for men related to them as actual father, brother, or son, they are available
    to the men present there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta example, a man instructs a man who is actually or tribally his
    son-in-law, a Ganimona, to take his Unawa into the bush and bring back down used
    for corroboree decoration.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman who accompanies the Ganimona is Mura to him, a relation in which
    he ordinarily may not speak to, approach, or have marital relations with her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the pair has been in the bush, the man returns carrying down, and the
    woman follows carrying green twigs to be worn by men around arms and ankles during
    the evening dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The women at the corroboree sit near the men and watch the preparation of
    decorations, but do not take part in preparing them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that the natives say the women’s presence and the sexual
    indulgence, identified as an Alcheringa practice, prevent anything from going
    wrong with the performance, such as head decorations becoming loose or disordered.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the evening, the men paint the women with red ochre, after which the women
    return to the main camp to summon women and children to the corroboree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Urabunna, messengers sent to distant groups may be a man and woman
    or two pairs who are Pirauugaru to each other; the men carry bunches of cockatoo
    feathers and nose bones as evidence of their mission.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After delivering their message, the male messengers leave the women a short
    distance from the visited camp; if the visited group agrees to the request, all
    men irrespective of class have access to the women, while refusal means the women
    are not visited.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a vengeance party approaches a camp, access to women may be offered;
    if accepted, the quarrel ends, and the acceptance is treated as a sign of friendship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The passage distinguishes three kinds of marital relation: individual marriage,
    wider relations with particular men at marriage, and still wider relations on
    occasions such as important corroborees.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author states that, for corroboree attendance, every man is supposed at
    different times to send his wife, and that the first man with access to her is
    the normally taboo Mura.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage characterizes the corroboree practice as public, ancient, sanctioned
    by public opinion, and not opposed by the men or women concerned.
  category: attribute
  evidence_refs:
  - ev:7
