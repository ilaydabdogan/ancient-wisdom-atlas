canonical_text:
  quote: ''
  summary: In an Intichiuma ceremony, the Alatunja is decorated while leading singing.
    The song refers to men on banks who are thought to watch in spirit form from their
    Nanja trees. The body decorations represent ant-nest chambers and passages leading
    to honey-ants. The performer squats while other men run around him; he brushes
    the ground between his legs with twigs and periodically quivers. The decorations
    are then removed, and the party returns to the men's camp, passing the women's
    camp.
  language: English
  quote_policy: summarized
