canonical_text:
  quote: ''
  summary: The passage recounts a fragment of a moon-theft story; lists names for
    moon phases; describes the evening star Ungamilia as an Alcheringa Kumara woman
    associated with a white stone, Churinga, spirit part, totemic conception, and
    a ceremonial performance; explains solar eclipses as caused by a malignant influence
    or spirit removed by medicine men using stones and chants; identifies Magellanic
    clouds and mushrooms or toadstools with malignant influence; and states that the
    Pleiades are women who ascended into the sky in the Alcheringa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A thief is said not to keep the moon; the moon goes up out of a shield into
    the sky and remains there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives names for new moon, half moon, three-quarter moon, and full
    moon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The evening star is named Ungamilia and is supposed to have been a Kumara
    woman in the Alcheringa who had a Xnrtunja and lived alone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ungamilia is associated with a large white stone near Temple Bar, marking
    where she went into the earth and left her Churinga and spirit part.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Every night the evening star is supposed to go down into the white stone west
    of Alice Springs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Conception at the white stone assigns a child to the Ungamilia or evening
    star totem, while conception in adjoining country assigns the child to the Echunpa
    or big lizard totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ungamilia is said to have fed in the Alcheringa on Oivadoiva grass seed, as
    did the lizard people among whom she lived.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A special performance connected with Ungamilia is held by an Uknaria man of
    the lizard totem, and her Churinga is kept in a storehouse at Simpson's Gap belonging
    to the lizard totem.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the Engwura, the ceremony for Ungamilia was performed by the man who
    possesses it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A solar eclipse is called Ilpuma and is attributed to Arnngquiltha, described
    as an evil or malignant influence.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: This form of Arnngquiltha is described as a spirit individual living to the
    west with the power to assume the form of any animal.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The eclipse is said to be caused by periodic visits of Arnngquiltha, who would
    like to live in the sun and permanently obliterate its light.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Medicine men remove the eclipse-causing spirit by withdrawing atnongara stones
    from their bodies, throwing them at the sun, and singing magic chants.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Magellanic clouds are regarded as endowed with Arnngquiltha and are believed
    sometimes to come down to earth and choke sleepers.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Mushrooms and toadstools are not eaten because they are believed to be fallen
    stars endowed with Arnngquiltha.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Pleiades are supposed to be women who lived at Intitakula in the Alcheringa
    and then went up into the sky.
  category: sequence
  evidence_refs:
  - ev:16
