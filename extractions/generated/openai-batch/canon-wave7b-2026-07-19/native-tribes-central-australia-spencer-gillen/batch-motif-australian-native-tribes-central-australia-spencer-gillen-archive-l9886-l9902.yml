canonical_text:
  quote: ''
  summary: After painting is completed, selected young men from named groups sit on
    a ledge, open veins in their arms, and let blood run over a ceremonial stone while
    men below watch and sing chants for increasing kangaroo numbers. Afterward old
    men return to camp while young men hunt game and present it to them; sacred Ouabara
    are performed at night.
