canonical_text:
  quote: ''
  summary: The passage introduces the Urabunna Wilyaru ceremony, relates it to Dieri
    Wilfyaroo and, in its fire ordeal, to Arunta Engwura. It describes a man being
    seized, bound, and taken into the bush away from women and the uninitiated. Women
    build and maintain a fire on an earth mound, respond to distant male singing by
    circling the fire and repeating the refrain, and continue this intermittently
    through nights for a week or more. The candidate is painted by old Wilyaru men
    with fat and charcoal, and other male participants are also decorated.
  language: English
