canonical_text:
  quote: ''
  summary: The passage describes a short initiation-related sacred ceremony involving
    preparation of the Nurtunja, body decoration, a formal gait, summoning and circling
    by other men, bending the Nurtunja over participants, stopping the performers
    by touch, applying sacred down to older men's stomachs, dismantling the object,
    and an explanation that the ceremony refers to two Alcheringa Unjiamba/Hakea women
    connected in an uncertain way with Achilpa/wild cat men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The performers' bodies were decorated with designs made in ochre and bird's
    down before the ceremony began.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The Nurtunja was carried to the ceremonial ground by a Purula man and placed
    by the side of the Parra, where two men knelt and one held the Nurtunja upright
    behind his back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Painted performers adopted a formal high-knee walk, lifting the foot high
    and bending the body forward at each step.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Purula man summoned other men by shouting and moving his hand rapidly
    before his mouth, producing a vibratory effect on the voice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the summons, the men on the ground ran up shouting, danced before the two
    performers, and then circled around them while the Nurtunja was bent down over
    their heads.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The circling movement around the performers is named Walikutninia in the passage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two or three men laid their hands on the performers' shoulders, which the
    passage explains as stopping the performers' movements.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the Nurtunja was laid aside, the performers took small pieces of down
    from it and pressed them against the stomachs of older men present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explains that the older men's bowels, described as the seat of
    emotions, were thought to become tied up from agitation at witnessing the sacred
    ceremony and loosened by contact with part of the Nurtunja.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The performance lasted about five minutes, though preparation took more than
    three hours; afterward, down was removed and preserved, the Nurtunja was dismantled,
    and hair string was returned to its owners.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ceremony is said to refer to two Alcheringa women of the Unjiamba or Hakea
    totem who travelled near, but not on, the track of Achilpa or wild cat men moving
    in the opposite direction.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that the Achilpa and Unjiamba totems appear to be connected,
    but that the exact connection was not discovered; it also notes that five of six
    Churinga attached to the Nurtunja belonged to Unjiamba individuals.
  category: relationship
  evidence_refs:
  - ev:9
