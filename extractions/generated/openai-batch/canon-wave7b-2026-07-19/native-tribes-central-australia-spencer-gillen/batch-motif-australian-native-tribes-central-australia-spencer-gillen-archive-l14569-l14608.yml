  summary: The passage describes a gathered performance of ceremonies said to be handed
    down from the Alcheringa and governed by exact precedent. It comments that Engwura
    preserves customs and transmits tradition while possibly allowing limited change.
    A third phase begins with the examination of many Churinga brought from a witchetty
    grub storehouse in Heavitree Gap; the Alatunja oversees them, invites named associates,
    and the bundled Churinga are laid on shields in a creek bed while men sit around
    them.
