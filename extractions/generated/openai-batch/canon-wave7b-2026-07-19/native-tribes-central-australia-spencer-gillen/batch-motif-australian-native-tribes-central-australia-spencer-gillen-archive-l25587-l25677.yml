canonical_text:
  quote: ''
  summary: The passage describes ordinary rock drawings from Central Australia, especially
    at Ayers Rock and the George Gill Range. It catalogs animal, plant, human-head,
    hand-stencil, and conventionalized designs, noting materials, locations, and some
    wider Australian parallels for similar designs or techniques.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ordinary drawings include zoomorphic and phytomorphic designs representing
    outlines of animals and plants, sometimes too rudely executed to identify the
    specific animal or plant.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many of the drawings represented are located on the roof and walls of shallow
    caves around the base of Ayers Rock.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The materials used for the drawings include red ochre, yellow ochre, charcoal,
    and white material such as kaolin or calcined gypsum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Number 1 is described as most probably a dingo drawn in charcoal outline.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Number 2 is described as a conventionalized long-tailed bird outlined in red
    ochre, with the body and head filled in charcoal and red bands crossing the body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Numbers 3 and 4 are described as conventional drawings of lizards.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Number 5 represents a snake coming out of a hole in the rock, often using
    a natural hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Number 6 is described as probably zoomorphic in origin but too conventionalized
    to identify.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: Number 7 is described as a grouped series of human heads drawn in charcoal
    outline.
  category: object
  evidence_refs:
  - ev:2
- id: obs:10
  text: Number 8 is an exposed rock-surface drawing at the base of the George Gill
    Range, described by a native informant as an emu sitting on its eggs, as if seen
    from below.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: Number 9 represents the frond of a Cycad, and the authors state it is the
    only phytomorphic example they had seen.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Number 10 is made by placing a hand against the rock and blowing red ochre
    or charcoal dust over it, leaving a stencilled hand outline.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Number 11 is copied from a drawing at Ayers Rock and is interpreted as probably
    a modified animal body, embellished with alternate red and yellow ochre lines
    radiating from its surface.
  category: object
  evidence_refs:
  - ev:6
