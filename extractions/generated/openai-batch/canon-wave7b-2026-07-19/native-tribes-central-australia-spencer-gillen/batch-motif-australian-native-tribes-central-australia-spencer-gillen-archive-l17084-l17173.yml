canonical_text:
  quote: ''
  summary: The passage recounts Ullakupera ancestral travels, transformations of Inapertwa
    beings into humans, entry into the ground with Churinga and spirits remaining
    at a totemic local centre, and comments on the introduction of stone knives, class
    names, circumcision practice, and later Achilpa traditions concerning sub-incision
    and a sacred pole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nurtunja is said to be represented by a large gum tree, and a Panunga man
    was left behind at that spot before the party travelled to Urumbia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Urumbia the party changed its language to that of the Ilpirra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Urumbia the party met extraordinary-looking Inapertwa creatures of the
    honey-ant totem performing an Engwura ceremony and made them into men and women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After leaving a Panunga woman behind, the party flew west to Ungapirta and
    transformed Inapertwa of the Ullakupera totem into human beings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party then went into the ground, and the Churinga with their associated
    spirits remained there; the place is described as an important local centre of
    the Ullakupera totem.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the Ullakupera men introduced the use of a stone knife
    in place of the fire-stick at circumcision.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Echidna men had stone knives and that, in the southern
    part of the tribe, a woman of the frog totem was said to possess one.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A southern Arunta tradition says that an old woman interrupted men circumcising
    a boy with a fire-stick, told them this was killing the boys, showed them how
    to use a sharp stone, and the fire-stick was thereafter discarded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the class names were introduced, but says no marriage
    restrictions or reason for their introduction are mentioned in this account.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the account does not explain the origin of circumcision and
    represents circumcision as practised on men already provided with wives, while
    also noting its present-day importance before a youth may have a wife.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Achilpa, or wild cat men, are described as later than the Ullakupera men
    and as introducing Ariltha, or sub-incision.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The first Achilpa group started from Okira, carried a sacred pole called a
    Kauaua, and erected it at various stopping places; the object is said to be used
    exclusively in connection with the Engwura ceremony.
  category: sequence
  evidence_refs:
  - ev:8
