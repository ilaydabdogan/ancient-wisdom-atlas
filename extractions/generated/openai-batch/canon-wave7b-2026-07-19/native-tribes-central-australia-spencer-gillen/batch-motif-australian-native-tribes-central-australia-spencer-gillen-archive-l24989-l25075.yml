  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The opposite side of the described weapon is irregularly grooved and bears
    traces of red ochre, while the dark mulga or acacia wood remains visible.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that all forms of boomerangs show a marked difference between
