  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The largest measured specimen was 125 cm long, up to 8 cm wide in the middle,
    tapering near the ends, and 3 cm thick at its greatest thickness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One specimen has a central design of parallel curved lines shaped like a sideways
