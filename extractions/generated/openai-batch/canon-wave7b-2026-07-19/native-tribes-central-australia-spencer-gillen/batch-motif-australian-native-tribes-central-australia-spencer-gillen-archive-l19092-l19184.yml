  text: In the Alcheringa, men belonging to the Unchipera little bat and Erlkintera
    large white bat totems set out from Imanda and came to Etuta.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bat-totem men are identified as Orunchertwa, glossed in the passage as
