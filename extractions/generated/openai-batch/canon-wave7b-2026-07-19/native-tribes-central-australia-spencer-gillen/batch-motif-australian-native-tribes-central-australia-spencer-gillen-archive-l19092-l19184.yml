  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: From their position in the sky, the Orunchertwa killed men walking on the
    earth below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old Oknirabata lay down at Etuta while two boys played by aiming spears
    at trees.
  category: setting
