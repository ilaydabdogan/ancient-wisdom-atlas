canonical_text:
  quote: ''
  summary: The passage first preserves the end of a fire-making episode with a chant.
    It then narrates an Alcheringa tradition in which Orunchertwa, men of little bat
    and large white bat totems, go into the sky at Etuta and kill people below until
    an old Oknirabata uses a large stone Churinga from a sacred storehouse to bring
    them down and cut them up. The passage then lists bird and animal associations
    with several totems, including witchetty grub, kangaroo, euro, honey-ant, emu,
    and big lizard groups, explaining some associations through Alcheringa kinship,
    transformation, water-bringing, taboo, habitat, or animal markings.
  language: English
  quote_policy: summarized
