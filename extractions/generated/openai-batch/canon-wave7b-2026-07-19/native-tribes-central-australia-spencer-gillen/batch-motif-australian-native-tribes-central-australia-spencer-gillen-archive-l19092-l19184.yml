  - ev:4
- id: obs:6
  text: The two boys heard the Orunchertwa sing out and were killed by them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old Oknirabata became angry, went to his nearby sacred storehouse, and
    took out a large stone Churinga.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old Oknirabata held the Churinga in both hands, pointed it at the Orunchertwa,
    brought them down to earth, and cut them in pieces with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Stones standing around sacred holes of the witchetty grub totem represent
    special birds called Chantunga.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chantunga birds are described as the mates of the witchetty people because
    fully grown witchetty grubs changed into these birds in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Chantunga birds are said to appear when the grubs are plentiful, to sing joyously,
    and to watch the grubs laying eggs; witchetty men do not eat them and speak of
    them affectionately.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the kangaroo totem, grass parrots are mates and are identified as fathers’
    sisters of kangaroo men who brought water in the Alcheringa and are believed to
    bring water to kangaroos now.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kangaroo people are also associated with Kartwungawunga birds, said to descend
    from kangaroo men of the Alcheringa who killed and ate kangaroos and euro and
    changed into little birds.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Euro people have the rock pigeon as mate and water-furnishing fathers’ sisters,
    and also have the painted finch as a mate; the painted finch is said to have been
    a euro man and to be red-splashed because blood dripped from killed euros.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Honey-ant people have two bird mates, Alatipa and Alpirtaka, both said to
    have once been honey-ant people and to frequent mulga scrub country.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Emu people have the striated wren as mate, and big lizard people have a smaller
    lizard as mate.
  category: relationship
  evidence_refs:
  - ev:12
