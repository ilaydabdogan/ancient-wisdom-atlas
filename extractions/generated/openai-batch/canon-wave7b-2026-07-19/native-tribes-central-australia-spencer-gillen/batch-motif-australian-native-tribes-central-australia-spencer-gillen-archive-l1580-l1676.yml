canonical_text:
  quote: everything which is edible is used for food
  summary: 'The passage describes Central Australian food use and preparation: edible
    plants are eaten raw or roasted, Munyeru seeds are gathered and processed, and
    various animals are butchered, cooked in ashes or pits, and divided for consumption,
    with tendons also saved for practical uses.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that, subject to certain restrictions applying to groups
    or to individuals at particular life stages, edible things are used for food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some vegetables are eaten raw, while others are roasted in hot ashes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Acacia pods are gathered, laid on hot ashes, partly covered with ashes, and
    then shelled and eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Munyeru, identified as the seed of a species of Claytonia, is gathered by
    women, winnowed, ground on stones with water added, and eaten raw or baked in
    ashes.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Larger animals are generally cooked in shallow pits in the ground.
  category: setting
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:6
  text: Opossum, rock wallaby, and echidna are prepared by removing intestines and
    by plucking, singeing, scraping, moistening, or covering with ashes depending
    on the animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a euro or kangaroo is killed, its hind legs are dislocated, the abdomen
    is opened, the intestines are removed, and the opening is closed with a wooden
    skewer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tendons are extracted from the hind limbs of kangaroo or euro and stored under
    the waist girdle or in the hair for later use.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The extracted tendons are used for attaching barbed spear points, splicing
    spears, and mending spear-throwers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cooked kangaroo or euro may be laid on green boughs to keep it from touching
    the earth before it is cut up.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During carving, the carver may eat the heart and kidneys, and accumulated
    body juices are drunk.
  category: action
  evidence_refs:
  - ev:7
