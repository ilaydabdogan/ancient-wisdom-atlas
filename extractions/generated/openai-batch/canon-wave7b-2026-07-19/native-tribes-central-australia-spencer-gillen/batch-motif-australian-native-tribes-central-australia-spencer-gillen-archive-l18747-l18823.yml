canonical_text:
  quote: ''
  summary: 'The passage recounts a westward journey of honey-ant ancestors who erect
    Niirtunja, encounter local honey-ant groups, perform ceremonies, create or leave
    markers and totem centres, and are finally drowned by floods of blood drawn by
    local people. It then recounts lizard ancestors: an Illunja man travels underground
    from Simpson''s Gap to Ulira, interacts with Echunpa lizard people over food,
    leads them back carrying Churinga, participates in ceremonies, sees younger men
    punished with grey hair, and witnesses Thippa-thippa men transformed into birds
    that indicate where lizards are found.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A honey-ant party starts west under the guidance of two Oknirabata.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tanulpma a Niirtunja is erected, one leader remains with it, and a large
    gum tree arises to mark the spot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Umpira a honey-ant woman with a Nurtunja and qitabara tindattha dies; a
    large stone arises to mark the spot and is identified as the Nanja of her living
    descendant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Lukaria local honey-ant women become angry, warn the strangers not to advance,
    and refer to having many Churinga; the traveling party camps apart, erects a Niirtunja,
    and performs Ariltha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The honey-ant travelers move west, camp near Mount Heuglin and Dashwood Creek,
    form totem centres, and at Amulapirta perform Ariltha and have intercourse with
    a Panunga honey-ant woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: North of the Belt Range the honey-ant travelers erect their Niirtunja and
    are too tired to take it up again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Unapuna local honey-ants resent the travelers, draw floods of blood from
    their arms, and drown all the strangers; the strangers' Churinga remain and give
    rise to an important honey-ant totem centre.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Illunja man of the jew-lizard totem springs up at Simpson's Gap and journeys
    underground to Ulira, where Echunpa big-lizard people live.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Illunja man brings Owadowa grass seed, offers it to the Ulira lizard people,
    and places it on the ground after they decline it; a large stone marks the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Illunja man induces the Echunpa people to accompany him back toward Simpson's
    Gap; they carry Churinga but no Niirtunja and eat Echunpa on the way.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Younger men who are responsible for providing and cooking lizards bring only
    a little to the old men, who call them greedy and punish them by causing them
    to become grey-haired.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Irulchirtna the lizard party performs quabara undattha while carrying Churinga
    on their heads; Thippa-thippa men dance around them and are later changed into
    birds that hover over Echunpa lizards and show people where they can be found.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the Todd River in the Emily Plain the party performs Tapurta, a long series
    of lizard ceremonies; afterward the Illunja man divides the party, and a Purula
    man with a stumpy tail leaves but returns.
  category: sequence
  evidence_refs:
  - ev:8
