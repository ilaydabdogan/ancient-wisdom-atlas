candidate_motifs:
- id: motif:1
  label: Ancestral wandering establishes totemic geography
  taxonomy_refs: []
  basis: Both the honey-ant and lizard sections describe ancestral movement through
    named places, with camps, ceremonies, markers, and totem centres arising from
    those actions.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a passage-level pattern; no broader historical or cross-cultural
    claim is inferred.
- id: motif:2
  label: Material marker of ancestral event
  taxonomy_refs: []
  basis: A gum tree marks where a Niirtunja stood, stones mark a death and a seed-placement
    site, and Churinga left after drowning give rise to a totem centre.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives several different kinds of markers; their precise ritual
    status is not further interpreted here.
- id: motif:3
  label: Portable sacred object left behind or carried in ceremony
  taxonomy_refs: []
  basis: Niirtunja are erected and sometimes left behind; Churinga are possessed,
    left after the drowning, and carried on heads during lizard ceremony.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage names these objects but does not fully define their meanings.
- id: motif:4
  label: Hostile reception of strangers ending in overwhelming blood-flood
  taxonomy_refs: []
  basis: Local honey-ant groups warn or resent the traveling party; at Unapuna the
    locals draw floods of blood from their arms and drown all the strangers.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: Although the image involves a flood-like drowning, the passage does not
    describe renewal, so no flood-and-renewal taxonomy is assigned.
- id: motif:5
  label: Animal transformation into guiding birds
  taxonomy_refs:
  - shapeshifter
  basis: Thippa-thippa men are changed into birds that hover over Echunpa lizards
    and show people where the lizards are found.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes transformation
    into birds rather than repeated or voluntary shape-shifting.
- id: motif:6
  label: Punitive origin of grey hair
  taxonomy_refs: []
  basis: Older men punish younger men for greed by causing them to become anchinya,
    grey-haired.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly generalize this as the origin of all grey
    hair.
- id: motif:7
  label: Food distinction and refused offering among related totemic groups
  taxonomy_refs: []
  basis: The Simpson's Gap lizard people eat Owadowa seed, while the Ulira Echunpa
    people feed on lizards and decline the offered seed; the returning party later
    eats Echunpa.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The social or ritual significance of the food distinction is not explained
    beyond the passage.
- id: motif:8
  label: Ceremonial reenactment of ancestral actions
  taxonomy_refs: []
  basis: The passage states that an Engwura ceremony represents one of the ceremonies
    performed during the lizard march and also describes Tapurta as a long series
    of lizard ceremonies.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage uses ceremony names but does not define all procedural details.
