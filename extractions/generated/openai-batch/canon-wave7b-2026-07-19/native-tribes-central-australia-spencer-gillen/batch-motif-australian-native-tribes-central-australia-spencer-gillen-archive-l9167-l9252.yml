canonical_text:
  quote: ''
  summary: 'The passage describes parts of several Intichiuma ceremonies: blood is
    sprinkled over a stone in one ceremony; the stone and place are treated as restricted
    Churinga ground; the Ilpirla or manna totem ceremony uses a boulder, buried Churinga,
    rubbing stones, singing, dust, and mulga twigs to promote Ilpirla; and the Varumpa/Yarumpa
    honey-ant totem ceremony begins with decorated men moving in a silent, ordered
    procession toward the ceremonial ground.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old leader asks a young man to open a vein; the young man allows blood
    to sprinkle over a stone while other men sing until the stone is completely covered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the flowing blood is supposed to represent preparation of
    Abmoara, a drink made by steeping a flower in water; when the stone is covered
    with blood the ceremony is complete.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stone is regarded as a Churinga, and the spot is called ekiriuja, or forbidden
    to women, children, and uninitiated men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilpirla is described as a form of manna similar to sugar-manna of gum trees
    and peculiar to the mulga tree.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Ilpirla site there is a grey gneissic boulder marked with black and
    white seams, with stones on top representing masses of Ilpirla; the boulder is
    said to have the same significance and to have been deposited in the Alcheringa
    by a man of the Ilpirla totem.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the Ilpirla Intichiuma, a clear space is swept, and the Alatunja digs
    at the base of the boulder to reveal a Churinga buried there since the Alcheringa
    and representing a mass of Ilpirla.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Alatunja rubs the top of the boulder with the Churinga and then with smaller
    stones while the men seated around sing loudly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The song is explained as an invitation for dust produced by rubbing the stones
    to go out and produce plentiful Ilpirla on the mulga trees.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Alatunja sweeps away the dust with mulga twigs, old men repeat the same
    ceremony, and the Churinga is reburied at the base of the boulder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the honey-ant ceremony, men assemble early, decorate their foreheads, arms,
    and noses with Udnirriuga twigs, smear their bodies with dry red ochre, and march
    single file to a spot opposite the women's camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the spot, women and children stand silently while the Alatunja turns his
    back on the women, shades his eyes, and gazes toward the Intichiuma ground; the
    men kneel behind him in a straight line.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: After the Alatunja gives the signal, the men walk silently and with measured
    step in single file toward the ground, while the Alatunja in the rear checks that
    the line remains straight.
  category: sequence
  evidence_refs:
  - ev:9
