canonical_text:
  quote: ''
  summary: The passage discusses Alcheringa marital relations and totem restrictions,
    then narrates a middle Alcheringa tradition in which Ullakupera/little hawk ancestors
    possess Lalira stone knives for circumcision. Ulpmurintha travels from Atnaturka
    to Utiara, where other Ullakupera men have prepared a circumcision ground and
    are told to use Lalira rather than the customary fire-stick. The passage also
    mentions earlier transformation of small-rat totem creatures into Ulpmerka, living
    reincarnations of named ancestors, and a southern Arunta note attributing stone-knife
    introduction to an old frog-totem woman.
  language: English
  quote_policy: summarized
