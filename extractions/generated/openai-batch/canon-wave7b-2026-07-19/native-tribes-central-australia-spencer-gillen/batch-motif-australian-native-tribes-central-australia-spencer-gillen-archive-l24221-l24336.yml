canonical_text:
  quote: ''
  summary: Ethnographic description of several wooden spear forms and spear-throwers
    in central Australian tribes, including materials, dimensions, resin and tendon
    fastenings, barbs, red ochre treatment, fire-straightening of shafts, regional
    occurrence, and named spear-thrower types.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A described spear has a solid shaft part covered with red ochre while the
    reed is left uncoloured.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A northern wooden spear form has one or more wooden prongs replacing a stone
    head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the one-pronged variety, the prong is attached with resin and tightly wound
    string, then covered again with resin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prong has backward-pointing hook-like barbs cut in a row along one side;
    examples described have five to fourteen barbs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: A two-pronged variety has two prongs attached on opposite sides of the shaft,
    with the barbs on opposite sides.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A second wooden spear form is common among the Urabunna, Ilpirra, Luritcha,
    and Arunta tribes, with a light-wood shaft and often a separate terminal piece
    spliced on with resin and tendon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Tecoma shoot used for a shaft is straightened by heating in fire and pressing
    with the hands, then smoothed with a flint.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The blade of the common form is lanceolate, made from mulga, and spliced to
    the shaft with resin and tendon; one specimen has a recurved barb attached by
    tendon.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A third wooden spear form is like the second except that it has no barb, and
    the second and third forms are never red-ochred.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: A fourth spear form is a rarer single-piece dark hard wood spear, rubbed with
    red ochre, more often found in the south, and not thrown with a spear-thrower.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage names three spear-thrower types and describes the Wanmyia as a
    flattened wooden implement with a handle notch and a resin-attached point.
  category: object
  evidence_refs:
  - ev:5
