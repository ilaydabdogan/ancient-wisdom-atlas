canonical_text:
  quote: '"local relationship"'
  summary: The passage explains how changes to handed-down customs could possibly
    be introduced among the Arunta through respected older men and Alatunjas. Local
    groups meet for sacred ceremonies, a pre-eminent man may propose a change, nearby
    Alatunjas may adopt it locally, and a wider tribal meeting such as the Engwura
    may later discuss it.
