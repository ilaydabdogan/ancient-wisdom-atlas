canonical_text:
  quote: ''
  summary: The passage describes how Churinga are inherited independently of totem
    affiliation, how they are handled during ceremonial contexts, and how certain
    Churinga also include non-bull-roarer sacred objects. Examples include a buried
    stone representing a kangaroo tail from the Alcheringa, small witchetty-grub egg
    stones associated with spirit individuals and birth, and the use of these stones
    near death and burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a woman's Churinga passed to her son, paternal descent would place them
    in the possession of a man belonging to a moiety different from hers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Totem affiliation is not treated as determining the descent of Churinga, and
    a man may possess Churinga belonging to various totems.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Engwura, Churinga may be brought to the ceremonial ground, examined,
    and rubbed with red ochre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may inherit Churinga from his own father, from a deceased elder brother
    who leaves no son, and from the Churinga nanja of an elder sister; he also inherits
    certain sacred ceremonies connected with the Alcheringa individuals represented
    by the Churinga.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Objects called Churinga include forms other than bull-roarers; they are associated
    with individual men, women, plants, or animals of the Alcheringa and are described
    as taboo to women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Undiara a buried triangular stone slab represents part of the tail of a
    celebrated kangaroo killed in the Alcheringa, and it is to be seen only by initiated
    men during certain totemic ceremonies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the witchetty grub totem, small rounded stones called Churinga Irichima
    represent eggs with which the bodies of Alcheringa individuals were filled; many
    were deposited at ancestral camping places, especially the central camp in Emily
    Gorge.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The spirit individual carries Churinga Irichima and his usual Churinga, deposits
    them around the base of his Nanja tree, and they may be found after the birth
    of the child to which he gives rise.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Older witchetty men commonly carry some Churinga Irichima; when a man is dying,
    some are placed under his head and afterward buried with him.
  category: sequence
  evidence_refs:
  - ev:8
