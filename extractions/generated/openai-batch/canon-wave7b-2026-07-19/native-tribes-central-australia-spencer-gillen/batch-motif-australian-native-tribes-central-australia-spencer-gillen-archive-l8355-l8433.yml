canonical_text:
  quote: ''
  summary: The passage describes a formal reception for an Imvurra party returning
    borrowed sacred Churinga. Painted men gather around the Alatunja, sing, beat time
    on the ground, and await the deputation. The returning group arrives with weapons
    and shouted calls; its leader carries the Churinga and imitates the movement of
    an emu, the waiting group’s totem. The Churinga are placed on a shield, the two
    groups sit facing one another, and after a grave whispered exchange and chant
    the bundle is deposited on the Alatunja’s lap. He rubs it against his stomach
    and thighs and against those of older men, which the passage says is understood
    as untying their bowels.
  language: English
  quote_policy: summarized
