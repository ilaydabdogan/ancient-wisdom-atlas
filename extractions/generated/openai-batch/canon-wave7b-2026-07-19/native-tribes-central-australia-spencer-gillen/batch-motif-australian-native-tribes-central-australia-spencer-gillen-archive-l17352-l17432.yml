canonical_text:
  quote: ''
  summary: The excerpt traces an Achilpa ancestral party through named places. Along
    the route they lose a Churinga from which a man later springs, meet local women
    and men with or without Nurtunja and quabara undattha, give blood to exhausted
    elders at a water-pool whose color is thereafter red, perform named rites, paint
    ritual objects, leave some men behind, encounter local people said to have sprung
    up on the spot, erect a sacred pole leaning toward the intended direction of travel,
    and come upon diseased Achilpa men near hidden Unjiamba women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Achilpa party moves through a sequence of named places, including Achilpa-interninja,
    Okilla-la-tunga, Ulir-ulira, Ertua, Arapera, Ilchinga, Ungwurna-la-warika, Ilchi-lira,
    Ituka-intura, Arara, and places near Harry Creek.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
- id: obs:2
  text: A bundle-string breaks, a small Churinga is lost, and a Purula man named Ultanchika
    later springs from it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Okilla-la-tunga the Achilpa find a Purula woman of the Unjiamba totem who
    has a Nurtunja and quabara undattha; she shows them hers, they dance around her
    Nurtunja, and they show her their quabara undattha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Ulir-ulira young men open veins in their arms and give draughts of blood
    to tired old men; the water at the place is said to be reddish afterwards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Ertua the party sees two women of the Ertua wild turkey totem, a little
    boy, and an old Kumara man’s household; the women have neither Nurtunja nor quabara
    undattha.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Arapera the Achilpa make Engwura and perform Ariltha, encounter Ariltha-mariltha
    with a large visible Nurtunja, perform Atna ariltha-kujna upon her, have intercourse
    with her, and leave one Kumara man behind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Ilchinga, old men paint newly made Urliara with long parallel lines, and
    the party finds Cho-urka, who has a Nurtunja, quabara undattha, and a Nanja described
    as a large stone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Ungwurna-la-warika a man swinging a Churinga accidentally strikes another
    man on the shin; the party also finds two Bukhara women with Nurtunjas and quabara
    undattha and leaves one Purula man behind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Ilchi-lira the party finds Unjiamba men and a woman who have Nurtunjas
    and sacred ceremonies and are said to have originated on the spot; the Achilpa
    leave one Burula man behind.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Ituka-intura the party finds many local Achilpa men and women of all classes
    who have sprung up on the spot; after Ariltha and Engwura, the party goes on to
    Arara, where the Kanana sacred pole is erected to lean in the intended direction
    of travel.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Near Harry Creek the party first smells and then sees Achilpa men suffering
    from Erkindia; nearby Panunga Unjiamba women hide and avoid being seen.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'Several places are explained by events or lasting traces: Ulir-ulira is glossed
    as a place where blood flowed like a creek, Cho-urka’s Nanja is a large stone
    still visible, and Ungwurna-la-warika is glossed as the place where a bone was
    struck.'
  category: setting
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
