canonical_text:
  quote: ''
  summary: The preface explains the authors’ aim to document customs and social organization
    among Central Australian tribes, especially the Arunta. It describes their field
    access, their status as fully initiated members, their observation of the Kngwura
    ceremonies at Alice Springs, and their attention to initiation, magic, totemism,
    social organization, and regional diversity among Australian Aboriginal groups.
    It also warns that knowledge of many tribes’ organization and sacred customs may
    soon be lost.
  language: English
  quote_policy: summarized
