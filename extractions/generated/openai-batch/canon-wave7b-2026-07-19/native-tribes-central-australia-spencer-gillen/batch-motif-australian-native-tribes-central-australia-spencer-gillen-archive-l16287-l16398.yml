canonical_text:
  quote: ''
  summary: 'The passage describes a fifth phase and closing sequence of Engwura initiation
    ceremonies: night dances in the main camp, a women''s dance with body decoration,
    temporary allotment of wives under eligibility rules, food offerings from newly
    made Urliara to ab-inoara men, sacred ceremonies associated with such offerings,
    blood drawn from younger men and applied to older men, ritual touching of mouths
    with sacred or decorated objects to break a ban of silence, and final touching
    of young men''s mouths with offered food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the old men return to their camps and the newly made Urliara go into
    the bush, ordinary dancing festivals occur, including a special woman's dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night men and women assemble in the main camp; seated participants beat
    time with sticks and boomerangs on the ground and sing near a camp fire.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Several men painted with bands of ochre come one by one from darkness toward
    the camp fire, look around as if searching, and then sit among the audience.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young women decorated with double horseshoe-shaped white pipe-clay bands hold
    a flexible stick behind the neck and sway while quivering the muscles of the thighs
    and lower abdomen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that at this period there is a general interchange and
    lending of women and that visiting natives are provided with temporary wives,
    restricted in this Arunta instance to women lawfully eligible as wives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Final ceremonies begin when each newly made Urliara brings a food offering
    to his ab-inoara man; this particular offering is called ertwa-kirra, translated
    in the passage as man's meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In one example, a Panunga man of the lizard totem brings a wallaby to his
    ab-vioara, a Purula man of the emu totem, and the recipient prepares a wild cat
    totem ceremony in a secluded place among the ranges.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage notes that the food in the example belongs neither to the giver's
    totem nor to the recipient's totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A younger man opens a vein in his arm and lets blood flow over four older
    men, including the ab-vioara recipient; some blood flows into their open mouths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the idea of the blood application is to strengthen
    the older men at the expense of the younger ones.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the ceremony young men dance or run into a narrow defile where decorated
    men are waiting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: An elder ab-moara man touches the mouths of those present with a bunch of
    feathers used in the decoration; this action, called Aralkalilima, breaks the
    ban of silence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage adds that sometimes a Nurtunja is brushed against the mouths of
    the men present instead of using part of an individual's decoration.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The food presenters bring in the deposited food, place it before the ab-moara
    man, and sit in front of him; the old man places the food or a fragment against
    the mouth of the young man or men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After these actions, the ceremonies of the Engwura are brought to a close.
  category: sequence
  evidence_refs:
  - ev:8
