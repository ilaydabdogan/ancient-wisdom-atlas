  quote: ''
  summary: The passage describes totemic mate species, several traditions in which
    Alcheringa men or totem groups became birds, the underground life and intermittent
    emergence of Princess Alexandra Parakeet people, and a Thippa-thippa bird tradition
    represented in an Engwura ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Urliwatchera, described as large lizard people, have a small scincoid
    lizard mate called Irpanta.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mates of various totem people are held in affectionate regard, while eating
    restrictions are said to be generally absent except for mates of the witchetty
    grubs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wild cat, Hakea flower, and crow totems are described as apparently lacking
    mates of this kind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some birds are regarded as representing Alcheringa men of particular totems
    that became extinct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Xinchi-lappalappa, a little scarlet-fronted Ephithanura, are said to have
    been men who repeatedly painted themselves with red ochre before changing into
    the bird.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A group of lizard men wandered across the country near Simpson's Gap in the
    Macdonnell Ranges and encountered Princess Alexandra Parakeet totem people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Atninpirichira or Princess Alexandra Parakeet totem people changed into
    birds and are now said to live far underground, emerging near their old camping
    ground to feed on grass seed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The text connects the parakeet tradition with the bird's habit of disappearing
    from the district for years and suddenly reappearing in large numbers.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Thippa-thippa were Alcheringa men of the lizard totem who danced around
    lizard people during ceremonies and were transformed into birds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thippa-thippa birds are said to hover around lizards and thereby show natives
    where the animal can be found.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In an Engwura ceremony, two men represented the Thippa-thippa and danced around
    a lizard man.
  category: action
  evidence_refs:
  - ev:6
