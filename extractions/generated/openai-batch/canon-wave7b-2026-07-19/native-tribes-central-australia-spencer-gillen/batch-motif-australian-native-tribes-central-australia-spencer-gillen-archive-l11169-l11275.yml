canonical_text:
  quote: ''
  summary: The passage describes stages of an Arunta initiation sequence involving
    the Wurtja novice, a Waninga set in the Apulia path, instructions and warnings,
    songs about Alcheringa beings, kangaroo impersonations, blood and ochre preparation
    of performers, the Kulla Kulla performance, the novice bearing the weight of performers
    lying on him, and a repetition of the kangaroo performance on the following day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Waninga is set up in the Apulia path, and the Wurtja is told by Oknia and
    Okilia men to go out and embrace it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men gathered at the brake sing of the Waninga and of the wanderings of rat
    men in the Alcheringa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Wurtja receives instructions and warnings and is made to lie down with
    his head covered while another ceremony is prepared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After singing about Alcheringa individuals from Ayaiya, the Wurtja sees men
    hopping and making kangaroo sounds; they bunch together, shout, and run away to
    a gully out of sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Wurtja is told that the kangaroo-like performers represent a party of
    Alcheringa men starting off from Ayaiya.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports a tradition in which the special group of kangaroos split
    into a larger and a smaller party, with the larger party travelling ahead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before the later performance, bodies are rubbed with red ochre, two young
    men open veins in their arms, and blood is allowed to stream over the heads and
    bodies of the performers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ten performers are decorated with patches of down without a regular pattern,
    because the Alcheringa men are said not to have used a regular pattern.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each performer carries blood-saturated wooden shavings on his head and between
    his teeth; seven go to the Apulia ground in single file with Eucalyptus twigs
    while three remain behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A young man representing the young kangaroo Kulla Kulla lies at the path entrance,
    then frisks about, makes rushes, and darts between the legs of the other performers
    four times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kulla Kulla is caught, carried, and laid on the Wurtja, after which the performers
    throw themselves on the Wurtja so that he bears their collective weight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: One of the two men who carried Kulla Kulla faints after the performers separate,
    while the Wurtja is described as calm throughout the ceremony.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A second group of three men repeats the performance, and the act of lying
    down on top of the Wurtja is identified by the special term wultha-chelpima.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A figure caption identifies the Wurtja crouching behind his brake with a snake
    totem design on his back, Apulia lines, a group of men, and the circumcision operator
    with his assistant.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: On the ninth morning the Wurtja is greased by the Okilia in charge of him,
    remains crouching or lying at his brake until noon, is brought blindfolded to
    the ground, and sees the kangaroo performance repeated, including the lying down
    upon him.
  category: sequence
  evidence_refs:
  - ev:9
