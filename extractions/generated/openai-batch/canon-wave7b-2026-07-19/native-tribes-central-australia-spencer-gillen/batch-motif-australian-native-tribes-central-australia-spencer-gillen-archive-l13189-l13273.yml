canonical_text:
  quote: '"Paint the Nurtunja with rings."'
  summary: The passage describes men preparing ceremonial materials, selecting and
    instructing performers, constructing and decorating a Nurtunja pole with feathers,
    hair girdles, down, ochre, and blood, singing during the work, and attaching Churinga
    associated with totemic and Alcheringa figures.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Each man carries a small wallet containing materials used for decoration in
    ceremonies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wallets contain items including feathers, resin, ochres, pipe-clay, flints,
    hair and fur string, rabbit-kangaroo tail tips, and a dried eagle-hawk crop filled
    with down.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The owner of the Ouabara asked his younger brother, a Purula man of the Hakea
    totem, to perform the principal part in the ceremony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Panunga man of the Achilpa or wild cat totem was invited to assist because
    his daughter had been assigned as wife to the owner's son, and the invitation
    was intended as a compliment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After whispered preliminary discussion and instruction, a long spear was laid
    on the ground and enclosed with grass stalks and hair waist-girdles to form a
    long pole.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A bunch of eagle-hawk and emu feathers was fixed to the top of the pole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One man cut open a vein in his arm, and blood was caught in the hollow of
    a shield.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some down was mixed with powdered red ochre on a flat stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Four Purula men decorated the pole with alternate rings of red and white down,
    using blood applied with twig-and-fur brushes as an adhesive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The men sang a monotonous chant while the pole was being decorated, with refrains
    about painting the Nurtunja with rings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Another Purula man fixed lines of down across six Churinga that had been brought
    from the Purula and Kumara store for use in the ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The six Churinga were attached by human hair string to the pole so that they
    would hang pendant when the pole was erect.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two upper Churinga were said to have belonged to two Hakea women who in the
