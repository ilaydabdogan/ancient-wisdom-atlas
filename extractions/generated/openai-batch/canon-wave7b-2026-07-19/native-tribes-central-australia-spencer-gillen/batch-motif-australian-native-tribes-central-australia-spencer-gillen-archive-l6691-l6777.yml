canonical_text:
  quote: ''
  summary: The passage states that, in the named Central Australian tribes, totems
    do not regulate marriage and no traditions are found in which they formerly did
    so. It then summarizes traditions about Alcheringa totemic beings becoming located
    in named places, with present tribal members understood as their descendants or
    reincarnations. Examples include Achilpa wild cat companies traveling north through
    the country, Unjiamba Hakea-flower women carrying a sacred pole, traveling underground,
    dying by a water-hole, and stones marking their death-place, and a non-wandering
    Inarlinga/Echidna man arising near Stuart's waterhole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the totems in the mentioned tribes do not regulate marriage,
    and that the traditions give no evidence of an earlier time when totems regulated
    marriage there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: The traditions discussed are described as mainly concerning how Alcheringa
    members of different totems came to be located in scattered places in the country
    now occupied by the tribe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:3
  text: The current members of the tribe are described as regarded as descendants,
    or more precisely reincarnations, of the Alcheringa totemic members.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The examples named are Achilpa or wild cat, Unjiamba or Hakea flower, Unchichera
    or frog, and Udnirringita or witchetty grub.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Alcheringa, four companies of Achilpa wild cat men and women are said
    to have appeared first in the southern part of the country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that, in the native mind as represented by the authors,
    the human and animal natures of the Achilpa individuals are very closely associated.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Achilpa companies traveled northward by different routes involving the
    River Finke, the Macdonnell Ranges, Mount Sender, and, for one party, the country
    of the salt water.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The principal traditions about the Unjiamba or Hakea flower totem in this
    passage refer to the wanderings of certain women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Two Unjiamba women are described as having a sacred pole or Nurtunja, traveling
    underground, emerging at Arajjerra, and eating Unjiamba there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two Unjiamba women dismantled the Nurtunja, traveled to Ooraminna in the
    Macdonnell Ranges, sat down beside a special water-hole, died, and two great stones
    arose to mark the place of death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Unjiamba women followed close by the track of one Achilpa party, but did
    not meet it, because that party was traveling in the opposite direction.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some traditions are said to concern individuals or groups who did not wander,
    but lived and died where they sprang up; the Inarlinga or Echidna man is given
    as an example arising near Stuart's waterhole on the Hugh River.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote describes a Nurtunja as a central support, often made of one or
    more spears, wound with human hair string and decorated with down.
  category: object
  evidence_refs:
  - ev:11
