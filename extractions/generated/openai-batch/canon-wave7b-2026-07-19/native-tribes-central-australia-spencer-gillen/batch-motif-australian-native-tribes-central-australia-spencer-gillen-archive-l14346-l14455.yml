canonical_text:
  quote: ''
  summary: 'The passage describes several Ouabara performances within initiation ceremonies:
    a fish totem performance with bodily imitation and singers; a brief plum-eating
    performance; and an Irriakura totem performance involving a decorated man, a feathered
    ring, feather tufts representing growing Irriakura, singing about Unatunpika,
    ring transfer, and an associated Alcheringa tradition involving warning parrots,
    strange Irriakura men, named reincarnations, and the formation of an Oknanikilla.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is presented under initiation ceremonies and includes figure captions
    identifying fish and Irriakura totem ceremonies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fish totem performer is described as a man of the Obma or snake totem,
    with white down on the head-dress and face, black eagle-hawk feathers, and charcoal
    body bands edged with white down.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fish totem performer squats, moves his body, and opens and closes his
    arms to imitate a fish swelling and moving its gills.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fish totem performer uses twigs in his hands to imitate a man driving
    fish in a small waterhole with boughs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four men from the same southern locality but different totems sit to one side
    singing; one beats time on the ground, and one approaches the performer and puts
    his hands on the old man's shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A later night Ouabara is said to represent three men eating plums.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Irriakura totem ceremony, one man is decorated with pearl-coloured
    body bands edged with white down, a down-covered grass-and-hair ring over his
    head and shoulders, and many red-barred black cockatoo tail-feather bunches tipped
    with red or white down.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Irriakura performer sits before a straight line of decorated cockatoo
    feather bunches, moves from side to side, scoops them up one by one, and makes
    frightened-looking attitudes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The feather tufts are stated to represent growing Irriakura, which the performer
    is supposed to be gathering.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Other men sit to one side, watch, and sing about Unatunpika; the passage states
    that Unatunpika is also the Churinga name of the performer in this instance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the last tuft is uprooted, the ring called Ilyappa is taken off and
    placed in turn on the heads of other Irriakura men and other older men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The attached tradition says that in the Alcheringa, Unatunpika was eating
    Irriakura when ring-necked parrots, described as mates of the Irriakura men, cried
    out to warn him that strange men were coming.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The tradition says that a mob of Irriakura men left two individuals at Oknirchumpatana,
    then went to Unbanjun and formed the Oknanikilla, from which other persons sprang.
  category: sequence
  evidence_refs:
  - ev:10
