canonical_text:
  quote: ''
  summary: The Achilpa party travels through named places, exchanging and performing
    ceremonies, crossing mountain country, conducting Engwura and Ariltha rites, leaving
    some persons behind, giving blood from younger men to old men, and linking Erkincha
    suffering to unlawful intercourse and a magical evil influence. The itinerary
    includes encounters with local totemic women, an old Achilpa man with a Nurtunja,
    and a final statement that the tired men went underground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Achilpa travel through named sites along the Jay and Hugh area and into
    the Macdonnell Ranges, repeatedly stopping to perform ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
- id: obs:2
  text: A Panunga woman of the Alk-na-innira, or large beetle, totem shows the Achilpa
    her ceremonies; the Achilpa show her some of their ceremonies in return and do
    not interfere with her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Chelperla the party performs Ampurtanurra; the old leader remains there,
    and many of the party partly develop Erkincha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The party rests near Mount Conway, crosses the mountain, camps at Ningawarta,
    and performs ceremonies there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Alia the party makes Engwura; while young men undergoing initiation are
    in the bush, they encounter a Purula woman of the Ulchilkinja, or wattle seed,
    totem and all have intercourse with her contrary to a strict Engwura rule and
    without the old men's knowledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several persons are left behind at different places, including two Kumara
    men at Alia, Unatta at Iranira, an ill Panunga man at Okinchalanina, an old Panunga
    man suffering from Erkincha after Lilpuririka, and Ungatharinia at Ungatha.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:8
- id: obs:7
  text: When some old men become very thin, younger men open veins in their arms and
    give the old men large draughts of blood to strengthen or nourish them.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:8
  text: The rite of Ariltha is performed on groups of young men at multiple sites,
    and at one waterhole those suffering from Erkincha are left untouched.
  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:9
  text: At Okinchalanina the party performs ceremonies, paints the backs of all the
    men, and makes necklets, armlets, and forehead bands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The party considers that unlawful intercourse with the wattle seed woman has
    spread Erkincha and increased suffering; a note explains this as a magical evil
    influence conveyed through women as punishment rather than medical reasoning.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: At Ilartwiura, a waterhole on Jay Creek, the party erects a Kanana and performs
    sacred ceremonies; a large rockhole is said to mark where the Kanana stood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Alpirakircha the party finds an old Kumara man of the Achilpa totem, Alpirakircharinia,
    who originated there and has a very large Nurtunja visible from the last ridge
    crossed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Two Achilpa women, one Purula and one Kumara, have a Nurtunja that they hide
    when they see the Achilpa men coming; the men do not interfere with the women
    and perform ceremonies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ungatharinia is left at Ungatha while suffering from Erkincha, and the passage
    says he is represented in the present by a living descendant with the same secret
    name.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: After becoming very tired, the men go underground.
  category: action
  evidence_refs:
  - ev:9
