canonical_text:
  quote: ''
  summary: The passage describes part of an Intichiuma ceremony associated with the
    witchetty grub totem. Men are decorated with forehead bands, twigs, nose bones,
    feathers, body designs, red ochre, and pipe clay. The Alatunja leads a single-file
    procession, carrying an Apviara and a twig. A long narrow wurley called Uvibana
    has been built to represent the chrysalis case from which the fully developed
    insect emerges. Other men and women assemble in prescribed positions. The performers
    enter the Uvibana, sing of the animal in its stages, and then shuffle out and
    back while singing of the Maegwa emerging from its case.
  language: English
  quote_policy: summarized
