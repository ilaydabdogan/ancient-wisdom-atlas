canonical_text:
  quote: ''
  summary: 'The passage describes part of the making of an Arunta medicine man: ritual
    incision, greasing and painting with the Marilla design of the Oruncha, head adornment,
    silence, seclusion, food restrictions, and protection of the magic stone and power.
    It then summarizes the medicine man''s functions as curer and wizard, the belief
    that illness is caused by a human or spirit enemy, curing by extracting intrusive
    objects, and contrasts Arunta and nearby Central Australian practices with those
    of many other Australian tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stone is used to make an incision, after which a Nung-gara rubs the man's
    body with grease and paints a special design on his chest, abdomen, and forehead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The special design is called Marilla and is described as the sacred drawing
    of the Oruncha; the forehead mark is called the Oruncha's hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A long black line in the body drawing represents the Oruncha, and surrounding
    marks represent magic crystals carried in the Oruncha's body.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fur string bands are placed on the newly made medicine man's head, and gum-tree
    leaves are arranged to hang over the forehead, partly hiding the drawing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The newly made medicine man is instructed to remain at the men's camp and
    maintain strict silence until his tongue wound heals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He is told to keep his thumb pressed against the finger wound until it heals,
    or the magic stone will pass out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For a long time he must abstain from fat, and must not touch wild dog flesh,
    fish, or echidna; marrow may be eaten only from bones broken and voluntarily given
    by other men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: He remains at the Ungunja for about a month, during which his Unawa, Mia,
    and Ungaraitcha send him food, but his Quitia or younger sisters do not.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After recovery the Nung-gara tell him he may go to his own camp, but for about
    another month he must speak very little and remain abstemious.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night he sleeps with a fire between himself and his Unawa so that he is
    visible to the Oruncha and appears to hold aloof from everyone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If he fails in this conduct, the Oruncha is said to cause the magic power
    to leave him and return to the old Nung-gara, making his medicine-man powers disappear
    forever.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The medicine man is described as partly a curer and partly a wizard.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: All ailments are attributed to the malign influence of an enemy in either
    human or spirit shape.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Curing is described as removing from the patient's body something such as
    a pointing stick or broken pieces of a Churinga, understood to have been placed
    there by the enemy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that in many Australian tribes the equivalent of the Arunta
    medicine man is the one person able to hold intercourse with spirits, but that
    this is not the case among the Arunta.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage states that in the Arunta, Ilpirra, and other Central Australian
    tribes, every man may use sorcery to harm an enemy, but only medicine men can
    counteract an enemy's evil influence.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Certain very old medicine men are said to be endowed by the Iruntarinia with
    power to bring disease upon individuals or whole groups.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: In serious sickness two or three medicine men, if available, are called in
    consultation.
  category: action
  evidence_refs:
  - ev:10
