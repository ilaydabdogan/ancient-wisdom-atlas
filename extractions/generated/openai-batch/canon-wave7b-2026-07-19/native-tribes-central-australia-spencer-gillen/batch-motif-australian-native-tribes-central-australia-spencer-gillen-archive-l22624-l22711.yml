canonical_text:
  quote: ''
  summary: The passage describes forms of magic involving weapons sung over and believed
    to be endowed with Arungquiltha, a magical poisonous property. It gives examples
    of people dying after believing they had been magically injured, contrasts intangible
    Arungquiltha with a removable pointing stick, describes counter-magic by a man
    from the same locality as the original singer of a boomerang, and begins an account
    of making a hair-girdle from a dead man's hair under restricted conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bone, stick, spear, or similar weapon can be charmed by singing over it
    and is then described as having magical poisonous properties called Arungquiltha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who believes he has been struck by a charmed spear is said to be
    likely to die unless saved by the counter-magic of a medicine man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several illustrative cases describe slight wounds or illness followed by the
    afflicted person lying down, refusing food or wasting away, and dying after accepting
    a magical explanation.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After one man's death was attributed to a sung spear, members of his group
    organized revenge and killed the man who had wounded him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage distinguishes wounds from sung weapons, which involve intangible
    Arungquiltha, from injuries caused by placing a pointing stick in the body, which
    gives the medicine man something tangible to remove.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In an Alice Springs case, an Ilpirra man countered a boomerang's supposed
    magic by singing, making passes, sucking, and muttering over the wound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a man dies, his hair is cut off by specified male kin, while women and
    children retire out of sight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After burial, the dead man's hair is taken to a secluded spot, made into a
    hair-girdle, and assigned by a stated order of male inheritance; an elder brother
    cannot inherit it.
  category: sequence
  evidence_refs:
  - ev:7
