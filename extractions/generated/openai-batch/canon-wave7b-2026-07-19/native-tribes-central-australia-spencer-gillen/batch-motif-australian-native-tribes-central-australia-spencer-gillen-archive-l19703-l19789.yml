canonical_text:
  quote: ''
  summary: 'The supplied passage describes a female seclusion and status sequence
    involving a hole, return to the women''s camp, the rite of Atna-ariltha, transfer
    to an allotted man, and later designation as a fully grown woman. It then describes
    several uses of blood: donation from young men to old men, drinking and body-spurting
    before avenging expeditions, compelled blood-drinking to prevent treachery, blood-drinking
    in reconciliation meetings with a friendly or sham fight, a temporary taboo after
    a young man''s first blood-taking released by singing over the mouth, blood consumed
    for thirst or hunger, and blood-letting in Intichiuma rites over sacred totemic
    stones at Undiara and Ilyaba.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female subject is kept apart so that children may not go near her or speak
    to her; during the first two days she is supposed to sit over a hole, and when
    the flow ceases she is told to fill in the hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After this seclusion she is called Wliiipa, returns to the women's camp, undergoes
    Atna-ariltha, is handed over to the man allotted to her, and later is spoken of
    as Ayakiitja, a name for a fully grown woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young men may give blood to old men to strengthen them; the vein used differs
    according to whether donor and recipient are of the same or different moiety,
    with rarer extraction from the hand or fingertips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before an avenging expedition, each man in the party drinks blood and has
    blood spurted over his body so that he becomes uchuilivia, described as lithe
    and active.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elder men designate the blood donors for an avenging expedition, and selected
    men must not refuse; the passage says that in one case blood was taken until the
    donor collapsed from exhaustion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Partaking together of blood is said to prevent treachery; a man from the intended
    target country may be forced to drink blood and is then bound not to warn his
    friends.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In reconciliation meetings between groups, a messenger invites the offending
    group's old men to a friendly fight; at the meeting's start, each party drinks
    blood from its own members and a more or less sham boomerang fight takes place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a young man first takes blood from another man, the latter becomes temporarily
    tabu to him until the donor releases him from the ban of silence by singing over
    his mouth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Blood may be used to assuage thirst and hunger; a person badly needing water
    may open a vein in his arm and drink the blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the kangaroo men's Intichiuma rite at Undiara, young men open veins in
    their arms and let blood stream onto and over the edge of a sacred ceremonial
    stone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Undiara stone represents the place where a celebrated kangaroo of the
    Alcheringa went down into the earth, with its spirit part remaining in the stone
    that arose to mark the place.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the Intichiuma of the Unjiamba or Hakea flower totem at Ilyaba, blood from
    the arm is sprinkled over a stone representing a mass of Unjiamba.
  category: action
  evidence_refs:
  - ev:9
