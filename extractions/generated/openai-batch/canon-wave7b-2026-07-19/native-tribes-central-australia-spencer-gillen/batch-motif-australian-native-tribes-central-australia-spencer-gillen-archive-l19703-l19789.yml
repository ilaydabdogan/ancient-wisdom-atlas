candidate_motifs:
- id: motif:1
  label: seclusion followed by named status transition
  taxonomy_refs:
  - initiation
  basis: The female subject is isolated, associated with a hole and cessation of flow,
    receives a new designation, undergoes a rite, is transferred to an allotted man,
    and later receives a fully grown woman designation.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The supplied passage begins mid-description, and the broader rite is not
    fully described here; the taxonomy reference is used only for the status-transition
    pattern.
- id: motif:2
  label: blood transferred from young men to strengthen old men
  taxonomy_refs: []
  basis: The passage states that young men may give blood to old men with a view to
    strengthening them, with extraction sites specified by relationship category.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader comparative taxonomy is assigned because the passage frames
    the action primarily as strengthening, not as exchange or sacrifice.
- id: motif:3
  label: blood ingestion and blood anointing before avenging expedition
  taxonomy_refs: []
  basis: Every man starting on an avenging expedition drinks blood and has blood spurted
    over his body to become uchuilivia, described as lithe and active.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the practical and named effect but does not elaborate
    a mythic explanation for the expedition practice.
- id: motif:4
  label: shared blood as a binding obligation against treachery
  taxonomy_refs:
  - covenant
  basis: The passage explicitly says that partaking together of blood prevents treachery
    and that even forced drinking has the same binding influence as voluntary drinking.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not use the word covenant; the taxonomy reference is
    a cautious motif-family label for the described binding function.
- id: motif:5
  label: reconciliation through blood-drinking and friendly combat
  taxonomy_refs:
  - sacred_exchange
  basis: In Umbirna iliriniya, groups previously on bad terms meet, drink blood from
    their own members, and engage in a more or less sham boomerang fight as a settlement
    procedure.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The blood is drunk within each party rather than exchanged between parties;
    the taxonomy reference is therefore tentative.
- id: motif:6
  label: first blood-taking creates temporary taboo released by sung mouth rite
  taxonomy_refs:
  - initiation
  basis: A young man's first taking of blood creates a temporary tabu relationship
    and a ban of silence, released when the other man sings over his mouth.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage identifies a first-time rule and release action but does not
    call it an initiation.
- id: motif:7
  label: blood as emergency substitute for water or food
  taxonomy_refs: []
  basis: The passage states that blood may be used to assuage thirst and hunger and
    describes opening an arm vein to drink blood when badly in want of water.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is presented as customary practice, not as a mythic episode.
- id: motif:8
  label: ceremonial blood-letting onto totemic stones
  taxonomy_refs:
  - sacrifice
  basis: In Intichiuma rites, arm blood is made to stream or is sprinkled over stones
    associated with kangaroo and Unjiamba or Hakea flower totems.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage calls these sacred ceremonies and describes blood-letting
    onto stones, but it does not explicitly call the act an offering or sacrifice.
- id: motif:9
  label: ancestral animal's descent localized in a spirit-bearing stone
  taxonomy_refs: []
  basis: The Undiara stone marks where a celebrated kangaroo of the Alcheringa went
    down into the earth, with its spirit part remaining in the stone.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only one ancestral animal episode is given in this passage, so no broader
    taxonomy reference is assigned.
