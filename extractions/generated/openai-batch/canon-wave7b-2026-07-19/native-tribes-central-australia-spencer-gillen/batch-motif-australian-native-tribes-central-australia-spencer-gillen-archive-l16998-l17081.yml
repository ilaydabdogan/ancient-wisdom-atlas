candidate_motifs:
- id: motif:1
  label: Transformation into stones marking a place
  taxonomy_refs: []
  basis: The dead man and two women turn into stones marking the spot, and a separate
    stone represents the women’s mother.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names petrification or place-marking
    stones.
- id: motif:2
  label: Restoration and awakening of a mutilated dead man
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: A dead and mutilated snake man has his cut-off parts replaced, then awakens
    as if from a dream and is sound.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage says he awakens sound but also says he is Ulpinerka; it does
    not elaborate the status implied by that term.
- id: motif:3
  label: Sky flight and descent between sacred places
  taxonomy_refs:
  - ascent
  basis: The party flies into the sky, travels northward, descends at Ilkania, and
    later takes wing again before descending to Mirra.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The available taxonomy term 'ascent' captures only part of the repeated
    flight-and-descent movement.
- id: motif:4
  label: Ritual cutting with stone knives
  taxonomy_refs:
  - initiation
  basis: The travelling party performs Lartna with stone knives, and the passage describes
    men being cut or operated upon.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage does not define Lartna in this excerpt; the initiation taxonomy
    assignment rests only on the described repeated ritual operation.
- id: motif:5
  label: Animal-associated aggressor with hidden knife
  taxonomy_refs:
  - shapeshifter
  basis: The old Echidna man uses a stone knife carried in a socket behind his ear
    to mutilate the snake man, then is speared and dies.
  evidence_refs:
  - ev:4
  confidence: low
  cautions: The figure is animal-associated, but the passage does not describe a change
    of shape; the shapeshifter taxonomy is therefore uncertain.
- id: motif:6
  label: Snake man and snake totem
  taxonomy_refs:
  - serpent
  basis: The mutilated man is called Okranina or snake man, and the women are eating
    Okranina or snake, which is identified as their totem.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents a totemic snake association but does not develop
    a serpent combat or cosmic serpent episode.
- id: motif:7
  label: Transformation of Inapertiva into human beings
  taxonomy_refs:
  - culture_hero
  basis: Old Intumpulla transforms a number of Inapertiva into human beings at Urangipa.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The transformation is explicit, but the passage does not itself call Intumpulla
    a culture hero.
- id: motif:8
  label: Concealed object not to be seen by strangers
  taxonomy_refs:
  - forbidden_knowledge
  basis: The honey-ant woman has a Nurtiinja that she does not wish strangers to see
    and tries to drive them away.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The passage does not explain the Nurtiinja or state a formal prohibition;
