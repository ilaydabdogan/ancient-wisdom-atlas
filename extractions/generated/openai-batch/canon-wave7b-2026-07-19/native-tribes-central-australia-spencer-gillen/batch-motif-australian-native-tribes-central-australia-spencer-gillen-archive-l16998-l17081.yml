canonical_text:
  quote: ''
  summary: 'The passage recounts several Alcheringa episodes: women search for and
    try to restore mutilated dead men; some figures become stones marking places;
    a travelling party flies between places, performs Lartna with stone knives, kills
    an Echidna man, and leaves women at places; one mutilated man is restored and
    awakens; the group enters the earth with Churinga; Intumpulla transforms Inapertiva
    into human beings; and a honey-ant woman guarding a Nurtiinja is killed after
    trying to drive strangers away.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little animals covered with spines are described as Alcheringa spears.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wives of a murdered man find him dead and mutilated at an Apulia ground
    and search for his missing organs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger sister finds the missing organs under the bank near the Apulia,
    carries them in an alpara or pitchi, and the two sisters repeatedly try to rejoin
    them to the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After laying the body face downward over the organs, the two women sit on
    either side of the dead man, and all three turn into stones marking the spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A separate stone at a distance represents the mother of the two women, who
    came looking for her daughters and could not come close to the dead man because
    she was Mura to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ullakupera men leave women at the spot, forming another Oknanikilla, and one
    Purula woman named Chitta is said to have a present-day living representative.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: From Utiara the party flies into the sky, travels northward, and descends
    at Ilkania near the Burt Plain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Ilkania the party finds bandicoot, carpet snake, and an old Echidna man
    assembled at an Apulia ground and performs Lartna with stone knives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old Echidna man rushes up and mutilates an Okranina or snake man with
    a stone knife carried in a socket behind his ear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Echidna man is speared, runs in a circle while spears pour in on him,
    dies, and a circular rock hole appears to mark the spot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The wives of the mutilated snake man find him dead at the Apulia ground, mourn,
    locate the missing parts, place the body in a large pitchi, and replace the parts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the wives leave, the man awakes as if from a dream, sound but Ulpinerka,
    follows the women’s tracks, and meets them where they are eating Okranina or snake,
    their totem.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The restored man and the women go into the earth carrying their Churinga,
    and three stones arise to mark the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: After killing the Echidna man, the party leaves behind one little hawk woman
    who has no living representative, then travels to Urangipa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Urangipa, old Intumpulla insists on performing Lartna, transforms a number
    of Inapertiva into human beings, and stays there with Kakwa women and Unchinia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The rest of the party continues under the leadership of the Bukhara man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: At the Mirra or camp of the Ullakupera, a Yarumpa or honey-ant woman of the
    Panunga class has a Nurtiinja that she does not want strangers to see.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: The honey-ant woman tries to drive the strangers away with abusive language,
    annoying the old Ullakupera man, who kills her.
  category: action
  evidence_refs:
  - ev:7
