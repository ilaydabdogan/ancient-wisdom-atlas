canonical_text:
  quote: ''
  summary: 'The passage describes physical traits and grooming practices among Central
    Australian groups: hair color and body hair, pubertal removal of forehead hair,
    forehead bands, fur string, emu-feather chignons, net-like hair coverings, upper-lip
    depilation among older Warramunga men, women’s short hair and hair presentation
    for a betrothed man’s waist-belt, and body scars often miscalled tattoo marks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hair is described as usually jet black until later age, with red ochre sometimes
    making it appear brownish; some children have lighter hair tips that often darken
    with growth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Legs and arms usually have a thin coating of short, crisp, black hair, and
    body hair is generally less strongly developed than in the narrator’s English
    comparison group.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In tribes living between Charlotte Waters and Tennant Creek, men pull out
    forehead hairs at puberty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bare forehead area produced by hair removal is covered by the chilara,
    identified as a forehead band.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Remaining head hair is pulled back and usually bound with fur string; among
    Arunta and Luritcha it is often surmounted by an emu-feather chignon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Urabunna tribe the hair is often enclosed in a net-like structure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among the Warramunga, older men around forty years of age pull hairs from
    the upper lip; the passage says this is not practiced in the more southern tribes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women generally wear the hair short, connected in the passage with occasions
    when a woman presents her hair to the man betrothed to her daughter for making
    a waist-belt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women’s bodies are usually described as smooth, with at most very fine short
    hairs; occasional lip or chin hair is noted, especially among old women.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Body scars on both men and women are described as striking and often called
    tattoo marks, though the passage cites Dr. Stirling as objecting to that term.
  category: attribute
  evidence_refs:
  - ev:8
