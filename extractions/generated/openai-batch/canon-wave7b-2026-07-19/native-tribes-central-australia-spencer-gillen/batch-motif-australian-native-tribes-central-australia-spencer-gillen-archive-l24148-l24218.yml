canonical_text:
  quote: ''
  summary: The passage describes Central Australian weapons and implements, including
    the rarity and decline of stone hatchets after the spread of iron tomahawks, intergroup
    specialization and barter, six spear types, and detailed construction and decoration
    of stone-flake-headed spears among named northern groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stone knives and stone hatchets are described as rare, and stone hatchet manufacture
    is said to have diminished rapidly among the Central tribes after the spread of
    iron tomahawks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Different native groups are described as especially skilled in making different
    articles and bartering their products with other groups, sometimes at a distance
    of about one hundred miles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At least six spear forms are enumerated, including stone-flake-headed spears,
    wooden spears with barbed prongs, barbed wooden spears, unbarbed wooden spears,
    heavy one-piece unbarbed spears, and short light hand-spears for catching fish.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first two spear forms are said to be confined to the north and apparently
    not to reach as far south as the Macdonnell Ranges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stone-flake-headed spears are said to be made among the Warramunga, Walpari,
    Bingongina, and Chingalli tribes and to occur from Powell Creek northwards.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stone flake used for the spear-head is described as trigonal, with the
    figured example measuring 14 cm in length and 4 cm in greatest width.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stone flake is attached to the spear with resin, around which vegetable-fibre
    string is wound while the resin is soft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The resin and string may be covered with white kaolin or ornamented with kaolin
    dots, red ochre, or yellow ochre with red spots.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Stone-headed spear shafts are divided into two groups: one-piece shafts and
    two-piece shafts; the main shaft wood is described as light and liable to split.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A figured one-piece spear is described as 2.89 m long, with a handle depression
    for the spear-thrower, tendon wound in three places to prevent splitting, full
    red ochre covering, and a total weight of 538 gm.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A second form is described as 3.13 m long, with a hollow reed handle end into
    which the solid shaft is inserted, fixed with resin and tendon, and plugged with
    dry fibrous material.
  category: object
  evidence_refs:
  - ev:7
