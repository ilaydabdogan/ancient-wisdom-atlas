canonical_text:
  quote: ''
  summary: The passage describes several Aralkalilima and related ceremonies involving
    ertiva-kirra food offerings, release or partial mitigation of a ban of silence,
    ceremonial objects such as the Nurtunja and Atnuta, moiety separation, mouth or
    face touching, red ochre rubbing, and rules governing ab-moara, Gaimona, and Ikuntera
    relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wild cat Quabara ceremony of Aralkalilima was performed by two men, with
    the stated object of releasing two Purula ab-moara men from the ban of silence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Nurtunja was made for the ceremony, and only the nakrakia of the performers
    were present during its making.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the ceremony the performers squatted at the base of the Nurtunja while
    participants of all classes ran around; one ab-moara man carried his ertiva-kirra
    offering and the other left his offering some distance away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first ceremony ended with the ab-moara men suddenly squatting behind the
    performers, followed by an offering and the formation of a Purula and Kumara group
    with the two ab-moara men in the centre.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Men of the old man's moiety stood in two lines, held the Nurtunja horizontally,
    lifted it up and down while singing, and approached the other group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The faces of the two ab-moara Purula men, and not the faces of the others,
    were stroked with the Nurtunja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the Nurtunja was replaced in the ground, the men continued singing about
    the Nurtunja and Kauaua of the Alcheringa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the ceremony had special associations with one moiety
    and that the separation of the two moieties was strongly marked during performance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later ceremony involved an ertiva-kirra offering by two men, one Panunga
    and one Uknaria, who were ab-moara to a Kumara man, and consisted of two separate
    bat-totem performances.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Unchipera small-bat performance, a performer personated a man carrying
    the body of a dead man that he intended to eat; the body was represented by an
    Atnuta structure made of grass stalks bound with fur-string.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Elkintera white-bat performance, a performer carried an Atnuta object
    representing a dead man on his head, and the Atnuta was later used to stroke the
    mouth of the ab-moara men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A food-receiving difficulty arose because the Kumara recipient was Gaimona
    of one ab-moara man; the Ikuntera tore off a small piece of meat, rubbed the Gaimona's
    mouth with it, and thrust it into the mouth, temporarily removing the tabu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man is not supposed to come into the presence of his ab-moara until he has
    made an offering of ertiva-kirra, but a minor Anaintalilima ceremony can permit
    presence without removing the ban of silence.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: In Anaintalilima, proceedings occur out of sight of the main camp so that
    women and children cannot witness them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Anaintalilima, the ab-moara powders red ochre on a shield, receives a meat
    offering on his lap, and silently rubs the kneeling man all over with red ochre.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After Anaintalilima, a later sacred ceremony is expected to remove the ban,
    and it may entail a second offering of ertiva-kirra.
  category: sequence
  evidence_refs:
  - ev:10
