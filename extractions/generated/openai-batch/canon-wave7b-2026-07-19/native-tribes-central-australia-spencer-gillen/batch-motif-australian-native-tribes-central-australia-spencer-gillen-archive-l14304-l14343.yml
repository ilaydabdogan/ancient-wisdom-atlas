canonical_text:
  quote: ''
  summary: The passage recounts part of an ancestral itinerary involving a stone marker,
    Churinga, travel through named places and the sky, regulated access to a younger
    woman, punishment of Apallana, and eventual settlement in salt-water country.
    It then explains a Kngwura ceremony in which Ulpmerka men dance around local and
    northern Kukaitcha leaders, followed by an afternoon performance of the Ouabara
    Interpitna fish totem associated with water holes on the Finke River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Xnuja stone is described as a small block marking where an Alcheringa ancestor
    went down into the earth and left his spirit part in his Churinga.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The traveling party went to Burt Plain and Allan Waters, then went up into
    the sky, continued north, and camped at Umbaltna-nirrima.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Umbaltna-nirrima the Ulpmerka played with pieces of bark like boys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group again performed ariltha-kuma on the younger woman, and all had access
    to her by permission of Kukaitcha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The women traveled with Kukaitcha at a little distance to the side of the
    main party.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Ulathirka, Apallana had intercourse with the younger woman without permission
    and was killed; his spirit part remained in his Churinga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the same spot a Purula man was left behind, and the passage says his descendant
    was still living but not yet initiated.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The travelers went north until they reached the salt-water country, where
    they remained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Kngwura ceremony is said to represent Ulpmerka men from the south being
    collected around the Kukaitcha from the north before accompanying him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two performances showed Ulpmerka men dancing around their own local Kukaitcha,
    followed by all of them dancing around the Kukaitcha from the north.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dance around the northern Kukaitcha is explained as showing that they
    regarded him as the greater man and their leader.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the afternoon, the Ouabara Interpitna of Uratinga on the Finke River was
    performed; Interpitna is identified as a fish totem, locally the bony bream, associated
    with water holes.
  category: action
  evidence_refs:
  - ev:7
