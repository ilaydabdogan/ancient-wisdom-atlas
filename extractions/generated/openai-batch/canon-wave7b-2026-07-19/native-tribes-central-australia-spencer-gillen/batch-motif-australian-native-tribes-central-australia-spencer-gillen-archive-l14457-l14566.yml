canonical_text:
  quote: ''
  summary: The passage describes an Engwura initiation sequence including a plum-tree
    totem ceremony performed by four men, prolonged group singing near the Parra,
    decoration of younger men with Eremophila twigs and leaves called wetta, creation
    of an ab-moara relation between younger men and older men, naming of the younger
    men as Ilpongwurra, and the continuation of similar ceremonies and Churinga examinations
    into the third phase.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After midnight the Ouabara Akakia, identified as a plum-tree ceremony connected
    with Iliakilia in the Waterhouse Range, was acted by four men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The performers pretended to knock down plums and eat them, with the action
    repeated by different performers in sequence.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A note states that performers in such ceremonies represent individuals of
    the relevant totem and that, in this instance, each of the four represented a
    plum-tree man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The text states that Alcheringa ancestors are frequently represented as freely
    eating the animal or plant from which they derive their totemic name, and that
    present conditions differ from those earlier conditions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the evening near the Parra, older men stood in the centre of a dense
    group with younger men outside, and the whole group sang while swaying for about
    two hours.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After midnight the group sat closely packed and continued singing until between
    one and two o'clock, when older men decorated the younger men's heads with Eremophila
    twigs and leaves.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Eremophila twigs and leaves used as head decoration were called wetta
    and were to be worn until the end of the ceremonies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four or five young men were allotted to each decorating older man, and the
    decorated young men and the older man in charge became ab-moara to one another.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young men could not speak to, or in the presence of, the older man in
    charge without his permission.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: From this point until the end of the ceremonies the young men were collectively
    called Ilpongwurra, glossed as meaning not smeared with grease or colour, and
    the second phase of the Engwura ended.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the start of the third phase, the text says that the same examination of
    Churinga and ceremonies of the same nature continued day after day and night after
    night.
  category: sequence
  evidence_refs:
  - ev:9
