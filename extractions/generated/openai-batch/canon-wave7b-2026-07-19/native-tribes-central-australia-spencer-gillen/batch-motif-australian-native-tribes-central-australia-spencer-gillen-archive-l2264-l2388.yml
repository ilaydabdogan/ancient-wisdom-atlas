  quote: they have no significance at the present day as indicative of either tribal,
    class, or totemic group.
  summary: The passage describes raised scarification among Central Australian peoples,
    including the making of cuts with flint or glass and the rubbing of ashes or eagle-hawk
    down into wounds. It details common placements and band patterns, states that
    these cicatrices have no current tribal, class, or totemic significance apart
    from ornament, notes that some are made in connection with initiatory and mourning
    ceremonies, and describes self-inflicted mourning cuts among men and women after
    deaths of certain relatives. The passage ends with non-ritual physical observations
    about legs, nutrition, waistbelts, and musculature.
  language: English
  quote_policy: quoted
