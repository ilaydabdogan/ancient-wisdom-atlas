canonical_text:
  quote: ''
  summary: The passage describes two phases of the Engwura initiation ceremony. In
    Phase 4, Illpougwurra are moved out of camp in the morning and brought back at
    night by old men with bull-roarers; fire ceremonies occur, and after the final
    ceremony initiated men rank as Urliara. In Phase 5, newly made Urliara remain
    in the bush while night corroborees involving women and sacred ceremonies connected
    with lifting a ban of silence are held.
  language: English
  quote_policy: summarized
