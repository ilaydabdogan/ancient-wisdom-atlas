canonical_text:
  quote: ''
  summary: Ethnographic description of marriage-related ceremonies in several Central
    Australian tribes. The passage lists tribe-specific ritual operators and ordered
    categories of men who are granted temporary access to a woman during marriage
    ceremonies, then summarizes the authors' interpretation of these customs as temporary
    suspension of ordinary prohibitions and as possible relics of earlier wider marital
    rights. It also introduces a related custom of temporary license during large
    corroborees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For the Warramunga, the operation is said to be performed either by a Turtundi/Ipmunna-equivalent
    man or by an elder sister, followed by access by named male relationship categories
    in a stated order.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the Iliaura, the operation is said to be performed by an Ipmunna man,
    followed by access by named relationship categories in a stated order.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the Waagai and Bingongina, the ceremony is described as the same as in
    the Warramunga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: For the Walpari, the ceremony is said to be performed by a man in the same
    class as the woman's father-in-law, called Kulkuna, followed by access by named
    relationship categories in a stated order.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the Luritcha, the operation is said to be performed by a Sthamu, described
    as the woman's father's father, followed by access by named relationship categories
    in a stated order.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The authors state that the nine tribes discussed show substantial agreement
    in ceremonies connected with marriage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ceremonies are said to concern marriages of men and women allotted to
    one another, and the authors state that individual marriage exists in these tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The authors state that no special term is used for a special wife apart from
    the general term shared with other women of her lawful marriage group.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the time when a woman is being handed over to one particular man, special
    individuals representing groups with which she ordinarily has no intercourse are
    said to have access to her; tribal brothers are included in the majority of tribes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The authors define the temporary access as limited to specified individuals
    rather than to any man, and as applying to individuals to whom the woman is otherwise
    ekirinja, or forbidden.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The authors connect the ceremonies with Sir John Lubbock's category of "expiation
    for marriage" and describe them as possible relics of an earlier stage with wider
    marital rights.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: A related custom is introduced in which considerable license is allowed during
    certain large corroborees in eastern and north-eastern Arunta areas and among
    the Kaitish, Iliaura, and Warramunga; an important corroboree may last ten days
    or a fortnight.
  category: setting
  evidence_refs:
  - ev:5
