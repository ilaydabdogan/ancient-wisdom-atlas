  summary: 'The passage describes Central Australian fighting clubs and musical instruments:
    the forms and use of heavy wooden clubs, percussion made by striking or rattling
    implements during ceremonies, a ceremony-specific wooden clapper that imitates
    a frog croak and is taboo to women, and several common forms of the Trora instrument.'
