canonical_text:
  quote: ''
  summary: 'The passage describes staged initiation practices: boys are painted and
    instructed by male kin, separated from women and girls into the men''s camp, ritually
    thrown upward, given septum boring and a nose bone, and later prepared for circumcision.
    A described Undiara example emphasizes local kangaroo-totem direction, preparation
    of a ceremonial ground out of women''s sight, and the seizure and carrying away
    of the novice by young men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each boy is painted by men standing to him in the Umbirna relationship, and
    the painted design is named EnchicJiichika in the supplied text.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the painting, boys are told that the ceremony will promote their growth
    to manhood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tribal fathers and elder brothers tell the boys that they must no longer play
    or camp with women and girls and must instead go to the men's camp, Ungunja.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boys' activities are described as shifting from accompanying women gathering
    vegetable food and small animals to accompanying men in the search for larger
    game.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Full initiation is associated with later admission to tribal secrets that
    are still hidden from the boys at this stage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The throwing-up ceremony is called Alkirakhviiina in the supplied text and
    is glossed as deriving from words for sky and throwing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Soon after, and sometimes before the throwing-up ceremony, the boy's nasal
    septum is bored, usually by his father or paternal grandfather, and he begins
    to wear a nose bone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A long interval may elapse between the throwing-up ceremony and the later
    circumcision and subincision ceremonies; the passage also gives different terms
    for the boy before and after throwing-up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Elder male relatives, usually elder brothers, decide when the boy has reached
    the proper age for circumcision, and preparations are made without his knowledge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Preparations for circumcision include gathering a large supply of food because
    associated performances or corrobborees last several days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says that in Arunta practice there is usually no sending of messengers
    to other groups and usually no operation on more than one or two novices at the
    same time.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the described Undiara example, men of the kangaroo totem direct the proceedings,
    and the passage states that details vary by locality and totem.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The boy is seized early in the evening at the Ungunja, or men's camp, by three
    young men related to him as Okilia, Uinhinia, and Unkidla.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: As the three young men seize the boy, they shout, and the frightened boy struggles
    to get free.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The boy is carried bodily to a carefully prepared ceremonial ground located
    away from and out of sight of the main camp, so that women cannot see what takes
    place.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: The diagram of the Apulla ground distinguishes places for men, dancing women,
    the operation, the novice, brakes, banks, and a pathway.
  category: setting
  evidence_refs:
  - ev:8
