- id: obs:2
  text: The Okoara ceremony is described as solemn, after which participating men
    rejoin the others and the Lartna song is sung fiercely through the night with
    short rests.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wurtja is brought from his brake in the evening and spends the night among
    the men, listening but not participating in the singing.
  category: action
  evidence_refs:
