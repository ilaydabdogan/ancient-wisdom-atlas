- id: obs:8
  text: 'In the ceremony the Waninga represents the body of a rat: the main part is
    the trunk, the point end the tail, the handle end the head, and the crossbars
    the limbs.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Waninga is carried by an Okilia while another man walks behind to steady
    it, and two other men are decorated to represent Ktitta kutta, or little night
    hawks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wurtja is brought blindfolded from his brake to the Apulia ground and remains
