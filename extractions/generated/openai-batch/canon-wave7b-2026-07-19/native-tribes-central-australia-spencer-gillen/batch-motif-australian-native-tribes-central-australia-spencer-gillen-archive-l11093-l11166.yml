canonical_text:
  quote: ''
  summary: The passage explains the Okoara ceremony as an entrusting of a youth for
    initiation, followed by solemn participation, fierce Lartna singing through the
    night, and Wurtja listening without taking part. On the eighth morning a ceremony
    for the Illuta rat totem is prepared. A rat-man is said to have travelled from
    Pulkira to Walyirra, died there, and remained spiritually associated with Churinga.
    A large Waninga is constructed from a spear, crossbars, strings, fur, birds' down,
    and human blood; in the ceremony it represents a rat body. Wurtja is brought blindfolded
    to the Apulia ground, the bandage is removed, and performers representing little
    night hawks and Waninga carriers move and quiver before him.
  language: English
  quote_policy: summarized
