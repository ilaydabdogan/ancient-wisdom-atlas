canonical_text:
  quote: ''
  summary: The passage describes methods said to be used by Arunta men to attract
    women through charms, especially a Chilara worn after being sung over. It gives
    named cases of elopement and punishment, explains the social risks and lawful-marriage
    categories involved in such runaway marriages, contrasts local-group support with
    totemic support in quarrels, and begins to describe a valued traded shell ornament
    as another charm for women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man wears a Chilara about the camp so that a woman can see it; her attention
    is drawn to it and she becomes strongly attracted to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If possible, the attracted woman creeps into the man's camp at night when
    all is quiet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two male friends may make and wear Chilara to charm two women; the women may
    pretend to go hunting while actually following the men to their camps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the named Alice Springs case, Urkaitchapurinia made a Chilara while hunting,
    sang over it, wore it into camp, and showed himself to Thunginpurturinia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thunginpurturinia described herself as very infatuated, went to Urkaitchapurinia's
    camp, followed him to Alice Springs, and continued living with him; the elopement
    caused ill-feeling between two groups.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another case, Allapita charmed Irriakura by means of a Chilara; Irriakura
    was later captured and killed by her previous husband and his friends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that such methods are actually practised but probably not
    frequent because they depend on the woman's acquiescence and expose her to severe
    punishment, possible death, and rough handling in subsequent quarrels.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says these runaway marriages are not irregular if the man and
    woman are Unazva to one another and may lawfully marry; the act is described as
    a breach of manners rather than custom.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In quarrels over such cases, assistance comes from men of the same locality,
    including brothers and mother's brothers' sons, rather than necessarily from men
    of the same totem.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Another means of charming women is introduced as a valued shell ornament traded
    from north-coast tribes and worn suspended from the waist-girdle, especially at
    corrobborees.
  category: object
  evidence_refs:
  - ev:8
