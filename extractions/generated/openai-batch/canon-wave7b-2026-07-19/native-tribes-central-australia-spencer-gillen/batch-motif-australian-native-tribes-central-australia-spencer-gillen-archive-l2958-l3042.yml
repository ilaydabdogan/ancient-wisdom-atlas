canonical_text:
  quote: Individual marriage does not exist either in name or in practice in the Urabunna
    tribe.
  summary: The passage describes Urabunna social organization in relation to Nupa
    and Piranngaru marital relations, elder-brother and elder-group sanction, spouse-access
    rules, collective child terminology, comparison with Dieri organization, and a
    senior/junior-side restriction on marriage.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that individual marriage does not exist in the Urabunna
    tribe, and that elder brothers may give one man preferential right to a woman
    while also giving other men of the same group secondary right to her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The relationship called Piranngarii/Piranngaru is established through action
    by elder brothers and requires sanction by the old men of the group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Such arrangements are said usually to be made when many members of the tribe
    gather for important ceremonies and other matters requiring old men's consideration.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The number of a man's Piranngaru depends on his power and popularity; an influential
    man has many, while an insignificant or unpopular man has few.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman may be Piranngaru to several men, and men and women in this relationship
    are generally found living grouped together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man may lend the woman over whom he has first right to another man, provided
    the other man is her Nupa, even without a Piranngaru relation existing between
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a man tries to prevent his wife's Piranngaru from having access to her,
    the passage says this leads to a fight and the husband is regarded as churlish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a man visits distant groups where he is likely to have no Piranngaru,
    men of his own class customarily offer him the loan of one or more of their Nupa
    women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Children of women who are Nupa to a man call him Nia, and he calls them Biaka,
    whether or not he has marital relations with those women.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Biaka, or children of men at the same generational level and belonging to
    the same class and totem, are regarded as the common children of those men, who
    are collectively regarded by the Biaka as their Nia.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The authors state that Urabunna organization appears closely similar to Dieri
    organization described by Mr. Howitt, and that both tribes have a modified form
    of group-marriage.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: The summarized features of this modified group-marriage include men of one
    moiety as possible husbands of women of the other moiety, specially allotted women
    with preferential but not exclusive rights, and Piranngaru groups of men and women.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: A man's wife must belong to what the passage calls the senior side of the
    tribe relative to him; the woman is Nupa only to men on the junior side relative
    to her.
  category: relationship
  evidence_refs:
  - ev:12
