canonical_text:
  quote: ''
  summary: The passage explains Arunta and related Central Australian group relationship
    terms. It describes how kinship categories extend beyond actual relatives to blood
    and tribal relatives, especially children, siblings, mothers, fathers-in-law,
    and lawful marriage categories. It gives examples of duties and sanctions attached
    to these group relationships, including shoulder-cutting after the death of an
    Ikuntera, possible loss of a wife for neglecting that duty, taboo on game seen
    by an Ikuntera, and women cutting themselves after a child’s death. It then introduces
    comparative relationship tables for several tribes and begins an Arunta table
    of kin terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man applies the term Allira to his own children and to the children of his
    blood and tribal brothers, while his sisters’ children are called Umba.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Panunga man’s wife is Purula, and her actual father is a Kumara man called
    Ikuntera; where eight divisions operate, the same name is applied to all Kumara
    men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: All Kumara men are described as fathers of women whom the Panunga man may
    lawfully marry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If one of a man’s Ikuntera dies, the man is expected to cut his shoulders
    with a stone knife as a mark of sorrow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the man neglects the shoulder-cutting duty, any man who is Ikuntera to
    him may take away his wife and give her to another man to whom she is Unawa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The neglect is described as an offence against the group collectively, and
    any member of that group may punish the man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a hunter carrying game meets a man related to him as Ikuntera, he must
    drop the food because it has become tabu to him after being seen by a member of
    that group.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a child dies, the actual mother and all of her sisters, who are also
    Mia to the dead child, cut themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women call their own children Umba and apply the same term to the children
    of their blood and tribal sisters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The text introduces relationship-term tables for the Arunta, Luritcha, Kaitish,
    and Warramunga, and says an Arunta genealogical tree and tabular arrangement were
    prepared using a man and his allotted Unawa.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: For comparison, the Arunta genealogical tree is made identical with the one
    used for the Urabunna tribe, with individuals numbered alike on both trees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Arunta relationship table maps native kin terms such as Oknia, Ganimona,
    Mia, Uwinna, Allira, Umba, Okilia, Itia, Ungaraitcha, Unkulla, and Unawa to English
    kinship categories.
  category: object
