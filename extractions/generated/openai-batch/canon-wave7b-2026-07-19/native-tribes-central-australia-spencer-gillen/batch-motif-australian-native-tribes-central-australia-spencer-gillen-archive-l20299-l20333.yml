canonical_text:
  quote: ''
  summary: The passage reports ceremonial references to dead bodies and cannibalism,
    describes beliefs attributed to the Luritcha about eating enemies and destroying
    bones to prevent the victims' return, compares this with a lizard-man tradition
    involving an undestroyed head and revival, and reports child-killing and flesh-feeding
    said to transfer strength, while noting uncertainty and reciprocal accusations
    among groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a ceremony connected with the white bat totem, a performer carried on his
    head an object representing a limp, dead body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Traditions about the wanderings of wild dogs repeatedly refer to wild dog
    men killing and eating other wild dog men and women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that these ceremonies may indicate practices among ancestors
    of the present Arunta and that enemies are still eaten among the Luritcha.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Luritcha people take care to destroy bones because they believe
    victims may arise from the bones coming together and then follow and harm those
    who killed and ate them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The skull is described as especially essential to destroy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage compares this belief with a tradition in which an early lizard
    man's head was not destroyed and he came to life again when his brother spoke
    to the head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that among the Luritcha young children are sometimes killed
    and eaten, and that a weak child may be fed on the flesh of a younger healthy
    child to gain the latter's strength.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The authors note difficulty determining exactly what occurs because groups
    deny the habit for themselves and attribute it to other groups.
  category: speech
  evidence_refs:
  - ev:5
