  text: An unnamed fetich is described as a goddess endowed with powers of fecundity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nakatanza carried the fetich carefully, placed it on barkcloth in an open
    space, and later carried it back to the temple while women ate a meal in its presence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When strong wind blew, drums were beaten in the temple enclosure to distract
    an imprisoned wind-spirit and prevent it from escaping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Beer offerings were made, and requests for children were addressed to the
    spirit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The fecundity-associated fetich was honored at court during a king's lifetime,
    discarded after his death, and replaced by a new fetich for the new king; the
    tree stump connected with it was guarded only during the king's lifetime.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Mbajwe was the king's chief fetich, had a temple, priest, and female medium,
