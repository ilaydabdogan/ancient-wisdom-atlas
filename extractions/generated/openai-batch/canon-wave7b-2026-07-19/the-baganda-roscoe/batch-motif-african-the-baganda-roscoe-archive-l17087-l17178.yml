canonical_text:
  quote: ''
  summary: 'The passage describes several Baganda fetiches and their ritual uses:
    a fecundity-associated goddess/fetich connected with child petitions and an imprisoned
    wind-spirit; Mbajwe, the king''s serpent-shaped chief fetich with temple attendants,
    a medium, ritual objects, prisoner trials, and sacrificial killings; Navibaga/Nanibaga,
    a horn fetich used for healing; and Luboa, a fetich used by hunters and warriors
    to affect wild animals.'
  language: English
  quote_policy: summarized
