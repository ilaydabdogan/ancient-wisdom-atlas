literal_observations:
- id: obs:1
  text: A fever patient is stripped, seated on the floor, placed beside a pot of hot
    embers, and covered with the pot under barkcloth until perspiration begins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During ordinary illness, wives nurse the patient, while relatives and friends
    visit, inquire, talk, and express sympathy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the King is gravely ill, named high chiefs stay constantly with him and
    restrict access by most of his wives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain royal women are admitted to the sick chamber but kept under control
    and pledged to secrecy about the seriousness of the illness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King’s dangerous illness and death are concealed as long as possible so
    that the Katikiro can guard the capital and consult about which prince will take
    the throne.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After preparations are complete, the sacred fire at the entrance of the royal
    enclosure is extinguished and the chief responsible for it is strangled by the
    fireplace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wailing begins, drums beat a death rhythm, and the country learns what has
    happened; people refer to the King’s death only by saying that the fire is extinguished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A short interregnum is described as a time of disorder, robbery, and danger
    from stronger chiefs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Katikiro, the Kimbiigzve, and the Kasuju have the duty to appoint a new
    King quickly to prevent civil war.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Queen Lubuga takes charge of her brother’s body, has it carried to a large
    house near the royal enclosure entrance, washed, laid on a barkcloth-covered bed,
    with hands crossed and great toes tied together by a cord with two beads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Queen remains with the body by day and night until it is removed to the
    country for embalming.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The King’s wives wail, call on the lost husband to return, question him, beat
    their breasts, paint themselves with wood ashes, go unkempt, and wear withered
    plantain-leaf girdles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Outside the royal enclosure, everyone wears a plantain-leaf girdle, no one
    may shave, the whole country mourns, and work ceases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the new King is chosen, he is taken to the body of his father, looks
