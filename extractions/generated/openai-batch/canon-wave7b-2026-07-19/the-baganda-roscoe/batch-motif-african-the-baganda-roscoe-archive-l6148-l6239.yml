  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The body of the dead twin was embalmed and placed on the mother’s bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The medicine-man caught the ghost by night using barkcloth, a killed white
    fowl, the fowl’s tongue, and the first insect to alight on the barkcloth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The insect and the fowl’s tongue were wrapped up as a “twin,” decorated with
