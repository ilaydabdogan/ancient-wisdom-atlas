  locator: lines 6186-6196, beer at grave, widows, and ghost shrine
  quote_or_summary: Beer is brought to the grave, drunk by family, and poured at the
    head; widows live in huts around the grave and maintain it; a shrine for the ghost
    is usually built.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: lines 6196-6207, offering to the King
  quote_or_summary: The heir brings a white male goat, special cowry-shell, and bead
    as offering from the dead, lays shell and bead on the royal rug, thanks the King,
    and the King keeps the shell and bead for later jawbone decoration.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: lines 6208-6218, illness and death of a twin
  quote_or_summary: A twin’s death is a great calamity; the father makes offerings
    to Mukasa and seeks priests for an ill twin; death is spoken of indirectly as
    going for firewood, making barkcloth, or flying away; the body is embalmed on
    the mother’s bed.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: lines 6218-6228, medicine-man makes the ghost into a twin
  quote_or_summary: By night the medicine-man spreads barkcloth, kills a white fowl,
    places its tongue on the cloth, catches the first insect to land there, says the
    ghost has returned, and preserves insect and tongue as a decorated “twin” in a
    wooden pot under barkcloth.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: lines 6229-6239, burial and avoidance of twin grave
  quote_or_summary: The embalmed twin body is wrapped with a creeper, placed in a
    new cooking pot, buried by the Mutaka in waste land near a main road, marked by
    an overturned pot, and avoided lest the ghost catch or enter people.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; summarized from supplied passage.
