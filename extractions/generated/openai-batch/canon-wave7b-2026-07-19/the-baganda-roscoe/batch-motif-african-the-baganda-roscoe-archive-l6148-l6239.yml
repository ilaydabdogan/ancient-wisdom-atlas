canonical_text:
  quote: ''
  summary: The passage describes the closing of mourning rites, the heir’s assumption
    of property, gifts of beer and goats connected with release from mourning, a final
    clan beer feast using items from the deceased’s house, preparation and thatching
    of the grave, beer poured at the grave, care of the grave by widows, shrines for
    the ghost, and offerings made by the heir to the King. It then describes the illness
    and death of a twin, including offerings to Mukasa, euphemistic speech about the
    death, embalming, a medicine-man’s ritual to catch the ghost and make it into
    a preserved “twin,” and a distinctive burial near a main road marked with an overturned
    pot and avoided because of the ghost’s danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The house was cleansed and repaired, the outside place put in order, traces
    of mourning removed, and the heir entered into full possession.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women who had undergone mourning ceremonies were not permitted to return home
    alone; their husbands had to fetch them and bring beer to the heir, with a goat
    treated as the proper additional gift.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the plantains cut by the heir ripened, clan members assembled with beer,
    and the heir brewed beer using those plantains for a final feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased’s bedstead and inner house walls were removed and used as firewood
    for brewing beer for the final feast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Relatives beat the earth of the grave mound smooth, polished it with beer,
    laid a thick layer of grass on it, and secured the grass with stakes and plantain-fibre
    rope.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beer was brought to the grave, family members drank it, and some was poured
    on the ground at the head of the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Huts were built around the grave for the widows, who had to keep the grave
    and its surroundings clear and maintain the thatch.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A shrine was usually built for the ghost, and a distant chief-heir could make
    a second shrine for the ghost at the entrance of his own enclosure.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The heir brought the King a white male goat, a special cowry-shell, and a
    bead as an offering from the dead, and thanked the King for permitting him to
    succeed to the property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The special cowry-shell and bead were kept by the King for decorating his
    jawbone after death.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The death of a twin was considered a great calamity, especially before the
    child was named and twin-birth ceremonies were complete.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: When a twin fell ill, the father took offerings to the temple of Mukasa and
    engaged Mukasa’s priests to try to have the child’s life spared.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When a twin died, people avoided stating the fact directly and used euphemistic
