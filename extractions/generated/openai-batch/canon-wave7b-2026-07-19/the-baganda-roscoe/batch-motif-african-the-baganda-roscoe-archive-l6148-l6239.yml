candidate_motifs:
- id: motif:1
  label: succession ratified through mortuary exchange
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: The heir assumes possession, receives beer and goat gifts connected with
    release from mourning, and later thanks the King for permitting succession while
    making offerings from the dead.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The passage is ethnographic ritual description, not a mythic narrative;
    the royal-legitimacy reference is limited to succession permission and offering
    practice.
- id: motif:2
  label: grave libation and ghost shrine
  taxonomy_refs:
  - sacred_exchange
  basis: Beer is consumed by the family and poured at the grave’s head, while a shrine,
    and sometimes a second shrine, is built for the ghost.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explain the theology of the libation or shrine beyond
    their mortuary use.
- id: motif:3
  label: specially dangerous death of a twin
  taxonomy_refs:
  - sacred_twins
  basis: The death of a twin is called a great calamity; it requires indirect speech,
    ghost-catching, preservation of a made “twin,” distinctive burial, and avoidance
    of the grave.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives ritual consequences but does not provide a narrative
    myth about the origin of twin danger.
- id: motif:4
  label: ghost captured and returned through insect-token
  taxonomy_refs: []
  basis: The medicine-man catches the first insect alighting on barkcloth and wraps
    it with a fowl’s tongue, saying the ghost has come back again, then preserves
    it as a “twin.”
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a ritual motif extracted from practice; it should not be equated
    with resurrection of the dead child.
- id: motif:5
  label: sacrificial and votive offerings during mortuary and illness crisis
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Offerings are taken to Mukasa’s temple for a sick twin, a white fowl is killed
    in the ghost-catching rite, and the heir makes animal and object offerings linked
    with the dead to the King.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage distinguishes several offering contexts; they should not be
    collapsed into a single rite without review.
- id: motif:6
  label: dangerous grave avoided to prevent ghost attack or entry
  taxonomy_refs: []
  basis: The twin grave is recognized by its overturned pot, avoided lest the ghost
    catch passersby, and especially avoided by women who throw grass to prevent the
    ghost entering them.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The final sentence in the supplied passage is cut off after the phrase
    about the ghost entering women, so any omitted continuation is unknown.
