candidate_motifs:
- id: motif:1
  label: offering to a water spirit for safe passage
  taxonomy_refs:
  - sacred_exchange
  basis: The traveller asks the river-spirit for safe crossing and gives coffee-berries
    to the water before attempting a dangerous crossing.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage describes a practice at rivers; it does not generalize it
    into a wider cosmology.
- id: motif:2
  label: death by water attributed to spirit agency
  taxonomy_refs:
  - water
  basis: A drowning is explained through the river-spirit and the man's guardian spirit
    leaving him.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy list includes water as a symbol, not a specific
    drowning motif family.
- id: motif:3
  label: sacred refuge beyond royal authority
  taxonomy_refs: []
  basis: People and their goods are safe on sacred hills where neither the King nor
    his messengers may venture.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy motif directly names asylum or sanctuary.
- id: motif:4
  label: animal spirits guarding or possessing sacred hills
  taxonomy_refs: []
  basis: The passage names hills possessed by wild-animal ghosts and associated with
    lion or leopard spirits, requiring appeasement.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The supplied taxonomy has no exact hill-guardian animal motif; lion and
    leopard are not supplied symbol refs.
- id: motif:5
  label: sacred place afflicts a king who violates exclusion
  taxonomy_refs:
  - divine_judgment
  - royal_legitimacy
  basis: King Mawanda reportedly becomes blind after entering Boa to build a capital
    and recovers when he leaves, after which the hill is regarded as sacred.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The text reports the sequence but does not explicitly state that a deity
    judged or punished Mawanda.
- id: motif:6
  label: sacred forest protected by ritual consequence
  taxonomy_refs:
  - fire
  basis: If fire enters the forest because the road is neglected, the medium is said
    to develop burning sores and the chief is fined.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The relationship between forest damage and the medium's illness is reported
    as local belief.
- id: motif:7
  label: chiefly installation through ancestral grave, sacrifice, gifts, and priestly
    object
  taxonomy_refs:
  - royal_legitimacy
  - sacrifice
  - sacred_exchange
  basis: The new chief performs rites at a predecessor's grave, kills a goat, makes
