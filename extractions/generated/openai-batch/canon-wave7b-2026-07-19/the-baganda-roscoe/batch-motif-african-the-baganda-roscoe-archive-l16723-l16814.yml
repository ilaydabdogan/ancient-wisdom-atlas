canonical_text:
  quote: ''
  summary: The passage describes offerings to river-spirits before dangerous crossings;
    sacred hills associated with lion and leopard spirits; restrictions on kings and
    royal messengers at those hills; sanctuary on sacred hills from royal plunder;
    the sacred hill Boa, its temple, priestess, and medium; King Mawanda's reported
    blindness on Boa and recovery after leaving; rules for a sacred forest; installation
    rites for a district chief; and the temple of the python god Selwanga by the river
    Mujuzi and Lake Victoria Nyanza.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before crossing a river, a traveller asked the spirit for a safe crossing
    and threw coffee-berries into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: River crossings were described as dangerous because they involved jumping
    on papyrus roots, with strong currents beneath the floating papyrus.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man was carried away by the current, his friends did not try to save
    him because they feared the river-spirit would also take them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The death of a person carried away by the current was explained as the person's
    guardian spirit leaving him to the river-spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Certain hills were thought to be possessed by ghosts of wild animals, especially
    lion spirits and leopard spirits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: People approached the sacred hills with fear and appeased the spirit when
    they had to work on or cross one of them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Neither the King nor messengers from him were permitted to venture on the
    sacred hills.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: People escaping royal plunder could take their goods to the nearest sacred
    hill and remain safe there until the royal party withdrew.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Gaga on Boa hill there was a temple under the priestess Kalambika and a
    female medium named Bakiina.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: King Mawanda reportedly became blind after crossing the stream to build his
    capital on Boa hill and recovered his sight when he left the hill.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A sacred forest on Boa hill could be entered only by the priest, and a road
    around the hill was maintained by the district chief.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: If fire entered the sacred forest because the road was neglected, the medium
    was said to fall ill with burning sores, and the chief was fined.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a new chief was appointed, he visited the grave of Matumpagiva or Matumpagwe,
    spread barkcloth over it, mourned, killed a goat, and caused the blood to run
    into a drum covered with the goat's skin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The appointed chief gave two cows to his principal wife, propitiated ghosts
    at several places, offered a hoe at Muruli, received a woman to wife at Mpumude,
    sat on a stone at Boa, and smoked a pipe given by Kalambika.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The python god Selwanga had a temple in Budu by the river Mujuzi on the shore
    of Lake Victoria Nyanza, in a forest called Bulongo.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: The temple of Selwanga was built by members of the Heart Clan, who also supplied
    the priests and the medium.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Inside Selwanga's hut, a log, stool, and barkcloth were arranged for the huge
    snake to lie with its head resting on the stool; a round hole was cut in the side
    of the hut near this place.
  category: object
  evidence_refs:
  - ev:10
