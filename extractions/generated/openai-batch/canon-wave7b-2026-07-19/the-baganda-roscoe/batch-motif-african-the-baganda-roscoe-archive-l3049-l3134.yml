canonical_text:
  quote: ''
  summary: 'The passage describes Baganda royal and chiefly childbirth customs: a
    royal mother''s seclusion after birth, a fire-log kept burning until the kasiki
    purification, the King''s jump over the mother or her girdle, arrangements for
    a foster mother for a prince, prenatal and delivery care for a chief''s wife,
    responses to difficult or omened births, and beliefs about the afterbirth as a
    second child with a ghost/spirit connected to a plantain and clan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the royal mother buried the afterbirth, she remained in the house, ate
    with the midwives, kept food leaves in a heap, and the house was not swept or
    cleaned during that time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A log supplied by Mugema/Miigema was placed on the fire when the child was
    born and was kept burning during the seclusion.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After nine days the mother was brought out, washed behind the house, the house
    was cleaned, the log was cast onto waste land, and the ceremony was called kasiki.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King came that evening and jumped over his wife; if unable to do so, Mugema
    placed the woman's girdle on the ground and the King jumped over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a favored royal wife was wanted back at court quickly, Mugema secured
    a nurse for the royal child by watching for and taking a mother with a child of
    similar age and sex from a public road to Nabikande.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The foster mother stayed three years with the King's child, later returned
    to her husband, and was rewarded with a cow or other gift.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The foster mother chiefly fed her own child on cow's milk while devoting herself
    to the King's child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Foster motherhood to a prince was considered a great honor, and a prince often
    later raised the foster mother's husband to an important office.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The same foster-mother custom was followed when the gods foretold that a woman
    would not make a good mother; otherwise a King's wife ordinarily nursed and weaned
    her child after three years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: For a chief's wife, the husband's father's mother, or another older woman
    related to the husband's father, took charge of her, often at the paternal grandmother's
    house until birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: For some weeks before birth the pregnant woman was smeared with butter and
    rubbed to make her bones supple.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: For a daytime birth, the woman was taken outside to a garden or rear washing
    yard, held a plantain or other tree, was supported by one woman, and another received
    the child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After birth, the child was laid on a plantain leaf and the midwife washed
    out its mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: In cross-birth cases a medicine-man was called to turn the child gently or,
    if that failed, to try to save the woman by removing the child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: In many clans, a first male child born to a chief was thought to indicate
    the father's death; the midwife strangled the child and reported it as stillborn
    to preserve the chief's life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: A feet-first child was strangled because it was thought likely to become a
    thief, murderer, disgrace, or danger to its parents; its body was buried at crossroads
    rather than in family ground and was called Kija mnge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: If a woman disliked or quarreled with her husband, she might try to kill the
    child during delivery, and midwives might threaten or whip her to keep her in
    the delivery position.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: If the afterbirth was delayed, a piece of fiber was tied around the cord and
    the cord was cut.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: The afterbirth was called the second child and was believed to have a spirit
    that immediately became a ghost.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:20
  text: The plantain by which the afterbirth was placed was guarded because consuming
    beer or food made from it was believed to take the ghost from its clan.
  category: relationship
  evidence_refs:
  - ev:10
