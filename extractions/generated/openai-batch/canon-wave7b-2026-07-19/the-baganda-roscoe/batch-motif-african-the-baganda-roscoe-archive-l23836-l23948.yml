canonical_text:
  quote: "“you had asked me to do an impossible thing.”"
  summary: A king tries to obtain hair charcoal and tears requested by the smith Walukaga
    for forging a man, but the materials prove unobtainable. Walukaga explains that
    he named them because the king had asked for an impossible act. The passage then
    gives translated proverbs and explanations, including sayings about divine help,
    hardship, false friends, a cold grave and next world, cooperative labor, heedless
    danger, and a fragment beginning a tale about a wizard at Bubiro.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Walukaga requires hair burned into charcoal and tears used as water, saying
    ordinary charcoal and ordinary well-water are not useful for forging a man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king orders all the people to shave their heads, burn the hair into charcoal,
    and collect tears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the people obey, the collected hair charcoal is less than one load and
    the tears are less than two pots.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king tells Walukaga not to make the man; Walukaga says he demanded those
    materials because the king had asked for an impossible thing, and the people affirm
    his statement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The proverb section gives translated sayings using images of a grumbler and
    master, a sea-dweller drowning, a distant stick failing against a leopard, borrowing
    without repayment, Lubare helping one who runs, suffering and pity, reversals
    from morning to evening, prosperity attracting friends, and divided food sources
    leading to hunger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One proverb says that the god Lubare helps when a person puts forth running
    power.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A proverb and note say the grave and the next world are thought to be very
    cold, so people place barkcloths for the ghost in the grave and cover the filled
    grave with thatch or plantain leaves.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A coffee-berry proverb says a planted berry may look sound outside while rotten
    inside; the explanation applies this to a person who seems a true friend but lacks
    real regard.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A proverb says many bells on the legs make a loud sound, and the explanation
    says many people make short work of a task.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A proverb compares a careless man who ignores warning to a thin cow that continues
    eating while an axe is being sought to kill it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage begins a proverb-story about cutting a difficult knot as a wizard
    did at Bubiro, then mentions a chief whose son was said to have been killed by
    witchcraft and a man who was caught and accused.
  category: sequence
  evidence_refs:
  - ev:8
