  summary: The passage describes Baganda chieftainship as not a separate hereditary
    class, though sons of chiefs were often appointed because of training and advantage.
    It describes chiefs as respected mwami, their dependence on redistribution rather
    than stored wealth, their households and district authority, their kin and dependants,
    and the mobility of free peasants who could leave an unpopular or over-demanding
    chief.
