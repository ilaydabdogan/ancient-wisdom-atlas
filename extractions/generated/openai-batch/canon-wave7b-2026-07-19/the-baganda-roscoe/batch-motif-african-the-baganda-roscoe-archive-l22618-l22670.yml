literal_observations:
- id: obs:1
  text: Country market-places belonged to the chief on whose land they stood, and
    a private person needed permission from the King and the District-Chief to open
    a market.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: To open a new market, the King sent a man to plant a barkcloth tree, kill
    the first animal near the newly planted tree, eat a meal on the spot, sell the
    remaining meat, and declare the market open.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person bringing an animal for meat killed it himself; after inspection by
    the market-keeper, he sold the meat and paid ten percent of earnings to the market-keeper
    at night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When firewood was brought for sale, the market-keeper took one stick and also
    charged ten percent on the sale.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Along the Bunyoro frontier, Baganda and Banyoro met in markets and sold goods
