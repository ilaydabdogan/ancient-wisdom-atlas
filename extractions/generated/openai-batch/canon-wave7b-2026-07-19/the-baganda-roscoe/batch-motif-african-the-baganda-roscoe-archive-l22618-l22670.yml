  summary: 'The passage describes Baganda country markets and currency: market authorization
    by chiefs and the King, a formal procedure for opening a new market involving
    a barkcloth tree, first animal, meal, and sale of meat, market taxes and inspection,
    frontier and lakeside exchange, and a cow- and cowry-based scale of values during
    Suna''s reign.'
