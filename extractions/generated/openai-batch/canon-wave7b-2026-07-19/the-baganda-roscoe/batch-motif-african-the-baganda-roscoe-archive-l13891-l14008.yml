  quote: ''
  summary: The passage lists named chiefs and sub-chiefs and describes several Buganda
    districts. Gomba is described as formerly part of Bunyoro and sparsely settled
    after conquest. Budu is described as a wealthy conquered district retaining some
    Banyoro clan and totem features while becoming part of Buganda administration.
    Busuju is described as the district of the Kasuju, an official responsible for
    princes and princesses and involved in appointing each new king. Butambala is
    introduced as a small district whose chieftainship is hereditary in the Sheep
    clan.
  language: English
