canonical_text:
  quote: ''
  summary: The passage describes restrictions on elite wives in enclosed women's quarters,
    guarded access, escorted outings, duties of wives in cultivation, cooking, service,
    water-carrying and firewood-carrying, the organization of large households, and
    a contrast with less restricted peasant wives whose work centers on gardens, domestic
    labor, materials preparation, and craft-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wives live in women's quarters, and men may not enter without the husband's
    permission.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the capital, houses and gardens are enclosed by high reed fences, and each
    wife has her own house within the women's enclosure behind the husband's house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The entrance to the women's quarters is guarded by a trusted servant whose
    failure can be punished by death or mutilation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women of position may visit certain relations or friends only with the husband's
    consent and with a proper escort.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The King's wives may go out together with pages who clear the road, punish
    noncompliance, and may plunder markets and houses along the way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Escorts are expected to report to the husband what happened and whom the women
    spoke to while outside.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A wife's principal duties are cultivating her garden and cooking; in large
    households important wives cook in rotation with subordinate assistance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wives seldom eat with the husband unless invited; one wife dishes up the meal
    and waits upon him, while wives usually eat in their own enclosures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wives make the husband's bed, clean and renew the grass floor covering, carry
    water from the well, and bring in firewood unless servants or slaves perform this
    work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Large establishments include many wives, girls intended to become wives, and
    women from the husband's clan who guard the girls until marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The King and leading chiefs employ numbers of women to cultivate and cook
    because followers and daily guests depend on them for food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Peasant wives are described as less restricted than chiefs' wives because
    rural houses are scattered and men are often away at work or hunting.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Peasant women maintain plantain gardens, cook, help prepare building materials,
    cut and clean reeds, cut thatching grass, weed roads, carry food to the capital,
    and make baskets and mats in leisure time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Peasants seldom have more than two or three wives, and most have one; their
    wives' taboos are said to be less strictly observed than among chiefs and wealthier
    people.
  category: relationship
  evidence_refs:
  - ev:6
