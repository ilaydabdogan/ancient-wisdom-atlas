  summary: The passage describes traditions about Kintu at Magonga hill, a sacred
    original plantain, the Lion Clan’s origin account for lion and eagle totems, the
    royal animal-skin rug, the clan’s custody of the Nahibare drum, a king’s clothing
    exchange at Mukasa’s shrine before life-prolongation rites, Lion Clan restrictions
    concerning kingship and royal offspring, the clan deity Luwada, and the Colobus
