literal_observations:
- id: obs:1
  text: King Kintu is said to have first lived at the temple on Magonga hill and to
    have suddenly disappeared from there; an original sacred plantain is associated
    with the time when Kintu first came into the country.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After ascending the throne, Kintu went hunting for a lion and an eagle with
    retainers and some of his sons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the lion was killed, the chief Sabaganda flayed it, dried the skin for
    nine days, and presented the skin to Kintu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kintu placed the lion skin on the ground, stood on it before a large crowd,
    and told his children that the lion was henceforth sacred and must not be harmed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After an eagle was killed, its dressed skin was added to the lion skin, and
    Kintu told his sons that the eagle was a sacred bird and their totem.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The lion skin, eagle skin, and leopard skin formed the royal rug called kiyu,
    used by the King for State ceremonies; possession of such skins was formerly a
    royal monopoly.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lion Clan cared for the small drum Nahibare, kept and used in Kintu’s
    shrine on Magonga hill; the drum was made by Mukulu Kasiniba, given to Kintu,
    and said to be the origin of the mujaguzo drums.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Mukasa’s shrine on Nsanganzira hill, each king on the way to Nankere for
    life-prolongation ceremonies exchanged his clothes for new ones, left discarded
    clothes and anklets in the shrine, and received special new ornaments after the
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Members of the Lion Clan were not eligible for the throne; women of the clan
    could be given to the King in marriage, but their sons were strangled at birth
    while daughters were allowed to live.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Luwada, said to be a son of the god Musisi, was a deity of the Lion Clan and
    had both a medium and a priest.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Lion Clan did no work for the King in the royal enclosure because they
    were regarded as related to him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Colobus Monkey Clan claims to be among the oldest in the country, to have
    been settled there when Kintu arrived, and to have supplied Kintu’s first wife,
    Nambi.
  category: relationship
  evidence_refs:
  - ev:10
