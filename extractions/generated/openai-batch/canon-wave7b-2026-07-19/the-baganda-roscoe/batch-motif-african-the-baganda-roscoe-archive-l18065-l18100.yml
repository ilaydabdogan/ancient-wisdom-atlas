canonical_text:
  quote: there could not be two kings in the one capital
  summary: 'The passage describes pre-war arrangements for a Baganda general: divine
    representatives may accompany an expedition; the general, also called a king,
    may not sleep in the capital; he nominates an heir before leaving, prepares weapons
    and household attendants, has weapons blessed by a local deity, and proceeds to
    the army assembly place. It then describes earlier warrior dress, including skin
    garments, cat-skin aprons, and the general’s leopard-skin apron.'
  language: English
  quote_policy: quoted
