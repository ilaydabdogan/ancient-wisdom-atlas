  summary: The passage describes ritual objects and procedures associated with twins,
    the lukanda ceremony, delayed marriage permission for daughters in a twin-birth
    household, delegation of royal twin-birth taboos to Kago, and weaning procedures
    for royal boys and girls involving presentation to relatives, gifts of skins or
    barkcloth, care arrangements, gardens, and barkcloth-tree planting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seeds from the wild banana were worn, and a white fowl was kept and replaced
    if it died or was carried off during the infancy of the twins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs unable to go to war at once, but wishing to complete the lukanda ceremony,
    killed a slave, put hair in the slave's mouth, and cast the body on waste land
    for wild animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A peasant who went to war but failed to kill a man threw a bundle of hair
    into the enemy's country and returned home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Salongo's grown-up daughters who wished to marry had to wait until ceremonies
    connected with the birth of twins were ended before receiving permission.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When twins were born to the King, he appointed Kago to undertake the taboos
    for him because the King's duties prevented him from fulfilling them personally.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kago wore two barkcloths and bells on his ankles, visited the King's relations,
    and invited them to dances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The King was shaved and performed one or two ceremonies, while Kago fulfilled
    the lukanda ceremony and reported on it to the King.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the King's boys were weaned, they were taken to the King's maternal uncle
    Sabaganzi, who gave each a well-dressed skin, and then to their eldest brother
    Kiwewa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kiwewa was the eldest brother of the royal boys and was never eligible for
    the throne.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kiwewa took the weaned royal boys to their father, after which they were cared
    for by Kasiijti or Kasujii, and the King gave them an article of clothing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kasujii was provided with an attendant for the princes and had the duty of
    supplying them with gardens called barkcloth tree gardens, where a barkcloth tree
    was planted when a prince received a garden.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: When princesses were weaned, they were taken to the Queen, given small barkcloths,
