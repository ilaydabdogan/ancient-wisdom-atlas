canonical_text:
  quote: ''
  summary: 'The passage describes Baganda mortuary procedures: the corpse is laid
    on a plantain-trunk bedstead near the doorway, watched until burial arrangements
    are complete, and involved in ceremonies performed by the eldest son, widows,
    relatives, and family members. Pumpkin seeds, butter, plantain-core sponges, barkcloths,
    a family grave, and a branch from the ''tree of the dead'' appear in the funeral
    sequence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body is placed on crossed plantain-tree trunks inside the doorway, with
    the head near the door and the face arranged so it can be exposed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is usually kept no more than one day, though sometimes two days,
    and someone watches the corpse by day and by night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the kulumira mpamba ceremony, the eldest son stands on the right side of
    the body, widows stand on the left, and the dead man's face and hands are uncovered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A relative places pumpkin seeds in the dead man's hand; the eldest son removes
    them with his lips, chews them, and blows portions over the body and a childless
    widow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The childless widow becomes the eldest son's wife at once; the eldest son
    performs the ceremony but does not inherit his father's property and becomes guardian
    of the other children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Family members rub butter on the dead person's forehead and wipe their hands
    on plantain-core sponges in a ceremony called 'taking leave of the dead.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Male relatives dig the grave in the family burial-place, and the grave is
    made deep and wide because many barkcloths are placed in it for the dead man's
    comfort.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a man dies away from the family burial ground, the body may be carried
    for several days to reach the proper burial place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The grave is lined with barkcloths and supplied with more barkcloths at the
    bottom for the body to rest on.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The body is carried feet first from the house, preceded by a man called 'The
    eyes of the dead' who carries a small branch from the 'tree of the dead.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Several men stand in the grave, receive the body, and lay it down.
  category: action
  evidence_refs:
  - ev:7
