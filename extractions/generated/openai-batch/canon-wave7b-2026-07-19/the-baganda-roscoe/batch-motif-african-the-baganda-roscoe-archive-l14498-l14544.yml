canonical_text:
  quote: "“There is no one here who has killed another”"
  summary: The passage describes Baganda legal customs concerning homicide compensation
    between clans, a reconciliation meal with beer, poison ordeal procedures for suspected
    murderers and thieves, bodily punishments for theft or disobedience, and a stated
    concern with detection rather than wrongdoing.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The stated homicide fine is generally twenty cows, twenty goats, twenty barkcloths,
    and twenty women.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The offender’s clan sends him to beg from friends and clan members until he
    can raise enough to pay about a quarter of the fine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the deceased man’s clan avoid the homicide until part of the fine
    is paid; after payment they assemble, invite him to a meal, and he may move among
    them as before.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The unpaid remainder of the fine may remain for years or never be paid, and
    may later be offset against an offence by a member of the other clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the reconciliation meal, a pot of beer is brought in, the head of the murdered
    man’s clan pours a cup, speaks a formula denying that anyone present has killed
    another, and gives each person beer to drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Murderers and thieves are said to be discovered by the medicine-man through
    the ordeal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Suspected persons accused before a chief are brought before a council and
    compelled to submit to the poison ordeal if they wish to prove innocence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Death under the poison ordeal is taken as proof of guilt; no ill effects are
    taken as proof of innocence and make the accuser liable to a fine; illness without
    death may also lead to a finding of guilt, a fine, and often execution.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Petty theft and child disobedience are punished by burning the child’s hand
    or cutting off the ear, and adults may have their hands cut off for theft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that people feared detection rather than wrongdoing.
  category: attribute
  evidence_refs:
  - ev:5
