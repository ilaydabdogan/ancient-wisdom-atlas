canonical_text:
  quote: ''
  summary: Mr. Leopard repeatedly tricks Mr. Hare out of shared drink and food, then
    steals and eats a neighbour’s goat, smears the blood on the sleeping Hare, and
    causes Hare to be accused, condemned, and killed. Hare’s brother disbelieves Leopard’s
    account, consults Lubare, learns that Leopard caused Hare’s death, and demands
    repayment of a debt. Leopard proposes an island journey and instructs him to bring
    four food parcels for the lake spirit; the brother, warned of the trick, packs
    stones, cowries, and food before they drop parcels into the lake and paddle onward.
  language: English
  quote_policy: summarized
