  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In some cases priests order cleansing ceremonies; after purification by medicine-men,
    a slave and a goat are sent back to the frontier and maimed so they cannot return
    to Uganda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The general sends nine slaves, nine cows, and nine goats to the war-god Kibuka
