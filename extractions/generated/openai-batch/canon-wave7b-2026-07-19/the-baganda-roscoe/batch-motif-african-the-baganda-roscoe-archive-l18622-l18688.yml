canonical_text:
  quote: ''
  summary: 'The passage describes post-war and war-absence rites among the Baganda:
    a victory feast and burning of a spear-shaft, purification before spoil enters
    the capital, offerings to war-gods, frontier scapegoat expulsion, a reed-and-grass
    ceremony involving a warrior''s principal wife, taboos during a punitive expedition,
    chastity testing, and a return feast followed by household cleansing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son returns home with a cow, goat, and fowl; he kills the goat and fowl
    and calls friends to a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spear-shaft is solemnly burned in the friends' presence as a token that
    the son has killed ten men in battle.
  category: action
  evidence_refs:
  - ev:1
