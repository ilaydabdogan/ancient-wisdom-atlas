canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Hare tale in which Hare feeds and deceives
    animal messengers, uses a rolling stone to kill them, is exposed by Leopard, escapes
    by crossing a river and lying, and Leopard returns to find Elephant dead. It then
    begins a tale of Ndyakubi and Ndalakubi, blood-brothers whose reciprocal visits
    involve excessive hospitality demands: first impossible quantities of food, then
    impossible sleeping space.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hare gives Bushbuck meat from Elephant and says it comes from a hill-place
    frequented by that kind of animal; Bushbuck proposes that they go hunt there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hare tells Bushbuck to keep his head in when the rumbling is small and to
    put it out when it is loud; Bushbuck follows this advice and is killed by a rolling
    stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Bushbuck dies, Hare carries the body home, cooks it, and eats it; the
    passage says he does this daily with messengers sent by Elephant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Elephant sends Leopard; Hare gives Leopard the same proposal and advice he
    had given Bushbuck, but Leopard keeps his head in until the rolling stone passes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Leopard pretends to be dead; Hare carries him home and prepares to cut him
    up, but Leopard jumps up and accuses Hare of killing the foolish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hare flees from Leopard, crosses and immediately recrosses a river, and is
    not recognized by Leopard because he is wet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wet Hare tells Leopard that people have been hunting the King's leopards
    and have caught ten; Leopard runs back to Elephant and finds him dead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ndyakubi and Ndalakubi make blood-brotherhood, and Ndalakubi invites Ndyakubi
    to visit him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: During Ndyakubi's visit, Ndalakubi's wife cooks increasing amounts of food,
    including enough for five men and then enough for a hundred men, but Ndyakubi
    still says he is not satisfied.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When Ndalakubi says all his food is finished, Ndyakubi says he must go hungry
    and die by the roadside from starvation.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Later Ndalakubi visits Ndyakubi; Ndyakubi provides his bedstead, removes a
    house-post, and has reeds brought to extend the house because Ndalakubi says there
    is not enough room for him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ndalakubi repeatedly says his feet are still outside and that wild animals
    will eat him; he compares this to Ndyakubi's earlier complaint after eating all
    the food provided.
  category: speech
  evidence_refs:
  - ev:12
