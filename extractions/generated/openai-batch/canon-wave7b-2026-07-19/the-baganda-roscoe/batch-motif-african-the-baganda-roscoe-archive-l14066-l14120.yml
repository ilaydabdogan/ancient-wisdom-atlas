  summary: The passage describes Baganda governmental organization around royal servants,
    district tax and labour obligations, and the King’s reception-hall or Lukiko as
    the highest court where chiefs gathered, appeals were heard, messages were exchanged,
    and the King entered by a private door to sit on a dais with royal coverings,
    sometimes accompanied by favored wives and sisters.
