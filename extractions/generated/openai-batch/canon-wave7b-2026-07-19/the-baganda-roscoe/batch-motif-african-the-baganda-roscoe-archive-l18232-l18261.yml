canonical_text:
  quote: ''
  summary: In the general's camp, fetiches sent by the King with the army are placed
    before the general's hut and treated as a guarded boundary. Chiefs arrive with
    followers, take an oath of allegiance to the general, and receive assigned places
    in camp and marching order. Huts are built according to rank, retainers position
    themselves to protect their chiefs, and the general may send a runner to the King
    for reinforcements. The passage begins to note that kings formerly commanded the
    army personally.
