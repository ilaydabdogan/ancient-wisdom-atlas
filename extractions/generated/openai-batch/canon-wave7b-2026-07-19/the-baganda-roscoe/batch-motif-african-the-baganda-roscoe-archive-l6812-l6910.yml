literal_observations:
- id: obs:1
  text: Kintu is described as a powerful ruler who invaded and conquered the land
    and incorporated the clans into one nation under his government.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Muganda, when asked about descent, is said to answer that he is descended
    from Kintu and can give an account of his forefather, clan estates, and clan history.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Clan members were buried on clan estates, and a clan member tended the graves
    in return for land around them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One tradition says that in Kintu's reign the nation lived by hunting and that
    animal scarcity led Kintu, with general consent, to make certain animals taboo
    to certain families.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The animal species tabooed to one family were left to other families and were
    thereby given a better chance to multiply.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each family abstained from the particular animal of which they had eaten with
    ill results, and that animal became their totem.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Certain clans marked with {a) were not allowed to present a prince as a candidate
    for the throne; a child whose mother belonged to such a clan was barred from the
    throne.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Male children born to the king by women of the marked {a) clans were usually
    killed at birth, while girls were allowed to live.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Members of some restricted clans gave daughters to allied clans so that the
    daughters could be presented to the king as members of the allied clan and their
    children could be eligible for the throne.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Clans marked with {b) joined other clans to improve status or to gain access
    to royal marriage; they could use the other clans' totem names but were not treated
    as blood-relations and could intermarry with those clans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The list names clans and their primary and secondary totems, including leopard/genet,
    lion/eagle, colobus monkey/small monkey, otter/genet, grasshopper/locust, civet
    cat/frog, elephant/hippopotamus, lung-fish/small fish, mushroom/snail, manis or
    pangolin/mushroom, and sheep/lion.
  category: object
  evidence_refs:
  - ev:6
