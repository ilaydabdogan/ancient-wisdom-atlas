  quote: ''
  summary: The passage describes Kintu as a powerful first king who incorporated clans
    into one nation, explains clan descent, estates, and grave-tending, gives a tradition
    for the origin of clan animal taboos and totems, describes royal succession restrictions
    associated with certain clans, and begins a list of clans with primary and secondary
    totems.
  language: English
