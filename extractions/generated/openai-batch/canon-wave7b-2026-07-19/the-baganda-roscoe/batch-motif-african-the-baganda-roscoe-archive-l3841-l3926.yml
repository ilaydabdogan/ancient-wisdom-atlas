canonical_text:
  quote: ''
  summary: 'The passage describes Baganda ceremonies connected with the parents of
    twins: ritual visits to grandparents and kin, exchange of food and gifts, dances
    and offerings to the twins, beliefs in blessing from Mukasa, a cleansing rite
    after sexual misconduct during dances, and later rites involving offerings to
    the god, a hair bundle used in battle, renewed shaving and feasting, and an exchange
    of beer with the King before the father returns to ordinary status.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger announces the visit to Salongo's parents, who prepare to receive
    their son, the twins, and the accompanying party.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The twins and their parents travel with a large party using drums and songs;
    Salongo's father decorates his house and approaches with palm leaves and prepares
    much food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On arrival, Salongo drives a goat into his father's house in the early morning
    before his parents come out to receive him and the twins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The families exchange barkcloths; the twins' parents receive a goat, which
    is killed for the feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The grandmother receives each twin, nurses them, and gives cowry-shells; later
    visitors put cowry-shell offerings into a basket for the twins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Nalongo presents food to her parents-in-law, they present their own food in
    return, and Salongo's father offers her a piece of food as to an honoured guest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Dancing continues until evening, after which the parents return home with
    the twins and the taboo upon father and son ends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: After rest, the parents prepare more food and presents and visit Nalongo's
    parents with similar ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: After fulfilling obligations to grandparents, the parents take the twins on
    visits to relations and friends, and offerings are made to the twins at dances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage reports a belief that Mukasa favours parents of twins and dispenses
    blessing through them wherever they go.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Those visited are said to expect blessing, children, and multiplication of
    herds and crops.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Offerings are made daily by the parents of the twins to the god, and people
    whom they visit also send offerings to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: The songs at the dances are described as obscene, and the passage says there
    is often promiscuous intercourse during night dancing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Women who participate in such intercourse must undergo the kukansira cleansing
    ceremony, otherwise children are said to become ill or die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: In the kukansira ceremony, a medicine-man mixes some of the woman's urine
    with medicines and rubs it on her chest and the chests of her children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: When the dances end, Salongo goes to the god in person with a goat, beer,
    cowry-shells for the twins, and the cowry-shells given during the dances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: To finish the liikanda or Inkanda ceremony, Salongo takes a bundle of hair
    into battle in Bunyoro and must kill a man, placing the hair in the man's mouth
    or tying it to his neck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: After Salongo returns, dancing, feasting, shaving of both parents, and visits
    to the grandparents are repeated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: Salongo then presents a pot of beer to the King and receives the same from
    the King; Kago may sometimes complete this ceremony for the King.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: After all rites are performed, the father of the twins stops wearing distinctive
    dress and becomes an ordinary person again.
  category: sequence
  evidence_refs:
  - ev:9
