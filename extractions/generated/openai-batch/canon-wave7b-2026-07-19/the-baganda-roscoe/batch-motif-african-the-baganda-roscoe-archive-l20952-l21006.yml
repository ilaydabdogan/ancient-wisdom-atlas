canonical_text:
  quote: ''
  summary: 'The passage describes Baganda customs concerning cows, calves, milk, and
    milk vessels: restrictions after a cow has calved, a first-milk cake shared by
    herdsmen, calf care practices, dietary taboos for milk drinkers, first butter
    used on fetiches, prohibitions on boiling milk, and washing and smoking milk vessels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For the first four days after a cow calved, family members were not allowed
    to drink its milk; the milk was left for the calf, and the owner's wife was not
    allowed to cultivate the garden during that time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the cow was milked again for the first time, the herdboy took the milk
    to a place in the pasture and showed the cow and calf to fellow herdsmen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The herdboy slowly boiled that milk until it became a cake, and he and his
    comrades ate the milk cake together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the calf was unhealthy and the fellow herdsmen blamed the herdboy, they
    scolded him and could flog him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A calf was kept in the house during the day and went without nourishment until
    its dam returned in the evening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a calf was old enough, it was turned out of the house and roamed nearby
    during the day while the cows were taken farther away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When men travelled with a cow and calf, they smeared the cow's teats with
    dung to prevent the calf from sucking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The floor of the room where a calf was kept was strewn with grass litter,
    which was taken out daily to dry in the sun.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A person who drank milk was not allowed at the same time to eat beans or sugar-cane,
    drink beer, or smoke Indian hemp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A milk drinker fasted for several hours before eating or drinking the tabooed
    items, and also avoided milk for a similar period after consuming them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The first butter churned from a cow's milk after its calf was born was used
    to smear fetiches and was not used on the body or in cooking.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Boiling milk was generally not permitted except in the described post-calving
    case; it was thought that boiling milk would cause the cow's milk to cease.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Adults drank milk curdled or clotted, while fresh milk was given to young
    children and infants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Milk vessels were washed with water and smoked over a cow-dung fire with sweet-smelling
    grass, giving the vessels a particular odour.
  category: action
  evidence_refs:
  - ev:7
