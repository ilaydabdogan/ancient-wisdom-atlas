  quote: ''
  summary: The passage lists named kinds of barkcloth trees by district, then describes
    their easy propagation, growth conditions, use for barkcloth, and associated household
    labor responsibilities. Men plant and cultivate the trees and make barkcloth;
    wives feed husbands, while husbands provide clothing, garden access, and a hoe.
    Barkcloth is used for clothing, bedding, and house-wall draping.
