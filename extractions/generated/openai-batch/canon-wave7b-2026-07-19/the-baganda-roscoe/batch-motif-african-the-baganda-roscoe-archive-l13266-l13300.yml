  summary: 'The passage describes royal taxation and tribute: tax-collectors correct
    missing amounts under Katikiro instructions; chiefs, sub-chiefs, the King, and
    high-ranking figures receive portions; tributary states pay goods through chiefs;
    and the King periodically sends messengers to collect boys and girls for the royal
    enclosure.'
