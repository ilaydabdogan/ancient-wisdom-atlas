canonical_text:
  quote: ''
  summary: 'The passage describes the return from a Baganda military expedition: the
    danger of enemy capture of fetiches, the general recalling the forces, royal messengers
    and the King''s sanction, first-fruits of victory sent to the capital, reports
    of success or failure, division of captives and spoil by royal representatives,
    disbanding, public welcome, and the army appearing before the King near the sacred
    fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed captured man who had hidden fetiches before capture would try to
    escape, retrieve them, and carry them back to the temple; enemy capture of fetiches
    was regarded as a dreadful calamity.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the general judged that enough spoil had been obtained, he beat drums,
    recalled the forces and looting parties, and began the return march.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dead were not customarily mutilated, but people sometimes cut away the
    private parts of corpses and placed them beside the road to intimidate the enemy
    and warn that no quarter would be given.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A special messenger known for speed and endurance was sent to the King to
    report the expedition, captives, cattle taken, and losses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After crossing the frontier, the general had to wait for a messenger bringing
    the King's sanction before the army could return to Uganda.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another messenger was sent to the King with a cow for every hundred cows captured,
    one slave for every hundred slaves taken, and spears according to the number of
    enemies killed; these were called the first-fruits of victory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead were generally left undisturbed after battles so that relatives could
    come at night and carry them away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If an expedition failed, the general hurried to the King to explain the failure
    and try to clear himself of disgrace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the army was safe in Uganda, the general sent another detailed report
    to the King describing the expedition and each person's conduct; bravery was recorded
    and cowardice exposed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The messenger first presented himself to the Katikiro, who took the report
    to the King; the King then heard the messenger and conferred with the Katikiro
    and the Kimbugwe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Representatives of the King, Queen, King's Mother, Katikiro, and Kimbugwe
    met the army and divided captives and spoil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Distinguished chiefs received shares of spoil, exceptionally brave warriors
    received women or cattle, and peasants hid some items for themselves.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the spoil was divided, the general ordered chiefs to disband their men;
    important chiefs accompanied him to report to the King, unless there had been
    a reverse.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: People lined the roads to welcome the army; women ran to meet their husbands
    with gourds of water, took their weapons, and carried them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Warriors dashed at imaginary foes while drums, fifes, and victory songs accompanied
    the leaders toward the space before the royal enclosure.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When ready to receive the army, the King came out and sat near the sacred
    fire before the palace gate; the general and warriors appeared before him in war-dress.
  category: setting
  evidence_refs:
  - ev:10
