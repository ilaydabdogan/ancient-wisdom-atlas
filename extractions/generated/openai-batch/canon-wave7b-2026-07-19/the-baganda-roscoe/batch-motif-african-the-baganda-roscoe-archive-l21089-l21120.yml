  quote: ''
  summary: 'The passage describes cattle-keeping practices: animals were bled for
    feasts and the blood cooked with fat; favourite cows might wear bells; a sheep
    was herded with cows because it was believed to promote health and protect from
    lightning; a cow with twin calves received a bell and creeper necklet; herdsmen
    were described as stealing animals and substituting calves.'
