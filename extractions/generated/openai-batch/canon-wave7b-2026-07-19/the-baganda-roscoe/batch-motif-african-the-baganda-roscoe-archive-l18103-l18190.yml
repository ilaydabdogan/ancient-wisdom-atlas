canonical_text:
  quote: ''
  summary: The passage describes Baganda military authority, a general's dress and
    weapons, army provisioning and march arrangements, and departure rites in which
    a warrior and wife exchange necklaces, make offerings to fetiches and gods, observe
    protective taboos, and associate the wife's conduct with the warrior's safety
    in battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The general had powers of life and death in the army, while the king held
    him responsible if an expedition failed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The general's later dress included breeches, a flowing garment, a cat-skin
    apron, a helmet-shaped plantain-fibre head-dress with black and white plaiting,
    red parrot-tail feathers, and breast designs painted with red, white, and grey
    clays.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The general carried throwing spears, a heavy spear, a shield with fetiches
    inside it, and additional fetiches on his left shoulder.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before a war expedition, a warrior might resharpen weapons and visit the clan
    god to ask blessing upon the journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The general assigned different roads to chiefs so that warriors would not
    all pass through and impoverish one district.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chiefs brought food for the march beyond the frontier, while common troops
    obtained food by plundering enemy gardens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Warriors commonly took things found on the route, even in their own country,
    causing owners to hide domestic animals.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A chief appointed a steward to handle private business during his absence,
    and a peasant entrusted wife and children to a friend or relative not going to
    war.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A warrior's wife accompanied him a short distance at dawn, carrying his shield
    and spears, while he wore war-apparel and war-paint.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the roadside farewell, the wife knelt, handed over the weapons, exchanged
    necklaces with her husband, and committed him to the care of the gods.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the farewell, the wife plucked grass from the place of parting and kept
    it under the house carpeting near the main post until her husband returned.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The wife's received necklace was placed with the fetiches, and each day she
    offered a little beer and prayed for her husband's protection.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The warrior's friend advised the wife on offerings to bring so that he could
    take them to the priest for intercession on the warrior's behalf.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Neglect of the wife's ritual duties or her unfaithfulness was believed to
    cause the husband to fall or be wounded because the gods withdrew favor and protection.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The husband fastened his necklace inside his shield with his fetich; it was
    expected to protect him and strengthen his arm in battle.
  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: If the wife never menstruated, the husband scratched her with his spear enough
    to draw blood, which was said to ensure his safe return.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: From parting until after the first battle or until spoil was taken, the warrior
    observed chastity; neglect was said to endanger home, children, wife, and expedition.
  category: action
  evidence_refs:
  - ev:17
