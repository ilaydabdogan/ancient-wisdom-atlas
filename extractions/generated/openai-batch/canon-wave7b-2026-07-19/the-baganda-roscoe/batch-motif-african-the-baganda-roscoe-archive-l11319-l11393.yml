canonical_text:
  quote: ''
  summary: The passage describes offices, duties, tribute, and food arrangements in
    the Baganda royal enclosure. It focuses especially on the Kauzumu, a royal relative
    whose office involved performing certain ceremonies and taboos for the king, restoring
    royal wives after mourning or replacement through jumping-over gestures and a
    goat-liver rite, and on royal household provisioning through tribute, firewood,
    cooks, and daily food sent by royal women.
  language: English
  quote_policy: summarized
