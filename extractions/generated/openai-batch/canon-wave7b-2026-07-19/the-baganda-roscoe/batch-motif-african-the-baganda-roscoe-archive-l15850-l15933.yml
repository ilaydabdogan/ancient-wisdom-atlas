canonical_text:
  quote: ''
  summary: 'The passage describes rituals and institutions connected with Mukasa:
    blessings for fertility, twins, kings, cattle, crops, fishing, and water travel;
    new-moon rest; royal consultations and divine visits mediated by priests and a
    medium; annual fish offerings to the king; boatmen''s supplications; and the dedication
    of children and slaves to the god''s temple estate.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mukasa is described as giving blessings connected with wives, children, cattle,
    crops, and especially twins granted to certain women.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At each new moon there was a week of rest, daily sounding of a drum, minimal
    work, and a prohibition on cutting firewood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A new king sent to Mukasa for a blessing when he ascended the throne, and
    a thank-offering was sent after a successful punitive expedition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During sickness in the royal enclosure or plague in the country, a messenger
    was sent to Mukasa to find the cause; if the king was ill, Mukasa and the gods
    were expected to restore him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king sometimes invited the gods to the capital or to an appointed meeting
    place, requiring special houses for the gods, their followers, and sometimes the
    king and his retainers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the king's audience-chamber, representatives of each god met the king;
    the medium held the king's umbilical cord when about to give an oracle for the
    god.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Once a year Mukasa sent the king offerings described as fruits of the lake,
    consisting of fish of every kind, collected through messengers and island chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fish-bearing party processed before the king, sang, moved their arms as
    if paddling a canoe, carried offerings on their heads, set the fish before the
    king, knelt, and delivered the god's message.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mukasa is described as god of the lake who controlled storms, increased fish,
    and gave safe water passages; boatmen sought his blessing and called to him during
    storms through priests of inferior temples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Childless women made vows to give Mukasa a child if he caused them to become
    mothers; fulfilled vows involved presenting the weaned child to the priests, naming
    the child after the god, and raising the child among temple slaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Slaves presented to the god were regarded as his children and were subject
    to divine permission, mediated through the medium, for removal, marriage, and
    assignment on temple estates.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
