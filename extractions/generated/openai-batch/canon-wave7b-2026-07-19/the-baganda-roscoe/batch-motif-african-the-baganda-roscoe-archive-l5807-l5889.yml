canonical_text:
  quote: ''
  summary: The passage describes Baganda funerary customs for the Namasole, the King's
    wives, princesses, and chiefs, including embalming, succession to offices, grave
    guardianship, differentiated burial places, house destruction after royal women's
    deaths, contested jawbone removal, mourning practices, ghost appeasement, and
    preparation of a chief's body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the body of the late Namasole was embalmed, the new Namasole sent her
    Kago to wrap it in buttered barkcloth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The late Namasole was interred on the hill where the King's mother had lived,
    and the new Namasole had to live there to guard the umbilical cord and maintain
    the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King ordered the whole country to attend the funeral, and the office of
    Namasole was not allowed to lapse; the clan had to find a successor whenever a
    Namasole died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When important wives of the King died during his lifetime, their clan appointed
    a successor who performed the ceremony of covering the dead woman's face before
    removal, embalming, and burial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A King's wife who was a mother was buried at Fuvu or Lugi on Kyebando hill
    in Busiro, while a childless wife was buried in one of the gardens behind the
    royal enclosure.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Graves of royal wives were guarded or tended by appointed persons, and the
    graves were made as mounds thatched with grass.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage says there were no human sacrifices for any of the King's wives
    at death except for the Queen.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The house in which the Queen, King's Mother, or one of the King's wives died
    was destroyed; materials could be reused for lesser buildings, but the central
    ceiling ring had to be destroyed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a princess died, her body was embalmed and a young princess became successor
    to the deceased and fulfilled the taboos.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mourning for a princess was delayed until a prince died; the princess's body
    could wait several months, and princes and princesses were buried in family burial
    grounds in Busiro.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Queen and the King's Mother did not have the burning log ceremony performed
    at their deaths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage reports disagreement over whether the jawbones of the King's Mother
    and princesses were removed and kept.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: When a chief was dying, his wives, clan members, and many friends crowded
    into his room and watched for his death.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the chief's death was confirmed, wailing began; women called on the
    deceased to return, and many wives beat their breasts to pacify the ghost.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The dead chief's eyes were closed, hands crossed on the chest, legs straightened,
    toes tied, body washed, and body wrapped in barkcloth; a middle wall of the house
    was cut out and used as a support for the body.
  category: action
  evidence_refs:
  - ev:8
