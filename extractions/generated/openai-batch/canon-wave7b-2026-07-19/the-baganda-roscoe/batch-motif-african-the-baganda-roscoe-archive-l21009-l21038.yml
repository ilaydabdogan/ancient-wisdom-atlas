canonical_text:
  quote: ''
  summary: The passage describes rules and practices around Baganda milk, milk-vessels,
    cows, calves, and herdsmen. Smoke-flavoured milk is preferred; some milk preparation
    and vessel materials are considered dangerous to cows; menstruous women are barred
    from milk-vessels and milk. Calves are kept with cows, and when a calf dies, herdsmen
    use its skin and scent to induce the dam to yield milk.
  language: English
