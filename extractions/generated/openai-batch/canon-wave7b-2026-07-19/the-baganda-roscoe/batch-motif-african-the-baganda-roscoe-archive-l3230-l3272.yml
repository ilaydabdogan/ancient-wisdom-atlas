canonical_text:
  quote: ''
  summary: The passage describes clan-specific childbirth customs among the Baganda,
    including treatment of the afterbirth, midwife compensation, the meaning of the
    umbilical cord falling off, postpartum washing, controlled viewing of the newborn,
    examination for skin disease marks, and sanctions for suspected pregnancy-taboo
    violations. It also comments on nursing time, polygyny, and reported family size.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Genet Clan, the afterbirth was hung on plantain leaves and left there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Grasshopper Clan, the afterbirth was buried in the house, with different
    locations specified for a boy and for a girl relative to the fireplace, wall,
    and doorway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The midwife in each clan was given a goat or barkcloth and one hundred cowry
    shells for her services.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Grasshopper Clan, when the child’s cord dropped off, the mother announced
    it, and the child was provisionally accepted as legitimate until a later final
    testing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A plantain tree where the child’s excretions were thrown was guarded by the
    husband’s mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the wife was allowed to go out and wash, she also had to wash her husband
    before he ate food she cooked, and after the meal he jumped over her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Clan members could see the child after the mother had performed the washing
    ceremony; before that, only the midwife saw the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband’s clan examined the child thoroughly, especially for marks of
    skin disease.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Skin disease marks on the child were taken as signs that the mother had broken
    pregnancy taboos, and in some cases she was beaten for this.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that extended nursing time may have reduced the number
    of children a woman could have, although women married young and some had large
    families.
  category: other
  evidence_refs:
  - ev:7
