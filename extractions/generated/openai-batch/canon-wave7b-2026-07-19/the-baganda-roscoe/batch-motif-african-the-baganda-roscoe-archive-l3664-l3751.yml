canonical_text:
  quote: ''
  summary: 'The passage describes Baganda ceremonies following the birth of twins:
    clan dances and drums, restrictions on the father and mother, shared food vessels,
    the father''s visits with twin symbols, the fixing of a naming day, a ritualized
    night theft of plantains from the Mutaka''s garden, feast preparations, taboos
    around the mother Nalongo, divine sanction by Mukasa, the grandfather''s barkcloth,
    and the Mutaka''s pre-dawn opening of the house door.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the twins were named, the father was under restrictions about meeting
    certain female relatives, while clan members arranged dances and kept drums going
    for the birth of twins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One drum marked the mother's bathing, nursing, and meals, and another drum
    announced the husband's movements within the enclosure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father and mother were each supplied with a basket and a gourd, and the
    husband carried these vessels and put portions of food or drink in them for his
    wife because all their food had to be shared.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that if the parents' food was not shared, it was thought
    the children would suffer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father made a long round of visits to his clan, his wife's clan, and friends,
    leaving a tuft of plantain-fibre in houses; the inmates stored it and called it
    "The twins."
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During these visits the father carried two spears, one iron and one wooden,
    tied together to represent twins.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father's person was described as sacred, untouchable, and under the protection
    of a god, and two special twin drums accompanied him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A medicine-man was asked to fix the day on which the twins could be brought
    out and named.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the day was fixed, the father and mother went secretly by night with
    friends to steal plantain bunches from the garden of the man who held the office
    of Mutaka.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wife had to choose a plantain kind used as a vegetable, while the husband
    had to choose a kind used for making beer; the fruit had to be not fully ripe
    and still have the flower stem attached.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The companions thumped the plantain tree with their elbows before the fruit
    was cut.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After cutting the plantains, the party sang that they had cut the plantain
    with their elbows and ran away while the garden owners chased them; anyone caught
    paid a fine of one hundred cowry-shells.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The plantain flowers were placed over the door of the house, and the plantains
    were kept for the feast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Relatives and friends prepared and brought cooked food and meat, some built
    huts around the house, danced daily, and helped gather and cook food for the feast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Leaves used to wrap uncooked plantains were tied to the fence enclosing the
    back premises.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: During the ceremonies the mother, called Nalongo, was not allowed to go out
    during the day without covering her head.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Reported explanations for the mother's head-covering rule include preventing
    her from being seen by a man and preventing her from gazing on the sun; if she
    gazed on the sun, it was believed the earth would be burnt up.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Any indiscretion by the mother was thought to be visited by the god Mukasa
    upon the clan.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: The grandfather of the twins wore a strip of the barkcloth that his son had
    worn when the twins were born until the final ceremony was performed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: On the day for bringing out and naming the twins, the Mutaka came before daybreak
    and kicked open the door.
  category: action
  evidence_refs:
  - ev:11
