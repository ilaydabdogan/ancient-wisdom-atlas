canonical_text:
  quote: ''
  summary: The passage describes Baganda house fittings, temporary huts, a formal
    ceremony for entering a new house with feasting, fetiches, offerings, fireplace
    consecration, and royal tree libations, followed by a tradition about the introduction
    of iron hoes and weapons from Bunyoro through Prince Kimera.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In country houses, separate gravel-filled pits could be dug inside for a husband
    and wife to use at night because people feared going outdoors due to wild beasts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the capital, chiefs and often peasants used plantain-leaf vessels that
    were thrown away in the plantain grove each morning.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some bedsteads were fixed frames with posts, forked tops, cross-pieces, and
    cowhide lacing; before King Suna's reign, people used a beaten-earth dais covered
    with grass and barkcloths.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Temporary huts for journeys or war were made from green sticks set in a circle,
    bent inward, tied, and thatched with grass, and could be built quickly when materials
    were available.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A formal ceremony preceded entry into every new house: the owner made a feast,
    invited friends, the priest came with fetiches, and pillars were decorated with
    flowers and creepers.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cooked plantains in their skins were placed by the main pillars as an offering
    to the god, and beer was poured on the floor where the fetiches were to be kept.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The kitchen fireplace was consecrated to the god, medicine was sprinkled over
    it, and the wife had her fetich Namere inserted in the fireplace so that cooked
    food would be good and agreeable to her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The King and chiefs also held a feast for the workmen who had helped build;
    another observed act was that the owner jumped over the wife who was to live in
    the house when entering it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the King entered a new enclosure, trees representing various gods were
    planted before the principal gate, and beer was poured at each tree root; this
    drink-offering could be repeated to conciliate a particular god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The master sat inside the doorway on the side where the door opened, and another
    person sitting there would have been considered an encroachment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says ironworking was known in early times; the hoe appeared to
    be the first implement and the spear the first weapon, and some people thought
    these came first from Bunyoro.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: A Baganda tradition says Prince Kimera sent the first weapons and hoes into
    Uganda while he was in Bunyoro; before that, hoes were cow ribs attached to sticks
    and spears were pointed sticks.
  category: speech
  evidence_refs:
  - ev:6
