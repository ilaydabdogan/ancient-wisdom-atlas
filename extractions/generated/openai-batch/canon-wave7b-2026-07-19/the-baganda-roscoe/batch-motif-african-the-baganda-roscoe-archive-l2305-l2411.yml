canonical_text:
  quote: ''
  summary: 'The passage describes Baganda musical practices, including hunters'' horns,
    songs for paddling, and canoe-men performing for the King. It then describes ways
    of reckoning time: regnal periods, wars and royal residences, rain and drought
    seasons, lunar months, sunset-to-sunset days, named parts of the day, meals, and
    work-rest pipe breaks.'
  language: English
  quote_policy: summarized
