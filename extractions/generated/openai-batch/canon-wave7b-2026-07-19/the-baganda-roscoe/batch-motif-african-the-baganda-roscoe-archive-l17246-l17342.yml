canonical_text:
  quote: ''
  summary: The passage describes Baganda amulets used for disease prevention and fecundity,
    then describes sacrificial places where gods were said to command human sacrifices,
    the King received instructions, victims drank medicated beer, oracles assigned
    victims to places, and police and executioners captured, guarded, extorted, and
    conducted victims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medicinal amulets were retained, decorated, and worn as ornaments after healing,
    so they remained available if symptoms returned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The charms were used chiefly to prevent disease and were regarded as able
    to avert the evils they had originally treated.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An amulet called Luzalo was designed to ensure fecundity and consisted of
    wood, sometimes sewn into a small cat-skin bag, decorated with cowry shells, and
    worn at the front of the waist.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other fecundity amulets were small packets of powdered herbs worn by women
    around the waist; some powder was mixed with water and drunk from time to time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Special places called Matambiro were used for human sacrifices offered at
    the command of the gods.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each sacrificial place had its own usages for putting victims to death, and
    certain gods controlled the places and informed the King when and where victims
    were to be sacrificed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: There were thirteen sacrificial places, each with a custodian, and some also
    had temples with priests and retinues.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At each place the custodian kept a large pot, usually with several mouths,
    filled with medicated beer for sacrificial victims to drink.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each victim had to drink the beer because it was considered to give the King
    control of the victim's ghost and prevent it from returning to haunt him or his
    people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Victims could be offenders who had been put into stocks or innocent people
    caught on main roads to the capital by order of the gods to complete the required
    number.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After arrest, victims were guarded by police; the King sent to Kibuka or Nende
    to say the number was complete, and one prisoner was usually sent to plead for
    the whole group.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An oracle delivered through a medium gave the number of victims for each sacrificial
    place, after which the King ordered executioners to conduct them there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Executioners sought the office because they could extort goods from victims
    by promising delay, sparing, or less painful killing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The party conducting prisoners plundered, captured additional people unless
    rewarded, enslaved women, and caused people to flee from its route.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Sometimes a god secretly warned the King to capture a particular person and
    others to prevent rebellion; roads were guarded, and people with a god-indicated
    mark such as an eye cast or unusual dress were caught by police.
  category: sequence
  evidence_refs:
  - ev:9
