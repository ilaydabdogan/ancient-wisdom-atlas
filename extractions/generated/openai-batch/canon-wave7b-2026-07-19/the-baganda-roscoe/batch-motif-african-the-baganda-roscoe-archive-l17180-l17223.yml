canonical_text:
  quote: ''
  summary: The passage describes beliefs about fetiches used in battle, poison ordeal,
    and theft; a feast made to a fetich with fowl, beer, and blood; the Zinga fetich
    used by thieves for invisibility and sleep-inducing entry; and amulets distinguished
    from fetiches as chiefly medicinal portable objects made or sold by medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warriors were said to believe that a fetich waved before an enemy could make
    the enemy powerless to strike while strengthening the owner and making his aim
    effective.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a poison ordeal, the fetich was thought to help its owner complete the
    test and to sap the courage of the antagonist.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The owner occasionally made a feast to the fetich with a fowl and beer; the
    fowl’s tongue was slit alive, its blood dropped on the fetich, and the bird was
    then killed, cooked, and eaten by the owner and friends in the fetich’s presence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sling for carrying the fetich was made from a strip of skin from a black
    goat or a gazelle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fetich Zinga was used by thieves and was described as a round object with
    a central hole, usually made of clay mixed with other ingredients and stitched
    in a leather case.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A thief was said to take the Zinga by night and sit on it near the house he
    intended to enter, becoming invisible to the people he meant to rob.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The thief then stood near the door and blew through the hole in the Zinga,
    which was expected to make the occupants sleep soundly so he could enter and steal
    without being seen or heard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Amulets called Nsiriba are distinguished from fetiches called Mayembe because
    the amulets were said seldom to possess supernatural powers and were used chiefly
    for medicinal purposes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Amulets were carried or worn on the person, sometimes becoming ornaments after
    their original purpose ceased; medicine-men sold them, and many were compact forms
    made from wood or herbs.
  category: attribute
  evidence_refs:
  - ev:5
