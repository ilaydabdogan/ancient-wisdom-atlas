  quote: ''
  summary: 'The passage introduces folklore in Uganda as serving explanatory and moral
    purposes. It then begins the Legend of Kintu: Kintu comes to Uganda, finds no
    food, brings one cow, and lives on what the animal supplies. Nambi comes to earth
    with her brother, sees Kintu, falls in love, says she wishes to marry him, and
    then returns with her brother to her people and father.'
