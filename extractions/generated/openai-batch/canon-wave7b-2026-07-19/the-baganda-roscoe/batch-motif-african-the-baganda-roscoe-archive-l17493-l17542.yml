canonical_text:
  quote: ''
  summary: 'The passage describes several named execution or sacrificial places and
    their procedures: burning or starvation of princes, executions at Namugongo involving
    a temple medium, sacred beer-pot, doctored beer, sacred fire, and firewood; executions
    at Mutukulu beside Lake Wamala involving doctored beer, binding, spearing, and
    water; royal detention and execution at Kubamitwe after a possible reprieve interval;
    and dispatch of incest offenders to Ekulu Tuyana.'
  language: English
  quote_policy: summarized
