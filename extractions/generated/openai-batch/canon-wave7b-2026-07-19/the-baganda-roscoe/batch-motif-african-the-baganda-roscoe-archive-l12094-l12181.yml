canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the reigns of Ndaula, Kagulu, Kikulwe,
    and Mawanda: a killing that restores Ndaula''s health; Kagulu''s violent rule,
    rebellion, and drowning; Kikulwe''s retaliation against a clan and failed pit-trap
    against Mawanda; Mawanda''s accession, military activity, rewards to the Rat Clan
    for preserving his pregnant mother, and an interrupted summons by Kintu''s ghost.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ndaula killed Siroganga after Siroganga betrayed the king's hiding-place;
    the killing fulfilled a medicine-man's conditions, and Ndaula was restored to
    health.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ndaula lived to a great age, was buried at Merera, and had a temple built
    on Musaba hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kagulu, son of Ndaula, succeeded his father as king.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kagulu killed Musanje Goloba, his half-brother, after Musanje had injured
    Luyenje in wrestling so that Luyenje died.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kagulu killed the Mugema Sentongo, although the Mugema's person was held sacred
    and even deposition of him was considered a serious offence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kagulu made spiked ring-chains called mats and ordered visitors or litigants
    to kneel on them; displeasing greetings or failure to prostrate could lead to
    spearing to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: People refused to visit Kagulu, and the chiefs rebelled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Princess Ndege Nasolo fled from Kagulu with Musanje's four sons in order to
    save the princes from the king's cruelty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chief Mawuba made blood-brotherhood with the four princes, promised to protect
    them, collected an army, propitiated the gods, and attacked the capital.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Kagulu fled because the people would not fight for him, was caught in Kyagwe
    by princess Ndege, and was drowned in Lake Victoria Nyanza.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kikulwe became king after Kagulu and ordered people to catch members of the
    Elephant Clan because, under Ndege's orders, they had killed Kagulu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Many members of the Elephant Clan disowned their clan and joined other clans
    to escape the king's anger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Kikulwe feared that popular prince Mawanda might be used in a rebellion and
    planned to kill him with a spiked pit hidden under sticks and grass in a house
    of the royal enclosure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A royal gatekeeper warned Mawanda about the pit and marked it with his stick,
    allowing Mawanda to walk around it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the plot was discovered, Kikulwe fled; Mawanda armed himself, gathered
    retainers, raised an army, routed Kikulwe, and was crowned in his place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Mawanda visited many districts and personally fought against Busoga, subduing
    much of it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Mawanda gave the Rat Clan free entry to the royal enclosure because one of
    its members, Nkalubo, had saved Mawanda's pregnant mother from an execution order
    by substituting one of his own women.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: After the saved child was born and proved to be a son, Ndaula rewarded the
    Rat Clan with the hereditary Sebugwawo office, made blood-brotherhood with Nkalubo,
    and made Nkalubo's sons a permanent special bodyguard for the king.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Tradition says Mawanda and the Queen were summoned by the ghost of Kintu,
    the first king of Uganda, to Kintu's temple on Magongo hill; Kintu fled when the
    chief Namutwe came contrary to orders.
  category: sequence
  evidence_refs:
  - ev:11
