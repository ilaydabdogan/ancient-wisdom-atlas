candidate_motifs:
- id: motif:1
  label: Ritual cure fulfilled through killing a betrayer
  taxonomy_refs: []
  basis: Ndaula's killing of Siroganga is said to fulfill the medicine-man's conditions
    and restore the king to health.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not provide the medicine-man's original conditions, so
    the ritual structure is only partially visible.
- id: motif:2
  label: Tyrannical king loses support and is overthrown by protected royal kin
  taxonomy_refs:
  - royal_legitimacy
  basis: Kagulu's killings and cruelties lead people and chiefs to rebel; protected
    princes and their ally attack the capital, and Kagulu is captured and drowned.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the events politically and genealogically rather than
    as an explicit moral or divine judgment.
- id: motif:3
  label: Blood-brotherhood as protective and political alliance
  taxonomy_refs:
  - sacred_exchange
  basis: Mawuba's blood-brotherhood with the princes is tied to protection and military
    action; Ndaula's blood-brotherhood with Nkalubo follows preservation of the royal
    line and accompanies hereditary office grants.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: medium
  cautions: The passage names blood-brotherhood but does not describe the ritual procedure
    or theological meaning.
- id: motif:4
  label: Hidden death trap avoided through insider warning
  taxonomy_refs: []
  basis: Kikulwe conceals a spiked pit for Mawanda; a gatekeeper reveals and marks
    it, allowing Mawanda to avoid the trap.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage presents
    a political trap rather than a named mythic ordeal.
- id: motif:5
  label: Failed assassination of popular prince leads to royal replacement
  taxonomy_refs:
  - royal_legitimacy
  basis: Kikulwe plots against popular Mawanda, flees after the plot is discovered,
    and Mawanda raises an army and is crowned in his stead.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not explicitly state a formal legitimacy doctrine, but
    succession and popular support are central to the episode.
- id: motif:6
  label: Preserved unborn royal son establishes clan privileges
  taxonomy_refs:
  - royal_legitimacy
  basis: Nkalubo saves a pregnant woman who later bears a son; the Rat Clan receives
    royal access, hereditary office, and a bodyguard role as a result.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The birth is not described as miraculous or divine, so sacred-birth or
    miraculous-child taxonomy is not applied.
- id: motif:7
  label: Ancestral first king's ghost summons reigning royal pair to a temple
  taxonomy_refs:
  - royal_legitimacy
  basis: Kintu, identified as the first king of Uganda, summons Mawanda and the Queen
    to his temple, but the encounter is interrupted by Namutwe's contrary arrival.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The supplied passage ends mid-sentence after Kintu flees, so the full
    significance of the summons is uncertain.
- id: motif:8
  label: Clan identity abandoned to escape royal retaliation
  taxonomy_refs: []
  basis: After Kikulwe targets the Elephant Clan for Kagulu's death, many members
    disown the clan and join other clans.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is extracted as a social-political pattern; the passage does not
    frame it as a mythic transformation.
