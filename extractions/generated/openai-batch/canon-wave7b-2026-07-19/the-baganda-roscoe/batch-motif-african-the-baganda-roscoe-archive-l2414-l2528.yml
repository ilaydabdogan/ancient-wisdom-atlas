canonical_text:
  quote: The  sun  was  the  Baganda  timepiece.
  summary: 'The passage records a Baganda saying about the sun at sunset: she goes
    to Kiwalabya to eat plantain peelings, is held by the people of Nakakakulu so
    that she does not fall from the earth and become lost, and is sent back east by
    night for the next morning. The rest of the passage surveys Baganda measures of
    road distance, land, building materials, commodities, beer, and numbers.'
