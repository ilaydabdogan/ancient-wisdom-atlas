  quote: ''
  summary: The passage describes the construction and dedication of Mukasa's temple,
    including ritual roles, animal materials, a roof pinnacle with hoe blades and
    horns, withdrawal of workers, restoration of the god, priestly seclusion, priestly
    succession and secrecy, distinctive priestly dress and hair, sacred drums with
    human-bone drumsticks, and the beginning of a procedure for obtaining new drumsticks
    after the death of Gugu.
