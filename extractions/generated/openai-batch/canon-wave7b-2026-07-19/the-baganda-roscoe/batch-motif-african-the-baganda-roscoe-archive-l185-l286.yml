canonical_text:
  quote: ''
  summary: The preface section explains the writer's scholarly debts and describes
    how information on former Baganda customs and religious practices was collected
    over eighteen years. It emphasizes difficulties caused by language learning, the
    spread of Christianity, the guarded nature of religious knowledge, and the loss
    of older informants through war and famine. Sir Apolo Kagwa is credited with arranging
    access to elders, priests, mediums, clan representatives, and medicine-men, and
    with preparing plans of the old Capital and Royal Enclosure. The writer sets the
    account's endpoint in the early years of Mutesa's reign, before later changes
    associated with Arab traders, missionaries, land tenure, and warfare.
  language: English
  quote_policy: summarized
