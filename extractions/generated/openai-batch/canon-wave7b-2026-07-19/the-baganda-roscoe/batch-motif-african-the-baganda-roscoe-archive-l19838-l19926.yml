canonical_text:
  quote: ''
  summary: The passage describes Baganda fishing practices around nets, fish-traps,
    canoes, seasonal taboos, offerings to Mukasa, ritual herbs supplied by Mukasa's
    priest, first-catch procedures, penalties for taboo breaches, and propitiation
    of the canoe spirit connected with a special pot kept in the canoe. It ends with
    the beginning of a description of the Mugonja shallow-water line.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A net maker had to avoid salt and meat, eat alone, and not live with his wife
    until the first catch of fish was taken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before letting down a new net, the fisherman offered beer to Mukasa; the priest
    gave herbs, floats, and sometimes a paddle, all intended to make fishing successful.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The net was paid out from a canoe, fastened to shore-points, laid in a circular
    course, left in the water for several hours, then hauled in and sorted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The catch was not divided until the owner had cooked and eaten some of it
    and had jumped over his wife; some of the first catch was sent to Mukasa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Neglect of the ceremonies was expected to make the canoe drag and the net
    useless.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: During fishing, the fisherman, wife, and children avoided salt and meat, avoided
    bathing or washing except in the lake, and the fisherman lived apart from his
    wife and ate alone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Family members who broke the taboo had to confess and were not allowed to
    eat the fish caught.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a net needed repair, the owner repaired it secluded from others, no one
    else could touch it, and he lived alone for three days afterward; after making
    a new net he sometimes lived apart for eight days until the first catch and wife-jumping.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the canoe, the fisherman had to splash water out on both sides before relieving
    nature; speech about going to fish or having eaten fish was prohibited, and fines
    were imposed for breaches or failure to work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each fishing-canoe kept a special pot holding herbs from Mukasa's priest;
    the herbs were smoked over the net or thrown into the lake to cause fish to enter
    the nets.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the pot was moved, the canoe owner ordered it replaced, apologized to the
    spirit of the canoe, and made an offering to avert possible harm.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After a good haul of fish, the canoe owner made an offering to the spirit
    at the pot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Mugonja is described as a shallow-water line, twenty feet long, with large
    hooks fastened on it.
  category: object
  evidence_refs:
  - ev:10
