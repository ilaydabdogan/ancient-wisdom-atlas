canonical_text:
  quote: ''
  summary: 'The passage describes royal mortuary customs among the Baganda: a reigning
    king visits his father''s temple, sees relics including umbilical cords and the
    father''s jawbone, receives explanation and prophecy, and later has many people
    killed to join the dead king''s ghost. It also describes a shrine for the father
    within the king''s enclosure, offerings and oracles there, Mutesa''s change to
    burial customs, and an etiological tradition explaining jawbone removal through
    the death of Kalimera, whose followers brought back his lower jawbone as proof
    of death.'
  language: English
  quote_policy: summarized
