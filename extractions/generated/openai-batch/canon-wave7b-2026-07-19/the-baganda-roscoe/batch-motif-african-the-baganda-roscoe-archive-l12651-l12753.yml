  text: The country is divided into ten large districts whose boundaries are marked
    by rivers, swamps, valleys, or gardens.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Named principal chiefs hold specified offices, including the Katikiro as Prime
    Minister and Chief Justice, the Kimbugwe as custodian of the king's umbilical
    cord, and the Mugema as the king's father and Katikiro of the Dead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ten district chiefs administer the country and render accounts through
    the Katikiro to the king and chiefs assembled in the Lukiko.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Busoga is described as subsidiary to Uganda; Basoga visitors bring gifts,
    and succession disputes in Busoga bring aspirants to Uganda for investigation
    of claims.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Koki pays yearly tax in iron hoes and cowry-shells, and Ankole sends cattle
