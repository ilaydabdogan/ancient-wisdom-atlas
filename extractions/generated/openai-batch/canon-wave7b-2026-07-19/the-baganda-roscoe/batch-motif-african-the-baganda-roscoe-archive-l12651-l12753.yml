  evidence_refs:
  - ev:1
- id: obs:2
  text: There are twelve important chieftainships; the Katikiro and Kimbugwe rank
    above district chiefs and have estates in each district rather than districts
    of their own.
  category: relationship
  evidence_refs:
  - ev:2
