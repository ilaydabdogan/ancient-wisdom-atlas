canonical_text:
  quote: ''
  summary: The passage describes sacrifices to Wamala; petitions to Nagawonyi during
    drought and storm rituals involving smoke and drums; Walumbe as death deity associated
    with Ntanda, royal offerings, and post-mortem accounting; Nkulu as a fertility
    deity with sacred white stones and amulets; and Mbale as a fertility deity consulted
    in a cave where bats give an omen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human victims were sacrificed to Wamala at a lake shore, killed by clubbing
    and spearing, and thrown into the lake; the water was said to become crimson with
    blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagawonyi is described as the goddess of hunger, able to end drought or famine
    through influence with Musoke and Gulu, who commanded the elements.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During prolonged drought and crop failure, people brought offerings and withered
    fruits to Nagawonyi's temple, and women messengers begged her to pity her dying
    children and intercede with Musoke and Gulu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Nagawonyi's medium was possessed, the medium gave an oracle about when
    rain might fall.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: During heavy rain and severe lightning, people made smoky fires to keep clouds
    from falling and beat drums so Gulu would know where they were and not harm them
    with lightning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Walumbe is called the god of death, brother-in-law of Kintu, and a former
    sky-dweller with his father Gulu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Walumbe's temple stood at Ntanda near a deep ravine where he was believed
    to live, and it had a medium and a priest from the Colobus-monkey Clan.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The King alone made offerings to Walumbe, at the bidding of other gods, to
    prevent Death from killing people wholesale; each crowned King sent an offering
    to appease him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Souls of the dead had to go to Ntanda to give an account of their deeds, then
    were free to return to their clans near the graves of their bodies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Unexplained deaths were customarily attributed to Walumbe taking the person.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nkulu was especially connected with the Leopard Clan; new temples for Nkulu
    were built by that clan with the King's permission, and workers rested and feasted
    every ninth day.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: White stones in front of Nkulu's temple in Bwende were sacred to him and called
    his messengers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nkulu's chief office was to assist women to have children; people sought nsalo
    amulets worn by women around the waist for fecundity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a child was thought to be born through Nkulu's intervention, the husband
    had to bring a goat offering; if dues were unpaid, a sacred stone was said to
    appear in the King's bed as warning and disappear after payment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Mbale had a temple at Mbale in Budu and a cave containing many bats; Namata
    of the Heart Clan was priest and medium, and Maagali was estate caretaker and
    also a priest.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: Women desiring children consulted Mbale; the priest took a woman into the
    cave, called on the god, and the answer came through sacred bats.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: If a bat's excretions fell upon a woman in Mbale's cave, she was considered
    favoured and certain to have a child.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Mbale's temple was built by the State at the King's order; work was organized
    in two nine-day periods with a rest after the ninth day.
  category: sequence
  evidence_refs:
  - ev:9
