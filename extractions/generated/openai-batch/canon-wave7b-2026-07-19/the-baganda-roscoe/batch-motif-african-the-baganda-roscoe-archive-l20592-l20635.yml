canonical_text:
  quote: ''
  summary: 'The passage describes Baganda practices for preparing animal skins: earlier
    minimal drying and rubbing, later more elaborate pegging, scraping, moistening,
    softening, bleaching, stitching, and patching. It also notes uses of dressed skins
    for clothing, mats, gatekeepers’ wear, royal rugs or sandals, and chiefs’ robes,
    and mentions Arab introduction of palm-leaf-frond mat-making in King Suna’s reign.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Barkcloth had partly displaced skins as clothing, but skins were still used
    for mats; palm-leaf-frond mat-making is said to have been introduced by Arabs
    during King Suna's reign.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In earlier practice, skins were dried in the sun, stamped on, and rubbed by
    hand to make them soft enough for loin-cloths; antelope- and goat-skins were chiefly
    used.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For later skin-dressing, a man chose a clear place, pegged the hide above
    the ground for air circulation and protection from insects, brought it in at night
    against wild animals, and let it dry for about two days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cowhide could be scraped with a knife, moistened with water, stamped on,
    rubbed, and smeared with butter until soft enough to roll into a ball.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a hide was too thick, it was stretched on a frame above the ground, scraped
    with a sharp knife to the desired thinness, and kept in the sun to bleach during
    scraping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Skins worn by gatekeepers were worked until they were as soft as calico.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lion- and leopard-skins were dressed in the same manner and used by the King
    as rugs, or cut into thongs for sandals of royalty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Goat-skins were shaved, bleached white, scratched with a needle set through
    wood, and stitched together into robes worn by chiefs before linen and cotton
    goods were introduced.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A damaged part of a hide could be cut out and replaced with a matched piece
    stitched so neatly that the patch could not be noticed.
  category: action
  evidence_refs:
  - ev:6
