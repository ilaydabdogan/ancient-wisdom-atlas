  quote: ''
  summary: The passage describes Baganda practices and beliefs concerning graves,
    suicides, separate burials, and slave burials. It reports precautions intended
    to prevent ghosts from entering women and being reborn, the burning of suicides
    at crossroads, fears that ghosts buried together would quarrel and harm the living,
    and warnings that neglected slave ghosts could cause sickness and death.
