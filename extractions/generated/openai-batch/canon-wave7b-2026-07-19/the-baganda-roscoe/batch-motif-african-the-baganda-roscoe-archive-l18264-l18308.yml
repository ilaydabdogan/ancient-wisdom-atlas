canonical_text:
  quote: ''
  summary: The passage describes Baganda wartime command arrangements, substitution
    for chiefs unable to go to war, military discipline, the role of Senkole carrying
    sacred fire for punishing condemned cowards, rapid mustering after the war-drum,
    consultation with gods and chiefs, scouting, and a priest-ordered pre-battle cleansing
    ceremony performed as a sham fight involving a plantain-tree stem and mock spears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Katikiro was generally not permitted to go to war except in exceptional
    circumstances, because he had to guard the capital, the country, and the King.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A substitute could accompany the army in place of a chief who could not go,
    taking the chief's title and commanding his troops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The absent master remained responsible for the substitute's conduct, receiving
    praise for success and blame for failure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The army was warned not to plunder or rob in its own country, but could take
    food from gardens and seize fowls while marching to the front.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief ordered to the front who did not go could be deposed and have his
    property confiscated.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Senkole, described as guardian of the sacred fire, accompanied the army with
    a fuse of sacred fire for burning any coward condemned by the general.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the war-drum sounded, the army was expected to assemble in four days
    and be at the frontier within ten days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The general consulted first with the gods and then with leading chiefs to
    arrange the battle order.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spies and scouts reported movements in the country and noted where cattle
    and women had been posted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the eve of the first battle, priests ordered a cleansing ceremony consisting
    of a sham fight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A plantain-tree stem was placed in the road to the general's hut, and warriors
    used plantain-leaf midribs as mock spears to spear it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the sham fight warriors rushed toward the enemy's country, brandished
    their mock spears, shouted defiance, then each jumped over the plantain stem and
    returned to quarters.
  category: sequence
  evidence_refs:
  - ev:8
