  summary: The passage describes feared animal and human ghosts and rites meant to
    avert them, including euphemistic speech, shrines and offerings, cross-road burials,
    grass or stick throwing, burning, poison ordeals, and harmful magic. It then begins
    an account of Mukasa, a high-ranking benign god associated with healing, plenty,
    animal sacrifice, temples, sacred emblems, and priest-mediums.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman avoided saying directly that a sheep had died, because saying so was
    believed to let the sheep's ghost make her ill or possibly kill her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After killing a buffalo, huntsmen made a shrine for the animal's head outside
    the garden, cooked the head-flesh outside, and poured beer there to avert harm
    from the buffalo's ghost on a later hunt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child born feet first was customarily strangled and buried at cross-roads;
    women passing the grave threw grass on it to prevent the infant's ghost from entering
    them and being reborn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who died of consumption was buried away from the houses so that the
    ghost would not attack the inmates with the disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Light-coloured people were buried at cross-roads, and women passing the grave
    threw grass on it to prevent the ghost from catching them and being reborn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A suicide's body was burned on waste land, by the roadside, or at cross-roads;
    a house where the act occurred could also be burned, and a tree used for hanging
    could be uprooted and burned with the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The burning of a suicide's body was understood as a way to destroy the ghost
    so that it could not tempt another person to commit suicide.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: People passing the place where a suicide's body had been burned threw grass
    or sticks there to prevent the ghost from catching them if it had not been destroyed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person accused of witchcraft underwent a poison ordeal and, if judged guilty,
    was burned to death on waste land; passers-by threw grass on the site to prevent
    the ghost from catching them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A practitioner of Mwabutwe magic was said to boil human flesh, mix herbs with
    the water, sprinkle the mixture on crops, and thereby cause death to those who
    ate the food.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A person caught making Mwabutwe magic was tried by poison ordeal, put to death,
    and burned; passers-by threw grass or sticks on the spot to prevent the ghost
    from attaching itself to them and influencing them to work similar magic.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mukasa is described as the highest-ranking god of Uganda, benign, not demanding
    human life, receiving animal sacrifices, healing bodies and minds, and giving
    increase of food, cattle, and children.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
