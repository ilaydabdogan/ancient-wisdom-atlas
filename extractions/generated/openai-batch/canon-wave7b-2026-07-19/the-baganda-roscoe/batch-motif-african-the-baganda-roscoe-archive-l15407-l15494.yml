  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: Mukasa's chief temple was on Bubembe island in Lake Victoria Nyanza, with
    smaller temples elsewhere; smaller temples had a paddle as sacred emblem, while
    some said the chief temple had a meteoric stone turned east and west according
    to moon phases.
  category: setting
  evidence_refs:
  - ev:11
  - ev:12
