canonical_text:
  quote: ''
  summary: The passage describes Baganda fishing practices involving traps, lines,
    bait, smoking fish, and rules or ritual actions connected with fishing gear. Objects
    encountered by the fisherman or adhering to clothing may be placed in traps to
    make fish stick fast. Some traps are dedicated to Mukasa and their catch is reserved
    for the temple. Food or offerings may be tied into knots in fishing lines to strengthen
    them or remedy mischief. Small paired basket-traps catch seasonal small fish,
    whose first three catches remain within the fishing community. A separate hooked
    line is used from a drifting canoe near shore or reeds.
  language: English
  quote_policy: summarized
