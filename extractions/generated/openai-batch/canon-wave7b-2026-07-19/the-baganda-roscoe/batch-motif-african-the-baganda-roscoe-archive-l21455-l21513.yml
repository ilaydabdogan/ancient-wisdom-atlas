  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a garden yields poor crops, a woman obtains a fetich from the medicine-man
    and puts it into a pot with tobacco.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman smokes the tobacco and blows smoke over the crops; the passage states
