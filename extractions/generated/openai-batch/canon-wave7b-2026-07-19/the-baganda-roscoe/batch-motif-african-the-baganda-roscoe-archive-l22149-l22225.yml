canonical_text:
  quote: ''
  summary: 'The passage opens the chapter on hunting by distinguishing royal sport
    hunting from hunting as profession or food-getting. It describes hereditary elephant-hunters,
    their preparation of heavy spears, a pre-hunt visit to the temple of the god of
    the chase with beer and a goat, and two elephant-hunting methods: ambush from
    trees using spears and animal-skin decoys, and open-ground stalking with cooperative
    diversion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king and some principal chiefs hunted small game for sport, while the
    wider population hunted as a profession or to obtain animal food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elephant-hunters were described as men whose fathers had hunted and who had
    been trained from childhood in elephant peculiarities, haunts, and habits.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Kyagwe, when elephants were in a forest, hunters stationed themselves in
    trees and speared animals as they passed underneath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hunters prepared heavy spears with leaf-shaped blades, iron shanks, and wooden
    shafts, and sharpened them before the hunt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After sharpening, the spears were taken overnight to the temple of the god
    of the chase, usually named in the passage as Dungd, and the god was propitiated
    with beer and a goat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the morning of the hunt, the hunters ate, went near the herd, climbed selected
    trees, concealed themselves, and waited with two or three spears each and an animal
    skin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A hunter selected an elephant with large tusks and tried to spear it between
    the shoulders with enough force to disable it at one stroke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a wounded elephant continued moving, a companion could wave and drop an
    animal skin to attract it; when the elephant stopped to crush the skin, the hunter
    could spear it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hunters had to work together against a wounded elephant, with different men
    attracting and spearing it in turn; a herd generally fled after the first alarm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On open plains or scrub, three or four men crawled toward feeding elephants,
    entered the herd without being perceived, chose one animal, and speared it; companions
    then helped by further spearing and diverting its attention.
  category: sequence
  evidence_refs:
  - ev:8
