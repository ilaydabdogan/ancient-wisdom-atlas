  summary: An index page listing entries under Wives, Witches, Woman, Women, Women's,
    Working, Workmen, Work, Wounded, Wrestling, Young girls, and Ziba people. The
    entries include references to wives, women, social restrictions, ritual actions
    toward deities, ghosts, witch-burning, royal marriage control, Mukasa, and temple-building.
