literal_observations:
- id: obs:1
  text: The index lists wives as guarded and also lists wives being put into stocks,
    taken on punitive expeditions, tortured when suspected of adultery, and witnessing
    a husband's death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The index states that witches were burned to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The index states that women were able to refuse an offer of marriage, but
    also lists women as needing a husband's consent to pay visits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The index lists separations and posture rules for women, including not sharing
    the same bath with men, eating apart from men, kneeling when addressing men, and
    restrictions around doorways, stools, a man's feet, and a man's mat.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: Women are listed as consulting the earth god for increase of crops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women are listed as fearing the ghosts of suicides, being forbidden to mention
    dead sheep, and not being allowed to mourn for the dead from plague.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women are listed as forbidden to herd or milk cows, not allowed to touch unbaked
    pots, restricted from approaching drums, and secluded during menses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women are listed as patting themselves to prevent the earthquake god killing
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The index lists women given by the king to his servants to become their wives,
    women given in marriage by the king, wives of the King who might not have sons,
    and Bushbuck-clan women not allowed to have sons when married to the King.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The index lists women's vows to Mukasa and women's work in a plantain grove.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The index lists the work of building Mukasa's temple as begun on a chief's
    head.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The index lists women as paddlers in a canoe, gardeners, tobacco smokers,
    and workers in plantain groves.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
