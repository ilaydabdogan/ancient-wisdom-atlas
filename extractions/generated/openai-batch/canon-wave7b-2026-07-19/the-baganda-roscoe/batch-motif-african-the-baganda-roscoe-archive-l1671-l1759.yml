canonical_text:
  quote: "“The idea in burning the body was if possible to destroy the ghost.”"
  summary: The passage describes practices around a suicide corpse and ghost, frequent
    fires in Baganda houses, emergency response to fires in the royal enclosure, incendiary
    attacks on sleeping households, and clan responsibility for people placed in stocks,
    including fear of a wrongfully killed person’s ghost.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A suicide corpse was taken to a place where cross-roads met and burned; in
    one case a tree was used as firewood, and in another a house was pulled down and
    its materials burned with the body in the road.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People feared living in a house where a suicide had occurred because they
    feared being tempted to commit the same act.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who burned the corpse washed their hands at the burning place with plantain
    sponges and threw the sponges onto the pyre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women passing the suicide-burning place threw grass or sticks onto the heap
    to prevent the ghost from entering them and being reborn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated purpose of burning the body was, if possible, to destroy the ghost.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Houses were made of highly inflammable materials, and fires often began through
    careless cooking; people usually removed goods rather than trying to extinguish
    the fire, while a mother’s first concern was to carry her child to safety.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When fire occurred in the royal enclosure, the war-drum summoned people to
    stop the spread of the fire and save the houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men responding to a royal enclosure fire brought branches or young plantain
    trees, mounted nearby roofs, and brushed away sparks or extinguished small flames.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: As men went to the royal enclosure, they called the name of their chief, brandished
    spears, rushed toward him, dropped to one knee, and swore loyalty.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: A rule forbade grass or rubbish-fires in gardens adjoining houses during strong
    wind; such fires could be lit only at night when dew made houses less likely to
    catch fire.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Incendiaries sometimes set fire to thatch above a door while the inmates slept,
    making escape by the door impossible and sometimes leaving victims burned or suffocated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Night fires drew crowds quickly because the confusion created an opportunity
    to carry off goods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Chiefs and heads of clans could put a man in stocks, while members of his
    clan were responsible for seeking justice, liberation, or appeal to a higher court.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Relatives feared that if a clan member were put to death unjustly, his ghost
    could trouble them; this fear motivated them to help even without affection for
    him.
  category: other
  evidence_refs:
  - ev:7
