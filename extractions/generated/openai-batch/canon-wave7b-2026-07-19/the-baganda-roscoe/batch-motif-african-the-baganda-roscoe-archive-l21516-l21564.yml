canonical_text:
  quote: ''
  summary: 'The passage describes practical uses of plantain parts in Baganda agriculture
    and food preparation: stem material is used as manure and made into washing sponges,
    with gendered use of sponges from male and female trees; leaves are used for wrapping
    food and as serving surfaces. It also describes women’s morning garden work, daily
    food supply, and lists named plantain varieties associated with several districts.'
