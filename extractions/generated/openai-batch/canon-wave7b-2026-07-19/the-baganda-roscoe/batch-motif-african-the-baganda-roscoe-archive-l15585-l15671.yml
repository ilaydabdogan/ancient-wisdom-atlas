  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Priests came forward robed and carrying insignia: a blood bowl, a sacred
    knife, a sharpening stone, a sacred spear, and the drum Betobanga.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Animals were seized, thrown, held down, and killed; Semagumba caught some
    blood while the rest flowed through the channel into the lake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Watchers at the lake announced when the blood reached the water, saying, "He
    has drunk it."
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The animal tied to the temporary temple was killed separately, and its meat
    was reserved for the priests alone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: No woman was allowed to eat the meat of the other animals, which was divided
    among lower priests and workmen.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Semagumba placed the blood vessel in the temple, knelt, asked the god to accept
    the blood and grant increase of children, cattle, and food, and backed out leaving
    the vessel inside.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Named chiefs from different islands came to erect the new temple, and the
