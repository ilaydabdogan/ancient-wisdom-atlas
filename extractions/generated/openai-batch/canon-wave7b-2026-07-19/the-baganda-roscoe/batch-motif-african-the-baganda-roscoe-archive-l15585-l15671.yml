canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparations and actions connected with building
    a new temple: purification, cutting temple timber, clearing roads to the lake,
    constructing temporary huts, testing cattle for divine acceptance, preparing a
    blood channel to the lake along Mukasa''s supposed path, killing animals, offering
    blood to the god, praying for increase of children, cattle, and food, and erecting
    the new temple with named chiefs and priests.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Summoned men were given four days to purify themselves and separated themselves
    from their wives during that period.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fourth morning the chief priest cut a tree at the shore of the lake
    as the signal for temple-building work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women under the principal wife of the chief priest cleared twelve roads radiating
    from the temple to different points of the lake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sekayonga and his men built huts named "The guard" and "Sleep" and eighteen
    smaller huts; the hut called Sleep was for the god during construction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cattle were tested before the temple; any cow that lowed or dropped dung during
    the test was discarded as rejected by the god and replaced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When an animal was rejected, the priest examined temple slaves to find who
    had broken the chastity taboo thought to have caused the rejection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A gutter made from outer layers of plantain stems was laid to carry blood
    into the lake along the supposed path by which Mukasa came to the island.
