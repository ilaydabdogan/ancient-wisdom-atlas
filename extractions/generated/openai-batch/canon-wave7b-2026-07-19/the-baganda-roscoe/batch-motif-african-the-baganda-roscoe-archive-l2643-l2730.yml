canonical_text:
  quote: ''
  summary: The passage describes Baganda greeting and leave-taking etiquette, including
    questions about well-being, reunion embraces, repeated greeting ejaculations,
    words of warm welcome, congratulation on safe return from a journey, formal departure
    speech between guest and host, servant responses to superiors, respectful titles,
    kneeling, and two-handed handling of objects when dealing with superiors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People ask time-appropriate questions about how another person slept or spent
    the day, and responses may state that nothing is wrong or all is well.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Friends meeting after a period apart customarily embrace by placing hands
    on each other's shoulders and moving the head to each shoulder, without faces
    touching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hand-shaking in greeting is mentioned, but the passage states it was probably
    a Bahima custom rather than a genuine Baganda custom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reunited friends repeatedly ask Otyano and exchange Ah ejaculations for an
    extended time before settling into longer conversation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: If one friend had been on a journey, the other could congratulate him on safe
    return with kulika; the passage says the word's exact meaning is doubtful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Great friends after long separation may use mainu or nyoge for warm welcome,
    and evade/erade as a peace exchange associated with the Lake on a calm day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A visitor is expected to remain for some time before leaving and to use a
    formal departure formula rather than simply saying goodbye and departing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A maid or servant sent with a message may leave after delivering it by simply
    saying she wishes to leave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Servants kneel when speaking to a man or receiving orders, and adult male
    servants called by a chief may answer wampa, while boys and maids answer wange.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Silence by a boy or girl when called is described as rude and punishable;
    inferiors, equals, and persons addressing women of superior position use different
    respectful terms.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Women of position and the king's wives are called Bakyala because they rule
    over a house and have gardens and servants under them; the term is not used for
    unmarried women.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: An inferior may not give to or receive from a superior with one hand alone,
    but must use both hands or touch the object-bearing arm with the other hand.
  category: action
  evidence_refs:
  - ev:9
