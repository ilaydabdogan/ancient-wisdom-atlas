- id: ev:7
  type: summary
  locator: 'supplied lines 16188-16279: Nende and Kirabira introduced'
  quote_or_summary: Nende and Kirabira are described as war-gods at Bukerere, sons
    of Mukasa, brought to Kyagwe after Kibuka was killed; Nende advised on wars and
    sent representatives on punitive expeditions, while Kirabira was seldom consulted.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; full text allowed.
- id: ev:8
  type: summary
  locator: 'supplied lines 16188-16279: Nende temple enclosure, wives, and festival
    showing'
  quote_or_summary: Nende’s temple had a guarded stockade and one gate; his six princess
    wives never left after dedication, sat beside the god’s dais, and once every twenty-five
    years the god was shown to assembled people.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; full text allowed.
- id: ev:9
  type: summary
  locator: 'supplied lines 16188-16279: Nende festival restrictions'
  quote_or_summary: Festival attendees abstained from beer, ate coffee-berries, and
    observed chastity for nine days; the medium ate coffee-berries before possession.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; full text allowed.
- id: ev:10
  type: summary
  locator: 'supplied lines 16188-16279: Nende priests, princess titles, and medium'
  quote_or_summary: The priests belonged to the Mushroom Clan and held titles Wangu
    and Kajujugwe; four principal princesses had named titles; after possession the
    medium never left the temple-courts; priests and medium wore barkcloths and white
    goat-skin aprons when officiating.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain; full text allowed.
- id: ev:11
  type: summary
  locator: 'supplied lines 16188-16279: footnote on Kibuka remains'
  quote_or_summary: The footnote reports that Kibuka’s conical bundle contained a
    stool, a bag with a human jawbone and male organ, and associated relics including
    a decorated umbilical cord, shield, and short double-edged sword.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
