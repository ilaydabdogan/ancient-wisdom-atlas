canonical_text:
  quote: ''
  summary: The passage describes offices, ritual objects, executions, child dedication,
    sacred water service, sacred animals, and relics associated with Kibuka’s temple,
    then describes the war-gods Nende and Kirabira, their temple, divine kinship,
    dedicated princesses, festival restrictions, priestly offices, and mediumship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Kibuka was especially enraged with a prisoner, the possessed medium killed
    the prisoner with a spear inside the temple while the prisoner knelt pleading.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prince with the official title Namwa tended the temple fire and cut firewood
    with a copper axe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Titled women, including two princesses and one woman of honour, lived in houses
    inside Kibuka’s temple enclosure and received honour from residents and petitioners.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women brought to Kibuka could be given as wives to slaves, and their children
    were brought to the god, who either returned them to their parents as free people
    or retained them as slaves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Every third child of a woman married to a priest or temple officer had to
    be given to Kibuka and was described as a tax upon children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Muzinga brought water daily for the god from the sacred well Nakaliga, carrying
    it in two gourds, mixing it with white earth, and pouring it into wooden and pottery
    vessels in the temple.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A special herdsman named Sejagti guarded a sacred bull named Kibukabiika and
    a sheep named Nawolovu, described as favourite animals of the god.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tonandaba had charge of two seed-filled gourds that were rattled in rhythm
    with drums and harp on special occasions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nasiimbi and Kide assisted Sabata when executions took place and had followers
    ready to carry out instructions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nende and Kirabira are described as war-gods with a temple at Bukerere and
    as sons of Mukasa.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nende gave advice concerning wars and sent representatives on punitive expeditions,
    while Kirabira was seldom consulted and mainly named together with Nende.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nende’s temple was surrounded by a strong stockade with one entrance-gate
    guarded day and night so that only inmates could enter.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Nende had six princess wives who, after dedication to the god, never left
    the enclosure and had seats on either side of the dais where the god was supposed
    to sit.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Once every twenty-five years Nende was brought out and shown to people gathered
    for a festival from many parts of the country.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: During Nende’s nine-day festival, attendees abstained from beer, ate coffee-berries,
    and observed chastity; the medium ate coffee-berries before possession by the
    deity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Nende’s priests belonged to the Mushroom Clan, and after the medium had once
    become possessed by the god, he never left the temple-courts.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: A footnote reports that Kibuka’s conical bundle contained a stool with a hollow
    top, a bag containing a human jawbone and male organ, and that a decorated umbilical
    cord, shield, and short double-edged sword were obtained with the jawbone.
  category: object
  evidence_refs:
  - ev:11
