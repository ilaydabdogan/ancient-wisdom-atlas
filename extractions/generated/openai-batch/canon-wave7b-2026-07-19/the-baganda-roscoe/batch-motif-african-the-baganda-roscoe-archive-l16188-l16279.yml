comparison_claims:
- id: claim:1
  claim: Within the passage, Nende shares the broad function of war-god with Kibuka,
    but the text states that Nende was never as highly esteemed as Kibuka.
  claim_level: same_function
  target: Kibuka and Nende as war-gods in the Baganda temple context
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage compares status and war-god function but gives different
    ritual details for each deity.
- id: claim:2
  claim: Nende and Kirabira are paired as brother war-gods and sons of Mukasa, though
    Kirabira is described as seldom consulted and mainly named with Nende.
  claim_level: same_function
  target: Nende-Kirabira paired war-god relationship
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides independent ritual functions for Nende but not
    for Kirabira.
