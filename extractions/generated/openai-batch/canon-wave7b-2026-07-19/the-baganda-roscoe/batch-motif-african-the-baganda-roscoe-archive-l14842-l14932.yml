canonical_text:
  quote: ''
  summary: The passage describes Baganda temple mediums, divine possession for oracles,
    the role of priests as interpreters, female mediums and their chastity restrictions,
    young girls dedicated to temple service, temple fires and sacred objects, rules
    concerning menstruation, and the structure and access hierarchy of temples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person selected as a medium is described as suddenly possessed by a god
    and able to utter secrets or predict future events; bystanders then take the person
    to the temple.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first possession is called “being married to the god” in the passage,
    while later possessions are called “being seized by the head.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods normally appoint only one medium for a temple, with exceptions noted
    for Kibuka and Nende, and with Mukasa having one medium in each of several temples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A medium preparing to give an oracle smokes a sacred pipe with tobacco, and
    is sometimes given beer before smoking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The medium sits in the temple near the fire, remains silent, and gazes into
    the fire or onto the ground until the spirit comes upon him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During possession the medium is frenzied, and his utterances may be unintelligible
    except to the priest, who interprets them and may later tell the medium what he
    said.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the spirit leaves, the medium becomes prostrated and is allowed to sleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman chosen as a medium is separated from men, observes lifelong chastity,
    and is regarded as the wife of the god.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Young girls dedicated to the god in many temples guard the temple fire, which
    must burn day and night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dedicated girls also prevent taboo items from entering the temple, provide
    firewood and water, replenish the grass floor covering, and guard the sacred pipe
    and tobacco.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The persons of the dedicated girls are considered sacred, and men are warned
    not to be overly familiar or take liberties with them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The girls are described as offerings from parents who had prayed for children
    and promised to devote them to the god if their request was granted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A dedicated girl is brought to the temple after weaning and remains until
    puberty, when the god decides whom she is to marry.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that menstruating women may not enter a temple or perform
    duties for the gods, so temple virgin service is limited to immature girls; female
    mediums also cannot act for the gods during menses.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Temples are described as conical structures with thatched roofs, sometimes
    surrounded by sacred courts with restricted entry.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Some temple courts contain houses for temple attendants or dedicated women
    slaves; the temple enclosure is called a fort, kigwa.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: Temples without courtyards may be entered by people seeking help, and smaller
    temples of national gods are available even to poor peasants, while more important
    temples are for the King and leading chiefs.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: When a temple needs rebuilding, the priest sends a special messenger to the
    Kago, the King’s representative toward the gods and priests.
  category: sequence
  evidence_refs:
  - ev:10
