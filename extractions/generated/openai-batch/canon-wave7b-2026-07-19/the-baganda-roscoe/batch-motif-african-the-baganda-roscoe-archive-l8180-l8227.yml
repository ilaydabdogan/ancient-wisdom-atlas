  summary: The passage describes an unnamed clan whose totem is the bean, including
    food and cultivation prohibitions, a report of death after eating the sacred plant,
    royal service duties, an ancestor associated with learning barkcloth-making, and
    worship of the river spirit Nakiza through offerings at paired heaps by a ford.
