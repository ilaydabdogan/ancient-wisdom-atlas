canonical_text:
  quote: ''
  summary: The passage describes Baganda fishing techniques and fishing implements,
    including long lines, shore traps, and basket-traps. It also records ritual restrictions,
    offerings to Mukasa, priestly blessings and diagnoses, first-catch ceremonies,
    and ritual treatment of fishing gear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fishing line was let down into the water without a rod; floats kept the
    main line near the surface while shorter baited lines hung down at intervals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The line cord was bought from a rope-maker and made from aloe or other plant
    fibres; iron hooks made by a smith were bent, sharpened, without barbs, and had
    an eye for fastening.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: While making the line, the maker observed separation-customs and abstained
    from meat, salt, and washing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the line was completed, the maker put coffee-berries or boiled potatoes
    into the roll because he thought they made it strong and durable; cut bits of
    string were also rolled in so they would fall into the water when the line was
    paid out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before laying the line, the owner went to Mukasa's temple, offered beer, received
    Mukasa's blessing through the priest, and received a piece of iron or wood to
    attach to the line.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The first fish caught were treated ceremonially: some were taken to Mukasa,
    the remainder were cooked by the fisherman''s wife, the couple ate them, and the
    fisherman then jumped over his wife.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Later catches were distributed among the chief, the fisherman, and his friends;
    when a fisherman's wife was pregnant, he gave her a basket of small fish.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a fisherman was unsuccessful, he asked the priest the cause; the priest
    asked about meetings and speech on the road and suggested that a lie might have
    displeased Mukasa.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: For a wrong done, the fisherman was to confess to the injured person, then
    take an offering to Mukasa and obtain pardon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The place where Mitgonja lines were laid was marked by floats or by aligned
    objects on the shore; there were no taboos on the rod and line used for small
    bait fish.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Buligo traps were built along shores or flooded lands with stakes, reed walls,
    and nested enclosures entered by narrow winding passages, making them easy for
    fish to enter and difficult to leave.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the making or repairing of Buligo traps, fishermen observed taboos,
    kept apart from wives, abstained from salt and meat, made an offering to Mukasa,
    and obtained medicine for success.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mwezi wa Magala basket-traps were large cone-shaped or bowl-like traps with
    funnel mouth-pieces; they were weighted with stones, attached to a line with a
    float, lowered from canoes into deep water, and examined daily.
  category: object
  evidence_refs:
  - ev:9
