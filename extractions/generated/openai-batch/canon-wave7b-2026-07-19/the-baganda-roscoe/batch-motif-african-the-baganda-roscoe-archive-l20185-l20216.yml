  quote: He rolled out a piece of clay into a long snake-like roll...
  summary: 'The passage describes Baganda pottery manufacture: a potter uses a broken
    pot on a pad as a rotating base, forms the pot from coils of clay, smooths and
    shapes it with hands, a gourd-trowel, and a pointed stick, and begins to describe
    decoration with plaited grass.'
