literal_observations:
- id: obs:1
  text: The plans represent the Royal Enclosure and Capital as known during King Suna's
    reign and the early years of King Mutesa's reign, and were drawn by the Katikiro
    with help from old men who knew the place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Capital plan marks principal chiefs' enclosures and sub-chiefs' sites,
    with district chiefs placed on the side of the Capital nearest their own districts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: When selecting a new Capital, the King sought a site for the Royal Enclosure
    that commanded roads leading to the districts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The plans mark rivers, including their sources and courses, are not drawn
    to scale, and are said to follow a layout used for many generations.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The open space before the Royal Enclosure contained temples to principal gods,
    the sacred fire, and the court house where the Katikiro tried appeal cases.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kimbugwe's residence is listed with the temple of the Royal Fetiches and
    the Umbilical cord.
  category: object
  evidence_refs:
  - ev:6
