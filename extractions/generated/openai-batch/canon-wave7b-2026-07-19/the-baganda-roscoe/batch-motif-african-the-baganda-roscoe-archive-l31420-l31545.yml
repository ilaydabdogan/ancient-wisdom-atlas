  summary: Explanatory notes describe plans of the Baganda royal enclosure and capital
    in the reigns of Suna and Mutesa, including the spatial placement of chiefs, roads,
    rivers, temples, sacred fire, royal objects, royal residences, and storehouses.
  language: English
