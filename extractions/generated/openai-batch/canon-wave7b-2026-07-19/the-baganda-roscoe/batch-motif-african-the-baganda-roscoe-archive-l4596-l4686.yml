canonical_text:
  quote: ''
  summary: 'The passage describes Baganda marriage procedures: promises by the prospective
    spouses, the bride''s opportunity to accept or reject the man, a beer-drinking
    act by her uncle that ratifies the marriage, dowry negotiation and payment, cowry-shell
    handling around consummation, pre-marital washing and inspection, bodily preparation
    of the bride, and her final services to her parents before a veiled night transfer
    to her husband''s home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The suitor promises to treat the girl well, not desert her, and not wander
    continually between chiefs; he is warned that her kin will not protect him if
    he injures her or brings a blood avenger upon himself by killing someone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The future wife promises fidelity, cultivation and cooking for her husband,
    and attention to his interests.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the marriage interview the girl is asked whether she wishes to marry the
    man, giving her an opportunity to accept or reject him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the girl wishes to marry, her uncle asks whether he should drink; if she
    tells him to drink and he does so, the marriage is ratified.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl usually pours beer for her uncle and brother to drink, and the passage
    identifies this as the legally binding action in the marriage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members of the clan are called together to settle the dowry amount, which
    may include goats, a cow, beer, barkcloths, and cowry-shells.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The suitor may spend a long time collecting the dowry from relatives and friends;
    during this time he is not expected to visit the bride, though he may visit her
    relations and send small gifts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the dowry is paid, the bridegroom brings two thousand cowry-shells called
    kasimu and another five hundred for a goat feast; the dowry is divided among the
    bride's parents and her father's near relations.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The cowry-shells are kept by the bride's mother, or in the brother's house
    if the girl is married from there, until after consummation, when part is returned
    to the bridegroom and part kept by the parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before marriage every bride is washed from head to foot by the bridegroom's
    sister or by another person appointed by him, who checks whether she has a disease
    preventing marriage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For the King or leading chiefs, a girl may be brought naked or scantily clothed
    so they can inspect her for themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After payment of the cowry-shells the girl has two days to prepare; for weeks
    beforehand she has been fed to become plump and rubbed with butter to make her
    body look soft.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the day she is taken to her new home, the bride draws water for her mother,
    gathers firewood, and brings sweet-smelling grass used for floor carpeting.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: These water, firewood, and grass tasks are described as the bride's last acts
    for her parents, after which she is regarded as the property of another.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The bride is taken to her husband's house after dark, with long journeys timed
    so that she arrives after nightfall.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: Before departure, the bridal party gathers at the house of the male relative
    with whom the bride lives; the bride is ornamented and veiled in barkcloth over
    her head down to her feet.
  category: action
  evidence_refs:
  - ev:10
