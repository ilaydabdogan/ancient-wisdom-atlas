canonical_text:
  quote: ''
  summary: The passage describes Baganda funeral and mourning practices for a child
    in a twin-rite context, peasants, wives, small children, pregnant women, and children
    born feet first. It records offerings, plantain rites, treatment of bodies, grave
    rites, succession through heirs, mourning restrictions, beer rites, shrine-making
    for ghosts, separate graves for mother and unborn child, and crossroads burial
    for feet-first children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the child/twin-rite context, relatives were told the child had gone away
    in euphemistic terms, and offerings were made to Mukasa to avert his anger from
    the clan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large ant-nest clods of earth were placed around the cooking pot on the grave.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The parents visited Mutaka's garden a second time and again performed a ceremony
    of stealing plantains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Flowers from plantain stems were made into a small bundle called the twin
    and placed on the bed where the child lay before death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: There was no mourning for the child, while songs and ceremonies for twins
    continued as though the child were alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: A peasant funeral was hurried; the body was taken to the clan burial ground,
    mourning lasted about a month, and an heir was then installed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The installed heir took charge of children, could wed a childless wife, received
    a consort called lubuga under stated kin conditions, and acquired goats and small
    property.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: A widow with children went to live near the grave to keep it in order; after
    mourning, participants shaved their heads, and female mourners waited for husbands
    to fetch them with a pot of beer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: When a peasant's wife died, her body was not washed but wrapped in barkcloth;
    her mother prepared sponge and butter, relatives smeared butter on the face, and
    a pointed stick was used before a hoe to begin the grave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The wife's funeral ended with beer drinking, head shaving, and nail cutting;
    the husband destroyed her house, kept materials for a new house, and left the
    roof ring and cooking stones on the old site.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: At a small child's funeral, mourners stayed two days in the house, went to
    the grave each morning, and on the second day the mother threw two or three fishes
    onto the fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the fish-on-fire act, mourners shaved their heads and left, while the
    mother continued mourning alone with restrictions on hair, nails, meals, sleep,
    and separation from her husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: When the mother's mourning ended, an heir to the child was brought, the mother
    shaved her head, a mound was made on the grave, beer was poured on it, and the
    ceremonies ceased.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: Relations made small shrine huts at graves for ghosts and appointed heirs
    because they believed an unprovided ghost would return and haunt them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: For a woman who died pregnant, the foetus was removed because the ghosts of
    mother and child were held to require separate graves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Children born feet first were killed at birth, buried at crossroads, and their
    ghost was feared by women.
  category: action
  evidence_refs:
  - ev:6
