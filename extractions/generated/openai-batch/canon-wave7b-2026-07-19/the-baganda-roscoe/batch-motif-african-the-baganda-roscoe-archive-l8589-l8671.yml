canonical_text:
  quote: ''
  summary: The passage describes clan traditions concerning the Batidyala or Crow
    Clan, the Genet Clan, and the Rainwater Clan. It explains a Crow Clan origin from
    residence near nesting crows, the Genet Clan's descent from an iron worker and
    its royal smith role involving spears at a prince's crowning, and the Rainwater
    Clan's office of drawing and pouring water for the king before later incorporation
    into the Lion Clan through an asserted secondary totem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Batidyala say they gave daughters to men of the Otter Clan, who presented
    them to kings as members of their own families; by this means the Batidyala claim
    relation to the royal family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Crow Clan name is explained by a forefather cultivating land near a large
    tree where crows built nests; the name later became attached to the group and
    the birds were taken as their totem.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Genet Clan traces descent from Luija, an iron worker who lived in Bunyoro.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Walukaga came from Bunyoro to Kintu to be his smith and make his weapons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kintu was fond of Walukaga, called him his brother, and often worked with
    him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a prince was crowned, Walukaga brought a bundle of spears and handed
    them to the Katikiro when the prince was led to be proclaimed king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kintu joined the Leopard and Genet Clans because he wanted the Katikiro and
    Walukaga to belong to the same clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In later times, members of the Leopard Clan could claim to belong to the Genet
    Clan when the king sent to kill a Leopard Clan member.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Rainwater Clan's father Bayi came from Bunyoro, and the clan's office
    was to draw and pour water for the king to wash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Rainwater Clan joined the Lion Clan after a Lion Clan underchief asserted
    that his second totem was rainwater and claimed kinship with them; the Rainwater
    Clan later became incorporated into the Lion Clan and ceased to be an independent
    clan.
  category: sequence
  evidence_refs:
  - ev:7
