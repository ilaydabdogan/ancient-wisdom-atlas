canonical_text:
  quote: ''
  summary: 'The passage describes Baganda ceremonies following the birth of twins:
    a procession to waste land, a plantain-flower rite involving the parents and a
    boy called Salongo Mukulu, washing and shaving of the parents, preservation of
    hair and nail parings, new barkcloth garments, a goat killing near the fireplace,
    testing of the twins'' legitimacy or clan preference with umbilical-cord material,
    naming of twins after the god Mukasa, preservation and disposal of birth remains,
    dancing, sham fighting between parental clans, sprinkling for blessing and fruitfulness,
    and preparations to visit the father''s parents with gifts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Friends and relatives bring reed torches, form a procession, and go with the
    father and mother of twins to nearby waste land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the waste land the mother lies on her barkcloth within a circle of people
    who have their backs turned, and a plantain flower is placed at her genitals by
    her husband before the boy Salongo Mukulu removes it by a prescribed clan-specific
    gesture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the plantain-flower rite, the parents are taken to running water or
    a well, washed, and shaved; their hair and nail parings are tied in barkcloth
    and kept until the man goes to war, completing the taboo called lukanda.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents receive new barkcloths; the father wears a piece of the old barkcloth
    underneath, and the mother wears two barkcloths because of her dignity as mother
    of twins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At home a goat is killed near the fireplace, described as the first blood
    the parents would have seen since the birth of the twins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mutaka receives a goat and a barkcloth in recognition of his services.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The twins are brought out for a legitimacy test in which an umbilical cord
    is dropped into a mixture and watched to see which side of the vessel it moves
    toward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Movement of the umbilical-cord material toward one side is interpreted as
    the ghost of the afterbirth preferring the father's clan or wishing to be nursed
    by the mother's clan.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The children are washed with the testing fluid and then named after the god:
    boys take the name Mukasa and girls Namukasa; both are said to be under the god''s
    protection.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pieces of umbilical cord are combined with the tongue of a white fowl into
    objects called 'twins' and preserved by the clan in bead-decorated barkcloths.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The afterbirths are put in pots and placed on waste land or in an ant hillock,
    covered with plantain leaves and fibre, after having been dried near the fireplace
    and in the sun.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Dancing continues through the day; the parents' clans take sides in a sham
    fight using plantain-fibre shields and reed spears while the parents are carried
    on men's shoulders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The opposing clan groups cry formulas that place the evil of the twins on
    the father's clan or on the mother's clan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: In some clans the parents sprinkle people with a mixture of water and white
    clay, or according to some reports urine, which is said to bless them and make
    them fruitful.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: During the next two or three days, preparations are made to visit the father's
    parents with food, a goat, and barkcloths.
  category: sequence
  evidence_refs:
  - ev:8
