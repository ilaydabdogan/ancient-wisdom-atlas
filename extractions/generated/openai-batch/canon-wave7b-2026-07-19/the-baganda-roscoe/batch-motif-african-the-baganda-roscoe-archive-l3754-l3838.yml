candidate_motifs:
- id: motif:1
  label: Sacred twins under divine protection
  taxonomy_refs:
  - sacred_twins
  basis: The ceremony centers on twins; boys and girls are named after Mukasa or Namukasa
    and are said to be under the god's protection.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage is ethnographic ritual description rather than a narrative
    myth episode.
- id: motif:2
  label: Ritual transition and taboo completion after twin birth
  taxonomy_refs:
  - initiation
  basis: The parents undergo a structured sequence of procession, washing, shaving,
    hair and nail preservation, new clothing, and completion of the taboo called lukanda.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy label 'initiation' is applied cautiously because the passage
    describes post-birth twin-parent rites, not a named initiation into an age grade
    or secret society.
- id: motif:3
  label: Birth-remains divination of clan affiliation or preference
  taxonomy_refs: []
  basis: An umbilical cord is dropped into a mixture, and movement toward one side
    of the vessel is interpreted as the ghost of the afterbirth preferring the father's
    clan or the mother's clan.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames this as a legitimacy test and clan preference, not
    as a general divinatory system.
- id: motif:4
  label: Preserved ritual doubles of twins from umbilical remains
  taxonomy_refs:
  - sacred_twins
  basis: Pieces of umbilical cord are combined with a white fowl tongue into objects
    explicitly called 'twins' (balongo) and preserved by the clan in decorated barkcloths.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The function of these preserved objects beyond clan preservation is not
    fully explained in the passage.
- id: motif:5
  label: Ritual killing and reintroduction of blood after birth taboo
  taxonomy_refs:
  - sacrifice
  basis: A goat is killed near the fireplace, and the passage identifies this as the
    first blood the parents have seen since the birth of the twins.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not specify a divine recipient or explicitly call the
    killing a sacrifice.
- id: motif:6
  label: Fertility blessing through sprinkling liquid mixture
  taxonomy_refs: []
  basis: In some clans, parents sprinkle people with water and white clay, or reportedly
    urine, and the act is said to bless them and make them fruitful.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage reports variation among clans and an alternative explanation
    of the liquid.
- id: motif:7
  label: Ritualized opposition between parental clans
  taxonomy_refs: []
  basis: The father's and mother's clans take sides, stage a sham fight, and exchange
    cries assigning the evil of the twins to the opposing clan.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not explain the wider meaning of the 'evil of the twins'
    beyond the quoted formulas.
