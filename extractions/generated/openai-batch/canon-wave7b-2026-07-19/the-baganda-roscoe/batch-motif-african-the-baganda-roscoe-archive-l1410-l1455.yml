canonical_text:
  quote: ''
  summary: The passage describes household slavery and inheritance limits, peasant
    garden communities, children herding animals and resting by an always-burning
    hearth fire, and protective fetiches placed over doors or in gardens against theft.
    Stories say a fetich could send a snake to confront a thief, tabooed garden food
    could catch or kill a thief, and a night thief killed in a garden might be marked
    with a plantain around the neck and left in the road.
  language: English
