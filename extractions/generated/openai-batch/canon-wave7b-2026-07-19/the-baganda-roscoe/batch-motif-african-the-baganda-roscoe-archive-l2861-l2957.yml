canonical_text:
  quote: ''
  summary: The passage describes pregnancy avoidances and food taboos, beliefs about
    influences on the unborn child, a clan ritual for testing a child's legitimacy
    before birth, and procedures for royal pregnancies involving the King's maternal
    aunts, the Nabikande, and the title Mugema.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant woman was restricted from contact with objects or spaces associated
    with men, including a man’s feet, a doorway when a man entered, vessels from which
    a man had drunk, and garments a man had worn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a pregnant woman visited elsewhere, her husband sent a boy of his clan
    to beat the grass beside a narrow path to remove evil effects thought to have
    been left by a man who had passed earlier.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pregnant woman was expected to avoid unhealthy children, wild animals such
    as monkeys, and laughing at a lame person, because these were thought able to
    affect the child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: It was considered wise to keep wives within an enclosure and restrict access
    so that influences on the unborn child would be good.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: During pregnancy a woman observed food taboos, including restrictions on most
    salt, baked plantains, gonja plantain, certain beans, yams, goat-head meat, and
    a swamp fruit called mutungulu.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pregnant woman had to drink a little water before eating, and she was not
    to eat hot food, because the child was thought to need water and to reach toward
    the food she swallowed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child born without pigment on its hands was explained as having been scalded
    by the mother’s hot food during pregnancy, and the mother was blamed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some clans tested a child’s legitimacy before birth through nude inspection
    of the pregnant woman by women of her husband’s clan, a meal for the couple, an
    all-night dance, a second inspection, and the nude husband jumping over her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the legitimacy test, if the wife had done wrong with another man, the child
    was supposed to die after the ceremony; if it was the husband’s child, it was
    supposed to gain strength.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a wife of the King was pregnant she was sent to the King’s Mother’s sister
    at a house near the royal enclosure called Nabikande.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A king appointed two of his mother’s sisters, called his Little mothers, to
    serve as midwives to his wives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Little mothers lived on private land of the King’s wives near the royal
    enclosure, where no man could walk without special permission; trespassers were
    put to death.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: The chief midwife took the title Nabikande, visited the King’s wives, inspected
    those who said they were pregnant, and took them away if she judged them to be
    with child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Nabikande was accompanied by a female servant of an officer called Mugema,
    and that servant received the title Mugema while carrying out the duties of her
    master.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Mugema is described as a chief who rescued King Kalimera as an infant in Bunyoro,
    brought him up, restored him to Uganda, and was called the King’s father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The term used for a royal wife being with child was etu lya Mugema, and the
    note states that this term applied only to the King’s wives.
  category: speech
  evidence_refs:
  - ev:7
