canonical_text:
  quote: ''
  summary: 'The passage describes Baganda beliefs and practices concerning ghosts:
    capture and annihilation of troublesome ghosts, offerings at shrines, ghost-caused
    illness and possession, exorcism by medicine-men, sacrificial feasts and libations
    to relative ghosts, dedication of servants to ghosts, prosperity expected in return
    for proper treatment, and beliefs about ghosts of certain animals and reptiles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine-man could secure a ghost in a vessel or pot, carry it to waste
    land for burning by a grass fire or to a stream for drowning, and the ghost was
    said to be annihilated in either case.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men usually resorted to gods and fetiches in danger or sickness, though a
    thank-offering might be made after unexpected good fortune attributed to gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ghosts were thought to suffer from cold and thirst but not hunger; shrines
    could have fireplaces, firewood, barkcloths, beer poured at the entrance, and
    a pot of beer inside.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some ghosts claimed tracts of country and forests, and a person entering or
    cutting firewood there could be struck by the ghost and fall ill.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A medicine-man could identify the cause of an illness attributed to a ghost
    and supply a remedy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Neglecting to appoint an heir or heiress, especially after a man's sister
    died, could lead her ghost to make his children ill or kill them until the neglect
    was corrected.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Killing a goat or fowl that had been devoted to a ghost could annoy the ghost
    until the animal was replaced.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Both men and women could be possessed by ghosts, usually appearing as wasting
    sickness or mild insanity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A medicine-man exorcised a ghost by incantations and by making the sick person
    inhale smoke from burned drugs near the bedside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fits were regarded as caused by ghostly possession, and bystanders avoided
    the sufferer's saliva for fear of infection.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A chief or wealthy person could make a feast for the ghost of a relative,
    kill an animal at the shrine, share the meal with invited people, let the blood
    flow by the shrine door, and pour beer there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Slaves were sometimes dedicated as servants to a ghost, and a girl so offered
    could marry when grown if her clan found a substitute.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: In return for such attentions, a ghost was expected to bring royal favour,
    increased wealth, and more children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Lions, leopards, and crocodiles could become ghosts after death and be worshipped,
    but only in certain localities.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: A sheep was killed by being led to an open space, struck from behind with
    an axe handle when not looking, and then having its throat cut; the axe used was
    kept by the house doorway and called the plague of the sheep.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The stated reason for the sheep-killing method was that if the sheep saw the
    person who killed it, a curse would rest on that person.
  category: speech
  evidence_refs:
  - ev:8
