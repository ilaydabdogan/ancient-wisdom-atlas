canonical_text:
  quote: ''
  summary: 'The passage describes Baganda royal attendants and several rites associated
    with the king: a leopard hunt and preparation of a royal rug, human killings connected
    with royal invigoration and regnal confirmation, and a life-prolonging ceremony
    performed by Nankere in which the king changes clothing, exchanges beer, is separated
    from his mother, and receives a youth who is then killed by the body-guard.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Secret servants are said to remain on guard, protect the King or his Mother,
    learn what is happening in the country, and report through the Katikiro to the
    King.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reigning two or three months, the King goes to hunt a leopard; after
    it is killed, its carcass is brought to the royal enclosure and left in a house
    overnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The King ties two cowry-shells on the leopard’s paws, pours a little beer
    into its mouth, and blows over the carcass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kasuju takes and skins the leopard; its skin is prepared and later stitched
    to a lion’s skin to form the royal rug.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: People seek the leopard flesh to boil it for fat, which is considered medicinal
    when mixed with herbs and used externally.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The royal rug is used on state occasions, and heirs of chiefs place cowry-shells
    or beads on it when thanking the King for confirming them in office.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: No one is allowed to step on or over the royal rug; doing so is said to merit
    instant death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the leopard hunt, the King or his representative Kago hunts a bushbuck;
    after the animal is killed, Kago catches a man and takes him before the King by
    night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The King slightly spears the captured man; the man is then strangled and his
    body is thrown into a papyrus swamp so it will not be discovered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Another ceremony involves catching and binding a man, bringing him before
    the King, having the King wound him slightly with a spear, and then putting him
    to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that these men were killed to invigorate the King.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Commoners are described as spearing an ox, which is then killed and eaten,
    when they become heirs to valuable property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the King has reigned two or three years, two men are brought before
    him; one is speared and later killed outside the enclosure, while the other is
    spared.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The spared man becomes assistant to the chief of the body-guard, and his first
    duty is to throw the dead man’s body into the nearest river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Nankere is a Lung-fish Clan chief who performs a ceremony intended to prolong
    the King’s life and is otherwise not permitted to see the King.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: For the life-prolonging ceremony, Nankere selects his son, or a near relation,
    who is fed, clothed, treated as a prince, and kept in a special house for a month.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: On the way to Nankere, the King stops at a temple of Mukasa, changes clothing,
    leaves the clothing there, leaves his anklets, and does not put on others until
    receiving new ones from Nankere.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: At the destination, Nankere meets the King and gives him a gourd of beer,
    and the King gives Nankere a gourd in exchange.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The King’s Mother is present to see her son for the last time; Nankere tells
    her she is no longer to communicate with him because he is now of age.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: Nankere tells the King that he is now of age and should live longer than his
    forefathers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:21
  text: Nankere presents his son to the King; the King passes him to the body-guard,
    who take him outside and kill him by beating him with closed fists.
  category: action
  evidence_refs:
  - ev:8
