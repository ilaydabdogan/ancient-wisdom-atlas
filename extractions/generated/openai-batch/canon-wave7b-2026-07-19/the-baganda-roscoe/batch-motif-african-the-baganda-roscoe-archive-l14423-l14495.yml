canonical_text:
  quote: ''
  summary: 'The passage describes legal and punitive customs: fatal restraint by a
    heavy log or forked neck stick, the powers of royal messengers to compel State-work
    and seize property, appeals to the King, courts of the Queen and King''s Mother,
    intercession by a royal wife, the sending of convicted traitors or rebels to sacrificial
    places because of the King''s obligation to the gods, and fines for accidental
    killing or non-malicious homicide.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person restrained with a heavy log on the chest and both hands extended
    could die after two or three nights; a forked neck stick was later introduced
    by Arabs but was used only briefly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the King or Katikiro ordered people to perform State-work, a messenger
    could seize property if the order was not obeyed at once.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A chief could appeal to the King if a messenger was thought too arbitrary,
    and the King could restore seized property.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Quarreling with or striking one of the King's messengers was treated as a
    serious offence and heavily fined, even when the messenger had been wrong.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Queen and the King's Mother tried cases among their own servants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Persons facing serious charges in those courts might seek intercession from
