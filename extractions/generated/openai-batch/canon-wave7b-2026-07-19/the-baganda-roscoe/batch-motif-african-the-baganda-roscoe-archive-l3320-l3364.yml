canonical_text:
  quote: ''
  summary: 'The passage describes Baganda infant care: bathing with warm water, early
    feeding with banana and milk, preserving a child''s hair until the naming ceremony,
    kin oversight of the mother and child, tying bells to a child''s legs when learning
    to walk, carrying children in slings or on the hip, and interpreting upper teeth
    appearing before lower teeth as an evil omen concerning the child''s future treatment
    of its mother.'
  language: English
  quote_policy: summarized
