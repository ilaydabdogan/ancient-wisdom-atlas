canonical_text:
  quote: Dreams were regarded as important, and as the means of communication between
    the living and the dead.
  summary: 'The passage describes domestic and travel customs: travel is limited and
    governed by omens; travellers defer journeys after certain encounters or bodily
    signs; a father with a nursing child performs jumping precautions involving the
    child''s bedding and his wife; travellers consult a medicine-man and deity for
    blessing; returning or changing service involves jumping over the chief wife;
    dreams are treated as communications from the dead; rainstorms prompt sleeping;
    and ablution water and baths are regulated by marital rules.'
  language: English
  quote_policy: quoted
