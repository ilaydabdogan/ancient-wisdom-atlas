canonical_text:
  quote: ''
  summary: During Suna's reign, a medium named Kigemuzi criticizes the king, saying
    he does so by order of the gods. He is brought bound before the king, refuses
    to give an oracle while bound, and answers threats and violence with reciprocal
    pronouncements. That night lightning strikes the royal house and scorches Suna.
    Kigemuzi explains that the thunder god is angry over his treatment. Suna gives
    Kigemuzi women and cattle as atonement, and the king's mother settles him on land
    to propitiate the gods and protect her son. The passage then notes Suna's burial
    and temple, and the accession and military reforms of Mutesa Mukabya.
  language: English
  quote_policy: summarized
