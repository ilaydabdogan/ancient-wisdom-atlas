canonical_text:
  quote: ''
  summary: The passage describes Baganda fetiches, called mayembe, as varied objects
    made from horns, wood, or clay mixtures. Medicine-men fill or form them with substances,
    and the objects are thought to become vehicles of named gods whose powers pass
    to owners or to medicines poured into them. Possession is said to ward off evil
    and bring blessing, and they are kept in houses with daily drink placed before
    them. Different users, including warriors, huntsmen, and thieves, have fetiches
    with special powers.
  language: English
  quote_policy: summarized
