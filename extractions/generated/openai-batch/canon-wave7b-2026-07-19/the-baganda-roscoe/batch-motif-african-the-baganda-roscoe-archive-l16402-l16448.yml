canonical_text:
  quote: ''
  summary: 'The passage describes practices connected with Dungu, Katonda, and Kitaka:
    hunters make offerings and obtain protective or hunting charms from Dungu; Dungu''s
    shrine includes a special drum containing a composite fetich, and his medium becomes
    possessed through pipe-smoking and drumming. Katonda is described as creator and
    father of the gods, with a small temple, a night-oracle medium, restrictions on
    light, and occasional cattle offerings. Kitaka is described as an earth-god consulted
    by the King concerning condemned people and their ghosts.'
  language: English
  quote_policy: summarized
