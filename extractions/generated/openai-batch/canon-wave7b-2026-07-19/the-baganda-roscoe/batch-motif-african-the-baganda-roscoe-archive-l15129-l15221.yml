canonical_text:
  quote: The ghosts of kings were placed on an equality with the gods, and received
    the same honour and worship
  summary: The passage describes Baganda royal ghost temples containing a king's jawbone
    and umbilical cord, the worship and consultation of deceased kings through relics
    and mediums, temple offices held by royal women and custodians, public receptions
    for royal ghosts, offerings, and occasional killings of captives so their ghosts
    might serve a deceased king.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Royal temples called malalo contained the jawbone and umbilical cord of a
    particular king, while the king's body was buried elsewhere in a mausoleum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each king's ghost had its own temple, because several ghosts were thought
    not to agree to share one temple.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ghosts of kings were honoured and worshipped like gods, foretold events
    concerning the State, advised the living king, and warned him about possible war.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the King visited a predecessor's temple, the jawbone and umbilical cord
    were placed on the temple throne, handed to the King for examination, and returned
    to the custodian.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Widows of the late king and the medium had houses inside the temple enclosure,
    and some widows slept inside the temple to guard it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the medium was under the influence of the ghost, he spoke in the same
    tone and expressions used by the late king.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The late king's principal wife and other special widows held temple offices
    that were maintained by replacing women when an office-holder died or married.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Queen-dowager, called Nalinya after the king's death, was the chief guardian
    of a temple and lived near it; her office was also perpetuated by succession.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At receptions for royal ghosts, a drum summoned people to the temple, people
    brought food, the decorated jawbone and umbilical cord were set on a throne, and
    entrants bowed and greeted the jawbone as the King.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During some receptions, the deceased king gave a message to the crowd through
    the medium.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After visiting a predecessor's temple, the reigning King ordered the body-guard
    to capture people who had not passed a named place; the captives were bound and
    taken back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Captives were slain within the temple precincts so that their ghosts might
    minister to the late king's ghost.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A king's ghost sometimes demanded slaughter by asking for slaves, but usually
