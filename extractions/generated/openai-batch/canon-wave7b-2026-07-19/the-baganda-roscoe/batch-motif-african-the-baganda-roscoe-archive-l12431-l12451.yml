  quote: ''
  summary: The passage describes Mutesa authorizing chiefs to wear imported calico
    by sending a small square of calico as a sign, after which the chief paid cattle
    to the King and changed from barkcloth to calico. It also notes the spread of
    guns, the decline of spears among wealthy people, royal canoe trade across the
    Lake to Karagwe and the southern mainland, and a figure caption naming Mutesa's
    queen Damali and women.
