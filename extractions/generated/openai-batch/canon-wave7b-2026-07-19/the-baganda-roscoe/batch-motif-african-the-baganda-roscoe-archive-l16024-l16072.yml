canonical_text:
  quote: ''
  summary: The passage describes Kalyembula's imprisonment, long hair, renaming as
    Luwoma, reputation for settling disputes, and later pardon by King Mulondo. It
    then describes Mulondo's settlement with Mukasa, the building of Kibuka's temple,
    the placing of Kibuka's relics and possessions in it, the organization of mediums
    and priests, the temple's sacred forest setting, offerings made by the king and
    chiefs, district labor for rebuilding, and restrictions placed on Chief Kanyolo
    and nearby roads during temple construction.
  language: English
  quote_policy: summarized
