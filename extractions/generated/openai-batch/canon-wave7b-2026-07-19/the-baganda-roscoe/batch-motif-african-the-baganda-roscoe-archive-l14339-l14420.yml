- id: obs:4
  text: The passage states that there were no prisons; when the King or a chief ordered
    confinement, the person was put into stocks.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Foot stocks were heavy logs with a hole for the foot, pegs to prevent withdrawal,
    and a plantain-fibre rope allowing the prisoner to lift the log while walking.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stocks rubbed the foot and ankle, caused sores, and could cripple the
    prisoner; pegs were checked twice daily while the prisoner was guarded.
  category: sequence
  evidence_refs:
