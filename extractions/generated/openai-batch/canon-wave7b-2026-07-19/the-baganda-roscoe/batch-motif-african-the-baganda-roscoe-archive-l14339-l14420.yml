canonical_text:
  quote: ''
  summary: 'The passage describes punishments and confinement practices: fines or
    killing for theft, killing and denial of burial for house-breaking, confinement
    in stocks rather than prisons, guards’ power over prisoners, torture to obtain
    evidence, parole for some prisoners connected with sacrificial places, and a more
    severe form of stocks restraining arms and a leg.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman caught stealing food from another woman's garden was fined, and her
    husband or master had to pay the fine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man caught stealing food was killed immediately; the stolen food was tied
    around his neck and his body was thrown into the road.
  category: action
  evidence_refs:
  - ev:1
