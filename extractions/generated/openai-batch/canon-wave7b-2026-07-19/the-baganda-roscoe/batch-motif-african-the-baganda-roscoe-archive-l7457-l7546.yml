canonical_text:
  quote: ''
  summary: A clan origin account explains how Katenda, son of Mbiru, became involved
    in disputes over a borrowed axe and a borrowed canoe. After an adverse judgment
    and a fine judged excessive by Mbiru's family, they left secretly by canoe, came
    to Uganda, presented themselves to King Kintu, and became the king's canoe-builders
    and sailors, with Gabunga appointed admiral. The passage also lists Mbiru's children
    and the clan's estates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Katenda lent an axe to a man cutting floats for fish-traps; the axe-head fell
    into water, was searched for, recovered, and returned to Katenda.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Katenda later borrowed the same man's canoe, used it for fishing, drew it
    up on the beach, and went home with his fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The canoe owner pushed the canoe off the beach, loaded it with stone, sank
    it, and then demanded the canoe from Katenda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Katenda and Mbiru offered to replace the canoe or make other reparation, but
    the canoe owner refused compensation and brought an accusation before the chief.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief's verdict went against Mbiru and Katenda, and they were fined ten
    women, ten cows, ten copper bangles, and ten goats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mbiru called his sons and daughters together; they agreed that the fine was
    excessive and decided to leave for a new country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: They secretly packed their goods, left by night in canoes, paddled for several
    days, and came to Uganda.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After landing, they were told the country was Kyagwe and that Kintu was king,
    and they were directed to the capital.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kintu was told that people wearing skins wished to see him and desired to
    become his subjects.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gabunga answered Kintu, recounting the group's background, the canoe loss,
    and the imposed fine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The clan became the king's canoe-builders and sailors, and Gabunga was made
    admiral.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage lists the clan's chief estates in Busiro, Kyagwe, Bulemezi, Mawokota,
    and on Sese Island.
  category: setting
  evidence_refs:
  - ev:7
