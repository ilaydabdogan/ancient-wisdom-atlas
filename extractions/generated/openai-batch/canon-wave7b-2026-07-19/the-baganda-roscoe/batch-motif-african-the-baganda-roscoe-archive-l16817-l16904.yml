  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: When a child was born, the parents were required to offer a goat and beer
    to Selwanga, or a fowl if poor; neglecting this thank-offering was said to bring
    disaster.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The priest sometimes went to Sese to ask cows from Mukasa because Nalwanga,
