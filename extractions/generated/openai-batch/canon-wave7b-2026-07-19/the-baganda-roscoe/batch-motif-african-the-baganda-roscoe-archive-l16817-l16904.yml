  quote: ''
  summary: The passage describes a temple cult of a python deity associated with milk-feeding,
    animal offerings, river and fish control, fertility blessings, new-moon ceremonies,
    possession oracles interpreted by a priest, thank-offerings after childbirth,
    ritual links with Mukasa of Sese, and annual royal petitions for children. It
    then begins a description of forest gods consulted by hunters and timber cutters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The python could go in and out of the temple hut; the medium had a bedstead
    on the opposite side of the hut.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman bearing the title Nazhnba lived in the temple and fed the python fresh
    milk daily while the medium brought the milk in a wooden bowl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The python went between the temple and the river and was supplied with fowls
    and goats tied to stakes for it to eat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The python was supposed to have power over the river and its fish; fishing
    expeditions were preceded by offerings and followed by a feast in which priests
    supplied fish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The python was regarded as the giver of children; young couples and sterile
    women sought its blessing and brought offerings such as beer and goats.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the new moon, a seven-day ceremony was held, work stopped, a drum was sounded,
    and people gathered with requests and offerings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priesthood of this deity was confined to members of the Heart Clan, and
    the chief of the estate where the temple stood was always the priest.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The priest received offerings and requests, then gave the medium beer and
    milk from the python's bowl mixed with white clay.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After drinking, the medium was possessed by the python's spirit, moved like
    a snake, uttered unusual sounds and unintelligible words, and was interpreted
    by the priest while the temple drum was beaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the oracle ended, the medium collapsed exhausted; the priest named Lukukirizi
