- id: obs:1
  text: A fowl's empty boasting is discovered; the passage says fowls thereafter escape
    cats because of enmity and take refuge with man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lion and a crocodile quarrel over which is stronger; the crocodile claims
    power in water and the lion claims power on dry land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: While a lion attacks a buffalo by the lake, the crocodile seizes the buffalo's
    leg, drags both buffalo and lion into the water, and drowns and eats them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The crocodile boasts to the lion's son that he killed the young lion's father,
    causing the young lion to seek revenge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young lion later attacks a buffalo away from the lake; when the crocodile
    tries to pull the buffalo toward the water, the lion pulls the other way, overcomes
    and kills the crocodile, and avenges his father.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tale concludes that lion and crocodile are said to be equal in strength,
    one on dry land and the other in water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A leopard and a dog are described as great friends, but the leopard owns the
    house and treats the dog more as a servant than a friend.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The leopard and dog gather swarming ants; the leopard's wife cooks some, and
    the rest are fried and dried in the sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The leopard plans to take four bundles of dried ants to his wife's relations;
    he dresses well, carries his harp, and tells the dog to carry the ants.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: On the road, the leopard plays the harp and sings that he has a load of white
    ants like the one the dog carries.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The dog goes aside into the grass, eats all the ants, refills the packets
    with dry grass, and ties them up as before.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The dog borrows the harp and sings that the load is rubbish for the wife's
    relations; the leopard praises the song without recognizing the substitution.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: When they reach the wife's relations, the relations greet the leopard and
