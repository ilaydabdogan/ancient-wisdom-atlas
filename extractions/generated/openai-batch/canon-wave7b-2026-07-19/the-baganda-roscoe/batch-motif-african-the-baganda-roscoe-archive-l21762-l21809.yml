canonical_text:
  quote: ''
  summary: 'The passage describes Baganda food preparation and meal service: plantains,
    potatoes, leaves, vegetables, beans, and semsem are prepared and cooked; cooked
    plantain is mashed and packed hot in leaves and a basket; food is carried to the
    master''s house; a chief''s wife or server may serve it; the master receives and
    distributes meat; participants wash their hands before eating and do not drink
    until the meal is finished.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Experienced women peel plantains quickly, using four slashes down the fruit
    before dropping it onto a prepared leaf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Potatoes are scraped, with bad places cut out; a careful woman washes them
    before scraping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Leaves used as spinach are prepared carefully by removing stringy stems and
    leaves that are too old.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Vegetables may be cooked with semsem and salt as a sauce for plantain food
    when there is no meat; potatoes and beans may be cooked together and mashed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cooked plantain-food is pressed together while still in leaves, placed in
    a basket on arranged leaves, covered with hot leaves, and covered again to keep
    it hot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cold food is avoided; food is customarily served very hot.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Meat and other vegetables are placed in the same basket with the mashed plantain
    and carried to the master's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A chief's wife usually serves the food, but her participation depends on whether
