  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before eating, every person washes hands with water or with sponges supplied
    with the food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: No one is expected to drink until the meal is over, and usually no drink is
