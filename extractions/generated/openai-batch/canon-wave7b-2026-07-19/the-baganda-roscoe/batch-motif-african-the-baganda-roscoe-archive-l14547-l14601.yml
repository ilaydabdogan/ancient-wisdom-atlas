  summary: The passage describes social restraint through fear of gods and medicine-men,
    hospitality toward strangers, varied attitudes toward truth and oaths, the binding
    force of blood-brotherhood, penalties for lying to authority, feudal land tenure,
    royal ownership of land, restrictions on burial, and royal control over taxes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crime is described as being restrained by fear of the gods and by fear of
    powers supernaturally granted to medicine-men to detect criminals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a wrongdoer escaped detection, the passage says he was not troubled by
    conscience and did not seek restitution.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Strangers and visitors are described as receiving food, shelter, generosity,
    respect, and protection of their property while in a host's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lying that inconvenienced a superior was punished, while lying in other cases
    could be laughed at or treated as clever.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The oath of blood-brotherhood is described as binding, solemn, and dreaded
    if violated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other oaths, including the common oath 'By my Mother,' are described as lightly
    made and lightly set aside.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The penalty for lying to those in authority is described as mutilation, unless
    the liar could escape before discovery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Land tenure is described as feudal, with men holding land from chiefs in exchange
    for work and military service.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men are described as making barkcloths, laying roads, building bridges and
    houses, while women cultivated the fields.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: All land is described as belonging to the King alone, and sale of land was
    not possible.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Clans possessed freehold burial grounds but could not sell them to outsiders;
