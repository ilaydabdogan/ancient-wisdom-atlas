canonical_text:
  quote: ''
  summary: 'The passage describes royal transition rites: sacred fire and a signal
    fire are maintained, mourning ends after the late king''s body is placed in the
    tomb, a royal hunt and head-shaving take place, one of two captured men is killed
    and hidden in a river, royal drums are beaten, and the king and queen are publicly
    presented with regalia and new barkcloths during coronation ceremonies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire in the King's sleeping house was made from sacred fire kept by Senkole;
    the signal fire at the entrance to the King's enclosure was lit from the same
    fire, kept burning, and guarded by a newly appointed chief, Musoloza.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When told that his Father's body had been placed in the tomb, the King ordered
    drums to be sounded so the people would know that mourning was to end.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the next day, Kalibala of the Grasshopper Clan brought a gazelle and released
    it for the King, who hunted and killed it and then shaved his head to remove traces
    of mourning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunt was said to commemorate king Kimera, who was born in Bunyoro and
    returned to Uganda while hunting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the hunt, two men were captured; one was strangled and his body thrown
    into a river under papyrus roots so it would not be found, while the other man's
    life was spared.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two men captured for the ceremony were found on a public road carrying
    barkcloths tied in a roll and slung on the left shoulder.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The royal drums called the Mujaguzo were brought by the Mugenia on the evening
    after the hunt and beaten; the following morning the chiefs and people gathered
    for the final coronation ceremonies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A stool said to have been introduced by King Mulondo was placed on a barkcloth
    mat and covered with a royal rug made from lion, leopard, and eagle skins stitched
    together.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The King and Queen were carried on royal bearers' shoulders; the King mounted
    the stool with the Katikiro's help, and the Mugeina dressed the King in new barkcloths
    while the Queen was also publicly robed.
  category: sequence
  evidence_refs:
  - ev:6
