  summary: The passage describes Baganda rope- and cord-making from plantain, aloe,
    and shrub bark fibres; mat-making from reeds, papyrus, and later palm-leaf strips
    learned after Arab and Swahili traders appeared; and soap-making introduced by
    Arabs for washing imported cotton goods and later the body.
