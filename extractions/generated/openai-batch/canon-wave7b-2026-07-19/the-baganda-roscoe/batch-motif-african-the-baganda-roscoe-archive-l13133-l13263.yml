canonical_text:
  quote: ''
  summary: The passage describes Baganda government practices involving state labor
    for roads, overseers and their perquisites, upkeep and repair of roads, sanitary
    arrangements and privacy customs, and a multi-level procedure for assessing and
    collecting taxes through royal, administrative, district, and local officials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After state-labor tasks began, workers had to bring food and beer periodically
    to the overseer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The office of overseer for road-making or building was desired, and those
    receiving it thanked the King and the Katikiro.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Roads in the capital were maintained by the people whose enclosures adjoined
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Principal roads were about twenty yards wide, other roads were narrower, and
    small branch-roads were not more than about three yards wide.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Katikiro sent orders throughout the country calling people to repair the
    roads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each house paid twenty-five cowry-shells to the man sent by the Katikiro to
    bring in workmen; the King received two-thirds, and the Katikiro’s third was further
    divided among chiefs, the overseer, and himself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A person passing along a road while it was being repaired could be seized
    by the workmen and forced to work for a time before continuing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Each chief had a cesspool in his enclosure, described as a covered pit with
    timbers, an earth mound, and a round opening.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Baganda avoided being seen when using these places, and no one would tell
    where a person had gone in such a case.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Chiefs’ cesspools were surrounded by reed fences and roofed over, while peasants
    had no sanitary structures and instead used waste land or gardens and covered
    the place afterwards.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: Peasants objected to using a common cesspool and disliked using the same place
    twice, giving fear of being seen by an enemy as their reason.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: When tax collection approached, the King, Katikiro, and Kimbugwe fixed the
    date, and the date was announced in the Council.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The King appointed a special tax-collector for each district, while the Katikiro,
    Kimbugwe, Queen, King’s Mother, and District-Chief each added representatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Six men appointed to a district visited principal sub-chiefs in person and
    sent messengers to less important chiefs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: The King’s tax-collector and associates stayed at the District-Chief’s enclosure
    while their men counted houses and inhabitants.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:16
  text: One cowry-shell was brought by the collector’s assistants to represent each
    house, counted, and then used as part of the process before tax collection.
  category: object
  evidence_refs:
  - ev:5
- id: obs:17
  text: The demanded taxes included cattle from each sub-chief, barkcloths and one
    hundred cowry-shells from each peasant, and goats and hoes from smaller chiefs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:18
  text: Tax collection often took two months or more because barkcloths and hoes had
    to be made and cattle gathered.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:19
  text: Collected cowry-shells and barkcloths were counted and bundled, while cattle
    were sent ahead slowly toward the capital.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:20
  text: The King’s tax-collector took the total amount to the Katikiro, who examined
    it and heard details about houses, people, barkcloths, and cowry-shells from each
    sub-district.
  category: action
  evidence_refs:
  - ev:6
