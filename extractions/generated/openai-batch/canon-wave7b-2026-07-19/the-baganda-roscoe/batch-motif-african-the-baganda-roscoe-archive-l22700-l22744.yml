canonical_text:
  quote: ''
  summary: The passage describes restrictions and rites connected with wells and springs
    in Buganda. A royal drinking-water well was reserved for the king and a limited
    number of his wives. Other wells were inherited, venerated, and believed to be
    protected by water-spirits. Chiefs could offer human or animal sacrifices at wells,
    hold a sacred meal, place a new hoe in a shrine for the water-spirit, and organize
    annual clearing, cleansing, and shrine renewal to keep the water safe and flowing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Because good water could become scarce, certain wells, mostly springs, were
    protected by restrictions.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king's drinking-water well was set apart for his sole use, and only a
    limited number of his wives were allowed to draw water from it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some wells were famous over many generations, believed to be protected by
    water-spirits, passed between families or chiefs, venerated, and kept sacred.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In some places, a newly appointed chief offered a human sacrifice to the water-spirit
    at the well; the victim was often the chief's own child, and the stated aim was
    securing prosperity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In other places, an animal was offered, and people assembled by the well to
    eat a sacred meal and drink beer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the sacred meal, the chief placed a new hoe in a shrine built for the
    water-spirit beside the well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each year the district chief beat his drum to call people to clear paths to
    the well, clean the well, and cut back tall grass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Neglecting the clearing was feared to make the water bad and cause sickness
    and death; in other cases the water dried up until the well was cleansed and grass
    was cut back.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The shrine by the well was renewed yearly.
  category: action
  evidence_refs:
  - ev:6
