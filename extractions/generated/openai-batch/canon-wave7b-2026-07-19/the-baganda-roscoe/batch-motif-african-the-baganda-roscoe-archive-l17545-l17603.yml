  summary: The passage describes executions at Tuyana and other sacrificial places,
    including victims believed to die to avert calamity from the country and race.
    It then describes Baganda medicine-men as diviners consulted in sickness and trouble,
    especially the 'Leather throwers,' who used decorated leather pieces thrown on
    a cow-hide mat to obtain decisions by their positions.
