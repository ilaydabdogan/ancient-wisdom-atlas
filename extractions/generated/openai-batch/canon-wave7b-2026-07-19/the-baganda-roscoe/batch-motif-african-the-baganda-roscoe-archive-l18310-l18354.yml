canonical_text:
  quote: ''
  summary: 'The passage describes Baganda military organization and battle conduct:
    after a cleansing ceremony and reconnaissance, a general chooses where to attack,
    may send a chief to strike an unprotected area, commands from an elevated position,
    and regulates advance or retreat by drum signals. Warriors rush forward with spears,
    camp followers loot after success, chiefs have drums and armour-bearers, warriors
    cry out for the king and display war-fetiches while calling the name Kope. After
    a successful first attack yielding cattle spoil, the general orders an animal
    killed and meat brought to him.'
  language: English
  quote_policy: summarized
