  quote: ''
  summary: 'The passage recounts successive Baganda kings and conflicts: Kyabagu''s
    burial and temple; Junju''s accession, rebellion, conquest, killing of Semakokiro''s
    pregnant wife, and death at Semakokiro''s hands; Semakokiro''s reign, trade goods,
    ritual fetich episode, drowning of a medicine-man, ghostly illness, and burning
    of rival princes; Kamanya''s contested accession, killings of sons, traditions
    of ghostly or divine anger, scapegoating of Sewankambo, and death; and the beginning
    of Suna Kalema''s reign with Arab trade introducing firearms and gunpowder.'
