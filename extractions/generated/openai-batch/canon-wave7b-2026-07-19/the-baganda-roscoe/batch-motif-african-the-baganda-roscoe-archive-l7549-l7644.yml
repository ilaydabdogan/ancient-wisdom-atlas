  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kikerekere branch of the Lung-fish Clan says its father Nankete was called
    a frog because of bed-soiling at night and because he had many children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kikerekere branch claims descent from Mbiru, places his native place at
    Masaba on Mt. Elgon, and says he moved to Lake Victoria Nyanza.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kikerekere branch's only service for the King was to provide a substitute
    during ceremonies for the prolongation of life; Nankere's access to the King was
    otherwise restricted, and each new King sent him a leopard skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mushroom Clan names the Snail as second totem and the small ivory disc
    called Nsanga as third totem.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Mushroom Clan traces its forefather to Manyagalya; his son Wagaba formed
    the clan, and Wagaba's son Kasirye forbade his children to eat mushrooms because
    mushrooms grew on Manyagalya's grave after burial and were treated as part of
    their father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Manyagalya is said to have introduced the plantain, the Mutuba fig-tree used
    for barkcloth, bottle-gourd plant seeds, and the King's first gourd, named Kanvuba.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Bukerekere in Kyagwe, the Mushroom Clan had the temple of Nende, the second
    god of war, and the care of this deity was its most important duty.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Mushroom Clan had charge of the royal drum Kawagulu, made on its estate
    Wagaba, and of the royal stool used on state occasions.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Mushroom Clan served as gatekeepers and gate-makers to the King and made
    gates and doors for the royal enclosure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At a new King's crowning, the gatekeeper could seize ten of the twenty cows
    driven in by the Elephant Clan as a fee for first opening the new gateway; he
    could also take a third of the first tribute and capture one of the first chiefs
    entering, who redeemed himself by sending ten women to the clan.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The clan kept the King's gourd, said to be the cup from which Kintu had drunk;
    at each new moon it was brought to the King, who held it and returned it to the
    keeper.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Mushroom Clan supplied gatekeepers for the Queen, Namasole, Katikiro,
