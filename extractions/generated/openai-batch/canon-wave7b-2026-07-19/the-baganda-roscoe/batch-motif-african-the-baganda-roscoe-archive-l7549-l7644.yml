canonical_text:
  quote: ''
  summary: The passage records names, origin claims, totems, taboos, royal services,
    regalia duties, and estates associated with the Kikerekere branch of the Lung-fish
    Clan and the Mushroom Clan. It describes Nankete/Nankere as a frog-named father
    figure, the branch's service as royal substitute provider, the Mushroom Clan's
    mushroom taboo derived from mushrooms growing on an ancestor's grave, Manyagalya's
    introduction of plantain, barkcloth fig, and bottle-gourd plants, and the clan's
    custody of Nende's temple, royal drum, royal stool, gateways, and the king's gourd.
  language: English
  quote_policy: summarized
