canonical_text:
  quote: ''
  summary: 'The passage describes Baganda practices and beliefs concerning goats,
    sheep, fowls, and dogs: livestock care, food prohibitions, fears of animal ghosts,
    unlucky household signs, ceremonial uses of fowls, and medicines and fetiches
    used in training hunting dogs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goats were brought home at noon, tied under small sheds during the heat, and
    fed suitable leaves and branches while resting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kids were kept in houses until two months old and then allowed to run to meet
    the returning flocks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Goat milk was not used by the people.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sheep were not much in demand because of a taboo on mutton and fear of the
    ghosts of sheep.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women were not permitted to eat mutton, and men feared killing sheep lest
    the animal see them and its ghost haunt them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a sheep, goat, or dog ran onto the roof of a house, people left the house,
    saying it was unlucky to live there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Most peasants kept fowls for ceremonial use; men might eat fowls and eggs,
    while women were not supposed to eat either.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women made an indoor hen nest from a forked stake and plantain-fibre, and
    chickens were put in a large basket at night to protect them from rats or other
    animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A woman who accidentally killed a fowl while digging was believed to be haunted
    and made ill by the fowl's ghost if she hid the accident; if she took the dead
    bird to her husband, she escaped the ghost's persecution.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Fowls were killed, eaten, cooked, or presented on occasions including returns
    from war, visits by a husband's male relatives, a son's first return from war,
    the birth of twins, the end of mourning, a chief's return from war, blood-brotherhood,
    reconciliation between enemy clans, and accidental contact between a son-in-law
    and mother-in-law.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hunters kept and valued dogs but trained them roughly and kept them short
    of food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before hunting, a dog was given medicine to drink, had medicine rubbed on
    its eyes and nose, had a fetich tied around its neck, and was shut up for a day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A dog was fed the entrails of the kind of animal it was expected to hunt,
    along with gravy containing some of the medicine used on its eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: When a dog caught its first prey, the owner ate the meat himself and then
    jumped over his wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A woman was not allowed to step over a dog's fetiches because this was thought
    to break their charm.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Dog fetiches were used to prevent snakes from biting the dog while hunting
    and to enable it to catch animals.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: For a dog that habitually caught fowls, the owner tied ashes into a parcel,
    fastened it to the dog's neck, and spoke to the dog as if giving it barkcloths
    and refusing to kill it.
  category: speech
  evidence_refs:
  - ev:7
