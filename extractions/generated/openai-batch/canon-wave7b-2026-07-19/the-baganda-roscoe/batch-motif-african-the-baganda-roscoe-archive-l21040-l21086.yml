canonical_text:
  quote: ''
  summary: 'The passage describes Baganda cattle-keeping practices: milking cows with
    the calf present, using fire and fumigated vessels during milking, setting aside
    milk for churning in a gourd, using butter for cooking and body anointing, caring
    for calves after a cow dies, and rules or practices around killing and eating
    cattle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cow was said to give a small amount of milk, with the rest left for the
    calf.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The herdsman dressed in a skin or sometimes a dirty barkcloth when going to
    milk.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The herdsman first let the calf suck briefly, then a boy held the calf beside
    the dam while the herdsman milked, after which the calf returned to feed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cows were milked near a fire because smoke kept flies away and warmth soothed
    the cows.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Milking was usually done into a fumigated gourd or wooden bowl, held between
    the herdsman's knees while he squatted and used both hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A little milk was set aside daily in a large bottle-gourd until enough accumulated
    for churning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife of a peasant cow owner, or the wife of a chief's herdsman, churned
    the accumulated milk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: For churning, the gourd was placed on a grass-pad or barkcloth, corked with
    grass, and rocked back and forth until butter formed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After churning, buttermilk was poured off and butter was shaken onto a plantain
    leaf or into a wooden bowl.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Butter was washed slightly and used for cooking or for smearing on the body;
    scented herbs could be mixed with it for anointing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a cow died, herdsmen either found a foster-mother for the calf or tried
    to make the calf drink alone, but artificially reared calves were said invariably
    to die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Cattle were not killed for food except by chiefs, who chose a male animal,
    a cow past bearing, or a barren cow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Peasants who had to part with a cow either sold it or killed it in the market
    and sold the meat there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: When an animal died from sickness, herdsmen ate the meat and left only the
    skin and large hard bones.
  category: action
  evidence_refs:
  - ev:9
