canonical_text:
  quote: ''
  summary: 'The passage describes royal succession practices among the Baganda: princes
    could be killed after a king had secured succession; princesses held lands and
    one held precedence as Nasolo; legitimacy of a prince depended on a naming and
    fidelity-testing ceremony concerning his mother; and after a king''s death senior
    chiefs selected the successor, with disagreement among chiefs risking civil war.'
  language: English
  quote_policy: summarized
