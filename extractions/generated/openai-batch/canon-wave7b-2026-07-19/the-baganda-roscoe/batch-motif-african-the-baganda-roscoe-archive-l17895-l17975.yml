canonical_text:
  quote: ''
  summary: The passage describes Baganda warfare, including raids against neighboring
    peoples, recurring conflict with the Banyoro, and civil wars between rival princes.
    It details how rebellions were organized, how followers were summoned and motivated
    by plunder, how defeated rebels sought pardon through prescribed acts of submission,
    and how a successful prince who killed or displaced a king assumed the throne
    through accession ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Baganda are described as brave, warlike, aggressive, and ready to use
    slight provocation as a pretext for punitive expeditions that increased territory
    and brought spoil.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Banyoro are described as a strong adjoining rival people; raids and battles
    between the Banyoro and the Baganda are presented as yearly events.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Civil wars occurred between rival princes who claimed the throne and were
    described as especially destructive, causing damage and loss of life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A prince planning rebellion had to organize secretly, secure chiefs' support,
    and avoid spies in chiefs' households who might report the conspiracy to the King.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each warrior provided and carried his own weapons and obtained food by robbery
    and plunder while on campaign.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After securing armed support, a prince sounded his war-drum, and many came
    to him seeking plunder and future recognition on the winning side.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the King defeated a rebellion, rebel chiefs were deposed or put to death,
    while rebel peasants came to seek peace and surrender.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Surrendering rebel peasants were expected to wear barkcloths tied under their
    arms as though they were women and to carry a plantain-leaf shield and the midrib
    of a plantain leaf as a spear.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Katikiro introduced the surrendering men to the King; after hearing their
    confession, the King pardoned them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After receiving pardon, the surrendering men went down to the ground, rubbed
    each cheek in the dust, thanked the King, and swore future faithfulness.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: If the King was killed in a rebellion, the successful prince assumed the throne,
    performed accession ceremonies, mourned the fallen brother, and pardoned supporters
    of the late King.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The person who struck down a King or rival Prince in civil war was praised
    as a great hero.
  category: attribute
  evidence_refs:
