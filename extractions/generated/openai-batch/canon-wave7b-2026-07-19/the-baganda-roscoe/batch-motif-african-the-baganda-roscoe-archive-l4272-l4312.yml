canonical_text:
  quote: ''
  summary: The passage describes several Baganda customs concerning twins, royal offspring,
    scarification to affect marriage selection, clan care of children, the status
    of captive women and their children, and puberty scarification among some women
    in Kyagwe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A grown twin who killed a man in his first war had to return to his father's
    house and spend the night there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During that night the twin's father jumped over the twin's mother; the next
    morning the father gave the son a barkcloth and a fowl, after which the son returned
    to his own residence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In earlier times, the King's brothers who married were not allowed to have
    sons; a male child born to a prince was killed by the midwife, while princesses
    were allowed to live.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sons of the reigning king could marry and have children, and their sons
    were not killed because they were not regarded as dangerous to the sovereign.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some women who did not want their daughters taken as wives of the King or
    of a chief in the yearly tribute of girls scarified the daughters on the forehead
    or another visible place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Visible scarification disqualified a girl from being taken as a wife by the
    King.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because children belonged to the clan, the passage says no occasion arose
    for the adoption of orphans; when parents died, children remained under the care
    of a relative who took the father's place.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women captured in war might become wives of men in high positions, and children
    born from such unions became full clan members, while the women themselves remained
    slaves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the husband's death, such a woman became the property of his heir, might
    be appointed to care for the husband's grave, and could be respected by the clan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A captive woman who had borne children was less likely to be sold by the heir
    than a slave who had not been taken as a wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: At puberty, some women of the Kyagwe district scarified themselves on the
    stomach in a large W-shaped figure, while similar markings were discouraged among
    other women.
  category: action
  evidence_refs:
  - ev:6
