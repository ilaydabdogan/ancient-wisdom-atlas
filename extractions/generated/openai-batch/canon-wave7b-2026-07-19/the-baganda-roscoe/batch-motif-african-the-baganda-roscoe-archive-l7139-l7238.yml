canonical_text:
  quote: ''
  summary: The passage describes clan offices, ancestor traditions, temple service,
    childbirth offerings, estates, names, and seasonal grasshopper-eating rites for
    portions of the Kasuju, Otter, and Grasshopper clans. It includes a rescued child
    of Prince Kalimera, an accession offering to Mukasa, the deification of Mwanga-Kisole,
    and a Grasshopper Clan rite preceding the first meal of seasonal grasshoppers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kasuju clan supplied the king with a chief butler, a drinking-water attendant
    who was put to death when the king died, and a potter who made royal cooking-pots.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first Sedagala was said to have rescued Prince Kalimera's child after
    the child was thrown into a clay-pit to die, and Mugema's wife nursed the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the nursing of Kalimera's child, Mugema obtained the honorific description
    "Father of the King."
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each new king sent the son of Kasuju, clan head and holder of the office Kyesimba
    Kasuju, to Mukasa with a large present to announce accession to the throne.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Otter Clan said its forefather Mwanga Kisole was Katikiro to Kintu and
    was killed by Kintu during a fit of anger.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Otter Clan made barkcloths for the king, supplied a royal wife whose hereditary
    duty was to make the royal bed, and supplied an attendant in charge of royal tobacco.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a king died, the Otter Clan wife who made his bed had to go to his temple
    and remain there for life; at her death another clan member took her place, while
    the new king took another woman from the clan as wife and bedmaker.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Mwanga-Kisole died, his ghost took a medium, he was deified, and a temple
    was built for him on Nsoke hill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The deified Mwanga-Kisole was said to look after the clan's well-being, multiply
    their cattle, and make their women fruitful; mothers brought beer, cattle, and
    firewood to the temple after childbirth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mukasa had a temple on Kyange hill and Wamala had a temple on Nsoke hill;
    both had priests from the Otter Clan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Otter Clan estates are listed across Busuju, Mawokota, Gomba, Budu, Kyagwe,
    and islands of Lake Victoria.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Grasshopper Clan was described as originally cattle-keeping and living
    in Busongola, part of Bunyoro; descendants of Kirobozi came to Uganda after a
    clan quarrel, leaving part of the clan in Bunyoro.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Nsenene grasshoppers are eaten by the Baganda, considered a delicacy, and
    caught for food when seasonally abundant.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Before the first grasshopper meal of the season, a man of the Grasshopper
    Clan had to jump over his wife or have sexual connection with her; otherwise a
    family member was thought liable to fall ill.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The stated purposes of the Grasshopper Clan ceremony were to let other clans
    eat freely of grasshoppers and to increase the number of insects.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A woman of the Grasshopper Clan could catch and cook grasshoppers for her
    husband, but could not eat them herself.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Grasshopper Clan had a fetich named Kyalikitaluzi, kept in a small fenced
    shrine with a guardian named Kajubi.
  category: object
  evidence_refs:
  - ev:10
