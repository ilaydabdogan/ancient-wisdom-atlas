canonical_text:
  quote: ''
  summary: The passage describes Baganda burial procedures involving placement of
    the body, a grandson's barkcloth-cutting rite in the grave, selection of a childless
    widow, alternate rites for an heir or granddaughter, filling and mounding the
    grave, hand-and-foot sponging with plantain-stem sponges, extended mourning, delayed
    completion of the grandson's rite, and mourning restrictions on grooming and washing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body could be placed on a side according to sex in some cases, while in
    most clans it was placed on its back.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A grandson entered the grave, received a knife, and cut loose corners from
    the barkcloth wrapping near the head and foot of the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandson threw the knife at one of the childless widows; the selected
    woman became his wife, and followed him as he left the grave without looking back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandson who performed the ceremony was called the mulindi.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In certain clans, a chosen heir present at the burial passed under a barkcloth
    held by four men over the body; if he arrived after the funeral, he spread a barkcloth
    over the grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one or two clans, a granddaughter could replace an absent grandson, stand
    in the grave, cut the barkcloth corner, and claim one widow as her servant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The grave was filled with barkcloths and earth; many women helped fill and
    stamp down the grave, and a large mound was raised over it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those who helped fill the grave sponged their hands and feet with plantain-stem
    sponges and threw the sponges onto the grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mourners returned to the house where the body had lain and remained there
    through a mourning period lasting two or up to six months.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Not having a grandson to perform the barkcloth ceremony was considered a reproach.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: If a grandson was too far away to attend the funeral, a barkcloth corner was
    left protruding from the grave so he could later perform the ceremony, take the
    woman, and satisfy the ghost.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During mourning, mourners were forbidden to shave their heads, cut their nails,
    or wash except for washing hands at meals.
  category: action
  evidence_refs:
  - ev:8
