canonical_text:
  quote: ''
  summary: A guarded royal hill is approached by the new King, the Katikiro, the Queen,
    and their train. Seinanobe challenges them, receives the answer that the fire
    is extinguished and a new King has been brought, and a sham fight occurs before
    the royal party ascends. The party visits temples and named houses, receives and
    prepares a goat and plantains in mourner-style cooking, drinks from a special
    spring, and guards the King. On the second day Seinanobe leads the King, Queen,
    Katikiro, and Mukamba to Budo, where royal relics of King Lumansi are handed over
    and Seinanobe declares the King. The King is then led toward a fenced hilltop
    enclosure with two acacia trees, where he kneels and crawls in.
  language: English
  quote_policy: summarized
