canonical_text:
  quote: ''
  summary: 'The passage describes a public royal succession procedure: chiefs and
    spectators gather; the Kasuju presents the chosen prince to the Katikiro, who
    proclaims him king and offers spears to anyone who wants to contest the choice.
    If a rival faction challenges, fighting may continue until one prince is killed
    and the victor is proclaimed. If no one dissents, rejected princes are placed
    under guard, while the new king covers his father''s body with barkcloth as his
    first duty, his mother is formally identified by her clan, and he is taken to
    wait for the Katikiro and new Queen.'
  language: English
  quote_policy: summarized
