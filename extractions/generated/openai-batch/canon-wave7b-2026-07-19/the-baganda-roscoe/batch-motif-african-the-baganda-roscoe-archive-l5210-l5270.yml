canonical_text:
  quote: ''
  summary: 'The passage describes Baganda explanations for several illnesses and remedies:
    sickness after breached continence or food taboos, magic-induced illness, childhood
    ailments attributed to parental violations or an angry paternal aunt''s ghost,
    treatment by medicine-men, ritual confession, succession appointment to appease
    a ghost, flight and appeal to a plague god during bubonic plague, and smallpox
    treatments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine-man treats sickness linked to a continence-taboo by taking urine
    from the offending parties, mixing it with herbs, and rubbing it on the sick woman's
    chest before ordinary remedies become effective.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A jealous husband is said to use magic to make his wife fall ill when he fears
    using flogging against her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Infant sickness is attributed to the mother eating forbidden food before birth
    and breaking a taboo; bird bones mixed with herbs or boiled into a drink are prescribed
    as remedy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children may be troubled by the ghost of the father's sister; if appeasement
    fails, the medicine-man catches the ghost in a gourd or pot and removes it to
    waste land or drowns it in the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The aunt's ghost is explained as angry because her brother neglected to appoint
    one of the children as heir and successor to her; appointing a girl as heir is
    said to stop the trouble.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The illness called Amakiro is attributed to sexual breaches by the father
    or mother and is said not to be cured until the guilty persons confess and perform
    the kikansira ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Miscarriage is explained as a woman having a hot inside or as the result of
    adultery; buko is caused when clothing given by a husband to his mother or her
    sisters is placed on the wife's bed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bubonic plague is feared more than other sicknesses; inhabitants flee when
    it appears and seek the aid of the god of plague.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dead or dying rats cause alarm and flight from a place during plague fears.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Smallpox is associated with men on war expeditions and is supposed to be caused
    by the enemy.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Smallpox patients are given fish-boiled water or water mixed with butter,
    have an egg rubbed over the eyes, and have pox pricked with a thorn.
  category: sequence
  evidence_refs:
  - ev:8
