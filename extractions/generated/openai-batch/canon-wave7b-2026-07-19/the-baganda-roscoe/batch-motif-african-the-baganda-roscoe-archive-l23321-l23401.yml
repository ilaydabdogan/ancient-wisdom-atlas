canonical_text:
  quote: ''
  summary: The passage concludes an animal tale in which a dog escapes a leopard by
    trickery, is later lured toward a twin dance, is hidden by a sheep, escapes again,
    and then lives with Mr. Man; the tale explains enmity between leopard, dog, and
    sheep. It then begins another tale in which a lioness and a cow live near each
    other, have children, share a well, and quarrel after the cow's mischievous calf
    pushes the lioness's child into the well, causing the cow to flee through a sequence
    of animal refuges.
  language: English
  quote_policy: summarized
