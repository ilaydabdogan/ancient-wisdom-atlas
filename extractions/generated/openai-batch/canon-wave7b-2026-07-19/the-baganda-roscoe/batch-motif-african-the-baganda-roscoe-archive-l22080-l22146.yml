  quote: ''
  summary: The passage describes clothing, ornaments, bodily grooming, mourning practices,
    nail customs, royal nail treatment, preservation of royal nail-parings for burial,
    and children's water-lizard-skin ornaments and walking bells among the Baganda
    as reported by Roscoe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women wore ornaments of brass, copper, ivory, and wire, and wore a plantain-stem
    necklet called mugogo on special occasions such as marriage feasts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls and women could be nude or lightly clothed in specified domestic, temple,
    or enclosure contexts, while male nudity was described as more disgraceful and
    boys wore goat-skins.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Little girls wore a waist-ring made from plantain stem bound with goat-skin
    or lizard-skin; the passage says no one seemed to know why it was worn or why
    it was their only clothing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men and women periodically shaved their heads, and everyone was obliged to
    shave every part of the body after mourning for the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During mourning, hair and nails were left to grow long until the mourning
    period ended.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person was not permitted to cut fingernails and toenails on the same day;
    doing so was said to imply a wish to kill that person's parents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Royalty had nails cut to a V-shaped point, and commoners were forbidden to
    imitate this practice under threat of punishment or death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The King's nail-parings, and sometimes those of a chief, were preserved and
    buried with him when he died; no reason is given for the custom.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Young children wore bracelets and necklets made from water-lizard skin, and
    chiefs' children could have brass-bell decorations and pendants on their necklets.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Young children learning to walk wore small bells on their feet, and the bells
    were thought to help them learn to walk; once the child could walk, the bells
    were put away for another child.
  category: action
  evidence_refs:
  - ev:10
