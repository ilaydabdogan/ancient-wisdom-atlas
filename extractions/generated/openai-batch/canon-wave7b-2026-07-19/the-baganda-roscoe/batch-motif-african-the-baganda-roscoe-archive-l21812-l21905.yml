  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A chief's wife could cut meat for her husband, rub it with salt, and set it
    ready for him; he could hand pieces from his portion to favorite boys or guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person approaching others at a meal was not to salute them or look on; the
