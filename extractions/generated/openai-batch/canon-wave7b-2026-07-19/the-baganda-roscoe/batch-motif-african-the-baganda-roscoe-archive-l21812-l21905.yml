canonical_text:
  quote: ''
  summary: 'The passage describes Baganda meal service and etiquette: washing before
    or during meals, food served without guests helping themselves, plantain portions
    formed into balls and dipped in sauce, a chief''s wife serving and salting meat
    for him, obligatory hospitality to anyone approaching a meal, gender-separated
    eating, class-differentiated food preparation, restrictions on women eating certain
    foods, disposal of leftovers, guest gratitude expressed by thanks and belching,
    food sent in plantain leaves to absent persons, boys seeking bones, leading chiefs
    supplying meat from their own animals, and salt as a costly imported luxury.'
  language: English
  quote_policy: summarized
