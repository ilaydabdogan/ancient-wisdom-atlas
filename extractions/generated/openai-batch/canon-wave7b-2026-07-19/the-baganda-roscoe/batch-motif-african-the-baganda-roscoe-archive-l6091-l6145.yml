canonical_text:
  quote: ''
  summary: 'The passage describes a post-funeral installation of an heir: barkcloth
    rites at the grave and deceased person''s house, seating with the heir''s sister
    as lubuga and with a widow-wife, transfer of implements, public presentation by
    pedigree, plantain and estate rites, cowry gifts, new barkcloths, and a taboo-regulated
    goat meal for mourners.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person could not be installed over the grave unless he had attended the
    funeral and undergone the ceremony of passing under the barkcloth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After spreading barkcloth over the grave, the heir returned to the deceased
    person's house and sat on a barkcloth or mat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The heir's sister was brought forward as his principal consort, called lubuga,
    and seated with him; a young widow was also given to him as wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sister-consort was not to be married by the heir or kept by him after
    the ceremony if she was already married; if unmarried, she remained with him until
    her marriage and was meanwhile called his wife.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: The heir received a large knife, the shield, and the spear of the deceased;
    the consort received a knife and a basket used for household duties.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The head of the clan or family presented the heir to clan members and recited
    his pedigree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The heir went into the garden with his sister and wife, cut a bunch of plantains
    used for beer, returned, and hung it in the house to ripen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The heir caused an ox or goat and a large supply of other food to be cooked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After going around the estate, the heir and his sister returned to the house
    and sat in state while people came to see him and condole with him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Clan members were introduced to the heir and made presents of cowry-shells
