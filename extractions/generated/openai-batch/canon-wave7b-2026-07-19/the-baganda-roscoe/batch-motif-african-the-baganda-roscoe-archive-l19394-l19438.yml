  quote: ''
  summary: The passage describes Baganda metalworking, decorated weapons, bracelets,
    bells, sharpening practices, and shaving for purification when taboo required
    it. It then describes Lake Victoria Nyanza as a waterway, barrier, and source
    of moisture since Kintu's reign, and reports a tradition that canoe-builders came
    to King Kintu, after which the Lung-fish Clan served as chief canoe-men with an
    admiral. It also notes that many islands became subject to the kings of Uganda.
  language: English
