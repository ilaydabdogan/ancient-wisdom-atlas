canonical_text:
  quote: ''
  summary: The passage opens a chapter on birth, infancy, and puberty by describing
    social pressure on married women to bear children, the low status of childless
    wives, and ritual or medicinal efforts to obtain children. It describes a fertility
    ceremony conducted by a medicine-man using a male goat, herbs, a pot of soup,
    and a wild banana tree. It also reports household consequences when a woman is
    judged sterile and notes an earlier belief that conception could occur without
    intercourse.
