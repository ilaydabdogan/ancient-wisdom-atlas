canonical_text:
  quote: ''
  summary: 'The passage describes several Baganda deities and ritual practices: Kitaka
    is petitioned for garden fertility; Mirimu gives oracles through a female medium
    standing unharmed on thorn shrubs; Wanga restores the fallen sun after days of
    darkness and receives a royal estate; Musisi causes earthquakes by moving in the
    earth and is appeased by gestures and gifts; Wamala quarrels with his brother
    Wanema, leaves home, and accidentally creates Lake Wamala from a leaking water-skin
    before becoming a major deity with night oracles and prescribed offerings.'
  language: English
  quote_policy: summarized
