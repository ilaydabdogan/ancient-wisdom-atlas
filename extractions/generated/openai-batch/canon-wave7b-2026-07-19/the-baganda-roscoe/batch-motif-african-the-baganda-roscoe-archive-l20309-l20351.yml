canonical_text:
  quote: ''
  summary: 'The passage describes pottery finishing and pipe-head decoration, then
    discusses barkcloth as national clothing of the Baganda. It records competing
    accounts of the origin of barkcloth-making: Kintu bringing the tree and skilled
    makers, a tradition that the Baganda learned it from the Banyoro, and another
    view that the art predates Kintu. It also describes Baganda skill in barkcloth
    production, Semakokiro''s enforcement of clothing and barkcloth-tree planting,
    royal barkcloth supply, common peasant access to trees, and a list of named barkcloth-tree
    varieties.'
  language: English
