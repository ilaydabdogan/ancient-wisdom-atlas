canonical_text:
  quote: ''
  summary: 'The passage describes Baganda cattle-keeping arrangements: cattle of kings
    and chiefs were kept in protected kraals at night, poorer people housed cows indoors,
    herdsmen lived in the kraal, fire was maintained through the night, cow-droppings
    were dried for fuel, cows were milked by the fire, and herdsmen or boys observed
    Bahima milk and cow restrictions on behalf of masters or parents.'
