canonical_text:
  quote: ''
  summary: The passage describes the King's hilltop enclosure, its gates, internal
    divisions, guards, retainers, and court lighting. It also describes barkcloth-trees
    planted near the main entrance with offerings to deities and linked in belief
    to the King's life and power, and a sacred fire called Gombololo kept for the
    King, traced to Kintu and guarded by Sabata and later Senkole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The top of the hill was reserved for the King's residence, while chiefs built
    dwellings around the royal enclosure according to rank and origin.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enclosure had one principal entrance and eight smaller private gateways,
    each with guard-houses; gates were fastened and access was restricted to those
    with a right to pass.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the enclosure, blocks of houses were separated by roads, gates, and
    gatekeepers, so women and other visitors required permission to move between blocks
    or pass in and out.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A principal wife in each block was in charge of the other wives and was responsible
    to the King for their conduct.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Strong guards were stationed on the road from the main entrance to the council-chamber,
    and retainers lined the roads to guard the King and respond to emergencies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Retainers lived in cow-hide tents to reduce fire risk to the reed-and-grass
    royal houses, wore a special antelope-skin dress, were supplied from the King's
    Batongole lands, and served in monthly relays.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mukabya, chief of the Batongole, made the arrangements for the royal guards.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dry reed torches were made so that the King's courts could be lighted every
    night.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Priests of each principal deity planted barkcloth-trees near the main entrance
    when the King's houses were built and placed offerings under each tree for its
    particular god.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The barkcloth-trees were carefully guarded and tended because it was believed
    that as they grew and flourished, the King's life and power would increase.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the left side of the main entrance was a small hut and a fire-place pit
    called Gombololo, where embers of the sacred fire remained by day and the fire
    burned brightly at night.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sacred fire was carried into the hut at daybreak and brought out again
    at sunset.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The sacred fire was kept burning while the King was present in the capital,
    and if he journeyed it was carried wherever he went.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The fire was said to have been kept from the time of Kintu, who gave it to
    Sabata with instructions to guard it and keep it burning; all fires in the royal
    enclosures were lighted from it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Sabata was chief of the body-guard and had free access to the King's enclosure
    at all times.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: In later times Senkole held the office of guardian of the sacred fire and
    carried a burning fuse made from barkcloth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: In wartime, a person accused of fear or cowardice could be condemned to death
    by burning, and Senkole set fire to the pile.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: When a prince or princess was condemned for treason, sedition, or another
    crime, Senkole was sent to kindle the pyre from the sacred fuse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The sacred fire had to be kept burning during the King's life; on wet nights
    the guardian sheltered it from rain with a broken cooking pot.
  category: action
  evidence_refs:
  - ev:9
