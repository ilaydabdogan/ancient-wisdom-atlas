  quote: ''
  summary: The passage describes Baganda post-birth childcare, including appointed
    nurses, a mother’s presentation of the child to the first new moon, a three-month
    floor-sitting ceremony performed by the husband’s mother, a feast, a strengthening
    gesture by the husband, infant bedding and adornment, protective waist strings
    with medicine, and the beginning of daily washing.
  language: English
  quote_policy: summarized
