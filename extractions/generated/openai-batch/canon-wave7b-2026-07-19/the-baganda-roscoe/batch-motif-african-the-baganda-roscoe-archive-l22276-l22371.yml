canonical_text:
  quote: ''
  summary: 'The passage describes Baganda hunting practices: cooperative buffalo spearing,
    use of dogs, division of meat, treatment of buffalo head and horns, foot-traps
    and pits, small-game net hunting, pre-hunt blessing, avoidance of women at departure,
    ritual medicines and fetiches placed on nets, and distribution of game after the
    hunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buffalo were killed by coordinated hunters who took turns spearing and diverting
    the animal; dogs were sometimes used to keep buffalo at bay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buffalo meat was divided by role, including shares for the first spearer,
    the landowner, the second striker, and the remaining party.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The buffalo head was cooked and eaten in the field and was not taken into
    a garden or house because the animal's ghost was believed to be attached to it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buffalo horns were sold to medicine-men, who made fetiches from them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A buffalo foot-trap used a creeper ring, inward-pointing thorns, a cord, and
    a stake, and was placed over a shallow hole on a path to water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pits with stakes were also used for buffalo, and larger pits were sometimes
    dug for elephants.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Small-game hunts were led by a skilled hunter with dogs and nets, and the
    leader made plans the day before and obtained the blessing of the god.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the morning of the hunt the leader blew a horn to call the men and to warn
    women away from the path, because meeting a woman at departure was believed to
    make the hunt fail and the animals escape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nets were set in forest glades, and fetiches and medicines from priests or
    temples were placed on the nets to prevent animals from escaping.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Beaters and dogs drove animals into the nets, while hidden men clubbed or
    speared the animals that ran into them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After small-game hunts, the leader divided meat by role, including portions
    for himself, the landowner, the spearer, beaters, and scraps for dogs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Antelopes and wild pigs were killed immediately, while large rats were taken
    alive and often presented to the district chief.
  category: action
  evidence_refs:
  - ev:7
