  quote: ''
  summary: The passage describes Baganda drums as instruments of chieftainship, clan
    identity, dance, feasting, and travel. It notes royal and clan procedures around
    drummers and drum maintenance, a menstruation taboo concerning drum contact, and
    clan-specific drum rhythms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A particular drum was attached to each chieftainship, conferred with the office,
    and recognized throughout the country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A long drum with an open bottom was used for dancing and drinking feasts and
    was carried when chiefs were journeying.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: During journeys, a young man carried and beat the drum, sang with fife accompaniment,
    and followers joined the chorus and kept time with their steps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If people marching or carrying loads had no drum, they sang songs to set the
    marching time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Baganda are described as strong runners and walkers who could carry about
    thirty pounds for thirty miles in a day.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the King engaged a new drummer for the royal drums, he gave him a woman,
    a cow, and a load of barkcloths.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman who was menstruating was not permitted to touch a drum and had to
    keep away because the drum might kill her and she might defile it.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a clan drum needed a new skin, leading clan members had to assist in
    supplying it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the King conferred a chieftainship, the new chief took a royal representative
    to beat his drum while he went to take over the office, and the drummer was paid
    a cow or goat according to the office's importance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each chief also had a private clan drum, separate from the drum of office,
    which was beaten to ensure permanence of office and to sound the rhythm of the
    chief's clan.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage lists multiple clans and the named rhythms associated with their
    drums.
  category: other
  evidence_refs:
  - ev:9
