canonical_text:
  quote: ''
  summary: The passage describes Baganda governmental hierarchy and the special position
    of the Kago, chief of Kyadondo. Chiefs were expected to stay in the capital for
    Council business. The Kago took precedence because he performed royal taboos and
    ceremonies that the King could not perform personally, supervised servants in
    the royal enclosure, and held an office that ended with the King's death, after
    which he went to the temple of the deceased King while a new Kago was appointed
    for the new King. The passage also describes the placement and duties of subordinate
    chiefs, especially Sekyoyo.
  language: English
  quote_policy: summarized
