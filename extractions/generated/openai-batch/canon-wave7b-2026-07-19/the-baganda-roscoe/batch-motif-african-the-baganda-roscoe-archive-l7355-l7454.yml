canonical_text:
  quote: ''
  summary: The passage describes the Elephant Clan’s claimed descent from Sesanga,
    its hereditary royal herding duties, a royal accession herding rite involving
    cows, a flute, a milk-pot, and a calf’s skin, and several court and mortuary responsibilities
    including a butter-drinking test after the king’s jawbone had been placed in liquid
    butter. It then lists estates and names, and begins the account of the Lung-fish
    Clan, describing its two branches, their second totems, their intermarriage, common
    descent claims, and the Muguya branch’s origin near Lake Victoria Nyanza.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Elephant Clan claims descent from Sesanga, who came to Uganda with Kintu
    as his herdsman and settled at Sesanga in Busuju.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sesanga’s son is described as the first wealthy man of the Elephant Clan,
    as having obtained many estates, and as the person through whom the clan traces
    its descent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For many years, one member of the Elephant Clan continued to be chief herdsman
    to the King.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the accession of a new sovereign, the chief herdsman drove cows into the
    royal enclosure; the King inspected them and was initiated into the arts of herding.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief herdsman presented the King with a flute said to have belonged to
    King Kimera and to have been used by him while herding.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: After playing the flute, the King was handed a milk-pot, had a calf’s skin
    thrown over his shoulders, herded the cows briefly, and then returned the flute,
    milk-pot, and skin to Sensalire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Bulungugi Island supplied the King’s table with nsonzi fish, while the Elephant
    Clan supplied a particular barkcloth and butter used in embalming ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the King’s jawbone had been removed and partly cleansed, it was placed
    in liquid butter; when removed, Sensalire was required to drink the butter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the butter disagreed with Sensalire, he was put to death as an impostor;
    the stated rationale was that a true clan member could drink it without ill effects.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Elephant Clan had charge of the drums Lugumira and Kibi, beaten when the
    King went hunting; Namutalira had charge of the King’s Kadinda and was chief of
    the clan; Walensi assisted in decorating umbilical cords; another member guarded
    the King’s leopard-skin war-apron.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage lists Elephant Clan estates in multiple districts and islands,
    followed by male and female names used by the clan.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The Lung-fish Clan is divided into the Muguya and Kikerekere branches and
    is described as the largest of all the clans.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Kikerekere branch takes Kattimba, described as a kind of swamp fish, as
    a second totem, though some people say the second totem is a frog.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Muguya and Kikerekere branches intermarry as if they were unrelated, and
    the passage says they are the only clan to do so.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Both branches claim descent from one father and each claims greater importance,
    while the Muguya branch is said to have clearer records.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Muguya branch says that it came from Bumogera north of Lake Victoria Nyanza
    and that its forefather Mubiru lived on the lake shore.
  category: setting
  evidence_refs:
  - ev:9
