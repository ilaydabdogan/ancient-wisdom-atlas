canonical_text:
  quote: ''
  summary: 'The passage begins with the closing fragment of a tale in which Ndalakubi
    responds to an apologizing visitor about food and drawing up his legs. It then
    gives an etiological tale: at the beginning of the world, the King summons people
    for chieftainships and sends the dove for the moon and the bat for the sun. The
    moon arrives first and receives the office intended for the sun, shining by night
    and ruling it with honors. When the bat delays, the dove is sent to fetch the
    sun. The sun receives a lesser office of helping people see their way, hates the
    bat for the delay, and threatens death if bats look on the sun; therefore bats
    hang head downward, look at the ground, and do not fly by day.'
  language: English
  quote_policy: summarized
