canonical_text:
  quote: ''
  summary: 'The passage describes royal mortuary and purification actions: the cessation
    of mourning, a post-coronation rite involving two bound prisoners, the dispatch
    of a wounded prisoner called a scape-goat to the Bunyoro frontier, the removal
    and cleansing of a deceased king''s jawbone for an effigy, the decoration and
    packaging of the jawbone with royal wealth and umbilical cord relics, and the
    selection of a temple site to house the relics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A body is thrown into a river under papyrus roots and is called "The fowl";
    drums warn people to stop mourning, with signs of mourning punishable by death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the King is crowned, two bound and blindfolded men are brought to him,
    and the King wounds one man with a bow and arrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second man is freed, called "He who escaped" or Kawonawo, and thereafter
    lives in the royal enclosure with charge of the King's wives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wounded prisoner is taken with a cow, goat, dog, fowl, dust and fire from
    the King's house, and remains of a post from the King's house to Bunyoro.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage calls the wounded prisoner the "scape-goat" or kyonzira and states
    that he is meant to remove uncleanness that might attach to the King or Queen.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kanyolo, a leading Singo chief, conveys the prisoner to the Bunyoro frontier
    with a large army, maims the man and animals, leaves them alive, loots from the
    Bunyoro, and returns to the King.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After five months, the Mugema, Kago, and Sabaganzi arrange for the deceased
    King's jawbone to be removed and made into an effigy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sabata, Gungu, and Mpinga are sent to do the work; Gungu cuts through the
    building, enters the tomb, severs the head, and the tomb is then repaired.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ndabirizi removes the jawbone by working it from side to side and says, "Show
    me your grandchild."
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The jawbone is placed in an ant-hillock until ants remove the flesh, while
    guardians build a hut nearby and watch the spot day and night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The jawbone is examined by several chiefs and washed; the skull is later returned
    to Busiro, buried with honour near the tomb, and its burial place is maintained
    and guarded.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Some old people state a variant account in which the head is not severed and
