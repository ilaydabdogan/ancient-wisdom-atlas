candidate_motifs:
- id: motif:1
  label: Scape-goat expulsion of royal uncleanness
  taxonomy_refs: []
  basis: The passage explicitly calls the wounded prisoner a "scape-goat" or kyonzira,
    says he is designed to remove uncleanness from the King or Queen, and describes
    his transfer with animals and royal-house materials to the Bunyoro frontier where
    he and the animals are maimed but left alive.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes maiming and expulsion rather than killing; no exact
    available taxonomy reference for scapegoat or expulsion is supplied.
- id: motif:2
  label: Posthumous royal jawbone effigy and relic enshrinement
  taxonomy_refs:
  - royal_legitimacy
  basis: The late King's jawbone is removed to make an effigy, cleansed, decorated
    with items called the King's wealth, placed in a vessel, set beside the royal
    umbilical cord, and destined for a temple.
  evidence_refs:
  - ev:5
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage establishes a royal mortuary institution but does not explicitly
    state a theory of political legitimacy; the taxonomy reference is therefore tentative.
- id: motif:3
  label: Staged purification of a royal bone relic
  taxonomy_refs: []
  basis: The jawbone is put in an ant-hillock so ants remove flesh, watched by guardians,
    examined, washed in beer and milk, washed repeatedly, wrapped, and decorated only
    after being considered clean.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: This is a passage-level ritual pattern; no broader historical or comparative
    claim is implied.
- id: motif:4
  label: Pairing of death relic and birth relic in royal shrine
  taxonomy_refs: []
  basis: The decorated jawbone of the dead King is placed beside the King's umbilical
    cord, and a temple is built to receive the jawbone, the King's umbilical cord,
    and the ex-Queen's umbilical cord.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage does not explain the meaning of the juxtaposition, so the
    motif label remains descriptive.
