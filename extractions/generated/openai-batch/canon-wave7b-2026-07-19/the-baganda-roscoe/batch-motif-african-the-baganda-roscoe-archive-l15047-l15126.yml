  quote: ''
  summary: The passage describes fetiches used for invisibility, protection, and success,
    then outlines beliefs about ghosts, bodily integrity in the afterworld, ghostly
    activity near gardens and graves, and the preservation of jawbones as objects
    that attract or control ghosts and bring good fortune.
  language: English
