literal_observations:
- id: obs:1
  text: A thief was said to rely on a fetich to enter a house without waking people,
    or to become invisible to the inmates by sitting or standing on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other fetiches were described as made for a wife to keep her husband safe
    on journeys, protect him in battle, or give him success in hunting.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says belief in both malevolent and benevolent ghosts was held
    by all classes, and that existence in another form or next state was treated as
    real.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mutilation in life was believed to continue in the ghost-world, so that a
    maimed person’s ghost would also be maimed.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Loss of an eye, loss of a hand, and mutilation in war are each described as
    marks or blemishes that would persist in the future state.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ghosts were believed to dwell near their old haunts, have pleasure grounds,
    have wants like the living, and respond to kindness or neglect.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Relations were said to be responsible for the care and welfare of ghosts,
    and neglected ghosts were believed able to cause illness and death in the clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ghosts were said to favor trees and plantains in gardens, especially at noon,
    leading children and adults to avoid gardens during the heat of the day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Soft wind murmuring in leaves was described as ghosts talking, and whirlwinds
    carrying dust and leaves were described as ghosts at play.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ghosts were believed to remain near graves unless the body or a particular
    portion of it was removed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The lower jawbone was described as the body part to which a ghost clung; if
    removed, the ghost would follow it and remain with it if honored.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Jawbones of clan members were preserved as precious heirlooms and were believed
    to bring good fortune; kings’ jawbones were preserved with special care and handed
    down with traditions.
  category: object
  evidence_refs:
  - ev:7
