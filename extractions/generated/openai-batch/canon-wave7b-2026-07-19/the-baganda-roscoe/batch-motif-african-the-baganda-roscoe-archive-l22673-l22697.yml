  quote: two cowry-shells would purchase a woman
  summary: 'The passage describes earlier Baganda currency forms: a blue bead called
    nsinda, an ivory disc called sanga, cowry-shells, and later the rupee. It gives
    exchange values for these items, notes the probable introduction of cowry-shells
    in King Semakokiro''s reign, states that two cowries could once purchase a woman,
    and says cowries were also used decoratively.'
