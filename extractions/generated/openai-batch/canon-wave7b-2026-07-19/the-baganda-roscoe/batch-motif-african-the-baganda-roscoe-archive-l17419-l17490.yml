canonical_text:
  quote: ''
  summary: 'The passage describes several religious and sacrificial settings: a royal
    sibling union and birth at Nakinzire associated with the rise of the river Mayanja
    and a leopard-possessed medium; executions at a temple sacred tree after victims
    receive doctored beer; the crocodile-dedicated sacrificial place Kitinda on Island
    Damba, where a medium gives oracles and victims are left for crocodiles; and Benga
    in Bunyoro, where princes suspected of sedition are executed after divine consultation,
    sometimes with sacred fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prince named Kungubu took his sister as wife and had a son; the child was
    born at Nakinzire, and the river Mayanja is said to have taken its rise there
    because of the birth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medium was thought to be possessed by a leopard and, under that influence,
    growled and rolled his eyes like an angry beast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near the temple stood a sacred tree where prisoners were given doctored beer
    and where some prisoners' clothing was hung.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Victims at the sacrificial place were clubbed or speared; some were tortured
    by having flesh cut off with sharp reed splinters before being killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bodies were left where they fell for wild animals or birds, and relatives
    did not bury those said to have been given to the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kitinda on Island Damba was a sacrificial place dedicated to crocodiles, with
    a temple and a medium whose possessed behavior imitated a crocodile snapping its
    mouth.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kitinda medium gave oracles against people suspected of sedition and warded
    off evils from the King.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Victims taken to Island Damba were given medicated beer, marched to the beach,
    had their arms and legs broken, were left in a row, and were carried into the
    water by crocodiles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Crocodiles in that part of the lake were sacred and not to be molested; local
    people made offerings to them hoping to avoid being caught when crossing by ferries.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Benga in Bunyoro was the place where princes were taken after divine warnings
    about a possible rising; the King asked a god whether it was safe to execute them
    and whether succession would be secure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Princes at Benga were to be burned or starved, their blood was not shed, an
    army guarded against escape or rescue, and Senkole carried sacred fire to light
    the wood if they were burned.
  category: sequence
  evidence_refs:
  - ev:7
