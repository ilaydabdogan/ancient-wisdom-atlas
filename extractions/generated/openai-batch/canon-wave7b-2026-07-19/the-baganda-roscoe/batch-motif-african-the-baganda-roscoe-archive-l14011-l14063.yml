  summary: 'The passage lists some named sub-chiefs, then describes a ranked Baganda
    district administration: District-Chiefs had sub-chiefs of several orders, council
    rank was reflected in precedence and seating, lower-ranked chiefs could gain influence
    through ability, chiefs served also as magistrates, and the King''s private servants
    were called Batongole.'
