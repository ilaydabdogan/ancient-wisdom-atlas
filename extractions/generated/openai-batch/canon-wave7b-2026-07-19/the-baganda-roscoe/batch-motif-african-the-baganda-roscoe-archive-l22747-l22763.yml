  quote: ''
  summary: 'The passage describes ceremonies connected with a renovated well or shrine
    area: a chief kills an animal, a sacred meal is eaten, beer is poured at the shrine,
    and the chief then jumps over his wife. It also records restrictions on women
    visiting wells while menstruating, fears that such violation or drawing with dirty
    hands would dry up the water and bring sickness or spirit displeasure, and handwashing
    practices before drawing water.'
