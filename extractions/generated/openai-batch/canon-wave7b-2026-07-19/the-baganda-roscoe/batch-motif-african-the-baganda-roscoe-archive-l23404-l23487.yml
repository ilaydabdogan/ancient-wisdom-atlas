canonical_text:
  quote: ''
  summary: The passage closes a tale in which a cow fleeing a lioness is protected
    by a Wakasanke bird, who deceives and frightens the lioness using blood, a plantain
    flower, and milk; the tale explains the bird’s association with cows and a milking
    custom. It then begins the tale of Sesota, the Large Snake, in which a large python
    named Kalungu has killed people until an unnamed man, aided by a boy and servant,
    traps it in a water-pot with ornaments presented as royal gifts and brings it
    to the King, who orders it burned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cow is repeatedly forced to flee from a lioness and says the lioness wants
    to kill her because the cow’s child killed the lioness’s child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Wakasanke bird asks why the cow is fleeing and offers to keep her nearby,
    saying he will frighten the lioness and drive her away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wakasanke bird prepares a reddish-brown plantain flower shaped like an
    animal heart, a pot of milk, and a pot of blood drawn from the cow.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the lioness arrives, the Wakasanke bird throws blood on her breast, strikes
    her with the plantain flower as if it were her heart, and throws milk on her head
    while claiming to kill her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The lioness is terrified by the staged attack, thinks the blood is her own,
    and leaves the cow in peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tale explains that Wakasanke birds have lived near cows since then, that
    herdsmen first milk a little on the ground in commemoration, and that lions try
    to kill cows when they meet them.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A python named Kalungu is described as very large and fierce, killing all
    the people in that part of the country; previous attempts to destroy it failed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: At a royal reception, the King hears about the serpent; an unnamed man volunteers
    to kill it and asks for a water-pot, beads, copper and ivory bracelets, and a
    boy to carry them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man, the boy, and a servant go to Kalungu, where no one is about because
    the python has killed everyone; the servant blows a horn and sings of revenge.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The water-pot is placed in a doorway while the man and boy sit on either side,
    and the snake comes singing toward the doorway.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man tells the python that the King has sent greetings and a present in
    the pot; the python enters the pot to take the bracelets, and the man covers it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The captured python is carried to the capital, the man reports the method
