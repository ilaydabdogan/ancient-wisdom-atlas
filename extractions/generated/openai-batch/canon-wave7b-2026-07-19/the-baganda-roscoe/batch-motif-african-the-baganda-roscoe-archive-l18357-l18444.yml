canonical_text:
  quote: ''
  summary: 'The passage describes Baganda warfare practices: a pre-war rite involving
    a meal, wife-jumping, sexual restrictions, and blood smeared on fetiches; daily
    campaigning guided by scouts, priests, and reports to the King; rewards and trophy
    signs for warriors; dedication of captured weapons to war-gods; battlefield accountability
    and treatment of wounded; fathers of twins ending a taboo by killing someone and
    attaching preserved hair and nail-parings to the corpse; surgical practices for
    wounds; and a priest hiding or discarding fetiches if capture is imminent.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating a little of the ritual food, the general divides the rest among
    the chiefs and jumps over his wife for a successful end to the war.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each chief, after eating his meal, may either jump over his wife or take her
    to his couch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Until the ceremony is performed, no person in the army may have intercourse
    with women, because such conduct is said to bring disaster to the expedition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If no four-footed animal is available, a fowl is killed for the ceremony,
    and in either case the victim's blood is smeared over the fetiches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the ceremony, the war continues daily, with scouts informing the general
    where women and cattle are located so that these become objectives of attack.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A warrior who kills an enemy takes the enemy's weapons and wears a grass-crown
    to show what he has done.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Warriors who distinguish themselves are brought before the general and may
    receive women, cattle, or promotion to a chieftainship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the war is over, some captured weapons are placed in the temples of the
    war-gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Priests consult the gods daily and give oracles that help the general decide
    what to do and where to attack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The King is kept informed of events at the war front by runners carrying news.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: A military reverse is serious for the general; a chief whose forces are repulsed
    sends word to the general, who sends reinforcements quickly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: If a leading chief falls in battle, the general must give the King a detailed
    account, because such a mishap is attributed to carelessness or cowardice by another
    chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: Wounded men crawl away and hide until they can return to their own people
    or reveal themselves to searchers after the enemy leaves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Fathers of twins complete their taboo during expeditions by killing someone
    and tying preserved hair and nail-parings from their purificatory ceremonies to
    the corpse; sometimes the ball of hair is pushed into the dead man's mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Having another person's ball of hair attached to oneself is described as a
    disaster greater than mutilation and causes dismay to the deceased person's clan.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:16
  text: Surgeons are said to treat stomach spear-wounds by washing protruding bowels,
    restoring them to position, fitting a piece of gourd over them, and binding or
    stitching the wound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: For broken limbs, surgeons fit sticks along the broken bone, using wood from
    the strychnine plant called mpanya.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: If a priest is in danger of being captured with his fetiches during an expedition,
    he hides them or casts them away.
  category: action
  evidence_refs:
  - ev:7
