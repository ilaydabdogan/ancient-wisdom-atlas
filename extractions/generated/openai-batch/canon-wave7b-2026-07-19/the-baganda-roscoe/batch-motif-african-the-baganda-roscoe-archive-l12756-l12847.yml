canonical_text:
  quote: ''
  summary: The passage describes offices in Baganda government. The Katikiro controls
    access to the King, hears important matters, maintains a large courtly enclosure,
    and holds exempt estates. The Kimbugwe ranks next in importance, cares for the
    King's umbilical cord called the "Twin" and the royal fetishes, keeps a temple
    for the Twin, and performs a monthly new-moon presentation and anointing rite.
    The passage also notes succession rules for the Kimbugwe's office and the high
    status of the Queen and King's Mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Katikiro could visit and confer privately with the King, and other chiefs
    generally had to inform the Katikiro before seeking an interview with the King.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Matters of State and difficult cases were first brought to the Katikiro, who
    could settle them or refer them to the King.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Katikiro's enclosure contained courts, waiting rooms, and gatekeepers;
    visitors needed announcement or permission to enter inner courts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Katikiro held estates in each district on which no State tax was levied,
    and he collected his own yearly taxes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kimbugwe's office ranked next in importance and included care of the King's
    umbilical cord, called the "Twin," as well as oversight of royal fetishes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A temple for the "Twin" stood in the Kimbugwe's enclosure adjacent to the
    King's enclosure; the Twin was said to have the ghost of the afterbirth attached
    to it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Once a month the Kimbugwe carried the "Twin" before the King; the King unwrapped
    it from barkcloth, inspected it, and returned it to the Kimbugwe, who rewrapped
    and restored it to the temple.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At each new moon, after presentation to the King, the "Twin" was exposed in
    the temple doorway for moonlight to shine on it and was anointed with butter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because of his office, the Kimbugwe was admitted to the King's presence at
    all times and advised in State councils.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the King died, the Kimbugwe left office but continued to guard the deceased
    King's "Twin"; a new Kimbugwe was appointed for the new King's "Twin."
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Katikiro and the Kimbugwe were called "Kings" by peasants, paid no tribute,
    and had special tribute and labor exemptions connected with their offices.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Queen and the King's Mother ranked below the King but above the chiefs,
    held absolute power over their own people and estates, and both used the title
    Kabaka.
  category: relationship
  evidence_refs:
