canonical_text:
  quote: ''
  summary: The passage recounts a tale in which Kasokambirye borrows a cow from Sifirwakange,
    tries to avoid repayment by hiding through magical transformations or concealments
    in firewood and food, and is exposed until the cow is returned. It then begins
    a second tale in which Hare hosts a dance, persuades Elephant that cutting flesh
    from his hips will improve his dancing, cuts away much flesh, and Elephant sends
    Bushbuck to ask Hare to return it.
  language: English
