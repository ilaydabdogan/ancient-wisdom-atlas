canonical_text:
  quote: ''
  summary: 'Ethnographic description of Baganda medicine-men using several divinatory
    tests: thrown leather pieces, water with herbs or sticks, fowl blood and entrails,
    coffee berries, and castor-oil seeds. The tests are used to diagnose sickness,
    predict death or recovery, decide whether journeys should be undertaken, and judge
    prospects for obtaining favor. Omens are read from arrangements, crossings, clusters,
    and even or uneven numbers. A medicine-man prays to the god Mwanga before throwing
    leather pieces, and fees are paid for divination and cures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A suppliant kneels at one end while the medicine-man sits at the other with
    a bag of leather pieces and a hooked stick used to rake the pieces back after
    throwing them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In illness consultations, the inquirer states that his wife or child is ill;
    the medicine-man asks questions about symptoms, then throws leather pieces to
    determine the cause of sickness and prescribe a remedy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before throwing the leather pieces, the medicine-man arranges them, addresses
    a prayer to Mwanga for the right decision, blows on the pieces, and throws them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For leather-piece divination, two pieces side by side with a third over them
    is a bad sign for the patient; evenly paired pieces are a good sign; a straight
    line favors a journey, while clustered or crossed pieces mean the journey should
    be avoided.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: 'Fees are described for a medicine-man: a goat after curing a sick person;
    beer and a fowl for throwing the leather pieces; and, for a wealthy person, a
    goat for the throwing and a cow after recovery.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the water-test, powdered herbs are thrown into a pot of water, the pot
    is rocked, and the floating dust is read; an uneven number of floating portions
    is good, while an even number is bad.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In another water-test, nine sticks are thrown into water and interpreted by
    their positions; even-numbered groups are bad and uneven-numbered groups good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When sticks in water form two groups, they are thought to represent an open
    grave and to indicate that the sick person will soon be buried.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a journey question in the stick-water test, a cluster or crossing stick
    means the man should not go; sticks lying side by side with one standing well
    in front foretell a prosperous journey.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: For seeking favor from the King or a chief, the medicine-man uses a fowl,
    makes an incision at the throat, counts the blood spurts, and treats an even number
    as bad and an uneven number as good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For sickness, the medicine-man kills and opens a fowl, examines fat, markings,
    and specks on the entrails; unbroken fat is good, a break means the person will
    die, even numbers are bad, and odd numbers good.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nine coffee berries are thrown down to determine whether a sickness will be
    fatal, with even or odd groupings giving unfavorable or favorable answers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A test concerning whether a person is seeking to kill another begins with
    six castor-oil seeds arranged in two heaps with a shallow pit between them; the
    excerpt ends before the full result is given.
  category: action
  evidence_refs:
  - ev:10
