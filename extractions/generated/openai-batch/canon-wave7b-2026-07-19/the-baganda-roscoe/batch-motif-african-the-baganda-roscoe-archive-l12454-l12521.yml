canonical_text:
  quote: ''
  summary: 'The passage recounts late nineteenth-century Baganda royal history: Mutesa''s
    reign and altered funerary instructions; Mwanga''s accession, persecution of religious
    opponents, deposition, exile, reinstatement, and later British exile; Kiwewa''s
    brief reign and death after refusing circumcision; Kalema''s proclamation by Mohammedans,
    conflict with Christians, flight, illness, and death; and the infant Daudi Cwa''s
    selection under regents and British protection.'
  language: English
  quote_policy: summarized
