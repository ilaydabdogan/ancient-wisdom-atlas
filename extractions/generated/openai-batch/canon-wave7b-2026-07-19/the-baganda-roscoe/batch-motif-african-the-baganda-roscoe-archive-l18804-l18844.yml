literal_observations:
- id: obs:1
  text: The workers described in the opening fragment were not to be approached while
    at work, and their work had to be put away each day so that no one else touched
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red dye for ring cords was made from a red stream deposit associated with
    iron in clay, mixed with wood ashes and water, and used to boil papyrus shreds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black dye was obtained from the herb named Muzigizi by boiling it with the
    fibre.
  category: object
  evidence_refs:
