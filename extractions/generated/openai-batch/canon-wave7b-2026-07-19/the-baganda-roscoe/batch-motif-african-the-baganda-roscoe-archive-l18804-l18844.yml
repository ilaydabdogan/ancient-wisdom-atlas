  summary: The passage describes manufacture and use of decorated roof rings in Baganda
    house building, including work restrictions, red and black dye preparation, prices
    for named rings, a special roof-start ceremony for Kadulubare's house involving
    Kangawo and the Enkata ring, ordinary roof-start practice using three stakes,
    and structural placement of rings, reeds, bark stitching, and pillars.
  language: English
