- id: obs:4
  text: 'Prices are given for three named rings: a slave girl for Enkata, a woman
    for Katumyo, and a cow for Bugwe.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When building the house for Kadulubare, Kangawo had to stand on the site with
    the ring Enkata on his head while roof-making began.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: For other houses, no special ceremony was observed; a ring was placed on three
