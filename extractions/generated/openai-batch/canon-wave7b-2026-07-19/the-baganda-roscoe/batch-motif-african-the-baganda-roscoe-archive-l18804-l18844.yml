  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Outer rings held the reeds in position, while inner rings were described as
    ornamental rather than functional.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only three decorated rings were used in building a house, though additional
    rings were made as needed by the builders.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Kadulubare's house, after the first ring was secured to the reeds, it was
    lifted from the chief's head and placed on poles that would become permanent pillars.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The central pillars of a good house were about fifteen or twenty feet long,
    set in a triangle, with a ring resting on them and decorated rings exposed to
