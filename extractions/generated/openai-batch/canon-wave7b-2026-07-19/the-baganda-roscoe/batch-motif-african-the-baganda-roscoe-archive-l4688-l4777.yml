canonical_text:
  quote: ''
  summary: 'The passage describes Baganda marriage procedures: the bride is escorted
    from her home, transferred to the bridegroom''s party, accompanied by a designated
    female relative, and incorporated into the husband''s household through repeated
    cowry payments, care by the bridegroom''s sister, consummation rites, gifts, seclusion,
    public presentation, a return visit to her own people, and final ratifying exchanges
    involving food, a fowl, cowry-shells, and a first meal cooked for the husband.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is carried on the shoulders of a strong man, or by relays of men
    for a long journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bridal party includes the bride's brother, friends, and a decorated female
    relative called the mperekezi, who accompanies the bride and remains with her
    for days or months.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride is described as tearful and sobbing while leaving her home.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about halfway, friends from the bridegroom meet the party, take charge
    of the bride, give presents to those accompanying her, and the brother hands his
    sister to the bridegroom's representative.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In some cases, the bridegroom's friends scatter cowry-shells, carry off the
    bride while the bride's party picks them up, drop shells while running, and are
    chased by the bride's friends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the husband's house, the bride refuses to enter, sit, eat, or move at bedtime
    until the husband gives her cowry-shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bride is expected to look sad and miserable and to speak only in whispers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The repeated giving of cowry-shells by the husband is described as a test
    of mutual affection.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: The accompanying girl sleeps with the bride for the first two nights, and
    the bridegroom's sister feeds, waits on, and washes the bride for the first three
    days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The marriage is consummated on the third night, and the husband sends the
    barkcloth on which the couple lay to the parents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: If the bride is found not to be a virgin, the husband cuts a round hole in
    the barkcloth, described as a stigma upon the guardians.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The husband sends meat to his wife's parents and gives the bride a goat as
    a token of affection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the goat is brought, the bride puts her hand on it, takes a knife, and
    hands the knife to a person who kills the goat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The bride remains in seclusion for some time, seeing only female friends and
    relations, then comes out, bathes, and sits near the door for visitors and congratulations.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The accompanying girl receives a present when she returns home and takes back
    borrowed ornaments worn by the bride.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: When the accompanying girl returns, she dresses as a bride, and people say,
    'The bride has come back.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: When allowed out, the bride first visits her own people, who give her food
    including an indispensable fowl; this gift is called 'Taking the butter.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: "'Taking the butter' is described as the final ratification of the marriage
    and as showing that the wife is satisfied with her husband."
  category: other
  evidence_refs:
  - ev:8
- id: obs:19
  text: The wife presents the fowl to her husband as a token that she accepts him
    as her lord.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The next day the wife cooks a feast for her husband, who calls his friends
    to share the first meal she has cooked for him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: The cowry-shells paid by the bridegroom when asking for the wife are given
