canonical_text:
  quote: ''
  summary: 'The passage explains Baganda interpretations of sickness and death. Natural
    death is said to be rarely accepted as an explanation; sickness may be attributed
    to magic, ghosts, or the god Walumbe. Royal sickness receives special treatment:
    the King''s illness is commonly attributed to ghosts, publicly described as a
    cold unless another condition is proven, and diagnosed by priests. If the King
    dies, the death may be attributed to an offended god or ghosts. The passage also
    notes the King''s fear of his father''s widows whose sons might seek the throne.'
  language: English
  quote_policy: summarized
