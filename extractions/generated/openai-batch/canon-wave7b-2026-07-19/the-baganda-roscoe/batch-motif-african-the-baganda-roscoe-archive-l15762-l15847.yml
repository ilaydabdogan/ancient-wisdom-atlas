canonical_text:
  quote: ''
  summary: The passage describes a captive taken by canoe to islands and killed, his
    shin-bones later used with the Betobanga drum. It then describes the female medium
    of Mukasa, her restrictions, possession procedure, oracle delivery over a sacred
    fire, and the annual festival in which the King sends offerings to the god for
    blessing on crops and people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A captured prisoner was bound, placed in a canoe, taken first to Kibi and
    then to Kaziri, and put to death by throat cutting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body was guarded from crocodiles and birds until the flesh decayed and
    the shin-bones were clean and bleached.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cleaned shin-bones were taken to Bubembe and handed to the priest Semagumba,
    who struck the drum with them before handing them to Sendoivoza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Betobanga drum was beaten for the annual festival, announced the new moon,
    warned of monthly cessation from work, and announced special festivals such as
    royal consultation of the god.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The medium was a woman said to have been found on Nfunve after Mukasa disappeared
    from Bubembe and was housed near the temple-enclosure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The medium did not enter the temple, did not walk in sight of men, was attended
    by women-slaves, and gave oracles in the second room of her hut.
  category: setting
  evidence_refs:
  - ev:6
