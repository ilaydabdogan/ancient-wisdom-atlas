  summary: The passage describes harp construction and tuning. It notes an earlier
    harp tuned by pegs, then describes the Basoga harp with angled side bars, a morticed
    cross-piece, twisted-cord rings for attaching and tightening strings, goat-hair
    tuft ornaments, and horizontal strings. It contrasts this with the Baganda harp,
    whose strings are vertical.
