canonical_text:
  quote: ''
  summary: The passage describes Baganda customs concerning royal children, post-weaning
    status changes for mothers and wives, the placement of children with paternal
    kin for training, and a teething custom in which a child places an extracted tooth
    in a rat run and later finds cowry shells left by the guardian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some princes received titles and special gardens, and disputes involving them
    were handled by Kasufu together with their elder brother Kiwewa.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nasolo dealt with disputes among princesses and reported them to the king.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many princesses went to live at temples; the rest were given land, and princesses
    were not allowed to marry.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Princes and princesses were taught to work: girls were taught to dig and
    cook, and boys to hunt and fight.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After royal children were weaned, their mother was taken to the king, who
    jumped over her, after which she returned to ordinary duties in the royal enclosure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After commoners weaned their children, the husband jumped over his wife, and
    she resumed normal life with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After weaning, a child’s residence was decided by the son of the father’s
    elder brother, and children were commonly sent to paternal kin for training.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Girls usually lived with an elder married brother until marriage, or with
    a paternal uncle if no elder married brother was available; boys went to live
    with a paternal uncle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When children lost their first teeth, guardians tried to help them get rid
    of the teeth quickly but usually persuaded the child to pull the tooth out personally.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children were told that if a drawn tooth was placed in a rat run, the rat
    would take it and replace it with cowry shells.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The guardian secretly removed the tooth from the rat run and left two or three
    cowry shells in its place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stated reason for timely tooth extraction was to prevent the new teeth
    from growing irregularly.
  category: other
  evidence_refs:
  - ev:7
