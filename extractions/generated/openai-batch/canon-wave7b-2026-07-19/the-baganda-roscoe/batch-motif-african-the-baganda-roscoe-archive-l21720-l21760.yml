  quote: ''
  summary: 'The passage describes Baganda cooking arrangements and kitchen equipment:
    separate kitchens or cooking huts, earthen pots, a three-stone or mound fireplace,
    wood fuel, plantain fibre and leaves used inside a large pot, steaming of plantains,
    meat, and vegetables in leaf-wrapped parcels, and a child or woman watching the
    fire so the pot does not run dry.'
