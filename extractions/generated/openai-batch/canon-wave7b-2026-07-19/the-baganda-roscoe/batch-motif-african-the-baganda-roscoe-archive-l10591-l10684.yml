canonical_text:
  quote: ''
  summary: The passage describes Baganda royal succession, restrictions on royal women
    and princesses, the sacred separation of royal blood, categories of princes, drums
    as signs of office and accession, guardianship of heirs, assignment of land to
    princes, and the planting of a barkcloth tree as the sign of a prince's possession
    of an estate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sovereign is described as always male, descended from the royal family,
    and no woman or non-royal person could reign; heirs were sons, or grandsons only
    when no son could succeed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each prince took his mother's totems, while the royal totems named in the
    passage are lion, leopard, and eagle, and the mother's clan claimed the prince
    as its child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Although women were not permitted to reign, the Queen and the King's Mother,
    Namasole, could hold courts and exercise some administrative power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Princesses were not permitted to marry or have children; the death penalty
    was formerly enforced for breaking this rule, and the King might take sisters
    as wives but was not expected to have children by them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King encouraged princes to marry at puberty in order to secure succession
    through his sons; sons growing up could receive principal estates formerly held
    by the King's brothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Princes born while their father was King and held the royal drums were called
    Princes of the drums; others were called Peasant princes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Drums are described as signs of office and authority for the King and chiefs;
    accession is expressed as having eaten Uganda or eaten the drums.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kasuju was guardian of the heirs-apparent; the eldest son held the title Kiwewa,
    was responsible for his brothers, and could not reign because of that office.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a prince left his mother at about four or five years old, he was sent
    to Kasuju, assigned a guardian, and given land by the King's representative.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The King's representative planted a barkcloth tree, mutuba, when the prince
    was placed in possession of land; the estate was called a Mutuba, and the tree
    signified the prince's possession.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A prince was not allowed to become a guest or retainer of a chief because
    a chief might support his claim to the throne, and because harm to a prince could
    trigger punishment due to horror at shedding royal blood.
  category: relationship
  evidence_refs:
  - ev:6
