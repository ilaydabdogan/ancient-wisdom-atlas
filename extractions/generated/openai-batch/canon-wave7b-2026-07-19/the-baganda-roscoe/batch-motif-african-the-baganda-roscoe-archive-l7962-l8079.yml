canonical_text:
  quote: ''
  summary: 'The passage describes clan-linked ritual and royal offices among the Baganda:
    Seguluma’s use of fetiches to bless a royal house and attend the king after coronation;
    the Bird Clan’s descent claim, charge of feared royal fetiches, perpetual sacred
    fire, royal wife, and drum; the Rat Clan’s claimed forefather and offices as royal
    guardians, police, spies, and fetich custodians; and the Yam Clan’s claimed forefather
    associated with Kintu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seguluma brought fetiches into a house to bless it before the King or his
    wives could use it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For some months after the coronation, Seguluma and the fetiches in his charge
    had to remain in constant attendance on the King, and Seguluma slept near the
    King's door.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the early morning, Seguluma presented the King with a bowl of water so
    that he could wash his hands and face to remove any evil attached during the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Seguluma supplied girl-caretakers for the royal fetiches Naritaba and Semwima,
    which were kept in the royal enclosure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bird Clan says it descends from Njuwe, who was in Uganda before Kintu
    came and became one of Kintu's chiefs ruling Kyagwe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bird Clan had charge of Buganda, described as a powerful and dreaded fetich;
    people detoured around its place, and anyone who came too near was put to death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bird Clan also had charge of Lickiko, one of the King's fetiches, which
    had to be taken to him each month.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Musolosa, a Bird Clan chief, was guardian of the sacred fire that burned perpetually
    at the entrance of the royal enclosure.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bird Clan supplied each King with a wife named Nanyenge and had charge
    of the royal drum beaten day and night to let people know the King was alive and
    well.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Rat Clan says its forefather was Miigo, who came to Uganda with King Kintu
    and was employed about the royal enclosure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: King Mawanda gave the Rat Clan offices as special guardians to the King, private
    police, spies on his generals, and custodians of the royal fetich Sukenge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Yam Clan says its forefather was Sedumi, who came to Uganda with Kintu.
  category: relationship
  evidence_refs:
