canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Baganda royal enthronement and succession
    sequence: special barkcloths are put on the King and Queen; the royal party proceeds
    to ritual stations where a priest gives the King tree wood, creeper pieces, and
    plantain seeds with spoken wishes for victory, endurance, and wisdom; the ceremony
    called “Eating the country” is completed and the King is treated as legally appointed;
    an accession message and present are sent to the god Mukasa; and the new King
    enters a mourning period while the former King’s body is embalmed and succession
    offices are arranged.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King and Queen have barkcloths removed and replaced with two royal barkcloths;
    the removed barkcloths are placed in the Budo temple, and the new barkcloths are
    described as made specially for the King in Singo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only a few persons are permitted at the barkcloth ceremony; others remain
    in camp until it is complete and then join the procession.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King and Queen are carried downhill to trees grown for spear shafts; a
    priest cuts one tree and hands it to the King with a formula about overcoming
    enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a place where basket-making creepers grow, the priest gives the King pieces
    of creeper and says that the King’s life should be like a basket that does not
    break when it falls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a place where wild plantains grow, seeds are taken and given to the King
    with words that he should surpass his subjects in wisdom and understanding.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Senianohe accompanies the King to Sumba, presents him to the priest Mainja,
    and then returns to Budo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the ceremony called “Eating the country” is complete, the King is regarded
    as the legally appointed Sovereign.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The party is conducted by the chief Sebwami to the place appointed for mourning
    ceremonies for the deceased King.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each new king sends the son of chief Kasiiju to the god Mukasa with a large
    present to announce accession to the throne.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The accession present consists of either nine or ninety specimens of whatever
    is offered.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The messenger travels alone in the royal canoe Nanifuka, eats alone, wears
    two barkcloths as though he were a prince, and enters the temple in a white goat-skin
    apron described as priestly dress.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each newly appointed King goes into mourning while the previous King’s body
    is being embalmed, a period said usually to last six months.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A temporary residence called Lukomeva is built near Budo, with houses for
    the King, a strong stockade, and many houses for chiefs and retainers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: During mourning, chiefs are expected to retire from office to take charge
    of the deceased King’s temple; the new Queen and the King’s Mother are also inducted
    into official estates.
  category: sequence
  evidence_refs:
  - ev:6
