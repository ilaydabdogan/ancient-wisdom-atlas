canonical_text:
  quote: ''
  summary: An unnamed petitioner is taken by the Kago before the King and restates
    a request. The King appoints a foreman for temple building by giving him reeds
    grown for that purpose; the reeds serve as insignia of office, empower him to
    assemble workers, and are later used to begin the roof. The reeds are decorated
    with a creeper while being carried to the temple site. The passage also states
    that gods were thought to foretell events, advise about wars, and heal sickness,
    and describes medicine-men as a feared and powerful religious class present in
    each clan.
  language: English
