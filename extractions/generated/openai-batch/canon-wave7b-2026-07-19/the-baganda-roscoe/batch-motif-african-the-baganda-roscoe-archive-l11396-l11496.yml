canonical_text:
  quote: "“The lion eats alone.”"
  summary: 'The passage describes court procedures around the Baganda king: preparation
    and distribution of food, the king’s solitary and hidden meals, service by a wife
    who tastes the food and observes strict etiquette, lethal punishments for breaches,
    taboos on royal leftovers, meal implements and washing, guarded access through
    courtyards, chiefly audience procedures, and secret police with special privileges
    in the king’s presence.'
  language: English
  quote_policy: quoted
