canonical_text:
  quote: They took innumerable precautions to remove the body and destroy the ghost
  summary: The passage describes clan and branch responsibilities in trials and burial,
    procedures around murder accusations, fines and food taboos between clans, secret
    killing and flight, lack of punishment for a man killing his wife or slave, and
    precautions surrounding suicide bodies and ghosts, including felling a tree used
    for hanging and removing corpse and tree.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A head of a branch was responsible in a murder charge for seeing that justice
    was done to the accused member and that he was not killed before the case was
    proved.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deliberate murder is described as rare; men going to drink are described as
    not usually taking weapons with them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: An accused murderer was put in stocks while awaiting trial; if the trial went
    against him, the murdered man's clan might accept a heavy fine instead of requiring
    his death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the trial, near relations of the murdered man could not eat with members
    of the accused man's clan; payment of all or part of the fine removed the taboo
    and allowed free mixing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person deliberately intending to kill another could lie in wait, spear him
    secretly, and escape into adjacent countries for years or until death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: No punishment was inflicted on a man who speared his wife or slave to death;
    the wife's relatives could investigate but not punish him, because the wife was
    described as his property.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Baganda are described as taking many precautions to remove the body of
    a suicide and destroy the ghost so that it would not cause further trouble.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man who committed suicide is described as hanging himself on a tree in his
    garden or in his house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the hanging was from a tree, the body was cut down, the tree was felled,
    and both tree and corpse were taken to a distant place, with the corpse tied to
    a pole like an animal carcass.
  category: sequence
  evidence_refs:
  - ev:7
