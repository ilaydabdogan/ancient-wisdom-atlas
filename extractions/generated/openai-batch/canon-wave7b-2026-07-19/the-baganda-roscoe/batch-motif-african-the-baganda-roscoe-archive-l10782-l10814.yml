canonical_text:
  quote: ''
  summary: 'The passage describes part of a royal accession sequence: named officials
    and retainers accompany the King; chiefs appoint the Sabaganzi from among the
    King’s maternal uncles; a princess meeting specific kinship requirements is chosen
    as Queen or Lubuga with the ex-Queen’s assistance; the princess is carried to
    her brother; a new Kago is appointed; and the King and Queen are carried to Budo
    hill to be confirmed in the kingdom. A caption identifies a coronation hut where
    fetiches are kept.'
  language: English
  quote_policy: summarized
