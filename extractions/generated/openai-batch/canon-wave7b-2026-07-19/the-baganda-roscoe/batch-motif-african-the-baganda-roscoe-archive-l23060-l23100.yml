canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which Mpobe slowly consumes his property, tries
    unsuccessfully to hide from personified Death, returns home, admits his wealth
    is finished, and is taken by Death; the narrator links his death to having told
    a secret to his mother. A new tale begins: Leopard, who has cheated Hare of a
    goat, proposes an island journey to repay the debt, tricks Hare into preparing
    and throwing food parcels into a dangerous lake while Leopard substitutes stones
    and keeps his own food, then eats without sharing; Hare perceives that Leopard
    means to starve him to avoid repayment. The final sentence begins an unfinished
    instruction about beer and a beer-tube.'
  language: English
  quote_policy: summarized
