  quote: ''
  summary: The passage introduces Uganda as changed from an formerly difficult destination
    to one reached by railway. It contrasts earlier caravan and canoe travel, slavery,
    human sacrifice, and household status for women with later conditions. It describes
    King Mutesa's army reforms, the 1900 treaty's redistribution of land, the desecration
    and relocation of clan burial grounds, and the author's stated plan to describe
    earlier Uganda from Baganda accounts.
  language: English
  quote_policy: summarized
