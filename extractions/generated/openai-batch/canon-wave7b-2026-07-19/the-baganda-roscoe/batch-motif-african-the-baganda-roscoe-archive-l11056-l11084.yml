  summary: 'The passage describes a Baganda royal investiture sequence: the Mugema
    administers an oath to the King, gives him spears and a shield, and the King pledges
    just rule and fidelity to Uganda. The King and Queen scatter coffee-berries during
    their oaths, and the people pick them up. The passage also notes a change in the
    office of investiture from the Mugema to the Kasuju under King Mutebi, and includes
    an illustration caption about carrying the King and his brother.'
