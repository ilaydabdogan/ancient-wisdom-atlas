canonical_text:
  quote: ''
  summary: Death forbids Mpobe to tell his family what he has seen and threatens to
    kill him if he speaks. Mpobe returns with the rat and gives evasive answers to
    his wife and father. His mother later presses him, and he tells her about following
    his dogs into a hole, reaching the land of the dead, seeing many people, finding
    Death, and being warned not to tell. That evening Death calls Mpobe, confronts
    him, and declares that Mpobe must die after he has expended his property. Mpobe
    asks to sell what he has and live on the proceeds; he begins by selling his child,
    buying a cow, killing it, and eating it.
  language: English
  quote_policy: summarized
