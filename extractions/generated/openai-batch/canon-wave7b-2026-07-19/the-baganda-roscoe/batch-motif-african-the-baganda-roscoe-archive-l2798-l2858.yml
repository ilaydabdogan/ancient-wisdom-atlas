canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and customs around pregnancy: women avoid
    places associated with the dead to prevent ghostly rebirth; some pregnancies are
    explained through a falling plantain flower and ghost reincarnation; pregnant
    women consult a medicine-man and come under the care of the husband’s kin; rules
    govern women’s posture and a taboo equating a man stepping over a woman’s legs
    or clothing with intercourse.'
  language: English
  quote_policy: summarized
