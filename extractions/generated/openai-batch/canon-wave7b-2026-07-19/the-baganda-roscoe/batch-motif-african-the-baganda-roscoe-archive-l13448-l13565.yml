canonical_text:
  quote: ''
  summary: The passage describes Baganda administrative offices under the Kago and
    the King, rules for succession to chiefships, the Singo district and its chief
    Mukwenda, Mukwenda's full-moon taboo, named subordinate chiefs, Kajongolo's duty
    to carry fire from a new King's mourning house to Bunyoro, and a note on Lake
    Wamala, its temple to Wamala, and royal human sacrifices there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sabakaki is described as the chief over pages and boys in the royal enclosure
    and as responsible through the Kago to the King, not to the Mumyuka.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Senkole is described as the chief with charge of the sacred fuse for the sacred
    fire and as one of the King's special servants responsible for the fire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In state affairs, chiefs were to obey the Kago, but the Kago could not require
    private work from them and could not depose or appoint them; the King made the
    final decision on vacancies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vacant chiefships did not have to be filled from the same clan, though a fallen
    chief's son or branch of clan might customarily be appointed in some cases; the
    King could appoint from another clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Singo is described as a large but sparsely populated district because of Banyoro
    proximity and raids; part of it later became Bwekula.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mukwenda is described as principal chief of Singo and shield-bearer to
    the King.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Mukwenda had to observe a full-moon taboo by abstaining from food from
    noon until the next morning and living apart from his wives during that time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Mukwenda's country seat was called Mttyana and was situated on the shore
    of the small lake Wamala.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kajongolo had the duty of taking the fire, called kasiki, from the temporary
    house where each new King lived while mourning in Busiro and carrying it to Bunyoro.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note states that, in olden times, the islands of Lake Wamala were densely
    peopled, that an important temple to the god Wamala stood on the shore, and that
    the King periodically sent human sacrifices there.
  category: setting
  evidence_refs:
  - ev:9
