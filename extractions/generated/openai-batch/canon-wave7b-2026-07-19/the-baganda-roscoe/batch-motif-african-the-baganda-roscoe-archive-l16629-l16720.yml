- id: motif:3
  label: Propitiatory offering to local spirits for safety or permission
  taxonomy_refs:
  - sacred_exchange
  basis: Offerings are made to tree-spirits before felling trees, and grass, sticks,
    beer, animals, or fowls are offered to the Sezibwa river spirit before or after
    crossing.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The exchange is described as propitiation or safe passage rather than
    as a formal covenant.
- id: motif:4
  label: Spirit-inhabited large tree and ritual felling
  taxonomy_refs: []
  basis: Large trees are regarded as abodes of spirits; felling requires consultation
    and offering, and Namulere’s medium may drive away the spirit from a resistant
    tree.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not identify the tree as an axis, world center, or cosmic
