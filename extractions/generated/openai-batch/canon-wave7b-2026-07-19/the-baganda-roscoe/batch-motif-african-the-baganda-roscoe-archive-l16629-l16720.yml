canonical_text:
  quote: ''
  summary: The passage describes temple consecration practices, the god Gulu and his
    medium, tree spirits and rituals before felling trees, Namulere and his medium,
    Nabuzana and Nagadya as female divinities connected with childbirth and rain,
    and several river spirits with etiological birth stories, offerings, animal forms,
    and possession-oracle behavior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A newly built temple was decorated with palm leaves, bark-cloth, and creepers;
    the priest slept in it for two days, and sacred objects identified as a spear
    and a paddle were carried into it with pomp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gulu was described as an important deity who had no priest or temple until
    a man of the Grasshopper Clan became possessed by him and a temple was built.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gulu’s priest and medium, named Kinryanganjovu, warned the King of imminent
    war and sometimes foretold national sickness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When officially dressed, Gulu’s medium wore a white goatskin apron and a jackal-skin
    headdress bordered with red seeds; in the King’s presence, the medium and King
    pointed sticks at one another before the divine message was given.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Large trees were thought to be abodes of spirits, and a person did not fell
    a large tree without consulting a god and making an offering to the tree-spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Neglecting the offering before felling a large tree was believed to make the
    tree-spirit cause illness in the offender’s family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Namulere was called the servant of the other gods; his priest carried wild
    animal skins, sometimes beat his own head with a stick, and could be summoned
    to butt a resistant tree with his head and drive away its spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nabuzana was the nurse of Kaumpuli and patroness of women, especially during
    childbirth; her priestesses travelled as midwives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagadya was the mother of Kibuka and was approached during food scarcity to
    intercede with the gods for rain that would make the earth fruitful.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Principal rivers were thought to have spirits with powers for good or evil,
    and most rivers were thought to have originated from a human being.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The river Mayanja was said to originate where a princess gave birth, caused
    by the birth-flood; it was later worshipped under the form of a leopard, and a
    leopard ghost possessed a man who gave oracles in gruff tones and made leopard-like
    noises.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The river Sezibwa was said to have a similar childbirth origin: a young woman
    searching for a lover who had wronged and deserted her gave birth where the river
    sprang forth.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Sezibwa river spirit was named Muige; he had a priest but no temple, and
    heaps of grass and sticks stood on both sides of the river for offerings by people
    crossing.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Crossers threw grass or sticks on the heap before crossing and again after
    crossing safely; worshippers also tied beer, animals, or fowls to the heap and
    prayed to the river spirit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Wajale was possessed by Nakawomba, and Katonga by the spirit of a Munyoro;
    each river was worshipped under the form of a lion, and the medium roared like
    a lion when possessed.
  category: relationship
  evidence_refs:
  - ev:11
