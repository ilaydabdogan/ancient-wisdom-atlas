  quote: ''
  summary: 'The passage describes Baganda canoe construction: boards are cut from
    a tree with adzes, workmen observe sexual abstinence during the making, boards
    and keel are placed in water, creepers are collected and moistened for stitching,
    and the canoe is assembled without nails or iron by stitching boards to the keel
    and strengthening them with strips and stretchers.'
