canonical_text:
  quote: ''
  summary: The passage describes Baganda marriage rules, clan descent, naming and
    clan membership, wife roles, inheritance-related wife status, household arrangements
    in polygynous marriage, washing customs, and the beginning of a royal accession
    scene in which a new king views and covers the body of his predecessor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriage eligibility was governed by defined clan divisions and rules of consanguinity,
    with royalty exempt from ordinary rules and the Lung-fish Clan given as an exception
    allowing intermarriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Descent was reckoned through the male line, and children belonged to the father’s
    clan rather than the mother’s clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the naming ceremony, a child was acknowledged as a clan member and took
    on the clan totems, restrictions, and taboos.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In ordinary kinship speech, males of a clan were called fathers or brothers
    and women were called mothers or sisters; closer paternal relations and same-branch
    relations had special designations.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man was required to take his second wife, called Nasaza, from his paternal
    grandmother’s clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Nasaza had duties including shaving the husband, cutting his nails, and
    disposing of hair and nail-clippings so they would not fall into an enemy’s hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first wife, called Kadulubare, had charge of the husband’s fetiches and
    was associated with taboos concerning journeys and war.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Kadulubare ruled over the other wives and, in a chief’s household, took
    the title Mukyala.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: An heir, upon entering an inheritance, took a near female relative of the
    deceased as wife liibuga, though marital relations were forbidden because she
    was also his sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A wife washed her husband’s feet before he retired to bed and often washed
    him all over with warm water in a private back yard; she also performed her own
    ablutions there using the same water and pot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: There was no stated restriction on how many women a man might take from one
    clan, and he might marry two or three sisters.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: In polygynous marriage, a man built a separate house for each wife, generally
    side by side within a fence, while his own house stood in front of the women’s
    quarters.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: When a new king was chosen, he was taken to see his predecessor’s body and
    covered the predecessor’s face with bark-cloth.
  category: sequence
  evidence_refs:
  - ev:11
