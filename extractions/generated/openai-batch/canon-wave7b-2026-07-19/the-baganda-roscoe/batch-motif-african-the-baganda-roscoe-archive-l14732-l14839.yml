  summary: 'The passage describes classes of religious objects and religious functionaries
    among the Baganda: amulets used for healing or protection, ghosts of departed
    relatives, national gods under royal oversight, temple estates, priests, sacred
    taboos, offerings and oracles, temple fire and grass maintenance, and mediums
    chosen by gods as divine mouthpieces.'
  language: English
