canonical_text:
  quote: ''
  summary: 'The passage describes harmful and healing-related magical practices: disease
    is transferred from a patient to a proxy figure and left in a road; a fowl-blood
    charm is buried in a path to kill an enemy; withering branches or incanted objects
    are used to cause death; and handled objects or bodily residues are used for spells
    against a person.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine-man makes a clay model of a patient, gives it to a relative, and
    the relative rubs it over the patient before burying or hiding it by the road
    at nightfall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first person who steps over or passes by the disease-bearing object is
    said to catch the disease.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A plantain-flower can be tied to resemble a person, rubbed over a patient,
    and buried in the road.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person carrying disease-attached figures into the road must avoid being
    caught, because the stated penalty is death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man wishing to kill another can kill a fowl in a hole in the path to the
    victim's house, let the blood run into the hole, bury the fowl's head with the
    blood, and ask the gods to make the medicine kill his enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The victim, unaware of the buried trap, is said to walk over it, become ill,
    and die within a few days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tree branch may be treated with incantations and placed near the victim's
    house; as it withers, it is thought to cause the person's death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A stick, plantain, or fetich over which incantations have been said may be
    pushed into a house thatch and is said to cause death to the inmates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Handled weeds, earth from a hoe, hoe-string, or a shred of barkcloth can be
    obtained by an enemy and used to work magic that causes illness or death.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A blade of grass put into a man's mouth and thrown aside, spittle, cut hair,
    or nail-parings can be used for a spell against him.
  category: object
  evidence_refs:
  - ev:6
