  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After delivery, the child is laid on a plantain leaf while those present wait
    for the afterbirth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The umbilical cord is cut with a bit of reed from the doorway for a boy and
