canonical_text:
  quote: ''
  summary: 'The passage describes procedures surrounding the birth of a royal child:
    Nabikande ritually removes pregnant wives from the royal enclosure by a mock purchase,
    attendants guard and care for the expectant mother under restrictions, the mother
    gives birth kneeling with midwives present, the newborn receives immediate care,
    birth and sex are signaled to officials and the King, and the afterbirth is deposited
    and guarded at a plantain or barkcloth tree with sex-differentiated details.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nabikande enters the royal enclosure with cowry-shells and wild banana seeds
    and uses a formula of buying a slave to take pregnant wives away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For each pregnant wife taken, one cowry-shell and one wild banana seed are
    paid to the Mugema's woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each pregnant wife takes her water pot on her head and goes with her maids
    to Nabikande's house, where the Mugema is waiting.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Mugema gives each pregnant wife a maid whose duty is to attend her, ensure
    that she takes medicine, and prevent actions likely to injure the baby.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The expectant mother is put in a new house and receives new cooking and water
    pots and new clothing; everything around her is required to be new.
