  quote: ''
  summary: 'The passage describes Baganda market practices: how meat, cloth, beer,
    coffee-berries, eggs, and other goods were measured and priced; the noisy morning
    market crowd; slaughter and scavenging at one side of the market; boys doing small
    tasks or seeking scraps; nightly sweeping and burning of refuse; and handling
    of unsold meat and fat.'
