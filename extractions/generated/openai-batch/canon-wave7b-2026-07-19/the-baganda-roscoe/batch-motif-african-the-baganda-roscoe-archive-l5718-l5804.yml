canonical_text:
  quote: the ghost attaches itself to the jawbone
  summary: 'The passage describes Baganda royal mortuary beliefs and practices: royal
    ghosts are associated with jawbone relics and communicate matters of state; a
    Queen''s death involves succession, embalming, mourning, body covering, burial
    in Busiro, killings near the tomb, and grave caretakers; a Queen who outlives
    the King becomes Nalinya and is buried near the King''s temple; the King''s Mother,
    Namasole, receives mourning and succession rites before the body is taken to Busiro.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the conception of a ghost attaching itself to a jawbone
    is ancient, and that jawbones said to belong to chiefs from before Kintu still
    exist.
  category: relationship
  evidence_refs:
