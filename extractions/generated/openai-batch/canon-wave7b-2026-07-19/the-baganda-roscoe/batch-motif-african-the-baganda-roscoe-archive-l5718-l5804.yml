  text: 'A figure caption identifies sacred objects from a King''s temple: a conical
    object containing a jawbone and a looped object containing an umbilical cord.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the Queen died during the King's lifetime, she was buried in Busiro near
    her father if possible, received rites like a King, was embalmed, and the country
    mourned while the new Queen was chosen before the body was moved.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the Queen's body was ready for interment, the Queen sent her Kago to
    cover it with buttered barkcloth before it was taken to the burial place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the way to the burial place, the bodyguard captured as many people as possible,
    and these people were killed at a sacrificial place near the tomb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Queen's body was buried in an open place with a mound; a house was built
    for grave guards, who were chosen from the late Queen's maids, and the new Queen
    was responsible for grave repairs.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the Queen outlived the King, she changed her name to Nalinya, lived at
    the temple entrance until death, and was then buried near the deceased King's
    temple after Busiro embalming and rites like the King's funeral.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A princess was appointed as Nalinya's successor, covered the body before embalming,
    and sent a representative to cover it before the funeral; the grave was in an
    open thatched space, though later Kings built houses over Queens' graves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When a Queen died during the King's reign, the King had to jump over her successor
    after the successor was fully installed at the end of mourning ceremonies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When the King's Mother, Namasole, died, fear seized the people; the King's
    grief became anger, and people were captured or put in stocks to increase the
    number sent to execution at the funeral.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The successor to the Namasole was brought by her clan as a young near relative
    for the King's approval; after approval she viewed and covered the face, and the
    body was taken to Busiro.
  category: sequence
  evidence_refs:
  - ev:12
