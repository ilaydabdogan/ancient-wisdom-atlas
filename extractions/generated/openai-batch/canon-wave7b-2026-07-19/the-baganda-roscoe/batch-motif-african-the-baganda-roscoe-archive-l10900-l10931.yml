  summary: 'The passage describes part of a Baganda royal enthronement rite at Budo
    Hill: the King enters a guarded enclosure, ascends a clay mound at the priest''s
    signal, proclaims kingship, plants a barkcloth-tree branch, receives a regal spear,
    and is stripped of mourning garments and robed in barkcloths.'
