canonical_text:
  quote: ''
  summary: The passage describes the Heart Clan's named forefather, estates, temples,
    a great snake shrine, and tribute; recounts the Tailless Cow Clan's legend explaining
    the crested crane as a second totem through a woman's disappearance and reported
    transformation; describes that clan's smithing, royal tribute, deities, temples,
    mediums, and offerings; and begins a Crow Clan genealogy claiming descent from
    Kidibe, a son of Kintu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Heart Clan says its forefather was Namugera, who lived and died on an
    island in Victoria Nyanza near Sese.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Namugera's sons Seromba, Lugaje, Lwamula, and Sava came to Budu, served King
    Wunyi, and received estates there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mukasa had small temples on Bale hill and Lwamyunyenyi hill, with priests
    and mediums.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the Bulonge estate there was a temple to the great snake Salajuanga, with
    a priest and a medium from the Heart Clan.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Heart Clan was noted for baskets used to keep coffee-berries and paid
    tribute to the King in baskets and in fish caught from the sacred river Mujuzi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Tailless Cow Clan says it has a legend about its second totem, the crested
    crane, while knowing nothing about its chief totem.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Tailless Cow Clan legend, a newly married girl was left alone briefly
    on the road by her companions and began eating small wild fruit called Ntiintunu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl's companions returned, saw her eating the fruit, and jeered at her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ashamed and angry, the girl fled toward a flock of crested cranes and was
    never seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Her companions said she changed into a crane when she reached the flock; from
    then on, the clan took the crested crane as its second totem.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Tailless Cow Clan traces its origin from Katongolo, who came from Bunyoro,
    moved into Budu, and settled there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The clan is described as hereditary smiths who smelt iron from stone, work
    it, served the King as smiths after Budu was conquered, and paid annual tribute
    in hoes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The clan's chief deity was Wangi, whose temple was on Mulema hill; the same
    estate also held a temple to the god Lwekera.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Each of Wangi and Lwekera had a medium, while one priest served both temples.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: When a medium died, the clan gathered to learn whom the god wished to appoint;
    the selected person became possessed, was placed in the temple, and began official
    duties.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Apart from appointing a medium, members went individually to seek counsel
    from the gods and to make offerings for favours received.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Crow Clan, commonly called Bandyala, claims to be descended from Kidibe,
    said to be a son of Kintu.
  category: relationship
  evidence_refs:
  - ev:9
