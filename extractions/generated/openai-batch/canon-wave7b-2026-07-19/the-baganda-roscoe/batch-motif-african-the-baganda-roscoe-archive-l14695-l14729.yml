canonical_text:
  quote: ''
  summary: 'The passage introduces Baganda religion, listing four classes of venerated
    objects: gods, fetiches, amulets, and ghosts. It distinguishes national gods supported
    by the state and presented before the King from private clan gods. It says principal
    gods were formerly skilled and brave humans later deified, alongside animal and
    reptile gods and venerated trees and stones. It then describes fetiches as man-made
    objects believed to avert evil, bring good, have attached ghosts, answer supplications,
    possess temples with mediums and priests, and be periodically taken to the King.'
  language: English
  quote_policy: summarized
