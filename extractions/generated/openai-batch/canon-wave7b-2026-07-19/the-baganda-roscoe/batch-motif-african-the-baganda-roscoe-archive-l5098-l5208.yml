canonical_text:
  quote: ''
  summary: 'The passage describes customs concerning royal widows and princes after
    a king''s accession, then gives an ethnographic account of Baganda sickness treatment:
    consultation of medicine-men and oracles, cupping and blood examination, clan
    nursing duties, use of herbs, cautery, fetishes, ancestor-ghost explanations for
    illness, transfer of sickness to an animal or fowl, washing, diet, smoke exorcism,
    fumigation, ancestor-grave propitiation, and illness attributed to magic worked
    by a rejected man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a king ascended the throne, widows were formerly confined until their
    sons died; later, princes were captured and killed to ensure peace, and in King
    Mutesa's case his Mother starved the princes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a man fell sick, his wife consulted the nearest medicine-man, who used
    an oracle to identify the cause and prescribe treatment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For headache, the patient was bled to remove alien matter said to have been
    introduced into the head by magic or by a ghost.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Blood removed by cupping was poured into a leaf and examined by the medicine-man,
    who found something to account for the headache.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cupping cups were short ends of cow horns with a small hole at the tip; the
    medicine-man shaved, washed, scratched, wetted, applied the cup, sucked out air,
    and plugged the hole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cupping was used for headache, coughs, deep abscesses, and sometimes pleurisy,
    with horns left on until enough blood was drawn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A sick man's wife sent messengers to his clan; clan members came to nurse
    him, and the wife was not left alone with him in case she might be accused if
    he died.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Medicine-men used herbs and drugs as well as magic, and were described as
    trying to relieve the sick person and preserve their reputation as doctors.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: For some illnesses, a heated iron with three pieces was applied to the painful
    place to make three blisters, which were said to relieve pain and drive out its
    cause.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For fever, herbs were administered from a fetish, which was said to increase
    their potency.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Phthisis was said to be caused by the ghost of an ancestor who had died of
    the complaint; unless propitiated, the ghost would kill the patient.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Expectorations from a person with phthisis were feared as a channel for the
    ghost's malign influence.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A medicine-man could provide an animal or fowl called kyonzira to which sickness
    was transferred, then administer herbs and wash the patient with warm water infused
    with herbs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The patient's diet was generally liberal and could include good soup and plantain
    wine when feverish.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: When a patient was said to be possessed by a ghost, the ghost was exorcised
    by making the patient inhale smoke; sometimes the whole hut was fumigated with
    herbs slowly burned in a pot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Neglect of ancestor graves was described as a common cause of sickness, with
    angry ghosts needing propitiation before medicine-man remedies would work.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Women were often said to suffer because a man whose advances they rejected
    had worked magic on them.
  category: relationship
  evidence_refs:
  - ev:10
