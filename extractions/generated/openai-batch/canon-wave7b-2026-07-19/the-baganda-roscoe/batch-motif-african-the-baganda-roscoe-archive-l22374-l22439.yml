canonical_text:
  quote: ''
  summary: 'The passage describes Baganda hunting practices: capturing and cooking
    large rats, offering parts of captured animals to the god of the chase, feeding
    hunting dogs when the hunter returns, performing return-home precautions believed
    to prevent hunting failure, using pit and spring traps, and hunting lions or leopards
    by order of the King or chiefs when they become dangerous.'
  language: English
  quote_policy: summarized
