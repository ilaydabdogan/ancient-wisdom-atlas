canonical_text:
  quote: ''
  summary: The passage describes Bushbuck Clan relations with the kings of Uganda,
    a narrative explaining a royal taboo after King Kimera was killed by his grandson
    while hunting bushbuck, the clan's worship of Yaige as a lion god, restrictions
    on Bushbuck Clan women who became royal wives, release of Bushbuck Clan members
    from capture for sacrifice, a list of estates, and Dog Clan origins and cult offices
    connected with Musisi and Mulindwa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bushbuck Clan is said to claim relationship with the kings of Uganda,
    once supplied the King with a butler, and was barred from entering the royal presence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for the prohibition is that King Kimera was killed by his
    grandson while hunting bushbuck after the grandson's mother said Kimera had caused
    his father's death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Kimera's killing, kings refused to allow Bushbuck Clan members into
    their presence, and both the clan members and their totem animals were taboo to
    kings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bushbuck Clan had a temple on Nasike hill where Yaige was worshipped as
    a lion god; Yaige was described as an ancestor who became a lion at death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yaige's priest was Bayanguwe, and Yaige's medium was also a member of the
    Bushbuck Clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women of the Bushbuck Clan could become wives of the King, but they were not
    allowed to rear a male child; a male child born to them was strangled at birth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Bushbuck Clan woman who became the King's wife claimed to belong to the
    Monkey Clan.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: People caught on the roads to be sacrificed to the gods were released if they
    proved they belonged to the Bushbuck Clan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists Bushbuck Clan estates in Mawokota, the Sese Islands, Gomba,
    Singo, and Busuju.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Dog Clan traces its origin to Busunde, who lived on the Kigwa estate in
    Busuju.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Dog Clan had a temple to the god Musisi on the Lusundu estate; Mutasengwa
    was priest and estate chief, a Musoga woman was the medium, and Kasuju had oversight
    of the temple.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:12
  text: On the Bulindwa estate the Dog Clan had a royal fetich named Mulindwa with
    a priest named Sebakija.
  category: object
  evidence_refs:
  - ev:10
