canonical_text:
  quote: ''
  summary: 'The passage describes a Baganda mourning ceremony after a death: participants
    shave their heads; the deceased''s sister''s son cuts and burns the main house
    post; widows are seated on separate log-halves according to kin and status; fowl
    and fish are ritually prepared, tasted, eaten, or burned; widows are then assigned
    to the heir, clan members, grave care, the King, or their own clans; the sister''s
    son receives a wife; and the heir''s installation begins with a barkcloth presentation
    by the clan head.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the following morning, participants shaved their heads and prepared to
    receive the deceased's sister's son, called muiwa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased's sister's son cut down the main post in the house and laid it
    on the fire until it burned through.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One half of the burned-through post was carried out to the garden while still
    burning, and the other half was left inside the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Widows with living relations who had been married according to marriage customs
    were claimed by a relative and brought out to sit on the log in the garden.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Widows with no relations to bring them out had to sit on the log inside; the
    passage identifies them as slaves, called nvuma, whom the deceased had inherited,
    purchased, or captured in war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A fowl was cooked over the fire in the house and given to the men who were
    present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The women sitting on the inside log were given fish; they only tasted it,
    and most of it was thrown into the fire and burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explains the fish-burning as part of the women taking leave of
