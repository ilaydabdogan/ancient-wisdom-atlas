  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The women left unclaimed on the inside log remained slaves for life and passed
    to the clan as property of the heir.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some outside widows with children were chosen to live near and care for the
    grave; others were sent to clan members, while the majority belonged to the heir.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The King received some younger widows who had not been taken as wives by the
    deceased.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Widows appointed to go to the heir could return to their own clan if that
