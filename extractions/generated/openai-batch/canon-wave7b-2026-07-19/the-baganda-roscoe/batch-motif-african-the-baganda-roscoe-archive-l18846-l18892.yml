  summary: 'The passage describes Baganda royal and chiefly house construction: pillars
    are set in an ordered arrangement, reed basket-work roofing is stitched, materials
    are prepared to uniform standards, and professional Ngeye Clan thatchers work
    on roofs. In royal houses, the King gives copper objects to thatchers and in some
    cases begins cutting the thatch over the doorway before handing the knife to the
    principal thatcher.'
