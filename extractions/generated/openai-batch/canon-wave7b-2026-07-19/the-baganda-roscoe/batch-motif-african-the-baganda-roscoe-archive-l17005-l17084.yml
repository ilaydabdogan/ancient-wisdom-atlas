canonical_text:
  quote: ''
  summary: The passage describes Baganda fetishes used for illness diagnosis and royal
    ritual. A household head may consult the fetich Nambaga at night until possessed
    and informed about illness. Skilled medicine-men make fetishes from selected herbs
    and animal materials, dedicate them to gods, and keep the craft secret. At a king's
    coronation, his paternal grandmother's clan prepares the fetich Nantaba from a
    gourd, a special tree, offerings to a tree-spirit, captured wind, leaves, goat
    skin, cowries, and beads. A stick named Setnwima is carved from the same tree
    and installed with sticks of former kings. The royal gourd and stick receive temples,
    guardians, and ritual handling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man with an ill wife or child could take the fetich Nambaga outside his
    hut by night, smoke upon it, become possessed by it, and receive information about
    the illness and treatment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only highly skilled medicine-men were said to be able to make fetiches.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Materials for some fetiches included selected herbs and the hearts of lions,
    leopards, crocodiles, elephants, buffaloes, and other animals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The materials were pounded and put into horns or mixed with clay, formed into
    fetiches, and dedicated by the medicine-man to different gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the fetiches became identified with a supernatural
    being, possessed by gods, and regarded as powerful and effective.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The secret of making fetiches was confined to a small number of medicine-men
    and was not generally divulged.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a king was crowned, he sent to his paternal grandmother's clan for a
    new fetich named Nantaba.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king's grandmother's relatives prepared a gourd and selected a special
    lusambya tree for the fetich.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Four named men were sent with cowry-shells and a white goat from the king.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The goat and cowry-shells were offered to the tree-spirit; the goat was let
    loose and became sacred to the tree-spirit, while the cowry-shells were divided
    among the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Barkcloths were spread around the tree to catch chips as it was cut down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the tree was felled, the king's grandmother held a gourd at the stump
    with its mouth toward the wind, making a mournful sound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Leaves from the tree were placed in the neck of the gourd, the gourd was covered,
    and the people shouted that the wind had been captured.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The gourd was stitched in goat skin, decorated with cowry-shells and beads,
    and called Nantaba.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: A stout stick was cut from the tree trunk and carved into a walking stick;
    it was later named Setnwima.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: None of the tree's wood could be used for any other purpose, and the branches
    were left to rot.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Nakatansa/Nakatanza carried the gourd bound to his person, walked slowly like
    a pregnant woman near delivery, rested often, and was limited to short daily travel.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: On the return journey the four men were not allowed to look on blood, and
    meat for them was dried in the sun before cooking.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: At the palace, a temple was built for the gourd Nantaba, and Kabeja, one of
    the king's wives, was appointed caretaker.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: Nakatansa/Nakatanza supplied Kabeja with a maid titled Nabagade, and Nantaba
    became virtually Nabagade's charge.
  category: relationship
  evidence_refs:
