- id: ev:1
  type: summary
  locator: lines 17005-17011
  quote_or_summary: A man with an ill wife or child may take Nambaga outside by night,
    smoke upon it until possessed, and receive information about the illness and treatment.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: lines 17011-17017
  quote_or_summary: Only skilled medicine-men can make fetiches; materials include
    selected herbs and hearts of lions, leopards, crocodiles, elephants, buffaloes,
    and other animals thought to make the owner brave and strong.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 17017-17022
  quote_or_summary: Materials are pounded into horns or mixed with clay and made into
    fetiches, then dedicated to gods and understood as identified with supernatural
    beings and possessed by gods.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 17022-17029
  quote_or_summary: The making of fetiches is a secret kept by a small number of medicine-men;
    people believe the objects have supernatural powers and treat them with reverence.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 17030-17037
  quote_or_summary: At a king's coronation, he sends to his paternal grandmother's
    clan for a new fetich, Nantaba; the relatives prepare a gourd and select a special
    lusambya tree.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 17037-17049
  quote_or_summary: Kago, Nakatansa, Sekitimba, and Mukusu bring cowry-shells and
    a white goat from the king; the goat and cowries are offered to the tree-spirit,
    the goat is set loose as sacred to it, and the cowries are divided among the people.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 17049-17062
  quote_or_summary: Barkcloths catch the chips while the tree is felled; the king's
    grandmother holds the gourd at the stump toward the wind, adds leaves, covers
    it, and the people rejoice that the wind has been captured. The gourd is covered
    in goat skin, decorated, and named Nantaba.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 17062-17072
  quote_or_summary: A stout stick is cut from the tree trunk; the chips are tied in
    barkcloth to the stump; none of the wood may be used, the branches are left to
    rot, and the stick is carved and wrapped.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 17072-17088
  quote_or_summary: The gourd is handed to Nakatansa/Nakatanza, who carries it bound
    to his person and walks slowly like a pregnant woman; Kago carries the stick,
    the other men accompany them, and the party observes restrictions concerning blood
    and meat.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 17088-17102
  quote_or_summary: At the palace a temple is built for Nantaba, Kabeja is made caretaker,
    Nabagade becomes virtually its charge-holder, and a separate shrine is built for
    the stick; former kings' sticks are placed there, the new stick upright, and the
    stick is named Setnwima.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 17102-17108
  quote_or_summary: Kabeja may send for Nakatansa/Nakatanza to carry Nantaba into
    the courtyard to enjoy sunshine; a special meal is cooked and king's wives are
    invited to see it.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
