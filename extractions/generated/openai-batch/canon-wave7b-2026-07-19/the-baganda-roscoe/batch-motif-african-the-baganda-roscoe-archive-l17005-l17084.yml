candidate_motifs:
- id: motif:1
  label: royal coronation sacra legitimating a new king
  taxonomy_refs:
  - royal_legitimacy
  basis: At coronation the king obtains a new fetich from his paternal grandmother's
    clan; a new stick is installed upright in a shrine with the sticks of former kings.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage describes ritual installation and royal continuity but does
    not explicitly state a theory of legitimacy.
- id: motif:2
  label: sacred exchange with a tree-spirit
  taxonomy_refs:
  - sacred_exchange
  basis: The king's envoys offer a goat and cowry-shells to the tree-spirit; the goat
    becomes sacred to it and the cowries are distributed among the people.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage calls the action an offering, not a bargain or contract.
- id: motif:3
  label: ritual tree as source of royal objects
  taxonomy_refs:
  - sacred_tree_axis
  basis: A special tree is selected as the center of the ceremony, receives offerings
    through its spirit, is felled ritually, and provides the leaves, gourd rite context,
    and stick for royal sacra.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The tree is ritually central, but the passage does not describe it as
    a cosmic axis or world tree.
- id: motif:4
  label: capture of wind in a sacred vessel
  taxonomy_refs: []
  basis: The king's grandmother holds the gourd toward the wind at the stump, covers
    it after adding leaves, and the people shout that the wind has been captured.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No wider cosmological meaning is explained in the passage.
- id: motif:5
  label: gestational treatment of a sacred vessel
  taxonomy_refs:
  - sacred_birth
  basis: The carrier binds the gourd to his person, walks like a pregnant woman near
    delivery, rests frequently, and is cared for like a delicate woman.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text uses an explicit pregnancy simile, but it does not describe an
    actual birth rite.
- id: motif:6
  label: restricted ritual craft knowledge
  taxonomy_refs:
  - forbidden_knowledge
  basis: The method for making fetiches is confined to a small number of medicine-men
    and is not divulged except under conditions benefiting the specialists.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes secrecy and restricted transmission rather than
    a prohibition on knowing.
- id: motif:7
  label: divinatory possession for illness diagnosis
  taxonomy_refs: []
  basis: Nambaga is smoked upon until it possesses the consultant and gives information
    about the cause of illness and treatment.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the event as fetich possession and diagnosis, not as
    a named oracle tradition.
