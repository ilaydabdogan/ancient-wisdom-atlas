canonical_text:
  quote: ''
  summary: 'The passage describes succession-related killings connected with royal
    blood and the prevention of civil war, then outlines preparations for war: a War-god’s
    messenger may prompt a punitive expedition; chiefs bring presents to the gods
    to seek advice, sanction, blessing, a chosen general, and ritual objects or emblems
    for divination; the King consults officials and chiefs before announcing the general.'
  language: English
  quote_policy: summarized
