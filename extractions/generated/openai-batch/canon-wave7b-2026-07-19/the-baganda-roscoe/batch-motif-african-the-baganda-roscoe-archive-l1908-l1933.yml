  quote: ''
  summary: The passage describes Baganda drummers who paid taxes directly to the sovereign,
    served their own masters rather than district chiefs, and took yearly turns residing
    at the royal court to beat named drums. It also describes drum construction from
    hollowed tree trunks covered with cow-hide, decoration with cowry shells or beads,
    suspension on posts, and beating with two short sticks.
