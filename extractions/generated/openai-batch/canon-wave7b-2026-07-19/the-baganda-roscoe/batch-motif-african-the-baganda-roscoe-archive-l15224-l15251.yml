  quote: ''
  summary: 'The passage describes duties and restrictions connected with relics in
    a temple-enclosure: the relics were to be rescued if in danger; the enclosure
    entrance was a house with a central passage watched by a monthly relieved guard;
    women maintained the temple grass floor-covering and regulated who could walk
    up the center, allowing only persons of rank while others approached along the
    side and stood at a respectful distance.'
