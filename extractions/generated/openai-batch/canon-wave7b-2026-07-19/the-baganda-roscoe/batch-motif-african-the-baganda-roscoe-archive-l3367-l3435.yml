canonical_text:
  quote: ''
  summary: The passage describes reported Baganda practices concerning infant care,
    custody after divorce, removal of weaned children to the father's clan, kin relations,
    terms and gestures of affection, and the naming ceremony called kwalula, which
    gives a child standing in the clan and establishes legitimacy. The ceremony is
    generally held at the clan chief's house under his charge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says an infant could lie on the floor, later play in dust, and
    was not trained in habits of cleanliness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man divorced his wife, the passage says the wife was not allowed to take
    the child; the child belonged to the husband, who was responsible for looking
    after it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A nursing mother is described as passing the child to her husband with the
    words rendered as “Take your child.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After weaning, children were taken away from their mother and reportedly had
    little or nothing to do with her afterwards.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the father was feared and respected, while children
    showed something approaching love toward the mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says kissing was not known among the people, but a mother might
    hug or pat a small child, and a child might cling to her for protection or comfort.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that the language term kivagala served for liking and
    love, while kiiganza was used for demonstrative affection shown by gifts and in
    contexts of courtship or desire for sexual intercourse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When children were old enough to leave their mothers, they were taken to a
    member of the father's clan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father and members of his clan are said to have cared for the children
    from birth until death, while the mother's clan took less interest in them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The naming ceremony, called kwalula, gave the child standing in the clan and
    established legitimacy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the marriage of the parents was less important than the ordeal
    of proving the child's legitimacy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a man's clan accepted a child as his, the child took a place among his
    children with the rights of a son, even when the mother had not gone through the
    marriage ceremony.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The gathering for naming was generally held at the house of the chief of the
    clan, who took charge of the ceremonies.
  category: setting
  evidence_refs:
  - ev:8
