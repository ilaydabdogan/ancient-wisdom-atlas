canonical_text:
  quote: ''
  summary: 'The passage describes Ganda clan rites connected with childbirth: tests
    of an umbilical cord for clan membership, sprinkling and gifts for children, ritual
    actions involving mothers and clan elders, feeding with plantain and fish as a
    childbearing charm, naming by reference to deceased forefathers, appointment of
    an ancestral ghost as guardian, placement of shaved hair with the afterbirth at
    a plantain root, sanctions for failed tests, and a brief transition to royal/princely
    cords and the importance of twins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One clan test placed the umbilical cord into the core of a plantain tree;
    if the core rose by morning and the cord came out above the cut, the child was
    considered confirmed as a clan member.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another clan test put the umbilical cord in moist cow dung and threw it against
    a house wall; sticking was favorable, while falling twice indicated the child
    was not a clan member.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some clans preserved the umbilical cord on a bed or placed it with the afterbirth
    at the root of a plantain tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the cord test, children were placed on the back of a strong girl and
    sprinkled with the remaining mixture from a vessel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The head of the clan gave boys goat skins and girls pieces of barkcloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mothers had to draw water or bring firewood for the head of the clan before
    taking their evening meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The head of the clan jumped over each seated woman, and the woman told her
    child that he was its father; in many clans the husband also jumped over his wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother-in-law fed the mother cooked plantain and cooked fish after moving
    her hands upward while reciting her son's forefathers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fish was eaten as a charm intended to effect rapid child-bearing, with
    an explicit comparison to fish swarming in shallow lake waters.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A grandmother named deceased forefathers to a child and watched for the child's
    laughter as the sign identifying the ancestor whose ghost would be the child's
    guardian.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the child later became ill or failed to thrive, its name could be changed
    and another guardian appointed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The child's clan name was used within the clan and could serve as proof of
    membership in important clan matters.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: After naming the child, the grandmother shaved its head, bundled the hair,
    and placed it at the plantain root where the afterbirth was.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mothers who passed were feasted, welcomed, and praised by members of the husband's
    clan; those who failed were scolded, compelled to name the father, and in some
    cases beaten by women of the husband's clan.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: For princes and the King's wives, umbilical cords were decorated and preserved
    with the twins of kings and princes.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that the birth of twins was a most important event and
    was regarded as due to direct intervention of the god.
  category: attribute
  evidence_refs:
  - ev:13
