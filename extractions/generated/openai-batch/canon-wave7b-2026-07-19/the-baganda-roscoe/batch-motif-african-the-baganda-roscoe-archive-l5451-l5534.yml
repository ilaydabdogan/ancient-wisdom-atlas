  claim: The passage explicitly compares the current king's gazelle hunt at the end
    of mourning with King Kimera's hunt during his return from Bunyoro, making Kimera's
    act the precedent for the accession hunting custom.
  claim_level: same_function
  target: King Kimera's return-from-Bunyoro hunting precedent within Ganda royal tradition
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal precedent stated by the passage, not evidence by
    itself for historical contact, common inheritance, or a cross-cultural motif relationship.
