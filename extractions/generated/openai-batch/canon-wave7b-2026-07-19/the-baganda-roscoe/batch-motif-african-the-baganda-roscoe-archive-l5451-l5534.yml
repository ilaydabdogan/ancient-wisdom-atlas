canonical_text:
  quote: ''
  summary: 'The passage describes royal burial rites: the late king''s body is placed
    in a prepared tomb with barkcloths, nail-parings, and hair; the tomb is sealed;
    wives, men, and prisoners are killed around it as attendants for the king in the
    other world; chiefs report and receive rewards; royal mourning is ended through
    shaving, washing, drums, and an accession hunt recalling King Kimera; a tomb post
    is burned with cowry-shells thrown into the fire; and a man is slightly speared
    by the king and then killed.'
  language: English
  quote_policy: summarized
