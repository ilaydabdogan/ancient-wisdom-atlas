candidate_motifs:
- id: motif:1
  label: funerary attendants killed for a dead king's other-world service
  taxonomy_refs:
  - sacrifice
  basis: Wives, men, and prisoners are killed around the royal tomb, and the passage
    states that they are sent to attend the king because he is supposed to need them
    in the other world.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is an ethnographic description of royal burial practice; it
    does not itself use a technical motif label.
- id: motif:2
  label: sealed royal tomb supplied with body relics and cloth
  taxonomy_refs: []
  basis: The royal body is placed with barkcloths, nail-parings, and hair; the tomb
    is packed with barkcloths and sealed so no one can enter again.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The symbolic meaning of the hair, nail-parings, and barkcloths is not
    explained in this passage.
- id: motif:3
  label: formal ending of royal mourning through bodily purification and public sound
  taxonomy_refs: []
  basis: The end of mourning involves a set day, shaving, washing, clothing change,
    removal of mourning signs, and beating of royal drums to inform the people.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage describes the actions but gives limited explanation of their
    meanings.
- id: motif:4
  label: accession hunt grounded in ancestral royal precedent
  taxonomy_refs:
  - royal_legitimacy
  basis: The king kills a gazelle after mourning ends; the passage explicitly links
    this to Kimera's hunt on returning from Bunyoro and says each king observes the
    hunting custom when ascending the throne.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage supports a dynastic precedent but does not provide a full
    mythic narrative of Kimera here.
- id: motif:5
  label: tomb-post fire vigil with cowry-shells
  taxonomy_refs: []
  basis: The post removed from the tomb is burned in the king's house while Mugema
    and Mbaja sleep beside it, keep it burning, and throw cowry-shells into the fire.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not state the reason for burning the post or adding cowry-shells.
comparison_claims:
