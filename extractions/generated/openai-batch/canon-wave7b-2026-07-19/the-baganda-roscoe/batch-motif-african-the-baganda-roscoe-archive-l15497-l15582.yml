canonical_text:
  quote: ''
  summary: 'The passage gives legends and ritual details concerning Mukasa: his divine
    parentage and family, his mother’s food restrictions before his birth, his unusual
    childhood diet, his disappearance and discovery on Bubembe under a tree near the
    lake, his care by Semagumba and priests, variant accounts of his end, and procedures
    for rebuilding his temple with royal consent, sacred-number offerings, sacrifice,
    and local ritual intermediaries.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mukasa is described as the son of Wanema, called Mairwa on the island, and
    Nambubi of the Lungfish Clan; his younger brother Kibuka became a war god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before Mukasa’s birth, Nambubi is said to have refused food except ripe gonja
    plantains and would not eat cooked food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At birth Mukasa was named Selwanga, and after weaning he refused ordinary
    food, eating animal heart and liver and drinking animal blood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While still a child, he disappeared from home and was later found on Bubembe,
    sitting under a large tree near the lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: People who found him concluded he came from Bukasa and called him Mukasa,
    a name explained in the passage as meaning a person from Bukasa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Semagumba carried the child from the shore to a garden and placed him on a
    rock while the people decided where he should go.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people were afraid to take him into their houses because they said he
    must be superhuman, so they built a hut near the rock and assigned Semagumba to
    care for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When an ox was killed, Mukasa asked for the blood, liver, and heart, while
    refusing the meat offered to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people took this behavior as confirmation that he was a god and consulted
    him about illness and trouble.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Semagumba became chief priest, and Gugu and Sebadide also became priests;
    their names became official names of later priests.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mukasa is said to have lived for many years in the hut built for him and to
    have married three wives named Nalwanga, Najembe, and Naku.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Different accounts are given of Mukasa’s end: some say he died and was buried
    on the island near the temple, while others say he disappeared suddenly.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A temple is described as a conical reed hut, and rebuilding it required the
    special consent of the King.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: For Mukasa’s temple, posts were set into holes dug in rock, which helped preserve
    them from white ants and damp.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a temple was built, the King and the chief each sent nine oxen; nine
    is stated to have been the sacred number for gifts and offerings to the gods.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: The cattle supplied sacrifice to the god, hides for construction uses, blood
    for the god, and meat for his children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The King’s overseer went to Gabunga, who conducted him toward the god; Gabunga
    and the foreman builder first went to Musisi for permission, then proceeded to
    Bubembe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Mukasa’s priest received notice of the messengers, accepted the King’s present,
    and ordered island people to bring gifts and prepare to build the temple.
  category: action
  evidence_refs:
  - ev:8
