canonical_text:
  quote: ''
  summary: 'The passage describes Baganda practices for keeping goats: peasants commonly
    kept goats for urgent needs and fines; chiefs entrusted goats to peasants and
    paid them with every third kid; goats were housed and tethered at night; hut floors
    were arranged for drainage; goats were turned out after dew evaporated and herded
    by children; wet grass was avoided because it caused disease and lameness; no
    taboos were connected with goats.'
