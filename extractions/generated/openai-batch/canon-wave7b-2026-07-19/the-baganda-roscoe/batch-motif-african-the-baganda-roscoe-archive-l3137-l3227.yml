canonical_text:
  quote: ''
  summary: The passage describes Baganda childbirth and postpartum practices, including
    beliefs about a twin ghost and the ghost of the afterbirth, adultery as an explanation
    for obstructed delivery, a nine-day birth fire and household taboo, cleansing
    and payment of the midwife, a husband’s gesture ending taboo, nursing separation,
    and Bean Clan first-birth rites, afterbirth and umbilical-cord customs, and a
    fish-swallowing test of legitimacy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that a grandparent’s eating food or drinking beer saved
    the clan from the danger that a living child would die in order to follow its
    twin ghost; a note explains that this action retained the ghost of the afterbirth
    in the clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When delivery was retarded, relatives attributed it to adultery and made the
    woman confess the name of the man with whom she had had intercourse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the woman died in such a case, her husband was fined by her clan; if she
    recovered, she was upbraided and the accused man was heavily fined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: As soon as the child was born, the midwife sent a boy, specified as a younger
    brother of the child’s father, to fetch a log of wood for the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The log was kept burning for the first nine days after birth, and no one was
    allowed to take fire or water from the house during that period.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the end of the nine days, or seven days in some clans, the log was thrown
    away on waste land and was supposed to remove any evil in the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the postpartum period, no one was allowed to enter the house, and the
    mother was said to be lying in alkali and to be unapproachable.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the end of the period, the woman washed, the house was swept and cleansed
    of traces of birth, and a washing sponge was sent to the husband or used by the
    wife on him.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The woman cooked a meal eaten with her husband and the midwife; the husband
    then paid the midwife with a goat or bark-cloth and one hundred cowry shells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband later jumped over his wife to end the taboo, and intercourse with
    another wife before the ceremonies was said to endanger any child born to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A wife lived apart from her husband for three years while nursing her child,
    unless she was his only wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Bean Clan woman expecting a first child underwent a custom called Kuamya
    about one month before birth, with clan members gathering at her house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: In Kuamya, the woman was stripped, painted from head to foot with wood ashes
    and water, hung with plantain fibre, and paraded from house to house while clan
    members danced through the night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the morning she was washed, rubbed with butter, dressed, and taken to her
    mother-in-law’s house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: At the mother-in-law’s fireplace, the daughter-in-law was given a spear and
    pricked her mother-in-law’s great toe enough to draw blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage states that if the Kuamya ceremony was not observed, the child
    was expected to be born dead or to die immediately after birth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Bean Clan buried the afterbirth in the house near the door rather than
    at the root of a plantain, and they had no naming ceremony for the child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The Bean Clan kept the umbilical cord on the husband’s bed for three or four
    months, after which the mother placed it between his toes and he threw it as far
    as he could with his foot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The Bean Clan tested a child’s legitimacy by requiring the mother to swallow
    a baked small fish tail first after it had been prepared with fins, back-spikes,
    and banana flour.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: If the fish stuck in the mother’s throat, the child was disowned and she was
    accused of adultery; if the child was her husband’s, she was expected to swallow
    it without difficulty.
  category: sequence
  evidence_refs:
  - ev:8
