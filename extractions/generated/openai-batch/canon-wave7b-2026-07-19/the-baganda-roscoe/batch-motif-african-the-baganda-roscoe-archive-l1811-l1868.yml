  summary: The passage describes Baganda customs concerning avoidance of a ghost,
    royal nail and hair marks, beer drinking and penalties, gendered restrictions,
    and moonlit dances in plantain groves with plantain-root masks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person was thought to avoid a ghost-caused illness by leaving food and going
    away until recalled, thereby deceiving the ghost.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King, his wives, and members of the royal family had nails cut in a V-shape
    with the point in the centre.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A non-royal person detected cutting nails in the same V-shape could be accused
    of falsely representing royal connection and might be put to death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After cutting his nails, a man spoke a formula about eating meat before needing
    to cut his nails again, and this was said to bring luck.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King's wives cut the sides and middle of their front hair back, marking
    them as belonging to the King, and others were not permitted to imitate this.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beer drinking was common among chiefs and peasants, who could spend much of
    the day talking and drinking when not occupied by war or business.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When men became affected by drink, the passage says they generally went to
    sleep until the effects passed off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man who had drunk too much and passed water on the floor had to pay his
    host a fine of a goat, a barkcloth, and a fowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man was forbidden to go to a place used by women for relief of nature; the
    stated penalty for the offence was death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among the lower orders, men after drinking sought out women, and the passage
    characterizes a drunk man as immoral.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Young people held nightly dances in plantain groves while the moon was nearing
    full, especially on the night of full moon.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The King's wives and chiefs' wives were not permitted to dance except alone
    among themselves.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mixed dances frequently ended in immoral conduct, according to the passage.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: Young men made masks from plantain root by hollowing it so that the head was
    covered, with holes cut for the mouth and eyes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Wearing the plantain-root masks and old barkcloths, young men danced before
