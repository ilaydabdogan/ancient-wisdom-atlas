canonical_text:
  quote: ''
  summary: 'The passage describes Baganda governmental and inheritance practices:
    royal control over ivory and currency-making, birth distinction for the royal
    family, paths to chiefly status through ability and service, discouragement of
    hoarding, chiefly obligations to maintain estates and build for the King, and
    clan control over inheritance, widows, burial-related compensation, and adoption
    of a deceased person''s children by the heir.'
  language: English
  quote_policy: summarized
