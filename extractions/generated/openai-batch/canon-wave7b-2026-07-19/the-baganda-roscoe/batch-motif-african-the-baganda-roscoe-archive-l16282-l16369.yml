  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports declaration as a god but does not describe a resurrection
    or return to life.
- id: motif:3
  label: Ritual containment of a destructive plague deity
  taxonomy_refs: []
  basis: Kaumpuli is said to reside in a covered temple hole; the covering is needed
