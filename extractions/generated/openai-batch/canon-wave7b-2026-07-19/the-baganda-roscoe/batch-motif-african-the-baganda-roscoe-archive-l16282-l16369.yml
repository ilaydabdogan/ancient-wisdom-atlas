canonical_text:
  quote: ''
  summary: 'The passage recounts the origin and cult of Kaumpuli, described as the
    god of plague: his birth after a disregarded divine warning, his rejection and
    death, his posthumous declaration as a plague deity, the construction and maintenance
    of his temple, rituals to contain him, taboos concerning King Juko, and priestly
    plague-cleansing practices involving offerings, amulets, property dedication,
    and a plantain-tree scapegoat called Kyonzire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaumpuli is described as the god of plague, with a temple in Bulemezi on the
    Bunyoro and Bulondoganyi frontiers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Kayemba, brother of King Juko, loved and married Naku of the Civet-cat
    Clan after the gods objected and warned King Juko not to allow the marriage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Naku became mother of a child without arms and legs, and Kayemba feared the
    child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kayemba sent Naku and the child away by canoe to Busoga; Busoga priests warned
    the chiefs not to receive her, and she was driven from place to place until she
    settled at Bugoya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child had a nurse, Nabuzana, who tended him until his death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the child died, the gods declared him the god of plague, a temple was
    built in his honour, and his remains were placed in it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The temple was named Nabibubalo; it resembled other temples of the country,
    was ordered and maintained by the King through State labour, and received customary
    ceremonies and offerings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: It was said that the god resided in a deep hole in the temple, which was securely
    covered to prevent him from escaping and harming the country.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hole was covered with plantain stems, wild-cat skins, and stones around
    the edges.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: It was believed that without the covering the god would come out in a puff
    of smoke and destroy the country.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: King Juko was forbidden to look toward Bulemezi; a wife normally held barkcloth
    before him, but after he looked toward the temple hill he died a few days later.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kaumpuli’s priest had the title Kanalira and waited on the medium Nageza.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kanalira sent subordinates to cleanse gardens or houses where plague had broken
    out and distributed small iron and brass shield amulets against plague.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: When plague struck a garden or house, people made offerings of beer and barkcloth
    to the god and asked for priests to bring medicine to drive away the disease.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The priests treated and nursed the sick.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Cattle, women, or children belonging to a person who died of plague were confiscated
    and sent to the god; women and children could be redeemed by relations, while
    the rest of the property belonged to the god.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: After recovery, priests purified the place by transferring the disease to
    a plantain tree and removing it from the garden to nearby waste land.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Priests made small shields and spears from plantain fibre and reeds and placed
    them at intervals along the path from the garden to the main road.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: A young plantain tree was cut down, placed in the path to a plague-stricken
    hut, speared with reed spears, fitted with plantain-fibre shields, carried to
    waste land, and called the scapegoat, Kyonzire.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Priests raised a barkcloth-covered arch over the path where it branched from
    the main road, saying it would prevent the plague from returning by the path.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: A spear was stuck into the roof of each house where someone had died, marking
    that the property inside belonged to the god.
  category: action
  evidence_refs:
  - ev:12
- id: obs:22
  text: Women and children taken to the temple were not allowed to mourn or show sorrow
    until they were redeemed.
  category: action
  evidence_refs:
  - ev:12
- id: obs:23
  text: After the priests purified a house and garden and buried the dead, the inhabitants
    were allowed to return; the cleansing ceremony was called kukokola.
  category: sequence
  evidence_refs:
  - ev:13
