  summary: The passage describes specialized fishing at the Falls and the social and
    technical organization of pottery-making among the Baganda. Fishermen at the Falls
    used long spears and coordinated action in dangerous water. Potters formed distinct
    communities, supplied kings and chiefs, paid taxes in pots, and prepared swamp
    clay with simple tools rather than a wheel.
