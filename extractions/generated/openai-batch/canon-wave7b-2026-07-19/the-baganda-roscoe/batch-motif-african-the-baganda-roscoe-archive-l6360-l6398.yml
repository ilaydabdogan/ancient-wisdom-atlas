literal_observations:
- id: obs:1
  text: Under ordinary rules, descent is reckoned through the father, and each child
    belongs to the father's clan and takes the father's totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A child born to a man is counted as his legitimate child if the child has
    passed the test called kwalula.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Royal descent is described as an exception: every prince belongs to the mother''s
    clan rather than the father''s and takes the mother''s totems.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lion and Leopard clans claim descent from princes and claim to include
    all princes among their members.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Every prince and king has the lion and leopard as additional totems, and also
    claims the eagle as a totem, although no Eagle clan is said to exist.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clans are said to speak of having given birth to particular kings and to claim
    those kings as clan members.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Under ordinary circumstances a woman is lost to her clan when she marries,
    but her clan members still see that she is well treated and receives justice when
    in trouble.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A married woman's children are taught in infancy to respect and avoid her
    totems; when grown, they adopt their father's totems and rarely mention the mother's.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A man is forbidden to marry a woman from his mother's clan because members
    of that clan are regarded as his near relations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage introduces a following table stating that a man might not have
    communications with his father's sisters' daughters.
  category: action
  evidence_refs:
  - ev:5
