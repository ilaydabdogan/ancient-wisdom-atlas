  summary: The passage describes Baganda rules of relationship, descent, clan membership,
    totems, royal exceptions to ordinary descent, treatment of a married woman by
    her natal clan, avoidance and adoption of parental totems by children, and restrictions
    on marriage or communication with certain kin.
  language: English
