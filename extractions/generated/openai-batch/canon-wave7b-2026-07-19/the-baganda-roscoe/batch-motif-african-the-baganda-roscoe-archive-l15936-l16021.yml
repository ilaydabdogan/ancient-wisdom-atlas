canonical_text:
  quote: "“Kibuka flew up into a cloud and hovered over the enemy”"
  summary: The passage describes temple wealth and cattle belonging to a god, Nalwanga
    as Mukasa’s chief wife with a temple and fertility-related function, and the story
    of Kibuka/Kyobe, who is sent by Mukasa to aid King Nakibinge against the Banyoro,
    fights from a cloud, is betrayed after a captive woman learns his battle position,
    is mortally wounded, dies in a tree, and is later buried; a dropped shield is
    returned after causing illness among the Banyoro.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Cattle belonging to the god are described as usually kept for sacrifices,
    while the god also gives animals to priests for milking or food.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King alone is said to be able to give orders to the gods; he may plunder
    divine estates and cattle in anger, though he more often adds to the god’s wealth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nalwanga is identified as Mukasa’s chief wife and has a temple on one side
    of the open space before Mukasa’s temple.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nalwanga’s medium is named Sirkvao, and her rites are performed by Mukasa’s
    priests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nalwanga’s chief function is to assist childless women to become mothers,
    though her influence is described as limited and little known on the mainland.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nalwanga is said to have been a pythoness from the island Banga; the passage
    says there does not appear to have been offspring from her marriage with Mukasa.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kibuka, also called Kyobe, is said to be Mukasa’s brother, Wanema’s son, and
    a resident of Sese Island.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: During war with the Banyoro, King Nakibinge sends Katituba and Katata to Sese
    to seek Mukasa’s aid; Mukasa consents to send Kibuka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mukasa warns Kibuka not to let the enemies know where he takes position in
    battle and not to have dealings with Banyoro women.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kibuka flies into a cloud, hovers over the enemy, and shoots arrows and spears
    downward while the Baganda army presses from the front.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A captured Banyoro woman is sent to Kibuka’s hut, escapes at night, and carries
    information about who Kibuka is and where he positions himself to her people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the next battle, Banyoro archers shoot arrows into Kibuka’s cloud; Kibuka
    is mortally wounded, flees in the cloud to Mbale in Mawokota, alights on a large
    tree, and dies there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: One account says Kibuka dropped his shield; the Banyoro kept it, many became
