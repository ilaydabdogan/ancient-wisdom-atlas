canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Mr. Leopard tries to test
    and frame Mr. Hare's brother, but Mr. Hare's brother anticipates the tests, avoids
    the framing attempt, and Mr. Leopard is exposed and killed. It then begins the
    tale 'The Cat and the Fowl,' in which fowls rule wild cats through tribute and
    threats of burning them with their combs, until cats test a cock's comb and find
    it cold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr. Leopard says that the bag of a great person never lacks food; Mr. Hare's
    brother produces food from his bag, and Mr. Leopard becomes angry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr. Leopard instructs Mr. Hare's brother that, when they are offered beer
    and food, he must fetch a beer-tube and a plantain stem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mr. Hare's brother pretends to turn aside into the grass, but secretly cuts
    a beer-tube and obtains a plantain stem, hiding both in his clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When beer and food are served, Mr. Hare's brother quickly returns with the
    beer-tube and plantain stem already prepared.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before sleeping, Mr. Hare's brother fixes two cowry-shells on his eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At night Mr. Leopard steals, kills, and eats a neighbour's goat, then brings
    some blood to put on Mr. Hare's brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mr. Leopard mistakes the shining white cowry-shells for open eyes and thinks
    Mr. Hare's brother is awake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The neighbours miss the goat, follow footprints to the guests' house, and
