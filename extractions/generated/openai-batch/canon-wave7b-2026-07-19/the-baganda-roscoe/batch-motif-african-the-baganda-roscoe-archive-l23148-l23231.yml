  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Blood is seen on Mr. Leopard's mouth and nails, after which he is tried, condemned,
    taken away, and killed.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Mr. Hare's brother refuses to go with a thief and is said to have avenged
    his brother's death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the cat-and-fowl tale, fowls are described as former lords of wild cats
    and require them to supply food.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fowls demand four-fifths of the flying ants caught by the cats, and the
    cats must bring packets of ants before the fowls.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The cats dislike their subordination but are deterred by the fowls' threats
