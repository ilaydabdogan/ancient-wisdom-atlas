canonical_text:
  quote: ''
  summary: The passage describes Baganda food practices, including salt making, famine
    foods, plantain drying and barter, fish and meat access, the gathering and preparation
    of grasshoppers, flying ants, gnats, milk use among wealthier people, and the
    staged brewing of plantain beer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor kind of salt was made by burning swamp grasses, washing the ashes,
    and condensing the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During drought or famine, people dug plantain roots for food and also preserved
    plantains by drying, slicing, pounding into flour, or boiling dried chips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dried plantain flour and chips were bartered to lake-shore people for fish
    and were also carried as food by armies on long expeditions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men on journeys or punitive expeditions cooked their own food; without pots
    they baked plantains in embers or ate uncooked plantains that were otherwise despised.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Important chiefs held land by the lake or on islands, and retainers supplied
    them with fish.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dried sprats were sold on reed-strings for cowry-shells and were accessible
    to many poor people.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Peasants could have difficulty obtaining fresh fish or meat and sometimes
    went months without meat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Grasshoppers called nsenene were caught, fried, cooked on strips of cane,
    and eaten as a delicacy by all ranks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: White flying ants were trapped as they swarmed by covering their hillock except
    for one exit leading to a plantain-leaf-lined hole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Flying ants were cooked in pots, sometimes eaten alive by children, dried
    into packets for later use, or sold in markets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ant-hillocks were claimed and guarded by tenants as property, and the queen-ant
    was treated as a delicacy sometimes taken to the district chief with part of her
    nest.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A gnat called sanii crossed the water in thick clouds and was caught by fishermen,
    fried, and made into cakes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Milk was used as a luxury by wealthier classes; herdsmen brought it daily
    in pots, and it was allowed to clot rather than drunk fresh.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Cows were valued more for meat or barter than for milk.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Plantain beer was made from ripe male plantains called mbide, which were used
    for brewing and not cooked or eaten.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Plantain bunches could be ripened artificially by hanging them in kitchens
    or cooking-sheds where heat from the fire ripened them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Beer making involved removing skins, squeezing pulp with papyrus heads, adding
    water, straining juice into pots, adding baked and ground millet, fermenting,
    and finally straining into gourd-bottles.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
