canonical_text:
  quote: ''
  summary: 'The passage describes Baganda iron smelting and smithing: bellows and
    furnace operation, lighting and maintaining the fire, cooling and extracting iron,
    tools and smithy arrangements, restrictions on workmen during smelting, a smith''s
    son''s first attempt at work and a confirming gesture by the father, sale and
    use of iron, and smiths attached to the king and chiefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bellows operator moved sticks up and down to draw air into the nozzle and
    force it through a pipe into the furnace, maintaining a continuous blast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After preparations, the chief smith lit the fire at the bottom of the furnace
    through a blast-hole, and the blast was kept going until the ore was melted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The furnace fire was lit in the afternoon and kept burning into the night
    while charcoal was added through the top.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the ore melted, branches were used to break down the upper furnace,
    and the pit was covered with green branches and grass to extinguish the fire and
    cool the metal until morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next day the smelted iron was dug from the pit, heated in small fires,
    and cut into pieces suitable for making hoes or spears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An ordinary smith's fire was made in a shallow pit with a blast-pipe and bellows;
    the anvil was a large stone, hammers were iron, and green wood was used to hold
    hot iron.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: During smelting, workmen stayed away from their wives, had no intercourse
    with them, did not eat with others, and avoided contact with anyone outside the
    work group.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food for smelting workmen was brought by wives or children and placed near
    the temporary huts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a smith's son began to imitate his father's work, the father gave him
    metal to work; the son's first roughly fashioned implement was given to his mother,
    who stored it, and the father jumped over her to confirm the boy in the work.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Smelted iron was bought by villagers or other smiths and worked into hoes,
    knives, spears, needles, fish-hooks, bells, and axes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king and important chiefs had their own smiths, while smiths also sold
    wares in markets and worked in small grass-hut smithies with assistants to operate
    the bellows.
  category: relationship
  evidence_refs:
  - ev:7
