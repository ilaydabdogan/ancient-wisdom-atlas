canonical_text:
  quote: ''
  summary: 'The passage lists customs and beliefs concerning dogs and cats: puppy-litter
    practices, feeding a pregnant dog with white ants, a rite involving the name of
    a recently dead person to make puppies open their eyes, hospitality rules for
    a brother-in-law''s dog, a taboo around touching a dead dog because of its ghost,
    feeding hunting dogs after success, the vocalization of native dogs, and color-based
    domestication rules for cats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a female dog littered, the owner destroyed one puppy because he believed
    the remaining puppies would not thrive unless this was done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before puppies were born, the dog was fed white ants, which was believed to
    make the puppies grow strong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After puppies were born, it was believed they would not see until a friend
    of the owner came in and mentioned the name of a recently dead person; after this,
    the puppies would immediately open their eyes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a brother-in-law visited with his dog, the host's wife cooked special
    food for the dog.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the brother-in-law's visit, no family member was to strike the dog,
    because doing so was regarded as equivalent to striking the brother-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man's dog died in the house, his wife did not touch it because she feared
    its ghost and called her husband to remove it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Dogs were fed after hunting; when the hunt succeeded, they received entrails
    from killed animals and other meat scraps.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Native dogs were described as unable to bark and as making only a yelping
    howl.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Cats were little known; only black and white cats were domesticated, while
