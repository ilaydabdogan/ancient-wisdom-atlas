canonical_text:
  quote: ''
  summary: The passage describes Baganda canoe construction practices, including divination
    and offerings before felling a tree believed to be spirit-possessed, the making
    of dug-out canoes, use of fire to hollow wood, ferrying cattle in canoes, and
    the beginning of large-canoe construction with an extended keel used as a ram.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who wanted to cut a tree for a dug-out canoe or canoe boards asked a
    nearby medicine-man to consult an oracle about whether he might fell it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that timber was public property, while many people believed
    trees were possessed by spirits.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The spirits associated with trees were said to need propitiation by offerings
    such as a goat or fowl, beer, and possibly cowry-shells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cowry-shells were tied around the tree trunk, and beer was poured at the tree
    roots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the animal offering was killed, it was killed so that its blood ran to
    the tree roots; the meat was then cooked and eaten near the tree by the man who
    made the offering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In some cases a goat was kept alive and allowed to roam in the garden where
    the tree grew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Timber was used immediately after cutting and was not left to season.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For a dug-out canoe, workmen cut a log, shaped its outside and ends, flattened
    the upper part, and hollowed it out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fire was often used to burn and char the wood in order to make hollowing easier.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some dug-out canoes were large and flat-bottomed so that cattle could stand
    in them while being ferried over lake arms or rivers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Holes were cut through the upper sides of dug-out canoes so animals could
    be tied and prevented from jumping out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: For a large canoe, the first construction step was to fashion a keel from
    a long tree; the keel projected beyond the canoe as a ram for warfare.
  category: object
  evidence_refs:
  - ev:6
