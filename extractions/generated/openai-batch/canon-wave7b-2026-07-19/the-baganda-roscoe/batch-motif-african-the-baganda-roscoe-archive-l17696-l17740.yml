canonical_text:
  quote: ''
  summary: The passage describes a seed divination procedure in which representative
    seed heaps are covered overnight and interpreted by their movement, including
    for predicting a sick person's death or recovery. It then describes the Madudu
    poison ordeal administered by the priest Magimda, in which disputants drink a
    datura-derived drug and are judged by their ability to cross a plantain stem and
    reach the priest; fatal after-effects are viewed as the sentence of the god. A
    less popular heated iron or hoe-blade test called Mukasa's test is introduced
    at the end of the passage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two heaps of seeds are set up to represent a man intending mischief and the
    person against whom the wrong is intended; the medicine-man asks the gods for
    a right decision, covers the heaps with barkcloth, and leaves them until morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the top seed of the aggressor moves toward the victim and the victim's
    top seed has fled, this is read as a bad sign that the aggressor will succeed;
    if the aggressor's seed has fled before the victim, the designed evil will fail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a sick person's fate, a seed shooting into the pit foretells death, while
    a seed escaping the pit foretells recovery.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The principal ordeal is the poison test called Madudu, used when someone is
    dissatisfied with the King's decision or when it is impossible to decide which
    of two disputants is right.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The priest Magimda, attached to Kibuka's temple, administers the poison test
    using a drug made by boiling the fruit of the datura plant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the disputants drink the drug and sit until it takes effect, they are
    called to get up, step over a plantain stem, come to the priest, kneel, and thank
    him for settling the case.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If one disputant reaches the priest, the case is decided in his favour; if
    both fail, both are regarded as equally guilty; if both walk to the priest, both
    are regarded as innocent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The drug has an intoxicating effect and frequently fatal after-effects; death
    from the after-effects is regarded as the sentence of the god, and long illness
    may follow even when recovery occurs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A less popular test uses a heated piece of iron or the blade of a hoe and
    is called Mukasa's test; each disputant brings a bunch of grass.
  category: action
  evidence_refs:
  - ev:9
