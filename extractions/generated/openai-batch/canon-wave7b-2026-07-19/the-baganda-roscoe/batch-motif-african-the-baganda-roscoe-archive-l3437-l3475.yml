canonical_text:
  quote: ''
  summary: The passage describes a Baganda child ceremony that cannot be performed
    for a single child or for children of only one sex. Mothers bring children, preserved
    umbilical cords, and salt; clan authorities provide barkcloth seating. Husbands'
    mothers test each child's umbilical cord by placing it into a vessel containing
    beer, milk, and water, sometimes after touching it with oil and naming the child
    and clan forefathers. A floating cord is greeted with delight, while a sinking
    cord leads to disowning and an accusation of adultery. The cords are returned
    to the mothers, relatives feast, and the passage begins to describe an additional
    plantain rite practiced by some clans.
  language: English
  quote_policy: summarized
