canonical_text:
  quote: ''
  summary: 'The passage lists Baganda clans numbered 13 through 36 with their primary
    and second totems, notes several clans that have joined other clans and sometimes
    lost separate identity, and then describes Leopard Clan rules: a taboo on meat
    or cattle damaged by wild beasts, royal status and succession rules, titles for
    collateral and direct heirs, descent traditions for peasant princes, earlier royal
    killings to reduce possible danger to the throne, and exemption from enforced
    work for the King.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates clans 13 through 36, each named with a primary clan
    designation and usually a second totem; several second totems are listed as unknown.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: The Katinvuma clan is described as named from a small shrub seed originally
    used for beads, and its second totem is all kinds of beads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Dog clan's second totem is an iron bell used to fasten on a dog when hunting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Six clans are said to have joined named other clans: Katinvuma, Bushbuck,
    Dog, Jackal, Rain Water, and Crow.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some of the clans that joined others became incorporated in those clans and
    lost their separate identity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Members of the Leopard Clan were not permitted to eat meat torn or scratched
    by a wild beast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a cow belonging to a Leopard Clan member had been torn by a wild beast,
    it had to be sold and could not remain with the herd.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Leopard Clan is described as a royal clan with many branches, but only
    one branch is said to have members eligible for the throne, and the reigning sovereign
    belonged to that branch.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The King's brothers were eligible for the throne if the reigning monarch's
    sons were too young to succeed him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: When a son became old enough to govern, he became heir to the throne.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After a son became heir, the King's brothers were called Peasant princes,
    while direct-line heirs were called Princes of the royal drums.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The oldest family of Peasant princes traced descent to Keya, who was said
    to be one of King Kintu's sons.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Former kings periodically sent to estates of Peasant princes to capture and
    put to death many men, lest the clan become too numerous and dangerous to the
    throne.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Leopard Clan had always been exempt from enforced work for the King; the
    supplied excerpt ends before fully stating its only official duty.
  category: attribute
  evidence_refs:
  - ev:12
