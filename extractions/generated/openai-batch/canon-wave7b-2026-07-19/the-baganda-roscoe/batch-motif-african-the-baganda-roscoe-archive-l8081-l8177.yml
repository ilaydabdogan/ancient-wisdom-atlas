canonical_text:
  quote: "“His sons therefore refused to eat yams, and these became the totem of the
    clan.”"
  summary: 'The passage gives a Yam Clan totem-origin story in which Sedumi steals
    yams from his wife’s relatives, is exposed through his goat-skin wrapper, and
    hangs himself from shame; his sons then refuse yams, which become the clan totem.
    It then lists Yam Clan royal duties involving accession, mourning, scapegoat shooting,
    regalia, burial tools, jawbone treatment, shrines, sacred buffaloes, and temple
    paddles. The passage next begins a Bean Clan account: Wakaibu is said to have
    been found by Kintu in Busiro, and Nakiza of the Bean Clan is killed by Banyoro
    after a bean runner trips him; his blood forms the river Nakiza.'
  language: English
