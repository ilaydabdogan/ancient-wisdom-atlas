  quote: ''
  summary: The passage describes medicine-men as skilled and cunning specialists who
    diagnosed illness, treated the sick, dealt with ghost-caused sickness, performed
    surgery, exorcised ghosts from houses and possessed persons, made and sold fetiches
    and amulets, compounded drugs, and made magical objects. They were considered
    essential, feared, and respected even by priests and mediums.
