canonical_text:
  quote: ''
  summary: The passage describes sandal-making and basketry among the Baganda. It
    says sandals were introduced by King Kimbugwe, made from animal hides with straps,
    toe-loops, and dyed patterns, and supplied to the king and chiefs by leather-workers.
    It also describes official antelope-skin mantles worn by gatekeepers. The passage
    then lists three kinds of baskets and gives a detailed account of the kibo food
    basket, commonly made by women from plantain fruit-stem fibres using coiling and
    stitching techniques.
  language: English
  quote_policy: summarized
