canonical_text:
  quote: ''
  summary: Mpobe, a skilled hunter of the edible rat, joins Omuzizi for a hunt. A
    rat flees from the net, and Mpobe follows his dogs after it into a large hole.
    Following the bells on the dogs, he reaches a place with people, gardens, and
    houses. He eventually finds the dogs and rat near an important-looking person
    identified as Death. Death questions Mpobe about his origin and what he has seen,
    then tells him to return home and warns him not to tell anyone where he has been;
    the excerpt breaks off before the warning is completed.
  language: English
  quote_policy: summarized
