canonical_text:
  quote: ''
  summary: The passage describes royal accession-related rites involving a feast,
    a ritual whip connected with Nankere's murdered son, payment of cowry-shells to
    the goddess Namulondo to avert sickness and death, and a Busemba drum rite in
    which a person who retrieves a deliberately left drum is killed and his arm-bones
    become drum-sticks. The passage explains the drum rite through a story of King
    Tembo, Kimera's haunting ghost, and the appeasement of that ghost by a drum beaten
    with human bones. It also describes the priest Mutebi displaying decorated arm-bones
    before the King. The passage then begins a list of kings, naming Kintu as the
    first king, said to descend from the gods, to have married Nambi, who was given
    to him by the god Gulu, and to have disappeared in old age; it gives details of
    his secret burial, the removal and temple placement of his jawbone, restrictions
    around his grave and temple area, and fear of the ghosts of Kintu and his son.
    It adds that Kintu's son Cwa also disappeared in old age.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King customarily gave a feast to commemorate his accession, and after
    the Nankere ceremony the feast was held on a larger scale than previous ones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the accession feast, Mutebi carried under his mantle a whip made from
    the skin of Nankere's murdered son.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person struck by the whip had to pay nine or ninety cowry-shells, according
    to ability, to the goddess Namulondo to prevent sickness and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the struck person paid the cowry-shells to Mutebi, Mutebi struck him
    on the shoulder with his hand to remove the curse laid by the whip, a curse said
    to deprive generative powers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the end of the feast, all drums except Busemba were removed; Busemba was
    left as if forgotten.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who noticed and brought the left drum after the drummers was caught
    and killed, and bones from his upper arm were made into drum-sticks for Busemba.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The custom was explained by a story in which King Tembo killed Kimera in the
    forest, Kimera's ghost haunted the King and sought vengeance, and Tembo made a
    drum whose beaters were to be human bones; when the bones were provided, Kimera's
    ghost was quieted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The ceremony of leaving the drum behind and slaying the man who fetched it
    was called the remembrance of Busemba.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Busemba was brought out only once during a king's reign and was kept covered
    until the next king's reign.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mutebi sometimes entered the King's presence in a cow-hide mantle, concealed
    the arm-bones of the man killed for Busemba, produced and shook them before the
    King, then hid and restored them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The arm-bones were decorated with cowry-shells and small bells that sounded
    when shaken.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kintu is named as the first King of Uganda, and many legends are said to gather
    around him because he was supposed to be descended from the gods.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Kintu married Nambi of the Colobus Monkey Clan; tradition says Gulu gave her
    to Kintu out of compassion after Kintu had lived alone for some time.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Tradition says Kintu went into the forest and disappeared as an old man; because
    saying the King was dead was unlawful, the chiefs said he had disappeared.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: 'Kintu''s burial was secret: a pit was dug behind the house enclosure, his
    cow-hide-wrapped body was placed in it, thorns were put around and over it, and
    no earth was thrown in.'
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: A medicine-man visited Kintu's grave until he could remove the jawbone; after
    cleansing and decorating it, he placed it in a temple on Magongo hill in Singo.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: People were prevented from walking near Kintu's grave, and only members of
    the Lion Clan could approach the place.
  category: setting
  evidence_refs:
  - ev:17
- id: obs:18
  text: In the garden Nono, where Kintu's temple stands, no animal or fowl may be
    killed; animals to be killed are taken to Daja and the meat is brought back for
    cooking.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: At Daja, only a priest who died in office or the owner of the hill might be
    buried; a man who committed adultery there left for a year, fearing death from
    the anger of the ghosts of Kintu and his son.
  category: setting
  evidence_refs:
  - ev:19
- id: obs:20
  text: Cwa, Kintu's son and successor, is reported to have been lost in old age in
    the plains of Davula.
  category: action
  evidence_refs:
  - ev:20
