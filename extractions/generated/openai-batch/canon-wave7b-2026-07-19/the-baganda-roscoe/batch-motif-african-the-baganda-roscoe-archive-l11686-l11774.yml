candidate_motifs:
- id: motif:1
  label: royal accession rite with dangerous sacred object
  taxonomy_refs:
  - royal_legitimacy
  basis: The accession feast includes a priestly whip linked to a murdered son, cowry
    payments to a goddess, curse-removal, and later Busemba drum rites tied to the
    king's reign.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage describes ritual practice more than an explicit mythic charter;
    the royal-legitimacy classification is inferred from accession context.
- id: motif:2
  label: human victim for royal drum
  taxonomy_refs:
  - sacrifice
  basis: The person who retrieves Busemba is killed, and his upper arm-bones are made
    into drum-sticks for the drum used in a king's reign.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not use the word sacrifice for the Busemba victim, so
    the motif label is based on the described ritual killing and use of body parts.
- id: motif:3
  label: appeasement of an avenging ghost through human bones
  taxonomy_refs:
  - sacrifice
  basis: King Tembo makes a drum whose sticks are human bones to quiet the ghost of
    Kimera, who haunted him and sought vengeance after being killed.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The act is explicitly appeasement of a ghost; the sacrifice taxonomy is
    approximate because the passage frames it as providing bones rather than naming
    sacrificial offering.
- id: motif:4
  label: protective payment to deity after ritual curse
  taxonomy_refs:
  - sacred_exchange
  basis: Those struck by the whip must pay cowry-shells to Namulondo to avert sickness
    and death, and Mutebi's gesture removes the curse associated with loss of generative
    powers.
  evidence_refs:
