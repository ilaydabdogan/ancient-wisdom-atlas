- id: ev:3
  type: summary
  locator: lines 11698-11702
  quote_or_summary: Anyone struck by the whip had to pay nine or ninety cowry-shells
    to the goddess Namulondo to prevent sickness and death.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 11702-11707
  quote_or_summary: When payment was made to Mutebi, he struck the person on the shoulder
    with his hand to remove the whip's curse, which deprived generative powers.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 11707-11711
  quote_or_summary: At the end of the feast, the drum keepers removed all drums except
    Busemba, leaving it as though forgotten.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 11711-11716
  quote_or_summary: A person who noticed and brought the drum after the drummers was
    caught and killed; bones from his upper arm were made into drum-sticks for Busemba.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 11716-11724
  quote_or_summary: 'The custom is traced to a story: King Tembo killed Kimera in
    the forest; Kimera''s ghost haunted Tembo and sought vengeance; Tembo made a drum
    requiring human-bone sticks, and when the bones were provided the ghost was quieted.'
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: quote
  locator: lines 11724-11727
  quote_or_summary: The rite was called "The remembrance of Busemba."
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; short quotation.
- id: ev:9
  type: summary
  locator: lines 11727-11730
  quote_or_summary: Busemba was brought out only once in a king's reign and kept covered
    until the next king's reign.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 11730-11740
  quote_or_summary: Mutebi sometimes entered the King's presence in a cow-hide mantle,
    concealing the arm-bones of the man killed for Busemba; he quickly showed and
    shook the bones before hiding and restoring them.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 11740-11742
  quote_or_summary: The bones were decorated with cowry-shells and small bells that
    sounded when shaken.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 11744-11747
  quote_or_summary: Kintu is said to have been the first King of Uganda; legends gather
    around him because he was supposed to be descended from the gods.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 11747-11752
  quote_or_summary: Kintu married Nambi of the Colobus Monkey Clan; tradition says
    Gulu gave her to him out of compassion after he had lived alone.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 11752-11756
  quote_or_summary: In old age Kintu went into the forest and disappeared; since it
    was unlawful to say the King was dead, the chiefs said he had disappeared.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 11756-11762
  quote_or_summary: 'Kintu''s burial was secret: a pit was dug behind the house enclosure,
    his body was wrapped in cow-hide and placed in it, and thorns were set around
    and over the body without throwing earth into the pit.'
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 11762-11768
  quote_or_summary: A medicine-man visited the grave until he removed the jawbone;
    after cleansing and decorating it, he placed it in a temple on Magongo hill in
    Singo.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 11768-11771
  quote_or_summary: Rain gradually filled Kintu's grave, people were kept from walking
    near it, and only Lion Clan members might approach.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 11771-11776
  quote_or_summary: In the garden Nono where the temple stands, no animal or fowl
    may be killed; animals are taken to Daja to be killed, then the meat is brought
    back for cooking.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 11776-11784
  quote_or_summary: At Daja, burial is limited to a priest dying in office or the
    hill's owner; a man committing adultery there leaves for a year, fearing death
    from the anger of the ghosts of Kintu and his son.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 11784-11788
  quote_or_summary: Cwa, Kintu's son and successor, is reported to have been lost
    as an old man in the plains of Davula northwest of the country.
  source_text_path: texts/public-domain/ganda/project-gutenberg/the-baganda-roscoe.md
  rights_note: Public domain source; summarized.
