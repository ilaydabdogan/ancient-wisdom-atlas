  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A man entering for adultery went armed and was ready to strike if disturbed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Women enabled men to enter inner enclosures by enlarging water gutters under
