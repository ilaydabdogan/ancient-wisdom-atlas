canonical_text:
  quote: ''
  summary: The passage describes girls called kaja buzvonga who were dedicated to
    a god from birth and served the King or important chiefs in taboo-related attendance,
    tending fire, bringing water, supplying butter or medicine, handling protective
    fetiches, and accompanying war departures briefly. It also describes household
    sleeping arrangements, clandestine sexual meetings in chiefly enclosures, methods
    of crossing fences secretly, and responses to theft including divination, traps,
    and corporal punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King and each important chief had a girl in personal attendance where
    restrictions and taboos were observed; the girl was called kaja buzvonga and lived
    in her master's house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl's birth had been predicted by a priest, and she was dedicated to
    some god from birth before being given to a chief when old enough for the office.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Her duties included tending the fire in the evening and night, bringing water
    for the chief's early morning face-washing, bringing butter or medicine for body-smearing,
    and handing him fetiches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The principal wife had charge of the fetiches, and the kaja girl obtained
    them from her before handing them to the chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the chief went on a war expedition, the kaja girl accompanied him for
    a short distance, carrying his fetiches in front of him for protection, and then
    restored them to the principal wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: No boy was permitted to play with or touch the kaja girl because she was described
    as a consecrated person.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the kaja girl reached puberty, the god to whom she was dedicated ordered
    her marriage, another kaja girl from the clan replaced her, and the King or chiefs
    often took such girls as wives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The clan from which the kaja girl came profited by receiving presents and
    other favors from the King or chiefs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In homes where several women lived together, beds were placed at the side
    of the house and barkcloth was draped around that part for privacy.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Girls and boys slept on the floor near the fire and went off to play after
    waking.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says adults spoke openly before children about delicate matters,
    so children learned things the author says they should not yet have heard.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: If an unmarried woman became pregnant, a fine would be imposed and the man
    would be asked whether he wished to marry her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In enclosures of important chiefs, many women were called wives, and adultery
    was framed as using a woman set apart for another man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A husband who caught a man with his wife had the stated right to put one or
    both to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Women arranged clandestine meetings by admitting and hiding men in houses
