literal_observations:
- id: obs:1
  text: The canoe bottom had lashed sticks forming a floor so leaked water could run
    to the centre, where a paddler baled it out with a shallow wooden dish.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The canoe stitchings and seams were caulked with tow made from tree fibre
    and rammed down with a knife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Paddles were made of light wood with heart-shaped blades; the boatmen pulled
    the canoe by spooning the water and jerking the paddle at the end of the stroke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man in the stern guided the canoe by paddling on either side or holding
    the paddle in the water at an angle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Named canoe parts included the keel called Mugongo, glossed as the back, and
    the part from the centre to the bows called Mutwe, glossed as the head.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The number of paddlers varied from twenty-four to thirty according to canoe
    size.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A bow stretcher passed through the canoe sides, protruded and was pointed
    like a horn; these ends were used for drawing the canoe to land.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A well-finished canoe could have a cord decorated with shredded papyrus fringe,
    and its outside was painted with red clay mixed with oil or beer.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In rough lake conditions, paddlers ran in the trough of the sea rather than
    keeping the canoe head to the waves, and storms could swamp canoes and endanger
    lives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a canoe was ready for launching, the owner brought a goat, or a fowl
    if he could not afford a goat, and a hut was built as a shrine for the canoe spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The animal was killed over the canoe so that some blood ran into it; beer
    was added to the blood, and the remaining blood and beer were poured beside the
    shrine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A barkcloth was laid inside the canoe for the spirit's use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The builders ate the animal's meat and drank beer near the shrine, then tested
    whether the canoe balanced and rode the waves well.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: If the canoe was for fishing, the fisherman killed one of the first fish caught
    and let its blood run into the canoe to consecrate it for fishing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Cooked food and uncooked plantains were often placed in a new canoe when it
    was about to be launched.
  category: action
  evidence_refs:
  - ev:9
