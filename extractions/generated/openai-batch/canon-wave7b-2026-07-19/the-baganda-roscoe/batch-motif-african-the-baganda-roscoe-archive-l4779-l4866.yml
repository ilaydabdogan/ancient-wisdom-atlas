canonical_text:
  quote: ''
  summary: 'The passage describes Baganda marriage customs: a new wife performs digging
    for her mother-in-law as a test of acceptance; a woman who dislikes her husband
    may return to her relations and be fetched back with gifts; kings or chiefs may
    give wives as rewards; shaving the woman''s head after presentation to her kin
    makes such a woman a legitimate wife; desirable qualities in wives are listed;
    and brides receive domestic tools and may be rewarded for diligent work.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new wife is taken to the bridegroom's mother, given a hoe, and sent at dawn
    to dig in the mother-in-law's garden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the mother-in-law dislikes the bride, she may leave her digging until evening;
    the bride may then return to her own people and demand divorce, saying the mother-in-law
    ruined the marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the mother-in-law is pleased, she soon calls the bride from digging, gives
    her food, a feast, a present, and cowry-shells through the messenger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband gives the wife a garden of her own, and she settles into full
    wifely duties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband provides the hoe, while his mother ties on the blade and places
    herbs between the iron blade and handle to make the digging more efficacious.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman who dislikes her husband may escape to her own relations without his
    knowledge; the husband must explain his conduct before she returns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a husband asks a wife to return from her relations after a visit, he
    customarily gives beer or a goat to the relations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The King may give a wife to a chief or peasant as reward for service; such
    a woman ranks as a slave though she cannot be sold by the husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a man receives such a woman, he takes her with a goat and beer to her
