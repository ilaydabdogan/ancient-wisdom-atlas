canonical_text:
  quote: ''
  summary: The passage describes a hot-iron ordeal for determining guilt; royal rites
    in which human and animal scapegoats are sent toward Bunyoro or enemy borders
    to carry away disease, plague, or military pollution; the use of herbs to transfer
    evil to victims; and a partial description of sickness being transferred from
    a person to an animal under divine oracle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest tests guilt by passing hot iron over grass bunches or down the legs
    of disputants; the person whose grass or body is burned is considered guilty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods sometimes warn the King that the Banyoro are working magic intended
    to bring disease upon the country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: To avert pestilence, the King sends a scapegoat called Kyonzire to the Bunyoro
    frontier.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The offering may include a man and boy or a woman and child selected because
    of a mark or defect noted by the gods, together with a cow, goat, fowl, and dog.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The victims are escorted into the named country, have their limbs broken,
    and are left to die so that they cannot return to Uganda.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The disease or plague is thought to have been transferred to the victims and
    returned to the country from which it came.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a punitive expedition, the gods may advise sending back a scapegoat
    because evil has attached itself to the army.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A female slave and animals from the captives may be sent to the border, maimed,
    and left to die; afterward the army is pronounced clean and may return to the
    capital.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bunch of herbs is rubbed over people and cattle and then tied to the victims,
    who are thereby said to carry the evil back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In some sickness cases, illness is transferred from a person to an animal;
    for the King or a chief, a god gives an oracle specifying a kind of cow, and a
    medicine-man begins the transfer with herbs.
  category: action
  evidence_refs:
  - ev:6
