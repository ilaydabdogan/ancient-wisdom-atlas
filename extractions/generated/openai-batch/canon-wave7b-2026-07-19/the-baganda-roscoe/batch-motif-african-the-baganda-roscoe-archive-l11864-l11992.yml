canonical_text:
  quote: ''
  summary: 'The passage recounts a sequence of Baganda kings and succession episodes:
    an unnamed aged king, Kaima, Nakibinge, Mulondo, Jemba, Suna I, Sekamanya, and
    Kimbugwe. It describes rejected or contested succession, wars, consultation with
    ritual specialists and the forefather Kintu, the summoning of Kibuka, royal deaths,
    recovery of a lost royal body by means of a spear, royal burials and temples,
    regency for a child king, a first recorded royal stool, embalming, treatment of
    royal wives, attachment to a royal mother, twin birth ceremonies, discarded ritual
    objects, fetiches, and Kimbugwe’s death after an insect said to be sent by Katerega’s
    fetich alights on him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed earlier king is described as reaching extreme old age, becoming
    unable to understand speech, and being tricked and robbed by his wives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unnamed earlier king was buried at Manja, had a temple built at Damba,
    and had a medium who, when possessed, acted like an old man with saliva running
    down his chin and beard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kaima came to the throne after the people refused his father Wampamba because
    Wampamba had married a woman of his mother’s clan; Kaima later went to war in
    Budo, was defeated, died on the return journey, and received a burial place and
    temple.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nakibinge was chosen to succeed Kaima, but Juma Kyabainza demanded the throne,
    causing Nakibinge to postpone mourning ceremonies and fight for his rule; Nakibinge
    was first routed to Bulungugi Island and later drove Juma into Bunyoro.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A medicine-man advised Nakibinge to consult his forefather Kintu at Magongo;
    Kintu directed him to send for Kibuka from the Islands of the Lake, and Kibuka
    came to fight against the Banyoro before both Kibuka and Nakibinge were killed
    in battle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Years after Nakibinge’s death, a peasant found a spear recognized as the late
    king’s; after explaining how he found it, he led people to the place where the
    king’s body was discovered in a pit and then removed for a temple on Kongo hill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mulondo was chosen king while still a child, guarded by his subjects, governed
    for by the Katikiro as regent, and given a stool so he could be seen in court;
    this stool is presented as the first recorded in the country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mulondo was buried on Gombe hill, had a temple built on Mitwebiri, and is
    described as the first king whose body was properly embalmed, placed in a house,
    and left there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jemba was crowned after Mulondo and first ordered that the king’s wives who
    had borne children should, at death, be buried in the king’s private estate in
    Busiro; Jemba was later buried on Gombe hill and had a temple on Mubango hill.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Suna I became king after Jemba, lived to a great age, was buried on Gombe
    hill, and had a temple built on Jimbo hill.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sekamanya became king after Suna, was attached to his mother, did not allow
    her to retire from court according to custom, and later was buried at Gombe with
    a temple on Kongoje hill.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: After Kimbugwe became king, Prince Katerega came to conduct twin birth ceremonies
    but brought another wife instead of the twins’ lame mother; Kimbugwe questioned
    this, Katerega became angry, refused to complete the ceremonies, threw the ceremonial
    objects into a swamp, consulted a medicine-man, obtained fetiches, and made war
    on Kimbugwe.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: During the battle involving Kimbugwe and Katerega, an insect said to have
    been sent by Katerega’s fetich alighted on Kimbugwe; the king fell down and died.
  category: action
  evidence_refs:
  - ev:12
