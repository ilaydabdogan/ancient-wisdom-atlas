candidate_motifs:
- id: motif:1
  label: Royal succession constrained or contested by kinship and prior claims
  taxonomy_refs:
  - royal_legitimacy
  basis: Wampamba is refused as ruler because of a marriage to a woman of his mother’s
    clan, and Juma Kyabainza later demands Nakibinge’s throne based on an alleged
    agreement between their fathers.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports succession disputes and eligibility reasons but does
    not give a full legal or ritual theory of kingship.
- id: motif:2
  label: Repeated royal burial and temple establishment
  taxonomy_refs:
  - royal_legitimacy
  basis: Multiple kings are assigned named burial places and temples after death,
    forming a repeated mortuary pattern in the king list.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage lists burial and temple sites but gives limited explanation
    of temple ritual functions.
- id: motif:3
  label: Ritual or ancestral counsel for warfare
  taxonomy_refs:
  - wisdom
  basis: Nakibinge receives advice from a medicine-man, consults his forefather Kintu,
    and follows Kintu’s instruction to summon Kibuka for military aid.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage frames the counsel
    as practical war advice rather than a generalized wisdom teaching.
- id: motif:4
  label: Summoned battle helper from lake islands
  taxonomy_refs: []
  basis: Kibuka is summoned from the Islands of the Lake to aid Nakibinge against
    the Banyoro and is killed in battle along with the king.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No broader comparative taxonomy is assigned from the available list.
- id: motif:5
  label: Royal weapon as recognition token leading to hidden body
  taxonomy_refs: []
  basis: A peasant’s discovery of a spear recognized as Nakibinge’s leads to the discovery
    of the king’s body in a pit and its removal for temple establishment.
  evidence_refs:
  - ev:5
