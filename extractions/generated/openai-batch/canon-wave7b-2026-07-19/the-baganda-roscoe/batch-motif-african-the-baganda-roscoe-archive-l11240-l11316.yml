canonical_text:
  quote: ''
  summary: 'The passage describes royal settlement after a king enters his enclosure:
    separate residences for the Queen and the King''s Mother divided from the King''s
    by running water; a confirming sham combat with Kasuju; a levee of chiefs; disposition
    of the late King''s widows; wife-gifts and public acknowledgment by the Mugema;
    offerings to deities including Budo; an etiological note about the sacred well
    Nansove; and a gatekeeper toll at first entry.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred fire called Gom Bololo is identified by the entrance of the royal
    enclosure and kept in a hut during the day; the excerpt also refers to death as
    the consequence if the fire were allowed to go out.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the royal enclosure was ready, the King took possession of it with his
    wives, while the Queen had a separate residence about a mile away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A stream of running water had to divide the Queen's court from the King's
    because the Queen was said to be a king with her own independent establishment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King's Mother also lived at a distance from the King because she was called
    a king, and her residence was separated from the King's by running water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Straight roads connected the King's enclosure with the Queen's and the King's
    Mother's enclosures, and houses of important chiefs lined the roads so that people
    could travel safely between them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the morning after the King entered his enclosure, Kasuju came and performed
    a sham fight with him; both used shield and spear, and each speared the other's
    shield.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sham fight was done to confirm the King in his kingdom and to show that
    the princes had settled quietly with no fear of rebellion; if rebellion seemed
    likely, Kasuju did not come.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two or three days after Kasuju's visit, the Katikiro summoned chiefs, presented
    them at a levee in the new court, and the chiefs thanked, congratulated, and wished
    long life to the King.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The widows of the late King were allocated: younger childless widows entered
    the new King''s harem, others went to the late King''s temple, and some were sent
    to his tomb.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Mugema presented the King with a girl to be his wife and made a speech
    saying that the people acknowledged the King's right to the throne and his power
    to maintain it; after this, other chiefs could present women to the King.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The King sent presents to important deities and returned the royal spear Kanuna
    to Budo with offerings of nine women, nine cows, nine goats, nine loads of cowry-shells,
    nine loads of barkcloths, and a widow to be wife of the god Budo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The widow sent to Budo received the title Nakato, the name of Budo's first
    wife, whose childbirth caused the sacred well Nansove to spring forth on Budo
    hill.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: When chiefs first entered the royal enclosure, gatekeepers could detain one
    chief, require him to redeem himself, and take toll.
  category: action
  evidence_refs:
  - ev:8
