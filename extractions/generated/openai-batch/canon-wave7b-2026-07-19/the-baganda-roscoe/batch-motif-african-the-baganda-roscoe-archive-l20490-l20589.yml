  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Two drum types are distinguished: one for ordinary purposes and one for dances
    or musical use.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dance or musical drum was long, had one skin-covered end and one open
    end, and frequently used water-lizard skin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The long drum was made from a felled tree section hollowed with a long-handled
