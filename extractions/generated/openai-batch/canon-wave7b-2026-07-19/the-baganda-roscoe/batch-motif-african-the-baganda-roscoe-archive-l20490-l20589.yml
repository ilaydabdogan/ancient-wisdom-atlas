  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The skin of the long drum was wetted, stretched, pegged, and left to dry taut;
    dance drums were engraved with geometrical designs, oiled, and kept greased with
    butter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A leaf of the Iwawo tree was used as a substitute for sandpaper because its
    upper surface had short, strong spikes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The other kind of drum was hollowed from logs, ranged from a small twin-birth
    drum to a very large drum, was smeared with cow-dung to prevent cracking, and
    had skins laced with twisted hide thongs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Almost all drums had a fetich inside, and only a few men knew how to make
    the fetiches.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bedsteads and stools were not much used before the early days of Mutesa; before
    his reign, a grass-covered dais served as a bed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: During Mutesa's reign women were not allowed to sit on raised seats such as
    stools, and a woman doing so could incur her husband's displeasure or possibly
    be put to death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man was not permitted to sit on a woman's bedstead, and a man found sitting
