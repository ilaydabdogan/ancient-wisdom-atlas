- id: motif:2
  label: Claimed divine warning prevents execution and redirects punishment
  taxonomy_refs: []
  basis: Mulegeya claims a god instructed Wunyi not to kill the offending wife, but
    to banish her and expose the child.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage frames Mulegeya’s message as a stratagem and a claim, not
    as verified divine speech.
