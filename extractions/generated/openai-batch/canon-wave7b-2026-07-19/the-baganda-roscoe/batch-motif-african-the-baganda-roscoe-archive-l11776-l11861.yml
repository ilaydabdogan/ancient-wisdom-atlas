canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the reigns of Kimera, Tembo, Kigala,
    and Kiimba: Kimera is born after adultery, exposed in a clay pit, rescued and
    fostered, then crowned; he is later killed by his grandson Tembo during a hunt.
    Tembo’s children Kigala and Nakibanja marry and produce twins, with rivers springing
    forth at the places of labor and birth. Tembo’s insanity is relieved through human
    sacrifice and sinew anklets, said to originate prolongation-of-life ceremonies.
    Later, a rebel dies after fleeing into a garden containing a fetish, and royal
    burials and jawbone temples are noted.'
  language: English
  quote_policy: summarized
