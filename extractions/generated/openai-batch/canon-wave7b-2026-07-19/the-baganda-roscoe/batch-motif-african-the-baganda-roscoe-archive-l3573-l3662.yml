canonical_text:
  quote: ''
  summary: 'Ethnographic account of Baganda twin-birth ceremonies: twin birth is associated
    with Mukasa''s favour or anger, requires taboos and specialist advice, involves
    ritual treatment of afterbirths and cords, marks the parents as sacred, restructures
    household access and separation, uses continual drums and abstentions, interprets
    the sex of twins in relation to clans, and appoints ritual kin figures before
    grandparents may visit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that twin birth required care and taboos to retain Mukasa's
    favour, and that parental mistakes or sickness of the twins were viewed as the
    god's anger, possibly affecting the clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The midwife did not announce the birth by saying the tabooed word for twins,
    but used an indirect expression, after which the father informed the medicine-man
    who had treated his wife before the birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: If twins were born outside, they could not be brought into the house until
    the medicine-man had been consulted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The afterbirths were placed in new cooking pots near the fireplace, covered
    with plantain leaves, and kept there until after the children were named.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The umbilical cords were cut according to the children's sexes on either an
    axe handle or a hoe handle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The parents' persons were treated as sacred; the father was called Salongo
    and wore two barkcloths and ankle bells, while the mother was called Nalongo and
    wore a creeper band and ankle bells.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A nearby friend was appointed as Mutaka; he barred the normal doorway, cut
    two back openings, and helped divide the house and outside enclosure into separate
    spaces for the mother with children and for the husband.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Separate drums for the mother and father were beaten continually by day and
    night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the twin ceremonies, the husband and wife let their hair and nails
    grow, had plantains cooked in their skins, and were not allowed to see blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The parents preferred twins of one male and one female child; twins of the
    same sex were interpreted as Mukasa favouring one clan over the other, and the
    neglected clan made offerings to regain favour.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the third day, the father of twins informed his own father without entering
    the house or seeing him, using a knife to indicate a boy and a plantain-fibre
    ring to indicate a girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The paternal side selected a young boy to act as great father and a girl to
    act as queen; the wife's parents later supplied a girl to be great mother and
    another girl to be queen.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The boy acting as great father had to be a young paternal relative and took
    on responsibility for continence while caring for the mother and twins.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Grandparents on both sides could not visit the twins until the birth ceremonies
    were completed.
  category: sequence
  evidence_refs:
  - ev:8
