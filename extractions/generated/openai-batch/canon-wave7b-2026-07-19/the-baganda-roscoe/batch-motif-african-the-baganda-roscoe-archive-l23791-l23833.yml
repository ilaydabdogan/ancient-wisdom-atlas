canonical_text:
  quote: ''
  summary: A king gives Walukaga, chief of his smiths, iron and commands him to make
    a living man who can walk, talk, and has blood and brains. Walukaga seeks advice
    without success. He meets a former friend who is now mad and tells him the problem.
    The madman advises Walukaga to tell the king to make the people shave their heads
    and burn the hair into a thousand loads of charcoal, and to gather one hundred
    pots of water from the people's tears to slake the forging fire. Walukaga returns
    to the king and begins repeating this demand.
  language: English
  quote_policy: summarized
