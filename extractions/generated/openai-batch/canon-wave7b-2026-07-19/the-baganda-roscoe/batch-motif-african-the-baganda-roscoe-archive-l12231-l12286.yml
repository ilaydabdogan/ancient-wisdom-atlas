  quote: ''
  summary: The passage recounts Namugala’s brief kingship and abdication to Kyabagu,
    Kyabagu’s execution of Mutamanyangamba and subsequent haunting by the chief’s
    ghost, conflict with medicine-men and priests, Mukasa’s rat plague after temple
    destruction, restitution and temple rebuilding, a failed attempt to transfer Ugandan
    earth into Busoga to join kingdoms, and the beginning of a conflict between Kyabagu
    and his son Sekafuwa after cattle damaged Sekafuwa’s garden and Kyabagu killed
    Sekafuwa’s mother.
