  summary: The passage describes administrative practices in which children and labor
    are obtained through District-Chiefs, labor is organized for repairing buildings
    in the royal enclosure, chiefs use sub-chiefs and clan networks, women are described
    as wealth and providers of food, and freemen exchange work or military service
    for tenancy on a chief's land while peasants avoid the capital when possible.
