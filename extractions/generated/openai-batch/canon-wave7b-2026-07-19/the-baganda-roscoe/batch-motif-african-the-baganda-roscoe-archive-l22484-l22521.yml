canonical_text:
  quote: ''
  summary: 'The passage describes Baganda markets and bartering: bride-payment customs
    are presented as encouraging trade; markets are supervised and taxed by authorities;
    evasion of market dues is punished; many foodstuffs, animals, tools, and other
    goods are sold; vendors sit under sheds, portion goods, and sell small packets
    for cowry-shells.'
  language: English
  quote_policy: summarized
