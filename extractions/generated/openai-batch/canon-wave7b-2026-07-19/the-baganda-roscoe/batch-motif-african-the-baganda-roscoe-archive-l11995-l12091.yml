  text: Kimbugwe's body was not buried, was left in the house outside which he died,
    and no temple was built for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Katerega succeeded Kimbugwe as king, was buried at Gombe, and had a temple
    built on Mitwebiri hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mutebi succeeded Katerega; two principal chiefs rebelled, were removed from
    office, and were killed; Mutebi was buried at Gombe and had a temple built on
    Kingoja hill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Juko rebuked a medicine-man for giving an amulet to a little prince, angering
    the medicine-man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The medicine-man avenged himself by commanding the sun to fall; darkness lasted
    until the god Wanga came from Sese Island and restored the sun to its place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kayemba took a woman as wife contrary to priestly advice, and a child was
    born without arms or legs; the child was said to be the incarnation of Kaumpule,
    the plague god.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Priests advised Kayemba to build a temple for Kaumpule in Bulemezi; the king
    was warned not to look toward it on pain of death, later neglected the restriction,
    and died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tebandeka's children initially died in infancy; a priest said this was due
    to neglect of the Twin of Tebandeka's father, and after the Twin was decorated
    and returned to the temple, later children grew up healthy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After priests demanded large payments, Tebandeka ordered the gods' temples
    to be robbed and burned down, then fled into the forest and hid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Tebandeka was brought back, he was found to be possessed by Mukasa's
    spirit and able to give oracles; after a test confirmed Mukasa rather than a ghost,
    the people built him a new enclosure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ndaula stipulated that he would not be made Mukasa's medium; Juma, a son of
    Tebandeka, was appointed priest and received his father's fetiches, establishing
    a continuing priestly succession from Juma's descendants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ndaula suffered eye inflammation; a medicine-man offered a cure on conditions
