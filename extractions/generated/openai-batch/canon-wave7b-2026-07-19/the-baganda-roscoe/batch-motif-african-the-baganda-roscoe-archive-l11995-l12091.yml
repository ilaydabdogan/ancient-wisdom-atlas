canonical_text:
  quote: ''
  summary: 'The passage lists Baganda kings and events associated with their reigns:
    succession, burial and temple-building; Juko''s conflict with a medicine-man who
    causes darkness until Wanga restores the sun; Kayemba''s prohibited marriage and
    a child identified with the plague god Kaumpule; a forbidden sight taboo leading
    to Juko''s death; Tebandeka''s restoration of his father''s Twin, destruction
    of temples, forest hiding, and possession by Mukasa; and Ndaula''s refusal of
    Mukasa mediumship plus a medicine-man''s conditional cure.'
  language: English
  quote_policy: summarized
literal_observations:
