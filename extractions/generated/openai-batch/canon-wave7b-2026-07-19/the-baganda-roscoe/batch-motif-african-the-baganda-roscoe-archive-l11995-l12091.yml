candidate_motifs:
- id: motif:1
  label: Royal succession marked by burial and temple-building
  taxonomy_refs:
  - royal_legitimacy
  basis: Multiple reign entries link succession, burial at Gombe, and construction
    of royal temples at named sites, while Kimbugwe's case is marked by the absence
    of burial and temple.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage lists practices but does not explicitly state their theological
    or political meaning.
- id: motif:2
  label: Ritual specialist causes cosmic darkness, deity restores light
  taxonomy_refs: []
  basis: An offended medicine-man commands the sun to fall, causing darkness, and
    the god Wanga restores the sun.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the event in a royal chronicle context, not a full cosmological
    myth.
- id: motif:3
  label: Forbidden sight of sacred place brings death
  taxonomy_refs:
  - divine_judgment
  basis: The king is warned not to look toward Kaumpule's temple on pain of death;
    after he neglects the restriction, he dies.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not elaborate the rationale for the sight prohibition.
- id: motif:4
  label: Neglected sacred Twin restored to protect royal children
  taxonomy_refs:
  - sacred_twins
  basis: A priest attributes infant deaths to neglect of the father's Twin; decorating
    and returning it to the temple removes the evil from later children.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not define the nature of the Twin beyond naming it Mulongo.
- id: motif:5
  label: Desecration of divine temples followed by forest withdrawal and possession
  taxonomy_refs:
  - sacred_theft
  basis: Tebandeka orders gods' temples robbed and burned, hides in the forest, and
    is later found possessed by Mukasa and able to give oracles.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The connection between temple robbery, forest hiding, and possession is
    sequential in the passage but not explicitly explained as causation.
- id: motif:6
  label: Royal mediumship redirected into hereditary priesthood
  taxonomy_refs:
  - royal_legitimacy
  basis: Ndaula refuses Mukasa mediumship; a prince is appointed priest and custodian
    of fetiches, with later priests drawn from Juma's descendants.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage describes institutional succession but does not frame it as
    a mythic charter in explicit terms.
- id: motif:7
  label: Conditional healing requiring concealment in the forest
  taxonomy_refs: []
  basis: A medicine-man's cure for Ndaula requires exclusive use of medicine, secret
    forest hiding, and punishment of any revealer of the king's location.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage cuts off before the episode is completed.
