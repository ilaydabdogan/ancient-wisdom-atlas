  quote: The ghost of the King soon took possession of some man
  summary: After a king's death, royal women and officers are placed around or within
    his temple; a possessed man becomes the medium through whom people can converse
    with the late king; the Katikiro manages the dead king's estates with the Nalinya
    consulted; widows and the Katikiro must be replaced when their positions become
    vacant; a predecessor's tomb declines in importance after the reigning king dies.
