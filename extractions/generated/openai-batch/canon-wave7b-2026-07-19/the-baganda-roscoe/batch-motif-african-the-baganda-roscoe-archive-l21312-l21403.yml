canonical_text:
  quote: ''
  summary: The passage describes Baganda procedures for securing divine approval before
    building a house and cultivating land, including planting trees for Mukasa and
    Kaumpuli, building shrines, offering beer, dedicating a crowing fowl to Mukasa,
    and praying for fruitful land and children. It then describes initial land clearing,
    cultivation with hoes, planting of sweet potatoes, and offerings of first fruits.
    A tradition says King Kintu brought the first plantain-tree; its sacred root or
    tree, Manyagalya, remained on Magonga hill near Kintu's temple, supplied fruit
    for a monthly new-moon sacred meal for children, and was linked with offerings
    left in Kintu's forest. The passage also records new-moon rest days and first-fruit
    customs for beans and sweet potatoes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before building on a chosen site, a man consulted the family god about the
    site's suitability and sought the god's blessing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god sent a tree or two branches of a barkcloth tree to be planted near
    the house site; one tree was for Mukasa and the other for Kaumpuli.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two shrines were built for Mukasa and Kaumpuli, and beer was offered in them
    before building and cultivation proceeded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A fowl was kept so that it could be heard crowing; it was called the voice
    of the living and was dedicated to Mukasa.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband and wife drank some beer on the chosen house site and poured the
    remainder at the roots of the trees as a libation to the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tree-stems were decorated with a creeper, and the husband prayed for the
    land, its fruitfulness, a house, and children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Initial land clearing was shared: the husband cut tall grass and shrubs,
    and the wife dug, heaped, and burned vegetation except what she saved as firewood.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first crop on newly broken land was sweet potatoes, propagated by runners
    from a neighbour's garden; maize or beans could be sown between potato rows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When first fruits were ripe, the husband offered them to his god and asked
    for further blessing on future crops.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A tradition says King Kintu brought the first plantain-tree to the country,
    and that the original root still grew on Magonga hill near Kintu's temple.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kintu's plantain-tree was named Manyagalya and was sacred.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Each month, at the appearance of the new moon, fruit from Kintu's tree was
    cut and cooked for a sacred meal eaten only by boys and girls who had not reached
    puberty.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the same time, a goat and other food were cooked, placed in seven baskets,
    taken by a man and a woman into Kintu's sacred forest, and left there for him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The same man and woman later fetched away the empty baskets, and it was commonly
    believed that Kintu and his son had come and taken the food.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the new moon, the temple estate observed seven days of rest called biwerende,
    during which no work was done and even cooking firewood had been gathered beforehand.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Other plantain-trees in the country were supposed to have grown from the plantain-tree
    on Magonga hill.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: When beans were ready, a woman called her eldest son to eat some of the first
    cooked beans; neglecting this was thought to bring divine displeasure and illness.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: After the eldest son's bean meal, the husband jumped over the woman, and thereafter
    the beans could be eaten by all.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: When the first sweet potatoes were dug each year, a woman took a basket of
    them to show her husband before cooking them.
  category: action
  evidence_refs:
  - ev:13
