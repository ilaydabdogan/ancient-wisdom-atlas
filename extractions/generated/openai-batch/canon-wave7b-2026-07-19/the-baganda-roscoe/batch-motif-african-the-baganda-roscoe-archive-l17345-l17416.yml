canonical_text:
  quote: ''
  summary: 'The passage describes condemned prisoners at sacrificial places: attempts
    by relatives or officials to obtain release through gifts or bribes, the status
    of a released person, the execution of high-ranking chiefs, a farewell rite involving
    a broken water-pot, sacred trees where victims'' clothing was hung for their ghosts,
    beer given or poured over victims before execution, and the sacrificial place
    Nakinzire with a temple and medium.'
  language: English
  quote_policy: summarized
