  quote: ''
  summary: The passage describes an unnamed clan's sacred war fetish, sacred drum,
    drum-shrine asylum, sacred animals, royal hunting dog with bell, royal land grants,
    estates, and names. It then describes the Reedbuck Clan as elephant hunters in
    Mabira forest, their gods and priests of the chase, their estates, a post-coronation
    ivory-tusk rite for elephant increase, burial of an elephant tusk nerve because
    of the animal ghost, and offerings made at a temple by hunters.
  language: English
  quote_policy: summarized
