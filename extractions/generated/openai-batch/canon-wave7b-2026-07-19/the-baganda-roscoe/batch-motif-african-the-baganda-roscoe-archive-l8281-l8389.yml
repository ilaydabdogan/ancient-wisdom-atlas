- id: motif:2
  label: Water-borne ancestral arrival by canoe
  taxonomy_refs: []
  basis: The Jackal Clan says Muige came from a Lake Victoria island and crossed the
    lake in the royal canoe Namwige when he first came to Uganda.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a local ancestral migration pattern; the passage does not connect
