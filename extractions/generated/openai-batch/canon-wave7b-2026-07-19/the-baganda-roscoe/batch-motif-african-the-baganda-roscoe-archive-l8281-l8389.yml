- id: motif:3
  label: Offering to clan guardian after royal favor
  taxonomy_refs:
  - sacred_exchange
  basis: When a Hippopotamus Clan chief was promoted or received favor from the King,
    he made an offering to Nangera, believed to be the clan's special guardian.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states that the offering follows promotion or favor; it does
    not state that Nangera grants the royal favor in exchange.
- id: motif:4
  label: Cyclic presentation of royal sacred object
  taxonomy_refs:
  - royal_legitimacy
  basis: The royal fetich Lugala, a large gourd, was carried in state to the capital
