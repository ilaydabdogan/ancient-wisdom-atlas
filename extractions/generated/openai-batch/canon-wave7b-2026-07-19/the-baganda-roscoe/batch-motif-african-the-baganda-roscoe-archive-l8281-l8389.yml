canonical_text:
  quote: ''
  summary: 'The passage describes clan offices and totemic traditions: an unnamed
    opening clan has royal tomb, drum, and King''s Mother duties; the Jackal Clan
    traces its forefather Muige to a Lake Victoria island and a royal canoe; the Hippopotamus
    Clan explains its totems through Kaita''s birth, a tortoise-afterbirth transformed
    into a hippopotamus, and lake-related royal duties; the Cephalopus Clan traces
    its forefather Bambaga to Kintu and keeps the royal gourd fetich Lugala.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed clan in the opening continuation cared for Wanyana's tomb and the
    tombs of kings' mothers, made the chief drum with its fetich, and escorted the
    King's Mother back to her home after the king's life-prolongation ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jackal Clan says its forefather was Muige, who came from Island Nyende
    in Lake Victoria Nyanza during King Kimera's reign.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Jackal Clan had three temples on its estates dedicated to Mukasa; each
    had a medium chosen by the god, while the priest was a member of the Jackal Clan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Jackal Clan cared for and manned the royal canoe Namwige, and asserted
    that Muige crossed the lake in it when he first came to Uganda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hippopotamus Clan claims to be descended from Kaita, who was a son of
    Kintu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Hippopotamus Clan origin account, when Kaita was born his mother gave
    birth to a tortoise in place of the afterbirth; the tortoise later became a hippopotamus,
    connecting the clan with those animals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Hippopotamus Clan's estates, except one, bordered on the lake, and its
    duties were connected with the lake, including maintaining, repairing, manning,
    and replacing large canoes for the King.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hippopotamus Clan supplied some drum beaters, made royal shields, and
    made bracelets and anklets for the King's wives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hippopotamus Clan worshipped the lake gods Mukasa, Musisi, and Wanema,
    cared for Nangera son of Musisi on Island Mbazi, and made offerings to Nangera
    when a clan chief was promoted or favored by the King.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Cephalopus Clan says its forefather was Bambaga, who attended Kintu when
    Kintu first came to Uganda; on the Bugala estate the clan had a shrine holding
    the royal fetich Lugala, described as a large gourd cared for by the chief Bambaga.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the fifth day after each new moon, the fetich Lugala was carried to the
    capital, handed to the King, examined by him, and returned to its keeper.
  category: sequence
  evidence_refs:
  - ev:8
