canonical_text:
  quote: ''
  summary: The passage describes the selection and status of the Queen Lubuga, her
    shared coronation and mourning rites with the King, her separate residence and
    powers, and her prohibition from having children. It then lists offices and restrictions
    of named royal wives, rules governing princes' marriages, prohibitions on princesses
    marrying or bearing children, and the general rule that a woman's position in
    marriage depended on the man's rank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen, called Lubuga, was chosen from the new King's paternal half-sisters
    and had to be the daughter of a woman who had no sons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Queen and her Kago were chosen, she was taken to join the King and
    shared his coronation and official mourning ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: At Budo hill, the Queen was given a bed in the same house as the King, received
    official barkcloths like him, and during mourning was not allowed to leave him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Queen was not allowed to walk anywhere and had bearers like the King.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Queen took a coronation oath to be faithful to the country and scattered
    coffee-beans while taking the oath, as the King did.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the King moved to his new court, the Queen received a residence on an
    adjacent hill that had to be separated from his residence by a stream of running
    water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Queen had chiefs with the same titles as great chiefs of the realm, estates
    in every district, her own courts, and power of life and death over her own people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Queen had to visit the King daily unless prevented, in which case she
    sent a representative to explain her absence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Queen was forbidden to have children; if found pregnant, she would be
    deposed and might be put to death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: After mourning ended, the King's wives were chosen for various offices connected
    with the court.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Kadiiliibare ranked first among the wives, had charge of fetiches and amulets,
    and took precedence over other wives in court.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nasasa acted as hairdresser, cut the King's nails, cared for the hair and
    nail clippings, and stored them in a house built for that purpose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Children born to other royal wives took their mother's totem and were received
