canonical_text:
  quote: ''
  summary: The passage describes ritual avoidance and added offerings on the way to
    a temple; sacred guinea-fowls belonging to the forest gods Mubiru and Kasunsuli;
    household, bodily, fertility, travel, and war uses of fetiches; daily propitiation
    of war-related fetiches by a wife; royal war fetiches with mediums and oath functions;
    and several named royal fetiches associated with royal daughters, death sentences,
    war spoil, control of ghosts, and sanctioned robbery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man on the road to a temple avoided meeting women; if he encountered a woman,
    he fetched an additional pot of beer and a barkcloth before making his request
    at the temple.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mubiru and Kasunsuli are identified as forest gods, and guinea-fowls were
    sacred to them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Priests of these gods were not to eat guinea-fowls unless the god permitted
    it; dead or accidentally trapped guinea-fowls were presented to the gods and otherwise
    buried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fetiches, called Mayembe, are described as varied objects kept in every home
    and worn on the neck, arms, and loins for special purposes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fetiches were worn as safeguards against royal or chiefly anger, human-sacrifice
    traps, wild animals, snakes, diseases, and other dangers; women wore them around
    the waist for fecundity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Unused fetiches were kept in a reserved place in the hut and received frequent
    offerings of beer.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man going to war carried fetiches for protection, assistance in battle,
    and intimidation of the enemy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fetiches left at home during war were propitiated daily by the chief wife
    with beer offerings and prayers for the absent husband.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the chief wife neglected the propitiation and the husband was killed or
    wounded, she was blamed for his death or injury and accused of adultery.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In battle, a man wore one fetich suspended from his neck and one or two in
    his shield.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The King sent six named special fetiches to war with the general: Kawoto,
    Kizito, Sebitengere, Kanyamira, Kizinga, and Kumpumpu.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each royal war fetich had a medium who could declare an oracle or give advice
    during the expedition.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The royal fetiches are described as long antelope horns with iron spikes at
    the tips and hollows filled with ingredients known only to the maker.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The royal fetiches were stuck in a row in front of the general's hut, and
    chiefs took oaths before them before battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: No one was permitted to pass the royal fetiches to approach the general, under
    penalty of death, unless summoned; a summoned person was honored by the army.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: A man returning from war thanked his fetiches for safe return and care.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: The King's fetich Nyenya was entrusted by each king to the first daughter
    born after his coronation, and that daughter was named after the fetich.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: The fetich Lukenge had a guardian from the Rat Clan; a person whom the King
    angrily sentenced to death was said to be under Lukenge's influence.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: The fetich Kizinga was sent with the army so that the army might take much
    spoil in women and cattle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The fetich Mbagirangese was handed by the King to a person or wife whom he
    intended to kill, and the passage states that it gave the King power over the
    ghost and prevented haunting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The fetich Sekabemba was secretly given by the King to a man titled Bisobya,
    who robbed rich chiefs and gave part of the spoil to the King.
  category: action
  evidence_refs:
  - ev:9
