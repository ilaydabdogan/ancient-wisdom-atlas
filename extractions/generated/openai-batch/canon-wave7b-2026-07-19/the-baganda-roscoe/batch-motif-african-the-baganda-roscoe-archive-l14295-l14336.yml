  quote: ''
  summary: The passage describes legal and social customs involving fines and debts,
    pregnancy after an unmarried girl is wronged, dowry or fines, clan intervention,
    exclusion from meals until a beer gift and part of the fine are brought to appease
    the gods, a father's possible claim that his daughter was intended for the King,
    and procedures and penalties surrounding a husband's suspicion of his wife's adultery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed person is described as leaving part of a fine unpaid until he can
    bring a charge against the creditor, then using the trial to cancel the debt mutually.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a young man wronged an unmarried girl and she became pregnant, he had to
    take her to his father's house until she gave birth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the birth, the young man had to pay the girl's father the full dowry
    if he wanted to marry her; if he declined, he was fined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the young man refused to pay the fine, the girl and child were taken from
    him by members of her clan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the young man paid the fine but did not marry the girl, she returned home
    after nursing and weaning the child, and the child was raised by one of the man's
    relatives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A girl described as having gone astray was not allowed to eat with her parents
    until the man brought them beer and a portion of the fine; this was said to appease
    the anger of the gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A father could increase compensation by saying his daughter had been intended
    to become one of the King's wives; the youth then feared death if the matter reached
    the King.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A husband who suspected his wife of adultery was allowed to tie her up and
    torture her until she confessed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The described procedure involved stripping the woman, tying her arms and legs
    to house posts, flogging her, and leaving her there overnight or until confession.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The law did not punish a husband if he killed his wife under such circumstances
    and her wrongdoing was proved; if he had tortured or killed her unjustly, her
    relations accepted a fine.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage ends with the beginning of another case in which a peasant finds
    his chief making love to his wife and packs up his goods.
  category: sequence
  evidence_refs:
  - ev:7
