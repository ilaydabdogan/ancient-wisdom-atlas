  text: The keeper of the fetich Budo sent word telling the King to go to the hill
    and stand upon the fetich.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prescribed ceremonies included eating plantains baked in their skins,
    drinking water from the well on the hill, taking a staff from a tree, and taking
    materials for basket making and seeds from the wild plantain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The assurance attached to the ceremonies was that the King would be confirmed
    in his kingdom, that no rebelling prince would succeed against him, and that he
    would be wiser and stronger than anyone in the kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: From that time onward each King customarily went to Budo before going into
    mourning for the deceased King.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Earlier newly chosen Kings went immediately into mourning and, after completing
