canonical_text:
  quote: ''
  summary: The passage describes instructions from the keeper of the fetich Budo for
    a King to go to Budo hill and perform prescribed ceremonies. The rites are said
    to confirm the King in his kingdom, protect him against rebellious princes, and
    make him wiser and stronger than others. It also describes the resulting custom
    of going to Budo before mourning the deceased King, earlier mourning and robing
    practice, and avoidance of the Mayanja river because it was said to be possessed
    by a princess's ghost.
  language: English
  quote_policy: summarized
