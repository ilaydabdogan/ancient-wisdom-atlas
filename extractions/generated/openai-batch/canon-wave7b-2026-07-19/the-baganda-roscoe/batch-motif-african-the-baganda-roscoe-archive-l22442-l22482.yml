canonical_text:
  quote: ''
  summary: The passage describes organized lion hunting by large groups under chiefs,
    royal ownership of lion and leopard skins, and methods for hunting or controlling
    hippopotamuses with spears, harpoons, traps, canoes, lines, and floats. It notes
    differing practices around eating hippopotamus flesh and the danger hippopotamuses
    pose to canoes and canoe-men.
  language: English
