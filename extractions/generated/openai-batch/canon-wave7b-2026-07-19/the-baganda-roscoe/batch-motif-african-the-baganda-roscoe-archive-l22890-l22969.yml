canonical_text:
  quote: ''
  summary: Kintu and Nambi leave with animals and a plantain-tree, but Nambi returns
    for forgotten grain despite warnings. Death follows her to earth. After Kintu
    and Nambi have children, Death demands a child as cook, is refused, and begins
    killing the children. Gulu sends Kaikuzi to stop Death, but Kaikuzi fails to capture
    him after children cry out when they see him. The passage concludes that Death
    has since lived on earth, killing people and escaping into the earth at Tanda
    in Singo.
  language: English
  quote_policy: summarized
