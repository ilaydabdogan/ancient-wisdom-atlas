canonical_text:
  quote: ''
  summary: 'The passage describes offices and authority in Baganda government: a royal
    woman or Queen with her own court and capital powers; the King''s Mother or Namasole
    with estates, court, honor, restrictions, guardianship, hill residence, burial,
    and tomb guardian; and the authority of the King, Council, chiefs, representatives,
    clan burial lands, and rules of appointment, deposition, property loss, and land
    control.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A royal woman, referred to through feminine pronouns and later in relation
    to the Queen, appointed chiefs, held a court apart from her brother the King,
    and consulted him in difficult cases involving people outside her own following.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: This royal woman had powers of life and death and could order execution for
    slight reasons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King's Mother, called Namasole, had estates in each district, held her
    own court, and was raised to power and honor by virtue of being the King's mother.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After becoming Namasole, the King's Mother was carried on men's shoulders
    when travelling, and etiquette did not allow her to walk any distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Namasole was not permitted to marry again; after one King's Mother took
    her guardian as husband, the guardian was thereafter chosen from her own clan
    and treated as her brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Custom did not permit the Namasole to have children after being raised to
    office, and the King could order execution of a man who became too familiar with
    his mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When given the title Namasole, the King's Mother moved to a hill away from
    her son; this hill was named Lusaka after a hill associated with Wanyana, King
    Kimera's mother.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the King's Mother died, she was buried on the hill where she had lived,
    and a member of the Dog Clan became guardian of her tomb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Chiefs were required to spend much time in the capital and to ask the King's
    permission to leave the Council when needed in their districts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A chief who left the capital appointed a representative, called Musigire,
    who assumed the chief's title and managed his State affairs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The chiefs had large tracts of country under their control but were responsible
    to the King and the Council for the exercise of that control.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: All land was said to belong to the King, except Butaka lands, which were clan
    freehold estates for burial purposes subject to labor and tax obligations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: A successor to land on a Butaka estate, chosen by the clan, still had to obtain
    the King's sanction before taking possession.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: District-Chiefs were appointed by the King, usually after nomination by the
    Katikiro and District-Chiefs, and the King could reject a nomination or depose
    a chief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A deposed chief was generally prevented from removing property, and in some
    cases the King captured wives and cattle if they could be found.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Promotion to a new office required a chief to give up possessions except movable
    goods, without compensation for buildings or improvements, discouraging the planting
    of slow-growing trees on official estates.
  category: sequence
  evidence_refs:
  - ev:8
