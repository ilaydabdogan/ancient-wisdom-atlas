canonical_text:
  quote: ''
  summary: 'The passage describes Baganda barkcloth-making: removing bark from trees,
    protecting or leaving the trunk to heal, scraping and beating bark with grooved
    mallets in a hut, producing cloth of different thicknesses, colours, and qualities,
    repairing flaws with plantain fibre, and using special white barkcloth for the
    King''s coronation. It also begins a description of canoe-builders as woodworkers
    who made shields from whitish wood in a three-piece oval form.'
  language: English
  quote_policy: summarized
