canonical_text:
  quote: ''
  summary: The passage describes Baganda marriage customs, focusing first on royal
    acquisition of wives through demands, gifts, annual collection of handmaids, and
    presentation by existing wives, then on chiefs' acquisition of wives and commoner
    marriage negotiation through kin, small tokens, dowry items, and an oath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the King wished to add wives, he demanded one or more women from his
    chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Birth and rank did not determine the King's choice of wives; the passage states
    that a peasant girl could become a favourite wife as readily as a wealthy chief's
    daughter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Custom prohibited the King from seeking a wife among the daughters of a neighbouring
    king.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Young girls were willingly supplied to the King because they might become
    mothers of princes, and a successful prince could raise his mother's clan to honour.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: People presented girls or women to the King when asking a favour or seeking
    forgiveness after disgrace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Once a year, royal representatives collected young girls in each district
    to serve as handmaids to the King's wives; some were later selected as royal wives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The King did not perform the ordinary marriage ceremonies used by peasants
    or chiefs, but he gave large presents to the families of favourite wives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Disfigured or scarified women were barred from becoming wives of the King,
    with the stated reason that one who endured such pain was considered capable of
    killing her husband.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Existing royal wives could hold offices, possess power, and have many attendants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The King's wives prepared a good-looking handmaid by bathing, anointing, and
    dressing her, then presented and praised her to the King; the girl could then
    be added to his wives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chiefs obtained wives by following prevailing customs, by receiving girls
    as gifts, by capturing women in war, or by receiving women as rewards for valour.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says love did not enter into marriage contracts, though spouses
    could become attached, and a woman might cling to her husband in danger or mourn
    him sincerely.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Girls generally married young, upon entering their teens.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: In commoner marriage, a suitor could approach the girl's brother or the girl
    directly; a small gift such as meat or salt could signal his wish to marry her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: If the girl accepted the small gift, the suitor asked her brother for marriage;
    the brother consulted the paternal uncle, and the suitor later brought beer, possibly
    barkcloth, dowry, relations, and took an oath before the girl's relations.
  category: sequence
  evidence_refs:
  - ev:8
