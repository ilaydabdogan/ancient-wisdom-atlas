canonical_text:
  quote: ''
  summary: The passage describes agricultural timing for plantain fruit and maize,
    and several rites used by Baganda women or people to stop destructive lightning,
    wind, or heavy rain. Actions include throwing objects at the doorway, constructing
    a reed frame as an offering to Kiwanuka, striking a knife on a hoe-blade, placing
    plantain materials and thatch as signs, and tying a plantain leaf into a bag as
    a token that rain has been tied up. It also notes year-round plantain production
    and drought-related food scarcity.
  language: English
