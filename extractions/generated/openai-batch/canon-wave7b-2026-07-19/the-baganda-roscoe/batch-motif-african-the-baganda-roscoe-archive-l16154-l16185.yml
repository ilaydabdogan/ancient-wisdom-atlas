  quote: ''
  summary: The passage describes temple procedures connected with Kibuka. A messenger
    is housed until an interview, priests attend, and prisoners sent by the King are
    allowed to state their case before the god. Afterward they are taken to a named
    tree, made to drink doctored beer meant to prevent their ghosts from harming the
    King, and executed at a sacrificial place. A caption identifies a stool associated
    with the war-god Kibuka.
