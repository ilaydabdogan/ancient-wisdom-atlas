canonical_text:
  quote: ''
  summary: The passage describes a ceremony in which Kibuka's temple object is briefly
    visible to the people, carried into a new temple, placed on a dais with animal
    skins, and accompanied by temple regalia and drums. It also describes mediumistic
    possession, the killing of prisoners, Kibuka's war-oracle functions, and royal
    consultation through gifts of slaves and cattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people were permitted to look upon the god only on this occasion, and
    what was visible was a large conical object covered in barkcloth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kituma carried the god to the middle of the temple and placed him on a dais
    covered with a lion's skin and a leopard's skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Objects before or near the dais included war spears, a nine-bladed spear,
    Kibuka's named shield, a paddle, a fly-brush, a pipe, an umbilical cord, a copper
    axe, a knife, and a named harp.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thirty drums were beaten while the god was carried from the temporary temple
    to the new residence; a special drum named Tatata was beaten by Luwoma during
    possession of the medium Kainja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kibuka possessed the medium Kainja and instructed him to catch and kill people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the evening Kibuka possessed one of the mediums and ordered prisoners to
    be put to death; one prisoner pleaded for the group, and then the prisoners were
    executed by the temple officer Nabubi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: People captured on roads near the temple during its construction were killed
    unless relatives redeemed them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kibuka was said to foretell war and to send a representative to war with an
    emblem of power from the god; a priest and medium stayed near the general to give
    oracles about the enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the King wished to consult Kibuka, he sent slaves and cattle; the assistant
    priest Katata received the gift and went into the temple to announce the messenger.
  category: sequence
  evidence_refs:
  - ev:7
