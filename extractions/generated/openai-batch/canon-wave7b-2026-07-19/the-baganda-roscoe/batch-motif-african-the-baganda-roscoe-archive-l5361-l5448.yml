canonical_text:
  quote: ''
  summary: 'The passage describes procedures following a king''s death: offices lapse
    and are reappointed, the royal corpse is embalmed with beer and dried, widows
    are guarded, the body is moved through named places and handled feet first, the
    new king''s maternal uncle cuts the cord binding the corpse''s toes and wears
    beads as an office sign, burial chiefs wrap and transport the body, a tomb is
    prepared, royal household attendants are ordered put to death and taken to the
    funeral, and a white fowl is presented, killed, and eaten in connection with admission
    to the burial enclosure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a king's death, the Kago, Kimbugive, and Sabaganzi went out of office while
    retaining titles connected with the late king; the new king appointed chiefs to
    these offices before leaving the capital for coronation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the bodyguard embalmed the corpse by disembowelling it, washing
    the bowels in beer, drying them, replacing them, drying and squeezing the body,
    and washing it with beer; beer used in washing had to be drunk and not discarded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Royal widows were guarded during mourning, and widows with children by the
    late king were watched lest they use magic on the new king and secure the throne
    for one of their sons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After three months the king's body was moved from Kireka to Temengalo for
    further ceremonies, then to Gayaza; each removal carried the body feet first,
    in contrast to the stated rule that a living person was not carried feet first
    and a corpse was not carried head first.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Gayaza the deceased king's herdsman brought butter for smearing the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the new king was chosen, his mother was identified, her brother was
    brought to the dead king's body, and he cut the cord binding the great toes, removed
    two beads from the cord, and wore them around his neck as the sign of the office
    of King's uncle, Sabaganzi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The new Kago and the King's uncle Sabaganzi received barkcloth from the king;
    the Kago smeared barkcloth with butter, spread it over the body, and the body
    was wrapped in other barkcloths and taken to Merera.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During the journey to bury the late king, the procession passed the residence
    of Lwambirizi, who took a hoe and walked before the procession as far as Sebi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mugema had been building a tomb at Mirera; Kago and Sabaganzi had to return
    to the new king, report that the body had been taken there, and wait for burial
    instructions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The new king appointed Kago, Sabaganzi, and Mugema to bury the body and ordered
    them to take and put to death named male royal officials and named women of the
    royal household.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The men and women ordered to the funeral were bound and taken as prisoners;
    their duties included cooking, brewing, herding, care of the well, beer, bed-chamber,
    water, clothing, and milk-pots and milk.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: At Mirera, Kibare headed the procession carrying a white fowl, and Lwambirizi
    walked behind him carrying the hoe; Kibare called to Senkaba, announced that the
    king was dead and brought for burial, and presented the fowl.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the funeral, the fowl was killed and eaten by Senkaba, Gungu, and Gungu's
    chief men; Senkaba was given one of the deceased king's young widows as a wife
    and admitted the party to his enclosure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note states that Musoloza, the chief who had charge of the sacred fire,
    had already been put to death.
  category: action
  evidence_refs:
  - ev:9
