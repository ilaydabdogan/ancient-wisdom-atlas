candidate_motifs:
- id: motif:1
  label: royal death and succession control
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links the king's death to vacated and reappointed offices, guarded
    royal widows because of possible succession magic, confirmation of the new king's
    maternal kin, and the new king's command over burial arrangements.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage is ethnographic description rather than an explicit mythic
    narrative; the royal-legitimacy classification is based on ritual and political
    functions described in the passage.
- id: motif:2
  label: ritual preparation of a royal corpse by controlled substances
  taxonomy_refs: []
  basis: The corpse and bowels are washed in beer that must be consumed rather than
    discarded, the body is dried and squeezed, then smeared with butter and wrapped
    in barkcloth.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not state the symbolic rationale for beer, butter, or
    barkcloth; only their ritual use is explicit.
- id: motif:3
  label: royal funerary retainer-killing
  taxonomy_refs:
  - sacrifice
  basis: The new king orders named male and female royal service personnel to be taken
    and put to death in connection with the burial, and a note adds that the sacred-fire
    chief had already been put to death; a white fowl is also killed and eaten after
    the funeral.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text says attendants were put to death and the fowl was killed, but
    it does not explicitly explain these deaths as sacrificial offerings or state
    a theology of sacrifice.
- id: motif:4
  label: ritualized admission through offering at burial enclosure
  taxonomy_refs:
  - sacred_exchange
  basis: Kibare presents a white fowl to Senkaba while announcing the burial; after
    the funeral the fowl is eaten, a young widow is given to Senkaba, and Senkaba
    admits the party to his enclosure.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage reports the sequence of presentation, widow-giving, and admission
    but does not explicitly define the acts as exchange or explain their ritual logic.
- id: motif:5
  label: inverted handling rules for corpse and living body
  taxonomy_refs: []
  basis: The passage states a custom that the king's corpse is carried feet first,
    while a living person is never carried feet first and a corpse is never carried
    head first.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No broader interpretive meaning for the inversion is supplied in the passage.
