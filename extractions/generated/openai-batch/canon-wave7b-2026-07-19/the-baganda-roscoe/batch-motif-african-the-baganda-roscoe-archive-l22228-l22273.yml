  text: The passage says this kind of hunting required courage, strong nerves, and
    trustworthiness among companions; hunters were sometimes killed, though seldom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Bulemezi, men sometimes hunted elephants from trees, but more often used
    weighted spears hung from trees and released by a cord struck by an elephant's
    feet.
  category: action
  evidence_refs:
  - ev:2
