canonical_text:
  quote: ''
  summary: The passage describes Baganda elephant- and buffalo-hunting methods, including
    hunting from trees, weighted spear traps, staked foot-pits, pursuit of wounded
    animals, disposal of the elephant tusk nerve because of a ghost belief, distribution
    and taxation of ivory, sale of elephant meat to neighboring groups, and buffalo
    hunting for meat and hides.
  language: English
  quote_policy: summarized
literal_observations:
