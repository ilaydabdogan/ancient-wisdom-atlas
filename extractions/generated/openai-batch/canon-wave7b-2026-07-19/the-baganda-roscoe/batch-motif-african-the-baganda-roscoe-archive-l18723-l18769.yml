literal_observations:
- id: obs:1
  text: The whole country participated in building the outer fence of the royal enclosure,
    with District-Chiefs assigned portions and required to supply labourers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The main entrance gateway was ten or twelve feet wide, had stout posts made
    of reeds around wooden posts, and used a sliding gate.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gateway arrangement caused entry to occur on the left side; when closed,
    the gate slid behind a post, was tied with cow-hide thongs, and showed a smooth
    outer surface.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Additional gates in the main fence were reserved for the special use of the
    King or his wives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each gate had two sets of guards, one inside with charge of the gate and one
    outside to prevent intruders from forcing entry.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the main enclosure, fences formed streets with gates and guards every
    few yards, dividing groups of buildings into smaller enclosures.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women in one inner enclosure could visit women in another only by permission,
    and each inner enclosure had at most two exits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A round house was begun from the top rather than the bottom; instead of a
    foundation, it had a central ring called Nkata, described as equivalent in importance
    to a brick-house foundation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kattgawo was assigned to build a house for the King's wife Kadiilubare
    but had to obtain the three special rings from the man whose duty it was to make
    them for the King.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The rings were made from palm-leaf fronds beaten into shreds, bleached in
    the sun, and tied into rings of specified size and thickness.
  category: sequence
  evidence_refs:
  - ev:7
