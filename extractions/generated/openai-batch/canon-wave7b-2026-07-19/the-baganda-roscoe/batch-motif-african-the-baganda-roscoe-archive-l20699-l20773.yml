  summary: The passage describes Baganda basket-making, including paired baskets,
    display baskets made by the Heart Clan, fishermen’s baskets used as traps and
    later as offering receptacles, and then describes ivory use, trade, ornament-making,
    currency discs, and royal control over skilled ivory-workers.
