canonical_text:
  quote: The first menstruation was often called a marriage, and the girl spoken of
    as a bride.
  summary: The passage describes children's games, girls' domestic and agricultural
    training, puberty markers, premarital pregnancy sanctions, first-menstruation
    seclusion and restrictions, a jumping-over practice associated with fertility,
    first fruits from a girl's first garden, beliefs about non-menstruating women,
    and the puberty term Mulongo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage describes youth games, including a kicking game and weso, a board
    game played with holes and seeds or smooth stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls were taught cooking and cultivation; before puberty they wore a waist
    ring, and at puberty they received barkcloth to wear around the loins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Peasant girls could be sent to herd goats, and the passage says this could
    expose them to danger from older boys.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman in charge of a girl was expected to look after her; premarital pregnancy
    was described as a family disgrace.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a girl became pregnant before marriage, her parents would not eat with
    her, she had to identify the man, and the man was fined a cow and a fowl, had
    to pay dowry, and had to marry her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pregnant girl had to live with the responsible man's relations until after
    birth and weaning, because the child was treated as belonging to that kin group
    and they were responsible for pregnancy ceremonies and later care.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young girls were sometimes given in marriage to a chief and kept in his enclosure
    under the care of a female relation until old enough to become wives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Girls were said to mature at about twelve, and their age or maturity was described
    by the development and size of their breasts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: At first menstruation a girl was secluded, forbidden to handle food, and forbidden
    to enter her brother's or uncle's house; female relations attended and fed her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During this state the girl was described as being "at peace" or "outside."
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the girl recovered from first menstruation, a male relative or her father
    had to jump over his wife or the girl's mother.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: First menstruation was often called a marriage, and the girl was spoken of
    as a bride.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a girl cultivated her first garden plot and brought its first fruits,
    a male relative or her father had to jump over his wife or her mother before the
    food was eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says the jumping-over practice made the garden and future garden
    work fruitful, and that omitting the analogous practice at first menstruation
    was thought to prevent children or cause infant deaths.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A girl or woman who did not menstruate was regarded negatively; if a man married
    such a woman, he wounded her with a spear before going to war so that blood was
    drawn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Non-menstruating women were said to have a harmful influence on gardens and
    to make them barren if they worked in them.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Girls were kept busy with mat-making, basket-making, drawing water, and bringing
    firewood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: From puberty a girl was called Mulongo, a term also used for a cow old enough
    to have calves.
  category: speech
  evidence_refs:
  - ev:11
