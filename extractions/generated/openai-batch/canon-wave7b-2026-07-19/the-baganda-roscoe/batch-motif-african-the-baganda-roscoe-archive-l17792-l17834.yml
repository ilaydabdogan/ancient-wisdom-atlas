canonical_text:
  quote: ''
  summary: The passage describes healing rites in which a medicine-man transfers a
    sick person's illness to an animal, plantain-tree, clothing, doorway objects,
    grass or herb bundle, or in some cases another human being. The animal may be
    killed, its blood applied to the patient or doorway, and substituted objects are
    carried away or discarded on waste land, while the patient is expected to recover.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine-man may transfer sickness to an animal, drive the animal to waste
    land, kill it there, take the meat, and the sick man is expected to recover.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medicine-man may direct a sick man to provide an animal and promise to transfer
    the sickness to that animal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one variant, the medicine-man kills the animal beside a selected plantain-tree
    and anoints the sick man with the animal's blood on the forehead, chest, and legs
    above the knees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The selected plantain-tree must be about to bear fruit; its stem is split
    lengthwise, with short unsplit sections left at the top and bottom, so the sick
    man can step through it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After stepping through the split plantain-tree, the sick man leaves his clothing
    there, runs into the house without looking back, and receives new clothes inside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The medicine-man carries away the plantain-tree, clothing, and meat; he deposits
    the plantain-tree on waste land and keeps the meat and clothing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In another variant, the animal is killed near the hut, a stout stick is laid
    across the threshold, and the doorway is partly narrowed with branches.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Blood is put on both sides of the narrow entrance, on the threshold stick,
    and on the sick man, who is taken outside for that purpose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The patient re-enters the house and lets his clothing fall off as he passes
    through the doorway.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The medicine-man carries away the branches, stick, clothing, and meat; he
    casts the branches and stick on waste land and keeps the meat and clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: If a sick person is too poor to afford a goat or fowl as a scapegoat, the
    medicine-man ties grass or herbs into a bundle, passes it over the patient, carries
    it off, and throws it away on waste land.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A small fee is given to the medicine-man when the patient recovers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that in other cases the sickness is transferred to another
    human being.
  category: action
  evidence_refs:
  - ev:6
