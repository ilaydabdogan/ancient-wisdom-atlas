  quote: ''
  summary: 'The passage describes Baganda pottery manufacture: forming, drying, polishing,
    baking, glazing, decorating, gender restrictions during drying, and market exchange.
    It notes that potters timed baking to the new moon and avoided baking after the
    full moon because they believed the pots would fail.'
