canonical_text:
  quote: ''
  summary: The passage describes the office of Mugema in relation to royal pregnancy
    formulas and the Lube slaughter-place, then gives accounts of the Oribi Antelope
    Clan and the Katinvuma Clan. The Oribi Clan claims Kaimyebutega, companion of
    Kintu, as forefather; under King Cwa he becomes Kibare, chief steward, royal representative,
    and special judge, with custody of horned crown regalia, a coronation spear, a
    royal rug, and a fetich. The Katinvuma Clan explains its seed/bead totem through
    a story in which a child swallows another child's seeds, is killed so the seeds
    can be recovered, and the victim's relations refuse thereafter to wear beads.
    The clan also claims descent from Kyadondo, son of Kintu, and has duties connected
    with carrying deities and temple building.
  language: English
  quote_policy: summarized
