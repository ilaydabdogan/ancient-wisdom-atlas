candidate_motifs:
- id: motif:1
  label: Human killing for royal longevity
  taxonomy_refs:
  - sacrifice
  basis: The passage explicitly states that the person who ran to bring fruit stones
    was speared to death with the object of giving the King long life; additional
    killings accompany the hut and pot incidents.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is an ethnographic report of royal custom, not a mythic narrative;
    the stated long-life purpose is explicit only for the fruit-stone killing.
- id: motif:2
  label: Victim's body transformed into royal regalia
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The murdered youth's muscles are made into anklets for the King and the skin
    into a whip kept in the royal enclosure; the anklets are later put on the King.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: high
  cautions: The passage describes the objects and their royal use but does not fully
    explain their symbolic meaning.
- id: motif:3
  label: Ritual itinerary of kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: The King follows a sequence through named places and persons, including games,
    payments, exchanges, sacred meal, regalia, killings, and the establishment of
    a shrine-like hut.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage segment begins and ends mid-ceremony, so the full structure
    of the royal itinerary is not available here.
- id: motif:4
  label: Ritual compensation and exchange with a chief
  taxonomy_refs:
  - sacred_exchange
  basis: After passing by the back premises of Walusimbi's house, the King pays ninefold
    compensation and then exchanges drinking cups with Walusimbi.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage gives the acts and payment amounts but does not state a theological
    or mythic interpretation.
- id: motif:5
  label: Cowry-shells burned in ritual fire and interrupted
  taxonomy_refs:
  - sacred_exchange
  basis: The King and two chiefs throw cowry-shells into a fire as if fuel, but Nabinvama
    snatches them away and questions the act.
  evidence_refs:
  - ev:8
  confidence: low
  cautions: The passage does not state the intended purpose of burning the cowry-shells;
    assigning this to sacred exchange is tentative because cowries are expended in
    fire.
- id: motif:6
  label: Hut consecrated by killing and kept as shrine
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The first man bringing grass for the King's hut is killed, his head is placed
    on top, and the hut is thereafter kept as a fetich shrine during the King's lifetime.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The term 'fetich shrine' is from the source's wording; human review should
    assess terminology and context.
