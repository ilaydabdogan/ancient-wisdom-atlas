canonical_text:
  quote: ''
  summary: The passage describes a royal ceremony and itinerary after a murdered youth's
    body parts are used for royal objects. The King travels through named places,
    plays a spinning-stone game under a tree, visits chiefs and his wife Naku, makes
    payments and exchanges cups, eats a sacred millet meal, orders or occasions several
    killings, burns cowry-shells in a fire until stopped, receives anklets made from
    the murdered youth, and establishes a hut later kept as a fetich shrine during
    his lifetime.
  language: English
  quote_policy: summarized
