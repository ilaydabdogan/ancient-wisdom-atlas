canonical_text:
  quote: Gusinze, which means "May you overcome,"
  summary: The passage describes the seating, gestures, prohibitions, guarded enforcement,
    and punishments in the king's court. Chiefs sit by rank around the king, accused
    persons kneel before him, courtiers greet and bow to him, bodily noises are forbidden,
    guards stand ready to bind offenders, and the king may imprison, fine, torture,
    or order death for chiefs, sometimes through spurious charges or extortion.
  language: English
  quote_policy: quoted
