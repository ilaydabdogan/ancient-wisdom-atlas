canonical_text:
  quote: ''
  summary: 'The passage describes Baganda procedures after warfare: formal reporting
    to the King, public testing and judgment of chiefs with beer, punishment and humiliation
    of cowards, execution of some condemned men, post-battle cleansing and offerings,
    a water test connected with a warrior’s wife’s fidelity, and honors for a peasant
    warrior who killed an enemy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The returning party salutes the King, kneels before him, and reports the expedition;
    the general gives a detailed day-by-day account of actions and gains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Peasants who killed enemies are named, while people accused of cowardice or
    disobedience to the general are also identified.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A large beer-pot, a ladle-holder, and police with ropes are present as chiefs
    come forward singly according to rank.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each man takes the ladle and asks his companions whether he may drink; approval
    permits drinking and praise, while refusal leads to seizure and binding by police.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Accused men are given an opportunity to plead, and leaders are tried, praised,
    or condemned by the court sitting with the King.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Prisoners whose lives are spared are taken to the Katikiro’s house, stripped
    of war-garments, dressed in barkcloths fastened like women’s clothing, and made
    to serve water at a meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some prisoners’ garments are padded to resemble pregnant women; the figures
    are laid on bedsteads and carried around the capital for public ridicule.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spared prisoners may be deposed, have property confiscated, and lose wives
    and children to slavery, though the King may later pardon them and restore some
    wives or land.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men condemned to death are burned as a warning; their property is confiscated,
    and wives and children may be sold into slavery, with relatives allowed to redeem
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After some successful expeditions with many deaths, chiefs avoid the capital
    for at least a month, undergo cleansing ceremonies, and visit local gods to give
    thanks and make offerings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When a warrior returns home, his principal wife meets him, relieves him of
    weapons, and gives him a gourd of water, some of which he drinks before entering
    the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If the wife has been unfaithful during the war, the water is said to cause
    the husband to fall ill, leading to the wife’s trial and punishment of the named
    man if guilt is confessed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A peasant who killed an enemy and returned wearing a grass crown is received
    with great honor.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The honored peasant gives his father the spear taken from the dead enemy;
    after ten such spears, the father gives him a cow, a goat, a fowl, and a spear-shaft.
  category: sequence
  evidence_refs:
  - ev:9
