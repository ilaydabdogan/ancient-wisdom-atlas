canonical_text:
  quote: ''
  summary: Gulu, King of Heaven, and Nambi's kin test Kintu before allowing his marriage
    to Nambi. Kintu's cow is taken; Nambi guides him to Heaven. Kintu passes tasks
    involving an enormous meal, rock used as firewood, dew collected in a pot, and
    the identification of his cow with help from a bee. Gulu grants him Nambi and
    the cows, but warns him to leave before Death, Walumbe, comes and not to return
    for forgotten things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nambi's relations object to her marriage because they say Kintu knows no food
    except what a cow yields, and they despise him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gulu decides to test Kintu before consenting to the marriage and has Kintu's
    cow taken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After losing the cow, Kintu finds herbs and leaves, cooks them, and eats them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nambi recognizes Kintu's cow, says her brothers wish to kill the man she loves,
    tells Kintu where the cow is, and invites him to go with her to Heaven to recover
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Kintu reaches Heaven, he sees many people, houses, cows, goats, sheep,
    and fowls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gulu orders a house built for Kintu and has an enormous meal brought to him,
    with the condition that failure to eat it all will prove him an impostor and result
    in death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kintu eats and drinks what he wants, finds a deep hole in the floor, pours
    the remaining food and beer into it, covers it, and calls for the baskets to be
    removed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sons of Gulu search the house but fail to find the hidden food, and they
    report that Kintu ate it all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Gulu gives Kintu a copper axe and commands him to cut firewood from rock;
    Kintu notices cracks in the rock, breaks off pieces, and returns with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Gulu next sends Kintu to fetch only dew rather than well water; Kintu finds
    the water-pot full and carries it back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the dew task, Gulu says Kintu is a wonderful being and permits him to
    recover his cow and marry Gulu's daughter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A large bee tells Kintu to choose the cow on whose horns it alights; Kintu
    watches the bee and uses it to identify his cow and several calves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Gulu praises Kintu as too clever to be deceived or robbed, gives him the cows
    and Nambi, and tells him to return home before Death, Walumbe, comes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Gulu warns Kintu and Nambi not to take Death with them and not to return if
    they have forgotten anything.
  category: speech
  evidence_refs:
  - ev:7
