canonical_text:
  quote: ''
  summary: A newly appointed general receives royal spears and a shield from the King,
    takes an oath of loyalty, performs a martial declaration before the King, and
    departs as war-drums sound. At the sacred fire near the main entrance, he smears
    ashes on his chest and forehead, a normally restricted act said to increase fierce
    appearance, strength, and bravery. War-drums then spread the call through chiefs’
    enclosures and the country rises for war; chiefs, followers, and retainers take
    oaths in hierarchical order, while women and children flee to safety. The King
    sends a war-drum and royal fetiches to the general.
  language: English
  quote_policy: summarized
