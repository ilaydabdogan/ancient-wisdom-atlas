canonical_text:
  quote: ''
  summary: The passage explains Baganda clan organization, including descent from
    a common ancestor, shared totems, kinship terms, sacred treatment of totems, marriage-related
    totem obligations, family estates, chiefs called fathers, family or national gods
    and temples, burial-based land rights, the title Bataka, clan exogamy, and the
    Lung-fish Clan exception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Baganda are described as divided into social or kinship divisions called
    kika, translated as clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A clan is described as tracing its origin to one ancestor and as having common
    totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Within a clan, people of the same generation are called brothers or sisters,
    while the younger generation calls the older generation father or mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each clan is said to have a principal totem called Muziro and a second totem
    called Kabiro; both are held sacred by the clan and not destroyed by it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wife adopts her husband's totems while retaining her own, and she teaches
    her children to respect both sets of totems, though the children are not bound
    to respect their mother's totems as adults.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clan family-estates are generally situated on hills, and each estate has a
    chief called the Father of his branch.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some clans have a family god or charge of a national god; when a temple stands
    on the clan chief's estate, the chief becomes priest and has charge of the temple.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Temples are generally built on hilltops and surrounded by land described as
    the property of the Deity.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Land where three or four generations of a branch of a clan have been buried
    becomes freehold property of that branch.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chiefs try to prevent people from burying the dead in good gardens, because
    such burials can create freehold land claims.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The King is described as reluctant to turn out a family that had buried three
    generations in the same place because he dreaded the anger of the ghosts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: People settled on family estates are called Bataka, meaning owners of the
    soil, and Kings are also called Bataka because they own the country.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: All clans are described as exogamous except the Lung-fish Clan; the explanation
    given is that its branches may have come from different areas, had different fathers,
    and had different second totems.
  category: relationship
  evidence_refs:
  - ev:6
