canonical_text:
  quote: ''
  summary: 'The passage describes Baganda marital and household customs: menstruation
    and nursing restrictions, newly married residence and house-building, widow remarriage
    procedures, grave obligations and offerings to a deceased husband’s ghost, beer
    as a sign of marriage consent, dowry binding, sanctions for adultery, and demographic
    comments about death risks, sacrifice, war, and disease.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During menstruation, a wife warned her husband or sent word if he wished to
    see her, and she was permitted to remain in seclusion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During menstruation, a wife was not allowed to touch her husband’s belongings,
    sit on his mat, or cook his food; touching his weapons or implements was treated
    as wishing him dead or working magic for his death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While nursing, a wife was also separated from her husband, though peasants
    modified the rule by having the wife cook during menstruation and live with him
    while nursing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Newly married young men often chose to live at a distance from their own or
    their wives’ parents; a man built his house after marriage, and his wife obtained
    and cultivated a garden to supply food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A widow who wished to remarry told her brother she was tired of looking after
    her late husband’s grave; her brother and clan then arranged repayment of dowry
    to the deceased husband’s relations before she re-entered her clan and remarried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A widow with children did not remarry but lived at the grave of her late husband;
    if she became pregnant through unchastity, the man involved paid a heavy fine
    to the deceased husband’s clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man wishing to marry a widow first paid the deceased husband a barkcloth
    and a fowl by placing them in the little shrine at the grave, in order to pacify
    the ghost.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A woman’s consent to marry was shown by allowing her uncle and brother to
    drink beer she had poured; after this, she was bound to the man unless he accepted
    repayment of the full dowry.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A husband commonly did not divorce an unfaithful wife but neglected her, stopped
    inviting her to share his couch, and reduced her to slave status with scant clothing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Men were described as exposed to capture for human sacrifices, war, and the
    wrath of chiefs or the King; women were seldom captured as sacrificial victims
    and were often spared when husbands were killed.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage reports that old people said women outnumbered men, perhaps three
    to one, and that infant mortality increased after the arrival of Arabs in King
    Suna’s reign when disease became common.
  category: other
  evidence_refs:
  - ev:10
