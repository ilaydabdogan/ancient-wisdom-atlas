canonical_text:
  quote: ''
  summary: 'The passage identifies relics of the war god Kibuka and royal relics kept
    in temples. It then describes beliefs and rites concerning ghosts of common people:
    their post-mortem route to a place where they give account, their respect paid
    to Walumbe, their return to burial grounds, shrine placement near graves, offerings
    to appease or enlist ghosts, and a medicine-man’s attempt to capture a haunting
    ghost in a covered vessel with fetiches.'
  language: English
  quote_policy: summarized
