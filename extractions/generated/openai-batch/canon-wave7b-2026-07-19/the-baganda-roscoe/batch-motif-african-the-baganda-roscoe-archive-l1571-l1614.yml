canonical_text:
  quote: It was a most sacred bond, and the breach of it was expected to be followed
    by sickness and death.
  summary: The passage describes a Baganda blood brotherhood ceremony between two
    men, witnessed by clan representatives. The men divide a coffee berry, mark themselves
    to draw blood, rub the berry halves in the blood, exchange and swallow them, promise
    mutual fidelity and aid, share a sacred meal with witnesses, and establish a friendship
    bond between their clans. Injury across the bonded clans requires compensation
    or risks consequences from ancestral ghosts. The passage also describes duties
    of clan branch heads under the Butaka system.
  language: English
  quote_policy: quoted
