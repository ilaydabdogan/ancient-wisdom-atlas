canonical_text:
  quote: ''
  summary: A king rewards a man with a garden spoiled by a python. In the tale of
    Kiwobe, a sheep speaks like a human, evades attempts to kill it, follows Kiwobe
    to a dance with his forgotten axe-handle, kills Kiwobe's wife after overhearing
    a plot, cooks her and wears her clothes, and is exposed by Kiwobe's son before
    fleeing. The narrator states that this is why women never eat mutton. The next
    tale begins with Sifirwakange lending money to two visitors who try to evade repayment,
    but he searches for them and recovers the debt.
  language: English
  quote_policy: summarized
