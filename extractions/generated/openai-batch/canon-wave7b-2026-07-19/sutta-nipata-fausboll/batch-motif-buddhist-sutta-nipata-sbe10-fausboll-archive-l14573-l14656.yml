    purity lies in none of the five attributes remaining.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The investigating Muni knows dependencies and things relied upon; after knowing
    them, he is liberated, does not enter dispute, and does not go to reiterated existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some people abide by their own views, enter contest, and assert themselves
