canonical_text:
  quote: ''
  summary: 'The passage presents repeated dyadic contemplations: pain arises from
    craving, seizures, or exertions, while the complete destruction of these through
    absence of passion prevents the origin of pain. The teaching promises perfect
    knowledge or the state of a non-returner for the strenuous monk. Verses describe
    craving as sustaining transmigration, seizures as leading to existence, birth,
    death, and pain, and their destruction as preventing rebirth.'
  language: English
  quote_policy: summarized
