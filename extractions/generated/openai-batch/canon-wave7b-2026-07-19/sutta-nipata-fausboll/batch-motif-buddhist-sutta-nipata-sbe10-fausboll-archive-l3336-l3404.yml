canonical_text:
  quote: Mara, the tempter, never finds the way.
  summary: The passage gives didactic verses on true knowledge, the fool, and wise
    association. The virtuous and emancipated are inaccessible to Mara. A lily growing
    from roadside rubbish is compared to the Buddha's disciple shining by knowledge
    among blinded worldlings. Further verses contrast the long life of ignorance with
    knowing the true law, recommend solitary travel over foolish companionship, condemn
    possessive delusion about sons and wealth, distinguish fools who know their foolishness
    from fools who think themselves wise, and compare unreceptive and receptive learners
    to a spoon and a tongue tasting soup. Editorial notes cite Buddhist and Mahabharata
    parallels; the final verse 66 is only fragmentary in the supplied passage.
  language: English
  quote_policy: quoted
