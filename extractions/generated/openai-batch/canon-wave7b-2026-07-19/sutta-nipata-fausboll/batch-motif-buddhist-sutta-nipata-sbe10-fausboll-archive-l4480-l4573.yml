  summary: Chapter XIII, “The World,” gives admonitions against evil, thoughtlessness,
    false doctrine, and worldliness; urges virtue; compares the world to a bubble,
    mirage, and glittering royal chariot; contrasts fools and the wise; depicts rare
    escape from the world, heavenly going, conquest of Mara, generosity, and a note
    on stream-entry stages toward Nirvana.
