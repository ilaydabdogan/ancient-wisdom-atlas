canonical_text:
  quote: ''
  summary: 'The passage first describes a liberated Muni who has laid down his burden.
    It then presents a question to Bhagavat about seclusion, peace, and how a Bhikkhu
    is extinguished without grasping. Bhagavat answers with instructions: cut off
    delusion and cravings, learn Dhamma without pride, avoid self-comparison and adornment,
    be inwardly appeased and still like the deep sea, restrain the senses, endure
    illness and danger without lament, avoid storing requisites, live meditatively
    in a quiet dwelling, maintain wakefulness, abandon sensual and frivolous conduct,
    and avoid occult or divinatory practices.'
  language: English
  quote_policy: summarized
