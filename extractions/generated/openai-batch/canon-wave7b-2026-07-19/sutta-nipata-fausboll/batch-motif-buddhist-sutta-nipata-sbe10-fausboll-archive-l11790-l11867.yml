canonical_text:
  quote: ''
  summary: 'The passage opens the Selasutta with a prose synopsis: Keniya invites
    Buddha and his assembly to a meal; Sela the Brahmana later hears of the preparations,
    seeks Buddha, converses with him, and is converted along with his followers. In
    the narrative, Bhagavat arrives at Apana in Anguttarapa with 1250 Bhikkhus. Keniya,
    an ascetic with matted hair, hears praise of the venerable Gotama and his teaching,
    visits him, receives religious talk, and invites Gotama and the assembly to eat
    with him the next day. Gotama notes the large size of the assembly and Keniya''s
    Brahmana connections; after Keniya repeats the invitation, Gotama silently assents.'
  language: English
