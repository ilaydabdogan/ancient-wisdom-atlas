canonical_text:
  quote: let one wander alone like a rhinoceros.
  summary: A sequence of verses advises solitary wandering. The passage contrasts
    affection for companions, children, and household ties with renunciation; allows
    companionship only with a clever, righteous, wise associate; uses images of a
    lone rhinoceros, fallen leaves, a king abandoning a kingdom, striking bracelets,
    and an elephant leaving its herd; and urges overcoming sensual pleasures, physical
    hardships, social quarrels, philosophical views, and dependence on others.
  language: English
  quote_policy: quoted
