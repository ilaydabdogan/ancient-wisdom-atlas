canonical_text:
  quote: ''
  summary: 'The end of the Parabhavasutta presents a dialogue in which a deity asks
    Bhagavat to name further causes of loss, and Bhagavat lists sexual misconduct,
    jealous attachment to a young wife, placing a drunken or wasteful person in authority,
    and craving for kingship despite little property. A wise person considers these
    losses and cultivates the happy world of the gods. The passage then begins the
    Vasalasutta: Bhagavat goes into Savatthi for alms, approaches the house of the
    Brahmana Aggikabharadvaga where a fire is blazing and an offering is prepared,
    is insulted as an outcast, and responds by asking whether the Brahmana knows what
    makes an outcast. The Brahmana asks Gotama to teach him.'
  language: English
  quote_policy: summarized
