  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Mara says he followed Bhagavat step by step for seven years and found no fault
    in the perfectly enlightened, thoughtful Buddha.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mara compares his attempt to a crow hovering around a rock that looks like
    fat, finding nothing sweet, and going away; he says they will go away from Gotama
    in the same way.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: While overcome with sorrow, the string of Mara's lute slips down, and the
    evil-minded Yakkha disappears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Subhasitasutta, Bhagavat dwells at Savatthi in Jetavana and addresses
