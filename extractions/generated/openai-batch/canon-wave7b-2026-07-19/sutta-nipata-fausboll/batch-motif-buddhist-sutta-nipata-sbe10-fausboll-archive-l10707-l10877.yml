canonical_text:
  quote: ''
  summary: The passage closes the Padhanasutta with a speaker identified as Bhagavat/Gotama
    confronting Mara, describing ascetic exertion, naming Mara's army of vices, resolving
    to battle and later teach disciples, and presenting Mara's disappointed withdrawal.
    It then gives the Subhasitasutta, where Bhagavat teaches Bhikkhus the requisites
    of well-spoken speech and Vangisa praises harmless, true, and liberating speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that least good work is of no use to him and that he has
    faith, power, and understanding while exerting himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes a burning wind drying river currents and says his blood,
    bile, phlegm, and flesh may dry or waste away during exertion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says that as the body wastes, the mind becomes more tranquil and
    attention, understanding, and meditation become more steadfast; he says his mind
    does not look for sensual pleasures.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker names Mara's armies as lust, discontent, hunger and thirst, craving,
    sloth and drowsiness, cowardice, doubt, hypocrisy and stupor, gain, fame, honour,
    falsely obtained celebrity, self-exaltation, and despising others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says this is Namuci's or the black one's fighting army, that none
    but a hero conquers it, and that one obtains joy after conquering it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker says he wears Munja grass and prefers death in battle to living
    defeated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says he sees an army arrayed on all sides and Mara on his elephant,
    and that he is going out to battle so Mara will not drive him from his place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaker says the army cannot be conquered by the world of men and gods,
    but that he will crush it with understanding like an unbaked earthen pot with
    a stone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker says he will make his thought subject to himself, keep attention
