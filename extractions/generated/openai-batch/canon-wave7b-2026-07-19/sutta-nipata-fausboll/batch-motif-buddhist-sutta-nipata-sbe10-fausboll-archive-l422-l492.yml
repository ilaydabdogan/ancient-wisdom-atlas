  summary: The passage discusses difficulties in dating the Dhammapada. It identifies
    the Buddhist canon and Buddhaghosa's commentary as possible chronological anchors,
    notes bibliographic evidence about commentarial works, argues for careful skepticism
    in dating ancient books, and rejects both manuscript age and language alone as
    safe guides for fixing the date of Sanskrit or Pali texts.
