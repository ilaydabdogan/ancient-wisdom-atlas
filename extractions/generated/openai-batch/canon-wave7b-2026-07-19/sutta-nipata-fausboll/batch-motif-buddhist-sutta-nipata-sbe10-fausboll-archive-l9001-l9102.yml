canonical_text:
  quote: ''
  summary: A group of Yakkhas declare refuge in the Buddha and devotion to the Dhamma.
    In the Alavakasutta, the Yakkha Alavaka approaches the Buddha, repeatedly orders
    him to enter and come out, threatens him with supernatural violence if he cannot
    answer questions, and then asks questions about the best human possession, happiness,
    sweetness, the best life, crossing the stream and sea, conquering pain, and purification.
    The Buddha answers with faith, Dhamma, truth, understanding, zeal, and exertion.
  language: English
  quote_policy: summarized
