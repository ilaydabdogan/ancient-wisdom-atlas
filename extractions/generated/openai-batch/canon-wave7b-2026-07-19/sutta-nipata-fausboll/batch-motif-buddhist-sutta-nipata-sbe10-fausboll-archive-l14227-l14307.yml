canonical_text:
  quote: ''
  summary: The passage from Pasorasutta criticizes disputants who seek praise, quarrel
    in assemblies, claim exclusive truth, and become elated or distressed by victory
    and defeat. It advises leaving off dispute and describes non-opposing renunciants
    who grasp nothing as best. A following Magandiyasutta introduction and first verse
    summarize Magandiya offering his daughter to Buddha and Buddha refusing, citing
    lack of sexual desire and the body’s impurity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people are described as devoted to what they call good and as entering
    extensively upon single truths.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those wishing for dispute enter the assembly, call one another fools, seek
    praise, and call themselves experts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A disputant in the middle of the assembly attacks on all sides and becomes
    discontented and angry when his dispute is repulsed and he receives blame.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When testers of his questions say that his dispute is lost and repulsed, the
    defeated disputant laments and says that another has conquered him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Disputes among the Samazas are said to involve blow and stroke, and the passage
    advises leaving off disputing because no advantage besides praise is obtained.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A praised disputant laughs and becomes elated after winning, but the passage
    says that his exaltation is also the field of his defeat and that experts do not
    call this purification.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: A simile describes a hero nourished by kingly food who roars and seeks an
    adversary.
  category: other
  evidence_refs:
  - ev:8
- id: obs:8
  text: Those who embrace a philosophical view and maintain that only it is true are
    to be told that there is no opponent for them; those secluded without opposing
    view to view grasp nothing in the world as best.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:9
  text: Pasira is addressed as having reflected over philosophical views and as having
    gone into the yoke with one who has shaken off all sin, but he will not be able
    to proceed together with him.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:10
  text: The prose introduction to Magandiyasutta says that Magandiya offers Buddha
    his daughter for a wife, while Buddha refuses her; it also contrasts Magandiya’s
    claim about purity from philosophy with Buddha’s claim about inward peace.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:11
  text: Buddha says that even seeing the daughters of Mara produced no wish for sexual
    intercourse, and he describes the offered body as full of water and excrement
    and not something he wants to touch with his foot.
  category: speech
  evidence_refs:
  - ev:13
