canonical_text:
  quote: ''
  summary: The passage describes qualities by which the Tathagata deserves oblation,
    including liberation, purity, and enlightenment. Sundarikabharadvaga asks that
    his offering be accepted, but Bhagavat says Buddhas do not enjoy what is obtained
    by stanzas and directs him to serve worthy perfected ones with other food and
    drink. Sundarikabharadvaga asks whom to seek as worthy of gifts, and Bhagavat
    identifies one free from quarrels, lusts, sloth, and sin, who knows birth and
    death and is endowed with wisdom. Sundarikabharadvaga then praises Gotama’s teaching
    through similes of raising the fallen, revealing the hidden, showing the way to
    the lost, and holding a lamp in darkness.
  language: English
  quote_policy: summarized
