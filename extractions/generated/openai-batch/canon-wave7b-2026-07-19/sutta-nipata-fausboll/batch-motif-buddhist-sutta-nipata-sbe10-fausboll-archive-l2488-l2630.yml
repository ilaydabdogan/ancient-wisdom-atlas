canonical_text:
  quote: ''
  summary: 'The passage is a scholarly introduction about spelling Buddhist terms.
    The author explains that he once favored retaining Sanskrit forms for Pali Buddhist
    terms, acknowledges objections based on local Pali and regional usage, discusses
    examples such as Nirvana/Nibbana, Buddhaghosa/Buddhaghosha, Samana/Sramana, Tripitaka/Tipitaka,
    and Dhammapada/Dharmapada, then states a revised policy: use Pali forms when quoting
    Pali or treating Theravada contexts, but prefer Sanskrit forms for Sanskrit sources
    and general discussion of Buddhism.'
  language: English
  quote_policy: summarized
