canonical_text:
  quote: ''
  summary: 'The passage concludes Dhammikasutta with instructions for uposatha abstinence,
    offerings of food and drink to Bhikkhus, maintenance of parents, honorable trade,
    and a heavenly destination among gods called Sayampabhas. It then opens Pabbaggasutta:
    a synopsis states that King Bimbisara tries to tempt Buddha with wealth and is
    rebuked; the verses praise Buddha''s ascetic life, describe his rejection of house-life,
    moral purification, alms-round in Ragagaha/Giribbaga, and Bimbisara seeing him
    from the palace and sending messengers after him.'
  language: English
