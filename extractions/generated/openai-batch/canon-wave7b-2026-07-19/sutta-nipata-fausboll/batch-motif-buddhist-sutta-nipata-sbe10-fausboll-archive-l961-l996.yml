canonical_text:
  quote: ''
  summary: A learned person is described as composing Buddhist scholastic works. Revata
    Thera advises him that the Sinhalese commentaries are genuine and should be studied
    and translated according to Magadhan grammar for the welfare of the world. After
    this advice, the learned person travels to the island, listens to the Sinhalese
    commentaries and Theravada at the Mahavihara, petitions the priesthood for access
    to books, and is tested with two gathas before receiving full access.
  language: English
  quote_policy: summarized
