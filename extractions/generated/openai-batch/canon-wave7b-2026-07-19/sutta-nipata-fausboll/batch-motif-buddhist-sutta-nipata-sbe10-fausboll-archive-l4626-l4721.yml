canonical_text:
  quote: ''
  summary: 'The passage gives verses attributed to the teaching of the Awakened: avoid
    sin, do good, purify the mind, practice patience and restraint, reject harm and
    insult, moderate eating, solitude, and high contemplation. It then teaches that
    lusts are not satisfied by wealth or heavenly pleasures, and that the fully awakened
    disciple delights in the destruction of desires. Finally, it contrasts fear-driven
    resort to mountains, forests, groves, and sacred trees with refuge in Buddha and
    the Law; notes identify related textual parallels and gloss sacred trees as tree
    shrines.'
