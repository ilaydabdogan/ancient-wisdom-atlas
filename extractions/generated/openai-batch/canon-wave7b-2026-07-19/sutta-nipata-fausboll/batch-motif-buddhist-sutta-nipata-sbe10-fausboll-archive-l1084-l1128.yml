canonical_text:
  quote: ''
  summary: The passage discusses the transmission of the Tipitaka and Atthakatha to
    Ceylon by Mahinda, their oral promulgation, the possible division of memorized
    sections among priests, and the later writing of the Pali canon and commentaries
    under Vattagamani so that the religion might endure. It also argues for a chain
    of textual transmission through Buddhaghosa’s redactions and cautions that beyond
    Mahinda the account enters legendary history.
