canonical_text:
  quote: ''
  summary: Instructional verses identify the eightfold way and four truths, urge self-effort,
    describe impermanence, suffering, and unreality of forms, prescribe discipline
    and zeal, present desire as a forest to be cut down, warn that death suddenly
    seizes the heedless, and urge clearing the way to Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names the eightfold way as the best of ways, the four words as
    the best of truths, passionlessness as the best virtue, and the seeing person
    as the best of men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this way is the only way that leads to the purifying of intelligence
    and that following it is the confusion of Mara.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says that going on the way ends pain and that the way was preached
    after understanding the removal of thorns.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Individuals must make effort themselves; Tathagatas are described as only
    preachers, and thoughtful way-enterers are freed from the bondage of Mara.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Created things are said to perish, to be grief and pain, and all forms are
    said to be unreal; one who knows and sees this becomes passive in pain and reaches
    the way to purity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A lazy and idle person who does not rouse himself when it is time to rise
    is said never to find the way to knowledge.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage instructs a person to watch speech, restrain mind, avoid bodily
    wrong, and keep three roads of action clear to achieve the way taught by the wise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Zeal is said to gain knowledge, while lack of zeal loses knowledge; this is
    described as a double path of gain and loss.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Desire is imaged as a forest and undergrowth that should be cut down wholly,
    not merely one tree, so that Bhikshus become rid of the forest and desires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man's desire toward women, even when small, is said to keep his mind in
    bondage like a milk-drinking calf bound to its mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage instructs cutting out love of self like an autumn lotus by hand,
    cherishing the road of peace, and notes that Nirvana has been shown by Sugata,
    identified as Buddha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A fool is described as planning seasonal dwelling for rain, winter, and summer
    while not thinking of death.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Death is described as coming and carrying off a distracted man, as a flood
    carries off a sleeping village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sons, father, relations, and kinsfolk are said to be no help to one whom death
    has seized; a wise and well-behaved man should quickly clear the way to Nirvana.
  category: relationship
  evidence_refs:
  - ev:9
