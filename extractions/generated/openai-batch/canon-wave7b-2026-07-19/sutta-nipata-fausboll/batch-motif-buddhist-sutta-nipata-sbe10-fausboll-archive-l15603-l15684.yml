canonical_text:
  quote: ''
  summary: A concluding answer to Punnaka says that one free from commotion, passion,
    woe, and craving has crossed over birth and old age. Mettagi then asks Bhagavat
    why beings are subject to pain and how the wise cross the stream of birth, old
    age, sorrow, and lamentation. Bhagavat answers that pains arise from upadhis,
    instructs non-creation of upadhi, explains Dhamma for overcoming desire, and teaches
    non-attachment. Mettagi praises the teaching, bows, and asks for continued admonition.
  language: English
  quote_policy: summarized
