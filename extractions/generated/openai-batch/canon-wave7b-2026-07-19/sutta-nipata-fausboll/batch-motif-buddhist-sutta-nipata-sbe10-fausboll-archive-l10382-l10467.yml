canonical_text:
  quote: ''
  summary: The passage closes a teaching on right wandering through restraint, then
    opens the Dhammikasutta. At Savatthi, Dhammika and five hundred lay followers
    approach the Buddha. Dhammika asks how a disciple should live, whether as one
    who goes from house to wilderness or as a householder. He praises the Buddha as
    knower of the worlds, revealer of Dhamma, remover of the veil, and superior to
    rival disputants. He recalls Eravana and Vessavana Kuvera coming to hear or ask
    about Dhamma and departing delighted. Dhammika asks the Buddha to teach the assembled
    monks and lay followers. The Buddha begins by saying he will teach the Dhamma
    that destroys sin and instructs monks about the proper mode of life, including
    the right time for going to the village for alms.
  language: English
  quote_policy: summarized
