canonical_text:
  quote: ''
  summary: The passage first gives four Uragasutta stanzas in which a Bhikkhu free
    from affections, fear, desire, obstacles, suffering, and doubt leaves both shores
    like a snake leaving its old skin. It then introduces the Dhaniya dialogue, contrasting
    the herdsman Dhaniya’s worldly security with Buddha/Bhagavat’s religious security.
    In the opening dialogue, Dhaniya cites food, milked cows, household shelter, family,
    earnings, and cattle, while Bhagavat cites freedom from anger, extinguished passions,
    crossing by raft to the further bank, a disciplined mind, and freedom from service.
    Both repeatedly invite the sky to rain.
  language: English
  quote_policy: summarized
