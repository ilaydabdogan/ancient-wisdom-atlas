literal_observations:
- id: obs:1
  text: The passage cites objections to Bühler's reading of Asoka's edicts and states
    that, if the inscriptions were by Asoka, their internal date would mean 256 years
    after Buddha's Nirvana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says Asoka is the only known king fitting a thirty-fourth year
    since reign and conversion, and infers that by Asoka's time Buddha was believed
    to have died about 477 B.C.; the copying and reading of the inscriptions remain
    in doubt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Gaina chronology reports Mahavira's death as 526/527 B.C. in Svetambara
    and Digambara reckonings, while another tradition gives 470 B.C.; the passage
    says these dates suggest a two-century rather than one-century distance from Asoka
    or Kandragupta to Buddha's contemporaries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies Mahavira with Nigantha Nataputta and states that he
    died at Pava during Buddha's lifetime.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says the inscriptions of Sahasram, Raipnath, and Bairat supported
    the date 477 B.C. for Buddha's death and then tests the date against the Dipavamsa
    and the Buddhist theravali.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The reconstructed chronology says Upali rehearsed the Vinaya at the First
    Council in 477 B.C., had been in orders sixty years in 461 B.C., was born in 541
    B.C., and died in 447 B.C.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dasaka is said to receive orders from Upali in 461 B.C.; the passage gives
    alternative dates for Saunaka's ordination, notes a chronological fault, and dates
    Dasaka's death to 397.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Saunaka is said to ordain Siggava after forty years in orders, and the passage
    calculates Saunaka's death date while noting a discrepancy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Siggava is said to ordain Tishya Maudgaliputra after being in orders sixty-four
    years, with the date calculated as 312 B.C. and compared to Kandragupta's accession.
  category: sequence
  evidence_refs:
  - ev:8
