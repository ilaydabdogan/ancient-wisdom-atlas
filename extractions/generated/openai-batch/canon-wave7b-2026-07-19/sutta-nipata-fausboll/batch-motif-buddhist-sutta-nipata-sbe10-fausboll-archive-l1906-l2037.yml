  quote: ''
  summary: A historiographical introduction discusses proposed dates for Buddha's
    death using Asoka's edicts, Gaina/Jaina chronology for Mahavira, the Dipavamsa,
    and a reconstructed Buddhist succession of elders. The passage is chronological
    and scholarly rather than a mythological narrative.
