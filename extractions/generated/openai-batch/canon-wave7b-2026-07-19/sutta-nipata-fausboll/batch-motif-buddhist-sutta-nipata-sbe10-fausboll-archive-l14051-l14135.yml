canonical_text:
  quote: ''
  summary: The passage advises a Bhikkhu not to depend on sensory impressions, thoughts,
    knowledge, virtue, works, or philosophical views. It describes a Brahmana who
    adopts no view, has gone to the other shore, and does not return. The following
    sutta states that life is short, selfishness and possessiveness bring grief, what
    is called mine is left behind at death, the dead beloved is no longer seen like
    a dream after waking, only the name remains, and the unattached renunciant leaves
    greed and does not reappear in existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An expert is said to call dependence a tie when it causes one to look upon
    anything else as bad; a Bhikkhu is told not to depend on what is seen, heard,
    thought, or on virtue and works.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage instructs the practitioner not to form a philosophical view by
    knowledge or by virtue and works, and not to represent himself as equal, low,
    or distinguished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: One who has left what has been grasped is described as not seizing anything,
    not depending even on knowledge, not associating with those taken up by different
    things, and not returning to a philosophical view.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One without desire for reiterated existence here or in another world is said
    to have no mental resting-places among doctrines.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Brahmana who adopts no view is described as not dependent upon virtue and
    works, as having gone to the other shore, and as not returning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that life is short, that one dies within a hundred years
    or, if living longer, dies of old age.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: People are said to grieve from selfishness; cares kill them; what a person
    thinks of as mine is left behind by death; the wise are advised not to turn to
    worldliness and not to live in a house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man who has awakened is said not to see what he met in sleep; likewise,
    one does not see the beloved person who has passed away and died.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Persons may have been seen and heard and named, but for one who has passed
    away only the name remains undecayed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The greedy do not leave sorrow, lamentation, and avarice; Munis are described
    as leaving greediness and wandering while seeing security, glossed as Nibbana.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Bhikkhu who wanders unattached and cultivates the mind of a recluse is said
    not to show himself again in existence.
  category: attribute
  evidence_refs:
  - ev:5
