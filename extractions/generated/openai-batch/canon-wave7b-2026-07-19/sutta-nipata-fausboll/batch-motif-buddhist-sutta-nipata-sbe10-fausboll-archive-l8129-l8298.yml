canonical_text:
  quote: let one wander alone like a rhinoceros.
  summary: 'The passage concludes a section of Khaggavisanasutta with repeated instructions
    for a renunciant to abandon craving, harmful companions, household ties, sensual
    pleasure, and mental obstacles, using animal, plant, water, fire, net, and robe
    imagery. It then opens Kasibharadvagasutta: Bhagavat/Gotama comes to a Brahmana''s
    agricultural worksite and food distribution, is reproached for eating without
    ploughing and sowing, and replies that he too ploughs and sows.'
  language: English
  quote_policy: quoted
