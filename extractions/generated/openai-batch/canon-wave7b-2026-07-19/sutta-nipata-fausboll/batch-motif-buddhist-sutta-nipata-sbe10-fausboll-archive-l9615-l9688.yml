canonical_text:
  quote: ''
  summary: 'The excerpt closes a teaching that repeatedly names moral, familial, ascetic,
    and contemplative practices as the highest blessing, ending with the safety of
    those who do such things. It then opens Sukilomasutta: Bhagavat dwells at Gaya
    on a stone seat in a yakkha realm; two yakkhas pass by, and Sifiloma/Safiloma
    tests him, touches him, and threatens violence if he cannot answer a question.
    Bhagavat says he is not afraid and rejects the threat.'
  language: English
  quote_policy: summarized
