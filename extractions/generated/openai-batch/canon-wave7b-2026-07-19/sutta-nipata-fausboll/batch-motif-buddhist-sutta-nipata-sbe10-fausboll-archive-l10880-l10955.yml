canonical_text:
  quote: ''
  summary: By the river Sundarika in Kosala, Sundarikabharadvaga performs fire worship
    and seeks an enjoyer of the remaining oblation. He approaches Bhagavat seated
    at a tree root with the oblation and a waterpot, questions him about family and
    Brahmana status, and receives replies rejecting caste identity, describing houseless
    renunciation, invoking the Savitti, and redirecting the offering toward an accomplished,
    calm recipient.
  language: English
  quote_policy: summarized
