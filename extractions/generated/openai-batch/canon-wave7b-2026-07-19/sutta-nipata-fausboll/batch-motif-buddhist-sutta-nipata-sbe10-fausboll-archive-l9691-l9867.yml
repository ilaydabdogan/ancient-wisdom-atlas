canonical_text:
  quote: ''
  summary: The passage contains the end of a dialogue in which the Yakkha Stiloma
    asks the Buddha about the origin of passion, hatred, disgust, delight, horror,
    and doubt; the Buddha explains their bodily and desirous origin and says that
    knowing the source enables crossing a difficult stream and avoiding rebirth. The
    Dhammakariyasutta admonishes monks to live purely, warns against harsh, quarrelsome,
    and sinful conduct, and urges the community to avoid corrupt members. The beginning
    of the Brahmanadhammikasutta presents wealthy old Brahmins asking Gotama about
    ancient Brahmin customs, followed by a description of early Brahmins as restrained,
    chaste, materially poor, supported by lay people, and performing sacrifices without
    killing cows.
  language: English
  quote_policy: summarized
