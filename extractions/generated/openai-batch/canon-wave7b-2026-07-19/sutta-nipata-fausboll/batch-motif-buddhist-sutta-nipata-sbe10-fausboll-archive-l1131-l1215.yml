canonical_text:
  quote: ''
  summary: The passage discusses the date and transmission of the Buddhist canon,
    including its reduction to writing in Ceylon under King Va¢fagamani, the question
    of earlier collected forms as the three Pitakas or baskets, and source-critical
    debate over the Kathavatthu. It contrasts Childers's correction about Kathavatthu
    with a Dipavamsa account in which Moggaliputta destroys schismatic doctrines,
    establishes the Theravada, and proclaims or sets forth the Kathavatthu. It then
    begins an abstract of the Tipitaka, starting with the Vinaya-pitaka.
  language: English
