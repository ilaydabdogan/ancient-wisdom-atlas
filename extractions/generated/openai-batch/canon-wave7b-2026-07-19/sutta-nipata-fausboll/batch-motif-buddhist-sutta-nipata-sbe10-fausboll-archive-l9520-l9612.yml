canonical_text:
  quote: ''
  summary: 'The excerpt concludes a teaching in which a wise man is described as guarded
    in the senses and a Brahmana hears the Buddha, worships the Tathagata’s feet,
    and takes orders. It then gives verses on true friendship, distinguishing false
    friends from an inseverable friend, and praises the sweetness of seclusion, tranquillity,
    and the Dhamma. The opening of the Mahamangalasutta follows: at night a radiant
    deity approaches Bhagavat in Getavana and asks for the highest blessing; Buddha
    begins by counseling avoidance of fools and association with wise men.'
  language: English
  quote_policy: summarized
