canonical_text:
  quote: ''
  summary: An introductory note quotes a Mahavamsa story about a learned Brahman youth
    later called Buddhaghosa. Born near the great Bo-tree in Magadha, he becomes a
    disputant and wanderer, recites a learned discourse in a vihara, encounters Mahathera
    Revata, is refuted in debate, fails to understand an Abhidhamma passage described
    as Buddha’s mantra, enters the sacerdotal order to learn it, converts to the faith,
    and receives the name Buddhaghosa because of his eloquence.
  language: English
  quote_policy: summarized
