canonical_text:
  quote: '"this is pain, this is the origin of pain"'
  summary: 'The passage closes a brief statement on the Muni''s wisdom, then opens
    the Dvayatanupassanasutta. Bhagavat sits at Savatthi on the full-moon Uposatha
    evening among silent Bhikkhus and teaches that noble liberating Dhammas are heard
    for right understanding of two Dhammas: pain and its origin, and the destruction
    of pain and the way leading to that destruction. Those who do not understand this
    remain subject to birth and decay, while those who understand can end samsara
    and not undergo birth and decay. The teaching also states that pain arises from
    upadhis and ceases with their complete destruction.'
  language: English
  quote_policy: quoted
