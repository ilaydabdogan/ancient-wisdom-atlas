canonical_text:
  quote: ''
  summary: The passage closes the Vatthugathas and opens Agita's questions. Agita
    silently asks about Bavari's marks, and Bhagavat answers; the crowd notices that
    unspoken questions have been answered. Agita then asks about the head and head-splitting,
    and Bhagavat identifies ignorance as the head and knowledge as what cleaves it.
    Agita salutes Bhagavat, conveys Bavari's homage, receives permission to ask, and
    begins a set of doctrinal questions about the world, ignorance, desire, streams,
    thoughtfulness, understanding, and name-and-shape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says that a person recites five hundred in the marks, Itihasa, Nighandu,
    and Ketubha, and has reached perfection in his own Dhamma.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agita thinks a request for Bhagavat to explain the marks of Bavari; Bhagavat
    answers with bodily details including the tongue, hair between the eyebrows, and
    a hidden privy member.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The multitude hears answers without hearing any spoken question and, overjoyed
    with joined hands, wonders who asked the questions mentally.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agita asks about the head and head-splitting; Bhagavat replies that ignorance
    is the head and knowledge cleaves the head together with listed qualities.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man composes himself, puts his hide on one shoulder, falls at Bhagavat's
    feet with his head, and says that Bavari and his disciples do homage to Bhagavat's
    feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bhagavat wishes gladness and long life to Bavari, Bavari's disciples, and
    the young man, and invites them to ask whatever they wish.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After receiving permission from Sambuddha, Agita sits with folded hands and
    asks Tathagata the first question.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Agita asks what shrouds the world, why it does not shine, what its pollution
    is, and what its great danger is; Bhagavat answers with ignorance, avarice, desire,
    and pain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Agita asks about streams of desire flowing in every direction and how they
    are dammed, restrained, and shut off; Bhagavat answers that thoughtfulness is
    their dam and restraint, and that understanding shuts them off.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Agita asks about understanding, thoughtfulness, name and shape, and by what
    this is stopped.
  category: speech
  evidence_refs:
  - ev:9
