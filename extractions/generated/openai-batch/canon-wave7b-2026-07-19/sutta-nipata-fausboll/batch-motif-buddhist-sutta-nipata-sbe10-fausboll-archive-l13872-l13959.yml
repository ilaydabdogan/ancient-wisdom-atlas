canonical_text:
  quote: ''
  summary: The passage describes a wise person or Muni who has subdued desire, does
    not cling to what is seen and heard, crosses a stream without grasping, pulls
    out the arrow of passion, and does not wish for either this world or the other.
    It then contrasts the independent Muni, who has shaken off philosophical views
    and does not undergo censure, with people led by wishes, self-praisers, and those
    who adopt and reject dogmas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wise man is said to have subdued his wish for both ends, understood touch,
    avoided greed, and not clung to what is seen and heard.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Muni is instructed to cross over the stream after understanding name and
    while not being defiled by grasping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Muni is described as having pulled out the arrow of passion, wandering
    strenuously, and not wishing for this world or the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both wicked-minded and just-minded people censure, but the Muni does not undergo
    the censure that has arisen.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A person led by wishes and inclinations is described as unable to overcome
    his own false view and as speaking according to his understanding.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who praises his own virtue and holy works without being asked is
    called ignoble by the good.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A calm and happy-minded Bhikkhu who does not praise himself for his virtues
    is called noble and is described as having no desires anywhere in the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says fabricated and confused Dhammas are placed in front, that
    dogmas of philosophy are not easy to overcome, and that a man rejects and adopts
    Dhamma among dogmas.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: One who has shaken off sin is said to have no prejudiced view of different
    existences, to have left deceit and arrogance behind, and to be independent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A dependent person undergoes censure among the Dhammas, while the independent
    one has nothing grasped or rejected and has shaken off every philosophical view.
  category: relationship
  evidence_refs:
  - ev:8
