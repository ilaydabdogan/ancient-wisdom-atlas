canonical_text:
  quote: ''
  summary: Bhagavat gives a numbered discourse identifying many kinds of persons as
    outcasts because of anger, hatred, deception, violence, theft, debt evasion, murder
    for gain, false witness, sexual misconduct, neglect or abuse of kin, bad counsel,
    concealed wrongdoing, failure in hospitality, deception or abuse of religious
    mendicants, false predictions for gain, pride, avarice, shamelessness, and reviling
    Buddha or his disciple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhagavat is the speaker of the discourse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who is angry, bears hatred, is wicked or hypocritical, has wrong views,
    or is deceitful is described as an outcast.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: One who harms living beings and lacks compassion for living beings is described
    as an outcast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One who destroys or lays siege to villages and towns and is known as an enemy
    is described as an outcast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The discourse lists theft, evasion of a real debt, killing a traveler for
    a small object, and false witness for self, others, or wealth as grounds for being
    known as an outcast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The discourse lists sexual misconduct with wives of relatives or friends,
    failure to support aged parents when rich, and striking or verbally annoying close
    kin or a mother-in-law as grounds for being known as an outcast.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The discourse lists bad advice while concealing something, hiding one's own
    bad deed, failure to return hospitality, deceiving a Brahmana, Samana, or mendicant,
    and verbally annoying a Brahmana or Samana at mealtime without giving anything
    as grounds for being known as an outcast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The discourse lists false prediction for gain, self-exaltation and contempt
    for others, provocation, avarice, sinful desires, envy, wickedness, shamelessness,
    fearlessness of sinning, and reviling Buddha or his disciple as grounds for being
    known as an outcast.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The numbered units repeatedly end with the formula that such a person should
    be known as an outcast.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
