canonical_text:
  quote: ''
  summary: Verses praise reverence for the aged, contrast a single day of virtue,
    wisdom, strength, and insight with a long unrestrained life, and teach that good
    and evil accumulate gradually and later ripen in corresponding results. A translator's
    note compares the verse on revering the aged with Brahmanical and Buddhist parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who always greets and constantly reveres the aged is said to gain
    increase in life, beauty, happiness, and power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A one-day life of virtue, wisdom, reflection, or firm strength is described
    as better than a hundred years of viciousness, ignorance, lack of restraint, idleness,
    or weakness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A one-day life in which a person sees beginning and end, the immortal place,
    or the highest law is described as better than a hundred years without such seeing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person is instructed to hasten toward good and keep thought away from evil;
    doing good slothfully is said to let the mind delight in evil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who commits a sin is told not to repeat it or delight in it, because
    accumulation of evil is painful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who does good is told to repeat it and delight in it, because accumulation
    of good is delightful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An evil-doer is said to see happiness until an evil deed ripens, and then
    to see evil.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A good man is said to see evil days until a good deed ripens, and then to
    see good things.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Falling water-drops filling a water-pot are used as an image for the gradual
    accumulation of both evil in the fool and good in the wise man.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man is instructed to avoid evil deeds, with comparison to a merchant who
    has few companions and carries much wealth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note states that the verse on greeting and revering the aged occurs with
