  quote: ''
  summary: The passage describes the wise person as a Muni who chooses good, avoids
    evil, and weighs both sides as with a balance. It defines an Ariya not by injury
    to living creatures but by pity for all living creatures. It says that discipline,
    vows, learning, trance, and solitary sleeping alone do not secure the happiness
    of release, and links confidence with the extinction of desires. Editorial notes
    discuss the meanings and grammatical interpretation of Muni, Ariya, Bhikshu, and
    the final line.
