canonical_text:
  quote: "“Let a man overcome anger by love, let him overcome evil by good”"
  summary: The passage is a didactic chapter on anger. It instructs a person to abandon
    anger, pride, bondage, attachment to name and form, and ownership; to restrain
    rising anger like a chariot; to answer anger, evil, greed, and falsehood with
    love, good, liberality, and truth; to practice truth, non-anger, giving, non-injury,
    vigilance, and bodily, verbal, and mental control; and it describes sages or wise
    persons as approaching the unchangeable place and receiving praise from discriminating
    people, gods, and Brahman.
  language: English
  quote_policy: quoted
