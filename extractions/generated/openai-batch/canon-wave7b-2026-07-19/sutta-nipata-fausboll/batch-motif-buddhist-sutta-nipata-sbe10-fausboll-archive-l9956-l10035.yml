canonical_text:
  quote: ''
  summary: Wealthy Brahmanas praise Gotama's exposition of Dhamma with images of raising
    what has fallen, revealing what is hidden, showing a path, and holding a lamp
    in darkness, then take refuge in Gotama, the Dhamma, and the Assembly. Navasutta
    advises honoring and associating with a learned teacher, warns against serving
    a foolish and envious teacher, and contrasts a person swept along in a rapid river
    with an expert person in a strong ship who carries many across. The excerpt ends
    with the opening question of Kimsilasutta about virtue, conduct, and the highest
    good, and begins an answer urging honor for old people and freedom from envy.
  language: English
  quote_policy: summarized
