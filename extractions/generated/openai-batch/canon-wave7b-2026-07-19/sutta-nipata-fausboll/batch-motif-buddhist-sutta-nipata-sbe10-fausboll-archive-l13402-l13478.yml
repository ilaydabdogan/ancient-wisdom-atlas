canonical_text:
  quote: ''
  summary: A Buddhist discourse addresses Bhikkhus with repeated dyadic contemplations.
    For consciousness, touch, and sensations, each dyad states that pain arises from
    the condition, while the complete destruction of that condition through absence
    of passion prevents the origin of pain. The diligent Bhikkhu considering the dyad
    may attain perfect knowledge or the state of an Anagamin. Verses contrast those
    ruined by touch, who follow the stream of existence and remain far from the destruction
    of bonds, with those who understand touch and delight in cessation.
  language: English
  quote_policy: summarized
