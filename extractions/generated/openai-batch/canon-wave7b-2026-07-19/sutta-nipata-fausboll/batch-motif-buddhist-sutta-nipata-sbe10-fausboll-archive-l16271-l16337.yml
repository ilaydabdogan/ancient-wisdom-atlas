canonical_text:
  quote: ''
  summary: Pingiya declares constant devotion to Gotama, says Gotama taught the Dhamma
    as the destruction of desire and distress, and describes mental nearness despite
    bodily weakness. He recalls being in mud and moving from island to island before
    seeing the Enlightened one who has crossed the stream. Bhagavat tells Pingiya
    that faith, as with named earlier figures, will deliver him to the further shore
    of the realm of death. A commentator note describes Bhagavat shedding golden light
    and appearing before Pingiya and Bavari. Pingiya then says the veil is removed
    and that he will go to unchangeable Nibbana.
  language: English
  quote_policy: summarized
