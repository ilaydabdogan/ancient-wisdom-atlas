canonical_text:
  quote: ''
  summary: The passage gives didactic verses on lying, evil deeds, misuse of religious
    appearance and alms, coveting a neighbor's wife, careless asceticism, guarding
    oneself, discerning sin correctly, and the different destinations of false and
    true doctrine. It then presents the elephant as an image of endurance and taming,
    contrasting animal taming with self-taming and the way to Nirvana, and describes
    the bound elephant Dhanapalaka longing for the elephant grove. Translator notes
    compare Buddhist niraya with Christian hell and explain the elephant as a Buddhist
    emblem of endurance and self-restraint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who says what is not, or who denies having done something, is said
    to go to hell; after death such people are alike as evil-doers in the next world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many men whose shoulders are covered with the yellow gown are described as
    ill-conditioned and unrestrained, and are said to go to hell by their evil deeds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says it would be better to swallow a heated iron ball like flaring
    fire than for a bad, unrestrained fellow to live on the charity of the land; the
    note identifies this charity as alms given to mendicants from religious duty.
  category: object
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:4
  text: A reckless man who covets his neighbor's wife is said to gain demerit, an
    uncomfortable bed, punishment, and hell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the king imposes heavy punishment in connection with the
    offense of coveting a neighbor's wife, and advises that no man think of her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An Asa grass-blade badly grasped cuts the arm, and badly practiced asceticism
    is said to lead to hell.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A careless act, a broken vow, and hesitant obedience to discipline are said
    to bring no great reward; vigorous action is urged when something is to be done.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An evil deed is said to be better left undone because it leads to later repentance,
    while a good deed is said to be better done because it does not lead to repentance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A person is told to guard himself like a frontier fort with inner and outer
    defenses, because those who let the right moment pass suffer pain in hell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Those with misplaced shame, fear, or judgment of sin are said to embrace false
    doctrines and enter the evil path, while those who discern sin and non-sin correctly
    are said to embrace true doctrine and enter the good path.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The speaker says he silently endured abuse as an elephant in battle endures
    an arrow from the bow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says a tamed elephant is led to battle and mounted by the king,
