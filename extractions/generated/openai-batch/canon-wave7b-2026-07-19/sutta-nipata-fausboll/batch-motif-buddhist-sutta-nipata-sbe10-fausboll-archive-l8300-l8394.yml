canonical_text:
  quote: "“Faith is the seed, penance the rain, understanding my yoke and plough”"
  summary: The brahmana Kasibharadvaga asks Bhagavat to explain his ploughing. Bhagavat
    describes a spiritual ploughing made of faith, penance, understanding, restraint,
    exertion, truth, and thoughtfulness, leading to Nibbana, immortality, and freedom
    from pain. Kasibharadvaga offers rice-milk in a golden bowl, but Bhagavat refuses
    food acquired by reciting stanzas and instructs that it be discarded. When the
    rice-milk is thrown into wormless water, it splashes, hisses, and smokes. Alarmed,
    Kasibharadvaga praises Gotama, takes refuge, and receives pabbagga and upasampada.
  language: English
  quote_policy: quoted
