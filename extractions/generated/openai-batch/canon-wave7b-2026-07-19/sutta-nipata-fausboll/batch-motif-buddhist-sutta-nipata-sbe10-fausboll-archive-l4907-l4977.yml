canonical_text:
  quote: ''
  summary: A sequence of verses contrasts vanity and pleasure with meditation, warns
    against clinging to pleasant or unpleasant things, links pleasure, affection,
    lust, love, and greed with grief and fear, praises virtue and truthfulness, names
    one desiring Nirvana as Ordhvamsrotas or upward-stream, and compares good works
    receiving a departed good person to kin welcoming a safe returnee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who gives himself to vanity and pleasure instead of meditation is
    said eventually to envy one who has exerted himself in meditation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage instructs not to cling to pleasant or unpleasant things and says
    that loss of the beloved is evil.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who love nothing and hate nothing are described as having no fetters.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pleasure, affection, lust, love, and greed are each said to give rise to grief
    and fear, while freedom from each is said to remove grief and fear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person possessing virtue and intelligence, being just, speaking truth, and
    doing his own business is said to be held dear by the world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person with desire for the Ineffable or Nirvana, mental satisfaction, and
    thoughts not bewildered by love is called Ordhvamsrotas, glossed as carried upwards
    by the stream.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note explains Ordhvamsrotas as a technical name for one proceeding through
    higher worlds before the formless world, and also suggests an older sense of swimming
    against the stream rather than being carried away by vulgar passions.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kinsmen, friends, and lovers salute a man who has been long away and returns
    safely from afar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Good works are said to receive one who has done good and gone from this world
    to the other, as kinsmen receive a friend on his return.
  category: action
  evidence_refs:
  - ev:7
