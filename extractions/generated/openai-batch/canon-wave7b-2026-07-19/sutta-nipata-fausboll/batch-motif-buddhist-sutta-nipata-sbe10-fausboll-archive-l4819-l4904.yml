canonical_text:
  quote: There is no fire like passion; there is no losing throw like hatred; there
    is no pain like this body; there is no happiness higher than rest.
  summary: 'The passage gives aphorisms on happiness: passion, hatred, hunger, and
    the body are described as sources of suffering, while rest, Nirvaza, health, contentedness,
    trust, solitude, tranquillity, the law, and association with the wise are described
    as forms or conditions of happiness. It contrasts wise companions with fools and
    ends with an image of following the wise as the moon follows the path of the stars.
    Editorial notes cite parallels and explain terms such as losing throw, khandha,
    and samskara.'
  language: English
  quote_policy: quoted
