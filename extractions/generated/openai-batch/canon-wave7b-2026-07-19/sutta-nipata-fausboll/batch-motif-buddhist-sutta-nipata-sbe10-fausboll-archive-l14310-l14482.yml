canonical_text:
  quote: ''
  summary: Magandiya questions Bhagavat about his doctrine after he does not desire
    a woman described as a pearl desired by many kings. Bhagavat says he adopts no
    philosophical doctrine and has seen inward peace; purity is not established either
    by views, tradition, knowledge, virtue, works, or by their absence. He describes
    the Muni as houseless, free from lust, non-disputing, unstained like a lotus in
    water and mud, not led by views or traditions, and free from marks and ties. In
    the following Purabhedasutta, an interlocutor asks Gotama how one is called calm,
    and Bhagavat describes the calm Muni as free from craving, anger, conceit, attachment,
    temporal dependence, possessions, self-ranking, and desire for existence or non-existence.
  language: English
  quote_policy: summarized
