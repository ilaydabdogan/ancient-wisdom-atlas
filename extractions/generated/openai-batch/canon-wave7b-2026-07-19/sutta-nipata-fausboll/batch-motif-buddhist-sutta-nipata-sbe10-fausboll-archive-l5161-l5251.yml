canonical_text:
  quote: There is no fire like passion, there is no shark like hatred, there is no
    snare like folly, there is no torrent like greed.
  summary: The passage warns against envy over gifts of food and drink, says the uprooting
    of such feeling brings rest, describes passion, hatred, folly, and greed through
    danger images, contrasts seeing others' faults with concealing one's own, and
    distinguishes inward awakening from outward ascetic identity and vanity.
  language: English
  quote_policy: quoted
