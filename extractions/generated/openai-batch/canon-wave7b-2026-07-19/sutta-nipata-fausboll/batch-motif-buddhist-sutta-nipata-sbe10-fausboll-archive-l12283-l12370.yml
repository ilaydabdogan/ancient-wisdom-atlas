canonical_text:
  quote: ''
  summary: 'The passage first concludes a teaching on death and grief: even a very
    long-lived person is separated from relatives, and the wise person subdues lamentation,
    drives away sorrow, and draws out the arrow of grief to gain peace. It then introduces
    the Vasetthasutta: two young men, Vasettha and Bharadvaga, dispute whether one
    becomes a Brahmana by deeds or by birth, fail to convince each other, and decide
    to ask Samana Gotama, who dwells in the Icchanamkala forest.'
  language: English
  quote_policy: summarized
