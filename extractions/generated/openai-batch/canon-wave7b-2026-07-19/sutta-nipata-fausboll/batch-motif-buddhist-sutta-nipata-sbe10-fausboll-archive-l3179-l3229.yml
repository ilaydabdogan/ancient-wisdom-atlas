  summary: The passage contrasts the harm caused by a wrongly directed mind with the
    greater benefit of a well-directed mind. It then asks who can overcome the earth,
    the world of Yama, and the world of the gods, and who can find the path of virtue
    like a clever person finding the right flower. The answer given is the disciple.
    A note explains this overcoming as achieved through knowledge and observes a similarity
    with verses of the Santiparva.
