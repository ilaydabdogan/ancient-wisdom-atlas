canonical_text:
  quote: |-
    Riches destroy the foolish, if they look not
    for the other shore
  summary: The passage warns that craving for riches destroys the foolish, compares
    human moral faults to weeds damaging fields, praises gifts to persons free from
    passion, hatred, vanity, and lust, and describes the restrained Bhikshu who controls
    the senses, speech, body, and mind, dwells in the law, avoids envy, and attains
    freedom from pain or peace of mind.
  language: English
  quote_policy: quoted
