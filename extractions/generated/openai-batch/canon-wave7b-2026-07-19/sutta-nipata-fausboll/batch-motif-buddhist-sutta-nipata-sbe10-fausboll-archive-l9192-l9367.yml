canonical_text:
  quote: ''
  summary: The passage first reflects on the body as impermanent and impure and links
    abandonment of bodily desire with Nibbana. It then defines the Muni as a houseless,
    solitary, self-restrained sage who uproots sin, abandons desire, practices meditation,
    remains unmoved by blame and praise, lives on alms, abstains from sexual intercourse,
    protects living creatures, and is contrasted with a householder. The opening of
    Ratanasutta then addresses assembled spirits, asking them to listen, be kind to
    humans who make offerings, and protect them; it names Buddha, Dhamma, and Sangha
    as excellent jewels by whose truth salvation may occur.
  language: English
  quote_policy: summarized
