  quote: ''
  summary: A series of verses defines the true Brahmana as one who does not kill,
    remains peaceful and truthful, does not take what is ungiven, is desireless and
    liberated, has crossed samsara to the other shore, has abandoned sensual pleasure
    and attachment, is enlightened, and knows former dwellings, heaven and hell, and
    the destruction of births.
