canonical_text:
  quote: ''
  summary: 'The passage presents repeated twofold contemplations: pain arises from
    specific conditions, and with their destruction through absence of passion there
    is no origin of pain. It applies this pattern to arambhas, aharas, and ingitas,
    and describes the disciplined Bhikkhu as abandoning causes, crossing birth and
    transmigration, attaining knowledge or non-returning, standing in the Dhamma,
    and wandering free from desire and seizure.'
