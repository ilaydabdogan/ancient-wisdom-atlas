canonical_text:
  quote: ''
  summary: 'The passage gives instructions for a Bhikkhu: restrained conduct in the
    village, avoidance of harsh speech, meditation, watchfulness, equanimity, proper
    response to teachers and fellow-students, overcoming passion for sense-objects,
    and liberation of mind through reflection on Dhamma and concentration. It closes
    by identifying Bhagavat as the speaker and ending the Sariputtasutta.'
