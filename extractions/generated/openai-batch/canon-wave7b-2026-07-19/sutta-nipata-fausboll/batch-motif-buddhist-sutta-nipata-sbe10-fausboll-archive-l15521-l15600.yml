canonical_text:
  quote: ''
  summary: 'A sequence of question-and-answer verses: Buddha answers Agita on cessation
    and the bhikkhu’s mode of life; Tissametteyya asks who is contented and a great
    man, and Buddha identifies the desire-free, thoughtful bhikkhu; Punnaka asks why
    sages and social classes offered sacrifices to gods and whether offering crosses
    birth and old age, and Buddha says such offerers remained attached to sensual
    pleasures and did not cross over.'
  language: English
  quote_policy: summarized
