  text: After pleasant conversation with Bhagavat, the visitors sit apart, and Vāseṭṭha
    addresses Bhagavat in stanzas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vāseṭṭha says he is a pupil of Pokkharasati and that the young man with him
    is a pupil of Tarukkha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vāseṭṭha says the two young men are accepted masters of the three Vedas and
