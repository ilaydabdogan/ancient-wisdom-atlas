canonical_text:
  quote: ''
  summary: Vāseṭṭha asks Gotama to resolve a dispute about whether a person is a Brahmin
    by birth or by deeds. Gotama begins answering by describing many species of living
    beings and their distinguishing marks, then contrasts these with the lack of abundant
    species marks among humans.
  language: English
  quote_policy: summarized
