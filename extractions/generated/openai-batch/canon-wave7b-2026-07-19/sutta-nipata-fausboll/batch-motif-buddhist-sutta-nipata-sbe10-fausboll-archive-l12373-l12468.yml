  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Vāseṭṭha reports a controversy: Bharadvāja says one is a Brahmin by birth,
    while Vāseṭṭha says one is a Brahmin by deeds.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
