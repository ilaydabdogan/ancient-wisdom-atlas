  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Unruly, thoughtless people are said to neglect what ought to be done, do what
    ought not to be done, and experience increasing desires.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Watchful and wise people direct watchfulness to the body, avoid what ought
    not to be done, do what ought to be done, and their desires come to an end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The verses state that a true Brahmana goes scatheless after killing father
    and mother, two kings, and an eminent man, and after destroying a kingdom with
