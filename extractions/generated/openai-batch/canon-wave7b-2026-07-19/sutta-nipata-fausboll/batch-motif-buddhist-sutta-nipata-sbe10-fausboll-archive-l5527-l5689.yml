canonical_text:
  quote: ''
  summary: A sequence of didactic verses teaches choosing greater over smaller pleasure,
    avoiding harm and negligence, watchfulness directed to the body, the ending of
    desires, wakefulness among Gotama’s disciples, difficulty in renunciation, the
    respect due to faith and virtue, the visibility of good people and hiddenness
    of bad people, and solitary self-subdual near a forest. A translator’s note discusses
    the startling verses about a true Brahmana going scatheless after killings and
    reports allegorical interpretations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wise man is advised to leave a small pleasure when doing so reveals a great
    pleasure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who seeks personal pleasure by causing pain to others is described
