canonical_text:
  quote: ''
  summary: 'The passage gives didactic verses on thought or mind: thought is compared
    to an arrow needing straightening and to a fish trembling out of water; the mind
    is to be tamed, guarded, and bridled; such discipline brings happiness and freedom
    from Mara. It also contrasts fragile bodily existence with a firm thought like
    a fortress and urges attack on Mara with the weapon of knowledge, while noting
    that the body will soon lie on earth like a useless log.'
  language: English
  quote_policy: summarized
