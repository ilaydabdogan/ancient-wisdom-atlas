  summary: The passage describes the Venerable or Arhat as one who has completed the
    journey, abandoned grief and fetters, left home, lives without riches, has perceived
    void and unconditioned freedom, has subdued appetite and senses, is envied by
    gods, remains tolerant and serene, will have no new births, and is quiet in thought,
    word, and deed through true knowledge.
