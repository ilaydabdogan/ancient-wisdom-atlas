  summary: The passage is a source-critical introduction discussing Buddhist and scholarly
    claims about when the canon was settled, whether it was transmitted orally or
    written down, and later evidence from Buddhaghosa, Hiouen Thsang, the Mahavamsa,
    the Dipavamsa, and traditions about Mahinda and King Vattagamani.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Buddhists assign the settlement of their sacred canon to
    the First Council or immediately after Buddha's death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage reports two transmission claims: the canon was handed down orally,
    or was written in books by order of Kasyapa, president of the First Council.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buddhaghosa is described as asserting that the canon before him was the same
    as the one fixed by the First Council.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The editor says some European students adopted the native view that a collection
    of Buddha's doctrines was made after his death at Ragagaha and later settled at
    the Second Council of Vesali, while also warning that possibility does not prove
    truth.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hiouen Thsang is reported as saying that Kasyapa wrote the Tipitaka on palm
    leaves at the end of the First Council; the editor questions the evidentiary weight
    of this late witness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Mahavamsa account, Mahinda, the son of Asoka, spends three years learning
    the Tipitaka by heart from the mouth of a teacher.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The editor notes that the Mahinda account makes no mention of books or manuscripts,
    although such a mention would have been expected if books were central to that
    episode.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Mahavamsa is said to report that wise priests had previously perpetuated
    the Pali canon and its commentary orally.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same report says the priests, foreseeing danger to the people and wishing
    religion to endure for ages, recorded the material in books during King Vattagamani's
    reign.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The editor argues that Buddhaghosa consulted manuscripts and variants, and
    that some manuscripts he used may possibly have dated back to the first century
    B.C.
  category: other
  evidence_refs:
  - ev:8
