canonical_text:
  quote: ''
  summary: Kokaliya repeatedly accuses Sariputta and Moggallana of evil desires. Bhagavat
    repeatedly tells him not to say this and to appease his mind toward them. Kokaliya
    departs after saluting and circumambulating Bhagavat to the right; soon his body
    is covered with boils that enlarge, burst, and lead to his death. After death
    he goes to the Paduma hell because he had shown a hostile mind against Sariputta
    and Moggallana. Brahman Sahampati appears at night, illuminates Jetavana, reports
    this fate to Bhagavat, salutes, circumambulates, and disappears. Bhagavat then
    reports Sahampati’s words to the Bhikkhus.
  language: English
  quote_policy: summarized
