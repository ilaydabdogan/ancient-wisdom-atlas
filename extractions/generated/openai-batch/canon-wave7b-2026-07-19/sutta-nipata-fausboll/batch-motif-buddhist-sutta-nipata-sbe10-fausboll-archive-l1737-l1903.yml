canonical_text:
  quote: ''
  summary: A scholarly introduction discusses competing chronologies for Buddha's
    death/Nirvana and early Buddhist history, presents a chronological table of rulers,
    councils, conversions, and textual milestones, and evaluates later proposals by
    Rhys Davids and Bühler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage attributes disagreement over Buddha's death or Nirvana date to
    different proposed dates for the beginning of Kandragupta's reign and to an additional
    century in the reckoning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Several proposed dates are listed for Buddha''s death: Westergaard reaches
    368 or 370 B.C., Kern reaches 370, 380, or 388 B.C., and the author prefers 477
    B.C.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that dates beyond Kandragupta are tentative and that the
    date assigned to the Council of Vaisali is hypothetical for the present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chronological table places Buddha's birth in 557 B.C., his death in 477
    B.C., and a Council at Ragagaha in 477 B.C. under Kasyapa, Ananda, and Upali.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The table states that Bimbisara was born in 552 B.C., founded Ragagrha, was
    five years younger than Buddha, and met Buddha in 522 B.C.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The table places a Council at Vaisali in 377 B.C. under Yasas and Revata,
    identifying Revata as a disciple of Ananda.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The table describes Asoka as sub-king at Uggayini and pretender before his
    anointing at Pataliputra in 259 B.C.; it later places his conversion by Nigrodha
    in 256 B.C. and his death in 222 B.C.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The table associates 256-253 B.C. with building viharas and stupas, 253 B.C.
    with Mahendra's ordination, and 241 B.C. with Mahendra going to Ceylon.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The table places a Council at Pataliputra around 242 or 241 B.C. under Tishya
    Maudgaliputra.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage summarizes Rhys Davids's chronology as accepting 320 B.C. for
    Kandragupta, assigning 268 B.C. to Asoka's coronation, reducing a traditional
    218 years to 140 or 150, and arriving at 412 B.C. for the Buddhist era; the author
    declines to follow this and prefers Bühler.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage notes that one reckoning of Buddha's Nirvana date coincides with
    a date assigned to the death of Mahavira, founder of the Gaina religion.
  category: relationship
  evidence_refs:
  - ev:9
