canonical_text:
  quote: ''
  summary: Verses on thirst and desire describe attachment as a stronger fetter than
    material bonds. Wise people cut this fetter, leave worldly cares, and go onward.
    The passage uses images of a self-made spider web, a stream of desires, the other
    shore of existence, thorns of life, a last body, and the gift of the law. Notes
    explain the spider simile and connect a no-teacher declaration with Buddha and
    Upaka.
  language: English
  quote_policy: summarized
