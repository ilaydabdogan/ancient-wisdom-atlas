canonical_text:
  quote: ''
  summary: 'The passage presents short didactic verses on what is pleasant: friends
    when needed, enjoyment, good works at death, giving up grief, the states or reverence
    connected with mother and father, the states of a Samavza and a Brahmava, enduring
    virtue, firm faith, intelligence, and avoiding sins. An opening fragment compares
    a low-desire, sin-avoiding person to an elephant in the forest. A note reports
    the commentator''s interpretation of the mother term as reverence rather than
    maternal status.'
