canonical_text:
  quote: ''
  summary: 'The passage gives paired didactic verses: refusing to hold grievance and
    responding with love ends hatred; awareness of mortality ends quarrels; Mara overthrows
    the uncontrolled pleasure-seeker like wind felling a weak tree, but not the disciplined
    person likened to a rocky mountain; an unpurified person is unworthy of the yellow
    dress, while a purified and truthful person is worthy; those who discern truth
    and untruth correctly arrive at truth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons who do not harbour thoughts of abuse, beating, defeat, or robbery
    are said to have hatred cease.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hatred is said not to cease by hatred, but to cease by love, described as
    an old rule.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who know that all must come to an end have their quarrels cease.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who seeks pleasures, has uncontrolled senses, eats immoderately,
    is idle, and is weak is said to be overthrown by Mara like a weak tree thrown
    down by wind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who does not seek pleasures, controls the senses, eats moderately,
    is faithful, and is strong is said not to be overthrown by Mara, like a rocky
    mountain not thrown down by wind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: One who wants to put on the yellow dress without cleansing himself from sin
    and while disregarding temperance and truth is called unworthy of the yellow dress.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: One who has cleansed himself from sin, is grounded in virtues, and has temperance
    and truth is called worthy of the yellow dress.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who imagine truth in untruth and untruth in truth do not arrive at truth
    and follow vain desires, while those who know truth and untruth correctly arrive
    at truth and follow true desires.
  category: sequence
  evidence_refs:
  - ev:9
