canonical_text:
  quote: ''
  summary: Upasiva asks Bhagavat about nothingness, deliverance, consciousness, and
    the status of a liberated Muni after disappearance; Bhagavat answers with instructions
    on abandoning sensual pleasures and doubts, crossing the stream, contemplating
    extinction of craving, and compares the liberated Muni to a flame blown out by
    wind. The passage then begins Nanda’s questions about who is called a Muni and
    whether ascetics and Brahmans who claim purity through views, tradition, virtue,
    and works have crossed birth and old age.
  language: English
  quote_policy: summarized
