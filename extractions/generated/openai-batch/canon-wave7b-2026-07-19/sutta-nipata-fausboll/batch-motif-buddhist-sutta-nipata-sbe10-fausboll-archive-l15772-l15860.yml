- id: obs:1
  text: Bhagavat tells Upasiva to have nothingness in view, reflect on nothing existing,
    abandon sensual pleasures, be free of doubts, cross the stream, and regard the
    extinction of craving day and night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Upasiva asks whether one whose passion for sensual pleasures has departed
    and who is delivered by knowledge will remain there without proceeding further;
    Bhagavat confirms this statement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Upasiva asks whether consciousness remains for one who stays there, becomes
    tranquil, and is delivered.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhagavat says a flame blown by the violence of the wind goes out and cannot
    be reckoned as existing, and compares this to a Muni delivered from name and body
    who disappears and cannot be reckoned as existing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Upasiva asks whether the disappeared one no longer exists or is forever free
    from sickness; Bhagavat answers that for one who has disappeared there is no form
    by which he can be said to be, and that all disputes are cut off when all things
    are cut off.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nanda asks whether a Muni is one possessed of knowledge or of life; Buddha
    answers that experts do not call someone a Muni because of view, tradition, or
    knowledge, but call those Munis who wander free from woe and desire after secluding
    themselves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nanda reports that Samanas and Brahmanas say purity comes from views, tradition,
    virtue, works, and other ways; Bhagavat says that in the way they lived they did
    not cross over birth and old age.
  category: speech
  evidence_refs:
  - ev:7
