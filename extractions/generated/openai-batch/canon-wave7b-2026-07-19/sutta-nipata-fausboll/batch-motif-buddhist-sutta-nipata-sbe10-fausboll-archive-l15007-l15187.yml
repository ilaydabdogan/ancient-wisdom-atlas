canonical_text:
  quote: ''
  summary: The passage concludes the Attadandasutta with instructions to abandon falsehood,
    attachment to form, arrogance, violence, desire, possessiveness, egotism, and
    grasping; desire is described through images of a stream and bog. The opening
    of the Sariputtasutta has Sariputta praise the Buddha as a teacher from Tusita
    who dispels darkness, ask how a Bhikkhu should live in isolated places, and receive
    guidance on facing dangers, enduring hardship, avoiding misconduct, overcoming
    anger and doubt, and practicing moderation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The text instructs the practitioner not to be led into falsehood, not to turn
    affection toward form, to penetrate arrogance, and to wander abstaining from violence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text instructs the practitioner not to delight in what is old, not to
    bear with what is new, not to grieve for what is lost, and not to give himself
    up to desire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The text calls desire greed, a great stream, precipitation, craving, a trouble,
    and a bog of lust difficult to cross.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Muni is described as standing fast on the firm ground of Nibbana, forsaking
    everything, and being called calm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The wise accomplished one understands the Dhamma independently, wanders rightly
    in the world, and does not envy anyone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: One who has overcome lust is said not to grieve or covet, having cut off the
    stream and being without bonds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The text advises laying aside what is before, having nothing behind, and not
    grasping what is in the middle in order to wander calm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The person without desire for name and form and without grief over what is
    no more is said not to decay in the world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: The text states that one who does not think 'this is mine' and does not have
    egotism does not grieve at having nothing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Muni does not reckon himself among the plain, low, or distinguished, and
    does not grasp after or reject anything.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Sariputta says he has not seen or heard of such a beautifully speaking master,
    a teacher arrived from the Tusita heaven.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sariputta says the clearly seeing one appears to the world of men and gods
    after dispelling all darkness and wanders alone among people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Sariputta asks the Buddha a question on behalf of many who are bound in the
    world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: Sariputta describes a Bhikkhu who is loath of the world and uses isolated
    dwellings such as a root of a tree, a cemetery, or caves of mountains.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: Sariputta asks about dangers faced by the Bhikkhu in quiet and distant dwellings
    while going to the immortal region.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: Sariputta asks which words, objects, virtue, works, and study enable the energetic
    Bhikkhu to blow off his own filth like a smith blowing filth from silver.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Buddha says he will explain what is pleasant for one who cultivates a
    lonely dwelling-place and loves perfect enlightenment according to the Dhamma.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:18
  text: 'The Buddha names dangers for the wandering Bhikkhu: gad-flies and other flies,
    snakes, contact with evil men, quadrupeds, adversaries, sickness, hunger, cold,
    and excessive heat.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: The houseless Bhikkhu is instructed to endure hardship and make strong exertions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: The Bhikkhu is instructed not to commit theft or speak falsely, to be friendly
    toward the feeble and the strong, and to drive off agitation of mind as a partisan
    of Kanha or Mara.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The Bhikkhu is instructed not to fall under anger and arrogance, to dig up
