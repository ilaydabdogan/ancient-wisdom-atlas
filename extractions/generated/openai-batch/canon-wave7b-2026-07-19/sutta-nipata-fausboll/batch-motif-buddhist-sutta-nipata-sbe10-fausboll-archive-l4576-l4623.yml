canonical_text:
  quote: ''
  summary: The passage first says that the reward of Sotapatti surpasses heaven and
    lordship over all worlds. It then opens the chapter on the Buddha, describing
    the Awakened as unconquerable, omniscient, trackless, and not led astray by desire.
    Awakened meditative persons are said to be envied by gods. Human conception, mortal
    life, hearing the True Law, and the birth or attainment of the Awakened are each
    called difficult. Notes gloss Buddha as an appellative for one with complete knowledge
    and mention a textual parallel for verse 182.
  language: English
  quote_policy: summarized
