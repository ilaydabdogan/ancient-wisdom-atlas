canonical_text:
  quote: ''
  summary: A speaker warns a foul-mouthed evil-doer that abusive speech and sinful
    deeds lead to hell. The passage describes karmic return of deeds and a sequence
    of hell punishments involving iron rods, red-hot iron, embers, a blazing pyre,
    iron pots, matter and blood, worm-filled water, a sword-leaf forest, a razor-stream,
    and predatory birds and animals. It concludes by urging strenuous conduct and
    guarding speech and mind.
