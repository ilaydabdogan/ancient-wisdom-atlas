canonical_text:
  quote: ''
  summary: A sequence of verses describes thirst or craving as a force that grows
    like a creeper, increases suffering, leads beings from life to life, and binds
    them to repeated birth, decay, and pain. The verses instruct hearers to dig up
    or cut the root of thirst by knowledge, warn that pain returns while its root
    remains, and describe the mendicant striving for passionlessness. The passage
    also uses images of poison, grass, roots, tree-regrowth, water, streams, waves,
    a lotus leaf, reeds, a snared hare, fetters, and a forest/lust wordplay.
  language: English
  quote_policy: summarized
