canonical_text:
  quote: ''
  summary: A deity who had formerly been related to Sabhiya instructs him to live
    the religious life near whoever can explain his questions. Sabhiya learns the
    questions, asks several renowned teachers, and finds that they cannot answer and
    react with anger and counter-questions. Discouraged, he considers returning to
    sensual pleasures, then decides to approach Samana Gotama. Although Gotama is
    young and newly ascetic compared with older teachers, Sabhiya concludes he should
    not be slighted, travels to Rajagaha and Veluvana Kalandakanivapa, meets the Bhagavat,
    converses with him, and sits apart.
  language: English
  quote_policy: summarized
