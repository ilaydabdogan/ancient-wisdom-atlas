canonical_text:
  quote: ''
  summary: A series of verses defines the true Brahmana as a homeless renunciant whose
    longings, covetousness, passions, and bondages are extinguished. The figure is
    described as leaving pleasure and pain, conquering the worlds, knowing the destruction
    and return of beings, being awakened, possessing a path unknown to other beings,
    owning nothing, and knowing former abodes, heaven, hell, and the end of births.
    Translator notes discuss Buddhist technical titles such as Sugata and Tathagata.
  language: English
  quote_policy: summarized
