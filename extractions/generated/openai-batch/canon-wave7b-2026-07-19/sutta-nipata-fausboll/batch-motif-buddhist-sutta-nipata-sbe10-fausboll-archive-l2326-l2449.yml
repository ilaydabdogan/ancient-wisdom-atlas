canonical_text:
  quote: ''
  summary: The passage is a translator’s introduction discussing sources used for
    translating and revising the Dhammapada, especially Fausböll’s Pali edition and
    later scholarly aids. It then surveys Chinese and Tibetan witnesses to Dhammapada-like
    collections, describes the Chinese Fa-kheu-king, and compares its chapter structure
    and verse counts with the Pali text.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The translator says he followed Dr. Fausböll’s Pali edition and used Fausböll’s
    Latin translation, notes, and extracts from Buddhaghosa’s commentary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translator consulted earlier translations or partial translations by several
    named scholars and gives special credit to Dr. Fausböll’s work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In revising the translation, the translator used Childers’ notes and dictionary
    hints, considered James D’Alwis’s review, and consulted renderings by Rhys Davids
    and a French translation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that Beal’s Chinese material showed that Dhammapada-like
    collections were not limited to southern Buddhists, and that Schiefner showed
    the same work in the Tibetan canon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that there are four principal Chinese copies of a Dhammapada-like
    text, with the earliest from the Wu dynasty, and identifies the Fa-kheu-king as
    a work by a Shaman named Wei-4i-lan and others.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Chinese title Fa-kheu-king is explained as meaning the Sutra of Law verses,
    with kheu explained by gāthā, a verse.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Chinese preface says later Shamans copied gāthās from canonical scriptures,
    attached subject titles to sets of verses, and that the extracting and collecting
    was ascribed to Arya-Dharmatrata.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the original of 500 verses was brought from India in 223
