canonical_text:
  quote: ''
  summary: The passage defines several attained or disciplined persons by their freedom
    from sin, bonds, doubt, passions, painful actions, and rebirth. Sabhiya asks Bhagavat
    to explain the grounds for names such as Sottiya, Ariya, Karanavat, and Paribbajaka.
    Bhagavat answers with criteria of understanding Dhamma, liberation, wisdom, non-clinging,
    and abstention from harmful action. Sabhiya rejoices, performs a reverential gesture,
    and praises Bhagavat as one who has gone beyond pain, crossed the darkness of
    the stream, carried him across doubt, and cleared away his doubt.
  language: English
  quote_policy: summarized
