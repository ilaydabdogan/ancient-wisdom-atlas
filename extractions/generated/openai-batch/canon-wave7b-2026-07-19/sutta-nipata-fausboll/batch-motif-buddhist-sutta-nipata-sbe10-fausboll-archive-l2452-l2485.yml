literal_observations:
- id: obs:1
  text: The Fa-kheu-pi-ii is described as a book of parables connected with the Dhammapada,
    translated into Chinese by two Shamans of the western Tsin dynasty.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Fa-kheu-pi-ii parables are said to illustrate the teaching of the verses,
    like Buddhaghosa’s parables, but they are not the same parables and do not illustrate
    all verses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A third Chinese version is called Kuh-yan-king, glossed as the Satra of the
    Dawn, and is said to consist of seven volumes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kuh-yan-king is attributed to DharmatrAta and was translated by Ku-fo-nien,
    about 410 A.D.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The manuscript of the Kuh-yan-king is said to have been brought from India
    by Sanghabhadanga of Kipin, about 345 A.D.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kuh-yan-king is described as a more extensive work of 33 chapters, with
    the last chapter on the Brahmama, as in the Pali text.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A fourth translation is dated to the Sung dynasty and ascribed to Arya-Dharmatraia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Schiefner discovered a Tibetan translation of a Dhammapada in the 28th volume
    of the Sitras, in the collection called Uddnavarga.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tibetan collection contains 33 chapters and more than 1000 verses, of
    which about one-fourth are said to be traceable in the Pali text.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The same collection is also reported in the Tangur, volume 71 of the Satras,
    followed by the Udanavargavivaraxa commentary by A#arya Prag#avarman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Schiefner’s intention to publish a translation was frustrated by his death;
    his last paper is said to give the Tibetan text with translation of the Gathdsangraha
