canonical_text:
  quote: Make thyself an island, work hard, be wise!
  summary: The passage admonishes a person near death to prepare for the journey,
    remove impurities through wisdom and effort, and become free from guilt. It compares
    moral purification to a smith removing impurities from silver and warns that ignorance,
    evil conduct, and lack of restraint lead to harmful consequences in this world
    and the next.
  language: English
  quote_policy: quoted
