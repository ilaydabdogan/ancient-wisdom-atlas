canonical_text:
  quote: ''
  summary: Sabhiya the Paribbajaka comes to Bhagavat with doubts and asks, in successive
    sets, what qualities justify titles such as Bhikkhu, compassionate one, subdued
    one, Buddha, Brahmana, Samana, Nahataka, Naga, Khettagina, Kusala, Pandita, Muni,
    Vedagu, and Anuvidita. Bhagavat answers by defining these titles through liberation
    from rebirth and samsara, non-harming, restraint of the senses, purity, removal
    of bonds, wisdom, and insight into sensations, name and form, and sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sabhiya says he has come anxious and doubtful, wishing to ask questions, and
    Bhagavat replies that he has come from afar and may ask what he wishes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sabhiya is described as rejoicing at the reception given by Gotama before
    asking his first question.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sabhiya asks what makes a man a Bhikkhu, compassionate, subdued, and enlightened;
    Bhagavat answers with qualities including a self-made path, conquered doubt, destruction
    of rebirth, non-harming, crossing the stream, trained senses, and understanding
    samsara.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Sabhiya asks what makes a man a Brahmana, Samana, Nahataka, and Naga; Bhagavat
    answers with removal or washing away of sins, crossing samsara, leaving good and
    evil behind, not entering time among gods and men, committing no crime, and abandoning
    bonds and fetters.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sabhiya asks whom the Buddhas call Khettagina, Kusala, Pandita, and Muni;
    Bhagavat answers with examination of regions, treasures, senses, and Dhamma, deliverance
    from radical bonds, conquest of evil and good, and breaking through the net of
    ties.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sabhiya asks about Vedagu, Anuvidita, Viriyavat, and Aganiya; within this
    passage portion, Bhagavat gives answers for Vedagu and Anuvidita, describing conquest
    of sensations and insight into the delusion of name and form as the root of sickness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The dialogue repeatedly marks Sabhiya as approving, rejoicing, and then asking
    another question.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
- id: obs:8
  text: The answers repeatedly refer to internal and external domains, this and the
    other world, all the world, and divine, human, and Brahman regions or treasures.
  category: setting
