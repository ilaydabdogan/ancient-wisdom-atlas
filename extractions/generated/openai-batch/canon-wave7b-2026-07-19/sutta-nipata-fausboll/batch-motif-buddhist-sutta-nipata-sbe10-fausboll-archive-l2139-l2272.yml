canonical_text:
  quote: ''
  summary: The passage discusses the ambiguous title Dhammapada. It explains possible
    meanings of dhamma as religion, law, or virtue, and pada as place, word, foot,
    footstep, and related senses. It argues that Dhammapada can mean the footstep
    or path of religion, virtue, or law, citing Buddhist verses about earnestness
    as the path to immortality and thoughtlessness as the path of death, as well as
    a Bhikkhu living in the way of the law. It also discusses alternate interpretations
    of the title as law-verses, religious sentences, or scripture texts in several
    scholarly and Buddhist reception traditions.
  language: English
  quote_policy: summarized
