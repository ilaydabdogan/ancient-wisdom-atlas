canonical_text:
  quote: ''
  summary: 'The passage closes the Sundarikabharadvagasutta with Sundarikabharadvaga
    taking refuge, receiving ordination, practicing in solitude, and becoming an arahat.
    It then opens the Maghasutta: at Vulture’s Peak near Rajagaha, the young man Magha
    asks Gotama whether generous giving from justly acquired wealth produces good.
    Gotama confirms it and explains that offerings prosper when given to worthy recipients:
    restrained, liberated, desireless, non-clinging ascetics who have crossed the
    stream of existence and left birth and death behind.'
  language: English
  quote_policy: summarized
