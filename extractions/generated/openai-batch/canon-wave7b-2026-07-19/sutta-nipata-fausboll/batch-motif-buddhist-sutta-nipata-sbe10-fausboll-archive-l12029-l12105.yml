canonical_text:
  quote: ''
  summary: Sela praises Bhagavat/Gotama for bodily perfection, great-man signs, radiance,
    and kingly worth. Bhagavat answers that he is an incomparable religious king who
    turns an irresistible wheel with justice. Sela asks who will continue this wheel,
    and Bhagavat names Sariputta. Bhagavat states that he has known, cultivated, and
    abandoned what was necessary, calls himself Buddha and an incomparable physician,
    and says he has crushed Mara's army. Sela accepts this, praises him as physician,
    hero, and lion-like speaker, and declares his intent to take orders before him.
  language: English
  quote_policy: summarized
