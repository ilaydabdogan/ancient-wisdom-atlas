canonical_text:
  quote: ''
  summary: Bhagavat admonishes Rahula to leave sense-objects and household life, cultivate
    virtuous friends, live secluded and quietly, be moderate in food, avoid attachment
    to monastic requisites, observe precepts, attend to the body, avoid passion-producing
    signs, cherish the signless, abandon pride, and wander calmly. The following Vangisasutta
    opens with Vangisa wondering whether his recently departed teacher Nigrodhakappa
    is fully blessed/extinguished or still has elements of existence remaining. Vangisa
    approaches Bhagavat at Aggalava, salutes him, and asks the Master to resolve this
    doubt about Nigrodhakappa.
  language: English
  quote_policy: summarized
