canonical_text:
  quote: let one wander alone like a rhinoceros
  summary: 'The passage closes the Dhaniyasutta with alternating statements by Bhagavat,
    the herdsman Dhaniya, and Mara: cattle, sons, ropes, rain, refuge, holy life,
    care, and freedom from possessions are contrasted. It then opens the Khaggavisanasutta,
    where family life, social entanglement, affection, children, wife, and company
    are presented as obstacles, and solitary wandering is repeatedly recommended through
    animal and bamboo similes.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhagavat says he has no cows, calves, pregnant cows, heifers, or bull, and
    therefore invites the sky to rain if it likes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dhaniya says the stakes are driven in, the ropes are new and well-made from
    muzga grass, and the cows will not be able to break them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker says he has rent bonds like a bull, broken through a creeper like
    an elephant, and will not again enter a womb.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A shower immediately pours down and fills both sea and land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After hearing the rain, Dhaniya says that seeing Bhagavat is a gain, takes
    refuge in him, and asks him to be master.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dhaniya says that he and his wife are obedient and, if they lead a holy life
    before Sugata, they will conquer birth and death and end pain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mara says that sons and cows bring delight to those who have them, and that
