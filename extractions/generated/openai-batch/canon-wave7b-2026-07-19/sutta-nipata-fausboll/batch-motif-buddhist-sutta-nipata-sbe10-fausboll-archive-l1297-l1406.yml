  summary: The passage lists portions of the Pali canon, including works concerned
    with discrimination, legends, preceding Buddhas, Gotama, Buddha's conduct, and
    Abhidhamma classifications. It then presents a scholarly argument about the age
    of the Pali canon based on the absence of the Third Council and the presence of
    the First and Second Councils in the Tipitaka, followed by an argument about disciplinary
    rules, the Second Council, and the closed authority of the Vinaya-pitaka.
