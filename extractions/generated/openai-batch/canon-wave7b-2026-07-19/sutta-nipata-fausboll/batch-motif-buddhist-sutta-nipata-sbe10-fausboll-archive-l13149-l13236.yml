canonical_text:
  quote: ''
  summary: Bhagavat instructs an ascetic practitioner in non-harming, desirelessness,
    moderation in food, alms practice, meditation at the root of a tree, restraint
    in speech, equanimity toward gifts, solitary practice, and wisdom. The passage
    uses images of crossing hell, cutting off the stream of existence, the edge of
    a razor, and water similes contrasting noisy small waters with the silent vast
    ocean and the fool with the wise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed practitioner is told not to kill or cause another to kill,
    to abandon desire and covetousness, and to cross over hell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practitioner is instructed to keep an empty stomach, take little food,
    have few wants, and not be covetous.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After going for alms, the Muni is told to go to the outskirts of the wood,
    sit near the root of a tree, and meditate there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When night is passing away, the practitioner is instructed to go toward the
    outskirts of the village but not delight in invitations or things brought from
    the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: While seeking food in the village, the Muni is told not to hurry from house
    to house, to cut off talk, and not to utter coherent speech.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Whether he obtains good alms or not, the practitioner is told to return to
    the tree unchanged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: With an alms-bowl in hand, the practitioner is told not to disregard a little
    gift or despise the giver.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Bhikkhu who has no desire, has cut off the stream of existence, and has
    abandoned work is said to have no pain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bhagavat declares a state of wisdom involving razor-edge restraint, restraint
    of the stomach, freedom from attachment, independence, and religious life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Solitariness is called wisdom, and the practitioner is told that he will find
    pleasure alone.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The practitioner is said to shine through the ten regions after hearing the
    voice of the wise and meditating ones who have abandoned sensual pleasures.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Small waters in chasms and cracks are described as noisy, while the vast ocean
    is described as silent.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The fool is compared to a half-filled waterpot, and the wise person is compared
