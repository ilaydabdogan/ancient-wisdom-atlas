canonical_text:
  quote: ''
  summary: The passage presents a question-and-answer sequence on the origin of contentions,
    disputes, sorrow, envy, arrogance, slander, wish, touch, grasping, egotism, form,
    joy, pain, and delusion. The answers trace these conditions through a chain of
    causes and cessations, including dear objects, wish, pleasure and displeasure,
    touch, name and form, and consciousness.
