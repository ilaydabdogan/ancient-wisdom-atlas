canonical_text:
  quote: ''
  summary: The passage recounts Buddhaghosa consulting canonical and commentarial
    materials, composing the Visuddhimagga, and reading it before the priesthood at
    the Bo-tree. Devatas make the book invisible, after which he recomposes it twice;
    the devatas restore the other copies, and the priests find the three versions
    identical and acclaim him as Metteya. The passage then describes his translation
    of Sinhalese commentaries into Pali, his return to Jambudipa to worship the Bo-tree,
    editorial caution about the miraculous quality of the account, a Burmese tradition
    about his voyage to Ceylon to obtain scriptures, and a brief note on Mahinda’s
    mission to Ceylon.
  language: English
  quote_policy: summarized
