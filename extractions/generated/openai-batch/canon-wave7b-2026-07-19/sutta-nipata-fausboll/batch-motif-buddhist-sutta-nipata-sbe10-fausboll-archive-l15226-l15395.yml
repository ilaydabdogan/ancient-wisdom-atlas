canonical_text:
  quote: ''
  summary: The passage opens the Parayanavagga by narrating how the Brahmana Bavari,
    living by the Godhavari after offering a great sacrifice, is threatened by another
    Brahmana who demands five hundred pieces of money and curses his head to split
    in seven after seven days. Bavari grieves and meditates. A benevolent deity tells
    him that the curse-giver is a hypocrite who does not know the matter of the head
    and head-splitting, and directs Bavari to the Buddha, the Sakya son dwelling in
    Savatthi. Bavari rejoices, instructs his sixteen Brahmana disciples how to recognize
    the Buddha by the marks of a great man and by his ability to answer unspoken questions,
    and sends them north; they salute him, circumambulate him to the right, and depart
    wearing matted hair and hides.
  language: English
  quote_policy: summarized
