canonical_text:
  quote: ''
  summary: Sela’s followers ask to enter religious life under Bhagavat. Sela and his
    assembly take robes and orders. Keziya/Kemiya the Ga/ila prepares and serves a
    meal to Bhagavat and the Bhikkhus. Bhagavat responds with stanzas naming principal
    things in sacrifice, hymns, society, waters, stars, burning objects, and offerings.
    Sela and his assembly practice in seclusion, attain religious perfection, and
    report that after taking refuge they were trained in the doctrine in seven nights.
  language: English
  quote_policy: summarized
