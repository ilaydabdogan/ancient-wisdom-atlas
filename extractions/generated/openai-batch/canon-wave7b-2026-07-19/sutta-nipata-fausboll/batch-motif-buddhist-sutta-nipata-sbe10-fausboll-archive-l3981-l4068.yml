canonical_text:
  quote: the evil falls back upon that fool, like light dust thrown up against the
    wind
  summary: The passage teaches that one who does no evil is not affected by evil,
    that harm done to an innocent person returns upon the offender, that beings receive
    different postmortem outcomes including rebirth, hell, heaven, and NirvAza, and
    that no place in sky, sea, or mountain clefts provides escape from evil deeds
    or death. It then urges non-killing by recalling that all beings fear punishment,
    fear death, and love life.
  language: English
  quote_policy: quoted
