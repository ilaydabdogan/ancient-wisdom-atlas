canonical_text:
  quote: ''
  summary: The passage closes a praise of the Buddha as conqueror of Mara, one who
    has crossed the stream of existence, followed by the Sallasutta teaching that
    mortal life is brief, death is unavoidable, relatives cannot save one another,
    grief does not restore the dead, and the wise do not grieve because they know
    the terms of the world.
  language: English
  quote_policy: summarized
