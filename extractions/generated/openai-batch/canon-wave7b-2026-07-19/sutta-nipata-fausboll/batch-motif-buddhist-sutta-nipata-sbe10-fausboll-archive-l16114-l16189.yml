canonical_text:
  quote: Look upon the world as void
  summary: The passage includes a closing statement about understanding the bonds
    of pleasure, then Mogharagan asks Gotama how to look upon the world so that the
    king of death will not see him. The reply instructs him to regard the world as
    void, remain thoughtful, destroy self-view, and overcome death. Pingiya, describing
    old age and failing senses, asks for the Dhamma so that he may leave birth and
    decay. Bhagavat tells him to be heedful, leave body and desire behind, and never
    come to exist again. A concluding frame says Bhagavat, at the Rock Temple in Magadha,
    answered questions from sixteen Brahmanas who followed Bavari.
  language: English
  quote_policy: quoted
