canonical_text:
  quote: ''
  summary: 'Sundarikabharadvaga asks Gotama how an offering succeeds. Bhagavat replies
    by teaching the Dhamma: one should ask about conduct rather than descent, and
    oblations should be given to those who are truthful, restrained, houseless, passionless,
    non-clinging, and liberated. The Tathagata is repeatedly described as deserving
    oblation because he is calm, undefiled, free from grasping and passions, has crossed
    the stream of existence, and knows the end of birth and death.'
  language: English
  quote_policy: summarized
