  summary: The excerpt opens the Dhammapada section headed “The Twin-Verses.” It presents
    verses stating that what one is results from thought; speech or action from evil
    thought is followed by pain, compared to a wheel following the foot of an ox drawing
    a carriage; speech or action from pure thought is followed by happiness, compared
    to a shadow that never leaves. A third verse says that people who harbor thoughts
    of having been abused, beaten, defeated, or robbed will not cease from hatred.
    Interleaved translator notes discuss the rendering of dharma and mind.
  language: English
