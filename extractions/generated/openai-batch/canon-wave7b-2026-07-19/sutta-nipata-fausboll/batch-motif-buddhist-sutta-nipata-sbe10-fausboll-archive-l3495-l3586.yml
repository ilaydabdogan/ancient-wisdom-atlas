canonical_text:
  quote: ''
  summary: 'A didactic passage on the wise person: one should follow a reproving intelligent
    guide, avoid bad companions, associate with the virtuous, delight in the law,
    fashion oneself as craftsmen shape materials, remain unmoved by praise and blame,
    become serene after hearing the law, avoid sensual and unfair aims, and seek the
    further shore identified in a note with Nirvana.'
  language: English
  quote_policy: summarized
