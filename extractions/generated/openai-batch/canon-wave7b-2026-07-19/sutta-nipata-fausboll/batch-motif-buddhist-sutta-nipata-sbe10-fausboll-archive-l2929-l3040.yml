canonical_text:
  quote: Earnestness is the path of immortality (Nirvana), thoughtlessness the path
    of death.
  summary: The passage teaches earnestness as the way to Nirvana and thoughtlessness
    as the way to death. It praises the wise, meditative, restrained practitioner;
    presents images of an island safe from flood, heights of wisdom, a mountain vantage,
    a racer, Indra’s rise, and a mendicant moving like fire that burns fetters; and
    includes translator notes on key terms and textual parallels.
  language: English
  quote_policy: quoted
