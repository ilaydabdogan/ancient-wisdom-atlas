canonical_text:
  quote: ''
  summary: Didactic verses define the just person, learned person, supporter of the
    law, elder, respectable person, Samana, Bhikshu, and Muni by ethical qualities
    and conduct rather than by violence, much speech, age, appearance, tonsure, alms
    begging, or silence. Editorial notes discuss dhamma and etymologies of ascetic
    titles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is not called just for carrying a matter by violence; the just person
    distinguishes right and wrong and guides others by the law.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person is not called learned because of much speech; patience and freedom
    from hatred and fear are named as the criteria.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A supporter of the law is not defined by much speech; the passage says even
    one who has learned little may be a supporter if he sees the law and never neglects
    it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: An elder is not defined by grey hair or age; truth, virtue, pity, restraint,
    moderation, freedom from impurity, and wisdom are named as criteria.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: An envious, stingy, dishonest person is not made respectable by much speech
    or complexion; respectability is linked to those faults being destroyed at the
    root, freedom from hatred, and wisdom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tonsure does not make an undisciplined false speaker a Samana; the Samana
    is described as one who quiets evil, whether small or large.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Bhikshu is not defined simply by asking others for alms; the passage associates
    the title with adopting the whole law, chastity, careful conduct, and being above
    good and evil.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage fragment says a person is not a Muni merely because he observes
    silence, if he is foolish.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: An editorial note says the etymologies of ordinary titles of Buddha's followers
    in these verses are fanciful.
  category: other
  evidence_refs:
  - ev:11
