canonical_text:
  quote: "“Not by birth does one become an outcast, not by birth does one become a
    Braéhmaza; by deeds one becomes an outcast, by deeds one becomes a Braéhmaza.”"
  summary: The passage concludes the Vasalasutta by teaching that moral status is
    determined by deeds rather than birth, gives Matanga as an example of a low-born
    person who attains fame and rebirth in the Brahma world, contrasts this with sinful
    Brahmanas who face blame and hell, records Aggikabharadvaga’s taking refuge in
    Gotama, and begins the Mettasutta with instructions for a peaceful, gentle practitioner
    wishing happiness for all beings.
  language: English
  quote_policy: quoted
