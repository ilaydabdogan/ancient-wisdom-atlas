canonical_text:
  quote: "“He cut off the craving for name and form in this world”"
  summary: A speaker praises the Tathagata as a wise light-bringer, asks him to disclose
    Kappayana’s state after religious practice, and longs for his teaching. Bhagavat
    replies that Kappa cut off craving for name and form and crossed Mara’s stream,
    birth, and death. Vangisa affirms that Kappiya was a true disciple who cut the
    net of death and crossed the realm of death. The next sutta begins by asking the
    Muni, who has crossed to the other shore, how a Bhikkhu wanders rightly.
  language: English
