canonical_text:
  quote: A bad mind and wicked deeds are what defiles a man; no outward observances
    can purify him.
  summary: A closing fragment from the preceding Ratanasutta invokes worship of the
    Tathagata Sangha for salvation. The main Amagandhasutta passage presents a dialogue
    in which Amagandhabrahmana questions Kassapa about defilement connected with rice
    and flesh. Kassapabuddha answers that killing, theft, falsehood, sensual excess,
    harshness, deceit, pride, cruelty, and similar misconduct are Amagandha, not the
    eating of flesh. The passage also names after-death descent into darkness and
    hell for hostile beings and begins a list of outward ascetic and ritual practices.
  language: English
  quote_policy: quoted
