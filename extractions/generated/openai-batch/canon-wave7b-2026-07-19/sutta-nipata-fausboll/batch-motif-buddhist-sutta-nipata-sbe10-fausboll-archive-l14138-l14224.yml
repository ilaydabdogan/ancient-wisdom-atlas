canonical_text:
  quote: ''
  summary: The passage first describes the independent Muni as unattached, using water-on-leaf
    and water-on-lotus similes. Tissa Metteyya then asks about the defeat of one given
    to sexual intercourse. Bhagavat answers that such a person loses precepts, honor,
    and right conduct, becomes discontented, greedy, false, and suffers pain. The
    Muni is instructed to keep solitary life, learn seclusion, avoid sensual pleasures,
    and is described as having crossed the stream.
