canonical_text:
  quote: ''
  summary: Nanda asks who has crossed birth and old age if purity by views, tradition,
    virtue, and works is insufficient. Bhagavat answers that those who leave behind
    seen, heard, and thought things and holy works, penetrate craving, and are free
    from passion have crossed the stream. Hemaka rejects earlier traditional doctrines
    as increasing doubt and asks for the Dhamma that destroys craving; Buddha identifies
    the destruction of passion and desire for dear perceived objects as imperishable
    Nibbana, by which the thoughtful cross desire. Todeyya asks about deliverance
    for one without lusts, craving, or doubt; Bhagavat answers that for such a one
    there is no other deliverance.
  language: English
  quote_policy: summarized
