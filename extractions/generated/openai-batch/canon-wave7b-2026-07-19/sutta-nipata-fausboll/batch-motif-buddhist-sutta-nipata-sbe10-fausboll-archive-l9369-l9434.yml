canonical_text:
  quote: ''
  summary: The passage praises the Assembly, Buddha, and Dhamma as excellent jewels
    connected with salvation. It describes practitioners who follow Gotama’s commandments,
    penetrate the noble truths, abandon conceit and doubt, avoid future births and
    hells, and do not conceal wrongdoing. It compares the righteous person to an immovable
    city-gate post, Buddha’s teaching to blooming trees, and liberated wise persons
    to a lamp going out. It also addresses spirits of earth and air, calling them
    to worship Buddha and Dhamma.
  language: English
  quote_policy: summarized
