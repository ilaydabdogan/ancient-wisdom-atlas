canonical_text:
  quote: ''
  summary: Verses on self-discipline advise a person to watch himself, first practice
    what is proper before teaching others, and subdue himself. The passage says evil
    and purity are done by oneself, describes self-caused harm through similes of
    diamond, creeper, tree, and reed-fruit, warns against scorning the rule of the
    virtuous and following false doctrine, and urges attention to one's own duty.
    Notes explain the three watches as stages of life and give cross-references and
    translation comments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who holds himself dear is told to watch himself carefully, and a
    wise man is told to be watchful during at least one of the three watches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is told to direct himself first to what is proper and then teach others;
    if he makes himself as he teaches others to be, he may subdue others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Self is described as the lord of self; a man with self well subdued finds
    a rare lord.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evil done by oneself is described as self-begotten and self-bred, and as crushing
    the foolish like a diamond breaking a precious stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Great wickedness is said to bring a person down to the state wished by his
    enemy, as a creeper does with the tree it surrounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bad and self-hurtful deeds are said to be easy, while beneficial and good
    deeds are said to be very difficult.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A foolish man who scorns the rule of the venerable, the elect, and the virtuous,
    and follows a false doctrine, is said to bear fruit to his own destruction like
    the fruits of the Katthaka reed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says evil is done and suffered by oneself, evil is left undone
    by oneself, and one is purified by oneself; no one can purify another.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person is told not to forget his own duty for another's, and to be attentive
    to his own duty after discerning it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note says the three watches of the night are meant for the three stages
    of life and compares the verse with an exhortation to watch in St. Mark xiii.37.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note says the Chinese translation renders the term in the diamond image
    as 'steel drill.'
  category: other
  evidence_refs:
  - ev:10
