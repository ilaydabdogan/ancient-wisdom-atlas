canonical_text:
  quote: cross the stream, after baling out the ship, and go to the other shore.
  summary: The passage warns that sensual pleasures bring gladness when obtained but
    pain when lost or frustrated. It instructs the thoughtful person to avoid and
    abandon pleasures, using images of a snake, a broken ship, a stream, and the other
    shore. It also describes attachment to the body as living in a cave, portrays
    desire for repeated existences as a trembling condition near death, and advises
    unselfish wandering without attachment.
  language: English
  quote_policy: quoted
