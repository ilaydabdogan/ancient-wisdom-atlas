canonical_text:
  quote: The passage repeatedly says, “him I call indeed a Brahmaza,” for figures
    marked by asceticism, freedom from bonds, awakening, and endurance.
  summary: 'The passage gives Dhammapada verses defining the person called a Brahmaza/Brahmana:
    not by origin or mother, wealth, or arrogance, but by ascetic poverty, solitary
    forest meditation, freedom from attachments and bonds, destruction of obstacles,
    awakenedness, and patient endurance of unjust punishment. The appended notes discuss
    parallels, puns, double meanings, and textual agreement with other Indic materials.'
  language: English
