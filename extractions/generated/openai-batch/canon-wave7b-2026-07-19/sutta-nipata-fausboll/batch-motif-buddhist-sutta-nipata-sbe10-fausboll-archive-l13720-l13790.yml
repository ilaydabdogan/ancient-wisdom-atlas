canonical_text:
  quote: ''
  summary: 'Bhagavat teaches the Bhikkhus another consideration of the Dyad: what
    the world regards as pleasure the noble see as pain, and what the world regards
    as pain the noble see as pleasure. Sensory objects are pleasing while they last,
    but their cessation is taken as pain by the world. The noble regard cessation
    and Nibbana differently, through knowledge, while the ignorant are described with
    darkness imagery and those who see with light. Those overcome by passions and
    the stream of existence do not understand the Dhamma. The discourse ends with
    the Bhikkhus rejoicing and sixty Bhikkhus'' minds being liberated.'
  language: English
  quote_policy: summarized
