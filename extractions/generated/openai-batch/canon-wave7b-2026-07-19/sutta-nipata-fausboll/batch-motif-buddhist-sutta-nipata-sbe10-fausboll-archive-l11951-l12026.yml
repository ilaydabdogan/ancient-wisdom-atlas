canonical_text:
  quote: ''
  summary: 'The passage describes the thirty-two signs of a great man and the two
    possible destinies associated with them: universal kingship if he remains a householder,
    or perfect enlightenment if he goes forth. Keziya directs the Brahmana Sela to
    Gotama. Sela approaches with three hundred young men, inspects Gotama’s bodily
    signs, doubts two of them, and then sees Gotama miraculously display the disputed
    signs. Sela concludes that Gotama possesses all thirty-two signs but still considers
    testing whether he is a Buddha by uttering praise.'
  language: English
  quote_policy: summarized
