canonical_text:
  quote: ''
  summary: The passage gives ethical verses on non-harm, restraint of harsh speech,
    silence and absence of anger, the driving force of Age and Death, karmic suffering
    caused by evil deeds, calamities and hell for harming innocent persons, and the
    inadequacy of outward ascetic signs such as nakedness, plaited hair, dirt, fasting,
    and lying on the earth. Editorial notes compare several verses with Manu, the
    Mahabharata, Divyavadana, and other Buddhist material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who seeks happiness and does not punish or kill beings that also
    long for happiness is said to find happiness after death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage warns against harsh speech because those addressed will answer
    in the same way; angry speech is painful and blows are reciprocated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who utters nothing is compared to a shattered metal plate or gong
    and is said to have reached Nirvana, with anger not known to that person.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Age and Death are compared to a cowherd with a staff driving cows into a stable;
    they drive the life of men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A fool is said not to know when he commits evil deeds, while the wicked man
    burns by his own deeds as if burnt by fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: One who inflicts pain on innocent and harmless persons is said to come soon
    to one of ten adverse states.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The listed adverse states include cruel suffering, loss, bodily injury, heavy
    affliction, loss of mind, misfortune from the king, fearful accusation, loss of
    relations, destruction of treasures, lightning-fire burning houses, and going
    to hell after bodily destruction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage lists nakedness, plaited hair, dirt, fasting, lying on the earth,
    and rubbing with dust as outward ascetic signs; the note says these are rejected
    because they do not calm the passions.
  category: attribute
  evidence_refs:
  - ev:7
