canonical_text:
  quote: ''
  summary: In several question-and-answer stanzas, seekers and listeners ask the Buddha/Bhagavat
    for teaching about Dhamma, deliverance by knowledge, Nibbana, cessation of consciousness,
    and knowledge of one delivered. The replies emphasize subduing grasping and desire,
    abandoning lust, grief, sloth, and misbehaviour, not delighting in sensation,
    and knowing consciousness.
