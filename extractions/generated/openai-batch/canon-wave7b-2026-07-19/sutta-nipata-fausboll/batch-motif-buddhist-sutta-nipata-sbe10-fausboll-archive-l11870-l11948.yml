canonical_text:
  quote: "“yet a great sacrifice of mine is at hand.”"
  summary: Keniya invites Gotama and the assembly of bhikkhus for a meal and organizes
    extensive preparations. The Brahmin Sela arrives with students, sees the preparations,
    asks whether they are for a marriage, sacrifice, or royal visit, and is told that
    the occasion is Gotama’s visit. Gotama is praised as Buddha, and Sela reacts to
    the rarity of that title.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Keniya learns Bhagavat’s assent, returns to his hermitage, and tells his friends,
    servants, relatives, and kinsmen that Samana Gotama and the assembly of bhikkhus
    have been invited for food the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Keniya asks his household and kin group to render bodily service for the invited
    meal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The helpers comply by digging fireplaces, chopping firewood, washing vessels,
    placing waterpots, and preparing seats; Keniya himself provides a circular pavilion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sela is described as a Brahmin at Apana, skilled in the three Vedas and related
    disciplines, familiar with the signs of a great man, and teacher of three hundred
    young men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sela comes on foot with three hundred young men to Keniya’s hermitage and
    sees the preparations underway.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Sela asks whether the preparations are for a son’s marriage, a daughter’s
    marriage, a great sacrifice, or the arrival of King Bimbisara with his army.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Keniya denies that the occasion is a marriage or royal visit, but says that
    a great sacrifice is at hand because Samana Gotama has reached Apana and has been
    invited with the bhikkhus.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gotama is described with praise titles including Bhagavat, perfectly enlightened,
    knowing the world, master, enlightened of gods and men, and glorious.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sela twice asks whether Keniya said Gotama is a Buddha; Keniya twice confirms,
    and Sela reflects that the sound “Buddha” is rare.
  category: speech
  evidence_refs:
  - ev:7
