canonical_text:
  quote: ''
  summary: 'The passage presents part of the Dvayatanupassanasutta. Bhagavat/Sugata/the
    Master addresses Bhikkhus on considering a Dyad: pain arises from causes such
    as upadhis, ignorance, and samkharas, while the complete destruction of those
    causes through absence of passion brings no origin of pain. The discourse states
    that a properly striving Bhikkhu may attain perfect knowledge or the state of
    an Anagamin. Verses describe repeated samsara with birth and death as the state
    of ignorance, say that beings resorting to knowledge do not go to rebirth, and
    state that the wise conquer association with Mara and do not go to rebirth.'
  language: English
  quote_policy: summarized
