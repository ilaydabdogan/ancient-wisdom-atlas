canonical_text:
  quote: ''
  summary: A Bhikkhu asks Bhagavat how long life lasts in Paduma hell. Bhagavat says
    it is not easily counted in years and gives a comparison using a vast load of
    sesame seed diminished by one seed every hundred years, then lists a hierarchy
    of hell durations culminating in Paduma hell. He states that the Bhikkhu Kokaliya
    has gone there because of hostile mind toward Sariputta and Moggallana. Subsequent
    verses teach that bad speech harms the speaker, false speech and blaming the noble
    lead to hell, and harm done to a pure person reverts against the offender.
  language: English
  quote_policy: summarized
