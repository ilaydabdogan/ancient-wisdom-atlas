  summary: The passage is a scholarly discussion of Ceylonese Buddhist textual transmission
    and chronology. It mentions translation of Suttas from Pali into the language
    of Ceylon, the survival or loss of manuscripts, a dispute about Buddhaghosa’s
    date, the distinction between two figures named Mahanama, and Dhatusena’s restoration
    of dynasty and religion after foreign usurpation.
