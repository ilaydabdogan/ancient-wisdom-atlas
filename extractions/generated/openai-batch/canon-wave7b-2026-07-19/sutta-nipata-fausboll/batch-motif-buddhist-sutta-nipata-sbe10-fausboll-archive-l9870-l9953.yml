  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A change occurs after the Brahmanas see the king’s prosperity, adorned women,
    chariots, horses, carpets, palaces, houses, cows, and other wealth; they become
    covetous.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Brahmanas compose hymns, go to Okkaka, and tell him to sacrifice because
    he has much wealth and corn.
