canonical_text:
  quote: ''
  summary: The passage describes cows as beneficial and formerly unharmed, then narrates
    how Brahmanas became covetous after seeing royal wealth, urged King Okkaka to
    perform sacrifices, received gifts, demanded further sacrifice, and caused many
    cows to be slaughtered. Divine and other beings denounce the slaughter as injustice,
    and the text links it to the increase of disease, loss of Dhamma, and social disorder.
  language: English
  quote_policy: summarized
