- id: obs:1
  text: Cows are described as best friends, producers of medicines, and givers of
    food, strength, complexion, and happiness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because the cows’ benefits were known, the earlier Brahmanas did not kill
    cows, and their race is said to have prospered.
