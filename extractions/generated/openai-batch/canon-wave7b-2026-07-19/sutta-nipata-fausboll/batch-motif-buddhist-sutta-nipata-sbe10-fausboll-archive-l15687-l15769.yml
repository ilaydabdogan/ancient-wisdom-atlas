canonical_text:
  quote: ''
  summary: The passage concludes part of Mettagumanavapukkha with statements that
    a wise accomplished person who abandons cleaving, craving, and longing has crossed
    the stream, reached the other shore, and crossed birth and old age. In Dhotakamanavapukkha,
    Dhotaka asks the Bhagavat for teaching so that he may learn his own extinction
    and be freed from doubts. The Buddha replies that he will not free a doubtful
    person directly, but that one who learns the best Dhamma will cross the stream.
    Dhotaka asks for the Dhamma of seclusion or Nibbana and for calm independence.
    The Buddha explains peace and instructs him to know all domains as ties and not
    thirst for reiterated existence. The next section begins with Upasiva saying he
    is alone and unable to cross the great stream without assistance, asking for an
    object by which one may cross it.
  language: English
