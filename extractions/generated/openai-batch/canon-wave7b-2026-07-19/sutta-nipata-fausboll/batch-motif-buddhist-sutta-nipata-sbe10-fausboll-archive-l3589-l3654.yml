canonical_text:
  quote: will pass over the dominion of death, however difficult to cross.
  summary: The passage contrasts the other shore with people running along the shore,
    says that those who follow the well-preached law pass over the dominion of death,
    instructs the wise man to leave the dark state for the bright state and go from
    home to homelessness, and describes non-attached persons grounded in the seven
    elements of knowledge as free in this world. Translator notes explain dark and
    bright as bad and good, leaving home as becoming a mendicant, and the seven elements
    as Sambodhyangas.
  language: English
