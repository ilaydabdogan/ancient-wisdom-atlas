canonical_text:
  quote: ''
  summary: The passage teaches that purification is not gained through philosophical
    views or by moving among teachers. It contrasts view-adherents and disputants
    with a wise Brahmana or seer who does not cling to what is seen, heard, thought,
    practiced, or judged good or evil, who cuts attachment, and who grasps nothing
    as highest. It also begins the Paramatthakasutta by saying that one who calls
    one view most excellent and other views wretched has not overcome dispute.
  language: English
  quote_policy: summarized
