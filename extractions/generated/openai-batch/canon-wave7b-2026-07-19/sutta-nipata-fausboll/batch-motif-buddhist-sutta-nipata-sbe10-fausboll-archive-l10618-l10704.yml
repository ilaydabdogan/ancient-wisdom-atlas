canonical_text:
  quote: ''
  summary: 'The passage first describes Buddha as a begging Bhikkhu or Muni dwelling
    at the Pazdava/Panzdava mountain, where messengers report him to a king. The king
    approaches, praises his youthful noble appearance, offers wealth and status, and
    asks his birth. Buddha identifies his origin among the Kosala/Sakiya people and
    says he has left his family and sensual pleasures for exertion. The passage then
    begins the Padhanasutta: near the river Neranjara, Buddha meditates for Nibbana;
    NamuAi/Mara approaches, argues that death is near and ordinary religious works
    are preferable to difficult exertion, and Buddha rebukes him.'
  language: English
  quote_policy: summarized
