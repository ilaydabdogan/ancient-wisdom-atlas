canonical_text:
  quote: "“from this shore to the other shore”"
  summary: The passage introduces named seekers who approach Buddha and ask subtle
    questions. Buddha answers them, and those delighted by his teaching devote themselves
    to religious life. The teaching is described as a way leading from this shore
    to the other shore, beyond decay and death. Pingiya praises Gotama as spotless,
    wise, passionless, darkness-dispelling, and luminous, contrasts direct teaching
    with earlier oral tradition that increased doubt, and says Gotama taught the immediate
    Dhamma of the destruction of desire and freedom from distress. Bavari asks Pingiya
    whether he can stay away from Gotama even for a moment.
  language: English
  quote_policy: quoted
