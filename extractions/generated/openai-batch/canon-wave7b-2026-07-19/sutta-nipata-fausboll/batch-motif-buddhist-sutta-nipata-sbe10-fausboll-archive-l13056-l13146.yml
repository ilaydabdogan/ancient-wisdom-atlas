canonical_text:
  quote: ''
  summary: The passage recounts the seer Isi/Asita weeping because he foresees his
    own death before hearing the future Buddha's Dhamma. He reassures the Sakyas that
    the prince will face no obstacle, foretells the prince's perfect enlightenment
    and turning of the Dhamma wheel, leaves the palace for religious life, and instructs
    his sister's son Nalaka to seek the Buddha. Nalaka later approaches Gotama and
    asks about the highest state of wisdom; Gotama/Bhagavat gives ascetic instructions
    on equanimity, restraint, and non-harm.
  language: English
  quote_policy: summarized
