canonical_text:
  quote: ''
  summary: The passage summarizes Sutta-Nipata teachings on ignorance, knowledge,
    ascetic renunciation, desire as sin, embodiment, peace, Nibbana, and the extinction
    or disappearance of the liberated Muni. It includes similes of deep water, a lamp,
    and a flame blown out by wind, and quotes Bhagavat addressing Dhotaka about learning
    his own extinction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that existence is ignorance and that knowledge is the extinction
    of the world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Ascetic or Muni is described as one who forsakes the world and wanders
    from house-life to the houseless state because defilement arises from house-life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ascetic is described as without prejudiced ideas, not entering disputes,
    not clinging to good and evil, having cut off passion and desire, and being possessionless.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ascetic is described as equable, calm, still as deep water, having reached
    peace and Nibbana through destruction of consciousness and cessation of sensation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sin is described subjectively as desire, especially desire for existence and
    for name and form.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person led by desire is said to be whirled about in existence; birth is
    linked with death; existence is called the stream of death and the realm of Mara;
    the ignorant go continually to samsara with birth and death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Buddha is described as being styled great Isi, Muni, Brahmana, and Bhikkhu,
    with these appellations used synonymously in cited verses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says desire originates in the body, that sin lies objectively
    in embodiment or matter, and that the human body is looked upon as contemptible.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bliss is described subjectively as emancipation from desire by means of the
    peace preached by Buddha.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bliss is described objectively as emancipation from body and matter; one must
    destroy the elements of existence and leave the body behind so as not to come
    to exist again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The wise are described as not entering time, viewing the world as void, holding
