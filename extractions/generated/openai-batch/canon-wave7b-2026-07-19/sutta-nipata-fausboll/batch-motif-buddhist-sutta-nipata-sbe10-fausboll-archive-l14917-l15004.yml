canonical_text:
  quote: "“From a stick seized fear arises.”"
  summary: The passage closes Tuvataka with instructions for a Bhikkhu to avoid occult
    arts, commerce, harsh or proud speech, falsehood, and anger, and to learn the
    Dhamma in Gotama’s commandments. It then begins Attadanda by describing fear arising
    from violence, people struggling like fish in little water, an unstable world,
    an arrow lodged in the heart, and the removal of that arrow through restraint,
    desire’s overcoming, and orientation toward Nibbana.
  language: English
  quote_policy: quoted
