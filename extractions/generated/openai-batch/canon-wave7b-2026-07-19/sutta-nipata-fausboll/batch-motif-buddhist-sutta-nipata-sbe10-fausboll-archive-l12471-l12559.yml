canonical_text:
  quote: "“the difference amongst men is nominal (only)”"
  summary: The passage addresses Vasettha and argues that human social distinctions
    are names rather than bodily essences. It lists occupations and political status
    as not making someone a Brahmana, rejects birth and maternal origin as sufficient
    criteria, and defines a Brahmana by non-possession, liberation, severed bonds,
    endurance, virtue, non-clinging, wisdom, destruction of pain, and homeless wandering
    with few wants.
  language: English
  quote_policy: quoted
