canonical_text:
  quote: ''
  summary: In this Hemavatasutta passage, the Yakkha Hemavata asks about Gotama's
    knowledge, conduct, passions, and rebirth. Satagira affirms Gotama's purity and
    liberation, and the speakers resolve to visit him in the forest and ask about
    deliverance from death. Hemavata asks Bhagavat about the world's origin, grasping,
    salvation, and crossing the stream or sea. Bhagavat answers that the world is
    bound up with six, explained as the five pleasures of sense and the mind, and
    that release comes through divesting desire, virtue, understanding, composure,
    reflection, and overcoming bonds. Hemavata then praises the liberated sage who
    has crossed the stream and is free from passion.
  language: English
