canonical_text:
  quote: ''
  summary: The passage describes worthy recipients of oblations, Magha's questions
    about the blessing of offering and the way to Brahmaloka, Bhagavat's replies about
    calm-minded offering, moral purification, friendliness, and the threefold blessing
    of oblation, followed by Magha's praise of Gotama and taking refuge. It then introduces
    the Sabhiyasutta, where Sabhiya seeks answers from teachers and approaches Gotama.
  language: English
  quote_policy: summarized
