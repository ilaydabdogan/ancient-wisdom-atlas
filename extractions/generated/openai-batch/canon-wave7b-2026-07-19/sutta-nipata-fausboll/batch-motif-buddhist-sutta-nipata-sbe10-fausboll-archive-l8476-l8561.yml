canonical_text:
  quote: ''
  summary: 'A deity visits Bhagavat at night in Getavana, salutes him, and asks what
    causes a man to suffer loss. Bhagavat answers in stanzas, contrasting love and
    hatred of Dhamma and then listing causes of loss: attachment to wicked men, drowsiness
    and laziness, failure to support aged parents, deception of religious mendicants,
    enjoying wealth and food alone, pride that despises relatives, and wasting gains
    through women, strong drink, and dice.'
  language: English
  quote_policy: summarized
