canonical_text:
  quote: ''
  summary: The passage gives instructions for a learner to approach a teacher at the
    right time, listen to religious discourse, abandon obstinacy and corrupt speech,
    delight in and inquire into the Dhamma, and cultivate restraint, chastity, peace,
    tenderness, meditation, learning, and understanding. It then exhorts the listener
    to rise from sleep and sloth, learn steadfastly for peace, avoid falling under
    the power of the king of death, conquer desire, not miss the right moment, and
    pull out the arrow of passion through earnestness and knowledge. The final opening
    exchange has Bhagavat ask Rahula whether he honors the wise man who holds up a
    torch to mankind, and Rahula answers that he does.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The learner is told to know the right time for seeing his teacher and to listen
    assiduously to the teacher's religious discourses and well-spoken words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The learner is told to go to the teacher in due time, be humble after casting
    away obstinacy, and remember and practice what is good, the Dhamma, self-restraint,
    and chastity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The learner is instructed to take pleasure in the Dhamma, delight in it, stand
    fast in it, inquire into it, avoid polluting disputes, and spend time speaking
    well-spoken truths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The learner is told to abandon ridiculous talk, lamentation, corruption, deceit,
    hypocrisy, greed, haughtiness, clamor, harshness, depravity, and foolishness,
    and to live without infatuation and with a steady mind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage contrasts words and hearing that are understood as fruitful with
    the understanding and learning of a hasty and careless man, which do not increase.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who delight in the Dhamma proclaimed by the venerable ones are described
    as unsurpassed in speech, mind, and work, established in peace, tenderness, and
    meditation, and having reached the essence of learning and understanding.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The listener is exhorted to rise and sit up rather than sleep, with reference
    to those who are sick, pierced by the arrow of pain, and suffering.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The listener is told to rise, sit up, and learn steadfastly for peace so that
    the king of death will not, seeing indolence, befool and lead the listener into
    his power.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The listener is instructed to conquer desire, which gods and men wish for
    and depend upon, and is warned not to let the right moment pass, because those
    who do will grieve when consigned to hell.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Indolence is called defilement, continued indolence is also called defilement,
    and one is told to pull out the arrow of passion by earnestness and knowledge.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bhagavat asks Rahula whether he despises the wise man through constant association
    and whether Rahula honors the one who holds up a torch to mankind.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rahula replies that he does not despise the wise man through constant association
    and that the one who holds up a torch to mankind is always honored by him.
  category: speech
  evidence_refs:
  - ev:12
