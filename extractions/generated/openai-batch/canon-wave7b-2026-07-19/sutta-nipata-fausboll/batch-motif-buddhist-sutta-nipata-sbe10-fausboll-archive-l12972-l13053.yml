canonical_text:
  quote: ''
  summary: The passage introduces the Nalakasutta and narrates Asita seeing gods rejoice,
    asking the reason, hearing that the Bodhisatta has been born in Lumbini and will
    turn the wheel of the Dhamma, descending from Tusita to Suddhodana’s palace, seeing
    the radiant child presented by the Sakyas, and receiving and acclaiming him under
    celestial honors.
