canonical_text:
  quote: ''
  summary: The passage presents the four holy truths and the eightfold holy way as
    the best refuge and as deliverance from pain. It praises the rare arising of a
    Buddha, the teaching of the True Law, peace in the church, and homage to the awakened
    and their disciples. The following Happiness verses praise living without hatred,
    moral ailment, greed, or possessions, compare such happiness to the bright gods,
    and state that the contented person gives up both victory and defeat. Translator
    notes explain pain as desire, identify the bright gods, and compare selected verses
    to Mahabharata passages.
  language: English
  quote_policy: summarized
