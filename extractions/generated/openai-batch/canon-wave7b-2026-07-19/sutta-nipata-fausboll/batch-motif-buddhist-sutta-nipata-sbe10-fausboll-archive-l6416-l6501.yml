  quote: ''
  summary: A didactic sequence repeatedly defines the one truly called a Brahmana
    by qualities such as freedom from anger, non-clinging, wisdom, non-violence, truthful
    speech, non-taking of what is not given, freedom from desire for this world or
    the next, purity, serenity, and having crossed the difficult world to the other
    shore.
  language: English
  quote_policy: summarized
