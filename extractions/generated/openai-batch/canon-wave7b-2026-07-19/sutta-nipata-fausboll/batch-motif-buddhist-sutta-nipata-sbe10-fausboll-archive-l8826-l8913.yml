canonical_text:
  quote: ''
  summary: The passage ends the Mettasutta with instructions to extend a boundless
    friendly mind to all living beings, using a mother's protection of her only child
    as an analogy, and states that the virtuous person who has subdued sensual greed
    will not return to a mother's womb. It then begins the Hemavatasutta, where the
    Yakkhas Satagira and Hemavata discuss the qualities of Master Gotama/Buddha on
    a fifteenth-day fast night; Satagira affirms Gotama's goodwill, restraint, ethical
    conduct, speech, meditation, and freedom from sensual pleasure. A prose heading
    says the Yakkhas later go to Buddha and become his followers together with ten
    hundred Yakkhas.
  language: English
  quote_policy: summarized
