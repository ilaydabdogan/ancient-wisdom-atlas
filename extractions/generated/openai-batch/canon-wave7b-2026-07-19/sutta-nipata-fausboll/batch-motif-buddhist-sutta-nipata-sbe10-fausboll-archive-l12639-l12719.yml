canonical_text:
  quote: ''
  summary: The passage teaches that name and family are conventional terms and that
    Brahmana status is not determined by birth but by work, discipline, and knowledge.
    Vasettha and Bharadvaja praise Gotama for illuminating the Dhamma and take refuge
    in Gotama, the Dhamma, and the Assembly of Bhikkhus. The next sutta opens with
    a summary of Kokaliya’s abuse of Sariputta and Moggallana, his punishment in hell,
    and an initial scene in which Kokaliya accuses them before Bhagavat and is admonished
    to stop.
  language: English
  quote_policy: summarized
