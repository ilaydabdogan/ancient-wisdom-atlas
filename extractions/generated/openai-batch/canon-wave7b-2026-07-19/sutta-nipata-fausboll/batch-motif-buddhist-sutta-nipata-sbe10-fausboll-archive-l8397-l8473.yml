canonical_text:
  quote: ''
  summary: 'The supplied passage first closes the Kasibharadvagasutta by describing
    Bharadvaga''s recent ordination, solitary strenuous practice, realization that
    birth is destroyed, and attainment as an arahat. It then gives the Kundasutta,
    where Xunda/Aunda the smith asks Buddha how many kinds of Samanas there are. Buddha
    answers that there are four: one victorious by the way, one teaching the way,
    one living in the way, and one defiling the way. He describes the qualities of
    each and concludes that a knowledgeable householder disciple can distinguish the
    undepraved from the depraved and the pure from the impure.'
  language: English
  quote_policy: summarized
