canonical_text:
  quote: "“The independent (man) does not vacillate ...”"
  summary: 'The passage presents several dyadic contemplations taught by Bhagavat
    to the Bhikkhus: independence versus dependence, form and formlessness versus
    cessation, and worldly judgments of truth and falsity versus noble knowledge.
    The teaching states that proper contemplation may lead to perfect knowledge in
    this life or to the state of an Anagamin. Verses describe dependent beings as
    not overcoming samsara, beings ignorant of cessation as going to rebirth, liberated
    beings as leaving death behind, and the world as mistaking what is perishable
    for truth.'
  language: English
  quote_policy: quoted
