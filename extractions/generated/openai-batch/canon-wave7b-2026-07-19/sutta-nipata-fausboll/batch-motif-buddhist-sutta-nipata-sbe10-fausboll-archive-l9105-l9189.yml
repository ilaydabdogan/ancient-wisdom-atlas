canonical_text:
  quote: ''
  summary: Alavaka asks how to gain understanding, wealth, fame, friends, and freedom
    from grief when passing to the other world. Bhagavat answers with faith in Dhamma,
    zeal, discernment, proper action, truth, charity, and four virtues for the householder.
    Alavaka accepts the teaching, says a gift will bear great fruit, and vows to wander
    worshipping the Buddha and Dhamma. The following Vijayasutta begins a reflection
    on the human body as composite, impure, impermanent, and eventually discarded
    and consumed in the cemetery.
  language: English
  quote_policy: summarized
