canonical_text:
  quote: ''
  summary: The passage criticizes disputants who cling to views based on what has
    been seen, heard, thought, or practiced through virtue and holy works. Such people
    praise themselves, denounce opponents as foolish or impure, and claim exclusive
    purity for their own doctrine. The text contrasts this with leaving all resolutions,
    avoiding dispute, understanding Nibbana as a place without dispute, and the wise
    person's refusal to embrace dependent opinions.
  language: English
  quote_policy: summarized
