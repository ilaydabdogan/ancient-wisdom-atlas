canonical_text:
  quote: ''
  summary: The passage describes avoidance and food-gift practices involving a father-in-law,
    then classifies food restrictions by age, gender, and special status. It lists
    Kaitish prohibitions and penalties for young men and young women, discusses a
    widespread prohibition on brown hawks for women and its effects on milk and breasts,
    notes Warramunga age-based release from restrictions and an eagle-hawk prohibition,
    and explains restrictions on young doctors and young men that reserve choice foods
    for old doctors or old men.
  language: English
