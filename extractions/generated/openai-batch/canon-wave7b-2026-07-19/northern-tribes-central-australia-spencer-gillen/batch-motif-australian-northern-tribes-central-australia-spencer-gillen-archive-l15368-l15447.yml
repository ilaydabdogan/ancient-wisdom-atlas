canonical_text:
  quote: ''
  summary: The passage describes a sequence of Arunta-related ceremonies involving
    maegwa performance, a visit to the ertnatulunga at Emily Gap, the raralilima hand
    gesture to notify spirits, the handling and bodily pressing of Churinga stones,
    a performance representing the Udniringita maegwa laying eggs, circumcision of
    two youths during a gathering of visiting men, and general remarks on the forms
    and representations of Churinga objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Local men sat in front of performers and sang of the maegwa; the passage notes
    that there was no dancing around them and no shouting of “Wha! wha!” as in most
    Arunta sacred ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the close of the maegwa performance, the visitors were embraced by the
    performers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the following morning, visitors were taken to the ertnatulunga at Emily
    Gap, where the local Alatunja went ahead alone and sat in a crevice near the sacred
    storehouse before beckoning the others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each man laid his open hand over the mouth of the Ertnatulunga in a ceremony
    called raralilima.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated purpose of raralilima was to give spirits notice of the visitors’
    approach, because sudden disturbance would make the spirits angry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Alatunja opened the ertnatulunga, removed ordinary Churinga and churinga
    unchima, and pressed the churinga unchima against the stomach of each visitor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The churinga unchima are described as round stones representing the eggs of
    the Udniringita.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Visitors were taken to places of historic interest in the gap, had traditions
    explained to them, and were led by way of Ilthura where sacred stones used in
    the Intichiuma ceremony were unearthed and pressed against their stomachs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ilthura are described in a note as holes containing one or more churinga
    tichaqua, stones representing the chrysalis case from which the adult Udniringita
    insect emerges.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The next day, the leader of the Inwura party performed a ceremony connected
    with the Udniringita maegwa of Ulatherka; the space between performer and audience
    was covered with Udniringa shrub twigs.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The performer represented the maegwa moving from bush to bush and laying eggs,
    carrying tufts of alpita that were said to represent the insect’s wings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before departing, the visitors took part in circumcision performed upon two
    youths; the passage states that gatherings of men from various parts are usually
    used for initiation and other important ceremonies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that Arunta Churinga generally have a symmetrical form,
    though some are boomerang-shaped and externally very similar to ordinary weapons.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: One stone Churinga is described as representing the liver of an old Alcheringa
    man of the emu totem.
  category: object
  evidence_refs:
  - ev:9
