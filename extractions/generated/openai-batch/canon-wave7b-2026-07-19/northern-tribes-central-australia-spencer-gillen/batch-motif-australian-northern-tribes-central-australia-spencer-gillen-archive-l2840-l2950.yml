canonical_text:
  quote: ''
  summary: The passage is an ethnographic introduction describing central and northern
    Australian tribal social organization, kinship terms, intergroup friendship and
    occasional conflict, the danger faced by unaccredited strangers, the protected
    status of sacred messengers, obligations to feed older people, and the authors'
    rejection of a popular capture-by-clubbing account of obtaining wives in favor
    of an elopement-and-charming account for the central tribes discussed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that every tribe has a complicated system of relationship
    terms by which each person stands in a definite relationship to others in his
    own tribe and in tribes he may visit or reside in.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that there are no separate terms for numbers higher than
    three.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Local groups within one tribe and members of contiguous tribes in contact
    are described as mostly living in mutual friendship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Occasional enmity between groups is said to arise usually from either the
    abduction of a woman or the “giving of a bone.”
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a fight and some form of compensation by an offending party, the matter
    is described as ended and harmony restored in the usual case.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Camps of some size are described as including members of other tribes visiting
    and sometimes taking part in ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A member of an unknown tribe is said to be likely to be speared unless he
    comes accredited as a sacred messenger; strangeness is associated with dread of
    evil magic from a distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that older and infirm persons are not allowed to starve
    and that everyone has a duty to supply certain older people with food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports a repeated popular account in which a man obtains a wife
    by waiting near a water-hole, clubbing a woman, and dragging her away by the hair,
    but the authors dismiss this for the central area described.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: For the central tribes discussed, what may look like capture is described
    as an elopement in which the woman is an aiding and abetting party.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says there are recognized methods of charming a woman living at
    a distance, after which she joins the man at an agreed place; if the pair escape,
    the aggrieved man's group later comes and there is a fight.
  category: sequence
  evidence_refs:
  - ev:7
