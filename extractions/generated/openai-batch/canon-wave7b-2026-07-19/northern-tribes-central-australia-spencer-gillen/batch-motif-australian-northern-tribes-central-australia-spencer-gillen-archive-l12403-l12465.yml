canonical_text:
  quote: ''
  summary: 'The passage describes an Arunta sun totem ceremony involving two performers:
    one associated with the Unjiamba/Hakea flower people and one with the sun ancestor.
    It explains the Alcheringa reason for the pairing, describes the sacred pole and
    sun disc used, recounts the kneeling, circling, shouting, swaying, and shoulder-touch
    closure of the ceremony, and notes post-ceremony sacred touching and instruction.
    It also compares Kaitish and Unmatjera ceremonies with Arunta ceremonies and notes
    differences in ceremonial objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun totem ceremony has two performers, one representing an Unjiamba and
    the other representing a sun ancestor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Alcheringa, the sun is described as a woman named Okerka who arose
    at Urapaila in the country of the Unjiamba/Hakea flower people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Unjiamba performer carries a small nurtunja, described as a sacred pole
    representing the plant, made from grass stalks tied with human hair-string and
    decorated with white down.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second performer carries a small disc of grass stalks and hair-string
    covered with down; its central patch represents the sun ancestor’s navel, and
    red and white radiating lines represent the sun’s rays.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second performer belongs to the Hakea plant totem and has the sacred name
    Alej-me-akka, linked to the head of Hakea flowers used to make a drink by steeping
    them in water.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Both performers kneel close together, while summoned men run up, circle around
    them, and shout “Wah ! wah !”.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The circling men gradually draw closer while the performers sway their bodies
    from side to side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ceremony ends when two men lay their hands on the performers’ shoulders,
    after which the performers’ movements cease.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Arunta ceremonies are distinguished by this closing
    method and by later touching older men’s bodies with an object used in the performance,
    which is temporarily Churinga or sacred.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A figure caption states that old men explain totemic matters to a young man
    at the close of a totemic ceremony while a decorated shield used during the ceremony
    is pressed against his stomach.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Kaitish and Unmatjera sacred ceremonies are similar
    in essential features to Arunta ceremonies, but that the waninga is never used
    and the nurtunja is only seldom met with.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note defines the waninga as a sacred ceremonial object varying in size and
    form and often resembling a banner.
  category: object
  evidence_refs:
  - ev:9
