candidate_motifs:
- id: motif:1
  label: Traveling totemic beings make landscape features
  taxonomy_refs:
  - culture_hero
  basis: The Yakomari and Thungallum men travel through country making water-holes,
    a cave, creeks, hills, and other named features.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage presents them as totemic men rather than explicitly using
    the label culture hero.
- id: motif:2
  label: Introduction and transmission of a new initiation implement
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: The narrative contrasts earlier fire-stick circumcision with the Yakomari's
    stone knife, then shows the knife passed to the Thungallum and later to the frilled
    lizard, who teaches knife use to Karawa people.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage describes transmission of a ritual technology; broader interpretation
    of sacred exchange should be reviewed.
- id: motif:3
  label: Fire made by friction of sticks
  taxonomy_refs:
  - culture_hero
  basis: At Muntura the Yakomari breaks a stick and makes fire by twirling one piece
    on the other.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage reports fire-making but does not say this is the first origin
    of fire.
- id: motif:4
  label: Children or spirit children emerge from ancestral bodies
  taxonomy_refs:
  - sacred_birth
  basis: The Thungallum brings a child from his body, and the travelers leave spirit
    children from their bodies at places where they perform sacred ceremonies.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The available taxonomy term is broad; the passage's literal form is body-generation
    of children, not a conventional birth scene.
- id: motif:5
  label: Ancestral descent into the earth after completing a journey
  taxonomy_refs:
  - departure
  basis: After making water-holes and performing ceremonies, the Yakomari and Thungallum
    pass into Willingara country and go down into the earth.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives descent as a terminal movement but does not elaborate
    an afterlife or return pattern.
- id: motif:6
  label: Plant origin from a cooked animal body
  taxonomy_refs:
  - death_rebirth
  basis: Swamp lilies arise when the cooked wallaby body bursts.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage describes plant emergence from a dead animal body; classification
    as death-rebirth is approximate.
- id: motif:7
  label: Underground disappearance after attempted eating of a body
  taxonomy_refs: []
  basis: The woman's body goes down into the ground while cooking, and the two men
    digging after it never return.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy reference closely matches this literal pattern.
- id: motif:8
  label: Animal species created through ritual performance
  taxonomy_refs:
  - culture_hero
  basis: Named totemic men perform Intichiuma and thereby create first animals of
    several kinds.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage frames the animal origins through totemic ritual; the culture-hero
    taxonomy is a broad fit.
