canonical_text:
  quote: ''
  summary: 'The passage contains several traditions: a Yakomari dingo-totem man and
    a Thungallum man travel through country making water-holes, creeks, hills, a cave,
    ceremonial places, fire, stones, and spirit children while transmitting circumcision
    with a stone knife; two Warramunga euro-totem men kill and cook a wallaby, woman,
    and child, with swamp lilies arising from the wallaby and the woman disappearing
    underground; an explanatory section states that named totemic men created animal
    species by performing Intichiuma; and a fragment describes an Idnimita man traveling
    to Indiara and returning with ritual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Yakomari man named Wataninka, of the dingo totem, came from the tableland
    to Auanula and met a Thungallum man who had come out of a large fresh-water spring.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yakomari and Thungallum men made a water-hole called Makunka, prepared
    a cleared place for circumcision, made and hid corrobboree sticks, and the Yakomari
    carried stone knives called kurtu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the Binbinga had previously circumcised with a fire-stick,
    and that the Yakomari circumcised the Thungallum with a stone knife and then gave
    him the knife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the two men traveled, they made a water-hole at Allaua, a cave at Yauo,
    stones marking places where each placed his penis in the ground, and further creeks,
    water-holes, and hill ranges.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Mungaialla the Thungallum brought a child out of his body and left it beside
    a creek.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dingo man told an emu man in the sand-hills to walk one way while he himself
    followed another track.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Muntura the Yakomari made fire by twirling one broken piece of stick on
    another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Thungallum circumcised a frilled lizard with the knife, gave him the knife,
    and the lizard then traveled to Karawa country and showed people how to use a
    knife instead of a fire-stick.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two travelers made more water-holes, passed into Willingara country, went
    down into the earth, and left spirit children from their bodies wherever they
    performed sacred ceremonies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two Warramunga men of the euro totem caught a wallaby, encountered a woman
    with a newborn baby, killed the woman and baby, and carried their bodies onward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: While the wallaby was cooking in the ground, its body burst and swamp lilies
    arose from it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two men cooked and ate the child, later tried to cook the woman, found
    that her body had gone down into the ground, dug after her, and never came up
    again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The origin-of-animals section says that named totemic men performed Intichiuma
    and thereby created the first Unkurta lizards, wallabies, long-tailed rats, and
    nail-tailed wallabies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: An Idnimita old man named Untherkapunda traveled from the Burt plains to Indiara,
    spoke with other Idnimita men, learned that one lacked alpita, and returned bringing
    alpita, nose-bones, and Churinga.
  category: sequence
  evidence_refs:
  - ev:9
