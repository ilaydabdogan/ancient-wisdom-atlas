comparison_claims:
- id: claim:1
  claim: The passage presents pointing sticks, bones, and related spear-mounted implements
    as serving a similar harm-causing function across several named tribes, while
    noting differences in materials and handling.
  claim_level: same_function
  target: Kaitish, Arunta, Warramunga, Gnanji, Binbinga, Anula, and Mara pointing-implement
    practices
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This supports same-function comparison only within the passage; it
    does not establish common origin or historical transmission.
- id: claim:2
  claim: The passage supports limited circulation of the Gnanji pirritthi object to
    the Warramunga through occasional trade.
  claim_level: historical_contact
  target: Gnanji pirritthi and Warramunga recipients
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The trade statement concerns movement of an object; it does not prove
    that the full ritual practice was transmitted or shared.
- id: claim:3
  claim: The passage compares male and female forms internally by stating that the
    earlier forms are exclusively male while certain other harmful magical forms are
    peculiar to women.
  claim_level: same_function
  target: male pointing magic and Kaitish women’s wallaby-fibula, ambua, and yam-stick
    magic
  evidence_refs:
  - ev:7
