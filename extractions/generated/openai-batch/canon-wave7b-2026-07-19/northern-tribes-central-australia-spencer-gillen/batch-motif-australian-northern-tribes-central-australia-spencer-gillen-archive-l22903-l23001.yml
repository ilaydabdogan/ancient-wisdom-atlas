canonical_text:
  quote: ''
  summary: The passage describes harmful magical practices involving pointing sticks,
    spear-heads, human and animal bones, gender-specific ritual procedures, a taboo
    for a water-totem headman, and stated effects such as wasting illness, death,
    and genital injury. It compares named practices and materials among Kaitish, Gnanji,
    Binbinga, Anula, Mara, Arunta, and Warramunga groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening states that a man would not have been affected if he had made
    the stick himself, but he was frightened because its magic was attributed to an
    unknown other person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spear-head can be used as a pointing apparatus; the example described was
    obtained by a Kaitish man from a western tribe and is called nakitja.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nakitja object is described as a chipped flake of opaline quartzite with
    resin at one end and human hair-string attached.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kaitish headman of the water totem is not supposed to handle pointing
    sticks or bones because it is believed that the water would stink and go bad.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Closely similar sticks and bones are described as being used in other tribes,
    with a more potent form made from the femur or fibula of a dead man among the
    Gnanji, Binbinga, Anula, and Mara tribes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Gnanji name for the human-bone form is given as pirritthi, and the passage
    states that one is occasionally traded south to the Warramunga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A dead man’s radius is carried on an expedition to avenge his death and attached
    near the head of a spear, which is then believed unable to miss the murderer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Binbinga, Anula, and Mara, pointing bones and sticks are attached
    to a spear and pointed in darkness at the intended victim.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man targeted by this spear-pointing is said not to know about it; after
    the evil magic enters him, he wastes away and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the preceding forms are used exclusively by men, while
    other forms are peculiar to women, especially in the Kaitish tribe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Kaitish example, a woman who reports unlawful intercourse without consent
    acts under her husband’s instructions to make a sharpened pointing-bone from a
    wallaby fibula.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The woman carries the wallaby-fibula bone while hunting for food and sings
    it in order to endow it with arungquiltha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: She places the bone where the target man is likely to urinate; if he or something
    belonging to him contacts it, the passage says the evil magic enters him and his
    penis decays and drops off.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ambua is described as a woman’s magic in which she blows on her fingers, claws
    the air toward a man leaving camp, and performs the act secretly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After ambua is performed, the target man is said to waste away, with eyes
    sinking and muscles withering until he is like a skeleton.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Ittha atuminna, glossed as yam-stick magic, is introduced as a form used to
    injure another woman; the example begins with an elder wife ill-using a younger
    wife.
  category: sequence
  evidence_refs:
  - ev:10
