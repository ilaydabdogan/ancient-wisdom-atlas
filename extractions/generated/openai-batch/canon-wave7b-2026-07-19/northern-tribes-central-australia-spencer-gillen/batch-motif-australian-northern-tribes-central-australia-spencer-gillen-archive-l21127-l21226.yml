canonical_text:
  quote: ''
  summary: The passage recounts two Alcheringa traditions. In the first, Arininga
    arises at a water-hole, splits into Kumara and Purula men, grows into great teachers,
    travels among hills and water-holes, kills and eats a Purula woman, produces floodwater,
    euro men, clouds, stones, rainbow, rain-site, and a reincarnation lineage through
    whisker-related transformations. In the second, two Tumana men arise from Churinga,
    imitate Atnatu’s sky-borne Churinga sound by making bull-roarers, are killed by
    wild dogs, and their Churinga create a sacred site; nearby men learn ritual Churinga
    use for initiations and know of Atnatu’s punishment of men who failed to swing
    Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arininga, identified as a Purula, arose at the small water-hole Anira in Kaitsh
    country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At sunrise Arininga split into two men, one Kumara and one Purula; after an
    initial reunion at sunset and descent into the water-hole, they later emerged
    and remained separate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two men were red in the early morning, became black during the day, grew
    very large, and became oknirabata, described as great teachers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two men travelled to hills, sat, stroked their whiskers or beards, meditated,
    and looked around in all directions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the high hill Kararinna, beside a water-hole marked by two large gum-trees,
    the two men heard a baby cry and prepared barbed spears.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two men found a Purula woman with a baby; the Purula man showed himself
    to her, and the Kumara speared the woman and killed the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two men removed the woman’s inside, sewed her up with a wooden skewer,
    cooked her, and ate her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After stroking their whiskers, a flood of water came out from them, first
    dark-coloured and then red; they let it run, called it back at sunset, and watched
    it the next day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Arunbia, after the two men stroked their whiskers, two euro men came forth
    from them; euro totem men became mates of the water men, who wore euro teeth and
    were forbidden to kill the animal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before dying, the two men cut off their whiskers; clouds arose from the whiskers
    and went into the sky, while the whiskers remained as two large stones on a hill.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rainbow later came out of the whisker-stones and is described as the son
    of the rain, anxious to stop rain from falling.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Where the two men went into the ground, they made a large rain oknanikilla,
    and a later father of the totem head is identified as the reincarnation of the
    old Purula man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two Bukhara men named Tumana arose at Urtumana in Luritja country; their name
    denotes the sound made by swinging a bull-roarer, and they originally emanated
    from Churinga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Tumana heard Atnatu in the sky making Churinga noise and attempted to
    imitate him, first with bark and then successfully with a mulga-wood Churinga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Two wild dogs heard the Tumana’s Churinga, approached, smelled the men, chased
    them, caught them as they were going into holes, and cut off their heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When the Tumana tried to take up the Churinga, they failed to hide them; the
    Churinga spilled on the ground, the wild dogs left them, and they gave rise to
    a large oknanikilla.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Kallidinlidina and Atnabubu saw down from the Tumana’s Churinga fly about,
    and knew that trees sprang up wherever the down fell to mark special spots.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Kallidinlidina and Atnabubu told men to make and swing Churinga during boys’
    initiation, and had seen Atnatu spear and take into the sky men who did not swing
    Churinga.
  category: speech
  evidence_refs:
  - ev:10
