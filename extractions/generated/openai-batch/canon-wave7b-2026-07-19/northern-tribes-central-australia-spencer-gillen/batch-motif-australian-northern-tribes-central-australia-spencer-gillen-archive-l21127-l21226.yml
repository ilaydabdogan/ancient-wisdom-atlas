candidate_motifs:
- id: motif:1
  label: one ancestor splitting into two paired figures
  taxonomy_refs:
  - duality
  basis: Arininga splits into two men, Kumara and Purula, first recombines and then
    later remains divided as two separate figures.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a literal ancestral division; broader dualistic interpretation
    should be reviewed.
- id: motif:2
  label: ancestral bodily emanations create landscape and weather phenomena
  taxonomy_refs:
  - shapeshifter
  basis: Whiskers produce floodwater, euro men, clouds, stones, and rainbow; the figures
    also enter the ground and form a rain oknanikilla.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The available taxonomy ref 'shapeshifter' is approximate; the passage
    emphasizes emanation and transformation of body parts rather than disguise or
    animal-human shape change.
- id: motif:3
  label: great teachers establish practices and relationships
  taxonomy_refs:
  - culture_hero
  basis: The two water men become oknirabata, produce totemic relations with euro
    men, and the Tumana/Kallidinlidina/Atnabubu sequence accounts for making and swinging
    Churinga in initiation.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  - ev:10
  confidence: medium
  cautions: The term 'great teachers' is explicit for the water men; applying culture-hero
    language to the Tumana-related figures is interpretive and needs review.
- id: motif:4
  label: ritual instrument origin and initiation rule
  taxonomy_refs:
  - initiation
  basis: The Tumana create a functioning Churinga after hearing Atnatu; Kallidinlidina
    and Atnabubu tell men always to make and swing Churinga when initiating boys.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage describes a specific Churinga/bull-roarer practice; broader
    initiation classification should remain tied to the cited lines.
- id: motif:5
  label: punishment for failure to perform ritual act
  taxonomy_refs: []
  basis: Atnatu speared and took into the sky men who did not swing the Churinga.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No taxonomy ref is assigned because the available 'divine_judgment' label
    may overstate Atnatu’s status in this passage.
- id: motif:6
  label: death followed by reincarnation lineage
  taxonomy_refs:
  - death_rebirth
  basis: After the old Purula man dies or enters the ground, the father of the present
    totem head is said to be his reincarnation.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states reincarnation but gives limited details on the death
    process and later lineage.
- id: motif:7
  label: skyward removal or ascent after ritual transgression
  taxonomy_refs:
  - ascent
  basis: Atnatu is in the sky and takes into the sky men who did not swing the Churinga;
    clouds also arise from whiskers and go into the sky.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The 'ascent' ref is approximate because one skyward movement is punitive
    removal and another concerns clouds, not a voluntary ascent journey.
