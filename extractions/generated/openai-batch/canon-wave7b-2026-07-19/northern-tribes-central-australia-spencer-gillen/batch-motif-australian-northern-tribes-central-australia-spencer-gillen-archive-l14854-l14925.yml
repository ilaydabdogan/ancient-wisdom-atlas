canonical_text:
  quote: ''
  summary: The passage describes men whispering to the Wollunqua at a water-hole,
    the geography of Thapauerlu and the upper basin Miradji, an Alcheringa account
    of Miradji being formed during a fight between a wild dog and a euro, a ritual
    rubbing with stones representing euro body parts to aid hunting, and upper rock-holes
    associated with spirit children left by Wollunqua and with the reincarnation and
    name of an elder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men bowed their heads and whispered to Wollunqua, asking him to remain quiet
    and do them no harm, and saying they were his mates who had brought two white
    men to see where he lived.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The observers state that the men believed Wollunqua was alive beneath the
    water and watching them, though unseen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thapauerlu is described as a permanent water-hole whose water retreats toward
    deep shaded rocks in extreme drought.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Miradji is a deep rocky basin above Thapauerlu; in the rainy season water
    pours from it over a narrow ledge into Thapauerlu.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Miradji is said to have been formed in the Alcheringa during a fight between
    a wild dog and a euro; the euro hollowed the rock with its tail, and the wild
    dog killed the euro and ate its intestines.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A large pot-hole beside Miradji, associated with the euro, contains rounded
    boulders said to represent parts of the old euro’s body, including kidneys, heart,
    tail, and intestines.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two younger men entered the rock-hole, splashed water over themselves, rubbed
    each other with stones from the bottom, and were then rubbed by the elder Tjapeltjeri.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ceremony called ini-ini is said to enable men rubbed with stones representing
    euro body parts to catch euros more easily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two rock-holes above Miradji are associated with the old Wollunqua, who left
    spirit children there; the oldest accompanying native is described as the reincarnation
    of one of these and has a secret name derived from the upper water-hole’s name.
  category: relationship
  evidence_refs:
  - ev:6
