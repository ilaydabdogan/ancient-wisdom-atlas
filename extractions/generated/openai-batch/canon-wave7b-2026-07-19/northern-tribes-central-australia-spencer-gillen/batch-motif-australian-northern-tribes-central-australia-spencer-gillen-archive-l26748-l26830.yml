canonical_text:
  quote: ''
  summary: An ethnographic passage describes a Walpari visiting party, including two
    newly initiated youths, approaching Warramunga hosts for a welcoming dance. Local
    men meet them with food and water; the hosts assemble in groups, women gesture
    with bark and later throw food to the visitors, and an old Thungalla gives a damper
    offering to one visitor with formal apologies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The visiting party consists of sixteen Walpari men, including two young newly
    initiated men being shown sacred spots for the first time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fully initiated members of any totemic group and either moiety are said to
    be allowed to take part in this kind of pilgrimage.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Six local Warramunga men go about a mile from the main camp to meet the visitors,
    carrying food and water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The local people assemble on a specially cleared space and are arranged as
    a central group of men with two side groups of women.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Northern women are decorated with white spots and carry bark pieces that they
    move as if beckoning to the approaching visitors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The visitors approach in single file; the leader carries a pipeclayed spear
    with its point down, while others hold spears near the head to indicate lack of
    hostile intent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The visitors perform repeated high-knee S-shaped evolutions while shouting,
    and northern women answer with the same cry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At a signal, northern women fall in behind the visitors for the last evolution,
    then return to their earlier position.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After a silence, northern women approach and throw food at the visitors, who
    try to catch it and then eat it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After most Warramunga leave, an old Thungalla calls up a Tjambin visitor and
    gives him a damper with formal apologies about the offering.
  category: speech
  evidence_refs:
  - ev:10
