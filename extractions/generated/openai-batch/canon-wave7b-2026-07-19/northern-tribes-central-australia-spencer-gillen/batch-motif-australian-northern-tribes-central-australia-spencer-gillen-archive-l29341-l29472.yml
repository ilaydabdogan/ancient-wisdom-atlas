canonical_text:
  quote: ''
  summary: The passage gives a technical description of flaked stone knives and related
    implement heads. It explains that irregular flakes may be acceptable if they have
    a cutting edge, that useful blades are often produced by chance with many discarded
    flakes, that the same flakes may become knives, spear-heads, or pick-like weapon
    heads, and that illustrated Warramunga stone knives vary in blade facets, section,
    and shape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Irregular stone flakes can still be acceptable when they have a suitable cutting
    edge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Practice is described as necessary, but making a good knife is also described
    as partly a matter of chance, with many flakes discarded before a suitable one
    is struck off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same general flakes are used for knives, spear-heads, and pick-like weapons;
    before attachment, a flake's form does not necessarily reveal its later use.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Larger flakes are often retained for spear-heads or pick-heads, while medium-sized
    flakes may be used for all three implement types.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If original flaking is unsatisfactory, additional small chips may be removed,
    and secondary chipping near the cutting point is described as more common for
    spears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A footnote says discarded axe heads at Mount William were thrown aside when
    chipping spoiled their shape.
  category: action
  evidence_refs:
