canonical_text:
  quote: ''
  summary: The passage presents tables and prose comparing moiety and subclass names
    among several northern Central Australian tribes. It emphasizes named dual moieties,
    paired male and female group names, variation in subclass nomenclature, and equivalence
    of differently named social categories across neighboring tribes. It ends with
    a Warramunga classificatory table and an explanation that bracketed groups are
    mutually turtundi.
  language: English
  quote_policy: summarized
