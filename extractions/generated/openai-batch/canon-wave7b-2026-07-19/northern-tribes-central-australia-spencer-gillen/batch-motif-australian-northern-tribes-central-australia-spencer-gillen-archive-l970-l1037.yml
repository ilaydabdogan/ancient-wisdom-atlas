canonical_text:
  quote: ''
  summary: An illustrations list gives captions for pointing-sticks and pointing apparatus,
    a corroboree scene, magic curing objects, a medicine man’s object worn through
    the nasal septum, tree graves, death and mourning scenes, self-cutting during
    mourning, and a visit to a tree grave to seek a clue to a supposed murderer and
    rake bones down.
  language: English
