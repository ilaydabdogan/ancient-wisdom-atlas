  quote: ''
  summary: The passage identifies Thapauerlu as a water-hole in the Murchison Range
    where the Wollunqua snake is believed by the Warramunga to live. It describes
    a shallow cave with pendant tree roots interpreted as the Wollunqua's whiskers,
    and notes that the people became quiet and solemn as they approached the pool
    while two old Tjapeltjeri men, chief men of the totemic group, went to its edge.
