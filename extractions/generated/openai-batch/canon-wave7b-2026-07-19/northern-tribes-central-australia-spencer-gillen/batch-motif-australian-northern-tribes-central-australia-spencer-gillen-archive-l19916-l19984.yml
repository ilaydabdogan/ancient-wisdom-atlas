  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dark, every man in camp is present near the wurley, and decorated men
    come out and sit in the shade so women cannot see them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four recently initiated youths are made to lie flat on the ground with their
