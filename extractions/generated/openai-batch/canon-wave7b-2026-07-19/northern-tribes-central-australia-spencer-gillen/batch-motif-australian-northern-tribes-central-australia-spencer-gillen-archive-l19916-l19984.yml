canonical_text:
  quote: "“a form of purification by fire”"
  summary: The passage describes the Warramunga fire ceremony as a night ritual intended
    to make people kindly disposed, end old quarrels, and erase prior disputes. Decorated
    men, male participants, recently initiated youths, Uluuru and Kingilli groups,
    women, and children take part in or observe separate parts of the ceremony. Fire,
    lit twigs or fiery wands, processions, shouting, dancing, covered novices, and
    restricted visibility for women are central elements.
  language: English
  quote_policy: quoted
