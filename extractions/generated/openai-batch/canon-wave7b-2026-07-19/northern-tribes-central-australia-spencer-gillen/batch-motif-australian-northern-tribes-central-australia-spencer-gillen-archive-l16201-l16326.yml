  confidence: medium
  cautions: The ascent is primarily an imitated ancestral action within a ritual description,
    not a full narrative journey.
- id: motif:2
  label: totemic increase through body piercing
  taxonomy_refs: []
  basis: The snake headman pierces his arms with bones, and the fish headman pierces
    his body in water; both rites are presented as increase ceremonies for the totemic
    animal.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage gives different mechanisms for snake and fish rites; blood
    explicitly gives rise to fish, while the snake rite’s effect is stated more generally
    through abundance and permission.
- id: motif:3
  label: blood entering water gives rise to animals
  taxonomy_refs: []
  basis: In the fish-totem ceremony, blood from the headman’s wounds goes into a pool
