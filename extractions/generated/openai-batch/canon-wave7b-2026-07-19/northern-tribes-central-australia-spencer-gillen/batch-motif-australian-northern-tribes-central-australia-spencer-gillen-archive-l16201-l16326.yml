canonical_text:
  quote: ''
  summary: 'The passage describes several Intichiuma or totemic increase ceremonies:
    a rain rite imitating cloud men; a Urabunna snake rite in which a decorated headman
    pierces his arms with bones and later permits others to eat snakes; a Wonkgongaru
    fish rite involving body piercing and blood entering water; a louse rite at a
    sandbank and trees; a Kadni lizard rite involving stone, bark, and intergroup
    ritual assistance; and a brief comparison with Arunta Intichiuma organization.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the rain ceremony, the performer rose to a stooping position, moved a thrower
    backward and forward, quivered, turned his head, tried to rise, gazed into the
    sky, and then sat down abruptly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rain performance is described as an imitation of Alcheringa cloud men
    who went into the sky and formed clouds from which rain came down.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The general Urabunna term for Intichiuma is pitjinta, and the rain group’s
    separate ceremony name is wadni.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the snake group ceremony, the old headman’s body was decorated with red
    and yellow ochre, and he wore a pariltja head object made of crossed sticks, fur-string,
    and cockatoo feathers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The snake headman knelt, extended his arms, held sharpened bones, and pierced
    the skin of both arms while other men pinched or lifted the skin.
  category: action
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:6
  text: After piercing his arms, the snake headman sang a refrain twice, removed the
    bones, and ended the ceremony; the words are said to have no known meaning to
    the natives and to have been handed down from the Alcheringa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The piercing bones are called paidni and, when not in use, are wrapped in
    hair cut from the head of a snake man.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: After snakes became plentiful, men outside the snake group brought snakes
    to the old man; a younger tribal brother outside the totemic group presented snake
    fat, which the old man rubbed on his arms before telling all to eat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old man said that if men outside the snake group ate snakes without first
    bringing them to him and asking permission, he would warn them that they would
    later see no more snakes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a Wonkgongaru fish-totem ceremony, the headman painted himself with ochre,
    entered a pool with small pointed bones, pierced his scrotum and the skin around
    his navel, and sat in the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The blood from the fish headman’s wounds is said to go into the water and
    give rise to fish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the louse-totem ceremony, a man went to a sandbank associated with lice
    ancestors, rubbed dirt from the bank onto two named louse trees, and threw dirt
    in all directions, with a plentiful crop of lice said to result.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Coppertop hill is said to represent an old Kadni or jew lizard standing up
    in the act of throwing boomerangs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Kadni man can increase lizards by knocking pieces of stone off the rock
    face and throwing them about in various directions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A rough-barked tree on Coppertop represents the lizard’s skin; an Urabunna
    man strips off bark and sends it to Wonkgongaru men, who burn it in their own
    country to secure lizards.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage states that Arunta local groups are each presided over by a headman
    called an Alatunja and associated with a special totem.
  category: relationship
  evidence_refs:
  - ev:9
