comparison_claims:
- id: claim:1
  claim: The passage itself describes the Wonkgongaru fish-totem ceremony as somewhat
    similar to the Urabunna snake-totem ceremony; both involve a totemic headman,
    ochre, pointed bones, body piercing, and an increase function for the totemic
    animal.
  claim_level: same_function
  target: Urabunna snake-totem Intichiuma and Wonkgongaru fish-totem Intichiuma
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The two rites differ in body parts pierced, setting, and explicit mechanism;
    blood in water is stated only for the fish ceremony.
- id: claim:2
  claim: The passage compares the snake ceremony with the more elaborate Arunta Udniringita
    grub ceremony and then frames these rites within the broader Arunta Intichiuma
    system, supporting a cautious same-function comparison across neighboring totemic
    ceremony traditions.
  claim_level: same_function
  target: Arunta Intichiuma ceremonies, especially the Udniringita grub group
  evidence_refs:
  - ev:5
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: Details of the Arunta ceremonies are not included in the supplied passage
    except by brief reference.
- id: claim:3
  claim: 'The Kadni lizard rite shows an explicit ritual linkage between Wonkgongaru
    and Urabunna participants: Wonkgongaru men invoke an Urabunna man, receive bark
    from him, and burn it in their own country to secure lizards.'
  claim_level: historical_contact
  target: Wonkgongaru and Urabunna Kadni lizard increase practice
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports ritual cooperation but does not establish the historical
    origin or transmission path of the practice.
