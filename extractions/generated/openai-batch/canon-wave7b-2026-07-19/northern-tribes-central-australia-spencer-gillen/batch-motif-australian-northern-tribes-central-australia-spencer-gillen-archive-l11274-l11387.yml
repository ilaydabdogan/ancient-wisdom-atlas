canonical_text:
  quote: ''
  summary: The passage gives two Alcheringa totemic origin traditions. In the first,
    an Unkurta ancestor changes form, produces many Unkurta beings from his body,
    teaches similar multiplication to other totemic men, disperses his offspring,
    and leaves spirit parts that reincarnate. In the second, Idnimita ancestors begin
    as caterpillars and grubs; rain, wind, roots, and a chrysalis lead to an inmintera
    creature, which an old crow cuts and opens into the first fully formed Idnimita
    man. His chrysalis case is a red Churinga from which spirits issue, and further
    spirits emanate during ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Unkurta individual is reported to have first arisen as an amunga-quinia-quinia
    man, then noticed porcupine-like prickles and became an Unkurta jew-lizard man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When first arisen, the Unkurta individual was stiff, could not walk, and lay
    in the sunshine stretching his legs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Unkurta individual saw small Unkurta beings beside him, repeatedly said
    they were himself, and the passage states that these beings sprang from his body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Unkurta individual continued looking at himself, increased in flesh, became
    an Oknirabata, and later instructed men of other totems that the same process
    could happen to them.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After returning to his camp, the Unkurta individual sent his offspring in
    various directions to give rise to Unkurta people in different parts of the country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Unkurta beings finally went into the ground, left their spirit parts behind,
    and those spirit parts are described as undergoing reincarnation as Unkurta men
    and women by entering women.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old Unkurta had many Churinga, which remained at his camp after he died.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that Unkurta and his children arose as beings neither exactly
    human nor animal and possessing greater powers than living tribal members.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Idnimita were first described as small hairy caterpillars on Idnimita
    bushes; after going into the ground, rain soaked them, washed off their hairs,
    and they became Idnimita grubs in the roots of shrubs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A second rain and great wind carried a little Idnimita grub from the sea country;
    it changed size and colour, came down at India, bored into roots, and lay in its
    chrysalis case.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The little Idnimita emerged from the chrysalis as an inmintera creature, grew,
    could not see, noticed his whiskers, slept by day, and was stiff.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: An old crow watched the Idnimita creature, said it would make him into a man,
    and used its bill to cut and open parts of the body, including middle, elbows,
    fingers, eyelids, mouth, and nostrils.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The crow's cutting transformed the imperfect creature into the first fully
    formed Idnimita man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Idnimita man's chrysalis case lay beside him, was identified as his red
    Churinga, and many spirit individuals issued from it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Idnimita man said he was Kumara, painted himself, made Intichiuma, and
    during ceremonies spirits emanated from his body.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Some emanated spirits are named as Araltjilina, Unduda, Kulpaitja, and Ungakakakurta;
    two women are said to have undergone reincarnation and to be alive in human form
    at the present day.
  category: relationship
  evidence_refs:
  - ev:11
