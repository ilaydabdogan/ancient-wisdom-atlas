canonical_text:
  quote: a series of eight distinct drawings were made upon the ground, during as
    many successive days.
  summary: The passage describes a new phase of Wollunqua totem ceremonies in which
    Kingilli men prepare and decorate ground drawings over successive days. The designs
    are associated with places where the Wollunqua animal acted in the Wingara time,
    and the passage compares this practice cautiously with an Arunta emu Intichiuma
    ground drawing while noting differences.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After an action described as hidden from view, the Wollunqua stopped growling
    and events continued peacefully to the end of the series.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For four days no Wollunqua ceremonies and no Uluuru moiety ceremonies were
    performed; Kingilli ceremonies for ant, lizard, fire, and wild-cat totems occupied
    the time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fifth day, a new phase of the Wollunqua series began, which the passage
    says differed from previous examples except for a single Arunta emu Intichiuma
    instance, itself also different in important respects.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Wollunqua series, eight distinct ground drawings were made on eight
    successive days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Each Wollunqua drawing was associated with places where the animal stood up,
    performed ceremonies, and left spirit children in the Wingara time.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Wollunqua drawing was made repeatedly on the same spot of ceremonial ground
    and was either rubbed out the morning after the ceremony or restored and added
    to.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ground was smoothed, sprinkled with water, rubbed, coated with red or
    yellow ochre, and then marked with designs of concentric circles and curved lines
    outlined and surrounded by white dots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: White dots were made from kaolin ground in the mouth, spat into a receptacle,
    mixed with water, and applied with a frayed wooden twig used as a brush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The old man in charge drew circles and lines in red or black, gave directions,
    and other men filled in the mass of dots, a process often taking most of the day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The artists were Kingilli men, and no member of the Wollunqua totem was allowed
    near the work.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Arunta emu Intichiuma example described in the passage used a cleared
    and smoothed ground surface covered with blood and a design representing emu eggs,
    intestines, feathers, and excreta.
  category: other
  evidence_refs:
