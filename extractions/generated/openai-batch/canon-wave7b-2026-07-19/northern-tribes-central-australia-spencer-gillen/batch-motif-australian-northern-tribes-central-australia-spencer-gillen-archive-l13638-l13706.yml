canonical_text:
  quote: ''
  summary: 'The passage describes several totemic ceremonial practices: the close
    of a yam totem ceremony, bird-totem performers imitating bird cries, a customary
    wailing response by a man remembering his brother''s former performance, a food
    presentation and release from a ban of silence for visiting Warramunga witnesses,
    and a brief comparison of Umbaia arrambatja ceremonies with those of the Tjingilli
    and Warramunga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the close of a yam totem ceremony, a performer moves his body side to side
    in time with clanging clubs, someone in the audience pulls his head backward,
    and the ceremony ends; this is repeated until each man has walked in.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the white-cockatoo and eagle-hawk totems, performers march out while imitating
    the bird cry and continue the cry while hidden behind a bush and while walking
    in again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During one Menadji ceremony, an audience member sits apart and howls aloud;
    the explanation given is that custom requires him to show grief because his brother
    formerly performed one of these ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three visiting Warramunga men are invited to witness ceremonies and return
    on the second day with a pitchi carrying a large grass-seed damper.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After seeing the sacred ceremonies, the visiting strangers are under a ban
    of silence until they present food to the men in charge of the performance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The visitors hand the damper to the headman of the Thaballa ceremony, after
    which Tjingilli men lightly strike the visitors' heads with a green gum twig and
    release them from the ban of silence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Umbaia are described as eastern neighbours of the Tjingilli and as having
    more intercourse with the Gnanji than with the Tjingilli.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Umbaia sacred totemic ceremonies are called arrambatja and are said to differ
    in details of performance while agreeing in essential features with Warramunga
    and Tjingilli ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The witnessed Umbaia ceremonies are associated with Varanus lizard, fly, wallaby,
    small lizard, little bird, and snake totems.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Umbaia ceremony decorations are not distinctive from
    those of the Tjingilli and Warramunga and that Churinga are absent from these
    totemic ceremonies, even though Umbaia have putuli.
  category: attribute
  evidence_refs:
  - ev:6
