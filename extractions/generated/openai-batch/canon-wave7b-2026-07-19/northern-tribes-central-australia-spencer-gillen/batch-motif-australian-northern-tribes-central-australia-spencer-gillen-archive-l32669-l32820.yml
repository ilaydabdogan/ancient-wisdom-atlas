canonical_text:
  quote: ''
  summary: The passage describes interpretations of designs incised on Churinga, including
    wavy bands, U-shaped bands, spirals, concentric circles, concentric squares, central
    enclosures with straight lines, and animal tracks. It emphasizes that similar
    forms can have different meanings depending on totemic and local information.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that wavy bands are often regarded as indicating snakes,
    but warns that this is unsafe without definite information.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In two cited cases associated with snake totems in the Gnanji and Umbaia tribes,
    wavy bands actually represent snakes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a wooden Churinga of an Arunta Udniringita man, long wavy bands represent
    the wanderings of old ancestors in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Curved U-shaped bands are usually described as representing a group of people
    sitting down together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'A Kaitish old man used sand drawings in sequence: a U for an original Purula
    man, two U forms for his splitting into two, and a joined U-like form for two
    men sitting closely during ceremonies.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On a water Churinga, repeated nested U designs indicate groups of people sitting
    beside a creek.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some designs begin as spirals and continue as concentric circles; the passage
    treats concentric circles as derived from spirals in many instances.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A stone Churinga of the Menadji yam totem in the Kaitish tribe has numerous
    carefully incised concentric circles.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Some circles become flattened or angled into concentric squares; one Churinga
    shows the transition and another has both circles and squares.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some Churinga have a central oval, rough circle, or irregular square enclosing
