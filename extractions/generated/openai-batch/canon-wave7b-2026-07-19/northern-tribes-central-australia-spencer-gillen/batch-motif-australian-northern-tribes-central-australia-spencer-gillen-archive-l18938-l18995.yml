  text: Women were present close enough to the ceremonial ground to see what was taking
    place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts this presence with usual practices in which women are
    excluded from the actual circumcision ceremony and, among Arunta, Kaitish, Unmatjera,
    and other tribes, from the subincision ceremony and its ground.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The source says men's initiation ceremonies are guarded from women and children
    and suggests, cautiously, that the Warramunga exception may preserve an older
    tradition of greater female ceremonial participation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the ceremony the youths were taken by guardians to camp in a creek bed,
    out of sight of women and children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youths sat over small fires, and the smoke was supposed to soothe and
    heal their wounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the following day the youths' bodies were decorated with red ochre and
    charcoal designs described as ornamental and not totemic.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fur-string was tied tightly around the youths' arms, causing severe pain,
    and the operation was repeated later.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The youths' hair was tied to form an upstanding tuft on the crown; the passage
    specifies different men performing this for the Thakomara youth and the Thungalla.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Fur-string was also placed around the youths' necks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Various men watched over the youths to prevent women from seeing them and
    to ensure their observance of silence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A footnote states that the Warramunga, like the Urabunna, believe that sexes
