canonical_text:
  quote: ''
  summary: The passage describes an initiation context in which Warramunga women unusually
    witness a ceremony from close by, contrasting this with other central Australian
    groups where women are excluded. After the ceremony youths are secluded, treated
    with smoke from small fires, decorated, bound with fur-string, watched by men
    to maintain concealment and silence, and later receive a food offering sent by
    tribal mothers to specified male kin. A footnote records a Warramunga and Urabunna
    belief that sex alternates at successive reincarnations.
  language: English
  quote_policy: summarized
literal_observations:
