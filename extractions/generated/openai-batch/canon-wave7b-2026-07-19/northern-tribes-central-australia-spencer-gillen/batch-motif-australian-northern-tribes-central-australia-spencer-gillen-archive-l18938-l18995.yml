  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Four days after the ceremony, Thapungarti women, described as tribal mothers
    of the Thungalla boys, sent a food offering to Thapungarti and Tjapeltjeri men,
    described by kin relations to the Thungallas; the food was brought on a pitchi.
  category: action
  evidence_refs:
