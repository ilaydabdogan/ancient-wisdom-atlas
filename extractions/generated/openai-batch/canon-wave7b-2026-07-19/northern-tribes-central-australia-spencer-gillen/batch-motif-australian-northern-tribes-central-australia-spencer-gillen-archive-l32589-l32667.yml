canonical_text:
  quote: ''
  summary: The passage describes several churinga or churinga nanja associated with
    particular persons, totems, and tribes. It notes arrangements of chippings, bands,
    circles, spirals, and incised designs. One rain or water totem churinga is said
    to show a creek and ancestral marchings along its banks. Another wooden churinga
    nanja of a Kumara woman of the yam totem has circles joined by bands, a design
    said on frog-totem churinga to indicate trees and tracks.
  language: English
