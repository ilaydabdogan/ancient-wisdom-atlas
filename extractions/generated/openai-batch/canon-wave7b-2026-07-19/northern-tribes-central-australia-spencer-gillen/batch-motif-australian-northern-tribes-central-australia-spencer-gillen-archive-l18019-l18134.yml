canonical_text:
  quote: ''
  summary: The passage describes stages of male initiation, including circumcision,
    subincision, seclusion with a Churinga, food restrictions and gifts, smoke and
    back-striking rites involving women relatives, release from silence, and the Wilyaru
    scarification ceremony. It also reports traditions linking Wilyaru back cuts to
    bell bird marks and to the death of a cannibal hawk ancestor, with related food
    taboos and comparisons to neighboring ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy undergoing circumcision is lifted onto men crouched as a table; fur-string
    is placed in his mouth, a wife's brother sits astride his stomach, and the foreskin
    is cut by prescribed ritual actors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person carrying a sacred stick or Churinga is treated as sacred and is not
    to be injured; the passage also says a letter carried in a forked stick functions
    as a safe passport since the arrival of Europeans.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The foreskin and stone knife are handed to the elder brother, who touches
    the stomach of every mithi with the foreskin before it is placed on a fire-stick
    and buried.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An elder brother takes the youth into the bush, makes a small plain wooden
    Churinga, gives it to him to carry, says it belonged to the Umbumbuninia, and
    instructs him to keep swinging it and keep it unseen by women or children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During recovery the youth is not allowed to eat the jew lizard, because it
    is said this would make him sore and prevent the wound from healing; he is instead
    expected to give it to old men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After recovering from circumcision, the youth is brought to the men's camp
    without women seeing him, painted with red ochre, and has the string removed from
    his head by a mother's brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For subincision, men in the father relationship crouch as a table, another
    father-relationship man performs the operation, bark is inserted to keep the wound
    open, and blood is allowed to flow into a hole that is later filled with earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: That night the youth is shown more sacred totemic ceremonies and is told by
    wife's brothers and grandfathers that he is now a man and not a boy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The youth is warned not to have intercourse except with lawful wives and not
    to interfere with other men's women; the stated consequence is that he will fall
    down dead like stones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women make smoke by placing green boughs on a fire; the youth kneels in the
    smoke while younger and elder sisters strike him on the back, with women in the
    mother relationship nearby to restrain the blows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the smoke rite the youth may have a wife and takes his place among initiated
    men at the men's camp; he later gives food to the men who assisted, and they put
    meat to his mouth to release him from silence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Wilyaru is described as a final initiation ceremony common to the Urabunna,
    Wonkgongaru, Dieri, and probably other closely allied tribes; the passage says
    both Wilyaru and Arunta Engwura involve placing men on fire.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Wilyaru the man is laid face down, all qualified Wilyaru men strike him,
    and two kinsmen cut multiple lines down each side of his spine and one cut at
    the nape of the neck.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The healed Wilyaru scars allow a man who has undergone the ceremony to be
    recognized, and a Wilyaru man avoids turning his back toward women and children
    when possible.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: The Wilyaru cuts are said to represent marks on the bell bird and to commemorate
    an Alcheringa event in which the bell bird caused the death of a great hawk ancestor
    who killed and ate people.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage says the hawk is not eaten because of its cannibalistic habits
    in the Alcheringa, and notes a similar Arunta case in which the wild cat is not
    eaten and is associated with cannibalism.
  category: relationship
  evidence_refs:
  - ev:11
