  quote: ''
  summary: Chapter heading and opening paragraphs describe decorative art in northern
    and central Australian ethnographic context. The authors state that implements
    and weapons rarely show ornament suggested by natural objects; ornament on implements
    and sacred objects is said to consist mostly of conventional designs whose origins
    or meanings may not be known to the maker. The heading lists colour, bird and
    plant down, circles, spirals, zoomorphic, phytomorphic, and geometric designs,
    rock drawings, ceremonial objects, Churinga, and ground drawings as topics.
