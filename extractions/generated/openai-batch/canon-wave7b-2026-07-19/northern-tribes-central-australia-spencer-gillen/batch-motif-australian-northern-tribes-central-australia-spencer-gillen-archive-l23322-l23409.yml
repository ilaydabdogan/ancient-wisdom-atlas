canonical_text:
  quote: ''
  summary: The passage describes forms of magic connected with attracting partners
    and elopement, punitive treatment of women after elopement, healing headache or
    internal pain by transferring pain or evil magic into women’s head-rings, and
    breast-growth magic involving songs and charmed substances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a man obtains a woman from a class with which marital relations are forbidden,
    both are described as likely to be killed; obtaining a woman by magic is described
    as a frequent source of quarrels.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a woman from a distant group, the man swings the Nama-twinna, spends the
    night in the scrub with friends, sings, and continually swings the bull-roarer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The humming sound of the bull-roarer is said to be carried to the desired
    woman’s ear; the woman may later come to the man’s country, and an elopement may
    be explained as a response to hearing it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a woman in the same locality, the man may charm his forehead-band, lonka-lonka
    shell ornament, or pubic tassel.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The forehead-band is rubbed against the white trunk of a special gum-tree,
    and the man sings the woman’s eyes and internal organs while walking in the bush.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman is said either to see the head-band shining as the man dances or
    to be told secretly to go to a special place, after which she may follow him and
    elope.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lonka-lonka and pubic tassel can be sung over and charmed; the pubic tassel
    is first rubbed with pipe-clay.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sometimes a woman charms a man by singing over his forehead-band, armlet,
    or neck-band, but the woman is still customarily blamed for the elopement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women described as guilty of elopement may be beaten, severely handled, and
    in some cases injured by a husband using a lighted fire-stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Among the Warramunga and Tjingilli, men may wear women’s head-rings because
    head pain is believed to pass into the rings, which can then be thrown into the
    bush.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: For internal pain, a wife’s head-rings are placed on the man’s stomach; the
    evil magic causing the trouble is believed to pass into them before they are thrown
    into the bushes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After a time, the woman searches for the discarded head-rings, brings them
    back, and wears them again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that all of these tribes have forms of magic associated
    with causing the breasts of young women to grow.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Arunta example, men assemble at the ungunja and sing songs exhorting
    the breasts to grow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some songs charm fur-string, red ochre, and fat while these substances are
    mixed by a man who is the brother of the girl’s mother.
  category: action
  evidence_refs:
  - ev:9
