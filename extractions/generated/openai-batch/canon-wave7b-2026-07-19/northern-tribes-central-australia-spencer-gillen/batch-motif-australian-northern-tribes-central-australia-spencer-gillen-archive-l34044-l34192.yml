canonical_text:
  quote: ''
  summary: Glossary entries define terms for subclasses, kinship relations, sacred
    and totemic objects, places where ancestors entered the ground or left spirit
    children, mortuary practices, initiation and body-alteration ceremonies, spirit
    beings, mythic ancestral times, totemic animals and plants, rain or increase rites,
    and ordinary objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several entries name male or female subclasses in different tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several entries define kinship terms for elder siblings, fathers, fathers'
    brothers, and fathers' elder brothers' sons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Niirtunja is defined as a sacred pole decorated with bird's-down designs
    representing a totemic object.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Okndnikilla is defined as a place where ancestors of a local totemic group
    went into the ground and left spirit parts associated with Churinga.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Palpala names a small pit for the final burial of a dead person's arm-bone,
    and also names the going down of totemic ancestors into the earth and ground designs
    associated with those spots.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Paltinta is defined as a place where the ancestor of a totemic group left
    spirit children behind.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mortuary terms include a platform of boughs on which bodies are placed after
    death and a pit for final burial of an arm-bone.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:8
  text: Initiation or body-alteration terms include ceremonies of subincision, circumcision,
    biting a novice's scalp to make the hair grow, and throwing a newly born child
    up and down in the air.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Some entries identify a medicine man, an avenging party, and a pointing-bone
    usually made from the fibula of a dead man.
  category: object
  evidence_refs:
  - ev:11
  - ev:16
- id: obs:10
  text: 'Animals, plants, and objects are associated with totemic groups or rites:
    a large yam, pearl oyster, and big bat give names to totemic groups; grass is
    used in a kangaroo-increase ceremony; and a plover is associated with a rain ceremony.'
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Two entries name past times in which mythic ancestors are said to have lived.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:12
  text: Spirit or mythic beings include a mischievous and unfriendly spirit, a mythic
    mischievous creature, and a spirit individual.
  category: attribute
  evidence_refs:
  - ev:13
