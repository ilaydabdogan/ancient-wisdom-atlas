  quote: ''
  summary: The passage describes a neck-band made from human hair-string with resin
    ornaments holding eagle-hawk claws. The object is traded to southern tribes and
    used as a magic article. The same object is reported among the Binbinga, Anula,
    and Mara tribes, where it is used as a waist-band and also worn by men as a neck-band.
    The neck-band form includes strands enclosed by bees’-wax and wax rings.
