canonical_text:
  quote: ''
  summary: The passage describes rules for Arunta Intichiuma ceremonies and gives
    the Udniringita or witchetty-grub ceremony of the Alice Springs group as an example.
    The Alatunja leads eligible men to Emily Gap, where stones and places represent
    stages of the witchetty grub. Participants fast, carry twigs, strike and are struck
    with sacred stones, follow an ancestral route, enter a bush structure representing
    a chrysalis case, sing, receive food and water, and later transfer ornaments and
    food portions to the Mulyanuka. After the grubs appear, collecting, cooking, grinding,
    limited eating, and redistribution occur. The stated purpose is to secure increase
    of the totemic animal or plant, while totem members generally eat it sparingly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each totemic group performs its own Intichiuma ceremony under its Alatunja,
    and leadership and attendance are governed by totem and moiety conditions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the Udniringita or witchetty-grub ceremony, men assemble in camp, leave
    belongings behind, and walk in single file to Emily Gap in the Macdonnell Ranges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Emily Gap is described as associated with the group’s Alcheringa ancestors
    and as having sacred drawings characteristic of the totem on its walls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Alatunja leads while carrying a small pitchi, and the other men carry
    twigs of the Udniringa bush on which the grub feeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a shallow cave, a large stone represents the adult animal, and smaller
    churinga unchima represent its eggs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each man strikes the adult-animal stone with twigs; the Alatunja then strikes
    each man on the stomach with an egg-stone and speaks a formula about having eaten
    much food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the return journey the men follow the traditional track of their Alcheringa
    ancestors and stop at holes containing stone churinga uchaqua that represent the
    chrysalis stage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each man’s stomach is struck with a chrysalis-stage stone, and later each
    man decorates himself with the sacred totemic design and ornaments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old man left in camp builds a long narrow bush wurley called an umbana,
    described as representing the chrysalis case out of which the fully developed
    insect comes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The men enter the umbana, sing of the insect in its stages, shuffle out and
    in again, and then receive water and food after fasting for the sacred-site portion
    of the ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The men sing beside the umbana through the night, then in the morning remove
    their ornaments and hand them over to the Mulyanuka.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Alatunja says the Mulyanuka must receive the ornaments or the Intichiuma
    would not be successful and harm would come to the performers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the ceremony and when the grub begins to appear, witchetty-grub men,
    women, and children collect and cook large supplies for storage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the men’s camp, non-totem men place their grub supplies before the totem
    men, and the Alatunja and totem men grind cooked grubs between two stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Alatunja and totem men eat a little of the ground grub and return the
    remainder; the Alatunja also eats a little from the totem members’ store and gives
    the bulk to the Mulyanuka.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:16
  text: After this distribution, witchetty-grub people eat very little of the grub,
    while the Alatunja must eat a little to keep his power of performing Intichiuma
    successfully.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage states as an essential Arunta feature that totem members eat their
    totemic animal sparingly except on one occasion, and that the ceremony aims to
    secure increase of the totemic animal or plant.
  category: other
  evidence_refs:
  - ev:9
