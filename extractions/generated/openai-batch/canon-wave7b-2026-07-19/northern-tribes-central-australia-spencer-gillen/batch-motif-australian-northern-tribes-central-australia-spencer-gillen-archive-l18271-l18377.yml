candidate_motifs:
- id: motif:1
  label: Male initiation through seclusion, instruction, and painful operations
  taxonomy_refs:
  - initiation
  basis: The passage describes the boy in the bush, male-only gatherings away from
    women, sacred instruction, scalp biting, subincision, and post-operation injunctions.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The extraction follows the ethnographic description in the passage and
    does not generalize beyond this line range.
- id: motif:2
  label: Ritual secrecy and exclusion from women during initiation
  taxonomy_refs:
  - initiation
  basis: The foreskin is hidden at night so women cannot see, men gather away from
    women, and women or children receive a separate teaching about luringa and Twanyirika.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage reports the authors' ethnographic framing; it does not provide
    women's own direct speech.
- id: motif:3
  label: Initiatory death and revival by a spirit being
  taxonomy_refs:
  - initiation
  - death_rebirth
  basis: Women and children are said to believe that Twanyirika takes the youth into
    the bush, kills him, and later brings him back to life during initiation.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The death-and-revival account is presented as a belief taught to or held
    by women and children, not as the full esoteric explanation of the male ritual
    specialists.
- id: motif:4
  label: Sacred object associated with pre-existing spirit identity
  taxonomy_refs:
  - initiation
  basis: The father gives the boy a Churinga described as the sacred stick associated
    with the boy's kurnah in the Alcheringa; the passage also notes ancestral use
    of nanja trees associated with spirits.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: No more specific taxonomy reference is supplied for Churinga, kurnah,
    Alcheringa, or nanja trees.
- id: motif:5
  label: Supernatural sanction controlled by ritual sound
  taxonomy_refs:
  - initiation
  basis: The boy must swing the bull-roarer while in the bush; otherwise a sky arakurta
    may carry him away, while hearing the sound prevents harm.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives this as an instruction within initiation rather than
    a full independent myth narrative.
- id: motif:6
  label: Sacred pole as maker of young men
  taxonomy_refs:
  - initiation
  basis: The elder brother tells the boy that the father's nurtunja has made many
    young men and instructs him to embrace it.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not explain the pole's wider mythology or symbolism beyond
    this ritual instruction.
