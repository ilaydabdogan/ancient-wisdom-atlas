canonical_text:
  quote: ''
  summary: 'The passage describes stages of male initiation: preservation and concealment
    of the foreskin, scalp biting, nocturnal and dawn ceremonies involving male relatives
    and sacred objects, subincision, presentation of a Churinga associated with the
    boy''s spirit, injunctions about conduct, use of the bull-roarer, and a teaching
    that Twanyirika takes, kills, and later revives the youth during initiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ikuntera preserves the foreskin for a time and gives it to the boy with
    hair-string.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gammona, glossed as the boy's mother's brother, ties the string around the
    boy's waist.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy places the foreskin on a shield, covers it with a broad spear-thrower,
    and hides it in a hollow tree under cover of darkness so that women cannot see.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy tells only an unkulla, glossed as a father's sister's son, where the
    foreskin is hidden.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states a tradition that early Alcheringa ancestors placed their
    foreskins in nanja trees associated with their spirits.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: While the boy is in the bush he undergoes koperta kalkuma, described as the
    biting of his scalp by a gammona.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men sitting around the scalp biter urge him on; the passage says boys often
    howl with pain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Only men with very good heads of hair are allowed to bite the boys, and their
    bite is said to help the boy's hair grow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: After recovery from pulla, the okilia says it is time for ariltha, glossed
    as subincision, before the boy grows too big.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy is brought by the okilia and umbirna to a place away from the main
    camp and away from the women, where men sit by small fires through the night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The father's elder brother and the boy's elder brothers prepare and perform
    sacred ceremonies associated with their own totems and show and explain them to
    the boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before dawn the father prepares a ceremony, preferably using a sacred pole
    called a nurtunja.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The elder brother leads the boy to the nurtunja, identifies it as the father's
    nurtunja, says it has made many young men, and tells the boy to catch kangaroo
    and wallaby for his father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The boy is told to embrace the nurtunja.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: For the subincision, green boughs, a shield, the nurtunja, and the umbirna's
    body are arranged beneath the boy; the boy is restrained, fur-string is put in
    his mouth, and a stone-knife is used.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the operation the father gives the boy a Churinga and identifies it
    as the Churinga alcheri associated with the boy's kurnah in the Alcheringa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The father warns the boy not to go around the women's camp while carrying
    the Churinga, saying that otherwise he will lose it and his brother will kill
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: The ikuntera and okilia repeat warnings about keeping to the woman assigned
    by the ikuntera, not stealing other women, obeying the ikuntera, and providing
    him with food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: The boy is told to swing the bull-roarer while in the bush; if he does not,
    an arakurta living in the sky may come down and carry him away.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: If the arakurta hears the sound of the bull-roarer, called luringa in the
    passage, it is said not to harm the boy.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: Women and boys are taught that the luringa is the voice of Twanyirika, who
    is said by the Kaitish to live in a particular rock.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:22
  text: Twanyirika is said to come forth in spirit form during initiation and take
    the boy into the bush.
  category: action
  evidence_refs:
  - ev:10
- id: obs:23
  text: Women and children are said to believe that Twanyirika kills the youth and
    later brings him to life again during initiation.
  category: other
  evidence_refs:
  - ev:11
