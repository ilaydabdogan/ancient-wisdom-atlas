canonical_text:
  quote: ''
  summary: 'The passage describes part of a named fire ceremony: men attack a bough
    wurley with bark slabs, then run back to camp while women come out gesticulating
    and shouting. A figure caption describes men dancing and jeering at people shut
    in the bough wurley. The authors state that they received no explanation of this
    part of the ceremony. Afterwards decorated men remain in the wurley, others sit
    around it, and women and children retire to their camp.'
