canonical_text:
  quote: he still kept the end of his tail in the pool
  summary: 'The passage describes Tadjinara as the place where Wollunqua arose in
    the Alcheringa, then summarizes his travels, earth-dive, and final abode at Thapauerlu.
    It also describes hidden cairns of rounded stones representing different categories
    of euro animals, their intergenerational tending with leaves and red ochre, and
    two uses: rubbing young men with the stones to help them catch euro, and singing
    over and rubbing the stones with euro fat and red ochre to cause euros to emanate
    from them.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tadjinara is described as about ten feet in diameter and as the place where
    Wollunqua originally arose in the Alcheringa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Wollunqua began travelling, he kept the end of his tail in the pool,
    withdrew it at Ununtumurra, made a great dive into the earth, and returned to
    his final abode in Thapauerlu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the rocky sides of the valley above Thapauerlu there are hidden heaps of
    rounded stones under rough quartzite blocks; the rounded stones are described
    as waterworn and brought from pot-holes in the creek.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Under the outer blocks, the observers saw about twelve to fifteen rounded
    boulders in each case, arranged on beds of leaves and ranging from about an inch
    to a foot in diameter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The larger stones are called marra and represent old male euros; medium stones
    are bullukari and represent old female euros; smaller stones are tjulinjuri and
    bullunga and represent little male and female euros respectively.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: There are said to be about six or eight cairns over a length of a mile, and
    an old Tjapeltjeri man said they were very old and that his elder brother, father,
    and grandfather had visited them to rub and red-ochre the stones and renew the
    beds of leaves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: One stated use of the stones is to lift them up and rub them hard over the
    bodies of young men of any totem, with the object of enabling the young men to
    catch euro.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another stated use is that old men sing over the stones and rub them with
    euro fat and red ochre, with the idea that euros will emanate directly from them;
    different categories of euros are said to arise from the corresponding stone categories.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The natives pointed to the dung of a large euro near one cairn as proof that
    the animal had recently arisen from one of the marra in that cairn.
  category: object
  evidence_refs:
  - ev:8
