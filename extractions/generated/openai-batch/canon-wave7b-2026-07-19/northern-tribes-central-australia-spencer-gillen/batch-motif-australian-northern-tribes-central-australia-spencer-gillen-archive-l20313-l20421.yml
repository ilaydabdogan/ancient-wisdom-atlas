canonical_text:
  quote: ''
  summary: 'The passage recounts three Alcheringa traditions: eagle-hawk ancestors
    associated with Churinga, eggs, death, mourning, a sacred pole, and a stone marker;
    a crow man who arises from a Churinga, makes incomplete Unmatjera people into
    men and women, but is preceded by Parenthie lizard men in performing initiation
    operations; and an Unkurta jew-lizard man who arises, recognizes himself, produces
    many similar beings from his body, buries a dead one in a tree, and grows into
    a great wise man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ancient eagle-hawk of the Unmatjera sat at Irritja-puntja beside the Illapunpilla
    water-hole with many Churinga and eggs from which young eagle-hawks later came.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old eagle-hawk from Irultja visited, had no Churinga, and tried to persuade
    or ask the Irritja eagle-hawk to give him Churinga, but was ignored.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The visiting eagle-hawk and the young birds flew into the sky to hunt wallaby
    and did not eat eagle-hawk because they feared it would turn them grey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old Irritja eagle-hawk stayed behind to guard his Churinga, ate wallaby,
    choked on a bone, and died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the death, the young eagle-hawks cut their breasts with little Churinga,
    decorated themselves with bird down, flew away into the sky, returned to the hill,
    and later died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The last old eagle-hawk died into the ground after making a large nurtunja
    or sacred pole; a stone called Nurtunja Irritja marked the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old crow man at Ungurla arose from a Churinga, examined himself, and identified
    himself as a crow because black feathers had sprouted from his arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The crow man saw incomplete Unmatjera men and women and made them into men
    and women by means of his beak.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The crow man made a churinga lelira, described as a sacred stone knife, intending
    to return and circumcise the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two old Parenthie lizard men came from the south and performed circumcision
    and subincision on the men and atna-ariltha-kuma on the women before the crow
    returned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The crow man saw that the Parenthie lizard men had preceded him, stayed at
    Ungurla, died there, and was associated with a black stone marker, his lelira,
    Churinga stones, and stones representing eggs.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: A Bukhara man of the Unmatjera arose in the Harts Range first in the form
    of a little lizard, lay in the sunlight, stretched his legs, and recognized himself
    as an Unkurta jew-lizard.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Many little Unkurtas appeared beside the Unkurta man, each said to be the
    same as him and to have sprung from his body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Unkurta man saw one of the little Unkurtas die, chose to bury him in a
    tree rather than the ground, remained in one place, grew large in flesh, and became
    an oknirabata, a great and wise man.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: After growing, the Unkurta man travelled to Unqurtunga and saw a Kumara man
    of the Iwuta, or nail-tailed wallaby, totem; the supplied passage breaks off during
    the name.
  category: sequence
  evidence_refs:
  - ev:14
