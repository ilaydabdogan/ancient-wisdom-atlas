  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The crow intends but does not perform the later operations; the operations
    are completed by the Parenthie lizard men.
- id: motif:4
  label: Self-generated many from one ancestral body
  taxonomy_refs:
  - sacred_birth
  basis: The Unkurta man repeatedly sees little Unkurtas beside him, and the passage
    says they all sprang from his body.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage presents bodily generation but not a human birth scene; taxonomy
