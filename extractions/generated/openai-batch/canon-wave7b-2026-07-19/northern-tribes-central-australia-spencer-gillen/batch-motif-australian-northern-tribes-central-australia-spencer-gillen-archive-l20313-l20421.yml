- id: motif:2
  label: Sacred object and eggs as origins of beings
  taxonomy_refs:
  - sacred_birth
  basis: Young eagle-hawks come from eggs kept with Churinga, and the crow man arises
    from a Churinga; stones later represent the crow's eggs.
  evidence_refs:
