canonical_text:
  quote: ''
  summary: The passage describes central Australian decorative art, including pigments,
    down ornamentation, circles, spirals, and curved lines. It explains that designs
    on Churinga can have conventional meanings, sometimes indicating a gum-tree, frog,
    totemic animal or plant, or a place associated with a totemic ancestor. It also
    compares Australian Churinga with New Guinea ceremonial objects and notes a possible
    common ancestry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says central Australian decorative art includes wavy lines, circles,
    spirals, and symmetrically curved lines.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The available colour materials listed include red ochre, white pipe-clay,
    yellow ochre, charcoal, and wad; blue and green are said not to occur among the
    central tribes because no blue pigment is available.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: Down from birds or plants is mixed with pipe-clay or red ochre and used to
    ornament ceremonial objects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes bold designs made of circles, spirals, curved bands,
    and white dots, often arranged for strong colour contrast.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The origin of the geometrical designs is described as unknown, and their meanings,
    when present, as conventional.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same spiral or concentric-circle design can indicate a gum-tree on one
    Churinga and a frog on another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Designs on Churinga generally, though not always, indicate the principal represented
    object, such as a totemic animal or plant of a totemic ancestor, or a tree or
    rock where the ancestor is supposed to have lived.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that circles are not sacred as circles, but are treated
    as sacred when placed on an object that is itself sacred or Churinga.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage suggests ordinary drawings may result from an artist’s memory
    of designs seen on sacred articles.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports a comparison in which New Guinea shield designs of circles
    and spirals are described as derived from a human face, and Papuan ceremonial
    objects with human-face designs are shown to young men during initiation, as Churinga
    are shown to Australian youths.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Australian Churinga and New Guinea ceremonial tablets
    and bull-roarers may possibly have had a common ancestry.
  category: relationship
  evidence_refs:
  - ev:8
