canonical_text:
  quote: ''
  summary: The passage warns that general translated statements about powerful ancestral
    beings can be misleading. It clarifies that Wollunqua was understood as a huge
    snake ancestor who made Wollunqua totem people and local natural features, not
    as a supreme being. It clarifies that Murtu-Murtu was a Wingara ancestor associated
    with the bull-roarer sound, whose torn flesh became trees used to make bull-roarers,
    not a moral instructor. The passage then describes a broader belief in ancestral
    individuals with superior powers, their reincarnation, and associated sacred or
    secret ceremonies that are not ancestor worship or petition.
  language: English
  quote_policy: summarized
