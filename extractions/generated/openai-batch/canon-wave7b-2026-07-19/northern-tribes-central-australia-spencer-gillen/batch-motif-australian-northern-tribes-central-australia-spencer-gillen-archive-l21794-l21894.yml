canonical_text:
  quote: ''
  summary: Two recently circumcised boys travel through Binbinga country, asking for
    food, making fire, opening water sources, shaping creeks and pools, killing animals,
    and naming places. The snake Bobbi-bobbi sends flying foxes to watch them, gives
    them one of his ribs as a boomerang, and uses it to drag them underground; a water-hole
    arises there and the snake takes them away. An Anula version identifies the boys
    with Roumburia and Urtalia classes, says Bobbi-bobbi eats them while they remain
    alive in his stomach, and links their journey to mungai places, Pellew Islands,
    and class-linked local centres.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two boys, one Paliarinji and one Tjamerum, are circumcised at Akuralla on
    the Macarthur River in Binbinga country.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys ask an old woman for food; she says she has none, and they angrily
    tear off and throw their pubic tassels at her before running away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After leaving the old woman, the boys make a fire and carry a fire-stick with
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Narulunka the boys make a hole in the ground from which water flows, then
    run to a still-existing spring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys kill a female hill-kangaroo called Mantita and drag it by the tail,
    thereby carving the bed of what is now Walunga Creek.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boys cook Mantita in a hole that becomes a pool of water where lilies
    grow, and they name the country Akulunka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boys continue making a creek called Manunga and kill and cook a singing
    animal or being called pall-pall-kitjima; the spring there is named Kanta-pu-pu-pu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Anawainga the boys strike the ground with stones; the snake Bobbi-bobbi
    hears the noise and sends flying foxes to find out what they are doing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boys make waddies, kill many flying foxes, place them in a ground oven,
    and later see the flying foxes jump up and fly away screeching when the oven is
    opened.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bobbi-bobbi, while underground watching the boys, removes one of his ribs
    and throws it onto a plain, where the Paliarinji boy finds it and calls it his
    boomerang.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tjamerum uses the rib-boomerang to kill many flying foxes; Paliarinji throws
    it into the air, where it makes a hole in the sky before returning and sticking
    in the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bobbi-bobbi grips the embedded boomerang from underground, and as the boys
    try to pull it out they sink down until the snake catches and drags them under.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A large water-hole called Mumbi-mumbi arises at the place where Bobbi-bobbi
    drags the boys underground.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: Bobbi-bobbi takes the two boys down the Macarthur River and across to Waliangu
    Island, where they remain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Anula version names the boys Roumburia and Urtalia, describes them killing
    animals and making creeks, lily pools, and water-holes, and repeats the episode
    of Bobbi-bobbi's rib being used as a boomerang before the boys are pulled underground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the Anula version Bobbi-bobbi eats the boys, but they remain alive in his
    stomach while he travels and establishes or leaves spirit individuals and class-linked
    mungai places.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
