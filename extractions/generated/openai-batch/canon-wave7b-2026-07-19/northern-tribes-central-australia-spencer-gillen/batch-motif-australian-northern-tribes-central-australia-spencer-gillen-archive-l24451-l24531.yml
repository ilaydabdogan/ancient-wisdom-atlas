canonical_text:
  quote: ''
  summary: The passage describes initiation practices among Binbinga, Anula, and Mara
    groups; the Binbinga watamura ritual object is linked by tradition to two wild-dog
    totem men who originated circumcision. It records instructions given to an initiated
    boy, beliefs attributed to women and children about bull-roarer sounds being made
    by spirits who eat, swallow, restore, or disgorge the boy, and coastal Gulf beliefs
    about unfriendly sky spirits opposed by friendly woodland spirits. It also notes
    an Anula appeal to a friendly Gnabaia for healing and states that moral instruction
    in initiation is not presented as sanctioned by a named supernatural individual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Binbinga, Anula, and Mara initiation ceremonies are closely
    similar, and that the Binbinga call the Churinga watamura while the Anula call
    it muramura.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: According to the described Binbinga tradition, the watamura was first made
    by two wild-dog totem men, who were originators of the initiation ceremony of
    circumcision.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the Binbinga operation, the watamura is placed on the boy's hands,
    its meaning and association with Alcheringa wild-dog men are explained, and he
    is instructed about obedience and prohibitions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Binbinga women and children are said to think that the bull-roarer noise is
    made by Katajalina, a spirit living in an ant-hill who eats the boy and later
    restores him to life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anula women are said to believe that the bull-roarer noise is made by Gnabaia,
    who swallows the boy and later disgorges him in the form of an initiated youth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The authors state that only on the Gulf of Carpentaria coast did they meet
    tribes with an idea of spirit beings who could help or injure people.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Binbinga Mundagadji are described as two sky-dwelling spirits with bodies
    covered in fine white down and knives instead of arms; they want to kill and eat
    people, but Ulurkura, a friendly woodland spirit, stops them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a man dies, the Mundagadji are said to be heard singing in the sky, and
    the three Binbinga spirits are said to be visible to medicine men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mara Minungara are described as two unfriendly sky spirits who make doctors
    and want to kill an ill man, but Mumpani, a friendly woodland spirit, prevents
    them from doing harm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Minungara, like the Binbinga Mundagadji, are described as having knives
    instead of arms.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Anula say two Gnabaia arose at VVuntirri on the Robinson River, walked
    about, and then went into the sky, where they remain and are unfriendly to people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A third and friendly Gnabaia is said to live in the woods, to have arisen
    at Liwurnungaiila, and to keep watch so that the sky-dwelling Gnabaia do no harm.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Medicine men are said to see the Gnabaia; the friendly Gnabaia instructs them
    to tell people not to hurt him if met in the woods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: When a man is ill, people are said to sing to the friendly Gnabaia to come
    and make him well.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage states that none of the three tribes conciliate the unfriendly
    spirits or reward or propitiate the friendly one, and that the Anula appeal to
    the earthly Gnabaia is the only instance of this nature found by the authors.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that moral ideas are inculcated in connection with initiation,
    but not by invoking a named individual who sanctions the precepts; Twanyirika
    and Katajalina are described as bogeys to frighten.
  category: other
  evidence_refs:
  - ev:10
- id: obs:17
  text: The footnote states that the Anula medicine man is not endowed with curative
    powers and can impart but not withdraw evil magic, making recourse to another
    magically powerful individual necessary.
  category: attribute
  evidence_refs:
  - ev:11
