comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the Binbinga, Anula, and Mara initiation
    ceremonies as closely similar, with the Binbinga example standing for the shared
    coastal pattern.
  claim_level: same_function
  target: Binbinga, Anula, and Mara initiation ceremonies
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: Only the Binbinga ceremony is described in detail in this passage.
- id: claim:2
  claim: The Binbinga Katajalina and Anula Gnabaia explanations share a pattern in
    which the bull-roarer sound is attributed to a spirit that consumes or swallows
    the boy and then returns him alive or as initiated.
  claim_level: same_motif
  target: Binbinga and Anula bull-roarer spirit explanations
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the parallel presented in this passage and
    to beliefs attributed to women or women and children.
- id: claim:3
  claim: The Binbinga, Mara, and Anula accounts share a functional pattern of unfriendly
    sky spirits being checked by a friendly woodland spirit.
  claim_level: same_function
  target: Mundagadji/Ulurkura, Minungara/Mumpani, and unfriendly/friendly Gnabaia
    patterns
  evidence_refs:
  - ev:5
