canonical_text:
  quote: ''
  summary: The passage opens a chapter on burial and mourning customs. It contrasts
    earth burial, tree burial, and the eating of dead persons' flesh across named
    Central and northern Australian groups. It describes Arunta earth burial with
    orientation toward the dead person's Alcheringa camping ground and a depression
    for the spirit to pass through. It then describes Unmatjera and Kaitish practices,
    including immediate earth burial for some very old people, tree burial for children
    and adults, a child's body placed in a pitchi on boughs with the hope that the
    spirit will return to a woman, and mourning actions involving kin, hair, whiskers,
    burning, and bodily cutting. The chapter synopsis also lists later customs involving
    bones, arm-bones, vengeance, spirit communication, fire, water-holes, and log-coffins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that major differences in burial customs concern earth
    burial versus tree burial and the presence or absence of eating the flesh of dead
    persons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: The Arunta are described as burying the body soon after death in a deep earth
    grave, with the body seated and facing the dead person's Alcheringa camping ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: A low depression is left beside the Arunta grave mound so that the spirit
    can pass in and out to visit the body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: North of the Macdonnell Ranges, among the Unmatjera, Kaitish, Warramunga,
    Tjingilli, and other tribes, tree burial is said to precede final earth burial
    for most persons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In tribes bordering the Gulf of Carpentaria, the flesh is said to be eaten
    and earth burial, strictly speaking, does not take place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Unmatjera and Kaitish, very old women and very old men who have
    become too feeble to conduct ceremonies are described as being buried immediately
    in the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a child dies, the child's body is placed in a pitchi on a small platform
    of boughs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stated hope connected with the child's tree grave is that the child's
    spirit may soon return and enter the body of a woman, probably the former mother.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a man dies among the Unmatjera and Kaitish, the gammona and itia carry
    the body to a tree away from the camp while other named kin accompany them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A platform of boughs is made at the tree, and the unkulla receives the body
    from the gammona and itia and covers it with fresh boughs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the body is covered, the group returns to camp and the tree grave is
    avoided for some time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mourning actions include gammona men cutting themselves on the shoulder, the
    father cutting off and burning his whiskers and moustache, and the younger brother
    cutting the widow's hair and burning it close with a fire-stick.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The chapter synopsis reports later Warramunga customs in which visits are
    made to the death-place and tree grave to find a clue to the murderer, and the
    dead man's spirit tells the brother when to perform the final burial ceremony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The chapter synopsis reports that in a final burial sequence most bones are
    put into an ant-hill, while one arm-bone is wrapped in paper bark, brought into
    camp, and later broken.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The chapter synopsis reports coastal customs in which dried bones are wrapped
    in paper bark and placed in an upright forked branch with a small fire kept burning
    beneath, and later a decorated hollow log is placed beside a water-hole.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The chapter synopsis reports that an arm-bone is sent with a message to summon
    distant groups to final burial ceremonies.
  category: action
  evidence_refs:
  - ev:9
