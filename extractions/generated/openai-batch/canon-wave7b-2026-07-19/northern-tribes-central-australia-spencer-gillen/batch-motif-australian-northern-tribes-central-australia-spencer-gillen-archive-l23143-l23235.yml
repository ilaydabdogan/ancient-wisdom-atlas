canonical_text:
  quote: ''
  summary: 'The passage describes forms of magic associated with objects and places:
    a knout or belt whose magical use varies among neighboring groups; stones and
    sites that transmit illness or bodily effects; and an Engurdina Alcheringa account
    in which an Injirra woman’s son is taken for initiation, kept at Urapuntja, replaced
    by another youth, and the returning party dies after drinking water containing
    arungquiltha, leaving stone heaps and a death-stone with heat-producing power.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ililika or knout is described as an object carried by men of the Arunta,
    Kaitish, and Ilpirra tribes and made of thirty to sixty strands of fine vegetable-fibre
    string.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Arunta and other southern central tribes, the knout is kept secretly
    in a man’s wallet and is said to deter women; a blow from it is said to have serious
    and usually fatal effects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A distant woman can be injured by cracking the knout in her direction, because
    the evil magic in it is said to fly through the air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Warramunga and Tjingilli, the same object, called watiliki, is commonly
    used as an ordinary waist-belt and is not associated with evil magic.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arunta knouts are said to have been sung, usually by Tjingilli men, and then
    traded south, where they have value because they contain the magic of a distant
    group.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At a place near Undiara, boils plucked from the body of Ungutnika are said
    to have changed into stones; spears struck against the stones can carry the essence
    of boils toward a target.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Near Jessie Gap there is a stone representing an ancient emaciated emu; rubbing
    it while exhorting the evil magic can make a man grow thin.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Engurdina, an Injirra woman had a son whom the men of Engurdina took to
    Urapuntja, the mountain of fire, for initiation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Urapuntja men liked the fair-coloured youth and persuaded his local friends
    to leave him behind, taking a Urapuntja youth in exchange.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Injirra woman recognized from a distance that the returning youth was
    not her son and put arungquiltha into water she carried out to meet the party.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The returning men drank the water, became very ill, vomited out their insides,
    and died; the heaps of stones are said to represent what they vomited forth.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The substituted youth crawled to the river and died there; a stone arose to
    mark the spot, and fire lit at the stone is said to make sand hot and send heat
    toward travelers.
  category: sequence
  evidence_refs:
  - ev:11
