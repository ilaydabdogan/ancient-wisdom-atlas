canonical_text:
  quote: The down, as usual, is fixed on to the body by means of human blood, and
    it is always attached in the form of an immense number of little spots.
  summary: The passage describes ceremonial body decoration with down, blood, pipe-clay,
    and ochre; Arunta head-worn slabs used in a rain ceremony; distinctions between
    such slabs and Churinga; and related Warramunga, Tjingilli, and Umbaia slabs or
    discs associated with ant and yam totem ceremonies.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ceremonial down is described as bird-derived in Arunta ceremonies and as a
    mixture of bird down and dried Epaltes flower down among Warramunga and northern
    tribes; pipe-clay can whiten it and ochre can redden it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The down is fixed to the body with human blood in many small spots, and men
    decorating one another may cover the upper body with bands and masses of coloured
    down after hours of work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A yellow or red ochre band may be painted on the skin in a position corresponding
    to a band of similarly coloured down in the finished design.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Flat wool slabs shaped like large Churinga were carried on the head by southern
    Arunta men during a rain ceremony at Charlotte Waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Arunta rain-ceremony slabs are decorated on both sides with red ochre
    coatings and designs including black wavy lines, white pipe-clay spots, slanting
    red line arrangements, and concentric circles.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The rain-ceremony slabs were fixed upright into Cassia-twig head-dresses bound
    with hair- or fur-string, ornamented with white down lines passing over the face,
    shoulders, and upper body; the slabs were tipped with eagle-hawk or owl feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Arunta Churinga may be used as head decorations, but are ornamented with bird
    down rather than pipe-clay, rarely bear incised patterns, and are said to differ
    in significance from the rain-ceremony slabs because Churinga relate to Alcheringa
    ancestors while the slabs do not.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Warramunga, small wooden slabs about a foot long, with yellow, red,
    and black colouring, were used in connection with an ant totem and are described
    as equivalents of the rain-dance slabs rather than of Churinga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Tjingilli and Umbaia tribes, similar slabs were associated with yam
    totem ceremonies; examples from the Tjingilli are concave, pointed for insertion
    into a head-dress, coated red, dotted white, and marked with black bands or pear-shaped
    pendant forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two Tjingilli yam-totem slabs are described as showing conventional imitation
    of yams attached to lines representing roots.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Another Tjingilli yam-totem head decoration consists of two grass-stalk discs
    bound with human hair-string, edged with white down, covered with red-ochred down,
    and fitted with curved twigs and owl-feather tufts.
  category: object
  evidence_refs:
  - ev:6
