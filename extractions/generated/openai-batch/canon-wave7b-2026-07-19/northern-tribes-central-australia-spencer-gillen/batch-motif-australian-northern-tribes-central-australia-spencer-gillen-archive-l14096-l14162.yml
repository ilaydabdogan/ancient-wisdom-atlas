canonical_text:
  quote: ''
  summary: The passage describes Wollunqua’s underground wanderings, emergence at
    named places, creation of local totemic centres through spirit children from his
    body, and ceremonies at Pitingari and Antipataringa involving decorated male performers,
    snake imitation, restricted sacred objects, and a later emergence at Tjunguniari
    where only the head end of his enormous body appears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wollunqua travels underground toward the east, comes up at various spots,
    performs ceremonies, and leaves spirit children from his body that remain behind
    as local totemic centres.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eleven spots are especially associated with Wollunqua’s wanderings; the first
    named spot is Pitingari, where a water-hole is associated with his coming out
    of the earth and looking around.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Pitingari ceremony, two men are decorated with broad curved bands of
    red down, white down over the upper body, and tall conical helmets with curved
    red bands; the bands represent Wollunqua.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two performers are Thapungarti men, neither belonging to the Wollunqua
    totem; one is described as a black snake man and the other as a crow man, and
    they are decorated by men of the other moiety.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The performers hide behind a bush, run in while adult men sing and beat boomerangs
    and sticks, shake themselves in imitation of a snake, sit with heads bowed on
    green gum-tree branches, and have their head-dresses knocked off by a Kingilli
    man to end the performance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Antipataringa, the same two men perform, and one carries on his head a
    curved bundle shaped somewhat like an enormous rounded boomerang.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The curved bundle is made in a secluded creek bed by three old Kingilli men;
    one Tjupila man of the Worgaia tribe leads preparations because he has seen the
    ceremonies enacted fully before.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Men of the totemic group and of the Uluuru moiety are not allowed to see the
    sacred object until it is brought to the ceremonial ground just before the performance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sacred object is made of grass stalks bound with human hair-string and
    decorated with white down, and is said to represent Wollunqua itself.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Tjunguniari, Wollunqua comes out and walks among sand-hills; the passage
    specifies that only the head end comes out because the body is so long that the
    tail remains at Kadjinara.
  category: action
  evidence_refs:
  - ev:9
