comparison_claims:
- id: claim:1
  claim: The passage itself presents the Mara making of doctors as almost identical
    to the Binbinga account, with shared elements of spirit involvement, opening the
    body, organ replacement, revival, instruction in extracting bones and evil magic,
    ascent to the sky, and return near a mourning camp.
  claim_level: same_motif
  target: Mara mungurni doctor-making compared with Binbinga spirit-made medicine-man
    account
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: The comparison is internal to this ethnographic passage; the Mara account
    includes a distinctive fire-and-fat summons and different named spirits.
- id: claim:2
  claim: The Anula munkani share the general function of doctor or medicine person
    with the Binbinga and Mara figures, but the passage states that the Anula idea
    of doctors is distinct and hereditary in a falling-star totem rather than described
    through the same spirit-surgery initiation sequence.
  claim_level: same_function
  target: Anula munkani doctorhood compared with Binbinga and Mara doctor-making traditions
  evidence_refs:
  - ev:2
  - ev:6
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The passage gives only a brief Anula description and explicitly emphasizes
    difference from the other tribes' doctor-making ideas.
