canonical_text:
  quote: ''
  summary: The passage describes rules and narratives concerning medicine men or doctors
    among the Binbinga, Mara, and Anula. In the Binbinga account, Kurkutji is killed
    in a cave by the spirit Mundadji, opened, given exchanged organs and sacred stones,
    restored by Munkaninji, instructed in healing, taken into the sky, and returned
    near his mourning camp. His later healing work involves extracting bones or evil
    magic while Munkaninji is unseen nearby. In the Mara account, a candidate summons
    the sky spirits Minungarra by burning animal fat; they make him insensible, replace
    his organs, revive and instruct him, take him into the sky, and return him near
    his camp. Mara medicine men can also climb an invisible rope to the sky to speak
    with star people. The Anula doctorhood is described as hereditary in the Yuntanarra
    or falling-star totem, associated with unfriendly sky spirits, and open to men
    or women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medicine men are described as exempt from being touched for an unspecified
    offence involving women, while the women concerned are punished; the conduct is
    still described as reprehensible.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Binbinga tribe, doctors are said to be made by two spirits, Mundadji
    and Munkaninji, described as father and son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kurkutji, an old Thakomara man and celebrated medicine man, says he entered
    a cave in the hill Yaua, where Mundadji caught him by the neck and killed him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mundadji cut Kurkutji open along the middle line, removed his insides, exchanged
    them for Mundadji's own, and put sacred stones in Kurkutji's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Munkaninji restored Kurkutji to life, told him he was now a medicine man,
    and showed him how to extract bones and other forms of evil magic from men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Munkaninji took Kurkutji up into the sky and brought him back to earth near
    his own camp, where people were mourning him as dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kurkutji remained dazed for a long time, gradually recovered, and the people
    recognized that he had been made into a medicine man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Kurkutji operates, Munkaninji is said to be nearby but unseen by ordinary
    people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kurkutji's extraction operation is usually done in darkness and involves sucking
    the patient's stomach, removing blood, making passes, punching, pounding, and
    sucking until a bone comes out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The extracted bone is immediately thrown toward the place where Munkaninji
    is believed to be sitting; Kurkutji then asks Munkaninji for permission to show
    the bone to the onlookers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Mara tribe, doctors are called mungurni, and their making is described
    as almost identical with the Binbinga practice just described.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A Mara man wishing to become a doctor gathers animal fat and burns it in a
    big fire near sunset in a lonely place; the smell ascends to the sky and attracts
    two spirits called Minungarra.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Minungarra make the Mara candidate insensible, cut him open, remove his
    organs, replace them with those of one of the spirits, revive him, instruct him
    in extracting bones and evil magic, carry him into the sky, and return him near
    his camp where friends have been mourning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Mara medicine man is said to be able to climb at night by an invisible rope
    into the sky and converse with the star people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Anula tribe, the doctor called munkani may be a man or a woman, and
    the profession is strictly hereditary among members of the Yuntanarra or falling-star
    totem, associated with unfriendly spirits living in the sky.
  category: relationship
  evidence_refs:
  - ev:9
