canonical_text:
  quote: ''
  summary: The passage describes Arunta totem ceremonies, especially two witchetty
    grub ceremonies. Performers and sacred objects are decorated with bird's down;
    old men regulate performance order; a headman performs imitative movements of
    the totemic insect; decorated shields represent bushes, tracks, seeds, and eggs;
    the audience sits silently; and a sacred shield is pressed to participants' stomachs,
    including a recently initiated youth, in a rite explained as softening the stomach
    and transmitting virtue from the sacred object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Performers' bodies and objects used in the ceremonies are decorated with designs
    made in bird's down called undattha; the ceremonies are called quabara undattha.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta tribe, the nature, time, and order of ceremonies are settled
    by leading old men; experienced authorities are called oknirabata, described as
    great teachers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports two witchetty grub ceremonies and one sun totem ceremony;
    the two grub ceremonies were performed consecutively at two places about two hundred
    yards apart, each with one performer, the local witchetty grub headman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During preparation for the first Unchalka grub ceremony, only members of the
    totem were allowed to be present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the first ceremony, the performer's upper body was decorated with white
    and red down, and a shield was decorated with concentric circles of down said
    to represent two bushes associated with the grub and adult insect.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the first ceremony, men sat silently in a semicircle while the performer
    bent down, rose onto his knees, quivered his extended arms as wings, and swayed
    over the shield in imitation of an insect hovering over bushes where it lays eggs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the second ceremony, the performer represented Urangara, an ancestor of
    the Udniringita witchetty grub totem, and had two decorated shields beside him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The smaller shield in the second ceremony bore zigzag white pipe-clay lines
    interpreted as grub tracks; the larger shield bore concentric circles interpreted
    as seeds of an Eremophila bush and eggs of the adult insect.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the second ceremony, the audience again sat silently while the performer
    wriggled, imitating the fluttering insect when it first leaves its chrysalis case
    and attempts to fly; there was no singing or dancing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the second ceremony, the larger shield was pressed against each man's
    stomach, and an oldest member of the totem group brought a recently initiated
    youth forward and explained the ceremony while the shield was held against the
    youth's stomach.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that touching the body with a sacred object used in the
    ceremony is characteristic of Arunta sacred ceremonies and is called atnitta ulpailiina,
    literally 'softening the stomach.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The explanation given is that emotions felt during ceremonies concerning dead
    ancestors tie the inward parts in knots, and that touching with a sacred object
    softens and unties them while some virtue is imagined to pass from the object.
  category: speech
  evidence_refs:
  - ev:9
