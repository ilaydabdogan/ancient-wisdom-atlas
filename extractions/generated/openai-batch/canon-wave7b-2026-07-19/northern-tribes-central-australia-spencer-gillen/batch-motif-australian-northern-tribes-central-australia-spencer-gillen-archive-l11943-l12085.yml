  category: relationship
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: Individuals are said not to eat their own totemic animal or plant, and to
    eat only sparingly of their mother's totem.
  category: action
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:5
  text: The Binbinga are said to believe that members of a totemic group descend from
    a single Alcheringa ancestor.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The snake Ulanji is said to have arisen at Markumundana, where he came out
    of the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ulanji walked to the sandhill Windilumba and made a spring and a nearby mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ulanji crossed Limmen Creek and made hills, a valley, water-holes, and lilies;
    he left Ulanji spirits where he performed ceremonies, and these spirits emanated
    from his body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After travelling and making many mungai spots, Ulanji went into the ground
    at the water-hole called Uminiwura.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Binbinga are said to believe that men and women can see spirit children
    at the mungai spots.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each totem is said to have a headman called Mungaringi, with headship descending
    from father to son or, in specified circumstances, to the father's eldest surviving
    brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Mara and Anula are described as having two classes in each moiety, with
    totems distributed among those classes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Mara and Anula tribes, a man is said not to be able to marry a woman
    of his own totem; he must marry one belonging to the right subclass, and totem
    descent is described as strictly paternal.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'In the Mara and Anula tribes, the same food restriction is described: a man
    does not eat his own totem and only eats very sparingly of his mother''s totem.'
  category: action
