  text: In the Binbinga tribe, descent of the totem is described as strictly paternal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Binbinga totems are divided between two moieties, and a man must marry a woman
    of a different totem from his own.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Examples from the Binbinga, Mara, and Anula show fathers, fathers' fathers,
