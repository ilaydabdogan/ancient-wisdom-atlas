canonical_text:
  quote: ''
  summary: The passage describes totemic descent, marriage restrictions, food restrictions,
    and headship among the Binbinga, Mara, and Anula. It also summarizes a Binbinga
    tradition in which the snake Ulanji, an Alcheringa ancestor, emerges from the
    ground, travels through country, creates springs, hills, valleys, water-holes,
    and spirit sites, leaves Ulanji spirits from his body, and returns into the ground
    at a water-hole.
  language: English
  quote_policy: summarized
