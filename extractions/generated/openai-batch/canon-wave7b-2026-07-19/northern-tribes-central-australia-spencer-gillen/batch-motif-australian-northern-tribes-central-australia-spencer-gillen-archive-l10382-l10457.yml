canonical_text:
  quote: ''
  summary: The passage introduces Chapter IV by describing male subincision and a
    corresponding female genital operation, called atna-ariltha-kuma, across several
    central and northern Australian groups. It presents the female rite as probably
    initiatory, describes regulated post-ceremonial marital and sexual access, and
    gives details for northern Arunta/Ilpirra, Illiaura, Kaitish, and Warramunga variants,
    including kin-defined performers, attendants, witnesses, and objects used.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that subincision is practiced on young men in every tribe
    examined by the authors, and that a corresponding female genital operation is
    practiced on young women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names the female ceremony atna-ariltha-kuma and states that it
    is probably to be regarded as an initiation ceremony equivalent to the male pura-ariltha-kuma.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the female operation, the passage says the woman is later handed over
    to definite men before becoming the property of one man, and that even afterward
    the husband may be required by custom to lend her to other men on certain occasions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that these marital and sexual arrangements are regulated
    by custom, and that infringements meet with punishment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the northern Arunta and Ilpirra, the allotted man speaks to his unkulla
    men, who go with other lawful-husband men and an old ipmunna man to take the girl
    into the bush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the northern Arunta and Ilpirra account, the old ipmunna man performs the
    operation with a stone knife after touching the genital area with a Churinga to
    prevent excessive bleeding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the northern Arunta and Ilpirra account, specified kin and lawful-husband
    categories have intercourse with the girl afterward in a stated order, and the
    ipmunna man decorates her and takes her to the allotted husband's camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: For the Illiaura, the ipmunna performs the operation, and the passage lists
    ipmunna, unkulla, okilia, ilia, and unawa as having access afterward; it specifies
    that okilia and ilia are tribal, not blood, brothers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For the Kaitish, the operation is performed by an arari, described as an elder
    sister of the girl, and access afterward is assigned to atninni, alkiria and atjiri,
    auillia, and umbirnia categories.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: For the Warramunga, an elder sister takes the girl to a selected spot near
    camp; three tribal brothers who are lawful husbands lie down side by side with
    the actual husband in the middle; the elder sister places the girl across them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Warramunga account, an old wankilli man performs the operation in the
    presence of all men and women in camp.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: A note says that the corresponding Warramunga male ceremony is also carried
    out within sight of men and women in camp, and that this differs from the other
    tribes mentioned.
  category: relationship
  evidence_refs:
  - ev:5
