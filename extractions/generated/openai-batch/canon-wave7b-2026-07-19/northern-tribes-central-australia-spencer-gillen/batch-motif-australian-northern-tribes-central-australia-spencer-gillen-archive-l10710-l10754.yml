canonical_text:
  quote: there are indeed what may be regarded as three distinct grades of marital
    relationships
  summary: 'The passage describes individual marriage together with broader, ritually
    and socially regulated marital access. It distinguishes three grades: ordinary
    individual marriage with limited lending within the lawful husband group; wider
    access at marriage, including some otherwise forbidden men and the husband group;
    and still wider access connected with ceremonies and messengers, including reciprocal
    or obligatory relinquishment of exclusive marital rights and temporary suspension
    of taboos.'
  language: English
  quote_policy: quoted
