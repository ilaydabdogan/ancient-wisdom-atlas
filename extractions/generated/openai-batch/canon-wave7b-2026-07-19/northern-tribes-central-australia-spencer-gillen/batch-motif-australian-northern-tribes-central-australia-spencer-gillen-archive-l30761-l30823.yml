canonical_text:
  quote: ''
  summary: The passage describes clothing and ornament among the tribes discussed
    by Spencer and Gillen. It states that clothing in the sense of body covering or
    weather protection is almost absent, that animal skins are not used for this purpose,
    and that the only listed coverings are small aprons for women and pubic tassels
    for men. It contrasts small pubic tassels in southern groups with larger covering
    tassels in northern and coastal groups and describes materials, attachment, and
    an exceptional Arunta form.
  language: English
  quote_policy: summarized
