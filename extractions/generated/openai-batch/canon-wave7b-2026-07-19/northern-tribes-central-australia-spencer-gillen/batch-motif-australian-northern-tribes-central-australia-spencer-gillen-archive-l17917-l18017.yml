canonical_text:
  quote: ''
  summary: The passage describes Larakia initiation as non-surgical endurance testing
    followed by revelation and concealment of a bull-roarer, contrasts this with surrounding
    tribes that practise circumcision and subincision, and then describes stages of
    Urabunna initiation involving ritual seizure, silence, women’s dances, a journey
    to summon groups, sacred ceremonies, a smoke signal, transfer to the men’s camp,
    preparation of a stone knife, and food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Larakia are described as not practising tooth-knocking, circumcision,
    or subincision in connection with initiation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Larakia youths at puberty are taken to a retired spot under the charge of
    old men whose orders they must obey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Larakia initiands are given limited food, with an elder brother providing
    a younger brother such food as he is allowed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Larakia old men may strike or kick a youth without warning, and the youth
    must not resent it or show pain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Larakia youths are made to do heavy manual work and may be ordered to go into
    water and bring a crocodile to land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When satisfied with the youths, Larakia old men show them the sacred bull-roarer
    called Biddi-hiduba and forbid them to let younger brothers or women see it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each Larakia youth receives a bull-roarer, hides it in the bush, and after
    two or three weeks the sacred stick is broken and buried.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Larakia women call the stick or its sound Eruba and believe it is the voice
    of a sky-descended spirit carrying youths away into the bush until they return
    initiated men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Urabunna rite, a kadnini old man seizes the boy, covers his mouth,
    tells him to remain silent, places string around his neck, takes him to camp,
    and watches him overnight while women dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At daylight the Urabunna boy’s hair is tied with string supplied by his father,
    he is shown to the women, and he and the old man run around them shouting before
    darting into the scrub.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Urabunna boy and old man visit distant groups to invite them to the ceremony;
    approaching strangers shout, and returning groups gather with them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After women are left behind, men perform sacred ceremonies at night, and the
    boy first sees one and learns secret matters of the tribe concerned with totemic
    ancestors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Before returning to the home camp, the Urabunna boy is told to make a large
    smoke signal to inform his father and the other men that he is returning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the camp, two kadnini old men remove the string from the Urabunna boy’s
    head and lead him by a roundabout way to the men’s camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Singing and totemic ceremonies continue, the stone knife is prepared by the
    mother’s brother and elder brother, and the boy is given a little food.
  category: sequence
  evidence_refs:
  - ev:7
