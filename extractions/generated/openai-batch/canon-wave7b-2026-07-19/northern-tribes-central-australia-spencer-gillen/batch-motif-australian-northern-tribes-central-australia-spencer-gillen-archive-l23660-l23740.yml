canonical_text:
  quote: ''
  summary: The passage describes medicine-man making through bodily swelling, replacement
    of inner parts, insertion and ingestion of atnongara stones, revival, and subsequent
    amnesia. It also describes restrictions needed to retain medicine powers, an example
    of power loss after drinking hot tea, and the beginning of a Warramunga account
    in which a Tjupila man is pursued or watched by two spirit strangers near water-holes
    before being made a medicine man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old medicine man sings over a man until his body swells, gives him new
    inside parts, places more atnongara stones in him, pats him on the head, and causes
    him to jump up alive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reviving him, the old medicine man makes him drink water and eat meat
    containing atnongara stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ilpailurkna wakes confused, says he thinks he is lost, is told by the old
    man that he had been killed long ago, and has forgotten his past life and his
    lubra.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilpailurkna's return and strange behaviour are taken by the other people as
    signs that he has been made into a medicine man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A medicine man must avoid eating too much fat, being bitten by a big ant,
    and drinking hot liquid, because these events would make the atnongara stones
    leave his body and remove his medical powers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A medicine man near a telegraph station is said to have lost his powers after
    accidentally drinking hot tea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Among the Warramunga there are two distinct kinds of doctors: one made by
    old practitioners in the neighbouring Worgaia tribe, and another made by the spirit
    puntidir.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spirit puntidir lives in the Mulga scrub and is described as equivalent
    to one of the Arunta iruntarinia.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Tjupila man of the Mungaritji large Varanus lizard totem, while hunting
    alone after a fight near Renner's Springs, notices two men walking at a distance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tjupila man cannot light a fire even though the wood is dry, and later
    sees the same two strangers seated at successive water-holes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Tjupila man hides in long grass overnight and later sees the two men apparently
    watching his movements.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At a rock-hole, after cooking lizards and stooping to drink, the Tjupila man
    sees the two strangers close by, raises his spear, and hears them say that they
    are his father and brother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the strangers identify themselves, the Tjupila man recognizes them as
    spirits, becomes alarmed, and leaves because he thinks they want to put him in
    the water-hole.
  category: sequence
  evidence_refs:
  - ev:9
