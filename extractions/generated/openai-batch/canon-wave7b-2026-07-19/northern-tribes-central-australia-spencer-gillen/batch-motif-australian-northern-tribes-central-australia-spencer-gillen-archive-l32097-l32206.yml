canonical_text:
  quote: ''
  summary: The passage describes decoration used in Arunta corrobboree dances, including
    twig head-dresses, down designs, body bands, feathers, and leafy ankle twigs.
    It contrasts plant down used in ordinary corroborees with bird down used mostly
    in sacred ceremonies, describes a specially decorated man in the Tjitjingalla
    final scene, describes women’s dance decoration using rabbit fur and plant down,
    and notes that sacred ceremonial objects across Arunta, Warramunga, Tjingilli,
    and Anula tribes commonly use bird or bird-and-plant down whitened with pipeclay
    or reddened with ochre.
  language: English
  quote_policy: summarized
