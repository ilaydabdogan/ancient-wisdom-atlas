canonical_text:
  quote: "“The striking features are (i) that the descent of the totem is almost without
    exception in the paternal line, and (2) that a man never marries a woman of his
    own totem.”"
  summary: The passage describes Warramunga totemic descent as usually paternal, the
    division of totems between Kingilli and Uluuru moieties, a prohibition on marrying
    within one's own totem, inter-moiety management of totemic increase ceremonies,
    and genealogical examples from Warramunga and allied tribes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the Warramunga group, totem descent is described as following the paternal
    line almost without exception.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: Warramunga totems are divided into two groups, one associated with the Kingilli
    half and one with the Uluuru half, in connection with the idea that each totemic
    group originated from one individual ancestor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rare exceptions to paternal totem descent are noted, including a Wollunqua
    snake father with a water-totem son and a lizard father with a hailstone-totem
    son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:4
  text: A Warramunga man must marry a woman of a different totem; a woman of his own
    totem is tabooed as a wife even if her class would otherwise permit marriage.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:5
  text: Men of a totem are regarded as responsible for securing the increase of the
    animal or plant from which they take their totemic name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Warramunga, neither moiety performs its totemic ceremonies unless
    requested by members of the other side.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Among the Warramunga, except for the actual performers, members of the moiety
    connected with a totem may not approach the place where the ceremony is being
    prepared.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Arunta, members of one moiety may not approach the place where men
    of the other moiety prepare a ceremony unless specially invited, which is said
    to occur rarely.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among the Kaitish, members of a totemic group act on their own initiative,
    but men of the other moiety decorate them and provide ochre, blood, bird's down,
    and other necessities.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The listed examples from Warramunga and allied tribes show many cases where
    father, father's father, siblings, and children share the same totem, while mothers
    and wives often have different totems.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
