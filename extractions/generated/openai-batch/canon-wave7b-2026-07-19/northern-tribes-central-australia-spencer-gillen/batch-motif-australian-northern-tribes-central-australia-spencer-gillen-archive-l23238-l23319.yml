canonical_text:
  quote: ''
  summary: 'The passage describes several Central Australian accounts and practices
    involving dangerous magic associated with ancestral deaths, stones, trees, totems,
    and marriage magic: an Injirra woman''s stone that can kill when rubbed with curses;
    a blind brown-snake ancestor whose tree can cause blindness; a Kaitish sun-woman''s
    tree whose destruction would burn all natives; eagle-hawk stones containing evil
    magic that must be covered; Muntilieru stones at a death site that must be covered
    by old men; and general methods of obtaining a wife by magic.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Where the old Injirra woman's body lay, a stone arose charged with arungquiltha;
    rubbing it while muttering curses can send the magic out to kill people.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old Alcheringa man of the brown-snake totem was blind; two men from Witjita
    stole his lubra while he was away from camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The blind brown-snake man followed the abductors with a long stick as far
    as Mount Frank, failed to recover his lubra, returned to camp, and went into the
    ground at Upnura-kanara, where a big gum-tree arose.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gum-tree at Upnura-kanara is called the blind tree, and the passage states
    that cutting it down would make nearby natives blind; rubbing its trunk while
    speaking to the arungquiltha can make an enemy blind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kaitish sun is regarded as having originally been a woman who arose in
    the east and travelled west to Allumba, where a great tree arose.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Allumba tree must not be destroyed or touched; killing it would burn up
    every native, and eating an opossum caught on it would transfer its magic and
    burn up the eater's insides.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near Undulia, two eagle-hawk totem men in the Alcheringa ate many eagle-hawk
    men, women, and children, became ill, and vomited up what is now represented by
    stone heaps called ulkutha.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ulkutha stones are said to be full of evil magic and must be covered with
    sticks; passersby throw sticks onto the heap to keep the magic down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that exposure of the ulkutha stones can make a passerby
    very sick, and gives an example of men who saw the stones and vomited forth their
    livers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An old Muntilieru ancestor tried to have intercourse with women who had not
    passed through the atna ariltha kuma ceremony; as punishment his penis was broken,
    and he and the women died at Atnintjimera.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two stones arose at Atnintjimera and are full of evil magic; the passage states
    that the magic kills any but old men who go near, and very old men sometimes throw
    stones and bushes onto the spot to keep the magic down.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that methods of obtaining a wife by magic are recognized
    throughout the tribes, vary little from tribe to tribe, and concern a woman who
    belongs to a lawful marriage class.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: If wife-obtaining magic succeeds, the man will later fight the individual
    from whom he has stolen the woman, and the woman will receive rough treatment.
  category: sequence
  evidence_refs:
  - ev:6
