canonical_text:
  quote: ''
  summary: The passage describes nose ornaments, including the kupitja as a special
    mark of the Warramunga medical man, then explains Arunta rules for sacred Churinga
    and associated ceremonies as inherited property passing through prescribed male
    kin lines, with food offerings given by young men when ceremonies are first shown
    to them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A nose-bone, stick, or leafy twigs may be worn through the nose-hole; the
    passage says this is usually ornamental and without present-day significance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kupitja is described as the only object of real import worn through the
    nose-hole and as a mark of the Warramunga medical man.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Arunta nation, individuals possess personal chattels, weapons, implements,
    and sacred objects called Churinga.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Churinga are kept in the sacred storehouse of the local group and are under
    the charge of the headman.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Churinga are said to have belonged to ancestors, and some have sacred
    ceremonies associated with them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Unlike ordinary chattels, Churinga and associated ceremonies must descend
    along a fixed line and cannot be transferred except along that line.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man dies with a mature son, the son, or eldest son if there is more than
    one, takes charge of the Churinga.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the son is still a boy, a younger brother of the dead man holds the Churinga
    until the son matures; if there is no son, the brother keeps them permanently
    and they later descend to his son.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A woman may have a Churinga nanja, but the passage says she never sees it;
    at her death it is transferred to a younger brother or selected tribal brother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A woman may be regarded as the reincarnation of a celebrated Alcheringa ancestor,
    in which case a special ceremony associated with the Churinga passes with it.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Possession of many Churinga and ceremonies brings repute and a material benefit
    because young men shown ceremonies for the first time must offer food to the owner.
  category: action
  evidence_refs:
  - ev:11
