canonical_text:
  quote: ''
  summary: The passage describes a formal welcoming context with staged and serious
    accusations, self-wounding, boomerang challenges, intervention by elders and women,
    moiety alignment, temporary separation, and later restored harmony. It then introduces
    a Walpari party visiting the Warramunga while following the path of a totemic
    ancestor, specifically a great white snake, and explains that such ancestors halted
    at mungai spots, performed ceremonies, and left spirit children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A challenged man and one challenger embraced, sat with arms around each other,
    and the challenged man said he would cut his shoulder through to the bone; after
    restraint, he inflicted only a slight stone-knife wound, and reconciliation followed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local man challenged a visitor, accused him of having killed his brother,
    and threw three boomerangs while the visitor defended himself with a shield and
    did not retaliate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The third boomerang shattered the visitor's shield and wounded his arm; older
    men then stopped the fight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Additional disputes involved accusations about undue familiarity with a man's
    lubra, causing a lubra's death, and failing to leave camp after an ikuntera's
    death until grass was green on the grave.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Women entered the dispute scene, yelling and gesticulating, and rushed between
    their relatives and anyone attempting to touch them despite risk from boomerangs
    and clubs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Older men attempted to quiet the hubbub; weapons were raised, a general fight
    seemed imminent, and after nearly three hours the disturbance quieted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The last quarrel revealed two moiety sides: Panunga and Bukhara together,
    and Purula and Kumara together; the Purula and Kumara retired and camped apart,
    and harmony later returned.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Formal-visit procedure is said to vary among tribes; the passage then gives
    an account of a Walpari men's party visiting the Warramunga while tracking an
    old totemic ancestor's path in the Poaripa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The text states that, unlike some Arunta ancestral groups, the more northern
    tribes typically had one great ancestor for each totemic group.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ancestral beings are described as walking, halting at spots, performing sacred
    ceremonies, and leaving spirit children from the body; such places are called
    mungai spots.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: In this instance the track followed by the party was that of a great white
    snake.
  category: attribute
  evidence_refs:
  - ev:11
