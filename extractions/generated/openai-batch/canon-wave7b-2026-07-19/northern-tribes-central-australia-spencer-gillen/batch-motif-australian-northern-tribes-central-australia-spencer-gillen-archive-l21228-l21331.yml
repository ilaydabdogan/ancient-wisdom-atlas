canonical_text:
  quote: ''
  summary: 'The passage recounts several Alcheringa traditions: Kulkumba, a wallaby
    boy left while his mother seeks grass seed, is taken by his father’s spirit Iwupa,
    later kills the women accused of abandoning him, and enters the ground with Iwupa
    to form an oknanikilla; Thaballa laughing boys emerge from and live within a rock,
    remain undying, and are ritually imitated; a frilled lizard man creates Powell
    Creek during retreat and is killed by the falling sky; two Warramunga women at
    a water-hole fight, die, enter the ground, and leave Itjilpi ant spirit children.'
  language: English
  quote_policy: summarized
