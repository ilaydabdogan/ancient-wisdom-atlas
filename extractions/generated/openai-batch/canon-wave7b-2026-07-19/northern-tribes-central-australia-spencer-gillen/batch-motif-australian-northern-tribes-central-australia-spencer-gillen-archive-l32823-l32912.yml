canonical_text:
  quote: ''
  summary: The passage describes designs on Churinga, including concentric circles,
    straight lines, and imitated animal tracks; explains examples connected with emu,
    snake, and sand-hill rat totems; notes a tradition about snake and emu ancestors
    meeting at a water-hole and leaving spirit individuals; and describes Arunta and
    Warramunga ceremonial ground-drawings associated with totemic rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stone Churinga is captioned as having a central series of concentric circles
    filled with a few incised straight lines.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tracks on Churinga are generally represented by straight or curved line groups,
    but some bird-totem Churinga show clearly imitative track marks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Churinga belonging to Ulperinia, a man of the emu totem, has one emu track
    represented on it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Churinga belonging to the snake totem in the Gnanji tribe has four emu tracks
    because the water-hole Whanaluru is traditionally connected with both snake and
    emu totems.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the ancestors of the snake and emu totems met at Whanaluru
    during their wanderings and left spirit individuals behind them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Churinga nanja of a man of the sand-hill rat totem imitates the animal’s
    hind-foot track pattern, with tracks passing up one side, around the end, and
    down the other side.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sand-hill rat Churinga is described as very old, with upper tracks almost
    obliterated by repeated rubbing with grease and red ochre.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Arunta ground-drawing associated with the Intichiuma ceremony of the emu
    totem consists of circles, patches, and sinuous lines in yellow, black, and red,
    outlined with white spots.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Parts of the Arunta emu ground-drawing represent eggs, laid and unlaid, feathers,
    intestines, and related features.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Warramunga tribe, ground-drawings form a prominent feature of ceremonies
    associated with certain totemic groups.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Warramunga ground-drawings are described as a mixture of conventional
    and partly imitative designs, comparable in that respect to the emu drawing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Four represented drawings are part of eight drawings made on the ground on
    successive days for Wollunqua and Thalaualla totem ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Usually one drawing was made for a day’s performance and rubbed out the next
    morning, though sometimes an old drawing was retained and a new one added.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Old men decided what particular ceremony was to be performed.
  category: action
  evidence_refs:
  - ev:8
