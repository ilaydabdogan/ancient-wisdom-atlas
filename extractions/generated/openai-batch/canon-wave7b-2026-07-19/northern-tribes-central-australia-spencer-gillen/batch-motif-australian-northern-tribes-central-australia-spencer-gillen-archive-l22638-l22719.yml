canonical_text:
  quote: ''
  summary: The passage describes Arunta sorcery using pointing-bones or pointing-sticks.
    A man prepares the implement in a lonely place while muttering curses, later approaches
    a victim secretly at night near the men’s camp fire, jerks the irna over his shoulder,
    and the evil magic called arungquiltha is said to go from the implement to the
    victim. The victim sickens and dies unless a medicine man removes the magic. The
    passage also describes concealment of the implement, possible retaliation against
    a known user, burning a string attached to the implement, and physical variants
    including injilla, irna, takula, and tjinpila.
  language: English
  quote_policy: summarized
