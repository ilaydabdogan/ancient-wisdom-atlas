canonical_text:
  quote: They could travel underground or mount into the sky, and could make creeks
    and watercourses, mountain ranges, sand-hills, and plains.
  summary: The passage introduces a chapter on beings with superior powers. It states
    that Alcheringa ancestors possessed powers beyond living people, including underground
    travel, ascent into the sky, and making landscape features. It also summarizes
    beliefs about initiation, bull-roarer spirit voices, named spirits, the absence
    of a supreme moral judge, and the lack of superior-being sanction for novice injunctions.
