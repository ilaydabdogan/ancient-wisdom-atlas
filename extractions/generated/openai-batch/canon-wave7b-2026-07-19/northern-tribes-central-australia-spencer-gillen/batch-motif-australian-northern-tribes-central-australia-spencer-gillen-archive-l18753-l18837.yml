canonical_text:
  quote: "“do not allow any boy or woman to see it or you will be killed.”"
  summary: 'The passage describes stages in a boy’s initiation: seclusion in the bush,
    revelation and carrying of the sacred murtu-murtu, hair-growing rites, return
    to camp with food exchanges, a speech ban released after food offerings and finger-biting,
    and handling of the circumcision foreskin and stone knife by related men.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The boy spends time in the bush under the charge of a Thungalla man while
    men of several named categories visit him; an old Tjupila identified as his actual
    father says they will show him murtu-murtu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before showing the murtu-murtu, the men except the Tjupila man make the boy
    lie down and “sing his hair” to make it grow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dusk the Thungalla man swings the bull-roarer; after dark a large fire
    is made, and by its light the old Tjupila shows the boy the sacred murtu-murtu,
    places the stick in his hands, explains its marks, and warns him not to lose it
    or let any boy or woman see it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A legend is told that the murtu-murtu was first made in the Wingara by a man
    whom wild dogs killed and ate, but the sacred stick was not destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a moon the boy remains in the bush under the charge of a Thungalla man,
    carrying the murtu-murtu until his wound heals, after which he gives it back to
    his Tjupila father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During seclusion the boy is visited by fathers, brothers, and naminni men
    and undergoes punthan, in which his scalp and chin are bitten to make his hair
    grow; only men with good hair actively take part.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When ready to return to camp, the boy collects bandicoots and sugar-bags,
    cooks the bandicoots in the bush, and has hair-string tied around his waist by
    a Thungalla man from camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night the boy walks toward the main camp carrying meat, followed by the
    Thungalla man swinging the murtu-murtu; near camp he places the meat at the foot
    of a tree and clings to the tree with hands and feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women related to the boy as kurnandi, pinari, and tjurtalia come carrying
    a pitchi full of yams, put their hands on him, take him away from the tree, receive
    bandicoots from him, and give him yams.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy sends a pitchi filled with sugar-bags to his actual mother, then gathers
    wallabies, bandicoots, and sugar-bags to give to men who had visited him and shown
    him their penes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Until the boy gives food to those men, he may not speak to them or in their
    presence; after receiving food each man gives him a finger to bite, releasing
    him from the ban of silence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The circumcision operation is performed by a man related to the boy as auiniari,
    turtundi, or tjurtalia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The foreskin, called gnuru, is wrapped in string with the stone knife used
    in the operation and taken by a tjurtalia man to the boy’s naminni, who gives
    food in return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The gnuru is placed either in a witchetty-grub hole in a tree to cause a plentiful
    supply of grubs, or in a ground-spider burrow to cause the penis to grow; the
    boy does not see the gnuru or know where it is placed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note states that after initiation the youth is expected to be too overcome
    to talk, is told he has seen strange things, and must not talk until told he may.
  category: speech
  evidence_refs:
  - ev:8
