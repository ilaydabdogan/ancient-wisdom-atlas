canonical_text:
  quote: ''
  summary: The passage explains how Mara, Binbinga, Anula, Urabunna, and Arunta social
    classifications are compared in relation to descent reckoning. It argues that
    classes and subclasses are deliberately regrouped to fit maternal, indirect male,
    or more direct male descent, especially on borders between tribes with different
    descent systems. Hypothetical examples describe a Murungun man entering Binbinga
    and a Tjuanaku man entering Mara, each being reclassified for purposes of marriage
    and children’s group membership. A Mara table then outlines marriage partners,
    children’s categories, and kin terms such as unkuku and irrimakula.
  language: English
  quote_policy: summarized
