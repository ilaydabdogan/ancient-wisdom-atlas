canonical_text:
  quote: ''
  summary: The passage describes Warramunga black-snake totem ceremonies, including
    performers bearing snake designs, ritual stroking called irrimunta, shaking ceremonies
    called purntu-purntu, ancestral accounts of a snake creating creeks and ranges,
    leaving spirit children, lending ceremony to a crow, and an incident involving
    Munga-munga women, yams, yam-sticks, trees, and stones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two performers went into the scrub, hid behind bushes, and then ran onto the
    ceremonial ground before the assembled audience.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: Two Kingilli men pressed down the performers' heads as they sat on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men came up in turn and stroked the drawing of the snake on the performers'
    backs; the action is called irrimunta and is said to please the snake in some
    way.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: One performer was a crow man who had inherited the Thalaualla ceremonies from
    his deceased father and held them until a suitable Thalaualla man could take charge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that, in the Alcheringa, an old crow ancestor was a mate
    of the snake and sat near him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tradition says the snake came up out of the earth, made Tennant Creek, created
    the Macdouall Range, and travelled onward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: As the snake travelled, he made sacred ceremonies and left spirit children
    behind at places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the purntu-purntu ceremonies the same two men shook their bodies vigorously
    while an old Tjupila man held them behind by the elbows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The performers' shaking is explicitly described as an imitation of the ancestor's
    shaking, and the flying white down is compared with spirit individuals emanating
    from him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Orpa ceremony each performer had a small red disc of down on the stomach
    and back for the water-hole and a curved red band for the snake.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Pittimulla ground drawing was made on a smoothed, dampened, red-ochred surface
    with white-dotted curved branching lines representing the creek and its banks.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Munga-munga women were told by Thalaualla that they were not snakes, must
    not paint themselves or make corroborees, and must carry only yams and yam-sticks.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: After being ordered away, the Munga-munga women left yam-sticks that are now
    represented by Kitji-paritji trees and dropped yams as they travelled east.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The dropped yams are described as being of the nature of Churinga, mainly
    deposited in Worgaia country, and changed into stones; the supplied passage cuts
    off during the stone-name phrase.
  category: object
  evidence_refs:
  - ev:13
