  quote: The form of magic most widely spread over the whole of Australia is undoubtedly
    that which is associated with pointing-sticks and bones.
  summary: The passage opens a chapter on magic by describing the widespread use of
    pointing-sticks and bones. It identifies Arunta and Ilpirra implements called
    injilla, irna, and takula; describes their forms; explains a Kurdaitcha use of
    the injilla in magical killing and delayed death; and notes broader regional variation
    in who may use such implements.
