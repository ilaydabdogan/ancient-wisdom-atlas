  evidence_refs:
  - ev:1
- id: obs:4
  text: Food restrictions are divided into totemic restrictions and other restrictions,
    including rules about food killed by special individuals and rules applying to
    particular persons at special life periods.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Arunta, Unmatjera, and Kaitish tribes, a man is forbidden to eat flesh
    from an animal killed or even seen by a man related to him as ikuntera, translated
    as father-in-law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Arunta case, the same restriction is also said to apply to food secured
