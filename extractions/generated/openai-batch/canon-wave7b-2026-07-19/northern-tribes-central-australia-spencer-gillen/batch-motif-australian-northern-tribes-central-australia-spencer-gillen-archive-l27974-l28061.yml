  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two men who are umbirna, translated as brother-in-law, are said generally
    to hunt together while avoiding their ikunteras.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When food is secured, men are said to have a first duty to send some of it
    to their ikunteras.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Before initiation, a boy is expected to send food to his father-in-law and
    may be chastised at the throwing-up ceremony if the father-in-law is dissatisfied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A man must avoid letting an ikuntera see him eating, because the food may
    be spoiled by equilla timma, glossed as projecting his smell into it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among the Urabunna, food caught by a father-in-law is not actually forbidden,
    but the son-in-law is expected in practice to give food presents to the father-in-law
    and to keep distance from his camp.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Among the Warramunga, a man keeps away from his father-in-law's camp, but
