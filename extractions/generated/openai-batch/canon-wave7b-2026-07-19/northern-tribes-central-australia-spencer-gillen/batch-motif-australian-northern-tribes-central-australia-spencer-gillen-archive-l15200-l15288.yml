canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of ceremonies connected with returning
    and handling Churinga: offerings of food and string are accepted; water and damper
    are ritually placed in mouths and spat toward Ulatherka before later drinking
    and eating; decorated shields and Churinga are explained, sung over, rubbed with
    red ochre, and pressed to stomachs; younger visitors are instructed in an Achilpa
    totem ceremony; Bukhara and Panunga men are presented to women with ancestral
    camp and totem information; and a final operation involves lying on shields while
    a stone Churinga and the Alatunja''s forehead strike the stomach.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A container of forehead bands and girdles with a large damper on top is placed
    before the Inwura leader; the local speaker apologises for the small offering,
    and the leader accepts it as enough.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local Alatunja brings a large pitchi of water to the Inwura leader; after
    the leader takes a little, local Alatunjas pour water into each visiting man's
    mouth, and each spits it toward Ulatherka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that participants in the ceremony of returning the Churinga
    had taken neither food nor water since daybreak; after the initial water rite,
    the pitchi is offered again and the men drink deeply.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Small pieces of damper are placed in the mouths of the Inwura leader and the
    visiting men; they turn and spit the food toward Ulatherka before later eating
    the offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Decorated shields that had been hidden are uncovered; their design is explained
    by the Emily Gap Alatunja, who presses the end of the shields against each man's
    stomach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kumara and Purula men who are not members of the totemic group retire before
    the strangers consume the food offering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the evening the Churinga are examined one by one and sung over for hours;
    four younger visitors are decorated, instructed in the performance and meaning
    of the Achilpa totem ceremony of Okirakulitha, and then perform it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The next morning Bukhara and Panunga men from the visitors are formally presented
    to assembled women of the corresponding local moiety, and each man's Alcheringa
    camp, mother's Alcheringa camp, and mother's totem are announced.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bukhara and Panunga moiety is described as especially associated with
    the Udniringita totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the evening the strangers perform an Achilpa totem ceremony connected with
    a place called Ertoatja.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Churinga are brought out, polished with red ochre, sung over, and pressed
    against each man's stomach; some local men weep while Churinga of dead relations
    are being rubbed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Men lie on two shields placed at right angles in a T shape; the local Alatunja
    prods and strikes each man's stomach with a heavy stone Churinga three or four
    times and then butts the stomach with his forehead, an operation named atnitta
    ulpailima.
  category: action
  evidence_refs:
  - ev:8
