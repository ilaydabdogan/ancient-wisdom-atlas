canonical_text:
  quote: ''
  summary: The passage describes a sequence of Wollunqua totem ceremonies. Ground
    drawings made of concentric circles, half-circles, wavy bands, colors, and dots
    represent named places, wells, trees, ant-hills, the snake ancestor’s emergence
    and failed descents into the ground, shed skin, movement, and episodes involving
    two hawks who made fire. Men are decorated, shown designs, circle or stand around
    them, and wear head-dresses or bands emblematic of Wollunqua.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonies are associated with named localities including Gnuratitji,
    Upitingnari, Tikomeri, Untjeri, Parrapakina, Mintilli, and Thakankalitjimeri.
  category: setting
  evidence_refs:
