  - ev:8
  - ev:10
- id: obs:2
  text: At Gnuratitji, a ground design had four series of concentric circles and a
    half-circle, representing an ant-hill, a native well, a gum-tree, and a rock-hole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Wollunqua came up out of the ground at Gnuratitji, after
    earlier underground travel, and later remained above ground until returning to
    Thapauerlu.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Gnuratitji design was shown and explained to Uluuru men, covered with
    boughs, and then circled by decorated men who sat on the boughs above it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Upitingnari, a design of five series of concentric circles represented
    ant-hills, mungai spots, a big tree, and a wavy band indicating Wollunqua’s tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Upitingnari and Tikomeri, Wollunqua is described as trying to go down into
    the earth but failing because the ground was too hard or stony.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: At Tikomeri, three gum-trees marked places where Wollunqua left spirit individuals,
    and wavy bands represented shed skin and his movements while wondering which way
    to travel.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Untjeri, a design represented a special gum-tree and two native wells,
    and some performers wore head-dresses with a broad wavy band representing Wollunqua.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Parrapakina, Wollunqua met two hawks who are said to have been the first
    individuals among the Warramunga to make fire by twirling two sticks together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Parrapakina and Mintilli designs represented a native well, the snake
    standing and gazing about, fire made by the hawks, native wells where birds searched
    for white ants, and a gum-tree where inedible ant parts were thrown.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: At Thakankalitjimeri, performers wore snake head-dresses and broad curved
    bands emblematic of Wollunqua, and the drawing included a wavy band representing
    Wollunqua.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: For four later ceremonies, the ground color on the earth was changed from
    red to yellow.
  category: attribute
  evidence_refs:
