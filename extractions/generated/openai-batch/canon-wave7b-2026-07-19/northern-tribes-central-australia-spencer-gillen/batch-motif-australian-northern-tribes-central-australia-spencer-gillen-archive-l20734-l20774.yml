canonical_text:
  quote: ''
  summary: A little euro is secretly fed with milk by a Miniria totem woman until
    it grows and departs. It travels through named places, defeats women and a man
    with lightning, then approaches rain totem women who are his father’s sisters.
    After they refuse his sexual request and he rejects their grass seed, they kill
    him with pitchis. The euro descends into the earth with a lightning Churinga,
    and the women descend over him with their grass-seed Churinga, forming a large
    oknanikilla.
  language: English
  quote_policy: summarized
