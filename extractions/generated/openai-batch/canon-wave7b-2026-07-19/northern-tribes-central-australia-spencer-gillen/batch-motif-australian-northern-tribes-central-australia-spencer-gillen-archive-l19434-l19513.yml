canonical_text:
  quote: ''
  summary: A novice is separated from ordinary camp life, concealed under paper bark,
    shown tabooed ceremonial actions, instructed in totemic ceremonies, circumcised,
    and incorporated into special kin relations through blood contact and later handling
    and burial of blood and foreskin near water-holes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy marks named men with painted lines, places food opposite Thungallum
    men identified as his future wife’s brothers, gives it to them, and returns to
    his father’s camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After women leave the ceremonial ground, men perform sacred ceremonies; the
    next day strangers remain there while further ceremonies are performed, and the
    boy is sent to the meimi woman’s camp with instructions to lie quietly and sleep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sundown, local men stand in a single line with women behind them, and the
    meimi woman brings the boy covered in paper bark while telling him to keep his
    eyes on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The meimi man makes two small fires and has the boy lie between them, completely
    covered with sheets of paper bark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The meimi man strikes two clubs together and calls out the countries of the
    assembled parties; painted men then circle while waving burning paper-bark torches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At night, men recalled by whistling come with twig-decorated legs, clang boomerangs,
    wave paper-bark torches, march around the hidden boy, advance and retire, and
    sing loudly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The meimi man covers his eyes, brings up the Pungarinji man connected with
    the boy’s earlier carrying into camp, and the boy lifts the bark and looks at
    the painted men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boy is told that what he has seen and will see is kurta-kurta, tabooed,
    and must not be spoken of to women or children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sacred totemic ceremonies are performed in turn by named groups and explained
    to the boy while songs referring to his own totem are sung.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before dawn, the men clash boomerangs; the meimi man hands a knife to a Pungarinji
    man, warms his hands at a fire, and places them on parts of the boy’s body.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Two Thungallum men described as napi-napi, wife’s brothers to the boy, lie
    on the ground; the meimi places the boy on top of them, puts fur-string in his
    mouth, and tells him not to cry out.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The meimi man sits astride the boy, pulls up the foreskin, and the Pungarinji
    man cuts it off.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The boy is lifted so that some blood drips onto the backs of the two Thungallum
    men, establishing a special friendly relationship between the boy and them.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Spears and boomerangs are presented to the boy after the cutting.
  category: object
  evidence_refs:
  - ev:14
- id: obs:15
  text: Some blood is placed in a paper-bark dish and, with the spears and boomerangs,
    handed by the father to the boy’s tjakaka, who is told to bury the blood in the
    bank of a lily water-hole.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The foreskin is tied in bark, passed from the tjakaka to the meimi and then
    to a distant tribal father, returned with a present of spears, cut into pieces
    by the tjakaka, and buried beside a water-hole.
  category: sequence
  evidence_refs:
  - ev:16
