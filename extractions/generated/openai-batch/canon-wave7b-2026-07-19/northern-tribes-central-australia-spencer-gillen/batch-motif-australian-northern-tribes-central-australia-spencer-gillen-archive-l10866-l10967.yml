canonical_text:
  quote: ''
  summary: The passage describes Urabunna beliefs about Alcheringa/Ularaka ancestors
    who were partly human and partly animal or plant, founded totemic groups, left
    spirit individuals or spirit children at sites, and whose spirits undergo reincarnation.
    A tradition of two Kurnmara snakes describes their emergence, travel, making of
    fur-string, leaving of mai-aurli, creation of mound springs, association with
    moieties, pursuit of a yellow snake, descent into the ground, and the arising
    of three springs at their disappearance. The passage also notes local totem centres
    inhabited by spirits of one or more totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Urabunna term for the Alcheringa is given as Ularaka.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the early time there existed a small number of beings described as half-human
    and half-animal or plant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The semi-human beings could move on the earth, beneath the earth, or through
    the air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The semi-human ancestors are said to be ancestors of different totemic groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Examples are given in which a carpet snake individual gave rise to the carpet
    snake group, two jew lizards to the jew lizard group, and one or two rain creatures
    to the rain group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ancestors wandered over Urabunna country, performed sacred ceremonies,
    and deposited spirit individuals called mai-aurli in the ground or in natural
    features such as rocks and water-pools.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some mai-aurli became men and women who formed the first series of totem groups.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mai-aurli are described as continually undergoing reincarnation since
    the early institution of the totem groups.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:9
  text: Two snakes called Kurnmara belonged to the Kirarawa moiety.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A green snake and a brown snake arose in the Alcheringa and initially sat
    inside the Yanidi water-hole making fur-string.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two snakes travelled to Mura-murara, made string, ate grass seed, and
    left mai-aurli from their bodies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The snakes saw smoke toward the Macumba River, where the country was on fire.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: During their travels the brown snake led and the green snake followed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The two snakes made all of the mound springs characteristic of the country
    described in the passage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The snakes built two stone shelters at Mount Margaret Hill, with one snake
    sitting in each.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: As they walked, the snakes hollowed out the course of Umbinga Creek and made
    named springs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The green snake said to the brown snake, “I am Kirarawa, you are Matthurie.”
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The snakes left spirits or mai-aurli at all of their camping places.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: At Kirri-katjirina the green snake saw and chased a yellow snake.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The yellow snake dived into the ground, followed nearby by the green snake,
    while the brown snake went down in another spot.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: Three springs arose to mark the place where the snakes finally disappeared.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:22
  text: Some local spirit sites contain spirits of one totem only, while others contain
    spirits of multiple totems.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:23
  text: Granite boulders near the authors’ camp are said to mark where pigeon ancestors
    danced and played, with one boulder representing an old male ancestor and another
    a female ancestor.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:24
  text: A nearby water-pool is described as inhabited by spirits left by emu, rain,
    and grub ancestors.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:25
  text: The Urabunna local totem centres are called paltinta, and the place where
    a great ancestor finally went down into the earth is called bara-koptiqtia.
  category: speech
  evidence_refs:
  - ev:14
