canonical_text:
  quote: a virtue of some kind passes from it to him and also from him to it
  summary: The passage describes beliefs about Churinga as sacred objects made by
    powerful ancestral figures, accumulating virtue through successive owners. A man
    who owns a snake Churinga rubs it and sings the Alcheringa history of the snake,
    forming a reciprocal association with the object. The passage also describes animal-like
    eponymous ancestors, the black snake ancestor's establishment of local-totem centres
    and spirit children, a tradition of a snake stealing a Churinga from Wollunqua,
    and regional differences in the ceremonial use or absence of Churinga and bull-roarers.
  language: English
  quote_policy: quoted
