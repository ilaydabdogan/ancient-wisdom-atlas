canonical_text:
  quote: ''
  summary: The passage compares Churinga beliefs and related objects among several
    northern and central Australian groups. It describes differing associations between
    Churinga, spirit individuals, totems, initiation bull-roarers, whirlwinds, and
    spirit children who enter mothers. It also summarizes variant rules by which spirit-child
    conception is reconciled with local or paternal totemic descent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in one set of tribes each Churinga is associated with
    a spirit individual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the Warramunga, Wulmalla, Walpari, Tjingilli, Umbaia, and Gnanji, Churinga
    are described as closely associated with totems but not practically used in sacred
    totemic ceremonies, and not associated with spirit individuals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the Binbinga, Anula, and Mara, Churinga are described as few in number
    and as lacking the close association with totems or spirit individuals described
    elsewhere.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes a suggestive relationship between the whirlwind and
    the bull-roarer used at initiation; the bull-roarer is connected with the totem
    of the Alcheringa individual who first introduced the ceremony.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The authors state that northern Churinga appear to them to be surviving relics
    of a time when beliefs resembled those then found among the Arunta.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that every tribe discussed has the idea of spirit children
    of special totems inhabiting spots and passing from those spots into mothers'
    bodies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Arunta and Kaitish description, each spirit child has its own Churinga
    and can enter any woman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Arunta and Kaitish example, a child conceived while the mother is away
    from her own country belongs to the totemic group of the locality where conception
    occurs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Gnanji description, if a woman conceives away from a locality connected
    with her husband's totem, a spirit child of the husband's totem is said to have
    followed her, so the child normally belongs to the father's totem.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Binbinga, Mara, and Anula description, a spirit child left by Alcheringa
    ancestors is said to enter only a woman whose husband's totem is the same as its
    own.
  category: action
  evidence_refs:
  - ev:8
