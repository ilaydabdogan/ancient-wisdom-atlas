canonical_text:
  quote: ''
  summary: The passage describes naming customs among several northern Central Australian
    groups, with emphasis on Warramunga sacred and ordinary names, initiation-related
    bestowal of sacred names, names linked to ancestral places or ancestors, totemic
    body designs, and inter-moiety participation in ritual contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some personal names are said to have definite meanings, including meanings
    involving clouds, throat, sunshine, and drying up water; these names are known
    to women, and the passage reports no trace of sacred names in the Urabunna case
    discussed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kaitish and Unmatjera naming conditions are stated to be precisely similar
    to those of the Arunta.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Warramunga, Wulmala, and Walpari groups, each man is said to have both
    an ordinary name and a sacred name.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among Warramunga people, ordinary names are seldom used in address; relationship
    terms or subclass names are more commonly used.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warramunga women are said to know ordinary names but not to be permitted to
    employ them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Warramunga man's name may sometimes be changed when he is initiated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Warramunga sacred name is said always to be given by the paternal grandfather,
    and may be the name of a place where the person was left in spirit form in the
    Wingara or the name of a celebrated ancestor who lived since the Wingara.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sacred name Marungungina is also the name of a water-hole in the Murchison
    Range where a spirit represented by the present headman was left by the great
    Wollunqua.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man is fully initiated before receiving a sacred name in the Warramunga
    example described.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:10
  text: A Thapungarti man was taken by old men to the place where his ancestral spirit
    had dwelt in the Wingara and was decorated with the mongwura, the distinctive
    totemic design.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the decoration, the elders told the man that the mark belonged to his
    place and that he should not look out along another place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The note explains this instruction as meaning that the man must not interfere
    with ceremonies of other totems and that it indicates close association between
    a man, his totem, and a totem-connected place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The presence of a man from the other tribal half is explained as probably
    connected to the rule that totemic groups maintain the animals or plants after
    which they are named and perform increase ceremonies only after request from men
    of the other moiety.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'The passage contrasts Warramunga sacred-name practice with Arunta practice:
    in Warramunga the sacred name is given only to a fully initiated man and is less
    secret, while in Arunta it is given at an early age and is highly secret.'
  category: relationship
  evidence_refs:
  - ev:9
