canonical_text:
  quote: ''
  summary: The passage describes atnitta ulpailima as a ceremony or ordeal associated
    with sacred ceremonies and the return of Churinga, including bodily striking,
    effects on appetite, generosity, and inner perception. A note links the same term
    to rubbing Churinga with red ochre, treating the Churinga as ancestor-associated
    and feeling-bearing. The passage then describes aralkalirrima, in which a local
    Alatunja strokes two men's mouths and beards with a Churinga, and introduces a
    witchetty grub totem ceremony representing the adult insect stage and attributed
    to the ancestor Intwailiuka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men were struck during the ceremony; the passage says the force in this instance
    was milder than on some prior occasions, when vomiting and passing blood had occurred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atnitta ulpailima is described as occurring, in milder form, after a sacred
    ceremony, when a performer's inward parts are thought to be tied in knots because
    of emotion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In its special ordeal-like form, the ceremony is said to make men good in
    the local sense, lessen appetite, encourage food-sharing, and remove hard-hearted
    greediness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:4
  text: The ceremony is said to give the intestines sight, enabling a man to know
    of a wife's unfaithfulness and to feel or detect danger from evil magic, including
    the presence of a Kurdaitcha.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:5
  text: The same word ulpailima is used for rubbing Churinga with red ochre, an action
    glossed as softening the Churinga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Churinga is described as more than wood or stone, closely associated with
    an ancestor, and as having feelings that can be soothed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: After most of the men had undergone the ceremony, two Purula and Kumara men
    from distant northern groups knelt beside the local Alatunja.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The local Alatunja stroked the two men's mouths and beards with the Churinga
    in a ceremony called aralkalirrima.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Alatunja of the Jessie Gap group performed a witchetty grub totem ceremony
    at the request of the Alatunja of the Emily Gap group.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The witchetty grub ceremony represented the maegwa, or adult insect stage,
    and was said to have been originally performed by the ancestor Intwailiuka.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Only Bukhara and Panunga men were present while the performers were decorated;
