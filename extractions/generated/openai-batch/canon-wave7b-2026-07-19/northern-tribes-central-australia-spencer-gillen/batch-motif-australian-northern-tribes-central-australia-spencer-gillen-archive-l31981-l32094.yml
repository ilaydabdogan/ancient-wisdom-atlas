canonical_text:
  quote: ''
  summary: The passage describes decorations on boomerangs, forehead-bands, a pitchi,
    rock drawings, and ceremonial objects. It emphasizes geometric line-and-dot designs
    without special meaning, limited attempts to imitate natural objects, ordinary
    versus sacred rock drawings, restricted viewing by initiated men, and the non-narrative
    arrangement of rock drawings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Figures 287 and 288 are identified as Warramunga boomerangs decorated with
    line-and-dot ornament and grooves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The line-and-dot designs on the boomerangs are described as having no special
    meaning and as not imitating or suggesting any natural object.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Forehead-band decoration among the Arunta and Kaitish may be elaborate, while
    more northern examples are described as more definite in form and less elaborate.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Forehead-band ornamentation may include white pipe-clay, flower or bud down,
    bark dust, painted white and red bands, and sometimes red and blue string obtained
    through contact with white men.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that decorations on special-occasion Arunta and Kaitish
    forehead-bands resemble Churinga decorations, while also reporting that the natives
    say the two have nothing to do with one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Concentric circles and spirals are said to occur as common designs on everyday
    articles among people who use Churinga most frequently, namely the southern central
    tribes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A decorated pitchi includes four crudely drawn lines and spots of pipe-clay
    and a conventional drawing of a dugong made by an Anula native.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Apart from the commonly encountered emu track, the dugong drawing is described
    as almost the only observed attempt to imitate natural objects on implements among
    the tribes discussed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rock drawings are divided into ordinary drawings at places open to men and
    women and sacred drawings at ceremonial places that only initiated men may see.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rock drawings include zoomorphs, phytomorphs, drawings of hands and feet,
    stencilled hands usually in red ochre, and geometrical designs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sacred rock drawings are described as apparently geometrical or so conventionalized
    that any imitative referent cannot be recognized.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Rock drawings are said to occur scattered about, without apparent grouping,
    and not to depict a scene or tell a story.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ceremonial objects are divided according to whether they are used in ordinary
    corrobborees visible to men, women, and children or in sacred ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Each corrobboree is said to have its own decorations, though there is considerable
    uniformity among them.
  category: attribute
  evidence_refs:
  - ev:6
