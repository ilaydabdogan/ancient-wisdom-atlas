canonical_text:
  quote: ''
  summary: The passage reports anthropometric measurements and classifications of
    head and foot form among Arunta, Warramunga, and related groups; notes absence
    of artificial head deformation; describes toe dexterity, hardened soles, turned-out
    gait, and a convention for drawing human tracks; and includes captions for photographic
    figures of Binbinga, Anula, Wilingura, Anula, and Mara people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports average cephalic indices for 41 male subjects and 26 female
    subjects, then gives adjusted cranial indices after subtracting two units according
    to Broca.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among male subjects, the cephalic-index range is given from an Arunta man
    at 80.5 to a Warramunga man at 66.6; the Warramunga man is described as head of
    a leading totemic group and influential in the tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among female subjects, the cephalic-index range is given from an Arunta woman
    at 80.7 to a Warramunga woman at 68.1, with six of fourteen Warramunga women below
    70.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a series of 67 measurements arranged by Broca’s divisions, the passage
    classifies 58 as dolichocephalic, 5 as sub-dolichocephalic, and 4 as mesaticephalic.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that, except for one woman, all Warramunga in the measured
    northern group are dolichocephalic, while deviations are described as practically
    confined to the southern group.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For immature children, the passage gives averages and ranges for seven females
    and six males; the six immature males are all identified as Warramunga and dolichocephalic.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The authors state that they have not encountered any attempt at artificial
    deformation of the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage compares foot length between Warramunga and Arunta subjects and
