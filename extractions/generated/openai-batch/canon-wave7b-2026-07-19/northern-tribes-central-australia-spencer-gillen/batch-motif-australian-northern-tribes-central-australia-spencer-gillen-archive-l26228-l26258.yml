  summary: The passage describes an Atninga avenging party preparing flaked sticks
    by singing over them at night, then approaching a ceremonial ground armed and
    dancing. The leader, identified as the brother of the dead man, ritually imitates
    spearing the culprit before the group halts, fixes spears upright, and sits in
    silence.
