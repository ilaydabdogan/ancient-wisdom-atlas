canonical_text:
  quote: "“bound together in friendship and obliged to assist one another”"
  summary: 'The passage describes procedures for drawing blood, tribal and moiety
    rules about who provides blood and ceremonial materials, a dispute over a father-in-law’s
    right to decorate a son-in-law, and several uses of blood: pledging mutual assistance,
    preventing treachery, strengthening an older man, drinking or exchanging blood
    when water is unavailable, and sprinkling blood for cooling.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Blood is drawn either from the urethra or from a small cut in the arm; the
    passage notes different ways the bleeding stops or is stopped.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Adult persons are described as having small forearm lumps that mark places
    where veins have been cut for drawing blood.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Special individuals or groups within a tribe are responsible for providing
    blood on different occasions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Arunta and Kaitish examples, blood for a ceremony belonging to one
    moiety must be drawn from a member of the same group, while the other moiety is
    generally excluded from witnessing preparations or providing materials.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'In the Warramunga and Tjingilli examples, the arrangement is reversed: an
    Uluuru ceremony is decorated by Kingilli men, who provide down, ochre, blood,
    and other materials.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The performer’s father-in-law is described as having the first right to provide
    or oversee the decorating materials, though he may waive the claim.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Warramunga father-in-law became angry when another man decorated his son-in-law
    without permission, came armed to the corrobboree ground, threatened the assembled
    performers, and was later reconciled with the other man by older men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the reconciliation, the father-in-law embraced the other man, and the
    passage states that once a quarrel or wrong has been settled, no later reference
    is made to it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The drawing and drinking of blood on certain occasions is described as binding
    participants together in friendship, obliging mutual assistance, and making treachery
    impossible.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before an Arunta avenging expedition, participants were touched with a hair
    girdle from the man whose death they intended to avenge, then drew blood from
    their urethras and sprinkled it over one another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For the same pledging purpose, blood may be drawn from the arm and drunk;
    rarely, a man who declines may have his mouth forced open and blood poured into
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A young man may open an arm vein and let blood sprinkle over an older man’s
    body, with the stated idea of strengthening the older man, who may also drink
    a little.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When very thirsty and no water is available, men may drink their own blood
    or exchange blood with another man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Under thirst conditions, men may sprinkle blood over one another’s heads with
    the stated idea of cooling one another.
  category: action
  evidence_refs:
  - ev:9
