canonical_text:
  quote: ''
  summary: The passage describes several magic practices associated with bodily growth,
    puberty-related development, fattening, and postmortem hair among northern Central
    Australian groups. Girls are painted, adorned, sung over, secluded, given charmed
    containers or bands to carry, and in some cases made to sleep on ashes. A lean
    woman is given a fat young opossum to eat. Tjingilli men perform wantju ceremonies
    dealing with totems to promote the growth of younger tribal members, who are excluded
    from the ceremonies. The passage also surveys the removal and magical use of hair,
    beard, or whiskers from dead men across multiple tribes, including named sacred
    objects and a Warramunga practice in which women carry locks of a dead mother’s
    brother’s whiskers as a sign of assignment to a man and as protection from other
    men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl is rubbed with fat, painted with red ochre around the nipples and in
    lines on the chest and back, decorated with fur-string, and kept at a special
    bush camp under her mother’s charge until the design wears off.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Kaitish tribe, a paternal grandfather sends a small pitchi containing
    string, fat, red ochre, eagle-hawk feathers, rabbit-bandicoot tail tips, and charcoal,
    all charmed by singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kaitish maternal grandmother takes the girl into the bush, sings over
    her all day, paints designs on her face and body, attaches feathers and tail tips
    to droop over her forehead, and fastens a fur-string band around her neck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kaitish girl carries the pitchi until her breasts develop, then breaks
    and throws it away; she keeps hair-string and bands until milk first comes into
    her breasts, then gives them to her elder sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Warramunga, a man to whom a young girl has been allotted sings and
    mutters incantations over parts of her body while she lies flat on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Warramunga ritual practitioner sings the girl’s head-bands, replaces them
    on her head, puts fur-string across her shoulders and under her arms, and gives
    her a sung bean-tree pitchi to carry so that it will make her grow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night, the Warramunga girl is made to sleep on ashes, which are said to
    make her grow strong and fat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: To make a lean woman fat, the Warramunga give her a specially fat young opossum
    from its mother’s pouch to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tjingilli perform wantju ceremonies dealing with various totems to promote
    the growth of younger tribal members, who are not allowed to see or participate
    in them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Across the tribes surveyed, hair of the head, beard, or whiskers is wholly
    or partly removed after death and used for magic purposes, with different parts
    removed in different tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Postmortem hair is made into named sacred objects and taken out by the avenger
    of the dead man; it is kept because it is thought to carry the attributes of the
    dead man and give power to its possessor.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a Warramunga exception, women carry small tana parcels containing locks
    of a dead mother’s brother’s whiskers; the possession of the lock indicates assignment
    to a particular man and is said to protect magically against other men’s advances.
  category: relationship
  evidence_refs:
  - ev:9
