comparison_claims:
- id: claim:1
  claim: The passage presents postmortem hair magic as a regional cross-tribal pattern,
    while noting local differences in whether head hair, whiskers, beard, or combinations
    of these are removed and preserved.
  claim_level: same_function
  target: postmortem hair practices among Urabunna, Arunta, Kaitish, Unmatjera, Warramunga,
    Tjingilli, Walpari, Wulmalla, Umbaia, Worgaia, Gnanji, Binbinga, Anula, Karawa,
    and Willingura groups as listed in the passage
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the ethnographic survey given in this passage
    and does not establish historical contact or common inheritance.
- id: claim:2
  claim: Kaitish and Warramunga girl-growth customs share the same stated function
    of promoting growth through sung or charmed objects and bodily treatment.
  claim_level: same_function
  target: Kaitish and Warramunga girl-growth rites described in the passage
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The specific ritual personnel, objects, and sequences differ; the passage
    does not claim a shared origin.
- id: claim:3
  claim: The Tjingilli wantju ceremonies are explicitly distinguished from customs
    known in the other tribes studied by the authors.
  claim_level: same_function
  target: Tjingilli wantju ceremonies compared with other tribes mentioned by the
    authors
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports the authors’ awareness only; it does not prove
