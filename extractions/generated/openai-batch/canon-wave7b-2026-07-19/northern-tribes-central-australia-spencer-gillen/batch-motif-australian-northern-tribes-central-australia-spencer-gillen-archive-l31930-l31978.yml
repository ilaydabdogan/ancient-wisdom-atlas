  summary: The passage describes Warramunga boomerang decorations and the preparation
    of pigments for decorative or ceremonial use. It notes ochre bands, black dots,
    black lines, white dots, charcoal mixed with grease, white pipe-clay paste, finger
    application, and a frayed twig brush. It also describes pipe-clay being chewed
