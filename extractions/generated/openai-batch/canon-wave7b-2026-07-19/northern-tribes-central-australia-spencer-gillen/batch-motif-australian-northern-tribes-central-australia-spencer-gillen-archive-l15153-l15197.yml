canonical_text:
  quote: ''
  summary: A decorated bundle containing forty-two stone Churinga is ceremonially
    brought by Inwura men to local Alatunjas. The bundle is placed on the knees of
    the Emily Gap Alatunja and then on his son's knees. Participants crouch and are
    raised; the bundle and later its contents are rubbed or pressed against the bodies
    of selected men. The Inwura leader slowly unwinds the hair-string covering while
    local men chant mournfully and some weep. Human hair-string girdles are presented
    to the local Alatunja, and the Churinga are finally disclosed and laid on shields.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bundle was decorated with red and white down and alpita tail tips and
    contained forty-two stone Churinga.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Inwura men approached the local group; two Alatunjas sat down; the bundle
    was placed on the knees of the Emily Gap Alatunja and then on the knees of his
    son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the leader stooped with the bundle, both the Inwura party and the local
    group crouched; the Emily Gap Alatunja raised each man to his feet, and all sat
    down again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Emily Gap Alatunja rubbed the bundle over the thighs and stomachs of elder
    men while singing lowly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Inwura leader rubbed the bundle over the thighs and stomachs of some of
    his own party and then slowly unwound the hair-string forming its outer casing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Local men chanted mournfully, and some wept; the passage says this was apparently
    because they were reminded of dead relatives represented by some of the Churinga.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The unwinding of the hair-string swathing took about an hour and a half because
    it was done slowly and deliberately.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Human hair-string girdles from the bundle were laid on shields and handed
    over as a present to the local Alatunja, who rubbed them on his own thighs and
    stomach and on those of older men in his party.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the Churinga were disclosed, each was taken out by the Inwura leader,
    pressed against the stomach of the local Alatunja and those of elder men, and
    laid on shields with girdles and balls of hair-string.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After all objects were unpacked, the local Alatunja moved the shields and
    their contents to one side.
  category: action
  evidence_refs:
  - ev:10
