canonical_text:
  quote: ''
  summary: The passage introduces the atninga or avenging party among the Arunta at
    Alice Springs. A death is attributed by medicine men to evil magic by a distant
    man, prompting organization of an avenging party. The dead man’s brother brings
    a girdle made from the dead man’s hair and performs ceremonies involving the assembled
    men, including penis-hand rubbing and pressing the hair girdle against each man’s
    stomach to strengthen and pledge them. The chapter synopsis also lists further
    rites, departure and return, and the dead man’s spirit following in bird form.
