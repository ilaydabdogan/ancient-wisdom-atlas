canonical_text:
  quote: ''
  summary: 'The passage describes mortuary rites among Mara, Anula, Binbinga, and
    related groups: flesh of the dead is eaten by prescribed kin or moiety representatives;
    bones are collected, wrapped in paper bark, placed near the parents, dried, and
    installed in a forked upright stick inside a sand-bordered space with a continuously
    maintained special fire. The fire is called koaka, is subject to approach and
    contact restrictions, and is associated with the dead person’s spirit. The father
    also prepares a named arm-bone object called kallaua.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that similar ceremonies occur among the Mara and Anula,
    and that the Binbinga, Anula, and Mara ceremonies are practically identical apart
    from participant details.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Anula woman’s case, the deceased belonged to the Wialia division and
    Barramunda totem; her body was disembowelled by a Roumburia man, and four participants
    included two Wialia tribal fathers and two Roumburia mother’s brothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists the totems of the Anula woman and participating kin, then
    states that eating the flesh of a dead person is not concerned with the totem
    group.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: In another Anula case, a Roumburia man’s body was disembowelled by an Urtalia
    man who was the deceased’s mother’s brother; other participants belonged to Wialia,
    Urtalia, and Awukaria groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the flesh has been eaten, the bones are collected, wrapped in paper
    bark, and taken by the mother’s brother to the camp of the dead person’s father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother’s brother places the parcel of bones in front of the father and
    mother, who are seated with bowed heads; the father must watch over the bones
    until the final ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The bones are spread on a small platform to dry, wrapped again in paper bark,
    and fixed into the fork of a stout upright stick.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The upright stick and bone parcel stand in a cleared space outlined by a raised
    circle of sand with an opening at one side; a small fire is kept continuously
    burning inside the circle.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The special fire is called koaka, is lit by rubbing two sticks together, may
    only be approached by the father and mother, and must not supply a fire-stick
    to be taken away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says koaka is regarded as kurta-kurta, a term also applied to
    initiated boys who are out in the bush and may not come into contact with or be
    seen by women.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dead person’s spirit is supposed to hover over the bones and fire and
    may sometimes be seen by the father and mother standing beside the little fire.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bones are not concealed; the authors report seeing such a forked stick
    and sand mound in the middle of a Binbinga camp near the Macarthur River.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: The father takes an arm-bone, applies red ochre, ties it with fur-string,
    coats it with pipe-clay, and the resulting object is called kallaua.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The figure caption describes a parcel of dead man’s bones wrapped in paper
    bark and placed in a forked branch, with a horse-shoe-shaped ridge of sand around
    the base and a small fire within it.
  category: object
  evidence_refs:
  - ev:7
