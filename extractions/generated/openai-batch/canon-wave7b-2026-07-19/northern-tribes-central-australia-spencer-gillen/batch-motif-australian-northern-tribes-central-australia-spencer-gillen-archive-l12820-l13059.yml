canonical_text:
  quote: ''
  summary: A dated ethnographic schedule records Uluuru and Kingilli ceremonies connected
    with totems, including named animal, object, and natural-force ceremonies, fire
    ceremony actions, pole erection, male seclusion, women’s dancing or fleeing, all-night
    singing, a Miniurka performance, and mourning or final burial rites involving
    bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists dated Uluuru and Kingilli ceremonies from August 12 through
    September 18, 1901.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several ceremony names are glossed as animals, objects, or natural phenomena,
    including boomerang, lizard, emu, echidna, white ant eggs, carpet snake, snake,
    cold, white cockatoo, little bird, and wild cat.
  category: object
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: For the fire ceremony, participating men camped apart, women and children
    gathered nearby, and the men approached in single file while alternating between
    walking upright and kneeling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After approaching the women and children, the men wheeled round, ran away,
    and left to spend several days in the scrub.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A pole called Tjirilpi was erected in connection with the fire ceremony; women
    danced around it, and ochre-decorated men approached and marched around it in
    single file.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bone-arm of a dead Thungalla man was brought into camp before final burial
    rites.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: On September 6, Tjapeltjeri and Tjunguri men remained all day inside a bough
    wurley, five men were decorated for a Tjudia ceremony, and the day was spent in
    dancing and singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On September 6, women were rounded up and fled into a wurley, while men hurled
    bark and sticks at it; the fire ceremony was enacted late at night and continued
    until daybreak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage notes mourning ceremonies for a Tjunguri man, bone-breaking and
    final burial for a Tjunguri woman, and a final burial ceremony connected with
    the bone of a Thungalla man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Miniurka was made and brought onto the ground by Uluuru men, sung over all
    night, and performed at daybreak when the Uluuru summoned the Kingilli to see
    it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The observers state that they saw eighty-eight sacred totemic ceremonies during
    their stay among the Warramunga.
  category: other
  evidence_refs:
  - ev:7
