canonical_text:
  quote: ''
  summary: In the Alcheringa, three Unmatjera men of the Yarumpa honey-ant totem are
    described as a father, Hliaba, and two Panunga sons. The sons seek women, identify
    proper partners by class, and return with Purula and Umbitjana women. The men
    and women exchange wallaby meat and manna. The father performs sacred ceremonies
    involving fire, food offerings, dancing, a forehead-band offering, and release
    of the younger son from silence by stroking his mouth with mulga leaves. Later
    an old Inarlinga echidna man, identified as an Oruntja or mischievous spirit,
    watches from a hill and causes the elder son’s thrown boomerang to curve around
    the hill and strike the younger son. The father and elder son dive into the ground,
    leaving their Churinga behind, while the Inarlinga rolls into the camp and remains
    there until he dies.
  language: English
  quote_policy: summarized
