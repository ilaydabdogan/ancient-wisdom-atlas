canonical_text:
  quote: ''
  summary: The passage opens a chapter of traditions relating to totemic ancestors.
    It recounts Irria transferring rain-making power to Inungamella through gypsum
    lumps and ritual instructions; Ululkara the emu man being killed at Central Mount
    Stuart, where a hill and emu totem centre arise; and traditions of Yelka women,
    old men seeking to take women away, hills formed from husks or marked by disappearance
    into the earth, and Illippa killing a woman before founding wild-cat ceremonies
    and dying as a totem centre.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Inungamella visits Irria from the north, tries to persuade him to return with
    him, and later rests behind a large sand-hill on the way home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Irria is described as a great rain-maker; he begins making rain while wearing
    cockatoo feathers in his hair, and heavy rain falls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains Irria’s cockatoo feathers by saying that, in the Alcheringa,
    the black cockatoo brought rain down from the north.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Irria removes large lumps of gypsum from his belly and gives them to Inungamella,
    saying they will enable him to make rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Irria gives Inungamella ritual painting instructions: Inungamella is to paint
    one band around his body and not cover his face so as to make himself blind, while
    Irria himself will always cover his face.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inungamella places the gypsum lumps in the ground at Erlithera Creek; the
    lumps represent clouds, enable rain-making, and are associated with a rain totem
    centre there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ululkara, an emu man, arrives at Upmarkunja, now called Central Mount Stuart,
    where other emu men are eating emu.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The emu men become angry after Ululkara asks why they did not give him some
    emu, and they kill him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A hill arises to mark where Ululkara is killed, and the place is described
    as a great emu totem centre.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A pinnacled hill called Allatthara represents an Alcheringa Kumara man of
    the bell-bird totem who was always watching for women who were not his lawful
    wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yelka totem women live at Illippa, gather edible bulbs, and throw their husks
    in one spot, where a hill called Pulira arises.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ilpiritnata tries to take one of the Yelka women away, but she refuses; he
    eventually returns to his own camp and goes down into the earth, with a broken
    hill marking the spot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Illippa tries to take one of the women away; after she refuses, he returns
    holding out his left hand and carrying a tomahawk over his right shoulder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Illippa asks the woman why she will not come with him, seizes her by the hair,
    and kills her with a tomahawk when she resists.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: After the killing, the other women cry; Illippa returns to his camp, makes
    wild-cat totem ceremonies, and dies there, forming a large totem centre.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:16
  text: The passage states that Illippa was Panunga and the killed woman was Purula,
    and that he might lawfully have married her.
  category: relationship
  evidence_refs:
  - ev:11
