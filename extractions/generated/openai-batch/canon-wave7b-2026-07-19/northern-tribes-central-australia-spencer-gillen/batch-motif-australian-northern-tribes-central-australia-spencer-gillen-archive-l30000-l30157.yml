  summary: The passage describes the manufacture, finishing, shapes, decoration, and
    uses of hard and soft wood pitchis, including trough- and boat-shaped forms, red
    ochre and pipe-clay decoration, and an unfinished Warramunga example being grooved
    with an adze. It then begins a description of spear-throwers, including their
    distribution among central and northern tribes and the construction of one central-area
    type with mulga wood, resin, sinew, and a flint cutting blade.
