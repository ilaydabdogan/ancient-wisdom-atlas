canonical_text:
  quote: ''
  summary: A glossary segment defines terms from several northern and central Australian
    Aboriginal groups. Entries include kinship terms, social divisions, ritual objects,
    initiation and mortuary terms, spirits, sacred ceremonies, totemic animal and
    plant names, fire-related objects, and ceremonial exchanges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kdtajdlina is defined as a spirit supposed by women and children to eat the
    youth during the initiation ceremony in the Binbinga tribe.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kaudua is defined as a sacred pole decorated at its upper end to represent
    a man's head and used at the conclusion of the Engwura ceremony in the Arunta
    tribe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: KUji-paritji are trees representing the yam-sticks of the Munga-munga women
    in the Warramunga tribe.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kodka is a special fire kindled at the base of the forked stick on which a
    parcel of bones of a dead person is placed in the Binbinga tribe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Koperta kdlkuma is a ceremony of biting the head of a novice to make his hair
    grow in the Arunta tribe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kuntamdra is a ceremony of repeating subincision in the Warramunga tribe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kdirinah is a spirit supposed to enter a woman and be born in human form in
    the Kaitish tribe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kwerkapimga is a child stone rubbed with Chitringa to make a child enter a
    woman in the Kaitish tribe.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kiirta-kiirta is a term for things of sacred nature, including the fire at
    a grave and bull-roarers in the Binbinga tribe.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Several glossary entries define animal or plant names that give their names
    to totemic groups, including jabiru, snake or lizard, green snake, grub, large
    lizard, and white-ant eggs.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  - ev:15
- id: obs:11
  text: Laldnga is a hollow log ornamented with the totemic design of the individual
    whose bones are buried in it in the Binbinga tribe.
  category: object
  evidence_refs:
  - ev:16
- id: obs:12
  text: Litmuru are representations of pointing-sticks worn during sacred ceremonies
    connected with a mythic beast called Pauwa and the jabiru bird in the Warramunga
    tribe.
  category: object
  evidence_refs:
  - ev:17
- id: obs:13
  text: Kurdditcha are men supposed to wear feather shoes when they set out to kill
    a man in the Arunta tribe.
  category: action
  evidence_refs:
  - ev:18
- id: obs:14
  text: Litjuigdra is food presented by young men to older men after the performance
    of various ceremonies in the Warramunga tribe.
  category: action
  evidence_refs:
  - ev:19
- id: obs:15
  text: Kumpirra is defined as the spirit of a dead person in the Urabunna tribe,
    and Kictulu is defined as the spirit part of an individual in the Warramunga tribe.
  category: other
  evidence_refs:
  - ev:20
  - ev:21
- id: obs:16
  text: Kunapipi is the name applied to a sacred ceremony and also to an object used
    during its performance in the Anula tribe.
  category: object
  evidence_refs:
  - ev:22
