canonical_text:
  quote: ''
  summary: A described phase of the Warramunga fire ceremony includes men with whitened
    or decorated bodies, burning twigs, torches, smoke, sparks, dancing, singing,
    women wailing and burning themselves, a dawn movement toward a pole where women
    are gathered, older women dancing with stone-filled pitchis around crouching performers,
    removal of head-dresses and down from the performers, and an explanation that
    the ceremony was inherited from Alcheringa ancestors to settle old quarrels and
    make men friendly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes whitened bodies of combatants alight with burning twigs
    and leaves amid smoke, blazing torches, showers of sparks, and dancing, yelling
    men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women stood to one side, wailed, and burned themselves with lighted twigs,
    saying that this would prevent the men from seriously hurting themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wanmanmirri were thrown to the ground and their fires extinguished; afterwards
    men washed mud and burning embers from their bodies and sang around small fires.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After midnight the torches were relighted and waved or dashed on the ground
    without being used to strike anyone, until the twigs were burnt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At dawn, decorated men quietly approached a pole where women had stayed through
    the night; the women pretended not to know the men were there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Just before sunrise, men threw lighted bark toward women and children, rushed
    across the intervening ground, led the decorated men to the women by the pole,
    left them there, and ran back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Younger women ran away, while about ten older women remained; each older woman
    carried a pitchi containing small stones and danced around the crouching performers
    while jingling the stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At sunrise the women ran to their camp, the men returned to theirs, and the
    performers' tight head-dresses were removed and down was rubbed off their faces.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The pole was taken down on the morning after the ceremony and laid in the
    bed of the creek; it was not regarded as sacred and was seen by women.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The observers state that they could not find a satisfactory explanation of
    the final phase; old men said it had been handed down from the far past as performed
    by Alcheringa ancestors and that its object was to settle old quarrels and make
    men friendly.
  category: speech
  evidence_refs:
  - ev:9
