canonical_text:
  quote: ''
  summary: The passage describes totemic beliefs among the Warramunga and allied northern
    Central Australian tribes. Individuals are said to be reincarnations of Alcheringa/Wingara
    spirits belonging to particular totems. Totemic groups are traced to great ancestors,
    often part human and part animal or plant, who travel, perform ceremonies, leave
    spirit children at sites, and in some cases create landscape features. Specific
    examples include a black-snake ancestor, a shapeshifting snake ancestor who changes
    among several snake totems and steals a Churinga, and yam-totem women whose yams
    are associated with spirit children and represented by stone Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that every individual is the reincarnation of an Alcheringa
    spirit belonging to a particular totem, called mungai by the Warramunga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For most totems described, there is one great ancestor, half human and half
    beast or plant, who wandered, performed ceremonies, and left spirit children that
    emanated from his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ancestor of the black-snake totem arose in a water-hole on Tennant Creek,
    wandered, performed ceremonies, made creeks and hills, and left spirit black-snake
    children along his tracks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spirit black-snake children are described as residing in rocks around water-holes
    and in gum-trees bordering the creek.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women are said to avoid striking certain gum-trees with a tomahawk because
    they believe this would release a spirit child that would enter the woman's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Tjunguri man of the Nappa-undattha green harmless snake totem first arose
    below ground at Nai-irini and later came out from a native well while still a
    snake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The snake ancestor took a Tjapeltjeri boy with him, stopped at places, performed
    sacred ceremonies, and left spirit children at mungai spots.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The snake ancestor changed successively into several kinds of snakes, and
    whenever he changed his totem the Tjapeltjeri boy's totem changed also.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The snake ancestor's offspring were Tjapeltjeri and came out from his muscles
    when he shook himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same snake ancestor is described as the ancestor of several different
    snake totemic groups and as having stolen a small Churinga from the ancestor of
    the Wollunqua snake totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Warramunga, Churinga are said to be fewer than among the Arunta
    and to have little practical role in totemic ceremonies, although some traditions
    describe ancestors possessing and swinging them as bull-roarers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women called munga-munga, belonging to the yam totem, are said to have sprung
    into existence near the home of the great black snake at Tjinqurokora.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The munga-munga women obeyed the great black snake, went east toward Worgaia
    country, carried yams, and deposited them there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Each deposited yam is described as associated with a spirit child and now
    represented by a stone Churinga.
  category: relationship
  evidence_refs:
  - ev:8
