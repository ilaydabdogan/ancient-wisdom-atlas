canonical_text:
  quote: ''
  summary: The passage describes a mortuary messenger, related to the dead person,
    who carries sacred emblems or remains to summon distant groups for final ceremonies.
    The carried emblem grants safe passage and compels attendance. The summoned groups
    approach with smoke signals, enter a corroboree ground in a weapon-bearing but
    non-hostile dance, and then give their weapons to the local men before sitting
    apart.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The messenger is always a man standing in the relationship of mother’s brother’s
    son to the dead person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messenger may carry the kallaua; in some named tribes he may also carry
    a packet containing the dead man’s hair or a sacred stick.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A messenger bearing a sacred emblem such as the dead man’s bone is described
    as sacred, able to pass safely between groups, and difficult or impossible to
    refuse.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that this emblem is equivalent in significance to the Arunta
    ilchinkinja, or dead man’s hand, a special sacred Churinga that beckons and must
    be followed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The messenger shows the bone to leading men, gathers the parties on his return,
    and the combined groups march toward the home camp while signalling by smoke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The summoned parties halt overnight near the final destination while the messenger
    goes ahead to tell the local people they are ready to come up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father places the parcel of bones, still in the fork of a stick, upright
    at one end of a cleared space on the corroboree ground and sits silently near
    it with men arranged behind him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: No women are present during the described seating around the bones.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A younger tribal brother of the messenger opens the performance by running
    around the group, shouting, and striking two fighting clubs together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The strangers approach in single file, run around the seated men, yell, dance,
    and brandish spears with the barbed ends pointed downward to show non-hostile
    intention.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the dance, the spears are heaped before the father, boomerangs are fixed
    upright in a row before the seated men, and all these weapons are given to the
    local men.
  category: action
  evidence_refs:
  - ev:9
