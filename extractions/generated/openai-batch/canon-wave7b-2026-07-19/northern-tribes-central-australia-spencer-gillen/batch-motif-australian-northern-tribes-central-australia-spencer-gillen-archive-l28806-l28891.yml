  evidence_refs:
  - ev:5
- id: obs:11
  text: Kaitish people imagine lightning to be made by men performing ceremonies intended
    to secure rain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The rain-totem head paints a yam-stick with red ochre, decorates it with down,
