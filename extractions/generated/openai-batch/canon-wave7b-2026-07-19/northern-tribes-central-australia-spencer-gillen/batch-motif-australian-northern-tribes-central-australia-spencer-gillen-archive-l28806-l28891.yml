canonical_text:
  quote: ''
  summary: 'The passage reports traditions about celestial and weather phenomena:
    a sky-reaching pine-tree once allowed people to travel between earth and sky until
    fire destroyed it, leaving crystal-bearing people in the sky as stars; eclipses,
    Magellanic clouds, comets, lightning, rain-making, and rainbow are explained through
    magic, ritual action, ancestral acts, and named or unnamed beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tree reached into the sky, and men, women, and children used it daily to
    climb between earth and sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old hawk Kakan discovered fire-making by twirling one stick upon another;
    during a dispute with a white hawk the country was set on fire and the pine-tree
    was destroyed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people left above could not return to earth and remained in the sky; crystals
    implanted in their bodies are said to flash at night as stars.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Medicine men are said in some cases to go up at night and talk with the star
    people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: An eclipse of the sun is described as connected with evil magic, either an
    evil spirit trying to eat the sun or arungquiltha trying to enter it and obliterate
    its light.
  category: relationship
  evidence_refs:
  - ev:2
