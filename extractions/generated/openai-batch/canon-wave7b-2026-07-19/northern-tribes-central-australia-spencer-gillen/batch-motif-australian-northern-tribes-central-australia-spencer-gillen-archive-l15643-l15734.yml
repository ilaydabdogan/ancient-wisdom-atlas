canonical_text:
  quote: ''
  summary: 'The passage describes traditions and ethnographic comparisons concerning
    Churinga and allied sacred objects: wooden Churinga made from mulga and decorated
    with down, transmission of Churinga-making knowledge for initiation, ancestral
    deposits of Churinga forming local totem centres, secret or Churinga names and
    reincarnation beliefs, and Worgaia traditions of Munga-munga women carrying yam
    Churinga deposited along a route.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports an attempt to imitate the noise of a Churinga; bark pieces
    were tried unsuccessfully before a wooden Churinga was cut from a mulga-tree and
    used successfully.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Churinga were decorated with down, which scattered when the objects were
    twirled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Where the down fell, mulga-trees arose, and these trees are described as sources
    from which Churinga can now be made.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two Tumana men were killed by wild dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two other men had secretly watched the making and twirling of the Churinga
    and were therefore able to tell others how to make and swing them during initiation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Kaitish, only occasional groups are described as wandering over
    country and leaving spirit individuals behind, associated with Churinga, to form
    local totem centres.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ancestors of Kaitish totemic groups are described as few in number, often
    two, with stores of Churinga deposited in places to form equivalents of oknanikillas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Unmatjera and Kaitish tribes every individual is said to have a secret
    or Churinga name, sometimes identified with an Alcheringa ancestor of whom the
    person is supposed to be the reincarnation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Alcheringa ancestors become fewer northward from the
