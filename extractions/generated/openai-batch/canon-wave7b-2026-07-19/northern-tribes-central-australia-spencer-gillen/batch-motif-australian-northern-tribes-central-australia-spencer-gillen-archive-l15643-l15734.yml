    patterns.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the western Worgaia area, ancestors are said to have marched across the
    country carrying Churinga and depositing them in spots that formed oknanikillas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Munga-munga women, whose totem was Menadji or yam, arose near present
    Tennant Creek and were sent east by the great ancestor of the black-snake totem
    while carrying their yams.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The yams carried by the Munga-munga women are identified as mitji-mitjari
    or Churinga and were deposited along their route across Worgaia country.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Spirit individuals associated with these yam Churinga are described as undergoing
