canonical_text:
  quote: ''
  summary: The passage describes rules for Churinga inheritance, the relation of Warramunga
    totemic ancestors and reincarnated spirit individuals to ceremonial ownership,
    mortuary transfer of chattels among several northern tribes, a specific Warramunga
    case of dividing a dead man's possessions, regular circulation of goods among
    named groups, and the opening of a section on two friction methods for making
    fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman's Churinga is said not to descend to her son but to a brother, because
    paternal descent would otherwise move it into the moiety to which she does not
    belong.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kaitish and Unmatjera are said to follow the same conditions, while in
    the Warramunga there are fewer Churinga and no individual proprietary right in
    certain sacred ceremonies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Warramunga context, each totemic group is said to have one great ancestor
    who performed the ceremonies connected with that group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The great ancestor is said to have left spirit individuals who are now reincarnated;
    those spirit individuals did not themselves perform ceremonies, so their living
    representatives have no individual ceremonial proprietary right.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man may possess one or two Churinga, and these descend in the usual way
    along with his chattels.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: In several named tribes, after a man's death his chattels pass to men who
    are his mother's brothers or his daughters' husbands, identified as men of his
    mother's moiety.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women are not allowed to take anything away except their yam- or digging-sticks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Warramunga example, the dead man's shelter of boughs was torn down
    and destroyed immediately after death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The dead man's chattels were gathered by a Thakomara woman, identified in
    the case as a mother's sister, and were brought during mourning to a group of
    men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bundle of possessions included boomerangs, clubs, pitchis, a tomahawk,
    girdles, a knife, and a stone wrapped in bark.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stone wrapped in bark was examined, left on the ground as unimportant,
    and was not treated as a Churinga, sacred object, or object feared for evil magic.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The younger Thakomara took the clubs and boomerangs; the elder Thakomara took
    the remaining possessions, including the tomahawk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The younger Thakomara said he would present his inherited weapons to younger
    Thakomara men, while the elder Thakomara retained his share because he was very
    old.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'The passage states a regular circulation of things: Tjunguri possessions
    go to Thakomara, Thakomara to Thapanunga, Thapanunga to Tjambin, and Tjambin to
    Tjunguri.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'Two fire-making methods are named: rubbing hard wood over soft wood with
    a saw-like movement, and twirling one stick on another.'
  category: action
  evidence_refs:
  - ev:9
