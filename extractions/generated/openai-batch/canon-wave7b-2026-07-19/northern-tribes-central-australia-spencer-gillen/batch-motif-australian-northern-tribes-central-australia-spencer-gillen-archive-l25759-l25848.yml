canonical_text:
  quote: ''
  summary: 'The passage describes mourning and mortuary customs among several northern
    Central Australian groups: hair or whiskers of the dead are made into girdles
    or packages used in vengeance expeditions; the object may be transferred through
    kinship and marriage obligations; the tana is believed to have strong magical
    properties in confrontation with an accused killer; neighboring tribes differ
    in the use of hair, beard, tree platforms, and ground burial.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Urabunna tribe, hair is cut from the head of the deceased by a man
    in the younger-brother relationship to the deceased.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Urabunna mourning ceremonies, hair from the kupuka and wife’s brother
    is mixed with the dead man’s hair and made into a special girdle called tata,
    worn during the avenging expedition.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says no man of one moiety is allowed to see the hair of a man
    of the other moiety while it is being made into the string-girdle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage reports an Urabunna custom in which, if a man’s actual elder sister
    dies after his own death, her hair is cut off and mixed with his to form the girdle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Among the Warramunga, only the whiskers of the dead man are cut off and made
    into a tana, a fur-string-wrapped package shaped somewhat like a large cigar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Warramunga custom, the dead man’s son removes the whiskers and presents
    them to a man who is the actual or tribal husband of the dead man’s sister’s daughter;
    that recipient has the duty of avenging the death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage links the receipt of the dead man’s hair with a marriage-disposal
    relationship involving the dead man’s sister’s daughters and lawful husbands from
    the proper group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When an avenging party is organized, the man carrying the tana, and sometimes
    one arm-bone of the dead man, takes the lead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The tana and sometimes the bone are shown to the supposed culprit, who is
    expected to become terrified, tremble, and become incapable of fighting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says actual outcomes of vengeance may include killing the accused,
    a serious fight, the accused standing and submitting to injury, or the accused
    warding off spears and boomerangs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The tana is described as possessing strong magic properties and giving its
    holder a great advantage and confidence in victory.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Tjingilli tribe, similar customs are reported, except that hair from
    the head as well as the beard is used, and the sacred objects made from them are
    called chantimmi.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Umbaia are described as normally placing their dead directly in the ground
    rather than in trees, a practice attributed to the scarcity of trees over much
    of their country.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Gnanji are described as burying their dead in trees, placing bodies of
    younger men and women on tree platforms called palla-pallamma, while old people
    are buried directly in the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage reports that the reason given for burying old Gnanji people in
    the ground is that they do not like the sun to shine on them because it is too
    hot for the bones.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that the Gnanji are believed by the authors to eat fallen
    enemies and, especially on eastern borders, their own dead.
  category: action
  evidence_refs:
  - ev:7
