canonical_text:
  quote: ''
  summary: After damper is divided and eaten, visitors are led to camp. In the evening
    an ordinary corrobboree dance is performed in honor of their arrival. Over the
    next two or three days the visitors may witness sacred ceremonies. Older men may
    freely enter the ceremonial ground, while two recently initiated youths remain
    in the men's camp and approach the ceremonial ground only by special invitation
    during an actual ceremony.
  language: English
