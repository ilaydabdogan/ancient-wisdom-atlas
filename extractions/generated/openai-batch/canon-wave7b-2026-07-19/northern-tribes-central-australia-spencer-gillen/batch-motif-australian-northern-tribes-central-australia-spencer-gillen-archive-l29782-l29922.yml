canonical_text:
  quote: ''
  summary: 'The passage describes cleaning and ornamenting stone knives after a Warramunga
    subincision initiation ceremony, then gives a detailed account of Warramunga ground
    axe manufacture: selecting and chipping diorite, levelling and grinding the axe-head
    with quartzite, sandstone, sand, and water, hafting it with withy, string, resin,
    and heat, finishing it with ochre, and noting its uses and regional adhesive variants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blood can be readily removed from stone knife blades because it does not sink
    in, which is given as an explanation for museum specimens looking unused.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A subincision initiation ceremony was witnessed among the Warramunga; two
    knives were used for three youths: one knife for two younger Thungalla youths
    and another for an older Thakomara youth.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the operations, the knives were cleaned and ornamented with charcoal
    rings and yellow ochre spots; the twice-used knife had two rings and the other
    had one ring, and all blood was removed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ground axes are described as less common than flaked implements, partly because
    suitable material is found only in relatively few central Australian locations;
    a Macdonnell Ranges diorite quarry is mentioned, and northern manufacture is described
    as declining.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Warramunga maker begins an axe-head by taking a rounded diorite pebble and
    roughly chipping it with a hard quartzite lump, taking care not to damage the
    edge or break the stone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After preliminary flaking, the maker levels the surface by repeatedly tapping
    it with a rounded quartzite pebble over a day or two until rough irregularities
    are smoothed down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The axe-head is ground on a flat sandstone block with fine sand and water
    while the maker rubs it backward and forward to form two smooth surfaces meeting
    at a curved cutting edge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For hafting, a withy is bent around the blunt end of the stone, tied with
    string, and joined with porcupine-grass resin softened by heat and smoothed with
    a smouldering fire-stick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The final operation includes grinding red ochre and smearing it over the handle;
    a red, white, and yellow pattern is sometimes added to the stone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Completed ground axes are described as used for cutting wood from trees, cutting
    foothold chips for climbing, and opening branches in search of animals, eggs,
    or sugar-bag.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A note states that in more northern parts and around the Gulf of Carpentaria
    beeswax is used where Triodia does not occur, while grass-tree resin is used in
    other parts of Australia.
  category: relationship
  evidence_refs:
  - ev:10
