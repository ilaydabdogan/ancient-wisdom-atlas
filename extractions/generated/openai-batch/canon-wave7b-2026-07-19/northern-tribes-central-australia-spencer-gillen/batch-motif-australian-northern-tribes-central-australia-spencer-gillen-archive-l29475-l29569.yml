  summary: The passage describes varieties of stone knives, including flaked and chipped
    forms, a special crude knife reportedly used by women among the Kaitish and Warramunga,
    and different hafting methods using resin, hair-string, and wood among several
    northern Central Australian tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some stone knives are described as combining irregular facets with secondary
    chipping; one example has its point produced by chipping rather than by a simple
    flake form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: One described knife form has a broad terminal cutting edge almost at right
    angles to its two lateral cutting edges.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A special crude, coarsely flaked knife is said to occur among the Kaitish
    and Warramunga and to be used apparently only by women, while men of the same
    tribes possess better flaked instruments.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The special knife is described as having a short, stout, rudely flaked quartzite
    blade, hafted with porcupine-grass resin, and as being more useful as a scraper
    than as a true cutting implement.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Figures 187-189 are described as increasingly varied examples of crude women's
    stone knives, including a rude flake chipped around the edges, a cruder form with
    an original weathered surface, and a form with irregular conchoidal facets making
    a fairly good cutting edge.
  category: object
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:6
  text: One hafting method encases the blunt end of the blade in a molded round lump
    of resin; this is identified as the only kind used in knives made by the Arunta,
    Unmatjera, and Kaitish tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A second hafting method, used by the Warramunga and Tjingilli, uses a more
    flattened resin lump, with the blade fixed at one end and a small flat wooden
    slab at the other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A caption for a Tjingilli stone knife notes that human hair-string is attached
    to the resin.
  category: object
  evidence_refs:
  - ev:3
