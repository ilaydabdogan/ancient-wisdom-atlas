canonical_text:
  quote: ''
  summary: The passage summarizes totemic belief and practice among several northern
    Central Australian tribes. It describes weakly developed Intichiuma ceremonies
    among coastal tribes, final burial rites using a decorated hollow-log totemic
    coffin placed by a water-hole, the return and reincarnation of the spirit part,
    spirit children choosing mothers in some tribes, and differing rules of totemic
    descent, moiety division, ancestor origin, marriage restriction, and food avoidance
    across named groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that Intichiuma ceremonies are only slightly developed among
    the coastal tribes and associate this with more favourable food and life conditions
    than in the central area.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At final burial rites, people from various localities assemble, and ceremonies
    relating to the ancestor of the deceased person's totemic group are performed
    under the dead person's father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hollow log decorated with a design characteristic of the totem receives
    the bones and is then placed by a water-hole and left untouched.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that each individual is finally gathered to his or her totem
    through the burial rite.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spirit part, called kutulu among the Binbinga, returns to its mungai spot
    and later undergoes reincarnation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the Binbinga, Anula, and Mara tribes, spirit children are said to know
    the correct women to enter and to choose their own mothers deliberately.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage says belief in reincarnation is universal in all the tribes reviewed,
    but totem descent differs: maternal in Urabunna and allied tribes, not necessarily
    maternal or paternal in the Arunta, usually paternal in the Warramunga, and paternal
    in the Binbinga and Mara.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every individual is described as the reincarnation of a spirit left behind
    by totemic ancestors in the far past.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Arunta and Kaitish account, particular spots are inhabited by spirits
    of a particular totem, and a child conceived at a spot is treated as the reincarnation
    of one of those ancestors and belongs to that totemic group.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Urabunna account, a spirit chooses its mother, avoids entering a woman
    of the same moiety as its previous mother, and changes moiety, totem, and sex
    at successive reincarnations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some Alcheringa ancestors are described as incomplete human beings that were
    direct transformations of eponymous totemic animals; other Kaitish variants describe
    complete men and women or offspring of a great eponymous ancestor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Warramunga, Wulmala, Walpari, Tjingilli, and Umbaia tribes, totems
    are completely divided between moieties, children usually follow the father, same-totem
    marriage is prohibited, and food restrictions apply to the person's own and parental
    totems.
  category: relationship
  evidence_refs:
  - ev:9
