canonical_text:
  quote: ''
  summary: The passage introduces Churinga and related objects among central and northern
    Central Australian groups. It describes central tribes as especially associated
    with Churinga, spirit parts, and sacred storehouses; summarizes Urabunna traditions
    about lost or borrowed Churinga-like objects; reports an initiation belief involving
    the spirit Witurna; recounts Arunta beliefs about Churinga as abodes of ancestral
    spirit parts and reincarnation; and notes that the word Churinga can name a sacred
    object or describe a sacred attribute.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The central part of the continent occupied by Arunta, Ilpirra, Iliaura, and
    Unmatjera peoples is described as the home of Churinga and associated beliefs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the central area, Churinga are said to be associated with the spirit parts
    of individual members and hidden in ertnatulunga, or sacred storehouses, of local
    totemic groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Urabunna are said to have a tradition that Churinga belonging to the northern
    section were stolen long ago by the Arunta in Alcheringa times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Southern Urabunna have a form called tjimbaliri, described as resembling
    a typical wooden Churinga but plain on the surface and more convex in section.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Northern Urabunna call the Churinga thantha and borrow objects for youth
    initiation from the Southern Arunta or from the southern section of their own
    tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women are described as imagining, or being taught to believe, that the sound
    of the Churinga is the voice of a spirit called Witurna.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Witurna is said, in the belief taught to women, to take boys into the bush,
    remove their insides, give them new ones, and bring them back as initiated men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Arunta account, each Churinga was associated in the Alcheringa with
    a totemic ancestor and remained on earth as the abode of his spirit part after
    his body went below ground.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the spirit entered a woman and underwent reincarnation, the Churinga
    remained behind and was searched for; if found, or represented by a made object,
    it was placed in the ertnatulunga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The term Churinga is applied to stone or wooden slabs, including objects popularly
    called bull-roarers, and can also describe a name, design, or object used in a
    sacred ceremony.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The chapter-content summary mentions rubbing a stone with a Churinga to cause
    a spirit child to enter a woman, and using Churinga during Intichiuma.
  category: action
  evidence_refs:
  - ev:6
