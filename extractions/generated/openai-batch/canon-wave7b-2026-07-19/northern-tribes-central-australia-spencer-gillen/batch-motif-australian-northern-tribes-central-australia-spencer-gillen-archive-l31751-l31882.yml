canonical_text:
  quote: The natives themselves say that these decorations have no meaning of any
    kind, and that they are merely added to make the object look better.
  summary: The passage describes decorative treatment of pipes, spears, axes, adzes,
    spear-heads, and pitchis, emphasizing red ochre coatings, white pipe-clay, charcoal,
    incised lines, colored bands, dots, and geometric sectioning. It states that recognizable
    biomorphic designs are extremely rare and reports the decorations as aesthetic
    rather than meaningful.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The pipe represented in Fig. 280 is described as a wooden pipe with the pithy
    centre extracted, ornamented with broad and narrow bands, incised lines around
    the stem, red ochre, white pipe-clay circles, and slanting incised lines in oblong
    spaces.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that most implements and weapons are merely coated with
    red ochre, though special painted designs may sometimes be added.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Special designs are described as generally strictly geometrical, while designs
    recognizable as biomorphs are said to be extremely rare.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reported Indigenous explanation is that the decorations have no meaning
    and are added to improve the object's appearance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Simple decoration may consist of pigment applied to part of an implement or
    rough lines made in white pipe-clay, charcoal, or ochre.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Examples of simple decoration include white pipe-clay lines on resin, black
