  text: The white cockatoo took the people with him when he returned to his own country,
    except for the two women, whom he did not disturb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people involved were said to belong to the Kingilli half of the tribe.
  category: attribute
  evidence_refs:
