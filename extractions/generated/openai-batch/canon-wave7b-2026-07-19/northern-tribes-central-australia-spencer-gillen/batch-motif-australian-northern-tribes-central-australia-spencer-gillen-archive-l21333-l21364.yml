canonical_text:
  quote: ''
  summary: The passage recounts a Parenthie lizard man at Limpi, a white cockatoo
    who takes people on a sky journey back toward Lirri while stopping for ceremonies,
    the deaths of the exhausted travellers at Lirri, and stones that arise to mark
    a totemic centre. It then begins a Wild Cat tradition in which two wild-cat brothers
    with stone knives operate on one another, initiate themselves into manhood, travel,
    change class, and change into a smaller cat.
  language: English
  quote_policy: summarized
