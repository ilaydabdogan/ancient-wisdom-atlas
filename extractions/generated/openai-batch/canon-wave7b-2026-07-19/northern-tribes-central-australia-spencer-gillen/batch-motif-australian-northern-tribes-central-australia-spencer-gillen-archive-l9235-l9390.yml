canonical_text:
  quote: ''
  summary: The passage presents ethnographic tables and discussion of named tribal
    subclasses, moieties, marriage rules, descent rules, and equivalences among Mara,
    Anula, and Binbinga groups, with a comparison to prior Arunta-Urabunna arrangements
    at a contact zone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists named class or subclass groups including Purdal, Mumbali,
    Kuial, Murungun, Awukaria, Urtalia, Roumburia, and Wialia, with a and beta-like
    subgroup labels in the table.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tables are said to have been drawn from independent information from members
    of two tribes and then corroborated in the presence of members of the Binbinga,
    Anula, and Mara tribes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For Murungun, the passage states that Murungun a men marry Purdal a women,
    while Murungun beta-group men marry Kuial beta-group women.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For Anula examples, the passage states that Awukaria a men marry Urtalia a
    women, while Awukaria beta-group men marry Wialia beta-group women.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For Mara examples, the passage states that Purdal a men marry Murungun a women,
    while Purdal beta-group men marry Mumbali beta-group women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage also states that Urtalia a men marry Awukaria a women, while Urtalia
    beta-group men marry Roumburia beta-group women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The children of any man are said to fall into the father's subclass, but into
    the subgroup of that subclass to which the father does not belong.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says classes and subclasses can be deliberately grouped to fit
    descent systems at points of contact between tribes with different descent arrangements.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Mara, Murungun and Mumbali are described as forming one moiety, while
    Purdal and Kuial form the other.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:10
  text: In the Binbinga tribe, each moiety is described as consisting of two pairs
    of subclasses.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage maps Mara subclasses to selected pairs of Binbinga subclasses
    rather than to whole Binbinga moiety-pairs.
  category: relationship
  evidence_refs:
  - ev:12
