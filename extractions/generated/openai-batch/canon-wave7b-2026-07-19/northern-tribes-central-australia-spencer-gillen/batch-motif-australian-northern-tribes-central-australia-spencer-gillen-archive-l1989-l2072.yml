canonical_text:
  quote: ''
  summary: The passage discusses tribal names and exonyms, distinct dialects among
    northern Central Australian groups, partial mutual intelligibility on borders,
    shared or differing terms for ancestral time, sacred ceremonies, weapons, implements,
    and everyday words, and the difficulty of explaining why culturally similar neighbouring
    groups may have distinct dialects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Warramunga call themselves Warramunga and are sometimes called “Bata aurinnia”
    by strangers, a phrase glossed as “the people who dwell on hard ground,” but the
    passage says this is not a tribal name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each tribe is described as speaking a distinct dialect; an Arunta man cannot
    understand a Kaitish man without learning the dialect, and a Kaitish man cannot
    understand a Warramunga man in the same way.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: People living on the borderland of two tribes are usually acquainted with
    two dialects, and dialects of contiguous tribes may share some words depending
    on affinity as well as proximity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kaitish are said to have a distinct dialect and some differences in customs
    and beliefs from the Arunta, including burial of the dead in trees, while being
    more closely allied to the Arunta than to the Warramunga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Different groups use different terms for the far past in which ancestors lived
    and for a sacred ceremony; Arunta, Kaitish, and Unmatjera share the terms given
    for these categories.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Boomerangs and shields have different names across several tribes but are
    described as precisely similar in form across the tribes mentioned and as traded
    from one area and tribe to another.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage gives distinct names for the stone knife in Tjingilli, Umbaia,
    and Gnanji, and states that words for yes and no are distinct in all the tribes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Kaitish and Arunta are described as having almost identical customs, organisation,
    and beliefs, as living on friendly terms, and as occasionally meeting for large
    ceremonies despite having markedly distinct dialects.
  category: relationship
  evidence_refs:
  - ev:6
