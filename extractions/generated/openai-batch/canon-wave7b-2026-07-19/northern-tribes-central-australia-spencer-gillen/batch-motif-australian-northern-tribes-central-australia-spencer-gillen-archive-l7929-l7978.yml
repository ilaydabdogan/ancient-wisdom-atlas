    men of column 2.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Men and women of columns 3 and 4 stand mutually in the relationship called
    wankilli or tapa-tapu, the latter glossed as mother’s father.
  category: relationship
  evidence_refs:
  - ev:8
