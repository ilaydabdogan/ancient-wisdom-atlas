canonical_text:
  quote: ''
  summary: 'The passage explains a four-column kinship classification: specified male
    and female column pairings produce children in other columns, and named relationship
    terms define spouse, sibling-in-law, daughter’s husband, mother’s brother, father-in-law,
    sister’s daughter, and mother’s father relations among the columns. It also notes
    two Arunta equivalent terms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Column 3 contains the children of men in column 1 and women in column 2; column
    4 contains the children of men in column 2 and women in column 1.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives the example that a Thapanunga man and a Naralu woman have
    Thapungarti and Napungerta children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man of column 1 is called kulla-kulla, glossed as husband, to a woman on
    the same horizontal level in column 2; she is katununga, glossed as wife, to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The term kulla-kulla is also used reciprocally between men of columns 1 and
    2 for the wife’s-brother relation, and between women of columns 1 and 2 for the
    husband’s-sister relation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men of column 1 are described as naminni, glossed as daughters’ husbands,
    of men of column 4; the passage illustrates this with Thakomara, Naralu, and a
    Thapanunga man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Men of column 1 are also described as naminni, glossed as mothers’ brothers,
    of women of column 4; the passage illustrates this with a Nungalla, a Napungerta
    woman, and a Thapungarti man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Column 4 contains men called auiniari, glossed as wife’s father or sisters’
    sons, and women called kulu-kulu, glossed as sisters’ daughters, of men of column
    1.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Column 2 contains men called naminni, glossed as daughters’ husbands of men
    of column 3 and as mothers’ brothers of women of column 3.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Column 3 contains men called auiniari, glossed as father-in-law, and women
