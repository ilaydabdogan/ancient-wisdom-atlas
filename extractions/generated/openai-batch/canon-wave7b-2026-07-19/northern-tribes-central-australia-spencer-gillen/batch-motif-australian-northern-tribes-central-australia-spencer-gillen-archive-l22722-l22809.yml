canonical_text:
  quote: ''
  summary: 'The passage describes several harmful magical implements and procedures:
    a charmed hair-string and stick apparatus used by two men with muttered curses;
    the injilla ungakura pointing apparatus made of human hair-string, pointing-bones,
    eagle-hawk claws, and resin; a dust ridge made after pointing to prevent dream
    identification of the operator; and an Unmatjera sung stick whose broken point
    is taken as evidence that it has entered the victim.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An implement is described as involving blood, charcoal, resin, and attached
    human hair-string; after being made, it is sung over and said to be endowed with
    evil magic.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'When the first implement is used, two men stand opposite each other: one
    holds the hair-string, while the other holds the attached sticks and jerks them
    backward between his legs toward the intended victim.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the use of the first implement, both operators mutter curses, and the
    evil magic is said to go out from the sticks and enter the body of the person
    to be injured.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The injilla ungakura consists of a long human hair-string strand with five
    small pointing-bones at one end and one pointing-bone plus a pair of eagle-hawk
    claws fastened into porcupine-grass resin at the other end.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'When the injilla ungakura is used, two men hold it: the front man holds the
    pointing-bones, and the rear man holds the eagle-hawk claws.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the injilla ungakura is pointed and jerked toward the victim, dust is
    pushed up into a small ridge in front of the man who pointed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The dust ridge is said to prevent the victim from dreaming of the Alcheringa
    camp of the pointer’s mother and thereby identifying that her son pointed the
    bone at him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: This form of magic is said to be dreaded by natives of other parts and to
    cause great pain, especially through the eagle-hawk claws gripping, squeezing,
    and lacerating the internal organs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the Unmatjera, a special stick called ingwaninga is sung with words
    taught by an old man; the informant did not know the meaning of the words.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the ingwaninga stick is used, it is placed on the ground near the man’s
    camp; if its point is broken in the morning, he knows it has gone inside the victim.
  category: sequence
  evidence_refs:
  - ev:7
