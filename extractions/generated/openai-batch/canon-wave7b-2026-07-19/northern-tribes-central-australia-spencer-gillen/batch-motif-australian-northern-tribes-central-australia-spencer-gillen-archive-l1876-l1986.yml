canonical_text:
  quote: ''
  summary: The passage describes travel from Newcastle Waters through flood-prone
    watercourses, swamps, pools, creeks, rivers, and water-holes; identifies ecological
    signs of water or firm ground; locates Gnanji, Binbinga, and Anula territories
    and neighboring relations; notes Anula canoe navigation; and discusses tribal
    names and selected vocabulary, arguing that the names do not derive from words
    for yes, no, or man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrating travelers followed a broad watercourse from Newcastle Waters
    that can join the former waters in flood times near the Ashburton Range.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The india-rubber or gutta-percha tree is described as an indication that a
    creek or flood-prone land is nearby, while the hedgewood tree is described as
    an indication of higher and firmer land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blue bush swamp and cracked ground are described as hazardous for travel,
    especially in the rainy season, with risk of horses falling into cracks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Large pools of milky-white water occur along the watercourses and support
    pelicans, ibis, ducks, spoonbills, cockatoos, and pigeons.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that local natives in these parts usually have no difficulty
    with food supply except in very dry seasons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Gnanji occupy country east and north-east of the Ashburton Range and are
    described as friendly with the Tjingilli to the west and the Umbaia to the south.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Karabobba and Whanaluru are described as favored Gnanji camping places; at
    Whanaluru they come to feed on water-lily stems and roots.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Gnanji extend eastward at least as far as Pinda, a permanent rock-hole
    where they come into contact with the Binbinga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Binbinga occupy the country drained by the upper Macarthur River and its
    tributaries; the passage states that water is not lacking there, although the
    Macarthur does not run except during the rainy seasons.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Borroloola is described as a remote decayed township with tidal and navigational
    limits on the river, and above it the water exists as disconnected water-holes
    rather than as a running stream.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Anula occupy the country from Borroloola to the coast and the Pellew Islands,
    and navigate the river and sheltered sea in dug-out canoes and bark canoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the tribal names discussed do not derive from words
    for yes, no, or man, and that the names are used by tribal members for themselves
    and by outsiders for them.
  category: speech
  evidence_refs:
  - ev:7
