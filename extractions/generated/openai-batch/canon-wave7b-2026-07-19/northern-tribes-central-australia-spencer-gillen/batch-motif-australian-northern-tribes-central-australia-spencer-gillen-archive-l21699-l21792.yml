  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two young Thakomaras return, find Karinji dead, bury him, travel to Mutamattharu,
    and are choked at night by the aged pelican Thaparungu; large stones arise to
    mark the spot.
  category: sequence
  evidence_refs:
