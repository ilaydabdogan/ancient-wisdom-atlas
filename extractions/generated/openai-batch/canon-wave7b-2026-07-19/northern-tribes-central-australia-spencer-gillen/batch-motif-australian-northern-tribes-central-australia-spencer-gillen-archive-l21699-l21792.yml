canonical_text:
  quote: ''
  summary: 'The passage recounts several Wingara-era or ancestral narratives: Karinji
    the Jabiru, a Thakomara totemic man, emerges from the ground, uses two boys to
    obtain human flesh, suffocates people in ground-holes, cooks and stores bodies,
    and is killed by Winithonguru. The two boys are later killed by the pelican Thaparungu.
    A second episode describes Thaparungu punishing ducks who laugh at him, whitening
    a crane with ashes and burning the duck-men. A third episode describes Murtu-Murtu,
    associated with bull-roarer sound and sacred ceremonies, being pursued and dismembered
    by two wild dogs; his flesh produces trees used for bull-roarers, and other places
    are marked by ochre, yams, stones, fire, and a spring.'
  language: English
  quote_policy: summarized
literal_observations:
