  text: Karinji finds two young Thakomara boys in the ground and decides to keep them
    and send them to search for food rather than eat them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The two boys kill a black-fellow and bring the flesh to Karinji, who cooks
