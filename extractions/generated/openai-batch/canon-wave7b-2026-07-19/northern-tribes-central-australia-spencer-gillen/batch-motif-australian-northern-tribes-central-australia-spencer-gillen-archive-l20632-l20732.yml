canonical_text:
  quote: ''
  summary: Two Parenthie lizard brothers perform an operation on women, lose and regain
    their track, travel through named places, make ceremonial equina stone, hunt animals,
    use tails in practical and landscape-making actions, and finally return to their
    country, stand on either side of a water-hole, die, and are marked by two great
    stones containing hidden Churinga stones representing eggs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger Parenthie asks whether the women should also be cut; the elder
    fears the women might die but then performs atna-ariltha-kuma upon all of them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two lizards turn back toward their own country, lose their way, camp overnight,
    and find their old tracks at daybreak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the journey, the elder and younger lizards produce equina, described
    as a whitish friable stone used by natives for painting ceremonial designs.
  category: object
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:4
  text: The travellers give names to places along their route, including Panda, mira-atna-rulika,
    Unquirlitha, Tjapa, Iltjiquarrapinna, and other named locations.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:9
- id: obs:5
  text: The brothers find wild dogs under a tree, kill some of them, carry them to
    camp, exchange the first dogs killed, remove their insides, and find them badly
    smelling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An opossum growls from a nearby tree; the younger brother climbs after it,
    strikes it with a stick, and is scratched when it falls onto his face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the Ilka-lakulaka water-hole, the brothers swish green scum off the water
    with their tails before drinking, then cook and eat a kangaroo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a later wild-dog hunt, the elder brother tears open a hole with his tail
    so the younger brother can seize and kill the dog as it comes out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Undatja, the brothers cook and eat the wild dogs completely, including
    the insides, because they are very hungry.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The elder brother becomes increasingly tired and weak, tells the younger brother
    that he thinks he will lose him soon, and later wants to remain behind and die.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:11
  text: The brothers encounter an Iltjiquarra, a black lizard, and the elder brother
    asks why it sits entirely black.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: As the elder brother crawls onward, his long tail drags behind him and makes
    a creek called Latinja.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After returning to their own country, the brothers stand on either side of
    a water-hole with forefeet extended and die there.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Two great stones arise to mark the death-place; each stone has a top hole
    holding round Churinga stones that represent eggs formerly carried by the lizards.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: Because the Churinga are hidden on top of the stone columns, men and women
    may all drink at the water-hole.
  category: relationship
  evidence_refs:
  - ev:11
