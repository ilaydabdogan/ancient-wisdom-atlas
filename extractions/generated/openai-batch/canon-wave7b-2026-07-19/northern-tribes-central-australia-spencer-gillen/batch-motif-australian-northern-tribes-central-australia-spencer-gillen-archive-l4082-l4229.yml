canonical_text:
  quote: ''
  summary: The passage classifies northern and central Australian tribes by social
    organization, descent, moieties, subclasses, and proposed larger groupings called
    nations. It emphasizes transitional cases such as Binbinga and describes how comparative
    tables of equivalent classes and subclasses were built from information supplied
    by people familiar with adjacent tribal systems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tribes are divided into two main groups on the basis of social organization,
    though the author states this is only a rough grouping.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Binbinga, and to a lesser extent the Gnanji, are described as transitional
    between groups; the Binbinga are said to border both a coastal tribe and an interior
    tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One main group has eight subclasses, except in the southern Arunta, while
    the other has four; descent is counted in the male line in all cases, but indirectly
    in the first group and directly in the second.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The author proposes five larger groupings or nations: Dieri, Arunta, Warramunga,
    Binbinga, and Mara, each including named tribes.'
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Binbinga nation is described as organizationally close to the Warramunga
    group, while certain customs, including eating the dead and disposal of bones,
    are described as closer to the Mara group.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tables are arranged to show equivalent classes and subclasses in different
    tribes, and the authors state that equivalent groups were traced across eighteen
    tribes from the Lake Eyre district to the Gulf of Carpentaria.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the tables, columns one and two contain subclasses belonging to the two
    moieties, intermarrying subclasses are placed on the same horizontal level, and
    columns three and four represent the subclasses of the children.
  category: relationship
  evidence_refs:
  - ev:7
