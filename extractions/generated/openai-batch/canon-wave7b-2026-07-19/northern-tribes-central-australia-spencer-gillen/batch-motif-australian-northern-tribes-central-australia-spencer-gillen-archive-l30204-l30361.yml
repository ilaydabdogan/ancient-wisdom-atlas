  summary: The passage describes several spear-thrower forms and spear types among
    central and northern Australian groups. It notes a decorated spear-thrower used
    during a ceremony, a tassel spear-thrower made mainly by the Umbaia and Gnanji
    and traded toward the south and Gulf, a Daly River spear-thrower with resin features,
    and a classification of spear forms by material, barbs, prongs, stone heads, reed
    shafts, and regional distribution.
