canonical_text:
  quote: ''
  summary: The passage describes mourning obligations for a widow, including burnt
    hair, ashes, silence, and release from silence by the itia through a food offering
    and mouth-touching. It then describes grave mourning, secondary burial of bones
    from a tree platform, orientation of the grave toward Alcheringa camps, the dead
    person's spirit going to an Alcheringa spot until reincarnation, and ceremonies
    and exchanges connected with transferring the widow to a younger brother of the
    dead man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The widow's hair is burnt, and she covers and renews her body with ashes from
    the camp fire throughout mourning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the widow does not keep the ashes, the dead man's spirit is said to follow
    her and kill her by stripping flesh from her bones.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A younger brother of the dead man is said to be justified in severely thrashing
    or killing the widow if he meets her without the mourning emblem during deep mourning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The widow observes a ban of silence until the itia releases her after many
    months by accepting food and touching her mouth with a fragment of it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A grave ceremony is described in which the widow and relatives wail, trample
