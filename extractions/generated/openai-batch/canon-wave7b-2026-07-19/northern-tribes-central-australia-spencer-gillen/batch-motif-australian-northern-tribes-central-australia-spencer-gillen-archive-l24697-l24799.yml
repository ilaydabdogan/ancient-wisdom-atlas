  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the dead man was distinguished and possessed important sacred ceremonies,
    his elder brother performs one of them before men of all classes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before the widow is handed over, she gathers vegetable food, the itia brings
    meat, and they exchange food near the camp fire while the itia also distributes
    food and meat through moiety relations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The widow sleeps on the opposite side of the fire from the itia before being
    handed over to men representing several relationship categories, who give her
