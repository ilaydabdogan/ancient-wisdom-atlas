canonical_text:
  quote: ''
  summary: The passage describes fire-making by friction, including Urabunna terminology
    for the apparatus, and recounts a Mara Alcheringa tradition in which a black eagle-hawk
    man first makes fire, attempts to restrict it to certain social groups, and is
    opposed by a white eagle-hawk who gives a fire-stick to excluded groups. A sky-reaching
    pine-tree is burned, leaving people stranded in the sky. The passage closes by
    comparing this Mara idea with the Warramunga Wanna ceremony, in which fire is
    first made by one moiety and handed as a present to another.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fire is produced when the material in a hole in a horizontal piece smoulders,
    is blown, and becomes a flame; fine sand may be added to increase friction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Urabunna method, bark is placed beneath a notch, red-hot powder falls
    onto it, and the powder is transferred into dried grass that is blown on or held
    in the wind until it blazes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Urabunna apparatus is called makka-tira; the upright twirling piece is
    called the child-stick, and the horizontal piece is called the mother-stick or
    mother of the fire.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Mara tradition places the first making of fire in the Alcheringa.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A black Kakan or eagle-hawk man of the Murungun class discovers how to make
    fire by rubbing two sticks together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The black Kakan wants to keep fire for Murungun and Mumbali people and not
    allow Purdal and Quial to have any.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A white Kakan objects to the black Kakan's greed, takes a fire-stick, and
    gives it to Purdal and Quial men while the black Kakan covers the fire with his
    wings to prevent this.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Near the disputing hawks stands a large pine-tree whose top reaches the sky,
    and people climb up and down it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The hawk sets the grass on fire, the pine-tree burns, and people who are in
    the sky cannot come down and remain there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The fire spreads north to the Roper River area, the white hawk throws away
    his fire-stick to Mungatjarra, and the black hawk remains and dies where he first
    made fire.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says that the Warramunga Wanna ceremony and the Mara tradition
    share the idea that fire is first made by one moiety and then handed as a present
    to the other moiety.
  category: relationship
  evidence_refs:
  - ev:10
