canonical_text:
  quote: ''
  summary: The passage compares Intichiuma practices among Kaitish, Warramunga and
    allied tribes, and coastal tribes. It describes cross-moiety decoration and provision
    of ritual materials, restrictions on totem members eating their own totemic species,
    ceremonies based on Alcheringa ancestor histories, examples involving carpet snake,
    honey-bag, white cockatoo, and dugong totems, and simpler coastal increase rites
    at an ancestral riverbed site.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Kaitish case, the performer is decorated by men from the other half
    of the tribe and from other totems; men of his own totem may be present but do
    not provide the materials or draw the body design.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the totemic animal or plant has increased, a supply is brought to the
    main camp; the headman ceremonially eats a small amount, and the remainder is
    handed to people who do not belong to the totem, with permission to eat freely.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that if members of the totemic group eat freely of their
    own totem outside the described ceremonial context, they will be “boned” by men
    of the other moiety, because such eating would prevent successful Intichiuma performance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: For the Warramunga, Walpari, Wulmala, Tjingilli, and Umbaia tribes, the passage
    says that special magical ceremonies are very rare and that Intichiuma consists
    of a complete series of ceremonies concerning the Alcheringa history of the great
    ancestor of the totem.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Warramunga and allied tribes, men of the totemic group perform these
    ceremonies only when requested by men outside the totem; preparation excludes
    non-performing members of the totemic group, and all decoration materials are
    supplied by men of other totemic groups belonging to the other moiety.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In most of these totemic groups, there is no equivalent to bringing the totemic
    animal or plant to the head of the group, and there is no ceremonial eating by
    the headman as in southern tribes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Muntikera carpet snake and honey-bag totems, men outside the totem
    bring the snake or honey-bag to the camp and ask the headman if he wants to eat
    it; he says he does not, says he made it for them, and permits them to eat it,
    while it remains taboo to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: For the white cockatoo totem, the headman and his son spend an entire night
    “singing” the cockatoo in addition to the customary series of Alcheringa-history
    ceremonies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among coastal tribes named Binbinga, Anula, and Mara, the passage describes
    only traces of Intichiuma and attributes this to more certain rainfall and food
    supply near the Gulf Coast.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dugong men can make dugongs increase by breaking sticks and throwing them
    at a rock in the bed of the Limmen River, identified as the place where an old
    Alcheringa dugong went down into the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: For the coastal rites described, only men of the totemic group can perform
    the ceremonies, but there is no necessity for them to do so and no solemn eating
    of the totemic animal or plant.
  category: relationship
  evidence_refs:
  - ev:5
