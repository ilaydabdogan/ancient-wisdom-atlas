canonical_text:
  quote: ''
  summary: In the Alcheringa, two Oruntja spirits camp at Arknina. The elder pursues
    kangaroo unsuccessfully, becomes bogged, then meets Induda, a Thungalla man described
    as an opossum, whose dog has killed the kangaroo. After Induda cooks the kangaroo
    and does not share it, the Oruntja kills the dog, kills Induda, consumes blood
    and intestines, makes an ornament from Induda’s shoulder blade, and hangs bodies
    and animals in trees. Returning to camp, he sends his younger brother to retrieve
    the animals. Induda’s younger brother tracks the events and goes to organize an
    avenging party.
  language: English
  quote_policy: summarized
