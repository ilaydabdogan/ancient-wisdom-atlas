canonical_text:
  quote: ''
  summary: The passage describes Arunta adzes with differently shaped flint inserts,
    two handle forms and their regional distribution, the manner of using the adze,
    the form and material of flaked quartzite knives, and a Warramunga-area quarry
    at Renner’s Springs where quartzite flakes are struck from stone blocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adzes are shown and described with small, intermediate, and large flint inserts,
    including inserts useful for shallow grooves, fine grooves, smoothing, and grooving
    when held slantwise.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: 'The passage distinguishes two adze handle forms: a curved handle with flint
    at each end set in resin or beeswax, and a straight handle with flint at one end
    only.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:3
  text: The curved adze form is described as commoner in the central area, while the
    straight form is described as occurring farther west and south-west of the Arunta
    and as common in some parts of West Australia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When used, the adze is held near the resin knob in which the active flint
    is fixed, and strokes are directed toward the operator’s body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grasped part of the adze handle is often marked by grooves and scratches,
    while the main part is usually smooth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Flaked knives vary in size but are described as fundamentally alike in form,
    with variation attributed to the character of the quartzite material rather than
    deliberate design.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Quartzite suitable for flaking and chipping is described as widely distributed
    in central Australia and as forming a layer of desert sandstone capping flat-topped
    ranges.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Knife blades are described as normally having three principal facets and as
    trigonal in section, though a fourth surface may make them tetragonal in some
    cases.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The best knives are said to be made among the northern Tjingilli and Warramunga,
    with a special quarry at Renner’s Springs near the northern boundary of Warramunga
    country.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the quarry, many discarded flakes are present, and only a small proportion
    of flakes struck from quartzite lumps are considered suitable for use.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The observed flaking procedure involves choosing a stone block, placing its
    tapered end on the ground, holding it upright with the left hand, and striking
    it with a smaller quartzite stone in the right hand.
  category: action
  evidence_refs:
  - ev:7
