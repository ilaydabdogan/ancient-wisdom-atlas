canonical_text:
  quote: ''
  summary: The passage describes a Warramunga fire ceremony in which Kingilli men
    dance with twig bundles and weapons around seated Uluuru men, create fires and
    a circle of upright torches, prepare twelve wand-carriers by coating them with
    red mud and white pipe-clay, ignite the wanmanmirri, and begin a violent melee
    with blazing torches after one man charges toward a group containing a former
    quarrel opponent.
