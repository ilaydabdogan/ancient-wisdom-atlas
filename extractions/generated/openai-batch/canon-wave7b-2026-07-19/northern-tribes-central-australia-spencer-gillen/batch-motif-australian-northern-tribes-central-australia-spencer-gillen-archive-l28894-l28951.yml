canonical_text:
  quote: ''
  summary: The passage describes beliefs and rain-making practices connected with
    the rainbow among several northern and central Australian groups, including accounts
    in which rainbow is controlled by ritual, issues from or is placed by snakes,
    or is made by a snake to bring rain. It also describes beliefs about whirlwinds
    as carrying spirit children or hostile spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual performer keeps a shield with rainbow drawings hidden until rain
    has fallen and then destroys the drawings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated idea of the rainbow-drawing rite is to take charge of the rainbow
    and prevent it from appearing in the sky until rain has fallen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Warramunga believe that the rainbow issues from the vent of a water snake
    named Nappakandattha as a red oval plate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Warramunga also say the mythic snake Wollunqua can place the rainbow in
    the sky at will.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the Warramunga account summarized here, the rainbow is not said to prevent
    or assist rainfall.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The Mara and Anula belief is described as the opposite of the Kaitish belief:
    the rainbow precedes rain and helps cause it to fall.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Upintjarra there is a creek with a deep waterhole associated with the dollar
    bird, Munhakuaku, known locally as a rain bird.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dollar bird's mate, a snake named Gnurluwa, lived in the waterhole, and
    the two made rain in the Alcheringa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Gnurluwa wanted rain, he spat upward into the sky and made the rainbow,
    which was followed by clouds and rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A present-day rain-maker goes to the waterhole, obtains and kills a snake,
    places it on the bank, builds a small arched grass-and-fur-string structure over
    it, sings it, and then clouds and rain come.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In central parts of the continent, whirlwinds lift dust columns two or three
    hundred feet high and are frequent.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Arunta women fear whirlwinds because they think spirit children travel in
    them and may enter their bodies if they are caught in one.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The same belief about spirit children in whirlwinds is reported for the Kaitish
    and Unmatjera tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Warramunga, whirlwinds are not associated with spirit children;
    both men and women fear them because an unfriendly spirit is believed to travel
    in them seeking to kill people.
  category: relationship
  evidence_refs:
  - ev:8
