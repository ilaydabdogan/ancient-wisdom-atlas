canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Warramunga ceremonies concerning the
    Wollunqua totem. It describes Wollunqua as a mythic snake and totemic ancestor
    whose ceremonies resemble other totemic ceremonies in some respects, including
    the ancestor's wandering in the Wingara and leaving spirit individuals at places
    where they undergo reincarnation. It also notes that Wollunqua is unusual because
    the only Wollunqua animal believed to exist is the old ancestor, still persisting.
    A footnote compares this persistence with Thaballa, the laughing boy, said never
    to have died and to remain alive in rocks at Yappakulimna.
  language: English
  quote_policy: summarized
