canonical_text:
  quote: ''
  summary: 'The passage states that Intichiuma ceremonies do not invoke totemic ancestors
    and that restrictions on naming the dead are not universal. It presents the Warramunga
    Wollunqua totem as an exception: a huge snake at a Murchison Range spot, feared
    as capable of harm and sometimes addressed or propitiated. It describes a water-hole
    address to Wollunqua, an effigy-like mound ritual meant to keep it underground,
    and later covering the mound after reported growling. It also describes Arunta
    Oruntja as mischievous night-wandering spirits feared for carrying people underground.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Intichiuma rites to increase a totemic animal or plant do
    not involve invoking the ancestor, and that names of Alcheringa ancestors are
    freely mentioned with respect in sacred ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wollunqua totem is identified as the single exception in which an appeal
    to or attempt to propitiate a totemic ancestor occurs among the Warramunga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wollunqua is described as a huge snake still existing at a spot in the Murchison
    Range and capable of injuring or destroying people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Thapauerlu, two old headmen of the totem group stood at the margin of a
    water-hole, addressed Wollunqua, and asked it not to harm them or the visitors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men of the Wollunqua totem group believed they could control the snake to
    some extent; in one ceremony they built and hacked apart a decorated mound representing
    it to force it to remain underground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the mound was left uncovered, old men said they heard the snake growling
    and piled branches over the remains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wollunqua is described as the dominant snake, animal rather than human in
    form, and as the most powerful creature known to the Warramunga, without interest
    in moral conduct.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Arunta Oruntja are described as mischievous spirits that wander especially
