canonical_text:
  quote: ''
  summary: The passage introduces sacred ceremonies connected with totems, distinguishes
    public ceremonies from those restricted to initiated men, describes the relation
    of many restricted ceremonies to totemic ancestors, and gives Arunta examples
    involving initiation, Engwura ceremonial sequences, sacred timing, performers,
    Churinga, the nurtunja, the waninga, a sacred storehouse, and a ceremonial platform.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage divides ceremonies into two groups: one may be witnessed or joined
    by women or children, while the other may be seen and joined only by initiated
    men.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great majority of the ceremonies restricted to initiated men are connected
    with totems and refer to episodes in the lives of totemic ancestors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that ceremonies of this kind occur in all the tribes studied
    by the authors.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The performance of these ceremonies may continue over two or three months,
    with one or more ceremonies performed daily.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ceremonies are often associated with initiation of young men or with Intichiuma,
    and the passage states that their general features agree across central and northern
    tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Arunta tribe, a boy who is circumcised or subincised is shown some
    of these ceremonies and then learns their meaning for the first time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the Engwura described by the authors, natives from different localities
    gathered and a large number of ceremonies were performed from mid-September to
    mid-January.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: During part of the Engwura, ceremonies occurred daily, and sometimes five
    or six were performed within twenty-four hours.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Arunta, sunrise and sunset are described as favourite times for performing
    these ceremonies.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The number of performers is usually small, rarely exceeding two or three.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the northern Arunta a sacred pole called a nurtunja is frequently used,
    while in the southern Arunta a waninga is used.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The nurtunja and waninga usually represent the totemic animal or plant.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Churinga are often attached to the nurtunja and are said to belong to individual
    members of the totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: When a series of ceremonies is to be performed, one or two old men bring Churinga
    from the sacred storehouse to the ceremonial ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Churinga are placed on a special platform, and the spot is regarded as
    sacred while the Churinga remain there.
  category: sequence
  evidence_refs:
  - ev:7
