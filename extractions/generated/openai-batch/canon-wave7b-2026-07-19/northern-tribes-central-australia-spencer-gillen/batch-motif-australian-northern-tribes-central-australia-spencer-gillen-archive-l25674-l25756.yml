canonical_text:
  quote: "“the time of mourning was over, and that she had been gathered unto her
    totem”"
  summary: The passage describes a Warramunga final burial ceremony in which decorated
    women crawl through a trench beneath men standing astride it, a decorated arm-bone
    in paper bark is taken and broken with an axe, the bone is buried in a small pit
    beside a totemic emblem, and the mourning period is ended. The text states that
    after the bone is deposited, the dead person’s spirit returns to its camping-place
    in the Wingara with other spirits of the same totem until reincarnation.
  language: English
  quote_policy: quoted
