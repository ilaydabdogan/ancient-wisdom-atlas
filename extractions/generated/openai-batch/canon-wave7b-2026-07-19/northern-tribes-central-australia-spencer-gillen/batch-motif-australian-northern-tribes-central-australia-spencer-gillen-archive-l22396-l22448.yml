canonical_text:
  quote: ''
  summary: The passage describes Arunta, Kaitish, and Unmatjera beliefs about a spirit
    individual and a second spirit or double associated with a person. When reincarnation
    occurs, the second spirit remains behind and is thought to watch over the reincarnated
    individual. Some people are said to see spirits and, in some tribes, to receive
    sacred ceremonies from them. The authors offer an interpretive explanation that
    such ceremonies may originate in dreams. The passage contrasts Arunta and Kaitish
    claims about spirit contact with Warramunga and northern groups, where spirit-seers
    are mentioned but spirits are not said to teach ceremonies and no comparable second
    spirit is reported.
  language: English
  quote_policy: summarized
