canonical_text:
  quote: At intervals they shouted out, telling the Uluuru that they were “singing
    their Wingara.”
  summary: In a Wollunqua totem ceremony, old Kingilli men remain by the mound, light
    fires after dark, and sing refrains for Uluuru men to hear. The songs are said
    to be inherited from the Wingara and to refer to the Uluuru's Wingara ancestors,
    in this case the Wollunqua. Figure captions describe the Kingilli showing the
    Wollunqua mound to Uluuru walking around it, and stroking the base of the mound
    to appease the snake.
  language: English
  quote_policy: quoted
