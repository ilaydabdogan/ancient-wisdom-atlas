canonical_text:
  quote: ''
  summary: Ethnographic passage describing marriage-related rites and kin-regulated
    sexual access among the Warramunga and several neighboring northern Central Australian
    tribes. It describes an operation, ornamentation, transfer to an allotted husband,
    sleeping across a fire, body rubbing with grease and red ochre, collection of
    food, tying of a small married-woman’s apron, temporary access by specified kin
    categories, later taboos, tribal variants in the ritual operator, and a similar
    procedure after widowhood and mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the operation, the young woman is decorated with string, head-bands,
    armlets, and necklets, which she later gives to her father and mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man to whom she has been allotted takes her to his camp, where the two
    sleep on opposite sides of the fire until the next morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For two or three mornings the allotted man takes her into the bush, does not
    have intercourse with her, and rubs her body with grease and red ochre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She collects vegetable food, including grass seed and yams, and takes it to
    her mother and elder sister, who tie the small string apron called matjulari around
    her waist; the passage identifies this apron as the emblem of a married woman
    in the tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For two nights she is lent to specified kin categories and lawful husbands
    before becoming the property of the man to whom she was assigned, in the source’s
    wording.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports substantial agreement with Warramunga customs in several
    named tribes, with the difference that the husband’s father is generally the operator.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Binbinga, Anula, and Mara tribes the custom is described as closely
    similar; the operator is a napitji man, identified as the husband’s father, and
    in the Gnanji tribe the mother’s father performs the operation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Across the sixteen tribes discussed, the passage compares whether the operator
    belongs to the same moiety as the young woman or to the other moiety, and it gives
    subclass examples for a Panunga woman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that men from the same group as the husband, and in some
    tribes other specified relatives, have access on rare occasions, while those relatives
    are otherwise tabooed; violations are described as punishable, in some cases by
    death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a husband dies and, after mourning, the woman is handed to one of his younger
    brothers, the new husband lends her for a day or two to other specified men.
  category: sequence
  evidence_refs:
  - ev:6
