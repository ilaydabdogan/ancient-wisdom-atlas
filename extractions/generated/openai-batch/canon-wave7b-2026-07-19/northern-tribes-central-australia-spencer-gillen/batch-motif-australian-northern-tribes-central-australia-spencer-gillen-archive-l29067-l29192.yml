canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing chipped-flake adzes: their stone materials,
    manufacture, distribution, mounting in spear-thrower handles among the Arunta
    and Luritja, use in cutting pitchi grooves and making inkulta flaked sticks, gendered
    restriction of adze use, and illustrated adze types by size and function.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The adze is described as a flake of flint or opalescent quartzite, usually
    with a smooth conchoidal fracture on one side and a chipped surface on the other,
    biconvex in section, with a convex cutting edge.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The flake is made by striking a block of suitable stone with a small quartzite
    pebble, then chipping and shaping the surface and cutting edge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that chipped flakes of this kind occur across the central
    area, with observed use from the Lake Eyre district to the Gulf of Carpentaria
    and westward to Mount Olga, and also over much of the western continent.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Arunta and Luritja tribes, the stone flakes are fixed into spear-thrower
    handles using a lump of resin obtained from porcupine grass.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When used from the spear-thrower handle, the stone projects slightly beyond
    the resin and is grasped above the resin with the conchoidal fracture turned away
    from the operator.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage compares the tool’s manner of use to a chisel or gouge grasped
    close to the cutting surface and used to make cuts directed toward the worker.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some adze flakes are irregular, pointed, or shaped like a small chisel with
    straight or curved edges.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Warramunga and other tribes use small forms of the implement to cut series
    of grooves ornamenting the surfaces of large pitchis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The grooving work on pitchis is stated to be done by men and never by women,
    who neither use nor possess adzes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In making inkulta, a worker takes a straight twig, pares off bark, and cuts
    successive attached curved flakes while turning the stick, producing a spiral
    arrangement of wooden flakes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The illustrations distinguish adze types by size and function: a large Arunta
    flint for coarser work and a smaller implement for finer pitchi grooves.'
  category: relationship
  evidence_refs:
  - ev:7
