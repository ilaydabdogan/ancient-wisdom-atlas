  quote: ''
  summary: The passage describes the construction of an Anula bark canoe, including
    mangrove wood reinforcement, rope ties, internal sticks, extra bark flooring,
    and bilge-water management. It states that the canoe was made and owned by Anula
    men, had been brought from the Pellew Islands up the Macarthur River, and that
    boats of this size can carry six or eight people across open sea while some paddle
    and others bail water.
