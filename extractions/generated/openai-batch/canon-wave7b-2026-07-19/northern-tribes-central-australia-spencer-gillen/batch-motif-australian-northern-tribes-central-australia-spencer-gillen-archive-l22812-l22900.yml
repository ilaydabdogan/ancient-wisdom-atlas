canonical_text:
  quote: ''
  summary: 'The passage describes several Kaitish forms of pointing-sticks used in
    harmful magic: their secret manufacture with resin, hairstring, blood, fire, down,
    ochre, singing, and concealment; their nocturnal use against an enemy; fear of
    contact with their dangerous magic; and an anecdote about a demonstration of the
    atnilinga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Kaitish, several forms of pointing-sticks are described, including
    imwania, unqurlia, therpera, and atnilinga.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
- id: obs:2
  text: The imwania is made in a secret place in the bush from a cut stick with a
    resin lump at one end and often a strand of hairstring attached.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maker covers the imwania with his own blood, dries it near fire, burns
    rings around it with a fire-stick, ornaments it with white birds' down, and keeps
    it hidden in bark.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When using the imwania, the man goes by night to an enemy's camp, shuffles
    with his feet, turns his back to a sleeping enemy, and jerks the stick toward
    him between his legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After use, the imwania is placed in a hollow log in the bush, and people avoid
    it because of the evil magic it is said to contain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The unqurlia is covered with red ochre and drops of blood, with down on the
    tip, resin knob, and string.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the unqurlia has been sung, evil magic is described as present in every
    part of it, and people avoid even tiny fallen particles of down.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: If a small bit from the unqurlia is carried by the wind, people follow it
    and cover it with earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The therpera has notches cut with a fire-stick instead of rings and is not
    ornamented with down.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The therpera and unqurlia are pointed between the legs when used.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The atnilinga is said to have been used in the Alcheringa by Bukhara and Panunga
    men, while other pointing-sticks were used by men of other moieties.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some atnilinga pointing-sticks were believed to have come from Alcheringa
    times and to have caused many deaths before being washed away in a large flood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: During the making of the atnilinga, words identified as Alcheringa words are
    sung repeatedly, though they are said to have no recent meaning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The described people are said to stand in great awe of these pointing-sticks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: During a demonstration of the atnilinga, one observer withdrew to a safe distance,
    and the demonstrator said that some arungquiltha or evil magic had gone into his
    head.
  category: sequence
  evidence_refs:
  - ev:6
