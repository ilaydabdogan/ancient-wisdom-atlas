candidate_motifs:
- id: motif:1
  label: multi-stage initiation with separation, pursuit, decoration, and reintegration
  taxonomy_refs:
  - initiation
  basis: The passage describes newly initiated youths separated near the women's camp,
    pursued to the corroboree ground, decorated, touched by kin, and released from
    silence through named rites.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The description is ethnographic and passage-specific; no broader symbolic
    interpretation is required to identify the initiation pattern.
- id: motif:2
  label: ritual pursuit to a safe ceremonial ground
  taxonomy_refs:
  - initiation
  basis: The boys are chased by yelling guardians and thrown boomerangs until they
    reach the corroboree ground, where they are safe.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives the action clearly but does not explain its meaning
    beyond the boys' safety at the ground.
- id: motif:3
  label: silence broken through food offering and biting gesture
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: The passage states that release from silence involves food presents; in the
    later rite, food is presented to men and the initiate bites the recipient's finger,
    breaking the ban.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The taxonomy reference sacred_exchange is used for structured ritual exchange;
    the passage itself does not use the term sacred.
- id: motif:4
  label: maternal provision before male initiation handling
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: In the Binbinga account, the boy's mother gives hair-string and later food
    while weeping, after which male ritual figures grease, string, and transfer the
    boy.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The Binbinga sequence is incomplete in this excerpt, ending mid-sentence.
