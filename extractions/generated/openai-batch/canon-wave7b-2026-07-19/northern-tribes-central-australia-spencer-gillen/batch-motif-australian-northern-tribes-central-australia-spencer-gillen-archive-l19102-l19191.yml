canonical_text:
  quote: ''
  summary: 'The passage describes stages of initiation ceremonies: preparatory separation
    of moieties, dawn pursuit of newly initiated youths to the corroboree ground,
    release from silence through food, decoration, women relatives'' contact, and
    finger-biting. It then begins an account of a Binbinga Yakomari boy''s initiation
    involving hair-string, grease, red ochre, fur-string, maternal gifts, food division,
    and transfer among male ritual handlers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men of one half of the tribe prepared a special ceremony while the other men
    kept away from the corroboree ground until it was ready.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Through the night the preparers sang and danced on the ground, while men of
    the other moiety slept near the creek bed and were summoned at daylight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Newly initiated youths spent the night near the women's camp under instruction,
    and at sunrise their guardians made a circuit behind the women's camp after the
    women had moved to the far side of the creek.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The guardians rushed and yelled toward the women's camp; the boys ran toward
    the corroboree ground while pursued by yells and thrown boomerangs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Once the boys reached the corroboree ground they were considered safe and
    joined the men who had been watching.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The remaining act was to release the boys from a ban of silence, which the
    passage says involved presents of food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Thakomara was decorated by a Tjunguri man, and the Thungallas by Thapungarti
    men; each was painted front and back with charcoal and red ochre designs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boys brought food in a pitchi and knelt on boughs spread near the main
    camp.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women decorated with red ochre and yellow lines approached from behind so
    as not to see the boys' faces; tribal mothers and sisters stroked and patted them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ceremony called barkamunda enabled the boys to speak again to the women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: In a later ceremony, the Thakomara and Thungallas made food offerings to specified
    groups of men; each recipient held up a finger for the initiate to bite, and the
    ban of silence was broken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The later finger-biting and food-offering ceremony is named thallateilbunthan.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage introduces Binbinga and Mara initiation ceremonies from the western
    shores of the Gulf of Carpentaria as illustrative material.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: A Yakomari boy in the Binbinga tribe was seized by a Paliarinji man, identified
    as his mother's brother's son, and was told to ask his mother for hair-string.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The boy's mother gave him hair-string while weeping, and the boy tied it on
    himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Paliarinji rubbed the boy with grease and red ochre, placed fur-string
    crosswise on his chest and back over his shoulders, and sent him back to show
    himself to his mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After embracing and weeping over him, the mother gave the boy little roots
    and sugar-bag that she had collected.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: At the men's camp the boy ate a little, while the main part of the food was
    divided among named groups of men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The boy's elder brother told him to go with a Tjurulum man, who is described
    as equivalent to a mura man in the Arunta tribe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: The Tjurulum and Pungarinji men rubbed the boy with grease and took him to
    a Tjamerum man; the excerpt ends mid-sentence after this transfer begins.
  category: sequence
  evidence_refs:
  - ev:8
