    categories' full social or ritual scope.
- id: claim:2
  claim: The passage explicitly equates the Binbinga Tjurulum man with the Arunta
    mura man, defined here as the brother of the mother of the boy's future wife.
  claim_level: same_function
  target: Tjurulum man in Binbinga initiation and mura man in Arunta initiation relations
  evidence_refs:
