  quote: the time had come when he must no longer walk about a mere boy but become
    a young man
  summary: 'The passage describes stages of male initiation: seclusion after an operation,
    return and transfer from the mother''s camp to the men''s camp, subincision before
    assembled men, handling and burial of blood, release from a silence ban, and related
    Mara and Anula terminology and procedures.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An elder brother takes the boy into the bush, where the two stay alone until
    the wound has healed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother asks the mother for string, and she gives him string and
    a pubic tassel that she made.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After decorating the boy, the elder brother cuts a limb from a tree, leans
    it against the tree, and leaves the boy sitting straddle-legged across it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother rubs the boy with red ochre, removes him from the branch, gives
    him sugar-bags and lilies, and tells him to give all of the food to his elder
    brother, who eats it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The elder brother takes the boy to the men's camp and tells him that he is
    to live there now and no longer have anything to do with the women in their camp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: At a later time, subincision is performed during ceremonies connected with
    placing the bones of a dead man in a hollow log.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The youth is brought to a camp where all the men are assembled; two Paliarinji
    men lie down, the boy is placed crosswise on his back above them, a Yakomari holds
    his legs open, and a Tjurulum man sits astride him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Another Tjurulum man performs the operation, hands the knife to the elder
    brother, and retires to one side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The boy is made to suck the blood on the knife and then sits over paper bark
    so that blood from the wound runs into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: An elder man makes a small fire, warms his hands at it, and holds them over
    the penis to relieve pain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: The blood collected in paper bark is taken to the boy's mother, who buries
    it in the bank of a water pool to ensure the growth of lilies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:12
  text: After recovery, the boy collects food, and the food is presented to the Tjurulum
    operator and to Pungarinji, Tjuanaku, and Yakomari men who came from a distance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: Each of the men who receive the food stands in front of the boy, lifts a hand
    to his mouth with the first finger crooked, and the boy bites the finger, releasing
    him from the ban of silence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:14
  text: The passage gives Mara and Anula terms for circumcision and subincision and
