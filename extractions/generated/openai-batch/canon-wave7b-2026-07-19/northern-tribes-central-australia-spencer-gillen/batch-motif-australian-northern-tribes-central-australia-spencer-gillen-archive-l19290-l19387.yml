  category: other
  evidence_refs:
  - ev:4
- id: obs:15
  text: In the Anula account, a Roumburia boy is caught by a Tjurulum man, told not
    to cry out, given a hair girdle by his father, and sent to his mother, who tells
    him not to cry out or run away but to bring in many men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Anula boy travels under Tjurulum charge to distant camps; men agree to
