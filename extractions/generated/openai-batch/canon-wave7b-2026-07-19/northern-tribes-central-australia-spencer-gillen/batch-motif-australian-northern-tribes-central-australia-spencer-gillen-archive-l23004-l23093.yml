canonical_text:
  quote: ''
  summary: 'The passage describes several reported forms of harmful and counteracting
    magic among Warramunga and Kaitish people: singing over yam-sticks, prickles,
    head-rings, bones, pointing-sticks, a fire-making stick used with a rabbit-bandicoot,
    and ant-hill dust, with effects said to include illness, wasting, genital injury,
    bleeding, stomach pain, death, or recovery when countermeasures are performed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman sings over a yam-stick, moves it as if pulling something toward herself,
    hides it, and the older woman targeted by the act becomes ill and wastes away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same woman may later tell the ill woman that magic caused the illness
    and rub her with fat, red ochre, and the yam-stick as if drawing the harmful magic
    back into the stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When one woman has been verbally hostile to another, the latter may sing over
    a yam-stick in a retired place, leave it there, later bring it back, provoke a
    quarrel, and strike the enemy with it; the target is then said to waste away and
    die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Warramunga women are described as singing over three-cornered prickles and
    placing them where targeted men are likely to urinate, with genital decay stated
    as the result.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Warramunga woman may sing one of her own head-rings and point it secretly
    toward a man to make him thin and in poor condition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a woman suspects another woman of improper familiarity with her husband,
    she may charm her yam-stick by singing over it and point it at the suspected woman,
    producing a flow of blood from the vulva.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Warramunga women are said to punish wrongful intercourse by singing over poison
    bones made from euro and emu limb bones and using them in the ordinary way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A special Warramunga pointing-stick called atnitjarunga is said to cause stomach
    pains when thrown toward a man.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: To punish a woman who deserted her husband, an aggrieved man catches a lean
    old female rabbit-bandicoot with young in her pouch, dislocates both hip joints
    without killing it, places it on its back, and rubs a fire-making stick against
    its teats while singing the woman’s name and the words 'go and kill.'
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Before catching the bandicoot the man ties string tightly around several parts
    of his own body, and after the singing he runs away, throws himself down, tears
    the string away, and scatters the pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The bandicoot is left unable to move and dies slowly; as it dies, the deserted
    woman is said to waste away, become unable to move, and die unless the man performs
    reversing actions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the man regrets the spell, he bleeds his tongue and arm, greases himself
    with lizard fat, rubs blood on himself, drinks a little blood, later greases and
    red-ochres himself, and the woman is said to recover and return.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Kaitish man who wishes to kill an enemy may sing a small ant-hill, secretly
    bring it to camp, pound it up, remain behind when others go hunting, and scatter
    the dust at the enemy’s camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The ant-hill dust is described as fine material that cannot be distinguished
    from the surrounding sand.
  category: attribute
  evidence_refs:
  - ev:7
