canonical_text:
  quote: ''
  summary: 'The passage describes parts of an initiation sequence: a novice transfers
    grass seed through men to his mother; after healing, women prepare a smoky fire,
    relatives handle yams and meat, the youth is touched on the mouth with a yam and
    released from silence, and tabooed yams are carried to old men. It also explains
    the mother''s wearing of alpita and maintenance of fire while the boy is in the
    bush, compares ceremonies and beliefs among neighboring groups, and begins a Kaitish
    legend of two little hawk boys emerging from eggs.'
  language: English
  quote_policy: summarized
