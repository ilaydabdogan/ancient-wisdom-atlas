literal_observations:
- id: obs:1
  text: The plateau is described as an inland basin with edges tilted up along the
    watershed line; rivers beyond the coastal watershed run toward the Gulf of Carpentaria
    or the northern and north-eastern sea coast.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the northern edge of the Macdonnell Range, the view extends across Burt
    plains with mulga scrub, gum-tree lines marking dry creeks, and ranges running
    west and curving eastward toward the Strangways.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Central Mount Stuart is described as marking the central point of the continent
    and appearing at first as a solitary rounded mass, though closer approach shows
    it to be a group of hills with a main central mass.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Unmatjera are identified as living in the country around Central Mount
    Stuart, while the Foster Range marks the southern boundary of the Kaitish and
    the northern boundary of the Unmatjera.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The bean-tree is said to be of great service to the natives because its soft
    wood can be worked with stone implements into pitchis and shields.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Drought had severely affected the natives and the bean-trees, but rainfall
    replenished water-holes and quickly made the country green with fresh herbage.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Davenport Range contains a granite-filled valley where weathered boulder-shaped
    masses form the place known as the Devil’s Marbles; some boulders are poised like
    rocking stones.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Davenport Range is described as the dividing line between the Warramunga
    and Arunta nations, with several tribes to the south and a closely allied group
    of tribes to the north.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Near the Murchison Range, small creeks meander westward and are fringed with
    gum-trees; Eucalyptus terminalis is noted for its brilliantly white trunk, on
    which natives rub forehead bands to whiten them.
  category: action
  evidence_refs:
  - ev:8
