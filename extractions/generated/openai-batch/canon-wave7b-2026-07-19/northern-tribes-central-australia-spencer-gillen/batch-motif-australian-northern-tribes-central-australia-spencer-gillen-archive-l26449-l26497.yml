canonical_text:
  quote: ''
  summary: The passage describes post-expedition restrictions on the immirinja, including
    silence, black body paint, Eremophila twigs, and nocturnal-animal tail tips for
    wakefulness. It then describes the chichurkna flying over camp and threatening
    paralysis if it sees a right arm, while its cry, once heard, prevents further
    harm. The passage concludes that the avenging party killed the father of the intended
    target after the target fled, and that another atninga will probably retaliate,
    maintaining a continuing vendetta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the expedition, the men returned to their camps, and the immirinja were
    not to speak of the expedition for several days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The immirinja were instructed to paint their bodies black and continue wearing
    Eremophila twigs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the men wore alpita, identified as rabbit-bandicoot tail tips, because
    this part of a nocturnal animal was supposed to make the wearer wakeful.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chichurkna was said to fly over the camp hoping to injure the murderers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men had to keep the bird from seeing their right arms, because such sight
    was said to cause paralysis.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chichurkna sounded like a child crying in the distance, and after any
    man heard it once, it was said to be powerless to harm him further.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The avenging party did not kill the man they had gone to find because he had
    learned of their approach and gone to a distant part of the country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Unable to kill the intended target, the party speared his father, alleging
    that the old man knew about his son going Kurdaitcha to kill the Alice Springs
    man and had not tried to prevent him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage expects that a return atninga will be organized against the Alice
    Springs group and that the old man’s death will probably be avenged.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage characterizes this process as an endless kind of vendetta maintained
    among the tribes, though sometimes with more noise than bloodshed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A figure caption identifies an Atninga scene in the Arunta tribe with men
    testing shields.
  category: action
  evidence_refs:
  - ev:7
