  quote: ''
  summary: The passage describes ordinary, secret, relational, status, initiation-related,
    class, and totemic names or address terms. A sacred Churinga name is known only
    to older initiated men of the same totemic group, is associated with the churinga
    nanja and often with an Alcheringa ancestor believed to be reincarnated, and is
    spoken only in low tones. The passage also describes nicknames, kinship-based
    address, initiation-status terms, and a Urabunna practice in which a father gives
    a childhood name and a father's father gives an initiation name.
