canonical_text:
  quote: ''
  summary: 'The preface describes fieldwork access among Central and Northern Australian
    tribes, the authors'' travel route from Lake Eyre to the Gulf of Carpentaria,
    and their conclusion that several tribes share important beliefs: every living
    tribe member is a reincarnated spirit ancestor, and totemic groups are responsible
    for increasing the animal or plant that names the group. The passage also compares
    descent systems and argues for continuity between central, northern, southern,
    and coastal tribes'' beliefs and customs.'
  language: English
  quote_policy: summarized
