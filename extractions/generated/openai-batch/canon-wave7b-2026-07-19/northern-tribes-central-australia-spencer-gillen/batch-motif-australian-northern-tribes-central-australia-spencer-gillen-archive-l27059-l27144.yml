canonical_text:
  quote: ''
  summary: The passage compares naming practices among central, northern, and coastal
    Australian tribes. It contrasts highly restricted sacred-name knowledge with less
    restricted Warramunga practice, describes Gnanji two-name practice and grandparental
    names, notes Binbinga, Anula, and Mara one-name succession, and summarizes a proposed
    sequence in which ordinary, second, and sacred names are treated as equivalents
    across groups.
  language: English
  quote_policy: summarized
