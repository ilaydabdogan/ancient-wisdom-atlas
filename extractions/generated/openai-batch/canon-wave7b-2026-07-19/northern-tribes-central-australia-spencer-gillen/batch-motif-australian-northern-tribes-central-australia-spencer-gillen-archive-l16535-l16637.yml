canonical_text:
  quote: ''
  summary: The passage describes portions of Intichiuma ceremonies involving grass-seed,
    rain, and grub totems. It records ritual making and exchange of totemic food,
    restrained consumption by totem members, sanctions for overconsumption, a Kaitish
    rain ceremony using stones, water, ochre, rainbow and lightning designs, shield
    concealment, cloud-like down, plover calls, silence and separation, and a similar
    Unmatjera grub ceremony involving cross-moiety painting and distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman identified as Thungalla's lubra makes four grass-seed cakes, and Thungalla
    distributes them to named social classes or has one sent to another class.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Opilla/Purula woman gives Thungalla seed; he has it made into another cake,
    eats a little, and gives the rest to Umbitjana men described as his tribal fathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thungalla instructs women of all classes to gather seed; most of the seed
    is carried to Mulyanuka men, while a smaller quantity is brought to him by his
    lubra and women of her subclass.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mulyanuka men return with a little seed and exchange it for the supply brought
    to Thungalla; he says that the restriction is over and that they may eat freely,
    while he and men of the totem eat sparingly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that a man who eats too much of his own totem will be killed
    by a charmed bone by men of the other moiety because he will lose the power to
    perform Intichiuma and increase the totem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kaitish rain Intichiuma is conducted by an old Opila man, head of the
    water totem, accompanied by old men of the totem when present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Anira, the passage connects the ceremony with an Alcheringa event in which
    two old men drew water from their whiskers; the whiskers are represented by stones
    from which the rainbow arose.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The rain leader paints the stones with red ochre and paints rainbow forms
    on the ground, on his body, and on a shield; the shield is also marked with white
    zigzag lines representing lightning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: While singing the stones, the leader pours water from a pitchi over the stones
    and himself, then returns to camp carrying the decorated shield.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The shield is restricted to Purula and Kumara men; the passage says that if
    men of the other moiety see it, the rain will not fall.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The rainbow is described as the son of the rain and as wanting to end the
    rain; the shield bearing the rainbow drawing is hidden until sufficient rain has
    fallen, then the rainbow is rubbed out.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The headman keeps a water-filled pitchi beside him and throws small pieces
    of white down, described as clouds, in different directions to make rain fall.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The men who accompanied the leader camp apart, the leader and the men avoid
    intercourse with women, his wife stays away on his return, and he imitates the
    call of the pilpilpa or plover.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: After a silent night, the leader covers the stones with bushes; after another
    silent night, men and women go out separately for food and game, return crying
    like the plover, and the leader's mouth is touched with food to remove the ban
    of silence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: If rain follows, it is attributed to the ceremony; if not, the failure is
    attributed to someone preventing it by superior magic.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:16
  text: Men of the rain totem wear tufts of euro teeth over the ears because two euro
    men are said to have come out of the whiskers of the two old rain men in the Alcheringa.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:17
  text: The Unmatjera Idnimita grub ceremony is described as closely similar to Kaitish
    ceremonies; its Purula Alatunja is painted by men of the other moiety, receives
    gathered grubs, eats a little, and distributes most to the other moiety and a
    few small ones to his own moiety.
  category: sequence
  evidence_refs:
  - ev:7
