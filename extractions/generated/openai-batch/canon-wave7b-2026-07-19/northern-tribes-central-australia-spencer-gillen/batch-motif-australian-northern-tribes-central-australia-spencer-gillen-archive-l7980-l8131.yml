  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Arunta case described by the authors, the corresponding wankilli relationship
    would be tabooed, while in the Warramunga tribe it is lawful for the man to have
    one or more Nakomara wankilli wives in addition to Nambin katununga wives.
  category: relationship
  evidence_refs:
  - ev:8
