canonical_text:
  quote: ''
  summary: An ethnographic explanation of Warramunga subclass relationships is given
    through the example of a Thapungarti man, describing father, father’s sisters,
    lawful wives, wife’s mother relations, avoidance, alternative lawful marriage
    with a Nakomara wankilli woman, resulting child subclasses, and comparisons with
    Arunta and tribes north of the Kaitish.
  language: English
  quote_policy: summarized
