canonical_text:
  quote: ''
  summary: The passage recounts Ulanji, a snake in Mungai times, emerging from the
    ground and forming water-holes, creeks, springs, hills, crocodile places, ceremonial
    sites, spirit children, stone, and named places before returning underground.
    It then explains the origin of the Binbinga marriage system through a Paliarinji
    snake-totem man who establishes proper affinal relations with Kangaroo and Tjuanaku/Pungarinji
    figures. A note compares similar arrangements among the Mara, involving Kakan
    the white hawk, black hawk, fire, Dingo, and Eagle hawk figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Mungai times, Ulanji, identified as a snake, came out of the ground at
    Makumundana and made a large water-hole where lilies grow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ulanji travelled above ground and made creeks, springs, hills, a hill range,
    a valley, water-holes, and places with crocodiles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At camps, Ulanji performed ceremonies and left spirit children behind him
    who came out of his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Kuriella-dat-kaulu, Ulanji saw flying foxes on rocks, climbed up, cut off
    their heads, and left their bodies hanging.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ulanji removed two of his ribs and left them on the ground, and two trees
    called Lamara arose to mark the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Tutita, Ulanji left quartzite that is used for making knives and spear-heads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Nanawandula, Ulanji made a creek and water-hole with many crocodiles, removed
    his heart, and named the place Kurta-lula, meaning heart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ulanji went underground, later came out at Uminiwura, ceased wandering, and
    finally went down into the ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Paliarinji man of the Ulanji snake totem first told Binbinga people who
    their proper marriage partners were; before he came, they had no proper marriage
    rules.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Marawa, the Paliarinji snake man and a Tjurulum kangaroo man assigned each
    other affinal terms, including wife’s father and daughter’s husband.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Tjurulum kangaroo man gave his daughter to the Paliarinji snake man and
    instructed him to take a Tjamerum wife and treat Tjurulum men as wife’s fathers.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Tjurulum man later met a Tjuanaku man performing sacred ceremonies, watched
    him, and the two called each other wife’s brother.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A Pungarinji father returned and gave a Tjuanaku woman to the Tjurulum man
    after recognizing him as daughter’s husband.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: A note says that among the Mara people, Kakan the white hawk showed marriage
    arrangements after disputing with the black hawk about giving fire to the people.
  category: other
  evidence_refs:
  - ev:14
