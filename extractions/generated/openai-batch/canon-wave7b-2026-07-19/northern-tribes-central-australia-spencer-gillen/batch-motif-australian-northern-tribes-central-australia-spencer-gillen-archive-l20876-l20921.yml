canonical_text:
  quote: ''
  summary: The moon, originally a human man, takes and deserts a series of wives,
    later holds many wives at Kullakulla, corrects or opposes men seeking improper
    wives, and then allocates women to men with instructions on proper marriage-class
    pairings. After an old man tries to steal a woman, the moon kills him with a stone
    tomahawk, dies, goes up into the sky, and is now visible in the moon with the
    tomahawk raised.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The moon is described as originally a man and a Purula who came up at Uningamara
    in Kaitish country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moon took a Panunga woman as wife, had a child with her, deserted her,
    and then took and deserted women from several named classes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Kullakulla the moon lived with many wives, all said to belong to the Uningara,
    a little bird, totem.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Endupruk, a Kabbidji of the magpie totem, wanted to take an Umbitjana woman
    who was not his lawful wife; the moon told him he must take a Kumara.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pulla came from the sea to Kullakulla and stole Alpita, an Uknaria woman who
    was not his proper wife; other women tried unsuccessfully to stop him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men from Aroitjarunga came to the moon's camp seeking wives; the moon first
    told them to leave but later decided to give them wives and instructions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The moon assigned specific wife categories to specific male categories and
    told the men to marry in that proper way rather than take wrong women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After allocating wives, the moon was left with only a Panunga lubra living
    with him at Kullakulla.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The moon went to Itungulpa, saw women belonging to Ilparitnanta, returned,
    and told his wife that he had seen them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Okinja-alungara came to steal a woman; when he seized her, the moon killed
    him with a stone tomahawk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After killing Okinja-alungara, the moon died, went up into the sky, and is
    now seen in the moon with his tomahawk lifted as if ready to strike.
  category: sequence
  evidence_refs:
  - ev:8
