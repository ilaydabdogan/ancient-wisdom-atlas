candidate_motifs:
- id: motif:1
  label: initiation through separation, secret revelation, circumcision, and instruction
  taxonomy_refs:
  - initiation
  basis: 'The passage presents a structured initiation sequence: the boy is sent away,
    returns to ritual assembly, first views sacred ceremonies, undergoes circumcision,
    receives restrictions, and is entrusted with a sacred stick.'
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is ethnographic description rather than a mythic narrative;
    the motif label refers to ritual patterning in the passage.
- id: motif:2
  label: ritual departure and return before initiation
  taxonomy_refs:
  - departure
  basis: The boy is instructed to go away for three moons with guardians, visits distant
    groups, and returns with participants for the ceremonies.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The departure is part of an initiation rite and should not be generalized
    as an independent heroic departure without further context.
- id: motif:3
  label: restricted sacred knowledge and concealed object
  taxonomy_refs:
  - forbidden_knowledge
  basis: The boy first sees a sacred ceremony and sacred stick, while women are excluded
    and boys or women are forbidden to see the small sacred stick under threat of
    death.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage frames the restriction as ritual secrecy and controlled revelation,
    not as a transgressive quest for knowledge.
- id: motif:4
  label: ritual sound attributed to a spirit for non-initiates
  taxonomy_refs: []
  basis: The sacred stick is twirled to make a roaring sound that women and children
    are said to suppose is the voice of Katajina, who comes from an ant-hill to eat
    the boy.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage reports the attribution within the described ritual context;
    it does not provide an independent myth of Katajina.
- id: motif:5
  label: post-rite food taboo under threat of illness or death
  taxonomy_refs: []
  basis: The boy is repeatedly warned not to eat a list of animals and emu eggs until
    permitted, with illness or death stated as the consequence of violation.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives the taboo list and threat but not a broader explanation
    of each forbidden food.
- id: motif:6
  label: ritual blood buried to promote plant growth
  taxonomy_refs: []
  basis: The boy's blood is collected, taken to his mother, and buried in the bank
    of a waterhole with the stated idea that lilies will grow more freely.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage states the intended effect on lilies but does not elaborate
    a wider fertility doctrine.
- id: motif:7
  label: ritual remnant transfer with spear exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The foreskin is tied in bark, kept by a Tjurulum man, shown to the father,
    exchanged in connection with presents of spears, handed to the elder brother,
    and buried.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The exchange of spears is explicit, but its precise social or sacred meaning
    is not fully explained in the passage.
