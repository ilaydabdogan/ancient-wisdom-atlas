canonical_text:
  quote: ''
  summary: A boy undergoing initiation is sent away under guardians, returns with
    visiting men, is moved between father, mother, and men, witnesses sacred nocturnal
    ceremonies, receives food and secrecy restrictions, is circumcised while a sacred
    roaring stick is sounded, is shown and entrusted with a sacred stick, and has
    his blood and foreskin disposed of through prescribed acts involving his mother,
    father, elder brother, and a Tjurulum man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy's father tells him to go away for three moons under the charge of
    a Pungarinji and a Tjuanaku man, who take him to visit distant groups invited
    to join the ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On return, the boy is brought by Pungarinji and Tjuanaku men to his father
    and then to his mother, who removes and keeps the string from him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy receives sugar-bag and lilies from his mother and takes them back
    to the men, eating a little himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy spends a night at his mother's camp while visiting strangers perform
    a sacred ceremony on the ceremonial ground with singing through the night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sundown the next day the elder brothers lay the boy near the lubras and
    cover him with paper bark while decorated men approach singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The elder brothers set a row of boomerangs upright in the ground in front
    of the boy.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: At midnight a Tjuanaku man wakes the boy and tells him to sit near the bushes
    and watch what is happening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy is shown a sacred ceremony for the first time, with men dancing in
    leafy ankle bunches and totemic body designs not used in ordinary corroborees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women are absent from the ceremonial ground and can hear the sound from their
    camps but cannot see the performance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the performance, the boy is told its meaning and warned not to eat named
    animals and emu eggs until permitted by the old men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At dawn, an elder brother gives a cutting knife to a Tjurulum man and asks
    him to perform circumcision.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: During circumcision, Paliarinji men lie beneath the boy, a Tjurulum man sits
    on his chest, an elder brother holds his legs, opossum-fur string is placed in
    his mouth, and the operator cuts off the foreskin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A sacred stick is twirled to make a roaring sound, which women and children
    are said to suppose is the voice of Katajina coming from an ant-hill to eat the
    boy.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Blood from the wound is collected on paper bark while the boy is again warned
    about forbidden foods and about avoiding Tjuanaku men who are his tribal fathers-in-law.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The boy is shown a sacred stick placed on his palms, warned to obey older
    men, given a small sacred stick to carry until healed, and told not to let boys
    or women see it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The boy is told that if boys or women see the small sacred stick, both he
    and they will die, and he is told to keep swinging the stick.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: After the operation, the boy's brother takes the blood to the mother, who
    buries it in the bank of a waterhole with the stated idea that it will make lilies
    grow more freely.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The foreskin is tied in bark, kept for a time by the Tjurulum man, shown to
    the boy's father, exchanged with presents of spears, handed to the elder brother,
    and buried in the ground.
  category: sequence
  evidence_refs:
  - ev:12
