canonical_text:
  quote: ''
  summary: In an Alcheringa narrative, two hawks, Irritja and Wantu-wantu, have separate
    tree nests and children. Wantu-wantu eats humans and pressures Irritja to catch
    them, while Irritja repeatedly warns people away and catches as few as possible.
    Wantu-wantu extracts three sick men from a hole with a crooked stick, eats one,
    and takes two to his children. Irritja later tries to protect the small hawk Kutta-kutta
    from Wantu-wantu, but Wantu-wantu throws him into a fire; Kutta-kutta escapes
    and reports the attack at the camp of Baku-baku the bell-bird. Baku-baku sends
    painted finches to cut the hawks' tree trunks, then leads men to surround the
    trees; when the two hawks alight on their nests, the trees fall and the men rush
    out.
  language: English
  quote_policy: summarized
