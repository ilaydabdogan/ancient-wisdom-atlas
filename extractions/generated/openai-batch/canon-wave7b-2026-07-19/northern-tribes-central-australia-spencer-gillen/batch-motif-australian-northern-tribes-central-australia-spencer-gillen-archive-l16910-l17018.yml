canonical_text:
  quote: ''
  summary: The passage describes Warramunga black-snake Intichiuma ceremonies involving
    decorated male performers, representations of Munga-munga women, a side performance
    about a wallaby eaten and disgorged, a traditional account of black and white
    snakes fighting with fire-sticks and entering the ground or water-holes, and rules
    governing the expected multiplication, killing, and eating of the black snake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thalaualla ceremonies referred to Munga-munga women; men's decorations
    included red lines and ovals or circles, identified as strings and yams.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a side performance, a decorated man lay hidden in a small trench behind
    a bush, with a ball of white down around his neck representing a small wallaby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the main performance, an old man drew a line on the ground to the hidden
    performer; the men followed the track, and an old Thakomara man stroked the hidden
    performer with a stick to make him disgorge his prey.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The side performance is said to represent an incident in which the old snake's
    son caught and ate a wallaby without giving any to his father, who tracked him
    and made him disgorge it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the last ceremony, eight men represented Munga-munga women; a ground design
    of concentric circles and connecting lines represented the women sitting tired
    with their legs drawn up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four performers wore head-dresses and pendants identified with yams and witchetty
    grubs, and the men later assembled painted black and sang the walking of the black
    snake and the Munga-munga women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: According to the passage, the old Thalaualla saw a great white snake; the
    black snake and white snake each had a fire-stick, disputed over thuthu, threw
    the fire-sticks, fought until exhausted, and went down into the ground or water-holes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the ceremonies and the marching of the snake have been sung, the Intichiuma
    ends and the black snake is expected to multiply in numbers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men of the totem are described as able to cause the snake's increase, but
    they are restricted in eating it; eating it is said to cause their death and prevent
    the animal from multiplying.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A figure caption describes an old man with his arm around a newly initiated
    youth, explaining the meaning of the ceremony to him.
  category: speech
  evidence_refs:
  - ev:6
