canonical_text:
  quote: ''
  summary: 'The passage describes hair and facial-hair practices among northern Central
    Australian tribes: a youth''s hair is tied after initiation as a mark of entering
    the ranks of men; older Warramunga and allied men remove moustache and under-lip
    hairs; tied hair and string bands affect the scalp; and hair thickness or texture
    varies by age and tribe.'
  language: English
  quote_policy: summarized
