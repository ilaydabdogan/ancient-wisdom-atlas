canonical_text:
  quote: ''
  summary: The passage describes Atnatu as a sky-dwelling being connected with the
    origin and enforcement of Churinga or bull-roarer initiation practice; narrates
    punitive actions against people who fail ritual obligations; gives an origin account
    for Tumana and later transmitters of Churinga making and swinging; lists instructions
    and prohibitions given to initiands; and describes a related Warramunga murtu-murtu
    initiation practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atnatu punished people who did not give him Churinga or perform sacred ceremonies
    by throwing them down to earth into Kaitish country through a hole in the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atnatu let down with them the implements described as belonging to the black-fellow,
    including spears, boomerangs, tomahawks, and clubs, and thereby made the Alcheringa
    in the Kaitish tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Atnatu is said to live beyond the sky, to make Intichiuma, to eat everything,
    and to have many lubras who are very thin but have plenty of milk.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atnatu first made the Churinga and swung them in the sky when initiating his
    offspring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Atnatu is pleased when he hears people on earth sounding the bull-roarer during
    boys' initiation and is angry if they do not sound it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the bull-roarer or Churinga is not sounded as expected, Atnatu gathers
    and rattles his spears, hurls them down, and drags men and boys into the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A tradition about Irribilia says that tired initiators did not swing the Churinga,
    after which Atnatu speared them all, dragged them into the sky, ate one boy, and
    the others remained in the sky because they could not return to earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lubras are said not to know about Atnatu and to think that the roaring
    of the Churinga is the voice of a spirit called Tumana, who takes the boy into
    the bush and returns him initiated.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two individuals named Tumana sprang from Churinga, heard Atnatu swinging his
    Churinga in the sky, and tried to imitate him, first with bark and then successfully
    with mulga wood.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two Tumana individuals were killed by two wild dogs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kallidinlidina and Atnabubu had seen what the Tumana did and later showed
    other black-fellows how to make and swing the Churinga.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An initiated youth is instructed to avoid forbidden foods, obey his elder
    brother, swing the bull-roarer, keep it from women and children on pain of death,
    and avoid interfering with other men's lubras.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Warramunga tribe the Churinga is called murtu-murtu and is swung close
    behind the youth's head during initiation, frightening him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: After dusk, old men show the youth the murtu-murtu or sacred stick, tell him
    the tradition about the man who first made it in the Wingara, warn him not to
    let women or children see it on penalty of death, and tell him it will heal his
    wounds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Warramunga lubras believe the noise is made by a spirit called Murtu-murtu.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage states that Warramunga, Tjingilli, and Umbaia initiation ceremonies
    are closely similar in leading features, and that after initiation the boy is
    told to obey elders, avoid forbidden foods, bring food to older men, and avoid
    women allotted to other men, without reference to a special individual who sanctions
    these directions.
  category: speech
  evidence_refs:
  - ev:11
