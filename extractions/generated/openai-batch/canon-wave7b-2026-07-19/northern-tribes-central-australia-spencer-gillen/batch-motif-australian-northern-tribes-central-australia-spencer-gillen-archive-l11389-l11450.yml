canonical_text:
  quote: "“At sunset he slept, and when the sun arose he split into two”"
  summary: The passage describes totem and class in reincarnation; a rain or water
    ancestor at Anira who divides, recombines, descends into and emerges from a water-hole,
    produces water and spirit children from his body, and produces euro men from whiskers;
    group origins including travelling women who leave individuals at sites; and Kaitish
    and Unmatjera accounts of fully developed ancestors and incomplete beings transformed
    by an Alcheringa being such as a crow.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Each Alcheringa ancestor is described as having both a class and a totem;
    in successive reincarnations the totem is supposed not to change, while the class
    may rarely change.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son of Ilpailurkna is described as the reincarnation of an emu Panunga
    man who entered a Panunga woman and was born Kumara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old Purula man arose in human form at the Anira water-hole, identified
    as the centre of the rain people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunset the old man slept; at sunrise he split into two beings, one Purula
    and one Kumara, described as father and son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunset the two beings joined into a Purula, went down into the water-hole,
    emerged at sunrise, divided again, and later remained separate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two beings were red in the morning, sat in sunlight all day, and turned
    black.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The two beings grew into Oknirabata, went up a hill, stroked their beards,
    and streams of water flowed out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: They left spirit children at various places where they performed sacred ceremonies;
    the spirits are said to have emanated from their bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Arumba, two euro men came out of their whiskers, and the passage states
    this as the reason for a close relationship between euro men and the rain totem.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: South-west of Barrow Creek, a number of Purula and Kumara men arose who belonged
    to the Wutta, or little rat, totem.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Groups of women called ertwaininga walked across Unmatjera country, leaving
    individuals at various spots and thereby forming oknanikillas.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: 'Kaitish and Unmatjera traditions are described as having two series of totemic
    ancestors: fully developed men and incomplete human beings called inter-intera,
    who had to be transformed into men and women by an Alcheringa being such as a
    crow.'
  category: relationship
  evidence_refs:
  - ev:7
