    beyond the immediate Intichiuma instruction.
- id: motif:2
  label: Totemic ancestor leaves spirit children and local centres
  taxonomy_refs:
  - culture_hero
  basis: Illinthaualla leaves kulpu and spirit children at sites that become sugar-bag
    totem centres; Pukulungara performs ceremonies and leaves spirit children at Wongatu.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The available taxonomy term 'culture_hero' is broad; the passage presents
    these as totemic ancestral actions rather than using a hero category.
- id: motif:3
  label: Violent encounter explains present animal markings and body form
  taxonomy_refs: []
  basis: The fight between Winithonguru and the opossum man results in Winithonguru
    becoming spotted and the opossum’s head, back, and foot being altered to their
    present forms.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No specific supplied taxonomy reference directly matches this etiological
