- id: ev:3
  type: summary
  locator: lines 22121-22142
  quote_or_summary: A Winithonguru native-cat man arises beside the Qurippi tree,
    kills and burns Warumalla the Karinji Jabiru man, flees, meets a Tjunguri opossum
    man with two young Napungerta women, and after the women are lent to him sings
    himself into a double-penis form.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain; summary derived from supplied passage.
- id: ev:4
  type: summary
  locator: lines 22145-22158
  quote_or_summary: The opossum man spears Winithonguru, whose body becomes spotted;
    in their fight the cat tears the opossum and burns its foot so it splits open.
    Winithonguru then encounters Munga-Munga women, one with a child, and follows
    them after an old black snake sends them away.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
