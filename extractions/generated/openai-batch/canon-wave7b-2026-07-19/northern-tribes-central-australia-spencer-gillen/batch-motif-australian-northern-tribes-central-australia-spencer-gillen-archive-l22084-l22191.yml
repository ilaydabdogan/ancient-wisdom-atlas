- id: ev:5
  type: summary
  locator: lines 22160-22168
  quote_or_summary: Pukulungara, a Tjupila man of the wind totem, arises beside the
    Wongatu water-hole, has a Churinga or murtu-murtu, performs ceremonies there,
    and leaves spirit children behind.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
