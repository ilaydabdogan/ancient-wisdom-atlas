  confidence: high
  cautions: The ascent is involuntary in these episodes and caused by wind or whirlwind,
    not by a deliberate upward journey.
- id: motif:5
  label: Subterranean travel by diving into the ground
  taxonomy_refs: []
  basis: Pukulungara dives into the ground and emerges elsewhere; Unkura also dives
