- id: ev:6
  type: summary
  locator: lines 22168-22176
  quote_or_summary: Two men, a Thapungarti and a Tjapeltjeri, come to Allinji, perform
    ceremonies, travel rapidly, and are caught and carried into the sky by the wind,
    which also hollows out the course of Bonney Creek.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain; summary derived from supplied passage.
- id: ev:7
  type: summary
  locator: lines 22176-22185
  quote_or_summary: At Wongatu, Pukulungara fears the wind may harm him or take his
    murtu-murtu, seizes the implement, cuts the wind in two, dives into the ground,
    emerges elsewhere, and later destroys the wind with the murtu-murtu before going
    down into the ground.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain; summary derived from supplied passage.
- id: ev:8
  type: summary
  locator: lines 22187-22200
  quote_or_summary: Unkura, an old porcupine-grass resin man, comes from the west,
    sees Atjuritja bean-tree men performing Engwura, observes their large nurtunja,
    and hides in thick bush while they sleep with old men nearest the pole.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain; summary derived from supplied passage.
- id: ev:9
  type: summary
  locator: lines 22200-22209
  quote_or_summary: Near sunrise Unkura heats stones, places lumps of porcupine-grass
    resin on them, and the resulting smoke suffocates all the bean-tree men, leaving
    the nurtunja standing alone; frightened, he runs away and leaves the resin behind.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain; summary derived from supplied passage.
- id: ev:10
  type: summary
  locator: lines 22209-22216
  quote_or_summary: Unkura dives into the ground at Allawanja, comes out at Aratika,
    is taken by a whirlwind into the sky and carried to Unjakakka, walks along the
    sky to his camp at Ilkalatjilla, dies there, and forms a large Unkura oknanikilla.
