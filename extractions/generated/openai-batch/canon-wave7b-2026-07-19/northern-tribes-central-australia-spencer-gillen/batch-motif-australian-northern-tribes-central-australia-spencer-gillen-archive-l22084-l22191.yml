canonical_text:
  quote: ''
  summary: 'The passage recounts several Alcheringa-era episodes: an exchange of Churinga
    and alpita followed by Intichiuma practice; the Kulpu sugar-bag man leaving sugar-bag
    and spirit children at places; a Winithonguru native-cat man killing a Jabiru
    man, receiving two women from an opossum man, fighting him, and producing bodily
    features; a wind-totem man using a murtu-murtu against the wind after it carries
    two men into the sky and hollows Bonney Creek; and Unkura, porcupine-grass resin,
    suffocating bean-tree men with resin smoke and later travelling through ground
    and sky before dying.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Burt man returns to a camp, strikes a sleeping Indiara man with a club,
    hides the club, and the two men give their names as Thungalla and Kumara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Burt man and Kumara hold Churinga and alpita close to their stomachs,
    exchange them, and embrace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Untherkapunda tells Kumara to take the alpita when making Intichiuma; Kumara
    brings back, cooks, and eats Idnimita grub and throws down about so the grubs
    come up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Illinthaualla, a sugar-bag man, arises near Thapauerlu, carries sugar-bags,
    travels near the hills, drops kulpu, and leaves spirit children at named places
    that are now local sugar-bag totem centres.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Tjupila man of the Winithonguru native-cat totem arises beside the Qurippi
    tree, kills and burns Warumalla, a Karinji Jabiru man who lived on dead men, and
    flees in fear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Winithonguru meets a Tjunguri opossum man with two young Napungerta women;
    the opossum man lends the women to him, and Winithonguru sings himself so that
    he develops a double penis and has connection with both women at once.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The opossum man spears Winithonguru, whose body becomes spotted; the two fight,
    the cat tears the opossum’s head and back, and the cat puts the opossum’s foot
    in the fire so it splits open.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Winithonguru later hears Munga-Munga women, sees one woman lying with a child,
    and goes with the women for a distance after they are sent away by an old black
    snake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pukulungara, a Tjupila man of the wind totem, arises by a large water-hole,
    possesses a Churinga or murtu-murtu, performs ceremonies, and leaves spirit children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two men, a Thapungarti and a Tjapeltjeri, perform ceremonies at Allinji; the
    wind catches them, carries them into the sky, and hollows out the course of Bonney
    Creek as it rushes along.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pukulungara seizes his murtu-murtu, cuts the wind in two, dives into the ground,
    emerges elsewhere, hears the wind again, destroys it with the murtu-murtu, and
    goes down into the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Unkura, an old porcupine-grass resin man, sees bean-tree totem men performing
    Engwura with a large nurtunja in their camp and hides in thick bush to watch them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Near sunrise Unkura heats stones in a fire, places lumps of porcupine-grass
    resin on them, and the smoke suffocates the sleeping bean-tree men, leaving the
    nurtunja standing alone.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Unkura flees, dives into the ground, comes out elsewhere, is carried into
    the sky by a whirlwind, walks along the sky to his camp, dies, and forms a large
    Unkura oknanikilla.
  category: sequence
  evidence_refs:
  - ev:10
