  claim: The passage presents Kaitish llkitnainga as functionally comparable to Arunta
    Intichiuma because both are Intichiuma ceremonies conducted by the headman of
    the totem.
  claim_level: same_function
  target: Arunta Intichiuma ceremonies
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the shared functional framing and headman role
    stated in the passage.
- id: claim:2
  claim: The passage explicitly describes the Kaitish grass-seed ceremony as an intermediate
    stage between Arunta and Warramunga practices, while also noting that the Arunta
    rite lacks the other-moiety decoration and the particular public ceremony described
    here.
  claim_level: same_function
  target: Arunta and Warramunga Intichiuma performances
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The excerpt gives specific contrasts with Arunta but does not provide
