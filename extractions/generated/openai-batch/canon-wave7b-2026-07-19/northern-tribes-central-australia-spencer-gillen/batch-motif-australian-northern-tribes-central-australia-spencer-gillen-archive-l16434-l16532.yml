canonical_text:
  quote: "“to make the grass grow plentifully everywhere”"
  summary: 'The passage describes rules of participation and food sharing in Intichiuma
    rites, then gives a Kaitish llkitnainga ceremony for the Erlipinna grass-seed
    totem: the ulqua prepares and sings over Churinga, uses down to represent grass
    seed, receives and redistributes food, observes abstinence while singing the seed,
    and later blows ground seed to encourage abundant growth.'
  language: English
  quote_policy: quoted
