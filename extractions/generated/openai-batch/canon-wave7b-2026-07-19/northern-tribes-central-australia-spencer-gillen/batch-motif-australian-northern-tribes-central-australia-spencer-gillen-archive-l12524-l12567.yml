canonical_text:
  quote: ''
  summary: 'The passage describes two totemic ceremonies: an emu totem ceremony in
    which four performers represent Alcheringa ancestors whose Churinga were partly
    stolen, and a water totem ceremony in which five performers enact figures from
    a euro tradition involving a foster woman, iguanas, lightning, and the euro killing
    the iguanas.'
  language: English
  quote_policy: summarized
