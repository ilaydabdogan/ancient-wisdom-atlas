canonical_text:
  quote: ''
  summary: The passage introduces Chapter XXII on myths of celestial and weather phenomena,
    then describes Arunta and Kaitish traditions about the sun as a female being.
    Arunta accounts place the sun woman's emergence in eastern or totemic localities
    and describe a sun-totem ceremony using a sacred pole and decorated disc. A Kaitish
    account says the sun woman travelled to Allumba, where a tree marks the spot;
    if the tree is destroyed, people believe they will all be burnt up.
  language: English
  quote_policy: summarized
