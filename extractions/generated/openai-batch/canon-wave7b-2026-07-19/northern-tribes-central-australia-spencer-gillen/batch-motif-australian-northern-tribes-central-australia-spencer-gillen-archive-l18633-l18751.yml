canonical_text:
  quote: ''
  summary: The passage describes a staged initiation sequence in which a boy returns
    toward camp by smoke signal, is painted and received, is repeatedly secluded from
    women and children, receives instructions and prohibitions from male and female
    kin, witnesses sacred ceremony and songs, hears the murtu-murtu, undergoes circumcision,
    uses eagle-hawk feathers to end a silence rule with certain men, and has blood
    from the wound taken to his mother, who drinks some and gives food in return.
    A footnote compares an initiation song tradition associated with Kukaitcha among
    Arunta, Warramunga, and Wulmala traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thapungarti men tell the boy to set fire to the grass with a fire-stick to
