canonical_text:
  quote: ''
  summary: The passage describes tooth-knocking ceremonies and related handling of
    extracted teeth among several named groups, including uses of water, pounding
    and placing teeth in food, disposing of teeth at waterholes, exchanges among kin,
    and a subsequent section on drawing blood for ceremonial decoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water is put in the mouth immediately before the tooth operation, with the
    stated object of numbing the gums.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a girl's tooth is knocked out, the woman who performed the operation
    takes the tooth back to camp, pounds it, places the remains in flesh, and the
    girl's mother has to eat it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For men, a similar tooth ceremony is conducted after heavy rain when no more
    rain is wanted; the tooth is pounded, put in meat, and given to the man's mother-in-law
    to eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Tjingilli, teeth are knocked out near the end of the rainy season;
    after the operation the tooth is thrown into a water-hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that throwing the Tjingilli tooth into a water-hole is
    believed to drive rain and clouds away.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Gnanji tribe the operation is called ainara and is performed during
    the rainy season; it is described as optional.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Gnanji account, the operator carries the tooth, gives it to the participant's
    mother, receives food and red ochre, and the mother buries the tooth beside a
    waterhole.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stated objects of the Gnanji burial beside a waterhole are to stop the
    rain and increase water-lilies in the pool.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Binbinga and coastal tribes, tooth-knocking is not compulsory and the
    tooth is wrapped in paper bark, passed through kin, and finally buried without
    further ceremony.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In the Binbinga and coastal account, brothers-in-law exchange spears and boomerangs
    after the operation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that drawing blood from the body occurs frequently in ceremonies,
    especially as a fixing material for down used in designs on bodies or implements.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Blood is drawn from the arm or subincised urethra; when drawn from the arm,
    a ligature is tied, a vein is cut, and blood flows into a shield or bark dish.
  category: sequence
  evidence_refs:
  - ev:10
