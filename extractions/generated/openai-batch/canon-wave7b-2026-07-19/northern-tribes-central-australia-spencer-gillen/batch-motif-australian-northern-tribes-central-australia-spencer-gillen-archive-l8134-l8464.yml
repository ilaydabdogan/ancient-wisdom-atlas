canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of kinship terms among named
    sections, including relations called naminni, katakitji, gambatja, kurnandi, wankilli,
    kanquia, tapa-tapu, and others. It describes obligations connected with the death
    of a wife's naminni, including receipt of the deceased's cut-off whiskers, responsibility
    for avenging the death, and thigh-cutting as mourning. It also records differences
    in terminology when a woman speaks and lists kin terms applied in a genealogical
    tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children of the speaker's kabalu and kukaitja are identified as Thungalla;
    the speaker calls them kulu-kulu or auiniari, and they call the speaker naminni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the naminni has disposal of his sister's daughters,
    and that Thapungarti men are naminni of Thungalla men and Nungalla women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the speaker's wife's naminni dies, the deceased man's whiskers are cut
    off by a brother and given to the speaker, who is then responsible for finally
    avenging the death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the speaker's wife's naminni dies, the speaker has the duty to cut his
    thighs as a token of mourning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker's own and brother's children are Thapanunga; the speaker calls
    them katakitji and they call him gambatja.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Naralu women who are the speaker's mother's elder and younger sisters are
    called kurnandi, with elder and younger modifiers given as kurnandi bili-bili
    and kurnandi bitjara.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The children of the speaker's father's elder brothers' children are described
    as Thapungarti, like the speaker, and are called by elder-brother or elder-sister
    terms according to sex.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The children of the speaker's gambatja's sisters are Thakomara and are called
    wankilli; although not usual, wankilli women may lawfully be wives of the speaker,
    and their children are Tjunguri.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sons of the speaker's sisters are called auiniari and the daughters kulu-kulu;
    the passage notes that relations classed as nephews and nieces are distinguished
    as brothers' children, sisters' sons, or sisters' daughters.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The term auiniari is applied by Thapungarti men to Thungalla men on two generational
    levels: the wife''s father and the sister''s son.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Male-line grandfather or grandchild relationship is expressed by the reciprocal
    term kanquia, while female-line grandfather or grandchild relationship is expressed
    by tapa-tapu.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: 'If a Napungerta woman is speaking, some terms differ: she calls her own and
    her sister''s children kulu-kulu, her brother''s children katakitji, and her husband
    and his sisters kulla-kulla.'
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage includes lists of kinship terms applied by a man numbered 25 and
