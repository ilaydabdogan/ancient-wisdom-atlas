canonical_text:
  quote: ''
  summary: The passage recounts several Alcheringa traditions involving totemic men,
    Churinga, the origins of oknanikilla sites, stones, trees, spirit associations,
    hunting episodes, and deaths that leave sacred or landscape markers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Erlia, a Panunga man of the Kaitish tribe whose name and totem are emu, arises
    at Purnpa in the Alcheringa and goes to Allalgera, where many emu men possess
    many Churinga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emu men do not offer Erlia any Churinga; when they go hunting, he remains
    in camp, searches, and finds a bag of Churinga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tiniokita returns to camp, sees Erlia opening the bag, challenges him for
    stealing Churinga, and Erlia flees with half the store.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Erlia takes the Churinga to Purnpa; after he dies there, they remain behind
    and give rise to an emu oknanikilla.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some of these Churinga are later burnt in a bush fire, and no spirit children
    can come from them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Old Murunda, a Thungalla man of the Kaitish tribe and grass-seed totem, carries
    Churinga, gives one to a young Thungalla of the same totem, names him Arabinia-urungwinnia,
    and instructs him to take and care for Murunda's Churinga after Murunda dies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Murunda dies and goes into the ground; a large stone called Alkarilkara
    arises and represents his abnormally developed organs, and evil magic can emanate
    from it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young Thungalla sleeps at night with his Churinga under his head and searches
    for a place where they will be safe after his death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young Thungalla rejects several places as too close to camp because women
    might see the Churinga, then buries them farther away, forming an oknanikilla.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young Thungalla eventually returns by another track to a tree, goes into
    the ground there, and the tree becomes his nanja tree where his spirit dwells
    and from which it visits the Churinga in the oknanikilla.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: An Umbitjana man of the Atnunga, or rabbit bandicoot, comes from the west,
    smells a strong smell, follows it eastward, and finds Murunda lying on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Umbitjana Atnunga stranger meets Atnunga-urlunda, an old Atnunga man whom
    he calls grandfather because both are Umbitjana and the old man is classed as
    his father's father.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Atnunga-urlunda gives the younger man an Atnunga Churinga and tells him to
    use it to hunt and dig rabbit bandicoots out of their holes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The younger man catches rabbit bandicoots and brings them to Atnunga-urlunda,
    who cooks and eats them and sends him out again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a rabbit bandicoot repeatedly escapes, the younger man angrily throws
    his Churinga after it; the Churinga misses, splits in two, and two stones arise
    to mark the spot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: An Uknaria Atnunga man with a large stomach captures the rabbit bandicoot,
    cuts it up incorrectly, receives instruction from the stranger on the proper cutting
    method, and gives the animal to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The stranger returns to Atnunga-urlunda's camp, tracks the old man to where
    he has crawled, finds him dead, returns to the old camp, and eventually dies there;
    a great gum-tree arises to mark the spot.
  category: sequence
  evidence_refs:
  - ev:7
