canonical_text:
  quote: ''
  summary: The passage describes an Umbaia ceremonial ground for totem-connected ceremonies,
    its separation from the main camp, the arrangement of performers and male audience,
    and the use of a sacred oval red-ochred stone called anjulukuli. The stone is
    held by the first performer and projected outward during a running movement while
    the audience beats boomerangs. The passage states that women and children must
    not see the stone, that its meaning was not known to the narrators, and that it
    was used because ancestors had always used it.
  language: English
  quote_policy: summarized
