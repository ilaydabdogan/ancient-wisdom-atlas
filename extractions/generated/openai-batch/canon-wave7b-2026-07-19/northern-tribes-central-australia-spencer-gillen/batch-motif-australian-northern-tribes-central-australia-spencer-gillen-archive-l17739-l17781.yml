canonical_text:
  quote: ''
  summary: The passage describes northern and central Australian totemic restrictions
    concerning eating the totemic animal or plant. It states that certain Alcheringa
    ancestors are regarded as animal rather than human, that the tribes do not explain
    the current eating restrictions, and that a totemic group member may under certain
    conditions kill but not eat his own totem animal. The passage presents the underlying
    rule as responsibility for maintaining and increasing the totemic animal or plant
    for the general food supply, with reciprocal provisioning among totem groups.
  language: English
  quote_policy: summarized
