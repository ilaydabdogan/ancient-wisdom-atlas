canonical_text:
  quote: ''
  summary: The passage defines Churinga as both a sacred object/name and a special
    quality, then describes ceremonies for the return of borrowed Churinga by an Ulatherka
    Udniringita party. Local men prepare with totemic painting and Udniringa twigs,
    old Alatunjas paint and conceal decorated shields, songs recall ancestral marchings,
    attendance is restricted by social category, women briefly observe from farther
    back, and the Inwura party approaches in single file led by an old Ulatherka Alatunja
    carrying a decorated bundle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that aritna churinga is a sacred or Churinga name, and
    that Churinga can denote both a concrete object and a special quality or attribute.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described ceremonies occur at the return of Churinga that had been lent
    by one group of Udniringita men to another and borrowed years earlier.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A messenger announces that Udniringita men from Ulatherka in the western Macdonnell
    Range, led by their Alatunja, will arrive with the borrowed Churinga.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Local men of the totem and associated Bukhara and Panunga men assemble at
    a secluded place in the range on the route of the approaching Ulatherka party.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men grease and red-ochre their bodies, paint their faces white with a
    red median stripe, paint the sacred Udniringita design below the breast-bone,
    and wear Udniringa twigs on forehead bands and other body places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two old Alatunjas remain undecorated, help decorate the other men, and
    paint Udniringita designs on shields.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: One shield design represents Udniringita in the adult stage and is linked
    to Wungalathina, where ancestors camped in the Alcheringa while marching from
    Untherkurpunda.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ancestor leader of the party is said to be reincarnated in the present
    headman of the Alice Springs group of witchetty grub men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The central circles of a shield design represent a large gum-tree marking
    a spot on the Todd River where the Ulatherka party left a man behind.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: During shield decoration the men sing continuously of the Alcheringa marchings
    of the witchetty grubs; afterward the shields are placed side by side, sung over
    quietly, and hidden with green twigs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Only Purula and Kumara subclass members who also belong to the totemic group
    are allowed to be present at one stage; other Purula and Kumara decorate elsewhere
    with colours and Udniringa twigs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the shield painting, Purula-Kumara are invited, Panunga and Bukhara
    men summon the women, and seating is arranged with women farther back and higher
    on the slope.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Women of the totem and daughters of Udniringita men are painted on the breasts
    with oblique red and white lines, sit in the front row, make a low moaning noise,
    and leave when the strangers approach.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Inwura party advances in single file with exaggerated high-stepping, led
    by the very old Ulatherka Alatunja carrying a decorated bundle extended toward
    the local group.
  category: action
  evidence_refs:
  - ev:11
