canonical_text:
  quote: ''
  summary: The passage describes decorated wooden slabs, head-dresses, bark objects,
    feathers, down, ochre, and hair-string used in totemic ceremonies among several
    Central Australian and northern groups. It explains that particular forms are
    understood to represent yams, a plum-tree, wind, snake, white cockatoo, black
    cockatoo rain associations, clouds, water, plant flowers, a dead wallaby, and
    a dead human body about to be cooked and eaten.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Decorated wooden slabs are identified as used during ceremonies connected
    with the yam totem in the Tjingilli tribe, and discs in the head-dress are said
    to be emblematic of yams.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A plum-tree totem head-dress consists of grass stalks bound with human hair-string,
    alternate red and white down, and owl-feather tufts; during the ceremony it is
    treated as a nurtunja symbolic of a plum-tree and is normally dismantled afterward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two head-dresses are described as worn in a Tjudia, or deaf adder, totemic
    performance connected with a fire ceremony in the Warramunga tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A common wind totem head-dress has a central wavy band of red down said to
    represent wind; the same design can be used in Tjudia ceremonies where it represents
    a snake.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Paper-bark head-dresses are made by folding bark into a cylinder, tying it
    with hair-string, and decorating the front surface with down; the figured examples
    were used in Anula ceremonies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Anula, Mara, and Binbinga tribes sometimes fix decorated wooden slabs
    into head-dresses; in the Arunta tribe Churinga are frequently used for this purpose,
    while coastal-tribe slabs are specially made for the ceremony and not kept afterward.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: One decorated slab was used during a snake totemic ceremony in the Anula tribe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An object carried by the headman of the white-cockatoo totemic group during
    a Warramunga Intichiuma ceremony was supposed to represent a white cockatoo.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Another white-cockatoo object was worn in the head-dress of a Tjingilli performer
    and was supposed to represent the bird’s top knot, with tufts of white cockatoo
    feathers.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: A tuft of red-barred black-cockatoo tail feathers fixed into a southern Arunta
    rain-ceremony head-dress uses white down to represent clouds and red down to represent
    water.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The black-cockatoo feather decoration is worn because, in the Alcheringa,
    the black cockatoo brought rain down from the north.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Similar feather decorations are used in a northern Arunta Irriakura edible-bulb
    totem ceremony, where the down represents the plant’s flowers.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: A semicircular grass-stalk head-dress ornament coated with red ochre and white
    down represents the limp, disjointed body of a dead wallaby.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: A similar larger Arunta white-bat totem object decorated with rings of down
    represented the body of a dead black-fellow about to be cooked and eaten.
  category: object
  evidence_refs:
  - ev:14
