canonical_text:
  quote: ''
  summary: The passage describes scattered local totemic groups, headmen and sacred
    storehouses, Arunta naming practices, Warramunga north-south moiety geography,
    gendered residence patterns, and a formal reception of Walpari visitors in which
    Kingilli men and northern women take active ceremonial roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some totemic groups are described as isolated and scattered across different
    parts of a tribal area; each local group has an alatunja or headman who takes
    charge of the ertnatulunga, the sacred storehouse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta example, a person may identify by tribal name, river name, or
    camp name, while another person may use a directional locality term for the same
    individual; the passage says this directional term is not a tribal name.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Warramunga, the Uluuru moiety is associated with the southern division
    of the tribal territory, while the Kingilli moiety is associated with the northern
    division.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that all members still speak of themselves and others as
    Warramunga rather than by separate northern or southern group names.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a southern camp, males are described as Uluuru; their wives are Kingilli
    from the north; daughters are Uluuru and later move north. In the northern area
    the reverse pattern is described for Kingilli males, Uluuru wives, and Kingilli
    daughters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage links the north-south ancestor separation with the present division
    of totemic groups between Kingilli and Uluuru, and adds that totem descent in
    the Warramunga is mostly paternal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a formal reception of Walpari men, Kingilli northern men among the
    Warramunga took the leading role.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the same reception, women were divided into southern and northern groups;
    southern women stood to the left of the men and northern women to the right.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Northern women were decorated with spots and bands of white pipe-clay, extended
    their arms and moved their hands toward the approaching visitors, joined the final
    dance, and threw food to the visitors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For northern tribes belonging to the Warramunga nation, the authors report
    a sharp division of totems into two groups but no regular names for local tribal
    subdivisions.
  category: relationship
  evidence_refs:
  - ev:7
