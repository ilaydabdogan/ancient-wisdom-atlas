canonical_text:
  quote: ''
  summary: 'The passage presents an ethnographic-historical hypothesis: central Australian
    tribes show notable agreement in customs and beliefs despite divergent languages;
    early intercourse and later segregation are proposed to explain this. The authors
    describe possible northern immigrations into Australia, separation by Bass Strait
    and other waters, limited outside influence, and three migration lines. They also
    note uncertainty about Tasmanian beliefs and initiation ceremonies, and state
    that migrating ancestors brought customs and beliefs that later changed as groups
    moved through the continent.'
  language: English
  quote_policy: summarized
