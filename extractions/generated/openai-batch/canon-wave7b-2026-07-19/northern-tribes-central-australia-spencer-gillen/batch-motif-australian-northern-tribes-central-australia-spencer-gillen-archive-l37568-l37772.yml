canonical_text:
  quote: Wollunqua, Warramunga, a mythical snake.
  summary: Appendix B presents a catalogue of animal totem names arranged under mammals,
    birds, and reptiles. Entries typically name an animal or local term, associate
    it with one or more groups, and often mark whether it is eaten. The reptile section
    includes many snakes, a named mythical snake, and a note that two crocodile species
    give their names to totemic groups and are eaten.
