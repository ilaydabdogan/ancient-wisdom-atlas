canonical_text:
  quote: ''
  summary: The passage describes restrictions on Warramunga medicine men, especially
    younger doctors; the ordeal and bodily alteration of candidates; insertion of
    a snake and a kupitja object associated with ancestral snakes; use of the kupitja
    in healing; and rules and privileges attached to a class of medicine men called
    Urkutu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young doctors are forbidden to eat listed animals and seeds, may drink only
    moderate water, and risk loss of medical powers, severe illness, and probably
    death if they break the restrictions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young doctors must bring the restricted foods to old doctors; failure makes
    them liable to severe illness, and the old doctors, especially the one who made
    them medicine men, can kill them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Candidates being made into medicine men are not allowed rest, food, or water,
    and must stand or walk until exhausted and dazed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the dazed state called ungalinni, the candidates have their sides cut open,
    their internal organs removed, and a new set supplied.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A snake called Irman is put into the candidate’s head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A kupitja, said to have been made by snakes in the Alcheringa, is put through
    the hole in the nasal septum.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kupitja is described as mysterious, magical, and not something a young
    medicine man would investigate after receiving it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In serious illness, the kupitja may be projected into the patient’s body to
    counteract the illness-causing influence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old Worgaia doctor used a kupitja to drive out a dead man’s bone that was
    said to be causing a Tjunguri man’s illness.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: A hair-girdle was tied tightly around the patient after the bone had been
    forced below the waist, in order to keep it from returning upward into the chest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: This set of medicine men is called Urkutu, identified in the passage as the
    general term for snakes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: One medicine man lost his powers after striking an older tribal father, who
    was also a doctor, with a boomerang during a fight.
  category: sequence
  evidence_refs:
  - ev:7
