canonical_text:
  quote: ''
  summary: The passage describes ceremonial occasions in which ordinary marital and
    avoidance rules are temporarily set aside. It gives a general account of women
    being assigned to attend ceremonies, an Arunta example involving a son-in-law,
    a normally avoided woman, decorating materials, red ochre, and ritual efficacy,
    and Warramunga examples during sacred Wollunqua snake-totem ceremonies in which
    men lend, exchange, offer, accept, or refuse women according to moiety and kin
    relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At certain ceremonies with many people gathered, ordinary marital rules are
    described as being more or less set aside for the time being.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some tribes, one or more women are assigned each day to attend at the corrobboree
    ground, and men except specified close kin have access to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are described as staying close to an ordinary corrobboree ground, while
    in sacred ceremonies they are generally brought up in the evening.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Arunta example, an elder man tells his son-in-law to go into the bush
    with the elder man’s unawa and bring ordinary corrobboree decorating material.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The younger man goes with a woman described as his mura, a relation to whom
    he ordinarily may not go near or speak, and marital relations occur on this occasion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man returns carrying down, the woman returns carrying green twigs, and
    these materials are to be worn by men dancing in the evening.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women who have spent the day with the men are painted with red ochre and go
    to summon other women and children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the intercourse is thought to assist the proper performance
    of the ceremony, make things work smoothly, and prevent decorations from falling
    off.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among the Warramunga, the lending of women is described as frequent during
    sacred ceremonies, and sometimes as general and sometimes restricted by moiety.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During a sacred Wollunqua big-snake totem ceremony, two Thapungarti men bring
    their wives after dark, place them out of sight in nearby scrub, exchange wives,
    and one leads a Tjapeltjeri man to his wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Thapungarti men invite Tjambin men to go to the women, but the Tjambin
    men refuse; the passage identifies the invited men as brothers, by blood and tribal
    category, of the women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: An old Tjapeltjeri man, identified as head of the totem, brings one of his
    wives, leads a Tjupila man of the Worgaia tribe to her, and later receives an
    embrace from him before rubbing his arms and legs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old Tjapeltjeri man later takes a Thungalla man to the woman and invites
    Tjupila and Thakomara men, identified as tribal fathers and tribal brothers of
    the woman; they decline while he attempts to lift each man up.
  category: sequence
  evidence_refs:
  - ev:8
