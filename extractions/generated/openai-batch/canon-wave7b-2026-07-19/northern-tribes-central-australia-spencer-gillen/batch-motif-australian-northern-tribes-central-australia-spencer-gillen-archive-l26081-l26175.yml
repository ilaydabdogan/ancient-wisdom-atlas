canonical_text:
  quote: ''
  summary: 'The passage describes a mortuary sequence for a dead man: food is collected
    and given to visiting strangers; men sing totemic songs; a purnka brings a hollow
    log painted with the dead man''s totem; decorated men perform around the bones;
    the bones are sealed in the log and taken to a cleared place where women mourn
    and cut themselves; food is placed around the log and redistributed; the log is
    set in a tree by a water-hole under restrictions; a decorated arm-bone is used
    to mandate and empower vengeance; and the dead man''s spirit returns to its mungai
    spot and later reincarnates.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead man's mother and other lubras collect honey-bags and lily roots;
    the father and sons carry some food to the strangers and say more will be given
    after corrobborees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The day and night are spent on the corrobboree ground, where local men sing
    sacred songs connected with the dead man's totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Early the next morning the dead man's purnka brings a hollow log called lalanga,
    painted with a design of the dead man's totem, and places it on a cleared space.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tribal fathers and tribal sons of the dead man are painted with totemic designs,
    and newly initiated youths are brought onto the ground and placed near the parcel
    of bones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When it is dark, the purnka sets the hollow log upright near the father and
    the wrapped bones while the strangers sit to one side.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Decorated men are led forward one by one; they move in a sinuous line, with
    boomerangs beaten, paper-bark wands under the arms, body shaking, singing, and
    a tumble at the end.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The paper-bark wands are piled near the hollow log, and the decorated men
    join hands and dance in a circle around the bones and seated men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before dawn the father gives the parcel of bones to the eldest purnka, who
    puts them in the log, seals both ends with paper bark, and ties strips around
    it so that the design cannot be seen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The party carries the log toward the father's camp with shouting, while one
    man walks in front beating bushes together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women carrying kangaroo bones stand aside, then come to the log, weep and
    wail over it, and cut themselves with the kangaroo bones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father and son place food around the log and a large honey-comb on top;
    purnka later carry away the food for strangers and eat the honey-comb themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The purnka place the log in the boughs of a tree by a water-hole, preferably
    overhanging the water; only they may eat lilies from that pool for about three
    wet seasons, and women are not allowed near it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bones remain in the log until the log rots and the bones fall into the
    water, or until a flood carries them away and buries them in a river bed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The father places the decorated arm-bone of his son under the arm of every
    man and tells them to kill the man who killed his son; one purnka keeps it and
    must organize an avenging party.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The avenging purnka ties the arm-bone near the stone head of his spear; after
    the killing, he returns the blood-stained spear to the father, receives weapons,
    and the arm-bone is buried near the decorated log.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the burial rites, the spirit called kutula returns to its own mungai
    spot, walks about, may be seen by other natives, and eventually undergoes reincarnation.
  category: sequence
  evidence_refs:
  - ev:8
