  text: After the subincision, the boy receives a sacred stick or bullroarer called
    mura-mura and is told it was first made by the whirlwind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mura-mura is described as tabooed and not to be shown to women or children;
    women and children are said to think its roaring is the voice of Gnabaia, who
    has come to swallow the boy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy is taken into the bush by an elder brother and kept there until rain
    has fallen and cool weather comes; he later returns to camp with men from other
