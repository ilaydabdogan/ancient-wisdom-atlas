canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of initiation-related rites: subincision
    of a Tjulantjuka boy, presentation and taboo instruction concerning a sacred bullroarer,
    a period of seclusion, preparation of holes and a decorated pole for whirlwind-totem
    ceremonies, deposition of the bullroarer, and the conferral of a special name
    on young men who witness the final ceremony. It also notes a limited resemblance
    to the Arunta Engwura ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The subincision ceremony is placed after ceremonies connected with the dead
    man's totem and final burial rites for the dead man's bones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tjulantjuka boy is subincised by a Yakomari man.
  category: action
  evidence_refs:
