  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The skull is smashed with a tomahawk by the Tjambin man while the two Thapungarti
    men watch silently.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Most of the bones are placed inside a hollow cavity in an ant-hill, the bark
    dish is set above them, and the top of the ant-hill is replaced.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The elder Thapungarti wraps the arm-bone in paper bark with fur-string, decorates
