canonical_text:
  quote: ''
  summary: The passage describes Warramunga mourning and final mortuary ceremonies.
    A dead person's spirit remains near the tree grave and must consent before mourning
    ends. In one observed case, men retrieve a dead woman's bones from a tree platform
    without touching them directly, smash the skull, place most bones in an ant-hill,
    wrap one arm-bone into a decorated parcel called biirumburu, and later return
    toward camp with the concealed bone while men, women, and children wait silently
    in ceremonial arrangement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After earlier ceremonies, the tree grave is left undisturbed for at least
    a year and sometimes longer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit of the dead person is called ungwulatiy and is said to hover about
    the tree, visit the camp, watch widows' mourning, and sometimes make a low whistling
    sound.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A brother asks the spirit whether he should go away; repeated questioning
    may occur before the spirit indicates that mourning should end.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the spirit's consent is gained, the brother returns to camp and tells
    the dead man's father-in-law, who arranges the final ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states a Warramunga belief that the sex of an individual alternates
    at each reincarnation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A party goes before sunrise to the tree grave of a Tjunguri woman who had
    been placed on a tree platform a year earlier.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead woman's father gives a ball of fur-string to the elder Thapungarti
    man as the party leaves camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tjambin man cuts a bark dish from a nearby gum-tree and climbs onto the
    tree platform.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tjambin man rakes the bones down with a stick so as to avoid touching
    them directly.
  category: action
  evidence_refs:
  - ev:5
