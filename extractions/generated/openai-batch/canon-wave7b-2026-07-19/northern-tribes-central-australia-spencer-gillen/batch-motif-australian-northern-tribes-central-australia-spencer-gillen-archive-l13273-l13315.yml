  summary: The passage describes variant concluding actions in Kingilli-related ceremonies
    among Arunta, Kaitish, Unmatjera, and Warramunga groups, then gives a detailed
    account of a Warramunga close in which an Uluuru man knocks off a performer's
    head-dress or helmet. It also contrasts Uluuru performances, where performers
    may circle green boughs and sit on them while the audience sings and beats clubs
    and boomerangs. A figure caption identifies a Wind Totem ceremony in which men
    shake themselves in imitation of ancestors.
  language: English
