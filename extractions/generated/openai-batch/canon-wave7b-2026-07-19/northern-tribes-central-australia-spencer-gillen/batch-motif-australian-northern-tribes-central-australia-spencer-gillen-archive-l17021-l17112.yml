canonical_text:
  quote: ''
  summary: 'The passage describes several Intichiuma or allied increase practices:
    totem headmen are asked to perform ceremonies for ants, carpet snakes, honey or
    sugar-bag, and other beings; the performer may refuse to eat the increased animal
    or food and direct others to consume it. It notes that Warramunga and allied tribes
    generally lack the more elaborate magical Intichiuma ceremonies found among Arunta
    and Kaitish groups, but records a white cockatoo ceremony in which a headman and
    his son imitate the bird''s cry all night while holding a representation of it.
    It also describes euro stones near Thapauerlu, a tradition of a wild dog killing
    a euro, and old men rubbing red-ochred stones to increase euros. Finally, it records
    Manguntupu, a Nambin woman of the Mungaritji lizard totem, who sings lizards to
    make them fat.'
  language: English
  quote_policy: summarized
