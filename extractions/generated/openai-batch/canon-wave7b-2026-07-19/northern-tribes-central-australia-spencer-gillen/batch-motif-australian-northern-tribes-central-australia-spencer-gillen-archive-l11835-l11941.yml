canonical_text:
  quote: "“the spirit is supposed to return to its mungai spot, and finally it undergoes
    reincarnation.”"
  summary: The passage describes a Warramunga final burial rite involving an arm-bone,
    totemic ground designs, a trench, crawling women, men decorated with totemic designs,
    breaking and burial of the bone, and the deceased spirit’s return and reincarnation.
    It then summarizes Umbaia and Gnanji totemic organization, paternal-leaning descent,
    spirit-conception beliefs, totemic ancestors who shaped the landscape and left
    spirit individuals, and a distinctive Gnanji belief that women have no spirit
    part and female spirit-children do not reincarnate.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In certain southern Warramunga totemic groups, a concluding burial ceremony
    may occur twelve months or more after the body has first been placed on a platform
    of boughs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bones are taken down and buried in the ground except for one arm-bone,
    which is wrapped in bark and furstring; emu feathers are added for a woman and
    owl feathers for a man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The final rite occurs near the close of a long series of totemic ceremonies
    in which designs emblematic of a totem are drawn on the ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In two witnessed cases, the ground drawings referred to snake totems associated
    with the moiety of the dead person.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small pit is dug beside the totemic design; decorated men stand straddle-legged
    across a trench, and women pass along the trench on hands and knees beneath the
    men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The last woman carries the wrapped bone; it is snatched from her, broken with
    a stone axe, thrust into the ground beside the totemic design, and covered with
    a small flat stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the ceremony, the spirit is said to return to its mungai spot and finally
    to undergo reincarnation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Umbaia and Gnanji, totems are strictly divided between two moieties,
    marriage to a woman of the same totem is forbidden, and children almost always
    follow the father’s totem.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage gives examples in which men, their fathers, fathers’ fathers,
    siblings, and children share snake, wallaby, or kangaroo totems; it also says
    eating restrictions are the same as in the Warramunga and Tjingilli.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Gnanji believe that some spirit individuals belonging to a man’s totem
    follow him when he travels into country not associated with his own totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: At two Gnanji water-holes associated with goshawk and bee, trees and stones
    on the banks are said to be full of bee and goshawk spirits.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the snake-man example, the wife of a snake man is said not to conceive
    a bee or goshawk child at that place; conception there would mean a snake spirit
    had followed the father and gone inside the woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Each totemic group is said to originate as offspring of an ancestral eponymous
    creature who walked about making ranges, creeks, water-holes, and other natural
    features.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Where the ancestral creature performed sacred ceremonies, it left behind spirit
    individuals that emanated from its body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Gnanji are reported to hold that a woman has no moidna or spirit part,
    and that female spirit-children exist but never undergo reincarnation.
  category: attribute
  evidence_refs:
  - ev:7
