canonical_text:
  quote: ''
  summary: 'The passage introduces a chapter on names and naming, then describes Arunta
    individual names: each person has a commonly used personal name, often derived
    from a birthplace or local place, an ancestral/totemic place, or an animal or
    plant name associated with a totem. It also states that the Arunta personal name
    is given by a male relative, usually the father or paternal grandfather. The chapter
    synopsis mentions ordinary and sacred names in several neighboring groups and
    notes that Warramunga sacred names are given only when a man is fully initiated.'
  language: English
  quote_policy: summarized
