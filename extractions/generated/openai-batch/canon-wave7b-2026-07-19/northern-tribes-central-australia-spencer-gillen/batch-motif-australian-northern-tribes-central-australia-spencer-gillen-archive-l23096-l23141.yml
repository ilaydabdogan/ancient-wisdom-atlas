canonical_text:
  quote: ''
  summary: The passage describes forms of evil magic in which a substance or powder
    causes illness and death. It then describes mauia or maringilitha, associated
    with small stones obtained by Worgaia and Gnanji people and traded south. The
    powder may be put on a spear tip or carried on bark between the toes and secretly
    dropped on a sleeping victim. Among the Gnanji, the practitioner returns to camp
    and burns the paper bark wrapper; the burning is said to make death more certain
    and indicate whether death will be slow or rapid. A Warramunga tradition attributes
    the introduction of mania to an old Pittongu bat man travelling north from the
    Murchison Ranges with other objects.
  language: English
  quote_policy: summarized
literal_observations:
