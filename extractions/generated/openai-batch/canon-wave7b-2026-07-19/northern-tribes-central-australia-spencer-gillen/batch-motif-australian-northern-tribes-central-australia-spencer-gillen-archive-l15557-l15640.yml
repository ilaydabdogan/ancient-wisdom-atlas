canonical_text:
  quote: ''
  summary: 'The passage describes Kaitish uses and custody of Churinga: their association
    with clouds and rainbow, their use with a child-stone to cause a child spirit
    to enter a woman, their keeping in a totemic storehouse, successor rites of mourning
    and ochre-greasing, their use in a grass-seed Intichiuma rite, their transfer
    as gifts to younger men in connection with a kangaroo presentation, and an incomplete
    tradition about two Alcheringa men named Tumana who arose from Churinga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some objects spoken of as Churinga are said to be the source from which clouds
    and the rainbow came.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Kaitish man can take a Churinga to a special child-stone, rub the stone
    with it, and ask the child spirit to go into a woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Arunta have a similar belief in stones inhabited by children,
    but that the Arunta do not use the Churinga in this rite as the Kaitish do.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Churinga are normally held by a man of the relevant totem, but may pass temporarily
    to a man of another totem if the local group becomes extinct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the grass-seed example, an opossum-totem younger brother is expected to
    care for the grass-seed storehouse and its contents until a grass-seed man arises.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the death of a totem headman, the successor goes to the storehouse, mourns
    over the Churinga, rubs them with grease and red ochre, rubs his own body with
    ochre, examines the Churinga, replaces them, and later checks the storehouse;
    women and children avoid the place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the grass-seed Intichiuma ceremony, the headman clears the ground, takes
    out Churinga, reddens and decorates them with down, sings words said to have no
    present meaning, and rubs the Churinga together so the down flies off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The down flying from the Churinga is said to carry virtue from them by which
    grass seed is made to grow.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old man may give Churinga to younger men outside his own totem, though
    the stated purpose is unclear and is distinguished from an Arunta idea about aiding
    the capture of the totem animal.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Thungalla grass-seed man gave two Churinga to a Panunga man and an Appungerta
    man, who hunted a kangaroo as a present for him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two younger men placed the Churinga on the kangaroo, handed the animal
    to the Thungalla man, and received the Churinga back after he rubbed them on his
    stomach.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the hunt the men kept the Churinga at a safe distance because they
    feared the Churinga might frighten the animal and prevent them from killing it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage begins a tradition about two Alcheringa men named Tumana, a term
    for the roaring noise made by Churinga; the two men are said to have arisen from
    Churinga.
  category: relationship
  evidence_refs:
  - ev:8
