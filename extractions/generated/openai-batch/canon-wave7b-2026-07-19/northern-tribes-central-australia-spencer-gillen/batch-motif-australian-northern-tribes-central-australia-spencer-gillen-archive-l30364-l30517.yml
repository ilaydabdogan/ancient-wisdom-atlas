canonical_text:
  quote: ''
  summary: The passage classifies several spear types and related implements among
    northern and central Australian groups. It notes ceremonial long-barbed spears
    valued for display and maker skill, stone- and slate-headed spear forms, traded
    opalescent quartzite spear heads used for magic, belief in fatal charmed wounds
    requiring counter-magic, small fishing spears, and bone gouges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some barbed spears are described as used in an apparently unfinished state,
    with barbs not fully separated and a longer terminal point than usual.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Very long-barbed spears may be of no actual use as weapons and are reserved
    for ceremonial display.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Such long-barbed spears are carried during ceremonial dances and valued as
    signs of the maker's superior skill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A multi-pronged spear type has two or three multi-barbed prongs attached to
    a light reed shaft by resin, sinew, or both.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several spear types use hard heads or points, including quartzite, slate,
    opalescent quartzite, and a wooden head shaped like a stone head.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:6
  text: The opalescent quartzite spear type is manufactured in the far north and north-west
    and traded southward and eastward.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Spears of the opalescent quartzite type, and detached heads from them, are
    used for magical purposes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One spear head in the possession of an Ilpirra man was believed to have been
    endowed with evil magic by its original owner.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that even a slight wound from a charmed spear was believed
    to be fatal, and that strong counter-magic was the only possible cure.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the time described, the head of this magical spear type was often made
    from chipped glass, bottle fragments, or a broken telegraph insulator.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A small hand-thrown spear is described as used principally for spearing fish
    and is not thrown with a spear-thrower.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bone gouges are made by splitting a strong bone, such as a kangaroo femur,
    and grinding down one or both parts.
  category: object
  evidence_refs:
  - ev:8
