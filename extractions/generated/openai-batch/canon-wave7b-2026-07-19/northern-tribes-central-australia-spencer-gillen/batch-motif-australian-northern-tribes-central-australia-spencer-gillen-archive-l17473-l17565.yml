canonical_text:
  quote: ''
  summary: The passage discusses Arunta and Kaitish traditions concerning eating a
    totemic animal or plant. It gives examples of ancestral beings changing totemic
    identity, eating their own totemic foods, using a Churinga to hunt a totemic animal,
    and producing landscape features from mythic events. It also records rare traditions
    that explain or reflect abstinence from eating the totem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that some traditions appear to refer to a time when customs
    about eating the totemic object differed from present practice.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an Arunta tradition, wild-cat men entered the earth at a spot, later arose
    as plum-tree men, and then fed on plums during their travels.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another Arunta tradition, a bandicoot woman performed a sacred bandicoot
    ceremony, painted a Hakea woman with ceremonial down, changed her into a bandicoot
    woman, and the changed woman later ate bandicoot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that Arunta traditions about Alcheringa ancestors describe
    a time when the present taboo on eating the totem did not exist and eating the
    totemic animal or plant was normal.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that in the Kaitish tribe eating the totemic object is performed
    as a sacred ceremony connected with Intichiuma, and that Kaitish traditions are
    closely similar to Arunta traditions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Kaitish emu man came from the west to a place where other emu men were eating
    emu; when he asked for some, they killed him and broke his back, and Central Mount
    Stuart arose to mark the place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yelka women walked about digging up and eating yelka; the husks they discarded
    became a heap represented by the hill called Pulina.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old Atnunga man gave a young Atnunga man an Atnunga Churinga and told him
    to hunt and dig out atnunga with it; the young man brought back animals, which
    the old man cooked and ate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: An old grass-seed man wandered, then sat at the place where he died and spent
    his time gathering and eating grass seed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Kaitish grass-seed man named Murunda gave grass seed to another man of the
    same totem and name and instructed that, after his death, the grass should be
    given to men of the other moiety and other totemic groups.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: After old Murunda died, the younger man told other men to gather grass seed,
    show it to him first, and then eat it; he feared that if he ate too much he would
    swell up.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Two Idnimita men, Kumara and Purula, arose at Intiara; after eating grubs
    as usual, the Kumara man wondered whether eating more grubs might cause all the
    grubs to die.
  category: sequence
  evidence_refs:
  - ev:10
