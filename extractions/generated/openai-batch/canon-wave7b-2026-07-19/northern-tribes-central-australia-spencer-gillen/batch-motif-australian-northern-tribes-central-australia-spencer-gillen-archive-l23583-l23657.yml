  quote: ''
  summary: The passage describes medicine men in several central Australian tribes
    as curative specialists whose bodies contain stones or other objects placed there
    by spirit individuals. Their work is to remove concrete forms of evil magic from
    patients. It contrasts this with Central Queensland accounts of lethal boning
    implements and gives Ilpailurkna's account of being made a medicine man through
    atnongara stones, killing, evisceration, and further insertion of stones.
  language: English
