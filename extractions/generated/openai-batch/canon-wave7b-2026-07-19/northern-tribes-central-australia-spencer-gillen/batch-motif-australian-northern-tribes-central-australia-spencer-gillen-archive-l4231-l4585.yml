  summary: The passage describes marriage and descent rules for named subclasses,
    explains how four-subclass systems are represented in relation to eight-subclass
    systems, notes betrothal and avoidance practices in several tribes, and begins
    tabulating relationship terms for the Warramunga and Worgaia tribes.
  language: English
