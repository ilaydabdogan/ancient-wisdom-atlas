- id: obs:2
  text: In the Mara and Anula tribes, which are described as having four subclasses,
    names are repeated in the tables to indicate equivalences with subdivisions in
    an eight-subclass comparison.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The genealogical tables for Warramunga and Mara are said to show subclass
    descent and relationship terms applied by a man to different individuals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The relationship-term lists are organized into native terms, English equivalents,
    and English terms included wholly or partly in the native term.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note says that, in the Mara tribe, the father of a woman communicates a
    proposed marriage through another man, associated with avoidance between son-in-law
    and father-in-law.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A note says that, in the Binbinga tribe, a father gives a woman away by calling
