- id: obs:3
  text: The Arunta and Urabunna are presented as typifying two distinct tribal series,
    differing especially in paternal versus maternal reckoning of descent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the northern Urabunna example, totems belong exclusively to moieties; a
    dingo Matthurie man marries a water-hen Kirarawa woman, and their children follow
    the mother as water-hens.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For the Arunta and tribes northward to the gulf, class descent is described
    as paternal, while totem descent changes northward from no necessary child-parent
    relationship to strict paternal descent in Binbinga, Anula, and Mara tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: An Arunta example gives a little-hawk man with wives of rat, kangaroo, and
    lizard totems and daughters identified as witchetty grub, emu, and water.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Binbinga example gives a snake father, a snake paternal grandfather, wives
    of big-lizard and emu totems, and sons and daughters all identified as snakes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that every tribe has a firm belief in the reincarnation
