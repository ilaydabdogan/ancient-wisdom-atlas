canonical_text:
  quote: ''
  summary: The passage opens a chapter on totems and compares totemic descent systems
    among central, southern-central, and northern Australian tribes. It contrasts
    Urabunna maternal descent with Arunta paternal class descent and variable totem
    affiliation, gives family examples from Arunta and Binbinga, and states that all
    tribes discussed hold a firm belief in the reincarnation of ancestors.
  language: English
  quote_policy: summarized
