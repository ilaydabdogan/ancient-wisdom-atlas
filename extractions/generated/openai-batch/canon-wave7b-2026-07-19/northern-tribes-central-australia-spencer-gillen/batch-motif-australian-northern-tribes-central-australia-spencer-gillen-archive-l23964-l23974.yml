  quote: ''
  summary: The passage describes a male ritual specialist as more like a wizard or
    sorcerer than a doctor, because his power is said to involve giving “bones” rather
    than removing evil magic. It also notes that special incantations are sung to
    expel or prevent evil magic, and that in serious cases a medicine man from a friendly
    neighbouring tribe may be called; Kurkutji, a Binbinga man, is often requested
    by the Anula.
