canonical_text:
  quote: ''
  summary: The passage reports Gnanji beliefs about totemic ancestor spirits following
    a man and entering women of certain other totems, food restrictions tied to a
    person's own, father's, and mother's totems, and Binbinga, Mara, and Anula rules
    about moiety-linked totems, marriage prohibitions, patrilineal child totems, food
    taboos, and mortuary burial of bones in totem-decorated log coffins, with a comparison
    to a Warramunga arm-bone burial beside a totemic design.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Gnanji tribe, some spirits of totemic ancestors, or of ancestors of
    the local group, are said to follow a man as he travels from place to place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Gnanji account, only spirits of certain totems are said to go into
    women of certain other totems.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Gnanji individual is described as not eating his own totem or his father's
    totem, and as eating only sparingly of his mother's totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Binbinga, Mara, and Anula tribes, totems are described as strictly
    divided between moieties or classes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Binbinga, Mara, and Anula tribes, a man is forbidden to marry a woman
    of his own totem.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Binbinga, Mara, and Anula tribes, children's totems are said to follow
    the father's totem very strictly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Binbinga, Mara, and Anula tribes, eating a man's own totem, and usually
    his mother's totem, is forbidden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Binbinga, Mara, and Anula tribes, a dead person's bones are finally
    buried in a log coffin decorated with a design of that person's totem.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Among the Warramunga, in certain cases, an arm-bone is buried in the ground
    beside a totemic design.
  category: action
  evidence_refs:
  - ev:7
