canonical_text:
  quote: "“symbolic of the giving of fire by the Uluuru to the Kingilli”"
  summary: The passage describes a Warramunga Wonna or cold ceremony and its sequel
    involving the Miniurka object. Kingilli men represent cold beings huddling for
    warmth, while Uluuru men make, carry, guard, and display the Miniurka, an object
    associated with giving fire and warmth to the Kingilli. A note adds that the Miniurka
    is also called Burumhuru, a name connected with a stone column and an Alcheringa
    transformation of a grub into a white cockatoo, though the connection to fire
    is said to be unclear.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The ceremony is said to be symbolic of Uluuru giving fire to Kingilli, who
    previously had no means of warming themselves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Warramunga, Wonna signifies cold and is applied to the cool of early
    morning or evening after sunset.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The performers were exclusively Kingilli men from named groups or sections:
    Tjupila, Thungalla, Thakomara, and Tjambin.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men carried tjintilli, did not wear characteristic totemic designs, and
    had the upper body daubed with red ochre and the lower body with charcoal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Wonna ceremony, usually about six men ran round an Uluuru man and finally
    fell down, representing cold creatures huddling together for warmth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the Wonna series, Uluuru men spent a whole day making the Miniurka,
    which is described as associated with giving fire and warmth to Kingilli men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Miniurka was a torpedo-shaped object about twelve feet long and three
    feet in greatest diameter, tapering at both ends.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Miniurka consisted of about forty tjintilli wrapped in paper bark and
    tied with yards of human hair-string.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Miniurka was made in the scrub and carried after nightfall to a cleared
    space near the ceremonial ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: When lifting and depositing the Miniurka, the Uluuru men shouted “Wu ! wu
    !”.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Uluuru men spent the night clanging boomerangs and singing loudly near
    the Miniurka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: During the important ceremony an interchange of women took place, limited
    on this occasion to the Uluuru moiety.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Kingilli men left their camps, spent the night in the bed of a nearby creek,
    and were summoned to the ceremonial ground at dawn.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:14
  text: At dawn the Kingilli men came in a body led by an old Tjupila man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Behind the Miniurka, Uluuru men struck clubs, sang, waved their arms, pointed
    to the Miniurka, and beckoned the Kingilli men forward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Kingilli men acted surprised by opening their eyes wide, extending their
    arms, and bending their bodies backward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: The old Tjupila man approached first, pranced, pretended unsuccessfully to
    lift one end of the Miniurka, then stroked the object with eagle-hawk feathers
    given by an Uluuru man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: An old Thungalla man then came up and tried to lift the object without being
    able to do so.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: A note says the Miniurka is also called Burumhuru, a name also given to a
    stone column in Phillips Creek connected with an Alcheringa event in which a grub
    changed its skin and became a white cockatoo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:20
  text: The authors state that they could not understand what the Burumhuru stone-column
    tradition had to do with giving fire and that native explanations on this matter
    were hazy.
  category: other
  evidence_refs:
  - ev:6
