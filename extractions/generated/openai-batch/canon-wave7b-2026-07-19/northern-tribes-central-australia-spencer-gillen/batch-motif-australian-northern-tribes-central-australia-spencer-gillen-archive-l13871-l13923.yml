canonical_text:
  quote: ''
  summary: The passage describes an Ulanji snake-totem ceremony of the Anula tribe,
    including decorated male performers and a bull-roarer warning women and children
    away. It then recounts a narrative in which the snake Roumburia performs ceremonies
    at Marawa, meets an Urtalia kangaroo man, and is offered the kangaroo man's daughter
    after saying he has no lubra. The passage generalizes that similar sacred ceremonies
    associated with totemic ancestors are performed by initiated members across many
    Australian tribes, and cites Collins's early account of initiation ceremonies
    involving animal imitation and grass animal forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ceremony of the Ulanji, described as a snake totem of the Anula tribe, is
    associated with Karrimurra.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three performers are decorated with red and white down designs, dance in from
    behind a bush with a high-knee action, sit down, and the ceremony ends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the ceremony, a man swings a bull-roarer to warn off women and children
    who are in camps about half a mile from the ceremonial ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The snake is reported to have come to Marawa, stayed there for a time, and
    performed ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Marawa the snake meets a kangaroo man identified as an Urtalia, who has
    come because he heard the snake performing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The kangaroo asks the snake what he is, and the snake replies that he is Roumburia.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The kangaroo asks where the snake is going and whether he has a lubra; after
    the snake says no, the kangaroo says he will give the snake his daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The kangaroo later goes on to the country of the salt water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage states that sacred ceremonies associated with totemic ancestors
    are performed by initiated members of various tribes across central Australia
    and toward the west coast of the Gulf of Carpentaria.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: Collins is cited as describing ceremonies shown to youths being initiated,
    including performers running on hands and feet and imitating country dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Collins is also cited as describing a person carrying a grass kangaroo, another
    carrying brushwood, and men with grass tails imitating a herd of kangaroos while
    one man beats time with a club on a shield.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
