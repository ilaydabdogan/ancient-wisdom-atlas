canonical_text:
  quote: ''
  summary: Two cat brothers travel through named places carrying sacred stone knives,
    making ceremonial objects, cutting ground to form creeks and water sources, encountering
    other beings, teaching or instituting the use of stone knives in initiation, leaving
    spirit children in trees, making hills, performing subincision, and finally being
    taken down into the earth by a snake at a water-hole marked by a stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a native well at Nargai the travelers saw a Kurdaitcha, were frightened,
    made a detour, and were not seen by it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers whistled while traveling, tied up their hair, concealed stone
    knives in it, made sacred sticks called thahurla, painted their bodies, performed
    ceremonies, decorated their knives, and made paper-bark sheaths.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: They cut the ground to make a creek before reaching a place where children,
    men, and women were crying for water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother cut the ground with his stone knife but failed to produce
    water; the younger brother cut the ground with his left hand, and a great stream
    flowed out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A big snake came out with the water, stood with its head reaching into the
    sky, and ate everyone except the two cats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder brother carried the younger man on his shoulders so that he could
    see the country ahead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The brothers noticed that the spots on their bodies, formerly like a native
    cat's, had become very small.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The brothers discussed making fire; the younger proposed rubbing two sticks
    together, and the elder instead directed that two sticks be twirled one on the
    other.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The elder brother told the younger always to carry a firestick, and the younger
    burned his fingers when picking it up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: At an initiation camp the men could not perform an operation with a fire-stick;
    the elder brother proposed using knives, and the younger brother performed the
    operation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the operation, the men embraced the younger brother, praised him, said
    they would always use stone knives, and named the country Minen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The younger brother again produced a stream by cutting the ground with his
    left hand after the elder failed, and the travelers continued making creeks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: They saw two witchetty-grub men without speaking to them, camped by a big
    wattle tree, scooped out a water-hole, placed trees around it, left spirit children
    in trees, and carried sacred stone knives on their heads.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: They painted themselves with red ochre, changed to a lighter colour, and made
    two parallel ranges of hills.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Thaupalankitji the elder brother was tired because the knives were too
    heavy, so the brothers made ceremonies, lay down, slept, and waited four days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The elder brother performed subincision and told the younger brother to do
    the same; they spread leaves, let blood flow onto them, and laid their sacred
    knives on the leaves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the subincision ceremony the brothers felt sorry, cried for their own
    country, and then continued traveling while bleeding.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:18
  text: At Baringara the elder brother entered a water-hole, warned that a snake had
    almost swallowed him, and when the younger entered the snake coiled around both
    brothers and took them down into the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: A stone arose in the water-hole to mark the place, which is identified as
    a wild-cat oknanikilla.
  category: object
  evidence_refs:
  - ev:8
