canonical_text:
  quote: ''
  summary: The passage describes methods for hafting stone picks, knives, and spear-heads;
    regional differences in chipping; practical uses for cutting flesh; and the use
    of stone knives in fights, mourning, initiation, circumcision, subincision, ariltha
    kuma, and subsequent cleaning of blood from the blades.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One hafting method uses a straight wooden piece, slit at the broad end so
    the stone can be inserted, then covered with resin or beeswax and red ochre.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another hafting method uses a split stem heated over slow charcoal fire until
    pliant, bent around the stone, tied with string or hair, and fixed with resin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Stone spear-heads are hafted by fixing the stone in a lump of resin, often
    strengthened by string wound around the soft resin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that chipping is slight among some southern tribes, crude
    among the Warramunga and Tjingilli, and more expert farther north and northwest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Flaked stones are described as unsuitable for cutting hard wood and mainly
    useful for cutting flesh.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The knives are used to cut the skin and flesh of animals such as wallaby,
    kangaroo, and emu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The knives are used during fights and ceremonies connected with mourning and
    initiation, producing many bodily scars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In fights, two men may stand with arms around one another and cut into each
    other’s backs and thighs with stone knives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Warramunga burial ceremonies, men in a certain relationship to a dead man
    are required to cut their thighs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage names circumcision, subincision, and ariltha kuma performed upon
    women as rites during which the knives are used.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Used knives may appear clean because blood does not attach easily to quartzite
    and because each knife is cleaned after use.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sometimes blood is removed from the knife by the mouth of a special individual;
    in other cases it is washed off.
  category: action
  evidence_refs:
  - ev:8
