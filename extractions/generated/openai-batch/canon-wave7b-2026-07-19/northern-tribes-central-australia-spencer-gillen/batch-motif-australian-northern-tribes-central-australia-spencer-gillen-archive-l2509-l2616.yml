canonical_text:
  quote: The normal descent of the headship of the totemic group is from father to
    son.
  summary: The passage describes the office of totemic headman across several Central
    Australian and coastal groups, including hereditary succession, ritual duties
    connected with intichiuma, custody of sacred objects in some groups, the reduced
    ritual role of coastal headmen, instruction of future successors, informal elder
    councils, and council-arranged punishments for serious offenses.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that headship of a totemic group normally descends from
    father to son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta, Unmatjera, Kaitish, Ilpirra, and Iliaura tribes, the totemic
    headman is described as leading intichiuma ceremonies and keeping charge of the
    sacred storehouse where churinga are hidden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Warramunga group of tribes, the passage reports no equivalent of the
    ertnatulunga; the headman and other men of the totem perform sacred ceremonies
    that serve as intichiuma, with the headman less prominent than in southern tribes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In coastal tribes such as the Binbinga, where the headman is called mingaringi,
    the position is described as less responsible for ceremonies to secure increase
    of the totemic animal or plant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a totemic headman has no son or if the son is not old enough, succession
    passes to the son of a brother, provided that person belongs to the relevant totem.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the former headman's son later reaches maturity, the office may revert
    to him after the interim headman dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A young man expected to succeed his father as totemic headman is carefully
    instructed in totemic matters so that he may be worthy of the position.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men who form the inner councils are said to be chosen mainly, though not exclusively,
    from men trained and knowledgeable in tribal customs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says there are no set council meetings with regular speeches;
    instead, elder and important heads of local groups associate as an informal council
    whose orders are obeyed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Being headman of a local group alone gives no automatic claim to attendance
    at the inner council; a trusted and distinguished man may be invited and gradually
    recognized as a member.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The council of elder men determines matters concerning ceremonies and punishment
    for serious crimes, including bone giving, which the passage defines as causing
    death by evil magic.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If a person breaks strict marriage laws, older men may consult and arrange
    for an atninga or avenging party to punish the culprit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that fear of supposed penalties, public opinion, ridicule,
    and direct punishment deter breaches of tribal law.
  category: other
  evidence_refs:
  - ev:10
