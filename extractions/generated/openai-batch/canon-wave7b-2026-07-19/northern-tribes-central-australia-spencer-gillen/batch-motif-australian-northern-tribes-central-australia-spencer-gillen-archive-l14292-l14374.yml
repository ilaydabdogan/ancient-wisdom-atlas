canonical_text:
  quote: ''
  summary: A nighttime and dawn ceremony around a mound associated with the Mini-imburu
    and Wollunqua is described. Uluuru and Kingilli men sing, circle the mound, shout,
    clash boomerangs, and then attack the mound with weapons. Three recently initiated
    youths are instructed and later undergo subincision. The passage explains that
    the ceremony is understood as both pleasing and coercing Wollunqua, a mythic beast
    whose home is under a water-hole at Thapauerlu, and records later interpretations
    of thunder and clouds as signs from Wollunqua.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uluuru and Kingilli men came to the ceremonial ground, fires were lit, and
    the men sat around the mound singing; women were brought nearby but were not allowed
    to see the mound.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three recently initiated youths were brought under the charge of guardians,
    and the ceremony was carefully explained to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fires were lit around the ceremonial ground before dawn, and Uluuru men knelt
    in single file beside the mound, moving around it in unison and shouting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kingilli men stood around the mound, clanged boomerangs together, and the
    oldest Kingilli man walked backward at the head of the kneeling Uluuru procession.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At dawn, fires were lit again, the mound with its white mass of down was illuminated,
    and the Uluuru men attacked it with spears, boomerangs, clubs, and spear-throwers
    until it became a heap of sandy earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At sunrise, the ceremony of parra, or subincision, was performed upon the
    three youths who had earlier passed through stages of initiation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ceremony is said to be connected with persuading or almost forcing Wollunqua
    to stay quietly in his home under the water-hole at Thapauerlu and not harm people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mound is described as bearing a representation of Wollunqua; the passage
    says that he is gratified when he sees it and wriggles below with pleasure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The attack on the mound is explained as a way of driving Wollunqua down, while
    the ceremony as a whole is said to both please and coerce him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A tradition is reported in which Wollunqua came out, destroyed a number of
    men and women, and was compelled to go underground after being pelted with stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Old men who had made the mound said they heard Wollunqua talking and sending
    rain; later they identified thunder as his growling and a western bank of clouds
    as his warning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After interpreting the clouds as a warning, the old men cut down boughs and
    hid the ruins of the mound.
  category: action
  evidence_refs:
  - ev:7
