canonical_text:
  quote: "“the same object may never be used twice”"
  summary: 'The passage describes several northern Central Australian totemic ceremonies:
    a stone handover marking closure, wailing during a lizard-totem ceremony, finger-biting
    that releases Gnanji witnesses from a silence ban, destruction and non-reuse of
    a snake-totem head ornament, a Gnanji Putjatta snake ceremony on a cleared ground
    with an ant-hill, and analogous completion patterns among Binbinga, Anula, and
    Mara ceremonies referring to totemic ancestors in named ancestral periods.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed man squatted before the leading man, placed a stone in his hands,
    and retired to the rear; the action was repeated for every man, and no one went
    beyond the cleared space.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apart from handing over the stone, the passage says there was no very definite
    ending to these ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During one lizard-totem ceremony, two men moved to one side, sat on the ground,
    and wailed loudly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Older Umbaia men held out their hands for Gnanji visitors to bite their fingers,
    and the two strangers were released from a ban of silence imposed after they saw
    the ceremonies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a snake-totem performance, a stick made for the occasion and decorated
    with spots of down around a central sinuous line was used as a head decoration.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the men had performed, the head decoration was removed and broken by
    bending it across the back of a man who was not the wearer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stated reason for breaking the snake-totem decoration was to prevent it
    from ever being used again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the same ceremonial object is not used twice; it gives
    the example of a nurtunja sacred pole being taken to pieces and replaced by a
    new one for a following ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gnanji ceremonies are said to be performed on a specially cleared space similar
    to that of the Umbaia tribe.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The witnessed Gnanji ceremonial ground was a small cleared space in scrub,
    with an ant-hill at one end.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Gnanji were performing a sequence of ceremonies called yapuluru; the witnessed
    ceremony was connected with the snake totem Putjatta and with Liaritji, where
    the snake ancestor performed in Poaradju.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Four men with red ochre on their faces and white-edged red patches on chest
    and arms marched up and down the ground with high-knee action, holding tjintilli
    on their thighs, while the audience clanged boomerangs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The four Gnanji performers knelt in front of the audience, rose, and joined
    them; a final performer decorated with down came from behind the ant-hill with
    tjintilli, pranced on the cleared space, and the ceremony ended when a member
    of the audience struck a long wand on the ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says that each tribe has a characteristic way of terminating ceremonies
    that are otherwise fundamentally similar to one another.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: For Binbinga, Anula, and Mara ceremonies, decorated performers go out from
    the ceremonial ground, hide behind bushes, run to spectators beating boomerangs,
    and sit on the ground before them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: 'The Binbinga, Anula, and Mara ceremonies are said to refer to totemic ancestors
    who lived in named ancestral periods: Intjitja, Mungaii, and Raraku respectively.'
  category: relationship
  evidence_refs:
