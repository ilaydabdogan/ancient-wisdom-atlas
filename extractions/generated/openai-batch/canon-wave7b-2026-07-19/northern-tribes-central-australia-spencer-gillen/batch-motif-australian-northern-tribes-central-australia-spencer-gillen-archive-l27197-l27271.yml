canonical_text:
  quote: ''
  summary: The passage describes the Kaitish practice of knocking out teeth as an
    optional ceremony performed by older kin or other adults. It gives observed examples
    involving a girl and two men, including the extraction technique, gender and kinship
    witness restrictions, dancing, and throwing the removed tooth toward the mother's
    Alcheringa camp. It also reports a tradition that Alcheringa people said teeth
    should be knocked out because water tasted better with a tooth out and sand otherwise
    collected around the gums.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Kaitish, knocking out a tooth is described as optional, without
    a fixed special group required for the operation, and may be performed at ages
    between about ten and thirty.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the present-day stated reason for the Kaitish practice is
    to improve personal appearance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the observed case of a girl, her mother's tribal sister performed the operation,
    accompanied by the patient, one or two other women, and children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rite is described as not secret, except that it is not etiquette for men
    to witness women's operations or women to witness men's operations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl's group moved a little away from the main camp into a creek bed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A small hole was made in the sand, the patient lay with her head in it, her
    gums were pushed back, a short stick was placed on the right upper incisor, and
    a stone was used to strike the stick until the tooth was knocked out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the extraction, the girl was lifted up and danced with the operator,
    who held her elbows behind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After being told what to do by the older woman, the girl threw the tooth as
    far as she could toward her mother's Alcheringa camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The removed tooth was left where it fell, and the passage states that no attempt
    was made to prevent another person from obtaining it for evil magic.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the observed cases of two Kaitish men, an old Thungalla man operated, and
    the operation was conducted in the same way as for the girl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two male patients were ipmunna to each other and were not allowed to witness
    each other's operation; one retired behind a bush while the other was operated
    on.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: After both male operations, each man threw his own tooth toward his mother's
    Alcheringa camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Kaitish tradition reported in the passage says that Alcheringa people stated
    teeth should be knocked out because water tasted better with one tooth out, and
    that without a tooth out sand collected around the gums.
  category: speech
  evidence_refs:
  - ev:8
