canonical_text:
  quote: ''
  summary: The passage describes Warramunga and northern Central Australian social
    organization in comparison with the Arunta, emphasizing single totemic headmen,
    moiety distinctions, respected elders, and small councils of leading men. It also
    reports traditions in which special individuals or alcheringa ancestors introduce
    changes, including the stone knife in initiation and the present marriage system.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts Arunta groups, which may have several alatunjas connected
    with one totem, with northern tribes in which each totemic group is said usually
    to have one great ancestor and one corresponding headman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headmen of two series of totemic groups are associated with different
    moieties, producing a sharp moiety distinction in the Warramunga and northern
    tribes described.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The old Thakomara man is identified as head of the white cockatoo totem and
    chief man in the Kingilli moiety, while the Kabbidji man is identified as head
    of the Wollunqua and chief man in the other moiety.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In matters of fighting, the counsel of old Tjupilla, head of the wind totem,
    is said to carry the greatest weight because of his personal character.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Meetings and consultations of leading men are presented as a means by which
    changes in customs can be introduced.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: Traditions are reported in which special men or women first introduced the
    stone knife for initiation in place of the fire-stick, which had caused the deaths
    of many young men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The present marriage system is said to be ascribed by every tribe to special
    eminent alcheringa ancestors, and some accounts describe one ancestor proposing
    a change with support from another individual.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Councils of elder men are described as small, subdued, grave, and lacking
    loud public haranguing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tribes are described as divided into local groups occupying defined areas,
    with the local totemic group as the unit rather than individual ownership of land.
  category: setting
  evidence_refs:
  - ev:8
