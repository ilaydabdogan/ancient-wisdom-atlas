canonical_text:
  quote: ''
  summary: The passage recounts traditions about a Thakomara wise man who initiates
    young men, burns children to strengthen them, teaches proper marriage rules, and
    circumcises boys; it then gives Wingara origin accounts in which black-snake,
    Thapungarti, Thapanunga, Tjupila, Thakomara, Munga-munga, and Napanunga figures
    arise through underground emergence, ceremonial activity, bodily crystal generation,
    transformation into white cockatoo men, and marriage presentation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Thakomara man of the Warramunga tribe, described as a purntuku or wise old
    man, came from the west, camped at Akurkarinia, belonged to the Waripali lizard
    totem, brought young men from several tribes, and initiated them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thakomara man is said to have burned children in the fire in order to
    make them grow strong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Thakomara man taught men how to marry “straight” by demonstrating a sequence
    of giving daughters to men of specified social categories.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Kalunja, the Thakomara man circumcised many boys; some of these boys heard
    wind from Illpintirnia, hid, then came out and cut it in two.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Thapungarti man arose in Warramunga country, was a black snake, and is identified
    as the origin of all men of the black-snake totem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Thapungarti man made a Thapanunga man, taught him ceremonies, and both
    initially lived in the ground before coming to the surface.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first Thapungarti man died and went back into the ground, while the Thapanunga
    man performed ceremonies and produced Thapungarti men from his body as very small
    crystals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Successive Thapungarti and Thapanunga generations are described as producing
    children from their bodies in the form of small crystals called muntulqua or muntalqua
    while performing ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Wintjintjinpunungu and Au-uragari made Kupertiringu and his younger brother
    Pulmurukari; after Wintjintjinpunungu and Au-uragari died, one was buried in the
    ground and the other was placed on a tree-platform.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After a sequence of male generations, an eighth generation gave rise to both
    men and women; the women, called Munga-munga, were given by their brothers as
    wives to Tjupila men and later travelled to Worgaia country, forming yam-totem
    local centres.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Two Thakomara men of the Lalkira little-grub totem arose at Burumburu, a water-hole
    on Phillip Creek, and changed into white cockatoo men; a stone column on Phillip
    Creek is said to represent their cast skins.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The transformed Lalkira men performed sacred ceremonies and gave rise to Tjupila
    men, who in turn performed ceremonies and gave rise to Thakomara men; this continued
    until ten generations had been produced.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The tenth generation in the Tjupila origin tradition came up from underground
    to the surface and was presented with Napanunga women connected with the Munga-munga
    women.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note reports that the old Thapungarti man used to sing all day, and that
    a curious whistling sound in a person’s ears is attributed to his singing.
  category: attribute
  evidence_refs:
  - ev:11
