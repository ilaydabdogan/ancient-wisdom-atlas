canonical_text:
  quote: ''
  summary: 'The passage describes Gnanji, Binbinga, and neighboring coastal-tribe
    funerary customs: treatment and curation of bones and hair, mourning restrictions,
    beliefs about the male spirit and future reincarnation after rain cleanses bones,
    and Binbinga and coastal practices of funerary flesh-eating and later bone burial.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Gnanji, dried bones are placed in a pitchi and left in a tree until
    whitened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gnanji fibula bones are red-ochred, wrapped with fur-string, retained for
    magic purposes, and called pirritthi pointing-bones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father wraps collar- and arm-bones in human hair-string and sends the
    deceased man’s sons with them to summon distant groups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After ceremonies, bones are placed under the custody of a mother’s brother’s
    son, whose duty is to avenge the death, and are later returned to the father for
    burial near a water-hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The buried bones are said to be efficient in causing lilies to grow in water-holes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Among the Gnanji, a dead man is called kurti and his spirit moidna; the passage
    states a belief that women have no spirit after death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The spirit of a dead man is said to walk about visiting his ancestral camping-ground
    and to undergo reincarnation after rains have washed and cleansed the bones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: One son cuts off the deceased man’s whiskers, later makes them into a cigar-shaped
    tana after the next rains, shows it to the dead man’s mother, and receives food
    from her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The tana is used for magic purposes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Mothers and wives of the dead man cut their scalps with yam-sticks, sear the
    wounds with red-hot fire-sticks, and remain silent until final burial ceremonies
    are completed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage says the Binbinga, Anula, Mara, Allaua, Willingara, and Karrawa
    practise eating the flesh of the dead; after ceremonies, the bones are buried
    in a log.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the Binbinga tribe, the dead man’s purnka receives his possessions, cuts
    off and keeps his hair, wraps the hair in bark as a parcel called ni-irra, and
    this parcel is later carried by a sacred messenger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Binbinga tribe, the body is cut up by men from the opposite side of
    the tribe, cooked in a heated-stone earth oven, and eaten by those men; women
    are not allowed to taste human flesh or approach the place of the rite.
  category: action
  evidence_refs:
  - ev:6
