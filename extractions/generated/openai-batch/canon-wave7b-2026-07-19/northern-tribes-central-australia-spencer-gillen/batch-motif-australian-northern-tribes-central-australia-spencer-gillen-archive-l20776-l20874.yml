canonical_text:
  quote: ''
  summary: The passage recounts an Alcheringa tradition in which Illinja, a Thungalla/opossum
    man, and Murunda, an Umbitjana/grass-seed man, emerge near Akalperra, receive
    names and totemic identities, grow in heat, encounter the bell bird's runaway
    Churinga, recover stolen Churinga after killing Amurlinjalunga, perform sacred
    ceremonies, conceal Churinga, kill a suspected thief, and descend with Churinga
    to make an oknanikilla of the opossum and grass-seed totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Alcheringa, two beings came out of a small hole in the ground near
    the rock-hole Akalperra, west of Barrow Creek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder being was a Thungalla; he looked at his shadow, called himself Illinja,
    and was identified as an opossum because of fur-like down and prominent eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other being was an Umbitjana; the Thungalla called him his child, and
    he was named Murunda and identified as a grass-seed man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The two beings were initially small, watched by the hole, then went into a
    tree at sunrise, warmed themselves, and gradually grew into men with whiskers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bell bird Akapailapaila swung his Churinga at Kalladampunga; the Churinga
    broke loose from its string, passed near Illinja and Murunda, and flew to the
    sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The bell bird tracked the Churinga by bits of down, failed to recover it,
    returned to camp, and singed his breast while putting out a fire on his shield.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Illinja and Murunda tried to pull the bell bird's Churinga from mud by the
    sea-shore, but the string broke and they fell backward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When Illinja and Murunda returned to camp, some of their own Churinga were
    missing; they found tracks of a lubra named Amurlinjalunga and followed them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Amurlinjalunga, a grass-seed totem woman, was grinding grass seed; after she
    offered cake, Illinja killed her with a Churinga, which broke into two.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Illinja and Murunda found the stolen Churinga hidden in a pitchi in Amurlinjalunga's
    camp and returned to Akalperra.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: At Akalperra the two men made sacred ceremonies, decorated themselves, danced,
    shouted, painted, collected grass-seed down, wore Churinga on their heads, and
    concealed the Churinga in the hole.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: An old lame Thungalla opossum man arrived nearby; Illinja and Murunda suspected
    he had come to steal their Churinga, and Illinja killed him with a Churinga after
    giving him down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Murunda buried the killed man's head and body; afterward a Thungalla man and
    the Umbitjana man went down, and Churinga were taken with them, making an oknanikilla
    of the opossum and grass-seed totems.
  category: sequence
  evidence_refs:
  - ev:5
