canonical_text:
  quote: ''
  summary: The passage compares tooth-removal customs in coastal and central tribes,
    discusses circumcision and subincision as major initiation rites whose meaning
    is said to be unknown to the people and the authors, reports an ancestral precedent
    for the operations, and describes beliefs that children result from ancestral
    spirit individuals entering women, sometimes from stones or trees and through
    the navel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among eastern and south-eastern coastal tribes, initiation was associated
    with knocking out one or more upper incisor teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Central tribes also performed tooth knocking, but the passage says it was
    not an initiation rite there and was not restricted to men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The authors state that tooth knocking may have been an older initiation form
    common to ancestors of central, eastern, and south-eastern tribes, later losing
    sacred significance among central tribes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Circumcision and subincision are described as the two important initiation
    rites performed when a youth reaches puberty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that no man in these tribes is allowed to have a wife until
    he has undergone subincision and circumcision, and that women look with contempt
    on those who have not.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors reject the explanation that circumcision and subincision serve
    to limit tribal population, noting infanticide as an available practice when a
    child is not wanted.
  category: other
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The passage says the people themselves do not know the meaning of circumcision
    and subincision, except that an Alcheringa ancestor first performed one or both
    operations, usually first on himself and later on others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people are described as believing that a child results from an ancestral
    spirit individual entering the mother rather than from sexual intercourse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Arunta country, certain stones are said to be charged with spirit children
    who can enter women by magic or of their own accord.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Warramunga tribe, women avoid striking certain tree trunks with an
    axe because the blow might cause spirit children to emanate from them and enter
    their bodies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The spirit child is described as minute, about the size of a small grain of
    sand, entering a woman through the navel and growing into a child.
  category: attribute
  evidence_refs:
  - ev:8
