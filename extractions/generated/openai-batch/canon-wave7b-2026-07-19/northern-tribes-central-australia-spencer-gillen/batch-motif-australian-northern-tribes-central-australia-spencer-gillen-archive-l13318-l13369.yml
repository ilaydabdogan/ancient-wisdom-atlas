canonical_text:
  quote: ''
  summary: The passage describes distinguishing features of terminal scenes in sacred
    ceremonies, captions for wild-cat and lizard totem ceremonies, and a Warramunga
    account of the Thaballa or laughing boy totem. It says the Thaballa and Kati totems
    are unusual but treated as equivalent to animal or plant totems, with mungai spots
    where ancestors left spirit children. The current Thaballa group is represented
    by one old man. The Thaballa ancestor emerged from a rock at Yappakulinia, laughed
    and played with bark, then encountered more laughing boys coming from the sunset
    direction and asked whether they were Thaballa.
  language: English
  quote_policy: summarized
