canonical_text:
  quote: ''
  summary: A man encounters two puntidirs or spirit men, refuses their invitation,
    and is later killed by their pointing-bones while he sleeps beside a fire. The
    spirit men cut open his body, replace his insides, and put a little snake inside
    him, which gives him the powers of a medicine man. His companions find that he
    has died, but before they carry the body away he returns to life, and they understand
    that he has been made into a medicine man. The passage also states that many Warramunga
    medicine men are made by old Worgaia men and wear a kupitja through the nose as
    an emblem associated with their powers.
  language: English
  quote_policy: summarized
