canonical_text:
  quote: ''
  summary: The passage records several traditions about groups of Ertwaininga and
    other women travelling through named regions, leaving women at places that become
    oknanikillas, meeting named totemic men, and in one account encountering Kurdaitchas
    who kill a wild-dog man and his wife. A final account describes two Parenthie
    lizard brothers who operate on men transformed by an old crow and require the
    men to keep the operations secret from women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of Kumara women of the Namungi-yera little-bird totem travelled across
    Unmatjera country toward Central Mount Stuart from the west and were said to have
    come from beyond the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the Kumara women travelled, they left women behind at various places, thereby
    forming oknanikillas; one woman was left with Unkurta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travelling women were frightened of inter-intera, described as half-formed
    human beings, and went down into the ground to travel out of their sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ertwaininga women carried yam-sticks instead of Churinga.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second company of women, some of the Erlia emu totem and others of the Impi-impi
    bird totem, travelled from Erlakerra and left women with emu men and along a creek
    near Central Mount Stuart, resulting in three nearby oknanikillas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Appungarti and Bukhara women of the Iralla beetle totem left Harts Range,
    left a woman named Unjanjuka in their old camp, travelled north-west, and found
    two Umbitjana women of the Urakulpa plum-tree totem at Ilko-ordna.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: One Umbitjana woman of the plum-tree totem gave birth while travelling in
    wild-dog country, intended to kill the child, but a wild-dog man threatened her
    and she left the child with him; he kept the child as his wife when she grew up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two Kurdaitchas attacked the woman while the wild-dog man was searching in
    a hole; later the man cooked a rat at a fire, and the woman ate a little but did
    not tell him about the attackers because she was afraid.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At night the Kurdaitchas came to the camp, one seized the wild-dog man and
    twisted his neck, and the other killed the woman with a yam-stick; a big stone
    arose to mark the spot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two Parenthie lizards, described as elder and younger brothers, came from
    the south into Unmatjera country and found men and women whom the old crow had
    transformed from Inmintera creatures.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Parenthie brothers circumcised and subincised the men, told them not to
    tell the women because the matter was Churinga, and the men promised secrecy.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the operations, the men looked at themselves and said that they were
    like the Parenthies.
  category: speech
  evidence_refs:
  - ev:9
