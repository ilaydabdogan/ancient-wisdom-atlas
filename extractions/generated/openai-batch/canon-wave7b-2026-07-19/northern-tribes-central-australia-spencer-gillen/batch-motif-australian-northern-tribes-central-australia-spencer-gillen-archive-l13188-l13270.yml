canonical_text:
  quote: ''
  summary: The passage describes Warramunga totem ceremonies associated especially
    with the Itjilpi ant totem. It explains decorations using a paper-bark helmet,
    red down, white bands, stones, pitchis, trees, and fires. In a sunrise ceremony
    two men represent women collecting ants; the women meet, embrace, dance around
    spectators who stand for trees, dispute Naralu and Nungalla identity, fight, die,
    go into the ground, and leave spirit children at named places. An interleaved
    figure caption also identifies Pau-wa as a mythic mischievous beast represented
    by a decorated central figure with pointing-sticks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tradition says the Naralu-subclass figures caught and ate Itjilpi ants when
    not performing ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same tradition says they made bough shades from Barkala trees, now represented
    by heaps of stones at performance spots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: As a general rule, one man was decorated and wore a helmet made from a flattened
    cylinder of paper bark.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The decorated body, face, and helmet could be covered with red down and a
    few white bands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The red down represented ants, ants mixed in a pitchi for eating, or stones
    and trees marking places where women camped and performed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a sunrise ceremony, two men represented two women who were separately in
    the scrub collecting insects.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The performers emerged from behind two bushes, approached the watching men,
    stooped to turn over the ground, and filled pitchis with small stones representing
    masses of ants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The represented women discovered one another, embraced, then advanced toward
    and ran around the spectators.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The men in the audience were understood to represent trees around which the
    women danced in sacred ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Naralu woman and Nungalla woman disagreed over whether both were Naralu
    or one was Nungalla.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Because they could not settle the point amicably, the women fought, both died,
    went down into the ground, and left spirit children at named spots connected with
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A figure caption says the central figure represents Pau-wa, a mythic mischievous
    beast, and that sticks through the helmet are its lumuru or pointing-sticks.
  category: object
  evidence_refs:
  - ev:3
