canonical_text:
  quote: ''
  summary: The passage describes Worgaia yam-totem Intichiuma actions involving a
    Churinga, singing yams, scattering bitten yam pieces, food restrictions, and reciprocal
    expectations between moieties. It then describes Warramunga Thalaniminta ceremonies
    as long series representing ancestral totemic histories, tracking ancestors' paths
    and requiring reciprocal organization between the Uluuru and Kingilli moieties.
    The passage lists witnessed totemic ceremonies, including several snake totems
    and other animal, plant, elemental, and insect totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Worgaia tribe, the head of a large menadji, or yam, totem is described
    as a Kumara man who performs yam-totem ceremonies and is decorated by men of the
    other moiety.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before performing the yam-totem ceremonies, the Kumara man takes a Churinga,
    wraps it in bark, and leaves it on the ground where yams grow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men of the other moiety ask the Kumara man to walk in the bush and sing the
    yams so that they will grow; he carries the Churinga under his armpit daily for
    about two weeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the plants are growing well, the other-moiety men gather yams and bring
    a small amount to the Kumara man, asking him to make them grow large and sweet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kumara man bites a small yam and throws the pieces in all directions;
    the passage says this action is supposed to produce the desired growth effect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the yam action, the Kumara man eats no more of his totem, his children
    may not touch it, and an old Kumara man also avoids his father's totem, with an
    exception for very old men who are given yams by the other moiety.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Kumara man tells the other moiety that he has made plenty of yams for
    them to eat and asks them to make plenty of sugar-bags for him to eat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the Warramunga tribe, the Intichiuma ceremonies are called Thalaniminta
    and largely consist of complete series representing the Alcheringa history of
    a totemic ancestor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Each Warramunga totemic group is said usually to have one great ancestor who
    arose at a special spot, crossed the country, made natural features, and left
    spirit individuals behind who have since been reincarnated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Warramunga Intichiuma ceremony is described as tracking ancestral paths
    and repeating ceremonies at mungai spots, places where the ancestor left spirit
    children behind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Warramunga totems are divided between the Uluuru and Kingilli moieties, and
    members perform their own ceremonies only when asked by a member of the other
    moiety.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: For Warramunga ceremonies, the opposite moiety supplies materials such as
    blood, down, and decorations, prepares the decorated performers, and later receives
    presents from the performing moiety.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage lists witnessed Uluuru totems including Wollunqua, a great mythic
    snake, several other snake totems, emu, echidna, white ant eggs, and another snake;
    it lists Kingilli totems including wind, ant, lizard, laughing boy, little bird,
    white cockatoo, jabiru, native cat, and fire.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The witnessed Warramunga ceremonies extended from July 26 to September 18,
    and the observers had seen more than eighty different totemic ceremonies before
    leaving.
  category: attribute
  evidence_refs:
  - ev:8
