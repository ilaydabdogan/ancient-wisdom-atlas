literal_observations:
- id: obs:1
  text: The passage introduces a chapter on physical features, with topics including
    children, changes in women's and men's appearance, hair, cicatrices, measurements,
    and related bodily features.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors state that Australian Aboriginal groups show general uniformity
    in physical type while varying in details such as height and men's facial hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A newborn child is described as red or copper-coloured at birth, darkening
    over several days to the adult chocolate colour by the end of the first week.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that in some southern groups, especially the Arunta, women
    are slightly lighter in colour than men, while this is not noticeable in the northern
    groups discussed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For some time after birth, a child is customarily carried in a pitchi or in
    a slab of bark cut from a gum-tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a few months, the child is usually carried straddling the mother's left
    hip, leaving her right hand free for her digging-stick while she may carry a pitchi
    with water or food on her head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In good seasons children are described as healthy and plump, playing in camp
    or bush, with young children noted for a protuberant stomach.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Girls begin using small digging-sticks as soon as they can run about, imitating
    their mothers and accompanying them in the bush to search for vegetable food and
    small animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: All children are said to begin learning tracking early, recognizing playmates'
    footprints and animal tracks, gaining knowledge used to obtain food and guard
    against enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that women's personal appearance changes markedly with
    age, and that a girl shown wearing head-bands has just been handed over to her
    allotted husband.
  category: sequence
  evidence_refs:
  - ev:7
