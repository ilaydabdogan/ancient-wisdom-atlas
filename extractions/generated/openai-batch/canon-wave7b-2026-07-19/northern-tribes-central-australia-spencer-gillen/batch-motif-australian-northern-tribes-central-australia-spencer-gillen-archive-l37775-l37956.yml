- id: obs:4
  text: A common burrowing frog found in slightly damp river sand gives its name to
    an important totemic group in the Arunta tribe and is eaten.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fish section lists barramunda, groper, freshwater fish, salt-water mullet,
    sharks, and stingray with tribal associations, and marks these fish entries as
    eaten.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The insect section distinguishes insects or insect-related foods that are
    eaten from those not eaten; examples include bee not eaten while its honey is
    eaten, larvae or grubs eaten, and several flies or mosquitoes not eaten.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mollusc section states that Pindi-pindi, a pearl oyster in the Anula tribe,
    gives its name to a totemic group, is eaten, and has a shell used for ornaments;
