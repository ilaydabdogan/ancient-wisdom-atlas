- id: obs:3
  text: The turtle section states that freshwater turtles occur in water-holes along
    creeks running into the Gulf of Carpentaria, and that the authors know of a freshwater
    turtle totemic group in the Mara tribe; two salt-water turtles in the Mara tribe
    also give names to totem groups and are eaten.
  category: relationship
  evidence_refs:
